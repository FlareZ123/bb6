name: Agent 1 #303 original Cryptids predecessor gate (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned upstream Lean 4.35.0-rc4
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone exact original Cryptids commit
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet c86f15861709b76042998c5211c7b2f83991621b
          test "$(git rev-parse HEAD)" = c86f15861709b76042998c5211c7b2f83991621b
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
      - name: Compile unmodified original machine and theorem
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          lake exe cache get
          lake build BusyBeaver.BB6.Accelerations.M_1RB0LE_0RC0RA_1RD1RB_0LA0RB_1LFHHH_1LD1LF
          base64 -d "$GITHUB_WORKSPACE/im-results/agent1-303-source-gate/BB303SourceGate.lean.xz.b64" | xz -dc > BB303SourceGate.lean
          echo "9e1c1bae8a4800d05e736eb28918409f9e3d39877290baa1c916b51787738a58  BB303SourceGate.lean" | sha256sum -c -
          lake env lean BB303SourceGate.lean
