name: Agent 1 #429 673 genuine-root inverse cylinders (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile authentic #429 accelerator and inverse certificate
        shell: bash
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent6-harmonic429:im-results/agent39-429-1021:im-results/agent30-429-even16:im-results/agent1-429-262144-sieve
        run: |
          set -euo pipefail
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-harmonic429/BB429Mod8.olean im-results/agent6-harmonic429/BB429Mod8.lean
          lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent39-429-1021/BB429RootEven8.olean im-results/agent39-429-1021/BB429RootEven8.lean
          lean -DmaxHeartbeats=5000000 -o im-results/agent6-harmonic429/BB429NoThree.olean im-results/agent6-harmonic429/BB429NoThree.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent30-429-even16/BB429Even16.olean im-results/agent30-429-even16/BB429Even16.lean
          lean -DmaxHeartbeats=50000000 -DmaxRecDepth=30000 -o im-results/agent6-harmonic429/BB429NewResidue.olean im-results/agent6-harmonic429/BB429NewResidue.lean
          lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent39-429-1021/BB429RootMod16.olean im-results/agent39-429-1021/BB429RootMod16.lean
          lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent39-429-1021/BB429RootMod32.olean im-results/agent39-429-1021/BB429RootMod32.lean
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=30000 -o im-results/agent30-429-even16/BB429InverseKernel16.olean im-results/agent30-429-even16/BB429InverseKernel16.lean
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent1-429-262144-sieve/BB429SplitSieve.olean im-results/agent1-429-262144-sieve/BB429SplitSieve.lean | tee /tmp/agent1-429-sieve-check.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent1-429-262144-sieve/BB429Distinct.olean im-results/agent1-429-262144-sieve/BB429Distinct.lean | tee /tmp/agent1-429-distinct-check.log
          if grep -q sorryAx /tmp/agent1-429-sieve-check.log; then
            echo "ERROR: unproved axiom in sieve"
            exit 1
          fi
          if grep -q sorryAx /tmp/agent1-429-distinct-check.log; then
            echo "ERROR: unproved axiom in exact count"
            exit 1
          fi
          for module in BB429SurvivorBase BB429SurvivorCount0 BB429SurvivorCount1 BB429SurvivorCount2 BB429SurvivorCount3 BB429SurvivorMask BB429SurvivorDistinct; do
            echo "::group::Source-kernel survivor mask $module"
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o "im-results/agent1-429-262144-sieve/$module.olean" "im-results/agent1-429-262144-sieve/$module.lean" 2>&1 | tee "/tmp/agent1-$module.log"
            if grep -q sorryAx "/tmp/agent1-$module.log"; then echo "ERROR: sorryAx in $module"; exit 1; fi
            echo "::endgroup::"
          done
