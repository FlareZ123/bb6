name: Agent 1 BB429 inverse-tower source proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-accelerator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check actual repository BB429 source and unbounded tower
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent1-429-inverse-tower
        run: |
          set -euo pipefail
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -DmaxRecDepth=9000 -DmaxHeartbeats=6000000 im-results/agent1-429-inverse-tower/BB429InverseTower.lean
