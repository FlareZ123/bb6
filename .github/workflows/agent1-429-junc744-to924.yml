name: "Agent 1: #429 Junc(0,744) to Junc(0,924) original-source Lean audit"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LEAN_VERSION: 4.36.0-rc2
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lean object cache
        id: lean-cache
        uses: actions/cache/restore@v4
        with:
          path: im-results/**/*.olean
          key: lean-4.36.0-rc2-${{ hashFiles('im-results/**/*.lean', '!im-results/agent1-429-root-entry/Junc11Return32.lean', '!im-results/agent1-429-root-entry/Junc744To924.lean', '!im-results/agent1-429-root-entry/Junc744To924AxiomAudit.lean') }}
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check complete original source graph and low4k2 physical theorem
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider:im-results/agent1-429-physical-frontier:im-results/agent32-429-raw-parent:im-results/agent32-429-primitive-cost:im-results/agent18-429-lastwriter:im-results/agent18-429-junc-canonical:im-results/agent1-429-j-first-branch:im-results/agent6-429-one-sided-excursion:im-results/agent32-429-high2-prefix:im-results/agent1-429-w4-boundary:im-results/agent33-429-writer-locality:im-results/agent4-429-ordinary-frontier:im-results/agent1-429-w2-census:im-results/agent6-429-low2:im-results/agent18-429-low-j:im-results/agent6-429-low42:im-results/agent1-429-root-entry:im-results/agent48-429-safe:im-results/agent30-429-positive-safe:im-results/agent6-429-low40:im-results/agent32-429-loweven-r32:im-results/agent32-429-low43:im-results/agent32-429-loweven-4k:im-results/agent32-429-low5"
          LOG=/tmp/agent1-junc744-to924.log
          : > "$LOG"
          compile() {
            if [ -f "$1.olean" ]; then
              echo "LEAN cached $1" >> "$LOG"
              return
            fi
            echo "LEAN $1"
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o "$1.olean" "$1.lean" >> "$LOG" 2>&1 || {
              tail -160 "$LOG"
              exit 1
            }
          }
          compile_force() {
            rm -f "$1.olean"
            compile "$1"
          }
          compile im-results/agent8-coverage-contract/Frontier
          compile im-results/agent32-429-primitive-cost/BubbleExact
          compile im-results/agent32-429-primitive-cost/BubblePrefix
          for m in RayClosed RayChecker RayEntry RayFinite RayTurnExample RayFiniteOracle FiniteHalting; do
            compile "im-results/agent8-coverage-contract/$m"
          done
          compile im-results/agent8-coverage-contract/Symmetry
          compile im-results/agent8-coverage-contract/RootShift
          for m in RayMacro EntryMacroOracle EntryMacroLeft; do
            compile "im-results/agent6-fresh-glider/$m"
          done
          compile im-results/agent44-drift-closure/DirectedDrift
          for m in ZeroMaskOracle FiniteDecision; do
            compile "im-results/agent8-coverage-contract/$m"
          done
          for m in FrontierAudit FrontierMass; do
            compile "im-results/agent4-coverage-smoke/$m"
          done
          for m in ZeroPathAudit ControlPathAudit ZeroRowAudit PhysicalTraceAudit FiniteLassoOracle LassoTraceAudit; do
            compile "im-results/agent32-zero-prefix-global/$m"
          done
          compile im-results/agent1-429-physical-frontier/BB429PhysicalFrontier
          compile im-results/agent32-429-low43/PhysicalNoFatalConverse
          for m in BB429OddExcursion BB429SourceE1Return BB429SourceE1Delta BB429SourceRows BB429PhysicalBridge; do
            compile "im-results/agent6-429-one-sided-excursion/$m"
          done
          for m in BB429E1ShiftDelta BB429DeltaPhysicalBridge; do
            compile "im-results/agent32-429-raw-parent/$m"
          done
          compile im-results/agent6-429-one-sided-excursion/BB429FinishScanEDelta
          compile im-results/agent6-429-one-sided-excursion/BB429JuncHeadExcursion
          compile im-results/agent32-429-high2-prefix/High2Prefix
          compile im-results/agent32-429-high2-prefix/High2Tail
          compile im-results/agent32-429-high2-prefix/High2TailBase
          compile im-results/agent1-429-w4-boundary/W4CZeroSafe
          compile im-results/agent1-429-w4-boundary/W4CZeroCount
          compile im-results/agent1-429-w4-boundary/W4CZeroOrdinary
          compile im-results/agent30-429-positive-safe/PositiveSafe
          compile im-results/agent30-429-positive-safe/ZeroRegularSafe
          compile im-results/agent30-429-positive-safe/ZeroTwoGate
          compile im-results/agent30-429-positive-safe/PhysicalSafe
          compile im-results/agent30-429-positive-safe/PositiveZeroGate
          compile im-results/agent30-429-positive-safe/OuterSafe
          compile im-results/agent18-429-low-j/Low3Delta
          compile im-results/agent32-429-primitive-cost/JPhysicalPrefix
          compile im-results/agent32-429-primitive-cost/JF0Prefix
          compile im-results/agent1-429-j-first-branch/JFirstBranch
          compile im-results/agent32-429-high2-prefix/High2PhysicalBridge
          compile im-results/agent32-429-high2-prefix/High2Return
          compile im-results/agent32-429-high2-prefix/MidAposBoundary
          compile im-results/agent18-429-junc-canonical/JuncCanonical
          compile im-results/agent6-429-low42/Low42Delta
          compile im-results/agent6-429-low42/Low42Physical
          compile im-results/agent32-429-low43/Low42PhysicalNoFatal
          compile im-results/agent1-429-root-entry/Low42RootNoFatal
          compile im-results/agent1-429-root-entry/RootOuterLow42NoFatal
          compile im-results/agent48-429-safe/NoFatalGuard
          compile im-results/agent32-429-low43/NoFatalRunConverse
          compile im-results/agent32-429-low43/Low42NoFatal
          compile im-results/agent48-429-safe/RootNoFatalPrefix
          compile im-results/agent48-429-safe/RootNoFatalPhysical
          compile im-results/agent48-429-safe/RootNoFatalChain
          compile im-results/agent1-429-w4-boundary/W4HeadMax
          compile im-results/agent1-429-w4-boundary/W4JuncMax
          python -c 'from pathlib import Path; import base64,hashlib,lzma; p=Path("im-results/agent6-429-low42"); b=lzma.decompress(base64.b64decode((p/"Low42Max.lean.xz.b64").read_text().strip())); assert hashlib.sha256(b).hexdigest()=="9858955ef0ad8ce9b3f2769adebd1943c6081e99bd7d77a436a6c215bea13ed5"; (p/"Low42Max.lean").write_bytes(b)'
          compile im-results/agent6-429-low42/Low42Max
          compile im-results/agent1-429-w4-boundary/W4HeadPrefix
          compile im-results/agent4-429-ordinary-frontier/ZeroRegularHeadMax
          compile im-results/agent4-429-ordinary-frontier/PositiveRegularHeadMax
          compile im-results/agent4-429-ordinary-frontier/PhysicalRegularHeadMax
          compile im-results/agent1-429-root-entry/RootJunc136To45
          compile im-results/agent32-429-loweven-r32/LowEvenR32NoFatal
          compile im-results/agent32-429-loweven-r32/LowEvenR32RootChain
          compile im-results/agent32-429-loweven-r32/LowEvenR32RootExtension
          compile im-results/agent6-429-low42/Low42PrefixPhysical
          compile im-results/agent32-429-low43/Low43Delta
          compile im-results/agent32-429-low43/Low43Continuation
          compile im-results/agent32-429-low43/Low43Physical
          compile im-results/agent1-429-root-entry/Low43ParityShift
          compile im-results/agent32-429-low43/ParityShiftedReturns
          compile im-results/agent32-429-low43/Low43PhysicalNoFatal
          compile im-results/agent32-429-low43/Low43RootPhysical
          compile im-results/agent32-429-low43/Low43RootNext
          compile im-results/agent32-429-low43/Low43BlankRootExtension
          compile im-results/agent32-429-low43/ParityShiftedRootComplete
          compile im-results/agent32-429-low43/Low43C0_1_189
          compile im-results/agent32-429-low43/Low42PhysicalNoFatalAnyHead
          compile im-results/agent32-429-low43/Junc0ReturnMap28
          compile im-results/agent32-429-low43/Junc0ReturnMap28RootChain
          echo "LEAN target-start LowEven4kDelta"
          compile im-results/agent32-429-loweven-4k/LowEven4kDelta
          echo "LEAN target-finished LowEven4kDelta"
          compile im-results/agent32-429-primitive-cost/HeadDisplacement
          compile im-results/agent32-429-primitive-cost/BubblePrefixHeadBound
          compile im-results/agent32-429-low5/Low5Delta
          compile im-results/agent32-429-low5/LowOddCore
          compile im-results/agent32-429-low5/LowOddSource
          compile im-results/agent32-429-low5/LowOddPhysical
          compile_force im-results/agent1-429-root-entry/Junc11Return32
          compile_force im-results/agent1-429-root-entry/Junc744To924
          python -c 'from pathlib import Path; import base64,hashlib,lzma,tarfile,io; p=Path("im-results/agent6-429-low40"); b=lzma.decompress(base64.b64decode((p/"Low40Source.tar.xz.b64").read_text().strip())); assert hashlib.sha256(b).hexdigest()=="1029b21dd6a396f97e75d8a7fb9e42bae81777e45b74e0084ee63049e12e8272"; tf=tarfile.open(fileobj=io.BytesIO(b),mode="r:"); [(p/m.name).write_bytes(tf.extractfile(m).read()) for m in tf.getmembers()]'
          compile im-results/agent6-429-low40/Low40Core
          compile im-results/agent6-429-low40/Low40Source
          compile im-results/agent6-429-low40/Low40Physical
          echo "LEAN focused axiom audit"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 im-results/agent1-429-root-entry/Junc744To924AxiomAudit.lean >> "$LOG" 2>&1 || {
            tail -160 "$LOG"
            exit 1
          }
          for decl in BB429Junc11Return32.junc11_lowEven_return32_physical BB429Junc744To924.junc0_744_to_junc0_924_physical BB429Junc744To924.blank_root_to_junc0_924 BB429PhysicalNoFatalConverse.physical_run_prefix_c01_free BB429LowEven4k.lowEven4k_prepared_return_physical BB429Low43C0_1_189.junc381_3_to_junc387_2_physical BB429LowOddPhysical.lowOdd_raw_head BB429Low42PhysicalNoFatalAnyHead.low42_raw_head_any_c01_free; do
            grep -E "'$decl' (depends on axioms:|does not depend on any axioms)" "$LOG"
          done
          if grep -q sorryAx "$LOG"; then
            echo "FAIL: unexpected sorryAx in original-source proof chain"
            exit 1
          fi
          echo "PASS: original-source #429 low4k/low4k2, r=32 root chain, 2,672,087-step blank-root prefix through J(0,924), and no sorryAx"
      - name: Save Lean object cache
        if: always() && steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: im-results/**/*.olean
          key: lean-4.36.0-rc2-${{ hashFiles('im-results/**/*.lean', '!im-results/agent1-429-root-entry/Junc11Return32.lean', '!im-results/agent1-429-root-entry/Junc744To924.lean', '!im-results/agent1-429-root-entry/Junc744To924AxiomAudit.lean') }}
      - name: Upload Lean diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent1-junc744-to924-lean-diagnostics
          path: /tmp/agent1-junc744-to924.log
          if-no-files-found: warn
