name: Agent 1 BB429 power-minus-three source-root inverse obstruction (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unchanged original BB429 source and new power-spine lemmas
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent6-harmonic429:im-results/agent39-429-1021:im-results/agent1-429-root-rows:im-results/agent1-429-power-minus-three
        run: |
          set -euo pipefail
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-harmonic429/BB429Mod8.olean im-results/agent6-harmonic429/BB429Mod8.lean
          lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent39-429-1021/BB429RootEven8.olean im-results/agent39-429-1021/BB429RootEven8.lean
          lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent1-429-root-rows/BB429NewRootRows.olean im-results/agent1-429-root-rows/BB429NewRootRows.lean
          lean -DmaxHeartbeats=50000000 -DmaxRecDepth=30000 -o im-results/agent6-harmonic429/BB429NewResidue.olean im-results/agent6-harmonic429/BB429NewResidue.lean
          lean -o im-results/agent1-429-power-minus-three/PowerMinusThreeArithmetic.olean im-results/agent1-429-power-minus-three/PowerMinusThreeArithmetic.lean
          lean -DmaxHeartbeats=10000000 -DmaxRecDepth=16000 -o im-results/agent1-429-power-minus-three/PowerMinusThreeSource.olean im-results/agent1-429-power-minus-three/PowerMinusThreeSource.lean
