name: Agent 1 BB429 w4 exact ScanE/Junc boundary (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact source dependency chain and Junc crossing
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider:im-results/agent1-429-physical-frontier:im-results/agent32-429-raw-parent:im-results/agent32-429-primitive-cost:im-results/agent18-429-lastwriter:im-results/agent6-429-one-sided-excursion:im-results/agent32-429-high2-prefix:im-results/agent1-429-w4-boundary:im-results/agent33-429-writer-locality:im-results/agent4-429-ordinary-frontier"
          LOG=/tmp/agent6-junc-crossing.log
          : > "$LOG"
          lean -o im-results/agent8-coverage-contract/Frontier.olean im-results/agent8-coverage-contract/Frontier.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent32-429-primitive-cost/BubbleExact.olean im-results/agent32-429-primitive-cost/BubbleExact.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent32-429-primitive-cost/BubblePrefix.olean im-results/agent32-429-primitive-cost/BubblePrefix.lean 2>&1 | tee -a "$LOG"
          for m in RayClosed RayChecker RayEntry RayFinite RayTurnExample RayFiniteOracle FiniteHalting; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean" 2>&1 | tee -a "$LOG"
          done
          lean -o im-results/agent8-coverage-contract/Symmetry.olean im-results/agent8-coverage-contract/Symmetry.lean 2>&1 | tee -a "$LOG"
          for m in RayMacro EntryMacroOracle EntryMacroLeft; do
            lean -o "im-results/agent6-fresh-glider/$m.olean" "im-results/agent6-fresh-glider/$m.lean" 2>&1 | tee -a "$LOG"
          done
          lean -o im-results/agent44-drift-closure/DirectedDrift.olean im-results/agent44-drift-closure/DirectedDrift.lean 2>&1 | tee -a "$LOG"
          for m in ZeroMaskOracle FiniteDecision; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean" 2>&1 | tee -a "$LOG"
          done
          for m in FrontierAudit FrontierMass; do
            lean -o "im-results/agent4-coverage-smoke/$m.olean" "im-results/agent4-coverage-smoke/$m.lean" 2>&1 | tee -a "$LOG"
          done
          for m in ZeroPathAudit ControlPathAudit ZeroRowAudit PhysicalTraceAudit FiniteLassoOracle LassoTraceAudit; do
            lean -o "im-results/agent32-zero-prefix-global/$m.olean" "im-results/agent32-zero-prefix-global/$m.lean" 2>&1 | tee -a "$LOG"
          done
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent1-429-physical-frontier/BB429PhysicalFrontier.olean im-results/agent1-429-physical-frontier/BB429PhysicalFrontier.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent6-429-one-sided-excursion/BB429OddExcursion.olean im-results/agent6-429-one-sided-excursion/BB429OddExcursion.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent6-429-one-sided-excursion/BB429SourceE1Return.olean im-results/agent6-429-one-sided-excursion/BB429SourceE1Return.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent6-429-one-sided-excursion/BB429SourceE1Delta.olean im-results/agent6-429-one-sided-excursion/BB429SourceE1Delta.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent6-429-one-sided-excursion/BB429SourceRows.olean im-results/agent6-429-one-sided-excursion/BB429SourceRows.lean 2>&1 | tee -a "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent6-429-one-sided-excursion/BB429PhysicalBridge.olean im-results/agent6-429-one-sided-excursion/BB429PhysicalBridge.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent32-429-raw-parent/BB429E1ShiftDelta.olean im-results/agent32-429-raw-parent/BB429E1ShiftDelta.lean 2>&1 | tee -a "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-raw-parent/BB429DeltaPhysicalBridge.olean im-results/agent32-429-raw-parent/BB429DeltaPhysicalBridge.lean 2>&1 | tee -a "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent6-429-one-sided-excursion/BB429FinishScanEDelta.olean im-results/agent6-429-one-sided-excursion/BB429FinishScanEDelta.lean 2>&1 | tee -a "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent6-429-one-sided-excursion/BB429JuncHeadExcursion.olean im-results/agent6-429-one-sided-excursion/BB429JuncHeadExcursion.lean 2>&1 | tee -a "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-high2-prefix/High2Tail.olean im-results/agent32-429-high2-prefix/High2Tail.lean 2>&1 | tee -a "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-high2-prefix/High2TailBase.olean im-results/agent32-429-high2-prefix/High2TailBase.lean 2>&1 | tee -a "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent1-429-w4-boundary/W4ScanE.olean im-results/agent1-429-w4-boundary/W4ScanE.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4ScanE.boundary_to_sourceScanE_delta'" "$LOG"
          grep -F "'BB429W4ScanE.even_boundary_to_junc_delta'" "$LOG"
          grep -F "'BB429W4ScanE.odd_boundary_to_junc_delta'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent1-429-w4-boundary/W4JuncOne.olean im-results/agent1-429-w4-boundary/W4JuncOne.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4JuncOne.junc0_odd_w1_to_junc0'" "$LOG"
          grep -F "'BB429W4JuncOne.junc2_w1_to_junc0'" "$LOG"
          grep -F "'BB429W4JuncOne.junc0_all_odd_w1'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 im-results/agent1-429-w4-boundary/W4JuncGeneral.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4JuncGeneral.junc0_all_even_w1'" "$LOG"
          grep -F "'BB429W4JuncGeneral.junc0_even_w1_to_positive'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 im-results/agent1-429-w4-boundary/W4CZeroEvents.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4CZeroEvents.junc0_w1_first_czero'" "$LOG"
          grep -F "'BB429W4CZeroEvents.junc0_w1_second_czero'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/W4HeadMax.olean im-results/agent1-429-w4-boundary/W4HeadMax.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4HeadMax.sourceScanE_e1_max'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/W4JuncMax.olean im-results/agent1-429-w4-boundary/W4JuncMax.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4JuncMax.junc0_w1_first_czero_max'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 im-results/agent1-429-w4-boundary/W4JuncSecondMax.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4JuncSecondMax.junc0_w1_second_czero_max'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/W4CZeroSafe.olean im-results/agent1-429-w4-boundary/W4CZeroSafe.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4CZeroSafe.scanE_no_czero_any_prefix'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/W4CZeroCount.olean im-results/agent1-429-w4-boundary/W4CZeroCount.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4CZeroCount.junc0_w1_second_czero_count'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w2-census/W2MidAauxCount.olean im-results/agent1-429-w2-census/W2MidAauxCount.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W2MidAauxCount.midApos_w1_count'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/W4CZeroFull.olean im-results/agent1-429-w4-boundary/W4CZeroFull.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4CZeroFull.junc0_odd_complete_czero_count'" "$LOG"
          grep -F "'BB429W4CZeroFull.junc0_even_complete_czero_count'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/W4CZeroOrdinary.olean im-results/agent1-429-w4-boundary/W4CZeroOrdinary.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4CZeroOrdinary.juncPos_iter_zero_czero_count'" "$LOG"
          grep -F "'BB429W4CZeroOrdinary.junc0_next_zero_czero_count'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w2-census/W2JuncFullCount.olean im-results/agent1-429-w2-census/W2JuncFullCount.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W2JuncFullCount.junc0_w2_even_complete_count'" "$LOG"
          grep -F "'BB429W2JuncFullCount.junc0_w2_odd_complete_count'" "$LOG"
          grep -F "'BB429W2JuncFullCount.junc0_w2_all_even_count'" "$LOG"
          grep -F "'BB429W2JuncFullCount.junc0_w2_all_odd_count'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 im-results/agent1-429-w2-census/W2CZeroEvents.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W2CZeroEvents.junc2_w1_gate_safe'" "$LOG"
          grep -F "'BB429W2CZeroEvents.junc0_w2_even_second_gate_count'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 im-results/agent1-429-w2-census/W2Physical.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W2Physical.physical_w2_even_complete'" "$LOG"
          grep -F "'BB429W2Physical.physical_w2_odd_complete'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 im-results/agent1-429-w4-boundary/W4CZeroPhysical.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4CZeroPhysical.physical_juncPos_iter_no_czero_all_prefix'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/W4HeadPrefix.olean im-results/agent1-429-w4-boundary/W4HeadPrefix.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4HeadPrefix.sourceScanE_all_prefixes_right_bound'" "$LOG"
          grep -F "'BB429W4HeadPrefix.sourceScanE_delta_all_prefixes_le_zero'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 im-results/agent1-429-w4-boundary/W4HeadPhysical.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4HeadPhysical.physical_sourceScanE_all_prefixes_right_bound'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 im-results/agent1-429-w4-boundary/W4Closure.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429W4Closure.even_boundary_to_canonical'" "$LOG"
          grep -F "'BB429W4Closure.odd_boundary_to_canonical'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent4-429-ordinary-frontier/ZeroRegularHeadMax.olean im-results/agent4-429-ordinary-frontier/ZeroRegularHeadMax.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429ZeroRegularHeadMax.junc0_regular_max'" "$LOG"
          grep -F "'BB429ZeroRegularHeadMax.junc0_regular_prefix_before_old_mark'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent4-429-ordinary-frontier/PositiveRegularHeadMax.olean im-results/agent4-429-ordinary-frontier/PositiveRegularHeadMax.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429PositiveRegularHeadMax.juncPos_ordinary_max'" "$LOG"
          grep -F "'BB429PositiveRegularHeadMax.juncPos_ordinary_prefix_before_old_mark'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 im-results/agent4-429-ordinary-frontier/PhysicalRegularHeadMax.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429PhysicalRegularHeadMax.physical_zero_regular_frontier_conserved'" "$LOG"
          grep -F "'BB429PhysicalRegularHeadMax.physical_positive_regular_frontier_conserved'" "$LOG"
          lean -o im-results/agent33-429-writer-locality/CZeroEvenReturn.olean im-results/agent33-429-writer-locality/CZeroEvenReturn.lean 2>&1 | tee -a "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/CZeroContext.olean im-results/agent1-429-w4-boundary/CZeroContext.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429CZeroContext.even_C0_context'" "$LOG"
          grep -F "'BB429CZeroContext.odd_C0_context_halts'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 im-results/agent1-429-w4-boundary/CZeroContextPhysical.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429CZeroContextPhysical.physical_even_C0_context'" "$LOG"
          grep -F "'BB429CZeroContextPhysical.physical_odd_C0_context_halts'" "$LOG"
          grep -F "'BB429CZeroContextPhysical.blank_reaches_odd_C0_context_halts'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/CZeroHeadFrontier.olean im-results/agent1-429-w4-boundary/CZeroHeadFrontier.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429CZeroHeadFrontier.even_C0_context_max'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 im-results/agent1-429-w4-boundary/CZeroHeadPrefix.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429CZeroHeadPrefix.physical_even_C0_context_all_prefix'" "$LOG"
          grep -F "'BB429CZeroHeadPrefix.authentic_even_C0_record_extension'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/CZeroContextToE1.olean im-results/agent1-429-w4-boundary/CZeroContextToE1.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429CZeroContextToE1.even_C0_to_E1_context'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 im-results/agent1-429-w4-boundary/CZeroCensus.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429CZeroCensus.even_C0_context_exact_one'" "$LOG"
          grep -F "'BB429CZeroCensus.even_C0_to_E1_exact_two'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/CZeroContextToE1Max.olean im-results/agent1-429-w4-boundary/CZeroContextToE1Max.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429CZeroContextToE1Max.even_C0_to_E1_context_max'" "$LOG"
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 im-results/agent1-429-w4-boundary/CZeroContextToE1Physical.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429CZeroContextToE1Physical.blank_even_C0_to_E1_corridor'" "$LOG"
          if grep -q sorryAx "$LOG"; then
            echo "sorryAx detected in w4 original-source dependency chain"
            exit 1
          fi
          echo "Original-source w4 boundary theorem chain compiled; no sorryAx detected."
