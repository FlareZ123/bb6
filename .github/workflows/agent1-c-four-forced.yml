name: Agent 1 Machine C four forced high gates (manual)
on:
  workflow_dispatch:
    inputs:
      balanced_only:
        description: 'Stop after source-verifying the exact balanced and odd target fibers; skip downstream experimental modules'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  bounce-inverse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify against original unmodified section and bounce source
        run: |
          mkdir -p /tmp/a3-bounce
          cp im-results/agent11-c-line/CLine.lean /tmp/a3-bounce/
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/a3-bounce/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/a3-bounce/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef}.lean /tmp/a3-bounce/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,AffineTarget,AffineTargetReach,AffineTargetExact,FeederGeneric,FeederOrbitGeneric,GeneralHighInverse,EvenTargetForward,EvenTargetExact,EvenTargetOrbit,BounceEvenExact,SectionOddInverse,BounceOddExact,FullSectionInverse,SectionMassStrict,SectionMassOrbit,ReachFast,BounceEvenThree,BounceEvenNoFour,BounceAllExact,SectionAllInverse,UnboundedInDegree,PowerDegreeExact,BounceLogBound,SectionLogBound,ZeroEvenUniversal,ZeroEvenOrbit,ZeroOddRange,ZeroOddForward}.lean /tmp/a3-bounce/
          cp im-results/agent38-c-section-mod4/Agent38SectionParity.lean /tmp/a3-bounce/
          cp im-results/agent3-c-odd-image/{Agent3CImage,Agent3COneFamily,Agent3COrbitIff}.lean /tmp/a3-bounce/
          cd /tmp/a3-bounce
          export LEAN_PATH="."
          lean --version
          for f in CLine GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef; do
            lean -o "$f.olean" "$f.lean"
          done
          lean -o BounceInverse.olean BounceInverse.lean
          lean -o AffineTarget.olean AffineTarget.lean
          lean AffineTargetExact.lean
          lean -o FeederGeneric.olean FeederGeneric.lean
          lean -o Agent3CImage.olean Agent3CImage.lean
          lean -o Agent3COneFamily.olean Agent3COneFamily.lean
          lean -o Agent3COrbitIff.olean Agent3COrbitIff.lean
          lean -o FeederOrbitGeneric.olean FeederOrbitGeneric.lean
          lean -o GeneralHighInverse.olean GeneralHighInverse.lean
          lean -o EvenTargetForward.olean EvenTargetForward.lean
          lean -o EvenTargetExact.olean EvenTargetExact.lean
          lean EvenTargetOrbit.lean
          lean -o BounceEvenExact.olean BounceEvenExact.lean
          lean SectionOddInverse.lean
          lean -o BounceOddExact.olean BounceOddExact.lean
          lean FullSectionInverse.lean
          lean -o SectionMassStrict.olean SectionMassStrict.lean
          # Agent 1: prove the original-source m=8 low-gate exclusion by kernel-checked section trace.
          cp "$GITHUB_WORKSPACE"/im-results/agent1-c-m8-trace/{M8TraceBridge,M8TraceCert}.lean .
          lean -o M8TraceBridge.olean M8TraceBridge.lean
          lean -o M8TraceCert.olean M8TraceCert.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent1-c-m8-trace/LowGatesOriginal.lean .
          lean LowGatesOriginal.lean
          lean -o SectionMassOrbit.olean SectionMassOrbit.lean
          lean ReachFast.lean
          lean -o BounceEvenThree.olean BounceEvenThree.lean
          lean -o BounceEvenNoFour.olean BounceEvenNoFour.lean
          lean -o Agent38SectionParity.olean Agent38SectionParity.lean
          lean -o BounceAllExact.olean BounceAllExact.lean
          lean -o SectionAllInverse.olean SectionAllInverse.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/EvenOddFourExact.lean .
          lean -o EvenOddFourExact.olean EvenOddFourExact.lean
          lean -o UnboundedInDegree.olean UnboundedInDegree.lean
          lean -o PowerDegreeExact.olean PowerDegreeExact.lean
          # Agent 20 balanced source fiber, reusing this exact original-source dependency build.
          base64 -d "$GITHUB_WORKSPACE/im-results/agent20-c-balanced-fan/BalancedFanExact.lean.xz.b64" | xz -d > BalancedFanExact.lean
          echo "1b78e29a8aaec1befb189a2d8735c0e43c63f5eb6acded910279e5baa44bff82  BalancedFanExact.lean" | sha256sum -c -
          lean BalancedFanExact.lean
          # Agent 20 exact odd-target fiber, including the authentic low stopping family.
          base64 -d "$GITHUB_WORKSPACE/im-results/agent20-c-odd-fiber/OddFan.lean.xz.b64" | xz -d > OddFan.lean
          echo "bf7f1c6366cc424aede82c4a4c38b77e3002f2b6c6c2dbcb62b8df798772ee8f  OddFan.lean" | sha256sum -c -
          lean -o OddFan.olean OddFan.lean
          # Connect the exact predecessor classification to Machine C's original halting criterion.
          cp "$GITHUB_WORKSPACE"/im-results/agent15-c-halting/{BounceHalting,SectionHalting,SectionPower,SectionParam}.lean .
          for f in BounceHalting SectionHalting SectionPower SectionParam; do lean -o "$f.olean" "$f.lean"; done
          cp "$GITHUB_WORKSPACE"/im-results/agent20-c-odd-fiber/LowHaltWitness.lean .
          echo "d7cc7f78d72324d7253f6e2dd486f5299c3386bf407f89d14944975cc21c5ad2  LowHaltWitness.lean" | sha256sum -c -
          lean LowHaltWitness.lean
          # An additional all-parameter necessary parity condition on every low stopping target parent.
          base64 -d "$GITHUB_WORKSPACE/im-results/agent20-c-odd-fiber/LowParity.lean.xz.b64" | xz -d > LowParity.lean
          echo "724a3d620e46cc42f83af58c4b372dcc60f76ad276e9d5b5c0efc31001497ed0  LowParity.lean" | sha256sum -c -
          lean LowParity.lean
          # All-time blank-origin exclusion of the still-open low halting gateway m=3.
          base64 -d "$GITHUB_WORKSPACE/im-results/agent20-c-odd-fiber/LowM3.lean.xz.b64" | xz -d > LowM3.lean
          echo "554c93a6d05d776a628a8083ac1235ab0b54b6d4f919d6d66c3f2d7b0866ed5d  LowM3.lean" | sha256sum -c -
          lean LowM3.lean
          # Agent 3 uniform genuine blank-orbit nonreachability, no modular sampling.
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/{OneSevenGate,LowSeven}.lean .
          lean -o OneSevenGate.olean OneSevenGate.lean
          lean LowSeven.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/OddSliver.lean .
          lean -o OddSliver.olean OddSliver.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/SliverIff.lean .
          lean SliverIff.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/HighSliver.lean .
          lean HighSliver.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/EvenChild.lean .
          lean EvenChild.lean
          # Source-exact full-depth odd second wedge with M32-invisible true-blank exclusion.
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/OddSevenSliver.lean .
          lean -o OddSevenSliver.olean OddSevenSliver.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/OddOddWedge.lean .
          lean -o OddOddWedge.olean OddOddWedge.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/OddOddOrbit.lean .
          lean -o OddOddOrbit.olean OddOddOrbit.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/OddOddSecondWedge.lean .
          lean OddOddSecondWedge.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/OddOddVal3.lean .
          lean -o OddOddVal3.olean OddOddVal3.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/OddOddVal3Orbit.lean .
          lean -o OddOddVal3Orbit.olean OddOddVal3Orbit.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/OddOddVal3High.lean .
          lean OddOddVal3High.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/OddOddLowVal.lean .
          lean -o OddOddLowVal.olean OddOddLowVal.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/OddSevenOrbit.lean .
          lean -o OddSevenOrbit.olean OddSevenOrbit.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/OddForcedNormalize.lean .
          lean -o OddForcedNormalize.olean OddForcedNormalize.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/OddForcedDepth.lean .
          lean -o OddForcedDepth.olean OddForcedDepth.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/DepthNormalizeBound.lean .
          lean DepthNormalizeBound.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/OddForcedFilter.lean .
          lean OddForcedFilter.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent15-c-halting/{SectionAffineInverse,ReachAffine}.lean .
          lean -o SectionAffineInverse.olean SectionAffineInverse.lean
          lean -o ReachAffine.olean ReachAffine.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/FullForcedNormalize.lean .
          lean -o FullForcedNormalize.olean FullForcedNormalize.lean
          # Agent29: exact finite-depth source gate bounds (manual only)
          cp "$GITHUB_WORKSPACE"/im-results/agent29-forced-depth/SourceBound.lean .
          lean -o SourceBound.olean SourceBound.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent29-forced-depth/FullDepth.lean .
          lean FullDepth.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent29-forced-depth/DeepAffine.lean .
          lean DeepAffine.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent29-forced-depth/ModThree.lean .
          lean -o ModThree.olean ModThree.lean
          # Agent29: exact high stopping right-counter residue in the deep affine sector
          cp "$GITHUB_WORKSPACE"/im-results/agent15-c-halting/{AffineNormalize,AffineParityDepth,AffineHaltOneStep,SecondDeepSector}.lean .
          for f in AffineNormalize AffineParityDepth AffineHaltOneStep SecondDeepSector; do lean -o "$f.olean" "$f.lean"; done
          cp "$GITHUB_WORKSPACE"/im-results/agent29-forced-depth/DeepSecondFinal.lean .
          lean -o DeepSecondFinal.olean DeepSecondFinal.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent29-forced-depth/BottomBoundary.lean .
          lean -o BottomBoundary.olean BottomBoundary.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent29-forced-depth/DeepFourExclude.lean .
          lean -o DeepFourExclude.olean DeepFourExclude.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent29-forced-depth/SecondOneInfinite.lean .
          lean SecondOneInfinite.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/FullForcedFilter.lean .
          lean -o FullForcedFilter.olean FullForcedFilter.lean
          # Agent 1: independent four-forced inverse source, with tar and source-integrity checks.
          base64 -d "$GITHUB_WORKSPACE/im-results/agent1-c-four-forced/C4SourceBundle.tar.gz.b64" > /tmp/agent1-four.tar.gz
          echo "95f1e51b2d38a2dc496e905d2119e72b769c730c479542ac3d18e40c0af25ecc  /tmp/agent1-four.tar.gz" | sha256sum -c -
          tar -xzf /tmp/agent1-four.tar.gz
          echo "632d1c0c932702e6fe3cb9bf2b27c42cfeca7d2f59e75d6fddccd7b949c4b9ac  C4Arithmetic.lean" | sha256sum -c -
          echo "f5756b74979b605897d5fd045051d12e870852661eb41f45b27f8e864043aced  C4Source.lean" | sha256sum -c -
          lean -o C4Arithmetic.olean C4Arithmetic.lean
          lean C4Source.lean
