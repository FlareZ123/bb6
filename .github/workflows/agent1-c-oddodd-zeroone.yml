name: Agent 1 Machine C odd-odd depth-zero gate (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unmodified source, exact inverse and high-depth-zero theorem
        run: |
          mkdir -p /tmp/agent1-c-oddodd
          cp im-results/agent11-c-line/CLine.lean /tmp/agent1-c-oddodd/
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/agent1-c-oddodd/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/agent1-c-oddodd/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef,FastSectionProof,FastSectionHalting,Agent46CBridge}.lean /tmp/agent1-c-oddodd/
          cp im-results/agent38-c-section-mod4/Agent38SectionParity.lean /tmp/agent1-c-oddodd/
          cp im-results/agent3-c-odd-image/Agent3CImage.lean /tmp/agent1-c-oddodd/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,EvenTargetForward,BounceEvenExact,BounceOddExact,BounceEvenThree,BounceEvenNoFour,BounceAllExact,SectionAllInverse,OddSliver,OddSevenSliver,OddOddWedge,OddOddOrbit}.lean /tmp/agent1-c-oddodd/
          cp im-results/agent15-c-halting/{BounceHalting,SectionHalting,SectionPower,SectionParam}.lean /tmp/agent1-c-oddodd/
          cp im-results/agent1-c-unified-gateway/OddOddZeroOne.lean /tmp/agent1-c-oddodd/
          cd /tmp/agent1-c-oddodd
          export LEAN_PATH=.
          lean --version
          for f in CLine GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef FastSectionProof FastSectionHalting Agent46CBridge Agent38SectionParity Agent3CImage BounceInverse EvenTargetForward BounceEvenExact BounceOddExact BounceEvenThree BounceEvenNoFour BounceAllExact SectionAllInverse OddSliver OddSevenSliver OddOddWedge OddOddOrbit BounceHalting SectionHalting SectionPower SectionParam OddOddZeroOne; do
            echo "::group::Compiling $f"
            lean -o "$f.olean" "$f.lean"
            echo "::endgroup::"
          done
