name: Agent1 Raw56 leaf17557 base epoch source check

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned original Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: raw56-root-frontier-source-accepted
          path: /tmp/base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '45912699461'
      - name: Check literal entry and base epoch
        run: |
          set -euo pipefail
          mkdir -p /tmp/union
          find /tmp/base -name '*.olean' -exec cp -n {} /tmp/union/ \;
          test -f /tmp/union/SweepPumping.olean
          cp im-results/agent1-raw56/le/Raw56LE17557Base.lean /tmp/union/
          export LEAN_PATH=/tmp/union
          cd /tmp/union
          lean -o Raw56LE17557Base.olean Raw56LE17557Base.lean 2>&1 | tee base.log
          ! grep -Eq 'sorryAx|native_decide|(^| )error:' base.log
          python "$GITHUB_WORKSPACE/im-results/agent1-raw57/check_axioms.py" base.log \
            --require BB6.Agent1Raw56.LE17557Base.entryC2 \
            --require BB6.Agent1Raw56.LE17557Base.baseEpoch
          mkdir -p /tmp/out
          cp Raw56LE17557Base.{lean,olean} base.log /tmp/out/
      - name: Check weighted frame schedule
        run: |
          set -euo pipefail
          cp im-results/agent1-raw56/le/Raw56LE17557{RhoArithmetic,DefectStack,FrameSchedule,EpisodeWord,ActionGrammar,LocalSweeps}.lean /tmp/union/
          export LEAN_PATH=/tmp/union
          cd /tmp/union
          lean -o Raw56LE17557RhoArithmetic.olean Raw56LE17557RhoArithmetic.lean 2>&1 | tee rho.log
          lean -o Raw56LE17557DefectStack.olean Raw56LE17557DefectStack.lean 2>&1 | tee defect.log
          lean -o Raw56LE17557FrameSchedule.olean Raw56LE17557FrameSchedule.lean 2>&1 | tee frame.log
          lean -o Raw56LE17557EpisodeWord.olean Raw56LE17557EpisodeWord.lean 2>&1 | tee episode.log
          lean -o Raw56LE17557ActionGrammar.olean Raw56LE17557ActionGrammar.lean 2>&1 | tee action.log
          lean -o Raw56LE17557LocalSweeps.olean Raw56LE17557LocalSweeps.lean 2>&1 | tee sweeps.log
          cat rho.log defect.log frame.log episode.log action.log sweeps.log > frame-all.log
          ! grep -Eq 'sorryAx|native_decide|(^| )error:' frame-all.log
          python "$GITHUB_WORKSPACE/im-results/agent1-raw57/check_axioms.py" frame-all.log \
            --require BB6.Agent1Raw56.LE17557FrameSchedule.frame_prefix_defect \
            --require BB6.Agent1Raw56.LE17557FrameSchedule.next_B_guards \
            --require BB6.Agent1Raw56.LE17557FrameSchedule.next_C_residue7_weight_positive \
            --require BB6.Agent1Raw56.LE17557FrameSchedule.prefixWeight_unbounded \
            --require BB6.Agent1Raw56.LE17557FrameSchedule.frame_closes \
            --require BB6.Agent1Raw56.LE17557FrameSchedule.frame_succ_refine \
            --require BB6.Agent1Raw56.LE17557ActionGrammar.erase_actionEpoch \
            --require BB6.Agent1Raw56.LE17557ActionGrammar.segment_head \
            --require BB6.Agent1Raw56.LE17557ActionGrammar.body_outerTrace \
            --require BB6.Agent1Raw56.LE17557ActionGrammar.segment_is_closed_nested \
            --require BB6.Agent1Raw56.LE17557ActionGrammar.body_outerTraceBelow \
            --require BB6.Agent1Raw56.LE17557LocalSweeps.B_sweep_ones \
            --require BB6.Agent1Raw56.LE17557LocalSweeps.C_sweep_ones \
            --require BB6.Agent1Raw56.LE17557LocalSweeps.A_sweep_left_ones \
            --require BB6.Agent1Raw56.LE17557LocalSweeps.I_return \
            --require BB6.Agent1Raw56.LE17557LocalSweeps.Z_return \
            --require BB6.Agent1Raw56.LE17557LocalSweeps.A_triad_normal \
            --require BB6.Agent1Raw56.LE17557LocalSweeps.A_triad_carry \
            --require BB6.Agent1Raw56.LE17557LocalSweeps.B_triad
          cp Raw56LE17557FrameSchedule.{lean,olean} Raw56LE17557ActionGrammar.{lean,olean} Raw56LE17557LocalSweeps.{lean,olean} frame-all.log /tmp/out/
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: raw56-le17557-base-source-accepted
          path: /tmp/out/**
          retention-days: 30
          if-no-files-found: error
