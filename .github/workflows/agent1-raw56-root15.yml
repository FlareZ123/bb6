name: Agent1 Raw56 root13 accepted-child composition

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  root14:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: raw56-root-frontier-source-accepted
          path: /tmp/raw56-base
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '45912699461'
      - uses: actions/download-artifact@v4
        with:
          pattern: raw56-rc-*
          path: /tmp/raw56-rc
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '46045652695'
      - uses: actions/download-artifact@v4
        with:
          name: raw56-reparent-source-accepted
          path: /tmp/raw56-re
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '46061898661'
      - uses: actions/download-artifact@v4
        with:
          name: raw56-root17-source-accepted
          path: /tmp/raw56-root17
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '46064074987'
      - name: Restore full original-source pilot certificates for E10RD and E11LC
        uses: actions/download-artifact@v4
        with:
          pattern: rootpilot-*
          path: /tmp/raw56-pilot
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '46064129990'
      - name: Restore successfully recovered E11LC cut zero
        uses: actions/download-artifact@v4
        with:
          name: rootpilot-cut-E11LC-0-recovered
          path: /tmp/raw56-pilot-recovered
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '46086743629'
      - name: Restore source-certified E10RD and E11LC parent modules
        uses: actions/download-artifact@v4
        with:
          pattern: raw56-root-pilot-E1*-source-accepted
          path: /tmp/raw56-pilot-finals
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '46086743629'
      - name: Restore complete E10RB source-certificate closure
        uses: actions/download-artifact@v4
        with:
          pattern: rootpilot-*
          path: /tmp/raw56-pilot-rb
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '46087297403'
      - name: Restore source-certified E10RB parent module
        uses: actions/download-artifact@v4
        with:
          name: raw56-root-pilot-E10RB-source-accepted
          path: /tmp/raw56-pilot-rb-final
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '46087297403'
      - name: Restore source-accepted E11LB complete sibling
        uses: actions/download-artifact@v4
        with:
          name: raw56-lb-complete-subset-original-source-accepted
          path: /tmp/raw56-lb
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '46148466766'
      - name: Restore source-accepted E11LB residual-subset parent
        uses: actions/download-artifact@v4
        with:
          name: raw56-lb-parent-subset-original-source-diagnostics
          path: /tmp/raw56-lb-parent
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: '46148226109'
      - name: Compose original-source fourteen-way Raw56 root frontier
        run: |
          set -euo pipefail
          lean --version | grep -F '4.36.0-rc2'
          # Merge the three accepted pilot closures by their actual module paths.
          # A single tree is required because Lean resolves a dotted prefix such
          # as finite from one search root; separate roots cannot supply
          # finite.E10RD, finite.E11LC and finite.E10RB simultaneously.
          python - <<'PY'
          from pathlib import Path
          roots = [
              Path('/tmp/raw56-pilot'),
              Path('/tmp/raw56-pilot-recovered'),
              Path('/tmp/raw56-pilot-finals'),
              Path('/tmp/raw56-pilot-rb'),
              Path('/tmp/raw56-pilot-rb-final'),
          ]
          out = Path('/tmp/raw56-root14-union')
          out.mkdir(exist_ok=True)
          for root in roots:
              n = 0
              for src in root.rglob('*.olean'):
                  rel = src.relative_to(root)
                  dst = out / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  if dst.exists():
                      if dst.resolve().read_bytes() != src.read_bytes():
                          raise SystemExit(f'LEAN_OBJECT_COLLISION {rel}: {dst.resolve()} != {src}')
                  else:
                      dst.symlink_to(src.resolve())
                  n += 1
              print(root, n, flush=True)
              assert n > 0, root
          # The cut compiler stores tag-local modules below E10RD/E11LC/E10RB
          # while those generated modules import one another by basename.
          # Recreate the exact per-tag LEAN_PATH behavior in the merged root by
          # exposing every tag-local object at the root as a checked alias.
          for tag in ('E10RD', 'E11LC', 'E10RB'):
              tagdir = out / tag
              assert tagdir.is_dir(), tagdir
              for src in tagdir.glob('*.olean'):
                  dst = out / src.name
                  if dst.exists() and dst.resolve().read_bytes() != src.read_bytes():
                      raise SystemExit(f'LEAN_OBJECT_COLLISION alias {src.name}')
                  if not dst.exists():
                      dst.symlink_to(src.resolve())
          for rel in [
              Path('finite/E10RD'), Path('finite/E11LC'), Path('finite/E10RB'),
              Path('E10RD'), Path('E11LC'), Path('E10RB'),
          ]:
              assert (out / rel).is_dir(), rel
          print('union modules', sum(1 for _ in out.rglob('*.olean')), flush=True)
          PY
          export LEAN_PATH="/tmp:/tmp/raw56-lb:/tmp/raw56-lb-parent:/tmp/raw56-lb-parent/E11LB:/tmp/raw56-root14-union:/tmp/raw56-root17:/tmp/raw56-rc:/tmp/raw56-re:/tmp/raw56-base/a1-raw56-root-consumer"
          lean -o /tmp/Raw56Root15.olean im-results/agent1-raw56/Raw56Root15.lean 2>&1 | tee /tmp/raw56-root15.log
          lean -o /tmp/Raw56Root14.olean im-results/agent1-raw56/Raw56Root14.lean 2>&1 | tee /tmp/raw56-root14.log
          lean -o /tmp/Raw56Root13LB.olean im-results/agent1-raw56/Raw56Root13LB.lean 2>&1 | tee /tmp/raw56-root13.log
          python im-results/agent1-raw57/check_axioms.py /tmp/raw56-root15.log --require BB6.Agent1Raw56Root.sound15RDLC
          python im-results/agent1-raw57/check_axioms.py /tmp/raw56-root14.log --require BB6.Agent1Raw56Root.sound14RDRB
          python im-results/agent1-raw57/check_axioms.py /tmp/raw56-root13.log --require BB6.Agent1Raw56Root13LB.sound13LB
          ! grep -Eq 'sorryAx|native_decide|(^| )error:' /tmp/raw56-root15.log /tmp/raw56-root14.log /tmp/raw56-root13.log
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: raw56-root13-source-accepted
          path: |
            /tmp/Raw56Root15.olean
            /tmp/Raw56Root14.olean
            /tmp/Raw56Root13LB.olean
            /tmp/raw56-root15.log
            /tmp/raw56-root14.log
            /tmp/raw56-root13.log
          if-no-files-found: error
