name: Agent 1 P1 blank-reset exclusion (Lean)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Check full independently stated P1 acceleration and inverse
        run: |
          set -e
          export LEAN_PATH="im-results/agent1-p1-map"
          for m in PosEvenForm ResetGate NoEightZero NoOneResets ZeroShape GParity GInverse CriticalG EvenSeed EvenMiss EvenLow ResetOdd; do
            lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean"
          done
