name: Agent 10 #746 exit and reset phase source model Lean checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-exit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original copied source dependencies and downstream proofs
        run: |
          set -eu
          export LEAN_PATH="im-results/agent7-cascade-odd-fibers:im-results/agent10-cascade"
          a="im-results/agent7-cascade-odd-fibers"
          b="im-results/agent10-cascade"
          lean --version
          for m in SourceMacro CascadeOdd ReverseResidue GapCore Mass; do
            lean -o "$a/$m.olean" "$a/$m.lean"
          done
          lean -o "$b/FirstReturnCore.olean" "$b/FirstReturnCore.lean"
          lean -o "$b/ValuationDrain.olean" "$b/ValuationDrain.lean"
          lean -o "$a/LowGates.olean" "$a/LowGates.lean"
          lean -o "$a/SurvivingSmall.olean" "$a/SurvivingSmall.lean"
          lean -o "$a/WellInverseCases.olean" "$a/WellInverseCases.lean"
          lean -o "$a/PreimageCandidates.olean" "$a/PreimageCandidates.lean"
          lean -o "$a/PreimageComplexity.olean" "$a/PreimageComplexity.lean"
          for m in TerminalExit GapOddJoin SweepInvariant RootTerminal ResetAncestry FatalExclusion SmallFatal GateNecessary ExactGate; do
            lean -o "$b/$m.olean" "$b/$m.lean"
          done
          lean -o "$b/ManyShield.olean" "$b/ManyShield.lean"
          lean -o "$b/RootMinIndex.olean" "$b/RootMinIndex.lean"
          lean -o "$b/FastShield.olean" "$b/FastShield.lean"
          lean -o "$b/RootMin256.olean" "$b/RootMin256.lean"
          lean -o "$b/SecondGap.olean" "$b/SecondGap.lean"
          lean -o "$b/MiddleGap.olean" "$b/MiddleGap.lean"
          lean -o "$a/ReverseCertificate.olean" "$a/ReverseCertificate.lean"
          lean -o "$a/ReverseComplete.olean" "$a/ReverseComplete.lean"
          lean -o "$a/SurvivingExactGate.olean" "$a/SurvivingExactGate.lean"
          echo "Compiled source-indexed dependencies, Agent10 modules, and Agent7 surviving-index bridge."
