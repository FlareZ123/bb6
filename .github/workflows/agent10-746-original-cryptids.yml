name: Agent 10 #746 original Cryptids source bridge (manual)
on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Stop after the LevelDeficitDynamics, T1QParentFatal, and t0 arithmetic preflight
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  verify-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Reclaim CI workspace
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
      - name: Checkout exact upstream Cryptids revision
        uses: actions/checkout@v4
        with:
          repository: google-deepmind/cryptids
          ref: c86f15861709b76042998c5211c7b2f83991621b
          persist-credentials: false
      - name: Checkout persistent BB6 research proof
        uses: actions/checkout@v4
        with:
          path: agent10
          persist-credentials: false
      - name: Build unmodified upstream original source (Lean 4.35.0-rc4)
        uses: leanprover/lean-action@v1
        with:
          build-args: BusyBeaver.BB6.M_1RB0LF_1LC1RA_0RE0RD_HHH1LE_1LF1RC_1LC1LA
        env:
          LEAN_NUM_THREADS: "1"
      - name: Compile rooted chain and high-level reset bridge against unmodified upstream
        env:
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/Agent10Bridge"
          a="$GITHUB_WORKSPACE/agent10/im-results/agent7-fatal-density"
          b="$GITHUB_WORKSPACE/agent10/im-results/agent10-cascade"
          c="$GITHUB_WORKSPACE/agent10/im-results/agent7-cascade-odd-fibers"
          if [ "$PREFLIGHT_ONLY" = "true" ]; then
            # Compile the exact transitive closure of the t1 source bridge and the
            # t0 arithmetic/boundary modules. Do not build unrelated fast cones.
            set -o pipefail
            cp "$c"/{SourceMacro,CascadeOdd,ReverseResidue,GapCore,Mass}.lean "$GITHUB_WORKSPACE/Agent10Bridge/"
            cp "$b"/{TerminalExit,GapOddJoin,SweepInvariant,RootTerminal,ResetAncestry,FatalExclusion,SmallFatal,GateNecessary,ExactGate,FirstReturnCore,ValuationDrain,FullReturn,ReturnInverseArithmetic,ResetInverseWitnesses,FirstOutcome,FirstInverseComplete,ResetChain,T1QParentFatal,T0EvenParentPowerBounds,T0EvenParentArithmetic,T0EvenParentCombined,T0EvenParentBoundary}.lean "$GITHUB_WORKSPACE/Agent10Bridge/"
            cp "$GITHUB_WORKSPACE/agent10/im-results/agent44-746-rank/LevelDeficitDynamics.lean" "$GITHUB_WORKSPACE/Agent10Bridge/"
            cd "$GITHUB_WORKSPACE"
            export LEAN_PATH="$GITHUB_WORKSPACE/Agent10Bridge:$GITHUB_WORKSPACE/.lake/build/lib/lean"
            lake env lean --version
            log="$GITHUB_WORKSPACE/t0-t1-preflight-axioms.log"
            : > "$log"
            for m in SourceMacro CascadeOdd ReverseResidue GapCore Mass TerminalExit GapOddJoin SweepInvariant RootTerminal ResetAncestry FatalExclusion SmallFatal GateNecessary ExactGate FirstReturnCore ValuationDrain FullReturn ReturnInverseArithmetic ResetInverseWitnesses FirstOutcome FirstInverseComplete ResetChain; do
              lake env lean -o "Agent10Bridge/$m.olean" "Agent10Bridge/$m.lean" 2>&1 | tee -a "$log"
            done
            lake env lean -o "Agent10Bridge/LevelDeficitDynamics.olean" "Agent10Bridge/LevelDeficitDynamics.lean" 2>&1 | tee -a "$log"
            lake env lean -o "Agent10Bridge/T1QParentFatal.olean" "Agent10Bridge/T1QParentFatal.lean" 2>&1 | tee -a "$log"
            for m in T0EvenParentPowerBounds T0EvenParentArithmetic T0EvenParentCombined T0EvenParentBoundary; do
              lake env lean -o "Agent10Bridge/$m.olean" "Agent10Bridge/$m.lean" 2>&1 | tee -a "$log"
            done
            if grep -E 'sorryAx|native_decide' "$log"; then
              echo "FAIL: forbidden axiom or native_decide dependency in focused preflight"
              exit 1
            fi
            echo "PASS: t1 source dependency closure and t0 arithmetic/boundary modules compiled; no sorryAx/native_decide in printed axiom profiles."
            exit 0
          fi
          cp "$c"/{SourceMacro,CascadeOdd,ReverseResidue,GapCore,Mass,SurvivingSmall,SurvivingExactGate,OriginalSurvivingBridge,OriginalPhysicalGate}.lean "$GITHUB_WORKSPACE/Agent10Bridge/"
          cp "$a"/HighLevelResetBridge.lean "$GITHUB_WORKSPACE/Agent10Bridge/"
          cp "$b"/{TerminalExit,GapOddJoin,SweepInvariant,RootTerminal,ResetAncestry,FatalExclusion,SmallFatal,GateNecessary,ExactGate,ManyShield,RootMinIndex,FastShield,RootMin256,OriginalNextBridge,OriginalMinIndexBridge,OriginalRawGate}.lean "$GITHUB_WORKSPACE/Agent10Bridge/"
          cp "$b"/{FirstReturnCore,ValuationDrain,FullReturn,ReturnInverseArithmetic,ResetInverseWitnesses,FirstOutcome,FirstInverseComplete,ResetChain,ResetParentStrict,ParentCheck,Parents,ClosedCert,ReachDecide,OriginalAlgorithmicGate,FastParents,FastClosedCert,OriginalGate268,T1QParentFatal,T1QParentOriginal}.lean "$GITHUB_WORKSPACE/Agent10Bridge/"
          cp "$GITHUB_WORKSPACE/agent10/im-results/agent44-746-rank/LevelDeficitDynamics.lean" "$GITHUB_WORKSPACE/Agent10Bridge/"
          cd "$GITHUB_WORKSPACE"
          export LEAN_PATH="$GITHUB_WORKSPACE/Agent10Bridge:$GITHUB_WORKSPACE/.lake/build/lib/lean"
          lake env lean --version
          for m in SourceMacro CascadeOdd ReverseResidue GapCore Mass SurvivingSmall TerminalExit GapOddJoin SweepInvariant RootTerminal ResetAncestry FatalExclusion SmallFatal GateNecessary ExactGate ManyShield RootMinIndex FastShield RootMin256 SurvivingExactGate OriginalNextBridge; do
            lake env lean -o "Agent10Bridge/$m.olean" "Agent10Bridge/$m.lean"
          done
          lake env lean -o "Agent10Bridge/OriginalSurvivingBridge.olean" "Agent10Bridge/OriginalSurvivingBridge.lean"
          lake env lean -o "Agent10Bridge/OriginalPhysicalGate.olean" "Agent10Bridge/OriginalPhysicalGate.lean"
          lake env lean -o "Agent10Bridge/OriginalMinIndexBridge.olean" "Agent10Bridge/OriginalMinIndexBridge.lean"
          lake env lean -o "Agent10Bridge/OriginalRawGate.olean" "Agent10Bridge/OriginalRawGate.lean"
          for m in FirstReturnCore ValuationDrain FullReturn ReturnInverseArithmetic ResetInverseWitnesses FirstOutcome FirstInverseComplete ResetChain ResetParentStrict ParentCheck Parents ClosedCert ReachDecide; do
            lake env lean -o "Agent10Bridge/$m.olean" "Agent10Bridge/$m.lean"
          done
          lake env lean -o "Agent10Bridge/LevelDeficitDynamics.olean" "Agent10Bridge/LevelDeficitDynamics.lean"
          lake env lean -o "Agent10Bridge/T1QParentFatal.olean" "Agent10Bridge/T1QParentFatal.lean"
          lake env lean -o "Agent10Bridge/HighLevelResetBridge.olean" "Agent10Bridge/HighLevelResetBridge.lean"
          lake env lean -o "Agent10Bridge/OriginalAlgorithmicGate.olean" "Agent10Bridge/OriginalAlgorithmicGate.lean"
          lake env lean -o "Agent10Bridge/FastParents.olean" "Agent10Bridge/FastParents.lean"
          lake env lean -o "Agent10Bridge/FastClosedCert.olean" "Agent10Bridge/FastClosedCert.lean"
          for n in 257 262 263; do
            python3 "$b/generate_fast_cone.py" --index "$n" --chunk-size 16 --output "$GITHUB_WORKSPACE/Agent10Bridge/FastCone$n.lean"
            lake env lean -o "Agent10Bridge/FastCone$n.olean" "Agent10Bridge/FastCone$n.lean"
          done
          lake env lean -o "Agent10Bridge/OriginalGate268.olean" "Agent10Bridge/OriginalGate268.lean"
          lake env lean -o "Agent10Bridge/T1QParentOriginal.olean" "Agent10Bridge/T1QParentOriginal.lean"
          echo "PASS: t=1 Q-parent source identity, nonfatal even-reset chain, and conditional original-machine halting implication compiled."
          echo "Unmodified pinned upstream highLevelNext, exact ResetParent first-return equivalence, root reset-chain correspondence, and source-indexed surviving-gate bound compiled."
