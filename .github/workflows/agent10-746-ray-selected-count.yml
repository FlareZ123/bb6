name: Agent 10 exact odd parent count at Hensel-selected #746 ray vertices

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-count:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -eu
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile checked-in original source dependencies and exact selected count
        run: |
          set -eu
          a="im-results/agent7-cascade-odd-fibers"
          b="im-results/agent10-cascade"
          c="im-results/agent44-746-fanin"
          g="im-results/agent7-fatal-density"
          export LEAN_PATH="$a:$b:$c:$g"
          lean --version
          for m in SourceMacro CascadeOdd ReverseResidue GapCore Mass; do
            lean -o "$a/$m.olean" "$a/$m.lean"
          done
          lean -o "$b/FirstReturnCore.olean" "$b/FirstReturnCore.lean"
          for m in LowGates SurvivingSmall WellInverseCases PreimageCandidates; do
            lean -o "$a/$m.olean" "$a/$m.lean"
          done
          for m in TerminalExit GapOddJoin SweepInvariant RootTerminal ResetAncestry FatalExclusion SmallFatal GateNecessary ExactGate; do
            lean -o "$b/$m.olean" "$b/$m.lean"
          done
          for m in ValuationDrain FullReturn ReturnInverseArithmetic ResetInverseWitnesses FirstOutcome FirstInverseComplete; do
            lean -o "$b/$m.olean" "$b/$m.lean"
          done
          for m in BandTriple OddGroup LogBands LogStep Telescope GeomLog GeomBand ExactCountLean ParameterCountBridge; do
            lean -o "$c/$m.olean" "$c/$m.lean"
          done
          for m in SignedRayPeriod RayDepthHensel RayDepthResidue; do
            lean -o "$g/$m.olean" "$g/$m.lean"
          done
          lean -o "$b/RaySelectedExactCount.olean" "$b/RaySelectedExactCount.lean"
          echo "SOURCE COUNT CHECK PASSED: all-precision Hensel-selected real reset odd count."
