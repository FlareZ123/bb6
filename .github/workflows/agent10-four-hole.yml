  raw109-shards:
    if: inputs.target == 'raw109-sharded'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [cut, lc-re-lb, rf, lc-la, la-rc, lf1, lf0]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate and independently certify one shard
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          root=im-results/agent4-raw109
          case "$GROUP" in
            cut) children="0LD 0RE" ;;
            lc-re-lb) children="0LC 1RE 1LB" ;;
            rf) children="0RF 1RF" ;;
            lc-la) children="1LC 0LA" ;;
            la-rc) children="1LA 0RC" ;;
            lf1) children="1LF" ;;
            lf0) children="0LF" ;;
            *) exit 2 ;;
          esac
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python "$root/generate.py" $children
          roots=()
          theorems=()
          for child in $children; do
            python im-results/agent10-tnf-multipump/chunk_checks.py "$root" "Raw109B$child" --limit 180
            roots+=("$root/Raw109B${child}Data.lean")
            theorems+=("BB6.Agent4Raw109B$child.all_closed")
          done
          if [ "$GROUP" = cut ]; then
            roots=("$root/Raw109Cut.lean")
            theorems+=("BB6.Agent4Raw109Cut.parent_dichotomy")
          fi
          work=/tmp/a4-raw109-shard
          python tools/lean_compile_closure.py --workdir "$work" --jobs 4 \
            --manifest "$work/manifest.json" --label "raw109-shard-$GROUP" \
            --artifact-name "raw109-shard-$GROUP" \
            --provenance-input "$root/specs.json" --provenance-input "$root/generate.py" \
            --provenance-input im-results/agent10-tnf-multipump/chunk_checks.py \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent2-tnf-raw99/enumerate.cpp \
            --provenance-input im-results/agent11-raw107/bank.cpp \
            --provenance-input im-results/agent1-raw60/bank.txt \
            "${roots[@]}" 2>&1 | tee /tmp/a4-raw109-shard.log
          python "$root/audit_axioms.py" /tmp/a4-raw109-shard.log "${theorems[@]}"
