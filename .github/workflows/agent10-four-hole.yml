          dest = pathlib.Path("/tmp/a10-raw108-shards")
          dest.mkdir()
          for group, pin in pins.items():
              run = str(pin["run_id"])
              rev = pin["revision"]
              assert re.fullmatch(r"[0-9]+", run)
              assert re.fullmatch(r"[0-9a-f]{40}", rev)
              metadata = json.loads(subprocess.check_output(
                  ["gh", "run", "view", run, "--json", "headSha"], text=True))
              assert metadata["headSha"] == rev, (group, metadata, pin)
              if subprocess.run(["git", "cat-file", "-e", rev+"^{commit}"]).returncode:
                  subprocess.run(["git", "fetch", "--no-tags", "origin", rev], check=True)
              artifact = config["artifact_prefix"] + "-" + group
              subprocess.run(["gh", "run", "download", run, "--name", artifact,
                              "--dir", str(dest / artifact)], check=True)
          pathlib.Path("/tmp/a10-raw108-pins.json").write_text(json.dumps(pins, indent=2))
          PY
      - name: Compose conservative parent proof from existing child certificates
        run: |
          set -euo pipefail
          root=im-results/agent10-raw108
          union=/tmp/a10-raw108-union
          work=/tmp/a10-raw108-parent
          python "$root/merge_resume.py" /tmp/a10-raw108-shards "$union" "$root/shard_groups.json" /tmp/a10-raw108-pins.json
          python tools/lean_compile_closure.py --workdir "$work" --jobs 1 \
            --precompiled-dir "$union" --precompiled-manifest "$union/manifest.json" \
            --manifest "$work/manifest.json" --label raw108 \
            --theorem BB6.Agent10Raw108Closed.all_closed \
            --parent-table "1RB---_1RC---_0RD---_1LD1RE_---1LB_------" \
            --weighted-bound 4136180 --artifact-name raw108-parent-proof \
            --provenance-input "$root/shard_groups.json" \
            --provenance-input /tmp/a10-raw108-pins.json \
            --provenance-input "$union/manifest.json" \
            "$root/Raw108Closed.lean" 2>&1 | tee /tmp/a10-raw108-parent.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a10-raw108-parent.log BB6.Agent10Raw108Closed.all_closed
          python - "$work/manifest.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          expected = {item["module"] for item in m["modules"]} - {"Raw108Closed"}
          reused = set(m["precompiled_core"]["reused_modules"])
          if reused != expected:
              raise SystemExit(f"Unexpected rebuilt dependencies: {sorted(expected - reused)}")
          print(f"Reused all {len(expected)} audited dependencies")
          PY
          cp /tmp/a10-raw108-parent.log "$work/audit.log"
          cp "$union/manifest.json" "$work/shard-union.json"
          cp -r "$union/original-shard-manifests" "$work/"
      - name: Retain conservative parent proof
        uses: actions/upload-artifact@v4
        with:
          name: raw108-parent-proof
          path: /tmp/a10-raw108-parent/
          retention-days: 30
      - name: Establish exact weighted parent maximum
        run: |
          set -euo pipefail
          root=im-results/agent10-raw108
          base=/tmp/a10-raw108-parent
          work=/tmp/a10-raw108-exact
          python tools/lean_compile_closure.py --workdir "$work" --jobs 1 \
            --precompiled-dir "$base" --precompiled-manifest "$base/manifest.json" \
            --manifest "$work/manifest.json" --label raw108-exact \
            --theorem BB6.Agent10Raw108Exact.exact_upper \
            --parent-table "1RB---_1RC---_0RD---_1LD1RE_---1LB_------" \
            --weighted-bound 4136175 --artifact-name raw108-exact-proof \
            "$root/Raw108Exact.lean" 2>&1 | tee /tmp/a10-raw108-exact.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a10-raw108-exact.log BB6.Agent10Raw108Exact.exact_upper BB6.Agent10Raw108Exact.exact_bound
          cp /tmp/a10-raw108-exact.log "$work/audit.log"
          cp "$base/manifest.json" "$work/conservative-parent.json"
      - name: Retain exact parent proof
        uses: actions/upload-artifact@v4
        with:
          name: raw108-exact-proof
          path: /tmp/a10-raw108-exact/
          retention-days: 30

  raw58-shards:
    if: inputs.target == 'raw58-shard'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: ${{ fromJSON(inputs.raw58_groups) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Certify disjoint Raw58 shard and retain its exact closure
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          root=im-results/agent4-raw58
          work=/tmp/a4-raw58-shard
          plan=/tmp/a4-raw58-plan
          python "$root/shard_plan.py" prepare "$GROUP" "$plan"
          mapfile -t roots < "$plan/roots.txt"
          mapfile -t theorems < "$plan/theorems.txt"
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" --label "raw58-shard-$GROUP" \
            --artifact-name "raw58-shard-$GROUP" \
            --provenance-input "$root/generate.py" --provenance-input "$root/generate_more.py" \
            --provenance-input "$root/more.json" --provenance-input "$root/shard_groups.json" \
            --provenance-input "$root/shard_plan.py" \
            --provenance-input im-results/agent10-tnf-multipump/chunk_checks.py \
            --provenance-input im-results/agent2-tnf-raw99/enumerate.cpp \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            "${roots[@]}" 2>&1 | tee /tmp/a4-raw58-shard.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a4-raw58-shard.log "${theorems[@]}"
          cp /tmp/a4-raw58-shard.log "$work/audit.log"
          cp "$plan/"* "$work/"
      - uses: actions/upload-artifact@v4
        with:
          name: raw58-shard-${{ matrix.group }}
          path: /tmp/a4-raw58-shard/
          retention-days: 30

  raw58-prepare:
    if: inputs.target == 'raw58-prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Export exact generated Raw58 source closure (no proof claim)
        env:
          CHILD: ${{ inputs.raw58_child }}
        run: |
          set -euo pipefail
          python im-results/agent4-raw58/source_bundle.py "$CHILD" /tmp/a4-raw58-sources
      - uses: actions/upload-artifact@v4
        with:
          name: raw58-source-${{ inputs.raw58_child }}
          path: /tmp/a4-raw58-sources/
          retention-days: 30

  raw58-compose:
    if: inputs.target == 'raw58-compose'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore pinned shards and check the original parent theorem
        env:
          GH_TOKEN: ${{ github.token }}
          PINS: ${{ inputs.raw58_pins }}
        run: |
          set -euo pipefail
          root=im-results/agent4-raw58
          downloads=/tmp/a4-raw58-downloads
          union=/tmp/a4-raw58-union
          work=/tmp/a4-raw58-parent
          printf '%s' "$PINS" > /tmp/a4-raw58-pins.json
          python "$root/shard_plan.py" fetch /tmp/a4-raw58-pins.json "$downloads"
          python im-results/agent10-raw108/merge_resume.py "$downloads" "$union" "$root/shard_groups.json" /tmp/a4-raw58-pins.json
          python "$root/shard_plan.py" restore-data "$downloads"
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 \
            --precompiled-dir "$union" --precompiled-manifest "$union/manifest.json" \
            --manifest "$work/manifest.json" --label raw58 \
            --theorem BB6.Agent4Raw58MoreCut3.all_completions \
            --parent-table "1RB---_1RC---_0RD---_1LD1RE_---0RA_------" \
            --weighted-bound 19310 --artifact-name raw58-parent-proof \
            --provenance-input "$root/shard_groups.json" --provenance-input "$root/shard_plan.py" \
            --provenance-input "$union/manifest.json" \
            "$root/Raw58MoreCut3.lean" 2>&1 | tee /tmp/a4-raw58-parent.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a4-raw58-parent.log BB6.Agent4Raw58MoreCut3.all_completions
          python - "$work/manifest.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          new = {"Raw58LFData", "Raw58LF1Data", "Raw58MoreCut3"}
          expected = {item["module"] for item in m["modules"]} - new
          reused = set(m["precompiled_core"]["reused_modules"])
          if reused != expected:
              raise SystemExit(f"Unexpected reused/rebuilt dependency set: {sorted(reused ^ expected)}")
          PY
          cp /tmp/a4-raw58-parent.log "$work/audit.log"
          cp "$union/manifest.json" "$work/shard-union.json"
          cp -r "$union/original-shard-manifests" "$work/"
      - uses: actions/upload-artifact@v4
        with:
          name: raw58-parent-proof
          path: /tmp/a4-raw58-parent/
          retention-days: 30
