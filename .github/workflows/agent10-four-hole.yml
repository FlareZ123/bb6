          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 --manifest "$work/manifest.json" \
            --label "raw36-shard-$GROUP" --weighted-bound 1022 --artifact-name "raw36-shard-$GROUP" \
            --provenance-input "$root/candidate.json" --provenance-input "$root/search.cjs" \
            --provenance-input "$root/generate_corrected.py" --provenance-input "im-results/agent7-raw36-transfer/fixture.tsv.gz.b64" --provenance-input "im-results/agent7-raw36-transfer/sweep_recipes.jsonl" "${roots[@]}" 2>&1 | tee "/tmp/a29-raw36-shard-$GROUP.log"
          python im-results/agent4-raw109/audit_axioms.py "/tmp/a29-raw36-shard-$GROUP.log" "${proven[@]}"
          cp "/tmp/a29-raw36-shard-$GROUP.log" "$work/audit.log"
      - name: Retain source-checked Raw36 shard
        uses: actions/upload-artifact@v4
        with:
          name: raw36-shard-${{ matrix.group }}
          path: /tmp/a29-raw36-shard-${{ matrix.group }}/
          if-no-files-found: error
          retention-days: 30

  raw36-reclassify:
    if: inputs.target == 'raw36-reclassify'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Recompute the five-branch Raw36 candidate census after FAR soundness fix
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          root=im-results/agent29-raw36
          groups=('0 1 2 3 4' '6 7 8 9 10' '12 13 14 15 16' '18 19 20 21 22')
          read -ra children <<< "${groups[$GROUP]}"
          mkdir -p "/tmp/a29-raw36-corrected-$GROUP"
          node "$root/reclassify.cjs" "/tmp/a29-raw36-corrected-$GROUP/census.jsonl" "${children[@]}" \
            | tee "/tmp/a29-raw36-corrected-$GROUP/summary.log"
      - name: Retain corrected Raw36 census (not a Lean certificate)
        uses: actions/upload-artifact@v4
        with:
          name: raw36-fixed-census-${{ matrix.group }}
          path: /tmp/a29-raw36-corrected-${{ matrix.group }}/
          if-no-files-found: error
          retention-days: 30

  raw36-far-discover:
    if: inputs.target == 'raw36-far-discover'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Discover corrected FAR certificates for formerly invalid Raw36 leaves
        run: |
          set -euo pipefail
          mkdir -p /tmp/a29-raw36-far-recovery
          node im-results/agent29-raw36/recover_far.cjs \
            /tmp/a29-raw36-far-recovery/recovery.json 4 \
            | tee /tmp/a29-raw36-far-recovery/recovery.log
      - name: Retain sound candidate FAR recovery evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw36-corrected-far-recovery
          path: /tmp/a29-raw36-far-recovery/
          retention-days: 30

  raw36-witness:
    if: inputs.target == 'raw36-witness'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact 1RE halter and independently simulate blank tape
        run: |
          set -euo pipefail
          mkdir -p /tmp/a29-raw36-witness
          node im-results/agent29-raw36/extract_halt.cjs 22 1022 \
            /tmp/a29-raw36-witness/1re-halter.json \
            | tee /tmp/a29-raw36-witness/witness.log
      - uses: actions/upload-artifact@v4
        with:
          name: raw36-1re-halter
          path: /tmp/a29-raw36-witness/
          if-no-files-found: error
          retention-days: 30

  raw36-open-depth:
    if: inputs.target == 'raw36-open-depth'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Classify the 393 corrected OPEN leaves at 6000 steps
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          mkdir -p "/tmp/a29-raw36-depth-$GROUP"
          node im-results/agent29-raw36/open_depth.cjs \
            "/tmp/a29-raw36-depth-$GROUP/depth.json" "$GROUP" \
            | tee "/tmp/a29-raw36-depth-$GROUP/summary.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw36-corrected-depth-${{ matrix.group }}
          path: /tmp/a29-raw36-depth-${{ matrix.group }}/
          retention-days: 30

  raw36-scan-long:
    if: inputs.target == 'raw36-scan-long'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: One-million-step direct blank simulation of corrected Raw36 residuals
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          mkdir -p "/tmp/a29-raw36-scan-$GROUP"
          node --max-old-space-size=4096 im-results/agent29-raw36/scan_long_halts.cjs \
            "/tmp/a29-raw36-scan-$GROUP/replay.json" "$GROUP" 1000000 \
            | tee "/tmp/a29-raw36-scan-$GROUP/summary.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw36-corrected-longreplay-${{ matrix.group }}
          path: /tmp/a29-raw36-scan-${{ matrix.group }}/
          retention-days: 30
