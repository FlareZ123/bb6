name: Agent 10 twelve-cylinder weighted frontier
run-name: ${{ inputs.target }} raw43=${{ inputs.raw43_extra_child }} child=${{ inputs.raw58_child }} groups=${{ inputs.raw58_groups }} automata_id=${{ inputs.raw58_automata_id }} raw112_run_id=${{ inputs.raw112_run_id }} source=${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [raw36-pilot, raw36-shards, raw36-reclassify, raw36-far-discover, raw36-witness, raw36-counterexample, raw36-open-depth, raw36-scan-long, twelve, five-hole, recursive, raw107-witness, raw121-witness, raw121-membership, raw107-child, raw107-child-chunked, raw107-root-cut, raw107-parent, raw108-root-cut, raw108-witness, raw108-counter, raw108-gap, raw108-long, raw108-le-trace, raw108-block10-core, raw108-block895, raw108-block895-narrow, raw108-split1930-narrow, raw108-lb0, raw108-lb0-reuse, raw108-weight-core, cached-audit-core, raw108-sharded, raw108-resume, raw108-selected, raw108-compose, raw108-child, raw108-graft, raw119-shard, raw119-compose, raw113-shard, raw113-compose, raw43-child, raw43-0rd, raw43-parent-cut, raw43-parent-reuse, raw43-1rd-growth, raw43-hard-pair, raw43-1rd, raw43-extra, raw43-b1rc-cut, raw43-b1rc-compose, raw43-b0rc-compose, raw43-b0ra-compose, raw43-b0la-compose, raw43-b0le-reduced, raw43-b1la-reduced, raw43-b1ra-compose, raw43-b1lb-compose, raw43-b1le-compose, raw43-b1re-compose, raw43-b1la-compose, raw43-b0le-discover, raw43-b0le-m177, raw43-b0le-m81-discover, raw43-b0le-abstract, raw43-b0le-deep, raw43-b0le-m81-abstract, raw43-b0le-e1rf-complete, raw43-b0le-late-cycle, raw43-b0le-lb746, raw43-b0le-lf746, raw43-b0le-lf-triple, raw83-exact, raw58-cut, raw58-more, raw58-more2, raw58-more3, raw58-rc, raw58-child, raw58-late, raw58-automata, raw58-shard, raw58-prepare, raw58-compose, canonical62-preflight, canonical62-raw112-raw58, raw109-cut, raw109-refine, raw109-refine6, raw109-refine7, raw109-refine8, raw109-refine9, raw109-refine12, raw109-final-leaves, raw109-closed, raw109-sharded]
        default: twelve
      raw36_child:
        description: 'C1 move index 0..23 for the Raw36 six-hole child audit (F-targets are symmetry aliases)'
        type: string
        default: '1'
      raw43_extra_child:
        description: 'Raw43 E1 sibling variant'
        type: string
        default: '0re'
      raw43_b1rc_pins:
        description: 'JSON map child suffixes to successful exact Raw43 child run IDs'
        type: string
        default: '{}'
      raw108_groups:
        description: 'JSON list of individual Raw108 groups to certify'
        type: string
        default: '["le0"]'
      raw108_pins:
        description: 'JSON per-group run_id and full revision pins for raw108-compose'
        type: string
        default: '{}'
      raw108_child:
        type: string
        default: 1LC
      raw58_groups:
        description: 'JSON list of disjoint Raw58 proof shard groups'
        type: string
        default: '["lf-a","lf-b","lf-c"]'
      raw58_pins:
        description: 'JSON group to run_id and 40-character source revision for Raw58 composition'
        type: string
        default: '{}'
      raw58_child:
        type: choice
        options: [LA1, LB1, RF1, LE, LF, RF, LE1, LF1]
        default: LA1
      raw58_automata_id:
        description: 'Single Raw58 two-sided automata leaf index to source-audit'
        type: string
        default: '1181'
      raw112_run_id:
        description: 'Successful Raw112 closed-parent-cover producer run ID for Canonical62 integration'
        type: string
        default: ""
      raw107_witness:
        type: choice
        options: ['180', '1655', '1424', '385']
        default: '180'
      raw107_child:
        description: 'B1 action for an individual raw107 child source audit'
        type: choice
        options: [0RD, 0RC, 0RE, 1RE, 1LC, 1LE, 1LB, 0RF, 1RF, 0LE, 0LF, 1LF]
        default: 0LF
permissions:
  contents: read
  actions: read
jobs:
  check:
    if: inputs.target != 'raw36-scan-long' && inputs.target != 'raw36-open-depth' && inputs.target != 'raw36-witness' && inputs.target != 'raw36-far-discover' && inputs.target != 'raw36-reclassify' && inputs.target != 'raw36-shards' && inputs.target != 'raw109-sharded' && inputs.target != 'raw108-sharded' && inputs.target != 'raw108-resume' && inputs.target != 'raw108-selected' && inputs.target != 'raw108-lb0' && inputs.target != 'raw108-lb0-reuse' && inputs.target != 'raw108-compose' && inputs.target != 'raw58-shard' && inputs.target != 'raw58-prepare' && inputs.target != 'raw58-compose' && inputs.target != 'raw119-shard' && inputs.target != 'raw119-compose' && inputs.target != 'raw113-shard' && inputs.target != 'raw113-compose' && inputs.target != 'canonical62-raw112-raw58' && inputs.target != 'canonical62-preflight'
    runs-on: ubuntu-latest
    # Raw58 child and parent closures can exceed 60m; use 2 Lean workers for child audits to reduce runner pressure.
    timeout-minutes: ${{ (inputs.target == 'raw58-child' || inputs.target == 'raw58-more3' || inputs.target == 'raw58-automata') && 120 || 60 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check Raw36 canonical cut, E/F symmetry and selected child
        if: inputs.target == 'raw36-pilot'
        env:
          CHILD: ${{ inputs.raw36_child }}
        run: |
          set -euo pipefail
          [[ "$CHILD" =~ ^(0|[1-9]|1[0-9]|2[0-3])$ ]]
          [[ $((CHILD % 6)) != 5 ]] || { echo "F target covered by the E/F source bridge"; exit 1; }
          printf -v kid 'kid%02d' "$CHILD"
          printf -v module 'Raw36Kid%02d' "$CHILD"
          root=im-results/agent29-raw36
          work=/tmp/a29-raw36-pilot
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python "$root/generate.py" "$CHILD"
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 --manifest "$work/manifest.json" --label raw36-pilot --theorem "BB6.Agent29Raw36.${kid}_bound" --weighted-bound 162 --artifact-name raw36-pilot-proof --provenance-input "$root/candidate.json" --provenance-input "$root/search.cjs" --provenance-input "$root/generate.py" "$root/${module}.lean" "$root/Raw36D1Fifteen.lean" 2>&1 | tee /tmp/a29-raw36.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a29-raw36.log BB6.Agent29Raw36.cover "BB6.Agent29Raw36.${kid}_bound" BB6.Agent29Raw36.childF_to_E BB6.Agent29Raw36.childF_bound BB6.Agent29Raw36.branch_bound_from_twenty BB6.Agent29Raw36.branch_cover_from_twenty BB6.Agent29Raw36.d1_bound_from_twenty BB6.Agent29Raw36.b1Audit_checked BB6.Agent29Raw36.d1_bound_from_fifteen BB6.Agent29Raw36.d1_cover_from_fifteen
          cp /tmp/a29-raw36.log "$work/audit.log"
      - name: Certify an explicit 1016-step Raw36 halter and refute bound 162
        if: inputs.target == 'raw36-counterexample'
        run: |
          set -euo pipefail
          root=im-results/agent29-raw36
          work=/tmp/a29-raw36-counterexample
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 --manifest "$work/manifest.json" \
            --label raw36-counterexample --theorem BB6.Agent29Raw36SharpCounterexample.no_branch_bound_162 \
            --artifact-name raw36-counterexample-source "$root/Raw36SharpCounterexample.lean" \
            2>&1 | tee /tmp/a29-raw36-counterexample.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a29-raw36-counterexample.log \
            BB6.Agent29Raw36SharpCounterexample.final_query \
            BB6.Agent29Raw36SharpCounterexample.witness_halts \
            BB6.Agent29Raw36SharpCounterexample.branch_lower_bound \
            BB6.Agent29Raw36SharpCounterexample.no_branch_bound_162
          cp /tmp/a29-raw36-counterexample.log "$work/audit.log"
      - name: Retain original-source Raw36 counterexample
        if: inputs.target == 'raw36-counterexample'
        uses: actions/upload-artifact@v4
        with:
          name: raw36-counterexample-source
          path: /tmp/a29-raw36-counterexample/
          if-no-files-found: error
          retention-days: 30
      - name: Retain Raw36 pilot proof
        if: inputs.target == 'raw36-pilot'
        uses: actions/upload-artifact@v4
        with:
          name: raw36-pilot-proof
          path: /tmp/a29-raw36-pilot/
          retention-days: 30
      - name: Check Raw43 B0LE E1LB i746 blank-left drift
        if: inputs.target == 'raw43-b0le-lb746'
        run: |
          set -euo pipefail
          root=im-results/agent25-raw43
          work=/tmp/a25-b0le-lb746
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" --label raw43-b0le-lb746 \
            --theorem BB6.Agent25Raw43B0LEE1LBI746.never \
            --artifact-name raw43-b0le-lb746-proof \
            "$root/Raw43B0LEE1LBI746.lean" 2>&1 | tee /tmp/a25-b0le-lb746.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a25-b0le-lb746.log BB6.Agent25Raw43B0LEE1LBI746.first BB6.Agent25Raw43B0LEE1LBI746.growth BB6.Agent25Raw43B0LEE1LBI746.never
          cp /tmp/a25-b0le-lb746.log "$work/audit.log"
      - name: Retain Raw43 B0LE E1LB i746 proof
        if: inputs.target == 'raw43-b0le-lb746'
        uses: actions/upload-artifact@v4
        with:
          name: raw43-b0le-lb746-proof
          path: /tmp/a25-b0le-lb746/
          retention-days: 30
      - name: Check Raw43 B0LE E1LF i746 four-digit counter
        if: inputs.target == 'raw43-b0le-lf746'
        run: |
          set -euo pipefail
          root=im-results/agent25-raw43
          work=/tmp/a25-b0le-lf746
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" --label raw43-b0le-lf746 \
            --theorem BB6.Agent25Raw43B0LEE1LFI746.never \
            --artifact-name raw43-b0le-lf746-proof \
            "$root/Raw43B0LEE1LFI746.lean" 2>&1 | tee /tmp/a25-b0le-lf746.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a25-b0le-lf746.log BB6.Agent25Raw43B0LEE1LFI746.live BB6.Agent25Raw43B0LEE1LFI746.never
          cp /tmp/a25-b0le-lf746.log "$work/audit.log"
      - name: Retain Raw43 B0LE E1LF i746 proof
        if: inputs.target == 'raw43-b0le-lf746'
        uses: actions/upload-artifact@v4
        with:
          name: raw43-b0le-lf746-proof
          path: /tmp/a25-b0le-lf746/
          retention-days: 30
      - name: Check Raw43 B0LE E1LF triple binary counter
        if: inputs.target == 'raw43-b0le-lf-triple'
        run: |
          set -euo pipefail
          root=im-results/agent25-raw43
          work=/tmp/a25-b0le-lf-triple
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" --label raw43-b0le-lf-triple \
            --theorem BB6.Agent25Raw43B0LEE1LFTriple.never \
            --artifact-name raw43-b0le-lf-triple-proof \
            "$root/Raw43B0LEE1LFTriple.lean" 2>&1 | tee /tmp/a25-b0le-lf-triple.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a25-b0le-lf-triple.log BB6.Agent25Raw43B0LEE1LFTriple.live BB6.Agent25Raw43B0LEE1LFTriple.never
          cp /tmp/a25-b0le-lf-triple.log "$work/audit.log"
      - name: Retain Raw43 B0LE E1LF triple proof
        if: inputs.target == 'raw43-b0le-lf-triple'
        uses: actions/upload-artifact@v4
        with:
          name: raw43-b0le-lf-triple-proof
          path: /tmp/a25-b0le-lf-triple/
          retention-days: 30
      - name: Probe extended shift cycles in a Raw43 B0LE survivor
        if: inputs.target == 'raw43-b0le-late-cycle'
        env:
          CASE: ${{ inputs.raw43_extra_child }}
        run: |
          set -euo pipefail
          [[ "$CASE" =~ ^(la31|la44|la62|lb746|lf330|lf331|lf396|lf746)$ ]]
          node im-results/agent25-raw43/late_classify_b0le.js "$CASE" 1000000 256 | tee "/tmp/a25-late-$CASE.json"
      - name: Retain Raw43 B0LE late-cycle probe
        if: inputs.target == 'raw43-b0le-late-cycle'
        uses: actions/upload-artifact@v4
        with:
          name: raw43-b0le-late-${{ inputs.raw43_extra_child }}
          path: /tmp/a25-late-*.json
          retention-days: 30
      - name: Certify complete Raw43 B0LE E1RF child
        if: inputs.target == 'raw43-b0le-e1rf-complete'
        run: |
          set -euo pipefail
          root=im-results/agent25-raw43
          work=/tmp/a25-b0le-e1rf-complete
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          node "$root/search_m81_abstract.js" chunk | tee /tmp/a25-m81-search.log
          tail -n 1 /tmp/a25-m81-search.log > /tmp/a25-m81-result.json
          node - "$root/spec_b0le_e1rf.json" /tmp/a25-m81-result.json <<'NODE'
          const fs=require("fs");
          const spec=process.argv[2], result=process.argv[3];
          const j=JSON.parse(fs.readFileSync(spec,"utf8"));
          const z=JSON.parse(fs.readFileSync(result,"utf8"));
          if(z.status!=="ok") throw new Error("M81 abstraction search failed");
          const row=j.unresolved.find(x=>x.i===81);
          if(!row) throw new Error("M81 row missing");
          j.bidfa ||= {};
          j.bidfa["81"]={table:row.table,status:"ok",dfa:z.dfa,states:z.states,edges:z.edges,params:[z.left,z.right],kind:z.kind};
          j.unresolved=j.unresolved.filter(x=>x.i!==81);
          fs.writeFileSync(spec,JSON.stringify(j,null,2)+"\n");
          NODE
          python "$root/generate.py" b0le_e1rf
          bound=$(python -c 'import json;print(json.load(open("im-results/agent25-raw43/spec_b0le_e1rf.json"))["bound"])')
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 \
            --override FastBiDFA=im-results/agent32-raw59/FastBiDFA.lean \
            --manifest "$work/manifest.json" --label raw43-b0le-e1rf-complete \
            --theorem BB6.Agent25Raw43B0LE_E1RF.all43child --weighted-bound "$bound" \
            --artifact-name raw43-extra-proof \
            --provenance-input "$root/spec_b0le_e1rf.json" --provenance-input "$root/search_m81_abstract.js" \
            --provenance-input "$root/generate.py" \
            "$root/generated_b0le_e1rf/Raw43B0LE_E1RFData.lean" 2>&1 | tee /tmp/a25-b0le-e1rf.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a25-b0le-e1rf.log BB6.Agent25Raw43B0LE_E1RF.all43child BB6.Agent25Raw43B0LEE1RFM177.never
          cp /tmp/a25-b0le-e1rf.log "$work/audit.log"
          cp /tmp/a25-m81-search.log "$work/"
      - name: Retain complete Raw43 B0LE E1RF child
        if: inputs.target == 'raw43-b0le-e1rf-complete'
        uses: actions/upload-artifact@v4
        with:
          name: raw43-extra-proof
          path: /tmp/a25-b0le-e1rf-complete/
          retention-days: 30
      - name: Search asymmetric abstractions for Raw43 B0LE M81
        if: inputs.target == 'raw43-b0le-m81-abstract'
        env:
          FAMILY: ${{ inputs.raw43_extra_child }}
        run: |
          set -euo pipefail
          [[ "$FAMILY" =~ ^(run|lag|chunk|block)$ ]]
          node im-results/agent25-raw43/search_m81_abstract.js "$FAMILY" | tee "/tmp/a25-m81-$FAMILY.log"
      - name: Retain Raw43 M81 abstraction search
        if: inputs.target == 'raw43-b0le-m81-abstract'
        uses: actions/upload-artifact@v4
        with:
          name: raw43-b0le-m81-abstract-${{ inputs.raw43_extra_child }}
          path: /tmp/a25-m81-*.log
          retention-days: 30
      - name: Deep finite-state abstraction over a Raw43 B0LE residual bank
        if: inputs.target == 'raw43-b0le-deep'
        env:
          VARIANT: ${{ inputs.raw43_extra_child }}
        run: |
          set -euo pipefail
          [[ "$VARIANT" =~ ^(1la|1lb|1lf)$ ]]
          mkdir -p /tmp/a25-b0le-deep
          if [ "$VARIANT" = 1lf ]; then
            node im-results/agent25-raw43/discover_b0le_residual.js "$VARIANT" /tmp/a25-b0le-deep/base.json
          else
            cp "im-results/agent25-raw43/spec_b0le_e$VARIANT.json" /tmp/a25-b0le-deep/base.json
          fi
          node im-results/agent25-raw43/abstract_b0le.js "$VARIANT" /tmp/a25-b0le-deep/base.json /tmp/a25-b0le-deep/abstract.json
          node im-results/agent25-raw43/deep_abstract_b0le.js /tmp/a25-b0le-deep/abstract.json "/tmp/a25-b0le-deep/spec_b0le_e$VARIANT.json"
      - name: Retain Raw43 B0LE deep abstraction
        if: inputs.target == 'raw43-b0le-deep'
        uses: actions/upload-artifact@v4
        with:
          name: raw43-b0le-deep-${{ inputs.raw43_extra_child }}
          path: /tmp/a25-b0le-deep/
          retention-days: 30
      - name: Batch finite-state abstraction over a Raw43 B0LE residual bank
        if: inputs.target == 'raw43-b0le-abstract'
        env:
          VARIANT: ${{ inputs.raw43_extra_child }}
        run: |
          set -euo pipefail
          [[ "$VARIANT" =~ ^(1la|1lb|1rf)$ ]]
          mkdir -p /tmp/a25-b0le-abstract
          node im-results/agent25-raw43/abstract_b0le.js "$VARIANT" \
            "im-results/agent25-raw43/spec_b0le_e$VARIANT.json" \
            "/tmp/a25-b0le-abstract/spec_b0le_e$VARIANT.json"
      - name: Retain Raw43 B0LE abstracted census
        if: inputs.target == 'raw43-b0le-abstract'
        uses: actions/upload-artifact@v4
        with:
          name: raw43-b0le-abstract-${{ inputs.raw43_extra_child }}
          path: /tmp/a25-b0le-abstract/
          retention-days: 30
      - name: Discover and check Raw43 B0LE E1RF M81 symbolic sweep
        if: inputs.target == 'raw43-b0le-m81-discover'
        run: |
          set -euo pipefail
          root=im-results/agent25-raw43
          work=/tmp/a25-b0le-m81
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python "$root/discover_m81.py" "$root/Raw43B0LEE1RFM81Auto.lean"
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" --label raw43-b0le-m81 \
            --theorem BB6.Agent25Raw43B0LEE1RFM81Auto.M81.never \
            --artifact-name raw43-b0le-m81-proof \
            "$root/Raw43B0LEE1RFM81Auto.lean" 2>&1 | tee /tmp/a25-b0le-m81.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a25-b0le-m81.log BB6.Agent25Raw43B0LEE1RFM81Auto.M81.never
          cp "$root/Raw43B0LEE1RFM81Auto.lean" "$work/"
          cp /tmp/a25-b0le-m81.log "$work/audit.log"
      - name: Retain Raw43 B0LE M81 proof
        if: inputs.target == 'raw43-b0le-m81-discover'
        uses: actions/upload-artifact@v4
        with:
          name: raw43-b0le-m81-proof
          path: /tmp/a25-b0le-m81/
          retention-days: 30
      - name: Check Raw43 B0LE E1RF M177 alternating sweep
        if: inputs.target == 'raw43-b0le-m177'
        run: |
          set -euo pipefail
          root=im-results/agent25-raw43
          work=/tmp/a25-b0le-m177
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" --label raw43-b0le-m177 \
            --theorem BB6.Agent25Raw43B0LEE1RFM177.never \
            --artifact-name raw43-b0le-m177-proof \
            "$root/Raw43B0LEE1RFM177.lean" 2>&1 | tee /tmp/a25-b0le-m177.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a25-b0le-m177.log BB6.Agent25Raw43B0LEE1RFM177.growth BB6.Agent25Raw43B0LEE1RFM177.never
          cp /tmp/a25-b0le-m177.log "$work/audit.log"
      - name: Retain Raw43 B0LE M177 proof
        if: inputs.target == 'raw43-b0le-m177'
        uses: actions/upload-artifact@v4
        with:
          name: raw43-b0le-m177-proof
          path: /tmp/a25-b0le-m177/
          retention-days: 30
      - name: Discover one unresolved Raw43 B0LE E0 cylinder
        if: inputs.target == 'raw43-b0le-discover'
        env:
          VARIANT: ${{ inputs.raw43_extra_child }}
        run: |
          set -euo pipefail
          [[ "$VARIANT" =~ ^(0la|0lf|1la|1lb|1le|1lf|1ra|1rf)$ ]]
          mkdir -p /tmp/a25-b0le-discover
          node im-results/agent25-raw43/discover_b0le_residual.js "$VARIANT" "/tmp/a25-b0le-discover/spec_b0le_e$VARIANT.json"
      - name: Retain Raw43 B0LE discovery census
        if: inputs.target == 'raw43-b0le-discover'
        uses: actions/upload-artifact@v4
        with:
          name: raw43-b0le-discovery-${{ inputs.raw43_extra_child }}
          path: /tmp/a25-b0le-discover/
          retention-days: 30
