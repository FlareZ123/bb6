          expected = {item["module"] for item in manifest["modules"]} - {"Raw109Closed"}
          if set(reused) != expected:
              raise SystemExit(f"Unexpected rebuilt dependencies: {sorted(expected - set(reused))}")
          print(f"Reused all {len(expected)} audited dependencies")
          PY
          cp /tmp/a4-raw109-parent.log "$work/audit.log"
