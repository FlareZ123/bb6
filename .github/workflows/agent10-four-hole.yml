          work=/tmp/a4-raw109-parent
          python "$root/merge_shards.py" /tmp/a4-raw109-shards "$union"
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 \
            --precompiled-dir "$union" --precompiled-manifest "$union/manifest.json" \
            --manifest "$work/manifest.json" --label raw109 \
            --theorem BB6.Agent4Raw109Closed.all_closed \
            --parent-table "1RB---_1RC---_0RD---_1LD1RE_---1RB_------" \
            --weighted-bound 1703 --artifact-name raw109-parent-proof \
            --provenance-input "$root/specs.json" --provenance-input "$root/generate.py" \
            --provenance-input "$root/merge_shards.py" --provenance-input "$union/manifest.json" \
            "$root/Raw109Closed.lean" 2>&1 | tee /tmp/a4-raw109-parent.log
