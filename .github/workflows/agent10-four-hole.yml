            --precompiled-dir "$union" --precompiled-manifest "$union/manifest.json" \
            --manifest "$work/manifest.json" --label raw58 \
            --theorem BB6.Agent4Raw58Exact.all_completions \
            --parent-table "1RB---_1RC---_0RD---_1LD1RE_---0RA_------" \
            --weighted-bound 3055746 --artifact-name raw58-parent-proof \
            --provenance-input "$root/shard_groups.json" --provenance-input "$root/shard_plan.py" \
            --provenance-input "$union/manifest.json" --provenance-input "$root/gen_lf1_weights.py" \
            "$root/Raw58MoreCut3.lean" "$root/Raw58Exact.lean" "$root/ZipWeightExact.lean" 2>&1 | tee /tmp/a4-raw58-parent.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a4-raw58-parent.log BB6.Agent4Raw58MoreCut3.all_completions BB6.Agent4Raw58Exact.all_completions BB6.Agent4Raw58Exact.raw58_bound_exact BB6.Agent4Raw58Exact.coverRaw58 BB6.Agent4ZipWeightTighten.weights_exact
          python - "$work/manifest.json" <<'PY'
