name: Agent 10 twelve-cylinder weighted frontier
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [twelve, five-hole, recursive, raw107-witness, raw121-witness, raw121-membership, raw107-child, raw107-child-chunked, raw107-root-cut, raw107-parent, raw108-root-cut, raw108-witness, raw108-counter, raw108-gap, raw108-long, raw108-le-trace, raw108-sharded, raw108-child, raw108-graft, raw58-cut, raw58-more, raw58-more2, raw58-more3, raw58-rc, raw58-child, raw109-cut, raw109-refine, raw109-refine6, raw109-refine7, raw109-refine8, raw109-refine9, raw109-refine12, raw109-final-leaves, raw109-closed, raw109-sharded]
        default: twelve
      raw108_child:
        type: string
        default: 1LC
      raw58_child:
        type: choice
        options: [LA1, LB1, RF1, LE, LF, RF, LE1, LF1]
        default: LA1
      raw107_witness:
        type: choice
        options: ['180', '1655', '1424', '385']
        default: '180'
      raw107_child:
        description: 'B1 action for an individual raw107 child source audit'
        type: choice
        options: [0RD, 0RC, 0RE, 1RE, 1LC, 1LE, 1LB, 0RF, 1RF, 0LE, 0LF, 1LF]
        default: 0LF
permissions:
  contents: read
jobs:
  check:
    if: inputs.target != 'raw109-sharded' && inputs.target != 'raw108-sharded'
    runs-on: ubuntu-latest
    # Raw58 child source closures can exceed 60m (e.g. 1LF run 45700751534); keep other targets at 60m.
    timeout-minutes: ${{ inputs.target == 'raw58-child' && 120 || 60 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate and check exact original-source twelve-cylinder closure
        if: inputs.target == 'twelve'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          python tools/lean_compile_closure.py --workdir /tmp/a10-twelve --jobs 4 im-results/agent10-tnf-multipump/AllTwelveRoster.lean | tee /tmp/a10-twelve.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-twelve.log; then
            exit 1
          fi
      - name: Check three five-hole source closures
        if: inputs.target == 'five-hole'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python tools/lean_compile_closure.py --workdir /tmp/a10-five --jobs 4 im-results/agent10-tnf-multipump/FiveHoleRoster.lean | tee /tmp/a10-five.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-five.log; then
            exit 1
          fi
      - name: Check recursive-counter five-hole source closures
        if: inputs.target == 'recursive'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-multipump/generate.py 69 73 78
          python tools/lean_compile_closure.py --workdir /tmp/a10-recursive --jobs 4 im-results/agent10-tnf-multipump/RecursiveRoster.lean | tee /tmp/a10-recursive.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-recursive.log; then
            exit 1
          fi
      - name: Verify four raw121 exceptional nonhalting witnesses
        if: inputs.target == 'raw121-witness'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir /tmp/a11-raw121-witness --jobs 2 im-results/agent11-raw121/Raw121Exceptions.lean | tee /tmp/a11-raw121-witness.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw121-witness.log; then exit 1; fi
      - name: Verify raw121 membership in the canonical78 residual roster
        if: inputs.target == 'raw121-membership'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 68 72 82
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          python tools/lean_compile_closure.py --workdir /tmp/a11-raw121-membership --jobs 4 im-results/agent11-raw121/Raw121CanonicalMembership.lean | tee /tmp/a11-raw121-membership.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw121-membership.log; then exit 1; fi
      - name: Verify raw107 original-machine nonhalting theorem
        if: inputs.target == 'raw107-witness'
        env:
          WITNESS: ${{ inputs.raw107_witness }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          case "$WITNESS" in
            180|1655|1424) module="Raw107LF${WITNESS}" ;;
            385) module=Raw107LA385 ;;
            *) exit 2 ;;
          esac
          python tools/lean_compile_closure.py --workdir /tmp/a10-raw107-witness --jobs 4 "im-results/agent11-raw107/${module}.lean" | tee /tmp/a10-raw107-witness.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-raw107-witness.log; then exit 1; fi
      - name: Verify one complete raw107 child against original source
        if: inputs.target == 'raw107-child' || inputs.target == 'raw107-child-chunked'
        env:
          CHILD: ${{ inputs.raw107_child }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          root=im-results/agent11-raw107
          case "$CHILD" in
            0RD) python "$root/generate.py"; module=Raw107RDData ;;
            0RC) python "$root/generate_rc.py"; module=Raw107RCData ;;
            0RE) python "$root/generate_re.py"; module=Raw107REData ;;
            1RE|1LC|1LE|1LB|0RF|1RF|0LE) python "$root/generate_more.py" "$CHILD"; module="Raw107B${CHILD}Data" ;;
            0LF) python "$root/generate_partial.py" 0LF; module=Raw107LF180Bridge ;;
            1LF) python "$root/generate_partial.py" 1LF; module=Raw107LFBridge ;;
            *) exit 2 ;;
          esac
          jobs=4
          if [[ "$TARGET" == raw107-child-chunked ]]; then
            case "$CHILD" in
              0RD) prefix=Raw107RD ;;
              0RC) prefix=Raw107RC ;;
              0RE) prefix=Raw107RE ;;
              *) prefix="Raw107B${CHILD}" ;;
            esac
            python im-results/agent10-tnf-multipump/chunk_checks.py "$root" "$prefix" --limit 180
            jobs=2
          fi
          python tools/lean_compile_closure.py --workdir /tmp/a10-raw107-child --jobs "$jobs" "$root/$module.lean" | tee /tmp/a10-raw107-child.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-raw107-child.log; then exit 1; fi
      - name: Check raw58 first-hole refinement
        if: inputs.target == 'raw58-cut'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent4-raw58/generate.py
          python tools/lean_compile_closure.py --workdir /tmp/a4-raw58 --jobs 4 im-results/agent4-raw58/Raw58Cut.lean | tee /tmp/a4-raw58.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a4-raw58.log; then exit 1; fi
      - name: Check raw58 three additional child closures
        if: inputs.target == 'raw58-more'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent4-raw58/generate.py
          python im-results/agent4-raw58/generate_more.py
          python tools/lean_compile_closure.py --workdir /tmp/a4-raw58-more --jobs 4 im-results/agent4-raw58/Raw58MoreCut.lean | tee /tmp/a4-raw58-more.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a4-raw58-more.log; then exit 1; fi
      - name: Check raw58 four-child composition and five-residual frontier
        if: inputs.target == 'raw58-more2'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          root=im-results/agent4-raw58
          python "$root/generate.py"
          python "$root/generate_more.py" RD LC1 RE1 RC LA1 LB1 RF1
          python tools/lean_compile_closure.py --workdir /tmp/a4-raw58-more2 --jobs 4 "$root/Raw58MoreCut2.lean" | tee /tmp/a4-raw58-more2.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a4-raw58-more2.log; then exit 1; fi
      - name: Check five remaining raw58 child cylinders at the global cutoff
        if: inputs.target == 'raw58-more3'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          root=im-results/agent4-raw58
          python "$root/generate.py"
          python "$root/generate_more.py" RD LC1 RE1 RC LA1 LB1 RF1 LE LF RF LE1 LF1
          python tools/lean_compile_closure.py --workdir /tmp/a4-raw58-more3 --jobs 4 "$root/Raw58MoreCut3.lean" | tee /tmp/a4-raw58-more3.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a4-raw58-more3.log; then exit 1; fi

      - name: Check the raw107 root split and eleven immediate side cycles
        if: inputs.target == 'raw107-root-cut'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir /tmp/a10-raw107-root --jobs 4 im-results/agent11-raw107/Raw107RootCut.lean | tee /tmp/a10-raw107-root.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-raw107-root.log; then exit 1; fi
      - name: Check raw107 parent closure and 123-cylinder roster graft at weighted bound 815
        if: inputs.target == 'raw107-parent'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          root=im-results/agent11-raw107
          python "$root/generate.py"
          python "$root/generate_rc.py"
          python "$root/generate_re.py"
          python "$root/generate_more.py" 1RE 1LC 1LE 1LB 0RF 1RF 0LE
          python "$root/generate_partial.py" 0LF 1LA 1LF
          for prefix in Raw107RD Raw107RC Raw107RE Raw107B1RE Raw107B1LC Raw107B1LE Raw107B1LB Raw107B0RF Raw107B1RF Raw107B0LE Raw107B0LF Raw107B1LA Raw107B1LF; do
            python im-results/agent10-tnf-multipump/chunk_checks.py "$root" "$prefix" --limit 180
          done
          python tools/lean_compile_closure.py --workdir /tmp/a10-raw107-parent --jobs 2 "$root/Raw107RosterBridge.lean" | tee /tmp/a10-raw107-parent.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-raw107-parent.log; then exit 1; fi
      - name: Check raw58 0RC child closure and exact counter recurrences
        if: inputs.target == 'raw58-rc'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent4-raw58/generate_more.py RC
          python tools/lean_compile_closure.py --workdir /tmp/a4-raw58-rc --jobs 4 im-results/agent4-raw58/Raw58RCData.lean | tee /tmp/a4-raw58-rc.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a4-raw58-rc.log; then exit 1; fi
      - name: Check individual raw58 child
        if: inputs.target == 'raw58-child'
        env:
          CHILD: ${{ inputs.raw58_child }}
          RAW58_DIAG: "1"
          RAW58_RLE_SEARCH: "1"
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          root=im-results/agent4-raw58
          python "$root/generate_more.py" "$CHILD"
          python tools/lean_compile_closure.py --workdir /tmp/a4-raw58-child --jobs 4 "$root/Raw58${CHILD}Data.lean" | tee /tmp/a4-raw58-child.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a4-raw58-child.log; then exit 1; fi
      - name: Check raw108 root first-hole split
        if: inputs.target == 'raw108-root-cut'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir /tmp/a10-raw108-root --jobs 4 im-results/agent10-raw108/Raw108RootCut.lean | tee /tmp/a10-raw108-root.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-raw108-root.log; then exit 1; fi
      - name: Check raw108 individual five-hole child
        if: inputs.target == 'raw108-child'
        env:
          CHILD: ${{ inputs.raw108_child }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          root=im-results/agent10-raw108
          python "$root/generate.py" "$CHILD"
          python im-results/agent10-tnf-multipump/chunk_checks.py "$root" "Raw108B$CHILD" --limit 180
          python tools/lean_compile_closure.py --workdir /tmp/a10-raw108-child --jobs 2 "$root/Raw108B${CHILD}Data.lean" | tee /tmp/a10-raw108-child.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-raw108-child.log; then exit 1; fi

      - name: Compose five source-accepted raw108 child closures into the parent cut
        if: inputs.target == 'raw108-graft'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          root=im-results/agent10-raw108
          children="0RD 0LC 1RC 1RD 0RE"
          python "$root/generate.py" $children
          for child in $children; do
            python im-results/agent10-tnf-multipump/chunk_checks.py "$root" "Raw108B$child" --limit 180
          done
          python tools/lean_compile_closure.py --workdir /tmp/a10-raw108-graft --jobs 2 "$root/Raw108FiveChildGraft.lean" | tee /tmp/a10-raw108-graft.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-raw108-graft.log; then exit 1; fi

      - name: Check raw109 B1=0LD and 0RE with complete root cut
        if: inputs.target == 'raw109-cut'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent4-raw109/generate.py 0LD 0RE
          python tools/lean_compile_closure.py --workdir /tmp/a4-raw109 --jobs 4 im-results/agent4-raw109/Raw109Cut.lean | tee /tmp/a4-raw109.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a4-raw109.log; then exit 1; fi

      - name: Check raw109 final inductive leaf certificates
        if: inputs.target == 'raw109-final-leaves'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir .tmp/a4-raw109-final --jobs 2 im-results/agent4-raw109/Raw109LF1200.lean im-results/agent4-raw109/Raw109LF1475.lean | tee /tmp/a4-raw109-final.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a4-raw109-final.log; then exit 1; fi

      - name: Check raw109 unconditional parent bound
        if: inputs.target == 'raw109-closed'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          root=im-results/agent4-raw109
          children="0LD 0RE 0LC 1RE 1LB 0RF 1RF 1LC 0LA 1LA 0RC 1LF 0LF"
          python "$root/generate.py" $children
          for child in $children; do
            python im-results/agent10-tnf-multipump/chunk_checks.py "$root" "Raw109B$child" --limit 180
          done
          python tools/lean_compile_closure.py --workdir .tmp/a4-raw109-closed --jobs 2 --manifest .tmp/a4-raw109-closed/manifest.json --label raw109 --theorem BB6.Agent4Raw109Closed.all_closed --parent-table "1RB---_1RC---_0RD---_1LD1RE_---1RB_------" --weighted-bound 1703 --artifact-name raw109-parent-proof --provenance-input "$root/specs.json" --provenance-input "$root/generate.py" "$root/Raw109Closed.lean" | tee /tmp/a4-raw109-closed.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a4-raw109-closed.log; then exit 1; fi

      - name: Upload raw109 parent proof manifest and compiled closure
        if: inputs.target == 'raw109-closed'
        uses: actions/upload-artifact@v4
        with:
          name: raw109-parent-proof
          path: .tmp/a4-raw109-closed/
          include-hidden-files: true
          retention-days: 14

      - name: Check raw109 four-child partition and canonical78 consumer
        if: inputs.target == 'raw109-refine' || inputs.target == 'raw109-refine6' || inputs.target == 'raw109-refine7' || inputs.target == 'raw109-refine8' || inputs.target == 'raw109-refine9' || inputs.target == 'raw109-refine12'
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 68 72 82
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          root=im-results/agent4-raw109
          children="0LD 0RE 0LC 1RE"
          module=Raw109Refinement
          if [ "$TARGET" = raw109-refine6 ]; then children="$children 1LB 0RF"; module=Raw109Refinement6; fi
          if [ "$TARGET" = raw109-refine7 ]; then children="$children 1LB 0RF 1RF"; module=Raw109Refinement7; fi
          if [ "$TARGET" = raw109-refine8 ]; then children="$children 1LB 0RF 1RF 1LC"; module=Raw109Refinement8; fi
          if [ "$TARGET" = raw109-refine9 ]; then children="$children 1LB 0RF 1RF 1LC 0LA"; module=Raw109Refinement9; fi
          if [ "$TARGET" = raw109-refine12 ]; then children="$children 1LB 0RF 1RF 1LC 0LA 1LA 0RC 1LF"; module=Raw109Refinement12; fi
          python "$root/generate.py" $children
          for child in $children; do
            python im-results/agent10-tnf-multipump/chunk_checks.py "$root" "Raw109B$child" --limit 180
          done
          python tools/lean_compile_closure.py --workdir .tmp/a4-raw109-refine --jobs 2 "$root/$module.lean" | tee /tmp/a4-raw109-refine.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a4-raw109-refine.log; then exit 1; fi

      - name: Check raw108 0RC exceptional counter witnesses
        if: inputs.target == 'raw108-witness'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir .tmp/a10-raw108-witness --jobs 2 im-results/agent10-raw108/Raw108RC43.lean im-results/agent10-raw108/Raw108RC50.lean | tee /tmp/a10-raw108-witness.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-raw108-witness.log; then exit 1; fi

      - name: Check raw108 final 0LB gap-machine recurrence
        if: inputs.target == 'raw108-gap'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir .tmp/a10-raw108-gap --jobs 2 im-results/agent10-raw108/Raw108LB2822.lean | tee /tmp/a10-raw108-gap.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-raw108-gap.log; then exit 1; fi

      - name: Check compressed shared raw108 #1930 trajectories and source bridge
        if: inputs.target == 'raw108-long'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          root=im-results/agent10-raw108
          python "$root/generate_long_trace.py"
          python tools/lean_compile_closure.py --workdir .tmp/a10-raw108-long --jobs 1 "$root/Raw108LongAudit.lean" "$root/Raw108LongAttained.lean" im-results/agent10-tnf-multipump/ExactAuditWeight.lean | tee /tmp/a10-raw108-long.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-raw108-long.log; then exit 1; fi

      - name: Check packed pair-sweep traces against original zipper
        if: inputs.target == 'raw108-le-trace'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          root=im-results/agent10-raw108
          python "$root/generate_le_trace.py"
          python tools/lean_compile_closure.py --workdir /tmp/a10-raw108-le-trace --jobs 2 "$root/Raw108LEAudit.lean" | tee /tmp/a10-raw108-le-trace.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a10-raw108-le-trace.log BB6.Agent10Raw108LEFast.Afull BB6.Agent10Raw108LEFast.Bfull BB6.Agent10Raw108LEFast.fastRead_eq BB6.Agent10Raw108LEAudit.check_eq BB6.Agent10Raw108LEAudit.certifiedZip

      - name: Check raw108 0LE doubling counter witnesses
        if: inputs.target == 'raw108-counter'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent10-raw108/countergen.py
          python tools/lean_compile_closure.py --workdir .tmp/a10-raw108-counter --jobs 2 im-results/agent10-raw108/Raw108LE1279.lean im-results/agent10-raw108/Raw108LE1280.lean | tee /tmp/a10-raw108-counter.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-raw108-counter.log; then exit 1; fi

  raw109-shards:
