name: Agent 10 twelve-cylinder weighted frontier
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [twelve, five-hole, recursive, raw107-witness, raw107-child, raw58-cut]
        default: twelve
      raw107_child:
        description: 'B1 action for an individual raw107 child source audit'
        type: choice
        options: [0RD, 0RC, 0RE, 1RE, 1LC, 1LE, 1LB, 0RF, 1RF, 0LE, 0LF]
        default: 0LF
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate and check exact original-source twelve-cylinder closure
        if: inputs.target == 'twelve'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          python tools/lean_compile_closure.py --workdir /tmp/a10-twelve --jobs 4 im-results/agent10-tnf-multipump/AllTwelveRoster.lean | tee /tmp/a10-twelve.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-twelve.log; then
            exit 1
          fi
      - name: Check three five-hole source closures
        if: inputs.target == 'five-hole'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python tools/lean_compile_closure.py --workdir /tmp/a10-five --jobs 4 im-results/agent10-tnf-multipump/FiveHoleRoster.lean | tee /tmp/a10-five.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-five.log; then
            exit 1
          fi
      - name: Check recursive-counter five-hole source closures
        if: inputs.target == 'recursive'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-multipump/generate.py 69 73 78
          python tools/lean_compile_closure.py --workdir /tmp/a10-recursive --jobs 4 im-results/agent10-tnf-multipump/RecursiveRoster.lean | tee /tmp/a10-recursive.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-recursive.log; then
            exit 1
          fi
      - name: Verify raw107 0LF/180 original-machine nonhalting theorem
        if: inputs.target == 'raw107-witness'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir /tmp/a10-raw107-witness --jobs 4 im-results/agent11-raw107/Raw107LF180.lean | tee /tmp/a10-raw107-witness.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-raw107-witness.log; then exit 1; fi
      - name: Verify one complete raw107 child against original source
        if: inputs.target == 'raw107-child'
        env:
          CHILD: ${{ inputs.raw107_child }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          root=im-results/agent11-raw107
          case "$CHILD" in
            0RD) python "$root/generate.py"; module=Raw107RDData ;;
            0RC) python "$root/generate_rc.py"; module=Raw107RCData ;;
            0RE) python "$root/generate_re.py"; module=Raw107REData ;;
            1RE|1LC|1LE|1LB|0RF|1RF|0LE) python "$root/generate_more.py" "$CHILD"; module="Raw107B${CHILD}Data" ;;
            0LF) python "$root/generate_partial.py" 0LF; module=Raw107LF180Bridge ;;
            *) exit 2 ;;
          esac
          python tools/lean_compile_closure.py --workdir /tmp/a10-raw107-child --jobs 4 "$root/$module.lean" | tee /tmp/a10-raw107-child.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a10-raw107-child.log; then exit 1; fi
      - name: Check raw58 first-hole refinement
        if: inputs.target == 'raw58-cut'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent4-raw58/generate.py
          python tools/lean_compile_closure.py --workdir /tmp/a4-raw58 --jobs 4 im-results/agent4-raw58/Raw58Cut.lean | tee /tmp/a4-raw58.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a4-raw58.log; then exit 1; fi
