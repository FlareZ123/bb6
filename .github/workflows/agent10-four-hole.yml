        env:
          GH_TOKEN: ${{ github.token }}
          SHARD_PINS: ${{ inputs.raw108_pins }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, re, subprocess, sys
          root = pathlib.Path("im-results/agent10-raw108")
          sys.path.insert(0,str(root))
          from kid_plan import composition_config
          pins = json.loads(os.environ["SHARD_PINS"])
          config = composition_config(pins)
          pathlib.Path("/tmp/a10-raw108-compose-config.json").write_text(json.dumps(config))
          dest = pathlib.Path("/tmp/a10-raw108-shards")
          dest.mkdir()
          for group, pin in pins.items():
              run = str(pin["run_id"])
              rev = pin["revision"]
              assert re.fullmatch(r"[0-9]+", run)
              assert re.fullmatch(r"[0-9a-f]{40}", rev)
              metadata = json.loads(subprocess.check_output(
                  ["gh", "run", "view", run, "--json", "headSha"], text=True))
              assert metadata["headSha"] == rev, (group, metadata, pin)
              if subprocess.run(["git", "cat-file", "-e", rev+"^{commit}"]).returncode:
                  subprocess.run(["git", "fetch", "--no-tags", "origin", rev], check=True)
              artifact = config["artifact_prefix"] + "-" + group
              subprocess.run(["gh", "run", "download", run, "--name", artifact,
                              "--dir", str(dest / artifact)], check=True)
          pathlib.Path("/tmp/a10-raw108-pins.json").write_text(json.dumps(pins, indent=2))
          PY
      - name: Compose conservative parent proof from existing child certificates
