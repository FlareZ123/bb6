            --precompiled-dir "$union" --precompiled-manifest "$union/manifest.json" \
            --manifest "$work/manifest.json" --label raw108 \
            --theorem BB6.Agent10Raw108Closed.all_closed \
            --parent-table "1RB---_1RC---_0RD---_1LD1RE_---1LB_------" \
            --weighted-bound 4136180 --artifact-name raw108-parent-proof \
            --provenance-input "$root/shard_groups.json" \
            --provenance-input /tmp/a10-raw108-pins.json \
            --provenance-input "$union/manifest.json" \
            "$root/Raw108Closed.lean" 2>&1 | tee /tmp/a10-raw108-parent.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a10-raw108-parent.log BB6.Agent10Raw108Closed.all_closed
          python - "$work/manifest.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          groups = json.load(open("/tmp/a10-raw108-compose-config.json"))["groups"]
          new = {"Raw108Closed"} | {f"Raw108B0L{c}Data" for c in ("A","B") if f"l{c.lower()}0" not in groups}
          expected = {item["module"] for item in m["modules"]} - new
          reused = set(m["precompiled_core"]["reused_modules"])
          if reused != expected:
              raise SystemExit(f"Unexpected rebuilt dependencies: {sorted(expected - reused)}")
          print(f"Reused all {len(expected)} audited dependencies")
          PY
          cp /tmp/a10-raw108-parent.log "$work/audit.log"
          cp "$union/manifest.json" "$work/shard-union.json"
          cp -r "$union/original-shard-manifests" "$work/"
      - name: Retain conservative parent proof
        uses: actions/upload-artifact@v4
        with:
          name: raw108-parent-proof
          path: /tmp/a10-raw108-parent/
          retention-days: 30
