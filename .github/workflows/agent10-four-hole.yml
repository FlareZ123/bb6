  raw108-shards:
    if: inputs.target == 'raw108-selected' || inputs.target == 'raw108-sharded' || inputs.target == 'raw108-resume' || inputs.target == 'raw108-lb0' || inputs.target == 'raw108-lb0-reuse'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: ${{ fromJSON(inputs.target == 'raw108-selected' && inputs.raw108_groups || (inputs.target == 'raw108-lb0' || inputs.target == 'raw108-lb0-reuse') && '["lb0"]' || inputs.target == 'raw108-resume' && '["lb0","la0","medium1","medium2","le0"]' || '["lb0","la0","cut","small","medium1","medium2","lf1","le1","le0","lf0"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore accepted LB0 exceptional witnesses
        if: inputs.target == 'raw108-lb0-reuse' || matrix.group == 'lb0-b'
        env:
          GH_TOKEN: ${{ github.token }}
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          root=im-results/agent10-raw108
          dest=/tmp/a10-raw108-lb0-witnesses
          mkdir -p "$dest"
          if [[ "$GROUP" != lb0-c ]]; then gh run download 45719411601 --name raw108-block895 --dir "$dest/raw108-block895"; fi
          if [[ "$GROUP" != lb0-b ]]; then gh run download 45720878969 --name raw108-split1930-narrow --dir "$dest/raw108-split1930-narrow"; fi
          python - <<'PY'
          import json, os, pathlib, subprocess
          groups = {"block895": ["Raw108LBBlock895"], "split1930-narrow": [f"Raw108LBSplit1930Kid{i}" for i in (0,3,6,7,9,11,12,13,15,17,18,19,21,23)]}
          pins = {"block895": {"run_id": "45719411601", "revision": "f1ed25b2db3c4b1f2bc693fbc596248fa8159745"}, "split1930-narrow": {"run_id": "45720878969", "revision": "8313deb87693c888658d5b1e31f0c0189d4d2d8d"}}
          group = os.environ['GROUP']
          if group == 'lb0-b':
              del groups['split1930-narrow']; del pins['split1930-narrow']
          elif group == 'lb0-c':
              del groups['block895']; del pins['block895']
          for p in pins.values():
              rev = p["revision"]
              if subprocess.run(["git", "cat-file", "-e", rev+"^{commit}"]).returncode:
                  subprocess.run(["git", "fetch", "--no-tags", "origin", rev], check=True)
          pathlib.Path("/tmp/a10-lb0-witness-config.json").write_text(json.dumps({"artifact_prefix": "raw108", "groups": groups}))
          pathlib.Path("/tmp/a10-lb0-witness-pins.json").write_text(json.dumps(pins))
          PY
      - name: Certify original-source shard
        env:
          GROUP: ${{ matrix.group }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          root=im-results/agent10-raw108
          case "$GROUP" in
            cut) children="" ;;
            small) children="1LC 0RD 0LC 1RC 1RD 0RE" ;;
            medium1) children="0LD 1LA 0RC 0RA 1RA" ;;
            medium2) children="1RF 1LB 0RF" ;;
            lf1) children="1LF" ;;
            le1) children="1LE" ;;
            le0) children="0LE" ;;
            lf0) children="0LF" ;;
            la0|la0-*) children="0LA" ;;
            lb0|lb0-?) children="0LB" ;;
            *) exit 2 ;;
          esac
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          roots=()
          theorems=()
          if [ "$GROUP" = cut ]; then
            roots=("$root/Raw108RootCut.lean")
            theorems=("BB6.Agent10Raw108Root.parent_dichotomy")
          else
            python "$root/generate.py" $children
            if [[ "$GROUP" == la0-* || "$GROUP" == lb0-? ]]; then
              python "$root/kid_plan.py" prepare "$GROUP" /tmp/a10-kid-plan
              mapfile -t roots < /tmp/a10-kid-plan/roots.txt
              mapfile -t theorems < /tmp/a10-kid-plan/theorems.txt
            else
              for child in $children; do
                python im-results/agent10-tnf-multipump/chunk_checks.py "$root" "Raw108B$child" --limit 180
                roots+=("$root/Raw108B${child}Data.lean")
                theorems+=("BB6.Agent10Raw108B$child.all_completions")
              done
            fi
          fi
          work=/tmp/a10-raw108-shard
          reuse=()
          jobs=1
          if [[ "$GROUP" == la0-* || "$GROUP" == lb0-? ]]; then jobs=2; fi
          if [[ "$GROUP" == lb0-c || "$GROUP" == la0-a1 ]]; then jobs=1; fi
          if [ "$GROUP" = le0 ]; then
            theorems+=("BB6.Agent10Raw108LEFast.longestLE_halts" "BB6.Agent10Raw108LEFast.longestLE_delays" "BB6.Agent10Raw108LEFast.raw108LE_lower")
            jobs=2
          fi
          if [[ "$TARGET" == raw108-lb0-reuse || "$GROUP" == lb0-b ]]; then
            python "$root/merge_resume.py" /tmp/a10-raw108-lb0-witnesses /tmp/a10-lb0-witness-union /tmp/a10-lb0-witness-config.json /tmp/a10-lb0-witness-pins.json
            reuse=(--precompiled-dir /tmp/a10-lb0-witness-union --precompiled-manifest /tmp/a10-lb0-witness-union/manifest.json)
            jobs=2
          fi
          python tools/lean_compile_closure.py --workdir "$work" --jobs "$jobs" "${reuse[@]}" \
            --manifest "$work/manifest.json" --label "raw108-shard-$GROUP" \
            --artifact-name "raw108-shard-$GROUP" \
            --provenance-input "$root/specs.json" --provenance-input "$root/generate.py" \
            --provenance-input "$root/0LB-candidates.json.gz.b64" --provenance-input "$root/0LB-extra.json" \
            --provenance-input "$root/build_lb.py" --provenance-input "$root/generate_long_trace.py" \
            --provenance-input "$root/generate_le_trace.py" \
            --provenance-input "$root/kid_plan.py" \
            --provenance-input "$root/fast_kid.py" \
            --provenance-input "$root/block_witness.py" \
            --provenance-input im-results/agent13-block-far/emit_active.py \
            --provenance-input "$root/shard_groups.json" \
            --provenance-input im-results/agent10-tnf-multipump/chunk_checks.py \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            --provenance-input im-results/agent2-tnf-raw99/enumerate.cpp \
            "${roots[@]}" 2>&1 | tee /tmp/a10-raw108-shard.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a10-raw108-shard.log "${theorems[@]}"
          cp /tmp/a10-raw108-shard.log "$work/audit.log"
          if [ -d /tmp/a10-kid-plan ]; then cp /tmp/a10-kid-plan/* "$work/"; fi
          if [ "$TARGET" = raw108-lb0-reuse ]; then
            python - "$work/manifest.json" <<'PY'
          import json, sys
          m = json.load(open(sys.argv[1]))
          expected = {"Raw108LBBlock895"} | {f"Raw108LBSplit1930Kid{i}" for i in (0,3,6,7,9,11,12,13,15,17,18,19,21,23)}
          reused = set(m["precompiled_core"]["reused_modules"])
          if not expected <= reused:
              raise SystemExit(f"Accepted exceptional witness not reused: {sorted(expected-reused)}")
          PY
          fi
      - name: Retain certified shard
        uses: actions/upload-artifact@v4
        with:
          name: raw108-shard-${{ matrix.group }}
          path: /tmp/a10-raw108-shard/
          retention-days: 30
      - name: Tighten 0LB weighted cutoff using the accepted shard
        if: matrix.group == 'lb0' && (inputs.target == 'raw108-lb0' || inputs.target == 'raw108-lb0-reuse')
        run: |
          set -euo pipefail
          work=/tmp/a10-raw108-lb0-exact
          root=im-results/agent10-raw108
          python tools/lean_compile_closure.py --workdir "$work" --jobs 1 \
            --precompiled-dir /tmp/a10-raw108-shard --precompiled-manifest /tmp/a10-raw108-shard/manifest.json \
            --manifest "$work/manifest.json" --label raw108-lb0-exact \
            --theorem BB6.Agent10Raw108LBExact.exact_upper \
            --weighted-bound 4136175 --artifact-name raw108-lb0-exact \
            "$root/Raw108LBExact.lean" 2>&1 | tee /tmp/a10-raw108-lb0-exact.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a10-raw108-lb0-exact.log BB6.Agent10Raw108LBExact.exact_upper
          cp /tmp/a10-raw108-lb0-exact.log "$work/audit.log"
      - name: Retain tightened 0LB proof
        if: matrix.group == 'lb0' && (inputs.target == 'raw108-lb0' || inputs.target == 'raw108-lb0-reuse')
        uses: actions/upload-artifact@v4
        with:
          name: raw108-lb0-exact
          path: /tmp/a10-raw108-lb0-exact/
          retention-days: 30

  raw108-assemble:
