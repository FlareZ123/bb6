          new |= {f"Raw58LF1Kid{i:02}Weight" for i in range(24)}
          expected = {item["module"] for item in m["modules"]} - new
          reused = set(m["precompiled_core"]["reused_modules"])
          if reused != expected:
              raise SystemExit(f"Unexpected reused/rebuilt dependency set: {sorted(reused ^ expected)}")
