name: Agent 10 #746 level-deficit original-source audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-level-deficit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            if curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh &&
               sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2; then
              echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Compile exact source closure through the t=1 fatal-parent theorem
        run: |
          set -eu
          a="im-results/agent7-cascade-odd-fibers"
          b="im-results/agent10-cascade"
          r="im-results/agent44-746-rank"
          export LEAN_PATH="$a:$b:$r"
          lean --version
          for m in SourceMacro CascadeOdd ReverseResidue GapCore Mass; do
            lean -o "$a/$m.olean" "$a/$m.lean"
          done
          lean -o "$b/FirstReturnCore.olean" "$b/FirstReturnCore.lean"
          for m in LowGates SurvivingSmall WellInverseCases PreimageCandidates; do
            lean -o "$a/$m.olean" "$a/$m.lean"
          done
          for m in TerminalExit GapOddJoin SweepInvariant RootTerminal ResetAncestry FatalExclusion SmallFatal GateNecessary ExactGate; do
            lean -o "$b/$m.olean" "$b/$m.lean"
          done
          for m in ValuationDrain FullReturn ReturnInverseArithmetic ResetInverseWitnesses FirstOutcome FirstInverseComplete; do
            lean -o "$b/$m.olean" "$b/$m.lean"
          done
          lean -o "$b/ResetChain.olean" "$b/ResetChain.lean"
          lean -o "$r/LevelDeficitDynamics.olean" "$r/LevelDeficitDynamics.lean"
          lean -o "$b/T1QParentFatal.olean" "$b/T1QParentFatal.lean"
          cat > "$r/LevelDeficitAxiomAudit.lean" <<'EOF'
          import LevelDeficitDynamics
          import ResetChain
          import T1QParentFatal

          #print axioms CascadeLevelDeficit.first_fail_unique
          #print axioms CascadeLevelDeficit.even_deficit_halves
          #print axioms CascadeLevelDeficit.even_level_criterion
          #print axioms CascadeLevelDeficit.even_next_level
          #print axioms CascadeLevelDeficit.odd_reset_guards
          #print axioms CascadeLevelDeficit.odd_reset_level_increases
          #print axioms CascadeLevelDeficit.odd_offset_bounds
          #print axioms CascadeLevelDeficit.odd_offset_factorization
          #print axioms CascadeLevelDeficit.odd_output_equation_deficit
          #print axioms CascadeResetInverse.root_reset_chain_iff
          #print axioms CascadeResetInverse.cpath_has_reset_chain
          #print axioms CascadeResetInverse.reset_chain_to_cpath
          #print axioms Agent10T1Fatal.t1_child_deficit
          #print axioms Agent10T1Fatal.t1_q_parent_depth_gap
          #print axioms Agent10T1Fatal.t1_q_parent_depth_lt_level
          #print axioms Agent10T1Fatal.even_reset_chain_to_fatal
          #print axioms Agent10T1Fatal.root_t1_q_parent_fatal
          #print axioms Agent10T1Fatal.adjacent_fatal_source_exponent_le_one
          EOF
          lean "$r/LevelDeficitAxiomAudit.lean" 2>&1 | tee "$RUNNER_TEMP/level-deficit-axioms.log"
          if grep -q 'sorryAx' "$RUNNER_TEMP/level-deficit-axioms.log"; then
            echo "FAIL: sorryAx appears in the source theorem dependency profile."
            exit 1
          fi
          rm "$r/LevelDeficitAxiomAudit.lean"
          echo "PASS: exact checked-in source closure, t=1 fatal-parent theorem, and sorryAx-free axiom audit."
