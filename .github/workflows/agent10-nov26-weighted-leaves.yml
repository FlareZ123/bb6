name: November 26 Cryptids weighted leaves (manual)
on:
  workflow_dispatch:
    inputs:
      audit:
        type: choice
        options: [nonhalt, raw8, raw140, raw140-n20-local, raw140-n20-source, raw140-deep-local, raw140-root-local, raw140-block-local, raw140-three-hole-source, raw140-three-hole-all, raw140-canonical37]
        default: nonhalt
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and upstream source
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          if [[ "${{ inputs.audit }}" == "raw140-n20-local" || "${{ inputs.audit }}" == "raw140-deep-local" || "${{ inputs.audit }}" == "raw140-root-local" || "${{ inputs.audit }}" == "raw140-block-local" ]]; then exit 0; fi
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          git -C /tmp/cryptids checkout --quiet d1d231afe3a5f6310ac9f956d5687b5a45d7a13d
          test "$(git -C /tmp/cryptids rev-parse HEAD)" = "d1d231afe3a5f6310ac9f956d5687b5a45d7a13d"
      - name: Reclaim unused disk
        if: inputs.audit != 'raw140-n20-local' && inputs.audit != 'raw140-deep-local' && inputs.audit != 'raw140-root-local' && inputs.audit != 'raw140-block-local'
        run: sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
      - name: Build original proofs once
        if: inputs.audit != 'raw140-n20-local' && inputs.audit != 'raw140-deep-local' && inputs.audit != 'raw140-root-local' && inputs.audit != 'raw140-block-local'
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' leanprover/lean4:v4.36.0-rc2 > lean-toolchain
          sed -i 's/v4.35.0-rc4/v4.36.0-rc2/g' lakefile.toml
          rm -f lake-manifest.json
          lake update
          lake exe cache get
          if [[ "${{ inputs.audit }}" == "raw8" ]]; then
            lake build BusyBeaver.BB6.Halt.M_1RB1LE_0LC1RE_HHH1LD_0RD1LA_0RF1RF_1RA0LB
          elif [[ "${{ inputs.audit }}" == "raw140-n20-source" ]]; then
            lake build BusyBeaver.BB6.NonHalt.M_1RB1LA_1RC0LE_1RD0LF_0LA0RD_1LC0LE_HHH0RE
          elif [[ "${{ inputs.audit }}" == "raw140-three-hole-source" || "${{ inputs.audit }}" == "raw140-three-hole-all" || "${{ inputs.audit }}" == "raw140-canonical37" ]]; then
            lake build BusyBeaver.BB6.NonHalt.M_1RB0RA_1RC0RD_1RD0LC_1LE1RA_HHH1LF_1RB0LC BusyBeaver.BB6.NonHalt.M_1RB0RF_1RC0LD_1RD0RA_1LB1LE_0LB0RE_0RDHHH
          elif [[ "${{ inputs.audit }}" == "raw140" ]]; then
            mapfile -t modules < "$GITHUB_WORKSPACE/im-results/agent10-nov26-cryptids/raw140-upstream-modules.txt"
            test "${#modules[@]}" = 8
            lake build "${modules[@]}"
          else
            mapfile -t modules < <(python -c 'import json,sys; d=json.load(open(sys.argv[1])); print("\n".join("BusyBeaver.BB6.NonHalt.M_"+x["rle"] for x in d["rows"] if x["kind"]=="NonHalt"))' "$GITHUB_WORKSPACE/im-results/agent10-nov26-cryptids/manifest.json")
            test "${#modules[@]}" = 18
            lake build "${modules[@]}"
          fi
      - name: Check local Raw140 n20 finite siblings
        if: inputs.audit == 'raw140-n20-local'
        shell: bash
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          mkdir -p /tmp/nov26-axioms
          python tools/lean_compile_closure.py --workdir /tmp/raw140-n20 --jobs 2 im-results/agent10-nov26-cryptids/Raw140N20Parent.lean 2>&1 | tee /tmp/nov26-axioms/Raw140N20Parent.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/nov26-axioms/Raw140N20Parent.log BB6.Agent10Raw140N20.cover_of_source
      - name: Check closed deep Raw140 cylinders
        if: inputs.audit == 'raw140-deep-local' || inputs.audit == 'raw140-root-local'
        shell: bash
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent10-nov26-cryptids/generate_raw140_deep.py
          mkdir -p /tmp/nov26-axioms
          cp im-results/agent10-nov26-cryptids/raw140-deep-summary.json /tmp/nov26-axioms/
          if [[ "${{ inputs.audit }}" == "raw140-root-local" ]]; then
            python im-results/agent31-three-hole-tnf/generate_sweeps.py
            python im-results/agent31-three-hole-tnf/generate_four_hole.py
            python tools/lean_compile_closure.py --workdir /tmp/raw140-root --jobs 3 im-results/agent10-nov26-cryptids/Raw140RootDeep.lean 2>&1 | tee /tmp/nov26-axioms/Raw140RootDeep.log
            python im-results/agent4-raw109/audit_axioms.py /tmp/nov26-axioms/Raw140RootDeep.log BB6.Agent10Raw140.cover_after_deep
            exit 0
          fi
          python tools/lean_compile_closure.py --workdir /tmp/raw140-deep --jobs 3 im-results/agent10-nov26-cryptids/Raw140DeepCovers.lean 2>&1 | tee /tmp/nov26-axioms/Raw140DeepCovers.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/nov26-axioms/Raw140DeepCovers.log BB6.Agent10Raw140Deep.matches_sound
      - name: Check next Raw140 block certificates and full cylinders
        if: inputs.audit == 'raw140-block-local'
        shell: bash
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent10-nov26-cryptids/generate_raw140_blocks.py
          python im-results/agent10-nov26-cryptids/generate_raw140_deep.py --block
          mkdir -p /tmp/nov26-axioms
          cp im-results/agent10-nov26-cryptids/raw140-plus-summary.json /tmp/nov26-axioms/
          python tools/lean_compile_closure.py --workdir /tmp/raw140-plus --jobs 3 im-results/agent10-nov26-cryptids/Raw140PlusCovers.lean 2>&1 | tee /tmp/nov26-axioms/Raw140PlusCovers.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/nov26-axioms/Raw140PlusCovers.log BB6.Agent10Raw140Plus.matches_sound
      - name: Compile local weighted proof closure and actual TNF paths
        if: inputs.audit != 'raw140-n20-local' && inputs.audit != 'raw140-deep-local' && inputs.audit != 'raw140-root-local' && inputs.audit != 'raw140-block-local'
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/im-results/agent13-coverage/unpack.py"
          mkdir -p /tmp/nov26-axioms
          if [[ "${{ inputs.audit }}" == "raw140" || "${{ inputs.audit }}" == "raw140-n20-source" || "${{ inputs.audit }}" == "raw140-three-hole-source" || "${{ inputs.audit }}" == "raw140-three-hole-all" || "${{ inputs.audit }}" == "raw140-canonical37" ]]; then
            export BB6_UPSTREAM_LEAN_PATH="$(lake env printenv LEAN_PATH)"
            cp lake-manifest.json /tmp/nov26-axioms/upstream-lake-manifest.json
            git rev-parse HEAD > /tmp/nov26-axioms/upstream-commit.txt
            cat >/tmp/raw140-lean <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          export LEAN_PATH="${LEAN_PATH:+$LEAN_PATH:}$BB6_UPSTREAM_LEAN_PATH"
          exec lean "$@"
          EOF
            chmod +x /tmp/raw140-lean
            cd "$GITHUB_WORKSPACE"
            if [[ "${{ inputs.audit }}" == "raw140-three-hole-source" || "${{ inputs.audit }}" == "raw140-three-hole-all" || "${{ inputs.audit }}" == "raw140-canonical37" ]]; then
              python im-results/agent10-nov26-cryptids/generate_raw140_orbit_phases.py
              python im-results/agent10-nov26-cryptids/generate_raw140_extra.py
              python im-results/agent10-nov26-cryptids/generate_raw140_long.py
              node im-results/agent10-nov26-cryptids/generate_raw140_double.js
              node im-results/agent10-nov26-cryptids/generate_raw140_double_entry.js
              cutargs=(--source36)
              if [[ "${{ inputs.audit }}" == "raw140-three-hole-all" || "${{ inputs.audit }}" == "raw140-canonical37" ]]; then
                node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
                node im-results/agent10-nov26-cryptids/generate_raw140_42_counter.js
                node im-results/agent10-nov26-cryptids/generate_raw140_er_suffix.js
                node im-results/agent10-nov26-cryptids/generate_raw14086_local.js
                for i in 28 39 77 81 88; do
                  node im-results/agent10-nov26-cryptids/generate_raw140_28.js "$i"
                done
                node im-results/agent10-nov26-cryptids/generate_raw140_42_low.js
                node im-results/agent10-nov26-cryptids/generate_raw140_42_right.js
                cd im-results/agent10-nov26-cryptids
                for pair in mixed:Mixed bmixed:BMixed bmixed_end:BMixedEnd word:Word aword:AWord dexit:DExit extratail:ExtraTail mixed_front:MixedFront; do
                  gen="${pair%:*}"
                  mod="${pair#*:}"
                  python "generate_raw140_42_${gen}.py" > "Raw14042${mod}Local.lean"
                done
                node generate_raw140_42_dexit_affine.js
                node generate_raw140_42_mixed_exit.js > Raw14042MixedExitLocal.lean
                node generate_raw140_42_b_even.js > Raw14042BEvenLocal.lean
                cd ../..
                cutargs+=(--source86 --source42 --family)
              fi
              python im-results/agent10-nov26-cryptids/generate_raw140_three_hole_cut.py "${cutargs[@]}"
              python tools/lean_compile_closure.py --workdir /tmp/raw140-three-hole-source --jobs 3 --lean /tmp/raw140-lean --override CryptidsTapeAdapter=im-results/agent10-nov26-cryptids/CryptidsTapeAdapter.lean im-results/agent10-nov26-cryptids/Raw140ThreeHoleCut.lean 2>&1 | tee /tmp/nov26-axioms/Raw140ThreeHoleCut.log
              if [[ "${{ inputs.audit }}" == "raw140-three-hole-all" || "${{ inputs.audit }}" == "raw140-canonical37" ]]; then
                python im-results/agent4-raw109/audit_axioms.py /tmp/nov26-axioms/Raw140ThreeHoleCut.log Raw14036.never
                python im-results/agent4-raw109/audit_axioms.py /tmp/nov26-axioms/Raw140ThreeHoleCut.log Raw14086.cover
                for i in 28 39 77 81 88; do
                  python im-results/agent4-raw109/audit_axioms.py /tmp/nov26-axioms/Raw140ThreeHoleCut.log "Raw140$i.cover"
                done
                for t in step_plus forever; do
                  python im-results/agent4-raw109/audit_axioms.py /tmp/nov26-axioms/Raw140ThreeHoleCut.log "Raw14042Positive.$t"
                done
                for t in never cover; do
                  python im-results/agent4-raw109/audit_axioms.py /tmp/nov26-axioms/Raw140ThreeHoleCut.log "Raw14042Cover.$t"
                done
              fi
              for t in checked remaining_count remaining_exact remaining_nodup sound cover; do
                python im-results/agent4-raw109/audit_axioms.py /tmp/nov26-axioms/Raw140ThreeHoleCut.log "BB6.Agent10Raw140ThreeHole.$t"
              done
              cp im-results/agent10-nov26-cryptids/raw140-three-hole-pending.json /tmp/nov26-axioms/
              if [[ "${{ inputs.audit }}" == "raw140-canonical37" ]]; then
                python tools/lean_compile_closure.py --workdir /tmp/raw140-canonical37 --jobs 3 --lean /tmp/raw140-lean --override CryptidsTapeAdapter=im-results/agent10-nov26-cryptids/CryptidsTapeAdapter.lean im-results/agent15-raw140-canonical37/Raw140Canonical37Refined.lean 2>&1 | tee /tmp/nov26-axioms/Raw140Canonical37Refined.log
                for t in p140_count37 p140_cut_parent_agreement count36 raw140_removed raw47_remains_removed refined_sound_at conditional_exact_at_champion_score; do
                  python im-results/agent4-raw109/audit_axioms.py /tmp/nov26-axioms/Raw140Canonical37Refined.log "BB6.Agent15Raw140Canonical37Refined.$t"
                done
              fi
              exit 0
            fi
            if [[ "${{ inputs.audit }}" == "raw140-n20-source" ]]; then
              python tools/lean_compile_closure.py --workdir /tmp/raw140-n20-source --jobs 2 --lean /tmp/raw140-lean --override CryptidsTapeAdapter=im-results/agent10-nov26-cryptids/CryptidsTapeAdapter.lean im-results/agent10-nov26-cryptids/Raw140N20Source.lean 2>&1 | tee /tmp/nov26-axioms/Raw140N20Source.log
              python im-results/agent4-raw109/audit_axioms.py /tmp/nov26-axioms/Raw140N20Source.log BB6.Agent10Raw140N20.cover
              exit 0
            fi
            python im-results/agent31-three-hole-tnf/generate_sweeps.py
            python im-results/agent31-three-hole-tnf/generate_four_hole.py
            node im-results/agent10-nov26-cryptids/generate_raw140_cut.js --check
            python tools/lean_compile_closure.py --workdir /tmp/raw140-source --jobs 3 --lean /tmp/raw140-lean --override CryptidsTapeAdapter=im-results/agent10-nov26-cryptids/CryptidsTapeAdapter.lean im-results/agent10-nov26-cryptids/Raw140SourceGraft.lean 2>&1 | tee /tmp/nov26-axioms/Raw140SourceGraft.log
            if grep -Eq 'sorryAx|native_decide' /tmp/nov26-axioms/Raw140SourceGraft.log; then exit 1; fi
            grep -q 'cover_at_bound.*depends on axioms' /tmp/nov26-axioms/Raw140SourceGraft.log
            exit 0
          fi
          manifest=weighted-dependencies.txt
          if [[ "${{ inputs.audit }}" == "raw8" ]]; then
            manifest=raw8-weighted-dependencies.txt
            cp "$GITHUB_WORKSPACE/im-results/agent10-nov26-cryptids/Raw8Counted.lean" .
            lake env lean -o .lake/build/lib/lean/Raw8Counted.olean Raw8Counted.lean 2>&1 | tee /tmp/nov26-axioms/Raw8Counted.log
            if grep -Eq "sorryAx|native_decide" /tmp/nov26-axioms/Raw8Counted.log; then exit 1; fi
          fi
          while IFS= read -r p; do
            base="$(basename "$p")"
            cp "$GITHUB_WORKSPACE/$p" "$base"
            log="/tmp/nov26-axioms/$base.log"
            lake env lean -o ".lake/build/lib/lean/${base%.lean}.olean" "$base" 2>&1 | tee "$log"
            if grep -Eq 'sorryAx|native_decide' "$log"; then exit 1; fi
          done < "$GITHUB_WORKSPACE/im-results/agent10-nov26-cryptids/$manifest"
      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nov26-weighted-axioms
          path: /tmp/nov26-axioms
          if-no-files-found: ignore
