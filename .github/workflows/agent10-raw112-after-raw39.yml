name: Agent10 accepted Raw112 after Raw39 Canonical39

on:
  workflow_dispatch:
    inputs:
      raw112_run_id:
        description: 'Successful source-accepted Raw112 parent run'
        required: true
        type: string
        default: '46146501930'
      onele_run:
        description: 'Accepted Raw39 1LE source run'
        required: true
        type: string
        default: '46114235329'

permissions:
  contents: read
  actions: read

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - name: Authenticate accepted parents and source-check Canonical38 successor
        env:
          GH_TOKEN: ${{ github.token }}
          RAW112_RUN_ID: ${{ inputs.raw112_run_id }}
          ONELE_RUN: ${{ inputs.onele_run }}
        run: |
          set -euo pipefail
          [[ "$RAW112_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ONELE_RUN" =~ ^[0-9]+$ ]]
          lean --version | grep -F '4.36.0-rc2'
          python -m py_compile im-results/agent10-raw112-canonical38/consume.py
          python im-results/agent13-coverage/unpack.py
          python im-results/agent10-raw112-canonical38/consume.py \
            --work /tmp/a10-raw112-after-raw39 \
            --raw112-run-id "$RAW112_RUN_ID" \
            --onele-run "$ONELE_RUN" --chunk-size 64 \
            | tee /tmp/a10-raw112-after-raw39.log
          test -s /tmp/a10-raw112-after-raw39/evidence/raw112-after-raw39-canonical38.json
          cat /tmp/a10-raw112-after-raw39/evidence/raw112-after-raw39-canonical38.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical38-raw39-raw112-accepted-delta
          path: |
            /tmp/a10-raw112-after-raw39/evidence/
            /tmp/a10-raw112-after-raw39.log
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30
