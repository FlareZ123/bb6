name: Agent10 accepted Raw112 after Raw39 Canonical39

on:
  workflow_dispatch:
    inputs:
      raw112_run_id:
        description: 'Successful source-accepted Raw112 parent run'
        required: true
        type: string
        default: '46146501930'
      onele_run:
        description: 'Accepted Raw39 1LE source run'
        required: true
        type: string
        default: '46114235329'
      raw47_conditional:
        description: 'Also source-check Raw47 38-to-37 conditional roster complement'
        required: false
        type: boolean
        default: false
      raw47_full:
        description: 'Authenticate Raw47 parent and source-check unconditional Canonical37'
        required: false
        type: boolean
        default: false
      resume_run_id:
        description: 'Optional prior run containing a raw47-after-raw112-checkpoint artifact'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - name: Authenticate accepted parents and source-check Canonical38 successor
        env:
          GH_TOKEN: ${{ github.token }}
          RAW112_RUN_ID: ${{ inputs.raw112_run_id }}
          ONELE_RUN: ${{ inputs.onele_run }}
        run: |
          set -euo pipefail
          [[ "$RAW112_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ONELE_RUN" =~ ^[0-9]+$ ]]
          lean --version | grep -F '4.36.0-rc2'
          python -m py_compile im-results/agent10-raw112-canonical38/consume.py
          python im-results/agent13-coverage/unpack.py
          python im-results/agent10-raw112-canonical38/consume.py \
            --work /tmp/a10-raw112-after-raw39 \
            --raw112-run-id "$RAW112_RUN_ID" \
            --onele-run "$ONELE_RUN" --chunk-size 64 \
            | tee /tmp/a10-raw112-after-raw39.log
          test -s /tmp/a10-raw112-after-raw39/evidence/raw112-after-raw39-canonical38.json
          cat /tmp/a10-raw112-after-raw39/evidence/raw112-after-raw39-canonical38.json
      - name: Source-check Raw47 conditional complement after accepted Raw112
        if: ${{ inputs.raw47_conditional || inputs.raw47_full }}
        run: |
          set -euo pipefail
          python im-results/agent29-raw47-after-raw112/check.py \
            --work /tmp/a10-raw112-after-raw39 \
            | tee /tmp/a29-raw47-conditional-after-raw112.log
          test -s /tmp/a10-raw112-after-raw39/evidence/raw47-conditional-after-raw112-canonical37.json
      - name: Restore prior Raw47 kernel replay checkpoint
        if: ${{ inputs.raw47_full && inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: raw47-after-raw112-checkpoint
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/raw47-resume
      - name: Validate Raw47 replay checkpoint
        if: ${{ inputs.raw47_full && inputs.resume_run_id != '' }}
        run: |
          set -euo pipefail
          test -s /tmp/raw47-resume/report.json
          test -d /tmp/raw47-resume/objects
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/raw47-resume/report.json").read_text())
          chunks = report.get("chunks", [])
          assert chunks, "checkpoint contains no completed kernel chunks"
          assert len(chunks) == len(list(Path("/tmp/raw47-resume/objects").glob("*.olean")))
          print(f"Authenticated replay checkpoint: {len(chunks)} chunks, "
                f"{report['affected_modules']} affected modules")
          PY
      - name: Source-accept complete Raw47 Cover on the Raw112 Canonical38 lineage
        if: ${{ inputs.raw47_full }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resume_args=()
          if [[ -d /tmp/raw47-resume ]]; then
            resume_args+=(--resume-from /tmp/raw47-resume)
          fi
          python im-results/agent29-raw47-after-raw112/full.py \
            --work /tmp/a10-raw112-after-raw39 \
            --raw47-run-id 46068688341 \
            "${resume_args[@]}" \
            | tee /tmp/a29-raw47-after-raw112.log
          test -s /tmp/a10-raw112-after-raw39/evidence/raw47-after-raw112-canonical37.json
      - uses: actions/upload-artifact@v4
        if: always() && inputs.raw47_full
        with:
          name: raw47-after-raw112-checkpoint
          path: |
            /tmp/a10-raw112-after-raw39/raw47-kernel-replay/report.json
            /tmp/a10-raw112-after-raw39/raw47-kernel-replay/objects/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical38-raw39-raw112-accepted-delta
          path: |
            /tmp/a10-raw112-after-raw39/evidence/
            /tmp/a10-raw112-after-raw39.log
            /tmp/a29-raw47-conditional-after-raw112.log
            /tmp/a29-raw47-after-raw112.log
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30

