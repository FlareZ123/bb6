name: Agent10 Raw140 growth proof
on:
  workflow_dispatch:
    inputs:
      target:
        description: Independently checked growth family
        type: choice
        options: [seven, extra, long4, long79, doubleLocal, doubleCore, double, variantLoops, variantTransfer, threeHoleCut, erSweep, erSuffix, erExit, bank42, counter42, right42, counter42full, low42, dterms42, source42, mixedTerms42, sourceReach42, cbank42, d86, c86, cover86, cut86, cutFamily]
        default: extra
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile selected proof and exact coverage bridge
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent10-nov26-cryptids/generate_raw140_orbit_phases.py
          if [ "$TARGET" = source42 ]; then
            cd im-results/agent10-nov26-cryptids
            for g in double variant_transfer 42_counter er_suffix 42_low 42_right; do
              node "generate_raw140_${g}.js"
            done
            for pair in mixed:Mixed bmixed:BMixed bmixed_end:BMixedEnd word:Word aword:AWord dexit:DExit extratail:ExtraTail; do
              gen="${pair%:*}"
              mod="${pair#*:}"
              python "generate_raw140_42_${gen}.py" > "Raw14042${mod}Local.lean"
            done
            mkdir -p /tmp/raw140-source42
            cp Raw140*.lean generate_raw140_42*.py generate_raw140_42*.js /tmp/raw140-source42/
          elif [ "$TARGET" = mixedTerms42 ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
            node im-results/agent10-nov26-cryptids/generate_raw140_42_counter.js
            node im-results/agent10-nov26-cryptids/generate_raw140_er_suffix.js
            node im-results/agent10-nov26-cryptids/generate_raw140_42_low.js
            cd im-results/agent10-nov26-cryptids
            python split_raw14042_low_local.py
            for pair in mixed:Mixed bmixed:BMixed bmixed_end:BMixedEnd word:Word aword:AWord dexit:DExit extratail:ExtraTail mixed_front:MixedFront; do
              gen="${pair%:*}"
              mod="${pair#*:}"
              python "generate_raw140_42_${gen}.py" > "Raw14042${mod}Local.lean"
            done
            node generate_raw140_42_dexit_affine.js
            node generate_raw140_42_mixed_exit.js > Raw14042MixedExitLocal.lean
            node generate_raw140_42_b_even.js > Raw14042BEvenLocal.lean
            cd ../..
            python tools/lean_compile_closure.py --workdir /tmp/raw140-mixed42 --jobs 3 im-results/agent10-nov26-cryptids/Raw14042MixedTerminals.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in b0r5_mod2 b0r5_mod0 c0r5_mod0 c0r5_mod2; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw14042MixedTerminals.$t"
            done
          elif [ "$TARGET" = sourceReach42 ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
            node im-results/agent10-nov26-cryptids/generate_raw140_42_counter.js
            node im-results/agent10-nov26-cryptids/generate_raw140_er_suffix.js
            node im-results/agent10-nov26-cryptids/generate_raw140_42_low.js
            cd im-results/agent10-nov26-cryptids
            python split_raw14042_low_local.py
            for pair in mixed:Mixed bmixed:BMixed bmixed_end:BMixedEnd word:Word aword:AWord dexit:DExit extratail:ExtraTail mixed_front:MixedFront; do
              gen="${pair%:*}"
              mod="${pair#*:}"
              python "generate_raw140_42_${gen}.py" > "Raw14042${mod}Local.lean"
            done
            node generate_raw140_42_dexit_affine.js
            node generate_raw140_42_mixed_exit.js > Raw14042MixedExitLocal.lean
            node generate_raw140_42_b_even.js > Raw14042BEvenLocal.lean
            cd ../..
            python tools/lean_compile_closure.py --workdir /tmp/raw140-mixed42 --jobs 3 im-results/agent10-nov26-cryptids/Raw14042SourceReach.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in drain_reach; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw14042SourceReach.$t"
            done
          elif [ "$TARGET" = c86 ] || [ "$TARGET" = cover86 ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
            node im-results/agent10-nov26-cryptids/generate_raw140_42_counter.js
            node im-results/agent10-nov26-cryptids/generate_raw140_er_suffix.js
            node im-results/agent10-nov26-cryptids/generate_raw14086_local.js
            if [ "$TARGET" = cover86 ]; then
              roots=(im-results/agent10-nov26-cryptids/Raw14086Cover.lean)
              theorems=(depleteC a0Return bankIter exitAny b0Return return_sound entry never cover)
            else
              roots=(im-results/agent10-nov26-cryptids/Raw14086C.lean)
              theorems=(depleteC a0Return)
            fi
            python tools/lean_compile_closure.py --workdir /tmp/raw140-c86 --jobs 3 "${roots[@]}" 2>&1 | tee /tmp/raw140-proof.log
            for t in "${theorems[@]}"; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw14086.$t"
            done
          elif [ "$TARGET" = d86 ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            node im-results/agent10-nov26-cryptids/generate_raw14086_local.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-d86 --jobs 3 im-results/agent10-nov26-cryptids/Raw14086D.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in dReturn_sound a2Return; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw14086.$t"
            done
          elif [ "$TARGET" = cbank42 ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
            node im-results/agent10-nov26-cryptids/generate_raw140_42_counter.js
            node im-results/agent10-nov26-cryptids/generate_raw140_42_low.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-cbank42 --jobs 3 im-results/agent10-nov26-cryptids/Raw14042C.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in returnC low315; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw14042C.$t"
            done
          elif [ "$TARGET" = dterms42 ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
            node im-results/agent10-nov26-cryptids/generate_raw140_er_suffix.js
            node im-results/agent10-nov26-cryptids/generate_raw140_42_low.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-dterms42 --jobs 3 im-results/agent10-nov26-cryptids/Raw14042DTerminals.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in a0r1 a0r2 a0r5 b1r0 b1r4 c0r0 c0r1 c0r2 c1r2 c1r3; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw14042DTerminals.$t"
            done
          elif [ "$TARGET" = low42 ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
            node im-results/agent10-nov26-cryptids/generate_raw140_42_low.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-low42 --jobs 3 im-results/agent10-nov26-cryptids/Raw14042LowLocal.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in seedA2 seedBblank lowB64 seedMixed oddInit oddPump oddFinish mixed44 mixed54 mixed464 mixed466 mixed564 mixed566 mixedBack4 mixedBack5 pump644 a6ToB a24ToD; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw14042LowLocal.$t"
            done
          elif [ "$TARGET" = counter42full ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
            node im-results/agent10-nov26-cryptids/generate_raw140_42_counter.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-counter42full --jobs 3 im-results/agent10-nov26-cryptids/Raw14042Counter.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in counterStep counterIter; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw14042Counter.$t"
            done
          elif [ "$TARGET" = right42 ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
            node im-results/agent10-nov26-cryptids/generate_raw140_42_right.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-right42 --jobs 3 im-results/agent10-nov26-cryptids/Raw14042Right.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in scan pump rightReturn42; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw14042Right.$t"
            done
          elif [ "$TARGET" = counter42 ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
            node im-results/agent10-nov26-cryptids/generate_raw140_42_counter.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-counter42 --jobs 3 im-results/agent10-nov26-cryptids/Raw14042CounterLocal.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in low542 seedCounter forwardOne forwardTrip prep31 prep32 prep315 prep325 prep3242 prep35221 backTrip finishStep finishZero initTwos twoPump boundaryOne; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw14042CounterLocal.$t"
            done
          elif [ "$TARGET" = bank42 ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            node im-results/agent10-nov26-cryptids/generate_raw140_er_suffix.js
            node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-bank42 --jobs 3 im-results/agent10-nov26-cryptids/Raw14042Bank.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in pumpAny start42 exit42 return42; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw14042Bank.$t"
            done
          elif [ "$TARGET" = erExit ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            node im-results/agent10-nov26-cryptids/generate_raw140_er_suffix.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-er-exit --jobs 3 im-results/agent10-nov26-cryptids/Raw140ERExit.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in Raw140ERSuffix.bank Raw140ERExit.pump Raw140ERExit.exitBank; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "$t"
            done
          elif [ "$TARGET" = erSuffix ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            node im-results/agent10-nov26-cryptids/generate_raw140_er_suffix.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-er-suffix --jobs 3 im-results/agent10-nov26-cryptids/Raw140ERSuffix.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in partialRotate advance bank; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140ERSuffix.$t"
            done
          elif [ "$TARGET" = erSweep ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-er --jobs 3 im-results/agent10-nov26-cryptids/Raw140ERSweep.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in one many rotate_one; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140ERSweep.$t"
            done
          elif [ "$TARGET" = threeHoleCut ] || [ "$TARGET" = cut86 ] || [ "$TARGET" = cutFamily ]; then
            python im-results/agent10-nov26-cryptids/generate_raw140_extra.py
            python im-results/agent10-nov26-cryptids/generate_raw140_long.py
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            node im-results/agent10-nov26-cryptids/generate_raw140_double_entry.js
            cutargs=()
            if [ "$TARGET" = cut86 ] || [ "$TARGET" = cutFamily ]; then
              node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
              node im-results/agent10-nov26-cryptids/generate_raw140_42_counter.js
              node im-results/agent10-nov26-cryptids/generate_raw140_er_suffix.js
              node im-results/agent10-nov26-cryptids/generate_raw14086_local.js
              cutargs+=(--source86)
            fi
            if [ "$TARGET" = cutFamily ]; then
              for i in 28 39 77 81 88; do
                node im-results/agent10-nov26-cryptids/generate_raw140_28.js "$i"
              done
              cutargs+=(--family)
            fi
            python im-results/agent10-nov26-cryptids/generate_raw140_three_hole_cut.py "${cutargs[@]}"
            python tools/lean_compile_closure.py --workdir /tmp/raw140-cut --jobs 3 im-results/agent10-nov26-cryptids/Raw140ThreeHoleCut.lean 2>&1 | tee /tmp/raw140-proof.log
            if [ "$TARGET" = cut86 ] || [ "$TARGET" = cutFamily ]; then
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log Raw14086.cover
            fi
            if [ "$TARGET" = cutFamily ]; then
              for i in 28 39 77 81 88; do
                python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140$i.cover"
              done
            fi
            for t in checked remaining_count sound cover; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "BB6.Agent10Raw140ThreeHole.$t"
            done
          elif [ "$TARGET" = variantTransfer ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-transfer --jobs 3 im-results/agent10-nov26-cryptids/Raw140VariantTransfer.lean 2>&1 | tee /tmp/raw140-proof.log
            for i in 31 35 37 40 41 42 43 44 45 46 74 83 85; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140VariantTransfer.transferMany$i"
            done
            python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log Raw140VariantTransfer.erMany
          elif [ "$TARGET" = variantLoops ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_variant_loops.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-variant --jobs 3 im-results/agent10-nov26-cryptids/Raw140VariantLoops.lean 2>&1 | tee /tmp/raw140-proof.log
            for i in 28 39 77 81 86 88; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140Variant.arLoop$i"
            done
          elif [ "$TARGET" = double ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            node im-results/agent10-nov26-cryptids/generate_raw140_double_entry.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-double --jobs 3 im-results/agent10-nov26-cryptids/Raw140DoubleCover.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in X4.cover X13.cover; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140Double.$t"
            done
          elif [ "$TARGET" = doubleCore ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-double-core --jobs 3 im-results/agent10-nov26-cryptids/Raw140DoubleCore.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in bounce dIter eEven eOddLast; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140Double.$t"
            done
          elif [ "$TARGET" = doubleLocal ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-double-local --jobs 3 im-results/agent10-nov26-cryptids/Raw140DoubleLocal.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in convert1 convert2 tail6405; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140Double.$t"
            done
          elif [ "$TARGET" = extra ]; then
            python im-results/agent10-nov26-cryptids/generate_raw140_extra.py
            python tools/lean_compile_closure.py --workdir /tmp/raw140-extra --jobs 3 im-results/agent10-nov26-cryptids/Raw140ExtraNovelCover.lean 2>&1 | tee /tmp/raw140-proof.log
            python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140Extra.X11.cover"
          elif [ "$TARGET" = long4 ] || [ "$TARGET" = long79 ]; then
            if [ "$TARGET" = long4 ]; then ids="34 38 75 78"; cover=Raw140LongFourCover; else ids=79; cover=Raw140Long79Cover; fi
            python im-results/agent10-nov26-cryptids/generate_raw140_long.py $ids
            python tools/lean_compile_closure.py --workdir /tmp/raw140-long --jobs 2 "im-results/agent10-nov26-cryptids/$cover.lean" 2>&1 | tee /tmp/raw140-proof.log
            for i in $ids; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140Long.X$i.cover"
            done
          else
            python tools/lean_compile_closure.py --workdir /tmp/raw140-seven --jobs 3 im-results/agent10-nov26-cryptids/Raw140SevenCover.lean 2>&1 | tee /tmp/raw140-proof.log
            for i in $(seq 0 6); do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140Orbit.V$i.never"
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw140-${{ inputs.target }}-axioms
          path: |
            /tmp/raw140-proof.log
            /tmp/raw140-c86/*.lean
            /tmp/raw140-source42/
            /tmp/raw140-cut/Raw140*.lean
            im-results/agent10-nov26-cryptids/raw140-three-hole-pending.json
            im-results/agent10-nov26-cryptids/Raw140ThreeHoleCut.lean
            im-results/agent10-nov26-cryptids/Raw140VariantTransfer.lean
