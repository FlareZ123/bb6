name: Agent10 Raw140 growth proof
on:
  workflow_dispatch:
    inputs:
      target:
        description: Independently checked growth family
        type: choice
        options: [seven, extra, long4, long79, doubleLocal, doubleCore]
        default: extra
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile selected proof and exact coverage bridge
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent10-nov26-cryptids/generate_raw140_orbit_phases.py
          if [ "$TARGET" = doubleCore ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-double-core --jobs 3 im-results/agent10-nov26-cryptids/Raw140DoubleCore.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in bounce dIter eEven eOddLast; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140Double.$t"
            done
          elif [ "$TARGET" = doubleLocal ]; then
            node im-results/agent10-nov26-cryptids/generate_raw140_double.js
            python tools/lean_compile_closure.py --workdir /tmp/raw140-double-local --jobs 3 im-results/agent10-nov26-cryptids/Raw140DoubleLocal.lean 2>&1 | tee /tmp/raw140-proof.log
            for t in convert1 convert2 tail6405; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140Double.$t"
            done
          elif [ "$TARGET" = extra ]; then
            python im-results/agent10-nov26-cryptids/generate_raw140_extra.py
            python tools/lean_compile_closure.py --workdir /tmp/raw140-extra --jobs 3 im-results/agent10-nov26-cryptids/Raw140ExtraNovelCover.lean 2>&1 | tee /tmp/raw140-proof.log
            python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140Extra.X11.cover"
          elif [ "$TARGET" = long4 ] || [ "$TARGET" = long79 ]; then
            if [ "$TARGET" = long4 ]; then ids="34 38 75 78"; cover=Raw140LongFourCover; else ids=79; cover=Raw140Long79Cover; fi
            python im-results/agent10-nov26-cryptids/generate_raw140_long.py $ids
            python tools/lean_compile_closure.py --workdir /tmp/raw140-long --jobs 2 "im-results/agent10-nov26-cryptids/$cover.lean" 2>&1 | tee /tmp/raw140-proof.log
            for i in $ids; do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140Long.X$i.cover"
            done
          else
            python tools/lean_compile_closure.py --workdir /tmp/raw140-seven --jobs 3 im-results/agent10-nov26-cryptids/Raw140SevenCover.lean 2>&1 | tee /tmp/raw140-proof.log
            for i in $(seq 0 6); do
              python im-results/agent4-raw109/audit_axioms.py /tmp/raw140-proof.log "Raw140Orbit.V$i.never"
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw140-${{ inputs.target }}-axioms
          path: /tmp/raw140-proof.log
