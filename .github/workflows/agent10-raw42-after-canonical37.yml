name: Agent10 Raw42 accepted parent after Canonical37

on:
  workflow_dispatch:
    inputs:
      raw42_run_id:
        description: 'Successful Raw42 twelve-child parent-compose run'
        required: true
        type: string
      raw47_run_id:
        description: 'Accepted Raw47 whole-parent run'
        required: true
        type: string
        default: '46068688341'
      raw112_run_id:
        description: 'Accepted Raw112 whole-parent run'
        required: true
        type: string
        default: '46146501930'
      onele_run:
        description: 'Accepted Raw39 1LE source run'
        required: true
        type: string
        default: '46114235329'

permissions:
  actions: read
  contents: read

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim unrelated hosted SDKs
        run: |
          set -euo pipefail
          for folder in /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell; do
            if [[ -d "$folder" ]]; then sudo rm -rf "$folder"; fi
          done
          df -h /

      - name: Install pinned Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"

      - name: Download source-accepted Raw42 parent closure
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw42_run_id }}
          name: raw42-parent-compose
          path: /tmp/raw42-parent-artifact

      - name: Authenticate and consume Raw42 on Canonical37
        env:
          GH_TOKEN: ${{ github.token }}
          RAW42_RUN_ID: ${{ inputs.raw42_run_id }}
          RAW47_RUN_ID: ${{ inputs.raw47_run_id }}
          RAW112_RUN_ID: ${{ inputs.raw112_run_id }}
          ONELE_RUN: ${{ inputs.onele_run }}
        run: |
          set -euo pipefail
          for x in "$RAW42_RUN_ID" "$RAW47_RUN_ID" "$RAW112_RUN_ID" "$ONELE_RUN"; do
            [[ "$x" =~ ^[0-9]+$ ]]
          done
          lean --version | grep -F '4.36.0-rc2'
          python -m py_compile im-results/agent10-raw42-after-raw47/consume.py
          python im-results/agent13-coverage/unpack.py
          python im-results/agent10-raw42-after-raw47/consume.py \
            --work /tmp/a10-raw42-canonical36 \
            --raw42-run-id "$RAW42_RUN_ID" \
            --raw42-artifact-dir /tmp/raw42-parent-artifact \
            --raw47-run-id "$RAW47_RUN_ID" \
            --raw112-run-id "$RAW112_RUN_ID" \
            --onele-run "$ONELE_RUN" \
            | tee /tmp/a10-raw42-canonical36.log
          test -s /tmp/a10-raw42-canonical36/evidence/canonical36-raw42-after-raw47.json
          cat /tmp/a10-raw42-canonical36/evidence/canonical36-raw42-after-raw47.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical36-raw42-after-raw47
          path: |
            /tmp/a10-raw42-canonical36/evidence/
            /tmp/a10-raw42-canonical36/raw42-kernel-replay/report.json
            /tmp/a10-raw42-canonical36.log
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30
