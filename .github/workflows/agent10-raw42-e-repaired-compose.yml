name: Agent10 Raw42 E repaired exact-part compose

on:
  workflow_dispatch:
    inputs:
      branch:
        type: choice
        options: [0LE, 1LE, 1RE]
        default: 1LE
      source_run:
        description: 'Original exact-split run with accepted sibling partitions'
        required: true
        type: string
      repaired_run:
        description: 'Successful repaired-part run'
        required: true
        type: string
      repaired_part:
        description: 'First repaired exact partition key, e.g. g0p1'
        required: true
        type: string
      repaired_run2:
        description: 'Optional second repaired-part run'
        required: false
        type: string
        default: ''
      repaired_part2:
        description: 'Optional second repaired exact partition key'
        required: false
        type: string
        default: ''
      repaired_run3:
        description: 'Optional third repaired-part run'
        required: false
        type: string
        default: ''
      repaired_part3:
        description: 'Optional third repaired exact partition key'
        required: false
        type: string
        default: ''
      repaired_run4:
        description: 'Optional repaired-part run 4'
        required: false
        type: string
        default: ''
      repaired_part4:
        description: 'Optional repaired exact partition key 4'
        required: false
        type: string
        default: ''
      repaired_run5:
        description: 'Optional repaired-part run 5'
        required: false
        type: string
        default: ''
      repaired_part5:
        description: 'Optional repaired exact partition key 5'
        required: false
        type: string
        default: ''
      repaired_run6:
        description: 'Optional repaired-part run 6'
        required: false
        type: string
        default: ''
      repaired_part6:
        description: 'Optional repaired exact partition key 6'
        required: false
        type: string
        default: ''
      repaired_run7:
        description: 'Optional repaired-part run 7'
        required: false
        type: string
        default: ''
      repaired_part7:
        description: 'Optional repaired exact partition key 7'
        required: false
        type: string
        default: ''
      repaired_run8:
        description: 'Optional repaired-part run 8'
        required: false
        type: string
        default: ''
      repaired_part8:
        description: 'Optional repaired exact partition key 8'
        required: false
        type: string
        default: ''
      repaired_run9:
        description: 'Optional repaired-part run 9'
        required: false
        type: string
        default: ''
      repaired_part9:
        description: 'Optional repaired exact partition key 9'
        required: false
        type: string
        default: ''
      repaired_run10:
        description: 'Optional repaired-part run 10'
        required: false
        type: string
        default: ''
      repaired_part10:
        description: 'Optional repaired exact partition key 10'
        required: false
        type: string
        default: ''
      repaired_run11:
        description: 'Optional repaired-part run 11'
        required: false
        type: string
        default: ''
      repaired_part11:
        description: 'Optional repaired exact partition key 11'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact composition target
        env:
          BRANCH: ${{ inputs.branch }}
          SOURCE_RUN: ${{ inputs.source_run }}
          REPAIRED_RUN: ${{ inputs.repaired_run }}
          PART: ${{ inputs.repaired_part }}
          REPAIRED_RUN2: ${{ inputs.repaired_run2 }}
          PART2: ${{ inputs.repaired_part2 }}
          REPAIRED_RUN3: ${{ inputs.repaired_run3 }}
          PART3: ${{ inputs.repaired_part3 }}
          REPAIRED_RUN4: ${{ inputs.repaired_run4 }}
          PART4: ${{ inputs.repaired_part4 }}
          REPAIRED_RUN5: ${{ inputs.repaired_run5 }}
          PART5: ${{ inputs.repaired_part5 }}
          REPAIRED_RUN6: ${{ inputs.repaired_run6 }}
          PART6: ${{ inputs.repaired_part6 }}
          REPAIRED_RUN7: ${{ inputs.repaired_run7 }}
          PART7: ${{ inputs.repaired_part7 }}
          REPAIRED_RUN8: ${{ inputs.repaired_run8 }}
          PART8: ${{ inputs.repaired_part8 }}
          REPAIRED_RUN9: ${{ inputs.repaired_run9 }}
          PART9: ${{ inputs.repaired_part9 }}
          REPAIRED_RUN10: ${{ inputs.repaired_run10 }}
          PART10: ${{ inputs.repaired_part10 }}
          REPAIRED_RUN11: ${{ inputs.repaired_run11 }}
          PART11: ${{ inputs.repaired_part11 }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" =~ ^(0LE|1LE|1RE)$ ]]
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$REPAIRED_RUN" =~ ^[0-9]+$ ]]
          [[ "$PART" =~ ^g[0-7]p[0-3]$ ]]
          if [[ -n "$REPAIRED_RUN2" || -n "$PART2" ]]; then
            [[ "$REPAIRED_RUN2" =~ ^[0-9]+$ ]]
            [[ "$PART2" =~ ^g[0-7]p[0-3]$ ]]
          fi
          if [[ -n "$REPAIRED_RUN3" || -n "$PART3" ]]; then
            [[ "$REPAIRED_RUN3" =~ ^[0-9]+$ ]]
            [[ "$PART3" =~ ^g[0-7]p[0-3]$ ]]
          fi
          if [[ -n "$REPAIRED_RUN4" || -n "$PART4" ]]; then
            [[ "$REPAIRED_RUN4" =~ ^[0-9]+$ ]]
            [[ "$PART4" =~ ^g[0-7]p[0-3]$ ]]
          fi
          if [[ -n "$REPAIRED_RUN5" || -n "$PART5" ]]; then
            [[ "$REPAIRED_RUN5" =~ ^[0-9]+$ ]]
            [[ "$PART5" =~ ^g[0-7]p[0-3]$ ]]
          fi
          if [[ -n "$REPAIRED_RUN6" || -n "$PART6" ]]; then
            [[ "$REPAIRED_RUN6" =~ ^[0-9]+$ ]]
            [[ "$PART6" =~ ^g[0-7]p[0-3]$ ]]
          fi
          if [[ -n "$REPAIRED_RUN7" || -n "$PART7" ]]; then
            [[ "$REPAIRED_RUN7" =~ ^[0-9]+$ ]]
            [[ "$PART7" =~ ^g[0-7]p[0-3]$ ]]
          fi
          if [[ -n "$REPAIRED_RUN8" || -n "$PART8" ]]; then
            [[ "$REPAIRED_RUN8" =~ ^[0-9]+$ ]]
            [[ "$PART8" =~ ^g[0-7]p[0-3]$ ]]
          fi
          if [[ -n "$REPAIRED_RUN9" || -n "$PART9" ]]; then
            [[ "$REPAIRED_RUN9" =~ ^[0-9]+$ ]]
            [[ "$PART9" =~ ^g[0-7]p[0-3]$ ]]
          fi
          if [[ -n "$REPAIRED_RUN10" || -n "$PART10" ]]; then
            [[ "$REPAIRED_RUN10" =~ ^[0-9]+$ ]]
            [[ "$PART10" =~ ^g[0-7]p[0-3]$ ]]
          fi
          if [[ -n "$REPAIRED_RUN11" || -n "$PART11" ]]; then
            [[ "$REPAIRED_RUN11" =~ ^[0-9]+$ ]]
            [[ "$PART11" =~ ^g[0-7]p[0-3]$ ]]
          fi
          parts=("$PART" "$PART2" "$PART3" "$PART4" "$PART5" "$PART6" "$PART7" "$PART8" "$PART9" "$PART10" "$PART11")
          for ((i=0; i<${#parts[@]}; i++)); do
            [[ -z "${parts[$i]}" ]] && continue
            for ((j=i+1; j<${#parts[@]}; j++)); do
              [[ -z "${parts[$j]}" ]] && continue
              [[ "${parts[$i]}" != "${parts[$j]}" ]]
            done
          done

      - name: Reconstruct original coverage source
        run: python im-results/agent13-coverage/unpack.py

      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          printf '#!/bin/sh\nexec lean -j1 "$@"\n' >/tmp/lean-one
          chmod +x /tmp/lean-one

      - name: Restore frozen generated source and exact split plan
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: raw42-split-generated
          path: im-results/agent32-raw42/generated-assembly

      - name: Download accepted original sibling partitions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          pattern: raw42-split-${{ inputs.branch }}-g*
          path: /tmp/parts

      - name: Replace failed partition with repaired exact artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repaired_run }}
          name: raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part }}
          path: /tmp/parts/raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part }}

      - name: Replace optional second failed partition
        if: ${{ inputs.repaired_run2 != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repaired_run2 }}
          name: raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part2 }}
          path: /tmp/parts/raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part2 }}

      - name: Replace optional third failed partition
        if: ${{ inputs.repaired_run3 != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repaired_run3 }}
          name: raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part3 }}
          path: /tmp/parts/raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part3 }}

      - name: Replace optional repaired partition 4
        if: ${{ inputs.repaired_run4 != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repaired_run4 }}
          name: raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part4 }}
          path: /tmp/parts/raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part4 }}

      - name: Replace optional repaired partition 5
        if: ${{ inputs.repaired_run5 != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repaired_run5 }}
          name: raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part5 }}
          path: /tmp/parts/raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part5 }}

      - name: Replace optional repaired partition 6
        if: ${{ inputs.repaired_run6 != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repaired_run6 }}
          name: raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part6 }}
          path: /tmp/parts/raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part6 }}

      - name: Replace optional repaired partition 7
        if: ${{ inputs.repaired_run7 != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repaired_run7 }}
          name: raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part7 }}
          path: /tmp/parts/raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part7 }}

      - name: Replace optional repaired partition 8
        if: ${{ inputs.repaired_run8 != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repaired_run8 }}
          name: raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part8 }}
          path: /tmp/parts/raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part8 }}

      - name: Replace optional repaired partition 9
        if: ${{ inputs.repaired_run9 != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repaired_run9 }}
          name: raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part9 }}
          path: /tmp/parts/raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part9 }}

      - name: Replace optional repaired partition 10
        if: ${{ inputs.repaired_run10 != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repaired_run10 }}
          name: raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part10 }}
          path: /tmp/parts/raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part10 }}

      - name: Replace optional repaired partition 11
        if: ${{ inputs.repaired_run11 != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.repaired_run11 }}
          name: raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part11 }}
          path: /tmp/parts/raw42-split-${{ inputs.branch }}-${{ inputs.repaired_part11 }}

      - name: Restore rewritten generated sources from repaired partitions
        env:
          BRANCH: ${{ inputs.branch }}
          PART: ${{ inputs.repaired_part }}
          PART2: ${{ inputs.repaired_part2 }}
          PART3: ${{ inputs.repaired_part3 }}
          PART4: ${{ inputs.repaired_part4 }}
          PART5: ${{ inputs.repaired_part5 }}
          PART6: ${{ inputs.repaired_part6 }}
          PART7: ${{ inputs.repaired_part7 }}
          PART8: ${{ inputs.repaired_part8 }}
          PART9: ${{ inputs.repaired_part9 }}
          PART10: ${{ inputs.repaired_part10 }}
          PART11: ${{ inputs.repaired_part11 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import shutil, os
          branch=os.environ["BRANCH"]
          parts=[p for p in (
              os.environ["PART"], os.environ["PART2"], os.environ["PART3"],
              os.environ["PART4"], os.environ["PART5"], os.environ["PART6"],
              os.environ["PART7"], os.environ["PART8"], os.environ["PART9"],
              os.environ["PART10"], os.environ["PART11"]
          ) if p]
          repo=Path.cwd()
          restored=0
          for part in parts:
              shard=Path("/tmp/parts") / f"raw42-split-{branch}-{part}"
              manifest=json.loads((shard/"manifest.json").read_text())
              for item in manifest["modules"]:
                  if item.get("source_kind") != "generated-or-untracked":
                      continue
                  src=shard / (item["module"].replace(".", "/") + ".lean")
                  dst=repo / item["source_path"]
                  if not src.is_file():
                      continue
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src,dst)
                  restored += 1
          print(f"restored {restored} repaired generated sources from {len(parts)} partition(s)")
          PY

      - name: Authenticate exact 32-part union and prove whole child Cover
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42
          g="$d/generated-assembly"
          python im-results/agent4-raw109/merge_shards.py \
            /tmp/parts /tmp/merged "$g/split-plan.json"
          mkdir -p /tmp/final
          th="BB6.Agent32Raw42${BRANCH}.Closed.cover"
          python tools/lean_compile_closure.py \
            --lean /tmp/lean-one --workdir /tmp/final --jobs 1 \
            --source-root "$g" --override FastBiDFA="$d/FastBiDFA.lean" \
            --precompiled-manifest /tmp/merged/manifest.json \
            --precompiled-dir /tmp/merged \
            --manifest /tmp/final/manifest.json \
            --artifact-name "raw42-certified-${BRANCH}-repaired" \
            --theorem "$th" \
            --parent-table "1RB---_1RC${BRANCH}_0RD---_1LD0LB_------_------" \
            --weighted-bound 100006 \
            "$g/Raw42${BRANCH}ClosedCover.lean" | tee /tmp/final/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/final/audit.log
          python im-results/agent32-raw59/check_axioms.py \
            /tmp/final/audit.log "$th"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw42-certified-${{ inputs.branch }}-repaired
          path: /tmp/final/
          retention-days: 30
          if-no-files-found: warn
