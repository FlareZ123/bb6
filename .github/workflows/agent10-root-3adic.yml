name: Agent 10 #746 root 3-adic audit

on:
  workflow_dispatch:
    inputs:
      steps:
        description: Number of reset transitions
        required: false
        default: "100000"
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact-arithmetic root audit
        run: python im-results/agent10-cascade/root_forward_3adic.py --steps "${{ inputs.steps }}"
