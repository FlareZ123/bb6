name: Agent 10 S-section q-injectivity and rooted orbit separation (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-q-orbits:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check single source and audit axioms
        run: |
          set -e
          lean --version
          lean im-results/agent10-s-orbit-separation/QOrbitDisjoint.lean
