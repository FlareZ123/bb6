name: Agent 10 S/T rooted raw table conjugacy (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-conjugacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unmodified Agent 3 raw semantics and literal parser with new S/T witness
        run: |
          set -e
          mkdir -p /tmp/a10-st
          cp im-results/agent3-portfolio-raw-conjugacy/{MachineConjugacy,DTableWitness,DStartFinite,DSectionTransfer,DAllStarts,DExactTimes,DParseRLE}.lean /tmp/a10-st/
          cp im-results/agent10-st-family/{STableWitness,SBlankEntry}.lean /tmp/a10-st/
          cd /tmp/a10-st
          export LEAN_PATH="."
          lean --version
          for f in MachineConjugacy DTableWitness DStartFinite DSectionTransfer DAllStarts DExactTimes DParseRLE; do
            lean -o "$f.olean" "$f.lean"
          done
          lean -o STableWitness.olean STableWitness.lean
          lean SBlankEntry.lean
