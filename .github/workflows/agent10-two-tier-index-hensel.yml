name: Agent 10 two-tier and Q-state index Hensel source check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-two-tier-index-hensel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile trusted depth-period dependencies, two-tier selector, and Q-state selector
        run: |
          set -eu
          b="im-results/agent10-cascade"
          g="im-results/agent7-fatal-density"
          a="im-results/agent44-746-rank"
          export LEAN_PATH="$b:$g:$a"
          lean --version
          lean -o "$g/SignedRayPeriod.olean" "$g/SignedRayPeriod.lean"
          lean -o "$g/RayDepthHensel.olean" "$g/RayDepthHensel.lean"
          lean -o "$g/RayDepthResidue.olean" "$g/RayDepthResidue.lean"
          lean -o "$b/RayTwoTierIndexHensel.olean" "$b/RayTwoTierIndexHensel.lean"
          lean -o "$a/QStateIndexHensel.olean" "$a/QStateIndexHensel.lean"
