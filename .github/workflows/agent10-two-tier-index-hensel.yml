name: Agent 10 two-tier index Hensel source check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-two-tier-index-hensel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile only the trusted depth-period dependencies and the two-tier selector
        run: |
          set -eu
          b="im-results/agent10-cascade"
          g="im-results/agent7-fatal-density"
          export LEAN_PATH="$b:$g"
          lean --version
          lean -o "$g/SignedRayPeriod.olean" "$g/SignedRayPeriod.lean"
          lean -o "$g/RayDepthHensel.olean" "$g/RayDepthHensel.lean"
          lean -o "$g/RayDepthResidue.olean" "$g/RayDepthResidue.lean"
          if lean -o "$b/RayTwoTierIndexHensel.olean" "$b/RayTwoTierIndexHensel.lean" > /tmp/two-tier-lean.log 2>&1; then
            cat /tmp/two-tier-lean.log
          else
            cat /tmp/two-tier-lean.log
            echo "### Two-tier Lean compilation failure" >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 /tmp/two-tier-lean.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
