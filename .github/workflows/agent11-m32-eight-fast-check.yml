name: Agent 11 Machine C eight M32 exclusions against pinned kernel artifacts
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-eight-original:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reproduce the original entire finite M32 graph source
        run: python3 tools/agent43_c32_certificate.py
      - name: Download eight fully kernel-checked proof shards from successful run 41538277695
        uses: actions/download-artifact@v4
        with:
          run-id: 41538277695
          github-token: ${{ github.token }}
          pattern: a43-m32-olean-*
          merge-multiple: true
          path: tools
      - name: Recheck original source bridge and all eight section cylinders
        run: |
          cd tools
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-line/CLine.lean" CLine.lean
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-first-family/M32EightCells.lean" M32EightCells.lean
          export LEAN_PATH=.
          lean --version
          test "$(find . -maxdepth 1 -name 'P32Block*.olean' | wc -l)" -eq 40
          lean -o CCert32Pure.olean CCert32Pure.lean
          lean -o CLine.olean CLine.lean
          lean -o CQuotientSound32.olean CQuotientSound32.lean
          lean -o CMapIf32.olean CMapIf32.lean
          lean -o CGlobal32.olean CGlobal32.lean
          lean -o CFull32.olean CFull32.lean
          lean -o CExclusions32.olean CExclusions32.lean
          lean -o CSourceBridge32.olean CSourceBridge32.lean
          lean -o M32EightCells.olean M32EightCells.lean
      - name: Source-integrate full-depth M32 reachability and halting-index exclusions
        run: |
          cd tools
          cp "$GITHUB_WORKSPACE"/im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean .
          cp "$GITHUB_WORKSPACE"/im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean .
          cp "$GITHUB_WORKSPACE"/im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef,FastSectionProof,FastSectionHalting,Agent46CBridge}.lean .
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-odd-image/{Agent3CImage,Agent3COneFamily,Agent3COrbitIff}.lean .
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/{BounceInverse,FeederGeneric,FeederOrbitGeneric,GeneralHighInverse,EvenTargetForward,EvenTargetExact,EvenTargetOrbit}.lean .
          cp "$GITHUB_WORKSPACE"/im-results/agent15-c-halting/{SectionAffineInverse,ReachAffine,AffineNormalize,AffineParityDepth,M32SectionEmbedding,M32SecondArithmetic,M32SecondDepth}.lean .
          cp "$GITHUB_WORKSPACE"/im-results/agent11-c-first-family/{OddDepthGeneric,OddDepthResidue,M32AllDepthConditional,M32PullbackConditional,M32AllDepthOriginal}.lean .
          export LEAN_PATH=.
          for f in GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef FastSectionProof FastSectionHalting Agent46CBridge Agent3CImage Agent3COneFamily Agent3COrbitIff BounceInverse FeederGeneric FeederOrbitGeneric GeneralHighInverse EvenTargetForward EvenTargetExact EvenTargetOrbit SectionAffineInverse ReachAffine AffineNormalize AffineParityDepth OddDepthGeneric OddDepthResidue M32AllDepthConditional M32SectionEmbedding M32PullbackConditional M32AllDepthOriginal M32SecondArithmetic M32SecondDepth; do
            echo "Lean source-check: $f"
            lean -o "$f.olean" "$f.lean"
          done
