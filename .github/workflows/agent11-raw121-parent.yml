name: Agent 11 weighted parent source audits
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Run the original monolithic audit or the interruption-safe six-shard audit'
        type: choice
        options: [full, sharded, raw39-1rb, raw39-0rc]
        default: full
permissions:
  contents: write
jobs:
  check:
    if: inputs.target == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct pinned Raw121 tree and generate all leaf certificates
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent11-raw121/prepare_raw121.py
      - name: Compile original-source weighted parent certificate
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py --workdir /tmp/a11-raw121-parent --jobs 4 im-results/agent11-raw121/Raw121Data.lean | tee /tmp/a11-raw121-parent.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw121-parent.log; then
            exit 1
          fi
      - name: Commit verified Raw121 source certificate
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/agent11-raw121/Raw121Pumps.lean \
            im-results/agent11-raw121/Raw121Quadratic.lean \
            im-results/agent11-raw121/Raw121Counter.lean \
            im-results/agent11-raw121/Raw121QuadraticExtra.lean \
            im-results/agent11-raw121/Raw121Base.lean \
            im-results/agent11-raw121/Raw121Kid*.lean \
            im-results/agent11-raw121/Raw121Data.lean \
            im-results/agent11-raw121/parent-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Agent 11: add source-checked raw121 parent certificate"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

  raw121-shards:
    if: inputs.target == 'sharded'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: ['00-03', '04-07', '08-11', '12-15', '16-19', '20-23']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct the exact Raw121 source tree and leaf generators
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent11-raw121/prepare_raw121.py
      - name: Compile one independent four-child Raw121 shard
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          root=im-results/agent11-raw121
          case "$GROUP" in
            00-03) children="Raw121Kid00 Raw121Kid01 Raw121Kid02 Raw121Kid03" ;;
            04-07) children="Raw121Kid04 Raw121Kid05 Raw121Kid06 Raw121Kid07" ;;
            08-11) children="Raw121Kid08 Raw121Kid09 Raw121Kid10 Raw121Kid11" ;;
            12-15) children="Raw121Kid12 Raw121Kid13 Raw121Kid14 Raw121Kid15" ;;
            16-19) children="Raw121Kid16 Raw121Kid17 Raw121Kid18 Raw121Kid19" ;;
            20-23) children="Raw121Kid20 Raw121Kid21 Raw121Kid22 Raw121Kid23" ;;
            *) exit 2 ;;
          esac
          roots=()
          for child in $children; do roots+=("$root/$child.lean"); done
          work=/tmp/a11-raw121-shard
          python tools/lean_compile_closure.py \
            --workdir "$work" --jobs 4 \
            --manifest "$work/manifest.json" \
            --label "raw121-shard-$GROUP" \
            --artifact-name "raw121-shard-$GROUP" \
            --provenance-input im-results/agent11-raw121/prepare_raw121.py \
            --provenance-input im-results/agent11-raw121/specs.json \
            --provenance-input im-results/agent11-raw121/fast_enum.cpp \
            --provenance-input im-results/agent11-raw121/bank.cpp \
            --provenance-input im-results/agent11-raw121/bank.txt \
            --provenance-input im-results/agent11-raw121/counter.py \
            --provenance-input im-results/agent11-raw121/counter_codegen.py \
            --provenance-input im-results/agent11-raw121/long.json \
            --provenance-input im-results/agent11-raw121/quad.py \
            --provenance-input im-results/agent11-raw121/quad_codegen.py \
            --provenance-input im-results/agent11-raw121/quad_extra_codegen.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            --provenance-input im-results/agent10-tnf-multipump/multi.py \
            --provenance-input im-results/agent10-tnf-multipump/chunk_checks.py \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent11-raw121/shards.json \
            --provenance-input im-results/agent4-raw109/merge_shards.py \
            --provenance-input .github/workflows/agent11-raw121-parent.yml \
            --provenance-input tools/lean_compile_closure.py \
            "${roots[@]}" 2>&1 | tee /tmp/a11-raw121-shard.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw121-shard.log; then
            exit 1
          fi
      - name: Preserve validated Raw121 shard objects and manifest
        uses: actions/upload-artifact@v4
        with:
          name: raw121-shard-${{ matrix.group }}
          path: /tmp/a11-raw121-shard/
          if-no-files-found: error
          retention-days: 30

  raw121-assemble:
    if: inputs.target == 'sharded'
    needs: raw121-shards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct exact generated sources for manifest validation
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent11-raw121/prepare_raw121.py
      - uses: actions/download-artifact@v4
        with:
          pattern: raw121-shard-*
          path: /tmp/a11-raw121-shards
      - name: Merge only source-identical dependency-closed Raw121 shards
        run: |
          set -euo pipefail
          python im-results/agent4-raw109/merge_shards.py \
            /tmp/a11-raw121-shards /tmp/a11-raw121-union \
            im-results/agent11-raw121/shards.json
      - name: Compile the unconditional Raw121 parent theorem from the shard union
        run: |
          set -euo pipefail
          work=/tmp/a11-raw121-parent
          python tools/lean_compile_closure.py \
            --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" \
            --label raw121-parent \
            --theorem BB6.Agent11Raw121.all121 \
            --parent-table '1RB---_1RC---_0RD---_1LD1RE_---1RE_------' \
            --weighted-bound 4063 \
            --artifact-name raw121-parent-proof \
            --precompiled-manifest /tmp/a11-raw121-union/manifest.json \
            --precompiled-dir /tmp/a11-raw121-union \
            im-results/agent11-raw121/Raw121Data.lean 2>&1 | tee /tmp/a11-raw121-parent.log
          python im-results/agent4-raw109/audit_axioms.py \
            /tmp/a11-raw121-parent.log \
            BB6.Agent11Raw121.tree121_checked \
            BB6.Agent11Raw121.all121
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw121-parent.log; then
            exit 1
          fi
      - name: Upload complete source-accepted Raw121 parent proof
        uses: actions/upload-artifact@v4
        with:
          name: raw121-parent-proof
          path: /tmp/a11-raw121-parent/
          if-no-files-found: error
          retention-days: 30
      - name: Publish generated Raw121 source certificate with push-race recovery
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/agent11-raw121/Raw121Pumps.lean \
            im-results/agent11-raw121/Raw121Quadratic.lean \
            im-results/agent11-raw121/Raw121Counter.lean \
            im-results/agent11-raw121/Raw121QuadraticExtra.lean \
            im-results/agent11-raw121/Raw121Base.lean \
            im-results/agent11-raw121/Raw121Kid*.lean \
            im-results/agent11-raw121/Raw121Data.lean \
            im-results/agent11-raw121/parent-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Agent 11: publish source-checked raw121 parent certificate"
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Raw121 source certificate pushed successfully"
                exit 0
              fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

  raw39-shards:
    if: inputs.target == 'raw39-1rb'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [g0, g1, g2, g3, g4, g5, g6]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate exact Raw39 1RB candidate source
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent11-raw39/prepare_raw39.py
      - name: Check one independent Raw39 shard
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          root=im-results/agent11-raw39
          mapfile -t modules < <(python -c 'import json,os; print("\n".join(json.load(open("im-results/agent11-raw39/shards.json"))["groups"][os.environ["GROUP"]]))')
          test "${#modules[@]}" -gt 0
          roots=()
          for module in "${modules[@]}"; do roots+=("$root/$module.lean"); done
          work=/tmp/a11-raw39-shard
          python tools/lean_compile_closure.py \
            --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" \
            --label "raw39-shard-$GROUP" \
            --artifact-name "raw39-shard-$GROUP" \
            --provenance-input "$root/prepare_raw39.py" \
            --provenance-input "$root/witnesses.json" \
            --provenance-input "$root/shards.json" \
            --provenance-input im-results/agent11-raw121/fast_enum.cpp \
            --provenance-input im-results/agent11-raw121/bank.cpp \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            --provenance-input im-results/agent10-tnf-multipump/multi.py \
            --provenance-input im-results/agent10-tnf-multipump/chunk_checks.py \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent4-raw109/merge_shards.py \
            --provenance-input .github/workflows/agent11-raw121-parent.yml \
            --provenance-input tools/lean_compile_closure.py \
            "${roots[@]}" 2>&1 | tee /tmp/a11-raw39-shard.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw39-shard.log; then exit 1; fi
      - name: Preserve source-checked Raw39 shard
        uses: actions/upload-artifact@v4
        with:
          name: raw39-shard-${{ matrix.group }}
          path: /tmp/a11-raw39-shard/
          if-no-files-found: error
          retention-days: 30

  raw39-assemble:
    if: inputs.target == 'raw39-1rb'
    needs: raw39-shards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct exact generated source
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent11-raw39/prepare_raw39.py
      - uses: actions/download-artifact@v4
        with:
          pattern: raw39-shard-*
          path: /tmp/a11-raw39-shards
      - name: Strictly merge the seven dependency-closed shards
        run: |
          set -euo pipefail
          python im-results/agent4-raw109/merge_shards.py \
            /tmp/a11-raw39-shards /tmp/a11-raw39-union \
            im-results/agent11-raw39/shards.json
      - name: Prove complete 1RB child and retain exact 14-child parent complement
        run: |
          set -euo pipefail
          work=/tmp/a11-raw39-parent
          python tools/lean_compile_closure.py \
            --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" \
            --label raw39-partial-parent \
            --theorem BB6.Agent11Raw39.cut_sound \
            --parent-table '1RB---_1RC---_0RD---_1LD0RA_------_------' \
            --weighted-bound 175 \
            --artifact-name raw39-partial-parent-proof \
            --precompiled-manifest /tmp/a11-raw39-union/manifest.json \
            --precompiled-dir /tmp/a11-raw39-union \
            im-results/agent11-raw39/Raw39Partial.lean 2>&1 | tee /tmp/a11-raw39-parent.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a11-raw39-parent.log \
            BB6.Agent11Raw39.tree1RB_checked \
            BB6.Agent11Raw39.all1RB \
            BB6.Agent11Raw39.cut_sound \
            BB6.Agent11Raw39.residual_count
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw39-parent.log; then exit 1; fi
      - name: Preserve source-checked partial parent proof
        uses: actions/upload-artifact@v4
        with:
          name: raw39-partial-parent-proof
          path: /tmp/a11-raw39-parent/
          if-no-files-found: error
          retention-days: 30
      - name: Publish generated source after acceptance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/agent11-raw39/Raw39*.lean im-results/agent11-raw39/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Agent 11: publish source-checked Raw39 1RB and partial root audit"
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

  raw39rc-shards:
    if: inputs.target == 'raw39-0rc'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [g0, g1, g2, g3, g4, g5, g6]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate exact Raw39 0RC candidate source
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent11-raw39/prepare_raw39rc.py
      - name: Check one independent Raw39 shard
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          root=im-results/agent11-raw39
          mapfile -t modules < <(python -c 'import json,os; print("\n".join(json.load(open("im-results/agent11-raw39/shards-rc.json"))["groups"][os.environ["GROUP"]]))')
          test "${#modules[@]}" -gt 0
          roots=()
          for module in "${modules[@]}"; do roots+=("$root/$module.lean"); done
          work=/tmp/a11-raw39rc-shard
          python tools/lean_compile_closure.py \
            --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" \
            --label "raw39rc-shard-$GROUP" \
            --artifact-name "raw39rc-shard-$GROUP" \
            --provenance-input "$root/prepare_raw39rc.py" \
            --provenance-input "$root/prepare_raw39.py" \
            --provenance-input "$root/gen_rc_counters.py" \
            --provenance-input "$root/Raw39CounterCarry.lean" \
            --provenance-input "$root/Raw39Hard56.lean" \
            --provenance-input "$root/rc-witnesses.json" \
            --provenance-input "$root/shards-rc.json" \
            --provenance-input im-results/agent11-raw121/fast_enum.cpp \
            --provenance-input im-results/agent11-raw121/bank.cpp \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            --provenance-input im-results/agent10-tnf-multipump/multi.py \
            --provenance-input im-results/agent10-tnf-multipump/chunk_checks.py \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent4-raw109/merge_shards.py \
            --provenance-input .github/workflows/agent11-raw121-parent.yml \
            --provenance-input tools/lean_compile_closure.py \
            "${roots[@]}" 2>&1 | tee /tmp/a11-raw39rc-shard.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw39rc-shard.log; then exit 1; fi
      - name: Preserve source-checked Raw39 shard
        uses: actions/upload-artifact@v4
        with:
          name: raw39rc-shard-${{ matrix.group }}
          path: /tmp/a11-raw39rc-shard/
          if-no-files-found: error
          retention-days: 30

  raw39rc-assemble:
    if: inputs.target == 'raw39-0rc'
    needs: raw39rc-shards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct exact generated source
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent11-raw39/prepare_raw39rc.py
      - uses: actions/download-artifact@v4
        with:
          pattern: raw39rc-shard-*
          path: /tmp/a11-raw39rc-shards
      - name: Strictly merge the seven dependency-closed shards
        run: |
          set -euo pipefail
          python im-results/agent4-raw109/merge_shards.py \
            /tmp/a11-raw39rc-shards /tmp/a11-raw39rc-union \
            im-results/agent11-raw39/shards-rc.json
      - name: Prove complete 0RC child and retain exact 14-child parent complement
        run: |
          set -euo pipefail
          work=/tmp/a11-raw39rc-parent
          python tools/lean_compile_closure.py \
            --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" \
            --label raw39rc-partial-parent \
            --theorem BB6.Agent11Raw39RC.cut_sound \
            --parent-table '1RB---_1RC---_0RD---_1LD0RA_------_------' \
            --weighted-bound 2354 \
            --artifact-name raw39rc-partial-parent-proof \
            --precompiled-manifest /tmp/a11-raw39rc-union/manifest.json \
            --precompiled-dir /tmp/a11-raw39rc-union \
            im-results/agent11-raw39/Raw39RCPartial.lean 2>&1 | tee /tmp/a11-raw39rc-parent.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a11-raw39rc-parent.log \
            BB6.Agent11Raw39RC.tree0RC_checked \
            BB6.Agent11Raw39RC.all0RC \
            BB6.Agent11Raw39RC.cut_sound \
            BB6.Agent11Raw39RC.residual_count
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw39rc-parent.log; then exit 1; fi
      - name: Preserve source-checked partial parent proof
        uses: actions/upload-artifact@v4
        with:
          name: raw39rc-partial-parent-proof
          path: /tmp/a11-raw39rc-parent/
          if-no-files-found: error
          retention-days: 30
      - name: Publish generated source after acceptance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/agent11-raw39/Raw39RC*.lean im-results/agent11-raw39/Raw39Hard194.lean im-results/agent11-raw39/manifest-rc.json
          if ! git diff --cached --quiet; then
            git commit -m "Agent 11: publish source-checked Raw39 0RC and partial root audit"
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi
