name: Agent 11 Raw121 complete parent source audit
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct pinned Raw121 tree and generate all leaf certificates
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent11-raw121/prepare_raw121.py
      - name: Compile original-source weighted parent certificate
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py --workdir /tmp/a11-raw121-parent --jobs 4 im-results/agent11-raw121/Raw121Data.lean | tee /tmp/a11-raw121-parent.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw121-parent.log; then
            exit 1
          fi
      - name: Commit verified Raw121 source certificate
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/agent11-raw121/Raw121Pumps.lean \
            im-results/agent11-raw121/Raw121Quadratic.lean \
            im-results/agent11-raw121/Raw121Counter.lean \
            im-results/agent11-raw121/Raw121QuadraticExtra.lean \
            im-results/agent11-raw121/Raw121Base.lean \
            im-results/agent11-raw121/Raw121Kid*.lean \
            im-results/agent11-raw121/Raw121Data.lean \
            im-results/agent11-raw121/parent-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Agent 11: add source-checked raw121 parent certificate"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
