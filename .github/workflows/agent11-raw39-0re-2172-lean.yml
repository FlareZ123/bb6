name: Agent 11 Raw39 focused growth proofs
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: ['0RE-2172', '1LB-width', '1LE-8865', '1LE-four-phase']
        default: '0RE-2172'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct the pinned BB6 coverage core
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
      - name: Compile the exact 2172 nonhalting certificate
        if: inputs.target == '0RE-2172'
        run: |
          set -euo pipefail
          work=/tmp/a11-raw39-0re-2172
          python tools/lean_compile_closure.py \
            --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" \
            --label raw39-0re-2172 \
            --artifact-name raw39-0re-2172-proof \
            --theorem BB6.Agent11Raw39RE2172.never \
            --provenance-input im-results/agent11-raw39/Raw39RE2172.lean \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input tools/lean_compile_closure.py \
            --provenance-input im-results/agent4-raw109/audit_axioms.py \
            --provenance-input .github/workflows/agent11-raw39-0re-2172-lean.yml \
            im-results/agent11-raw39/Raw39RE2172.lean 2>&1 | tee /tmp/a11-raw39-0re-2172.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a11-raw39-0re-2172.log \
            BB6.Agent11Raw39RE2172.phaseAB \
            BB6.Agent11Raw39RE2172.phaseBC \
            BB6.Agent11Raw39RE2172.phaseCD \
            BB6.Agent11Raw39RE2172.phaseDA \
            BB6.Agent11Raw39RE2172.cycle \
            BB6.Agent11Raw39RE2172.entry \
            BB6.Agent11Raw39RE2172.iter \
            BB6.Agent11Raw39RE2172.unbounded \
            BB6.Agent11Raw39RE2172.never
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw39-0re-2172.log; then exit 1; fi
      - name: Compile six exact width-growth counter certificates
        if: inputs.target == '1LB-width'
        run: |
          set -euo pipefail
          root=im-results/agent11-raw39
          python "$root/gen_lb_width_counters.py"
          work=/tmp/a11-raw39-lb-width
          args=()
          names=()
          for i in 4769 5156 5157 5455 5793 5794; do
            name=BB6.Agent11Raw39LBWidthCounters.M$i.never
            args+=(--theorem "$name")
            names+=("$name" "BB6.Agent11Raw39LBWidthCounters.M$i.growth")
          done
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 --manifest "$work/manifest.json" --label raw39-lb-width --artifact-name raw39-lb-width-proof "${args[@]}" --provenance-input "$root/gen_lb_width_counters.py" "$root/Raw39LBWidthCounters.lean" 2>&1 | tee /tmp/a11-raw39-lb-width.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a11-raw39-lb-width.log "${names[@]}"
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw39-lb-width.log; then exit 1; fi
      - name: Preserve width-growth proof closure
        if: inputs.target == '1LB-width'
        uses: actions/upload-artifact@v4
        with:
          name: raw39-lb-width-proof
          path: /tmp/a11-raw39-lb-width/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve the source-checked proof closure
        if: inputs.target == '0RE-2172'
        uses: actions/upload-artifact@v4
        with:
          name: raw39-0re-2172-proof
          path: /tmp/a11-raw39-0re-2172/
          if-no-files-found: error
          retention-days: 30

      - name: Compile recursive 1LE 8865 reset-language certificate
        if: inputs.target == '1LE-8865'
        run: |
          set -euo pipefail
          root=im-results/agent11-raw39
          python -c 'import base64,lzma,hashlib,pathlib; p=pathlib.Path("im-results/agent11-raw39/Raw391LE8865.lean"); b=lzma.decompress(base64.b64decode(p.with_suffix(".lean.xz.b64").read_text())); assert hashlib.sha256(b).hexdigest()=="ddb1c6799ae01327774bdd7e798f5be707dbfc62430f052a442c5e0090203427"; p.write_bytes(b)'
          work=/tmp/a11-raw39-1le-8865
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 --manifest "$work/manifest.json" --label raw39-1le-8865 --artifact-name raw39-1le-8865-proof --theorem BB6.Agent11Raw391LE8865.never --provenance-input "$root/Raw391LE8865.lean.xz.b64" "$root/Raw391LE8865.lean" 2>&1 | tee /tmp/a11-raw39-1le-8865.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a11-raw39-1le-8865.log BB6.Agent11Raw391LE8865.next BB6.Agent11Raw391LE8865.live BB6.Agent11Raw391LE8865.never
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw39-1le-8865.log; then exit 1; fi
      - name: Preserve 8865 proof closure
        if: inputs.target == '1LE-8865'
        uses: actions/upload-artifact@v4
        with:
          name: raw39-1le-8865-proof
          path: /tmp/a11-raw39-1le-8865/
          retention-days: 30

      - name: Compile four 1LE affine-growth certificates
        if: inputs.target == '1LE-four-phase'
        run: |
          set -euo pipefail
          root=im-results/agent11-raw39
          python -c 'import base64,lzma,hashlib,pathlib; p=pathlib.Path("im-results/agent11-raw39/Raw391LEFourPhase.lean"); b=lzma.decompress(base64.b64decode(p.with_suffix(".lean.xz.b64").read_text())); assert hashlib.sha256(b).hexdigest()=="f6b4214ffd898eac2882a23b9555976a1d995e04a2ff7f4d0e77b3f6bdbec2da"; p.write_bytes(b)'
          work=/tmp/a11-raw39-1le-four-phase
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 --manifest "$work/manifest.json" --label raw39-1le-four-phase --artifact-name raw39-1le-four-phase-proof --theorem BB6.Agent11Raw391LEFourPhase.never --provenance-input "$root/Raw391LEFourPhase.lean.xz.b64" "$root/Raw391LEFourPhase.lean" 2>&1 | tee /tmp/a11-raw39-1le-four-phase.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a11-raw39-1le-four-phase.log BB6.Agent11Raw391LEFourPhase.first BB6.Agent11Raw391LEFourPhase.growth BB6.Agent11Raw391LEFourPhase.never
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw39-1le-four-phase.log; then exit 1; fi
      - name: Preserve four-phase proof closure
        if: inputs.target == '1LE-four-phase'
        uses: actions/upload-artifact@v4
        with:
          name: raw39-1le-four-phase-proof
          path: /tmp/a11-raw39-1le-four-phase/
          retention-days: 30
