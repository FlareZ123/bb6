          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Regenerate and kernel-check one exact gap sibling
        run: |
          set -euo pipefail
          root=im-results/agent11-raw39
          leaf=${{ matrix.leaf }}
          module=Raw39LE$leaf
          python im-results/agent13-coverage/unpack.py
          python "$root/generate_le_gap_dfa.py" "$root" "$leaf"
          work=/tmp/a11-gap-$leaf
          python tools/lean_compile_closure.py --workdir "$work" --jobs 1 \
            --manifest "$work/manifest.json" --label "Raw39 1LE gap sibling $leaf" \
            --theorem "BB6.Agent11$module.never" --artifact-name "raw39-le-gap-$leaf" \
            --provenance-input "$root/generate_le_gap_dfa.py" \
            --provenance-input "$root/rungram_regen.py" \
            --provenance-input "$root/minimize_bi.py" \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            "$root/$module.lean" 2>&1 | tee /tmp/a11-gap.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a11-gap.log "BB6.Agent11$module.never"
      - uses: actions/upload-artifact@v4
        with:
          name: raw39-le-gap-${{ matrix.leaf }}
          path: /tmp/a11-gap-${{ matrix.leaf }}/
          if-no-files-found: error
          retention-days: 30


