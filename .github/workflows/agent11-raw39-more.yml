name: Agent 11 Raw39 additional child source audits
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Which exact A1 child to audit'
        type: choice
        options: [0RB, 1RC, 0RE, 0RC, 0LA, 1LB, 1LA, 1RE, 1LE, 0LE, inspect-1LE-holdouts, inspect-1LE-proof-sources, gap-dfa, pump-4084, pump-search-1583, canonical40-membership, parent-join, parent-ten-preflight]
        required: true
      onele_run:
        description: 'Successful complete 1LE semantic audit run ID (parent-join only)'
        required: false
        type: string
permissions:
  contents: write
  actions: read
jobs:
  shards:
    if: ${{ inputs.branch == '0RB' || inputs.branch == '1RC' || inputs.branch == '0RE' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [g0, g1, g2, g3, g4, g5, g6]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate exact Raw39 selected child candidate source
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent11-raw39/prepare_raw39_more.py '${{ inputs.branch }}'
      - name: Check one independent Raw39 shard
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          root=im-results/agent11-raw39
          mapfile -t modules < <(python -c 'import json,os; print("\n".join(json.load(open("im-results/agent11-raw39/shards-${{ inputs.branch }}.json"))["groups"][os.environ["GROUP"]]))')
          test "${#modules[@]}" -gt 0
          roots=()
          for module in "${modules[@]}"; do roots+=("$root/$module.lean"); done
          work=/tmp/a11-raw39-${{ inputs.branch }}-shard
          python tools/lean_compile_closure.py \
            --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" \
            --label "raw39-${{ inputs.branch }}-shard-$GROUP" \
            --artifact-name "raw39-${{ inputs.branch }}-shard-$GROUP" \
            --provenance-input "$root/prepare_raw39_more.py" \
            --provenance-input "$root/prepare_raw39.py" \
            --provenance-input "$root/gen_rc_counters.py" \
            --provenance-input "$root/Raw39CounterCarry.lean" \
            --provenance-input "$root/gen_auto_counters.py" \
            --provenance-input "$root/rb-rc-witnesses.json" \
            --provenance-input "$root/re-witnesses.json" \
            --provenance-input "$root/Raw39Stack468.lean" \
            --provenance-input "$root/Raw39RE2172.lean" \
            --provenance-input "$root/shards-${{ inputs.branch }}.json" \
            --provenance-input im-results/agent11-raw121/fast_enum.cpp \
            --provenance-input im-results/agent11-raw121/bank.cpp \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            --provenance-input im-results/agent10-tnf-multipump/multi.py \
            --provenance-input im-results/agent10-tnf-multipump/chunk_checks.py \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent4-raw109/merge_shards.py \
            --provenance-input .github/workflows/agent11-raw39-more.yml \
            --provenance-input tools/lean_compile_closure.py \
            "${roots[@]}" 2>&1 | tee /tmp/a11-raw39-${{ inputs.branch }}-shard.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw39-${{ inputs.branch }}-shard.log; then exit 1; fi
      - name: Preserve source-checked Raw39 shard
        uses: actions/upload-artifact@v4
        with:
          name: raw39-${{ inputs.branch }}-shard-${{ matrix.group }}
          path: /tmp/a11-raw39-${{ inputs.branch }}-shard/
          if-no-files-found: error
          retention-days: 30

  assemble:
    if: ${{ inputs.branch == '0RB' || inputs.branch == '1RC' || inputs.branch == '0RE' }}
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct exact generated source
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent11-raw39/prepare_raw39_more.py '${{ inputs.branch }}'
      - uses: actions/download-artifact@v4
        with:
          pattern: raw39-${{ inputs.branch }}-shard-*
          path: /tmp/a11-shards
      - name: Strictly merge the seven dependency-closed shards
        run: |
          set -euo pipefail
          python im-results/agent4-raw109/merge_shards.py \
            /tmp/a11-shards /tmp/a11-raw39-union \
            im-results/agent11-raw39/shards-${{ inputs.branch }}.json
      - name: Prove complete selected child and retain exact 14-child parent complement
        run: |
          set -euo pipefail
          work=/tmp/a11-raw39-parent
          BOUND=$(python -c 'import json;print(json.load(open("im-results/agent11-raw39/manifest-${{ inputs.branch }}.json"))["bound"])')
          python tools/lean_compile_closure.py \
            --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" \
            --label raw39-${{ inputs.branch }}-partial-parent \
            --theorem BB6.Agent11Raw39B${{ inputs.branch }}.cut_sound \
            --parent-table '1RB---_1RC---_0RD---_1LD0RA_------_------' \
            --weighted-bound "$BOUND" \
            --artifact-name raw39-${{ inputs.branch }}-partial-parent-proof \
            --precompiled-manifest /tmp/a11-raw39-union/manifest.json \
            --precompiled-dir /tmp/a11-raw39-union \
            im-results/agent11-raw39/Raw39B${{ inputs.branch }}Partial.lean 2>&1 | tee /tmp/a11-raw39-parent.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a11-raw39-parent.log \
            BB6.Agent11Raw39B${{ inputs.branch }}.treeChild_checked \
            BB6.Agent11Raw39B${{ inputs.branch }}.allChild \
            BB6.Agent11Raw39B${{ inputs.branch }}.cut_sound \
            BB6.Agent11Raw39B${{ inputs.branch }}.residual_count
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw39-parent.log; then exit 1; fi
      - name: Preserve source-checked partial parent proof
        uses: actions/upload-artifact@v4
        with:
          name: raw39-${{ inputs.branch }}-partial-parent-proof
          path: /tmp/a11-raw39-parent/
          if-no-files-found: error
          retention-days: 30
      - name: Publish generated source after acceptance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/agent11-raw39/Raw39B${{ inputs.branch }}*.lean im-results/agent11-raw39/manifest-${{ inputs.branch }}.json
          if ! git diff --cached --quiet; then
            git commit -m "Agent 11: publish source-checked Raw39 ${{ inputs.branch }} and partial root audit"
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi


  rc_shards:
    if: ${{ inputs.branch == '0RC' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [g0, g1, g2, g3, g4, g5, g6]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate exact Raw39 A1=0RC source candidate
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent11-raw39/prepare_raw39rc.py
      - name: Check one independent 0RC source shard
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          root=im-results/agent11-raw39
          mapfile -t modules < <(python -c 'import json,os; print("\n".join(json.load(open("im-results/agent11-raw39/shards-rc.json"))["groups"][os.environ["GROUP"]]))')
          test "${#modules[@]}" -gt 0
          roots=()
          for module in "${modules[@]}"; do roots+=("$root/$module.lean"); done
          work=/tmp/a11-raw39rc-shard
          python tools/lean_compile_closure.py \
            --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" \
            --label "raw39rc-shard-$GROUP" \
            --artifact-name "raw39rc-shard-$GROUP" \
            --provenance-input "$root/prepare_raw39rc.py" \
            --provenance-input "$root/prepare_raw39.py" \
            --provenance-input "$root/gen_rc_counters.py" \
            --provenance-input "$root/Raw39CounterCarry.lean" \
            --provenance-input "$root/rc-witnesses.json" \
            --provenance-input "$root/Raw39Hard56.lean" \
            --provenance-input "$root/manifest-rc.json" \
            --provenance-input "$root/shards-rc.json" \
            --provenance-input im-results/agent11-raw121/fast_enum.cpp \
            --provenance-input im-results/agent11-raw121/bank.cpp \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            --provenance-input im-results/agent10-tnf-multipump/multi.py \
            --provenance-input im-results/agent10-tnf-multipump/chunk_checks.py \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent4-raw109/merge_shards.py \
            --provenance-input tools/lean_compile_closure.py \
            --provenance-input .github/workflows/agent11-raw39-more.yml \
            "${roots[@]}" 2>&1 | tee /tmp/a11-raw39rc-shard.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw39rc-shard.log; then exit 1; fi
      - name: Preserve source-checked 0RC shard
        uses: actions/upload-artifact@v4
        with:
          name: raw39rc-shard-${{ matrix.group }}
          path: /tmp/a11-raw39rc-shard/
          if-no-files-found: error
          retention-days: 30

  rc_assemble:
    if: ${{ inputs.branch == '0RC' }}
    needs: rc_shards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct exact generated 0RC source
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent11-raw39/prepare_raw39rc.py
      - uses: actions/download-artifact@v4
        with:
          pattern: raw39rc-shard-*
          path: /tmp/a11-raw39rc-shards
      - name: Strictly merge the seven dependency-closed 0RC shards
        run: |
          set -euo pipefail
          python im-results/agent4-raw109/merge_shards.py \
            /tmp/a11-raw39rc-shards /tmp/a11-raw39rc-union \
            im-results/agent11-raw39/shards-rc.json
      - name: Prove the 0RC child and retain its exact 14-child parent complement
        run: |
          set -euo pipefail
          work=/tmp/a11-raw39rc-parent
          python tools/lean_compile_closure.py \
            --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" \
            --label raw39-0RC-partial-parent \
            --theorem BB6.Agent11Raw39RC.cut_sound \
            --parent-table '1RB---_1RC---_0RD---_1LD0RA_------_------' \
            --weighted-bound 2354 \
            --artifact-name raw39-0RC-partial-parent-proof \
            --precompiled-manifest /tmp/a11-raw39rc-union/manifest.json \
            --precompiled-dir /tmp/a11-raw39rc-union \
            --provenance-input im-results/agent11-raw39/prepare_raw39rc.py \
            --provenance-input im-results/agent11-raw39/prepare_raw39.py \
            --provenance-input im-results/agent11-raw39/gen_rc_counters.py \
            --provenance-input im-results/agent11-raw39/Raw39CounterCarry.lean \
            --provenance-input im-results/agent11-raw39/rc-witnesses.json \
            --provenance-input im-results/agent11-raw39/Raw39Hard56.lean \
            --provenance-input im-results/agent11-raw39/manifest-rc.json \
            --provenance-input im-results/agent11-raw39/shards-rc.json \
            --provenance-input im-results/agent11-raw121/fast_enum.cpp \
            --provenance-input im-results/agent11-raw121/bank.cpp \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            --provenance-input im-results/agent10-tnf-multipump/multi.py \
            --provenance-input im-results/agent10-tnf-multipump/chunk_checks.py \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent4-raw109/merge_shards.py \
            --provenance-input tools/lean_compile_closure.py \
            --provenance-input .github/workflows/agent11-raw39-more.yml \
            im-results/agent11-raw39/Raw39RCPartial.lean 2>&1 | tee /tmp/a11-raw39rc-parent.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a11-raw39rc-parent.log \
            BB6.Agent11Raw39RC.tree0RC_checked \
            BB6.Agent11Raw39RC.all0RC \
            BB6.Agent11Raw39RC.cut_sound \
            BB6.Agent11Raw39RC.residual_count
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-raw39rc-parent.log; then exit 1; fi
      - name: Preserve source-checked 0RC partial parent proof
        uses: actions/upload-artifact@v4
        with:
          name: raw39-0RC-partial-parent-proof
          path: /tmp/a11-raw39rc-parent/
          if-no-files-found: error
          retention-days: 30
      - name: Publish generated 0RC source after acceptance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/agent11-raw39/Raw39RC*.lean im-results/agent11-raw39/Raw39Hard194.lean im-results/agent11-raw39/manifest-rc.json
          if ! git diff --cached --quiet; then
            git commit -m "Agent 11: publish source-checked Raw39 0RC and partial root audit"
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then exit 0; fi
              sleep $((attempt * 2))
            done
            exit 1
          fi

  prepare_1le_reuse:
    if: ${{ inputs.branch == '1LE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7c319dd192131b9af81cf7c8e963f35ae992a26
      - name: Regenerate source-accepted corrected-bound shard sources
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          root=im-results/agent11-raw39
          python "$root/prepare_raw39_semantic_children.py" 1LE
          python - "$root/shards-1LEsemantic.json" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);j=json.loads(p.read_text())
          j['artifact_prefix']='raw39-1LE-semantic-shard'
          p.write_text(json.dumps(j,indent=2)+'\n')
          j['groups']={g:j['groups'][g] for g in ('g0','g2','g3','g4','g6','g7')}
          Path('/tmp/a11-1le-old-groups.json').write_text(json.dumps(j))
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: raw39-1LE-semantic-shard-*
          run-id: 46094272482
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/a11-1le-old-shards
      - name: Merge exact original accepted proof objects
        run: |
          set -euo pipefail
          python im-results/agent4-raw109/merge_shards.py \
            /tmp/a11-1le-old-shards /tmp/a11-1le-old-union /tmp/a11-1le-old-groups.json
      - uses: actions/upload-artifact@v4
        with:
          name: raw39-1LE-old-accepted-union
          path: /tmp/a11-1le-old-union/
          if-no-files-found: error
          retention-days: 30

  semantic_shards:
    needs: prepare_1le_reuse
    if: ${{ always() && !cancelled() && (needs.prepare_1le_reuse.result == 'success' || needs.prepare_1le_reuse.result == 'skipped') && (inputs.branch == '0LA' || inputs.branch == '1LB' || inputs.branch == '1LA' || inputs.branch == '1RE' || inputs.branch == '1LE' || inputs.branch == '0LE') }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: ${{ fromJSON(inputs.branch == '1LE' && '["g0","g1","g2","g3","g4","g5","g6","g7","g8","g9","g10","g11","g12","g13","g14","g15"]' || '["g0","g1","g2","g3","g4","g5","g6","g7"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate exact semantic child
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          root=im-results/agent11-raw39
          if [ "${{ inputs.branch }}" = 0LA ]; then
            python "$root/prepare_raw39la_frontier.py"
            kind=LA
          elif [ "${{ inputs.branch }}" = 1LB ]; then
            python "$root/prepare_semantic_branch.py" 1LB
            kind=LB
          else
            kind='${{ inputs.branch }}'
            python "$root/prepare_raw39_semantic_children.py" "$kind"
          fi
          echo "KIND=$kind" >> "$GITHUB_ENV"
          python - "$root/shards-${kind}semantic.json" "${{ inputs.branch }}" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1]);j=json.loads(p.read_text());j['artifact_prefix']='raw39-'+sys.argv[2]+'-semantic-shard';p.write_text(json.dumps(j,indent=2)+'\n')
          PY


      - uses: actions/download-artifact@v4
        if: ${{ inputs.branch == '1LE' }}
        with:
          name: raw39-1LE-old-accepted-union
          path: /tmp/a11-1le-old-union
      - name: Check one independent semantic shard
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          root=im-results/agent11-raw39
          mapfile -t modules < <(python -c 'import json,os; print("\n".join(json.load(open("im-results/agent11-raw39/shards-"+os.environ["KIND"]+"semantic.json"))["groups"][os.environ["GROUP"]]))')
          test "${#modules[@]}" -gt 0
          roots=()
          for module in "${modules[@]}"; do roots+=("$root/$module.lean"); done
          work=/tmp/a11-semantic-shard
          reuse=()
          if [ "${{ inputs.branch }}" = 1LE ]; then
            reuse=(--precompiled-manifest /tmp/a11-1le-old-union/manifest.json --precompiled-dir /tmp/a11-1le-old-union)
          fi
          python tools/lean_compile_closure.py \
            --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" \
            "${reuse[@]}" \
            --label "raw39-${{ inputs.branch }}-semantic-shard-$GROUP" \
            --override FastBiDFA=im-results/agent32-raw59/FastBiDFA.lean \
            --artifact-name "raw39-${{ inputs.branch }}-semantic-shard-$GROUP" \
            --provenance-input "$root/prepare_semantic_branch.py" \
            --provenance-input "$root/prepare_raw39_semantic_children.py" \
            --provenance-input "$root/blockgram_regen.py" \
            --provenance-input "$root/minimize_bi.py" \
            --provenance-input "$root/1LA-frontier.json.xz.b64" \
            --provenance-input "$root/1RE-frontier.json.xz.b64" \
            --provenance-input "$root/1LE-frontier.json.xz.b64" \
            --provenance-input "$root/0LE-frontier.json.xz.b64" \
            --provenance-input "$root/gen4084_packed.py" \
            --provenance-input "$root/prepare_le_residual.py" \
            --provenance-input "$root/prepare_raw39la_frontier.py" \
            --provenance-input "$root/rungram_regen.py" \
            --provenance-input "$root/la-frontier.json" \
            --provenance-input "$root/lb-witnesses.json" \
            --provenance-input "$root/Raw39LBProofs.json.xz.b64" \
            --provenance-input "$root/shards-${KIND}semantic.json" \
            --provenance-input "$root/prepare_raw39.py" \
            --provenance-input "$root/gen_rc_counters.py" \
            --provenance-input im-results/agent11-raw121/fast_enum.cpp \
            --provenance-input im-results/agent11-raw121/bank.cpp \
            --provenance-input im-results/agent32-raw59/ngram_asym.cpp \
            --provenance-input im-results/agent10-tnf-multipump/multi.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent4-raw109/merge_shards.py \
            --provenance-input .github/workflows/agent11-raw39-more.yml \
            --provenance-input tools/lean_compile_closure.py \
            "${roots[@]}" 2>&1 | tee /tmp/a11-semantic-shard.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-semantic-shard.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw39-${{ inputs.branch }}-semantic-shard-${{ matrix.group }}
          path: /tmp/a11-semantic-shard/
          if-no-files-found: error
          retention-days: 30

  semantic_assemble:
    if: ${{ inputs.branch == '0LA' || inputs.branch == '1LB' || inputs.branch == '1LA' || inputs.branch == '1RE' || inputs.branch == '1LE' || inputs.branch == '0LE' }}
    needs: semantic_shards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate exact semantic child
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          root=im-results/agent11-raw39
          if [ "${{ inputs.branch }}" = 0LA ]; then
            python "$root/prepare_raw39la_frontier.py"
            kind=LA
          elif [ "${{ inputs.branch }}" = 1LB ]; then
            python "$root/prepare_semantic_branch.py" 1LB
            kind=LB
          else
            kind='${{ inputs.branch }}'
            python "$root/prepare_raw39_semantic_children.py" "$kind"
          fi
          echo "KIND=$kind" >> "$GITHUB_ENV"
          python - "$root/shards-${kind}semantic.json" "${{ inputs.branch }}" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1]);j=json.loads(p.read_text());j['artifact_prefix']='raw39-'+sys.argv[2]+'-semantic-shard';p.write_text(json.dumps(j,indent=2)+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: raw39-${{ inputs.branch }}-semantic-shard-*
          path: /tmp/a11-semantic-shards
      - name: Strictly merge independent semantic shards and check final child Bound
        run: |
          set -euo pipefail
          root=im-results/agent11-raw39
          python im-results/agent4-raw109/merge_shards.py \
            /tmp/a11-semantic-shards /tmp/a11-semantic-union "$root/shards-${KIND}semantic.json"
          work=/tmp/a11-semantic-complete
          theorem="BB6.Agent11Raw39${KIND}.all${{ inputs.branch }}"
          if [ "$KIND" = LA ]; then
            table='1RB0LA_1RC---_0RD---_1LD0RA_------_------'
            bound=1003
          elif [ "$KIND" = LB ]; then
            table='1RB1LB_1RC---_0RD---_1LD0RA_------_------'
            bound=266
          else
            read -r table bound < <(python -c 'import json,sys; j=json.load(open(sys.argv[1])); print(j["table"],j["bound"])' "$root/shards-${KIND}semantic.json")
          fi
          python tools/lean_compile_closure.py \
            --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" \
            --label "raw39-${{ inputs.branch }}-semantic-complete" \
            --override FastBiDFA=im-results/agent32-raw59/FastBiDFA.lean \
            --artifact-name "raw39-${{ inputs.branch }}-semantic-proof" \
            --theorem "$theorem" --parent-table "$table" --weighted-bound "$bound" \
            --precompiled-manifest /tmp/a11-semantic-union/manifest.json \
            --precompiled-dir /tmp/a11-semantic-union \
            --provenance-input "$root/prepare_semantic_branch.py" \
            --provenance-input "$root/prepare_raw39_semantic_children.py" \
            --provenance-input "$root/blockgram_regen.py" \
            --provenance-input "$root/minimize_bi.py" \
            --provenance-input "$root/1LA-frontier.json.xz.b64" \
            --provenance-input "$root/1RE-frontier.json.xz.b64" \
            --provenance-input "$root/1LE-frontier.json.xz.b64" \
            --provenance-input "$root/0LE-frontier.json.xz.b64" \
            --provenance-input "$root/gen4084_packed.py" \
            --provenance-input "$root/prepare_le_residual.py" \
            --provenance-input "$root/prepare_raw39la_frontier.py" \
            --provenance-input "$root/rungram_regen.py" \
            --provenance-input "$root/la-frontier.json" \
            --provenance-input "$root/lb-witnesses.json" \
            --provenance-input "$root/Raw39LBProofs.json.xz.b64" \
            --provenance-input "$root/shards-${KIND}semantic.json" \
            --provenance-input "$root/prepare_raw39.py" \
            --provenance-input "$root/gen_rc_counters.py" \
            --provenance-input im-results/agent11-raw121/fast_enum.cpp \
            --provenance-input im-results/agent11-raw121/bank.cpp \
            --provenance-input im-results/agent32-raw59/ngram_asym.cpp \
            --provenance-input im-results/agent10-tnf-multipump/multi.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent4-raw109/merge_shards.py \
            --provenance-input .github/workflows/agent11-raw39-more.yml \
            --provenance-input tools/lean_compile_closure.py \
            "$root/Raw39${KIND}Complete.lean" 2>&1 | tee /tmp/a11-semantic-complete.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a11-semantic-complete.log "$theorem"
          if grep -Eq 'sorryAx|native_decide' /tmp/a11-semantic-complete.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw39-${{ inputs.branch }}-semantic-proof
          path: /tmp/a11-semantic-complete/
          if-no-files-found: error
          retention-days: 30

  inspect_1le:
    if: ${{ inputs.branch == 'inspect-1LE-holdouts' || inputs.branch == 'inspect-1LE-proof-sources' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact residual tables and known F1 sweep variants
        if: ${{ inputs.branch == 'inspect-1LE-holdouts' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, lzma
          from pathlib import Path
          root = Path('im-results/agent11-raw39')
          data = json.loads(lzma.decompress(base64.b64decode((root/'1LE-frontier.json.xz.b64').read_text())))
          wanted = {180, 5777, 5779, 5787}
          selected = [row for row in data['residual'] if row[0] in wanted]
          print('FRONTIER_KEYS', sorted(data.keys()))
          print('RESIDUAL_COUNT', len(data['residual']))
          for row in selected:
              print('HOLDOUT', repr(row))
          assert {row[0] for row in selected} == wanted, (wanted, {row[0] for row in selected})
          packed = json.loads(lzma.decompress(base64.b64decode((root/'Raw391LESweeps.json.xz.b64').read_text())))
          for name, source in sorted(packed.items()):
              print('KNOWN_MODULE', name)
              for line in source.splitlines():
                  if '5,true' in line or '5, true' in line:
                      print('KNOWN_F1', line.strip())
          PY

      - name: Inspect reusable 1LE proof grammars
        if: ${{ inputs.branch == 'inspect-1LE-proof-sources' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, lzma
          from pathlib import Path
          root = Path('im-results/agent11-raw39')
          stems = ['Raw391LEBlockRuns', 'Raw391LE12198', 'Raw391LEPairTriple',
                   'Raw391LEMoreSweep', 'Raw391LEFiveSweep', 'Raw391LEFourPhase']
          needles = ('inductive ', 'structure ', 'def Core', 'def Saved',
                     'firstReturn', 'theorem never', 'def family', 'def Proc',
                     'def Q', 'Gap', 'Stack', 'Saved', 'Core')
          for stem in stems:
              path = root / (stem + '.lean.xz.b64')
              source = lzma.decompress(base64.b64decode(path.read_text())).decode()
              lines = source.splitlines()
              print(f'===== {stem}: {len(lines)} lines =====')
              if stem in ('Raw391LEBlockRuns', 'Raw391LE12198'):
                  for i, line in enumerate(lines):
                      print(f'{i+1}: {line}')
              else:
                  chosen = set()
                  for i, line in enumerate(lines):
                      if any(n in line for n in needles):
                          chosen.update(range(max(0, i-1), min(len(lines), i+5)))
                  for i in sorted(chosen):
                      print(f'{i+1}: {lines[i]}')
          PY

  gap_dfa:
    if: ${{ inputs.branch == 'gap-dfa' }}
    strategy:
      fail-fast: false
      matrix:
        leaf: [5777, 5779, 5787]
    runs-on: ubuntu-latest
