name: Agent 11 second stopping ray exact-source audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact second-ray inverse against unchanged Machine C source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent11-second-ray
          cp im-results/agent11-c-line/CLine.lean /tmp/agent11-second-ray/
          cp im-results/agent8-c-total-section/GenericSection.lean /tmp/agent11-second-ray/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef}.lean /tmp/agent11-second-ray/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,EvenTargetForward,BounceEvenExact,BounceOddExact,FullSectionInverse}.lean /tmp/agent11-second-ray/
          cp im-results/agent11-c-bounce-exact/SecondRayShapeOriginal.lean /tmp/agent11-second-ray/
          cd /tmp/agent11-second-ray
          export LEAN_PATH=.
          lean --version
          for f in CLine GenericSection JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef BounceInverse EvenTargetForward BounceEvenExact BounceOddExact FullSectionInverse; do
            lean -o "$f.olean" "$f.lean"
          done
          lean -o SecondRayShapeOriginal.olean SecondRayShapeOriginal.lean
          python3 "$GITHUB_WORKSPACE/im-results/agent11-c-bounce-exact/reconstruct.py"
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-bounce-exact"/{BounceOriginal,SecondGateFanArithmetic,SecondGateFanInjective,SecondGateFanOriginal,SecondRayPowerOdd,SecondRayOddComplete,SecondRayOddCount,SecondRayOddReach}.lean .
          for f in BounceOriginal SecondGateFanArithmetic SecondGateFanInjective SecondGateFanOriginal SecondRayPowerOdd SecondRayOddComplete SecondRayOddCount; do
            lean -o "$f.olean" "$f.lean"
          done
          lean SecondRayOddReach.lean
