name: Agent 11 second stopping ray exact-source audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact second-ray inverse against unchanged Machine C source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent11-second-ray
          cp im-results/agent11-c-line/CLine.lean /tmp/agent11-second-ray/
          cp im-results/agent8-c-total-section/GenericSection.lean /tmp/agent11-second-ray/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef}.lean /tmp/agent11-second-ray/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,EvenTargetForward,BounceEvenExact,BounceOddExact,FullSectionInverse}.lean /tmp/agent11-second-ray/
          cp im-results/agent11-c-bounce-exact/SecondRayShapeOriginal.lean /tmp/agent11-second-ray/
          cd /tmp/agent11-second-ray
          export LEAN_PATH=.
          lean --version
          for f in CLine GenericSection JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef BounceInverse EvenTargetForward BounceEvenExact BounceOddExact FullSectionInverse; do
            lean -o "$f.olean" "$f.lean"
          done
          lean -o SecondRayShapeOriginal.olean SecondRayShapeOriginal.lean
          python3 "$GITHUB_WORKSPACE/im-results/agent11-c-bounce-exact/reconstruct.py"
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-bounce-exact"/{BounceOriginal,SecondGateFanArithmetic,SecondGateFanInjective,SecondGateFanOriginal,SecondRayPowerOdd,SecondRayOddComplete,SecondRayOddCount,SecondRayOddReach,SecondRayAllList,SecondRayEven2,SecondRayEven2Count}.lean .
          for f in BounceOriginal SecondGateFanArithmetic SecondGateFanInjective SecondGateFanOriginal SecondRayPowerOdd SecondRayOddComplete SecondRayOddCount SecondRayOddReach SecondRayAllList SecondRayEven2 SecondRayEven2Count; do
            lean -o "$f.olean" "$f.lean"
          done
          base64 -d "$GITHUB_WORKSPACE/im-results/agent11-c-bounce-exact/SecondRayEven0.lean.xz.b64" | xz -d > SecondRayEven0.lean
          echo "3534767dfcb3b0bdd60309ce5754de4c31d2aff6ab0ce06e5ea422c0e147fd3c  SecondRayEven0.lean" | sha256sum -c -
          lean -o SecondRayEven0.olean SecondRayEven0.lean
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-bounce-exact/SecondRayZero.lean" .
          lean -o SecondRayZero.olean SecondRayZero.lean
          cp "$GITHUB_WORKSPACE/im-results/agent38-c-section-mod4/Agent38SectionParity.lean" .
          lean -o Agent38SectionParity.olean Agent38SectionParity.lean
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-bounce-exact/SecondRayRootPrune.lean" .
          lean -o SecondRayRootPrune.olean SecondRayRootPrune.lean
          base64 -d "$GITHUB_WORKSPACE/im-results/agent11-c-bounce-exact/SecondRayOneEight.lean.xz.b64" | xz -d > SecondRayOneEight.lean
          echo "cab1c6f6b2a16da04c412bd18c3f1efd36709b2c951ce37a87870a8df1413251  SecondRayOneEight.lean" | sha256sum -c -
          lean SecondRayOneEight.lean
