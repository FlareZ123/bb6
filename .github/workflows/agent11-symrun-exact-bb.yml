name: Agent 11 F424 source exactness and MItem prefix bound (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-source-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_TOOLCHAIN: leanprover/lean4:v4.36.0-rc2
    steps:
      - uses: actions/checkout@v4
        with:
          path: local-bb6
          persist-credentials: false
      - name: Prepare upstream source project, exact Cryptids commit
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain "$LEAN_TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          git clone -q https://github.com/google-deepmind/cryptids.git upstream
          git -C upstream checkout -q 3647718b5df22e1a61462dec0376bd204526285a
          test "$(git -C upstream rev-parse HEAD)" = "3647718b5df22e1a61462dec0376bd204526285a"
          printf '%s\n' "$LEAN_TOOLCHAIN" > upstream/lean-toolchain
          sed -i 's/v4.35.0-rc4/v4.36.0-rc2/g' upstream/lakefile.toml
          rm -f upstream/lake-manifest.json
      - name: Restore mathlib RC2 cache and compile original HaltShared source
        working-directory: upstream
        run: |
          set -euo pipefail
          lake update
          lake exe cache get >/tmp/mathlib-cache.log
          lake build BusyBeaver.Calculi.HaltShared
      - name: Kernel-check F424 exact source steps, outer sweeps, and MItem prefix
        working-directory: upstream
        run: |
          set -euo pipefail
          cp ../local-bb6/im-results/agent11-symrun-primitive-cost/{SourceF424Machine,SourceCostModel,SourceCostCombinators,SourceExactF424Core,SourceExactMItemPrefix424,SourceF424SymbolicTrace,SourceExactPureBB424,SourceExactPureDL424,SourceExactPureCB424,SourceExactPureStep424}.lean .
          cp ../local-bb6/im-results/agent38-symrun-state-replay/SourceExactSweepBB424.lean .
          lake env lean -o SourceCostModel.olean SourceCostModel.lean
          LEAN_PATH=. lake env lean -o SourceF424Machine.olean SourceF424Machine.lean
          LEAN_PATH=. lake env lean -o SourceCostCombinators.olean SourceCostCombinators.lean
          LEAN_PATH=. lake env lean -o SourceExactF424Core.olean SourceExactF424Core.lean
          LEAN_PATH=. lake env lean -o SourceExactMItemPrefix424.olean SourceExactMItemPrefix424.lean | tee /tmp/agent11-mitem-prefix.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent11-mitem-prefix.log
          LEAN_PATH=. lake env lean -o SourceF424SymbolicTrace.olean SourceF424SymbolicTrace.lean | tee /tmp/agent11-symbolic-trace.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent11-symbolic-trace.log
          LEAN_PATH=. lake env lean -o SourceExactPureBB424.olean SourceExactPureBB424.lean
          LEAN_PATH=. lake env lean -o SourceExactPureDL424.olean SourceExactPureDL424.lean
          LEAN_PATH=. lake env lean -o SourceExactPureCB424.olean SourceExactPureCB424.lean
          LEAN_PATH=. lake env lean SourceExactPureStep424.lean | tee /tmp/agent11-full-f424.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent11-full-f424.log
          LEAN_PATH=. lake env lean SourceExactSweepBB424.lean | tee /tmp/agent38-symrun-sweeps.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent38-symrun-sweeps.log
          echo "PASS: F424 source exact stepPure costs, outer sweeps, and blank-to-MItem prefix bound"
