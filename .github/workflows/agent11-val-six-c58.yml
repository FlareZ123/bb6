name: Agent 11 C58 and ValSixFull authenticated criterion (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent11-val-six-c58:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check original C source and both Machine C low-family exclusions
        run: |
          mkdir -p /tmp/a38-section
          cp im-results/agent11-c-line/CLine.lean /tmp/a38-section/
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/a38-section/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/a38-section/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef,FastSectionProof,FastSectionHalting,BounceParity,BounceHaltLevel,BounceHaltingInputs,BounceHaltBasin,BounceHaltClosed,OddSectionExponential,SectionHaltingBasin,SectionCompleteBasin,Agent46CBridge,BlankDyadicGate}.lean /tmp/a38-section/
          cp im-results/agent38-c-section-mod4/{Agent38SectionParity,DyadicDepthPrune,DyadicResidualCriterion,SectionMod8Predecessor,FurtherDyadicMod16}.lean /tmp/a38-section/
          cp im-results/agent38-c-section-mod4/ThirdStageOddDepth.lean.xz.b64 /tmp/a38-section/
          cd /tmp/a38-section
          base64 -d ThirdStageOddDepth.lean.xz.b64 | xz -d > ThirdStageOddDepth.lean
          echo '48fb1fcbf2b3a409c7bafb07a9f1df78a087b02d8cadeac51b2b81b02f301ed0  ThirdStageOddDepth.lean' | sha256sum -c -
          export LEAN_PATH="."
          lean --version
          lean -o CLine.olean CLine.lean
          lean -o GenericSection.olean GenericSection.lean
          lean -o CReachBridge.olean CReachBridge.lean
          lean -o CPhaseRank.olean CPhaseRank.lean
          lean -o CSectionTotal.olean CSectionTotal.lean
          lean -o JumpHigh.olean JumpHigh.lean
          lean -o JumpMacro.olean JumpMacro.lean
          lean -o JumpSection.olean JumpSection.lean
          lean -o JumpBounce.olean JumpBounce.lean
          lean -o JumpOneReturn.olean JumpOneReturn.lean
          lean -o JumpBounceSections.olean JumpBounceSections.lean
          lean -o BounceCalc.olean BounceCalc.lean
          lean -o BounceProof.olean BounceProof.lean
          lean -o FastSectionDef.olean FastSectionDef.lean
          lean -o FastSectionProof.olean FastSectionProof.lean
          lean -o FastSectionHalting.olean FastSectionHalting.lean
          lean -o BounceParity.olean BounceParity.lean
          lean -o BounceHaltLevel.olean BounceHaltLevel.lean
          lean -o BounceHaltingInputs.olean BounceHaltingInputs.lean
          lean -o BounceHaltBasin.olean BounceHaltBasin.lean
          lean -o BounceHaltClosed.olean BounceHaltClosed.lean
          lean -o Agent38SectionParity.olean Agent38SectionParity.lean
          lean -o DyadicDepthPrune.olean DyadicDepthPrune.lean
          lean -o SectionHaltingBasin.olean SectionHaltingBasin.lean
          lean -o OddSectionExponential.olean OddSectionExponential.lean
          lean -o SectionCompleteBasin.olean SectionCompleteBasin.lean
          lean -o Agent46CBridge.olean Agent46CBridge.lean
          lean -o BlankDyadicGate.olean BlankDyadicGate.lean
          lean -o DyadicResidualCriterion.olean DyadicResidualCriterion.lean
          lean -o SectionMod8Predecessor.olean SectionMod8Predecessor.lean
          lean -o FurtherDyadicMod16.olean FurtherDyadicMod16.lean
          lean -o ThirdStageOddDepth.olean ThirdStageOddDepth.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-odd-image/{Agent3CImage,Agent3COneFamily,Agent3COrbitIff}.lean .
          for f in Agent3CImage Agent3COneFamily Agent3COrbitIff; do
            lean -o "$f.olean" "$f.lean"
          done
          cp ${GITHUB_WORKSPACE}/im-results/agent15-c-halting/{BounceHalting,SectionHalting,SectionPower,BlankHalting,SectionParam,BlankParam,SectionAffineInverse,ReachAffine}.lean .
          for f in BounceHalting SectionHalting SectionPower BlankHalting SectionParam BlankParam SectionAffineInverse ReachAffine; do
            lean -o "$f.olean" "$f.lean"
          done
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-bounce-inverse/{BounceInverse,FeederGeneric,FeederOrbitGeneric}.lean .
          for f in BounceInverse FeederGeneric FeederOrbitGeneric; do
            lean -o "$f.olean" "$f.lean"
          done
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/{C48Inverse,C48Reach,C48Depth,C48Residual,C16Inverse,C16Reach,C16Depth,C16Residual}.lean .
          for f in C48Inverse C48Reach C48Depth C48Residual C16Inverse C16Reach C16Depth; do
            lean -o "$f.olean" "$f.lean"
          done
          lean -o C16Residual.olean C16Residual.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/UniformInverse.lean .
          lean -o UniformInverse.olean UniformInverse.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/UniformReach.lean .
          lean -o UniformReach.olean UniformReach.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-odd-image/BounceReverse.lean .
          lean -o BounceReverse.olean BounceReverse.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/UniformEdges.lean .
          lean -o UniformEdges.olean UniformEdges.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/UniformOrbitIff.lean .
          lean -o UniformOrbitIff.olean UniformOrbitIff.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/UniformS25Inverse.lean .
          lean -o UniformS25Inverse.olean UniformS25Inverse.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/UniformS25Reach.lean .
          lean -o UniformS25Reach.olean UniformS25Reach.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/UniformS25Residual.lean .
          lean -o UniformS25Residual.olean UniformS25Residual.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/EvenEvenInverse.lean .
          lean -o EvenEvenInverse.olean EvenEvenInverse.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/S5FirstInverse.lean .
          lean -o S5FirstInverse.olean S5FirstInverse.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/S5Reach.lean .
          lean -o S5Reach.olean S5Reach.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/ExtraEvenOrbit.lean .
          lean -o ExtraEvenOrbit.olean ExtraEvenOrbit.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/OddEvenInverse.lean .
          lean -o OddEvenInverse.olean OddEvenInverse.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/EvenRightSixOrbit.lean .
          lean -o EvenRightSixOrbit.olean EvenRightSixOrbit.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/OneTwoGate.lean .
          lean -o OneTwoGate.olean OneTwoGate.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/OneTenGate.lean .
          lean -o OneTenGate.olean OneTenGate.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/SixCone.lean .
          lean -o SixCone.olean SixCone.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/SixResidual.lean .
          lean -o SixResidual.olean SixResidual.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/HighOddTwo.lean .
          lean -o HighOddTwo.olean HighOddTwo.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/SevenResidual.lean .
          lean -o SevenResidual.olean SevenResidual.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/HighOddSix.lean .
          lean -o HighOddSix.olean HighOddSix.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent24-c48/EightResidual.lean .
          lean -o EightResidual.olean EightResidual.lean

          # Agent3 exact odd/odd inverse and unique mixed-four ancestor chain.
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-bounce-inverse/{EvenTargetForward,BounceEvenExact,BounceOddExact,BounceEvenThree,BounceEvenNoFour,BounceAllExact,SectionAllInverse,OddSliver,OddSevenSliver,OddOddWedge,OddOddOrbit,OddOddVal3,OddOddVal3Orbit,OddOddLowVal,OddSevenOrbit,OddForcedNormalize,FullForcedNormalize,MixedFourNormalize,MixedLowFour,MixedHighOne,MixedHighBoth,MixedEvenEightSharp,MixedHighEightSharp,JointResidual}.lean .
          for f in EvenTargetForward BounceEvenExact BounceOddExact BounceEvenThree BounceEvenNoFour BounceAllExact SectionAllInverse OddSliver OddSevenSliver OddOddWedge OddOddOrbit OddOddVal3 OddOddVal3Orbit OddOddLowVal OddSevenOrbit OddForcedNormalize FullForcedNormalize MixedFourNormalize MixedLowFour MixedHighOne MixedHighBoth MixedEvenEightSharp MixedHighEightSharp; do
            lean -o "$f.olean" "$f.lean"
          done
          lean -o JointResidual.olean JointResidual.lean
          # Convert the exact rooted stopping criteria to executable
          # parameter predicates through Agent11's original-source
          # fixed-target backward reachability oracle.
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-bounce-inverse/FullSectionInverse.lean .
          lean -o FullSectionInverse.olean FullSectionInverse.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent11-c-bounce-exact/{SectionMassOriginal,SectionFastInverseOriginal,SectionBackwardOriginal,SectionFuelOriginal,SectionBackwardFuelOriginal,FastRootBackward,FastRootFuel}.lean .
          for f in SectionMassOriginal SectionFastInverseOriginal SectionBackwardOriginal SectionFuelOriginal SectionBackwardFuelOriginal FastRootBackward FastRootFuel; do
            lean -o "$f.olean" "$f.lean"
          done
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-bounce-inverse/{MixedFastRoot,JointRootQuantifier}.lean .
          lean -o MixedFastRoot.olean MixedFastRoot.lean
          lean -o JointRootQuantifier.olean JointRootQuantifier.lean
          # New exact source-checked two-dimensional rectangle and
          # disjoint infinite high stopping class.
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-bounce-inverse/{MixedRectangle25Four,MixedHighRect411}.lean .
          lean -o MixedRectangle25Four.olean MixedRectangle25Four.lean
          lean -o MixedHighRect411.olean MixedHighRect411.lean
          # Stronger source-inverse rectangle including cells M512 admits.
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-bounce-inverse/{MixedRectangle27Zero,MixedHighRect512}.lean .
          lean -o MixedRectangle27Zero.olean MixedRectangle27Zero.lean
          lean -o MixedHighRect512.olean MixedHighRect512.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-bounce-inverse/JointRootQuantifierRect.lean .
          lean -o JointRootQuantifierRect.olean JointRootQuantifierRect.lean

          # Agent19's all-exponent and four odd-special source-proven high filters.
          cp ${GITHUB_WORKSPACE}/im-results/agent19-c-odd-dyadic/{OddTowerGeneric,OddTowerArithmetic,OddTowerGeneralHigh,OddTowerSource,OddTowerResidual,OddTowerResidualAll,OddSpecialCylinders,OddSpecialHigh,OddSpecialLift,OddSpecialHighLift,JointAllRoot}.lean .
          for f in OddTowerGeneric OddTowerArithmetic OddTowerGeneralHigh OddTowerSource OddTowerResidual OddTowerResidualAll OddSpecialCylinders OddSpecialHigh OddSpecialLift OddSpecialHighLift; do
            lean -o "$f.olean" "$f.lean"
          done
          lean -o JointAllRoot.olean JointAllRoot.lean
          # Agent11 exact missing-image source exclusions and combined iff.
          cp ${GITHUB_WORKSPACE}/im-results/agent11-c-bounce-exact/{LowOneModFour,LowInverseOne,HighSumTwo,HighInverseSumOne,JointImageSieve}.lean .
          lean -o LowOneModFour.olean LowOneModFour.lean
          lean -o LowInverseOne.olean LowInverseOne.lean
          lean -o HighSumTwo.olean HighSumTwo.lean
          lean -o HighInverseSumOne.olean HighInverseSumOne.lean
          lean -o JointImageSieve.olean JointImageSieve.lean
          # Fifth authenticated blank-root inverse sector and exact decision.
          cp ${GITHUB_WORKSPACE}/im-results/agent19-c-odd-dyadic/{OddSevenGeneralAlgebra,OddSevenGeneralInverse,OddSevenForcedRoot,OddSevenSecondRoot,OddSevenSecondCylinder,OddSevenFourLink,OddSevenHighFourLink,MixedFiveNormalize,JointFiveSieve}.lean .
          for f in OddSevenGeneralAlgebra OddSevenGeneralInverse OddSevenForcedRoot OddSevenSecondRoot OddSevenSecondCylinder OddSevenFourLink OddSevenHighFourLink MixedFiveNormalize JointFiveSieve; do
            lean -o "$f.olean" "$f.lean"
          done
          # Agent29 original-source valuation-five exact inverse and all new
          # all-time high stopping restrictions, merged without dropping
          # any prior low/high original-blank allowed filter.
          cp ${GITHUB_WORKSPACE}/im-results/agent29-mod128-root/{RootMod128Arithmetic,RootMod128Inverse,RootMod128Source,RootMod128High,RootMod128HighSource,RootMod128ThreeArithmetic,RootMod128ThreeSource,RootMod128ThreeHigh,RootMod128FourArithmetic,RootMod128FourSource,RootMod128FourHigh,RootMod128AfterSevenHigh,JointMod128Root,JointNonredundant,JointExplicitFamilies,RootMod128Sharp}.lean .
          for f in RootMod128Arithmetic RootMod128Inverse RootMod128Source RootMod128High RootMod128HighSource RootMod128ThreeArithmetic RootMod128ThreeSource RootMod128ThreeHigh RootMod128FourArithmetic RootMod128FourSource RootMod128FourHigh RootMod128AfterSevenHigh JointMod128Root JointNonredundant JointExplicitFamilies RootMod128Sharp; do
            lean -o "$f.olean" "$f.lean"
          done
          # Agent29: prior-filter admissibility of all m=1, j=10 modulo32 indices.
          cp ${GITHUB_WORKSPACE}/im-results/agent29-forced-depth/JointM1PriorAllowed.lean .
          lean -o JointM1PriorAllowed.olean JointM1PriorAllowed.lean

          # Agent 3: source-certify two new valuation-six high exclusions
          # and the lossless strongest combined BB6 Machine C stopping iff.
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-bounce-inverse/{ValSixArithmetic,ValSixInverse,ValSixSource,ValSixHighArithmetic,ValSixHighSource,ValSixSecondArithmetic,ValSixSecondInverse,ValSixSecondSource,ValSixSecondConeArithmetic,ValSixSecondConeSource,ValSixSecondHighArithmetic,ValSixSecondHighSource,ValSixJoint,ValSixNovel,ValSixThirdConeArithmetic,ValSixThirdConeSource,ValSixThirdHighArithmetic,ValSixThirdHighSource,ValSixJointThree,ValSixThirdNovel,ValSixMixedNormalize,ValSixJointFast}.lean .
          for f in ValSixArithmetic ValSixInverse ValSixSource ValSixHighArithmetic ValSixHighSource ValSixSecondArithmetic ValSixSecondInverse ValSixSecondSource ValSixSecondConeArithmetic ValSixSecondConeSource ValSixSecondHighArithmetic ValSixSecondHighSource ValSixJoint ValSixNovel ValSixThirdConeArithmetic ValSixThirdConeSource ValSixThirdHighArithmetic ValSixThirdHighSource ValSixJointThree ValSixThirdNovel ValSixMixedNormalize ValSixJointFast; do
            lean -o "$f.olean" "$f.lean"
          done

          # Agent29's infinite m=1 right-four tower: compile its exact
          # affine normalizer and true blank-root exclusion into this same
          # original-source dependency chain before integrating the sieve.
          cp ${GITHUB_WORKSPACE}/im-results/agent15-c-halting/{AffineNormalize,AffineParityDepth,AffineHaltOneStep,SecondDeepSector}.lean .
          for f in AffineNormalize AffineParityDepth AffineHaltOneStep SecondDeepSector; do
            lean -o "$f.olean" "$f.lean"
          done
          cp ${GITHUB_WORKSPACE}/im-results/agent29-forced-depth/{ModThree,DeepSecondFinal,BottomBoundary,DeepFourExclude,SecondOneInfinite}.lean .
          for f in ModThree DeepSecondFinal BottomBoundary DeepFourExclude SecondOneInfinite; do
            lean -o "$f.olean" "$f.lean"
          done
          # Final strengthened Machine C iff: remove the infinite m=1
          # family while preserving the exact five-gate root oracle.
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-bounce-inverse/ValSixJointM1.lean .
          lean -o ValSixJointM1.olean ValSixJointM1.lean
          # Agent19/29 exact affine terminal-right-four boundary and the
          # full cross-agent merge of all established parameter exclusions.
          cp ${GITHUB_WORKSPACE}/im-results/agent29-forced-depth/AffineFourGlobal.lean .
          lean -o AffineFourGlobal.olean AffineFourGlobal.lean
          # Agent3's original-source low/high 124 stopping exclusions.
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-bounce-inverse/{Low124Cone,Low124Rectangle,Low124Stop,High124Stop}.lean .
          for f in Low124Cone Low124Rectangle Low124Stop High124Stop; do
            lean -o "$f.olean" "$f.lean"
          done
          # Agent19's second sum-seven inverse cylinder.
          cp ${GITHUB_WORKSPACE}/im-results/agent19-c-odd-dyadic/OddSevenSecondCylinder.lean .
          lean -o OddSevenSecondCylinder.olean OddSevenSecondCylinder.lean
          # Agent3's two additional original-source mixed rectangles.
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-bounce-inverse/{MixedRectangle25Four,MixedRectangle27Zero}.lean .
          for f in MixedRectangle25Four MixedRectangle27Zero; do
            lean -o "$f.olean" "$f.lean"
          done
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-bounce-inverse/ValSixJointFull.lean .
          lean -o ValSixJointFull.olean ValSixJointFull.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent15-c-halting/SectionDyadic.lean .
          lean -o SectionDyadic.olean SectionDyadic.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent11-c-low58/{Low58Source,Low14Source,Rect58Source,ValSixC58}.lean .
          for f in Low58Source Low14Source Rect58Source; do
            lean -o "$f.olean" "$f.lean"
          done
          lean -o ValSixC58.olean ValSixC58.lean
          # Source-check nonredundant infinite j=7+64t, m=3 high-cone family.
          cp ${GITHUB_WORKSPACE}/im-results/agent11-c-low58/HighDyadicPrior.lean .
          lean -o HighDyadicPrior.olean HighDyadicPrior.lean
          # Source-exact joint C58+ValSix+high dyadic stopping criterion.
          cp ${GITHUB_WORKSPACE}/im-results/agent19-c-odd-dyadic/{DyadicSixCone,HighDyadicArithmetic,HighDyadicLowVal}.lean .
          lean -o DyadicSixCone.olean DyadicSixCone.lean
          lean -o HighDyadicArithmetic.olean HighDyadicArithmetic.lean
          lean -o HighDyadicLowVal.olean HighDyadicLowVal.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent11-c-low58/ValSixC58Dyadic.lean .
          lean ValSixC58Dyadic.lean
          # Agent 3: sharper all-time section mass theorem, exact quarter-fuel
          # backwards oracle, and authentic merged C58/ValSix stopping iff.
          cp ${GITHUB_WORKSPACE}/im-results/agent3-c-bounce-inverse/{StrongMassOriginal,StrongMassQuarter,ValSixC58Quarter}.lean .
          lean -o StrongMassOriginal.olean StrongMassOriginal.lean
          lean -o StrongMassQuarter.olean StrongMassQuarter.lean
          lean ValSixC58Quarter.lean
