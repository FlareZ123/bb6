name: Agent 12 BB6 P1 Lean kernel checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and hash-check standalone baseline
        run: |
          python -c 'from pathlib import Path; import base64,hashlib,lzma; p=Path("im-results/agent12-backwards"); b=lzma.decompress(base64.b64decode((p/"InfiniteMod8Barrier.lean.xz.b64").read_text().strip())); assert hashlib.sha256(b).hexdigest()=="ea708a402104f1b333ba1e50cda8fe889ada6c01f1b5c4d997b4586d30d08501"; (p/"NoFourthTarget.lean").write_bytes(b)'
          python -c 'from pathlib import Path; Path("lean-toolchain").write_text("leanprover/lean4:v4.36.0-rc2\n")'
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Kernel check baseline and four extension modules
        working-directory: im-results/agent12-backwards
        env:
          LEAN_PATH: .
        run: |
          lean -o NoFourthTarget.olean NoFourthTarget.lean
          lean -o InfiniteMod16Barrier.olean InfiniteMod16Barrier.lean
          lean -o RankCutoff.olean RankCutoff.lean
          lean -o Mod16SixBarrier.olean Mod16SixBarrier.lean
          lean -o Mod32SixBarrier.olean Mod32SixBarrier.lean
          lean -o Mod64SixBarrier.olean Mod64SixBarrier.lean
          lean -o EvenEvenCorridor.olean EvenEvenCorridor.lean
          lean -o AllOddCritical.olean AllOddCritical.lean
          lean -o AllFourCritical.olean AllFourCritical.lean

      - name: Source-level reflective P1 inverse certificate and critical exclusion
        env:
          LEAN_PATH: "im-results/agent1-p1-map:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent47-p1-finite-inverse:im-results/agent12-backwards"
        run: |
          lean -o im-results/agent1-p1-map/GParity.olean im-results/agent1-p1-map/GParity.lean
          lean -o im-results/agent1-p1-map/GInverse.olean im-results/agent1-p1-map/GInverse.lean
          lean -o im-results/agent1-p1-map/PosEvenForm.olean im-results/agent1-p1-map/PosEvenForm.lean
          lean -o im-results/agent1-p1-map/ResetGate.olean im-results/agent1-p1-map/ResetGate.lean
          for m in P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do
            lean -o "im-results/agent50-p1-residue/$m.olean" "im-results/agent50-p1-residue/$m.lean"
          done
          lean -o im-results/agent47-p1-finite-inverse/P1FiniteInverse.olean im-results/agent47-p1-finite-inverse/P1FiniteInverse.lean
          lean -o im-results/agent47-p1-finite-inverse/P1InverseLog.olean im-results/agent47-p1-finite-inverse/P1InverseLog.lean
          lean -o im-results/agent47-p1-finite-inverse/P1InverseFixed.olean im-results/agent47-p1-finite-inverse/P1InverseFixed.lean
          lean -o im-results/agent4-p1-cone2398/ConeKernel.olean im-results/agent4-p1-cone2398/ConeKernel.lean
          lean im-results/agent12-backwards/P1NumericReflection.lean
          lean -o im-results/agent12-backwards/P1R382Gap.olean im-results/agent12-backwards/P1R382Gap.lean
          python -c 'from pathlib import Path; import base64,lzma,hashlib; p=Path("im-results/agent12-backwards"); b=lzma.decompress(base64.b64decode((p/"P1R382AffineReflection.lean.xz.b64").read_text().strip())); assert hashlib.sha256(b).hexdigest()=="ca916346fe599eeafbad9a21309df89180daa756918afc82e42d405ecedd4b36"; (p/"P1R382AffineReflection.lean").write_bytes(b)'
          python im-results/agent12-backwards/patch_p1_r382_proof.py
          lean -o im-results/agent12-backwards/P1R382AffineReflection.olean im-results/agent12-backwards/P1R382AffineReflection.lean
          lean -o im-results/agent12-backwards/P1RAffineGeneralGap.olean im-results/agent12-backwards/P1RAffineGeneralGap.lean
          python -c 'from pathlib import Path; import base64,lzma,hashlib; p=Path("im-results/agent12-backwards"); b=lzma.decompress(base64.b64decode((p/"P1RAffineGeneral.lean.xz.b64").read_text().strip())); assert hashlib.sha256(b).hexdigest()=="d627ad7ee677c7f6e2ef06941167cc148501f4a973ed0850c74f2b6aed40bf0b"; (p/"P1RAffineGeneral.lean").write_bytes(b)'
          lean im-results/agent12-backwards/P1RAffineGeneral.lean

      - name: Exact symbolic infinite-family P1 affine cone census
        run: |
          node im-results/agent12-backwards/p1_r382_affine_cone.cjs > /tmp/p1_r382_affine_cone.json
          python -c 'import json; d=json.load(open("/tmp/p1_r382_affine_cone.json")); assert d["hubCount"]==31 and d["leafCount"]==62'
