name: Agent 12 Raw115 canonical integration
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Link source-audited parent and exact canonical roster
        run: python im-results/agent12-raw115-consumer/assemble.py --work /tmp/raw115-canonical63
      - uses: actions/upload-artifact@v4
        with:
          name: raw115-canonical63-audit
          path: |
            /tmp/raw115-canonical63/linked/*.olean
            /tmp/raw115-canonical63/*.json
            /tmp/raw115-canonical63/*.log
          if-no-files-found: error
