name: Agent 12 focused Raw115 sparse-shard recovery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 496465aee626aaf2237367fb90888499692dc772
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: recovery-driver
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Recover exact original-source parent from pinned successful producer jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          driver=recovery-driver/im-results/agent12-raw115-consumer
          cp "$driver/recover_raw115.py" "$driver/recovery-pins.json" /tmp/
          rm -rf recovery-driver
          python /tmp/recover_raw115.py --pins /tmp/recovery-pins.json --work /tmp/raw115
      - uses: actions/upload-artifact@v4
        with:
          name: raw115-certified-root
          path: |
            /tmp/raw115/audit/*.olean
            /tmp/raw115/audit/*.lean
            /tmp/raw115/audit/source-manifest.json
            /tmp/raw115/audit/producer-audit.json
            /tmp/raw115/root.log
          if-no-files-found: error
