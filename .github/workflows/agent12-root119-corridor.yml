name: Agent 12 Root119 left-corridor source certificate (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Decode exact source and check authentic imports
        run: |
          set -euo pipefail
          A=im-results/agent42-root119-guard
          B=im-results/agent12-root119-left-corridor
          export LEAN_PATH="$A:$B"
          python -c "import base64,lzma,hashlib,pathlib; p=pathlib.Path('$B/Root119Corridor.lean.xz.b64'); b=lzma.decompress(base64.b64decode(p.read_text())); assert hashlib.sha256(b).hexdigest()=='65efa8844d8836f2579e4d7d5a71f308a2fc2f5343a0c0309f1f0c971ca2ab1d'; p.with_name('Root119Corridor.lean').write_bytes(b)"
          lean -o "$A/Root119Gate.olean" "$A/Root119Gate.lean"
          lean -o "$A/Root119BShift.olean" "$A/Root119BShift.lean"
          lean -o "$A/Root119BShield.olean" "$A/Root119BShield.lean"
          lean "$B/Root119Sharpness.lean" 2>&1 | tee "$B/sharpness-check.log"
          if grep -q 'sorryAx' "$B/sharpness-check.log"; then
            echo "::error::Untrusted sorry axiom in genuine blank-witness sharpness"
            exit 1
          fi
          grep -q 'original_blank_right_four_is_sharp.*depends on axioms' "$B/sharpness-check.log"
          lean -o "$B/Root119Ancestry.olean" "$B/Root119Ancestry.lean" 2>&1 | tee "$B/ancestry-check.log"
          lean "$B/Root119AncestryTen.lean" 2>&1 | tee "$B/ancestry-ten-check.log"
          if grep -q 'sorryAx' "$B/ancestry-ten-check.log"; then
            echo "::error::Untrusted sorry axiom in original-source ten-step inverse proof"
            exit 1
          fi
          grep -q 'reached_B0_exposed_no_right1110.*depends on axioms' "$B/ancestry-ten-check.log"
          grep -q 'reached_B0_left10x_right1111.*depends on axioms' "$B/ancestry-ten-check.log"
          if grep -q 'sorryAx' "$B/ancestry-check.log"; then
            echo "::error::Untrusted sorry axiom in reached-source ancestry proof"
            exit 1
          fi
          grep -q 'reached_B0_left101_right11.*depends on axioms' "$B/ancestry-check.log"
          grep -q 'reached_B0_left101_no_short_right.*depends on axioms' "$B/ancestry-check.log"
          lean -o "$B/Root119Corridor.olean" "$B/Root119Corridor.lean" 2>&1 | tee "$B/source-check.log"
          if grep -q 'sorryAx' "$B/source-check.log"; then
            echo "::error::Untrusted sorry axiom in proof"
            exit 1
          fi
          grep -q 'left_gateway_return.*depends on axioms' "$B/source-check.log"
          grep -q 'left_gateway_B_return.*depends on axioms' "$B/source-check.log"
          grep -q 'right_gateway_return.*depends on axioms' "$B/source-check.log"
          python -c "import base64,lzma,hashlib,pathlib; p=pathlib.Path('$B/Root119CorridorShield.lean.xz.b64'); b=lzma.decompress(base64.b64decode(p.read_text())); assert hashlib.sha256(b).hexdigest()=='0888e541438f09ef9da1ea7228d51a2446c488a3b3c42a40a955354acec023ef'; p.with_name('Root119CorridorShield.lean').write_bytes(b)"
          lean -o "$B/Root119CorridorShield.olean" "$B/Root119CorridorShield.lean" 2>&1 | tee "$B/shield-check.log"
          if grep -q 'sorryAx' "$B/shield-check.log"; then
            echo "::error::Untrusted sorry axiom in shield proof"
            exit 1
          fi
          grep -q 'right_gateway_shield.*depends on axioms' "$B/shield-check.log"
          grep -q 'left_gateway_shield.*depends on axioms' "$B/shield-check.log"
          grep -q 'left_gateway_B_shield.*depends on axioms' "$B/shield-check.log"
          python -c "import base64,lzma,hashlib,pathlib; p=pathlib.Path('$B/Root119Cross.lean.xz.b64'); b=lzma.decompress(base64.b64decode(p.read_text())); assert hashlib.sha256(b).hexdigest()=='f5dd3f8e6432dec762dbecc1b8c7a791330218bf6c21be4b599fb457606ef99d'; p.with_name('Root119Cross.lean').write_bytes(b)"
          lean "$B/Root119Cross.lean" 2>&1 | tee "$B/cross-check.log"
          if grep -q 'sorryAx' "$B/cross-check.log"; then
            echo "::error::Untrusted sorry axiom in double-sweep proof"
            exit 1
          fi
          grep -q 'double_sweep_return.*depends on axioms' "$B/cross-check.log"
          grep -q 'double_sweep_shield.*depends on axioms' "$B/cross-check.log"
