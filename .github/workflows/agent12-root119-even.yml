name: Agent12 root119 even-run D/F source proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  even:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile genuine six-state table, interval support and even sweep
        run: |
          set -e
          export LEAN_PATH="im-results/agent42-root119-guard:im-results/agent12-root119-shuttle"
          lean -o im-results/agent42-root119-guard/Root119Gate.olean im-results/agent42-root119-guard/Root119Gate.lean
          lean -o im-results/agent12-root119-shuttle/Root119ShuttleSupport.olean im-results/agent12-root119-shuttle/Root119ShuttleSupport.lean
          lean im-results/agent12-root119-shuttle/Root119EvenSweep.lean
