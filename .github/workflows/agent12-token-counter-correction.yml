name: Agent 12 corrected token normalization source proof (manual)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Proof group (core, hazards, extended, double, general, nonbinary)
        default: core
        type: choice
        options: [core, hazards, extended, double, general, nonbinary]
permissions:
  contents: read
jobs:
  source-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/cryptids
          ref: 3647718b5df22e1a61462dec0376bd204526285a
          path: cryptids
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: bb6
          persist-credentials: false
      - name: Install pinned original-source Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Mathlib cache
        working-directory: cryptids
        run: lake exe cache get
      - name: Append independent proof and kernel-check
        working-directory: cryptids
        env:
          LEAN_NUM_THREADS: "1"
          PROOF_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path("BusyBeaver/BB6/Accelerations/M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.lean")
          ending="end BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA"
          a=p.read_text().rstrip().splitlines()
          assert a[-1].strip()==ending
          b=Path("../bb6/im-results/agent12-cryptid-root-invariant/TokenCounterCorrection.append.lean").read_text()
          if os.environ["PROOF_MODE"] in ("hazards","extended"):
              b+="\n"+Path("../bb6/im-results/agent12-cryptid-root-invariant/SuffixHazards.append.lean").read_text()
              b+="\n"+Path("../bb6/im-results/agent12-cryptid-root-invariant/BinarySuffixHazards.append.lean").read_text()
          if os.environ["PROOF_MODE"] == "extended":
              b+="\n"+Path("../bb6/im-results/agent12-cryptid-root-invariant/TripleZeroSuffix.append.lean").read_text()
              b+="\n"+Path("../bb6/im-results/agent12-cryptid-root-invariant/TripleIsolatedTail.append.lean").read_text()
          if os.environ["PROOF_MODE"] in ("double","general","nonbinary"):
              b+="\n"+Path("../bb6/im-results/agent12-cryptid-root-invariant/DoubleSuffixBarrier.append.lean").read_text()
          if os.environ["PROOF_MODE"] in ("general","nonbinary"):
              b+="\n"+Path("../bb6/im-results/agent12-cryptid-root-invariant/GeneralTripleBarrier.append.lean").read_text()
          if os.environ["PROOF_MODE"] == "nonbinary":
              b+="\n"+Path("../bb6/im-results/agent12-cryptid-root-invariant/NonbinaryTripleBarrier.append.lean").read_text()
          p.write_text("\n".join(a[:-1])+"\n\n"+b+"\n"+ending+"\n")
          PY
          set -o pipefail
          lake build BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA 2>&1 | tee /tmp/token-proof.log
          if grep -q 'sorryAx' /tmp/token-proof.log; then exit 1; fi
