    steps:
      - uses: actions/checkout@v4
      - name: Install Boost multiprecision headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
      - name: Enumerate raw124 F1=0LB and search exact tape cycles to 100000 steps
        run: |
          set -euo pipefail
          W=/tmp/raw124-0lb
          mkdir -p "$W"
          g++ -O3 -std=c++17 "$GITHUB_WORKSPACE/im-results/agent2-tnf-raw99/enumerate.cpp" -o /tmp/raw124-enumerate
          cd "$W"
          /tmp/raw124-enumerate "1RB---_1RC---_0RD---_1LD1RE_---1LF_---0LB"
          test -s open.txt
          test -s tree.json
          echo "Raw open leaves: $(wc -l < open.txt)"
          awk 'NR==470 { print "LEAF469_TABLE", $0 }' open.txt
          sha256sum open.txt tree.json
          g++ -O3 -std=c++20 "$GITHUB_WORKSPACE/im-results/agent2-tnf-raw124/longcycle.cpp" -o /tmp/raw124-longcycle
          python - <<'PY'
          from pathlib import Path
          opened = Path("open.txt").read_text().splitlines()
          Path("open-indexed.txt").write_text("".join(f"{i} {table.replace('_', '')}\n" for i, table in enumerate(opened)))
          print(f"Indexed {len(opened)} exact raw leaves for the cycle checker.")
          PY
          /tmp/raw124-longcycle 100000 128 < open-indexed.txt > longcycle100k.out
          python - <<'PY'
          from pathlib import Path
          opened = Path("open.txt").read_text().splitlines()
          rows = [line.split() for line in Path("longcycle100k.out").read_text().splitlines()]
          assert all(len(row) >= 2 and row[1] in {"cycle", "hole", "open"} for row in rows)
          ids = [int(row[0]) for row in rows]
          assert len(set(ids)) == len(ids)
          assert set(ids) == set(range(len(opened))), (len(opened), len(ids), sorted(set(range(len(opened))) - set(ids))[:10])
          cycles = [row for row in rows if row[1] == "cycle"]
          holes = [row for row in rows if row[1] == "hole"]
          single_holes = [row for row in holes if opened[int(row[0])].count("---") == 1]
          multi_holes = [row for row in holes if opened[int(row[0])].count("---") > 1]
          unresolved = [row for row in rows if row[1] == "open"]
          print(f"Long-cycle census: {len(cycles)} exact cycles, {len(single_holes)} single-hole terminals, {len(multi_holes)} multi-hole split candidates, {len(unresolved)} unresolved of {len(opened)} raw open leaves")
          if len(opened) > 469:
              print("OPEN_ROW_469", 469, opened[469])
              match = next(row for row in rows if int(row[0]) == 469)
              print("OPEN_ROW_469_RESULT", *match)
          for row in holes:
              if len(row) > 2 and int(row[2]) > 12000:
                  print("LATE_QUERY", *row)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw124-0lb-longcycle100k
          path: /tmp/raw124-0lb
          if-no-files-found: error

