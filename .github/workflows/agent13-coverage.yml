  raw60_1lf_prepare:
    if: inputs.target == 'weighted-tnf-raw60-1lf'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Generate complete 1LF audit and compile shared proof core once
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          D=im-results/agent1-raw60
          W=/tmp/raw60-1lf-core
          python "$D/generate_1lf.py"
          python tools/lean_compile_closure.py --workdir "$W" --jobs 4 --manifest "$W/core.json" "$D/Raw60A1LFBase.lean" | tee /tmp/raw60-1lf-core.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw60-1lf-core.log; then exit 1; fi
          cp "$D"/Raw60A1LFKid*.lean "$D"/Raw60A1LFData.lean "$W/"
          cd "$W"
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          sha256sum *.lean *.olean core.json SOURCE_COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: raw60-1lf-core
          path: /tmp/raw60-1lf-core/
          if-no-files-found: error

  raw60_1lf_kids:
    if: inputs.target == 'weighted-tnf-raw60-1lf'
    needs: raw60_1lf_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raw60-1lf-core
          path: /tmp/raw60-1lf-core
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Check four child subtrees against identical core
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cd /tmp/raw60-1lf-core
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum -c SHA256SUMS >/dev/null
          export LEAN_PATH="$PWD"
          mkdir /tmp/raw60-1lf-kids
          for i in $(seq $((4*SHARD)) $((4*SHARD+3))); do
            printf -v kid 'Raw60A1LFKid%02d' "$i"
            lean -o "$kid.olean" "$kid.lean" | tee -a /tmp/raw60-1lf-kids.log
            cp "$kid.olean" /tmp/raw60-1lf-kids/
          done
          if grep -Eq 'sorryAx|native_decide' /tmp/raw60-1lf-kids.log; then exit 1; fi
          sha256sum SHA256SUMS > /tmp/raw60-1lf-kids/core-${SHARD}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: raw60-1lf-kids-${{ matrix.shard }}
          path: /tmp/raw60-1lf-kids/
          if-no-files-found: error

  raw60_1lf_assemble:
    if: inputs.target == 'weighted-tnf-raw60-1lf'
    needs: raw60_1lf_kids
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raw60-1lf-core
          path: /tmp/raw60-1lf-core
      - uses: actions/download-artifact@v4
        with:
          pattern: raw60-1lf-kids-*
          path: /tmp/raw60-1lf-core
          merge-multiple: true
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Assemble exact complete 1LF child bound
        run: |
          set -euo pipefail
          cd /tmp/raw60-1lf-core
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum -c SHA256SUMS >/dev/null
          for i in $(seq 0 5); do sha256sum -c "core-$i.sha256"; done
          for i in $(seq -w 0 23); do test -s "Raw60A1LFKid$i.olean"; done
          export LEAN_PATH="$PWD"
          lean -o Raw60A1LFData.olean Raw60A1LFData.lean | tee /tmp/raw60-1lf-assembly.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw60-1lf-assembly.log; then exit 1; fi
          grep -F 'BB6.Agent1Raw60A1LF.all_closed' /tmp/raw60-1lf-assembly.log
          sha256sum *.olean > ALL_OBJECTS.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: raw60-1lf-certified
          path: |
            /tmp/raw60-1lf-core/
            /tmp/raw60-1lf-assembly.log
          if-no-files-found: error

  raw60_shards:
    if: inputs.target == 'weighted-tnf-raw60-graft'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        child: ${{ fromJSON(inputs.raw60_shard_children) }}
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Compile four raw60 kid modules
        env:
          CHILD: ${{ matrix.child }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent1-raw60/generate.py "$CHILD"
          start=$((SHARD * 4))
          roots=( "im-results/agent1-raw60/Raw60A${CHILD}Base.lean" )
          for i in $(seq "$start" "$((start + 3))"); do
            printf -v kid "%02d" "$i"
            roots+=( "im-results/agent1-raw60/Raw60A${CHILD}Kid${kid}.lean" )
          done
          python tools/lean_compile_closure.py --workdir /tmp/raw60-shard --jobs 4 "${roots[@]}" | tee /tmp/raw60-shard.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw60-shard.log; then exit 1; fi
          {
            echo "child=$CHILD shard=$SHARD"
            sha256sum im-results/agent1-raw60/specs.json im-results/agent1-raw60/generate.py im-results/agent1-raw60/Raw60RootCut.lean
          } > /tmp/raw60-shard/manifest.txt
      - name: Upload raw60 kid shard
        uses: actions/upload-artifact@v4
        with:
          name: raw60-shard-${{ matrix.child }}-${{ matrix.shard }}
          path: /tmp/raw60-shard/*
          if-no-files-found: error

  raw60_graft:
    if: inputs.target == 'weighted-tnf-raw60-graft'
    needs: raw60_shards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Validate reusable artifact run input
        env:
          ARTIFACT_RUN_ID: ${{ inputs.raw60_artifact_run_id }}
        run: |
          test -n "$ARTIFACT_RUN_ID" || { echo "raw60_artifact_run_id is required"; exit 1; }
      - name: Download reusable child artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw60_artifact_run_id }}
          pattern: raw60-child-*
          path: /tmp/raw60-assembled
          merge-multiple: true
      - name: Download newly compiled kid shards
        uses: actions/download-artifact@v4
        with:
          pattern: raw60-shard-*
          path: /tmp/raw60-assembled
          merge-multiple: true
      - name: Verify source compatibility and assemble the raw60 canonical graft
        env:
          ARTIFACT_SHA: ${{ inputs.raw60_artifact_sha }}
          ARTIFACT_RUN_ID: ${{ inputs.raw60_artifact_run_id }}
          RAW60_SHARD_CHILDREN: ${{ inputs.raw60_shard_children }}
        run: |
          set -euo pipefail
          if [[ -z "$ARTIFACT_RUN_ID" ]]; then
            echo "raw60_artifact_run_id is required for this target"
            exit 1
          fi
          git fetch --no-tags origin "$ARTIFACT_SHA"
          for f in \
            im-results/agent1-raw60/specs.json \
            im-results/agent1-raw60/generate.py \
            im-results/agent1-raw60/Raw60RootCut.lean \
            im-results/agent13-coverage/unpack.py \
            im-results/agent31-three-hole-tnf/generate_sweeps.py \
            im-results/agent31-three-hole-tnf/generate_four_hole.py \
            im-results/agent10-tnf-multipump/ZipThreeHoleAudit.lean \
            im-results/agent10-tnf-multipump/ZipAuditCore.lean \
