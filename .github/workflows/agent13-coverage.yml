    if: inputs.target == 'weighted-tnf-raw120-late' || inputs.target == 'weighted-tnf-raw120-rf' || inputs.target == 'weighted-tnf-raw120-rb'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Unpack and check the selected raw120 certificate
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          target=im-results/agent3-tnf-raw120/Raw120Late.lean
          if [ "$TARGET" = weighted-tnf-raw120-rf ]; then
            python im-results/agent3-tnf-raw120/generate.py
            target=im-results/agent3-tnf-raw120/rf/Raw120RFData.lean
          elif [ "$TARGET" = weighted-tnf-raw120-rb ]; then
            python im-results/agent3-tnf-raw120/generate_rb.py
            target=im-results/agent3-tnf-raw120/rb/Raw120RBData.lean
          fi
          python tools/lean_compile_closure.py --workdir /tmp/a3-raw120 --jobs 4 "$target" | tee /tmp/a3-raw120.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a3-raw120.log; then
            echo "Forbidden proof placeholder or native_decide" >&2
            exit 1
          fi
