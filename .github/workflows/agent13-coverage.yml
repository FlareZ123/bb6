          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path(".tmp/agent17-raw10-box-far/summary.json").read_text())
          print(f"singleton-projection FAR: generated={summary['generated']} compiled={summary['compiled']}")
