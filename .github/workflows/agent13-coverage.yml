        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent11-raw107/generate_partial.py 1LA
          roots=()
          for ((i=4*SHARD;i<4*SHARD+4;i++)); do
            printf -v nn '%02d' "$i"
            roots+=("im-results/agent11-raw107/Raw107B1LAKid${nn}.lean")
          done
          python tools/lean_compile_closure.py --workdir /tmp/raw107-1la --jobs 4 "${roots[@]}" | tee /tmp/raw107-1la.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw107-1la.log; then exit 1; fi
          mkdir -p /tmp/raw107-shard
          if [ "$SHARD" = 0 ]; then
            find /tmp/raw107-1la -name '*.olean' -exec cp {} /tmp/raw107-shard/ \;
          else
            cp /tmp/raw107-1la/Raw107B1LAKid*.olean /tmp/raw107-shard/
