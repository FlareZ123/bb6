        run: |
          set -euo pipefail
          D=im-results/agent1-bidfa-sat
          W=/tmp/raw118-wide-proof
          python im-results/agent13-coverage/unpack.py
          python "$D/wide_cert.py" "$LEAF"
          THEOREM="BB6Coverage.Agent1BiDFAWide.M$LEAF.never"
          python tools/lean_compile_closure.py --workdir "$W" --jobs 4 \
            --manifest "$W/manifest.json" --label "raw118-wide-$LEAF" \
            --artifact-name "raw118-wide-$LEAF" --theorem "$THEOREM" \
            --provenance-input "$D/raw118-hard87.tsv" \
            --provenance-input "$D/raw118-wide-widths.json" \
            "$D/wide-generated/Raw118Wide$LEAF.lean" | tee /tmp/raw118-wide.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/raw118-wide.log "$THEOREM"
          cp /tmp/raw118-wide.log "$W/audit.log"
          cp "$D/wide-generated/Raw118Wide$LEAF.json" "$W/witness.json"
      - uses: actions/upload-artifact@v4
        with:
          name: raw118-wide-${{ matrix.leaf }}
          path: /tmp/raw118-wide-proof/
          if-no-files-found: error

