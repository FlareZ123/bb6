  raw54_rb_source:
    if: inputs.target == 'weighted-tnf-agent8-raw54-rb' || inputs.target == 'weighted-tnf-agent8-raw54-la'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate complete Raw54 child certificate and export exact import closure
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          if [[ '${{ inputs.target }}' == 'weighted-tnf-agent8-raw54-la' ]]; then
            python im-results/agent8-raw54/generate_la.py
            export RAW54_SOURCE=LA
          else
            python im-results/agent8-raw54/generate_rb.py
            export RAW54_SOURCE=RB
          fi
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess, sys
          sys.path.insert(0, 'tools')
          import lean_compile_closure as lc
          child = os.environ['RAW54_SOURCE']
          root = Path(f'im-results/agent8-raw54/Raw54{child}Cut.lean').resolve()
          out = Path('/tmp/raw54-child-source')
          out.mkdir()
          index = lc.module_index()
          seen = {}
          def visit(module, source=None):
              if module in seen:
                  return
              source = source or lc.resolve_source(module, index)
              deps = lc.parse_imports(source)
              for dep in deps:
                  visit(dep)
              target = out / (module.replace('.', '/') + '.lean')
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
              seen[module] = dict(source=lc.display_source(source), dependencies=deps, sha256=lc.sha256_file(source), file=str(target.relative_to(out)))
          visit(root.stem, root)
          manifest = dict(revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), modules=seen)
          (out/'source-export.json').write_text(json.dumps(manifest,indent=2))
          print('Exported',len(seen),'exact source modules')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw54-${{ inputs.target == 'weighted-tnf-agent8-raw54-la' && 'la' || 'rb' }}-exact-source
          path: /tmp/raw54-child-source
          if-no-files-found: error

