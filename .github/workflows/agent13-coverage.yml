          W=/tmp/a2-raw124-1la
          python tools/lean_compile_closure.py --workdir "$W" --jobs 4 "$D/Raw124B1LABase.lean" im-results/agent47-rooted-tnf/CanonicalFrontier.lean | tee /tmp/a2-raw124-prepare.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a2-raw124-prepare.log; then exit 1; fi
