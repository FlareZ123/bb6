          python tools/lean_compile_closure.py --workdir /tmp/a25-raw123-bi --jobs 4 im-results/agent25-raw123/Raw123BiDFAAudit.lean | tee /tmp/a25-raw123-bi.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a25-raw123-bi.log; then exit 1; fi

  raw60_complete_children:
    if: inputs.target == 'weighted-tnf-raw60-complete' || inputs.target == 'weighted-tnf-raw60-repair'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        child: ${{ fromJSON(inputs.target == 'weighted-tnf-raw60-repair' && inputs.raw60_shard_children || '["0RC","0RE","0LD","0RF","0LB","1LA","1LB","1LC","1RF","0LC","0LF","1LF","1RE"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate and source-check exact child with bounded tree shards
        env:
          CHILD: ${{ matrix.child }}
          BB6_SHARD_AUDIT: '1'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          D=im-results/agent1-raw60
          case "$CHILD" in
            0RC) BOUND=376;; 0RE) BOUND=719;; 0LD) BOUND=176;;
            0RF) BOUND=1175;; 0LB) BOUND=258;; 1LA) BOUND=178;;
            1LB) BOUND=620;; 1LC) BOUND=253;; 1RF) BOUND=276;;
            0LC) BOUND=251;; 0LF) BOUND=802;; 1LF) BOUND=1175;;
            1RE) BOUND=211;; *) exit 2;;
          esac
          case "$CHILD" in
            0LC) python "$D/generate_0lc.py"; SPEC="$D/spec-0LC.json";;
            0LF) python "$D/generate_0lf_audit.py"; SPEC="$D/0lf-frontier.json";;
            1LF) python "$D/generate_1lf_compact_all.py"; SPEC="$D/spec-1LF.json";;
            1RE) python "$D/generate_compact.py" 1RE; SPEC="$D/spec-1RE.json";;
            *) python "$D/generate.py" "$CHILD"; SPEC="$D/specs.json";;
          esac
          W=/tmp/raw60-complete
          ROOT="$D/Raw60A${CHILD}Data.lean"
          THEOREM="BB6.Agent1Raw60A${CHILD}.all_closed"
          grep -F "theorem all_closed" "$ROOT"
          python tools/lean_compile_closure.py --workdir "$W" --jobs 4 \
            --manifest "$W/manifest.json" --label "raw60-complete-$CHILD" \
            --artifact-name "raw60-complete-$CHILD" --theorem "$THEOREM" \
            --parent-table "1RB${CHILD}_1RC---_0RD---_1LD1RE_---1RA_------" \
            --weighted-bound "$BOUND" --provenance-input "$SPEC" \
            "$ROOT" | tee /tmp/raw60-complete.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/raw60-complete.log "$THEOREM"
          cp /tmp/raw60-complete.log "$W/audit.log"
      - uses: actions/upload-artifact@v4
        with:
          name: raw60-complete-${{ matrix.child }}
          path: /tmp/raw60-complete/
          if-no-files-found: error

  raw60_complete_parent:
    if: inputs.target == 'weighted-tnf-raw60-complete' || inputs.target == 'weighted-tnf-raw60-repair'
