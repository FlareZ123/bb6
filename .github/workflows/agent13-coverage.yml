          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate original exact child audit
        env:
          CHILD: ${{ matrix.child }}
          BB6_SHARD_AUDIT: '1'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          D=im-results/agent1-raw60
          case "$CHILD" in
            1LF) python "$D/generate_1lf.py";;
            1RE) python "$D/generate_1re.py";;
          esac
      - uses: actions/download-artifact@v4
        with:
          name: raw60-sparse-source
          path: im-results/agent1-raw60
      - uses: actions/download-artifact@v4
        with:
          pattern: raw60-sparse-${{ matrix.child }}-*
          path: /tmp/raw60-sparse-downloads
      - name: Compose checked sparse groups and prove child
        env:
          CHILD: ${{ matrix.child }}
        run: |
          set -euo pipefail
          D=im-results/agent1-raw60
          U=/tmp/raw60-sparse-union
          W=/tmp/raw60-complete
          python - "$D/raw60_sparse_plan.json" "$CHILD" <<'PY'
          import json,sys
          plan=json.load(open(sys.argv[1]))
          groups={p["group"]:[p["module"]] for p in plan if p["child"]==sys.argv[2]}
          assert groups
          json.dump({"artifact_prefix":"raw60-sparse","groups":groups},open("/tmp/sparse-config.json","w"))
          PY
          python im-results/agent4-raw109/merge_shards.py /tmp/raw60-sparse-downloads "$U" /tmp/sparse-config.json
          case "$CHILD" in 1LF) BOUND=1175;; 1RE) BOUND=211;; esac
          THEOREM="BB6.Agent1Raw60A${CHILD}.all_closed"
          python tools/lean_compile_closure.py --workdir "$W" --jobs 4 \
            --precompiled-manifest "$U/manifest.json" --precompiled-dir "$U" \
            --manifest "$W/manifest.json" --label "raw60-complete-$CHILD" \
            --artifact-name "raw60-complete-$CHILD" --theorem "$THEOREM" \
            --parent-table "1RB${CHILD}_1RC---_0RD---_1LD1RE_---1RA_------" \
            --weighted-bound "$BOUND" --provenance-input "$D/spec-$CHILD.json" \
            "$D/Raw60A${CHILD}Data.lean" | tee /tmp/raw60-complete.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/raw60-complete.log "$THEOREM"
          cp /tmp/raw60-complete.log "$W/audit.log"
      - uses: actions/upload-artifact@v4
        with:
          name: raw60-complete-${{ matrix.child }}
          path: /tmp/raw60-complete/
          if-no-files-found: error

