          path: /tmp/raw118-cut/74
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45725315357
          name: agent6-canonical68-e1-parent-consumer
          path: /tmp/raw118-cut/68
      - name: Compile only the new conditional Raw118 quotient cut
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, os
          d = pathlib.Path("/tmp/raw118-cut")
          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          def one(root, name):
              paths = list(root.rglob(name))
              assert len(paths) == 1, (root, name, paths)
              return paths[0]
          def load(p):
              return json.loads(p.read_text())
          s68 = load(one(d/"68", "a31-canonical68-summary.json"))
          s74 = load(one(d/"74", "a31-canonical74-summary.json"))
          assert s68["theorem"] == "BB6.Agent6Canonical68E1ParentGraft.exact_at_target"
          assert s68["after_six_additional_e1_parent_cuts"] == 68
          assert s68["common_weighted_bound_floor"] == 6766859
          assert s68["canonical76_run_id"] == 45647053824
          assert s68["canonical77_run_id"] == 45554648116
          assert s74["source_revision"] == s68["source_revision"]
          assert s74["lean_version"] == subprocess.check_output(["lean","--version"], text=True).strip()
          obj68 = one(d/"68", "Canonical68E1ParentGraft.olean")
          obj74 = one(d/"68", "Canonical74Raw109Raw123Graft.olean")
          assert sha(obj68) == s68["olean_sha256"]
          assert sha(obj74) == s68["canonical74_olean_sha256"] == s74["olean_sha256"]
          assert sha(pathlib.Path("im-results/agent6-e1-parent-consumer/Canonical68E1ParentGraft.lean")) == s68["source_sha256"]
          assert sha(pathlib.Path("im-results/agent31-shared-core/Canonical74Raw109Raw123Graft.lean")) == s74["source_sha256"]
          interface_manifest = one(d/"74", "a31-parent-interfaces-manifest.json")
          assert sha(interface_manifest) == s68["parent_interface_manifest_sha256"] == s74["parent_interface_manifest_sha256"]
          interfaces = one(d/"74", "Raw109Cut.olean").parent
          shared = one(d/"76", "CanonicalTwoParentRosterOnly.olean").parent
          core = one(d/"77", "CanonicalRaw114Accepted.olean").parent
          version = subprocess.check_output(["lean","--version"], text=True).strip()
          compiler = pathlib.Path(subprocess.check_output(["lean","--print-prefix"], text=True).strip())/"bin/lean"
          s76 = load(one(d/"76", "canonical76-base.json"))
          assert s76["residual_count"] == 76
          assert sha(shared/"CanonicalTwoParentRosterOnly.olean") == s76["modules"]["CanonicalTwoParentRosterOnly"]["olean_sha256"]
          assert sha(core/"CanonicalRaw114Accepted.olean") == s76["modules"]["CanonicalRaw114Accepted"]["accepted_artifact_olean_sha256"]
          manifests = [(load(interface_manifest), interfaces),
                       (load(one(d/"76", "canonical77-base-manifest.json")), core),
                       (load(one(d/"76", "raw107-shared-manifest.json")), shared)]
          for manifest, location in manifests:
              assert manifest["lean_version"] == version
              assert manifest["lean_binary"]["sha256"] == sha(compiler)
              for entry in manifest["modules"]:
                  obj = location/entry["olean_path"]
                  assert obj.is_file() and sha(obj) == entry["olean_sha256"], (location, entry["module"])
          # The original accepted 68 audit used this exact import ordering.
          path = ":".join(map(str,[obj68.parent, interfaces, shared, core]))
          with open(os.environ["GITHUB_ENV"],"a") as out:
              out.write("LEAN_PATH="+path+"\n")
          (d/"lean-path.txt").write_text(path+"\n")
          PY
          mkdir -p /tmp/raw118-cut/output
          export LEAN_PATH="$(cat /tmp/raw118-cut/lean-path.txt)"
          lean -o /tmp/raw118-cut/output/Raw118CanonicalCut.olean im-results/agent16-raw118/Raw118CanonicalCut.lean 2>&1 | tee /tmp/raw118-cut/output/audit.log
          for theorem in parent_root sound_cut parent_count68 count67 sound67 exact_at_target; do
            python im-results/agent4-raw109/audit_axioms.py /tmp/raw118-cut/output/audit.log "BB6.Agent16Raw118CanonicalCut.$theorem"
          done
