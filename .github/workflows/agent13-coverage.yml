  raw10hardrootr1:
    if: inputs.target == 'weighted-tnf-raw10-hardroot-r1-adapter'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
      - name: Download the 20 generated raw10 cycle certificates
        uses: actions/download-artifact@v4
        with:
          name: raw10-box8-halt-slice
          run-id: 45593139942
          github-token: ${{ github.token }}
          path: .tmp/r1-artifact
      - name: Compile raw10 combined consumer and r1 leaf adapter
        run: |
          set -euo pipefail
          mkdir -p .tmp/r1src .tmp/r1work
          find .tmp/r1-artifact -name 'Box8F0*Packed.lean' -o -name 'Box8F0*Proof.lean' | while read -r f; do cp "$f" .tmp/r1src/; done
          mapfile -t roots < <(find .tmp/r1src -name 'Box8F0*Proof.lean' -print | sort)
          test "${#roots[@]}" -eq 20
          python tools/lean_compile_closure.py "${roots[@]}" \
            im-results/agent17-raw10-box-far-search/Raw10BoxCombinedConsumer.lean \
            im-results/agent50-weighted-tnf-pilot/Raw10HardRootR1Adapter.lean \
            --workdir .tmp/r1work --source-root .tmp/r1src --jobs 4 \
            --manifest .tmp/r1work/manifest.json 2>&1 | tee /tmp/raw10-r1-adapter.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw10-r1-adapter.log; then
            echo "Forbidden proof placeholder or native_decide in raw10 r1 adapter" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, pathlib, re
          log = pathlib.Path("/tmp/raw10-r1-adapter.log").read_text()
          required = [
            "BB6.Agent50Raw10HardRootR1Adapter.oneHaltLeafCover",
            "BB6.Agent50Raw10HardRootR1Adapter.r1LeafCoverOfNever",
            "BB6.Agent50Raw10HardRootR1Adapter.r1Leaf_box24_contains",
            "BB6.Agent50Raw10HardRootR1Adapter.r1Leaf_fits_box24",
            "BB6.Agent50Raw10HardRootR1Adapter.r1Leaf_parent",
            "BB6.Agent50Raw10HardRootR1Adapter.raw10CoverWithR1",
          ]
          profiles = {
            name: {x.strip() for x in axioms.split(",") if x.strip()}
            for name, axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", log)
          }
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in required:
            if name not in profiles:
              raise SystemExit("missing axiom profile: " + name)
            bad = profiles[name] - allowed
            if bad:
              raise SystemExit(name + ": unexpected axioms " + json.dumps(sorted(bad)))
          print(json.dumps({name: sorted(profiles[name]) for name in required}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw10-hardroot-r1-adapter
          path: |
            .tmp/r1work/
            /tmp/raw10-r1-adapter.log
          if-no-files-found: error

