  raw10_box18to24_canonical76:
    if: inputs.target == 'weighted-tnf-raw10-box18to24-canonical76'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Download the source-accepted canonical77/raw107 shared core
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45647053824
          name: raw107-canonical-shared-core
          path: /tmp/a31-base
      - name: Download the canonical77 certified object files
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45554648116
          name: canonical77-certified
          path: /tmp/a47-canonical
      - name: Merge and validate canonical77 and raw107 precompiled manifests
        run: |
          set -euo pipefail
          cp -an /tmp/a47-canonical/. /tmp/a31-base/
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("/tmp/a31-base")
          base_path = root / "manifest/canonical77-base-manifest.json"
          raw_path = root / "manifest/raw107-shared-manifest.json"
          base = json.loads(base_path.read_text())
          raw = json.loads(raw_path.read_text())
          if base["lean_version"] != raw["lean_version"]:
              raise SystemExit("canonical77/raw107 Lean versions differ")
          if base["lean_binary"]["sha256"] != raw["lean_binary"]["sha256"]:
              raise SystemExit("canonical77/raw107 Lean compiler binaries differ")
          base_modules = {x["module"]: x for x in base["modules"]}
          raw_modules = {x["module"]: x for x in raw["modules"]}
          if not {"CanonicalTwoParentGraft", "CanonicalRaw114Accepted"} <= set(base_modules):
              raise SystemExit("canonical77 base manifest lacks required two-parent modules")
          if "Raw107ParentClosure" not in raw_modules:
              raise SystemExit("raw107 shared manifest lacks Raw107ParentClosure")
          merged = dict(base_modules)
          for name, entry in raw_modules.items():
              if name in merged:
                  for field in ("source_sha256", "project_imports", "olean_sha256", "import_closure_sha256", "module_identity_sha256"):
                      if merged[name].get(field) != entry.get(field):
                          raise SystemExit(f"conflicting precompiled identity for {name}: {field}")
              merged[name] = entry
          for name, entry in merged.items():
              artifact = root / entry["olean_path"]
              if not artifact.is_file():
                  raise SystemExit(f"precompiled object missing for {name}: {artifact}")
          combined = dict(raw)
          combined["modules"] = [merged[name] for name in sorted(merged)]
          combined["module_count"] = len(combined["modules"])
          combined["precompiled_core"] = {
              "kind": "merged canonical77 base plus raw107 shared core",
              "canonical77_manifest_sha256": hashlib.sha256(base_path.read_bytes()).hexdigest(),
              "raw107_manifest_sha256": hashlib.sha256(raw_path.read_bytes()).hexdigest(),
          }
          out = root / "manifest/combined-canonical77-raw107-manifest.json"
          out.write_text(json.dumps(combined, indent=2, sort_keys=True) + "\n")
          print(f"Validated {len(base_modules)} canonical77 and {len(raw_modules)} raw107 modules; merged {len(merged)} precompiled objects.")
          PY
      - name: Reconstruct held-leaf source dependencies
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 68 72 82
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          root=im-results/agent11-raw107
          python "$root/generate.py"
          python "$root/generate_rc.py"
          python "$root/generate_re.py"
          python "$root/generate_more.py" 1RE 1LC 1LE 1LB 0RF 1RF 0LE
          python "$root/generate_partial.py" 0LF 1LA 1LF
          for prefix in Raw107RD Raw107RC Raw107RE Raw107B1RE Raw107B1LC Raw107B1LE Raw107B1LB Raw107B0RF Raw107B1RF Raw107B0LE Raw107B0LF Raw107B1LA Raw107B1LF; do
            python im-results/agent10-tnf-multipump/chunk_checks.py "$root" "$prefix" --limit 180
          done
          (
            cd im-results/agent47-raw114-cut
            python paired_counter.py
            python long_sweep.py
            printf '%s\n' 0LA 0LB 0LC 0LF 0RA 0RB 0RC 0RF 1LA 1LB 1LC 1LF 1RA 1RB 1RC 1RF | xargs -P 4 -I{} python generate_complete.py {}
            python generate_complete.py --combine
