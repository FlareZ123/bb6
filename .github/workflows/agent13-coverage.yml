  raw124_0la_fast_cut:
    if: inputs.target == 'weighted-tnf-raw124-0la-fast-cut' || inputs.target == 'weighted-tnf-raw124-0le-fast-cut' || inputs.target == 'weighted-tnf-raw124-1la-fast-cut'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw124-1lb-complete-source-audit
          run-id: 45800254828
          github-token: ${{ github.token }}
          path: /tmp/raw124-accepted-1lb
      - name: Replay persisted Raw124 branch witnesses and source-check weighted cut
        run: |
          set -euo pipefail
          D=im-results/agent2-tnf-raw124
          BRANCH=0LA
          if [[ '${{ inputs.target }}' == 'weighted-tnf-raw124-0le-fast-cut' ]]; then BRANCH=0LE; fi
          if [[ '${{ inputs.target }}' == 'weighted-tnf-raw124-1la-fast-cut' ]]; then BRANCH=1LA; fi
          W=/tmp/raw124-${BRANCH,,}-cut
          BOUND=3006
          if [[ "$BRANCH" == 1LA ]]; then BOUND=6230; fi
          OLD=/tmp/raw124-accepted-1lb/closure
          mkdir -p "$W/generated"
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          if [[ "$BRANCH" != 0LA ]]; then
            python im-results/agent32-raw124-0le/replay_0le.py --branch "$BRANCH" --out "$W/generated"
            test -z "$(tr -d '[:space:]' < "$W/generated/Raw124New${BRANCH}.remaining")"
            THEOREM=BB6.Agent2Raw124New${BRANCH}.bound_all
            SOURCE=Raw124New${BRANCH}Complete.lean
          else
            python "$D/replay_fast_cut.py" "$D/sibling-0LA.spec.b64" --out "$W/generated"
            test -s "$W/generated/Raw124New0LA.remaining"
            THEOREM=BB6.Agent2Raw124New0LA.branch_sound
            SOURCE=Raw124New0LACut.lean
          fi
          overrides=()
          while IFS= read -r src; do
            mod="${src#"$OLD"/}"
            mod="${mod%.lean}"
            mod="${mod//\//.}"
            overrides+=(--override "$mod=$src")
          done < <(find "$OLD" -type f -name '*.lean' | sort)
          python tools/lean_compile_closure.py --source-root "$OLD" --source-root "$W/generated" "${overrides[@]}" --workdir "$W/closure" --jobs 2 --precompiled-manifest /tmp/raw124-accepted-1lb/manifest.json --precompiled-dir "$OLD" --manifest "$W/manifest.json" --theorem "$THEOREM" --weighted-bound "$BOUND" --parent-table "1RB---_1RC---_0RD---_1LD1RE_---1LF_---$BRANCH" "$W/generated/$SOURCE" 2>&1 | tee "$W/audit.log"
          python im-results/agent4-raw109/audit_axioms.py "$W/audit.log" "$THEOREM" "BB6.Agent2Raw124New${BRANCH}.residual_count"
          git rev-parse HEAD > "$W/SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.target == 'weighted-tnf-raw124-0le-fast-cut' && 'raw124-0le-complete-source-audit' || inputs.target == 'weighted-tnf-raw124-1la-fast-cut' && 'raw124-1la-complete-source-audit' || 'raw124-0la-partial-source-audit' }}
          path: ${{ inputs.target == 'weighted-tnf-raw124-0le-fast-cut' && '/tmp/raw124-0le-cut/' || inputs.target == 'weighted-tnf-raw124-1la-fast-cut' && '/tmp/raw124-1la-cut/' || '/tmp/raw124-0la-cut/' }}
