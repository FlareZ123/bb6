      - uses: actions/upload-artifact@v4
        with:
          name: raw60-1lf-kids-${{ matrix.shard }}
          path: /tmp/raw60-1lf-kids/
          if-no-files-found: error

  raw60_1lf_assemble:
    if: inputs.target == 'weighted-tnf-raw60-1lf'
    needs: raw60_1lf_kids
    runs-on: ubuntu-latest
