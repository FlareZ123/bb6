          cat /tmp/0lf-hard-simulation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw124-0lf-hard-simulation
          path: /tmp/0lf-hard-simulation.json
          if-no-files-found: warn
