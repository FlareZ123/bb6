          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Regenerate and kernel-check raw123 partial weighted partition and quotient graft
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent25-raw123/generate.py
          python tools/lean_compile_closure.py --workdir /tmp/a25-raw123 --jobs 4 im-results/agent25-raw123/Raw123Exact.lean | tee /tmp/a25-raw123.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a25-raw123.log; then exit 1; fi

  raw123_recursive:
    if: inputs.target == 'weighted-tnf-raw123-recursive'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check new recursive return certificates
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python - <<'PY'
          import base64, zlib, hashlib
          from pathlib import Path
          p = Path("im-results/agent25-raw123")
          b = zlib.decompress(base64.b64decode((p/"Raw123RecursiveBatch.lean.zlib.b64").read_text()))
          assert hashlib.sha256(b).hexdigest() == "ee1b102ca8de7f12201cf4082f1100e968c7d15161c6dd632e38a07ad77e6112"
          (p/"Raw123RecursiveBatch.lean").write_bytes(b)
          PY
          python tools/lean_compile_closure.py --workdir /tmp/a25-raw123-rec --jobs 4 im-results/agent25-raw123/Raw123RecursiveBatch.lean | tee /tmp/a25-raw123-rec.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a25-raw123-rec.log; then exit 1; fi

  raw123_bidfa:
    if: inputs.target == 'weighted-tnf-raw123-bidfa'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check finite phase-aware invariants
        run: |
