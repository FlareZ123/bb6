    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Replay fixed FAR witnesses and check complete weighted covers
        run: |
          set -euo pipefail
          D=im-results/agent50-raw47-depth3
          W=.tmp/a50-raw47-far
          mkdir -p "$W/imports" "$W/build"
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python "$D/generate_broad_far.py" "$W/imports" ${{ matrix.shard }}
          python tools/lean_compile_closure.py --workdir "$W/build" --jobs 4 --manifest "$W/manifest.json" "$W"/imports/Raw47D3FAR*.lean 2>&1 | tee "$W/log"
          python - "$W/imports/ids.txt" "$W/log" <<'PY'
          import re,sys
          ids=list(map(int,open(sys.argv[1]).read().split()))
          log=open(sys.argv[2]).read()
          for i in ids:
              name=f'BB6.Agent50.Raw47D3FAR{i}.all_quotient'
              m=re.search(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",log)
              if m:
                  assert set(m.group(1).split(', ')) <= {'propext','Quot.sound','Classical.choice'},(name,m.group(1))
              else:
                  assert f"'{name}' does not depend on any axioms" in log,name
          print(f'Accepted {len(ids)} quotient-compatible weighted parent bounds.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw47-broad-far-${{ matrix.shard }}
