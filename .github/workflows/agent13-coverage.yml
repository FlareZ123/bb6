          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          export LEAN_PATH=im-results/agent8-coverage-contract:im-results/agent4-coverage-smoke:im-results/agent42-coverage-normal:im-results/agent13-coverage:im-results/agent13-weighted-first-one:im-results/agent6-fresh-glider:im-results/agent7-far:im-results/agent31-three-hole-tnf:im-results/agent50-weighted-tnf-pilot
          python tools/lean_compile_closure.py --workdir /tmp/a13-roster-composition --jobs 4 im-results/agent13-roster-convergence/RosterCoverComposition.lean | tee /tmp/a13-roster-composition.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a13-roster-composition.log; then
            echo "Forbidden proof placeholder or native_decide found in 124-roster composition closure" >&2
            exit 1
          fi

      - name: Check raw residual 103 and its exact roster graft
        if: inputs.target == 'weighted-tnf-raw103'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent3-tnf-raw103/generate.py
          python tools/lean_compile_closure.py --workdir /tmp/a3-raw103 --jobs 4 im-results/agent3-tnf-raw103/Raw103RosterBridge.lean | tee /tmp/a3-raw103.log
