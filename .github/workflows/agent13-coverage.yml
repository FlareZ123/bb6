          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate once and check shared source dependencies
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent8-tnf-raw117/generate.py
          D=im-results/agent8-tnf-raw117
          W=/tmp/a8-raw117
          python tools/lean_compile_closure.py --workdir "$W" --jobs 4 "$D/raw117/Raw117Base.lean" im-results/agent47-rooted-tnf/CanonicalFrontier.lean | tee /tmp/a8-raw117-prepare.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a8-raw117-prepare.log; then exit 1; fi
          cp "$D"/raw117/Raw117Kid*.lean "$D/raw117/Raw117Data.lean" "$D/Raw117Roster.lean" "$D/Raw117CanonicalCut.lean" "$W/"
          cd "$W"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > SOURCE_COMMIT
          sha256sum Raw117*.lean > RAW117_SOURCE.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: raw117-common
          path: /tmp/a8-raw117
          if-no-files-found: error

  raw117_shards:
    if: inputs.target == 'weighted-tnf-agent8-raw117'
    needs: raw117_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, kids: '00 01 02 03' }
          - { shard: 1, kids: '04 05 06 07' }
          - { shard: 2, kids: '08 09 10 11' }
          - { shard: 3, kids: '12 13 14 15' }
          - { shard: 4, kids: '16 17 18 19' }
          - { shard: 5, kids: '20 21 22 23' }
    steps:
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw117-common
          path: /tmp/a8-raw117
      - name: Compile disjoint root children
        env:
          KIDS: ${{ matrix.kids }}
        run: |
          set -euo pipefail
          cd /tmp/a8-raw117
          export LEAN_PATH="$PWD"
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum -c RAW117_SOURCE.sha256
          mkdir -p /tmp/a8-raw117-kids
          for k in $KIDS; do printf 'Raw117Kid%s\n' "$k"; done |
            xargs -P 2 -I '{}' bash -c 'set -e; lean -o "$1.olean" "$1.lean"; cp "$1.olean" /tmp/a8-raw117-kids/' _ '{}' |
            tee /tmp/a8-raw117-shard.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a8-raw117-shard.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw117-kids-${{ matrix.shard }}
          path: /tmp/a8-raw117-kids
          if-no-files-found: error

  raw117_assemble:
    if: inputs.target == 'weighted-tnf-agent8-raw117'
    needs: raw117_shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw117-common
          path: /tmp/a8-raw117
      - uses: actions/download-artifact@v4
        with:
          pattern: raw117-kids-*
          path: /tmp/a8-raw117
          merge-multiple: true
      - name: Assemble exact weighted score and quotient-roster cut
        run: |
          set -euo pipefail
          cd /tmp/a8-raw117
          export LEAN_PATH="$PWD"
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum -c RAW117_SOURCE.sha256
          for k in $(seq -w 0 23); do test -s "Raw117Kid$k.olean"; done
          {
            lean -o Raw117Data.olean Raw117Data.lean
            lean -o Raw117Roster.olean Raw117Roster.lean
            lean -o Raw117CanonicalCut.olean Raw117CanonicalCut.lean
          } 2>&1 | tee /tmp/a8-raw117-assemble.log
          python - <<'PY'
          import pathlib, re
          log = pathlib.Path('/tmp/a8-raw117-assemble.log').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          seen = set()
          for name, axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", log):
              actual = {a.strip() for a in axioms.split(',') if a.strip()}
              assert actual <= allowed, (name, actual - allowed)
              seen.add(name.rsplit('.', 1)[-1])
          for name in re.findall(r"'([^']+)' does not depend on any axioms", log):
              seen.add(name.rsplit('.', 1)[-1])
          assert {'all117', 'attained117', 'exact117', 'canonical_cut_count', 'cut_sound', 'canonical_cut_sound', 'cover_at_target'} <= seen, seen
          print('Exact raw117 and quotient-cut axiom gate passed.')
          PY

