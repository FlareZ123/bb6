          path: /tmp/a2-raw124-bundle
      - name: Use pinned Lean toolchain from common artifact
        run: |
          echo "ELAN_HOME=/tmp/a2-raw124-bundle/.elan" >> "$GITHUB_ENV"
          echo "/tmp/a2-raw124-bundle/.elan/bin" >> "$GITHUB_PATH"
          find /tmp/a2-raw124-bundle/.elan -type f -path '*/bin/*' -exec chmod u+x {} +
          export ELAN_HOME=/tmp/a2-raw124-bundle/.elan
          export PATH=/tmp/a2-raw124-bundle/.elan/bin:$PATH
          /tmp/a2-raw124-bundle/.elan/bin/lean --version
      - name: Compile selected branch kid modules
        env:
          KIDS: ${{ matrix.kids }}
        run: |
          set -euo pipefail
          cd /tmp/a2-raw124-bundle
          export LEAN_PATH="$PWD"
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum -c RAW124_SOURCE.sha256
          STEM="Raw124B${RAW124_BRANCH}"
          mkdir -p /tmp/a2-raw124-bundle-kids
          for k in $KIDS; do printf '%sKid%s\n' "$STEM" "$k"; done |
            xargs -P 1 -I '{}' bash -c 'set -e; lean -o "$1.olean" "$1.lean"; cp "$1.olean" /tmp/a2-raw124-bundle-kids/' _ '{}' |
            tee /tmp/a2-raw124-bundle-shard.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a2-raw124-bundle-shard.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw124-${{ inputs.raw124_branch }}-kids-${{ matrix.shard }}
          path: /tmp/a2-raw124-bundle-kids
          if-no-files-found: error

  raw124_bundle_assemble:
    if: inputs.target == 'weighted-tnf-raw124-bundle-sharded'
    needs: raw124_bundle_shards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAW124_BRANCH: ${{ inputs.raw124_branch }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raw124-${{ inputs.raw124_branch }}-common
          path: /tmp/a2-raw124-bundle
      - name: Use pinned Lean toolchain from common artifact
        run: |
          echo "ELAN_HOME=/tmp/a2-raw124-bundle/.elan" >> "$GITHUB_ENV"
          echo "/tmp/a2-raw124-bundle/.elan/bin" >> "$GITHUB_PATH"
          find /tmp/a2-raw124-bundle/.elan -type f -path '*/bin/*' -exec chmod u+x {} +
          export ELAN_HOME=/tmp/a2-raw124-bundle/.elan
          export PATH=/tmp/a2-raw124-bundle/.elan/bin:$PATH
          /tmp/a2-raw124-bundle/.elan/bin/lean --version
      - uses: actions/download-artifact@v4
        with:
          pattern: raw124-${{ inputs.raw124_branch }}-kids-*
          path: /tmp/a2-raw124-bundle
          merge-multiple: true
      - name: Assemble and axiom-check selected raw124 branch
        run: |
          set -euo pipefail
          cd /tmp/a2-raw124-bundle
          export LEAN_PATH="$PWD"
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum -c RAW124_SOURCE.sha256
          STEM="Raw124B${RAW124_BRANCH}"
          for k in $(seq -w 0 23); do test -s "${STEM}KidK$k.olean"; done
          lean -o "${STEM}Data.olean" "${STEM}Data.lean" 2>&1 | tee /tmp/a2-raw124-bundle-assemble.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a2-raw124-bundle-assemble.log; then exit 1; fi
          python - <<'PY'
          import pathlib, re
          log = pathlib.Path('/tmp/a2-raw124-bundle-assemble.log').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          seen = set()
          for name, axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", log):
              actual = {a.strip() for a in axioms.split(',') if a.strip()}
              assert actual <= allowed, (name, actual - allowed)
              seen.add(name.rsplit('.', 1)[-1])
          for name in re.findall(r"'([^']+)' does not depend on any axioms", log):
              seen.add(name.rsplit('.', 1)[-1])
          assert {'checkRoot', 'bound_all'} <= seen, seen
          import os
          print(f'Raw124 {os.environ["RAW124_BRANCH"]} branch source and allowed-axiom gate passed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw124-${{ inputs.raw124_branch }}-source-accepted
          path: |
            /tmp/a2-raw124-bundle/*.olean
            /tmp/a2-raw124-bundle-assemble.log
            /tmp/a2-raw124-bundle/SOURCE_COMMIT
            /tmp/a2-raw124-bundle/RAW124_SOURCE.sha256
          if-no-files-found: error

  raw123:
