          import json, os
          rows = json.loads(os.environ["REPAIR_KIDS"])
          print(" ".join(k for row in rows for k in row["kids"].split()))
          PY
          )"
          read -r -a kid_array <<< "$kids"
          python /tmp/regenerate_subtree.py "$GITHUB_WORKSPACE" /tmp/raw124-repair-source "$RAW124_BRANCH" 50 "$expected" "${kid_array[@]}"
          if [[ "$RAW124_BRANCH" == 0RE ]]; then
            python /tmp/optimize_wide_kids.py "$GITHUB_WORKSPACE" /tmp/raw124-repair-source "${kid_array[@]}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw124-${{ inputs.raw124_branch }}-repair-source
          path: /tmp/raw124-repair-source
          if-no-files-found: error
          retention-days: 90

  raw124_bundle_repair_shards:
    if: inputs.target == 'weighted-tnf-raw124-bundle-repair-existing'
    needs: raw124_bundle_repair_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.raw124_bundle_repair_kids) }}
    env:
      RAW124_BRANCH: ${{ inputs.raw124_branch }}
      SOURCE_RUN_ID: ${{ inputs.raw124_bundle_source_run_id }}
    steps:
      - name: Require prior source run
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID" || { echo "raw124_bundle_source_run_id is required"; exit 2; }
      - uses: actions/download-artifact@v4
        with:
          name: raw124-${{ inputs.raw124_branch }}-common
          run-id: ${{ inputs.raw124_bundle_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/a2-raw124-bundle
      - uses: actions/download-artifact@v4
        with:
          name: raw124-${{ inputs.raw124_branch }}-repair-source
          path: /tmp/a2-raw124-repair-source
      - name: Verify source pin and use bundled Lean toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/a2-raw124-bundle
          expected="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .head_sha)"
          test "$(cat SOURCE_COMMIT)" = "$expected"
          sha256sum -c RAW124_SOURCE.sha256
          echo "ELAN_HOME=$PWD/.elan" >> "$GITHUB_ENV"
          echo "$PWD/.elan/bin" >> "$GITHUB_PATH"
          find "$PWD/.elan" -type f -path '*/bin/*' -exec chmod u+x {} +
          export ELAN_HOME="$PWD/.elan"
          export PATH="$PWD/.elan/bin:$PATH"
          lean --version
      - name: Compile selected repair kid modules
        env:
          KIDS: ${{ matrix.kids }}
        run: |
          set -euo pipefail
          cd /tmp/a2-raw124-bundle
          export LEAN_PATH="$PWD"
          STEM="Raw124B${RAW124_BRANCH}"
          mkdir -p /tmp/a2-raw124-repair-kids
          : > /tmp/a2-raw124-repair-kids/repair-shard.log
          SRC_DIR=/tmp/a2-raw124-repair-source
          for k in $KIDS; do
            echo "Compiling subdivided ${STEM}Kid${k}" | tee -a /tmp/a2-raw124-repair-kids/repair-shard.log
            if [[ -f "$SRC_DIR/optimized/$k.order" ]]; then
              while IFS= read -r mod; do
                echo "Compiling $mod" | tee -a /tmp/a2-raw124-repair-kids/repair-shard.log
                cp "$SRC_DIR/optimized/$mod.lean" "$mod.lean"
                lean -j 1 -o "$mod.olean" "$mod.lean" 2>&1 | tee -a /tmp/a2-raw124-repair-kids/repair-shard.log
                cp "$mod.olean" /tmp/a2-raw124-repair-kids/
              done < "$SRC_DIR/optimized/$k.order"
            else
              cp "$SRC_DIR/${STEM}Kid${k}.lean" "${STEM}Kid${k}.lean"
              lean -o "${STEM}Kid${k}.olean" "${STEM}Kid${k}.lean" 2>&1 | tee -a /tmp/a2-raw124-repair-kids/repair-shard.log
              cp "${STEM}Kid${k}.olean" /tmp/a2-raw124-repair-kids/
            fi
          done
          if grep -Eq 'sorryAx|native_decide' /tmp/a2-raw124-repair-kids/repair-shard.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw124-${{ inputs.raw124_branch }}-repair-kids-${{ matrix.shard }}
          path: /tmp/a2-raw124-repair-kids/
          if-no-files-found: error
          retention-days: 90

  raw124_bundle_assemble_existing:
    if: inputs.target == 'weighted-tnf-raw124-bundle-repair-existing'
    needs: [raw124_bundle_repair_prepare, raw124_bundle_repair_shards]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RAW124_BRANCH: ${{ inputs.raw124_branch }}
      SOURCE_RUN_ID: ${{ inputs.raw124_bundle_source_run_id }}
    steps:
      - name: Require prior source run
        run: |
          set -euo pipefail
          test -n "$SOURCE_RUN_ID" || { echo "raw124_bundle_source_run_id is required"; exit 2; }
      - uses: actions/download-artifact@v4
        with:
          name: raw124-${{ inputs.raw124_branch }}-common
          run-id: ${{ inputs.raw124_bundle_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/a2-raw124-bundle
      - uses: actions/download-artifact@v4
        with:
          name: raw124-${{ inputs.raw124_branch }}-repair-source
          path: /tmp/a2-raw124-bundle/repair-source
      - uses: actions/download-artifact@v4
        with:
          pattern: raw124-${{ inputs.raw124_branch }}-kids-*
          run-id: ${{ inputs.raw124_bundle_source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/a2-raw124-bundle
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: inputs.raw124_bundle_previous_repair_run_id != ''
        with:
          pattern: raw124-${{ inputs.raw124_branch }}-repair-kids-*
          run-id: ${{ inputs.raw124_bundle_previous_repair_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/a2-raw124-bundle
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: raw124-${{ inputs.raw124_branch }}-repair-kids-*
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/a2-raw124-bundle
          merge-multiple: true
      - name: Verify source pin, assemble branch theorem and audit axioms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/a2-raw124-bundle
          export LEAN_PATH="$PWD"
          expected="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" --jq .head_sha)"
          test "$(cat SOURCE_COMMIT)" = "$expected"
          sha256sum -c RAW124_SOURCE.sha256
          export ELAN_HOME="$PWD/.elan"
          export PATH="$PWD/.elan/bin:$PATH"
          find "$PWD/.elan" -type f -path '*/bin/*' -exec chmod u+x {} +
          lean --version
          STEM="Raw124B${RAW124_BRANCH}"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("/tmp/a2-raw124-bundle")
          source = root / "repair-source"
          manifest = json.loads((source / "SPLIT_MANIFEST.json").read_text())
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert manifest["source_commit"] == (root / "SOURCE_COMMIT").read_text().strip()
          assert manifest["branch"] == os.environ["RAW124_BRANCH"]
          for name, expected_sha in manifest["stable_source_sha256"].items():
              assert sha(root / name) == expected_sha, name
          for kid, entry in manifest["kids"].items():
              name = f'Raw124B{os.environ["RAW124_BRANCH"]}Kid{kid}.lean'
              assert sha(root / name) == entry["original"]["sha256"], f"original {name}"
              new_path = source / name
              assert sha(new_path) == entry["subdivided"]["sha256"], f"subdivided {name}"
              text = new_path.read_text()
              for statement in entry["root_statements"].values():
                  assert statement in text, f"root statement missing in {name}"
          optimized = source / "optimized"
          if optimized.is_dir():
              reports = json.loads((optimized / "OPTIMIZED_MANIFEST.json").read_text())
              for kid, report in reports.items():
                  for module, expected_sha in report["source_sha256"].items():
                      assert sha(optimized / (module + ".lean")) == expected_sha, module
                      assert (root / (module + ".olean")).is_file(), module
                  wrapper = optimized / f'Raw124B{os.environ["RAW124_BRANCH"]}Kid{kid}.lean'
                  for statement in manifest["kids"][kid]["root_statements"].values():
                      assert statement in wrapper.read_text(), (kid, statement)
          print("Raw124 subdivided kid manifest, original source pins, and stable parent interfaces verified.")
          PY
          for k in $(seq -w 0 23); do test -s "${STEM}KidK$k.olean"; done
          lean -o "${STEM}Data.olean" "${STEM}Data.lean" 2>&1 | tee /tmp/a2-raw124-bundle-assemble.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a2-raw124-bundle-assemble.log; then exit 1; fi
          python - <<'PY'
          import os, pathlib, re
          log = pathlib.Path('/tmp/a2-raw124-bundle-assemble.log').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          seen = set()
          for name, axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", log):
              actual = {a.strip() for a in axioms.split(',') if a.strip()}
              assert actual <= allowed, (name, actual - allowed)
              seen.add(name.rsplit('.', 1)[-1])
          for name in re.findall(r"'([^']+)' does not depend on any axioms", log):
              seen.add(name.rsplit('.', 1)[-1])
          assert {'checkRoot', 'bound_all'} <= seen, seen
          print(f'Raw124 {os.environ["RAW124_BRANCH"]} source-accepted branch and allowed-axiom gate passed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw124-${{ inputs.raw124_branch }}-source-accepted-repair-${{ github.run_id }}
          path: |
            /tmp/a2-raw124-bundle/*.olean
            /tmp/a2-raw124-bundle-assemble.log
            /tmp/a2-raw124-bundle/SOURCE_COMMIT
            /tmp/a2-raw124-bundle/RAW124_SOURCE.sha256
            /tmp/a2-raw124-bundle/repair-source/**
          if-no-files-found: error
          retention-days: 90


  raw123:
