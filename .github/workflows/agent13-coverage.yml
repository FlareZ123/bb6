name: Agent 13 BB6 full-domain coverage (manual)
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Source closure to verify'
        type: choice
        options: [legacy, weighted-first-one, weighted-halt-branch, source-queue-adapter, queue-coverage, weighted-tnf-pilot, weighted-tnf-three-hole, weighted-tnf-four-hole, weighted-tnf-four-hole-sibling, weighted-tnf-r1-sweep, queue-orbit, weighted-tnf-roster-convergence, weighted-tnf-roster-agent47-graft, weighted-tnf-pure-residuals, weighted-tnf-raw99, weighted-tnf-raw124-rf, weighted-tnf-raw124-lc, weighted-tnf-raw124-1rf, weighted-tnf-raw124-0rb, weighted-tnf-raw124-bundle, weighted-tnf-raw103, weighted-tnf-raw104, weighted-tnf-agent8-five, weighted-tnf-agent8-six, weighted-tnf-roster-composition, weighted-tnf-agent3-siblings, weighted-tnf-raw85-parent-check, weighted-tnf-raw91, weighted-tnf-raw87, weighted-tnf-raw83-pump, weighted-tnf-agent10-multi, weighted-tnf-agent10-five-new, weighted-tnf-agent10-five-roster, weighted-tnf-agent10-raw106, weighted-tnf-raw63-counter, weighted-tnf-raw61-witnesses, weighted-tnf-prefix-single, weighted-tnf-agent10-single, weighted-tnf-combined-109, weighted-tnf-root-zero-refinement, weighted-tnf-combined-106, weighted-tnf-raw120-late, weighted-tnf-raw120-rf, weighted-tnf-raw120-rb, weighted-tnf-root-sibling-first-hole]
        default: legacy
      raw_id:
        description: 'Single Agent 10 residual index (single target only)'
        type: string
        default: '68'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Unpack, integrity check and compile complete source chain
        if: inputs.target == 'legacy'
        run: |
          set -e
          cd im-results/agent13-coverage
          python unpack.py
          export LEAN_PATH=.
          lean -o BB6Coverage.olean BB6Coverage.lean
          lean -o SparseCoverage.olean SparseCoverage.lean
          lean -o LassoCoverage.olean LassoCoverage.lean
          lean -o ShiftCoverage.olean ShiftCoverage.lean
          lean -o StateClosed.olean StateClosed.lean
          lean -o InvariantCoverage.olean InvariantCoverage.lean
          lean -o TreeCoverage.olean TreeCoverage.lean
          lean -o FiniteTapeCoverage.olean FiniteTapeCoverage.lean
          lean -o FiniteTapeShift.olean FiniteTapeShift.lean
          lean -o FiniteLeafChecks.olean FiniteLeafChecks.lean
          lean LeafDemo.lean
      - name: Verify weighted first-write normalization against original source
        if: inputs.target == 'weighted-first-one' || inputs.target == 'weighted-halt-branch' || inputs.target == 'source-queue-adapter' || inputs.target == 'queue-orbit'
        run: |
          set -eu
          python im-results/agent13-coverage/unpack.py
          export LEAN_PATH=im-results/agent8-coverage-contract:im-results/agent4-coverage-smoke:im-results/agent42-coverage-normal:im-results/agent13-coverage:im-results/agent13-weighted-first-one:im-results/agent6-fresh-glider:im-results/agent7-far
          lean -o im-results/agent8-coverage-contract/Frontier.olean im-results/agent8-coverage-contract/Frontier.lean
          lean -o im-results/agent8-coverage-contract/Symmetry.olean im-results/agent8-coverage-contract/Symmetry.lean
          lean -o im-results/agent8-coverage-contract/RootShift.olean im-results/agent8-coverage-contract/RootShift.lean
          lean -o im-results/agent42-coverage-normal/FirstStep.olean im-results/agent42-coverage-normal/FirstStep.lean
          lean -o im-results/agent4-coverage-smoke/WriteOneDrift.olean im-results/agent4-coverage-smoke/WriteOneDrift.lean
          lean -o im-results/agent8-coverage-contract/Prune.olean im-results/agent8-coverage-contract/Prune.lean
          lean -o im-results/agent42-coverage-normal/TwoFirst.olean im-results/agent42-coverage-normal/TwoFirst.lean
          lean -o im-results/agent13-coverage/BB6Coverage.olean im-results/agent13-coverage/BB6Coverage.lean
          lean -o im-results/agent8-coverage-contract/OneHalt.olean im-results/agent8-coverage-contract/OneHalt.lean
          lean -o im-results/agent4-coverage-smoke/CrossCoverage.olean im-results/agent4-coverage-smoke/CrossCoverage.lean
          lean -o im-results/agent4-coverage-smoke/CrossUpper.olean im-results/agent4-coverage-smoke/CrossUpper.lean
          lean -o im-results/agent42-coverage-normal/CrossFirstUpper.olean im-results/agent42-coverage-normal/CrossFirstUpper.lean
          lean -o im-results/agent42-coverage-normal/TwoCylinder.olean im-results/agent42-coverage-normal/TwoCylinder.lean
          lean -o im-results/agent13-weighted-first-one/BlankDelayKernel.olean im-results/agent13-weighted-first-one/BlankDelayKernel.lean
          lean -o im-results/agent13-weighted-first-one/BlankDelaySource.olean im-results/agent13-weighted-first-one/BlankDelaySource.lean
          lean -o im-results/agent13-weighted-first-one/SparseBlankDelay.olean im-results/agent13-weighted-first-one/SparseBlankDelay.lean
          lean -o im-results/agent13-weighted-first-one/WeightedTNF.olean im-results/agent13-weighted-first-one/WeightedTNF.lean
          lean -o im-results/agent13-weighted-first-one/WeightedTNFCertificate.olean im-results/agent13-weighted-first-one/WeightedTNFCertificate.lean
          lean -o im-results/agent7-far/FAR.olean im-results/agent7-far/FAR.lean
          lean -o im-results/agent7-far/FARCheck.olean im-results/agent7-far/FARCheck.lean
          lean -o im-results/agent7-far/FARSearch.olean im-results/agent7-far/FARSearch.lean
          lean -o im-results/agent7-far/FARBi.olean im-results/agent7-far/FARBi.lean
          lean -o im-results/agent7-far/FastFAR.olean im-results/agent7-far/FastFAR.lean
          lean -o im-results/agent7-far/WeightedTNFBridge.olean im-results/agent7-far/WeightedTNFBridge.lean
          lean -o im-results/agent6-fresh-glider/FreshRayGlider.olean im-results/agent6-fresh-glider/FreshRayGlider.lean
          lean -o im-results/agent7-far/FARWeightedTNFExample.olean im-results/agent7-far/FARWeightedTNFExample.lean
      - name: Verify canonical-audit to weighted-TNF bridge
        if: inputs.target == 'weighted-first-one'
        run: |
          set -euo pipefail
          export LEAN_PATH=im-results/agent8-coverage-contract:im-results/agent4-coverage-smoke:im-results/agent42-coverage-normal:im-results/agent13-coverage:im-results/agent13-weighted-first-one:im-results/agent6-fresh-glider:im-results/agent7-far
          python tools/lean_compile_closure.py --workdir /tmp/a7-canonical-tnf --jobs 8 im-results/agent7-far/CanonicalTNFBridge.lean im-results/agent7-far/CanonicalTNFExample.lean | tee /tmp/a7-canonical-tnf.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a7-canonical-tnf.log; then
            echo "Forbidden proof placeholder or native_decide found in canonical-TNF closure" >&2
            exit 1
          fi
          lean -o im-results/agent13-weighted-first-one/WeightedTNFExamples.olean im-results/agent13-weighted-first-one/WeightedTNFExamples.lean
          lean im-results/agent13-weighted-first-one/WeightedFirstOneCover.lean

      - name: Verify source Enumerate62 TNF expansion adapter
        if: inputs.target == 'source-queue-adapter'
        run: |
          set -eu
          export LEAN_PATH=im-results/agent8-coverage-contract:im-results/agent4-coverage-smoke:im-results/agent42-coverage-normal:im-results/agent13-coverage:im-results/agent13-weighted-first-one:im-results/agent6-fresh-glider:im-results/agent7-far
          set -o pipefail
          export LEAN_PATH="$LEAN_PATH:im-results/agent5-weighted-tnf-queue:im-results/agent32-source-queue"
          lean -o im-results/agent5-weighted-tnf-queue/Enumerate62Adapter.olean im-results/agent5-weighted-tnf-queue/Enumerate62Adapter.lean | tee /tmp/enumerate62-weighted-tnf-adapter.log
          lean -o im-results/agent13-weighted-first-one/QueueCoverageContract.olean im-results/agent13-weighted-first-one/QueueCoverageContract.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          lean -o im-results/agent32-source-queue/QueueImplication.olean im-results/agent32-source-queue/QueueImplication.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          export LEAN_PATH="$LEAN_PATH:im-results/agent48-counted-inc0"
          lean -o im-results/agent32-source-queue/SourceQueueImplication.olean im-results/agent32-source-queue/SourceQueueImplication.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          lean -o im-results/agent48-counted-inc0/Enumerate62Potential.olean im-results/agent48-counted-inc0/Enumerate62Potential.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          lean -o im-results/agent11-tnf-cut-potential/CutSensitivePotential.olean im-results/agent11-tnf-cut-potential/CutSensitivePotential.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          export LEAN_PATH="$LEAN_PATH:im-results/agent11-tnf-cut-potential"
          lean -o im-results/agent11-tnf-cut-potential/SourceNodeCutAdapter.olean im-results/agent11-tnf-cut-potential/SourceNodeCutAdapter.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          lean -o im-results/agent32-source-queue/SourceQueueDrain.olean im-results/agent32-source-queue/SourceQueueDrain.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          lean -o im-results/agent13-weighted-first-one/WeightedFirstOneCover.olean im-results/agent13-weighted-first-one/WeightedFirstOneCover.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          lean -o im-results/agent32-source-queue/SourceFiniteSemantics.olean im-results/agent32-source-queue/SourceFiniteSemantics.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          lean im-results/agent32-source-queue/SourceQueueExact.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          lean -o im-results/agent32-source-queue/SourceTableEncoding.olean im-results/agent32-source-queue/SourceTableEncoding.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          lean im-results/agent8-adaptive-source-plan/SourceNodeCodec.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          export LEAN_PATH="$LEAN_PATH:im-results/agent32-f418-shift-overflow"
          lean -o im-results/agent32-f418-shift-overflow/F418Rules.olean im-results/agent32-f418-shift-overflow/F418Rules.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          lean im-results/agent32-f418-shift-overflow/F418Seed.lean | tee -a /tmp/enumerate62-weighted-tnf-adapter.log
          if grep -Eq 'sorryAx|native_decide' /tmp/enumerate62-weighted-tnf-adapter.log; then
            echo "Forbidden proof placeholder or native_decide found in source TNF adapter closure" >&2
            exit 1
          fi

      - name: Verify corrected read-one weighted halt branch
        if: inputs.target == 'weighted-halt-branch'
        run: |
          set -eu
          export LEAN_PATH=im-results/agent8-coverage-contract:im-results/agent4-coverage-smoke:im-results/agent42-coverage-normal:im-results/agent13-coverage:im-results/agent13-weighted-first-one:im-results/agent6-fresh-glider:im-results/agent7-far
          lean im-results/agent47-weighted-halt-branch/WeightedReadOneHalt.lean
          lean im-results/agent47-weighted-halt-branch/WeightedNonhaltLeafAdapter.lean

      - name: Verify generic two-list queue coverage contract
        if: inputs.target == 'queue-coverage'
        run: |
          set -eu
          lean im-results/agent13-weighted-first-one/QueueCoverageContract.lean | tee /tmp/queue-coverage-contract.log
          if grep -Eq 'sorryAx|native_decide' /tmp/queue-coverage-contract.log; then
            echo "Forbidden proof placeholder or native_decide found in queue-coverage contract" >&2
            exit 1
          fi

      - name: Verify fresh-state quotient branch frontier
        if: inputs.target == 'queue-orbit'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          export LEAN_PATH=im-results/agent8-coverage-contract:im-results/agent4-coverage-smoke:im-results/agent42-coverage-normal:im-results/agent13-coverage:im-results/agent13-weighted-first-one:im-results/agent6-fresh-glider:im-results/agent7-far
          lean -o im-results/agent13-weighted-first-one/WeightedTNFQueueOrbit.olean im-results/agent13-weighted-first-one/WeightedTNFQueueOrbit.lean | tee /tmp/weighted-tnf-queue-orbit.log
          if grep -Eq 'sorryAx|native_decide' /tmp/weighted-tnf-queue-orbit.log; then
            echo "Forbidden proof placeholder or native_decide found in TNF quotient closure" >&2
            exit 1
          fi

      - name: Check complete authentic weighted TNF pilot
        if: inputs.target == 'weighted-tnf-pilot'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir /tmp/a50-tnf-pilot --jobs 8 im-results/agent50-weighted-tnf-pilot/CryptidSiblings.lean im-results/agent50-weighted-tnf-pilot/RootFrontier.lean | tee /tmp/a50-tnf-pilot.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a50-tnf-pilot.log; then
            echo "Forbidden proof placeholder or native_decide found in pilot closure" >&2
            exit 1
          fi

      - name: Check complete three-hole weighted TNF subtree
        if: inputs.target == 'weighted-tnf-three-hole'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir /tmp/a31-tnf --jobs 8 im-results/agent31-three-hole-tnf/ThreeHoleData.lean | tee /tmp/a31-tnf.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a31-tnf.log; then
            echo "Forbidden proof placeholder or native_decide found in three-hole closure" >&2
            exit 1
          fi

      - name: Check full four-hole weighted TNF subtree
        if: inputs.target == 'weighted-tnf-four-hole'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python tools/lean_compile_closure.py --workdir /tmp/a31-four --jobs 4 im-results/agent31-three-hole-tnf/FourHoleData.lean im-results/agent31-three-hole-tnf/FourHoleRootFrontier.lean im-results/agent31-three-hole-tnf/FourHoleResidualRoster.lean | tee /tmp/a31-four.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a31-four.log; then
            echo "Forbidden proof placeholder or native_decide found in four-hole closure" >&2
            exit 1
          fi

      - name: Check sibling four-hole parent with reused DFA/pump catalogue
        if: inputs.target == 'weighted-tnf-four-hole-sibling'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent31-three-hole-tnf/generate_four_hole_sibling.py
          python tools/lean_compile_closure.py --workdir /tmp/a31-four-sib --jobs 4 im-results/agent31-three-hole-tnf/FourHoleSiblingData.lean im-results/agent11-tnf-cut-potential/FourHoleSiblingRosterBridge.lean | tee /tmp/a31-four-sib.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a31-four-sib.log; then
            echo "Forbidden proof placeholder or native_decide found in sibling four-hole closure" >&2
            exit 1
          fi

      - name: Check authentic r1 sibling sweep
        if: inputs.target == 'weighted-tnf-r1-sweep'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir /tmp/a47-r1-sweep --jobs 4 im-results/agent47-r4-counter/R4Parent.lean | tee /tmp/a47-r1-sweep.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a47-r1-sweep.log; then
            echo "Forbidden proof placeholder or native_decide found in r1 sweep closure" >&2
            exit 1
          fi

      - name: Experimental compile of pure four-hole residual projection
        if: inputs.target == 'weighted-tnf-pure-residuals'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          export LEAN_PATH=im-results/agent8-coverage-contract:im-results/agent4-coverage-smoke:im-results/agent42-coverage-normal:im-results/agent13-coverage:im-results/agent13-weighted-first-one:im-results/agent6-fresh-glider:im-results/agent7-far:im-results/agent31-three-hole-tnf:im-results/agent50-weighted-tnf-pilot:im-results/agent13-roster-convergence:im-results/agent44-source-roster
          python tools/lean_compile_closure.py --workdir /tmp/a44-pure-residuals --jobs 4 im-results/agent44-source-roster/PureFourHoleResiduals.lean | tee /tmp/a44-pure-residuals.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a44-pure-residuals.log; then
            echo "Forbidden proof placeholder or native_decide found in pure residual projection" >&2
            exit 1
          fi

      - name: Verify exact convergence of the 124-table first-one residual frontier
        if: inputs.target == 'weighted-tnf-roster-convergence'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          export LEAN_PATH=im-results/agent8-coverage-contract:im-results/agent4-coverage-smoke:im-results/agent42-coverage-normal:im-results/agent13-coverage:im-results/agent13-weighted-first-one:im-results/agent6-fresh-glider:im-results/agent7-far:im-results/agent31-three-hole-tnf:im-results/agent50-weighted-tnf-pilot:im-results/agent13-roster-convergence:im-results/agent44-source-roster
          python tools/lean_compile_closure.py --workdir /tmp/a13-roster-convergence --jobs 4 im-results/agent13-roster-convergence/RosterConvergence.lean im-results/agent44-source-roster/SourceRosterEncoding.lean | tee /tmp/a13-roster-convergence.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a13-roster-convergence.log; then
            echo "Forbidden proof placeholder or native_decide found in 124-roster convergence closure" >&2
            exit 1
          fi

      - name: Verify Agent48 adaptive side-cycle graft and TNF composition
        if: inputs.target == 'weighted-tnf-roster-agent47-graft'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          export LEAN_PATH=im-results/agent8-coverage-contract:im-results/agent4-coverage-smoke:im-results/agent42-coverage-normal:im-results/agent13-coverage:im-results/agent13-weighted-first-one:im-results/agent6-fresh-glider:im-results/agent7-far:im-results/agent31-three-hole-tnf:im-results/agent50-weighted-tnf-pilot:im-results/agent13-roster-convergence:im-results/agent44-source-roster:im-results/agent47-rooted-tnf:im-results/agent47-r1-sweep:im-results/agent47-r4-counter:im-results/agent48-roster-graft
          python tools/lean_compile_closure.py --workdir /tmp/a48-roster-graft --jobs 4 im-results/agent48-roster-graft/Agent48RosterGraftComposition.lean | tee /tmp/a48-roster-graft.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a48-roster-graft.log; then
            echo "Forbidden proof placeholder or native_decide found in Agent48 roster graft closure" >&2
            exit 1
          fi

      - name: Check raw residual 99 and its exact roster graft
        if: inputs.target == 'weighted-tnf-raw99'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent2-tnf-raw99/generate.py
          python tools/lean_compile_closure.py --workdir /tmp/a2-raw99 --jobs 4 im-results/agent2-tnf-raw99/Raw99RosterBridge.lean | tee /tmp/a2-raw99.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a2-raw99.log; then
            echo "Forbidden proof placeholder or native_decide found in raw99 closure" >&2
