    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate and verify local-window pilot
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          cd im-results/agent1-ngram
          g++ -std=c++17 -O3 ngram.cpp -o /tmp/ngram
          /tmp/ngram 10 < pilot.txt > /tmp/ngram-pilot.txt
          test "$(wc -l </tmp/ngram-pilot.txt)" -eq 4
          python emit_ngram.py pilot.txt /tmp/ngram-pilot.txt NGramPilot.lean
          cd ../..
          python tools/lean_compile_closure.py --workdir /tmp/ngram-pilot --jobs 2 im-results/agent1-ngram/NGramPilot.lean | tee /tmp/ngram-pilot.log
          if grep -Eq 'sorryAx|native_decide' /tmp/ngram-pilot.log; then exit 1; fi

  champion_parent:
    if: inputs.target == 'weighted-tnf-champion-parent'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Compile original-source champion parent and exact-score certificate
        run: |
          set -euo pipefail
          bash im-results/agent48-champion-root/reproduce-parent.sh

  raw114_complete:
    if: inputs.target == 'weighted-tnf-raw114-complete'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, branches: '0LA 0LB 0LC 0LF' }
          - { shard: 1, branches: '0RA 0RB 0RC 0RF' }
          - { shard: 2, branches: '1LA 1LB 1LC 1LF' }
          - { shard: 3, branches: '1RA 1RB 1RC 1RF' }
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate and kernel-check four E0 branches
        env:
          BRANCHES: ${{ matrix.branches }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent47-raw114-cut/generate_complete.py $BRANCHES
          roots=()
          for b in $BRANCHES; do roots+=("im-results/agent47-raw114-cut/Raw114Complete${b}Data.lean"); done
          python tools/lean_compile_closure.py --workdir /tmp/a47-raw114-complete --jobs 4 "${roots[@]}" | tee /tmp/a47-raw114-complete.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a47-raw114-complete.log; then exit 1; fi
          mkdir -p /tmp/a47-raw114-shard
          cp /tmp/a47-raw114-complete/*.olean /tmp/a47-raw114-shard/
      - uses: actions/upload-artifact@v4
        with:
          name: raw114-complete-${{ matrix.shard }}
          path: /tmp/a47-raw114-shard
          if-no-files-found: error

  raw114_complete_assemble:
    if: inputs.target == 'weighted-tnf-raw114-complete'
    needs: raw114_complete
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: raw114-complete-*
          path: /tmp/a47-raw114-complete
          merge-multiple: true
      - name: Check assembled root and exact residual count
        run: |
          set -euo pipefail
          python im-results/agent47-raw114-cut/generate_complete.py --combine
          cp im-results/agent47-raw114-cut/Raw114CompleteData.lean /tmp/a47-raw114-complete/
          cd /tmp/a47-raw114-complete
          export LEAN_PATH="$PWD"
          lean -o Raw114CompleteData.olean Raw114CompleteData.lean | tee /tmp/a47-raw114-assemble.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a47-raw114-assemble.log; then exit 1; fi

  raw117_prepare:
    if: inputs.target == 'weighted-tnf-agent8-raw117'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate once and check shared source dependencies
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent8-tnf-raw117/generate.py
          D=im-results/agent8-tnf-raw117
          W=/tmp/a8-raw117
          python tools/lean_compile_closure.py --workdir "$W" --jobs 4 "$D/raw117/Raw117Base.lean" im-results/agent47-rooted-tnf/CanonicalFrontier.lean | tee /tmp/a8-raw117-prepare.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a8-raw117-prepare.log; then exit 1; fi
          cp "$D"/raw117/Raw117Kid*.lean "$D/raw117/Raw117Data.lean" "$D/Raw117Roster.lean" "$D/Raw117CanonicalCut.lean" "$W/"
          cd "$W"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > SOURCE_COMMIT
          sha256sum Raw117*.lean > RAW117_SOURCE.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: raw117-common
          path: /tmp/a8-raw117
          if-no-files-found: error

  raw117_shards:
    if: inputs.target == 'weighted-tnf-agent8-raw117'
    needs: raw117_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, kids: '00 01 02 03' }
          - { shard: 1, kids: '04 05 06 07' }
          - { shard: 2, kids: '08 09 10 11' }
          - { shard: 3, kids: '12 13 14 15' }
          - { shard: 4, kids: '16 17 18 19' }
          - { shard: 5, kids: '20 21 22 23' }
    steps:
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw117-common
          path: /tmp/a8-raw117
      - name: Compile disjoint root children
        env:
          KIDS: ${{ matrix.kids }}
        run: |
          set -euo pipefail
          cd /tmp/a8-raw117
          export LEAN_PATH="$PWD"
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum -c RAW117_SOURCE.sha256
          mkdir -p /tmp/a8-raw117-kids
          for k in $KIDS; do printf 'Raw117Kid%s\n' "$k"; done |
            xargs -P 2 -I '{}' bash -c 'set -e; lean -o "$1.olean" "$1.lean"; cp "$1.olean" /tmp/a8-raw117-kids/' _ '{}' |
            tee /tmp/a8-raw117-shard.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a8-raw117-shard.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw117-kids-${{ matrix.shard }}
          path: /tmp/a8-raw117-kids
          if-no-files-found: error

  raw117_assemble:
    if: inputs.target == 'weighted-tnf-agent8-raw117'
    needs: raw117_shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw117-common
          path: /tmp/a8-raw117
      - uses: actions/download-artifact@v4
        with:
          pattern: raw117-kids-*
          path: /tmp/a8-raw117
          merge-multiple: true
      - name: Assemble exact weighted score and quotient-roster cut
        run: |
          set -euo pipefail
          cd /tmp/a8-raw117
          export LEAN_PATH="$PWD"
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum -c RAW117_SOURCE.sha256
          for k in $(seq -w 0 23); do test -s "Raw117Kid$k.olean"; done
          {
            lean -o Raw117Data.olean Raw117Data.lean
            lean -o Raw117Roster.olean Raw117Roster.lean
            lean -o Raw117CanonicalCut.olean Raw117CanonicalCut.lean
          } 2>&1 | tee /tmp/a8-raw117-assemble.log
          python - <<'PY'
          import pathlib, re
          log = pathlib.Path('/tmp/a8-raw117-assemble.log').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          seen = set()
          for name, axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", log):
              actual = {a.strip() for a in axioms.split(',') if a.strip()}
              assert actual <= allowed, (name, actual - allowed)
              seen.add(name.rsplit('.', 1)[-1])
          for name in re.findall(r"'([^']+)' does not depend on any axioms", log):
              seen.add(name.rsplit('.', 1)[-1])
          assert {'all117', 'attained117', 'exact117', 'canonical_cut_count', 'cut_sound', 'canonical_cut_sound', 'cover_at_target'} <= seen, seen
          print('Exact raw117 and quotient-cut axiom gate passed.')
          PY

  sidewitness_multiparent_scan:
    if: inputs.target == 'weighted-tnf-sidewitness-multiparent-scan'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
