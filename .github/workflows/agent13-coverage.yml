      - name: Check complete raw95 and raw105 with universal sweep leaves
        if: inputs.target == 'weighted-tnf-agent3-siblings'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent3-tnf-raw95/generate.py
