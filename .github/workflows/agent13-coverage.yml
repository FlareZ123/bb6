    if: inputs.target == 'weighted-tnf-combined-106' || inputs.target == 'weighted-tnf-canonical-78' || inputs.target == 'weighted-tnf-canonical-78-exact' || inputs.target == 'weighted-tnf-canonical-two-parent'
    runs-on: ubuntu-latest
