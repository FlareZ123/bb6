name: Agent 13 BB6 full-domain coverage (manual)
run-name: ${{ inputs.target || 'legacy' }} — ${{ github.actor }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Source closure to verify'
        type: choice
        options: [weighted-tnf-q2800-raw10-certificate, weighted-tnf-raw10-box18to24, weighted-tnf-raw10-box6, weighted-tnf-canonical-partial-audit, weighted-tnf-q32-slice-closed, weighted-tnf-q32-queue-slice, weighted-tnf-q32-row26, weighted-tnf-q32-row34, weighted-tnf-q32-five-hole, weighted-tnf-raw10-domain-box7, weighted-tnf-raw118-long, weighted-tnf-raw118-bidfa, weighted-tnf-raw118-independent, weighted-tnf-raw118-phasegraph, weighted-tnf-raw118-recursive, weighted-tnf-raw118-nested, weighted-tnf-raw118-nested657, weighted-tnf-raw118-partial, weighted-tnf-raw118-symbolic, weighted-tnf-raw118-sparse, weighted-tnf-raw118-treebank, weighted-tnf-raw118-sat, weighted-tnf-raw118-wide-cert, weighted-tnf-raw120-1lb-sat-cert, weighted-tnf-raw118-consumer, weighted-tnf-raw118-canonical76-membership, weighted-tnf-raw118-sat-crossbank, weighted-tnf-raw118-run-summary, weighted-tnf-raw118-run-summary-extra, weighted-tnf-raw118-run-summary-second, weighted-tnf-raw118-wide-repair, legacy, weighted-first-one, weighted-halt-branch, source-queue-adapter, queue-coverage, weighted-tnf-pilot, weighted-tnf-three-hole, weighted-tnf-four-hole, weighted-tnf-four-hole-sibling, weighted-tnf-r1-sweep, queue-orbit, weighted-tnf-roster-convergence, weighted-tnf-roster-agent47-graft, weighted-tnf-pure-residuals, weighted-tnf-agent42-frontier-count, weighted-tnf-raw99, weighted-tnf-raw113, weighted-tnf-raw123, weighted-tnf-raw123-recursive, weighted-tnf-raw123-bidfa, weighted-tnf-raw124-rf, weighted-tnf-raw124-lc, weighted-tnf-raw124-1rf, weighted-tnf-raw124-0rb, weighted-tnf-raw124-bundle, weighted-tnf-raw124-0lf-hard-search, weighted-tnf-raw124-1la, weighted-tnf-raw124-1la-sharded, weighted-tnf-raw124-0lb-longcycle100k, weighted-tnf-raw124-bundle-sharded, weighted-tnf-raw124-0lf-growth, weighted-tnf-raw124-0lf-simulation, weighted-tnf-raw124-champion-bound, weighted-tnf-raw103, weighted-tnf-raw104, weighted-tnf-agent8-five, weighted-tnf-agent8-six, weighted-tnf-agent8-raw117, weighted-tnf-agent8-raw112-macros, weighted-tnf-agent8-raw54, weighted-tnf-roster-composition, weighted-tnf-agent3-siblings, weighted-tnf-raw85-parent-check, weighted-tnf-raw91, weighted-tnf-raw87, weighted-tnf-raw83-pump, weighted-tnf-agent10-multi, weighted-tnf-agent10-five-new, weighted-tnf-agent10-five-roster, weighted-tnf-agent10-raw106, weighted-tnf-raw63-counter, weighted-tnf-raw61-witnesses, weighted-tnf-prefix-single, weighted-tnf-agent10-single, weighted-tnf-combined-109, weighted-tnf-root-zero-refinement, weighted-tnf-combined-106, weighted-tnf-canonical-78, weighted-tnf-canonical-78-exact, weighted-tnf-raw108-canonical, weighted-tnf-canonical-two-parent, weighted-tnf-raw10-box, weighted-tnf-raw10-box8-cycle, weighted-tnf-raw10-box0-halt, weighted-tnf-raw10-short-frontier, weighted-tnf-held-block-far, weighted-tnf-raw120-late, weighted-tnf-raw120-1341, weighted-tnf-raw120-cycles, weighted-tnf-raw120-rf, weighted-tnf-raw120-rb, weighted-tnf-raw120-rc, weighted-tnf-raw120-1rb, weighted-tnf-raw120-1rc, weighted-tnf-raw120-1ra, weighted-tnf-raw120-1rf, weighted-tnf-raw120-1lb-search, weighted-tnf-raw120-1lb, weighted-tnf-raw120-1la, weighted-tnf-raw120-1lf, weighted-tnf-raw120-0lb, weighted-tnf-raw120-0lf, weighted-tnf-raw120-partition, weighted-tnf-raw120-la-carry, weighted-tnf-raw120-la, weighted-tnf-raw120-ra-phases, weighted-tnf-raw120-0ra, weighted-tnf-root-sibling-first-hole, weighted-tnf-canonical-frontier, weighted-tnf-raw114-cut, weighted-tnf-raw114-far, weighted-tnf-raw114-pumps, weighted-tnf-raw114-complete, weighted-tnf-raw107-witnesses, weighted-tnf-raw107-1la, weighted-tnf-raw60, weighted-tnf-raw60-conditional, weighted-tnf-raw60-next, weighted-tnf-raw60-la, weighted-tnf-raw60-assemble, weighted-tnf-raw60-progress, weighted-tnf-raw60-0lf-witnesses, weighted-tnf-raw60-complete, weighted-tnf-raw60-repair, weighted-tnf-raw60-sparse-shards, weighted-tnf-raw60-membership, weighted-tnf-raw60-discover, weighted-tnf-raw60-1lf, weighted-tnf-raw60-1re, weighted-tnf-raw60-graft, weighted-tnf-ngram-pilot, weighted-tnf-champion-parent, weighted-tnf-held-leaf-109-membership, weighted-tnf-canonical76-raw10-membership, weighted-tnf-raw10-box-ranked-search, weighted-tnf-raw10-box-source-bridge, weighted-tnf-raw10-domain-source-inspect, weighted-tnf-raw10-box8-halt-slice, weighted-tnf-raw10-box8-cert-compile, weighted-tnf-f412-partition, weighted-tnf-sidewitness-multiparent, weighted-tnf-sidewitness-multiparent-scan, weighted-tnf-raw10-hardroot-r1-adapter, weighted-tnf-agent8-raw54-lf, weighted-tnf-raw10-box18to24-canonical76]
        default: legacy
      raw_id:
        description: 'Single Agent 10 residual index (single target only)'
        type: string
        default: '68'
      raw124_branch:
        description: 'Bundle-backed raw124 F1 branch to audit (e.g. 0RA, 0LD, 1RA, 1LA)'
        type: string
        default: '0RA'
      raw60_artifact_run_id:
        description: 'Prior workflow run containing reusable raw60 child artifacts'
        type: string
        default: ''
      raw60_repair_artifact_run_id:
        description: 'Run containing the accepted repaired 0LF closure'
        type: string
        default: '45662069999'
      raw60_1re_artifact_run_id:
        description: 'Optional run containing the accepted 1RE closure'
        type: string
        default: '45683912400'
      raw60_artifact_sha:
        description: 'Source commit used to build the reusable raw60 child artifacts'
        type: string
        default: 'b64f98e90febcd10bdfc60e7ff0c66615d2f2e7f'
      raw60_shard_children:
        description: 'JSON array of raw60 child IDs to compile in small kid shards'
        type: string
        default: '["1LA","1LB"]'
      raw118_wide_run_id:
        description: 'Run containing source-checked Raw118 wide-window certificate artifacts'
        type: string
        default: '45667306290'
      raw118_wide_repair_run_id:
        description: 'Optional repair run containing the remaining Raw118 wide-window artifacts'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  check:
    if: >-
      inputs.target != 'weighted-tnf-agent8-raw117'
      && inputs.target != 'weighted-tnf-raw108-canonical'
      && inputs.target != 'weighted-tnf-raw113'
      && inputs.target != 'weighted-tnf-raw123'
      && inputs.target != 'weighted-tnf-raw123-recursive' && inputs.target != 'weighted-tnf-raw123-bidfa'
      && inputs.target != 'weighted-tnf-raw124-1la-sharded'
      && inputs.target != 'weighted-tnf-raw124-0lb-longcycle100k'
      && inputs.target != 'weighted-tnf-raw124-bundle-sharded'
      && inputs.target != 'weighted-tnf-raw124-0lf-hard-search'
      && inputs.target != 'weighted-tnf-raw124-0lf-growth'
      && inputs.target != 'weighted-tnf-raw124-0lf-simulation'
      && inputs.target != 'weighted-tnf-canonical76-raw10-membership'
      && inputs.target != 'weighted-tnf-raw10-box-ranked-search'
      && inputs.target != 'weighted-tnf-raw10-box-source-bridge'
      && inputs.target != 'weighted-tnf-raw10-domain-source-inspect'
      && inputs.target != 'weighted-tnf-raw10-box8-halt-slice'
      && inputs.target != 'weighted-tnf-held-leaf-109-membership'
      && inputs.target != 'weighted-tnf-raw10-box'
      && inputs.target != 'weighted-tnf-raw10-box8-cycle'
      && inputs.target != 'weighted-tnf-raw10-box0-halt'
      && inputs.target != 'weighted-tnf-raw10-short-frontier'
      && inputs.target != 'weighted-tnf-raw120-1341'
      && inputs.target != 'weighted-tnf-raw120-ra-phases'
      && inputs.target != 'weighted-tnf-raw120-0ra'
      && inputs.target != 'weighted-tnf-raw120-1lb-search'
      && inputs.target != 'weighted-tnf-raw120-1lb'
      && inputs.target != 'weighted-tnf-raw120-1ra'
      && inputs.target != 'weighted-tnf-raw120-1rf'
      && inputs.target != 'weighted-tnf-raw120-1la'
      && inputs.target != 'weighted-tnf-raw120-1lf'
      && inputs.target != 'weighted-tnf-raw120-0lb'
      && inputs.target != 'weighted-tnf-raw120-0lf'
      && inputs.target != 'weighted-tnf-raw60-sparse-shards'
      && inputs.target != 'weighted-tnf-raw60-complete'
      && inputs.target != 'weighted-tnf-raw60-repair'
      && inputs.target != 'weighted-tnf-raw118-wide-cert'
      && inputs.target != 'weighted-tnf-agent8-raw54-lf'
      && inputs.target != 'weighted-tnf-raw10-box18to24-canonical76'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Prove raw124 branch bound is below champion score
        if: inputs.target == 'weighted-tnf-raw124-champion-bound'
        run: |
          set -euo pipefail
          work="$PWD/.tmp/a2-raw124-champion-bound"
          mkdir -p "$work/imports"
          export BB6_CHAMPION_WORK="$work"
          python3 - <<'PY'
          import base64, io, lzma, os, pathlib, tarfile
          root = pathlib.Path(os.environ["BB6_CHAMPION_WORK"]) / "imports"
          p = pathlib.Path("im-results/agent42-champion-terminal")
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode((p/"TerminalProofs.tar.xz.b64").read_text())), mode="r:xz") as archive:
              member = next(m for m in archive.getmembers() if pathlib.PurePosixPath(m.name).name == "TerminalFinish.lean")
              (root/"TerminalFinish.lean").write_bytes(archive.extractfile(member).read())
          (root/"TerminalLeft.lean").write_bytes(lzma.decompress(base64.b64decode((p/"TerminalLeftExact.lean.xz.b64").read_text())))
          q = pathlib.Path("im-results/agent13-coverage/BB6Coverage.lean.xz.b64")
          (root/"BB6Coverage.lean").write_bytes(lzma.decompress(base64.b64decode(q.read_text())))
          PY
          printf '%s  %s\n' fbe453c5c170029885ba328bfdd9262600f918a8ce2371c60ecbb843897fd6bd "$work/imports/BB6Coverage.lean" | sha256sum -c -
          printf '%s  %s\n' 12329036c66c3846f9261167b8f9aebd1778d9b6ea6044309956c2fa0b3e49b7 "$work/imports/TerminalFinish.lean" | sha256sum -c -
          printf '%s  %s\n' 1bce2075fc4e0cd7d740fb71b3796088b190ddb6766e04640d992dadd1b650ff "$work/imports/TerminalLeft.lean" | sha256sum -c -
          python tools/lean_compile_closure.py \
            im-results/agent2-tnf-raw124/Raw124ChampionBound.lean \
            --override TerminalBridge=im-results/agent42-champion-terminal/TerminalBridge.lean \
            --override OuterLCIncPrelude=im-results/agent8-counted-reset/OuterLCIncPrelude.lean \
            --override M0OddResidueSeven=im-results/agent41-m0-n16r7/M0OddResidueSeven.lean \
            --override M0EvenEightValuationEncoding=im-results/agent48-counted-inc0/M0EvenEightValuationEncoding.lean \
            --override M2EvenResidueTwo=im-results/agent42-champion-terminal/M2EvenResidueTwo.lean \
            --workdir "$work/build" --jobs 4 | tee "$work/compile.log"
          if grep -Eq 'sorryAx|native_decide' "$work/compile.log"; then exit 1; fi

      - name: Check q2800 cylinder certificates and factored raw10 remainder
        if: inputs.target == 'weighted-tnf-q2800-raw10-certificate'
        run: |
          set -euo pipefail
          node im-results/agent50-raw10-q2800/generate.cjs
          git diff --exit-code -- im-results/agent50-raw10-q2800/Q2800Trees*.lean
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir /tmp/a50-q2800 --jobs 4 --manifest /tmp/a50-q2800/manifest.json im-results/agent50-raw10-q2800/Q2800Raw10Core.lean | tee /tmp/a50-q2800.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a50-q2800.log; then exit 1; fi
      - name: Check canonical partial audit soundness
        if: inputs.target == 'weighted-tnf-canonical-partial-audit'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir /tmp/a13-canonical-partial --jobs 4 im-results/agent13-raw38/CanonicalPartialAudit.lean | tee /tmp/a13-canonical-partial.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a13-canonical-partial.log; then exit 1; fi
      - name: Close all fourteen q32 one-hole residuals with symbolic sweeps
        if: inputs.target == 'weighted-tnf-q32-slice-closed'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent44-source-roster/generate_q32_slice.py
          python im-results/agent44-source-roster/generate_q32_sweeps.py
          python tools/lean_compile_closure.py --workdir /tmp/a44-q32-closed --jobs 4 --manifest /tmp/a44-q32-closed/manifest.json im-results/agent44-source-roster/Q32SliceClosed.lean | tee /tmp/a44-q32-closed.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a44-q32-closed.log; then exit 1; fi
          python tools/lean_compile_closure.py --workdir /tmp/a50-q32-canonical76 --jobs 4 --precompiled-manifest /tmp/a44-q32-closed/manifest.json --precompiled-dir /tmp/a44-q32-closed im-results/agent50-weighted-tnf-pilot/Q32Canonical76Consumer.lean | tee /tmp/a50-q32-canonical76.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a50-q32-canonical76.log; then exit 1; fi
      - name: Certify q32 row 26 from exact source tree
        if: inputs.target == 'weighted-tnf-q32-row26'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent44-source-roster/generate_q32_row26.py
          python tools/lean_compile_closure.py --workdir /tmp/a44-q32-row26 --jobs 4 --manifest /tmp/a44-q32-row26/manifest.json im-results/agent44-source-roster/Q32Slice26.lean | tee /tmp/a44-q32-row26.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a44-q32-row26.log; then exit 1; fi
          cat im-results/agent44-source-roster/Q32Row26Manifest.json
      - name: Consume row 26 in exact q32 parent complement
        if: inputs.target == 'weighted-tnf-q32-row26'
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py --workdir /tmp/a44-q32-row26-consumer --jobs 4 --precompiled-manifest /tmp/a44-q32-row26/manifest.json --precompiled-dir /tmp/a44-q32-row26 --manifest /tmp/a44-q32-row26-consumer/manifest.json im-results/agent44-source-roster/Q32Row26Consumer.lean | tee /tmp/a44-q32-row26-consumer.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a44-q32-row26-consumer.log; then exit 1; fi
      - name: Check two q32 row 34 binary-stack invariants
        if: inputs.target == 'weighted-tnf-q32-row34'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir /tmp/a44-q32-stack --jobs 4 --manifest /tmp/a44-q32-stack/manifest.json im-results/agent44-source-roster/Row34BinaryStack.lean | tee /tmp/a44-q32-stack.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a44-q32-stack.log; then exit 1; fi
      - name: Certify exact q32 row 34 using the two symbolic leaves
        if: inputs.target == 'weighted-tnf-q32-row34'
        run: |
          set -euo pipefail
          python im-results/agent44-source-roster/generate_q32_row34.py
          python tools/lean_compile_closure.py --workdir /tmp/a44-q32-row34 --jobs 4 --precompiled-manifest /tmp/a44-q32-stack/manifest.json --precompiled-dir /tmp/a44-q32-stack --manifest /tmp/a44-q32-row34/manifest.json im-results/agent44-source-roster/Q32Slice34.lean | tee /tmp/a44-q32-row34.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a44-q32-row34.log; then exit 1; fi
          cat im-results/agent44-source-roster/Q32Row34Manifest.json
      - name: Generate and certify four additional q32 five-hole rows
        if: inputs.target == 'weighted-tnf-q32-five-hole'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent44-source-roster/generate_q32_extended.py 28 35 36 37
          for row in 28 35 36 37; do
            dir="/tmp/a44-q32-row${row}"
            args=()
            if [ "$row" != 28 ]; then
              args=(--precompiled-manifest /tmp/a44-q32-row28/manifest.json --precompiled-dir /tmp/a44-q32-row28)
            fi
            python tools/lean_compile_closure.py --workdir "$dir" --jobs 4 --manifest "$dir/manifest.json" "${args[@]}" "im-results/agent44-source-roster/Q32Slice${row}.lean" | tee "$dir.log"
            if grep -Eq 'sorryAx|native_decide' "$dir.log"; then exit 1; fi
            cat "im-results/agent44-source-roster/Q32Row${row}Manifest.json"
          done
      - name: Audit q32 source-queue slice with exact residual complement
        if: inputs.target == 'weighted-tnf-q32-queue-slice'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent44-source-roster/generate_q32_slice.py
          python tools/lean_compile_closure.py --workdir /tmp/a44-q32-slice --jobs 4 im-results/agent44-source-roster/Q32SliceData.lean | tee /tmp/a44-q32-slice.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a44-q32-slice.log; then exit 1; fi
          cat im-results/agent44-source-roster/Q32SliceManifest.json
      - name: Check raw10 rectangles 18–24 sparse-tree coverage
        if: inputs.target == 'weighted-tnf-raw10-box18to24'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          D=im-results/agent49-raw10-box18-24
          W="$D/generated"
          mkdir -p "$W"
          tar -xJf "$D/source.tar.xz" -C "$W"
          (cd "$W"; python3 generate.py)
          python tools/lean_compile_closure.py --workdir /tmp/a49-box18to24 --jobs 2 --source-root "$W" "$W/Box18to24Source.lean" im-results/agent49-raw10-box18-24/Raw10Box18to24Bridge.lean | tee /tmp/a49-box18to24.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a49-box18to24.log; then exit 1; fi
      - name: Check exact raw10 rectangle 6 sparse-tree coverage
        if: inputs.target == 'weighted-tnf-raw10-box6'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          D=im-results/agent49-raw10-box6
          root="$PWD"
          W="$D/generated"
          mkdir -p "$W"
          tar -xzf "$D/source.tar.gz" -C "$W"
          tar -xJf "$D/proof-source.tar.xz" -C "$W"
          python "$D/fix_emitter.py" "$W/emit_box6.py"
          (cd "$W"; python3 search.py; python3 ngram.py; python3 emit_box6.py . "$root/im-results/agent13-block-far/generate.py")
          python tools/lean_compile_closure.py --workdir /tmp/a49-box6-proof --jobs 2 "$W/Box6SourceConsumer.lean" | tee /tmp/a49-box6-proof.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a49-box6-proof.log; then exit 1; fi
      - name: Rebuild domain BlockFAR and consume exact raw10 source rectangle
        if: inputs.target == 'weighted-tnf-raw10-domain-box7'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          D=im-results/agent49-domain-blockfar
          tar -xJf "$D/domain-source.tar.xz" -C "$D"
          python "$D/build_box7.py"
          python tools/lean_compile_closure.py --workdir /tmp/a49-domain-box7 --jobs 4 "$D/Box7SourceConsumer.lean" | tee /tmp/a49-domain-box7.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a49-domain-box7.log; then exit 1; fi
      - name: Reconstruct and check raw118 partial audit
        if: inputs.target == 'weighted-tnf-raw118-partial'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 68 72 82
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          python im-results/agent16-raw118/generate_partial.py /tmp/raw118-data
          python tools/lean_compile_closure.py --workdir /tmp/a16-raw118-partial --jobs 4 im-results/agent16-raw118/Raw118Partial.lean im-results/agent16-raw118/Raw118CanonicalMembership.lean | tee /tmp/a16-raw118-partial.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a16-raw118-partial.log; then exit 1; fi
      - name: Check two-sided finite stack invariants
        if: inputs.target == 'weighted-tnf-raw118-bidfa'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent16-raw118/bidfa_emit.py > im-results/agent16-raw118/Raw118BiDFA.lean
          python im-results/agent16-raw118/tree_emit.py > im-results/agent16-raw118/Raw118Tree.lean
          python tools/lean_compile_closure.py --workdir /tmp/a16-raw118-bidfa --jobs 4 im-results/agent16-raw118/Raw118BiDFA.lean im-results/agent16-raw118/Raw118Tree.lean | tee /tmp/a16-raw118-bidfa.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a16-raw118-bidfa.log; then exit 1; fi
      - name: Search and source-check Raw118 hard leaves with the proven tree-DFA bank
        if: inputs.target == 'weighted-tnf-raw118-treebank'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent16-raw118/generate_partial.py /tmp/raw118-data
          python im-results/agent16-raw118/search_tree_bank.py /tmp/raw118-data
          python tools/lean_compile_closure.py --workdir /tmp/a16-raw118-treebank --jobs 4 im-results/agent16-raw118/Raw118TreeBank.lean | tee /tmp/a16-raw118-treebank.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a16-raw118-treebank.log; then exit 1; fi
      - name: Preserve generated Raw118 tree-bank search result
        if: inputs.target == 'weighted-tnf-raw118-treebank'
