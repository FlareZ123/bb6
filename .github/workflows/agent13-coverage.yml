      - uses: actions/download-artifact@v4
        if: inputs.target == 'weighted-tnf-raw60-repair' && inputs.raw60_1re_artifact_run_id != ''
        with:
          name: raw60-complete-1RE
          path: /tmp/raw60-downloads/raw60-complete-1RE
