    needs: raw124_1la_shards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raw124-1la-common
          path: /tmp/a2-raw124-1la
      - name: Use pinned Lean toolchain from common artifact
        run: |
          echo "ELAN_HOME=/tmp/a2-raw124-1la/.elan" >> "$GITHUB_ENV"
          echo "/tmp/a2-raw124-1la/.elan/bin" >> "$GITHUB_PATH"
          find /tmp/a2-raw124-1la/.elan -type f -path '*/bin/*' -exec chmod u+x {} +
          export ELAN_HOME=/tmp/a2-raw124-1la/.elan
          export PATH=/tmp/a2-raw124-1la/.elan/bin:$PATH
          /tmp/a2-raw124-1la/.elan/bin/lean --version
      - uses: actions/download-artifact@v4
        with:
          pattern: raw124-1la-kids-*
          path: /tmp/a2-raw124-1la
          merge-multiple: true
      - name: Assemble and axiom-check the exact 1LA branch
        run: |
          set -euo pipefail
          cd /tmp/a2-raw124-1la
          export LEAN_PATH="$PWD"
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum -c RAW124_SOURCE.sha256
          for k in $(seq -w 0 23); do test -s "Raw124B1LAKidK$k.olean"; done
          lean -o Raw124B1LAData.olean Raw124B1LAData.lean 2>&1 | tee /tmp/a2-raw124-assemble.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a2-raw124-assemble.log; then exit 1; fi
          python - <<'PY'
          import pathlib, re
          log = pathlib.Path('/tmp/a2-raw124-assemble.log').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          seen = set()
          for name, axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", log):
              actual = {a.strip() for a in axioms.split(',') if a.strip()}
              assert actual <= allowed, (name, actual - allowed)
              seen.add(name.rsplit('.', 1)[-1])
          for name in re.findall(r"'([^']+)' does not depend on any axioms", log):
              seen.add(name.rsplit('.', 1)[-1])
          assert {'checkRoot', 'bound_all'} <= seen, seen
          print('Raw124 1LA exact branch source and allowed-axiom gate passed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw124-1la-source-accepted
          path: |
            /tmp/a2-raw124-1la/*.olean
            /tmp/a2-raw124-assemble.log
            /tmp/a2-raw124-1la/SOURCE_COMMIT
            /tmp/a2-raw124-1la/RAW124_SOURCE.sha256
          if-no-files-found: error

  raw124_0lb_longcycle:
    if: inputs.target == 'weighted-tnf-raw124-0lb-longcycle100k'
    runs-on: ubuntu-latest
