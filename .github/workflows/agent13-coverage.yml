              "BB6.Agent7Raw49Sweep.never",
              "BB6.Agent7Raw49Cut.parent_cut",
              "BB6.Agent7.Raw49C0.all_quotient",
              "BB6.Agent7.Raw49C2.all_quotient",
              "BB6.Agent7.Raw49C5.all_quotient",
              "BB6.Agent7Raw49Progress.refined",
              "BB6.Agent7Raw49Progress.residual_count",
              "BB6.Agent7Raw49SixSweeps.Alternating.never",
              "BB6.Agent7Raw49SixSweeps.EDouble.never",
              "BB6.Agent7Raw49SixSweeps.Ones.never",
              "BB6.Agent7.Raw49C3.all_quotient",
              "BB6.Agent7.Raw49C4.all_quotient",
              "BB6.Agent7.Raw49C8.all_quotient",
              "BB6.Agent7Raw49Progress115.refined",
              "BB6.Agent7Raw49Progress115.residual_count",
              "BB6.Agent7Raw49Doubling.never",
              "BB6.Agent7Raw49C1Guard.never",
              "BB6.Agent7.Raw49C1.all_quotient",
              "BB6.Agent7.Raw49C7.all_quotient",
              "BB6.Agent7Raw49Progress113.refined",
              "BB6.Agent7Raw49Progress113.residual_count",
              "BB6.Agent7Raw49C6Counters.M600.never",
              "BB6.Agent7Raw49C6Counters.M608.never",
              "BB6.Agent7Raw49C6Counters.M613.never",
              "BB6.Agent7.Raw49C6.all_quotient",
              "BB6.Agent7Raw49Progress112.refined",
              "BB6.Agent7Raw49Progress112.residual_count",
              "BB6.Agent7.Raw49C9.all_quotient",
              "BB6.Agent7.Raw49C10.all_quotient",
              "BB6.Agent7.Raw49C11.all_quotient",
              "BB6.Agent7.Raw49C12.all_quotient",
              "BB6.Agent7.Raw49C13.all_quotient",
              "BB6.Agent7.Raw49C14.all_quotient",
              "BB6.Agent7.Raw49C16.all_quotient",
              "BB6.Agent7.Raw49C17.all_quotient",
              "BB6.Agent7.Raw49C18.all_quotient",
              "BB6.Agent7.Raw49C19.all_quotient",
              "BB6.Agent7.Raw49C20.all_quotient",
              "BB6.Agent7.Raw49C21.all_quotient",
              "BB6.Agent7.Raw49C22.all_quotient",
              "BB6.Agent7.Raw49C24.all_quotient",
              "BB6.Agent7.Raw49C25.all_quotient",
              "BB6.Agent7Raw49Progress106.refined",
              "BB6.Agent7Raw49Progress106.residual_count",
              "BB6.Agent7Raw49Progress97.refined",
              "BB6.Agent7Raw49Progress97.residual_count",
          ]
          for name in names:
              m = re.search(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]", log)
              if not m:
                  raise SystemExit("missing axiom audit: " + name)
              used = {x.strip() for x in m.group(1).split(",") if x.strip()}
              if not used <= allowed:
                  raise SystemExit(f"nonstandard axioms: {name}: {used-allowed}")
              print(f"{name}: {sorted(used)}")
          PY
          elif [ "$TARGET" = weighted-tnf-raw55-progress ]; then
            python im-results/agent4-raw109/audit_axioms.py /tmp/a47-rootsibling.log \
              BB6.Agent25Raw55Sweep.first \
