  raw10canonical76:
    if: inputs.target == 'weighted-tnf-canonical76-raw10-membership'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee /tmp/a50-lean-version.txt
      - name: Download the source-accepted canonical77 base
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45554648116
          name: canonical77-certified
          path: /tmp/a50-canonical
      - name: Compile and audit exact B0=1LC membership in canonical76
        run: |
          set -euo pipefail
          cp im-results/agent50-weighted-tnf-pilot/Canonical76Raw10Membership.lean /tmp/a50-canonical/
          cd /tmp/a50-canonical
          export LEAN_PATH="$PWD"
          test -s CanonicalTwoParentGraft.olean
          sha256sum CanonicalTwoParentGraft.olean > /tmp/a50-canonical-core.sha256
          lean -o Canonical76Raw10Membership.olean Canonical76Raw10Membership.lean 2>&1 | tee /tmp/a50-raw10-membership.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a50-raw10-membership.log; then
            echo "Forbidden proof placeholder or native_decide found in canonical76 raw10 membership" >&2
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          log = pathlib.Path("/tmp/a50-raw10-membership.log").read_text()
          required = (
              "BB6.Agent50Canonical76Raw10.raw10Parent_in_roster76",
              "BB6.Agent50Canonical76Raw10.raw10Parent_exact_member",
              "BB6.Agent50Canonical76Raw10.parentEntries_count",
              "BB6.Agent50Canonical76Raw10.otherRoster_count",
          )
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          profiles = {
              name: {x.strip() for x in axioms.split(",") if x.strip()}
              for name, axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", log)
          }
          for name in required:
              if name not in profiles:
                  raise SystemExit("missing axiom profile: " + name)
              bad = profiles[name] - allowed
              if bad:
                  raise SystemExit(f"{name}: unexpected axioms {sorted(bad)}")
              print(f"{name}: {sorted(profiles[name])}")
          def digest(path):
              h = hashlib.sha256()
              with pathlib.Path(path).open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          manifest = {
              "claim": "B0=1LC is exactly one of the 76 canonical quotient representatives after raw107 and raw114 grafts; the other list has 75 entries. This is membership only, not a safety cover.",
              "source_revision": os.environ.get("GITHUB_SHA"),
              "canonical77_artifact_run_id": 45554648116,
              "canonical77_artifact_name": "canonical77-certified",
              "lean_version": pathlib.Path("/tmp/a50-lean-version.txt").read_text().strip(),
              "canonical_two_parent_graft_olean_sha256": pathlib.Path("/tmp/a50-canonical-core.sha256").read_text().split()[0],
              "membership_source_sha256": digest("Canonical76Raw10Membership.lean"),
              "membership_olean_sha256": digest("Canonical76Raw10Membership.olean"),
              "residual_count_before_isolation": 76,
              "isolated_parent_count": 1,
              "other_residual_count": 75,
              "theorem_axioms": {name: sorted(profiles[name]) for name in required},
          }
          pathlib.Path("Canonical76Raw10Membership.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical76-raw10-membership
          path: |
            /tmp/a50-canonical/Canonical76Raw10Membership.lean
            /tmp/a50-canonical/Canonical76Raw10Membership.olean
            /tmp/a50-canonical/Canonical76Raw10Membership.json
            /tmp/a50-lean-version.txt
            /tmp/a50-canonical-core.sha256
          if-no-files-found: error

