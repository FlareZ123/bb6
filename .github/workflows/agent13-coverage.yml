          - { shard: 1, kids: 'K04 K05 K06 K07' }
          - { shard: 2, kids: 'K08 K09 K10 K11' }
          - { shard: 3, kids: 'K12 K13 K14 K15' }
          - { shard: 4, kids: 'K16 K17 K18 K19' }
          - { shard: 5, kids: 'K20 K21 K22 K23' }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raw124-1la-common
          path: /tmp/a2-raw124-1la
      - name: Use pinned Lean toolchain from common artifact
        run: |
          echo "ELAN_HOME=/tmp/a2-raw124-1la/.elan" >> "$GITHUB_ENV"
          echo "/tmp/a2-raw124-1la/.elan/bin" >> "$GITHUB_PATH"
          find /tmp/a2-raw124-1la/.elan -type f -path '*/bin/*' -exec chmod u+x {} +
          export ELAN_HOME=/tmp/a2-raw124-1la/.elan
          export PATH=/tmp/a2-raw124-1la/.elan/bin:$PATH
          /tmp/a2-raw124-1la/.elan/bin/lean --version
      - name: Compile disjoint raw124 1LA child modules
        env:
          KIDS: ${{ matrix.kids }}
        run: |
          set -euo pipefail
          cd /tmp/a2-raw124-1la
          export LEAN_PATH="$PWD"
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum -c RAW124_SOURCE.sha256
          mkdir -p /tmp/a2-raw124-kids
          for k in $KIDS; do printf 'Raw124B1LAKid%s\n' "$k"; done |
            xargs -P 1 -I '{}' bash -c 'set -e; lean -o "$1.olean" "$1.lean"; cp "$1.olean" /tmp/a2-raw124-kids/' _ '{}' |
            tee /tmp/a2-raw124-shard.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a2-raw124-shard.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
