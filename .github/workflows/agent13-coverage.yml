  raw124_0lf_growth_probe:
    if: inputs.target == 'weighted-tnf-raw124-0lf-growth'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Reconstruct original source and compile raw124 block-growth probes
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python tools/lean_compile_closure.py --workdir /tmp/a2-raw124-0lf-growth --jobs 4 im-results/agent2-tnf-raw124/Raw124ZeroLFProbe.lean | tee /tmp/a2-raw124-0lf-growth.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a2-raw124-0lf-growth.log; then
            echo "Forbidden proof placeholder or native_decide in raw124 block-growth closure" >&2
            exit 1
          fi
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path("/tmp/a2-raw124-0lf-growth.log").read_text()
          profiles = {
              name.rsplit(".", 1)[-1]: {x.strip() for x in axioms.split(",") if x.strip()}
              for name, axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", log)
          }
          for name in re.findall(r"'([^']+)' does not depend on any axioms", log):
              profiles[name.rsplit(".", 1)[-1]] = set()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          required = ("never1539", "never1547", "control1539", "control1547",
                      "noTransferHard0", "noTransferHard1", "noTransferHard2",
                      "noTransferHard3", "noTransferHard4")
          for name in required:
              if name not in profiles:
                  raise SystemExit("missing axiom profile: " + name)
              bad = profiles[name] - allowed
              if bad:
                  raise SystemExit(name + ": unexpected axioms " + repr(sorted(bad)))
          print({name: sorted(profiles[name]) for name in ("never1539", "never1547")})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw124-0lf-growth-source-check
          path: /tmp/a2-raw124-0lf-growth.log
          if-no-files-found: warn

  raw124_0lf_simulation:
    if: inputs.target == 'weighted-tnf-raw124-0lf-simulation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
