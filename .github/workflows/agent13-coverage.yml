name: Agent 13 BB6 full-domain coverage (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Unpack, integrity check and compile complete source chain
        run: |
          set -e
          cd im-results/agent13-coverage
          python unpack.py
          export LEAN_PATH=.
          lean -o BB6Coverage.olean BB6Coverage.lean
          lean -o SparseCoverage.olean SparseCoverage.lean
          lean LassoCoverage.lean
