          fi

      - name: Check raw residual 124 rf subcylinder
        if: inputs.target == 'weighted-tnf-raw124-rf'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent2-tnf-raw124/generate_rf.py
          python tools/lean_compile_closure.py --workdir /tmp/a2-raw124-rf --jobs 4 im-results/agent2-tnf-raw124/Raw124RFData.lean | tee /tmp/a2-raw124-rf.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a2-raw124-rf.log; then
            echo "Forbidden proof placeholder or native_decide found in raw124 closure" >&2
            exit 1
          fi

      - name: Check raw residual 124 lc subcylinder
        if: inputs.target == 'weighted-tnf-raw124-lc'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent2-tnf-raw124/generate_lc.py
          python tools/lean_compile_closure.py --workdir /tmp/a2-raw124-lc --jobs 4 im-results/agent2-tnf-raw124/Raw124LCData.lean | tee /tmp/a2-raw124-lc.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a2-raw124-lc.log; then
            echo "Forbidden proof placeholder or native_decide found in raw124 closure" >&2
            exit 1
          fi

      - name: Check raw residual 124 1rf subcylinder
        if: inputs.target == 'weighted-tnf-raw124-1rf'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent2-tnf-raw124/generate_1rf.py
          python tools/lean_compile_closure.py --workdir /tmp/a2-raw124-1rf --jobs 4 im-results/agent2-tnf-raw124/Raw1241RFData.lean | tee /tmp/a2-raw124-1rf.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a2-raw124-1rf.log; then
            echo "Forbidden proof placeholder or native_decide found in raw124 closure" >&2
            exit 1
          fi

      - name: Check raw residual 124 0RB subcylinder
        if: inputs.target == 'weighted-tnf-raw124-0rb'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
