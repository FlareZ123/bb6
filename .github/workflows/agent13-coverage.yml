  raw60_1re:
    if: inputs.target == 'weighted-tnf-raw60-1re'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Generate and audit exact 1RE branch
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          D=im-results/agent1-raw60
          W=/tmp/raw60-1re-core
          python "$D/generate_1re.py"
          python tools/lean_compile_closure.py --workdir "$W" --jobs 4 --manifest "$W/core.json" "$D/Raw60A1REData.lean" | tee /tmp/raw60-1re.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw60-1re.log; then exit 1; fi
          grep -F 'BB6.Agent1Raw60A1RE.all_closed' /tmp/raw60-1re.log
          cd "$W"
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          sha256sum *.lean *.olean core.json SOURCE_COMMIT > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: raw60-1re-certified
          path: /tmp/raw60-1re-core/
