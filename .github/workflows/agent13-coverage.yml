    steps:
      - uses: actions/download-artifact@v4
        with:
          name: raw60-1lf-core
          path: /tmp/raw60-1lf-core
      - uses: actions/download-artifact@v4
        with:
          pattern: raw60-1lf-kids-*
          path: /tmp/raw60-1lf-core
          merge-multiple: true
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Assemble exact complete 1LF child bound
        run: |
          set -euo pipefail
          cd /tmp/raw60-1lf-core
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum -c SHA256SUMS >/dev/null
          for i in $(seq 0 5); do sha256sum -c "core-$i.sha256"; done
          for i in $(seq -w 0 23); do test -s "Raw60A1LFKid$i.olean"; done
          export LEAN_PATH="$PWD"
          lean -o Raw60A1LFData.olean Raw60A1LFData.lean | tee /tmp/raw60-1lf-assembly.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw60-1lf-assembly.log; then exit 1; fi
          grep -F 'BB6.Agent1Raw60A1LF.all_closed' /tmp/raw60-1lf-assembly.log
