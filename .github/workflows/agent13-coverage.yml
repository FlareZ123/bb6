          test -s im-results/agent47-raw114-cut/Raw114CompleteData.lean
          test "$(find im-results/agent47-raw114-cut -maxdepth 1 -name 'Raw114Complete*Kid*.lean' | wc -l)" -eq 384
          python im-results/agent13-block-far/generate.py im-results/agent13-block-far
          python im-results/agent13-cross-route-pilot/analyze_b0_1lc_sidewitness_cover.py
          mkdir -p .tmp/a13-heldleaf109/imports
          python3 -c "import base64,io,pathlib,tarfile; p=pathlib.Path('im-results/agent42-champion-terminal/TerminalProofs.tar.xz.b64'); d=base64.b64decode(p.read_text()); tarfile.open(fileobj=io.BytesIO(d),mode='r:xz').extractall('.tmp/a13-heldleaf109/imports',filter='data')"
          python3 -c "import base64,lzma,pathlib; p=pathlib.Path('im-results/agent42-champion-terminal/TerminalLeftExact.lean.xz.b64'); pathlib.Path('.tmp/a13-heldleaf109/imports/TerminalLeft.lean').write_bytes(lzma.decompress(base64.b64decode(p.read_text())))"
          echo "12329036c66c3846f9261167b8f9aebd1778d9b6ea6044309956c2fa0b3e49b7  .tmp/a13-heldleaf109/imports/TerminalFinish.lean" | sha256sum -c -
          echo "1bce2075fc4e0cd7d740fb71b3796088b190ddb6766e04640d992dadd1b650ff  .tmp/a13-heldleaf109/imports/TerminalLeft.lean" | sha256sum -c -
      - name: Generate the exact seven raw10 rectangles
