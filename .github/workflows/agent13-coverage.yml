            --precompiled-manifest "$U/manifest.json" --precompiled-dir "$U" \
            --manifest "$W/manifest.json" --label raw60-parent \
            --artifact-name raw60-parent-proof --theorem BB6.Agent1Raw60Root.all60 \
            --parent-table '1RB---_1RC---_0RD---_1LD1RE_---1RA_------' \
            --weighted-bound 1175 "$D/Raw60RootFull.lean" | tee /tmp/raw60-parent.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/raw60-parent.log BB6.Agent1Raw60Root.all60
          cp /tmp/raw60-parent.log "$W/audit.log"
      - uses: actions/upload-artifact@v4
        with:
