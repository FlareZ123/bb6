      - name: Check canonical raw85 F1=1RA four-hole sibling
        if: inputs.target == 'weighted-tnf-raw85'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent13-roster-convergence/generate_raw85.py
          export LEAN_PATH=im-results/agent13-roster-convergence/raw85:im-results/agent8-coverage-contract:im-results/agent4-coverage-smoke:im-results/agent42-coverage-normal:im-results/agent13-coverage:im-results/agent13-weighted-first-one:im-results/agent6-fresh-glider:im-results/agent7-far:im-results/agent31-three-hole-tnf:im-results/agent50-weighted-tnf-pilot
          python tools/lean_compile_closure.py --workdir /tmp/a13-raw85 --jobs 4 im-results/agent13-roster-convergence/raw85/FourHoleSiblingData.lean | tee /tmp/a13-raw85.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a13-raw85.log; then
            echo "Forbidden proof placeholder or native_decide found in raw85 sibling closure" >&2
