              target=im-results/agent13-residual-frontier/AffineConeLowStopAll.lean
              ;;
            sourceExactMemo)
              target=im-results/agent13-residual-frontier/ExactMemo.lean
              ;;
            sourceBoundedShadow)
              target=im-results/agent13-residual-frontier/BoundedUnifiedShadow.lean
              ;;
            sourceUnifiedShadow)
              target=im-results/agent13-residual-frontier/UnifiedShadow.lean
              ;;
            sourceDyadicDensity)
              target=im-results/agent21-c-shadow-density/DyadicSource.lean
              ;;
            sourceModularHighStop)
              target=im-results/agent42-modular-cone/ModularConeHighStop.lean
              ;;
            sourceModularHighStopCriterion)
              target=im-results/agent42-modular-cone/ModularConeHighStopCriterion.lean
              ;;
            sourceModularStrictness)
              target=im-results/agent11-modular-cone-strictness/Agent11ModularConeStrictness.lean
              ;;
            sourceModularLowStop)
              target=im-results/agent42-modular-cone/ModularConeLowStop.lean
              ;;
            sourceModularStopsCriterion)
              target=im-results/agent42-modular-cone/ModularConeStopsCriterion.lean
              ;;
            sourceModularFullCriterion)
