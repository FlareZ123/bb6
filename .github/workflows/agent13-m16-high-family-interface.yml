              target=im-results/agent12-c-high-shadow/BranchingBlocksSource.lean
              ;;
            sourceDirectBlocks)
              target=im-results/agent42-modular-cone/DirectBlocksSource.lean
              ;;
            sourceHighCylinder)
              target=im-results/agent13-residual-frontier/HighShadowCylinder.lean
              ;;
            sourceHighShadow)
              target=im-results/agent13-residual-frontier/HighNegativeShadow.lean
              ;;
            sourceNegativeShadow)
              target=im-results/agent13-residual-frontier/NegativeShadow.lean
              ;;
            sourceLow1583)
              target=im-results/agent13-residual-frontier/LowM67All1583Criterion.lean
              ;;
            sourceLowQuarterTwoForced)
              target=im-results/agent13-residual-frontier/EvenOddLowStopQuarterTwoForced.lean
              ;;
            sourceCriterion559)
              target=im-results/agent13-residual-frontier/LowM67All559Criterion.lean
              ;;
            sourceAgent8Z2)
              target=im-results/agent8-machine-c-low-z2/LowM67Z2Source.lean
              ;;
            sourceAgent8Z7)
              target=im-results/agent8-machine-c-low-z2/LowM67Z7Source.lean
              ;;
            sourceAgent8Criterion1327)
              target=im-results/agent8-machine-c-low-z2/LowM67All1327Criterion.lean
              ;;
            sourceAgent8Z24)
              target=im-results/agent8-machine-c-low-z2/LowM67Z24Source.lean
              ;;
            source523)
              target=im-results/agent13-residual-frontier/LowM67All523Source.lean
              ;;
            sourceCriterion523)
              target=im-results/agent13-residual-frontier/LowM67All523Criterion.lean
              ;;
            source17)
              target=im-results/agent13-residual-frontier/LowM67SeventeenCriterion.lean
              ;;
            source65)
              target=im-results/agent13-residual-frontier/LowM67All65Source.lean
              ;;
            sourceJointM32)
              target=im-results/agent13-residual-frontier/LowM67M32JointCriterion.lean
              ;;
            sourceHighFamily)
              target=im-results/agent13-residual-frontier/M16StopFamilyExclusions.lean
              ;;
            sourceHighIntegration)
              target=im-results/agent13-residual-frontier/ValSixM16Integration.lean
              ;;
            *)
              echo "Unsupported M16 target: $M16_TARGET" >&2
              exit 2
              ;;
          esac
          python3 tools/lean_compile_closure.py \
            "$target" \
            --workdir /tmp/a43m16-root-filter \
            --source-root /tmp/a43mod16 \
            --jobs 4 \
            --lean "$(command -v lean)" \
            --override CLine=im-results/agent11-c-line/CLine.lean \
            --override BounceParity=im-results/agent46-c-jump/BounceParity.lean
