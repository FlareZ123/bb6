              ;;
            sourceTerminalCutoff)
              target=im-results/agent12-c-high-shadow/Agent12TerminalCutoff.lean
              ;;
            sourceKernelCone)
              target=im-results/agent12-c-high-shadow/KernelCone.lean
              ;;
            sourceCompressedMemo)
              target=im-results/agent12-c-high-shadow/CompressedMemo.lean
              ;;
