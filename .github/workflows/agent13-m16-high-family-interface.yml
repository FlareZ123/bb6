name: Agent 13 M16 source-family proof audit
on:
  workflow_dispatch:
    inputs:
      target:
        description: Select the M16 source theorem module
        required: true
        type: choice
        default: probe
        options:
          - probe
          - valuation
          - sourceDepth
          - sourceClosure
          - sourceRect
          - sourceOne307
          - sourceLow13
          - sourceU17
          - sourceU97U41
          - sourceU14
          - sourceU16
          - sourceCriterion
          - sourceDepthSix
          - sourceD4
          - sourceD4Second
          - sourceD4Third
          - sourceD23Five
          - sourceAllDepth
          - sourceAllDepthFour
          - sourceAllDepthSieve
          - sourceAllDepthSix
          - sourceAllDepthTwoDeep
          - sourceAllDepthShort
          - sourceAllValuationParent
          - sourceLowPowerGap
          - sourceLowDivisor
          - sourceAllDepthSieve67
          - sourceLowZ44
          - sourceLow1519
          - sourceLowZ16
          - sourceLow1551
          - sourceLowEvenUnique
          - sourceLowFullIff
          - sourceLowEvenReachIff
          - sourceLowEvenEdgeIff
          - sourceLowSecondDyadic
          - sourceLowSecondGap
          - sourceLowSecondFan
          - sourceLowSecondFanSource
          - sourceLowSecondFanReach
          - sourceLow1583
          - sourceLowSpecialized
          - sourceLowAffine
          - sourceLowAffineAll
          - sourceNegativeShadow
          - sourceHighShadow
          - sourceHighCylinder
          - sourceUnifiedShadow
          - sourceDyadicDensity
          - sourceModularHighStop
          - sourceModularHighStopCriterion
          - sourceModularStrictness
          - sourceModularLowStop
          - sourceModularStopsCriterion
          - sourceModularFullCriterion
          - sourceHeightConeCriterion
          - sourceDirectBlocks
          - sourceBranchingBlocks
          - sourcePurePower
          - sourceCompressedMemo
          - sourceKernelCone
          - sourceTerminalCutoff
          - sourceClosedBounce
          - sourceBoundedShadow
          - sourceExactMemo
          - sourceLowQuarterTwoForced
          - sourceCriterion559
          - sourceAgent8Z2
          - sourceAgent8Z7
          - sourceAgent8Criterion1327
          - sourceAgent8Z24
          - source523
          - sourceCriterion523
          - source17
          - source65
          - sourceJointM32
          - sourceHighFamily
          - sourceHighIntegration

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify and unpack source bundle
        run: |
          mkdir -p /tmp/a43mod16
          cd /tmp/a43mod16
          base64 -d "$GITHUB_WORKSPACE/im-results/agent43-c-quotient-kernel/c-cert16.tar.xz.b64" > certificate.tar.xz
          echo "1cc951976c75457e35dd6ab62888cfced14e64fbf3c067d4de14f7af2fba540e  certificate.tar.xz" | sha256sum -c -
          tar -xJf certificate.tar.xz
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-line/CLine.lean" CLine.lean
          cp "$GITHUB_WORKSPACE/im-results/agent38-c-section-mod4/ThirdStageOddDepth.lean.xz.b64" .
          base64 -d ThirdStageOddDepth.lean.xz.b64 | xz -d > ThirdStageOddDepth.lean
          echo "48fb1fcbf2b3a409c7bafb07a9f1df78a087b02d8cadeac51b2b81b02f301ed0  ThirdStageOddDepth.lean" | sha256sum -c -
      - name: Kernel verify the selected M16 dependency closure
        shell: bash
        env:
          M16_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$M16_TARGET" in
            probe)
              target=im-results/agent13-residual-frontier/M16SecondFanProbe.lean
              ;;
            valuation)
              target=im-results/agent13-residual-frontier/M16SecondFanValuation.lean
              ;;
            sourceDepth)
              target=im-results/agent13-residual-frontier/EvenOddSmallValuation.lean
              ;;
            sourceClosure)
              target=im-results/agent13-residual-frontier/EvenOddTwoParentRoot.lean
              ;;
            sourceRect)
              target=im-results/agent13-residual-frontier/EvenOddSimpleRectangle.lean
              ;;
            sourceOne307)
              target=im-results/agent13-residual-frontier/One307Source.lean
              ;;
            sourceLow13)
              target=im-results/agent13-residual-frontier/LowM67Z13Source.lean
              ;;
            sourceU17)
              target=im-results/agent13-residual-frontier/U17Source.lean
              ;;
            sourceU97U41)
              target=im-results/agent13-residual-frontier/U97U41Source.lean
              ;;
            sourceU14)
              target=im-results/agent13-residual-frontier/U14AllSource.lean
              ;;
            sourceU16)
              target=im-results/agent13-residual-frontier/U16AllSource.lean
              ;;
            sourceCriterion)
              target=im-results/agent13-residual-frontier/LowM67HaltingCriterion.lean
              ;;
            sourceDepthSix)
              target=im-results/agent13-residual-frontier/EvenOddValuationSix.lean
              ;;
            sourceD4)
              target=im-results/agent13-residual-frontier/LowM67D4Source.lean
              ;;
            sourceD4Second)
              target=im-results/agent13-residual-frontier/LowM67D4SecondSource.lean
              ;;
            sourceD4Third)
              target=im-results/agent13-residual-frontier/LowM67D4ThirdSource.lean
              ;;
            sourceD23Five)
              target=im-results/agent13-residual-frontier/LowM67FiveD23Source.lean
              ;;
            sourceAllDepth)
              target=im-results/agent13-residual-frontier/EvenOddAllDepthForbidden.lean
              ;;
            sourceAllDepthFour)
              target=im-results/agent13-residual-frontier/EvenOddAllDepthPhaseFour.lean
              ;;
            sourceAllDepthSieve)
              target=im-results/agent13-residual-frontier/EvenOddAllDepthSieve.lean
              ;;
            sourceAllDepthSix)
              target=im-results/agent13-residual-frontier/EvenOddAllDepthPhaseSix.lean
              ;;
            sourceAllDepthTwoDeep)
              target=im-results/agent13-residual-frontier/EvenOddAllDepthPhaseTwoDeep.lean
              ;;
            sourceAllDepthShort)
              target=im-results/agent13-residual-frontier/EvenOddAllDepthShortExtensions.lean
              ;;
            sourceAllValuationParent)
              target=im-results/agent13-residual-frontier/EvenOddAllValuationParent.lean
              ;;
            sourceLowPowerGap)
              target=im-results/agent13-residual-frontier/EvenOddLowStopPowerGap.lean
              ;;
            sourceLowDivisor)
              target=im-results/agent13-residual-frontier/EvenOddLowStopDivisor.lean
              ;;
            sourceAllDepthSieve67)
              target=im-results/agent13-residual-frontier/EvenOddAllDepthSieve67.lean
              ;;
            sourceLowZ44)
              target=im-results/agent13-residual-frontier/LowM67Z44Source.lean
              ;;
            sourceLow1519)
              target=im-results/agent13-residual-frontier/LowM67All1519Criterion.lean
              ;;
            sourceLowZ16)
              target=im-results/agent13-residual-frontier/LowM67Z16Source.lean
              ;;
            sourceLow1551)
              target=im-results/agent13-residual-frontier/LowM67All1551Criterion.lean
              ;;
            sourceLowEvenUnique)
              target=im-results/agent13-residual-frontier/EvenOddLowStopEvenUnique.lean
              ;;
            sourceLowFullIff)
              target=im-results/agent13-residual-frontier/EvenOddLowStopFullInverseIff.lean
              ;;
            sourceLowEvenReachIff)
              target=im-results/agent13-residual-frontier/EvenOddLowStopEvenReachIff.lean
              ;;
            sourceLowEvenEdgeIff)
              target=im-results/agent13-residual-frontier/EvenOddLowStopEvenEdgeIff.lean
              ;;
            sourceLowSecondDyadic)
              target=im-results/agent13-residual-frontier/EvenOddLowStopSecondDyadic.lean
              ;;
            sourceLowSecondGap)
              target=im-results/agent13-residual-frontier/EvenOddLowStopSecondPowerGap.lean
              ;;
            sourceLowSecondFan)
              target=im-results/agent13-residual-frontier/EvenOddLowStopSecondFan.lean
              ;;
            sourceLowSecondFanSource)
              target=im-results/agent13-residual-frontier/EvenOddLowStopSecondFanSource.lean
              ;;
            sourceLowSecondFanReach)
              target=im-results/agent13-residual-frontier/EvenOddLowStopSecondFanReach.lean
              ;;
