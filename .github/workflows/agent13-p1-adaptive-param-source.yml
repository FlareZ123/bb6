          grep -F 'no_infinite_block' /tmp/agent13-block-potential.log
          if grep -E -q 'sorryAx|error:' /tmp/agent13-block-potential.log; then exit 1; fi
      - name: Independently check secondary finite modular certificate for exceptional repeating blocks
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent13-p1-adaptive-param"
          lean im-results/agent13-p1-adaptive-param/BlockSecondary.lean | tee /tmp/agent13-block-secondary.log
          grep -F 'no_infinite_block_secondary' /tmp/agent13-block-secondary.log
          if grep -E -q 'sorryAx|error:' /tmp/agent13-block-secondary.log; then exit 1; fi
      - name: Reproduce exact periodic-word finite modular scan through total cost 2048
        run: |
          set -euo pipefail
          python -c "import sys; sys.path.insert(0, 'im-results/agent13-p1-adaptive-param'); import periodic_word_modular as p; p.self_test(); print('periodic-word exact arithmetic tests passed; no nontrivial unresolved words through cost 2048')"
      - name: Audit Agent9 arbitrary primitive-depth word theorem against unchanged source ShadowReach
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent9-p1-q33:im-results/agent9-p1-periodic:im-results/agent9-p1-shadow"
          for m in UniformPrecisionStep UniformPrecisionPath; do
            lean -o "im-results/agent9-p1-q33/$m.olean" "im-results/agent9-p1-q33/$m.lean"
          done
          for m in PeriodCore PeriodWord PeriodWordBounds PeriodPigeonhole PeriodCycle PeriodCycleMinimal PeriodRotate PeriodMarker PeriodMarkerMinimal PeriodPrimitive PeriodFinite PeriodFiniteWord PeriodPrimitiveFinite; do
            lean -o "im-results/agent9-p1-periodic/$m.olean" "im-results/agent9-p1-periodic/$m.lean" | tee -a /tmp/agent9-periodic-source-audit.log
          done
          lean -o im-results/agent9-p1-periodic/PeriodSecondary.olean im-results/agent9-p1-periodic/PeriodSecondary.lean | tee -a /tmp/agent9-periodic-source-audit.log
          lean -o im-results/agent9-p1-periodic/PeriodFactorization.olean im-results/agent9-p1-periodic/PeriodFactorization.lean | tee -a /tmp/agent9-periodic-source-audit.log
