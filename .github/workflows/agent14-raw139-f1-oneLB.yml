name: Agent14 Raw139 F1=1LB source audit

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit SHA to compile
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agent14-raw139-f1-oneLB-source-audit
  cancel-in-progress: false

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version
          sha256sum "$(lean --print-prefix)/bin/lean"

      - name: Reproduce and audit original-source 1LB certificate
        run: bash im-results/agent14-raw139-f1-oneLB/reproduce.sh

      - name: Upload source-audited Lean artifact and provenance
        uses: actions/upload-artifact@v4
        with:
          name: agent14-raw139-f1-oneLB-source-audit
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
          path: |
            .tmp/a14-f1-oneLB/manifest.json
            .tmp/a14-f1-oneLB/log
            .tmp/a14-f1-oneLB/build/
            im-results/agent14-raw139-f1-oneLB/reproduce.sh
            im-results/agent14-raw139-f1-oneLB/README.md
            im-results/agent14-raw139-f1-oneLB/source-delta.tar.xz.b64
            im-results/agent14-raw139-f1-oneRF/source.tar.xz.b64
