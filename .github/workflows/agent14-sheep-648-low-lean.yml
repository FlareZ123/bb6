name: Agent14 Sheep 648 uniform low-a Lean period certificates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-648-low:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate 56 complete-period Lean modular certificates
        run: |
          python3 -m venv /tmp/agent14-low-venv
          /tmp/agent14-low-venv/bin/pip -q install filelock
          /tmp/agent14-low-venv/bin/python im-results/agent14-sheep-seven-cones/generate_648_low.py
      - name: Kernel-check all 56 all-k congruence exclusions
        run: |
          mkdir -p /tmp/agent14-low-lean
          cp im-results/agent14-sheep-even-inverse/EvenPeriod.lean /tmp/agent14-low-lean/
          cp im-results/agent14-sheep-seven-cones/Sheep648LowResidues.lean /tmp/agent14-low-lean/
          cd /tmp/agent14-low-lean
          export LEAN_PATH=.
          lean -o EvenPeriod.olean EvenPeriod.lean
          lean -o Sheep648LowResidues.olean Sheep648LowResidues.lean
