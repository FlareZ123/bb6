name: Agent14 Sheep seven-cone unbounded-valuation Lean audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean47:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check all 94 uniform quantified arithmetic lemmas
        run: |
          mkdir -p /tmp/agent14-lean47
          cp im-results/agent14-sheep-even-inverse/IndependentExceptionalGap.lean /tmp/agent14-lean47/
          cp im-results/agent14-sheep-even-inverse/IndependentGenericHigh.lean /tmp/agent14-lean47/
          cp im-results/agent14-sheep-seven-cones/SheepSevenSpecial.lean /tmp/agent14-lean47/
          cp im-results/agent14-sheep-seven-cones/SheepSevenGenericHigh.lean /tmp/agent14-lean47/
          cd /tmp/agent14-lean47
          export LEAN_PATH=.
          lean --version
          lean -o IndependentExceptionalGap.olean IndependentExceptionalGap.lean
          lean -o IndependentGenericHigh.olean IndependentGenericHigh.lean
          lean -o SheepSevenSpecial.olean SheepSevenSpecial.lean
          lean -o SheepSevenGenericHigh.olean SheepSevenGenericHigh.lean
