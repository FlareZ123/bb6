name: Agent14 original-source Sheep finite inverse DAG theorem

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-root-dag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.35.0-rc4
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore original Cryptids Sheep machine sources
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Reclaim runner disk
        run: |
          for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell; do
            if test -d "$dir"; then sudo rm -rf "$dir"; fi
          done
      - name: Build original six-state Sheep machine
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB1LA_0LC0RC_1LE1RD_1RE1RC_1LF0LA_HHH1LE
      - name: Check exact EvenReach inverse DAG source theorem
        working-directory: /tmp/cryptids
        run: |
          python3 -m venv /tmp/agent14-dag-venv
          /tmp/agent14-dag-venv/bin/pip -q install filelock
          /tmp/agent14-dag-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent16-sheep-even-return/reconstruct_all.py"
          for name in SheepEven EvenEdge OddPrefix EvenReach; do
            cp "$GITHUB_WORKSPACE/im-results/agent16-sheep-even-return/$name.lean" "$name.lean"
          done
          /tmp/agent14-dag-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" SheepEven.lean EvenEdge.lean OddPrefix.lean EvenReach.lean
          export LEAN_PATH=".:$LEAN_PATH"
          for name in SheepEven EvenEdge OddPrefix EvenReach; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          for name in SheepEvenInverseAlgebra SheepEvenSourceAlgebra SheepEvenReachInverse; do
            cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-even-inverse/$name.lean" "$name.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-seven-cones/SheepSourceFiniteInverseDAG.lean" SheepSourceFiniteInverseDAG.lean
          /tmp/agent14-dag-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" SheepEvenInverseAlgebra.lean SheepEvenSourceAlgebra.lean SheepEvenReachInverse.lean SheepSourceFiniteInverseDAG.lean
          for name in SheepEvenInverseAlgebra SheepEvenSourceAlgebra SheepEvenReachInverse; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          lake env lean SheepSourceFiniteInverseDAG.lean
