            im-results/agent14-raw139-d0-generic/Raw139NormalizedPostTwelve51.lean \
            im-results/agent14-raw139-d0-generic/Raw139NormalizedPostTwelve50.lean \
            im-results/agent14-raw139-d0-generic/Raw139NormalizedPostTwelve49.lean \
            im-results/agent14-raw139-d0-generic/Raw139NormalizedPostTwelve48.lean \
            im-results/agent14-raw139-d0-generic/Raw139NormalizedCertified18Finite.lean \
            im-results/agent14-raw139-d0-generic/Raw139NormalizedCertified18Native.lean \
            --workdir "$work/build" \
            --jobs 4 \
            --manifest "$work/manifest.json" \
            --label agent14-raw139-e0-counts \
            --override CanonicalFrontier=im-results/agent47-rooted-tnf/CanonicalFrontier.lean \
            --override TNFPilot=im-results/agent50-weighted-tnf-pilot/TNFPilot.lean \
            --override FastFAR=im-results/agent7-far/FastFAR.lean \
            --override SideCycle=im-results/agent50-weighted-tnf-pilot/SideCycle.lean \
            --override WeightedTNFQueueOrbit=im-results/agent13-weighted-first-one/WeightedTNFQueueOrbit.lean \
