          python3 tools/lean_compile_closure.py \
            im-results/agent14-raw139-d0-generic/Raw139NormalizedE0TenNativeBounds.lean \
            im-results/agent14-raw139-d0-generic/Raw139NormalizedPostTwelve53.lean \
