name: Raw139 ZeroLF residual 3862 and parent discharge
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source revision
        required: true
        type: string
      kind:
        description: Audit target
        required: true
        type: choice
        default: zerolf
        options:
          - zerolf
          - raw139-local
          - e0-counts
          - post53-source
          - post52-source
          - post50-source
          - post49-source
          - c1-zeroRA
      parent_run_id:
        description: Completed conditional parent audit run (empty for proof-only)
        type: string
        default: ''
      proof_run_id:
        description: Optional earlier certified 3862 run for parent composition
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate exact 3862 proof shards
        if: inputs.kind == 'zerolf'
        run: |
          set -euo pipefail
          base=im-results/agent14-raw139-e0-zeroLF
          python3 im-results/agent13-coverage/unpack.py
          python3 "$base/unpack3862.py" .tmp/zeroLF3862/imports
      - uses: actions/download-artifact@v4
        if: inputs.kind == 'zerolf' && inputs.parent_run_id != ''
        with:
          name: raw139-e0-zeroLF-parent-certified
          run-id: ${{ inputs.parent_run_id }}
          github-token: ${{ github.token }}
          path: .tmp/zeroLF3862/conditional
      - uses: actions/download-artifact@v4
        if: inputs.kind == 'zerolf' && inputs.proof_run_id != ''
        with:
          name: raw139-zeroLF3862-certified
          run-id: ${{ inputs.proof_run_id }}
          github-token: ${{ github.token }}
          path: .tmp/zeroLF3862/exception
      - name: Check proof or compose with the conditional parent
        if: inputs.kind == 'zerolf'
        env:
          PARENT_RUN: ${{ inputs.parent_run_id }}
          PROOF_RUN: ${{ inputs.proof_run_id }}
        run: |
          set -euo pipefail
          base=im-results/agent14-raw139-e0-zeroLF
          work=.tmp/zeroLF3862
          out="$work/final"
          mkdir -p "$out/build"
          args=(--source-root "$work/imports")
          target="$base/Cover3862.lean"
          theorem=BB6.Agent14ZeroLF3862.weighted
          table='[7,10,11,19,14,17,24,16,20,11,3,0]'
          if [[ -n "$PARENT_RUN" ]]; then
            bash "$base/prepare.sh"
            python3 "$base/merge3862.py" "$work"
            args+=(--source-root "$work/conditional/imports" --precompiled-manifest "$work/merged.json" --precompiled-dir "$work/merged")
            target="$base/E0ZeroLFDischarge.lean"
            theorem=BB6.Agent14E0LFParent.weighted
            table='[7,24,11,24,14,24,24,16,20,11,24,24]'
            args+=(--weighted-bound 19007)
          fi
          python3 tools/lean_compile_closure.py "$target" "${args[@]}" --workdir /tmp/agent14-zeroLF3862 --jobs 2 --manifest "$out/manifest.json" --label "$theorem" --theorem "$theorem" --parent-table "$table" --provenance-input "$base/3862-source.b64.1" --provenance-input "$base/3862-source.b64.2" --provenance-input "$base/3862-source.b64.3" --provenance-input "$base/unpack3862.py" | tee "$out/log"
          ! grep -Eq 'sorryAx|ofReduceBool' "$out/log"
          grep -F "'$theorem' depends on axioms: [propext, Classical.choice, Quot.sound]" "$out/log"
          find /tmp/agent14-zeroLF3862 -name '*.olean' -exec cp '{}' "$out/build/" ';'
      - uses: actions/download-artifact@v4
        if: inputs.kind == 'post49-source'
        with:
          name: raw139-oneLA-graft-certified
          run-id: 45936484460
          github-token: ${{ github.token }}
          path: .tmp/agent14-post49/oneLA
      - uses: actions/download-artifact@v4
        if: inputs.kind == 'post49-source'
        with:
          name: raw139-e0-oneLF-parent-certified
          run-id: 46093526398
          github-token: ${{ github.token }}
          path: .tmp/agent14-post49/oneLF
      - uses: actions/download-artifact@v4
        if: inputs.kind == 'post49-source'
        with:
          name: raw139-f1-ZeroLD-certified
          run-id: 45612965271
          github-token: ${{ github.token }}
          path: .tmp/agent14-post49/f1-zeroLD
      - name: Source-graft accepted E0=1LA into 49-row Raw139 frontier
        if: inputs.kind == 'post49-source'
        run: |
          set -euo pipefail
          python3 im-results/agent13-coverage/unpack.py
          python3 im-results/agent6-champion-residual/generate_c1_one_lc.py
          python3 im-results/agent6-champion-residual/generate_c1_zero_la.py
          work=/tmp/agent14-post49
          mkdir -p "$work"
          oneLA=.tmp/agent14-post49/oneLA
          test -f "$oneLA/manifest.json"
          test -d "$oneLA/build"
          test -d "$oneLA/imports"
          oneLF=.tmp/agent14-post49/oneLF
          test -d "$oneLF/imports"
          f1_manifest="$(find .tmp/agent14-post49/f1-zeroLD -name manifest.json -print -quit)"
          test -n "$f1_manifest"
          f1_root="$(dirname "$f1_manifest")"
          test -d "$f1_root/imports"
          python3 tools/lean_compile_closure.py \
            im-results/agent14-raw139-d0-generic/Raw139NormalizedPostTwelve49Source.lean \
            --source-root "$oneLA/imports" \
            --source-root "$oneLA/extern" \
            --source-root "$oneLF/imports" \
            --source-root "$f1_root/imports" \
            --precompiled-manifest "$oneLA/manifest.json" \
            --precompiled-dir "$oneLA/build" \
            --workdir "$work/build" \
            --jobs 2 \
            --manifest "$work/manifest.json" \
            --label agent14-raw139-post12-49-source \
            --theorem BB6.Agent14Raw139NormalizedPostTwelve49Source.raw139_p0_cover_from_49_source \
            --provenance-input im-results/agent6-champion-residual/generate_c1_one_lc.py \
            --provenance-input im-results/agent6-champion-residual/generate_c1_zero_la.py \
            --override CanonicalFrontier=im-results/agent47-rooted-tnf/CanonicalFrontier.lean \
            --override TNFPilot=im-results/agent50-weighted-tnf-pilot/TNFPilot.lean \
            --override FastFAR=im-results/agent7-far/FastFAR.lean \
            --override SideCycle=im-results/agent50-weighted-tnf-pilot/SideCycle.lean \
            --override WeightedTNFQueueOrbit=im-results/agent13-weighted-first-one/WeightedTNFQueueOrbit.lean \
            --override FirstHolePath=im-results/agent8-cryptids-tnf-paths/FirstHolePath.lean \
            --override FourHoleResidualRoster=im-results/agent31-three-hole-tnf/FourHoleResidualRoster.lean \
            --override Raw139Normalized=im-results/agent6-raw139-normalized/Raw139Normalized.lean \
            --override BlockFAR4=im-results/agent13-block-far/BlockFAR4.lean \
            --override BlockMacro4=im-results/agent13-block-far/BlockMacro4.lean \
            --override RangeCheck4=im-results/agent13-block-far/RangeCheck4.lean \
            --override BlockFARBridge4=im-results/agent13-block-far/BlockFARBridge4.lean \
            | tee "$work/log"
          ! grep -Eq 'sorryAx|native_decide|Lean\.ofReduceBool' "$work/log"
          grep -F "'BB6.Agent14Raw139NormalizedPostTwelve49.normalizedAfterTwelvePlusSix_count' depends on axioms: [propext," "$work/log"
          grep -F "'BB6.Agent14Raw139NormalizedPostTwelve49Source.source_oneLA_cover' depends on axioms: [propext," "$work/log"
          grep -F "'BB6.Agent14Raw139NormalizedPostTwelve49Source.raw139_p0_cover_from_49_source' depends on axioms: [propext," "$work/log"
      - uses: actions/upload-artifact@v4
        if: inputs.kind == 'post49-source'
        with:
          name: agent14-raw139-post12-49-source
          path: |
            /tmp/agent14-post49/log
            /tmp/agent14-post49/manifest.json
            /tmp/agent14-post49/build/Raw139NormalizedPostTwelve49Source.olean
            im-results/agent6-champion-residual/C1OneLCParent.lean
            im-results/agent6-champion-residual/C1ZeroLAParent.lean
          if-no-files-found: error
          retention-days: 14

      - uses: actions/download-artifact@v4
        if: inputs.kind == 'post50-source'
        with:
          name: raw139-e0-oneLF-parent-certified
          run-id: 46093526398
          github-token: ${{ github.token }}
          path: .tmp/agent14-post50/oneLF
      - uses: actions/download-artifact@v4
        if: inputs.kind == 'post50-source'
        with:
          name: raw139-f1-ZeroLD-certified
          run-id: 45612965271
          github-token: ${{ github.token }}
          path: .tmp/agent14-post50/f1-zeroLD
      - name: Source-graft accepted C1=0LA and C1=0LC into 50-row Raw139 frontier
        if: inputs.kind == 'post50-source'
        run: |
          set -euo pipefail
          python3 im-results/agent13-coverage/unpack.py
          python3 im-results/agent6-champion-residual/generate_c1_one_lc.py
          python3 im-results/agent6-champion-residual/generate_c1_zero_la.py
          work=/tmp/agent14-post50
          mkdir -p "$work"
          one=.tmp/agent14-post50/oneLF
          test -f "$one/parent/manifest.json"
          test -d "$one/imports"
          test -d "$one/parent"
          f1_manifest="$(find .tmp/agent14-post50/f1-zeroLD -name manifest.json -print -quit)"
          test -n "$f1_manifest"
          f1_root="$(dirname "$f1_manifest")"
          test -d "$f1_root/imports"
          python3 tools/lean_compile_closure.py \
            im-results/agent14-raw139-d0-generic/Raw139NormalizedPostTwelve50Source.lean \
            --source-root "$one/imports" \
            --source-root "$f1_root/imports" \
            --precompiled-manifest "$one/parent/manifest.json" \
            --precompiled-dir "$one/parent" \
            --workdir "$work/build" \
            --jobs 2 \
            --manifest "$work/manifest.json" \
            --label agent14-raw139-post12-50-source \
            --theorem BB6.Agent14Raw139NormalizedPostTwelve50Source.raw139_p0_cover_from_50_source \
            --provenance-input im-results/agent6-champion-residual/generate_c1_one_lc.py \
            --provenance-input im-results/agent6-champion-residual/generate_c1_zero_la.py \
            --override CanonicalFrontier=im-results/agent47-rooted-tnf/CanonicalFrontier.lean \
            --override TNFPilot=im-results/agent50-weighted-tnf-pilot/TNFPilot.lean \
            --override FastFAR=im-results/agent7-far/FastFAR.lean \
            --override SideCycle=im-results/agent50-weighted-tnf-pilot/SideCycle.lean \
            --override WeightedTNFQueueOrbit=im-results/agent13-weighted-first-one/WeightedTNFQueueOrbit.lean \
            --override FirstHolePath=im-results/agent8-cryptids-tnf-paths/FirstHolePath.lean \
            --override FourHoleResidualRoster=im-results/agent31-three-hole-tnf/FourHoleResidualRoster.lean \
            --override Raw139Normalized=im-results/agent6-raw139-normalized/Raw139Normalized.lean \
            --override BlockFAR4=im-results/agent13-block-far/BlockFAR4.lean \
            --override BlockMacro4=im-results/agent13-block-far/BlockMacro4.lean \
            --override RangeCheck4=im-results/agent13-block-far/RangeCheck4.lean \
            --override BlockFARBridge4=im-results/agent13-block-far/BlockFARBridge4.lean \
            | tee "$work/log"
          ! grep -Eq 'sorryAx|native_decide|Lean\\.ofReduceBool' "$work/log"
          grep -F "'BB6.Agent14Raw139NormalizedPostTwelve50.normalizedAfterTwelvePlusFive_count' depends on axioms: [propext," "$work/log"
          grep -F "'BB6.Agent14Raw139NormalizedPostTwelve51Source.source_zeroLA_cover' depends on axioms: [propext," "$work/log"
          grep -F "'BB6.Agent14Raw139NormalizedPostTwelve50Source.source_zeroLC_cover' depends on axioms: [propext," "$work/log"
          grep -F "'BB6.Agent14Raw139NormalizedPostTwelve50Source.raw139_p0_cover_from_50_source' depends on axioms: [propext," "$work/log"
      - uses: actions/upload-artifact@v4
        if: inputs.kind == 'post50-source'
        with:
          name: agent14-raw139-post12-50-source
          path: |
            /tmp/agent14-post50/log
            /tmp/agent14-post50/manifest.json
            /tmp/agent14-post50/build/Raw139NormalizedPostTwelve50Source.olean
            im-results/agent6-champion-residual/C1OneLCParent.lean
            im-results/agent6-champion-residual/C1ZeroLAParent.lean
          if-no-files-found: error
          retention-days: 14

      - uses: actions/download-artifact@v4
        if: inputs.kind == 'post52-source'
        with:
          name: raw139-e0-oneLF-parent-certified
          run-id: 46093526398
          github-token: ${{ github.token }}
          path: .tmp/agent14-post52/oneLF
      - uses: actions/download-artifact@v4
        if: inputs.kind == 'post52-source'
        with:
          name: raw139-f1-ZeroLD-certified
          run-id: 45612965271
          github-token: ${{ github.token }}
          path: .tmp/agent14-post52/f1-zeroLD
      - name: Source-graft accepted OneLF into 52-row Raw139 frontier
        if: inputs.kind == 'post52-source'
        run: |
          set -euo pipefail
          python3 im-results/agent13-coverage/unpack.py
          python3 im-results/agent6-champion-residual/generate_c1_one_lc.py
          work=/tmp/agent14-post52
          mkdir -p "$work"
          one=.tmp/agent14-post52/oneLF
          test -f "$one/parent/manifest.json"
          test -d "$one/imports"
          test -d "$one/parent"
          f1_manifest="$(find .tmp/agent14-post52/f1-zeroLD -name manifest.json -print -quit)"
          test -n "$f1_manifest"
          f1_root="$(dirname "$f1_manifest")"
          test -d "$f1_root/imports"
          python3 tools/lean_compile_closure.py \
            im-results/agent14-raw139-d0-generic/Raw139NormalizedPostTwelve52Source.lean \
            --source-root "$one/imports" \
            --source-root "$f1_root/imports" \
            --precompiled-manifest "$one/parent/manifest.json" \
            --precompiled-dir "$one/parent" \
            --workdir "$work/build" \
            --jobs 2 \
            --manifest "$work/manifest.json" \
            --label agent14-raw139-post12-52-source \
            --theorem BB6.Agent14Raw139NormalizedPostTwelve52Source.raw139_p0_cover_from_52_source \
            --provenance-input im-results/agent6-champion-residual/generate_c1_one_lc.py \
            --override CanonicalFrontier=im-results/agent47-rooted-tnf/CanonicalFrontier.lean \
            --override TNFPilot=im-results/agent50-weighted-tnf-pilot/TNFPilot.lean \
            --override FastFAR=im-results/agent7-far/FastFAR.lean \
            --override SideCycle=im-results/agent50-weighted-tnf-pilot/SideCycle.lean \
            --override WeightedTNFQueueOrbit=im-results/agent13-weighted-first-one/WeightedTNFQueueOrbit.lean \
            --override FirstHolePath=im-results/agent8-cryptids-tnf-paths/FirstHolePath.lean \
            --override FourHoleResidualRoster=im-results/agent31-three-hole-tnf/FourHoleResidualRoster.lean \
            --override Raw139Normalized=im-results/agent6-raw139-normalized/Raw139Normalized.lean \
            --override BlockFAR4=im-results/agent13-block-far/BlockFAR4.lean \
            --override BlockMacro4=im-results/agent13-block-far/BlockMacro4.lean \
            --override RangeCheck4=im-results/agent13-block-far/RangeCheck4.lean \
            --override BlockFARBridge4=im-results/agent13-block-far/BlockFARBridge4.lean \
            | tee "$work/log"
