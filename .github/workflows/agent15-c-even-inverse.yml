name: Agent 15 exact even-even Machine C inverse (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original Machine C section inverse and new theorem
        run: |
          set -e
          mkdir -p /tmp/a15-even
          cp im-results/agent11-c-line/CLine.lean /tmp/a15-even/
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/a15-even/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/a15-even/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef}.lean /tmp/a15-even/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,EvenTargetForward,BounceEvenExact,BounceOddExact,FullSectionInverse}.lean /tmp/a15-even/
          cp im-results/agent15-c-even-source/{EvenEvenUnique,EvenEvenReach}.lean /tmp/a15-even/
          cd /tmp/a15-even
          export LEAN_PATH=.
          lean --version
          for f in CLine GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef BounceInverse EvenTargetForward BounceEvenExact BounceOddExact FullSectionInverse EvenEvenUnique EvenEvenReach; do
            echo "Checking $f"
            lean -o "$f.olean" "$f.lean"
          done
