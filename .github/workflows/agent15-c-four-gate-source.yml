name: Agent 15 Machine C four-gate and halting cylinders original source audit (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile full original Machine C section, inverse and all four-gate consequences
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a15-four-gate
          cp im-results/agent11-c-line/CLine.lean /tmp/a15-four-gate/
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/a15-four-gate/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/a15-four-gate/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef,FastSectionProof,FastSectionHalting,Agent46CBridge}.lean /tmp/a15-four-gate/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,EvenTargetForward,BounceEvenExact,BounceOddExact,FullSectionInverse,BounceEvenThree,BounceEvenNoFour,BounceAllExact,SectionAllInverse,OddSliver,OddSevenSliver,OddOddWedge,OddOddOrbit,OddOddVal3,OddOddVal3Orbit,OddOddLowVal,OddSevenOrbit,OddForcedNormalize,FullForcedNormalize}.lean /tmp/a15-four-gate/
          cp im-results/agent38-c-section-mod4/Agent38SectionParity.lean /tmp/a15-four-gate/
          cp im-results/agent3-c-odd-image/Agent3CImage.lean /tmp/a15-four-gate/
          cp im-results/agent15-c-halting/{SectionAffineInverse,ReachAffine}.lean /tmp/a15-four-gate/
          cp im-results/agent15-c-even-source/{EvenEvenUnique,EvenEvenReach,OddEvenUnique,EvenRightUnique,FourForcedNormalize,FourForcedFilter,One64Ten,FirstM38,SecondM0Family}.lean /tmp/a15-four-gate/
          cd /tmp/a15-four-gate
          export LEAN_PATH=.
          lean --version
          for f in CLine GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef FastSectionProof FastSectionHalting Agent46CBridge BounceInverse EvenTargetForward BounceEvenExact BounceOddExact FullSectionInverse Agent38SectionParity BounceEvenThree BounceEvenNoFour BounceAllExact SectionAllInverse Agent3CImage SectionAffineInverse ReachAffine OddSliver OddSevenSliver OddOddWedge OddOddOrbit OddOddVal3 OddOddVal3Orbit OddOddLowVal OddSevenOrbit OddForcedNormalize FullForcedNormalize EvenEvenUnique EvenEvenReach OddEvenUnique EvenRightUnique FourForcedNormalize FourForcedFilter One64Ten FirstM38 SecondM0Family; do
            echo "Compiling $f"
            lean -o "$f.olean" "$f.lean"
          done
