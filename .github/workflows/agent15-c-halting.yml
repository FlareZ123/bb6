name: Agent 15 Machine C exact halting locus and quotient composition (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct M8 and M16 source-certified quotient certificates
        run: |
          mkdir -p /tmp/agent15-c-check
          cd /tmp/agent15-c-check
          base64 -d "$GITHUB_WORKSPACE/im-results/agent43-c-quotient-kernel/c-cert8.tar.xz.b64" > c-cert8.tar.xz
          echo "8a9a54fd96c81aaffcb3c06a941cabb06fe0aaa7387b8834ef0d72fbd2acec42  c-cert8.tar.xz" | sha256sum -c -
          tar -xJf c-cert8.tar.xz
          base64 -d "$GITHUB_WORKSPACE/im-results/agent43-c-quotient-kernel/c-cert16.tar.xz.b64" > c-cert16.tar.xz
          echo "1cc951976c75457e35dd6ab62888cfced14e64fbf3c067d4de14f7af2fba540e  c-cert16.tar.xz" | sha256sum -c -
          tar -xJf c-cert16.tar.xz
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-line/CLine.lean" CLine.lean
          cp "$GITHUB_WORKSPACE/im-results/agent43-c-quotient-kernel/CSourceBridge8.lean" CSourceBridge8.lean
          cp "$GITHUB_WORKSPACE/im-results/agent41-c-quotient512/Mod8SevenFour.lean" Mod8SevenFour.lean
          cp "$GITHUB_WORKSPACE/im-results/agent41-c-quotient512/Mod16OneTwo.lean" Mod16OneTwo.lean
          cp "$GITHUB_WORKSPACE/im-results/agent41-c-quotient512/Mod16First.lean" Mod16First.lean
          for f in CCert16Pure.lean P16Block*.lean CGlobal16.lean CQuotientSound16.lean CMapIf16.lean CFull16.lean CExclusions16.lean CSourceBridge16.lean Mod16OneTwo.lean Mod16First.lean; do
            sed -i 's/\bCCert\b/CCert16/g' "$f"
          done
      - name: Kernel verify M8 and M16 quotient source chains
        run: |
          cd /tmp/agent15-c-check
          export LEAN_PATH=.
          lean --version
          lean -o CLine.olean CLine.lean
          lean -o CCert8Pure.olean CCert8Pure.lean
          seq 0 15 | xargs -P 3 -I '{}' sh -c 'lean -o PBlock{}.olean PBlock{}.lean'
          lean -o CGlobal8.olean CGlobal8.lean
          lean -o CQuotientSound8.olean CQuotientSound8.lean
          lean -o CMapIf8.olean CMapIf8.lean
          lean -o CFull8.olean CFull8.lean
          lean -o CExclusions8.olean CExclusions8.lean
          lean -o CSourceBridge8.olean CSourceBridge8.lean
          lean -o Mod8SevenFour.olean Mod8SevenFour.lean
          lean -o CCert16Pure.olean CCert16Pure.lean
          seq 0 23 | xargs -P 3 -I '{}' sh -c 'lean -o P16Block{}.olean P16Block{}.lean'
          lean -o CGlobal16.olean CGlobal16.lean
          lean -o CQuotientSound16.olean CQuotientSound16.lean
          lean -o CMapIf16.olean CMapIf16.lean
          lean -o CFull16.olean CFull16.lean
          lean -o CExclusions16.olean CExclusions16.lean
          lean -o CSourceBridge16.olean CSourceBridge16.lean
          lean -o Mod16OneTwo.olean Mod16OneTwo.lean
          lean -o Mod16First.olean Mod16First.lean
      - name: Compile exact Agent 15 section and original-source bridge
        run: |
          mkdir -p /tmp/agent15-c-check
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/agent15-c-check/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/agent15-c-check/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef,FastSectionProof,FastSectionHalting,Agent46CBridge}.lean /tmp/agent15-c-check/
          cp im-results/agent3-c-odd-image/Agent3CImage.lean /tmp/agent15-c-check/
          cp im-results/agent38-c-section-mod4/Agent38SectionParity.lean /tmp/agent15-c-check/
          cp im-results/agent15-c-halting/{BounceHalting,SectionHalting,SectionPower,BlankHalting,SectionParam,BlankParam,SectionMod8,SectionAffineInverse,SectionDyadic,ReachAffine,AffineNormalize,AffineExclusion,NormalizedGateway,M8M16Composition,AffineQuotientExclusion,AffineParityDepth,AffineHaltOneStep,AffineParityReach,FirstFamilyFilterLimit,SecondFamilyNonperiodic,SecondDeepSector,SecondPartition}.lean /tmp/agent15-c-check/
          cd /tmp/agent15-c-check
          export LEAN_PATH="."
          for f in GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef FastSectionProof FastSectionHalting Agent46CBridge Agent38SectionParity Agent3CImage BounceHalting; do
            lean -o "$f.olean" "$f.lean"
          done
          # Agent 11: complete image of the original machine-C bounce, plus
          # fixed-k inverse injectivity. Both compile against ORIGINAL imports.
          python "$GITHUB_WORKSPACE/im-results/agent11-c-bounce-exact/reconstruct.py"
          cp "$GITHUB_WORKSPACE"/im-results/agent11-c-bounce-exact/{BounceOriginal,BounceConsequencesOriginal}.lean /tmp/agent15-c-check/
          lean -o BounceOriginal.olean BounceOriginal.lean
          lean BounceConsequencesOriginal.lean
          # Agent 11: section image equivalence and unbounded indegree,
          # now linked to genuine FastSectionDef.secNext source.
          cp "$GITHUB_WORKSPACE"/im-results/agent11-c-bounce-exact/{SectionFullOriginal,FanOriginal}.lean /tmp/agent15-c-check/
          lean -o SectionFullOriginal.olean SectionFullOriginal.lean
          lean FanOriginal.lean
          lean -o SectionHalting.olean SectionHalting.lean
          lean -o SectionPower.olean SectionPower.lean
          lean -o BlankHalting.olean BlankHalting.lean
          lean -o SectionParam.olean SectionParam.lean
          lean -o BlankParam.olean BlankParam.lean
          lean -o SectionMod8.olean SectionMod8.lean
          lean -o SectionAffineInverse.olean SectionAffineInverse.lean
          lean -o SectionDyadic.olean SectionDyadic.lean
          lean -o ReachAffine.olean ReachAffine.lean
          lean -o AffineNormalize.olean AffineNormalize.lean
          lean -o AffineExclusion.olean AffineExclusion.lean
          lean -o NormalizedGateway.olean NormalizedGateway.lean
          lean -o M8M16Composition.olean M8M16Composition.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent15-c-halting/BounceFirstReturn.lean /tmp/agent15-c-check/
          lean -o BounceFirstReturn.olean BounceFirstReturn.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent15-c-halting/SectionFirstReturn.lean /tmp/agent15-c-check/
          lean -o SectionFirstReturn.olean SectionFirstReturn.lean
          lean -o AffineQuotientExclusion.olean AffineQuotientExclusion.lean
          lean -o AffineParityDepth.olean AffineParityDepth.lean
          lean -o AffineHaltOneStep.olean AffineHaltOneStep.lean
          lean AffineParityReach.lean
          lean FirstFamilyFilterLimit.lean
          lean SecondFamilyNonperiodic.lean
          lean -o SecondDeepSector.olean SecondDeepSector.lean
          lean SecondPartition.lean
          # Agent 11: original-source composite low-gate and first-family exclusion.
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-odd-image/{Agent3COneFamily,Agent3COrbitIff}.lean /tmp/agent15-c-check/
          cp "$GITHUB_WORKSPACE"/im-results/agent3-c-bounce-inverse/{BounceInverse,FeederGeneric,FeederOrbitGeneric,GeneralHighInverse,EvenTargetForward,EvenTargetExact,EvenTargetOrbit}.lean /tmp/agent15-c-check/
          cp "$GITHUB_WORKSPACE"/im-results/agent11-c-first-family/{M8ThinBridge,LowGate6}.lean /tmp/agent15-c-check/
          for f in BounceInverse Agent3COneFamily Agent3COrbitIff FeederGeneric FeederOrbitGeneric GeneralHighInverse EvenTargetForward EvenTargetExact EvenTargetOrbit; do
            lean -o "$f.olean" "$f.lean"
          done
          lean -o M8ThinBridge.olean M8ThinBridge.lean
          lean -o LowGate6.olean LowGate6.lean

          # Agent 11: compositional 2-adic affine invariant at all depths.
          cp "$GITHUB_WORKSPACE"/im-results/agent11-c-first-family/{AffineDepthM8,DeepLowGate}.lean /tmp/agent15-c-check/
          lean -o AffineDepthM8.olean AffineDepthM8.lean
          lean -o DeepLowGate.olean DeepLowGate.lean
          # Agent 11: unbounded exact two-adic depth hierarchy.
          cp "$GITHUB_WORKSPACE"/im-results/agent11-c-first-family/{DeepFamily,FirstR2,FirstUniform}.lean /tmp/agent15-c-check/
          lean -o DeepFamily.olean DeepFamily.lean
          lean FirstR2.lean
          lean -o FirstUniform.olean FirstUniform.lean
          # Agent 11: self-contained number theory + authentic source-linked
          # every-depth infinite-family nonreachability.
          cp "$GITHUB_WORKSPACE"/im-results/agent11-c-first-family/{IndexWitness,IndexDisjoint,IndexLift,IndexReach}.lean /tmp/agent15-c-check/
          lean -o IndexWitness.olean IndexWitness.lean
          lean IndexDisjoint.lean
          lean -o IndexLift.olean IndexLift.lean
          lean IndexReach.lean
          # Agent 11: exact-source finite mod-8 residue counterexamples and
          # explicit conditional pullback of Agent 43's emerging M32 cells.
          cp "$GITHUB_WORKSPACE"/im-results/agent11-c-first-family/{ResidueWitness,M32PullbackConditional}.lean /tmp/agent15-c-check/
          lean ResidueWitness.lean
          lean M32PullbackConditional.lean
          # Agent 11: general arbitrary-depth normalization, eight conditional
          # M32 target classes, and genuine infinite second halting family.
          cp "$GITHUB_WORKSPACE"/im-results/agent11-c-first-family/{OddDepthGeneric,OddDepthResidue,M32AllDepthConditional,SecondResidue,SecondUniform,SecondWitness}.lean /tmp/agent15-c-check/
          lean -o OddDepthGeneric.olean OddDepthGeneric.lean
          lean -o OddDepthResidue.olean OddDepthResidue.lean
          lean M32AllDepthConditional.lean
          lean -o SecondResidue.olean SecondResidue.lean
          lean -o SecondUniform.olean SecondUniform.lean
          lean SecondWitness.lean

          # Independently reconstruct and compile the M192 source invariant.
          python3 "$GITHUB_WORKSPACE/tools/agent41_m192_generate.py" quotient > Quotient192.lean
          python3 "$GITHUB_WORKSPACE/tools/agent41_m192_generate.py" bridge > CMapBridge192.lean
          cp "$GITHUB_WORKSPACE/im-results/agent41-m192-reverse/Core192High.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent41-m192-reverse/Core192All.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent41-m192-reverse/Core192Source.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent38-m192-high-zero/HighZeroEven.lean" .
          lean -o Quotient192.olean Quotient192.lean
          lean -o CMapBridge192.olean CMapBridge192.lean
          lean -o Core192High.olean Core192High.lean
          lean -o Core192All.olean Core192All.lean
          lean -o HighZeroEven.olean HighZeroEven.lean
          lean -o Core192Source.olean Core192Source.lean
          cp "$GITHUB_WORKSPACE/im-results/agent15-c-halting/M192GeneralBound.lean" .
          lean -o M192GeneralBound.olean M192GeneralBound.lean

          # Compile Agent 6's independent finite certificate and use it to
          # exclude the sole small second-family point (3,7,0).
          cp "$GITHUB_WORKSPACE/im-results/agent6-c-feeder/NoFirstCFeeder.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent6-c-feeder/CFeederCertificate.lean" .
          lean -o NoFirstCFeeder.olean NoFirstCFeeder.lean
          lean -o CFeederCertificate.olean CFeederCertificate.lean
          cp "$GITHUB_WORKSPACE/im-results/agent15-c-halting/SmallSecondFamily.lean" .
          lean -o SmallSecondFamily.olean SmallSecondFamily.lean
          cp "$GITHUB_WORKSPACE/im-results/agent15-c-halting/NoMachineCHalt.lean" .
          lean -o NoMachineCHalt.olean NoMachineCHalt.lean
