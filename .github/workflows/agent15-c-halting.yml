name: Agent 15 Machine C exact halting locus (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unchanged Machine C source with Agent 15 proofs
        run: |
          mkdir -p /tmp/agent15-c-check
          cp im-results/agent11-c-line/CLine.lean /tmp/agent15-c-check/
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/agent15-c-check/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/agent15-c-check/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef}.lean /tmp/agent15-c-check/
          cp im-results/agent15-c-halting/{BounceHalting,SectionHalting}.lean /tmp/agent15-c-check/
          cd /tmp/agent15-c-check
          export LEAN_PATH="."
          lean --version
          for f in CLine GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef BounceHalting; do
            lean -o "$f.olean" "$f.lean"
          done
          lean SectionHalting.lean
