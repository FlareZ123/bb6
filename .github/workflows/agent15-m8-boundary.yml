name: Agent 15 M8 boundary source audit

on:
  workflow_dispatch:
    inputs:
      target:
        description: Select focused M8 boundary theorem module
        required: true
        type: choice
        default: boundary
        options:
          - deepThin
          - boundary
          - strict
          - lattice
          - tower

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify and unpack M8 source certificate
        run: |
          set -euo pipefail
          mkdir -p /tmp/a15m8
          base64 -d im-results/agent43-c-quotient-kernel/c-cert8.tar.xz.b64 > /tmp/a15m8/certificate.tar.xz
          echo "8a9a54fd96c81aaffcb3c06a941cabb06fe0aaa7387b8834ef0d72fbd2acec42  /tmp/a15m8/certificate.tar.xz" | sha256sum -c -
          tar -xJf /tmp/a15m8/certificate.tar.xz -C /tmp/a15m8

      - name: Kernel verify focused M8 dependency closure
        shell: bash
        env:
          M8_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$M8_TARGET" in
            deepThin)
              target=im-results/agent15-c-halting/M8DeepThin.lean
              ;;
            boundary)
              target=im-results/agent15-c-halting/M8BoundarySource.lean
              ;;
            strict)
              target=im-results/agent15-c-halting/M8BoundaryStrict.lean
              ;;
            lattice)
              target=im-results/agent15-c-halting/M8BoundaryLattice.lean
              ;;
            tower)
              target=im-results/agent15-c-halting/M8TowerLattice.lean
              ;;
          esac
          python3 tools/lean_compile_closure.py \
            "$target" \
            --workdir /tmp/a15m8-build \
            --source-root /tmp/a15m8 \
            --jobs 4 \
            --lean "$(command -v lean)" \
            --override CLine=im-results/agent11-c-line/CLine.lean \
            --override BounceParity=im-results/agent46-c-jump/BounceParity.lean
