name: Agent15 Raw140-37 mid recurrence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile and audit bounded recurrence
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent10-nov26-cryptids/generate_raw140_orbit_phases.py
          node im-results/agent10-nov26-cryptids/generate_raw140_variant_transfer.js
          python tools/lean_compile_closure.py --workdir /tmp/agent15-raw140-mid --jobs 3 \
            im-results/agent15-raw140-hard-prefix/Raw14037MidRecurrence.lean 2>&1 | tee /tmp/agent15-raw140-mid.log
          for t in step_0 step_25 jump jump_run; do
            python im-results/agent4-raw109/audit_axioms.py /tmp/agent15-raw140-mid.log "Raw14037MidRecurrence.$t"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: agent15-raw140-37-mid-recurrence
          path: /tmp/agent15-raw140-mid.log
