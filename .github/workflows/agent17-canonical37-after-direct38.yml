name: Agent17 Raw112 after direct Canonical38

on:
  workflow_dispatch:
    inputs:
      direct38_run_id:
        description: 'Accepted direct Raw39+Raw47 Canonical38 producer'
        required: true
        type: string
      raw112_run_id:
        description: 'Accepted Raw112 whole-parent producer'
        required: true
        type: string
        default: '46146501930'

permissions:
  actions: read
  contents: read

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free unrelated hosted SDKs
        run: |
          set -euo pipefail
          df -h /
          for folder in /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell; do
            if [[ -d "$folder" ]]; then sudo rm -rf "$folder"; fi
          done
          df -h /
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - name: Authenticate direct Canonical38 and consume Raw112
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECT38_RUN_ID: ${{ inputs.direct38_run_id }}
          RAW112_RUN_ID: ${{ inputs.raw112_run_id }}
        run: |
          set -euo pipefail
          [[ "$DIRECT38_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RAW112_RUN_ID" =~ ^[0-9]+$ ]]
          lean --version | grep -F '4.36.0-rc2'
          python -m py_compile im-results/agent17-canonical37-raw112-after-direct38/consume.py
          python im-results/agent17-canonical37-raw112-after-direct38/consume.py \
            --work /tmp/a17-canonical37 \
            --direct38-run-id "$DIRECT38_RUN_ID" \
            --raw112-run-id "$RAW112_RUN_ID" \
            | tee /tmp/a17-canonical37.log
          test -s /tmp/a17-canonical37/evidence/canonical37-raw112-after-direct38.json
          cat /tmp/a17-canonical37/evidence/canonical37-raw112-after-direct38.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical37-raw112-after-direct38-evidence
          path: |
            /tmp/a17-canonical37/evidence/
            /tmp/a17-canonical37.log
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30
