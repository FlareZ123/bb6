name: Agent17 Raw42 1LB failed-shard recovery

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_RUN: "46129062347"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: raw42-group1-generated
          path: im-results/agent32-raw42/generated-assembly
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: raw42-group1-shared
          path: /tmp/shared
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: raw42-group1-split-plan
          path: /tmp/original
      - name: Row-split frozen 1LB Run leaf 5137
        run: |
          set -euo pipefail
          python im-results/agent32-raw42/rewrite_run42_rows.py \
            im-results/agent32-raw42/generated-assembly 1LB 5137
          test -f im-results/agent32-raw42/generated-assembly/Raw421LBRun5137Data.lean
          test -f im-results/agent32-raw42/generated-assembly/Raw421LBRun5137Row11.lean
      - name: Split only failed logical part 2
        id: plan
        run: |
          set -euo pipefail
          python im-results/agent17-raw42-recovery/split_subset.py \
            im-results/agent32-raw42/generated-assembly \
            /tmp/original/split.json 2 4 \
            raw42-group1-1LB-part2-sub /tmp/nested.json
          echo "parts=$(python -c 'import json;print(json.dumps(list(json.load(open("/tmp/nested.json"))["groups"])))')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-part2-generated
          path: im-results/agent32-raw42/generated-assembly/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-part2-shared
          path: /tmp/shared/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-part2-original-plan
          path: /tmp/original/split.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-part2-nested-plan
          path: /tmp/nested.json
          retention-days: 14
          if-no-files-found: error

  compile_subpart:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: ${{ fromJSON(needs.prepare.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct coverage sources
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          printf '#!/bin/sh\nexec lean -j1 "$@"\n' >/tmp/lean-one
          chmod +x /tmp/lean-one
      - uses: actions/download-artifact@v4
        with:
          name: raw42-part2-generated
          path: im-results/agent32-raw42/generated-assembly
      - uses: actions/download-artifact@v4
        with:
          name: raw42-part2-shared
          path: /tmp/shared
      - uses: actions/download-artifact@v4
        with:
          name: raw42-part2-nested-plan
          path: /tmp/plan
      - name: Compile exact failed-part subset
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42
          g="$d/generated-assembly"
          plan=/tmp/plan/nested.json
          mapfile -t roots < <(python -c 'import json,sys;print("\n".join(json.load(open(sys.argv[1]))["groups"][sys.argv[2]]))' "$plan" "$PART")
          test "${#roots[@]}" -gt 0
          for i in "${!roots[@]}"; do roots[i]="$g/${roots[i]}.lean"; done
          out=/tmp/subpart
          mkdir -p "$out"
          python tools/lean_compile_closure.py --lean /tmp/lean-one --workdir "$out" --jobs 1 \
            --source-root "$g" --override FastBiDFA="$d/FastBiDFA.lean" \
            --precompiled-manifest /tmp/shared/manifest.json --precompiled-dir /tmp/shared \
            --manifest "$out/manifest.json" \
            --artifact-name "raw42-group1-1LB-part2-sub-$PART" \
            "${roots[@]}" | tee "$out/audit.log"
          ! grep -Eq 'sorryAx|native_decide' "$out/audit.log"
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-group1-1LB-part2-sub-${{ matrix.part }}
          path: /tmp/subpart/
          retention-days: 30
          if-no-files-found: error

  recover_part2:
    needs: [prepare, compile_subpart]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw42-part2-generated
          path: im-results/agent32-raw42/generated-assembly
      - uses: actions/download-artifact@v4
        with:
          name: raw42-part2-original-plan
          path: /tmp/original
      - uses: actions/download-artifact@v4
        with:
          name: raw42-part2-nested-plan
          path: /tmp/nested
      - uses: actions/download-artifact@v4
        with:
          pattern: raw42-group1-1LB-part2-sub-*
          path: /tmp/subparts
      - name: Authenticate recovered logical part 2
        run: |
          set -euo pipefail
          python im-results/agent4-raw109/merge_shards.py \
            /tmp/subparts /tmp/recovered /tmp/nested/nested.json
          python - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path('/tmp/original/split.json').read_text())
          p=Path('/tmp/recovered/manifest.json')
          m=json.loads(p.read_text())
          assert {x['module'] for x in m['roots']} == set(original['groups']['2'])
          m['artifact_name']='raw42-group1-1LB-part-2'
          m['label']='raw42-group1-1LB-part-2'
          p.write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-group1-1LB-part-2
          path: /tmp/recovered/
          retention-days: 30
          if-no-files-found: error

  rebuild_group1:
    needs: recover_part2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw42-part2-generated
          path: im-results/agent32-raw42/generated-assembly
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: raw42-group1-1LB-part-*
          path: /tmp/parts
      - uses: actions/download-artifact@v4
        with:
          name: raw42-group1-1LB-part-2
          path: /tmp/parts/raw42-group1-1LB-part-2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: raw42-group1-split-plan
          path: /tmp/original
      - name: Reconstruct canonical group 1 from accepted siblings plus recovery
        run: |
          set -euo pipefail
          rm -rf /tmp/parts/raw42-group1-1LB-part-2.failed 2>/dev/null || true
          python im-results/agent4-raw109/merge_shards.py \
            /tmp/parts /tmp/group1 /tmp/original/split.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/group1/manifest.json')
          m=json.loads(p.read_text())
          m['artifact_name']='raw42-assembly-shard-1'
          m['label']='raw42-assembly-shard-1'
          p.write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-assembly-shard-1
          path: /tmp/group1/
          retention-days: 30
          if-no-files-found: error

  compose_child:
    needs: rebuild_group1
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct coverage sources
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          printf '#!/bin/sh\nexec lean -j1 "$@"\n' >/tmp/lean-one
          chmod +x /tmp/lean-one
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          name: raw42-group1-generated
          path: im-results/agent32-raw42/generated-assembly
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46100532768
          pattern: raw42-assembly-shard-*
          path: /tmp/shards
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46111777843
          name: raw42-assembly-shard-0
          path: /tmp/shards/raw42-assembly-shard-0
      - uses: actions/download-artifact@v4
        with:
          name: raw42-assembly-shard-1
          path: /tmp/shards/raw42-assembly-shard-1
      - name: Authenticate all eight shards and prove Raw42/1LB Cover
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42
          g="$d/generated-assembly"
          python im-results/agent4-raw109/merge_shards.py \
            /tmp/shards /tmp/merged "$g/shards.json"
          mkdir -p /tmp/final
          python tools/lean_compile_closure.py --lean /tmp/lean-one --workdir /tmp/final --jobs 1 \
            --source-root "$g" --override FastBiDFA="$d/FastBiDFA.lean" \
            --precompiled-manifest /tmp/merged/manifest.json --precompiled-dir /tmp/merged \
            --manifest /tmp/final/manifest.json \
            --artifact-name raw42-certified-1LB-targeted-recovery \
            --theorem BB6.Agent32Raw421LB.Closed.cover \
            --parent-table '1RB---_1RC1LB_0RD---_1LD0LB_------_------' \
            --weighted-bound 100006 "$g/Raw421LBClosedCover.lean" | tee /tmp/final/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/final/audit.log
          python im-results/agent32-raw59/check_axioms.py \
            /tmp/final/audit.log BB6.Agent32Raw421LB.Closed.cover
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-certified-1LB-targeted-recovery
          path: /tmp/final/
          retention-days: 30
          if-no-files-found: error
