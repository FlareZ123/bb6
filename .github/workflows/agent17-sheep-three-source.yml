name: Agent 17 Sheep 3-adic source bridge (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Cryptids Lean toolchain
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Checkout the exact certified upstream machine
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Build original certified six-state Sheep machine
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB1LA_0LC0RC_1LE1RD_1RE1RC_1LF0LA_HHH1LE
      - name: Certify exact original-source three-adic quotient theorem
        working-directory: /tmp/cryptids
        run: |
          python3 -m venv /tmp/agent17-venv
          /tmp/agent17-venv/bin/pip -q install filelock
          /tmp/agent17-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/unpack.py"
          cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-preimages/CounterBridge.lean" CounterBridge.lean
          for name in DeterministicMacro SheepPowerBridge SheepBlankCriterion SheepSourceBridge; do
            cp "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/$name.lean" "$name.lean"
          done
          /tmp/agent17-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            CounterBridge.lean DeterministicMacro.lean SheepPowerBridge.lean SheepBlankCriterion.lean
          export LEAN_PATH=".:$LEAN_PATH"
          for name in CounterBridge DeterministicMacro SheepPowerBridge SheepBlankCriterion; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          lake env lean -o ".lake/build/lib/lean/SheepSourceBridge.olean" SheepSourceBridge.lean
          for name in Three ForwardSurj ForwardEdgeAlgebra ForwardThreeEdge ForwardThreeSource; do
            cp "$GITHUB_WORKSPACE/im-results/agent17-sheep-forward/$name.lean" "$name.lean"
          done
          for name in Three ForwardSurj ForwardEdgeAlgebra ForwardThreeEdge; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          lake env lean ForwardThreeSource.lean

          # Agent17: source-connected proof of new valuation 3/6/7
          # genuine first-even parents, with existing archived original
          # SheepEven and EvenEdge definitions (no interface stubs).
          /tmp/agent17-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent16-sheep-even-return/reconstruct_all.py"
          for name in SheepEven EvenEdge; do
            cp "$GITHUB_WORKSPACE/im-results/agent16-sheep-even-return/$name.lean" "$name.lean"
          done
          /tmp/agent17-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" SheepEven.lean EvenEdge.lean
          for name in SheepEven EvenEdge; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          for name in SheepA3Boost SheepA6Boost SheepA7Boost SheepBoostSourceModel SheepFaninSource SheepFaninOriginal; do
            cp "$GITHUB_WORKSPACE/im-results/agent17-sheep-a3-boost/$name.lean" "$name.lean"
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done

          # Agent39's already kernel-certified full 3-adic identity
          # supplies the actual quotient witness for every allowed k,h.
          cp "$GITHUB_WORKSPACE/im-results/agent39-sheep-zero-ancestry/ThreeAdicOrder.lean" ThreeAdicOrder.lean
          cp "$GITHUB_WORKSPACE/im-results/agent17-sheep-a3-boost/SheepFaninAllK.lean" SheepFaninAllK.lean
          lake env lean -o ".lake/build/lib/lean/ThreeAdicOrder.olean" ThreeAdicOrder.lean
          lake env lean SheepFaninAllK.lean
