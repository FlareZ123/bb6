name: Agent 18 BB429 stronger authentic blank-root invariants (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean compiler
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check local root invariants and branch-7 inverse families
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent6-harmonic429:im-results/agent39-429-1021:im-results/agent18-429-root-invariants:im-results/agent30-429-even16:im-results/agent33-429-24
        run: |
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=2000000 -o im-results/agent6-harmonic429/BB429Mod8.olean im-results/agent6-harmonic429/BB429Mod8.lean
          lean -DmaxRecDepth=16000 -DmaxHeartbeats=15000000 -o im-results/agent39-429-1021/BB429RootEven8.olean im-results/agent39-429-1021/BB429RootEven8.lean
          lean -DmaxRecDepth=16000 -DmaxHeartbeats=15000000 -o im-results/agent39-429-1021/BB429RootMod16.olean im-results/agent39-429-1021/BB429RootMod16.lean
          lean -DmaxRecDepth=16000 -DmaxHeartbeats=15000000 -o im-results/agent39-429-1021/BB429RootMod32.olean im-results/agent39-429-1021/BB429RootMod32.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=50000000 -o im-results/agent6-harmonic429/BB429NewResidue.olean im-results/agent6-harmonic429/BB429NewResidue.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=10000000 -o im-results/agent33-429-24/BB429InverseKernel.olean im-results/agent33-429-24/BB429InverseKernel.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=4000000 -o im-results/agent6-harmonic429/BB429NoThree.olean im-results/agent6-harmonic429/BB429NoThree.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=10000000 -o im-results/agent18-429-root-invariants/BB429SevenStrong.olean im-results/agent18-429-root-invariants/BB429SevenStrong.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=10000000 -o im-results/agent18-429-root-invariants/BB429OddResetGate.olean im-results/agent18-429-root-invariants/BB429OddResetGate.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=10000000 -o im-results/agent18-429-root-invariants/BB429Reset31.olean im-results/agent18-429-root-invariants/BB429Reset31.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=8000000 -o im-results/agent30-429-even16/BB429Even16.olean im-results/agent30-429-even16/BB429Even16.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=10000000 -o im-results/agent18-429-root-invariants/BB429Branch7.olean im-results/agent18-429-root-invariants/BB429Branch7.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=10000000 -o im-results/agent18-429-root-invariants/BB429Branch29.olean im-results/agent18-429-root-invariants/BB429Branch29.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=20000000 -o im-results/agent18-429-root-invariants/BB429FiniteAvoidance.olean im-results/agent18-429-root-invariants/BB429FiniteAvoidance.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=10000000 -o im-results/agent18-429-root-invariants/BB429Branch29Mod16.olean im-results/agent18-429-root-invariants/BB429Branch29Mod16.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=12000000 -o im-results/agent18-429-root-invariants/BB429Branch29Mod64.olean im-results/agent18-429-root-invariants/BB429Branch29Mod64.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=16000000 -o im-results/agent18-429-root-invariants/BB429Branch29Mod128.olean im-results/agent18-429-root-invariants/BB429Branch29Mod128.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=16000000 -o im-results/agent18-429-root-invariants/BB429Branch29Odd31.olean im-results/agent18-429-root-invariants/BB429Branch29Odd31.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=20000000 im-results/agent18-429-root-invariants/BB429Branch29Arithmetic.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=20000000 -o im-results/agent18-429-root-invariants/BB429Branch29Reflect.olean im-results/agent18-429-root-invariants/BB429Branch29Reflect.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=30000000 -o im-results/agent18-429-root-invariants/BB429Branch29Reflect1024.olean im-results/agent18-429-root-invariants/BB429Branch29Reflect1024.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=30000000 -o im-results/agent18-429-root-invariants/BB429Branch29Small.olean im-results/agent18-429-root-invariants/BB429Branch29Small.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=30000000 im-results/agent18-429-root-invariants/BB429Branch29All.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=50000000 im-results/agent18-429-root-invariants/BB429Branch29BurstFloor.lean
