name: Agent 18 upstream Machine B semantic bridge (manual)

on:
  workflow_dispatch:
    inputs:
      skip_long_sample:
        description: Skip the expensive historical scalar parity sample
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned upstream Lean toolchain
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Clone exact certified upstream revision
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Restore upstream Mathlib build cache
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
      - name: Build upstream Machine B certification
        working-directory: /tmp/cryptids
        run: |
          lake build BusyBeaver.BB6.M_1RB0LD_1RC1RA_1LD0RB_1LE1LA_1RF0RC_HHH1RE
      - name: Verify Agent 18 local cycle theorem against original machine
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent18-b-cycle/BReduction.lean" Agent18BReduction.lean
          cp "$GITHUB_WORKSPACE/im-results/agent18-b-cycle/Agent18BBridge.lean" Agent18BBridge.lean
          cp "$GITHUB_WORKSPACE/im-results/agent18-b-cycle/BRun.lean" BRun.lean
          cp "$GITHUB_WORKSPACE/im-results/agent18-b-cycle/BParity.lean" BParity.lean
          lake env lean -o .lake/build/lib/lean/Agent18BReduction.olean Agent18BReduction.lean
          lake env lean -o .lake/build/lib/lean/BRun.olean BRun.lean
          lake env lean -o .lake/build/lib/lean/Agent18BBridge.olean Agent18BBridge.lean
          lake env lean BParity.lean
          cp "$GITHUB_WORKSPACE/im-results/agent18-b-cycle/BOneDim.lean" BOneDim.lean
          cp "$GITHUB_WORKSPACE/im-results/agent18-b-cycle/Agent18OneDimBridge.lean" Agent18OneDimBridge.lean
          lake env lean -o .lake/build/lib/lean/BOneDim.olean BOneDim.lean
          lake env lean -o .lake/build/lib/lean/Agent18OneDimBridge.olean Agent18OneDimBridge.lean
      - name: Verify Agent 10 parity theorem against original Agent 18 scalar source
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent10-b-parity/Agent10BParity.lean" Agent10BParity.lean
          cp "$GITHUB_WORKSPACE/im-results/agent10-b-parity/Agent10BSource.lean" Agent10BSource.lean
          lake env lean -o .lake/build/lib/lean/Agent10BParity.olean Agent10BParity.lean
          lake env lean -o .lake/build/lib/lean/Agent10BSource.olean Agent10BSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent10-b-parity/Agent10Shift.lean" Agent10Shift.lean
          cp "$GITHUB_WORKSPACE/im-results/agent10-b-parity/Agent10FullShift.lean" Agent10FullShift.lean
          lake env lean -o .lake/build/lib/lean/Agent10Shift.olean Agent10Shift.lean
          lake env lean Agent10FullShift.lean
          cp "$GITHUB_WORKSPACE/im-results/agent10-b-parity/Agent10Growth.lean" Agent10Growth.lean
          cp "$GITHUB_WORKSPACE/im-results/agent10-b-parity/Agent10GrowthSource.lean" Agent10GrowthSource.lean
          lake env lean -o .lake/build/lib/lean/Agent10Growth.olean Agent10Growth.lean
          lake env lean -o .lake/build/lib/lean/Agent10GrowthSource.olean Agent10GrowthSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent10-b-parity/Agent10Tower.lean" Agent10Tower.lean
          lake env lean Agent10Tower.lean
          cp "$GITHUB_WORKSPACE/im-results/agent10-b-parity/Agent10ModSeven.lean" Agent10ModSeven.lean
          cp "$GITHUB_WORKSPACE/im-results/agent10-b-parity/Agent10SevenReset.lean" Agent10SevenReset.lean
          cp "$GITHUB_WORKSPACE/im-results/agent10-b-parity/Agent10RootModSeven.lean" Agent10RootModSeven.lean
          lake env lean -o .lake/build/lib/lean/Agent10ModSeven.olean Agent10ModSeven.lean
          lake env lean -o .lake/build/lib/lean/Agent10SevenReset.olean Agent10SevenReset.lean
          lake env lean Agent10RootModSeven.lean
      - name: Verify Agent 10 all-iterate affine modular obstruction against authentic B source
        working-directory: /tmp/cryptids
        run: |
          for f in GBase Curvature AffineBarrier AffineBarrierSource PeriodDiv PeriodMultiply OddIncrement CongruenceBarrier CongruenceBarrierSource; do
            cp "$GITHUB_WORKSPACE/im-results/agent10-b-affine-iter/$f.lean" "$f.lean"
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Kernel-certify exact parity after 227097 scalar iterations
        if: ${{ !inputs.skip_long_sample }}
        working-directory: /tmp/cryptids
        run: |
          python -m pip install --quiet filelock
          python "$GITHUB_WORKSPACE/im-results/agent10-b-parity/generate_long_sample.py"
          for i in $(seq 0 22); do
            lake env lean -o ".lake/build/lib/lean/SamplePart${i}.olean" "SamplePart${i}.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent10-b-parity/Agent10ThirdBridge.lean" Agent10ThirdBridge.lean
          lake env lean Agent10ThirdBridge.lean
