name: Agent 18 pinned upstream P1 high-level map bridge (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean v4.35.0-rc4
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Clone exact upstream Cryptids revision
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Restore upstream mathlib build artifacts
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
      - name: Build upstream certified P1 machine
        working-directory: /tmp/cryptids
        run: |
          lake build BusyBeaver.BB6.M_1RB1RD_0LC1RA_1LA1LC_1RA1LE_1RF0LD_HHH0RE
      - name: Verify independent local P1 acceleration equality
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent4-halting-funnel/HaltingFunnel.lean" HaltingFunnel.lean
          cp "$GITHUB_WORKSPACE/im-results/agent18-p1-bridge/P1Bridge.lean" P1Bridge.lean
          lake env lean -o .lake/build/lib/lean/HaltingFunnel.olean HaltingFunnel.lean
          lake env lean P1Bridge.lean
