name: Agent 19 P1 semantic bridge against pinned Cryptids (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned upstream Lean toolchain
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone certified upstream revision
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Download pinned Mathlib cache and build verified P1 accelerator
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB1RD_0LC1RA_1LA1LC_1RA1LE_1RF0LD_HHH0RE
      - name: Check standalone G and T proofs against published machine
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent4-halting-funnel/HaltingFunnel.lean" HaltingFunnel.lean
          cp "$GITHUB_WORKSPACE/im-results/agent19-p1-source-bridge/P1Bridge.lean" Agent19P1Bridge.lean
          for name in EvenSector OddReturn Reachability BlankCriterion; do
            cp "$GITHUB_WORKSPACE/im-results/agent4-halting-funnel/${name}.lean" "${name}.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent19-p1-source-bridge/P1HaltingBridge.lean" Agent19P1HaltingBridge.lean
          export LEAN_PATH=".:${LEAN_PATH:-}"
          lake env lean -o .lake/build/lib/lean/HaltingFunnel.olean HaltingFunnel.lean
          lake env lean -o .lake/build/lib/lean/Agent19P1Bridge.olean Agent19P1Bridge.lean
          for name in EvenSector OddReturn Reachability BlankCriterion; do
            lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean"
          done
          lake env lean Agent19P1HaltingBridge.lean
