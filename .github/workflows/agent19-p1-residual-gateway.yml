name: Agent 19 P1 uniform residual gateway (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify all-time residual reset gateway using original Lean definitions
        run: |
          export LEAN_PATH="im-results/agent4-halting-funnel:im-results/agent19-p1-source-bridge"
          for m in HaltingFunnel EvenSector OddReturn Reachability BlankCriterion BlankInvariants NoFirstTarget NoSecondTarget; do
            lean -o "im-results/agent4-halting-funnel/$m.olean" "im-results/agent4-halting-funnel/$m.lean"
          done
          lean im-results/agent19-p1-source-bridge/ResidualGateway.lean
