name: Agent 19 raw81 proof
on:
  workflow_dispatch:
    inputs:
      target:
        description: Proof target
        type: choice
        options: [raw81, canonical-three-parent, raw38-cut, raw40-a1rc, raw40-a0lb198, raw40-a0lb, raw40-a1la-grammar, raw40-a1la, raw40-a1lc-0lc, raw40-a1lb, raw40-a1lb-next, raw40-a1lb-final-pair, raw40-a1lb-0rc, raw40-a1lb-all]
        default: raw81
permissions:
  contents: read
jobs:
  proof:
    if: inputs.target == 'raw81'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Regenerate witnesses and verify original-source roster reduction
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent19-tnf-raw81/prepare.py
          python tools/lean_compile_closure.py --workdir /tmp/a19-raw81 --jobs 4 im-results/agent19-tnf-raw81/Raw81RosterBridge.lean | tee /tmp/a19-raw81.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a19-raw81.log; then
            echo 'Forbidden proof placeholder or native_decide in closure' >&2
            exit 1
          fi

  canonical-three-parent:
    if: inputs.target == 'canonical-three-parent'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Regenerate original certificates and compose three additional parents
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 68 72 82
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          for raw in 71 77 81; do
            python "im-results/agent19-tnf-raw${raw}/prepare.py"
          done
          inputs=()
          for raw in 71 77 81; do
            for file in prepare.py dfa-bank.txt dfa-index.txt specs.json; do
              inputs+=(--provenance-input "im-results/agent19-tnf-raw${raw}/${file}")
            done
          done
          python tools/lean_compile_closure.py --workdir /tmp/a19-canonical --jobs 4 \
            --manifest /tmp/a19-canonical/manifest.json \
            --label canonical-three-parent --theorem BB6.Agent19CanonicalThreeParent.roster75_sound \
            --weighted-bound 7014 --artifact-name canonical-three-parent-certified \
            "${inputs[@]}" \
            im-results/agent19-tnf-raw81/CanonicalThreeParent.lean | tee /tmp/a19-canonical.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a19-canonical.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-three-parent-certified
          path: |
            /tmp/a19-canonical/*.olean
            /tmp/a19-canonical/manifest.json
          if-no-files-found: error

  raw38-cut:
    if: inputs.target == 'raw38-cut'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify original-source raw38 partial cut and roster consumer
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python tools/lean_compile_closure.py --workdir /tmp/a19-raw38 --jobs 4 im-results/agent19-raw38-cut/Raw38Roster.lean | tee /tmp/a19-raw38.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a19-raw38.log; then exit 1; fi

  raw40-a1rc:
    if: inputs.target == 'raw40-a1rc' || inputs.target == 'raw40-a0lb198' || inputs.target == 'raw40-a0lb' || inputs.target == 'raw40-a1la-grammar' || inputs.target == 'raw40-a1la' || inputs.target == 'raw40-a1lc-0lc' || inputs.target == 'raw40-a1lb' || inputs.target == 'raw40-a1lb-next' || inputs.target == 'raw40-a1lb-final-pair' || inputs.target == 'raw40-a1lb-0rc' || inputs.target == 'raw40-a1lb-all'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Retrieve accepted Canonical77 dependency bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a19-raw40-deps
          gh api repos/${{ github.repository }}/actions/artifacts/14997966221 > /tmp/a19-raw40-pin.json
          python -c 'import json; a=json.load(open("/tmp/a19-raw40-pin.json")); assert not a["expired"] and a["workflow_run"]["id"] == 45554648116'
          gh api repos/${{ github.repository }}/actions/artifacts/14997966221/zip > /tmp/a19-raw40-deps.zip
          unzip -q /tmp/a19-raw40-deps.zip -d /tmp/a19-raw40-deps
          sha256sum /tmp/a19-raw40-deps.zip
      - name: Compile complete A1RC weighted-cover composition
        if: inputs.target == 'raw40-a1rc'
        env:
          LEAN_DEPS: /tmp/a19-raw40-deps
          WORKERS: "4"
        run: |
          set -euo pipefail
          bash im-results/agent19-raw40-cut/reproduce-A1RC.sh | tee /tmp/a19-raw40-a1rc.log
          python - <<'PY'
          import re
          s=open('/tmp/a19-raw40-a1rc.log').read()
          assert not re.search(r'\b(sorryAx|native_decide)\b',s)
          for n in ['children','all_quotient','exact_weighted']:
              m=re.search(r"'BB6\.Agent19Raw40\.A1RC\."+n+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,n
              assert set(m[1].split(', ')) <= {'propext','Classical.choice','Quot.sound'},m[0]
          PY
      - uses: actions/upload-artifact@v4
        if: always() && inputs.target == 'raw40-a1rc'
        with:
          name: raw40-a1rc-source-audit
          path: |
            /tmp/a19-raw40-a1rc.log
            /tmp/a19-raw40-pin.json
            im-results/agent19-raw40-cut/Raw40A1RC*.olean
            im-results/agent19-raw40-cut/Raw40Round*Exact.olean
          if-no-files-found: warn

      - name: Compile compact Raw40 A0LB B1=1RE leaf 198
        if: inputs.target == 'raw40-a0lb198'
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/im-results/agent19-raw40-cut"
          cd "$root"
          export LEAN_PATH="$root:/tmp/a19-raw40-deps"
          lean --version
          python compact_ngram.py --table 1RB0LB1RC1RE0RD0RE1LD1LA0RA0LF---0LD --left 16 --right 17 --id 198 --case 1RE > /tmp/a0lb198-regenerated.json
          python - <<'PY'
          import json
          old=json.load(open('a0lb198-compact.json'))
          new=json.load(open('/tmp/a0lb198-regenerated.json'))
          assert old == new
          assert old['states'] == 2229 and old['summary_counts'] == [95,581] and old['edge_counts'] == [95,640]
          PY
          (cd ../agent32-raw59; lean -j1 -o "$root/FastBiDFA.olean" FastBiDFA.lean)
          python compact_ngram.py --data a0lb198-compact.json --namespace BB6.Agent19Raw40.A0LB1RECompact > Raw40A0LB198.lean
          lean -j1 -o Raw40A0LB198.olean Raw40A0LB198.lean | tee /tmp/a0lb198-lean.log
          python - <<'PY'
          import re
          s=open('/tmp/a0lb198-lean.log').read()
          assert not re.search(r'\b(sorryAx|native_decide)\b',s)
          for n in ['never','live_all']:
              m=re.search(r"'BB6\.Agent19Raw40\.A0LB1RECompact\.M198\."+n+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,n
              assert set(m[1].split(', ')) <= {'propext','Classical.choice','Quot.sound'},m[0]
          PY
      - uses: actions/upload-artifact@v4
        if: always() && inputs.target == 'raw40-a0lb198'
        with:
          name: raw40-a0lb198-source-audit
          path: |
            /tmp/a0lb198-regenerated.json
            /tmp/a0lb198-lean.log
            im-results/agent19-raw40-cut/Raw40A0LB198.lean
            im-results/agent19-raw40-cut/Raw40A0LB198.olean
            im-results/agent19-raw40-cut/FastBiDFA.olean
          if-no-files-found: error

      - name: Compile all A0LB child bounds and exact family maximum
        if: inputs.target == 'raw40-a0lb'
        env:
          LEAN_DEPS: /tmp/a19-raw40-deps
          WORKERS: "4"
        run: |
          set -euo pipefail
          bash im-results/agent19-raw40-cut/reproduce-A0LB.sh | tee /tmp/a19-raw40-a0lb.log
          python - <<'PY'
          import re
          s=open('/tmp/a19-raw40-a0lb.log').read()
          assert not re.search(r'\b(sorryAx|native_decide)\b',s)
          for n in ['children','all_quotient','exact_weighted']:
              m=re.search(r"'BB6\.Agent19Raw40\.A0LB\."+n+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,n
              assert set(m[1].split(', ')) <= {'propext','Classical.choice','Quot.sound'},m[0]
          PY
      - uses: actions/upload-artifact@v4
        if: always() && inputs.target == 'raw40-a0lb'
        with:
          name: raw40-a0lb-source-audit
          path: |
            /tmp/a19-raw40-a0lb.log
            /tmp/a19-raw40-pin.json
            im-results/agent19-raw40-cut/Raw40A0LB*.olean
            im-results/agent19-raw40-cut/a0lb/*/shards/*All.olean
            im-results/agent19-raw40-cut/a0lb/*/enum.log
            im-results/agent19-raw40-cut/a0lb/*/compact.json
          if-no-files-found: warn

      - name: Compile unary-run grammar proof for three A1LA residuals
        if: inputs.target == 'raw40-a1la-grammar'
        run: |
          set -euo pipefail
          cd im-results/agent19-raw40-cut
          export LEAN_PATH="$PWD:/tmp/a19-raw40-deps"
          lean -j1 -o Raw40A1LAUnaryGrammar.olean Raw40A1LAUnaryGrammar.lean | tee /tmp/a1la-grammar.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a1la-grammar.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always() && inputs.target == 'raw40-a1la-grammar'
        with:
          name: raw40-a1la-grammar
          path: |
            /tmp/a1la-grammar.log
            im-results/agent19-raw40-cut/Raw40A1LAUnaryGrammar.olean
          if-no-files-found: warn

      - name: Compile all A1LA child bounds and attained maximum
        if: inputs.target == 'raw40-a1la'
        env:
          LEAN_DEPS: /tmp/a19-raw40-deps
          WORKERS: "4"
        run: |
          set -euo pipefail
          bash im-results/agent19-raw40-cut/reproduce-A1LA.sh | tee /tmp/a19-raw40-a1la.log
          python - <<'PY'
          import re
          s=open('/tmp/a19-raw40-a1la.log').read()
          assert not re.search(r'\b(sorryAx|native_decide)\b',s)
          for n in ['children','all_quotient','exact_weighted']:
              m=re.search(r"'BB6\.Agent19Raw40\.A1LA\."+n+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,n
              assert set(m[1].split(', ')) <= {'propext','Classical.choice','Quot.sound'},m[0]
          PY
      - uses: actions/upload-artifact@v4
        if: always() && inputs.target == 'raw40-a1la'
        with:
          name: raw40-a1la-source-audit
          path: |
            /tmp/a19-raw40-a1la.log
            /tmp/a19-raw40-pin.json
            im-results/agent19-raw40-cut/Raw40A1LA*.olean
            im-results/agent19-raw40-cut/a1la/*/shards/*All.olean
            im-results/agent19-raw40-cut/a1la/*/enum.log
          if-no-files-found: warn

      - name: Compile five A1LC child bounds and direct sweep proofs
        if: inputs.target == 'raw40-a1lc-0lc'
        env:
          LEAN_DEPS: /tmp/a19-raw40-deps
          WORKERS: "4"
        run: |
          set -euo pipefail
          bash im-results/agent19-raw40-cut/reproduce-A1LC0LC.sh | tee /tmp/a19-raw40-a1lc-0lc.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a19-raw40-a1lc-0lc.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always() && inputs.target == 'raw40-a1lc-0lc'
        with:
          name: raw40-a1lc-0lc
          path: |
            /tmp/a19-raw40-a1lc-0lc.log
            im-results/agent19-raw40-cut/Raw40A1LC*.olean
            im-results/agent19-raw40-cut/a1lc/*/shards/*All.olean
          if-no-files-found: warn

      - name: Compile four complete Raw40 A1LB child bounds
        if: inputs.target == 'raw40-a1lb'
        env:
          LEAN_DEPS: /tmp/a19-raw40-deps
          WORKERS: "4"
        run: |
          set -euo pipefail
          bash im-results/agent19-raw40-cut/reproduce-A1LB.sh | tee /tmp/a19-raw40-a1lb.log
          python - <<'PY'
          import re
          s=open('/tmp/a19-raw40-a1lb.log').read()
          assert not re.search(r'\b(sorryAx|native_decide)\b',s)
          for c in ['1RD','1LB','0RD','0LB']:
              m=re.search(r"'BB6\.Agent19Raw40\.Raw40C1LB"+c+r"\.exact_weighted' depends on axioms: \[([^\]]*)\]",s)
              assert m,c
              assert set(m[1].split(', ')) <= {'propext','Classical.choice','Quot.sound'},m[0]
          PY
      - uses: actions/upload-artifact@v4
        if: always() && inputs.target == 'raw40-a1lb'
        with:
          name: raw40-a1lb-source-audit
          path: |
            /tmp/a19-raw40-a1lb.log
            im-results/agent19-raw40-cut/Raw40A1LB*.olean
            im-results/agent19-raw40-cut/a1lb/*/shards/*All.olean
          if-no-files-found: warn

      - name: Compile seven further Raw40 A1LB child bounds
        if: inputs.target == 'raw40-a1lb-next'
        env:
          LEAN_DEPS: /tmp/a19-raw40-deps
          WORKERS: "4"
        run: |
          set -euo pipefail
          bash im-results/agent19-raw40-cut/reproduce-A1LB.sh 0LD 1LD 1RA 1LC 0RB 1RB 1RC | tee /tmp/a19-raw40-a1lb-next.log
          python - <<'PY'
          import re
          s=open('/tmp/a19-raw40-a1lb-next.log').read()
          assert not re.search(r'\b(sorryAx|native_decide)\b',s)
          for c in ['0LD','1LD','1RA','1LC','0RB','1RB','1RC']:
              m=re.search(r"'BB6\.Agent19Raw40\.Raw40C1LB"+c+r"\.exact_weighted' depends on axioms: \[([^\]]*)\]",s)
              assert m,c
              assert set(m[1].split(', ')) <= {'propext','Classical.choice','Quot.sound'},m[0]
          PY
      - uses: actions/upload-artifact@v4
        if: always() && inputs.target == 'raw40-a1lb-next'
        with:
          name: raw40-a1lb-next-source-audit
          path: |
            /tmp/a19-raw40-a1lb-next.log
            im-results/agent19-raw40-cut/Raw40A1LB*.olean
            im-results/agent19-raw40-cut/a1lb/*/shards/*All.olean
          if-no-files-found: warn

      - name: Compile two remaining complete Raw40 A1LB child bounds
        if: inputs.target == 'raw40-a1lb-final-pair'
        env:
          LEAN_DEPS: /tmp/a19-raw40-deps
          WORKERS: "4"
        run: |
          set -euo pipefail
          bash im-results/agent19-raw40-cut/reproduce-A1LB.sh 0LE 1LE | tee /tmp/a19-raw40-a1lb-final-pair.log
          python - <<'PY'
          import re
          s=open('/tmp/a19-raw40-a1lb-final-pair.log').read()
          assert not re.search(r'\b(sorryAx|native_decide)\b',s)
          for c in ['0LE','1LE']:
              m=re.search(r"'BB6\.Agent19Raw40\.Raw40C1LB"+c+r"\.exact_weighted' depends on axioms: \[([^\]]*)\]",s)
              assert m,c
              assert set(m[1].split(', ')) <= {'propext','Classical.choice','Quot.sound'},m[0]
          PY
      - uses: actions/upload-artifact@v4
        if: always() && inputs.target == 'raw40-a1lb-final-pair'
        with:
          name: raw40-a1lb-final-pair-source-audit
          path: |
            /tmp/a19-raw40-a1lb-final-pair.log
            im-results/agent19-raw40-cut/Raw40A1LB*.olean
            im-results/agent19-raw40-cut/a1lb/*/shards/*All.olean
          if-no-files-found: warn

      - name: Compile long-period 0RC Raw40 A1LB child bounds
        if: inputs.target == 'raw40-a1lb-0rc'
        env:
          LEAN_DEPS: /tmp/a19-raw40-deps
          WORKERS: "4"
        run: |
          set -euo pipefail
          bash im-results/agent19-raw40-cut/reproduce-A1LB.sh 0RC | tee /tmp/a19-raw40-a1lb-0rc.log
          python - <<'PY'
          import re
          s=open('/tmp/a19-raw40-a1lb-0rc.log').read()
          assert not re.search(r'\b(sorryAx|native_decide)\b',s)
          for c in ['0RC']:
              m=re.search(r"'BB6\.Agent19Raw40\.Raw40C1LB"+c+r"\.exact_weighted' depends on axioms: \[([^\]]*)\]",s)
              assert m,c
              assert set(m[1].split(', ')) <= {'propext','Classical.choice','Quot.sound'},m[0]
          PY
      - uses: actions/upload-artifact@v4
        if: always() && inputs.target == 'raw40-a1lb-0rc'
        with:
          name: raw40-a1lb-0rc-source-audit
          path: |
            /tmp/a19-raw40-a1lb-0rc.log
            im-results/agent19-raw40-cut/Raw40A1LB*.olean
            im-results/agent19-raw40-cut/a1lb/*/shards/*All.olean
          if-no-files-found: warn

      - name: Compile complete Raw40 A1LB parent and attained maximum
        if: inputs.target == 'raw40-a1lb-all'
        env:
          LEAN_DEPS: /tmp/a19-raw40-deps
          WORKERS: "4"
        run: |
          set -euo pipefail
          bash im-results/agent19-raw40-cut/reproduce-A1LB.sh 0LB 0LD 0LE 0RB 0RC 0RD 0RE 1LB 1LC 1LD 1LE 1RA 1RB 1RC 1RD 1RE | tee /tmp/a19-raw40-a1lb-all.log
          python - <<'PY'
          import re
          s=open('/tmp/a19-raw40-a1lb-all.log').read()
          assert not re.search(r'\b(sorryAx|native_decide)\b',s)
          for n in ['children','all_quotient','exact_weighted']:
              m=re.search(r"'BB6\.Agent19Raw40\.A1LB\."+n+r"' depends on axioms: \[([^\]]*)\]",s)
              assert m,n
              assert set(m[1].split(', ')) <= {'propext','Classical.choice','Quot.sound'},m[0]
          PY
      - uses: actions/upload-artifact@v4
        if: always() && inputs.target == 'raw40-a1lb-all'
        with:
          name: raw40-a1lb-all-source-audit
          path: |
            /tmp/a19-raw40-a1lb-all.log
            im-results/agent19-raw40-cut/Raw40A1LB*.olean
            im-results/agent19-raw40-cut/CanonicalPartial.olean
            im-results/agent19-raw40-cut/Raw40Nores.olean
            im-results/agent19-raw40-cut/FastBiDFA.olean
            im-results/agent19-raw40-cut/a1lb/*/shards/*.olean
            im-results/agent19-raw40-cut/a1lb/*/enum.log
          if-no-files-found: warn
