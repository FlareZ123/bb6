name: Cryptid all safe packet and p2 reset source (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent25-cryptid-doublezero:im-results/agent35-cryptid-code:im-results/agent32-cryptid-third:im-results/agent32-cryptid-padding:im-results/agent31-d-exceptional:im-results/agent2-packet-shift:im-results/agent37-root-language-pilot:im-results/agent26-cryptid-e-gate:im-results/agent31-p2-k2-closure
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned original sources and Lean
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          python3 im-results/agent25-cryptid-doublezero/unpack.py
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check safe packets, p=2 reset, and seven-of-nine compositions
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          B=im-results/agent31-cryptid-boundary
          A=im-results/agent25-cryptid-doublezero
          C=im-results/agent35-cryptid-code
          S=im-results/agent32-cryptid-third
          P=im-results/agent32-cryptid-padding
          R=im-results/agent31-d-exceptional
          D=im-results/agent2-packet-shift
          E=im-results/agent26-cryptid-e-gate
          K=im-results/agent31-p2-k2-closure
          lean -o "$B/Boundary.olean" "$B/Boundary.lean"
          lean -o "$B/A1100.olean" "$B/A1100.lean"
          for module in DoubleZero TripleUniversalBase TripleUniversalCore TripleUniversalWalk TripleUniversal TenPump TokenCode; do
            lean -o "$A/$module.olean" "$A/$module.lean"
          done
          lean -o "$C/ABridgeCode.olean" "$C/ABridgeCode.lean"
          lean -o "$E/A1101010111.olean" "$E/A1101010111.lean" | tee axioms.log
          lean -o "$E/A1101010111Code.olean" "$E/A1101010111Code.lean" | tee -a axioms.log
          lean -o "$P/Generic.olean" "$P/Generic.lean"
          lean -o "$P/BoundaryPadding.olean" "$P/BoundaryPadding.lean"
          lean -o "$S/CryptidSix.olean" "$S/CryptidSix.lean"
          lean -o "$P/EZeroPair.olean" "$P/EZeroPair.lean"
          lean -o "$S/CryptidPairs.olean" "$S/CryptidPairs.lean"
          lean -o "$S/CryptidTriplePairs.olean" "$S/CryptidTriplePairs.lean"
          lean -o im-results/agent37-root-language-pilot/E110111Pairs.olean im-results/agent37-root-language-pilot/E110111Pairs.lean
          lean -o "$R/PacketSource.olean" "$R/PacketSource.lean"
          lean -o "$D/AOnePacketBoundarySource.olean" "$D/AOnePacketBoundarySource.lean" | tee -a axioms.log
          lean -o "$D/BoundaryBZero.olean" "$D/BoundaryBZero.lean" | tee -a axioms.log
          lean -o "$R/PacketRank.olean" "$R/PacketRank.lean"
          lean -o "$R/PacketPaths.olean" "$R/PacketPaths.lean"
          lean -o "$D/PacketSafeExit.olean" "$D/PacketSafeExit.lean"
          lean -o "$D/PacketNormalizeSource.olean" "$D/PacketNormalizeSource.lean"
          lean -o "$D/PacketOneReentry.olean" "$D/PacketOneReentry.lean" | tee -a axioms.log
          lean -o "$D/PacketZeroBoundarySource.olean" "$D/PacketZeroBoundarySource.lean" | tee -a axioms.log
          lean "$D/PacketSafeReentry.lean" | tee -a axioms.log
          lean -o "$D/PacketP2ResetSource.olean" "$D/PacketP2ResetSource.lean" | tee -a axioms.log
          lean -o "$D/AP2PacketBoundarySource.olean" "$D/AP2PacketBoundarySource.lean" | tee -a axioms.log
          lean -o "$K/P2K2Shapes.olean" "$K/P2K2Shapes.lean" | tee -a axioms.log
          lean -o "$K/P2K2Source.olean" "$K/P2K2Source.lean" | tee -a axioms.log
          lean -o "$K/P2K1Mod9Shapes.olean" "$K/P2K1Mod9Shapes.lean" | tee -a axioms.log
          lean -o "$K/P2K1Mod9Source.olean" "$K/P2K1Mod9Source.lean" | tee -a axioms.log
          if grep -E 'sorryAx|_native.native_decide' axioms.log; then exit 1; fi
