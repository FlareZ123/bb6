name: D-start guarded E cylinder original-source verification (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore SHA-verified original D-start Cryptid model
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unmodified original source and Agent 2 proof
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent2-cryptid-continuity:im-results/agent32-cryptid-third:im-results/agent25-cryptid-doublezero:im-results/agent35-cryptid-code
        run: |
          lean --version
          lean -o im-results/agent31-cryptid-boundary/Boundary.olean im-results/agent31-cryptid-boundary/Boundary.lean
          lean -o im-results/agent2-cryptid-continuity/EOneZeroHalt.olean im-results/agent2-cryptid-continuity/EOneZeroHalt.lean
          lean im-results/agent2-cryptid-continuity/ReturnGuard.lean
          lean -o im-results/agent32-cryptid-third/CryptidSix.olean im-results/agent32-cryptid-third/CryptidSix.lean
          lean -o im-results/agent2-cryptid-continuity/NoEarlierF.olean im-results/agent2-cryptid-continuity/NoEarlierF.lean
          lean -o im-results/agent2-cryptid-continuity/EOneTripleReturn.olean im-results/agent2-cryptid-continuity/EOneTripleReturn.lean
          lean -o im-results/agent2-cryptid-continuity/E111FirstReturn.olean im-results/agent2-cryptid-continuity/E111FirstReturn.lean
          lean -o im-results/agent2-cryptid-continuity/PrefixNoF.olean im-results/agent2-cryptid-continuity/PrefixNoF.lean
          lean im-results/agent2-cryptid-continuity/FullE111First.lean
          lean im-results/agent2-cryptid-continuity/BFirstReturn.lean
          lean im-results/agent2-cryptid-continuity/BoundaryShiftObstructions.lean
          lean im-results/agent2-cryptid-continuity/E6FirstReturn.lean
          lean -o im-results/agent2-cryptid-continuity/ATenFirstReturn.olean im-results/agent2-cryptid-continuity/ATenFirstReturn.lean
          python3 im-results/agent25-cryptid-doublezero/unpack.py
          for module in DoubleZero TripleUniversalBase TripleUniversalCore TripleUniversalWalk TripleUniversal TenPump TokenCode; do
            lean -o "im-results/agent25-cryptid-doublezero/$module.olean" "im-results/agent25-cryptid-doublezero/$module.lean"
          done
          lean -o im-results/agent35-cryptid-code/ABridgeCode.olean im-results/agent35-cryptid-code/ABridgeCode.lean
          lean im-results/agent2-cryptid-continuity/ACodeFirstReturn.lean
          lean im-results/agent2-cryptid-continuity/EOneTriplePairs.lean
