name: Agent 2 cryptid Lean kernel check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-cryptid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare proof and pin Lean version
        run: |
          python -m pip install filelock
          python im-results/agent2-unpack-proof.py
          python -c 'from pathlib import Path; Path("lean-toolchain").write_text("leanprover/lean4:v4.36.0-rc2\n")'
      - name: Install pinned Lean using elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Check complete source and axiom reports
        run: lean im-results/agent2-cryptid-proof.lean
