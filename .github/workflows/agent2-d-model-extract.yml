name: Agent 2 D original regular all-depth affine and quadratic time (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-verified-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEAN_PATH: im-results/agent35-d-regular-certificate:im-results/agent2-cryptid-continuity
    steps:
      - uses: actions/checkout@v4
      - name: Restore SHA256-checked unchanged eleven-row DRegular model
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent35-d-regular-certificate/restore_sources.py
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel audit unconditional one-step and all-depth shift
        run: |
          set -euo pipefail
          H=im-results/agent35-d-regular-certificate
          D=im-results/agent2-cryptid-continuity
          lean --version
          lean -o "$H/DRegular.olean" "$H/DRegular.lean"
          lean -o "$H/DTransport.olean" "$H/DTransport.lean"
          lean -o "$D/DRegularShift.olean" "$D/DRegularShift.lean"
          lean -o "$D/DRegularDurationShift.olean" "$D/DRegularDurationShift.lean"
          lean "$D/DRegularTimedShift.lean"
