name: Agent 2 complete D-regular original-source proof (manual)
on:
  workflow_dispatch:
    inputs:
      target:
        description: Proof target (full suite or A first-return)
        required: true
        type: choice
        options:
          - full
          - a_first
        default: full
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent35-d-regular-certificate:im-results/agent32-cryptid-padding:im-results/agent2-cryptid-continuity:im-results/agent25-cryptid-doublezero:im-results/agent35-cryptid-code:im-results/agent32-cryptid-third:im-results/agent4-cryptid-d0-review
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned original D sources and DRegular proof
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          python3 im-results/agent35-d-regular-certificate/restore_sources.py
          python3 im-results/agent25-cryptid-doublezero/unpack.py
          python3 im-results/agent2-cryptid-continuity/restore_a_regular.py
          python3 im-results/agent2-cryptid-continuity/restore_e_regular.py
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify all eleven D-regular return cases against original six-state source
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          B=im-results/agent31-cryptid-boundary
          P=im-results/agent32-cryptid-padding
          H=im-results/agent35-d-regular-certificate
          D=im-results/agent2-cryptid-continuity
          lean -o "$B/Boundary.olean" "$B/Boundary.lean"
          A=im-results/agent25-cryptid-doublezero
          C=im-results/agent35-cryptid-code
          for module in DoubleZero TripleUniversalBase TripleUniversalCore TripleUniversalWalk TripleUniversal TenPump TokenCode; do
            lean -o "$A/$module.olean" "$A/$module.lean"
          done
          lean -o "$C/ABridgeCode.olean" "$C/ABridgeCode.lean"
          lean -o "$H/DRegular.olean" "$H/DRegular.lean"
          lean -o "$H/DTransport.olean" "$H/DTransport.lean"
          lean -o "$H/DObservedTransport.olean" "$H/DObservedTransport.lean"
          lean -o "$P/Generic.olean" "$P/Generic.lean"
          lean -o "$P/BoundaryPadding.olean" "$P/BoundaryPadding.lean"
          lean -o "$H/DObsSourceCandidate.olean" "$H/DObsSourceCandidate.lean"
          lean -o "$D/BRegularSource.olean" "$D/BRegularSource.lean"
          lean -o "$D/AZeroSource.olean" "$D/AZeroSource.lean"
          lean -o "$D/EZeroSource.olean" "$D/EZeroSource.lean"
          lean -o "$D/AOneSource.olean" "$D/AOneSource.lean"
          if [ "${{ inputs.target }}" = "a_first" ]; then
            S=im-results/agent32-cryptid-third
            G=im-results/agent4-cryptid-d0-review
            lean -o "$S/CryptidSix.olean" "$S/CryptidSix.lean"
            lean -o "$D/NoEarlierF.olean" "$D/NoEarlierF.lean"
            lean -o "$D/EOneTripleReturn.olean" "$D/EOneTripleReturn.lean"
            lean -o "$D/E111FirstReturn.olean" "$D/E111FirstReturn.lean"
            lean -o "$D/PrefixNoF.olean" "$D/PrefixNoF.lean"
            lean -o "$B/A1100.olean" "$B/A1100.lean"
            lean -o "$B/A1100First.olean" "$B/A1100First.lean"
            lean -o "$G/AZeroOneFirstReturn.olean" "$G/AZeroOneFirstReturn.lean"
            lean -o "$S/CryptidPairs.olean" "$S/CryptidPairs.lean"
            lean -o "$D/BFirstReturn.olean" "$D/BFirstReturn.lean"
            lean -o "$G/ELowPhysicalFirstReturnRepair.olean" "$G/ELowPhysicalFirstReturnRepair.lean"
            lean -o "$G/ELowCanonicalBlankFirst.olean" "$G/ELowCanonicalBlankFirst.lean"
            lean "$G/UnaryFirstReturnComplete.lean"
            lean -o "$D/ATenFirstReturn.olean" "$D/ATenFirstReturn.lean"
            lean -o "$D/ACodeFirstReturn.olean" "$D/ACodeFirstReturn.lean"
            lean -o "$G/AImplicitCodeFirstReturn.olean" "$G/AImplicitCodeFirstReturn.lean"
            lean -o "$G/ACanonicalTwoTailFirst.olean" "$G/ACanonicalTwoTailFirst.lean"
            lean -o "$G/AImplicitOneTailFirstReturn.olean" "$G/AImplicitOneTailFirstReturn.lean"
            lean -o "$B/A1100CodeFirst.olean" "$B/A1100CodeFirst.lean"
            lean "$G/AImplicitDoubleTailFirst.lean"
            exit 0
          fi
          lean -o "$D/AWordAlgebra.olean" "$D/AWordAlgebra.lean"
          lean -o "$D/ATwoSource.olean" "$D/ATwoSource.lean"
          lean -o "$D/ARegularFull.olean" "$D/ARegularFull.lean"
          S=im-results/agent32-cryptid-third
          lean -o "$S/CryptidSix.olean" "$S/CryptidSix.lean"
          lean -o "$S/CryptidPairs.olean" "$S/CryptidPairs.lean"
          lean -o "$S/CryptidTriplePairs.olean" "$S/CryptidTriplePairs.lean"
          lean -o "$D/ERemaining.olean" "$D/ERemaining.lean"
          lean "$D/BlankRegular500.lean"
          lean -o "$D/BlankRegular8394.olean" "$D/BlankRegular8394.lean"
          lean -o "$P/EZeroPair.olean" "$P/EZeroPair.lean"
          lean -o "$C/EDouble.olean" "$C/EDouble.lean"
          lean -o "$P/EAllDouble.olean" "$P/EAllDouble.lean"
          lean "$D/BlankExceptional.lean"
          lean -o "$A/TripleIteration.olean" "$A/TripleIteration.lean"
          lean -o "$A/SixOnes.olean" "$A/SixOnes.lean"
          lean -o "$P/CodeImplicitNil.olean" "$P/CodeImplicitNil.lean"
          lean -o "$D/EAResidueTwoSource.olean" "$D/EAResidueTwoSource.lean"
          lean -o "$B/A1100.olean" "$B/A1100.lean"
          lean -o "$B/A110111.olean" "$B/A110111.lean"
          lean "$D/EAResidueOneSource.lean"
