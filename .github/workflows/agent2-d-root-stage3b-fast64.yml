name: D-root nineteenth reentry (split 512-step checkpoints)
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "1-3 arithmetic blocks; 4d completes the nineteenth blank-root reentry in one process; 4a/4b/4c/4e/4f are alternate experiments"
        required: true
        default: "1"
        type: choice
        options: ["1", "2", "3", "4a", "4b", "4c", "4d", "4e", "4f"]
      source_run_id:
        description: "Run ID containing the previous successful checkpoint artifact"
        required: true
        default: "44289033894"
        type: string
      previous_artifact:
        description: "Previous checkpoint artifact name"
        required: true
        default: "d-root-stage3a"
        type: string
      source_ref:
        description: "Pinned mathematical source snapshot used by d-root-stage3a"
        required: true
        default: "20509b53af45edce5b8a145e8714245d3d225cdd"
        type: string
      extension_ref:
        description: "Exact commit containing all split nineteenth proof modules"
        required: true
        default: "main"
        type: string
      previous_extension_ref:
        description: "Extension commit recorded in the predecessor artifact; defaults to extension_ref"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

env:
  LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent35-d-regular-certificate:im-results/agent32-cryptid-padding:im-results/agent2-cryptid-continuity:im-results/agent25-cryptid-doublezero:im-results/agent35-cryptid-code:im-results/agent32-cryptid-third:im-results/agent31-d-exceptional:im-results/agent35-d-sixth-rejoin:im-results/agent37-cryptid-model-bridge:im-results/agent2-packet-shift:im-results/agent37-d-timing-cocycle

jobs:
  audit:
    name: "Nineteenth root checkpoint ${{ inputs.stage }}"
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Checkout pinned mathematical source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source

      - name: Checkout proof-extension snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.extension_ref }}
          path: extension

      - name: Restore pinned original D sources and DRegular proof
        working-directory: source
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          python3 im-results/agent35-d-regular-certificate/restore_sources.py
          python3 im-results/agent25-cryptid-doublezero/unpack.py
          python3 im-results/agent2-cryptid-continuity/restore_a_regular.py
          python3 im-results/agent2-cryptid-continuity/restore_e_regular.py

      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download previous checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.previous_artifact }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: prior-artifact

      - name: Restore audited objects and install split proof modules
        working-directory: source
        env:
          STAGE: ${{ inputs.stage }}
          PREVIOUS_ARTIFACT: ${{ inputs.previous_artifact }}
          SOURCE_REF: ${{ inputs.source_ref }}
          EXTENSION_REF: ${{ inputs.extension_ref }}
          PREVIOUS_EXTENSION_REF: ${{ inputs.previous_extension_ref }}
        run: |
          set -euo pipefail
          actual_source=$(git rev-parse HEAD)
          actual_extension=$(git -C ../extension rev-parse HEAD)
          if [[ "$actual_source" != "$SOURCE_REF" ]]; then
            echo "Mathematical source mismatch: expected=$SOURCE_REF actual=$actual_source" >&2
            exit 1
          fi
          if [[ "$EXTENSION_REF" =~ ^[0-9a-f]{40}$ && "$actual_extension" != "$EXTENSION_REF" ]]; then
            echo "Proof extension mismatch: expected=$EXTENSION_REF actual=$actual_extension" >&2
            exit 1
          fi
          cp ../prior-artifact/lean-audit.log lean-audit.log
          tar -xzf ../prior-artifact/lean-stage.tar.gz -C .
          prior_source_ref=$(cat im-results/.d-root-source-ref)
          if [[ "$prior_source_ref" != "$SOURCE_REF" ]]; then
            echo "Predecessor mathematical source mismatch: $prior_source_ref" >&2
            exit 1
          fi
          if [[ -f im-results/.d-root-stage3b-extension-ref ]]; then
            prior_extension_ref=$(cat im-results/.d-root-stage3b-extension-ref)
            expected_previous_extension="${PREVIOUS_EXTENSION_REF:-$actual_extension}"
            if [[ "$prior_extension_ref" != "$expected_previous_extension" ]]; then
              echo "Nineteenth proof extension mismatch: predecessor=$prior_extension_ref expected=$expected_previous_extension" >&2
              exit 1
            fi
          elif [[ "$STAGE" != "1" ]]; then
            echo "Missing nineteenth proof-extension marker in predecessor artifact" >&2
            exit 1
          fi

          T=im-results/agent37-d-timing-cocycle
          for module in NineteenthBlock1.lean NineteenthBlock2.lean NineteenthBlock3.lean NineteenthTail5684.lean NineteenthFastBlock.lean NineteenthFastPrefix.lean NineteenthTerminalCertificate.lean NineteenthRootPrefix.lean BlankNineteenthRejoin.lean NineteenthReentryComplete.lean; do
            cp "../extension/$T/$module" "$T/$module"
          done

          case "$STAGE" in
            1) expected_artifact="d-root-stage3a"; required_modules=("$T/BlankEighteenthRejoin.olean" "$T/BlankSixteenthRejoin.olean" "im-results/agent2-cryptid-continuity/DRegularFast.olean"); source_file="$T/NineteenthBlock1.lean"; audit_decl="block19_1_exact" ;;
            2) expected_artifact="d-root-stage3b1"; required_modules=("$T/NineteenthBlock1.olean"); source_file="$T/NineteenthBlock2.lean"; audit_decl="block19_2_exact" ;;
            3) expected_artifact="d-root-stage3b2"; required_modules=("$T/NineteenthBlock2.olean"); source_file="$T/NineteenthBlock3.lean"; audit_decl="terminal1588_exact" ;;
            4a) expected_artifact="d-root-stage3b3"; required_modules=("$T/NineteenthBlock3.olean"); source_file="$T/NineteenthTail5684.lean"; audit_decl="tail5684_exact" ;;
            4b) expected_artifact="d-root-stage3b4a"; required_modules=("$T/NineteenthTail5684.olean"); source_file="$T/NineteenthTerminalCertificate.lean"; audit_decl="terminal9780_exact" ;;
            4c) expected_artifact="d-root-stage3b3"; required_modules=("$T/NineteenthBlock3.olean"); source_file="$T/NineteenthFastBlock.lean"; audit_decl="run_blockedWith" ;;
            4d) expected_artifact="d-root-stage3b3"; required_modules=("$T/NineteenthBlock2.olean" "$T/BlankEighteenthRejoin.olean" "im-results/agent25-cryptid-doublezero/ExceptionalAGeneral.olean" "im-results/agent2-cryptid-continuity/DRegularFast.olean"); source_file="$T/NineteenthReentryComplete.lean"; audit_decl="blank_nineteenth_reentry" ;;
            4e) expected_artifact="d-root-stage3b4c"; required_modules=("$T/NineteenthFastBlock.olean"); source_file="$T/NineteenthFastPrefix.lean"; audit_decl="fast512_16_seed19" ;;
            4f) expected_artifact="d-root-stage3b4e"; required_modules=("$T/NineteenthFastPrefix.olean"); source_file="$T/NineteenthTerminalCertificate.lean"; audit_decl="terminal9780_exact" ;;
            5) expected_artifact="d-root-stage3b4d"; required_modules=("$T/NineteenthTerminalCertificate.olean"); source_file="$T/NineteenthRootPrefix.lean"; audit_decl="blank_nineteenth_exception" ;;
            6) expected_artifact="d-root-stage3b5"; required_modules=("$T/NineteenthRootPrefix.olean"); source_file="$T/BlankNineteenthRejoin.lean"; audit_decl="blank_nineteenth_reentry" ;;
            *) echo "Unknown stage: $STAGE" >&2; exit 2 ;;
          esac
          if [[ "$PREVIOUS_ARTIFACT" != "$expected_artifact" ]]; then
            echo "Stage $STAGE requires $expected_artifact, got $PREVIOUS_ARTIFACT" >&2
            exit 1
          fi
          for module in "${required_modules[@]}"; do
            if [[ ! -f "$module" ]]; then
              echo "Stage $STAGE is missing predecessor module $module" >&2
              exit 1
            fi
          done
          printf '%s\n' "$SOURCE_REF" > im-results/.d-root-source-ref
          printf '%s\n' "$actual_extension" > im-results/.d-root-stage3b-extension-ref
          echo "Pinned mathematical source: $actual_source"
          echo "Proof extension source: $actual_extension"

      - name: Compile selected checkpoint and audit axioms
        working-directory: source
        shell: bash
        env:
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          exec > >(tee -a lean-audit.log) 2>&1
          T=im-results/agent37-d-timing-cocycle
          case "$STAGE" in
            1) source_file="$T/NineteenthBlock1.lean"; audit_decl="block19_1_exact" ;;
            2) source_file="$T/NineteenthBlock2.lean"; audit_decl="block19_2_exact" ;;
            3) source_file="$T/NineteenthBlock3.lean"; audit_decl="terminal1588_exact" ;;
            4a) source_file="$T/NineteenthTail5684.lean"; audit_decl="" ;;
            4b) source_file="$T/NineteenthTerminalCertificate.lean"; audit_decl="terminal9780_exact" ;;
            4c) source_file="$T/NineteenthFastBlock.lean"; audit_decl="run_blockedWith" ;;
            4d) source_file="$T/NineteenthReentryComplete.lean"; audit_decl="blank_nineteenth_reentry" ;;
            4e) source_file="$T/NineteenthFastPrefix.lean"; audit_decl="fast512_16_seed19" ;;
            4f) source_file="$T/NineteenthTerminalCertificate.lean"; audit_decl="terminal9780_exact" ;;

          esac
          lean --version
          lean -DmaxRecDepth=55000 -o "${source_file%.lean}.olean" "$source_file"
          if [[ -n "$audit_decl" ]] && ! grep -Eq "$audit_decl.*depends on axioms:" lean-audit.log; then
            echo "Missing #print axioms output for $audit_decl" >&2
            exit 1
          fi
          python3 - <<'PY'
          import re
          import sys
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          unexpected = []
          with open("lean-audit.log", encoding="utf-8") as log:
              for line in log:
                  match = re.search(r"depends on axioms:\s*\[([^]]*)\]", line)
                  if match:
                      actual = {name.strip() for name in match.group(1).split(",") if name.strip()}
                      extra = actual - allowed
                      if extra:
                          unexpected.append((line.strip(), sorted(extra)))
          if unexpected:
              for line, extra in unexpected:
                  print(f"Unexpected axiom(s) {extra}: {line}")
              sys.exit(1)
          PY
          if grep -Eq 'sorryAx|native_decide' lean-audit.log; then
            echo "Rejected forbidden axiom dependency" >&2
            exit 1
          fi
          find im-results -type f \( -name '*.olean' -o -name '.d-root-source-ref' -o -name '.d-root-stage3b-extension-ref' \) -print0 | tar --null -czf lean-stage.tar.gz --files-from=-

      - name: Preserve intermediate nineteenth checkpoint
        if: ${{ success() && inputs.stage != '6' }}
        uses: actions/upload-artifact@v4
        with:
          name: d-root-stage3b${{ inputs.stage }}
          path: |
            source/lean-stage.tar.gz
            source/lean-audit.log
          if-no-files-found: error
          retention-days: 90

      - name: Preserve final nineteenth-reentry checkpoint
        if: ${{ success() && inputs.stage == '6' }}
        uses: actions/upload-artifact@v4
        with:
          name: d-root-stage3b
          path: |
            source/lean-stage.tar.gz
            source/lean-audit.log
          if-no-files-found: error
          retention-days: 90
