name: Agent 2 original-source D exceptional third checkpoint (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent35-cryptid-code:im-results/agent32-cryptid-padding:im-results/agent31-d-exceptional:im-results/agent2-cryptid-continuity:im-results/agent2-d-even-ladder
    steps:
      - uses: actions/checkout@v4
      - name: Recover pinned original D-start source
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile source chain through exact three-return theorem
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          B=im-results/agent31-cryptid-boundary
          S=im-results/agent32-cryptid-third
          D=im-results/agent2-cryptid-continuity
          P=im-results/agent32-cryptid-padding
          E=im-results/agent31-d-exceptional
          A=im-results/agent35-cryptid-code
          lean -o "$B/Boundary.olean" "$B/Boundary.lean"
          lean -o "$S/CryptidSix.olean" "$S/CryptidSix.lean"
          lean -o "$S/CryptidPairs.olean" "$S/CryptidPairs.lean"
          lean -o "$S/CryptidTriplePairs.olean" "$S/CryptidTriplePairs.lean"
          lean -o "$A/EDouble.olean" "$A/EDouble.lean"
          lean -o "$P/Generic.olean" "$P/Generic.lean"
          lean -o "$P/BoundaryPadding.olean" "$P/BoundaryPadding.lean"
          lean -o "$E/ESecondSource.olean" "$E/ESecondSource.lean"
          lean -o "$D/NoEarlierF.olean" "$D/NoEarlierF.lean"
          lean -o "$D/PrefixENoFSource.olean" "$D/PrefixENoFSource.lean"
          lean -o "$D/ETripleBoundarySource.olean" "$D/ETripleBoundarySource.lean"
          lean -o "$D/ETripleFullSource.olean" "$D/ETripleFullSource.lean"
          lean -o "$D/ETripleLadderSource.olean" "$D/ETripleLadderSource.lean"
          lean -o "$D/ETripleLadderIndex.olean" "$D/ETripleLadderIndex.lean"
          lean -o "$D/EThirdSource.olean" "$D/EThirdSource.lean"
          lean -o "$D/ERegularLadderSource.olean" "$D/ERegularLadderSource.lean"
          lean -o "$D/ERegularLadderSafe.olean" "$D/ERegularLadderSafe.lean"
          Q=im-results/agent2-d-even-ladder
          lean -o "$Q/DEvenBridge.olean" "$Q/DEvenBridge.lean"
          lean -o "$Q/DCostLower.olean" "$Q/DCostLower.lean"
          lean -o "$Q/DComplexity.olean" "$Q/DComplexity.lean"
          lean -o "$D/EAllDepthSource.olean" "$D/EAllDepthSource.lean"
          lean -o "$D/EAllDepthSafe.olean" "$D/EAllDepthSafe.lean"
          lean "$D/EInputLengthSafe.lean"
      - name: Independently simulate literal unaccelerated original six-state transitions
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 im-results/agent2-cryptid-continuity/check_original_regular_depth.cpp -o /tmp/check-original-D
          /tmp/check-original-D
