name: Cryptid guarded packet safe-exit theorem (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEAN_PATH: im-results/agent31-d-exceptional:im-results/agent2-packet-shift
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check original PacketRank and safe-exit theorem
        shell: bash
        run: |
          set -euo pipefail
          R=im-results/agent31-d-exceptional
          P=im-results/agent2-packet-shift
          lean --version
          lean -o "$R/PacketRank.olean" "$R/PacketRank.lean"
          lean "$P/PacketSafeExit.lean"
