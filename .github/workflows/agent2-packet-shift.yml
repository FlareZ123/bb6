name: Agent 2 original D packet shift source audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify complete original source chain and packet path synchrony
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent31-d-exceptional:im-results/agent2-packet-shift:im-results/agent37-root-language-pilot:im-results/agent2-cryptid-continuity:im-results/agent36-cryptid-trace
        run: |
          set -euo pipefail
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          lean --version
          B=im-results/agent31-cryptid-boundary
          S=im-results/agent32-cryptid-third
          R=im-results/agent31-d-exceptional
          P=im-results/agent2-packet-shift
          lean -o "$B/Boundary.olean" "$B/Boundary.lean"
          lean -o "$S/CryptidSix.olean" "$S/CryptidSix.lean"
          lean -o "$S/CryptidPairs.olean" "$S/CryptidPairs.lean"
          lean -o "$S/CryptidTriplePairs.olean" "$S/CryptidTriplePairs.lean"
          lean -o "$R/PacketSource.olean" "$R/PacketSource.lean"
          lean -o "$R/PacketPaths.olean" "$R/PacketPaths.lean"
          lean -o "$P/PacketShift.olean" "$P/PacketShift.lean"
          lean -o im-results/agent37-root-language-pilot/E110111Pairs.olean im-results/agent37-root-language-pilot/E110111Pairs.lean
          lean "$P/PacketEscape.lean"
          lean "$P/ELowSecond.lean"
          lean -o "$P/EGenericTurn.olean" "$P/EGenericTurn.lean"
          lean -o "$P/ATurnFamily.olean" "$P/ATurnFamily.lean"
          lean -o im-results/agent2-cryptid-continuity/NoEarlierF.olean im-results/agent2-cryptid-continuity/NoEarlierF.lean
          lean "$P/EAltPacket.lean"
          lean -o "$P/EAltBoundaryFirst.olean" "$P/EAltBoundaryFirst.lean"
          lean -o im-results/agent2-cryptid-continuity/PrefixENoFSource.olean im-results/agent2-cryptid-continuity/PrefixENoFSource.lean
          lean "$P/EAltFullFirst.lean"
          lean -o "$P/EGenericFullFirst.olean" "$P/EGenericFullFirst.lean"
          lean -o im-results/agent36-cryptid-trace/EDoubleTripleGeneral.olean im-results/agent36-cryptid-trace/EDoubleTripleGeneral.lean
          lean -o "$P/AIterDoubleZero.olean" "$P/AIterDoubleZero.lean"
          lean -o "$P/AIterDoubleZeroFirst.olean" "$P/AIterDoubleZeroFirst.lean"
          lean -o "$P/EIterDoubleZeroFullFirst.olean" "$P/EIterDoubleZeroFullFirst.lean"
          lean "$P/EIterDoubleZeroPacket.lean"
