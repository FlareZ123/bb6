name: One-shot trigger for D-root stage 3
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  stage3:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'retire one-shot') }}
