name: Seed31 first-stop kernel certificate (artifact reuse)
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed staged D-root run containing d-root-seed31-audit
        required: true
        type: string
      source_ref:
        description: Exact source commit used by the staged root audit
        required: true
        default: "2da159d86fa86d813bdfbc54e38e3ec9c75b6e69"
        type: string
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      source_ref:
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent35-d-regular-certificate:im-results/agent32-cryptid-padding:im-results/agent2-cryptid-continuity:im-results/agent25-cryptid-doublezero:im-results/agent35-cryptid-code:im-results/agent32-cryptid-third:im-results/agent31-d-exceptional:im-results/agent35-d-sixth-rejoin:im-results/agent37-cryptid-model-bridge:im-results/agent2-packet-shift:im-results/agent37-d-timing-cocycle:im-results/agent2-root-language-exit
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Checkout exact source snapshot used by the staged audit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
      - name: Checkout current proof submission
        uses: actions/checkout@v4
        with:
          ref: main
          path: proof
      - name: Restore pinned original D sources and DRegular proof
        working-directory: source
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          python3 im-results/agent35-d-regular-certificate/restore_sources.py
          python3 im-results/agent25-cryptid-doublezero/unpack.py
          python3 im-results/agent2-cryptid-continuity/restore_a_regular.py
          python3 im-results/agent2-cryptid-continuity/restore_e_regular.py
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download completed staged root-audit artifact
        uses: actions/download-artifact@v4
        with:
          name: d-root-seed31-audit
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: source-artifact
      - name: Restore audited Lean objects, prior log, and proof submission
        run: |
          cp source-artifact/lean-audit.log source/lean-audit.log
          cp source-artifact/seed31-probe.txt source/prior-seed31-probe.txt
          tar -xzf source-artifact/lean-stage.tar.gz -C source
          mkdir -p source/im-results/agent2-root-language-exit
          cp proof/im-results/agent2-root-language-exit/Seed31FirstStopCertificate.lean source/im-results/agent2-root-language-exit/Seed31FirstStopCertificate.lean
          cp proof/im-results/agent2-root-language-exit/BlankThirtyFirstRejoin.lean source/im-results/agent2-root-language-exit/BlankThirtyFirstRejoin.lean
          cp proof/im-results/agent2-root-language-exit/BlankThirtySecondRejoin.lean source/im-results/agent2-root-language-exit/BlankThirtySecondRejoin.lean
      - name: Compile probe module and kernel-check first-stop/source-lift theorem
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a lean-audit.log) 2>&1
          lean --version
          T=im-results/agent37-d-timing-cocycle
          R=im-results/agent2-root-language-exit
          lean -DmaxRecDepth=55000 -o "$T/Seed31Probe.olean" "$T/Seed31Probe.lean" | tee seed31-probe.txt
          lean -DmaxRecDepth=55000 -o "$R/Seed31FirstStopCertificate.olean" "$R/Seed31FirstStopCertificate.lean"
          lean -DmaxRecDepth=55000 -o "$R/BlankThirtyFirstRejoin.olean" "$R/BlankThirtyFirstRejoin.lean"
          lean -DmaxRecDepth=55000 -o "$R/BlankThirtySecondRejoin.olean" "$R/BlankThirtySecondRejoin.lean"
          if grep -Eq 'sorryAx|native_decide' lean-audit.log; then
            echo "Rejected forbidden axiom dependency" >&2
            exit 1
          fi
      - name: Preserve first-stop certificate and probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed31-first-stop-certificate
          path: |
            source/lean-audit.log
            source/prior-seed31-probe.txt
            source/seed31-probe.txt
            source/im-results/agent2-root-language-exit/Seed31FirstStopCertificate.olean
          if-no-files-found: warn
