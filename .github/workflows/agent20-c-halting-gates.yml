name: Agent 20 Machine C parity gate refinement (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact source-connected Machine C proofs
        run: |
          mkdir -p /tmp/agent20-gates
          cp im-results/agent11-c-line/CLine.lean /tmp/agent20-gates/
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/agent20-gates/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/agent20-gates/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef,FastSectionProof,FastSectionHalting,Agent46CBridge}.lean /tmp/agent20-gates/
          cp im-results/agent3-c-odd-image/Agent3CImage.lean /tmp/agent20-gates/
          cp im-results/agent38-c-section-mod4/Agent38SectionParity.lean /tmp/agent20-gates/
          cp im-results/agent15-c-halting/{BounceHalting,SectionHalting,SectionPower,BlankHalting,SectionParam,BlankParam,SectionMod8,SectionAffineInverse}.lean /tmp/agent20-gates/
          cp im-results/agent20-c-halting-gates/{GateArithmetic,GatewayRefinement,GateArithmeticEight,GatewayRefinementEight,SectionRightOne}.lean /tmp/agent20-gates/
          cd /tmp/agent20-gates
          base64 -d "$GITHUB_WORKSPACE/im-results/agent20-c-halting-gates/proof-seven.tar.xz.b64" > proof-seven.tar.xz
          echo "d149400785df8bb6262a985e6b1f2cd311333e34fc561092cab4de89b7e6e791  proof-seven.tar.xz" | sha256sum -c -
          tar -xJf proof-seven.tar.xz
          export LEAN_PATH="."
          lean --version
          for f in CLine GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef FastSectionProof FastSectionHalting Agent46CBridge Agent38SectionParity Agent3CImage BounceHalting SectionHalting SectionPower BlankHalting SectionParam BlankParam SectionMod8 SectionAffineInverse GateArithmetic GatewayRefinement GateArithmeticEight; do
            lean -o "$f.olean" "$f.lean"
          done
          lean -o GatewayRefinementEight.olean GatewayRefinementEight.lean
          lean -o SectionRightOne.olean SectionRightOne.lean
          lean -o InverseSeven.olean InverseSeven.lean
          lean SectionSeven.lean
