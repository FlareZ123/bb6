name: Agent20 Space Needle logarithmic growth source theorem (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned original Lean toolchain
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone exact original Cryptids machine
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          git -C /tmp/cryptids checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git -C /tmp/cryptids rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Build upstream dependencies and the original machine
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB1LA_1LC0RE_1LF1LD_0RB0LA_1RC1RE_HHH0LD
      - name: Audit source-connected unconditional step growth and conditional orbit bound
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/SpaceNeedleClosed.lean" .
          lake env lean -o .lake/build/lib/lean/SpaceNeedleClosed.olean SpaceNeedleClosed.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleGrowth.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleGrowth.olean NeedleGrowth.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleGrowthSource.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleGrowthSource.olean NeedleGrowthSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleGrowthFinite.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleGrowthFinite.olean NeedleGrowthFinite.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/SpaceNeedleRawBridge.lean" .
          lake env lean -o .lake/build/lib/lean/SpaceNeedleRawBridge.olean SpaceNeedleRawBridge.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleGrowthRoot.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleGrowthRoot.olean NeedleGrowthRoot.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleGrowthScan.lean" .
          lake env lean NeedleGrowthScan.lean
