name: Agent20 Space Needle source-level 3/4/5 potential theorem (manual)
on:
  workflow_dispatch:
    inputs:
      cancellation_r12:
        description: 'Run exact GMP initial cancellation-feeder r=12 parent scan, not Lean'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  source-potential:
    if: ${{ !inputs.cancellation_r12 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned original Lean toolchain
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone exact original Cryptids machine
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          git -C /tmp/cryptids checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git -C /tmp/cryptids rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Build original machine using pinned upstream source
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB1LA_1LC0RE_1LF1LD_0RB0LA_1RC1RE_HHH0LD
      - name: Compile original-source three valuation potential theorems
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/SpaceNeedleClosed.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-unified-hensel/IndexPotential.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-unified-hensel/SpaceNeedlePotentialSource.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-mixed-branch/MixedValuationDisjoint.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-mixed-branch/NeedleMixedValuationSource.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-mixed-branch/MixedPotentialGeneral.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-mixed-branch/NeedleMixedPotentialSource.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-mixed-branch/NoUpward.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-mixed-branch/NoUpwardSource.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-mixed-branch/AdjacentEven.lean" .
          for module in SpaceNeedleClosed IndexPotential SpaceNeedlePotentialSource MixedValuationDisjoint NeedleMixedValuationSource MixedPotentialGeneral NeedleMixedPotentialSource NoUpward NoUpwardSource AdjacentEven; do
            lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean" 2>&1 | tee "$module.source.log"
          done
          if grep -E 'sorryAx|native_decide|Lean.ofReduceBool' IndexPotential.source.log SpaceNeedlePotentialSource.source.log MixedValuationDisjoint.source.log NeedleMixedValuationSource.source.log MixedPotentialGeneral.source.log NeedleMixedPotentialSource.source.log NoUpward.source.log NoUpwardSource.source.log AdjacentEven.source.log; then
            echo "Non-kernel proof axiom rejected" >&2
            exit 1
          fi
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('SpaceNeedlePotentialSource.source.log').read_text()
          expected=['allValuationsSource','valuationThreeSource','valuationFourSource','valuationFiveSource']
          expected.append('allValuationsPotential')
          for name in expected:
              hit=re.search(r"'BB6\.Agent20NeedlePotentialSource\."+name+r"' depends on axioms: \[([^\]]*)\]",s)
              assert hit, name
              axioms={x.strip() for x in hit[1].split(',')}
              assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
          for source, names in [('MixedValuationDisjoint.source.log',['no_three_then_five','no_five_then_three']), ('NeedleMixedValuationSource.source.log',['no_three_then_five_source','no_five_then_three_source']), ('MixedPotentialGeneral.source.log',['gap_from_potential','immediate_gap','cross_step_identity']), ('NeedleMixedPotentialSource.source.log',['mixed_source_gap','no_immediate_switch','source_cross_step']), ('NoUpward.source.log',['potential_correction_strict','no_upward_division']), ('NoUpwardSource.source.log',['no_upward_source']), ('AdjacentEven.source.log',['adjacent_even_power','adjacent_even_gap'])]:
              txt=pathlib.Path(source).read_text()
              namespace={'MixedValuationDisjoint.source.log':'BB6.Agent20MixedValuation','NeedleMixedValuationSource.source.log':'BB6.Agent20NeedleMixedSource','MixedPotentialGeneral.source.log':'BB6.Agent20MixedPotentialGeneral','NeedleMixedPotentialSource.source.log':'BB6.Agent20NeedleMixedPotentialSource','NoUpward.source.log':'BB6.Agent20NoUpward','NoUpwardSource.source.log':'BB6.Agent20NoUpwardSource','AdjacentEven.source.log':'BB6.Agent20AdjacentEven'}[source]
              for name in names:
                  hit=re.search(r"'"+namespace+r"\."+name+r"' depends on axioms: \[([^\]]*)\]",txt)
                  assert hit, (source,name)
                  axioms={x.strip() for x in hit[1].split(',')}
                  assert axioms <= {'propext','Classical.choice','Quot.sound'}, (name,axioms)
          print('PASS: source potential and mixed branch kernels, standard axioms only')
          PY

  cancellation-r12:
    if: ${{ inputs.cancellation_r12 }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Compile existing exact sparse GMP root parent enumerator
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgmp-dev
          g++ -O3 -std=c++17 -fopenmp im-results/agent48-needle-r10/needle11.cpp -lgmpxx -lgmp -o /tmp/needle-r12
          sha256sum im-results/agent48-needle-r10/needle11.cpp
          echo "GITHUB_SHA=$GITHUB_SHA"
      - name: Exhaust r12 initial-parent valuation range from source-derived cutoff
        run: |
          set -euo pipefail
          export OMP_NUM_THREADS=4
          /tmp/needle-r12 12 1 0 1 1 6000000 | tee /tmp/needle-r12.log
          python3 - <<'PY'
          import re,pathlib,math
          s=pathlib.Path('/tmp/needle-r12.log').read_text()
          assert 'LARGE_UNRESOLVED' not in s,s[-1000:]
          result=[line for line in s.splitlines() if line.startswith('r=12 c=1')]
          assert len(result)==1,result
          line=result[0]
          print('FINITE_SCAN:',line)
          d=dict(re.findall(r'(\w+)=([^\s]+)',line))
          n=9**12
          a=(n+5)//2
          cutoff=math.isqrt(16*12*a-1)
          assert d['range']==f'1..{cutoff}',(d['range'],cutoff)
          assert int(d['sieve'])+int(d['sparse'])+int(d['exact'])==cutoff
          assert int(d['largeZero'])==0
          print('PASS: exact coverage of all initially admissible valuation indices, cutoff=',cutoff)
          print('PARENTS:',d.get('parents',''))
          PY
      - name: Preserve reproducible r12 computational log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent20-space-needle-r12-raw
          path: /tmp/needle-r12.log
          if-no-files-found: warn
