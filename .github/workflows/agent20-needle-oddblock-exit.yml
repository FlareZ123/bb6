name: Agent20 odd-block-exit terminal constraint (Lean source proof)

on:
  push:
    paths:
      - "im-results/agent20-needle-coprime/NeedleOddBlockExit.lean"
      - ".github/workflows/agent20-needle-oddblock-exit.yml"
  pull_request:
    paths:
      - "im-results/agent20-needle-coprime/NeedleOddBlockExit.lean"
      - "im-results/agent20-needle-coprime/OddBlockExitTerminal.md"
      - ".github/workflows/agent20-needle-oddblock-exit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install original Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned original Cryptids
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          git -C /tmp/cryptids checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git -C /tmp/cryptids rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Restore source and dependencies
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB1LA_1LC0RE_1LF1LD_0RB0LA_1RC1RE_HHH0LD
      - name: Compile exact odd-block exit terminal constraint
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          base="$GITHUB_WORKSPACE/im-results/agent48-space-needle"
          cp "$base/SpaceNeedleClosed.lean" .
          lake env lean -o .lake/build/lib/lean/SpaceNeedleClosed.olean SpaceNeedleClosed.lean
          cp "$base/SpaceNeedleOddBlocksSource.lean" .
          lake env lean -o .lake/build/lib/lean/SpaceNeedleOddBlocksSource.olean SpaceNeedleOddBlocksSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleOddBlockExit.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleOddBlockExit.olean NeedleOddBlockExit.lean
          lake env lean NeedleOddBlockExit.lean
