name: Agent20 infinite Space Needle three-terminal feeder proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install original Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned original Cryptids
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          git -C /tmp/cryptids checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git -C /tmp/cryptids rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Restore source and dependencies
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB1LA_1LC0RE_1LF1LD_0RB0LA_1RC1RE_HHH0LD
      - name: Audit upstream source theorem
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/SpaceNeedleClosed.lean" .
          lake env lean -o .lake/build/lib/lean/SpaceNeedleClosed.olean SpaceNeedleClosed.lean
          base="$GITHUB_WORKSPACE/im-results/agent20-needle-coprime"
          for f in NeedleValHalf NeedleInverseComplete NeedleGeneralInverse NeedlePeriodCore NeedlePeriodTriple NeedleAffineParent NeedleThreeTerminalParents NeedleTerminalAffineSource CancellationTopStrip CancellationTopConstructive CancellationTerminalConstructive; do
            cp "$base/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
          # Agent 47: infinite source-linked valuation-four cancellation parents.
          cp "$GITHUB_WORKSPACE/im-results/agent47-needle-cancellation-parent4/NeedleCancelMod35.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleCancelMod35.olean NeedleCancelMod35.lean
          cp "$GITHUB_WORKSPACE/im-results/agent47-needle-cancellation-parent4/NeedleCancellationFour.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleCancellationFour.olean NeedleCancellationFour.lean
          for f in CancellationMod5 CancellationMod5SourceEq CancellationOriginalBridge NeedleTripleDistinctSource NeedleThreeTerminalSource NeedleVariableValuation NeedleVariableValuationSource; do
            cp "$base/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
          # Agent20: three-prime inverse obstruction and new valuation-two feeder.
          base64 -d "$base/CancellationMod7Joint.lean.xz.b64" | xz -dc > CancellationMod7Joint.lean
          echo "ac8f3b0b01d6301bed6d4bbd3e87a706ccd8cc1b30ff7bbf237a3134d694ec02  CancellationMod7Joint.lean" | sha256sum -c -
          lake env lean -o .lake/build/lib/lean/CancellationMod7Joint.olean CancellationMod7Joint.lean
          base64 -d "$base/CancellationMod13Joint.lean.xz.b64" | xz -dc > CancellationMod13Joint.lean
          echo "fc7bd12031bf075027d3449257692aaf2bd00ed43acbb29a3905de9000bbce03  CancellationMod13Joint.lean" | sha256sum -c -
          lake env lean -o .lake/build/lib/lean/CancellationMod13Joint.olean CancellationMod13Joint.lean
          base64 -d "$base/CancellationParentTwo.lean.xz.b64" | xz -dc > CancellationParentTwo.lean
          echo "acae5b6f4f6456413d62d053486590d8d17ec909eee43e9e9530963d30a9f002  CancellationParentTwo.lean" | sha256sum -c -
          lake env lean -o .lake/build/lib/lean/CancellationParentTwo.olean CancellationParentTwo.lean
          cp "$base/CancellationParentTwoSource.lean" .
          lake env lean -o .lake/build/lib/lean/CancellationParentTwoSource.olean CancellationParentTwoSource.lean
