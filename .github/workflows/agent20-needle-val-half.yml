name: Agent 20 Space Needle terminal valuation bound (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile arithmetic bound and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH=".:$(lean --print-prefix)/lib/lean"
          cd im-results/agent20-needle-coprime
          lean -o NeedleValHalf.olean NeedleValHalf.lean
          lean -o NeedleInverseComplete.olean NeedleInverseComplete.lean
          lean NeedleGeneralInverse.lean
          lean -o NeedleCubicBound.olean NeedleCubicBound.lean
          lean -o NeedleCubicEnumerate.olean NeedleCubicEnumerate.lean
          lean NeedleSharper.lean
          lean NeedleRootDecisionCore.lean

  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install original upstream Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Checkout exact published Space Needle proof
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          git -C /tmp/cryptids checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git -C /tmp/cryptids rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Restore pinned upstream Mathlib and original source
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB1LA_1LC0RE_1LF1LD_0RB0LA_1RC1RE_HHH0LD
      - name: Kernel-check exact original-source bridge
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/SpaceNeedleClosed.lean" .
          lake env lean -o .lake/build/lib/lean/SpaceNeedleClosed.olean SpaceNeedleClosed.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleValHalf.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleValHalf.olean NeedleValHalf.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleValHalfSource.lean" .
          lake env lean NeedleValHalfSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleInverseComplete.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleInverseComplete.olean NeedleInverseComplete.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleInverseCompleteSource.lean" .
          lake env lean NeedleInverseCompleteSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleGeneralInverse.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleGeneralInverse.olean NeedleGeneralInverse.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleGeneralInverseSource.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleGeneralInverseSource.olean NeedleGeneralInverseSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleCubicBound.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleCubicBound.olean NeedleCubicBound.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleCubicBoundSource.lean" .
          lake env lean NeedleCubicBoundSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleCubicEnumerate.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleCubicEnumerate.olean NeedleCubicEnumerate.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleCubicEnumerateSource.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleCubicEnumerateSource.olean NeedleCubicEnumerateSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/SpaceNeedleRawBridge.lean" .
          lake env lean -o .lake/build/lib/lean/SpaceNeedleRawBridge.olean SpaceNeedleRawBridge.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleRootCubic.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleRootCubic.olean NeedleRootCubic.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleSharper.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleSharper.olean NeedleSharper.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleSharperSource.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleSharperSource.olean NeedleSharperSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent20-needle-coprime/NeedleRootSharp.lean" .
          lake env lean NeedleRootSharp.lean
