name: Agent 21 C source bridge (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned upstream Lean toolchain
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Clone exact upstream
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Restore upstream Mathlib cache
        working-directory: /tmp/cryptids
        run: lake exe cache get
      - name: Build upstream certified C acceleration
        working-directory: /tmp/cryptids
        run: lake build BusyBeaver.BB6.M_1RB1LC_1LC1RD_1LA0LB_0RB1RE_1RF0RA_HHH0RC
      - name: Compile standalone C proof and machine-to-raw bridge
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-line/CLine.lean" CLine.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CReachBridge.lean" CReachBridge.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CSourceBridge.lean" CSourceBridge.lean
          lake env lean -o .lake/build/lib/lean/CLine.olean CLine.lean
          lake env lean -o .lake/build/lib/lean/CReachBridge.olean CReachBridge.lean
          lake env lean CSourceBridge.lean
