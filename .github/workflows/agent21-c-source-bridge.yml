name: Agent 21 C source bridge (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned upstream Lean toolchain
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Clone exact upstream
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Restore upstream Mathlib cache
        working-directory: /tmp/cryptids
        run: lake exe cache get
      - name: Build upstream certified C acceleration
        working-directory: /tmp/cryptids
        run: lake build BusyBeaver.BB6.M_1RB1LC_1LC1RD_1LA0LB_0RB1RE_1RF0RA_HHH0RC
      - name: Compile standalone C proof and machine-to-raw bridge
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-line/CLine.lean" CLine.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CReachBridge.lean" CReachBridge.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CSourceBridge.lean" CSourceBridge.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CSection.lean" CSection.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CReturn.lean" CReturn.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CFarReturn.lean" CFarReturn.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CGatewayTime.lean" CGatewayTime.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CPhaseRank.lean" CPhaseRank.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CRange.lean" CRange.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CStrongBridge.lean" CStrongBridge.lean
          lake env lean -o .lake/build/lib/lean/CLine.olean CLine.lean
          lake env lean -o .lake/build/lib/lean/CReachBridge.olean CReachBridge.lean
          lake env lean CSourceBridge.lean
          lake env lean -o .lake/build/lib/lean/CSection.olean CSection.lean
          lake env lean -o .lake/build/lib/lean/CReturn.olean CReturn.lean
          lake env lean -o .lake/build/lib/lean/CFarReturn.olean CFarReturn.lean
          lake env lean CGatewayTime.lean
          lake env lean CPhaseRank.lean
          lake env lean CRange.lean

      - name: Reconstruct Agent 11 modular proofs with hash verification
        run: |
          python3 -m venv /tmp/bb6-venv
          /tmp/bb6-venv/bin/python -m pip -q install filelock
          cd im-results/agent11-c-line
          /tmp/bb6-venv/bin/python reconstruct.py
          /tmp/bb6-venv/bin/python reconstruct-parity.py
          /tmp/bb6-venv/bin/python reconstruct-mod8.py
      - name: Compile and transport strongest modular gates to raw TM
        working-directory: /tmp/cryptids
        run: |
          for source in LowGate BackGate ResetGate CParity CParityGates MoreResidue FinalGate; do
            cp "$GITHUB_WORKSPACE/im-results/agent11-c-line/$source.lean" "$source.lean"
            lake env lean -o ".lake/build/lib/lean/$source.olean" "$source.lean"
          done
          lake env lean -o .lake/build/lib/lean/CSourceBridge.olean CSourceBridge.lean
          lake env lean -o .lake/build/lib/lean/CStrongBridge.olean CStrongBridge.lean

      - name: Certify new modulo-32 Machine C infinite gateway exclusion
        working-directory: /tmp/cryptids
        run: |
          /tmp/bb6-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/reconstruct.py"
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CBack.lean" CBack.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CMod32.lean" CMod32.lean
          lake env lean -o .lake/build/lib/lean/CRange.olean CRange.lean
          lake env lean -o .lake/build/lib/lean/CBack.olean CBack.lean
          lake env lean -o .lake/build/lib/lean/CMod32.olean CMod32.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CMod128Six.lean" CMod128Six.lean
          lake env lean -o .lake/build/lib/lean/CMod128Six.olean CMod128Six.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CMod32Bridge.lean" CMod32Bridge.lean
          lake env lean CMod32Bridge.lean

      - name: Source-certify Agent 20 finite quotient representative lemma
        working-directory: /tmp/cryptids
        run: |
          python3 "$GITHUB_WORKSPACE/im-results/agent20-c-quotient/unpack.py"
          cp "$GITHUB_WORKSPACE/im-results/agent20-c-quotient/QuotientArithmetic.lean" QuotientArithmetic.lean
          cp "$GITHUB_WORKSPACE/im-results/agent21-c-source-bridge/CQuotSourceLink.lean" CQuotSourceLink.lean
          lake env lean -o .lake/build/lib/lean/QuotientArithmetic.olean QuotientArithmetic.lean
          lake env lean CQuotSourceLink.lean
