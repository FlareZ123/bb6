name: Agent 21 expose hash-verified Lean sources (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore and verify exact source SHA-256
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent21-c-source-bridge/reconstruct.py
      - name: Commit readable sources for future proof work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/agent21-c-source-bridge/CBack.lean im-results/agent21-c-source-bridge/CMod32.lean
          git diff --cached --quiet || git commit -m "Agent 21: publish hash-verified readable predecessor proofs"
          git push origin HEAD:main
