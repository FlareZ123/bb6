name: Agent 21 Machine C first m219 original-source inverse proof (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore SHA256-checked theorem sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/bb6-agent21-m219-venv
          /tmp/bb6-agent21-m219-venv/bin/python -m pip -q install filelock
          /tmp/bb6-agent21-m219-venv/bin/python im-results/agent21-c-first-m219-256/reconstruct.py
      - name: Compile full original Machine C section and all-depth inverse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent21-first-m219
          cp im-results/agent11-c-line/CLine.lean /tmp/agent21-first-m219/
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/agent21-first-m219/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/agent21-first-m219/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef}.lean /tmp/agent21-first-m219/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,EvenTargetForward,BounceEvenExact,BounceOddExact,FullSectionInverse}.lean /tmp/agent21-first-m219/
          cp im-results/agent21-c-first-m219-256/{Agent21First219,First219Arithmetic,Source219Bridge}.lean /tmp/agent21-first-m219/
          cd /tmp/agent21-first-m219
          export LEAN_PATH=.
          lean --version
          for module in CLine GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef BounceInverse EvenTargetForward BounceEvenExact BounceOddExact FullSectionInverse Agent21First219 First219Arithmetic; do
            lean -o "$module.olean" "$module.lean"
          done
          lean Source219Bridge.lean
