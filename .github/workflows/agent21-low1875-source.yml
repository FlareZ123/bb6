name: Agent 21 Machine C low-stop source proofs

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select the original-source theorem closure"
        required: true
        type: choice
        default: low-stop
        options:
          - low-stop
          - dyadic-density
          - dyadic-gap
          - dyadic-period
          - dyadic-duality

permissions:
  contents: read

jobs:
  source-proof:
    if: ${{ inputs.target == 'low-stop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact predecessor theorem against unchanged Machine C source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a21-low1875
          cp im-results/agent11-c-line/CLine.lean /tmp/a21-low1875/
          cp im-results/agent8-c-total-section/GenericSection.lean /tmp/a21-low1875/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef}.lean /tmp/a21-low1875/
          cp im-results/agent38-c-section-mod4/Agent38SectionParity.lean /tmp/a21-low1875/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,EvenTargetForward,BounceEvenExact,BounceOddExact,BounceEvenThree,BounceEvenNoFour,FullSectionInverse}.lean /tmp/a21-low1875/
          cp im-results/agent3-c-odd-image/Agent3CImage.lean /tmp/a21-low1875/
          cp im-results/agent15-c-halting/SectionAffineInverse.lean /tmp/a21-low1875/
          cp im-results/agent15-c-even-source/{EvenEvenUnique,OddEvenUnique,EvenRightUnique}.lean /tmp/a21-low1875/
          cp im-results/agent21-c-first-m1875-2048/{Low1875Source,LowQ7Source}.lean /tmp/a21-low1875/
          cp im-results/agent21-c-first-m33619-65536/Low33619Source.lean /tmp/a21-low1875/
          cp im-results/agent21-c-first-m123219-131072/Low123219Source.lean /tmp/a21-low1875/
          cp im-results/agent21-c-first-m1091-4096/Low1091Source.lean /tmp/a21-low1875/
          base64 --decode im-results/agent21-c-first-m1875-2048/Low1875Arithmetic.lean.xz.b64 | xz --decompress > /tmp/a21-low1875/Low1875Arithmetic.lean
          base64 --decode im-results/agent21-c-first-m1875-2048/LowQ7.lean.xz.b64 | xz --decompress > /tmp/a21-low1875/LowQ7.lean
          base64 --decode im-results/agent21-c-first-m33619-65536/Low33619.lean.xz.b64 | xz --decompress > /tmp/a21-low1875/Low33619.lean
          base64 --decode im-results/agent21-c-first-m123219-131072/Low123219.lean.xz.b64 | xz --decompress > /tmp/a21-low1875/Low123219.lean
          cd /tmp/a21-low1875
          echo "0da0704569dd55cc60b8c1dec8fd75b79220d19574f27c5901c76dcd13f44625  Low1875Arithmetic.lean" | sha256sum --check
          echo "d2154987cbec9e28dd5e2749f0f1fb31866cae65124f0be33e3bb4d6024c5e3c  LowQ7.lean" | sha256sum --check
          echo "2c3dd399810da73c658434fb1ac91b3c831c55d7069d3df629cad1cae8e7cc29  Low33619.lean" | sha256sum --check
          echo "28c17c5ea2c506996e47b6b309aabd5e6efe3a7eb0db8d7b1e41d87b5a205826  Low123219.lean" | sha256sum --check
          export LEAN_PATH=.
          lean --version
          for f in CLine GenericSection JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef Agent38SectionParity BounceInverse EvenTargetForward BounceEvenExact BounceOddExact BounceEvenThree BounceEvenNoFour FullSectionInverse Agent3CImage SectionAffineInverse EvenEvenUnique OddEvenUnique EvenRightUnique Low1875Arithmetic Low1875Source LowQ7 LowQ7Source Low33619 Low33619Source Low123219 Low123219Source Low1091Source; do
            echo "Compiling original-source dependency or low1875 proof: $f"
            lean -o "$f.olean" "$f.lean"
          done

      - name: Compile the refined exact joint Machine C low criterion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a21-low1091-extra
          base64 --decode im-results/agent38-c-section-mod4/ThirdStageOddDepth.lean.xz.b64 | xz --decompress > /tmp/a21-low1091-extra/ThirdStageOddDepth.lean
          echo "48fb1fcbf2b3a409c7bafb07a9f1df78a087b02d8cadeac51b2b81b02f301ed0  /tmp/a21-low1091-extra/ThirdStageOddDepth.lean" | sha256sum --check
          python3 tools/lean_compile_closure.py \
            im-results/agent21-c-first-m1091-4096/ValSixLowRefinement.lean \
            im-results/agent11-c-low58/CThreeSixAllCriterion.lean \
            --workdir /tmp/a21-low1091-joint --source-root /tmp/a21-low1091-extra \
            --override BounceParity=im-results/agent46-c-jump/BounceParity.lean \
            --jobs 4 --lean "$(command -v lean)"

  dyadic-density:
    if: ${{ inputs.target == 'dyadic-density' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile full original-source Machine C dyadic density closure
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          python3 tools/lean_compile_closure.py \
            im-results/agent21-c-shadow-density/DyadicSource.lean \
            --workdir /tmp/a21-dyadic-source --jobs 4 --lean "$(command -v lean)"
  dyadic-gap:
    if: ${{ inputs.target == 'dyadic-gap' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile dyadic first-gap inverse word theorem
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          python3 tools/lean_compile_closure.py \
            im-results/agent21-c-shadow-density/DyadicGapConstraint.lean \
            --workdir /tmp/a21-dyadic-gap --jobs 4 --lean "$(command -v lean)"
  dyadic-period:
    if: ${{ inputs.target == 'dyadic-period' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile all-bit signed inverse-word periodicity
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          python3 tools/lean_compile_closure.py \
            im-results/agent21-c-shadow-density/DyadicSignedPeriod.lean \
            --workdir /tmp/a21-dyadic-period --jobs 4 --lean "$(command -v lean)"
  dyadic-duality:
    if: ${{ inputs.target == 'dyadic-duality' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile full signed cone / inverse-word equivalence and source density
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          python3 tools/lean_compile_closure.py \
            im-results/agent21-c-shadow-density/DyadicCheckerAffineUniversal.lean \
            im-results/agent21-c-shadow-density/DyadicSource.lean \
            --workdir /tmp/a21-dyadic-duality --jobs 4 --lean "$(command -v lean)"
