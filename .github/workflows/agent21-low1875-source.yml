name: Agent 21 Machine C low1875 infinite source proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact predecessor theorem against unchanged Machine C source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a21-low1875
          cp im-results/agent11-c-line/CLine.lean /tmp/a21-low1875/
          cp im-results/agent8-c-total-section/GenericSection.lean /tmp/a21-low1875/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef}.lean /tmp/a21-low1875/
          cp im-results/agent38-c-section-mod4/Agent38SectionParity.lean /tmp/a21-low1875/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,EvenTargetForward,BounceEvenExact,BounceOddExact,BounceEvenThree,BounceEvenNoFour,FullSectionInverse}.lean /tmp/a21-low1875/
          cp im-results/agent21-c-first-m1875-2048/Low1875Source.lean /tmp/a21-low1875/
          base64 --decode im-results/agent21-c-first-m1875-2048/Low1875Arithmetic.lean.xz.b64 | xz --decompress > /tmp/a21-low1875/Low1875Arithmetic.lean
          cd /tmp/a21-low1875
          echo "0da0704569dd55cc60b8c1dec8fd75b79220d19574f27c5901c76dcd13f44625  Low1875Arithmetic.lean" | sha256sum --check
          export LEAN_PATH=.
          lean --version
          for f in CLine GenericSection JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef Agent38SectionParity BounceInverse EvenTargetForward BounceEvenExact BounceOddExact BounceEvenThree BounceEvenNoFour FullSectionInverse Low1875Arithmetic Low1875Source; do
            echo "Compiling original-source dependency or low1875 proof: $f"
            lean -o "$f.olean" "$f.lean"
          done
