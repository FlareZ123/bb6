name: Agent 21 five-hole candidate certificate audits
on:
  workflow_dispatch:
    inputs:
      raw:
        type: choice
        options: ['69', '73', '78']
        default: '73'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate and check original source
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          raw='${{ inputs.raw }}'
          dir="im-results/agent21-tnf-raw$raw"
          python "$dir/prepare.py"
          python tools/lean_compile_closure.py --workdir /tmp/a21-raw${{ inputs.raw }} --jobs 4 \
            --manifest /tmp/a21-raw${{ inputs.raw }}/manifest.json \
            --label raw${{ inputs.raw }}-bound --theorem BB6.Agent21Raw${{ inputs.raw }}.all_completions \
            --weighted-bound 7014 --artifact-name raw${{ inputs.raw }}-bound-certified \
            --provenance-input "$dir/prepare.py" \
            --provenance-input "$dir/dfa-bank.txt" \
            --provenance-input "$dir/dfa-index.txt" \
            --provenance-input "$dir/specs.json" \
            "$dir/Raw${{ inputs.raw }}Bound.lean" | tee /tmp/a21-raw${{ inputs.raw }}.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a21-raw${{ inputs.raw }}.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw${{ inputs.raw }}-bound-certified
          path: |
            /tmp/a21-raw${{ inputs.raw }}/*.olean
            /tmp/a21-raw${{ inputs.raw }}/manifest.json
          if-no-files-found: error
