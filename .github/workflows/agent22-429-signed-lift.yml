name: Agent 22 signed #429 inverse certificate (manual)
on:
  workflow_dispatch:
    inputs:
      finite_power_only:
        description: Compile only new signed finite-power modules
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    if: ${{ !inputs.finite_power_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check source-connected signed certificate
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent6-harmonic429:im-results/agent39-429-1021:im-results/agent22-429-signed-drift:im-results/agent18-429-root-invariants:im-results/agent33-429-24:im-results/agent30-429-even16
        run: |
          set -e
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=2000000 -o im-results/agent6-harmonic429/BB429Mod8.olean im-results/agent6-harmonic429/BB429Mod8.lean
          for name in BB429RootEven8 BB429RootMod16 BB429RootMod32; do
            lean -DmaxRecDepth=16000 -DmaxHeartbeats=15000000 -o im-results/agent39-429-1021/$name.olean im-results/agent39-429-1021/$name.lean
          done
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=50000000 -o im-results/agent6-harmonic429/BB429NewResidue.olean im-results/agent6-harmonic429/BB429NewResidue.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=50000000 -o im-results/agent18-429-root-invariants/SignedFRunParity.olean im-results/agent18-429-root-invariants/SignedFRunParity.lean
          p=im-results/agent22-429-signed-drift
          python "$p/reconstruct.py"
          lean -o "$p/SignedDrift.olean" "$p/SignedDrift.lean"
          lean -o "$p/SignedLift.olean" "$p/SignedLift.lean"
          lean -DmaxHeartbeats=2000000 "$p/Branch13_15.lean"
          lean -DmaxHeartbeats=2000000 -o "$p/SignedSource.olean" "$p/SignedSource.lean"
          lean "$p/Branch29SignedFloor.lean" 2>&1 | tee /tmp/agent22-signed-floor-audit.log
          lean "$p/Branch29SignedFloor10k.lean" 2>&1 | tee -a /tmp/agent22-signed-floor-audit.log
          ! grep -q 'sorryAx' /tmp/agent22-signed-floor-audit.log
          ! grep -q 'native_decide' /tmp/agent22-signed-floor-audit.log
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=50000000 -o im-results/agent33-429-24/BB429InverseKernel.olean im-results/agent33-429-24/BB429InverseKernel.lean
          lean -o im-results/agent18-429-root-invariants/BB429FiniteAvoidance.olean im-results/agent18-429-root-invariants/BB429FiniteAvoidance.lean
          lean -o "$p/Branch29ShiftedCert.olean" "$p/Branch29ShiftedCert.lean"
          lean "$p/Branch29Extra1024.lean" 2>&1 | tee -a /tmp/agent22-branch29-audit.log
          lean "$p/Branch29Extra2048.lean" 2>&1 | tee -a /tmp/agent22-branch29-audit.log
          for m in BB429SevenStrong BB429OddResetGate BB429Reset31 BB429NoThree BB429Even16 BB429Branch7 BB429Branch29 BB429Branch29Mod16 BB429Branch29Mod64 BB429Branch29Mod128 BB429Branch29Odd31 BB429Branch29Reflect BB429Branch29Reflect1024 BB429Branch29Small BB429Branch29All; do
            case "$m" in
              BB429NoThree) dir=im-results/agent6-harmonic429 ;;
              BB429Even16) dir=im-results/agent30-429-even16 ;;
              *) dir=im-results/agent18-429-root-invariants ;;
            esac
            lean -DmaxRecDepth=30000 -DmaxHeartbeats=30000000 -o "$dir/$m.olean" "$dir/$m.lean"
          done
          lean -o "$p/Branch29Roster31.olean" "$p/Branch29Roster31.lean" 2>&1 | tee -a /tmp/agent22-branch29-audit.log
          lean "$p/Branch29BurstMod262144.lean" 2>&1 | tee -a /tmp/agent22-branch29-audit.log
          lean "$p/Branch29SignedFloor1M.lean" 2>&1 | tee -a /tmp/agent22-branch29-audit.log
          ! grep -q 'sorryAx' /tmp/agent22-branch29-audit.log
          ! grep -q 'native_decide' /tmp/agent22-branch29-audit.log

  finite_power:
    if: ${{ inputs.finite_power_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean for finite-power algebra
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact finite-power modules and axiom profiles
        env:
          LEAN_PATH: im-results/agent22-429-signed-drift
        run: |
          set -euo pipefail
          p=im-results/agent22-429-signed-drift
          for name in AffineOrbitRigidity PeriodicMacroTransfer FiniteTripleRigidity FiniteTripleMacro SignedPairMacroBridge SignedPairWordBridge FinitePowerRigidity FinitePowerMacro FiniteSquareRigidity SignedFinitePowerBridge SignedFiniteSquareBridge SignedPeriodType PeriodicGridPacking ValuationPacking ValuationEdges ValuationPrimitive ValuationCyclic SharpValuationQuotient SharpPackingSmall SharpPackingUniversal SharpEdgeFamily SharpValuationFamily SharpWitness SharpExactConstruction SharpDigitFormula SharpExactValuation SharpGlobalTheorem SharpValuationPrimitive SharpValuationCyclic SharpTypedCycle TypedCostBounds SharpTypedWordNoGo FiniteSlopeTransport FiniteSlopeCycle FiniteCoefficientCone FiniteSlopeCone FinitePowerSlopeCycle FiniteSlopePacking CyclicPrimitiveFinite SlopeCycleAdapter FinitePrimitiveNoGo DoubledGapCycle DoubledGapFinitePower SignedPrimitivePowerNoGo; do
            echo "::group::Lean $name"
            lean -DmaxRecDepth=8192 -DmaxHeartbeats=1000000 -o "$p/$name.olean" "$p/$name.lean" 2>&1 | tee -a /tmp/agent22-finite-power-axioms.log
            echo "::endgroup::"
          done
          ! grep -q 'sorryAx' /tmp/agent22-finite-power-axioms.log
          ! grep -q 'native_decide' /tmp/agent22-finite-power-axioms.log
      - name: Check exact four-adic capacity and 136-case proof base
        run: node im-results/agent22-429-signed-drift/sharp_packing_small.cjs
