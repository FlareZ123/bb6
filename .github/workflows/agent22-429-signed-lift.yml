name: Agent 22 signed #429 inverse certificate (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check source-connected signed certificate
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent6-harmonic429:im-results/agent39-429-1021:im-results/agent22-429-signed-drift
        run: |
          set -e
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=2000000 -o im-results/agent6-harmonic429/BB429Mod8.olean im-results/agent6-harmonic429/BB429Mod8.lean
          for name in BB429RootEven8 BB429RootMod16 BB429RootMod32; do
            lean -DmaxRecDepth=16000 -DmaxHeartbeats=15000000 -o im-results/agent39-429-1021/$name.olean im-results/agent39-429-1021/$name.lean
          done
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=50000000 -o im-results/agent6-harmonic429/BB429NewResidue.olean im-results/agent6-harmonic429/BB429NewResidue.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=50000000 -o im-results/agent18-429-root-invariants/SignedFRunParity.olean im-results/agent18-429-root-invariants/SignedFRunParity.lean
          p=im-results/agent22-429-signed-drift
          python "$p/reconstruct.py"
          lean -o "$p/SignedDrift.olean" "$p/SignedDrift.lean"
          lean -o "$p/SignedLift.olean" "$p/SignedLift.lean"
          lean -DmaxHeartbeats=2000000 "$p/SignedSource.lean"
