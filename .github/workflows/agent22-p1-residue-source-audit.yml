name: Agent 22 independent Agent 50 P1 infinite-residue proof audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unmodified Agent 1 and Agent 50 sources
        run: |
          mkdir -p /tmp/bb6-p1-audit
          cd /tmp/bb6-p1-audit
          for name in GParity GInverse PosEvenForm ResetGate; do
            cp "$GITHUB_WORKSPACE/im-results/agent1-p1-map/$name.lean" "$name.lean"
          done
          for name in P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do
            cp "$GITHUB_WORKSPACE/im-results/agent50-p1-residue/$name.lean" "$name.lean"
          done
          export LEAN_PATH="."
          for name in GParity GInverse PosEvenForm ResetGate P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do
            echo "AUDIT compiling $name"
            lean -o "$name.olean" "$name.lean"
          done

          for name in HaltingFunnel EvenSector OddReturn Reachability BlankCriterion; do
            cp "$GITHUB_WORKSPACE/im-results/agent4-halting-funnel/$name.lean" "$name.lean"
            lean -o "$name.olean" "$name.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent22-p1-reach-bridge/P1ReachBridge.lean" P1ReachBridge.lean
          lean -o P1ReachBridge.olean P1ReachBridge.lean
