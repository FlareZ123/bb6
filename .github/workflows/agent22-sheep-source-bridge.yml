name: Agent 22 Sheep source-level semantic bridge (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Cryptids pinned Lean toolchain
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch exact certified upstream revision
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Build upstream kernel-certified Sheep machine
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB1LA_0LC0RC_1LE1RD_1RE1RC_1LF0LA_HHH1LE
      - name: Reconstruct and check independently derived Lean source
        working-directory: /tmp/cryptids
        run: |
          python3 -m venv /tmp/agent22-venv
          /tmp/agent22-venv/bin/pip -q install filelock
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/unpack.py"
          cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-preimages/CounterBridge.lean" CounterBridge.lean
          for name in DeterministicMacro SheepPowerBridge SheepBlankCriterion SheepSourceBridge; do
            cp "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            CounterBridge.lean DeterministicMacro.lean SheepPowerBridge.lean SheepBlankCriterion.lean
          export LEAN_PATH=".:$LEAN_PATH"
          for name in CounterBridge DeterministicMacro SheepPowerBridge SheepBlankCriterion; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          lake env lean -o ".lake/build/lib/lean/SheepSourceBridge.olean" SheepSourceBridge.lean

          for name in InfiniteAncestry PeriodicAncestry GeneralAncestry; do
            cp "$GITHUB_WORKSPACE/im-results/agent22-sheep-infinite-inverse/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            InfiniteAncestry.lean PeriodicAncestry.lean GeneralAncestry.lean
          for name in InfiniteAncestry PeriodicAncestry; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          lake env lean GeneralAncestry.lean

          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent16-sheep-power-preimages/unpack.py"
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent16-sheep-power-preimages/unpack_reach.py"
          for name in ModCycle Arithmetic Generic GenericMod Special Reach; do
            cp "$GITHUB_WORKSPACE/im-results/agent16-sheep-power-preimages/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            ModCycle.lean Arithmetic.lean Generic.lean GenericMod.lean Special.lean Reach.lean
          for name in ModCycle Arithmetic Generic GenericMod Special Reach; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/SectionExclusionBridge.lean" SectionExclusionBridge.lean
          cp "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/SheepSourceExclusions.lean" SheepSourceExclusions.lean
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            SectionExclusionBridge.lean
          lake env lean -o ".lake/build/lib/lean/SectionExclusionBridge.olean" SectionExclusionBridge.lean
          lake env lean SheepSourceExclusions.lean

          # Agent16: restore source-checked exact even-section graph and
          # compose it with Agent22's verified original six-state semantics.
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent16-sheep-even-return/reconstruct_all.py"
          for name in SheepEven EvenEdge OddPrefix EvenReach BlankEven; do
            cp "$GITHUB_WORKSPACE/im-results/agent16-sheep-even-return/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            SheepEven.lean EvenEdge.lean OddPrefix.lean EvenReach.lean BlankEven.lean
          for name in SheepEven EvenEdge OddPrefix EvenReach BlankEven; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent16-sheep-even-return/EvenSourceBridge.lean" EvenSourceBridge.lean
          lake env lean EvenSourceBridge.lean
