name: Agent 22 Sheep source-level semantic bridge (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Cryptids pinned Lean toolchain
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch exact certified upstream revision
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Reclaim unused runner packages before large Lean cache
        run: |
          df -h /
          for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell; do
            if test -d "$dir"; then sudo rm -rf "$dir"; fi
          done
          df -h /
      - name: Build upstream kernel-certified Sheep machine
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB1LA_0LC0RC_1LE1RD_1RE1RC_1LF0LA_HHH1LE
      - name: Reconstruct and check independently derived Lean source
        working-directory: /tmp/cryptids
        run: |
          python3 -m venv /tmp/agent22-venv
          /tmp/agent22-venv/bin/pip -q install filelock
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/unpack.py"
          cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-preimages/CounterBridge.lean" CounterBridge.lean
          for name in DeterministicMacro SheepPowerBridge SheepBlankCriterion SheepSourceBridge; do
            cp "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            CounterBridge.lean DeterministicMacro.lean SheepPowerBridge.lean SheepBlankCriterion.lean
          export LEAN_PATH=".:$LEAN_PATH"
          for name in CounterBridge DeterministicMacro SheepPowerBridge SheepBlankCriterion; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          lake env lean -o ".lake/build/lib/lean/SheepSourceBridge.olean" SheepSourceBridge.lean

          for name in InfiniteAncestry PeriodicAncestry GeneralAncestry; do
            cp "$GITHUB_WORKSPACE/im-results/agent22-sheep-infinite-inverse/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            InfiniteAncestry.lean PeriodicAncestry.lean GeneralAncestry.lean
          for name in InfiniteAncestry PeriodicAncestry; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          lake env lean GeneralAncestry.lean

          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent16-sheep-power-preimages/unpack.py"
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent16-sheep-power-preimages/unpack_reach.py"
          for name in ModCycle Arithmetic Generic GenericMod Special Reach; do
            cp "$GITHUB_WORKSPACE/im-results/agent16-sheep-power-preimages/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            ModCycle.lean Arithmetic.lean Generic.lean GenericMod.lean Special.lean Reach.lean
          for name in ModCycle Arithmetic Generic GenericMod Special Reach; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/SectionExclusionBridge.lean" SectionExclusionBridge.lean
          cp "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/SheepSourceExclusions.lean" SheepSourceExclusions.lean
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            SectionExclusionBridge.lean
          lake env lean -o ".lake/build/lib/lean/SectionExclusionBridge.olean" SectionExclusionBridge.lean
          lake env lean SheepSourceExclusions.lean

          # Agent16: restore source-checked exact even-section graph and
          # compose it with Agent22's verified original six-state semantics.
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent16-sheep-even-return/reconstruct_all.py"
          for name in SheepEven EvenEdge OddPrefix EvenReach BlankEven; do
            cp "$GITHUB_WORKSPACE/im-results/agent16-sheep-even-return/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            SheepEven.lean EvenEdge.lean OddPrefix.lean EvenReach.lean BlankEven.lean
          for name in SheepEven EvenEdge OddPrefix EvenReach BlankEven; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent16-sheep-even-return/EvenSourceBridge.lean" EvenSourceBridge.lean
          lake env lean -o ".lake/build/lib/lean/EvenSourceBridge.olean" EvenSourceBridge.lean

          # Agent14: recheck exact original even-source inverse arithmetic,
          # including the exceptional odd-part-three branch.
          cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-even-inverse/SheepEvenInverseAlgebra.lean" SheepEvenInverseAlgebra.lean
          cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-even-inverse/SheepEvenSourceAlgebra.lean" SheepEvenSourceAlgebra.lean
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            SheepEvenInverseAlgebra.lean SheepEvenSourceAlgebra.lean
          lake env lean -o ".lake/build/lib/lean/SheepEvenInverseAlgebra.olean" SheepEvenInverseAlgebra.lean
          # Original-source inverse algebra and authentic blank-root reachability gateway.
          lake env lean -o ".lake/build/lib/lean/SheepEvenSourceAlgebra.olean" SheepEvenSourceAlgebra.lean
          cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-even-inverse/SheepEvenReachInverse.lean" SheepEvenReachInverse.lean
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" SheepEvenReachInverse.lean
          lake env lean SheepEvenReachInverse.lean

          # Agent40: sixth-stratum exact all-valuation and authentic blank-root theorem.
          # Uses original SheepEvenReachInverse and separately compiled SheepOddGap.
          ROOT486="$GITHUB_WORKSPACE/im-results/agent40-sheep-power486"
          for name in SheepPower486Core SheepPower486Rows SheepPower486All SheepPower486RootGate SheepPower486High SheepPower486Target SheepPower486Special SheepPower486NoSource SheepPower486Source; do
            cp "$ROOT486/$name.lean" "$name.lean"
          done
          export LEAN_PATH=".:$LEAN_PATH"
          for name in SheepPower486Core SheepPower486Rows SheepPower486All SheepPower486RootGate SheepPower486High SheepPower486Target SheepPower486Special SheepPower486NoSource; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          lake env lean SheepPower486Source.lean

          # Agent14: full source-exact r138 first-predecessor theorem,
          # including two authenticated rational-child alternatives.
          lake env lean -o ".lake/build/lib/lean/SheepEvenReachInverse.olean" SheepEvenReachInverse.lean
          for name in Sheep138HighH Sheep138Exceptional Sheep138Gateway Sheep138ChildHighH SheepExceptionalGap Sheep138ChildExceptional Sheep138ChildGateway SheepOddGap HighBound Sheep138GenericHigh; do
            cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-even-inverse/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            Sheep138HighH.lean Sheep138Exceptional.lean Sheep138Gateway.lean \
            Sheep138ChildHighH.lean SheepExceptionalGap.lean Sheep138ChildExceptional.lean \
            Sheep138ChildGateway.lean SheepOddGap.lean HighBound.lean Sheep138GenericHigh.lean
          for name in Sheep138HighH Sheep138Exceptional Sheep138Gateway Sheep138ChildHighH SheepExceptionalGap Sheep138ChildExceptional Sheep138ChildGateway SheepOddGap HighBound Sheep138GenericHigh; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent14-sheep-even-inverse/reconstruct_root138.py"
          for name in Sheep138LowResidues Sheep138RootParents Sheep138RootCases Sheep138RootTwoChildren; do
            cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-even-inverse/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            Sheep138LowResidues.lean Sheep138RootParents.lean \
            Sheep138RootCases.lean Sheep138RootTwoChildren.lean
          for name in Sheep138LowResidues Sheep138RootParents Sheep138RootCases Sheep138RootTwoChildren; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done

          # Agent14: fully formal infinite all-k r138 halting-gate exclusion.
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent14-sheep-even-inverse/reconstruct_child138_high.py"
          for name in Sheep138ChildGenericHigh Sheep138ChildFinite; do
            cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-even-inverse/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            Sheep138ChildGenericHigh.lean Sheep138ChildFinite.lean
          for name in Sheep138ChildGenericHigh Sheep138ChildFinite; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent14-sheep-even-inverse/generate_full138.py"
          for name in Sheep138ChildLowResidues Sheep138ChildLowCases Sheep138FullClass; do
            cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-even-inverse/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            Sheep138ChildLowResidues.lean Sheep138ChildLowCases.lean Sheep138FullClass.lean
          for name in Sheep138ChildLowResidues Sheep138ChildLowCases Sheep138FullClass; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done

          # Agent16: all-exponent exact even-source power preimages against
          # authentic machine-certified Sheep section constructors.
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent16-odd-power-gates/reconstruct.py"
          cp "$GITHUB_WORKSPACE/im-results/agent16-odd-power-gates/OddPredecessor.lean" OddPredecessor.lean
          cp "$GITHUB_WORKSPACE/im-results/agent16-odd-power-gates/OddPowerSource.lean" OddPowerSource.lean
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" OddPredecessor.lean
          lake env lean -o ".lake/build/lib/lean/OddPredecessor.olean" OddPredecessor.lean
          cp "$GITHUB_WORKSPACE/im-results/agent16-odd-power-gates/GateExistence.lean" GateExistence.lean
          lake env lean -o ".lake/build/lib/lean/GateExistence.olean" GateExistence.lean
          cp "$GITHUB_WORKSPACE/im-results/agent16-odd-power-gates/SecondGateway.lean" SecondGateway.lean
          lake env lean -o ".lake/build/lib/lean/SecondGateway.olean" SecondGateway.lean
          cp "$GITHUB_WORKSPACE/im-results/agent16-odd-power-gates/SecondExceptional.lean" SecondExceptional.lean
          lake env lean -o ".lake/build/lib/lean/SecondExceptional.olean" SecondExceptional.lean
          lake env lean -o ".lake/build/lib/lean/OddPowerSource.olean" OddPowerSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent16-odd-power-gates/OddEvenGate.lean" OddEvenGate.lean
          lake env lean -o ".lake/build/lib/lean/OddEvenGate.olean" OddEvenGate.lean
          cp "$GITHUB_WORKSPACE/im-results/agent16-odd-power-gates/SecondEvenGate.lean" SecondEvenGate.lean
          lake env lean SecondEvenGate.lean

          # Agent22: original-source universal mixed-modulus outgoing hub.
          cp "$GITHUB_WORKSPACE/im-results/agent22-sheep-mixed-hub/SheepMixedHub.lean" SheepMixedHub.lean
          cp "$GITHUB_WORKSPACE/im-results/agent22-sheep-mixed-hub/SheepHubSource.lean" SheepHubSource.lean
          lake env lean -o ".lake/build/lib/lean/SheepMixedHub.olean" SheepMixedHub.lean
          lake env lean SheepHubSource.lean

          # Agent16: all-time exceptional-branch exclusions and exact
          # modular periods/finite-cycle nonmatches for 8 inverse families.
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent16-sheep-deep-sieve/reconstruct_gates.py"
          for name in ExceptionalGrowth ExceptionalGap ExceptionalUniform ExceptionalEight FiniteModCert FiniteGates0 FiniteGates1 FiniteGates2 FiniteGates3 FiniteGates4 FiniteGates5 FiniteGates6 FiniteGates7; do
            cp "$GITHUB_WORKSPACE/im-results/agent16-sheep-deep-sieve/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            ExceptionalGrowth.lean ExceptionalGap.lean ExceptionalUniform.lean ExceptionalEight.lean \
            FiniteModCert.lean FiniteGates0.lean FiniteGates1.lean FiniteGates2.lean \
            FiniteGates3.lean FiniteGates4.lean FiniteGates5.lean FiniteGates6.lean FiniteGates7.lean
          for name in ExceptionalGrowth ExceptionalGap ExceptionalUniform ExceptionalEight FiniteModCert FiniteGates0 FiniteGates1 FiniteGates2 FiniteGates3 FiniteGates4 FiniteGates5 FiniteGates6 FiniteGates7; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done

          # Agent16: asymptotically sharper generic power-parent valuations,
          # composed with the exact six-state Sheep source and all-branch split.
          cp "$GITHUB_WORKSPACE/im-results/agent40-sheep-third-preimages/ResidueGap.lean" ResidueGap.lean
          cp "$GITHUB_WORKSPACE/im-results/agent17-sheep-geometric-rays/SpecialSourceNoPower.lean" SpecialSourceNoPower.lean
          for name in SheepSharper SheepPowerCutoff SheepSharpSource; do
            cp "$GITHUB_WORKSPACE/im-results/agent16-sheep-valuation-cutoff/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            ResidueGap.lean SpecialSourceNoPower.lean SheepSharper.lean \
            SheepPowerCutoff.lean SheepSharpSource.lean
          for name in ResidueGap SpecialSourceNoPower SheepSharper SheepPowerCutoff; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          lake env lean SheepSharpSource.lean

          # Agent14: source-certified all-k 31104 first-even root inverse chain.
          # Reuse the pinned-original Sheep build and existing machine-semantic bridge.
          # Generated low rows are checked full-period certificates, not finite traces.
          export LEAN_PATH=".:$LEAN_PATH"
          ROOT31104="$GITHUB_WORKSPACE/im-results/agent14-sheep-inverse-dag-222"
          cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-even-inverse/IndependentExceptionalGap.lean" IndependentExceptionalGap.lean
          python3 "$ROOT31104/generate_z_low.py"
          python3 "$ROOT31104/generate_t_low.py"
          for h in 0 1 2 3 4 5 6; do python3 "$ROOT31104/generate_root_low.py" "$h"; done
          for name in Sheep31104ZLowPeriod SheepEdgeIdentities Sheep31104RootBound Sheep31104RootHigh Sheep31104RootSpecial Sheep31104RootComplete Sheep31104RootEdge Sheep31104ZBound Sheep31104ZHigh Sheep31104ZSpecial Sheep31104ZComplete Sheep31104ZEdge Sheep31104TBound Sheep31104THigh Sheep31104TSpecial Sheep31104TComplete Sheep31104TEdge Sheep31104NoBlank Sheep31104ZLow Sheep31104TLow Sheep31104RootLow0 Sheep31104RootLow1 Sheep31104RootLow2 Sheep31104RootLow3 Sheep31104RootLow4 Sheep31104RootLow5 Sheep31104RootLow6; do
            cp "$ROOT31104/$name.lean" "$name.lean"
          done
          /tmp/agent22-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            IndependentExceptionalGap.lean Sheep31104ZLowPeriod.lean SheepEdgeIdentities.lean \
            Sheep31104RootBound.lean Sheep31104RootHigh.lean Sheep31104RootSpecial.lean \
            Sheep31104RootLow0.lean Sheep31104RootLow1.lean Sheep31104RootLow2.lean \
            Sheep31104RootLow3.lean Sheep31104RootLow4.lean Sheep31104RootLow5.lean \
            Sheep31104RootLow6.lean Sheep31104RootComplete.lean Sheep31104RootEdge.lean \
            Sheep31104ZBound.lean Sheep31104ZHigh.lean Sheep31104ZSpecial.lean Sheep31104ZLow.lean \
            Sheep31104ZComplete.lean Sheep31104ZEdge.lean Sheep31104TBound.lean \
            Sheep31104THigh.lean Sheep31104TSpecial.lean Sheep31104TLow.lean \
            Sheep31104TComplete.lean Sheep31104TEdge.lean Sheep31104NoBlank.lean
          for name in IndependentExceptionalGap Sheep31104ZLowPeriod SheepEdgeIdentities Sheep31104RootBound Sheep31104RootHigh Sheep31104RootSpecial Sheep31104RootLow0 Sheep31104RootLow1 Sheep31104RootLow2 Sheep31104RootLow3 Sheep31104RootLow4 Sheep31104RootLow5 Sheep31104RootLow6 Sheep31104RootComplete Sheep31104RootEdge Sheep31104ZBound Sheep31104ZHigh Sheep31104ZSpecial Sheep31104ZLow Sheep31104ZComplete Sheep31104ZEdge Sheep31104TBound Sheep31104THigh Sheep31104TSpecial Sheep31104TLow Sheep31104TComplete Sheep31104TEdge; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          lake env lean Sheep31104NoBlank.lean
