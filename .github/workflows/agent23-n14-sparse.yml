name: Agent23 n14 sparse authentic inverse cone (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify exact original P1 model, shadow lemma, sparse all-r theorem
        run: |
          set -eo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent9-p1-shadow:im-results/agent23-n14-sparse"
          for m in GParity GInverse; do lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean"; done
          for m in P1FiniteInverse P1InverseLog; do lean -o "im-results/agent47-p1-finite-inverse/$m.olean" "im-results/agent47-p1-finite-inverse/$m.lean"; done
          for m in MassInverse OddConeMass; do lean -o "im-results/agent1-p1-quarter/$m.olean" "im-results/agent1-p1-quarter/$m.lean"; done
          for m in ShadowDepthArithmetic ShadowAlgebra ShadowCast ShadowParityArithmetic ShadowDepthSource ShadowSourceTransport ShadowParitySource ShadowSourceStep ShadowQ29Finite ShadowQ29No256 ShadowQ29DepthArithmetic ShadowQ29DepthSource ShadowFiniteInvariant; do
            lean -o "im-results/agent9-p1-shadow/$m.olean" "im-results/agent9-p1-shadow/$m.lean"
          done
          lean -o im-results/agent23-n14-sparse/Agent23N14.olean im-results/agent23-n14-sparse/Agent23N14.lean | tee /tmp/agent23-audit.log
          lean im-results/agent23-n14-sparse/N14SourceBridge.lean | tee -a /tmp/agent23-audit.log
          grep -F "'Agent23N14.authentic_n14_sparse_odd_cone_cost' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/agent23-audit.log
          if grep -E 'sorryAx|^error:' /tmp/agent23-audit.log; then exit 1; fi
