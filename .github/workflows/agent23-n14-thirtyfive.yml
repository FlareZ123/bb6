name: Agent23 P1 n14 35-source-class original gateway exclusion (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source:
    strategy:
      fail-fast: false
      matrix:
        shard: [A, B, C, D, E, F, G]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Recompile unmodified original P1, exact inverse and source cone theorem dependencies
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent9-param-budget:im-results/agent23-p1-root-wall:im-results/agent23-n14-sparse"
          for m in GParity GInverse PosEvenForm ResetGate; do
            lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean"
          done
          for m in P1FiniteInverse P1InverseLog; do
            lean -o "im-results/agent47-p1-finite-inverse/$m.olean" "im-results/agent47-p1-finite-inverse/$m.lean"
          done
          for m in MassInverse OddConeMass; do
            lean -o "im-results/agent1-p1-quarter/$m.olean" "im-results/agent1-p1-quarter/$m.lean"
          done
          for m in P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do
            lean -o "im-results/agent50-p1-residue/$m.olean" "im-results/agent50-p1-residue/$m.lean"
          done
          lean -o im-results/agent4-p1-cone2398/ConeKernel.olean im-results/agent4-p1-cone2398/ConeKernel.lean
          for m in P1Deep2 P1TwoRoot P1TwoFeeder P1TwoIff P1TwoCritical P1TwoSector; do
            lean -o "im-results/agent45-p1-deep-two/$m.olean" "im-results/agent45-p1-deep-two/$m.lean"
          done
          for m in QuarterGap ShortConeGap ShortConeBridge; do
            lean -o "im-results/agent1-p1-quarter/$m.olean" "im-results/agent1-p1-quarter/$m.lean"
          done
          for m in ShadowDepthArithmetic ShadowAlgebra ShadowCast ShadowParityArithmetic ShadowDepthSource ShadowSourceTransport ShadowParitySource ShadowSourceStep ShadowQ29Finite ShadowQ29No256 ShadowQ29DepthArithmetic ShadowQ29DepthSource ShadowFiniteInvariant; do
            lean -o "im-results/agent9-p1-shadow/$m.olean" "im-results/agent9-p1-shadow/$m.lean"
          done
          lean -o im-results/agent9-param-budget/GenericBudgetBlocked.olean im-results/agent9-param-budget/GenericBudgetBlocked.lean
          for m in CriticalRootWallArithmetic RootWallSharpArithmetic; do
            lean -o "im-results/agent23-p1-root-wall/$m.olean" "im-results/agent23-p1-root-wall/$m.lean"
          done
      - name: Verify original-source generic P1 n14 exclusion theorem and deterministic affine certificates
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages filelock
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent9-param-budget:im-results/agent23-p1-root-wall:im-results/agent23-n14-sparse:im-results/agent23-n14-sparse/generated"
          : > /tmp/agent23-n14-35-audit.log
          for m in N14Bounds N14GenericSource N14GenericDecision; do
            lean -o "im-results/agent23-n14-sparse/$m.olean" "im-results/agent23-n14-sparse/$m.lean" | tee -a /tmp/agent23-n14-35-audit.log
          done
          case "MATRIX_TOKEN" in
            A) ids=(0 3 5 6 9) ;;
            B) ids=(11 12 15 18 22) ;;
            C) ids=(25 26 27 28 29) ;;
            D) ids=(34 38 39 40 41) ;;
            E) ids=(42 43 44 45 48) ;;
            F) ids=(49 52 53 54 55) ;;
            G) ids=(56 57 59 60 62) ;;
            *) echo "Bad shard" >&2; exit 1 ;;
          esac
          for s in "${ids[@]}"; do
            python3 im-results/agent23-n14-sparse/generate_residue.py "$s"
            lean "im-results/agent23-n14-sparse/generated/N14Residue${s}.lean" | tee -a /tmp/agent23-n14-35-audit.log
            grep -F "'Agent23N14Residue${s}.critical_unreachable' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/agent23-n14-35-audit.log
          done
          if grep -E 'sorryAx|^error:' /tmp/agent23-n14-35-audit.log; then exit 1; fi
          echo "All five source-certified all-natural critical gateway families in shard ${{ matrix.shard }}"
