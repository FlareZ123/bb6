name: Agent23 Raw34 D1=1RD halt and side-cycle certificates (manual)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [pilot, full, depth2, highmass, union, third, far, complete-slices, erase-slice, final-eight, f-depth3, f-depth4, cycle-rank, f-long]
        default: pilot

permissions:
  contents: read

jobs:
  certified-leaves:
    if: inputs.mode != 'f-depth4'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct pinned local source dependencies
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
      - name: Compile exact source theorem closure and audit axioms
        if: inputs.mode == 'pilot'
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent23-raw34-halters
          python tools/lean_compile_closure.py --workdir /tmp/agent23-raw34-halters --jobs 3 \
            im-results/agent23-raw34-frontier/Raw34D1RDHalting12.lean \
            im-results/agent23-raw34-frontier/Raw34D1RDOneStepPilot.lean \
            im-results/agent23-raw34-frontier/Raw34TripleSweepGrowthF.lean \
            2>&1 | tee /tmp/agent23-raw34-halters/audit.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/agent23-raw34-halters/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent23-raw34-halters/audit.log
      - name: Compile 1897 local first-query certificates in 16 source shards
        if: inputs.mode == 'full'
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent23-raw34-halters
          python tools/lean_compile_closure.py --workdir /tmp/agent23-raw34-halters --jobs 4 \
            im-results/agent23-raw34-frontier/Raw34D1RDOneStepShard*.lean \
            2>&1 | tee /tmp/agent23-raw34-halters/audit.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/agent23-raw34-halters/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent23-raw34-halters/audit.log
      - name: Compile second-unassigned C1=0RF growth and halting certificate bank
        if: inputs.mode == 'depth2'
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent23-raw34-halters
          python tools/lean_compile_closure.py --workdir /tmp/agent23-raw34-halters --jobs 3 \
            im-results/agent23-raw34-frontier/Raw34D1RDDepth2C1RF.lean \
            2>&1 | tee /tmp/agent23-raw34-halters/audit.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/agent23-raw34-halters/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent23-raw34-halters/audit.log
      - name: Check 597 source high-mass Raw34 second-query leaf certificates
        if: inputs.mode == 'highmass'
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent23-raw34-halters
          python tools/lean_compile_closure.py --workdir /tmp/agent23-raw34-halters --jobs 3 \
            im-results/agent23-raw34-frontier/Raw34D1RDHighMass*.lean \
            2>&1 | tee /tmp/agent23-raw34-halters/audit.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/agent23-raw34-halters/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent23-raw34-halters/audit.log
      - name: Source-audit generic control-closure and exact ten-mask finite union
        if: inputs.mode == 'union'
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent23-raw34-halters
          python tools/lean_compile_closure.py --workdir /tmp/agent23-raw34-halters --jobs 3 \
            im-results/agent40-raw34-frontier/Raw34GraphClosed.lean \
            2>&1 | tee /tmp/agent23-raw34-halters/audit.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/agent23-raw34-halters/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent23-raw34-halters/audit.log
          node im-results/agent23-raw34-frontier/union_graph_source.mjs \
            | tee /tmp/agent23-raw34-halters/physical-union.json
      - name: Source-check 1358 newly discovered third-query Raw34 witnesses
        if: inputs.mode == 'third'
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent23-raw34-halters
          python tools/lean_compile_closure.py --workdir /tmp/agent23-raw34-halters --jobs 4 \
            im-results/agent23-raw34-frontier/Raw34D1RDTop120Third*.lean \
            2>&1 | tee /tmp/agent23-raw34-halters/audit.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/agent23-raw34-halters/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent23-raw34-halters/audit.log
      - name: Test unrestricted source-certified FAR discovery on early-unknown Raw34 machines
        if: inputs.mode == 'far'
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent23-raw34-halters
          python tools/lean_compile_closure.py --workdir /tmp/agent23-raw34-halters --jobs 3 \
            im-results/agent23-raw34-frontier/Raw34UnrestrictedFARPilot.lean \
            2>&1 | tee /tmp/agent23-raw34-halters/audit.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/agent23-raw34-halters/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent23-raw34-halters/audit.log
      - name: Source-check complete live D1=1RD slice Covers
        if: inputs.mode == 'complete-slices'
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent23-raw34-halters
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python tools/lean_compile_closure.py --workdir /tmp/agent23-raw34-halters --jobs 3 \
            im-results/agent23-raw34-frontier/Raw34D1RDCompleteSlices.lean \
            2>&1 | tee /tmp/agent23-raw34-halters/audit.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/agent23-raw34-halters/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent23-raw34-halters/audit.log
          grep -F "'BB6.Agent23Raw34CompleteSlice.Slice0.cover'" /tmp/agent23-raw34-halters/audit.log
          grep -F "'BB6.Agent23Raw34CompleteSlice.Slice1.cover'" /tmp/agent23-raw34-halters/audit.log
      - name: Source-check exact erase-fill recurrence and complete four-hole Cover
        if: inputs.mode == 'erase-slice'
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent23-raw34-halters
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python tools/lean_compile_closure.py --workdir /tmp/agent23-raw34-halters --jobs 3 \
            im-results/agent23-raw34-frontier/Raw34EraseSlice.lean \
            2>&1 | tee /tmp/agent23-raw34-halters/audit.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/agent23-raw34-halters/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent23-raw34-halters/audit.log
          grep -F "'BB6Coverage.Agent23Erase.never'" /tmp/agent23-raw34-halters/audit.log
          grep -F "'BB6.Agent23Raw34EraseSlice.cover'" /tmp/agent23-raw34-halters/audit.log
      - name: Source-check four defect sweeps and four variable-width binary odometers
        if: inputs.mode == 'final-eight'
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent23-raw34-halters
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python tools/lean_compile_closure.py --workdir /tmp/agent23-raw34-halters --jobs 3 \
            im-results/agent23-raw34-frontier/Raw34Defect.lean \
            im-results/agent23-raw34-frontier/Raw34Odometer.lean \
            2>&1 | tee /tmp/agent23-raw34-halters/audit.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/agent23-raw34-halters/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent23-raw34-halters/audit.log
          grep -F "'BB6Coverage.Agent23Defect.never'" /tmp/agent23-raw34-halters/audit.log
          grep -F "'BB6Coverage.Agent23Odometer.never'" /tmp/agent23-raw34-halters/audit.log
      - name: Prove four late-entry Raw34 translated half-line side cycles
        if: inputs.mode == 'f-long'
        run: |
          set -euo pipefail
          W=/tmp/agent23-raw34-halters
          mkdir -p "$W"
          python tools/lean_compile_closure.py --workdir "$W" --jobs 2 im-results/agent40-raw34-frontier/Raw34FLongSideCycles.lean 2>&1 | tee "$W/audit.log"
          python im-results/agent4-raw109/audit_axioms.py "$W/audit.log"
          ! grep -Eq 'sorryAx|native_decide' "$W/audit.log"
          grep -F "'BB6.Agent40Raw34FLongSideCycles.all_never'" "$W/audit.log"
      - name: Rank exact Raw34 complement after source-generatable F side cycles
        if: inputs.mode == 'cycle-rank'
        run: |
          set -euo pipefail
          W=/tmp/agent23-raw34-halters
          mkdir -p "$W/f3" "$W/f4"
          node im-results/agent40-raw34-frontier/generate_f_depth3_cycles.mjs \
            --output "$W/f3" --shard-size 50 > "$W/generate-f3.log"
          node im-results/agent40-raw34-frontier/generate_f_depth4_cycles.mjs \
            --output "$W/f4" --shard-size 100 > "$W/generate-f4.log"
          node --max-old-space-size=5120 im-results/agent40-raw34-frontier/rank_live_nonD1RD.mjs \
            --audit-disjoint-cycles --include-f-depth4 --include-f-long \
            --f-depth3-dir "$W/f3" --f-depth4-dir "$W/f4" \
            --query-cubes "$W/f4/manifest.json" > "$W/rank-cycles.json"
          node -e 'const j=require(process.argv[1]); console.log(JSON.stringify({baselineNonD1:j.totalResidualD1not1RD,disjointSources:j.cycleAudit,hard69:j.queryCubes&&{open:j.queryCubes.openCubes,residual:j.queryCubes.exactResidualGrossOverCubes,top:j.queryCubes.topOpen.slice(0,5)}},null,2))' "$W/rank-cycles.json"
      - name: Source-check F-branch depth-three translated side cycles (592 candidate tables)
        if: inputs.mode == 'f-depth3'
        run: |
          set -euo pipefail
          W=/tmp/agent23-raw34-halters
          mkdir -p "$W/generated" "$W/build"
          node im-results/agent40-raw34-frontier/generate_f_depth3_cycles.mjs \
            --output "$W/generated" --shard-size 50 | tee "$W/generation.json"
          mapfile -t roots < <(find "$W/generated" -maxdepth 1 -name 'Raw34FDepth3SideShard*.lean' | sort)
          test "${#roots[@]}" -eq 12
          python tools/lean_compile_closure.py --workdir "$W/build" \
            --source-root "$W/generated" --jobs 3 \
            "${roots[@]}" 2>&1 | tee "$W/audit.log"
          python im-results/agent4-raw109/audit_axioms.py "$W/audit.log"
          ! grep -Eq 'sorryAx|native_decide' "$W/audit.log"
          grep -F "'BB6.Agent40FDepth3.Raw34FDepth3SideShard011.all_never'" "$W/audit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent23-raw34-halters-source-audit
          path: |
            /tmp/agent23-raw34-halters/audit.log
            /tmp/agent23-raw34-halters/rank-*.json
            /tmp/agent23-raw34-halters/generate-f*.log
          retention-days: 14

  f-depth4-prepare:
    if: inputs.mode == 'f-depth4'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact original-source F depth-four cycle candidates
        run: |
          set -euo pipefail
          mkdir -p /tmp/a40-f-depth4-source
          node im-results/agent40-raw34-frontier/generate_f_depth4_cycles.mjs \
            --output /tmp/a40-f-depth4-source --shard-size 100 \
            > /tmp/a40-f-depth4-source/generation.log
          test "$(find /tmp/a40-f-depth4-source -maxdepth 1 -name 'Raw34FDepth4SideShard*.lean' | wc -l)" -eq 93
          grep -F '9231' /tmp/a40-f-depth4-source/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: a40-raw34-f-depth4-source
          path: /tmp/a40-f-depth4-source/
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
  f-depth4-check:
    if: inputs.mode == 'f-depth4'
    needs: f-depth4-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        group: [0,1,2,3,4,5]
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: a40-raw34-f-depth4-source
          path: /tmp/a40-f-depth4-source
      - name: Certify each disjoint depth-four side-cycle via authentic source checker
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          W=/tmp/a40-f-depth4-verify
          mkdir -p "$W"
          mapfile -t all < <(find /tmp/a40-f-depth4-source -maxdepth 1 -name 'Raw34FDepth4SideShard*.lean' | sort)
          test "${#all[@]}" -eq 93
          roots=()
          for i in "${!all[@]}"; do
            if (( i % 6 == GROUP )); then roots+=("${all[$i]}"); fi
          done
          test "${#roots[@]}" -ge 15
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir "$W/build" \
            --source-root /tmp/a40-f-depth4-source --jobs 2 \
            "${roots[@]}" 2>&1 | tee "$W/audit.log"
          python im-results/agent4-raw109/audit_axioms.py "$W/audit.log"
          ! grep -Eq 'sorryAx|native_decide' "$W/audit.log"
          grep -F '.all_never' "$W/audit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a40-raw34-f-depth4-source-audit-${{ matrix.group }}
          path: /tmp/a40-f-depth4-verify/audit.log
          if-no-files-found: warn
          retention-days: 30
