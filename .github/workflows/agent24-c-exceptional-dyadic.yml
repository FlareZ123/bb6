name: Agent 24 Machine C exceptional dyadic source verification (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-section:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unchanged original Machine C and new exact inverse theorems
        run: |
          mkdir -p /tmp/a24-exceptional
          cp im-results/agent11-c-line/CLine.lean /tmp/a24-exceptional/
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/a24-exceptional/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/a24-exceptional/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef,FastSectionProof,FastSectionHalting,Agent46CBridge}.lean /tmp/a24-exceptional/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,EvenTargetForward,BounceEvenExact,BounceOddExact,FullSectionInverse}.lean /tmp/a24-exceptional/
          cp im-results/agent3-c-odd-image/{Agent3CImage,Agent3COneFamily,Agent3COrbitIff}.lean /tmp/a24-exceptional/
          cp im-results/agent38-c-section-mod4/Agent38SectionParity.lean /tmp/a24-exceptional/
          cp im-results/agent15-c-halting/SectionAffineInverse.lean /tmp/a24-exceptional/
          cp im-results/agent24-c48/{EvenEvenInverse,OddEvenInverse,ExtraEvenOrbit,EvenRightSixOrbit}.lean /tmp/a24-exceptional/
          cp im-results/agent24-c-exceptional-dyadic/{TerminalCone,TerminalBroad,AlternateDyadic,ExpandedDyadic,AllDepthPhases,HighAllDepth,HighOtherBranch,HighOtherExplicit,HighExplicitFamily,HighResidual,HighActualStates}.lean /tmp/a24-exceptional/
          cd /tmp/a24-exceptional
          export LEAN_PATH="."
          lean --version
          for f in CLine GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef FastSectionProof FastSectionHalting Agent46CBridge; do lean -o "$f.olean" "$f.lean"; done
          for f in BounceInverse Agent3CImage Agent3COneFamily Agent3COrbitIff Agent38SectionParity SectionAffineInverse EvenEvenInverse OddEvenInverse ExtraEvenOrbit EvenRightSixOrbit; do lean -o "$f.olean" "$f.lean"; done
          for f in EvenTargetForward BounceEvenExact BounceOddExact FullSectionInverse; do lean -o "$f.olean" "$f.lean"; done
          lean -o TerminalCone.olean TerminalCone.lean
          lean -o TerminalBroad.olean TerminalBroad.lean
          lean -o AlternateDyadic.olean AlternateDyadic.lean
          lean -o ExpandedDyadic.olean ExpandedDyadic.lean
          lean -o AllDepthPhases.olean AllDepthPhases.lean
          lean -o HighAllDepth.olean HighAllDepth.lean
          lean -o HighOtherBranch.olean HighOtherBranch.lean
          lean -o HighOtherExplicit.olean HighOtherExplicit.lean
          lean -o HighExplicitFamily.olean HighExplicitFamily.lean
          cp "$GITHUB_WORKSPACE"/im-results/agent15-c-halting/{BounceHalting,SectionHalting,SectionPower,BlankHalting,SectionParam,BlankParam}.lean .
          for f in BounceHalting SectionHalting SectionPower BlankHalting SectionParam BlankParam; do lean -o "$f.olean" "$f.lean"; done
          lean -o HighResidual.olean HighResidual.lean
          lean -o HighActualStates.olean HighActualStates.lean
