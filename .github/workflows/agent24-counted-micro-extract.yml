name: Agent 24 one-time counted-micro source extraction
on:
  workflow_run:
    workflows: ["Agent 48 original champion-root six-step equivalence (manual)"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  expose:
    if: \${{ github.event.workflow_run.id == 42740367928 && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Decode and hash-check the exact Lean sources
        run: |
          set -euo pipefail
          base64 --decode im-results/agent24-champion-time/CountedOddUnary.lean.xz.b64 | xz --decompress > im-results/agent24-champion-time/CountedOddUnary.lean
          base64 --decode im-results/agent24-champion-time/CountedOneZeroUnary.lean.xz.b64 | xz --decompress > im-results/agent24-champion-time/CountedOneZeroUnary.lean
          printf '%s  %s\n' 'a035f6248194043509d47dd1aeee02c89374b37561db13897bb6b7d44f2e2cb4' im-results/agent24-champion-time/CountedOddUnary.lean | sha256sum --check
          printf '%s  %s\n' '0d1acc16c377f17e3f2c624a74f9874bafdf255f2fcdc9749c9d00c83b4f6737' im-results/agent24-champion-time/CountedOneZeroUnary.lean | sha256sum --check
          wc -l im-results/agent24-champion-time/CountedOddUnary.lean im-results/agent24-champion-time/CountedOneZeroUnary.lean
      - name: Push readable source branch
        run: |
          set -euo pipefail
          branch="agent24-counted-micro-readable-\${{ github.event.workflow_run.id }}"
          git checkout -b "$branch"
          git add im-results/agent24-champion-time/CountedOddUnary.lean im-results/agent24-champion-time/CountedOneZeroUnary.lean
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Agent 24: expose counted micro proof sources"
          git push origin "HEAD:refs/heads/$branch"
      - name: Preserve source artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent24-counted-micro-readable-sources
          path: |
            im-results/agent24-champion-time/CountedOddUnary.lean
            im-results/agent24-champion-time/CountedOneZeroUnary.lean
