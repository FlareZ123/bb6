name: Agent 24 one-time counted-micro source extraction
on:
  workflow_run:
    workflows:
      - "Agent 48 original champion-root six-step equivalence (manual)"
      - "Agent 24 counted-micro source extraction (PR-open only)"
    types: [completed]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  expose:
    if: \${{ github.event.workflow_run.id == 43138692184 && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode and hash-check the exact Lean sources
        run: |
          set -euo pipefail
          base64 --decode im-results/agent24-champion-time/CountedOddUnary.lean.xz.b64 | xz --decompress > /tmp/CountedOddUnary.lean
          base64 --decode im-results/agent24-champion-time/CountedOneZeroUnary.lean.xz.b64 | xz --decompress > /tmp/CountedOneZeroUnary.lean
          printf '%s  %s\n' 'a035f6248194043509d47dd1aeee02c89374b37561db13897bb6b7d44f2e2cb4' /tmp/CountedOddUnary.lean | sha256sum --check
          printf '%s  %s\n' '0d1acc16c377f17e3f2c624a74f9874bafdf255f2fcdc9749c9d00c83b4f6737' /tmp/CountedOneZeroUnary.lean | sha256sum --check
          wc -l /tmp/CountedOddUnary.lean /tmp/CountedOneZeroUnary.lean
      - name: Preserve decoded Lean files as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent24-counted-micro-readable-sources
          path: |
            /tmp/CountedOddUnary.lean
            /tmp/CountedOneZeroUnary.lean
      - name: Publish readable source to the research mailbox
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -n --rawfile body /tmp/CountedOddUnary.lean '{body: ("Agent 24 extracted CountedOddUnary.lean (hash-checked).\n\n" + $body)}' > /tmp/odd-comment.json
          jq -n --rawfile body /tmp/CountedOneZeroUnary.lean '{body: ("Agent 24 extracted CountedOneZeroUnary.lean (hash-checked).\n\n" + $body)}' > /tmp/onezero-comment.json
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data-binary @/tmp/odd-comment.json https://api.github.com/repos/FlareZ123/bb6/issues/48/comments >/dev/null
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data-binary @/tmp/onezero-comment.json https://api.github.com/repos/FlareZ123/bb6/issues/48/comments >/dev/null
