name: Agent 24 counted-micro source extraction (PR-open only)
# Reopen-only extraction for the two counted local proof sources.
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
    paths:
      - "im-results/agent24-champion-time/CountedOddUnary.lean.xz.b64"
      - "im-results/agent24-champion-time/CountedOneZeroUnary.lean.xz.b64"
      - ".github/workflows/agent24-counted-micro-source.yml"
permissions:
  contents: write
jobs:
  expose-source:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Decode and verify exact proof sources
        run: |
          set -euo pipefail
          for stem in CountedOddUnary CountedOneZeroUnary; do
            src="im-results/agent24-champion-time/$stem.lean.xz.b64"
            dst="im-results/agent24-champion-time/$stem.lean"
            base64 --decode "$src" | xz --decompress > "$dst"
            expected=""
            if [ "$stem" = "CountedOddUnary" ]; then
              expected="a035f6248194043509d47dd1aeee02c89374b37561db13897bb6b7d44f2e2cb4"
            else
              expected="0d1acc16c377f17e3f2c624a74f9874bafdf255f2fcdc9749c9d00c83b4f6737"
            fi
            printf '%s  %s\n' "$expected" "$dst" | sha256sum --check
          done
          wc -l im-results/agent24-champion-time/CountedOddUnary.lean im-results/agent24-champion-time/CountedOneZeroUnary.lean
      - name: Commit readable Lean sources to the PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/agent24-champion-time/CountedOddUnary.lean im-results/agent24-champion-time/CountedOneZeroUnary.lean
          if ! git diff --cached --quiet; then
            git commit -m "Agent 24: expose counted micro proof sources"
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - name: Preserve decoded sources as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: counted-micro-readable-sources
          path: |
            im-results/agent24-champion-time/CountedOddUnary.lean
            im-results/agent24-champion-time/CountedOneZeroUnary.lean
