name: Agent 24 Cryptid D root and remainder-two Lean verification (manual)

on:
  workflow_dispatch:
    inputs:
      proof_target:
        description: 'Root resets, remainder-one extensions, or source suffix shifts'
        required: false
        type: choice
        default: root-reset
        options:
          - root-reset
          - root-remainder-one
          - suffix3-shift
          - suffix3-full
          - suffix3-word
          - suffix3-zero
          - suffix3-two
          - suffix3-growth
          - suffix3-residual-one
          - suffix3-padded-two

permissions:
  contents: read

jobs:
  source-kernel:
    runs-on: ubuntu-latest
    env:
      PROOF_TARGET: ${{ inputs.proof_target }}
    timeout-minutes: 45
    steps:
      - name: Checkout pinned Cryptids source
        uses: actions/checkout@v4
        with:
          repository: google-deepmind/cryptids
          ref: 3647718b5df22e1a61462dec0376bd204526285a
          path: cryptids
          persist-credentials: false

      - name: Checkout bb6 research artifacts
        uses: actions/checkout@v4
        with:
          path: bb6
          persist-credentials: false

      - name: Install upstream-pinned Lean toolchain
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          test "$(git -C cryptids rev-parse HEAD)" = "3647718b5df22e1a61462dec0376bd204526285a"

      - name: Restore pinned Mathlib cache
        working-directory: cryptids
        run: lake exe cache get

      - name: Append selected source-local proof with audited endpoint corrections
        working-directory: cryptids
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          module = Path("BusyBeaver/BB6/Accelerations/M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.lean")
          root_path = Path("../bb6/im-results/agent12-cryptid-root-invariant/RootCountdownSweep.append.lean")
          reset_path = Path("../bb6/im-results/agent2-root-countdown/RootRemainderTwoToken.append.lean")
          ending = "end BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA"

          if os.environ.get("PROOF_TARGET") in ("suffix3-shift", "suffix3-full", "suffix3-word", "suffix3-zero", "suffix3-two", "suffix3-growth", "suffix3-residual-one", "suffix3-padded-two"):
              base = Path("../bb6/im-results/agent48-suffix3-shift")
              target = os.environ.get("PROOF_TARGET")
              if target in ("suffix3-growth", "suffix3-residual-one"):
                  root = root_path.read_text()
                  old1 = "root_countdown_dr_zero_step [] tail"
                  old2 = "root_countdown_dr_empty_left_step ((1,0) :: (0,0) :: tail)"
                  old3 = "root_countdown_dl_zero_step [(0,0)]\\n    [(0,0),(x-3,0)]"
                  if root.count(old1) != 1 or root.count(old2) != 1 or root.count(old3) != 1:
                      raise SystemExit("expected exactly one h5, h6, and general-tail h7 source call")
                  root = root.replace(old1, "root_countdown_dr_zero_step [] ((0,0) :: tail)", 1)
                  root = root.replace(old2, "root_countdown_dr_empty_left_step ((1,0) :: (0,0) :: (0,0) :: tail)", 1)
                  root = root.replace(old3, "root_countdown_dl_zero_step [(0,0)]\\n    [(0,0),(0,0),(x-3,0)]", 1)
                  corrected_root_path = Path("/tmp/RootCountdownSweep.corrected.lean")
                  corrected_root_path.write_text(root)
                  if target == "suffix3-growth":
                      fragments = [corrected_root_path, base / "RootTokenGrowthStep5.append.lean"]
                  else:
                      fragments = [corrected_root_path, reset_path,
                                   base / "RootTokenGrowthStep5.append.lean",
                                   base / "ResidualOneNeverHalts.append.lean"]
              else:
                  fragments = [base / "RootSuffixThreeShift.append.lean"]
              if os.environ.get("PROOF_TARGET") == "suffix3-full":
                  fragments += [base / "RootSuffixBaseZero.append.lean",
                                base / "RootSuffixBaseTwo.append.lean",
                                base / "RootSuffixWordShift.append.lean"]
              elif os.environ.get("PROOF_TARGET") == "suffix3-zero":
                  fragments += [base / "RootSuffixBaseZero.append.lean"]
              elif os.environ.get("PROOF_TARGET") == "suffix3-two":
                  fragments += [base / "RootSuffixBaseZero.append.lean",
                                base / "RootSuffixBaseTwo.append.lean"]
              elif os.environ.get("PROOF_TARGET") == "suffix3-padded-two":
                  fragments += [base / "RootSuffixBaseZero.append.lean",
                                base / "RootSuffixBaseTwo.append.lean",
                                base / "RootPaddedTwoReset.append.lean"]
              elif os.environ.get("PROOF_TARGET") == "suffix3-word":
                  fragments += [base / "RootSuffixWordShift.append.lean"]
              source = module.read_text().rstrip().splitlines()
              if source[-1].strip() != ending:
                  raise SystemExit(f"unexpected source-module ending: {source[-1]!r}")
              module.write_text("\n".join(source[:-1]) + "\n\n" +
                                "\n\n".join(p.read_text().rstrip() for p in fragments) +
                                "\n\n" + ending + "\n")
              print("Inserted standalone original-source fragments:",
                    [p.name for p in fragments])
              raise SystemExit(0)
          if os.environ.get("PROOF_TARGET") not in ("", "root-reset", "root-remainder-one"):
              raise SystemExit("invalid proof target")

          root = root_path.read_text()
          old1 = "root_countdown_dr_zero_step [] tail"
          old2 = "root_countdown_dr_empty_left_step ((1,0) :: (0,0) :: tail)"
          old3 = "root_countdown_dl_zero_step [(0,0)]\n    [(0,0),(x-3,0)]"
          if root.count(old1) != 1 or root.count(old2) != 1 or root.count(old3) != 1:
              raise SystemExit("expected exactly one h5, h6, and general-tail h7 source call")
          root = root.replace(old1, "root_countdown_dr_zero_step [] ((0,0) :: tail)", 1)
          root = root.replace(old2, "root_countdown_dr_empty_left_step ((1,0) :: (0,0) :: (0,0) :: tail)", 1)
          root = root.replace(old3, "root_countdown_dl_zero_step [(0,0)]\n    [(0,0),(0,0),(x-3,0)]", 1)

          reset = reset_path.read_text()
          source = module.read_text().rstrip().splitlines()
          if source[-1].strip() != ending:
              raise SystemExit(f"unexpected source-module ending: {source[-1]!r}")
          module.write_text(
              "\n".join(source[:-1]) + "\n\n" + root.rstrip() +
              "\n\n" + reset.rstrip() + "\n\n" + ending + "\n"
          )
          print("Appended root countdown and remainder proof fragments.")
          print("Applied h5/h6 prefix and general-tail h7 endpoint corrections.")
          PY
          git diff --check

      - name: Kernel-check root chain and remainder-two reset
        working-directory: cryptids
        env:
          LEAN_NUM_THREADS: "1"
        shell: bash
        run: |
          set -euo pipefail
          MODULE=BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA
          lake build "$MODULE" 2>&1 | tee /tmp/agent24-root-reset-build.log
          if [[ "${PROOF_TARGET:-root-reset}" == "suffix3-shift" ]]; then
            cat > RootResetAudit.lean <<'EOF'
          import BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_universal_suffix_shift
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_iterated_suffix_shift
          EOF
          elif [[ "${PROOF_TARGET:-root-reset}" == "suffix3-zero" ]]; then
            cat > RootResetAudit.lean <<'EOF'
          import BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_zero_suffix_reset
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_zero_residue_family
          EOF
          elif [[ "${PROOF_TARGET:-root-reset}" == "suffix3-growth" ]]; then
            cat > RootResetAudit.lean <<'EOF'
          import BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_tok_growth_to_CR
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_CR_to_growth_step5
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_tok_growth_step5
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_tok_growth_never_halts
          EOF
          elif [[ "${PROOF_TARGET:-root-reset}" == "suffix3-residual-one" ]]; then
            cat > RootResetAudit.lean <<'EOF'
          import BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_tok_growth_step5
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_tok_growth_never_halts
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_residual_one_to_CR
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_CR_to_T
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_residual_one_to_T
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_residual_one_never_halts
          EOF
          elif [[ "${PROOF_TARGET:-root-reset}" == "suffix3-two" ]]; then
            cat > RootResetAudit.lean <<'EOF'
          import BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_two_suffix_reset
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_two_residue_family
          EOF
          elif [[ "${PROOF_TARGET:-root-reset}" == "suffix3-padded-two" ]]; then
            cat > RootResetAudit.lean <<'EOF'
          import BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_padded_two_reset
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_padded_two_even_extension
          EOF
          elif [[ "${PROOF_TARGET:-root-reset}" == "suffix3-word" ]]; then
            cat > RootResetAudit.lean <<'EOF'
          import BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_universal_word_suffix_shift
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_iterated_word_suffix_shift
          EOF
          elif [[ "${PROOF_TARGET:-root-reset}" == "root-remainder-one" ]]; then
            cat > RootResetAudit.lean <<'EOF'
          import BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.root_chain_to_D65_2
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.root_countdown_two_reset
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.root_countdown_general_tail_with_suffix
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.root_countdown_one_reset
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.root_countdown_one_five_reset
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.root_countdown_two_reset_five_suffix
          EOF
          elif [[ "${PROOF_TARGET:-root-reset}" == "suffix3-full" ]]; then
            cat > RootResetAudit.lean <<'EOF'
          import BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_universal_suffix_shift
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_zero_residue_family
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_two_residue_family
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.s3_universal_word_suffix_shift
          EOF
          else
            cat > RootResetAudit.lean <<'EOF'
          import BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.root_chain_to_D65_2
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.root_countdown_two_reset
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.root_d2_dl_one_z1
          EOF
          fi
          lake env lean RootResetAudit.lean 2>&1 | tee /tmp/agent24-root-reset-axioms.log
          if grep -q 'sorryAx' /tmp/agent24-root-reset-axioms.log; then
            echo "::error::root/reset theorem depends on sorryAx"
            exit 1
          fi
