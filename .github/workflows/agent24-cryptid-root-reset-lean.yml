name: Agent 24 Cryptid D root and remainder-two Lean verification (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pinned Cryptids source
        uses: actions/checkout@v4
        with:
          repository: google-deepmind/cryptids
          ref: 3647718b5df22e1a61462dec0376bd204526285a
          path: cryptids
          persist-credentials: false

      - name: Checkout bb6 research artifacts
        uses: actions/checkout@v4
        with:
          path: bb6
          persist-credentials: false

      - name: Install upstream-pinned Lean toolchain
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          test "$(git -C cryptids rev-parse HEAD)" = "3647718b5df22e1a61462dec0376bd204526285a"

      - name: Restore pinned Mathlib cache
        working-directory: cryptids
        run: lake exe cache get

      - name: Append source-local root and reset proofs with the audited prefix correction
        working-directory: cryptids
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module = Path("BusyBeaver/BB6/Accelerations/M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.lean")
          root_path = Path("../bb6/im-results/agent12-cryptid-root-invariant/RootCountdownSweep.append.lean")
          reset_path = Path("../bb6/im-results/agent2-root-countdown/RootRemainderTwoToken.append.lean")
          ending = "end BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA"

          root = root_path.read_text()
          old1 = "root_countdown_dr_zero_step [] tail"
          old2 = "root_countdown_dr_empty_left_step ((1,0) :: (0,0) :: tail)"
          if root.count(old1) != 1 or root.count(old2) != 1:
              raise SystemExit("expected exactly one h5 and h6 source call")
          root = root.replace(old1, "root_countdown_dr_zero_step [] ((0,0) :: tail)", 1)
          root = root.replace(old2, "root_countdown_dr_empty_left_step ((1,0) :: (0,0) :: (0,0) :: tail)", 1)

          reset = reset_path.read_text()
          source = module.read_text().rstrip().splitlines()
          if source[-1].strip() != ending:
              raise SystemExit(f"unexpected source-module ending: {source[-1]!r}")
          module.write_text(
              "\n".join(source[:-1]) + "\n\n" + root.rstrip() +
              "\n\n" + reset.rstrip() + "\n\n" + ending + "\n"
          )
          print("Appended root countdown + remainder-two proof fragments.")
          print("Applied only the independently identified h5/h6 prefix endpoint correction.")
          PY
          git diff --check

      - name: Kernel-check root chain and remainder-two reset
        working-directory: cryptids
        env:
          LEAN_NUM_THREADS: "1"
        shell: bash
        run: |
          set -euo pipefail
          MODULE=BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA
          lake build "$MODULE" 2>&1 | tee /tmp/agent24-root-reset-build.log
          cat > RootResetAudit.lean <<'EOF'
          import BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.root_chain_to_D65_2
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.root_countdown_two_reset
          #print axioms BusyBeaver.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA.root_d2_dl_one_z1
          EOF
          lake env lean RootResetAudit.lean 2>&1 | tee /tmp/agent24-root-reset-axioms.log
          if grep -q 'sorryAx' /tmp/agent24-root-reset-axioms.log; then
            echo "::error::root/reset theorem depends on sorryAx"
            exit 1
          fi
