name: Agent 24 m0 even q4 prefix Lean verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Stage exact source dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/a24-m0-even
          cp im-results/agent8-coverage-contract/{Frontier,Symmetry,RootShift}.lean /tmp/a24-m0-even/
          cp im-results/agent48-champion-root/ChampionRootBridge.lean /tmp/a24-m0-even/
          base64 --decode im-results/agent26-tm63-uniform/UniformTM63-verified.lean.gz.b64 | gzip --decompress > /tmp/a24-m0-even/UniformTM63.lean
          cp im-results/agent24-champion-time/{CountedSweep,CountedOddBase,ChampionModular,CostRecurrence,CountPattern,Q4RightEndpoint}.lean /tmp/a24-m0-even/
          cp im-results/agent8-s1-encoder/S1Encoder.lean /tmp/a24-m0-even/
          cp im-results/agent8-counted-reset/{CountedReset,Q4Suffix}.lean /tmp/a24-m0-even/
          cp im-results/agent8-rst1prime/CountedRst1Prime.lean /tmp/a24-m0-even/
          cp im-results/agent6-q4-prefix/CountedQ4Prefix.lean /tmp/a24-m0-even/
          cp im-results/agent24-champion-time/{M0EvenQ4Bridge,M0EvenQ4Prefix}.lean /tmp/a24-m0-even/
          cp im-results/agent24-champion-time/{CountedOddUnary,CountedOneZeroUnary,CountedCarryBridges,CountedCarryPrefix,CountedCarryPrefixGeneral,CountedCarryLeftOutputR23,CountedSuffixOutput,S1CarryOutputBridge,S1CarryInc0,M0EvenQ4Suffix}.lean /tmp/a24-m0-even/
          cp im-results/agent42-carry-boundary/{CountedCarryBoundaryTraces,S1CountedCarryPrefixBridge}.lean /tmp/a24-m0-even/
          cp im-results/agent42-carry-left-output/{FrameCellLemmas,LongResidue1}.lean /tmp/a24-m0-even/
          cp im-results/agent3-carry-left-output/CountedCarryLeftOutput.lean /tmp/a24-m0-even/
          cp im-results/agent2-inc0-odd-canonical/S1OddCanonicalOutput.lean /tmp/a24-m0-even/
          cp im-results/agent48-counted-inc0/{S1CountedInc0,S1CountedDrain}.lean /tmp/a24-m0-even/
      - name: Replay and compile m0 even q4 counted increment
        run: |
          set -euo pipefail
          cd /tmp/a24-m0-even
          export LEAN_PATH=.
          lean --version
          python3 "$GITHUB_WORKSPACE/im-results/agent24-champion-time/m0_even_n2_replay.py"
          lean -o Frontier.olean Frontier.lean
          lean -o Symmetry.olean Symmetry.lean
          lean -o RootShift.olean RootShift.lean
          lean -o ChampionRootBridge.olean ChampionRootBridge.lean
          lean -o UniformTM63.olean UniformTM63.lean
          lean -o CountedSweep.olean CountedSweep.lean
          lean -o CountedOddBase.olean CountedOddBase.lean
          lean -o S1Encoder.olean S1Encoder.lean
          lean -o ChampionModular.olean ChampionModular.lean
          lean -o CostRecurrence.olean CostRecurrence.lean
          lean -o CountPattern.olean CountPattern.lean
          : > m0-even-q4-axioms.log
          : > rst1-prime-axioms.log
          lean -o CountedReset.olean CountedReset.lean
          lean -o CountedQ4Prefix.olean CountedQ4Prefix.lean
          lean -o CountedRst1Prime.olean CountedRst1Prime.lean 2>&1 | tee rst1-prime-axioms.log
          if grep -q 'sorryAx' rst1-prime-axioms.log; then echo '::error::sorryAx in CountedRst1Prime'; exit 1; fi
          lean -o Q4Suffix.olean Q4Suffix.lean
          lean -o Q4RightEndpoint.olean Q4RightEndpoint.lean
          if ! lean -o M0EvenQ4Bridge.olean M0EvenQ4Bridge.lean > m0-even-q4-axioms.log 2>&1; then
            echo '## M0EvenQ4Bridge compilation failed' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 m0-even-q4-axioms.log >> "$GITHUB_STEP_SUMMARY"
            cat m0-even-q4-axioms.log
            exit 1
          fi
          if grep -q 'sorryAx' m0-even-q4-axioms.log; then
            echo '::error::sorryAx found in m0 even finite bridge proofs'
            exit 1
          fi
          if ! lean -o M0EvenQ4Prefix.olean M0EvenQ4Prefix.lean >> m0-even-q4-axioms.log 2>&1; then
            echo '## M0EvenQ4Prefix compilation failed' >> "$GITHUB_STEP_SUMMARY"
            tail -n 160 m0-even-q4-axioms.log >> "$GITHUB_STEP_SUMMARY"
            cat m0-even-q4-axioms.log
            exit 1
          fi
          if grep -q 'sorryAx' m0-even-q4-axioms.log; then
            echo '::error::sorryAx found in m0 even q4 prefix proof'
            exit 1
          fi

          # Compile the counted carry/drain chain required by the M0-even suffix.
          lean -o CountedOddUnary.olean CountedOddUnary.lean
          lean -o CountedOneZeroUnary.olean CountedOneZeroUnary.lean
          lean -o CountedCarryBridges.olean CountedCarryBridges.lean
          : > carry-boundary-axioms.log
          lean -o CountedCarryBoundaryTraces.olean CountedCarryBoundaryTraces.lean 2>&1 | tee carry-boundary-axioms.log
          if grep -q 'sorryAx' carry-boundary-axioms.log; then echo '::error::sorryAx in CountedCarryBoundaryTraces'; exit 1; fi
          : > frame-cell-lemmas-axioms.log
          lean -o FrameCellLemmas.olean FrameCellLemmas.lean 2>&1 | tee frame-cell-lemmas-axioms.log
          if grep -q 'sorryAx' frame-cell-lemmas-axioms.log; then echo '::error::sorryAx in FrameCellLemmas'; exit 1; fi
          : > carry-prefix-axioms.log
          lean -o CountedCarryPrefix.olean CountedCarryPrefix.lean 2>&1 | tee carry-prefix-axioms.log
          if grep -q 'sorryAx' carry-prefix-axioms.log; then echo '::error::sorryAx in CountedCarryPrefix'; exit 1; fi
          : > carry-prefix-general-axioms.log
          lean -o CountedCarryPrefixGeneral.olean CountedCarryPrefixGeneral.lean 2>&1 | tee carry-prefix-general-axioms.log
          if grep -q 'sorryAx' carry-prefix-general-axioms.log; then echo '::error::sorryAx in CountedCarryPrefixGeneral'; exit 1; fi
          : > s1-counted-carry-prefix-bridge-axioms.log
          lean -o S1CountedCarryPrefixBridge.olean S1CountedCarryPrefixBridge.lean 2>&1 | tee s1-counted-carry-prefix-bridge-axioms.log
          if grep -q 'sorryAx' s1-counted-carry-prefix-bridge-axioms.log; then echo '::error::sorryAx in S1CountedCarryPrefixBridge'; exit 1; fi
          : > carry-left-output-axioms.log
          lean -o CountedCarryLeftOutput.olean CountedCarryLeftOutput.lean 2>&1 | tee carry-left-output-axioms.log
          if grep -q 'sorryAx' carry-left-output-axioms.log; then echo '::error::sorryAx in CountedCarryLeftOutput'; exit 1; fi
          : > carry-left-output-r23-axioms.log
          lean -o CountedCarryLeftOutputR23.olean CountedCarryLeftOutputR23.lean 2>&1 | tee carry-left-output-r23-axioms.log
          if grep -q 'sorryAx' carry-left-output-r23-axioms.log; then echo '::error::sorryAx in CountedCarryLeftOutputR23'; exit 1; fi
          : > long-residue1-axioms.log
          lean -o LongResidue1.olean LongResidue1.lean 2>&1 | tee long-residue1-axioms.log
          if grep -q 'sorryAx' long-residue1-axioms.log; then echo '::error::sorryAx in LongResidue1'; exit 1; fi
          : > counted-suffix-output-axioms.log
          lean -o CountedSuffixOutput.olean CountedSuffixOutput.lean 2>&1 | tee counted-suffix-output-axioms.log
          if grep -q 'sorryAx' counted-suffix-output-axioms.log; then echo '::error::sorryAx in CountedSuffixOutput'; exit 1; fi
          : > s1-carry-output-bridge-axioms.log
          lean -o S1CarryOutputBridge.olean S1CarryOutputBridge.lean 2>&1 | tee s1-carry-output-bridge-axioms.log
          if grep -q 'sorryAx' s1-carry-output-bridge-axioms.log; then echo '::error::sorryAx in S1CarryOutputBridge'; exit 1; fi
          : > s1-carry-inc0-axioms.log
          lean -o S1CarryInc0.olean S1CarryInc0.lean 2>&1 | tee s1-carry-inc0-axioms.log
          if grep -q 'sorryAx' s1-carry-inc0-axioms.log; then echo '::error::sorryAx in S1CarryInc0'; exit 1; fi
          : > s1-odd-canonical-output-axioms.log
          lean -o S1OddCanonicalOutput.olean S1OddCanonicalOutput.lean 2>&1 | tee s1-odd-canonical-output-axioms.log
          if grep -q 'sorryAx' s1-odd-canonical-output-axioms.log; then echo '::error::sorryAx in S1OddCanonicalOutput'; exit 1; fi
          : > s1-counted-inc0-axioms.log
          lean -o S1CountedInc0.olean S1CountedInc0.lean 2>&1 | tee s1-counted-inc0-axioms.log
          if grep -q 'sorryAx' s1-counted-inc0-axioms.log; then echo '::error::sorryAx in S1CountedInc0'; exit 1; fi
          : > s1-counted-drain-axioms.log
          lean -o S1CountedDrain.olean S1CountedDrain.lean 2>&1 | tee s1-counted-drain-axioms.log
          if grep -q 'sorryAx' s1-counted-drain-axioms.log; then echo '::error::sorryAx in S1CountedDrain'; exit 1; fi
          : > m0-even-q4-suffix-axioms.log
          if ! lean -o M0EvenQ4Suffix.olean M0EvenQ4Suffix.lean > m0-even-q4-suffix-axioms.log 2>&1; then
            echo '## M0EvenQ4Suffix compilation failed' >> "$GITHUB_STEP_SUMMARY"
            tail -n 160 m0-even-q4-suffix-axioms.log >> "$GITHUB_STEP_SUMMARY"
            cat m0-even-q4-suffix-axioms.log
            exit 1
          fi
          if grep -q 'sorryAx' m0-even-q4-suffix-axioms.log; then
            echo '::error::sorryAx found in M0EvenQ4Suffix counted increment source'
            exit 1
          fi
          echo '## M0-even counted increment source verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'The source-level q4 suffix and counted drain compile without sorryAx.' >> "$GITHUB_STEP_SUMMARY"
          echo '## m=0,n=2 even q4 prefix Lean verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'The finite bridge and source-level prefix compile under Lean 4.36.0-rc2 without sorryAx.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload M0-even counted increment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-even-counted-increment-logs-${{ github.run_id }}
          path: |
            /tmp/a24-m0-even/m0-even-q4-axioms.log
            /tmp/a24-m0-even/rst1-prime-axioms.log
            /tmp/a24-m0-even/carry-boundary-axioms.log
            /tmp/a24-m0-even/frame-cell-lemmas-axioms.log
            /tmp/a24-m0-even/carry-prefix-axioms.log
            /tmp/a24-m0-even/carry-prefix-general-axioms.log
            /tmp/a24-m0-even/s1-counted-carry-prefix-bridge-axioms.log
            /tmp/a24-m0-even/carry-left-output-axioms.log
            /tmp/a24-m0-even/carry-left-output-r23-axioms.log
            /tmp/a24-m0-even/long-residue1-axioms.log
            /tmp/a24-m0-even/counted-suffix-output-axioms.log
            /tmp/a24-m0-even/s1-carry-output-bridge-axioms.log
            /tmp/a24-m0-even/s1-carry-inc0-axioms.log
            /tmp/a24-m0-even/s1-odd-canonical-output-axioms.log
            /tmp/a24-m0-even/s1-counted-inc0-axioms.log
            /tmp/a24-m0-even/s1-counted-drain-axioms.log
            /tmp/a24-m0-even/m0-even-q4-suffix-axioms.log
