name: Agent 24 source-checked finite translated-cycle oracle (manual)

on:
  workflow_dispatch:
    inputs:
      verify_agent1_four_slot:
        description: 'Check the 300-way four-slot moving-pair source certificate (manual only)'
        required: false
        type: boolean
        default: false
      verify_agent1_five_step:
        description: 'Check the 1200-way five-step blank-drift source certificate (manual only)'
        required: false
        type: boolean
        default: false
      verify_agent1_depth4_gap:
        description: 'Check original-source depth-four open-family theorem for the 1200 five-step cylinders'
        required: false
        type: boolean
        default: false
      verify_agent1_exhaustive_five:
        description: 'Run the complete 41760-cylinder geometric and physical trace enumeration'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  translated-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check source-backed translated-cycle theorem and executable oracle
        run: |
          set -eu
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider:im-results/agent24-translated-cycle"
          lean --version
          lean -o im-results/agent8-coverage-contract/Frontier.olean im-results/agent8-coverage-contract/Frontier.lean
          for m in RayClosed RayChecker RayEntry RayFinite RayTurnExample RayFiniteOracle FiniteHalting Symmetry RootShift; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          lean -o im-results/agent24-translated-cycle/TranslatedCycle.olean im-results/agent24-translated-cycle/TranslatedCycle.lean
          lean -o im-results/agent24-translated-cycle/TranslatedFiniteOracle.olean im-results/agent24-translated-cycle/TranslatedFiniteOracle.lean
          for m in RayMacro EntryMacroOracle EntryMacroLeft; do
            lean -o "im-results/agent6-fresh-glider/$m.olean" "im-results/agent6-fresh-glider/$m.lean"
          done
          lean -o im-results/agent44-drift-closure/DirectedDrift.olean im-results/agent44-drift-closure/DirectedDrift.lean
          for m in ZeroMaskOracle FiniteDecision; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          for m in FrontierAudit FrontierMass; do
            lean -o "im-results/agent4-coverage-smoke/$m.olean" "im-results/agent4-coverage-smoke/$m.lean"
          done
          for m in ZeroPathAudit ControlPathAudit ZeroRowAudit PhysicalTraceAudit; do
            lean -o "im-results/agent32-zero-prefix-global/$m.olean" "im-results/agent32-zero-prefix-global/$m.lean"
          done
          lean -o im-results/agent32-zero-prefix-global/FiniteLassoOracle.olean im-results/agent32-zero-prefix-global/FiniteLassoOracle.lean
          lean -o im-results/agent32-zero-prefix-global/LassoTraceAudit.olean im-results/agent32-zero-prefix-global/LassoTraceAudit.lean
          lean -o im-results/agent24-translated-cycle/TranslatedSeparation.olean im-results/agent24-translated-cycle/TranslatedSeparation.lean
          lean -o im-results/agent24-translated-cycle/TranslatedFrontier.olean im-results/agent24-translated-cycle/TranslatedFrontier.lean

      - name: Check 300-way original finite translated pair source theorem (opt-in)
        if: ${{ inputs.verify_agent1_four_slot }}
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider:im-results/agent24-translated-cycle:im-results/agent1-four-slot-pair-convoy"
          lean -o im-results/agent1-four-slot-pair-convoy/FourSlotParamFamily.olean im-results/agent1-four-slot-pair-convoy/FourSlotParamFamily.lean 2>&1 | tee /tmp/agent1-four-slot-300.log
          if grep -q 'sorryAx' /tmp/agent1-four-slot-300.log; then
            echo "ERROR: four-slot family source theorem depends on sorryAx"
            exit 1
          fi

      - name: Check 1200-way original finite translated blank source theorem (opt-in)
        if: ${{ inputs.verify_agent1_five_step }}
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider:im-results/agent24-translated-cycle:im-results/agent1-five-step-blank-drift"
          lean -o im-results/agent1-five-step-blank-drift/FiveStepBlankFamily.olean im-results/agent1-five-step-blank-drift/FiveStepBlankFamily.lean 2>&1 | tee /tmp/agent1-five-step-1200.log
          if grep -q 'sorryAx' /tmp/agent1-five-step-1200.log; then
            echo "ERROR: five-step family source theorem depends on sorryAx"
            exit 1
          fi

      - name: Check exact 1200-way original-source depth-four frontier gap (opt-in)
        if: ${{ inputs.verify_agent1_depth4_gap }}
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider:im-results/agent24-translated-cycle:im-results/agent1-five-step-blank-drift"
          lean -o im-results/agent1-five-step-blank-drift/FiveStepFrontierGap.olean im-results/agent1-five-step-blank-drift/FiveStepFrontierGap.lean 2>&1 | tee /tmp/agent1-five-step-depth4-gap.log
          if grep -q 'sorryAx' /tmp/agent1-five-step-depth4-gap.log; then
            echo "ERROR: five-step depth-four frontier theorem depends on sorryAx"
            exit 1
          fi

      - name: Enumerate all five-transition translated-blank source cylinders (opt-in)
        if: ${{ inputs.verify_agent1_exhaustive_five }}
        run: |
          set -euo pipefail
          node im-results/agent1-five-step-exhaustive-blank/enumerate_five_step_blank.cjs
