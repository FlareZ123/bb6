name: Agent 24 type-C q4 bridge source audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typec-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original semantics and type-C bridge
        run: |
          set -euo pipefail
          mkdir -p /tmp/typec
          cp im-results/agent8-coverage-contract/{Frontier,Symmetry,RootShift}.lean /tmp/typec/
          cp im-results/agent48-champion-root/ChampionRootBridge.lean /tmp/typec/
          cp im-results/agent24-champion-time/CountedOddBase.lean /tmp/typec/
          cp im-results/agent48-champion-root/TypeCQ4Bridge.lean /tmp/typec/
          cd /tmp/typec
          export LEAN_PATH=.
          lean --version
          lean -o Frontier.olean Frontier.lean
          lean -o Symmetry.olean Symmetry.lean
          lean -o RootShift.olean RootShift.lean
          lean -o ChampionRootBridge.olean ChampionRootBridge.lean
          lean -o CountedOddBase.olean CountedOddBase.lean
          : > typec-bridge-axioms.log
          lean -o TypeCQ4Bridge.olean TypeCQ4Bridge.lean 2>&1 | tee typec-bridge-axioms.log
          grep -F "'BB6Coverage.Agent48Champion.typeC_bridge_finite' depends on axioms:" typec-bridge-axioms.log
          grep -F "'BB6Coverage.Agent48Champion.typeC_bridge_at' depends on axioms:" typec-bridge-axioms.log
          if grep -q 'sorryAx' typec-bridge-axioms.log; then
            echo "::error::sorryAx found in type-C q4 bridge proof"
            exit 1
          fi
