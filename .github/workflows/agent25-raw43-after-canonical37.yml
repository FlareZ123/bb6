name: Agent25 Raw43 conditional after accepted Canonical37

on:
  workflow_dispatch:
    inputs:
      raw47_run_id:
        description: 'Accepted Raw47 whole-parent run'
        required: true
        type: string
        default: '46068688341'
      raw112_run_id:
        description: 'Accepted Raw112 whole-parent run'
        required: true
        type: string
        default: '46146501930'
      onele_run:
        description: 'Accepted Raw39 1LE source run'
        required: true
        type: string
        default: '46114235329'

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unrelated hosted SDKs
        run: |
          set -euo pipefail
          df -h /
          for folder in /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell; do
            if [[ -d "$folder" ]]; then sudo rm -rf "$folder"; fi
          done
          df -h /
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - name: Rebuild Canonical37 and source-check Raw43 conditional successor
        env:
          GH_TOKEN: ${{ github.token }}
          RAW47_RUN_ID: ${{ inputs.raw47_run_id }}
          RAW112_RUN_ID: ${{ inputs.raw112_run_id }}
          ONELE_RUN: ${{ inputs.onele_run }}
        run: |
          set -euo pipefail
          [[ "$RAW47_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RAW112_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ONELE_RUN" =~ ^[0-9]+$ ]]
          lean --version | grep -F '4.36.0-rc2'
          python -m py_compile im-results/agent25-raw43/check_canonical37_after_raw47.py
          python im-results/agent13-coverage/unpack.py
          python im-results/agent25-raw43/check_canonical37_after_raw47.py             --work /tmp/a25-raw43-after-canonical37             --raw47-run-id "$RAW47_RUN_ID"             --raw112-run-id "$RAW112_RUN_ID"             --onele-run "$ONELE_RUN"             | tee /tmp/a25-raw43-after-canonical37.log
          test -s /tmp/a25-raw43-after-canonical37/evidence/raw43-after-canonical37-conditional.json
          cat /tmp/a25-raw43-after-canonical37/evidence/raw43-after-canonical37-conditional.json
      - name: Reuse Canonical37 to source-check Raw42 conditional successor
        run: |
          set -euo pipefail
          python -m py_compile im-results/agent10-raw42-after-raw47/check.py
          python im-results/agent10-raw42-after-raw47/check.py \
            --work /tmp/a25-raw43-after-canonical37 \
            | tee /tmp/a10-raw42-after-canonical37.log
          test -s /tmp/a25-raw43-after-canonical37/evidence/raw42-after-canonical37-conditional.json
          cat /tmp/a25-raw43-after-canonical37/evidence/raw42-after-canonical37-conditional.json
      - name: Source-check cumulative Raw42 plus Raw43 conditional successor
        run: |
          set -euo pipefail
          python -m py_compile im-results/agent10-raw42-after-raw47/check_cumulative.py
          python im-results/agent10-raw42-after-raw47/check_cumulative.py \
            --work /tmp/a25-raw43-after-canonical37 \
            | tee /tmp/a10-raw42-raw43-canonical35.log
          test -s /tmp/a25-raw43-after-canonical37/evidence/raw42-raw43-after-canonical37-conditional.json
          cat /tmp/a25-raw43-after-canonical37/evidence/raw42-raw43-after-canonical37-conditional.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw43-after-canonical37-conditional
          path: |
            /tmp/a25-raw43-after-canonical37/evidence/
            /tmp/a25-raw43-after-canonical37.log
            /tmp/a10-raw42-after-canonical37.log
            /tmp/a10-raw42-raw43-canonical35.log
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30
