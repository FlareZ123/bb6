name: Agent 26 D-start E-empty and authentic blank trace (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore original verified Agent 31 source
        run: |
          python -m pip install filelock
          python im-results/agent31-cryptid-boundary/unpack.py
      - name: Restore and authenticate Agent 26 E-empty source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import lzma
          root = Path("im-results/agent26-cryptid-e-gate")
          src = lzma.decompress(base64.b64decode((root / "EEmpty.lean.xz.b64").read_bytes()))
          digest = hashlib.sha256(src).hexdigest()
          assert digest == "f0e0b227fc7a50ef7dd6bbb09bbdc96a3d2aaca9d72f0ba68d187a99ad38561e", digest
          (root / "EEmpty.lean").write_bytes(src)
          print("Authenticated EEmpty.lean SHA-256:", digest)
          PY
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Check unmodified Agent 31 imported original source chain
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent26-cryptid-e-gate
        run: |
          lean -o im-results/agent31-cryptid-boundary/Boundary.olean im-results/agent31-cryptid-boundary/Boundary.lean
          lean -o im-results/agent31-cryptid-boundary/BoundaryExtra.olean im-results/agent31-cryptid-boundary/BoundaryExtra.lean
          lean -DmaxRecDepth=16384 -o im-results/agent31-cryptid-boundary/BlankTrace.olean im-results/agent31-cryptid-boundary/BlankTrace.lean
      - name: Check Agent 26 universal E-empty return and source-level blank trace
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent26-cryptid-e-gate
        run: |
          lean -o im-results/agent26-cryptid-e-gate/EEmpty.olean im-results/agent26-cryptid-e-gate/EEmpty.lean
          lean -o im-results/agent26-cryptid-e-gate/EBlankTrace.olean im-results/agent26-cryptid-e-gate/EBlankTrace.lean
      - name: Authenticate source for A-six symbolic return
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import lzma
          root = Path("im-results/agent26-cryptid-e-gate")
          src = lzma.decompress(base64.b64decode((root / "ASix.lean.xz.b64").read_bytes()))
          digest = hashlib.sha256(src).hexdigest()
          assert digest == "e018ffa0390b0ff6926251e0a5ae5647b91430b312cbbb50399751ddafe0f68d", digest
          (root / "ASix.lean").write_bytes(src)
          print("Authenticated ASix.lean SHA-256:", digest)
          PY
      - name: Check exact A-six original source and 166999736-step blank trace
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent26-cryptid-e-gate
        run: |
          lean -o im-results/agent26-cryptid-e-gate/ASix.olean im-results/agent26-cryptid-e-gate/ASix.lean
          lean im-results/agent26-cryptid-e-gate/ASixBlankTrace.lean

      - name: Check new all-parameter A1101010111 branch against unchanged source
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent26-cryptid-e-gate
        run: |
          lean -o im-results/agent31-cryptid-boundary/A1100.olean im-results/agent31-cryptid-boundary/A1100.lean
          lean im-results/agent26-cryptid-e-gate/A1101010111.lean

      - name: Check strict first A return and universal E pair return against original machine
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent26-cryptid-e-gate
        run: |
          lean -o im-results/agent31-cryptid-boundary/A1100First.olean im-results/agent31-cryptid-boundary/A1100First.lean
          lean -o im-results/agent26-cryptid-e-gate/A1101010111.olean im-results/agent26-cryptid-e-gate/A1101010111.lean
          lean -o im-results/agent26-cryptid-e-gate/A1101010111First.olean im-results/agent26-cryptid-e-gate/A1101010111First.lean
          lean -o im-results/agent32-cryptid-third/CryptidSix.olean im-results/agent32-cryptid-third/CryptidSix.lean
          lean -o im-results/agent32-cryptid-third/CryptidPairs.olean im-results/agent32-cryptid-third/CryptidPairs.lean
          lean -o im-results/agent26-cryptid-e-gate/E1101010111Pairs.olean im-results/agent26-cryptid-e-gate/E1101010111Pairs.lean

      - name: Certify two shorter A closure terminals against the same pinned source
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent26-cryptid-e-gate
        run: |
          lean im-results/agent26-cryptid-e-gate/A110101Closure.lean

      - name: Audit arbitrary coded A1101010111 original source composition
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent25-cryptid-doublezero:im-results/agent35-cryptid-code:im-results/agent26-cryptid-e-gate
        run: |
          python im-results/agent25-cryptid-doublezero/unpack.py
          for module in DoubleZero TripleUniversalBase TripleUniversalCore TripleUniversalWalk TripleUniversal TenPump TokenCode; do
            lean -o "im-results/agent25-cryptid-doublezero/$module.olean" "im-results/agent25-cryptid-doublezero/$module.lean"
          done
          lean -o im-results/agent35-cryptid-code/ABridgeCode.olean im-results/agent35-cryptid-code/ABridgeCode.lean
          lean -o im-results/agent26-cryptid-e-gate/A1101010111Code.olean im-results/agent26-cryptid-e-gate/A1101010111Code.lean

      - name: Verify strict first-physical F return for the all-q E word
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent26-cryptid-e-gate:im-results/agent2-cryptid-continuity
        run: |
          lean -o im-results/agent2-cryptid-continuity/NoEarlierF.olean im-results/agent2-cryptid-continuity/NoEarlierF.lean
          lean -o im-results/agent2-cryptid-continuity/PrefixENoFSource.olean im-results/agent2-cryptid-continuity/PrefixENoFSource.lean
          lean im-results/agent26-cryptid-e-gate/E1101010111First.lean

      - name: Source-certify earliest F return after arbitrary A token code and new terminal
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent26-cryptid-e-gate:im-results/agent2-cryptid-continuity:im-results/agent25-cryptid-doublezero:im-results/agent35-cryptid-code
        run: |
          lean -o im-results/agent2-cryptid-continuity/EOneTripleReturn.olean im-results/agent2-cryptid-continuity/EOneTripleReturn.lean
          lean -o im-results/agent2-cryptid-continuity/E111FirstReturn.olean im-results/agent2-cryptid-continuity/E111FirstReturn.lean
          lean -o im-results/agent2-cryptid-continuity/PrefixNoF.olean im-results/agent2-cryptid-continuity/PrefixNoF.lean
          lean -o im-results/agent2-cryptid-continuity/ATenFirstReturn.olean im-results/agent2-cryptid-continuity/ATenFirstReturn.lean
          lean -o im-results/agent2-cryptid-continuity/ACodeFirstReturn.olean im-results/agent2-cryptid-continuity/ACodeFirstReturn.lean
          lean -o im-results/agent31-cryptid-boundary/A110111.olean im-results/agent31-cryptid-boundary/A110111.lean
          lean -o im-results/agent31-cryptid-boundary/A110111First.olean im-results/agent31-cryptid-boundary/A110111First.lean
          lean -o im-results/agent31-cryptid-boundary/AExceptionalClosure.olean im-results/agent31-cryptid-boundary/AExceptionalClosure.lean
          lean im-results/agent26-cryptid-e-gate/A1101010111CodeFirst.lean
      - name: Cross-check source transitions with independent literal-table first-return interpreter
        run: |
          python im-results/agent26-cryptid-e-gate/check_new_returns.py

      - name: Source-certify strong all-code physically blank-left F first return
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent26-cryptid-e-gate:im-results/agent2-cryptid-continuity:im-results/agent25-cryptid-doublezero:im-results/agent35-cryptid-code
        run: |
          lean im-results/agent26-cryptid-e-gate/A1101010111CodePhysicalFirst.lean

      - name: Original-source exact two-return E-to-B connector for k divisible by 3
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent26-cryptid-e-gate
        run: |
          lean -o im-results/agent26-cryptid-e-gate/E1101010111ThenB.olean im-results/agent26-cryptid-e-gate/E1101010111ThenB.lean

      - name: Original-source exact two-return E-to-A repeated-111 packet connector
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent26-cryptid-e-gate:im-results/agent25-cryptid-doublezero:im-results/agent35-cryptid-code
        run: |
          lean im-results/agent26-cryptid-e-gate/E1101010111ThenA.lean

      - name: Independent literal-machine E-to-A consecutive first-return regression
        run: |
          python im-results/agent26-cryptid-e-gate/check_e_then_a.py

      - name: Independent literal-machine E-to-B consecutive first-return regression
        run: |
          python im-results/agent26-cryptid-e-gate/check_e_then_b.py

      - name: Check universal E1111 and third E-to-E source-connected packet return
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent26-cryptid-e-gate
        run: |
          lean im-results/agent26-cryptid-e-gate/E1111ThenE.lean
