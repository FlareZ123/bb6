name: Agent 27 #623 n=10 root mass-gap source proof

on:
  workflow_dispatch:
    inputs:
      target:
        description: Proof target
        type: choice
        options: [n10, gap-two-three-step, low-scale, three-step-strip, weighted-strip, weighted-ultra, raw106-source, raw79-source, raw67-source, raw61-source, raw63-source]
        default: n10

permissions:
  contents: read

jobs:
  n10-source-proof:
    if: '!endsWith(inputs.target, ''-source'')'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/cryptids
          ref: c86f15861709b76042998c5211c7b2f83991621b
          path: cryptids
      - name: Install pinned source Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify upstream revision and compile authentic source machine
        working-directory: cryptids
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c86f15861709b76042998c5211c7b2f83991621b"
          lake update
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB0LE_0RC1RC_0RD1LA_1LD0LA_1LF1LC_HHH0LA
      - name: Compile the exact n=10 mass-gap proof chain
        if: inputs.target == 'n10'
        working-directory: cryptids
        run: |
          set -euo pipefail
          cp "../im-results/agent49-parity623/Parity623Source.lean" Agent49ParitySource.lean
          lake env lean -o .lake/build/lib/lean/Agent49ParitySource.olean Agent49ParitySource.lean 2>&1 | tee agent49-parity-source.log

          cp "../im-results/agent8-623-inverse/SquareGapTerminalBridge.lean" SquareGapTerminalBridge.lean
          lake env lean -o .lake/build/lib/lean/SquareGapTerminalBridge.olean SquareGapTerminalBridge.lean 2>&1 | tee square-gap-terminal-bridge.log

          cp "../im-results/agent8-623-inverse/RootCancellationBudgetBridge.lean" Agent8RootCancellationBudgetBridge.lean
          lake env lean -o .lake/build/lib/lean/Agent8RootCancellationBudgetBridge.olean Agent8RootCancellationBudgetBridge.lean 2>&1 | tee agent8-root-cancellation-budget-bridge.log

          cp "../im-results/agent48-623-budget-composition/RootExclusion.lean" RootExclusion.lean
          lake env lean -o .lake/build/lib/lean/RootExclusion.olean RootExclusion.lean 2>&1 | tee root-exclusion.log

          cp "../im-results/agent8-623-inverse/RootMassGapAllN10.lean" RootMassGapAllN10.lean
          lake env lean -o .lake/build/lib/lean/RootMassGapAllN10.olean RootMassGapAllN10.lean 2>&1 | tee root-mass-gap-all-n10.log

          if grep -q 'sorryAx' agent49-parity-source.log square-gap-terminal-bridge.log agent8-root-cancellation-budget-bridge.log root-exclusion.log root-mass-gap-all-n10.log; then
            echo 'sorryAx detected in the n=10 source proof dependency chain'
            exit 1
          fi

      - name: Compile all-scale gap-two elimination against original source
        if: inputs.target == 'gap-two-three-step' || inputs.target == 'low-scale' || inputs.target == 'three-step-strip' || inputs.target == 'weighted-strip' || inputs.target == 'weighted-ultra'
        working-directory: cryptids
        run: |
          set -euo pipefail
          : > gap-two-axioms.log
          compile() {
            cp "../im-results/$2.lean" "$1.lean"
            lake env lean -o ".lake/build/lib/lean/$1.olean" "$1.lean" 2>&1 | tee -a gap-two-axioms.log
          }
          compile Agent49ParitySource agent49-parity623/Parity623Source
          compile Agent8ThirdCounterAffineSource agent8-623-inverse/ThirdCounterAffineSource
          compile Agent8DrainLogDepthSource agent8-623-inverse/DrainLogDepthSource
          compile Agent8BudgetSource agent8-623-inverse/TernaryBudgetSource
          compile Agent8GateRepulsionSource agent8-623-inverse/GateRepulsionSource
          compile Agent8DrainSectorSource agent8-623-inverse/DrainSectorSource
          compile Agent8DrainSevenSource agent8-623-inverse/DrainSevenSource
          compile Agent8DrainFirstSharpSource agent8-623-inverse/DrainFirstSharpSource
          compile Agent8FarSectorSource agent8-623-inverse/FarSectorSource
          compile Agent8GateCompleteSource agent8-623-inverse/GateCompleteSource
          compile Agent8ParentCorridorSource agent8-623-inverse/ParentCorridorSource
          compile Agent8ZeroTailSource agent8-623-inverse/ZeroTailSource
          compile Agent8RootCorridorSource agent8-623-inverse/RootCorridorSource
          compile Agent27GapTwoArithmetic agent27-623-gap-two-three-step/Agent27GapTwoArithmetic
          compile GapTwoThreeStepSource agent27-623-gap-two-three-step/GapTwoThreeStepSource
          if grep -q 'sorryAx' gap-two-axioms.log; then exit 1; fi

      - name: Compile universal successor and low-scale exclusion
        if: inputs.target == 'low-scale' || inputs.target == 'three-step-strip' || inputs.target == 'weighted-strip' || inputs.target == 'weighted-ultra'
        working-directory: cryptids
        run: |
          set -euo pipefail
          : > low-scale-axioms.log
          compile() {
            cp "../im-results/$2.lean" "$1.lean"
            lake env lean -o ".lake/build/lib/lean/$1.olean" "$1.lean" 2>&1 | tee -a low-scale-axioms.log
          }
          compile Agent8LogConeSource agent8-623-inverse/LogConeSource
          compile Agent8LogRightSource agent8-623-inverse/LogRightSource
          compile Agent8DrainQuadraticLogSource agent8-623-inverse/DrainQuadraticLogSource
          compile Agent49DrainLinearLogSource agent49-parity623/DrainLinearLogSource
          compile AllScaleSuccessorBoundSource agent27-623-gap-two-three-step/AllScaleSuccessorBoundSource
          if grep -q 'sorryAx' low-scale-axioms.log; then exit 1; fi

      - name: Compile all-scale three-step terminal strip
        if: inputs.target == 'three-step-strip'
        working-directory: cryptids
        run: |
          set -euo pipefail
          : > three-step-strip-axioms.log
          compile() {
            cp "../im-results/$2.lean" "$1.lean"
            lake env lean -o ".lake/build/lib/lean/$1.olean" "$1.lean" 2>&1 | tee -a three-step-strip-axioms.log
          }
          compile Agent49JointMassSource agent49-parity623/JointMassSource
          compile Agent49RootRayBridgeArithmetic agent49-parity623/RootRayBridgeArithmetic
          compile Agent8TerminalIntervalSource agent8-623-inverse/TerminalIntervalSource
          compile Agent49DrainLinearTerminalSource agent49-parity623/DrainLinearTerminalSource
          compile Agent49TerminalRatio4Arithmetic agent49-parity623/TerminalRatio4Arithmetic
          compile Agent49TerminalRatio4Source agent49-parity623/TerminalRatio4Source
          compile ThreeStepStripArithmetic agent27-623-gap-two-three-step/ThreeStepStripArithmetic
          compile ThreeStepStripSource agent27-623-gap-two-three-step/ThreeStepStripSource
          compile SquareGapTerminalBridge agent8-623-inverse/SquareGapTerminalBridge
          compile Agent8RootCancellationBudgetBridge agent8-623-inverse/RootCancellationBudgetBridge
          compile RootExclusion agent48-623-budget-composition/RootExclusion
          compile RootMassGapAllN10 agent8-623-inverse/RootMassGapAllN10
          compile ThreeStepStripN11Source agent27-623-gap-two-three-step/ThreeStepStripN11Source
          compile RootMassGapN11N12 agent48-623-budget-composition/RootMassGapN11N12
          compile ThreeStepStripN13Source agent27-623-gap-two-three-step/ThreeStepStripN13Source
          if grep -q 'sorryAx' three-step-strip-axioms.log; then exit 1; fi


      - name: Compile weighted-depth sharpened authentic terminal gate
        if: inputs.target == 'weighted-strip' || inputs.target == 'weighted-ultra'
        working-directory: cryptids
        run: |
          set -euo pipefail
          : > weighted-strip-axioms.log
          compile() {
            cp "../im-results/$2.lean" "$1.lean"
            lake env lean -o ".lake/build/lib/lean/$1.olean" "$1.lean" 2>&1 | tee -a weighted-strip-axioms.log
          }
          compile Agent49JointMassSource agent49-parity623/JointMassSource
          compile Agent49RootRayBridgeArithmetic agent49-parity623/RootRayBridgeArithmetic
          compile Agent8TerminalIntervalSource agent8-623-inverse/TerminalIntervalSource
          compile Agent49DrainLinearTerminalSource agent49-parity623/DrainLinearTerminalSource
          compile Agent49TerminalRatio4Arithmetic agent49-parity623/TerminalRatio4Arithmetic
          compile Agent49TerminalRatio4Source agent49-parity623/TerminalRatio4Source
          compile ThreeStepStripArithmetic agent27-623-gap-two-three-step/ThreeStepStripArithmetic
          compile ThreeStepStripSource agent27-623-gap-two-three-step/ThreeStepStripSource
          compile Agent22ExactDrainCocycleSource agent22-623-root-ray-20k/ExactDrainCocycleSource
          compile Agent22ExactDrainCocycleDepthSource agent22-623-root-ray-20k/ExactDrainCocycleDepthSource
          compile Agent8LogConeSource agent8-623-inverse/LogConeSource
          compile ThreeStepStripWeightedSource agent27-623-gap-two-three-step/ThreeStepStripWeightedSource
          if grep -q 'sorryAx' weighted-strip-axioms.log; then exit 1; fi

      - name: Compile mass-aware weighted ultra terminal corridor
        if: inputs.target == 'weighted-ultra'
        working-directory: cryptids
        run: |
          set -euo pipefail
          : > weighted-ultra-axioms.log
          compile() {
            cp "../im-results/$2.lean" "$1.lean"
            lake env lean -o ".lake/build/lib/lean/$1.olean" "$1.lean" 2>&1 | tee -a weighted-ultra-axioms.log
          }
          compile ThreeStepStripTerminalSharpSource agent27-623-gap-two-three-step/ThreeStepStripTerminalSharpSource
          compile ThreeStepStripTerminalUltraSource agent27-623-gap-two-three-step/ThreeStepStripTerminalUltraSource
          compile ThreeStepStripWeightedUltraSource agent27-623-gap-two-three-step/ThreeStepStripWeightedUltraSource
          if grep -q 'sorryAx' weighted-ultra-axioms.log; then exit 1; fi

  retained-parent-source:
    if: endsWith(inputs.target, '-source')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Export generated retained-parent source closure for local Lean
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          raw="${TARGET#raw}"
          raw="${raw%-source}"
          python im-results/agent27-retained-parent-source/export.py "$raw" /tmp/a27-parent-source
      - uses: actions/upload-artifact@v4
        with:
          name: agent27-${{ inputs.target }}
          path: /tmp/a27-parent-source/
          retention-days: 30
