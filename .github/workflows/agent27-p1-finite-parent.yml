name: Agent27 P1 inverse unique-parent source theorem (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify exact unchanged P1 source definitions
        run: |
          set -e
          MAP=im-results/agent1-p1-map
          INV=im-results/agent47-p1-finite-inverse
          LAB=im-results/agent27-p1-finite
          export LEAN_PATH="$MAP:$INV:$LAB"
          lean --version
          for m in GParity GInverse PosEvenForm; do
            lean -o "$MAP/$m.olean" "$MAP/$m.lean"
          done
          for m in P1FiniteInverse P1InverseLog; do
            lean -o "$INV/$m.olean" "$INV/$m.lean"
          done
          lean "$LAB/P1ActiveArborescence.lean"
          lean -o "$LAB/P1InverseNoMerge.olean" "$LAB/P1InverseNoMerge.lean"
          P1=im-results/agent1-p1-quarter
          AG28=im-results/agent28-p1-word-automaton
          export LEAN_PATH="$MAP:$INV:$LAB:$P1:$AG28"
          for m in MassInverse OddConeMass; do
            lean -o "$P1/$m.olean" "$P1/$m.lean"
          done
          lean -o "$P1/InverseIff.olean" "$P1/InverseIff.lean"
          for m in OddWordCost OddWordSourceBridge OneResetGrowth OneResetTwoAdic OneResetBudget OneResetSourceEq OneResetPoly OneResetSourceBudget; do
            lean -o "$AG28/$m.olean" "$AG28/$m.lean"
          done
          lean -o "$P1/UpperTail.olean" "$P1/UpperTail.lean"
          for m in OneResetSourceBridge OneResetZero OneResetCount; do
            lean -o "$AG28/$m.olean" "$AG28/$m.lean"
          done
          lean "$LAB/P1CountUnique.lean"
