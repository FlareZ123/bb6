name: Agent 28 Raw36 second exceptional leaf parametric pump
run-name: Raw36 Counter2 source-accept ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional pinned source revision
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check original-machine growth and NeverHalts
        run: |
          set -euo pipefail
          work=/tmp/a28-raw36-counter2
          root=im-results/agent28-raw36-second-hard
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" --label raw36-counter2 \
            --theorem BB6Coverage.Agent31Pump.Auto.Raw36Counter2.never \
            --artifact-name raw36-counter2-lean-proof \
            --provenance-input "$root/find_pump.js" \
            "$root/Raw36Counter2.lean" 2>&1 | tee /tmp/a28-raw36-counter2.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a28-raw36-counter2.log \
            BB6Coverage.Agent31Pump.Auto.Raw36Counter2.checked \
            BB6Coverage.Agent31Pump.Auto.Raw36Counter2.growth \
            BB6Coverage.Agent31Pump.Auto.Raw36Counter2.never
          cp /tmp/a28-raw36-counter2.log "$work/audit.log"
      - name: Retain checked proof closure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw36-counter2-lean-proof
          path: |
            /tmp/a28-raw36-counter2/
            /tmp/a28-raw36-counter2.log
          if-no-files-found: warn
          retention-days: 30
