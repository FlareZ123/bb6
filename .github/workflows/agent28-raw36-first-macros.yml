name: Agent 28 Raw36 first exceptional F0 uniform sweep lemmas
run-name: Raw36 first F0 macros ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source revision (optional)
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Source-audit uniform F0-safe overflow
        run: |
          set -euo pipefail
          dir=im-results/agent28-raw36-first-hard
          work=/tmp/a28-raw36-first-macro
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" --label raw36-first-overflow-a2 \
            --theorem BB6Coverage.Agent31Pump.Auto.Raw36FirstOverflowA2.transport \
            --artifact-name raw36-first-overflow-a2-proof \
            "$dir/Raw36FirstOverflowA2.lean" 2>&1 | tee /tmp/a28-first-macro.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/a28-first-macro.log \
            BB6Coverage.Agent31Pump.Auto.Raw36FirstOverflowA2.checked \
            BB6Coverage.Agent31Pump.Auto.Raw36FirstOverflowA2.transport
          cp /tmp/a28-first-macro.log "$work/audit.log"
      - name: Retain source closure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw36-first-overflow-a2-proof
          path: |
            /tmp/a28-raw36-first-macro/
            /tmp/a28-first-macro.log
          if-no-files-found: warn
          retention-days: 30
