name: Agent 29 Machine C forty-three new mod2048 classes (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - batch: a
            residues: "42 128 166 183 267 394 411 439 474 498 535"
          - batch: b
            residues: "546 582 654 747 792 824 911 952 978 1003 1056"
          - batch: c
            residues: "1070 1099 1119 1160 1239 1248 1322 1344 1416 1458 1472"
          - batch: d
            residues: "1498 1504 1646 1766 1778 1862 1871 1896 1954 1994"
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct both hash-verified Lean source and generator
        run: |
          python3 im-results/agent29-c31/reconstruct.py
          python3 im-results/agent29-c-inverse/reconstruct.py
      - name: Lean-kernel audit against complete original source chain
        run: |
          mkdir -p /tmp/a29-2048
          cp im-results/agent11-c-line/CLine.lean /tmp/a29-2048/CLine.lean
          for source in CReachBridge CRange CBack CHubSplit; do
            cp "im-results/agent21-c-source-bridge/$source.lean" "/tmp/a29-2048/$source.lean"
          done
          cd /tmp/a29-2048
          export LEAN_PATH="."
          lean --version
          lean -o CLine.olean CLine.lean
          lean -o CReachBridge.olean CReachBridge.lean
          lean -o CRange.olean CRange.lean
          lean -o CBack.olean CBack.lean
          lean -o CHubSplit.olean CHubSplit.lean
          for residue in ${{ matrix.residues }}; do
            python3 "$GITHUB_WORKSPACE/im-results/agent29-c-inverse/generate_c_inverse_v2.py" 2048 "$residue" --output "$PWD/C2048.lean"
            sed -i 's/set_option maxRecDepth 4096/set_option maxRecDepth 16384/' C2048.lean
            lean C2048.lean
          done
