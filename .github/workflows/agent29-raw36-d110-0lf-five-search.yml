name: Agent29 Raw36 D110 E0-move inverse-stack candidate search

on:
  workflow_dispatch:
    inputs:
      move:
        description: "First-E0 move family to search"
        required: false
        type: choice
        options:
          - "0LF"
          - "0RF"
        default: "0LF"
      max_candidates:
        description: "Candidate prefix to test (use 6000 to exhaust the current generated pool)"
        required: false
        type: number
        default: 3500

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Discover exact inverse-stack certificates for selected E0 literals
        run: |
          set -euo pipefail
          python -m py_compile im-results/agent29-raw36/search_d110_zeroLF_five.py
          timeout 1100s python -u im-results/agent29-raw36/search_d110_zeroLF_five.py \
            --move "${{ inputs.move }}" --max "${{ inputs.max_candidates }}" \
            --out "/tmp/a29-d110-${{ inputs.move }}-search.json" \
            | tee "/tmp/a29-d110-${{ inputs.move }}-search.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw36-d110-e0-${{ inputs.move }}-inverse-stack-candidates
          path: |
            /tmp/a29-d110-${{ inputs.move }}-search.json
            /tmp/a29-d110-${{ inputs.move }}-search.log
          if-no-files-found: warn
          retention-days: 30
