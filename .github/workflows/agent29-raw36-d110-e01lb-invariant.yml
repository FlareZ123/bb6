name: Agent29 Raw36 D1=0RE E0=1LB 6000 new nonhalting invariant candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Target sole hard 1LB literal with deterministic fresh stack families
        run: |
          set -euo pipefail
          python -m py_compile im-results/agent29-raw36/search_d110_e01lb.py
          timeout 850s python -u im-results/agent29-raw36/search_d110_e01lb.py \
            --max 6000 --workers 3 \
            --out /tmp/a29-d110-e01lb-search.json \
            | tee /tmp/a29-d110-e01lb-search.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw36-d110-e01lb-targeted-stack-parameter-search
          path: |
            /tmp/a29-d110-e01lb-search.json
            /tmp/a29-d110-e01lb-search.log
          if-no-files-found: warn
          retention-days: 30
