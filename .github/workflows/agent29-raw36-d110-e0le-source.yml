name: Agent29 Raw36 D1=0RE E0=0LE original-source complete Cover

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim hosted unrelated SDK disk for exact dependency archive
        run: |
          set -euo pipefail
          df -h /
          for path in /usr/local/lib/android /usr/share/dotnet /usr/local/share/powershell; do
            if [[ -d "$path" ]]; then sudo rm -rf "$path"; fi
          done
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: raw36-direct-D1-10-census
          run-id: 46122807180
          github-token: ${{ github.token }}
          path: /tmp/a29-d110-census
      - uses: actions/download-artifact@v4
        with:
          name: raw36-direct-D1-10-recovered
          run-id: 46153748009
          github-token: ${{ github.token }}
          path: /tmp/a29-d110-far
      - uses: actions/download-artifact@v4
        with:
          name: raw36-direct-D1-10-structured-candidates
          run-id: 46154479283
          github-token: ${{ github.token }}
          path: /tmp/a29-d110-struct
      - name: Install exact Lean version
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - name: Rebuild exact closure and compile all 13 new six-hole witnesses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lean --version | grep -F '4.36.0-rc2'
          python -m py_compile \
            im-results/agent29-raw36/compose_direct10_child04.py \
            im-results/agent29-raw36/emit_direct10_eight.py
          python im-results/agent29-raw36/compose_direct10_child04.py \
            --census /tmp/a29-d110-census/direct10.json.gz \
            --far /tmp/a29-d110-far/found.tsv \
            --structured /tmp/a29-d110-struct/structured.json \
            --archives /tmp/a29-d110-archives \
            --work /tmp/a29-d110-work \
            | tee /tmp/a29-d110-consume.log
          test -s /tmp/a29-d110-work/raw36-d110-e0le-accepted.json
          cat /tmp/a29-d110-work/raw36-d110-e0le-accepted.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw36-d110-e0le-original-source-acceptance
          path: |
            /tmp/a29-d110-work/raw36-d110-e0le-accepted.json
            /tmp/a29-d110-work/Raw36D110Kid04.lean
            /tmp/a29-d110-work/Raw36D110Live7AfterE0LE.lean
            /tmp/a29-d110-work/direct10-source-build.log
            /tmp/a29-d110-consume.log
          if-no-files-found: warn
          retention-days: 60
