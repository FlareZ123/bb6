name: Agent29 Raw36 D1=1LC recovery
run-name: Raw36 D1=1LC reuse common, split kid16, assemble weighted366 Cover
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw36-d114-common
          run-id: 46123553160
          github-token: ${{ github.token }}
          path: /tmp/d114
      - uses: actions/download-artifact@v4
        with:
          name: raw36-b1-4-proof
          run-id: 46097780398
          github-token: ${{ github.token }}
          path: /tmp/base
      - name: Package exact transitive dependency closure for heavy children
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, shutil
          dst=Path('/tmp/d114'); base=Path('/tmp/base')
          roots=[dst/f'Raw36D114Kid{i:02d}.lean' for i in [0,4,6,7,10,12,13,16,18,19,22]]
          roots.append(dst/'Raw36D114.lean')
          seen=set()
          def locate(root,name):
              rel=Path(*name.split('.'))
              for p in (root/rel.with_suffix('.lean'),root/(name+'.lean')):
                  if p.exists(): return p
          def visit(name):
              if name in seen: return
              seen.add(name)
              src=locate(dst,name) or locate(base,name)
              if src is None:
                  assert name=='Lean' or name=='Std' or name.startswith('Lean.'),name
                  return
              obj=src.with_suffix('.olean')
              assert obj.exists(),(name,obj)
              if src.parent!=dst:
                  shutil.copy2(src,dst/src.name); shutil.copy2(obj,dst/obj.name); src=dst/src.name
              for dep in re.findall(r'^import ([A-Za-z0-9_.]+)$',src.read_text(),re.M): visit(dep)
          for root in roots:
              for dep in re.findall(r'^import ([A-Za-z0-9_.]+)$',root.read_text(),re.M): visit(dep)
          print('recovery modules',len(seen),'bytes',sum(p.stat().st_size for p in dst.iterdir() if p.is_file()))
          PY
          python im-results/agent29-raw36/split_generated_kid.py --source /tmp/d114/Raw36D114Kid16.lean --out /tmp/smoke --root kid16 --module Raw36D114Kid16 | tee /tmp/d114/split-report.log
      - uses: actions/upload-artifact@v4
        with:
          name: raw36-d114-recovery-deps
          path: /tmp/d114/
          if-no-files-found: error
          retention-days: 60

  heavy:
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        kid: [0,4,6,7,10,12,13,18,19,22]
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: raw36-d114-recovery-deps
          path: /tmp/d114
      - name: Kernel-check one heavy D1=1LC child
        run: |
          set -euo pipefail
          export LEAN_PATH=/tmp/d114
          kid=$(printf 'Raw36D114Kid%02d' ${{ matrix.kid }})
          (cd /tmp/d114 && lean -o "$kid.olean" "$kid.lean") 2>&1 | tee "/tmp/$kid.log"
          suffix=${kid#Raw36D114Kid}
          python im-results/agent4-raw109/audit_axioms.py "/tmp/$kid.log" "BB6.Agent29Raw36D114.kid${suffix}_bound"
          mkdir -p /tmp/out
          cp "/tmp/d114/$kid.lean" "/tmp/d114/$kid.olean" "/tmp/$kid.log" /tmp/out/
      - uses: actions/upload-artifact@v4
        with:
          name: raw36-d114-kid-${{ matrix.kid }}-recovery
          path: /tmp/out/
          if-no-files-found: error
          retention-days: 60

  kid16-branches:
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        branch: [0,5,6,7,10,11,12,13,17,18,19,20,22,23]
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: raw36-d114-recovery-deps
          path: /tmp/d114
      - name: Kernel-check one independent kid16 branch
        run: |
          set -euo pipefail
          python im-results/agent29-raw36/split_generated_kid.py --source /tmp/d114/Raw36D114Kid16.lean --out /tmp/split --root kid16 --module Raw36D114Kid16
          printf -v PAD '%02d' ${{ matrix.branch }}
          MOD=Raw36D114Kid16Branch$PAD
          export LEAN_PATH=/tmp/d114:/tmp/split
          (cd /tmp/split && lean -o "$MOD.olean" "$MOD.lean") 2>&1 | tee "/tmp/$MOD.log"
          mkdir -p /tmp/out
          cp "/tmp/split/$MOD.lean" "/tmp/split/$MOD.olean" "/tmp/$MOD.log" /tmp/out/
      - uses: actions/upload-artifact@v4
        with:
          name: raw36-d114-kid16-branch-${{ matrix.branch }}
          path: /tmp/out/
          if-no-files-found: error
          retention-days: 60

  kid16:
    needs: [bootstrap, kid16-branches]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: raw36-d114-recovery-deps
          path: /tmp/d114
      - name: Regenerate exact split source
        run: python im-results/agent29-raw36/split_generated_kid.py --source /tmp/d114/Raw36D114Kid16.lean --out /tmp/split --root kid16 --module Raw36D114Kid16
      - uses: actions/download-artifact@v4
        with:
          pattern: raw36-d114-kid16-branch-*
          path: /tmp/split
          merge-multiple: true
      - name: Compile trivial branches, wrapper, and audit child theorem
        run: |
          set -euo pipefail
          export LEAN_PATH=/tmp/d114:/tmp/split
          for i in 1 2 3 4 8 9 14 15 16 21; do
            printf -v PAD '%02d' "$i"; MOD=Raw36D114Kid16Branch$PAD
            (cd /tmp/split && lean -o "$MOD.olean" "$MOD.lean")
          done
          (cd /tmp/split && lean -o Raw36D114Kid16.olean Raw36D114Kid16.lean) 2>&1 | tee /tmp/kid16.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/kid16.log BB6.Agent29Raw36D114.kid16_bound
          mkdir -p /tmp/out
          cp /tmp/split/Raw36D114Kid16*.lean /tmp/split/Raw36D114Kid16*.olean /tmp/kid16.log /tmp/out/
      - uses: actions/upload-artifact@v4
        with:
          name: raw36-d114-kid-16-recovery
          path: /tmp/out/
          if-no-files-found: error
          retention-days: 60

  assemble:
    needs: [bootstrap, heavy, kid16]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: raw36-d114-recovery-deps
          path: /tmp/d114
      - uses: actions/download-artifact@v4
        with:
          pattern: raw36-d114-kid-*-recovery
          path: /tmp/d114
          merge-multiple: true
      - name: Kernel-check exact D1=1LC parent Cover
        run: |
          set -euo pipefail
          export LEAN_PATH=/tmp/d114
          (cd /tmp/d114 && lean -o Raw36D114.olean Raw36D114.lean) 2>&1 | tee /tmp/d114-root.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/d114-root.log BB6.Agent29Raw36D114.bound BB6.Agent29Raw36D114.cover
          python im-results/agent29-raw36/build_closure_manifest.py --work /tmp/d114 --root Raw36D114 --label raw36-d1-14-recovery --artifact-name raw36-d1-14-proof-recovery --theorem BB6.Agent29Raw36D114.cover --bound 366 --parent-table '1RB---_1RC---_0RD---_0LD1LC_------_------' --provenance 'common_run=46123553160,split_source=${{ github.sha }}'
          cp /tmp/d114-root.log /tmp/d114/audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: raw36-d1-14-proof-recovery
          path: /tmp/d114/
          if-no-files-found: error
          retention-days: 60
