name: Agent 29 R001 row 109 external source replay (manual)

on:
  workflow_dispatch:
    inputs:
      audit_only:
        description: 'Run independent finite primitive-step grammar audit without replaying billions of accelerator operations'
        type: boolean
        default: false
      rust_source_audit:
        description: 'Also test the original Rust basic_step implementation against independent primitive-step interpreter'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  replay-external-accelerator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current BB6 verifier
        uses: actions/checkout@v4
        with:
          path: workplace
          persist-credentials: false
      - name: Run independent raw-TM rewrite-rule and initial/terminal audit
        run: node workplace/im-results/agent2-row109-semantic-audit/macro_rule_audit.cjs
      - name: Kernel-check all-natural left and right X-run proofs on authentic raw table
        if: ${{ inputs.audit_only }}
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          base64 -d workplace/im-results/agent2-row109-semantic-audit/Row109Runs.lean.gz.b64 | gzip -d > "$RUNNER_TEMP/Row109Runs.lean"
          echo "6fb55261920fc1864267559c33f0d8872af8bfc010d87531f691a85a17f299b6  $RUNNER_TEMP/Row109Runs.lean" | sha256sum -c -
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lean" "$RUNNER_TEMP/Row109Runs.lean"
      - name: Kernel-check every fixed raw block rule in arbitrary exterior tapes
        if: ${{ inputs.audit_only }}
        run: |
          base64 -d workplace/im-results/agent4-row109-locality/Row109Locality.lean.gz.b64 | gzip -d > "$RUNNER_TEMP/Row109Locality.lean"
          echo "c39529c59f5db109b2326ab55b4a5e5071c03e4827bb6eeef15eeb730e0841d9  $RUNNER_TEMP/Row109Locality.lean" | sha256sum -c -
          "$HOME/.elan/bin/lean" -o "$RUNNER_TEMP/Row109Locality.olean" "$RUNNER_TEMP/Row109Locality.lean"
          LEAN_PATH="$RUNNER_TEMP" "$HOME/.elan/bin/lean" -o "$RUNNER_TEMP/Row109Rules.olean" workplace/im-results/agent4-row109-locality/Row109Rules.lean
          LEAN_PATH="$RUNNER_TEMP" "$HOME/.elan/bin/lean" workplace/im-results/agent4-row109-locality/Row109Safe.lean
      - name: Checkout external source separately for independent Rust arm semantics
        if: ${{ inputs.audit_only && inputs.rust_source_audit }}
        uses: actions/checkout@v4
        with:
          repository: jhuang97/turing_machine
          ref: 6aeb2384173cf4c93a9a7c7f418bb9b7b1839b39
          path: source
          persist-credentials: false
      - name: Verify independent raw-vs-Rust macros over bounded contexts
        if: ${{ inputs.audit_only && inputs.rust_source_audit }}
        run: |
          base64 -d workplace/im-results/agent2-row109-semantic-audit/Row109RustSemantics.rs.gz.b64 | gzip -d > "$RUNNER_TEMP/Row109RustSemantics.rs"
          echo "dd6eb5f1b2b913f51d7568170356cd10865b069aa8f22364501aa1dee0b32a75  $RUNNER_TEMP/Row109RustSemantics.rs" | sha256sum -c -
          cat "$RUNNER_TEMP/Row109RustSemantics.rs" >> source/src/bin/bb6_1DCA_like.rs
          cd source
          cargo test --release --bin bb6_1DCA_like row109_independent_primitive_semantics -- --nocapture
      - name: Checkout J. Huang's original October 15 accelerator
        if: ${{ !inputs.audit_only }}
        uses: actions/checkout@v4
        with:
          repository: jhuang97/turing_machine
          ref: 6aeb2384173cf4c93a9a7c7f418bb9b7b1839b39
          path: source
          persist-credentials: false
      - name: Pin exact six-state machine and compiler provenance
        if: ${{ !inputs.audit_only }}
        run: |
          grep -F 'const TM_DEF: &str = "1RB0LE_0RC---_1RD0LA_1RE0RF_1LC1RD_1RE1RA";' source/src/bin/bb6_1DCA_like.rs
          sha256sum source/src/bin/bb6_1DCA_like.rs
          rustc --version
          cargo --version
      - name: Check supplied shorter fast/slow and bit-matrix tests
        if: ${{ !inputs.audit_only }}
        working-directory: source
        run: cargo test --release --bin bb6_1DCA_like -- --nocapture
      - name: Reproduce complete accelerated halting run (not raw TM steps)
        if: ${{ !inputs.audit_only }}
        working-directory: source
        run: |
          cargo run --release --bin bb6_1DCA_like > "$RUNNER_TEMP/row109-run.txt"
          tail -n 12 "$RUNNER_TEMP/row109-run.txt"
      - name: Assert reported internal terminal counters without inferring raw step score
        if: ${{ !inputs.audit_only }}
        run: |
          python -c "import os,re; s=open(os.environ['RUNNER_TEMP']+'/row109-run.txt',encoding='utf8').read(); x=[v for v in s.splitlines() if 'halted' in v]; assert len(x)>0, 'No terminal halt reported'; assert any(re.search(r'6431143049,\s*2687980000:',v) for v in x), 'Published accelerated endpoint differs'; print('Exact attributed accelerator endpoint replay:',x[-1][-200:])"
