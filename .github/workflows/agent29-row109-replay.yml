name: Agent 29 R001 row 109 external source replay (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay-external-accelerator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout J. Huang's original October 15 accelerator
        uses: actions/checkout@v4
        with:
          repository: jhuang97/turing_machine
          ref: 6aeb2384173cf4c93a9a7c7f418bb9b7b1839b39
          path: source
          persist-credentials: false
      - name: Pin exact six-state machine and compiler provenance
        run: |
          grep -F 'const TM_DEF: &str = "1RB0LE_0RC---_1RD0LA_1RE0RF_1LC1RD_1RE1RA";' source/src/bin/bb6_1DCA_like.rs
          sha256sum source/src/bin/bb6_1DCA_like.rs
          rustc --version
          cargo --version
      - name: Check supplied shorter fast/slow and bit-matrix tests
        working-directory: source
        run: cargo test --release --bin bb6_1DCA_like -- --nocapture
      - name: Reproduce complete accelerated halting run (not raw TM steps)
        working-directory: source
        run: |
          cargo run --release --bin bb6_1DCA_like > "$RUNNER_TEMP/row109-run.txt"
          tail -n 12 "$RUNNER_TEMP/row109-run.txt"
      - name: Assert reported internal terminal counters without inferring raw step score
        run: |
          python -c "import os,re; s=open(os.environ['RUNNER_TEMP']+'/row109-run.txt',encoding='utf8').read(); x=[v for v in s.splitlines() if 'halted' in v]; assert len(x)>0, 'No terminal halt reported'; assert any(re.search(r'6431143049,\s*2687980000:',v) for v in x), 'Published accelerated endpoint differs'; print('Exact attributed accelerator endpoint replay:',x[-1][-200:])"
