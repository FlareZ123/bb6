name: Agent 29 R001 exact reflected-root Lean proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-rooted-conjugacy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check twelve table cases and all-step root transport
        run: |
          lean --version
          lean im-results/agent29-roster-six-audit/Row146Conjugacy.lean
