name: Agent 29 R001 exact reflected-root Lean proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-rooted-conjugacy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check twelve table cases and all-step root transport
        run: |
          lean --version
          lean im-results/agent29-roster-six-audit/Row146Conjugacy.lean
          lean im-results/agent29-roster-six-audit/Row109GF2.lean

      - name: Kernel-check all-length W7 physical four-cell sweeps
        run: |
          set -euo pipefail
          mkdir -p /tmp/w7
          cp im-results/agent29-roster-six-audit/Row146Conjugacy.lean /tmp/w7/
          cp im-results/agent3-w7-physical-block/Row146Block.lean /tmp/w7/
          cd /tmp/w7
          LEAN_PATH=. lean -o Row146Conjugacy.olean Row146Conjugacy.lean
          LEAN_PATH=. lean Row146Block.lean
