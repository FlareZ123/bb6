name: Agent3 Raw112 consumer from accepted Canonical38
run-name: Canonical38 plus Raw112 -> Canonical37 (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Canonical38 predecessor lineage
        type: choice
        options: [direct, serial]
        default: direct
        required: true
      canonical39_run_id:
        description: Serial mode only - successful Raw47 Canonical39 producer run
        type: string
        default: ''
        required: false
      serial38_run_id:
        description: Serial mode only - successful serial Raw47+Raw39 Canonical38 run
        type: string
        default: ''
        required: false
      direct38_run_id:
        description: Direct mode only - accepted direct Raw39+Raw47 Canonical38 run
        type: string
        default: ''
        required: false
      raw112_run_id:
        description: Successful Raw112 whole-parent producer run
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"

      - name: Consume Raw112 from accepted direct Canonical38 roster
        if: inputs.mode == 'direct'
        env:
          GH_TOKEN: ${{ github.token }}
          DIRECT38_RUN_ID: ${{ inputs.direct38_run_id }}
          RAW112_RUN_ID: ${{ inputs.raw112_run_id }}
        run: |
          set -euo pipefail
          [[ "$DIRECT38_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RAW112_RUN_ID" =~ ^[0-9]+$ ]]
          lean --version | grep -F '4.36.0-rc2'
          python -m py_compile im-results/agent9-raw112-direct38/consume.py
          python im-results/agent9-raw112-direct38/consume.py \
            --work /tmp/a9-canonical37-direct \
            --direct38-run-id "$DIRECT38_RUN_ID" \
            --raw112-run-id "$RAW112_RUN_ID" | tee /tmp/a9-canonical37-direct.log
          test -s /tmp/a9-canonical37-direct/canonical37-direct38-raw112-delta/delta.json
          cat /tmp/a9-canonical37-direct/canonical37-direct38-raw112-delta/delta.json

      - name: Consume Raw112 from accepted serial Canonical38 roster
        if: inputs.mode == 'serial'
        env:
          GH_TOKEN: ${{ github.token }}
          CANONICAL39_RUN_ID: ${{ inputs.canonical39_run_id }}
          SERIAL38_RUN_ID: ${{ inputs.serial38_run_id }}
          RAW112_RUN_ID: ${{ inputs.raw112_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANONICAL39_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$SERIAL38_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RAW112_RUN_ID" =~ ^[0-9]+$ ]]
          lean --version | grep -F '4.36.0-rc2'
          python -m py_compile im-results/agent3-canonical37-raw112/consume.py
          python im-results/agent3-canonical37-raw112/consume.py \
            --work /tmp/a3-canonical37 \
            --canonical39-run-id "$CANONICAL39_RUN_ID" \
            --serial38-run-id "$SERIAL38_RUN_ID" \
            --raw112-run-id "$RAW112_RUN_ID" | tee /tmp/a3-canonical37.log
          test -s /tmp/a3-canonical37/canonical37-raw47-raw39-raw112-delta/delta.json
          cat /tmp/a3-canonical37/canonical37-raw47-raw39-raw112-delta/delta.json

      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'direct'
        with:
          name: canonical37-direct38-raw112-thin-delta
          path: |
            /tmp/a9-canonical37-direct/canonical37-direct38-raw112-delta/**
            /tmp/a9-canonical37-direct.log
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'serial'
        with:
          name: canonical37-raw47-raw39-raw112-thin-delta
          path: |
            /tmp/a3-canonical37/canonical37-raw47-raw39-raw112-delta/**
            /tmp/a3-canonical37.log
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30
