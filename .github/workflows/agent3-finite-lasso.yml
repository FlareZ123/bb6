name: Agent 3 finite-support lasso (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prove source-sound all-time finite lasso cylinders
        run: |
          set -eu
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent4-coverage-smoke:im-results/agent44-drift-closure:im-results/agent32-zero-prefix-global:im-results/agent3-finite-lasso"
          lean -o im-results/agent8-coverage-contract/Frontier.olean im-results/agent8-coverage-contract/Frontier.lean
          for m in RayClosed RayChecker RayEntry RayFinite; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          lean -o im-results/agent4-coverage-smoke/FrontierAudit.olean im-results/agent4-coverage-smoke/FrontierAudit.lean
          lean -o im-results/agent4-coverage-smoke/FrontierMass.olean im-results/agent4-coverage-smoke/FrontierMass.lean
          base64 -d im-results/agent3-finite-lasso/Agent3FiniteLasso.lean.gz.b64 | gzip -d > im-results/agent3-finite-lasso/Agent3FiniteLasso.lean
          echo "84966fde79e909dd47607380577ed9eb50ac014f8bc857824d1cdec770873c10  im-results/agent3-finite-lasso/Agent3FiniteLasso.lean" | sha256sum --check
          lean -o im-results/agent3-finite-lasso/Agent3FiniteLasso.olean im-results/agent3-finite-lasso/Agent3FiniteLasso.lean
          for m in RayTurnExample RayFiniteOracle FiniteHalting; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          lean -o im-results/agent44-drift-closure/DirectedDrift.olean im-results/agent44-drift-closure/DirectedDrift.lean
          for m in ZeroMaskOracle FiniteDecision; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          for m in ZeroPathAudit ControlPathAudit ZeroRowAudit PhysicalTraceAudit; do
            lean -o "im-results/agent32-zero-prefix-global/$m.olean" "im-results/agent32-zero-prefix-global/$m.lean"
          done
          lean im-results/agent3-finite-lasso/Agent3LassoFrontier.lean
          g++ -O3 -std=c++17 -Wall -Wextra -Werror im-results/agent3-finite-lasso/check-lasso-disjoint.cpp -o /tmp/agent3-lasso-disjoint
          /tmp/agent3-lasso-disjoint
          python im-results/agent3-finite-lasso/generate-lasso90.py
          echo "d39796e3bc5f4c93013ab088bf325a79033d906b5e24b9259c8b2e5163082512  im-results/agent3-finite-lasso/Agent3Lasso90.lean" | sha256sum --check
          lean im-results/agent3-finite-lasso/Agent3Lasso90.lean
          g++ -O3 -std=c++17 -Wall -Wextra -Werror im-results/agent3-finite-lasso/check-lasso90-disjoint.cpp -o /tmp/agent3-lasso90-disjoint
          /tmp/agent3-lasso90-disjoint
