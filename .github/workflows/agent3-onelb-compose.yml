name: Agent3 OneLB parent composition
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit
        required: true
        type: string
      child_code:
        description: 09, 21, E1D0ZeroRD, E1D0OneRB or E1D0ZeroRE; omit for parent composition
        required: false
        type: string
        default: ''
      extra_artifacts:
        description: Space-separated accepted child or compressed replay artifact IDs
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Consume exact child banks
        if: ${{ inputs.child_code == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXTRA: ${{ inputs.extra_artifacts }}
        run: |
          [[ "$EXTRA" =~ ^[0-9\ ]*$ ]]
          bash im-results/agent3-raw139-e0-oneLB/check-parent.sh $EXTRA
      - name: Consume exact compressed replay bank
        if: ${{ inputs.child_code == '09' || inputs.child_code == '21' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXTRA: ${{ inputs.extra_artifacts }}
          CODE: ${{ inputs.child_code }}
        run: |
          [[ "$EXTRA" =~ ^[0-9\ ]+$ ]]
          [[ "$CODE" == 09 || "$CODE" == 21 ]]
          bash im-results/agent3-raw139-e0-oneLB/check-child-bank.sh "$CODE" $EXTRA
      - uses: actions/upload-artifact@v4
        if: ${{ success() && inputs.child_code == '' }}
        with:
          name: raw139-OneLB-parent-checked
          include-hidden-files: true
          path: |
            .tmp/a3-oneLB-parent/manifest.json
            .tmp/a3-oneLB-parent/imports/*.lean
            .tmp/a3-oneLB-parent/build/*.olean
            .tmp/a3-oneLB-parent/log
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && inputs.child_code == '' }}
        with:
          name: raw139-OneLB-parent-incomplete
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .tmp/a3-oneLB-parent/imports/*.lean
            .tmp/a3-oneLB-parent/build/*.olean
            .tmp/a3-oneLB-parent/log
      - uses: actions/upload-artifact@v4
        if: ${{ success() && (inputs.child_code == '09' || inputs.child_code == '21') }}
        with:
          name: raw139-oneLB-c${{ inputs.child_code }}-certified
          include-hidden-files: true
          path: .tmp/a3-oneLB-c${{ inputs.child_code }}/
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && (inputs.child_code == '09' || inputs.child_code == '21') }}
        with:
          name: raw139-oneLB-c${{ inputs.child_code }}-incomplete
          include-hidden-files: true
          if-no-files-found: ignore
          path: .tmp/a3-oneLB-c${{ inputs.child_code }}/
      - name: Certify an E1=0RD sub-cylinder
        if: ${{ startsWith(inputs.child_code, 'E1D0') }}
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ inputs.child_code }}
        run: bash im-results/agent3-raw139-e1-zeroRD/check-cylinder.sh "$CODE"
      - uses: actions/upload-artifact@v4
        if: ${{ success() && startsWith(inputs.child_code, 'E1D0') }}
        with:
          name: raw139-${{ inputs.child_code }}-certified
          include-hidden-files: true
          path: |
            .tmp/a3-e1-${{ inputs.child_code }}/manifest.json
            .tmp/a3-e1-${{ inputs.child_code }}/build/*.olean
            .tmp/a3-e1-${{ inputs.child_code }}/imports/*.lean
            .tmp/a3-e1-${{ inputs.child_code }}/log
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && startsWith(inputs.child_code, 'E1D0') }}
        with:
          name: raw139-${{ inputs.child_code }}-incomplete
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .tmp/a3-e1-${{ inputs.child_code }}/log
            .tmp/a3-e1-${{ inputs.child_code }}/imports/*.lean
