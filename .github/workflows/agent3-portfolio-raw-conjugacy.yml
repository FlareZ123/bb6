name: Agent 3 BB6 raw conjugacy and D-family witnesses (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-raw-conjugacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original source files and audit axioms
        run: |
          mkdir -p /tmp/a3-conjugacy
          cp im-results/agent3-portfolio-raw-conjugacy/{MachineConjugacy,DTableWitness,DStartFinite,DSectionTransfer,DAllStarts,DExactTimes,DParseRLE,DSourceCorollaries,DBlankFusion,STableWitness}.lean /tmp/a3-conjugacy/
          cd /tmp/a3-conjugacy
          export LEAN_PATH="."
          lean --version
          lean -o MachineConjugacy.olean MachineConjugacy.lean
          lean -o DTableWitness.olean DTableWitness.lean
          lean -o DStartFinite.olean DStartFinite.lean
          lean -o DSectionTransfer.olean DSectionTransfer.lean
          lean -o DAllStarts.olean DAllStarts.lean
          lean -o DExactTimes.olean DExactTimes.lean
          lean -o DParseRLE.olean DParseRLE.lean
          lean -o DSourceCorollaries.olean DSourceCorollaries.lean
          lean DBlankFusion.lean
          lean STableWitness.lean
          python3 -m pip install --quiet filelock
          python3 "$GITHUB_WORKSPACE/im-results/agent31-cryptid-boundary/unpack.py"
          python3 "$GITHUB_WORKSPACE/im-results/agent37-raw-boundary/unpack.py"
          cp "$GITHUB_WORKSPACE/im-results/agent31-cryptid-boundary/Boundary.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent37-raw-boundary/RawBoundaryBridge.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent37-raw-boundary/RawBoundaryHalt.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent37-raw-boundary/RawBoundaryRoots.lean" .
          lean -o Boundary.olean Boundary.lean
          lean -o RawBoundaryBridge.olean RawBoundaryBridge.lean
          lean -o RawBoundaryHalt.olean RawBoundaryHalt.lean
          lean RawBoundaryRoots.lean
  ledger-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce pinned 663-root ledger byte for byte
        run: |
          node --version
          node tools/holdout_family_ledger.cjs resources/BB6_holdouts_663_2026-10-16.txt > /tmp/a3-ledger-regenerated.csv
          cmp im-results/holdout-family-coverage/2026-10-16-rooted-ledger.csv /tmp/a3-ledger-regenerated.csv
          wc -l im-results/holdout-family-coverage/2026-10-16-rooted-ledger.csv
