name: Raw120 complete source-linked parent proof
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build the parent, repair 1LB, or integrate into the eleven-parent core
        type: choice
        options: [all, repair-1lb, integrate-65, scan-normalized-cryptids, raw139-e0-zeroRA, raw139-e0-integrate]
        default: repair-1lb
      raw139_subcover_run_id:
        description: Optional Agent6 run ID containing the 43-sibling Raw139 core and consumer artifacts
        type: string
        default: ""
      canonical77_run_id:
        description: Accepted canonical77-certified object artifact run ID for the normalized Raw139 candidate scan
        type: string
        default: "45554648116"
      canonical77_manifest_run_id:
        description: Raw107 shared-core run containing the exact canonical77 source manifest
        type: string
        default: "45647053824"
      raw139_e0_cover_run_id:
        description: Source-checked Raw139 E0=0RA 24-child cover run to integrate
        type: string
        default: "45778885358"
      raw139_e0_integrated_run_id:
        description: Run containing the compiled Raw139 E0=0RA integration and accepted 63-row membership object
        type: string
        default: "45828809314"
      raw139_e0_rb_run_id:
        description: Source-audited E0=0RB parent Cover artifact run ID
        type: string
        default: "45824379594"
      raw139_e0_rd_run_id:
        description: Source-audited E0=0RD parent Cover artifact run ID
        type: string
        default: "45824386626"
permissions:
  contents: read
  actions: read
jobs:
  child:
    if: inputs.mode == 'all' || inputs.mode == 'repair-1lb'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        child: ${{ fromJSON(inputs.mode == 'repair-1lb' && '["1LB"]' || '["0LA","0LB","0LF","0RA","0RB","0RC","0RF","1LA","1LB","1LF","1RA","1RB","1RC","1RF","cycles"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Source-check child
        env:
          CHILD: ${{ matrix.child }}
        run: |
          set -euo pipefail
          base=im-results/agent3-tnf-raw120
          python im-results/agent13-coverage/unpack.py
          if [ "$CHILD" = cycles ]; then
            target="$base/Raw120EasyCycles.lean"
          else
            target=$(python "$base/generate_child.py" "$CHILD")
          fi
          mkdir -p /tmp/raw120-shard
          python tools/lean_compile_closure.py --workdir /tmp/raw120-shard/objects --jobs 2 --manifest /tmp/raw120-shard/manifest.json "$target" | tee /tmp/raw120-check.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw120-check.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw120-child-${{ matrix.child }}
          path: /tmp/raw120-shard
          if-no-files-found: error
          retention-days: 14
  parent:
    if: inputs.mode == 'all' || inputs.mode == 'repair-1lb'
    needs: child
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        if: inputs.mode == 'repair-1lb'
        with:
          pattern: raw120-child-*
          path: /tmp/raw120-shards
          run-id: 45702614303
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: raw120-child-*
          path: /tmp/raw120-shards
      - name: Check complete parent against exact child closures
        run: |
          set -euo pipefail
          base=im-results/agent3-tnf-raw120
          python "$base/assemble_shards.py" /tmp/raw120-shards /tmp/raw120-merged
          python tools/lean_compile_closure.py --workdir /tmp/raw120-parent --jobs 2 --precompiled-dir /tmp/raw120-merged --precompiled-manifest /tmp/raw120-merged/manifest.json --manifest /tmp/raw120-parent-manifest.json "$base/Raw120Complete.lean" "$base/Raw120ExactLower.lean" | tee /tmp/raw120-parent.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw120-parent.log; then exit 1; fi
          mkdir -p /tmp/raw120-result
          cp /tmp/raw120-parent-manifest.json /tmp/raw120-result/manifest.json
          cp /tmp/raw120-parent.log /tmp/raw120-result/check.log
          cp -r /tmp/raw120-parent /tmp/raw120-result/objects
      - uses: actions/upload-artifact@v4
        with:
          name: raw120-parent
          path: /tmp/raw120-result
          if-no-files-found: error
          retention-days: 14

  integrate:
    if: inputs.mode == 'integrate-65'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Consume the exact Raw120 parent in the accepted eleven-parent core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python im-results/agent3-tnf-raw120/assemble_raw120_canonical.py --work /tmp/raw120-canonical64 | tee /tmp/raw120-canonical64.log
      - name: Download Agent6 Raw139 core closure
        if: inputs.mode == 'integrate-65' && inputs.raw139_subcover_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw139_subcover_run_id }}
          name: agent6-champion-residual-core
          path: /tmp/a6-core
      - name: Download Agent6 43-sibling Raw139 consumer
        if: inputs.mode == 'integrate-65' && inputs.raw139_subcover_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw139_subcover_run_id }}
          pattern: agent6-canonical68-raw139-43-sibling-consumer-*
          merge-multiple: true
          path: /tmp/a6-sibling
      - name: Download E0=0RA shared closure for Canonical64 integration
        if: inputs.mode == 'integrate-65' && inputs.raw139_e0_cover_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw139_e0_cover_run_id }}
          name: raw139-e0-0ra-shared
          path: /tmp/a3e0-shared
      - name: Download E0=0RA child covers for Canonical64 integration
        if: inputs.mode == 'integrate-65' && inputs.raw139_e0_cover_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw139_e0_cover_run_id }}
          pattern: raw139-e0-0ra-child-*
          merge-multiple: true
          path: /tmp/a3e0-children
      - name: Download E0=0RA parent cover for Canonical64 integration
        if: inputs.mode == 'integrate-65' && inputs.raw139_e0_cover_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw139_e0_cover_run_id }}
          name: raw139-e0-0ra-certified
          path: /tmp/a3e0-parent
      - name: Download compiled E0=0RA integration objects
        if: inputs.mode == 'integrate-65' && inputs.raw139_e0_integrated_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw139_e0_integrated_run_id }}
          name: agent3-raw139-e0-integrated
          path: /tmp/a3e0-integrated
      - name: Prepare E0=0RA object closure
        if: inputs.mode == 'integrate-65' && inputs.raw139_e0_cover_run_id != '' && inputs.raw139_e0_integrated_run_id != ''
        run: |
          set -euo pipefail
          mkdir -p /tmp/a3e0-build
          cp /tmp/a3e0-shared/build/*.olean /tmp/a3e0-build/
          cp /tmp/a3e0-children/*.olean /tmp/a3e0-build/
          find /tmp/a3e0-parent -name A3E0RACover.olean -exec cp {} /tmp/a3e0-build/ \;
          find /tmp/a3e0-integrated -name 'Raw139E0ZeroRAIntegrated.olean' -exec cp {} /tmp/a3e0-build/ \;
          find /tmp/a3e0-integrated -name 'Raw139E0ZeroRAMatch.olean' -exec cp {} /tmp/a3e0-build/ \;
          find /tmp/a3e0-integrated -name 'Raw139NormalizedE0ParentRows.olean' -exec cp {} /tmp/a3e0-build/ \;
          test -s /tmp/a3e0-build/A3E0RACover.olean
          test -s /tmp/a3e0-build/Raw139E0ZeroRAIntegrated.olean
          test -s /tmp/a3e0-build/Raw139E0ZeroRAMatch.olean
          test -s /tmp/a3e0-build/Raw139NormalizedE0ParentRows.olean
      - name: Compile the Canonical64 Raw139 subcover wrapper
        if: inputs.mode == 'integrate-65' && inputs.raw139_subcover_run_id != ''
        run: |
          set -euo pipefail
          test -s /tmp/a6-core/build/ChampionResidualFrontier.olean
          test -s /tmp/a6-sibling/source-sibling-build/ChampionResidualCanonical68Integration.olean
          test -s /tmp/raw120-canonical64/linked/Canonical64Raw120Integrated.olean
          test -s /tmp/a6-sibling/source-sibling-build/Raw139Normalized.olean
          test -s /tmp/a3e0-build/Raw139E0ZeroRAIntegrated.olean
          export LEAN_PATH="/tmp/a3e0-build:/tmp/raw120-canonical64/linked:/tmp/a6-core/build:/tmp/a6-sibling/source-sibling-build${LEAN_PATH:+:$LEAN_PATH}"
          lean -o /tmp/raw120-canonical64/linked/Canonical64Raw139Subcover.olean \
            im-results/agent14-raw139-d0-generic/Canonical64Raw139Subcover.lean \
            | tee /tmp/raw120-canonical64/raw139-subcover.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw120-canonical64/raw139-subcover.log; then
            echo "nonstandard axiom in Canonical64 Raw139 subcover wrapper"
            exit 1
          fi
      - name: Rebuild accepted E0=0RE parent and compile normalized-to-active Raw139 crosswalk
        if: inputs.mode == 'integrate-65' && inputs.raw139_subcover_run_id != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw120-canonical64
          {
            bash im-results/agent48-raw139-e0-0re/reproduce-parent.sh
            test -s .tmp/a48-e0parent-ZeroRE/build/Raw139E0ZeroRECover.olean
            python3 - <<'PY'
          from pathlib import Path
          import hashlib, sys
          src = Path(".tmp/a48-e0parent-ZeroRE/build")
          others = [
              Path("/tmp/a3e0-build"),
              Path("/tmp/raw120-canonical64/linked"),
              Path("/tmp/a6-core/build"),
              Path("/tmp/a6-sibling/source-sibling-build"),
          ]
          conflicts = []
          for p in src.glob("*.olean"):
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              for directory in others:
                  q = directory / p.name
                  if q.is_file():
                      other = hashlib.sha256(q.read_bytes()).hexdigest()
                      if digest != other:
                          conflicts.append((p.name, str(directory), digest, other))
          if conflicts:
              for name, directory, left, right in conflicts:
                  print(f"OLEAN_CONFLICT {name} {directory} {left} {right}")
              sys.exit(1)
          print("E0RE overlapping .olean modules are byte-identical")
          PY
            export LEAN_PATH=".tmp/a48-e0parent-ZeroRE/build:/tmp/a3e0-build:/tmp/raw120-canonical64/linked:/tmp/a6-core/build:/tmp/a6-sibling/source-sibling-build${LEAN_PATH:+:$LEAN_PATH}"
            lean -o /tmp/raw120-canonical64/linked/Canonical64Raw139NormalizedCrosswalk.olean \
              im-results/agent14-raw139-d0-generic/Canonical64Raw139NormalizedCrosswalk.lean
          } 2>&1 | tee /tmp/raw120-canonical64/raw139-normalized-crosswalk.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw120-canonical64/raw139-normalized-crosswalk.log; then
            echo "nonstandard axiom in Raw139 normalized crosswalk probe"
            exit 1
          fi
      - name: Download source-accepted E0=0RB parent Cover
        if: inputs.mode == 'integrate-65' && inputs.raw139_e0_rb_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw139_e0_rb_run_id }}
          name: raw139-e0parent-ZeroRB-certified
          path: /tmp/a48-e0rb-artifact
      - name: Download source-accepted E0=0RD parent Cover
        if: inputs.mode == 'integrate-65' && inputs.raw139_e0_rd_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw139_e0_rd_run_id }}
          name: raw139-e0parent-ZeroRD-certified
          path: /tmp/a48-e0rd-artifact
      - name: Prepare E0=0RB/0RD object closures and compare identities
        if: inputs.mode == 'integrate-65' && inputs.raw139_subcover_run_id != '' && inputs.raw139_e0_rb_run_id != '' && inputs.raw139_e0_rd_run_id != ''
        run: |
          set -euo pipefail
          mkdir -p /tmp/a48-e0rb-build /tmp/a48-e0rd-build
          find /tmp/a48-e0rb-artifact -name '*.olean' -exec cp {} /tmp/a48-e0rb-build/ \;
          find /tmp/a48-e0rd-artifact -name '*.olean' -exec cp {} /tmp/a48-e0rd-build/ \;
          test -s /tmp/a48-e0rb-build/Raw139E0ZeroRBCover.olean
          test -s /tmp/a48-e0rd-build/Raw139E0ZeroRDCover.olean
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, sys
          dirs = [
              Path("/tmp/a48-e0rb-build"),
              Path("/tmp/a48-e0rd-build"),
              Path(".tmp/a48-e0parent-ZeroRE/build"),
              Path("/tmp/a3e0-build"),
              Path("/tmp/raw120-canonical64/linked"),
              Path("/tmp/a6-core/build"),
              Path("/tmp/a6-sibling/source-sibling-build"),
          ]
          conflicts = []
          for i, left in enumerate(dirs):
              if not left.is_dir():
                  continue
              for right in dirs[i+1:]:
                  if not right.is_dir():
                      continue
                  for p in left.glob("*.olean"):
                      q = right / p.name
                      if q.is_file():
                          a = hashlib.sha256(p.read_bytes()).hexdigest()
                          b = hashlib.sha256(q.read_bytes()).hexdigest()
                          if a != b:
                              conflicts.append((p.name, str(left), str(right), a, b))
          if conflicts:
              for name, left, right, a, b in conflicts:
                  print(f"OLEAN_CONFLICT {name} {left} {right} {a} {b}")
              sys.exit(1)
          print("All overlapping E0 parent, Raw139 core, and Canonical64 .olean objects are byte-identical")
          PY
      - name: Compile the 63-row E0 parent crosswalk consumer
        if: inputs.mode == 'integrate-65' && inputs.raw139_subcover_run_id != '' && inputs.raw139_e0_rb_run_id != '' && inputs.raw139_e0_rd_run_id != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s /tmp/raw120-canonical64/linked/Canonical64Raw139NormalizedCrosswalk.olean
          export LEAN_PATH="/tmp/a48-e0rb-build:/tmp/a48-e0rd-build:.tmp/a48-e0parent-ZeroRE/build:/tmp/a3e0-build:/tmp/raw120-canonical64/linked:/tmp/a6-core/build:/tmp/a6-sibling/source-sibling-build${LEAN_PATH:+:$LEAN_PATH}"
          lean -o /tmp/raw120-canonical64/linked/Canonical64Raw139NormalizedE0ParentCrosswalk.olean \
            im-results/agent14-raw139-d0-generic/Canonical64Raw139NormalizedE0ParentCrosswalk.lean \
            | tee /tmp/raw120-canonical64/raw139-e0-parent-crosswalk.log
          if grep -Eq 'sorryAx|native_decide|Lean\.ofReduceBool' /tmp/raw120-canonical64/raw139-e0-parent-crosswalk.log; then
            echo "nonstandard axiom in 63-row E0 parent crosswalk consumer"
            exit 1
          fi
      - name: Compile direct normalized 63-row Canonical64 consumer
        if: inputs.mode == 'integrate-65' && inputs.raw139_subcover_run_id != '' && inputs.raw139_e0_rb_run_id != '' && inputs.raw139_e0_rd_run_id != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s /tmp/a6-sibling/source-sibling-build/Raw139NormalizedAcceptedCovers.olean
          test -s /tmp/a3e0-build/Raw139NormalizedE0ParentRows.olean
          test -s /tmp/a3e0-build/Raw139E0ZeroRAIntegrated.olean
          test -s /tmp/a48-e0rb-build/Raw139E0ZeroRBCover.olean
          test -s /tmp/a48-e0rd-build/Raw139E0ZeroRDCover.olean
          test -s .tmp/a48-e0parent-ZeroRE/build/Raw139E0ZeroRECover.olean
          export LEAN_PATH="/tmp/a6-sibling/source-sibling-build:/tmp/a6-core/build:/tmp/a48-e0rb-build:/tmp/a48-e0rd-build:.tmp/a48-e0parent-ZeroRE/build:/tmp/a3e0-build:/tmp/raw120-canonical64/linked${LEAN_PATH:+:$LEAN_PATH}"
          lean -o /tmp/raw120-canonical64/linked/Canonical64Raw139NormalizedDirect.olean \
            im-results/agent14-raw139-d0-generic/Canonical64Raw139NormalizedDirect.lean \
            | tee /tmp/raw120-canonical64/raw139-normalized-direct-63.log
          if grep -Eq 'sorryAx|native_decide|Lean\.ofReduceBool' /tmp/raw120-canonical64/raw139-normalized-direct-63.log; then
            echo "nonstandard axiom in direct normalized 63-row Canonical64 consumer"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw120-canonical64-audit
          path: |
            /tmp/raw120-canonical64.log
            /tmp/raw120-canonical64/canonical64.log
            /tmp/raw120-canonical64/canonical64-integration.json
            /tmp/raw120-canonical64/reachable-link-audit.json
            /tmp/raw120-canonical64/linked/Canonical64Raw120Integrated.olean
            /tmp/raw120-canonical64/linked/Canonical64Raw139Subcover.olean
            /tmp/raw120-canonical64/raw139-subcover.log
            /tmp/raw120-canonical64/raw139-normalized-crosswalk.log
            /tmp/raw120-canonical64/linked/Canonical64Raw139NormalizedCrosswalk.olean
            /tmp/raw120-canonical64/raw139-e0-parent-crosswalk.log
            /tmp/raw120-canonical64/linked/Canonical64Raw139NormalizedE0ParentCrosswalk.olean
            /tmp/raw120-canonical64/raw139-normalized-direct-63.log
            /tmp/raw120-canonical64/linked/Canonical64Raw139NormalizedDirect.olean
            /tmp/a48-e0rb-build/*.olean
            /tmp/a48-e0rd-build/*.olean
            /tmp/a3e0-build/*.olean
            .tmp/a48-e0parent-ZeroRE/log
            .tmp/a48-e0parent-ZeroRE/manifest.json
            .tmp/a48-e0parent-ZeroRE/partition.json
            .tmp/a48-e0parent-ZeroRE/imports/Raw139E0ZeroRECover.lean
          if-no-files-found: warn
          retention-days: 14

  normalized-scan:
    if: inputs.mode == 'scan-normalized-cryptids' || inputs.mode == 'raw139-e0-integrate'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download accepted canonical77 source-checked object artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.canonical77_run_id }}
          name: canonical77-certified
          path: /tmp/canonical77
      - name: Download exact canonical77 source manifest
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.canonical77_manifest_run_id }}
          name: raw107-canonical-shared-core
          path: /tmp/canonical77-manifest
      - name: Recreate canonical77 source closure inputs
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent11-raw107/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 68 72 82
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          cd im-results/agent47-raw114-cut
          python paired_counter.py
          python long_sweep.py
          printf '%s\n' 0LA 0LB 0LC 0LF 0RA 0RB 0RC 0RF 1LA 1LB 1LC 1LF 1RA 1RB 1RC 1RF | xargs -P 4 -I{} python generate_complete.py {}
          python generate_complete.py --combine
      - name: Compile normalized Raw139 candidate matcher against canonical77
        run: |
          set -euo pipefail
          test -s /tmp/canonical77/CanonicalRaw114Accepted.olean
          test -s /tmp/canonical77/CanonicalTwoParentGraft.olean
          test -s /tmp/canonical77-manifest/manifest/canonical77-base-manifest.json
          mkdir -p /tmp/agent3-raw139-normalized
          python tools/test_lean_compile_module_index.py
          python tools/lean_compile_closure.py \
            --workdir /tmp/agent3-raw139-normalized/build \
            --jobs 4 \
            --precompiled-dir /tmp/canonical77 \
            --precompiled-manifest /tmp/canonical77-manifest/manifest/canonical77-base-manifest.json \
            --manifest /tmp/agent3-raw139-normalized/manifest.json \
            --label agent3-raw139-normalized-cryptids-scan \
            --provenance-input im-results/agent3-raw139-cryptids-scan/README.md \
            --provenance-input im-results/agent3-raw139-cryptids-scan/Raw139CryptidsNormalizedScan.lean \
            --provenance-input im-results/agent3-raw139-e0-zeroRA/Raw139E0ZeroRAMatch.lean \
            --provenance-input im-results/agent3-raw139-e0-zeroRA/Raw139E0ZeroRAIntegrated.lean \
            --override CanonicalFrontier=im-results/agent47-rooted-tnf/CanonicalFrontier.lean \
            --override TNFPilot=im-results/agent50-weighted-tnf-pilot/TNFPilot.lean \
            --override FastFAR=im-results/agent7-far/FastFAR.lean \
            --override SideCycle=im-results/agent50-weighted-tnf-pilot/SideCycle.lean \
            --override WeightedTNFQueueOrbit=im-results/agent13-weighted-first-one/WeightedTNFQueueOrbit.lean \
            --override FirstHolePath=im-results/agent8-cryptids-tnf-paths/FirstHolePath.lean \
            --override CanonicalRaw114Accepted=im-results/agent47-rooted-tnf/CanonicalRaw114Accepted.lean \
            --override HardRootCore=im-results/agent19-hard-root-crosswalk/HardRootCore.lean \
            --override Raw139Normalized=im-results/agent6-raw139-normalized/Raw139Normalized.lean \
            --override Raw139CryptidsNormalizedScan=im-results/agent3-raw139-cryptids-scan/Raw139CryptidsNormalizedScan.lean \
            im-results/agent6-raw139-normalized/Raw139Normalized.lean \
            im-results/agent19-hard-root-crosswalk/HardRootCore.lean \
            im-results/agent3-raw139-cryptids-scan/Raw139CryptidsNormalizedScan.lean \
            im-results/agent3-raw139-e0-zeroRA/Raw139E0ZeroRAMatch.lean \
            | tee /tmp/agent3-raw139-normalized/scan.log
          if grep -Eq 'sorryAx|native_decide' /tmp/agent3-raw139-normalized/scan.log; then
            echo "nonstandard axiom in normalized Raw139 scan"
            exit 1
          fi
      - name: Download the E0=0RA shared checker closure
        if: inputs.mode == 'raw139-e0-integrate'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw139_e0_cover_run_id }}
          name: raw139-e0-0ra-shared
          path: /tmp/a3e0-shared
      - name: Download the E0=0RA 24 child-cover objects
        if: inputs.mode == 'raw139-e0-integrate'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw139_e0_cover_run_id }}
          pattern: raw139-e0-0ra-child-*
          merge-multiple: true
          path: /tmp/a3e0-children
      - name: Download the E0=0RA parent-cover object
        if: inputs.mode == 'raw139-e0-integrate'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw139_e0_cover_run_id }}
          name: raw139-e0-0ra-certified
          path: /tmp/a3e0-parent
      - name: Compile the 66-row Raw139 residual integration
        if: inputs.mode == 'raw139-e0-integrate'
        run: |
          set -euo pipefail
          mkdir -p /tmp/a3e0-build
          cp /tmp/a3e0-shared/build/*.olean /tmp/a3e0-build/
          cp /tmp/a3e0-children/*.olean /tmp/a3e0-build/
          find /tmp/a3e0-parent -name A3E0RACover.olean -exec cp {} /tmp/a3e0-build/ \;
          find /tmp/a3e0-parent -name A3E0RACover.lean -exec cp {} /tmp/a3e0-build/ \;
          test -s /tmp/a3e0-build/Agent3PackedFast.olean
          test -s /tmp/a3e0-build/A3E0RAB00Cover.olean
          test -s /tmp/a3e0-build/A3E0RAB23Cover.olean
          test -s /tmp/a3e0-build/A3E0RACover.olean
          export LEAN_PATH="/tmp/agent3-raw139-normalized/build:/tmp/a3e0-build:/tmp/canonical77"
          lean -o /tmp/agent3-raw139-normalized/build/Raw139E0ZeroRAIntegrated.olean \
            im-results/agent3-raw139-e0-zeroRA/Raw139E0ZeroRAIntegrated.lean \
            | tee /tmp/agent3-raw139-normalized/e0-integrated.log
          if grep -Eq 'sorryAx|native_decide|Lean\.ofReduceBool' /tmp/agent3-raw139-normalized/e0-integrated.log; then
            echo "nonstandard axiom in Raw139 E0=0RA integration"
            exit 1
          fi
      - name: Compile exact E0 parent row membership and 63-row count
        if: inputs.mode == 'raw139-e0-integrate'
        run: |
          set -euo pipefail
          export LEAN_PATH="/tmp/agent3-raw139-normalized/build:/tmp/a3e0-build:/tmp/canonical77"
          lean -o /tmp/agent3-raw139-normalized/build/Raw139NormalizedE0ParentRows.olean \
            im-results/agent14-raw139-d0-generic/Raw139NormalizedE0ParentRows.lean \
            | tee /tmp/agent3-raw139-normalized/e0-parent-rows.log
          if grep -Eq 'sorryAx|native_decide|Lean\.ofReduceBool' /tmp/agent3-raw139-normalized/e0-parent-rows.log; then
            echo "nonstandard axiom in Raw139 E0 parent row membership"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent3-raw139-normalized-cryptids-scan
          path: |
            /tmp/agent3-raw139-normalized/scan.log
            /tmp/agent3-raw139-normalized/manifest.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.mode == 'raw139-e0-integrate'
        with:
          name: agent3-raw139-e0-integrated
          path: |
            /tmp/agent3-raw139-normalized/e0-integrated.log
            /tmp/agent3-raw139-normalized/e0-parent-rows.log
            /tmp/agent3-raw139-normalized/build/Raw139E0ZeroRAIntegrated.olean
            /tmp/agent3-raw139-normalized/build/Raw139NormalizedE0ParentRows.olean
            /tmp/agent3-raw139-normalized/build/Raw139E0ZeroRAMatch.olean
            /tmp/agent3-raw139-normalized/manifest.json
          if-no-files-found: error
          retention-days: 14

  raw139-e0-prepare:
    if: inputs.mode == 'raw139-e0-zeroRA'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45746968139
          name: raw139-c1-twelve-certified
          path: /tmp/a3-c1
      - name: Build shared exact checker and longest trace, generate witness recipes
        run: |
          set -euo pipefail
          bash im-results/agent3-raw139-e0-zeroRA/prepare.sh | tee /tmp/a3-prepare.log
          if grep -Eq 'sorryAx|native_decide|Lean\.ofReduceBool' /tmp/a3-prepare.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw139-e0-0ra-shared
          path: /tmp/a3e0-prepared
          if-no-files-found: error
          retention-days: 14

  raw139-e0-child:
    if: inputs.mode == 'raw139-e0-zeroRA'
    needs: raw139-e0-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        child: ["0","1","2","3","6","8","9","10","11","12","18","19","20","21","22","23","easy"]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw139-e0-0ra-shared
          path: /tmp/a3e0-prepared
      - name: Kernel check branch family
        env:
          CHILD: ${{ matrix.child }}
          A3_BUILD: /tmp/a3e0-prepared/build
        run: |
          set -euo pipefail
          cd im-results/agent3-raw139-e0-zeroRA
          # The archived source bundle predates the checked fast certificate.
          cp fast.py /tmp/a3-e0-fast.py
          cp Agent3PackedFast.lean.xz /tmp/a3-e0-fast.lean.xz
          tar -xJf source.tar.xz
          cp /tmp/a3-e0-fast.py fast.py
          cp /tmp/a3-e0-fast.lean.xz Agent3PackedFast.lean.xz
          echo "56b716777e9b1371b4638d7f4e54e0d0812ad5f2618793a43bb9e88633073b7e  Agent3PackedFast.lean.xz" | sha256sum -c
          python fast.py
          cp /tmp/a3e0-prepared/recipes.jsonl .
          if [ "$CHILD" = easy ]; then branches="4 5 7 13 14 15 16 17"; else branches="$CHILD"; fi
          python emit_family.py $branches
          python compile.py 2 $branches
          mkdir -p /tmp/a3-e0-child
          for b in $branches; do
            prefix=$(printf 'A3E0RAB%02d' "$b")
            cp "$A3_BUILD"/"$prefix"*.olean /tmp/a3-e0-child/
            cp "modules$b.json" /tmp/a3-e0-child/
          done
          cp -r compile-logs /tmp/a3-e0-child/
          (cd /tmp/a3-e0-child; sha256sum *.olean > "objects-$CHILD.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: raw139-e0-0ra-child-${{ matrix.child }}
          path: /tmp/a3-e0-child
          if-no-files-found: error
          retention-days: 14

  raw139-e0-parent:
    if: inputs.mode == 'raw139-e0-zeroRA'
    needs: raw139-e0-child
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw139-e0-0ra-shared
          path: /tmp/a3e0-prepared
      - uses: actions/download-artifact@v4
        with:
          pattern: raw139-e0-0ra-child-*
          path: /tmp/a3-e0-children
          merge-multiple: true
      - name: Compose all 24 child covers
        env:
          A3_BUILD: /tmp/a3e0-prepared/build
          LEAN_PATH: /tmp/a3e0-prepared/build
        run: |
          set -euo pipefail
          cd /tmp/a3-e0-children
          for f in objects-*.sha256; do sha256sum -c "$f" > /dev/null; done
          cp *.olean "$A3_BUILD/"
          cd "$GITHUB_WORKSPACE/im-results/agent3-raw139-e0-zeroRA"
          python root.py
          cd "$A3_BUILD"
          lean -o A3E0RACover.olean A3E0RACover.lean | tee /tmp/a3-e0-parent.log
          if grep -Eq 'sorryAx|native_decide|Lean\.ofReduceBool' /tmp/a3-e0-parent.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw139-e0-0ra-certified
          path: |
            /tmp/a3e0-prepared/build/A3E0RACover.lean
            /tmp/a3e0-prepared/build/A3E0RACover.olean
            /tmp/a3-e0-parent.log
          if-no-files-found: error
          retention-days: 14
