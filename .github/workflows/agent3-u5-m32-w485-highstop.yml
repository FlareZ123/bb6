name: Agent 3 U5 source closures (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select the exact source import closure to compile"
        required: true
        type: choice
        options:
          - cline-filter
          - cline-residual
          - m32-w485-highstop
          - w1821-primitives
          - w1821-highstop
        default: m32-w485-highstop

permissions:
  contents: read

jobs:
  compile-exact-source-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          mkdir -p /tmp/lean-closure-reports
          lean --version | tee /tmp/lean-closure-reports/toolchain.txt
          git rev-parse HEAD | tee -a /tmp/lean-closure-reports/toolchain.txt

      - name: Generate M32 quotient source modules
        if: inputs.target == 'm32-w485-highstop'
        run: python3 tools/agent43_c32_certificate.py

      - name: Compile exact transitive import closure
        run: |
          set -euo pipefail
          target="${{ inputs.target }}"
          case "$target" in
            cline-filter)
              python3 tools/lean_compile_closure.py \
                im-results/agent3-c-bounce-inverse/U5Q0CLineFilter.lean \
                --jobs 4 --workdir /tmp/lean-closure-cline-filter 2>&1 | tee "/tmp/lean-closure-reports/${target}.log"
              ;;
            cline-residual)
              python3 tools/lean_compile_closure.py \
                im-results/agent3-c-bounce-inverse/U5Q0CLineResidualClosure.lean \
                --jobs 4 --workdir /tmp/lean-closure-cline-residual 2>&1 | tee "/tmp/lean-closure-reports/${target}.log"
              ;;
            m32-w485-highstop)
              python3 tools/lean_compile_closure.py \
                im-results/agent3-c-bounce-inverse/U5Q0M32W485HighStop.lean \
                --jobs 8 --workdir /tmp/lean-closure-m32-w485 2>&1 | tee "/tmp/lean-closure-reports/${target}.log"
              ;;
            w1821-primitives)
              python3 tools/lean_compile_closure.py \
                im-results/agent3-c-bounce-inverse/U5W1821Prerequisites.lean \
                --jobs 4 --workdir /tmp/lean-closure-w1821-primitives 2>&1 | tee "/tmp/lean-closure-reports/${target}.log"
              ;;
            w1821-highstop)
              python3 tools/lean_compile_closure.py \
                im-results/agent3-c-bounce-inverse/U5Q0W1821HighStop.lean \
                --jobs 8 --workdir /tmp/lean-closure-w1821 2>&1 | tee "/tmp/lean-closure-reports/${target}.log"
              ;;
            *)
              echo "Unknown target: ${{ inputs.target }}" >&2
              exit 2
              ;;
          esac

      - name: Upload exact-source compiler and axiom report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-closure-${{ inputs.target }}-${{ github.run_id }}
          path: /tmp/lean-closure-reports/*
          if-no-files-found: warn
          retention-days: 14
