name: Agent 3 Machine C valuation-bounded exact high predecessor lists (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unchanged Machine C source, exact inverse grammar, and valuation-indexed candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent3-valuation-high-count
          cp im-results/agent11-c-line/CLine.lean /tmp/agent3-valuation-high-count/
          cp im-results/agent8-c-total-section/GenericSection.lean /tmp/agent3-valuation-high-count/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef}.lean /tmp/agent3-valuation-high-count/
          cp im-results/agent38-c-section-mod4/Agent38SectionParity.lean /tmp/agent3-valuation-high-count/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,EvenTargetForward,BounceEvenExact,BounceOddExact,BounceEvenThree,BounceEvenNoFour,FullSectionInverse,BounceAllExact,SectionAllInverse}.lean /tmp/agent3-valuation-high-count/
          cp im-results/agent34-c-valuation-fanin/{ValuationArithmetic,ValuationSource,ValuationHighCount,ValuationFullCount,ValuationAllParents,ValuationDegreeBound}.lean /tmp/agent3-valuation-high-count/
          cd /tmp/agent3-valuation-high-count
          export LEAN_PATH=.
          lean --version
          for f in CLine GenericSection JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef Agent38SectionParity BounceInverse EvenTargetForward BounceEvenExact BounceOddExact BounceEvenThree BounceEvenNoFour FullSectionInverse BounceAllExact SectionAllInverse ValuationArithmetic ValuationSource ValuationHighCount ValuationFullCount ValuationAllParents ValuationDegreeBound; do
            echo "Compiling $f"
            lean -o "$f.olean" "$f.lean"
          done
