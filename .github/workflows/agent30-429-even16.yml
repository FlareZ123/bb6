name: Agent 30 #429 even16 and 11473/16384 original-source verification (manual)

on:
  workflow_dispatch:
    inputs:
      proof_target:
        description: Select an existing proof-family source check
        required: false
        default: even16
        type: choice
        options:
          - even16
          - branch9_side
          - branch9_center
          - branch9_center64
          - branch9_upper

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile authentic #429 accelerator and inverse certificate
        if: ${{ inputs.proof_target == 'even16' }}
        shell: bash
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent6-harmonic429:im-results/agent39-429-1021:im-results/agent30-429-even16
        run: |
          set -euo pipefail
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-harmonic429/BB429Mod8.olean im-results/agent6-harmonic429/BB429Mod8.lean
          lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent39-429-1021/BB429RootEven8.olean im-results/agent39-429-1021/BB429RootEven8.lean
          lean -DmaxHeartbeats=5000000 -o im-results/agent6-harmonic429/BB429NoThree.olean im-results/agent6-harmonic429/BB429NoThree.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent30-429-even16/BB429Even16.olean im-results/agent30-429-even16/BB429Even16.lean
          lean -DmaxHeartbeats=50000000 -DmaxRecDepth=30000 -o im-results/agent6-harmonic429/BB429NewResidue.olean im-results/agent6-harmonic429/BB429NewResidue.lean
          lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent39-429-1021/BB429RootMod16.olean im-results/agent39-429-1021/BB429RootMod16.lean
          lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent39-429-1021/BB429RootMod32.olean im-results/agent39-429-1021/BB429RootMod32.lean
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=30000 -o im-results/agent30-429-even16/BB429InverseKernel16.olean im-results/agent30-429-even16/BB429InverseKernel16.lean
          lean -DmaxHeartbeats=20000000 -DmaxRecDepth=32768 -o im-results/agent30-429-even16/BB429No11473mod16384.olean im-results/agent30-429-even16/BB429No11473mod16384.lean

      - name: Compile branch-9 exceptional parent 25/32 theorem
        if: ${{ inputs.proof_target == 'branch9_side' || inputs.proof_target == 'branch9_center' || inputs.proof_target == 'branch9_center64' || inputs.proof_target == 'branch9_upper' }}
        shell: bash
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent6-harmonic429:im-results/agent39-429-1021:im-results/agent18-429-root-invariants:im-results/agent30-429-even16:im-results/agent1-429-root-rows:im-results/agent30-429-branch9-zero-feeder
        run: |
          set -euo pipefail
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-harmonic429/BB429Mod8.olean im-results/agent6-harmonic429/BB429Mod8.lean
          lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent39-429-1021/BB429RootEven8.olean im-results/agent39-429-1021/BB429RootEven8.lean
          lean -DmaxHeartbeats=5000000 -o im-results/agent6-harmonic429/BB429NoThree.olean im-results/agent6-harmonic429/BB429NoThree.lean
          lean -DmaxHeartbeats=10000000 -DmaxRecDepth=30000 -o im-results/agent18-429-root-invariants/BB429SevenStrong.olean im-results/agent18-429-root-invariants/BB429SevenStrong.lean
          lean -DmaxHeartbeats=50000000 -DmaxRecDepth=30000 -o im-results/agent6-harmonic429/BB429NewResidue.olean im-results/agent6-harmonic429/BB429NewResidue.lean
          lean -DmaxHeartbeats=20000000 -DmaxRecDepth=30000 im-results/agent30-429-branch9-zero-feeder/BB429Branch9SideRoot.lean
          if [ "${{ inputs.proof_target }}" = "branch9_center" ] || [ "${{ inputs.proof_target }}" = "branch9_center64" ]; then
            lean -DmaxHeartbeats=8000000 -o im-results/agent30-429-even16/BB429Even16.olean im-results/agent30-429-even16/BB429Even16.lean
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=30000 -o im-results/agent30-429-branch9-zero-feeder/BB429CenterLine.olean im-results/agent30-429-branch9-zero-feeder/BB429CenterLine.lean
          fi
          if [ "${{ inputs.proof_target }}" = "branch9_center64" ]; then
            lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent1-429-root-rows/BB429NewRootRows.olean im-results/agent1-429-root-rows/BB429NewRootRows.lean
            lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent1-429-root-rows/BB429RootOddRowsStrong.olean im-results/agent1-429-root-rows/BB429RootOddRowsStrong.lean
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=30000 im-results/agent30-429-branch9-zero-feeder/BB429CenterLineMod64.lean
          fi

          if [ "${{ inputs.proof_target }}" = "branch9_upper" ]; then
            lean -DmaxHeartbeats=8000000 -o im-results/agent30-429-even16/BB429Even16.olean im-results/agent30-429-even16/BB429Even16.lean
            lean -DmaxHeartbeats=20000000 -DmaxRecDepth=30000 im-results/agent30-429-branch9-zero-feeder/BB429UpperBoundary.lean
          fi
