name: Agent 30 #429 even16 and 11473/16384 original-source verification (manual)

on:
  workflow_dispatch:
    inputs:
      proof_target:
        description: Select an existing proof-family source check
        required: false
        default: even16
        type: choice
        options:
          - even16
          - branch9_side
          - branch9_side_strong
          - branch9_side_depth2
          - branch9_diagonal_certificate
          - periodic_classification
          - branch9_center
          - branch9_center64
          - branch9_upper
          - branch9_zero_two
          - branch9_odd_reset
          - branch9_zero_three

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile authentic #429 accelerator and inverse certificate
        if: ${{ inputs.proof_target == 'even16' }}
        shell: bash
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent6-harmonic429:im-results/agent39-429-1021:im-results/agent30-429-even16
        run: |
          set -euo pipefail
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-harmonic429/BB429Mod8.olean im-results/agent6-harmonic429/BB429Mod8.lean
          lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent39-429-1021/BB429RootEven8.olean im-results/agent39-429-1021/BB429RootEven8.lean
          lean -DmaxHeartbeats=5000000 -o im-results/agent6-harmonic429/BB429NoThree.olean im-results/agent6-harmonic429/BB429NoThree.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent30-429-even16/BB429Even16.olean im-results/agent30-429-even16/BB429Even16.lean
          lean -DmaxHeartbeats=50000000 -DmaxRecDepth=30000 -o im-results/agent6-harmonic429/BB429NewResidue.olean im-results/agent6-harmonic429/BB429NewResidue.lean
          lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent39-429-1021/BB429RootMod16.olean im-results/agent39-429-1021/BB429RootMod16.lean
          lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent39-429-1021/BB429RootMod32.olean im-results/agent39-429-1021/BB429RootMod32.lean
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=30000 -o im-results/agent30-429-even16/BB429InverseKernel16.olean im-results/agent30-429-even16/BB429InverseKernel16.lean
          lean -DmaxHeartbeats=20000000 -DmaxRecDepth=32768 -o im-results/agent30-429-even16/BB429No11473mod16384.olean im-results/agent30-429-even16/BB429No11473mod16384.lean

      - name: Compile branch-9 exceptional parent 25/32 theorem
        if: ${{ inputs.proof_target == 'branch9_side' || inputs.proof_target == 'branch9_side_strong' || inputs.proof_target == 'branch9_side_depth2' || inputs.proof_target == 'branch9_center' || inputs.proof_target == 'branch9_center64' || inputs.proof_target == 'branch9_upper' || inputs.proof_target == 'branch9_zero_two' || inputs.proof_target == 'branch9_odd_reset' || inputs.proof_target == 'branch9_zero_three' }}
        shell: bash
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent6-harmonic429:im-results/agent39-429-1021:im-results/agent18-429-root-invariants:im-results/agent30-429-even16:im-results/agent1-429-root-rows:im-results/agent30-429-branch9-zero-feeder
        run: |
          set -euo pipefail
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-harmonic429/BB429Mod8.olean im-results/agent6-harmonic429/BB429Mod8.lean
          lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent39-429-1021/BB429RootEven8.olean im-results/agent39-429-1021/BB429RootEven8.lean
          lean -DmaxHeartbeats=5000000 -o im-results/agent6-harmonic429/BB429NoThree.olean im-results/agent6-harmonic429/BB429NoThree.lean
          lean -DmaxHeartbeats=10000000 -DmaxRecDepth=30000 -o im-results/agent18-429-root-invariants/BB429SevenStrong.olean im-results/agent18-429-root-invariants/BB429SevenStrong.lean
          lean -DmaxHeartbeats=50000000 -DmaxRecDepth=30000 -o im-results/agent6-harmonic429/BB429NewResidue.olean im-results/agent6-harmonic429/BB429NewResidue.lean
          lean -DmaxHeartbeats=20000000 -DmaxRecDepth=30000 -o im-results/agent30-429-branch9-zero-feeder/BB429Branch9SideRoot.olean im-results/agent30-429-branch9-zero-feeder/BB429Branch9SideRoot.lean
          if [ "${{ inputs.proof_target }}" = "branch9_center" ] || [ "${{ inputs.proof_target }}" = "branch9_center64" ]; then
            lean -DmaxHeartbeats=8000000 -o im-results/agent30-429-even16/BB429Even16.olean im-results/agent30-429-even16/BB429Even16.lean
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=30000 -o im-results/agent30-429-branch9-zero-feeder/BB429CenterLine.olean im-results/agent30-429-branch9-zero-feeder/BB429CenterLine.lean
          fi
          if [ "${{ inputs.proof_target }}" = "branch9_center64" ]; then
            lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent1-429-root-rows/BB429NewRootRows.olean im-results/agent1-429-root-rows/BB429NewRootRows.lean
            lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent1-429-root-rows/BB429RootOddRowsStrong.olean im-results/agent1-429-root-rows/BB429RootOddRowsStrong.lean
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=30000 im-results/agent30-429-branch9-zero-feeder/BB429CenterLineMod64.lean
          fi

          if [ "${{ inputs.proof_target }}" = "branch9_upper" ] || [ "${{ inputs.proof_target }}" = "branch9_zero_two" ]; then
            lean -DmaxHeartbeats=8000000 -o im-results/agent30-429-even16/BB429Even16.olean im-results/agent30-429-even16/BB429Even16.lean
            lean -DmaxHeartbeats=20000000 -DmaxRecDepth=30000 -o im-results/agent30-429-branch9-zero-feeder/BB429UpperBoundary.olean im-results/agent30-429-branch9-zero-feeder/BB429UpperBoundary.lean
          fi

          if [ "${{ inputs.proof_target }}" = "branch9_zero_two" ]; then
            lean -DmaxHeartbeats=12000000 -DmaxRecDepth=30000 -o im-results/agent18-429-root-invariants/BB429OddResetGate.olean im-results/agent18-429-root-invariants/BB429OddResetGate.lean
            lean -DmaxHeartbeats=20000000 -DmaxRecDepth=30000 im-results/agent30-429-branch9-zero-feeder/BB429ZeroTwoStrengthened.lean
          fi

          if [ "${{ inputs.proof_target }}" = "branch9_odd_reset" ]; then
            lean -DmaxHeartbeats=8000000 -o im-results/agent30-429-even16/BB429Even16.olean im-results/agent30-429-even16/BB429Even16.lean
            lean -DmaxHeartbeats=12000000 -DmaxRecDepth=30000 -o im-results/agent18-429-root-invariants/BB429OddResetGate.olean im-results/agent18-429-root-invariants/BB429OddResetGate.lean
            lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent1-429-root-rows/BB429NewRootRows.olean im-results/agent1-429-root-rows/BB429NewRootRows.lean
            lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent1-429-root-rows/BB429RootOddRowsStrong.olean im-results/agent1-429-root-rows/BB429RootOddRowsStrong.lean
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=30000 im-results/agent30-429-branch9-zero-feeder/BB429OddResetImproved.lean
          fi

          if [ "${{ inputs.proof_target }}" = "branch9_zero_three" ]; then
            lean -DmaxHeartbeats=8000000 -o im-results/agent30-429-even16/BB429Even16.olean im-results/agent30-429-even16/BB429Even16.lean
            lean -DmaxHeartbeats=12000000 -DmaxRecDepth=30000 -o im-results/agent18-429-root-invariants/BB429OddResetGate.olean im-results/agent18-429-root-invariants/BB429OddResetGate.lean
            lean -DmaxHeartbeats=20000000 -DmaxRecDepth=30000 -o im-results/agent30-429-branch9-zero-feeder/BB429UpperBoundary.olean im-results/agent30-429-branch9-zero-feeder/BB429UpperBoundary.lean
            lean -DmaxHeartbeats=20000000 -DmaxRecDepth=30000 -o im-results/agent30-429-branch9-zero-feeder/BB429ZeroTwoStrengthened.olean im-results/agent30-429-branch9-zero-feeder/BB429ZeroTwoStrengthened.lean
            lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent1-429-root-rows/BB429NewRootRows.olean im-results/agent1-429-root-rows/BB429NewRootRows.lean
            lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent1-429-root-rows/BB429RootOddRowsStrong.olean im-results/agent1-429-root-rows/BB429RootOddRowsStrong.lean
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=30000 -o im-results/agent30-429-branch9-zero-feeder/BB429OddResetImproved.olean im-results/agent30-429-branch9-zero-feeder/BB429OddResetImproved.lean
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=30000 im-results/agent30-429-branch9-zero-feeder/BB429ZeroTwoThree.lean
          fi

          if [ "${{ inputs.proof_target }}" = "branch9_side_strong" ] || [ "${{ inputs.proof_target }}" = "branch9_side_depth2" ]; then
            lean -DmaxHeartbeats=8000000 -o im-results/agent30-429-even16/BB429Even16.olean im-results/agent30-429-even16/BB429Even16.lean
            lean -DmaxHeartbeats=25000000 -DmaxRecDepth=30000 -o im-results/agent30-429-branch9-zero-feeder/BB429Branch9SideStrong.olean im-results/agent30-429-branch9-zero-feeder/BB429Branch9SideStrong.lean
          fi

          if [ "${{ inputs.proof_target }}" = "branch9_side_depth2" ]; then
            lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent1-429-root-rows/BB429NewRootRows.olean im-results/agent1-429-root-rows/BB429NewRootRows.lean
            lean -DmaxHeartbeats=15000000 -DmaxRecDepth=16000 -o im-results/agent1-429-root-rows/BB429RootOddRowsStrong.olean im-results/agent1-429-root-rows/BB429RootOddRowsStrong.lean
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=30000 im-results/agent30-429-branch9-zero-feeder/BB429Branch9SideDepth2.lean
          fi

      - name: Check complete branch-9 diagonal certificate
        if: ${{ inputs.proof_target == 'branch9_diagonal_certificate' }}
        shell: bash
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent6-harmonic429:im-results/agent30-429-branch9-zero-feeder
        run: |
          set -euo pipefail
          d=im-results/agent30-429-branch9-zero-feeder
          {
            lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
            lean -DmaxHeartbeats=10000000 -o im-results/agent6-harmonic429/BB429Mod8.olean im-results/agent6-harmonic429/BB429Mod8.lean
            lean -DmaxHeartbeats=50000000 -DmaxRecDepth=30000 -o im-results/agent6-harmonic429/BB429NewResidue.olean im-results/agent6-harmonic429/BB429NewResidue.lean
            for m in BB429DyadicTransport BB429DyadicSource BB429Branch9Diagonal BB429Branch9Clip BB429Branch9Cover; do
              lean -o "$d/$m.olean" "$d/$m.lean"
            done
            lean "$d/BB429Branch9J9.lean"
            lean "$d/BB429Branch9J14.lean"
          } 2>&1 | tee /tmp/branch9-certificate.log
          if grep -q sorryAx /tmp/branch9-certificate.log; then exit 1; fi

      - name: Compile arbitrary-period escape-corridor classification
        if: ${{ inputs.proof_target == 'periodic_classification' }}
        shell: bash
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent30-429-periodic-classification
        run: |
          set -euo pipefail
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          cd im-results/agent30-429-periodic-classification
          export LEAN_PATH=../agent5-429-rank:.
          for m in BB429PeriodicHigh BB429PeriodicCycle BB429PeriodicDynamics BB429PeriodicClassification BB429PeriodicSource; do
            lean -DmaxHeartbeats=20000000 -DmaxRecDepth=30000 -o "$m.olean" "$m.lean"
          done
