name: Agent 30 genuine raw-table J fatal gate rays (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original physical-table dependencies, first-branch ladder and raw fatal rays
        shell: bash
        env:
          LEAN_PATH: im-results/agent1-429-j-first-branch:im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider:im-results/agent1-429-physical-frontier:im-results/agent32-429-primitive-cost:im-results/agent32-429-high3-ladder:im-results/agent5-429-rank:im-results/agent30-429-first-gate-rays:im-results/agent6-429-one-sided-excursion:im-results/agent32-429-raw-parent:im-results/agent32-429-high2-prefix:im-results/agent18-429-junc-canonical:im-results/agent1-429-w4-boundary:im-results/agent30-429-positive-safe
        run: |
          set -euo pipefail
          lean -o im-results/agent8-coverage-contract/Frontier.olean im-results/agent8-coverage-contract/Frontier.lean
          for m in RayClosed RayChecker RayEntry RayFinite RayTurnExample RayFiniteOracle FiniteHalting Symmetry; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          for m in RayMacro EntryMacroOracle EntryMacroLeft; do
            lean -o "im-results/agent6-fresh-glider/$m.olean" "im-results/agent6-fresh-glider/$m.lean"
          done
          lean -o im-results/agent44-drift-closure/DirectedDrift.olean im-results/agent44-drift-closure/DirectedDrift.lean
          for m in ZeroMaskOracle FiniteDecision; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          for m in FrontierAudit FrontierMass; do
            lean -o "im-results/agent4-coverage-smoke/$m.olean" "im-results/agent4-coverage-smoke/$m.lean"
          done
          for m in ZeroPathAudit ControlPathAudit ZeroRowAudit PhysicalTraceAudit FiniteLassoOracle LassoTraceAudit; do
            lean -o "im-results/agent32-zero-prefix-global/$m.olean" "im-results/agent32-zero-prefix-global/$m.lean"
          done
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent1-429-physical-frontier/BB429PhysicalFrontier.olean im-results/agent1-429-physical-frontier/BB429PhysicalFrontier.lean
          for m in BubbleExact BubblePrefix; do
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o "im-results/agent32-429-primitive-cost/$m.olean" "im-results/agent32-429-primitive-cost/$m.lean"
          done
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-primitive-cost/BCFuture.olean im-results/agent32-429-primitive-cost/BCFuture.lean
          for m in JPhysicalPrefix JF0Prefix; do
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o "im-results/agent32-429-primitive-cost/$m.olean" "im-results/agent32-429-primitive-cost/$m.lean"
          done
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent1-429-j-first-branch/JFirstBranch.olean im-results/agent1-429-j-first-branch/JFirstBranch.lean
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-high3-ladder/High3Ladder.olean im-results/agent32-429-high3-ladder/High3Ladder.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent30-429-first-gate-rays/FirstGateRays.olean im-results/agent30-429-first-gate-rays/FirstGateRays.lean
          lean -DmaxHeartbeats=30000000 -o im-results/agent30-429-first-gate-rays/FirstGateRaw.olean im-results/agent30-429-first-gate-rays/FirstGateRaw.lean | tee /tmp/agent30-raw-gate.log
          lean -DmaxHeartbeats=10000000 -o im-results/agent5-429-rank/BB429Burst.olean im-results/agent5-429-rank/BB429Burst.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent30-429-first-gate-rays/W5TwoBurst.olean im-results/agent30-429-first-gate-rays/W5TwoBurst.lean | tee -a /tmp/agent30-raw-gate.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=20000 -o im-results/agent30-429-first-gate-rays/W5TwoBurstRawBridge.olean im-results/agent30-429-first-gate-rays/W5TwoBurstRawBridge.lean | tee -a /tmp/agent30-raw-gate.log
          for m in BB429OddExcursion BB429SourceE1Return BB429SourceE1Delta BB429SourceRows; do
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o "im-results/agent6-429-one-sided-excursion/$m.olean" "im-results/agent6-429-one-sided-excursion/$m.lean"
          done
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent6-429-one-sided-excursion/BB429PhysicalBridge.olean im-results/agent6-429-one-sided-excursion/BB429PhysicalBridge.lean
          for m in BB429E1ShiftDelta BB429DeltaPhysicalBridge; do
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o "im-results/agent32-429-raw-parent/$m.olean" "im-results/agent32-429-raw-parent/$m.lean"
          done
          for m in BB429FinishScanEDelta BB429JuncHeadExcursion; do
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o "im-results/agent6-429-one-sided-excursion/$m.olean" "im-results/agent6-429-one-sided-excursion/$m.lean"
          done
          for m in High2Prefix High2PhysicalBridge High2Tail High2TailBase High2Return MidAposBoundary; do
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o "im-results/agent32-429-high2-prefix/$m.olean" "im-results/agent32-429-high2-prefix/$m.lean"
          done
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent18-429-junc-canonical/JuncCanonical.olean im-results/agent18-429-junc-canonical/JuncCanonical.lean
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 im-results/agent30-429-first-gate-rays/W5FatalMidA.lean | tee -a /tmp/agent30-raw-gate.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 im-results/agent30-429-first-gate-rays/W5TwoBurstT0.lean | tee -a /tmp/agent30-raw-gate.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/W4CZeroSafe.olean im-results/agent1-429-w4-boundary/W4CZeroSafe.lean | tee -a /tmp/agent30-raw-gate.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent30-429-positive-safe/PositiveSafe.olean im-results/agent30-429-positive-safe/PositiveSafe.lean | tee -a /tmp/agent30-raw-gate.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent30-429-positive-safe/ZeroRegularSafe.olean im-results/agent30-429-positive-safe/ZeroRegularSafe.lean | tee -a /tmp/agent30-raw-gate.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent30-429-positive-safe/ZeroTwoGate.olean im-results/agent30-429-positive-safe/ZeroTwoGate.lean | tee -a /tmp/agent30-raw-gate.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 im-results/agent30-429-positive-safe/PhysicalSafe.lean | tee -a /tmp/agent30-raw-gate.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/W4HeadMax.olean im-results/agent1-429-w4-boundary/W4HeadMax.lean | tee -a /tmp/agent30-raw-gate.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/W4JuncMax.olean im-results/agent1-429-w4-boundary/W4JuncMax.lean | tee -a /tmp/agent30-raw-gate.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 -o im-results/agent1-429-w4-boundary/W4HeadPrefix.olean im-results/agent1-429-w4-boundary/W4HeadPrefix.lean | tee -a /tmp/agent30-raw-gate.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=8192 im-results/agent30-429-positive-safe/ZeroTwoMax.lean | tee -a /tmp/agent30-raw-gate.log
          if grep -q sorryAx /tmp/agent30-raw-gate.log; then
            echo "ERROR: unexpected sorryAx"
            exit 1
          fi
