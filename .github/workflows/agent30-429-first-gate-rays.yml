name: Agent 30 right-five first-gate ray source proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check original source and parameter-uniform ray proof
        shell: bash
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent30-429-first-gate-rays
        run: |
          set -euo pipefail
          lean -DmaxHeartbeats=10000000 -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent30-429-first-gate-rays/FirstGateRays.olean im-results/agent30-429-first-gate-rays/FirstGateRays.lean | tee /tmp/agent30-gate-ray-audit.log
          lean -DmaxHeartbeats=10000000 -o im-results/agent5-429-rank/BB429Burst.olean im-results/agent5-429-rank/BB429Burst.lean
          lean -DmaxHeartbeats=10000000 im-results/agent30-429-first-gate-rays/W5FirstBurstComplete.lean | tee -a /tmp/agent30-gate-ray-audit.log
          lean -DmaxHeartbeats=10000000 -o im-results/agent30-429-first-gate-rays/W5TwoBurst.olean im-results/agent30-429-first-gate-rays/W5TwoBurst.lean | tee -a /tmp/agent30-gate-ray-audit.log
          lean -DmaxHeartbeats=10000000 -DmaxRecDepth=20000 im-results/agent30-429-first-gate-rays/W5TwoBurstUnique.lean | tee -a /tmp/agent30-gate-ray-audit.log
          if grep -q sorryAx /tmp/agent30-gate-ray-audit.log; then
            echo "ERROR: forbidden sorryAx"
            exit 1
          fi
