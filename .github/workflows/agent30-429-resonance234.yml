name: Agent 30 BB429 first nonzero resonance d234 (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact d234 resonance transfer
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent5-429-rank:im-results/agent6-harmonic429:im-results/agent30-429-coarse-exit"
          LOG=/tmp/agent30-r234.log
          : > "$LOG"
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429CoarseExit.olean im-results/agent30-429-coarse-exit/BB429CoarseExit.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent6-harmonic429/BB429LowReturnBand.olean im-results/agent6-harmonic429/BB429LowReturnBand.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429CoarseExitSource.olean im-results/agent30-429-coarse-exit/BB429CoarseExitSource.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429CoarseExitExtended.olean im-results/agent30-429-coarse-exit/BB429CoarseExitExtended.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429Resonance.olean im-results/agent30-429-coarse-exit/BB429Resonance.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429Resonance234.olean im-results/agent30-429-coarse-exit/BB429Resonance234.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429ResonanceSlope.olean im-results/agent30-429-coarse-exit/BB429ResonanceSlope.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429ResonanceEven.olean im-results/agent30-429-coarse-exit/BB429ResonanceEven.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429Resonance234Even.olean im-results/agent30-429-coarse-exit/BB429Resonance234Even.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent6-harmonic429/BB429LowBoundary.olean im-results/agent6-harmonic429/BB429LowBoundary.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429ResonanceError.olean im-results/agent30-429-coarse-exit/BB429ResonanceError.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429ResonanceErrorBand.olean im-results/agent30-429-coarse-exit/BB429ResonanceErrorBand.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429ResonanceMinimal.olean im-results/agent30-429-coarse-exit/BB429ResonanceMinimal.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429ResonanceTail.olean im-results/agent30-429-coarse-exit/BB429ResonanceTail.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429ResonanceShift.olean im-results/agent30-429-coarse-exit/BB429ResonanceShift.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429ResonanceFinite.olean im-results/agent30-429-coarse-exit/BB429ResonanceFinite.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429Resonance234Close.olean im-results/agent30-429-coarse-exit/BB429Resonance234Close.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429ResonancePhysical.olean im-results/agent30-429-coarse-exit/BB429ResonancePhysical.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429Resonance234Evacuation.olean im-results/agent30-429-coarse-exit/BB429Resonance234Evacuation.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429Resonance234Return.olean im-results/agent30-429-coarse-exit/BB429Resonance234Return.lean 2>&1 | tee -a "$LOG"
          lean -o im-results/agent30-429-coarse-exit/BB429Resonance234Complete.olean im-results/agent30-429-coarse-exit/BB429Resonance234Complete.lean 2>&1 | tee -a "$LOG"
          lean im-results/agent30-429-coarse-exit/BB429ResonancePhysical.lean 2>&1 | tee -a "$LOG"
          grep -F "'BB429.CoarseExit.d234_post' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.d234_second_nonresonant_mod9' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.Resonance.resonant_post_jSlope' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.return_from_exact_burst_even' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.d234_large_non8' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.d234_error_band_arith' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.d234_minimal_phase_error_band' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.phase_cycles_direct_return' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.d234_false_head_rescale' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.d234_short_resonance_only35' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.d234_m35' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.d234_resonant_endpoint_package' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.d234_endpoint_evacuation_data' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.d234_resonant_endpoint_evacuates' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.return_from_exact_burst_even_complete' depends on axioms:" "$LOG"
          grep -F "'BB429.CoarseExit.resonance_error_physical' depends on axioms:" "$LOG"
          if grep -q sorryAx "$LOG"; then
            echo "Unexpected sorryAx"; exit 1
          fi
