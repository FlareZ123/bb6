name: Agent 30 B curvature proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare exact repository sources
        run: |
          mkdir -p /tmp/agent30-b-curvature
          cp im-results/agent18-b-cycle/BReduction.lean /tmp/agent30-b-curvature/Agent18BReduction.lean
          cp im-results/agent18-b-cycle/BOneDim.lean /tmp/agent30-b-curvature/BOneDim.lean
          cp im-results/agent10-b-parity/Agent10BParity.lean /tmp/agent30-b-curvature/Agent10BParity.lean
          cp im-results/agent10-b-parity/Agent10Shift.lean /tmp/agent30-b-curvature/Agent10Shift.lean
          cp im-results/agent10-b-parity/Agent10BSource.lean /tmp/agent30-b-curvature/Agent10BSource.lean
          cp im-results/agent30-b-dyadic-curvature/BModularCurvature.lean /tmp/agent30-b-curvature/BModularCurvature.lean
          cp im-results/agent30-b-dyadic-curvature/BModularSource.lean /tmp/agent30-b-curvature/BModularSource.lean
      - name: Copy modulo seven proof
        run: cp im-results/agent10-b-parity/Agent10ModSeven.lean /tmp/agent30-b-curvature/Agent10ModSeven.lean
      - name: Copy quotient classification
        run: cp im-results/agent30-b-dyadic-curvature/BModularClassification.lean /tmp/agent30-b-curvature/BModularClassification.lean
      - name: Verify Lean availability
        run: lean --version
      - name: Compile BReduction
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o Agent18BReduction.olean Agent18BReduction.lean
      - name: Compile scalar source
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o BOneDim.olean BOneDim.lean
      - name: Compile published parity source
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o Agent10BParity.olean Agent10BParity.lean
      - name: Compile published dyadic shift
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o Agent10Shift.olean Agent10Shift.lean
      - name: Compile original scalar bridge
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o Agent10BSource.olean Agent10BSource.lean
      - name: Check existing modulo-seven theorem
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o Agent10ModSeven.olean Agent10ModSeven.lean
      - name: Compile all-iterate curvature
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o BModularCurvature.olean BModularCurvature.lean
      - name: Verify source-level all-iterate theorem
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o BModularSource.olean BModularSource.lean
