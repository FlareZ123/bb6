name: Agent 30 B curvature proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare exact repository sources
        run: |
          mkdir -p /tmp/agent30-b-curvature
          cp im-results/agent18-b-cycle/BReduction.lean /tmp/agent30-b-curvature/Agent18BReduction.lean
          cp im-results/agent18-b-cycle/BOneDim.lean /tmp/agent30-b-curvature/BOneDim.lean
          cp im-results/agent10-b-parity/Agent10BParity.lean /tmp/agent30-b-curvature/Agent10BParity.lean
          cp im-results/agent10-b-parity/Agent10Shift.lean /tmp/agent30-b-curvature/Agent10Shift.lean
          cp im-results/agent10-b-parity/Agent10BSource.lean /tmp/agent30-b-curvature/Agent10BSource.lean
          cp im-results/agent30-b-dyadic-curvature/BModularCurvature.lean /tmp/agent30-b-curvature/BModularCurvature.lean
          cp im-results/agent30-b-dyadic-curvature/BModularSource.lean /tmp/agent30-b-curvature/BModularSource.lean
      - name: Copy modulo seven proof
        run: cp im-results/agent10-b-parity/Agent10ModSeven.lean /tmp/agent30-b-curvature/Agent10ModSeven.lean
      - name: Copy quotient classification
        run: cp im-results/agent30-b-dyadic-curvature/BModularClassification.lean /tmp/agent30-b-curvature/BModularClassification.lean
      - name: Verify Lean availability
        run: lean --version
      - name: Compile BReduction
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o Agent18BReduction.olean Agent18BReduction.lean
      - name: Compile scalar source
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o BOneDim.olean BOneDim.lean
      - name: Compile published parity source
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o Agent10BParity.olean Agent10BParity.lean
      - name: Compile published dyadic shift
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o Agent10Shift.olean Agent10Shift.lean
      - name: Compile original scalar bridge
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o Agent10BSource.olean Agent10BSource.lean
      - name: Check existing modulo-seven theorem
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o Agent10ModSeven.olean Agent10ModSeven.lean
      - name: Compile all-iterate curvature
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o BModularCurvature.olean BModularCurvature.lean
      - name: Verify source-level all-iterate theorem
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o BModularSource.olean BModularSource.lean
      - name: Verify exact modular quotient classification
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean BModularClassification.lean
      - name: Kernel-verify generic parity-affine all-iterate obstruction
        run: lean im-results/agent30-b-dyadic-curvature/ParityAffineGeneral.lean
      - name: Copy generic specialization
        run: cp im-results/agent30-b-dyadic-curvature/BGenericBridge.lean /tmp/agent30-b-curvature/BGenericBridge.lean
      - name: Copy generic theorem module
        run: cp im-results/agent30-b-dyadic-curvature/ParityAffineGeneral.lean /tmp/agent30-b-curvature/ParityAffineGeneral.lean
      - name: Source-check generic Machine B quotient iff
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o ParityAffineGeneral.olean ParityAffineGeneral.lean
      - name: Kernel-check generic original B bridge
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: lean -o BGenericBridge.olean BGenericBridge.lean

      - name: Copy nonlinear cross-radix theorem
        run: |
          cp im-results/agent30-b-crossradix/Agent30CrossRadix.lean /tmp/agent30-b-curvature/Agent30CrossRadix.lean
          cp im-results/agent30-b-crossradix/Agent30CrossRadixSource.lean /tmp/agent30-b-curvature/Agent30CrossRadixSource.lean
      - name: Original-source kernel audit for cross-radix B theorem
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: |
          lean -o Agent30CrossRadix.olean Agent30CrossRadix.lean
          lean Agent30CrossRadixSource.lean

      - name: Copy additional cross-radix proofs
        run: |
          cp im-results/agent30-b-crossradix/Agent30CrossRadixCantor.lean /tmp/agent30-b-curvature/Agent30CrossRadixCantor.lean
          cp im-results/agent30-b-crossradix/Agent30CrossRadixWord.lean /tmp/agent30-b-curvature/Agent30CrossRadixWord.lean
          cp im-results/agent30-b-crossradix/Agent30CrossRadixParity.lean /tmp/agent30-b-curvature/Agent30CrossRadixParity.lean
      - name: Verify all cross-radix source companion lemmas
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: |
          lean Agent30CrossRadixCantor.lean
          lean Agent30CrossRadixWord.lean
          lean Agent30CrossRadixParity.lean

      - name: Copy all-input nonlinear quotient classification
        run: |
          cp im-results/agent30-b-crossradix/Agent30BFiniteFactor.lean /tmp/agent30-b-curvature/Agent30BFiniteFactor.lean
          cp im-results/agent30-b-crossradix/Agent30FiniteFactorSource.lean /tmp/agent30-b-curvature/Agent30FiniteFactorSource.lean
      - name: Kernel-check complete positive-iterate B finite quotient theorem
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: |
          lean -o Agent30CrossRadixWord.olean Agent30CrossRadixWord.lean
          lean -o Agent30CrossRadixParity.olean Agent30CrossRadixParity.lean
          lean -o Agent30BFiniteFactor.olean Agent30BFiniteFactor.lean
          lean -o Agent30CrossRadixSource.olean Agent30CrossRadixSource.lean
          lean Agent30FiniteFactorSource.lean

      - name: Compile generalized all-iterate modular factor classification
        working-directory: /tmp/agent30-b-curvature
        env:
          LEAN_PATH: .
        run: |
          python "${GITHUB_WORKSPACE}/im-results/agent30-b-generic-factors/unpack.py"
          cp "${GITHUB_WORKSPACE}/im-results/agent30-b-generic-factors/ModularQuotient.lean" .
          cp "${GITHUB_WORKSPACE}/im-results/agent30-b-generic-factors/BModularQuotient.lean" .
          lean -o ModularQuotient.olean ModularQuotient.lean
          lean BModularQuotient.lean
