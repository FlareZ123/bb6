name: Agent 30 new P1 n=50 modulo64 infinite exclusion (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original source definitions and new theorem
        run: |
          mkdir -p /tmp/agent30-fifty
          cd /tmp/agent30-fifty
          for name in GParity GInverse PosEvenForm ResetGate; do
            cp "$GITHUB_WORKSPACE/im-results/agent1-p1-map/$name.lean" "$name.lean"
          done
          for name in P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do
            cp "$GITHUB_WORKSPACE/im-results/agent50-p1-residue/$name.lean" "$name.lean"
          done
          python3 -c 'import base64,hashlib,lzma,pathlib,os; p=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"im-results/agent30-p1-fifty/Agent30P1Fifty.lean.xz.b64"; data=lzma.decompress(base64.b64decode(p.read_text())); assert hashlib.sha256(data).hexdigest()=="cde80e6c377278482926b4653e2779516dda4b3af7ff15b166619bcf7f71d525"; pathlib.Path("/tmp/agent30-fifty/Agent30P1Fifty.lean").write_bytes(data)'
          export LEAN_PATH="."
          for name in GParity GInverse PosEvenForm ResetGate P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do
            echo "COMPILING original source $name"
            lean -o "$name.olean" "$name.lean"
          done
          echo "CHECKING NEW INFINITE THEOREM AGAINST UNMODIFIED SOURCES"
          lean Agent30P1Fifty.lean
