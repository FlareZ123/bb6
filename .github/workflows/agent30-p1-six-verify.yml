name: Agent 30 P1 six-mod-sixteen infinite exclusion (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact original Agent 1 and Agent 50 dependencies, then Agent 30
        run: |
          mkdir -p /tmp/agent30-p1
          cd /tmp/agent30-p1
          for name in GParity GInverse PosEvenForm ResetGate; do
            cp "$GITHUB_WORKSPACE/im-results/agent1-p1-map/$name.lean" "$name.lean"
          done
          for name in P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do
            cp "$GITHUB_WORKSPACE/im-results/agent50-p1-residue/$name.lean" "$name.lean"
          done
          python3 -c 'import base64,hashlib,lzma,pathlib; p=pathlib.Path(__import__("os").environ["GITHUB_WORKSPACE"])/"im-results/agent30-p1-six/Agent30P1Six.lean.xz.b64"; data=lzma.decompress(base64.b64decode(p.read_text())); assert hashlib.sha256(data).hexdigest()=="31c2e374bb0040700e39e6d93650a30826be74d9105e25a955f9d9cf4ecd84d9"; pathlib.Path("/tmp/agent30-p1/Agent30P1Six.lean").write_bytes(data)' 
          export LEAN_PATH="."
          for name in GParity GInverse PosEvenForm ResetGate P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do
            echo "COMPILING $name"
            lean -o "$name.olean" "$name.lean"
          done
          echo "CHECKING NEW THEOREM AGAINST UNMODIFIED SOURCES"
          lean Agent30P1Six.lean
