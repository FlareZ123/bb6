name: Agent 30 P1 n=66 modulo64 infinite exclusion (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unmodified P1 modules and new infinite exclusion
        run: |
          mkdir -p /tmp/agent30-sixtysix
          cd /tmp/agent30-sixtysix
          for name in GParity GInverse PosEvenForm ResetGate; do
            cp "$GITHUB_WORKSPACE/im-results/agent1-p1-map/$name.lean" "$name.lean"
          done
          for name in P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do
            cp "$GITHUB_WORKSPACE/im-results/agent50-p1-residue/$name.lean" "$name.lean"
          done
          python3 -c 'import base64,hashlib,lzma,pathlib,os; p=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"im-results/agent30-p1-sixtysix/Agent30P1SixtySix.lean.xz.b64"; data=lzma.decompress(base64.b64decode(p.read_text())); assert hashlib.sha256(data).hexdigest()=="29e09441db8a4282d2bbbdb410dcb1b99dc3a99eb6d314537075bdf0f809b784"; pathlib.Path("/tmp/agent30-sixtysix/Agent30P1SixtySix.lean").write_bytes(data)'
          export LEAN_PATH="."
          for name in GParity GInverse PosEvenForm ResetGate P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do
            echo "COMPILING original source $name"
            lean -o "$name.olean" "$name.lean"
          done
          echo "CHECKING NEW INFINITE THEOREM AGAINST UNMODIFIED SOURCES"
          lean Agent30P1SixtySix.lean
