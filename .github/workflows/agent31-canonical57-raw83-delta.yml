name: Agent 31 Canonical58 to 57 Raw83 delta

on:
  workflow_dispatch:
    inputs:
      base_run_id:
        description: "Successful Canonical58 Raw113 delta run ID"
        type: string
        required: true
        default: "45882566313"

permissions:
  contents: read
  actions: read

concurrency:
  group: bb6-canonical57-raw83-${{ inputs.base_run_id }}
  cancel-in-progress: false

jobs:
  canonical57_raw83_delta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version

      - name: Integrate Raw83 into the accepted 58-residual roster
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN_ID: ${{ inputs.base_run_id }}
        run: |
          set -euo pipefail
          [[ "$BASE_RUN_ID" =~ ^[0-9]+$ ]]
          python im-results/agent31-shared-core/assemble_canonical58_raw83_graft.py \
            --work /tmp/a31-canonical57-raw83 --base-run-id "$BASE_RUN_ID"
          test -s /tmp/a31-canonical57-raw83/canonical57-raw83-graft.json
          test -s /tmp/a31-canonical57-raw83/Canonical57Raw83Graft.olean

      - name: Preserve the linked kernel closure and generated proof source
        uses: actions/upload-artifact@v4
        with:
          name: canonical57-raw83-graft-integrated
          path: /tmp/a31-canonical57-raw83/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
