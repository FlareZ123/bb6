      - uses: actions/checkout@v4
      - name: Reproduce and check the finite crosswalk
        run: |
          set -euo pipefail
          python3 -m py_compile im-results/agent31-canonical58-source-crosswalk/crosswalk.py im-results/agent32-raw59/compare_lean_roster.py
          python3 im-results/agent31-canonical58-source-crosswalk/crosswalk.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("im-results/agent31-canonical58-source-crosswalk/crosswalk.json").read_text())
          assert report["current_roster_count"] == 58
          assert report["crosswalk_row_count"] == 56
          assert report["unique_current_ancestor_match_count"] == 56
          assert report["unmatched_or_ambiguous_count"] == 0
          assert report["unique_leaf_completion_count_global"] == 1400
          manifest = report["current_roster_manifest"]
          assert len(manifest) == 58
          assert [x["raw_residual_index"] for x in manifest] == report["current_roster_raw_indices"]
          assert len({x["raw_residual_index"] for x in manifest}) == 58
          assert all(len(x["table_rle"].replace("_", "")) == 36 for x in manifest)
          assert 59 in report["current_roster_raw_indices"] and 118 not in report["current_roster_raw_indices"]
          assert [g["raw_residual_index"] for g in report["group_summaries"]] == [8, 9, 10, 13, 23, 134, 139, 140]
          assert all(g["distinct_leaf_completions_all_kinds"] == 25 * g["row_count"] for g in report["group_summaries"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical58-source-crosswalk
          path: |
            im-results/agent31-canonical58-source-crosswalk/crosswalk.json
          if-no-files-found: warn
          compression-level: 9
          retention-days: 30

