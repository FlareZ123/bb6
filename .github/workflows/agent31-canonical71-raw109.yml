  integrate-canonical68:
    name: Integrate the eight-parent Canonical68 closure and optional Raw112-to-67 consumer
    needs: [source-audit-canonical74]
    if: ${{ always() && (inputs.target == 'canonical68-integrated' || inputs.target == 'canonical65-integrated' || (inputs.target == 'canonical67-integrated' && needs.source-audit-canonical74.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Integrate the accepted parent closures
        env:
          GH_TOKEN: ${{ github.token }}
          RAW112_RUN_ID: ${{ inputs.raw112_run_id }}
        run: |
          set -euo pipefail
          extra=()
          if [[ "${{ inputs.target }}" == canonical65-integrated ]]; then extra+=(--three); fi
          if [[ "${{ inputs.target }}" == canonical67-integrated ]]; then
            [[ "$RAW112_RUN_ID" =~ ^[0-9]+$ ]]
            extra+=(--raw112-run-id "$RAW112_RUN_ID")
          fi
          python im-results/agent31-shared-core/assemble_canonical68.py --work /tmp/a31-integrated68 "${extra[@]}" 2>&1 | tee /tmp/a31-integrated68.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent31-canonical68-integration-audit
          path: |
            /tmp/a31-integrated68.log
            /tmp/a31-integrated68/canonical68.log
            /tmp/a31-integrated68/raw117.log
            /tmp/a31-integrated68/stable68-standalone.log
            /tmp/a31-integrated68/Canonical68StableBatch.olean
            /tmp/a31-integrated68/stable68.log
            /tmp/a31-integrated68/canonical68-integration.json
            /tmp/a31-integrated68/reachable-link-audit.json
            /tmp/a31-integrated68/linked/kernel-link-manifest.json
            /tmp/a31-integrated68/linked/Canonical68Integrated.olean
            /tmp/a31-integrated68/canonical65-three.log
            /tmp/a31-integrated68/canonical65-integrated.log
            /tmp/a31-integrated68/canonical65-integrated.json
            /tmp/a31-integrated68/linked/Canonical65Integrated.olean
            /tmp/a31-integrated68/Canonical74Raw109Raw123Graft.log
            /tmp/a31-integrated68/Canonical68E1ParentGraft.log
            /tmp/a31-integrated68/Canonical67E1ParentGraft.log
            /tmp/a31-integrated68/Canonical67Integrated.log
            /tmp/a31-integrated68/canonical67-integrated.json
            /tmp/a31-integrated68/metadata/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve the successful reached proof environment
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: agent31-integrated-quotient-proof-closure
          path: /tmp/a31-integrated68/linked/
