name: Agent 31 canonical74 Raw109+Raw123 independent graft

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Choose the stable canonical base for the independent parent graft"
        type: choice
        options:
          - canonical74
          - canonical70
          - canonical68-integrated
          - raw119-parent
        default: canonical74
        required: true
      canonical72_run_id:
        description: "Successful canonical72 run ID (required only for target=canonical70)"
        type: string
        required: false
        default: ""
      canonical76_run_id:
        description: "Accepted canonical76 run ID containing canonical73-raw110-raw112-roster-consumer-certified"
        type: string
        required: false
        default: "45647053824"

jobs:
  source-audit-canonical70:
    if: ${{ inputs.target == 'canonical70' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version

      - name: Download the accepted canonical72 source and object closure
        env:
          GH_TOKEN: ${{ github.token }}
          CANONICAL72_RUN_ID: ${{ inputs.canonical72_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANONICAL72_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$CANONICAL72_RUN_ID" --repo FlareZ123/bb6 \
            --name canonical72-raw121-raw110-raw112-roster-only-certified \
            --dir /tmp/a31-canonical72
          test -s /tmp/a31-canonical72/a31-canonical73-manifest.json
          test -d /tmp/a31-canonical72/a31-canonical73

      - name: Reconstruct BB6 coverage and Raw109 cut data
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent4-raw109/generate.py 0LD 0RE
          test -s im-results/agent4-raw109/Raw109B0LDData.lean
          test -s im-results/agent4-raw109/Raw109B0REData.lean

      - name: Compile and audit the 71- and 70-entry Raw109+Raw123 grafts
        run: |
          set -euo pipefail
          printf '%s\n' "${{ inputs.canonical72_run_id }}" > /tmp/a31-canonical72-run-id.txt
          python tools/lean_compile_closure.py \
            --workdir /tmp/a31-canonical70 \
            --jobs 8 \
            --precompiled-dir /tmp/a31-canonical72/a31-canonical73 \
            --precompiled-manifest /tmp/a31-canonical72/a31-canonical73-manifest.json \
            --theorem BB6.Agent31Canonical71Raw109.parent_present \
            --theorem BB6.Agent31Canonical71Raw109.parent_root \
            --theorem BB6.Agent31Canonical71Raw109.count \
            --theorem BB6.Agent31Canonical71Raw109.sound \
            --theorem BB6.Agent31Canonical71Raw109.exact_at_target \
            --theorem BB6.Agent31Canonical70Raw109Raw123.parent_present \
            --theorem BB6.Agent31Canonical70Raw109Raw123.parent_root \
            --theorem BB6.Agent31Canonical70Raw109Raw123.count \
            --theorem BB6.Agent31Canonical70Raw109Raw123.sound \
            --theorem BB6.Agent31Canonical70Raw109Raw123.exact_at_target \
            --provenance-input /tmp/a31-canonical72-run-id.txt \
            --provenance-input im-results/agent4-raw109/generate.py \
            --provenance-input im-results/agent4-raw109/Raw109Cut.lean \
            --provenance-input im-results/agent7-raw123/Raw123Base.lean \
            --provenance-input im-results/agent31-shared-core/Canonical71Raw109Graft.lean \
            --provenance-input im-results/agent31-shared-core/Canonical70Raw109Raw123Graft.lean \
            im-results/agent31-shared-core/Canonical71Raw109Graft.lean \
            im-results/agent31-shared-core/Canonical70Raw109Raw123Graft.lean \
            2>&1 | tee /tmp/a31-canonical70.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a31-canonical70.log; then
            echo "Forbidden axiom or native_decide dependency detected" >&2
            exit 1
          fi
          grep -E 'axioms|parent_present|parent_root|count|sound|exact_at_target' /tmp/a31-canonical70.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent31-canonical70-raw109-raw123-graft
          path: |
            /tmp/a31-canonical70
            /tmp/a31-canonical70.log
            /tmp/a31-canonical72-run-id.txt
          if-no-files-found: warn
          retention-days: 30

  source-audit-canonical74:
    name: Source-audit the canonical74 and canonical68 E1 parent consumers
    if: ${{ inputs.target == 'canonical74' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate the canonical76 run ID
        env:
          CANONICAL76_RUN_ID: ${{ inputs.canonical76_run_id }}
        run: |
          set -euo pipefail
          [[ "$CANONICAL76_RUN_ID" =~ ^[0-9]+$ ]]

      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version

      - name: Download the accepted canonical76 and canonical77 proof cores
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.canonical76_run_id }}
          name: canonical73-raw110-raw112-roster-consumer-certified
          path: /tmp/a31-accepted76
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45554648116
          name: canonical77-certified
          path: /tmp/a47-canonical77

      - name: Verify the canonical76 base and every reused canonical77 object
        env:
          CANONICAL76_RUN_ID: ${{ inputs.canonical76_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          base = pathlib.Path("/tmp/a31-accepted76/a31-shared")
          canonical77 = pathlib.Path("/tmp/a47-canonical77")
          summary = json.loads((base / "manifest/canonical76-base.json").read_text())
          manifest = json.loads((base / "manifest/canonical77-base-manifest.json").read_text())
          def sha(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          assert summary["theorem"] == "BB6.Agent31CanonicalTwoParentRosterOnly.exact_at_target"
          assert summary["residual_count"] == 76 and summary["weighted_bound"] == 7014
          assert summary["canonical77_artifact_id"] == 14997966221
          assert int(os.environ["CANONICAL76_RUN_ID"]) == 45647053824
          source = pathlib.Path("im-results/agent31-shared-core/CanonicalTwoParentRosterOnly.lean")
          assert sha(source) == summary["modules"]["CanonicalTwoParentRosterOnly"]["source_sha256"]
          assert sha(base / "CanonicalTwoParentRosterOnly.lean") == sha(source)
          assert sha(base / "CanonicalTwoParentRosterOnly.olean") == summary["modules"]["CanonicalTwoParentRosterOnly"]["olean_sha256"]
          base_obj = base / "CanonicalRaw114Accepted.olean"
          assert sha(base_obj) == summary["modules"]["CanonicalRaw114Accepted"]["shared_core_olean_sha256"]
          for name in ("CanonicalTwoParentGraft", "Raw114CompleteData"):
              canonical77_obj = canonical77 / (name + ".olean")
              assert sha(canonical77_obj) == summary["modules"][name]["olean_sha256"]
          accepted_raw114 = canonical77 / "CanonicalRaw114Accepted.olean"
          assert sha(accepted_raw114) == summary["modules"]["CanonicalRaw114Accepted"]["accepted_artifact_olean_sha256"]
          shared_manifest = json.loads((base / "manifest/raw107-shared-manifest.json").read_text())
          shared_by = {entry["module"]: entry for entry in shared_manifest["modules"]}
          canonical77_by = {entry["module"]: entry for entry in manifest["modules"]}
          reused = set(shared_manifest["precompiled_core"]["reused_modules"])
          assert reused, "the canonical76 shared-core manifest records no reused modules"
          identity_fields = ("source_sha256", "project_imports", "olean_sha256", "import_closure_sha256", "module_identity_sha256")
          for name in reused:
              assert name in shared_by and name in canonical77_by, f"{name}: missing from one accepted manifest"
              for field in identity_fields:
                  assert shared_by[name][field] == canonical77_by[name][field], f"{name}: {field} differs across accepted manifests"
              obj = canonical77 / canonical77_by[name]["olean_path"]
              assert obj.is_file() and sha(obj) == canonical77_by[name]["olean_sha256"], f"{name}: canonical77 object mismatch"
          for entry in manifest["modules"]:
              obj = canonical77 / entry["olean_path"]
              assert obj.is_file(), f"missing canonical77 object: {entry['module']}"
              assert sha(obj) == entry["olean_sha256"], f"canonical77 object mismatch: {entry['module']}"
          version = subprocess.check_output(["lean", "--version"], text=True).strip()
          assert version == manifest["lean_version"]
          compiler = pathlib.Path(subprocess.check_output(["lean", "--print-prefix"], text=True).strip()) / "bin/lean"
          assert sha(compiler) == manifest["lean_binary"]["sha256"]
          print("Verified the 76-residual theorem, canonical77 source/object closure, Lean version, and compiler binary.")
          PY

      - name: Reconstruct BB6 coverage and the Raw109 source interface
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent4-raw109/generate.py 0LD 0RE
          test -s im-results/agent4-raw109/Raw109B0LDData.lean
          test -s im-results/agent4-raw109/Raw109B0REData.lean

      - name: Compile the parent interfaces against the accepted canonical77 core
        run: |
          set -euo pipefail
          base=/tmp/a31-accepted76/a31-shared
          python tools/lean_compile_closure.py \
            im-results/agent4-raw109/Raw109Cut.lean \
            im-results/agent7-raw123/Raw123Base.lean \
            --workdir /tmp/a31-parent-interfaces \
            --manifest /tmp/a31-parent-interfaces-manifest.json \
            --label canonical76-raw109-raw123-parent-interfaces \
            --jobs 8 \
            --precompiled-dir /tmp/a47-canonical77 \
            --precompiled-manifest "$base/manifest/canonical77-base-manifest.json" \
            --theorem BB6.Agent4Raw109Cut.parent_dichotomy \
            --theorem BB6.Agent7Raw123.p123_root \
            --provenance-input im-results/agent4-raw109/generate.py \
            --provenance-input im-results/agent4-raw109/specs.json \
            --provenance-input im-results/agent4-raw109/Raw109Cut.lean \
            --provenance-input im-results/agent7-raw123/Raw123Base.lean \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent13-coverage/unpack.py \
            2>&1 | tee /tmp/a31-parent-interfaces.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a31-parent-interfaces.log; then
            echo "Forbidden axiom or native_decide in parent interfaces" >&2
            exit 1
          fi

      - name: Compile the independent 74-residual consumer and audit its axioms
        run: |
          set -euo pipefail
          mkdir -p /tmp/a31-canonical74
          base=/tmp/a31-accepted76/a31-shared
          export LEAN_PATH="/tmp/a31-parent-interfaces:$base:/tmp/a47-canonical77"
          lean -o /tmp/a31-canonical74/Canonical74Raw109Raw123Graft.olean \
            im-results/agent31-shared-core/Canonical74Raw109Raw123Graft.lean \
            2>&1 | tee /tmp/a31-canonical74.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a31-canonical74.log; then
            echo "Forbidden proof placeholder or native_decide in canonical74 consumer" >&2
            exit 1
          fi
          python3 - /tmp/a31-canonical74.log <<'PY'
          import json, pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          profiles = {}
          for name, axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", log):
              profiles[name] = {x.strip() for x in axioms.split(",") if x.strip()}
          for name in re.findall(r"'([^']+)' does not depend on any axioms", log):
              profiles[name] = set()
          required = (
              "BB6.Agent31Canonical74Raw109Raw123.p109_root",
              "BB6.Agent31Canonical74Raw109Raw123.p123_root",
              "BB6.Agent31Canonical74Raw109Raw123.p109_parent_count",
              "BB6.Agent31Canonical74Raw109Raw123.p123_parent_count",
              "BB6.Agent31Canonical74Raw109Raw123.count75",
              "BB6.Agent31Canonical74Raw109Raw123.count74",
              "BB6.Agent31Canonical74Raw109Raw123.base_sound_at_target",
              "BB6.Agent31Canonical74Raw109Raw123.raw109_sound",
              "BB6.Agent31Canonical74Raw109Raw123.sound",
              "BB6.Agent31Canonical74Raw109Raw123.exact_at_target",
          )
          for name in required:
              if name not in profiles:
                  raise SystemExit("missing axiom profile: " + name)
              bad = profiles[name] - allowed
              if bad:
                  raise SystemExit(f"{name}: unexpected axioms {sorted(bad)}")
              print(f"{name}: {sorted(profiles[name])}")
          pathlib.Path("/tmp/a31-canonical74-axioms.json").write_text(
              json.dumps({name: sorted(profiles[name]) for name in required}, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Compile and audit the conditional 68-residual E1 consumer
        env:
          CANONICAL76_RUN_ID: ${{ inputs.canonical76_run_id }}
        run: |
          set -euo pipefail
          base=/tmp/a31-accepted76/a31-shared
          export LEAN_PATH="/tmp/a31-canonical74:/tmp/a31-parent-interfaces:$base:/tmp/a47-canonical77"
          lean -o /tmp/a31-canonical74/Canonical68E1ParentGraft.olean \
            im-results/agent6-e1-parent-consumer/Canonical68E1ParentGraft.lean \
            2>&1 | tee /tmp/a31-canonical68.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a31-canonical68.log; then
            echo "Forbidden proof placeholder or native_decide in canonical68 consumer" >&2
            exit 1
          fi
          python3 - /tmp/a31-canonical68.log <<'PY'
          import json, pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          profiles = {}
          for name, axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", log):
              profiles[name] = {x.strip() for x in axioms.split(",") if x.strip()}
          for name in re.findall(r"'([^']+)' does not depend on any axioms", log):
              profiles[name] = set()
          required = (
              "BB6.Agent6Canonical68E1ParentGraft.p60_parent_count",
              "BB6.Agent6Canonical68E1ParentGraft.p110_parent_count",
              "BB6.Agent6Canonical68E1ParentGraft.p111_parent_count",
              "BB6.Agent6Canonical68E1ParentGraft.p117_parent_count",
              "BB6.Agent6Canonical68E1ParentGraft.p121_parent_count",
              "BB6.Agent6Canonical68E1ParentGraft.p125_parent_count",
              "BB6.Agent6Canonical68E1ParentGraft.count73",
              "BB6.Agent6Canonical68E1ParentGraft.count72",
              "BB6.Agent6Canonical68E1ParentGraft.count71",
              "BB6.Agent6Canonical68E1ParentGraft.count70",
              "BB6.Agent6Canonical68E1ParentGraft.count69",
              "BB6.Agent6Canonical68E1ParentGraft.count68",
              "BB6.Agent6Canonical68E1ParentGraft.sound68",
              "BB6.Agent6Canonical68E1ParentGraft.exact_at_target",
          )
          for name in required:
              if name not in profiles:
                  raise SystemExit("missing axiom profile: " + name)
              bad = profiles[name] - allowed
              if bad:
                  raise SystemExit(f"{name}: unexpected axioms {sorted(bad)}")
              print(f"{name}: {sorted(profiles[name])}")
          pathlib.Path("/tmp/a31-canonical68-axioms.json").write_text(
              json.dumps({name: sorted(profiles[name]) for name in required}, indent=2, sort_keys=True) + "\n"
          )
          PY
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def sha(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          source = pathlib.Path("im-results/agent6-e1-parent-consumer/Canonical68E1ParentGraft.lean")
          parent_manifest = pathlib.Path("/tmp/a31-parent-interfaces-manifest.json")
          summary = {
              "theorem": "BB6.Agent6Canonical68E1ParentGraft.exact_at_target",
              "status": "conditional 68-residual quotient theorem; eight E1 parent Covers and all 68 retained Covers remain explicit",
              "base_theorem": "BB6.Agent31CanonicalTwoParentRosterOnly.exact_at_target",
              "base_residual_count": 76,
              "after_raw109_raw123_residual_count": 74,
              "after_six_additional_e1_parent_cuts": 68,
              "common_weighted_bound_floor": 6766859,
              "canonical76_run_id": int(os.environ["CANONICAL76_RUN_ID"]),
              "canonical76_artifact_id": 15043876968,
              "canonical77_run_id": 45554648116,
              "canonical77_artifact_id": 14997966221,
              "parent_contracts": [
                  {"parent": "Raw60", "e1_move": "1RA", "bound": 1175},
                  {"parent": "Raw109", "e1_move": "1RB", "bound": 1703},
                  {"parent": "Raw110", "e1_move": "0LC", "bound": 6766859},
                  {"parent": "Raw111", "e1_move": "0RC", "bound": 7014},
                  {"parent": "Raw117", "e1_move": "1RD", "bound": 1291},
                  {"parent": "Raw121", "e1_move": "1RE", "bound": 4063},
                  {"parent": "Raw123", "e1_move": "0RF", "bound": 10000},
                  {"parent": "Raw125", "e1_move": "1RF", "bound": 1290}
              ],
              "source_revision": os.environ["GITHUB_SHA"],
              "lean_version": subprocess.check_output(["lean", "--version"], text=True).strip(),
              "source_sha256": sha(source),
              "olean_sha256": sha(pathlib.Path("/tmp/a31-canonical74/Canonical68E1ParentGraft.olean")),
              "canonical74_olean_sha256": sha(pathlib.Path("/tmp/a31-canonical74/Canonical74Raw109Raw123Graft.olean")),
              "parent_interface_manifest_sha256": sha(parent_manifest),
              "parent_interface_module_count": json.loads(parent_manifest.read_text())["module_count"],
              "axiom_profiles": json.loads(pathlib.Path("/tmp/a31-canonical68-axioms.json").read_text()),
              "axiom_allowlist": ["propext", "Classical.choice", "Quot.sound"]
          }
          pathlib.Path("/tmp/a31-canonical68-summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Record the 74-residual source and object manifest
        env:
          CANONICAL76_RUN_ID: ${{ inputs.canonical76_run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def sha(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          source = pathlib.Path("im-results/agent31-shared-core/Canonical74Raw109Raw123Graft.lean")
          parent_manifest = pathlib.Path("/tmp/a31-parent-interfaces-manifest.json")
          summary = {
              "theorem": "BB6.Agent31Canonical74Raw109Raw123.exact_at_target",
              "status": "conditional 74-residual quotient theorem; both accepted parent contracts and all 74 retained Covers remain explicit",
              "base_theorem": "BB6.Agent31CanonicalTwoParentRosterOnly.exact_at_target",
              "base_residual_count": 76,
              "after_raw109_residual_count": 75,
              "after_raw123_residual_count": 74,
              "weighted_bound": 6766859,
              "canonical76_run_id": int(os.environ["CANONICAL76_RUN_ID"]),
              "canonical76_artifact_id": 15043876968,
              "canonical77_run_id": 45554648116,
              "canonical77_artifact_id": 14997966221,
              "raw109_parent_theorem": "BB6.Agent4Raw109Closed.all_closed",
              "raw109_parent_bound": 1703,
              "raw109_source_acceptance_run_id": 45633764095,
              "raw109_parent_artifact_id": 15035255805,
              "raw123_parent_theorem": "BB6.Agent7Raw123.raw123_cover",
              "raw123_parent_bound": 10000,
              "raw123_source_acceptance_run_id": 45700813110,
              "raw123_parent_artifact_id": 15062767168,
              "source_revision": os.environ["GITHUB_SHA"],
              "lean_version": subprocess.check_output(["lean", "--version"], text=True).strip(),
              "lean_binary_sha256": sha(pathlib.Path(subprocess.check_output(["lean", "--print-prefix"], text=True).strip()) / "bin/lean"),
              "source_sha256": sha(source),
              "olean_sha256": sha(pathlib.Path("/tmp/a31-canonical74/Canonical74Raw109Raw123Graft.olean")),
              "parent_interface_manifest_sha256": sha(parent_manifest),
              "parent_interface_module_count": json.loads(parent_manifest.read_text())["module_count"],
              "axiom_profiles": json.loads(pathlib.Path("/tmp/a31-canonical74-axioms.json").read_text()),
              "axiom_allowlist": ["propext", "Classical.choice", "Quot.sound"],
          }
          pathlib.Path("/tmp/a31-canonical74-summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: agent31-canonical74-raw109-raw123-graft
          path: |
            /tmp/a31-canonical74
            /tmp/a31-canonical74.log
            /tmp/a31-canonical74-axioms.json
            /tmp/a31-canonical74-summary.json
            /tmp/a31-parent-interfaces
            /tmp/a31-parent-interfaces.log
            /tmp/a31-parent-interfaces-manifest.json
            im-results/agent31-shared-core/Canonical74Raw109Raw123Graft.lean
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: agent6-canonical68-e1-parent-consumer
          path: |
            /tmp/a31-canonical74/Canonical68E1ParentGraft.olean
            /tmp/a31-canonical74/Canonical74Raw109Raw123Graft.olean
            /tmp/a31-canonical68.log
            /tmp/a31-canonical68-axioms.json
            /tmp/a31-canonical68-summary.json
            im-results/agent6-e1-parent-consumer/Canonical68E1ParentGraft.lean
            im-results/agent6-e1-parent-consumer/README.md
          if-no-files-found: error
          retention-days: 14

  integrate-canonical68:
    if: ${{ inputs.target == 'canonical68-integrated' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Integrate all eight already source-audited parent proofs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python im-results/agent31-shared-core/assemble_canonical68.py --work /tmp/a31-integrated68 2>&1 | tee /tmp/a31-integrated68.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent31-canonical68-integration-audit
          path: |
            /tmp/a31-integrated68.log
            /tmp/a31-integrated68/canonical68.log
            /tmp/a31-integrated68/raw117.log
            /tmp/a31-integrated68/stable68-standalone.log
            /tmp/a31-integrated68/Canonical68StableBatch.olean
            /tmp/a31-integrated68/stable68.log
            /tmp/a31-integrated68/canonical68-integration.json
            /tmp/a31-integrated68/linked/kernel-link-manifest.json
            /tmp/a31-integrated68/linked/Canonical68Integrated.olean
          if-no-files-found: warn
          retention-days: 14

  raw119_prepare:
    if: inputs.target == 'raw119-parent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate once and check shared source dependencies
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent8-tnf-six/generate.py 119
          D=im-results/agent8-tnf-six
          W=/tmp/a8-raw119
          python tools/lean_compile_closure.py --workdir "$W" --jobs 4 "$D/raw119/Raw119Base.lean" | tee /tmp/a8-raw119-prepare.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a8-raw119-prepare.log; then exit 1; fi
          cp "$D"/raw119/Raw119Kid*.lean "$D/raw119/Raw119Data.lean" "$W/"
          cd "$W"
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD > SOURCE_COMMIT
          sha256sum Raw119*.lean > RAW119_SOURCE.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: raw119-common
          path: /tmp/a8-raw119
          if-no-files-found: error

  raw119_shards:
    if: inputs.target == 'raw119-parent'
    needs: raw119_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0, kids: '00 01 02 03' }
          - { shard: 1, kids: '04 05 06 07' }
          - { shard: 2, kids: '08 09 10 11' }
          - { shard: 3, kids: '12 13 14 15' }
          - { shard: 4, kids: '16 17 18 19' }
          - { shard: 5, kids: '20 21 22 23' }
    steps:
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw119-common
          path: /tmp/a8-raw119
      - name: Compile disjoint root children
        env:
          KIDS: ${{ matrix.kids }}
        run: |
          set -euo pipefail
          cd /tmp/a8-raw119
          export LEAN_PATH="$PWD"
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum -c RAW119_SOURCE.sha256
          mkdir -p /tmp/a8-raw119-kids
          for k in $KIDS; do printf 'Raw119Kid%s\n' "$k"; done |
            xargs -P 2 -I '{}' bash -c 'set -e; lean -o "$1.olean" "$1.lean"; cp "$1.olean" /tmp/a8-raw119-kids/' _ '{}' |
            tee /tmp/a8-raw119-shard.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a8-raw119-shard.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw119-kids-${{ matrix.shard }}
          path: /tmp/a8-raw119-kids
          if-no-files-found: error

  raw119_assemble:
    if: inputs.target == 'raw119-parent'
    needs: raw119_shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw119-common
          path: /tmp/a8-raw119
      - uses: actions/download-artifact@v4
        with:
          pattern: raw119-kids-*
          path: /tmp/a8-raw119
          merge-multiple: true
      - name: Assemble complete Raw119 exact weighted score
        run: |
          set -euo pipefail
          cd /tmp/a8-raw119
          export LEAN_PATH="$PWD"
          test "$(cat SOURCE_COMMIT)" = "$GITHUB_SHA"
          sha256sum -c RAW119_SOURCE.sha256
          for k in $(seq -w 0 23); do test -s "Raw119Kid$k.olean"; done
          {
            lean -o Raw119Data.olean Raw119Data.lean
          } 2>&1 | tee /tmp/a8-raw119-assemble.log
          python - <<'PY'
          import pathlib, re
          log = pathlib.Path('/tmp/a8-raw119-assemble.log').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          seen = set()
          for name, axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", log):
              actual = {a.strip() for a in axioms.split(',') if a.strip()}
              assert actual <= allowed, (name, actual - allowed)
              seen.add(name.rsplit('.', 1)[-1])
          for name in re.findall(r"'([^']+)' does not depend on any axioms", log):
              seen.add(name.rsplit('.', 1)[-1])
          assert {'c_root', 'all119', 'attained119', 'exact119'} <= seen, seen
          print('Exact raw119 parent axiom gate passed.')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: raw119-parent-certified
          path: |
            /tmp/a8-raw119
            /tmp/a8-raw119-assemble.log
          if-no-files-found: error
          retention-days: 14
