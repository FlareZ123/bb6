name: Agent 31 cryptid universal macros (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified source
        run: |
          python -m pip install filelock
          python im-results/agent31-cryptid-boundary/unpack.py
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Kernel check base theorem file
        run: |
          lean -o im-results/agent31-cryptid-boundary/Boundary.olean im-results/agent31-cryptid-boundary/Boundary.lean
      - name: Kernel check imported extension
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary
        run: |
          lean -o im-results/agent31-cryptid-boundary/BoundaryExtra.olean im-results/agent31-cryptid-boundary/BoundaryExtra.lean
      - name: Kernel check exceptional A1100 universal return
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary
        run: |
          lean im-results/agent31-cryptid-boundary/A1100.lean
      - name: Kernel check original-machine spatial frame and marker coupling
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary
        run: |
          lean im-results/agent31-cryptid-boundary/ProtectedMarker.lean
      - name: Kernel check composed authentic blank trace
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary
        run: |
          lean im-results/agent31-cryptid-boundary/BlankTrace.lean
