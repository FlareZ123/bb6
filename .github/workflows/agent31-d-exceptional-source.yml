name: Agent31 D exact two-return source theorem (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify original table, source macros and new physical composition
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent35-cryptid-code:im-results/agent32-cryptid-padding:im-results/agent31-d-exceptional:im-results/agent35-d-regular-certificate
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          lean -o im-results/agent31-cryptid-boundary/Boundary.olean im-results/agent31-cryptid-boundary/Boundary.lean
          lean -o im-results/agent32-cryptid-third/CryptidSix.olean im-results/agent32-cryptid-third/CryptidSix.lean
          lean -o im-results/agent32-cryptid-third/CryptidPairs.olean im-results/agent32-cryptid-third/CryptidPairs.lean
          lean -o im-results/agent32-cryptid-third/CryptidTriplePairs.olean im-results/agent32-cryptid-third/CryptidTriplePairs.lean
          lean -o im-results/agent35-cryptid-code/EDouble.olean im-results/agent35-cryptid-code/EDouble.lean
          lean -o im-results/agent32-cryptid-padding/Generic.olean im-results/agent32-cryptid-padding/Generic.lean
          lean -o im-results/agent32-cryptid-padding/BoundaryPadding.olean im-results/agent32-cryptid-padding/BoundaryPadding.lean
          lean im-results/agent31-d-exceptional/ESecondSource.lean
          lean -o im-results/agent31-d-exceptional/PacketSource.olean im-results/agent31-d-exceptional/PacketSource.lean
          lean -o im-results/agent31-d-exceptional/PacketPaths.olean im-results/agent31-d-exceptional/PacketPaths.lean
          lean im-results/agent31-d-exceptional/PacketNormalizer.lean
          lean im-results/agent31-d-exceptional/PacketRank.lean
          lean im-results/agent31-d-exceptional/EscapeLanguage.lean
          lean im-results/agent31-d-exceptional/EscapeWitness.lean
          python3 im-results/agent31-d-exceptional/check_second_escape.py
          python3 im-results/agent31-d-exceptional/check_root_L_escape.py
          python3 im-results/agent35-d-regular-certificate/restore_sources.py
          lean -o im-results/agent35-d-regular-certificate/DRegular.olean im-results/agent35-d-regular-certificate/DRegular.lean
          lean -o im-results/agent35-d-regular-certificate/DTransport.olean im-results/agent35-d-regular-certificate/DTransport.lean
          lean -o im-results/agent35-d-regular-certificate/DObservedTransport.olean im-results/agent35-d-regular-certificate/DObservedTransport.lean
          lean -o im-results/agent31-cryptid-boundary/BoundaryExtra.olean im-results/agent31-cryptid-boundary/BoundaryExtra.lean
          lean -o im-results/agent35-d-regular-certificate/DObsSourceCandidate.olean im-results/agent35-d-regular-certificate/DObsSourceCandidate.lean
          lean im-results/agent31-d-exceptional/DRegularBSource.lean
          lean im-results/agent31-d-exceptional/DRegularESource.lean
          lean -o im-results/agent32-cryptid-padding/PaddedApplications.olean im-results/agent32-cryptid-padding/PaddedApplications.lean
          lean im-results/agent31-d-exceptional/DRegularELow.lean

          lean im-results/agent31-d-exceptional/EQuickHalt.lean

          python3 im-results/agent31-d-exceptional/restore_pair_halt.py
          lean im-results/agent31-d-exceptional/EPairHalt.lean
