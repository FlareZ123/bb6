name: Agent31 universal D E marker sweep and abstract safety (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify unchanged original D table and E first-marker pump
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          lean -o im-results/agent31-cryptid-boundary/Boundary.olean im-results/agent31-cryptid-boundary/Boundary.lean
          lean im-results/agent31-d-exceptional/ESeamSource.lean
      - name: Independently close the finite-window overapproximation
        run: |
          python3 im-results/agent31-d-exceptional/abstract_e_seam.py 3 7
          python3 im-results/agent31-d-exceptional/abstract_e_seam.py 7 7
          g++ -std=c++17 -O2 -Wall -Wextra -Werror im-results/agent31-d-exceptional/check_e_seam.cpp -o /tmp/check_e_seam
          /tmp/check_e_seam
          python3 im-results/agent31-d-exceptional/check_cylinder_first_event.py
