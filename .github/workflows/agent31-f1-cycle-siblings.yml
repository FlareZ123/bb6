name: Raw139 F1 cycle-sibling source audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct shared coverage source
        run: python im-results/agent13-coverage/unpack.py
      - name: Compile eight exact F1 cycle siblings
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py \
            im-results/agent31-f1-cycle-siblings/ChampionF1CycleSiblings.lean \
            --source-root im-results/agent7-far \
            --source-root im-results/agent13-weighted-first-one \
            --source-root im-results/agent31-three-hole-tnf \
            --source-root im-results/agent10-tnf-multipump \
            --source-root im-results/agent50-tnf-pilot \
            --workdir /tmp/a31-f1-cycles --jobs 4 \
            --manifest /tmp/a31-f1-cycles/manifest.json | tee /tmp/a31-f1-cycles.log
          python - <<'PY'
          import pathlib,re
          log=pathlib.Path("/tmp/a31-f1-cycles.log").read_text()
          allowed={"propext","Classical.choice","Quot.sound"}
          names=(
            "BB6.Agent31F1CycleSiblings.nohalt_fromCodes",
            "BB6.Agent31F1CycleSiblings.all_completions_weighted0RA",
            "BB6.Agent31F1CycleSiblings.all_completions_weighted0LB",
            "BB6.Agent31F1CycleSiblings.all_completions_weighted1RB",
            "BB6.Agent31F1CycleSiblings.all_completions_weighted0LC",
            "BB6.Agent31F1CycleSiblings.all_completions_weighted1LC",
            "BB6.Agent31F1CycleSiblings.all_completions_weighted1RC",
            "BB6.Agent31F1CycleSiblings.all_completions_weighted0LE",
            "BB6.Agent31F1CycleSiblings.all_completions_weighted1LE",
          )
          for name in names:
            m=re.search(r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]",log,re.S)
            if not m:
              if "'"+name+"' does not depend on any axioms" in log:
                used=set()
              else:
                raise SystemExit("missing axiom audit: "+name)
            else:
              used={x.strip() for x in m.group(1).split(",") if x.strip()}
            if not used<=allowed:
              raise SystemExit(f"nonstandard axioms in {name}: {used-allowed}")
            print(name,sorted(used))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw139-f1-cycle-siblings
          path: |
            /tmp/a31-f1-cycles/manifest.json
            /tmp/a31-f1-cycles.log
