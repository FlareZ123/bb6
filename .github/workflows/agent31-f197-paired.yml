name: Agent31 F197 paired transducer Lean
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Proof family to verify'
        required: false
        type: choice
        options:
          - paired
          - at-terminal
          - at-family
          - at-general
          - at-monoid-growth
          - epoch-marker
          - self-embedding
        default: paired

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Check complementary AT terminal proof
        if: ${{ inputs.target == 'at-terminal' }}
        env:
          LEAN_PATH: im-results/agent31-f197-macro:im-results/agent2-f197-sweep
        run: |
          set -euo pipefail
          lean -o im-results/agent31-f197-macro/Macro.olean im-results/agent31-f197-macro/Macro.lean
          lean -o im-results/agent31-f197-macro/MacroExact.olean im-results/agent31-f197-macro/MacroExact.lean
          lean im-results/agent2-f197-sweep/ATTerminalCore.lean | tee /tmp/at-terminal.log
          ! grep -q sorryAx /tmp/at-terminal.log
      - name: Check complementary AT parametric cores
        if: ${{ inputs.target == 'at-family' || inputs.target == 'at-general' || inputs.target == 'at-monoid-growth' }}
        env:
          LEAN_PATH: im-results/agent31-f197-macro:im-results/agent2-f197-sweep
        run: |
          set -euo pipefail
          lean -o im-results/agent31-f197-macro/Macro.olean im-results/agent31-f197-macro/Macro.lean
          lean -o im-results/agent31-f197-macro/MacroExact.olean im-results/agent31-f197-macro/MacroExact.lean
          lean -o im-results/agent2-f197-sweep/ATPairedCore.olean im-results/agent2-f197-sweep/ATPairedCore.lean | tee /tmp/at-family.log
          lean -o im-results/agent2-f197-sweep/ATAlignedCore.olean im-results/agent2-f197-sweep/ATAlignedCore.lean | tee -a /tmp/at-family.log
          lean -o im-results/agent2-f197-sweep/ATPaired.olean im-results/agent2-f197-sweep/ATPaired.lean | tee -a /tmp/at-family.log
          lean -o im-results/agent2-f197-sweep/ATCostGrowth.olean im-results/agent2-f197-sweep/ATCostGrowth.lean | tee -a /tmp/at-family.log
          lean -o im-results/agent2-f197-sweep/ATCarryCore.olean im-results/agent2-f197-sweep/ATCarryCore.lean | tee -a /tmp/at-family.log
          lean -o im-results/agent2-f197-sweep/ATCarriedParser.olean im-results/agent2-f197-sweep/ATCarriedParser.lean | tee -a /tmp/at-family.log
          if [ "${{ inputs.target }}" = "at-general" ]; then
            lean im-results/agent2-f197-sweep/ATGeneralParser.lean | tee -a /tmp/at-family.log
          elif [ "${{ inputs.target }}" = "at-monoid-growth" ]; then
            lean -o im-results/agent2-f197-sweep/ATGeneralParser.olean im-results/agent2-f197-sweep/ATGeneralParser.lean | tee -a /tmp/at-family.log
            lean -o im-results/agent2-f197-sweep/ATFreeMonoidCore.olean im-results/agent2-f197-sweep/ATFreeMonoidCore.lean | tee -a /tmp/at-family.log
            lean -o im-results/agent2-f197-sweep/ATFreeMonoid.olean im-results/agent2-f197-sweep/ATFreeMonoid.lean | tee -a /tmp/at-family.log
            lean im-results/agent2-f197-sweep/ATFreeMonoidGrowth.lean | tee -a /tmp/at-family.log
          else
            echo "AT paired and carry cores checked; all proof modules above were kernel accepted."
          fi
          ! grep -q sorryAx /tmp/at-family.log
      - name: Check paired reset transducer
        if: ${{ inputs.target == 'paired' || inputs.target == '' }}
        env:
          LEAN_PATH: im-results/agent31-f197-macro
        run: |
          set -euo pipefail
          lean -o im-results/agent31-f197-macro/Macro.olean im-results/agent31-f197-macro/Macro.lean
          lean -o im-results/agent31-f197-macro/MacroExact.olean im-results/agent31-f197-macro/MacroExact.lean | tee /tmp/paired.log
          lean -o im-results/agent31-f197-macro/ResetTransport.olean im-results/agent31-f197-macro/ResetTransport.lean | tee -a /tmp/paired.log
          lean -o im-results/agent31-f197-macro/PairedScanCore.olean im-results/agent31-f197-macro/PairedScanCore.lean | tee -a /tmp/paired.log
          lean -o im-results/agent31-f197-macro/PairedTerminalCore.olean im-results/agent31-f197-macro/PairedTerminalCore.lean | tee -a /tmp/paired.log
          lean -o im-results/agent31-f197-macro/PairedDecoderCore.olean im-results/agent31-f197-macro/PairedDecoderCore.lean | tee -a /tmp/paired.log
          lean -o im-results/agent31-f197-macro/PairedScan.olean im-results/agent31-f197-macro/PairedScan.lean | tee -a /tmp/paired.log
          lean im-results/agent31-f197-macro/PairedReset.lean | tee -a /tmp/paired.log
          ! grep -q sorryAx /tmp/paired.log

      - name: Check marker and parity epoch certificates
        if: ${{ inputs.target == 'epoch-marker' }}
        env:
          LEAN_PATH: im-results/agent31-f197-macro:im-results/agent2-f197-sweep
        run: |
          set -euo pipefail
          d=im-results/agent31-f197-macro
          e=im-results/agent2-f197-sweep
          lean -o "$d/Macro.olean" "$d/Macro.lean" | tee /tmp/epoch-marker.log
          for module in PrefixCheck EpochMarker EpochMarkerExit; do
            lean -o "$e/$module.olean" "$e/$module.lean" | tee -a /tmp/epoch-marker.log
          done
          for module in JCarry MixedCarry PrefixP CycleCert EpochCycle; do
            lean -o "$d/$module.olean" "$d/$module.lean" | tee -a /tmp/epoch-marker.log
          done
          lean "$e/EpochOdd.lean" | tee -a /tmp/epoch-marker.log
          ! grep -q sorryAx /tmp/epoch-marker.log

      - name: Check F197 self-embedding from generated finite certificates
        if: ${{ inputs.target == 'self-embedding' }}
        shell: bash
        run: |
          set -euo pipefail
          d="$PWD/im-results/agent31-f197-macro"
          e="$PWD/im-results/agent2-f197-sweep"
          b="$RUNNER_TEMP/f197-kernel"
          mkdir -p "$b"
          python3 "$e/generate_lean_trace.py" "$b"
          cp "$d/Macro.lean" "$b/"
          for m in PrefixCheck EpochMarker EpochMarkerExit EpochEntrance EpochMarkerBulk CounterCore SelfBase OrdinaryCore OrdinaryBulk TraceLogic; do
            cp "$e/$m.lean" "$b/"
          done
          cd "$b"
          export LEAN_PATH=.
          for m in Macro PrefixCheck EpochMarker EpochMarkerExit EpochEntrance EpochMarkerBulk CounterCore SelfBase OrdinaryCore OrdinaryData OrdinaryBulk TraceLogic TraceStates; do
            lean -j 1 -o "$m.olean" "$m.lean" | tee -a "$RUNNER_TEMP/f197-kernel.log"
          done
          export RLOG="$RUNNER_TEMP/f197-kernel.log"
          compile() {
            local s="$1"
            lean -j 1 -o "${s%.lean}.olean" "$s" 2>&1 | tee -a "$RLOG"
          }
          export -f compile
          printf '%s\n' OpBank*.lean | xargs -P 2 -n 1 bash -eo pipefail -c 'compile "$0"'
          printf '%s\n' SelfPre*.lean SelfPost*.lean | xargs -P 2 -n 1 bash -eo pipefail -c 'compile "$0"'
          lean -j 1 -o SelfTheorem.olean SelfTheorem.lean | tee -a "$RLOG"
          ! grep -q sorryAx "$RLOG"
          python3 "$e/verify_nonhalt.py"
