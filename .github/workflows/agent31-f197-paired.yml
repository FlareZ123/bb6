name: Agent31 F197 paired transducer Lean
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Proof family to verify'
        required: false
        type: choice
        options:
          - paired
          - at-terminal
          - at-family
          - at-general
          - at-monoid-growth
          - epoch-marker
          - self-embedding
          - original-cylinder
          - computer-certificate
          - root-scout
          - root-generate
          - self-scout
          - blank-root
          - blank-root-parallel
          - cover-bridge
        default: paired

jobs:
  kernel-check:
    if: ${{ inputs.target != 'blank-root-parallel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact standalone F197 certificate
        if: ${{ inputs.target == 'computer-certificate' }}
        run: python3 im-results/agent2-f197-sweep/verify_nonhalt.py
      - name: Install pinned Lean 4.36.0-rc2
        if: ${{ inputs.target != 'computer-certificate' && inputs.target != 'root-scout' && inputs.target != 'root-generate' && inputs.target != 'self-scout' }}
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Check complementary AT terminal proof
        if: ${{ inputs.target == 'at-terminal' }}
        env:
          LEAN_PATH: im-results/agent31-f197-macro:im-results/agent2-f197-sweep
        run: |
          set -euo pipefail
          lean -o im-results/agent31-f197-macro/Macro.olean im-results/agent31-f197-macro/Macro.lean
          lean -o im-results/agent31-f197-macro/MacroExact.olean im-results/agent31-f197-macro/MacroExact.lean
          lean im-results/agent2-f197-sweep/ATTerminalCore.lean | tee /tmp/at-terminal.log
          ! grep -q sorryAx /tmp/at-terminal.log
      - name: Check complementary AT parametric cores
        if: ${{ inputs.target == 'at-family' || inputs.target == 'at-general' || inputs.target == 'at-monoid-growth' }}
        env:
          LEAN_PATH: im-results/agent31-f197-macro:im-results/agent2-f197-sweep
        run: |
          set -euo pipefail
          lean -o im-results/agent31-f197-macro/Macro.olean im-results/agent31-f197-macro/Macro.lean
          lean -o im-results/agent31-f197-macro/MacroExact.olean im-results/agent31-f197-macro/MacroExact.lean
          lean -o im-results/agent2-f197-sweep/ATPairedCore.olean im-results/agent2-f197-sweep/ATPairedCore.lean | tee /tmp/at-family.log
          lean -o im-results/agent2-f197-sweep/ATAlignedCore.olean im-results/agent2-f197-sweep/ATAlignedCore.lean | tee -a /tmp/at-family.log
          lean -o im-results/agent2-f197-sweep/ATPaired.olean im-results/agent2-f197-sweep/ATPaired.lean | tee -a /tmp/at-family.log
          lean -o im-results/agent2-f197-sweep/ATCostGrowth.olean im-results/agent2-f197-sweep/ATCostGrowth.lean | tee -a /tmp/at-family.log
          lean -o im-results/agent2-f197-sweep/ATCarryCore.olean im-results/agent2-f197-sweep/ATCarryCore.lean | tee -a /tmp/at-family.log
          lean -o im-results/agent2-f197-sweep/ATCarriedParser.olean im-results/agent2-f197-sweep/ATCarriedParser.lean | tee -a /tmp/at-family.log
          if [ "${{ inputs.target }}" = "at-general" ]; then
            lean im-results/agent2-f197-sweep/ATGeneralParser.lean | tee -a /tmp/at-family.log
          elif [ "${{ inputs.target }}" = "at-monoid-growth" ]; then
            lean -o im-results/agent2-f197-sweep/ATGeneralParser.olean im-results/agent2-f197-sweep/ATGeneralParser.lean | tee -a /tmp/at-family.log
            lean -o im-results/agent2-f197-sweep/ATFreeMonoidCore.olean im-results/agent2-f197-sweep/ATFreeMonoidCore.lean | tee -a /tmp/at-family.log
            lean -o im-results/agent2-f197-sweep/ATFreeMonoid.olean im-results/agent2-f197-sweep/ATFreeMonoid.lean | tee -a /tmp/at-family.log
            lean im-results/agent2-f197-sweep/ATFreeMonoidGrowth.lean | tee -a /tmp/at-family.log
          else
            echo "AT paired and carry cores checked; all proof modules above were kernel accepted."
          fi
          ! grep -q sorryAx /tmp/at-family.log
      - name: Check paired reset transducer
        if: ${{ inputs.target == 'paired' || inputs.target == '' }}
        env:
          LEAN_PATH: im-results/agent31-f197-macro
        run: |
          set -euo pipefail
          lean -o im-results/agent31-f197-macro/Macro.olean im-results/agent31-f197-macro/Macro.lean
          lean -o im-results/agent31-f197-macro/MacroExact.olean im-results/agent31-f197-macro/MacroExact.lean | tee /tmp/paired.log
          lean -o im-results/agent31-f197-macro/ResetTransport.olean im-results/agent31-f197-macro/ResetTransport.lean | tee -a /tmp/paired.log
          lean -o im-results/agent31-f197-macro/PairedScanCore.olean im-results/agent31-f197-macro/PairedScanCore.lean | tee -a /tmp/paired.log
          lean -o im-results/agent31-f197-macro/PairedTerminalCore.olean im-results/agent31-f197-macro/PairedTerminalCore.lean | tee -a /tmp/paired.log
          lean -o im-results/agent31-f197-macro/PairedDecoderCore.olean im-results/agent31-f197-macro/PairedDecoderCore.lean | tee -a /tmp/paired.log
          lean -o im-results/agent31-f197-macro/PairedScan.olean im-results/agent31-f197-macro/PairedScan.lean | tee -a /tmp/paired.log
          lean im-results/agent31-f197-macro/PairedReset.lean | tee -a /tmp/paired.log
          ! grep -q sorryAx /tmp/paired.log

      - name: Check marker and parity epoch certificates
        if: ${{ inputs.target == 'epoch-marker' }}
        env:
          LEAN_PATH: im-results/agent31-f197-macro:im-results/agent2-f197-sweep
        run: |
          set -euo pipefail
          d=im-results/agent31-f197-macro
          e=im-results/agent2-f197-sweep
          lean -o "$d/Macro.olean" "$d/Macro.lean" | tee /tmp/epoch-marker.log
          for module in PrefixCheck EpochMarker EpochMarkerExit; do
            lean -o "$e/$module.olean" "$e/$module.lean" | tee -a /tmp/epoch-marker.log
          done
          for module in JCarry MixedCarry PrefixP CycleCert EpochCycle; do
            lean -o "$d/$module.olean" "$d/$module.lean" | tee -a /tmp/epoch-marker.log
          done
          lean "$e/EpochOdd.lean" | tee -a /tmp/epoch-marker.log
          ! grep -q sorryAx /tmp/epoch-marker.log

      - name: Check F197 self-embedding from generated finite certificates
        if: ${{ inputs.target == 'self-embedding' || inputs.target == 'blank-root' || inputs.target == 'original-cylinder' }}
        shell: bash
        run: |
          set -euo pipefail
          d="$PWD/im-results/agent31-f197-macro"
          e="$PWD/im-results/agent2-f197-sweep"
          b="$RUNNER_TEMP/f197-kernel"
          mkdir -p "$b"
          python3 "$e/generate_lean_trace.py" "$b"
          python3 "$e/generate_packed_banks.py" "$b"
          if [ "${{ inputs.target }}" = "blank-root" ]; then
            python3 "$e/generate_root_trace.py" "$b"
          fi
          cp "$d/Macro.lean" "$b/"
          for m in PrefixCheck EpochMarker EpochMarkerExit EpochEntrance EpochMarkerBulk CounterCore SelfBase OrdinaryCore OrdinaryBulk TraceLogic PackedCheck SeedCore RootCore; do
            cp "$e/$m.lean" "$b/"
          done
          if [ "${{ inputs.target }}" = "original-cylinder" ]; then
            cp "$PWD/im-results/agent8-coverage-contract/Frontier.lean" "$b/"
            cp "$d/CoverBridge.lean" "$b/"
            cp "$e/F197CylinderCover.lean" "$b/"
          fi
          cd "$b"
          export LEAN_PATH=.
          for m in Macro PrefixCheck EpochMarker EpochMarkerExit EpochEntrance EpochMarkerBulk CounterCore SelfBase OrdinaryCore OrdinaryData OrdinaryBulk TraceLogic PackedCheck SeedCore RootCore TraceStates; do
            lean -j 1 -o "$m.olean" "$m.lean" | tee -a "$RUNNER_TEMP/f197-kernel.log"
          done
          export RLOG="$RUNNER_TEMP/f197-kernel.log"
          compile() {
            local s="$1"
            lean -j 1 -o "${s%.lean}.olean" "$s" 2>&1 | tee -a "$RLOG"
          }
          export -f compile
          printf '%s\n' OpBank*.lean | xargs -P 2 -n 1 bash -eo pipefail -c 'compile "$0"'
          printf '%s\n' SelfPre*.lean SelfPost*.lean | xargs -P 2 -n 1 bash -eo pipefail -c 'compile "$0"'
          lean -j 1 -o SelfTheorem.olean SelfTheorem.lean | tee -a "$RLOG"
          if [ "${{ inputs.target }}" = "original-cylinder" ]; then
            compile Frontier.lean
            compile CoverBridge.lean
            compile F197CylinderCover.lean
          fi
          if [ "${{ inputs.target }}" = "blank-root" ]; then
            compile RootStates.lean
            printf '%s\n' RootBank*.lean | xargs -P 2 -n 1 bash -eo pipefail -c 'compile "$0"'
            printf '%s\n' RootPart*.lean | xargs -P 2 -n 1 bash -eo pipefail -c 'compile "$0"'
            compile RootTheorem.lean
          fi
          ! grep -q sorryAx "$RLOG"
          python3 "$e/verify_nonhalt.py"

      - name: Test smaller guarded F197 positive cylinders
        if: ${{ inputs.target == 'self-scout' }}
        run: python3 im-results/agent2-f197-sweep/self_cylinder_scout.py

      - name: Certify F197 exact partial-table weighted Cover bridge
        if: ${{ inputs.target == 'cover-bridge' }}
        env:
          LEAN_PATH: im-results/agent31-f197-macro:im-results/agent8-coverage-contract:im-results/agent42-coverage-normal:im-results/agent4-coverage-smoke:im-results/agent13-weighted-first-one
        run: |
          set -euo pipefail
          d=im-results/agent31-f197-macro
          f=im-results/agent8-coverage-contract
          t=im-results/agent42-coverage-normal
          g=im-results/agent4-coverage-smoke
          e=im-results/agent13-weighted-first-one
          lean -o "$f/Frontier.olean" "$f/Frontier.lean" | tee /tmp/f197-bridge.log
          lean -o "$f/Symmetry.olean" "$f/Symmetry.lean" | tee -a /tmp/f197-bridge.log
          lean -o "$f/RootShift.olean" "$f/RootShift.lean" | tee -a /tmp/f197-bridge.log
          lean -o "$t/FirstStep.olean" "$t/FirstStep.lean" | tee -a /tmp/f197-bridge.log
          lean -o "$g/WriteOneDrift.olean" "$g/WriteOneDrift.lean" | tee -a /tmp/f197-bridge.log
          lean -o "$e/BlankDelayKernel.olean" "$e/BlankDelayKernel.lean" | tee -a /tmp/f197-bridge.log
          lean -o "$e/BlankDelaySource.olean" "$e/BlankDelaySource.lean" | tee -a /tmp/f197-bridge.log
          lean -o "$e/SparseBlankDelay.olean" "$e/SparseBlankDelay.lean" | tee -a /tmp/f197-bridge.log
          lean -o "$d/Macro.olean" "$d/Macro.lean" | tee -a /tmp/f197-bridge.log
          lean -o "$d/CoverBridge.olean" "$d/CoverBridge.lean" | tee -a /tmp/f197-bridge.log
          lean "$d/F197WeightedLeaf.lean" | tee -a /tmp/f197-bridge.log
          ! grep -q sorryAx /tmp/f197-bridge.log

      - name: Find earliest stronger F197 root-cylinder entrance
        if: ${{ inputs.target == 'root-scout' }}
        run: python3 im-results/agent2-f197-sweep/root_scout.py

      - name: Validate optimized F197 root Lean source generator
        if: ${{ inputs.target == 'root-generate' }}
        shell: bash
        run: |
          set -euo pipefail
          e=im-results/agent2-f197-sweep
          b="$RUNNER_TEMP/f197-root-generator"
          mkdir -p "$b"
          python3 "$e/generate_lean_trace.py" "$b"
          python3 "$e/generate_packed_banks.py" "$b"
          python3 "$e/generate_root_trace.py" "$b"
          echo "Source modules:"
          find "$b" -maxdepth 1 -name 'Root*.lean' | wc -l
          echo "Independent bank modules:"
          find "$b" -maxdepth 1 -name 'RootBank*.lean' | wc -l
          echo "Root parts:"
          find "$b" -maxdepth 1 -name 'RootPart*.lean' | wc -l
          test -s "$b/RootTheorem.lean"

  # RootPartN modules are independent, so this replay does not waste 120
  # serial runner-minutes re-proving each of the 208 chain sections.
  f197-par-base:
    if: ${{ inputs.target == 'blank-root-parallel' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate and kernel-certify shared self/root rule banks
        run: bash im-results/agent2-f197-sweep/parallel_root.sh base
      - uses: actions/upload-artifact@v4
        with:
          name: f197-par-base
          path: ${{ runner.temp }}/f197-par-base.tar.gz
          retention-days: 7

  f197-par-parts:
    if: ${{ inputs.target == 'blank-root-parallel' }}
    needs: [f197-par-base]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: f197-par-base
          path: ${{ runner.temp }}/f197-par-download
      - name: Certify independent root path shard
        run: bash im-results/agent2-f197-sweep/parallel_root.sh shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: f197-par-part-${{ matrix.shard }}
          path: ${{ runner.temp }}/f197-par-part-${{ matrix.shard }}.tar.gz
          retention-days: 7

  f197-par-complete:
    if: ${{ inputs.target == 'blank-root-parallel' }}
    needs: [f197-par-parts]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: f197-par-*
          path: ${{ runner.temp }}/f197-par-download
          merge-multiple: true
      - name: Certify full blank-root theorem and original-source weighted Cover
        run: bash im-results/agent2-f197-sweep/parallel_root.sh final
      - uses: actions/upload-artifact@v4
        with:
          name: f197-par-complete
          path: |
            ${{ runner.temp }}/f197-par-complete.tar.gz
            ${{ runner.temp }}/f197-root-axioms.log
          retention-days: 7
