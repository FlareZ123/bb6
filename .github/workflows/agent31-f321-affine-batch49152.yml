name: Agent 31 F321 49152 exact affine ray batch (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbolic-affine-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Build authentic F321 source-counter relations and predecessor lemmas
        run: |
          set -euo pipefail
          e=im-results/agent31-f321-bulk
          lean -o "$e/DensityOneCore.olean" "$e/DensityOneCore.lean"
          LEAN_PATH="$e" lean -o "$e/DensityOneExtension.olean" "$e/DensityOneExtension.lean"
          lean -o "$e/SourceCounter.olean" "$e/SourceCounter.lean"
          lean -o "$e/Barrier.olean" "$e/Barrier.lean"
          LEAN_PATH="$e" lean -o "$e/F321BackwardBarrier.olean" "$e/F321BackwardBarrier.lean"
      - name: Generate and kernel-check all fifteen unbounded F321 affine ray certificates
        run: |
          set -euo pipefail
          q=im-results/agent31-f321-mod384
          e=im-results/agent31-f321-bulk
          mkdir -p /tmp/f321-ray49152
          python3 - <<'PY'
          import json,subprocess,pathlib
          q=pathlib.Path("im-results/agent31-f321-mod384")
          manifest=json.loads((q/"mod49152-affine-candidates.json").read_text())
          assert manifest["modulus"]==49152
          for item in manifest["fullDepthCertifiedRayCandidates"]:
              residue=item["d"]
              proc=subprocess.run(["python3",str(q/"affine_ray_generator.py"),"49152",str(residue)],check=True,text=True,capture_output=True)
              dest=pathlib.Path("/tmp/f321-ray49152")/f"Auto{residue}.lean"
              dest.write_text(proc.stdout)
              summary=json.loads(subprocess.run(["python3",str(q/"affine_ray_generator.py"),"49152",str(residue),"--summary"],check=True,text=True,capture_output=True).stdout)
              assert summary["nodes"]==item["nodes"],(residue,summary)
              print(f"Generated {dest.name}: {summary}",flush=True)
          PY
          for f in /tmp/f321-ray49152/*.lean; do
            echo "Checking $f"
            LEAN_PATH="$e:$q" lean "$f" 2>&1 | tee -a /tmp/f321-ray49152.log
          done
          ! grep -Eq 'sorryAx|native_decide' /tmp/f321-ray49152.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f321-mod49152-exact-affine-certificate-sources
          path: /tmp/f321-ray49152/*.lean
          if-no-files-found: ignore
          retention-days: 5
