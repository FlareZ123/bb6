name: Agent 31 F321 699-ray finite manifest arithmetic (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-ray-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Kernel-check manifest and historical overlap counts
        run: |
          set -euo pipefail
          lean im-results/agent31-f321-mod384/Affine699Count.lean | tee /tmp/agent31-ray-count.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent31-ray-count.log
