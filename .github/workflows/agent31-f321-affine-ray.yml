name: Agent 31 F321 exact affine terminal rays (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affine-ray-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Verify authentic source counter ray backwards closure
        run: |
          set -euo pipefail
          e=im-results/agent31-f321-bulk
          q=im-results/agent31-f321-mod384
          a2=im-results/agent2-f321-diagonal
          lean -o "$e/DensityOneCore.olean" "$e/DensityOneCore.lean" | tee /tmp/agent31-ray.log
          LEAN_PATH="$e" lean -o "$e/DensityOneExtension.olean" "$e/DensityOneExtension.lean" | tee -a /tmp/agent31-ray.log
          lean -o "$e/SourceCounter.olean" "$e/SourceCounter.lean" | tee -a /tmp/agent31-ray.log
          lean -o "$e/Barrier.olean" "$e/Barrier.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e" lean -o "$e/F321BackwardBarrier.olean" "$e/F321BackwardBarrier.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$a2" lean -o "$a2/DiagonalCoordinates.olean" "$a2/DiagonalCoordinates.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$a2" lean -o "$a2/BulkRuns.olean" "$a2/BulkRuns.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$a2" lean -o "$a2/Phase6.olean" "$a2/Phase6.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$a2" lean "$a2/ResetHigh.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$a2" lean "$a2/Phase6Bridge.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$a2" lean -o "$a2/Phase12.olean" "$a2/Phase12.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$a2" lean "$a2/ResetEven.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$q:$a2" lean "$a2/ResetMod384.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$q" lean -o "$q/Mod512Core.olean" "$q/Mod512Core.lean" | tee -a /tmp/agent31-ray.log
          for i in 0 1 2 3 4 5 6 7; do
            LEAN_PATH="$e:$q" lean -o "$q/Mod512Chunk$i.olean" "$q/Mod512Chunk$i.lean" | tee -a /tmp/agent31-ray.log
          done
          LEAN_PATH="$e:$q" lean -o "$q/Mod512Graph.olean" "$q/Mod512Graph.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$q" lean -o "$q/Mod512Source.olean" "$q/Mod512Source.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$q:$a2" lean "$a2/ResetMod512.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$a2" lean "$a2/EvenV2.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$a2" lean "$a2/OddV2Witness.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$q" lean "$q/AffineRay3787.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$q" lean "$q/AffineRay7933.lean" | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$q" lean "$q/AffineRay9043.lean" | tee -a /tmp/agent31-ray.log
          python3 "$q/affine_ray_generator.py" 6144 3787 --summary
          python3 "$q/affine_ray_generator.py" 12288 7933 --summary
          python3 "$q/affine_ray_generator.py" 12288 9043 --summary
          python3 "$q/affine_ray_generator.py" 6144 3787 > /tmp/Auto3787.lean
          python3 "$q/affine_ray_generator.py" 12288 7933 > /tmp/Auto7933.lean
          LEAN_PATH="$e:$q" lean /tmp/Auto3787.lean | tee -a /tmp/agent31-ray.log
          LEAN_PATH="$e:$q" lean /tmp/Auto7933.lean | tee -a /tmp/agent31-ray.log
          python3 "$q/affine_ray_generator.py" 12288 9043 > /tmp/Auto9043.lean
          LEAN_PATH="$e:$q" lean /tmp/Auto9043.lean | tee -a /tmp/agent31-ray.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/agent31-ray.log
