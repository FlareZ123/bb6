name: Agent31 F321 affine terminal inverse certificate
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-map inverse and explicit 33-over-40 families
        run: |
          node im-results/agent31-f321-bulk/f321-inverse-sieve.cjs 30000 | tee /tmp/f321-explicit.json
      - name: Verify 2^20 symbolic affine inverse-class certificate
        run: |
          node im-results/agent31-f321-bulk/affine_terminal_sieve.cjs 20 | tee /tmp/f321-affine.json
      - name: Install Lean 4.36.0-rc2 for arithmetic proof
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Kernel-check F321 inverse odd-numerator and sum lemmas
        run: |
          lean -o im-results/agent31-f321-bulk/DensityOneCore.olean im-results/agent31-f321-bulk/DensityOneCore.lean | tee /tmp/f321-lean.log
          LEAN_PATH=im-results/agent31-f321-bulk lean im-results/agent31-f321-bulk/DensityOneExtension.lean | tee -a /tmp/f321-lean.log
          ! grep -q sorryAx /tmp/f321-lean.log
      - name: Upload exact finite computation record
        uses: actions/upload-artifact@v4
        with:
          name: f321-affine-2pow20-certificate
          path: |
            /tmp/f321-explicit.json
            /tmp/f321-affine.json
          retention-days: 30
