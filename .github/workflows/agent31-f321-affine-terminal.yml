name: Agent31 F321 affine terminal inverse certificate
on:
  workflow_dispatch:
    inputs:
      odd_depth_only:
        description: Verify Agent2 F321 odd-depth inverse rays without full affine sieve
        type: boolean
        required: false
        default: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-map inverse and explicit 33-over-40 families
        if: ${{ !inputs.odd_depth_only }}
        run: |
          set -euo pipefail
          node im-results/agent31-f321-bulk/f321-inverse-sieve.cjs 30000 | tee /tmp/f321-explicit.json
      - name: Verify 2^20 symbolic affine inverse-class certificate
        if: ${{ !inputs.odd_depth_only }}
        run: |
          set -euo pipefail
          node im-results/agent31-f321-bulk/affine_terminal_sieve.cjs 20 | tee /tmp/f321-affine.json
      - name: Install Lean 4.36.0-rc2 for arithmetic proof
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Kernel-check F321 inverse odd-numerator and sum lemmas
        if: ${{ !inputs.odd_depth_only }}
        run: |
          set -euo pipefail
          lean -o im-results/agent31-f321-bulk/DensityOneCore.olean im-results/agent31-f321-bulk/DensityOneCore.lean | tee /tmp/f321-lean.log
          LEAN_PATH=im-results/agent31-f321-bulk lean -o im-results/agent31-f321-bulk/DensityOneExtension.olean im-results/agent31-f321-bulk/DensityOneExtension.lean | tee -a /tmp/f321-lean.log
          lean -o im-results/agent31-f321-bulk/SourceCounter.olean im-results/agent31-f321-bulk/SourceCounter.lean | tee -a /tmp/f321-lean.log
          lean -o im-results/agent31-f321-bulk/Barrier.olean im-results/agent31-f321-bulk/Barrier.lean | tee -a /tmp/f321-lean.log
          LEAN_PATH=im-results/agent31-f321-bulk lean -o im-results/agent31-f321-bulk/F321BackwardBarrier.olean im-results/agent31-f321-bulk/F321BackwardBarrier.lean | tee -a /tmp/f321-lean.log
          LEAN_PATH=im-results/agent31-f321-bulk lean -o im-results/agent31-f321-bulk/FiniteResidueCheck.olean im-results/agent31-f321-bulk/FiniteResidueCheck.lean | tee -a /tmp/f321-lean.log
          LEAN_PATH=im-results/agent31-f321-bulk lean -o im-results/agent31-f321-bulk/ExplicitResidueFamilies.olean im-results/agent31-f321-bulk/ExplicitResidueFamilies.lean | tee -a /tmp/f321-lean.log
          LEAN_PATH=im-results/agent31-f321-bulk lean -o im-results/agent31-f321-bulk/F321Periodicity.olean im-results/agent31-f321-bulk/F321Periodicity.lean | tee -a /tmp/f321-lean.log
          LEAN_PATH=im-results/agent31-f321-bulk lean im-results/agent31-f321-bulk/F321FiniteDensity.lean | tee -a /tmp/f321-lean.log
          LEAN_PATH=im-results/agent31-f321-bulk lean im-results/agent31-f321-bulk/F321FirstMoment.lean | tee -a /tmp/f321-lean.log
          LEAN_PATH=im-results/agent31-f321-bulk lean -o im-results/agent31-f321-bulk/SourceNextBridge.olean im-results/agent31-f321-bulk/SourceNextBridge.lean | tee -a /tmp/f321-lean.log
          LEAN_PATH=im-results/agent31-f321-bulk lean im-results/agent31-f321-bulk/SourceHaltingBridge.lean | tee -a /tmp/f321-lean.log
          ! grep -q sorryAx /tmp/f321-lean.log
      - name: Kernel-check F321 odd-depth source-counter inverse theorem
        if: ${{ inputs.odd_depth_only }}
        run: |
          set -euo pipefail
          node im-results/agent2-f321-odd-depth/verify.cjs 101
          e=im-results/agent31-f321-bulk
          lean -o "$e/DensityOneCore.olean" "$e/DensityOneCore.lean" | tee /tmp/f321-odd-lean.log
          LEAN_PATH="$e" lean -o "$e/DensityOneExtension.olean" "$e/DensityOneExtension.lean" | tee -a /tmp/f321-odd-lean.log
          lean -o "$e/SourceCounter.olean" "$e/SourceCounter.lean" | tee -a /tmp/f321-odd-lean.log
          lean -o "$e/Barrier.olean" "$e/Barrier.lean" | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e" lean -o "$e/F321BackwardBarrier.olean" "$e/F321BackwardBarrier.lean" | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e" lean im-results/agent2-f321-odd-depth/OddDepthSource.lean | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e" lean -o im-results/agent2-f321-odd-depth/Mod3Source.olean im-results/agent2-f321-odd-depth/Mod3Source.lean | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e" lean -o "$e/FiniteResidueCheck.olean" "$e/FiniteResidueCheck.lean" | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e" lean -o "$e/ExplicitResidueFamilies.olean" "$e/ExplicitResidueFamilies.lean" | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e" lean -o "$e/F321Periodicity.olean" "$e/F321Periodicity.lean" | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e" lean -o "$e/SourceNextBridge.olean" "$e/SourceNextBridge.lean" | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e" lean -o "$e/SourceHaltingBridge.olean" "$e/SourceHaltingBridge.lean" | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e:im-results/agent2-f321-odd-depth" lean im-results/agent2-f321-odd-depth/Mod3Executable.lean | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e" lean -o im-results/agent2-f321-odd-depth/PhaseSource.olean im-results/agent2-f321-odd-depth/PhaseSource.lean | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e:im-results/agent2-f321-odd-depth" lean im-results/agent2-f321-odd-depth/PhaseExecutable.lean | tee -a /tmp/f321-odd-lean.log
          node im-results/agent2-f321-mod96/verify.cjs > /tmp/f321-mod96-graph.json
          lean -o im-results/agent2-f321-mod96/Mod96Graph.olean im-results/agent2-f321-mod96/Mod96Graph.lean | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="im-results/agent2-f321-mod96:$e" lean im-results/agent2-f321-mod96/Mod96Source.lean | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e" lean -o im-results/agent2-f321-bulk/HighBulkSource.olean im-results/agent2-f321-bulk/HighBulkSource.lean | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e" lean -o im-results/agent2-f321-bulk/FarBulkSource.olean im-results/agent2-f321-bulk/FarBulkSource.lean | tee -a /tmp/f321-odd-lean.log
          LEAN_PATH="$e:im-results/agent2-f321-bulk" lean im-results/agent2-f321-bulk/HighFarCompose.lean | tee -a /tmp/f321-odd-lean.log
          ! grep -q sorryAx /tmp/f321-odd-lean.log
      - name: Upload exact finite computation record
        if: ${{ !inputs.odd_depth_only }}
        uses: actions/upload-artifact@v4
        with:
          name: f321-affine-2pow20-certificate
          path: |
            /tmp/f321-explicit.json
            /tmp/f321-affine.json
          retention-days: 30
