name: Agent 32 #429 raw F-entry predecessor source proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2 and authenticate official release
        run: |
          set -euo pipefail
          url="https://github.com/leanprover/lean4/releases/download/v4.36.0-rc2/lean-4.36.0-rc2-linux.tar.zst"
          curl -fLsS --retry 4 --retry-all-errors --retry-delay 5 "$url" -o "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' '0a0a3208617e9eab92f1041efa83ad94d405e69d172fb654a62dbfa9fbc5313b' "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.36.0-rc2-linux/bin" >> "$GITHUB_PATH"
      - name: Compile original frontier, authentic #429 path and new all-time predecessor theorem
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-429-j-first-branch:im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider:im-results/agent1-429-physical-frontier:im-results/agent32-429-raw-parent:im-results/agent32-429-primitive-cost:im-results/agent32-429-high3-ladder:im-results/agent32-429-high2-prefix:im-results/agent6-429-one-sided-excursion:im-results/agent18-429-lastwriter:im-results/agent3-429-prefatal:im-results/agent3-429-a-corridor:im-results/agent3-429-e-guard:im-results/agent39-429-frontier-left:im-results/agent3-429-root-language"
          lean -o im-results/agent8-coverage-contract/Frontier.olean im-results/agent8-coverage-contract/Frontier.lean
          lean -o im-results/agent32-429-primitive-cost/BubbleExact.olean im-results/agent32-429-primitive-cost/BubbleExact.lean | tee /tmp/agent32-bubble.log
          lean -o im-results/agent32-429-primitive-cost/BubblePrefix.olean im-results/agent32-429-primitive-cost/BubblePrefix.lean | tee -a /tmp/agent32-bubble.log
          lean -o im-results/agent32-429-primitive-cost/BCFuture.olean im-results/agent32-429-primitive-cost/BCFuture.lean | tee -a /tmp/agent32-bubble.log
          for m in RayClosed RayChecker RayEntry RayFinite RayTurnExample RayFiniteOracle FiniteHalting; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          lean -o im-results/agent8-coverage-contract/Symmetry.olean im-results/agent8-coverage-contract/Symmetry.lean
          for m in RayMacro EntryMacroOracle EntryMacroLeft; do
            lean -o "im-results/agent6-fresh-glider/$m.olean" "im-results/agent6-fresh-glider/$m.lean"
          done
          lean -o im-results/agent44-drift-closure/DirectedDrift.olean im-results/agent44-drift-closure/DirectedDrift.lean
          for m in ZeroMaskOracle FiniteDecision; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          for m in FrontierAudit FrontierMass; do
            lean -o "im-results/agent4-coverage-smoke/$m.olean" "im-results/agent4-coverage-smoke/$m.lean"
          done
          for m in ZeroPathAudit ControlPathAudit ZeroRowAudit PhysicalTraceAudit FiniteLassoOracle LassoTraceAudit; do
            lean -o "im-results/agent32-zero-prefix-global/$m.olean" "im-results/agent32-zero-prefix-global/$m.lean"
          done
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent1-429-physical-frontier/BB429PhysicalFrontier.olean im-results/agent1-429-physical-frontier/BB429PhysicalFrontier.lean
          lean -o im-results/agent6-429-one-sided-excursion/BB429OddExcursion.olean im-results/agent6-429-one-sided-excursion/BB429OddExcursion.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -o im-results/agent6-429-one-sided-excursion/BB429SourceE1Return.olean im-results/agent6-429-one-sided-excursion/BB429SourceE1Return.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -o im-results/agent6-429-one-sided-excursion/BB429SourceE1Delta.olean im-results/agent6-429-one-sided-excursion/BB429SourceE1Delta.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -o im-results/agent6-429-one-sided-excursion/BB429SourceRows.olean im-results/agent6-429-one-sided-excursion/BB429SourceRows.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent6-429-one-sided-excursion/BB429PhysicalBridge.olean im-results/agent6-429-one-sided-excursion/BB429PhysicalBridge.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -o im-results/agent32-429-raw-parent/BB429E1ShiftDelta.olean im-results/agent32-429-raw-parent/BB429E1ShiftDelta.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-raw-parent/BB429DeltaPhysicalBridge.olean im-results/agent32-429-raw-parent/BB429DeltaPhysicalBridge.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent6-429-one-sided-excursion/BB429FinishScanEDelta.olean im-results/agent6-429-one-sided-excursion/BB429FinishScanEDelta.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent6-429-one-sided-excursion/BB429JuncHeadExcursion.olean im-results/agent6-429-one-sided-excursion/BB429JuncHeadExcursion.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-high2-prefix/High2Prefix.olean im-results/agent32-429-high2-prefix/High2Prefix.lean | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-primitive-cost/JPhysicalPrefix.olean im-results/agent32-429-primitive-cost/JPhysicalPrefix.lean | tee -a /tmp/agent32-bubble.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-primitive-cost/JF0Prefix.olean im-results/agent32-429-primitive-cost/JF0Prefix.lean | tee -a /tmp/agent32-bubble.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent1-429-j-first-branch/JFirstBranch.olean im-results/agent1-429-j-first-branch/JFirstBranch.lean | tee -a /tmp/agent32-bubble.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-high2-prefix/High2PhysicalBridge.olean im-results/agent32-429-high2-prefix/High2PhysicalBridge.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-high2-prefix/High2Tail.olean im-results/agent32-429-high2-prefix/High2Tail.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-high2-prefix/High2TailBase.olean im-results/agent32-429-high2-prefix/High2TailBase.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-high2-prefix/High2Return.olean im-results/agent32-429-high2-prefix/High2Return.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-high2-prefix/MidAposBoundary.olean im-results/agent32-429-high2-prefix/MidAposBoundary.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-high3-ladder/High3Ladder.olean im-results/agent32-429-high3-ladder/High3Ladder.lean | tee /tmp/agent32-high3.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-raw-parent/BB429FEntry.olean im-results/agent32-429-raw-parent/BB429FEntry.lean | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent32-429-raw-parent/BB429FatalB.olean im-results/agent32-429-raw-parent/BB429FatalB.lean | tee -a /tmp/agent32-429-source.log
          lean -o im-results/agent32-429-raw-parent/FreshCell.olean im-results/agent32-429-raw-parent/FreshCell.lean | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 im-results/agent32-429-raw-parent/BB429FreshFrontier.lean | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 im-results/agent3-429-prefatal/BB429PreFatal.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o im-results/agent3-429-a-corridor/BB429AGate.olean im-results/agent3-429-a-corridor/BB429AGate.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 im-results/agent3-429-e-guard/BB429EGuard.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -o im-results/agent39-429-frontier-left/Frontier429.olean im-results/agent39-429-frontier-left/Frontier429.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=10000000 -o im-results/agent3-429-root-language/BB429RootLanguageFatal.olean im-results/agent3-429-root-language/BB429RootLanguageFatal.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -o im-results/agent3-429-root-language/BB429RootLanguageCast.olean im-results/agent3-429-root-language/BB429RootLanguageCast.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -o im-results/agent3-429-root-language/BB429RootPairNormalizer.olean im-results/agent3-429-root-language/BB429RootPairNormalizer.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=10000000 -o im-results/agent3-429-root-language/BB429RootOddSection.olean im-results/agent3-429-root-language/BB429RootOddSection.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=10000000 im-results/agent3-429-root-language/BB429RootOddPhysical.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          lean -DmaxHeartbeats=10000000 im-results/agent3-429-root-language/BB429RootLanguagePhysical.lean 2>&1 | tee -a /tmp/agent32-429-source.log
          audit_axiom_free() {
            theorem="$1"
            logfile="$2"
            line="$(grep -F "'${theorem}' depends on axioms:" "$logfile")"
            printf '%s\n' "$line"
            if printf '%s\n' "$line" | grep -q 'sorryAx'; then
              echo "ERROR: ${theorem} depends on sorryAx" >&2
              exit 1
            fi
          }
          audit_axiom_free "BB429DeltaPhysicalBridge.source_runWithDelta_none_rep" /tmp/agent32-429-source.log
          audit_axiom_free "BB429AGate.bGate_has_A_ancestor" /tmp/agent32-429-source.log
          audit_axiom_free "BB429AGate.bGate_reaches_B001" /tmp/agent32-429-source.log
          audit_axiom_free "BB429AGate.halts_iff_earlier_A_corridor" /tmp/agent32-429-source.log
          audit_axiom_free "BB429AGate.aGate_forces_halt_at" /tmp/agent32-429-source.log
          audit_axiom_free "BB429AGate.halting_time_iff_A_corridor" /tmp/agent32-429-source.log
          audit_axiom_free "BB429AGate.halting_requires_prior_distant_scan" /tmp/agent32-429-source.log
          audit_axiom_free "BB429RootOddPhysical.c0_odd_pairs_raw" /tmp/agent32-429-source.log
          audit_axiom_free "BB429RootLanguagePhysical.prepared_C0_fatal" /tmp/agent32-429-source.log
          audit_axiom_free "BB429RootLanguagePhysical.prepared_C0_halts" /tmp/agent32-429-source.log
          audit_axiom_free "BB429EGuard.every_reachable_E_right_one" /tmp/agent32-429-source.log
          audit_axiom_free "BB429EGuard.E0_cannot_enter_aGate_zero" /tmp/agent32-429-source.log
          audit_axiom_free "BB429EGuard.root_aGate_zero_has_B1_parent" /tmp/agent32-429-source.log
          audit_axiom_free "BB429EGuard.root_aGate_zero_only_B1" /tmp/agent32-429-source.log
          audit_axiom_free "BB429EGuard.two_E1_then_E0_no_A_corridor" /tmp/agent32-429-source.log
          audit_axiom_free "BB429PreFatal.preFatal_iff_next_fatalB" /tmp/agent32-429-source.log
          audit_axiom_free "BB429PreFatal.halts_iff_root_preFatal" /tmp/agent32-429-source.log
          audit_axiom_free "BB429PreFatal.halt_requires_prior_head_three_right" /tmp/agent32-429-source.log
          audit_axiom_free "BB429High2Tail.midApos_to_midAaux" /tmp/agent32-429-source.log
          audit_axiom_free "BB429High2Tail.midAaux_reduce_v" /tmp/agent32-429-source.log
          audit_axiom_free "BB429High2Tail.midApos_to_junc0_of_base" /tmp/agent32-429-source.log
          audit_axiom_free "BB429High2TailBase.midAaux_zero_base" /tmp/agent32-429-source.log
          audit_axiom_free "BB429High2TailBase.midAaux_to_junc0_of_base" /tmp/agent32-429-source.log
          audit_axiom_free "BB429High2Return.midA2_to_junc0_of_base" /tmp/agent32-429-source.log
          audit_axiom_free "BB429High2Return.j_high2_to_junc_raw" /tmp/agent32-429-source.log
          audit_axiom_free "BB429High2Return.j_high2_crosses_origin_raw" /tmp/agent32-429-source.log
          audit_axiom_free "BB429High2Return.juncCycle_crossing_shape" /tmp/agent32-429-source.log
          audit_axiom_free "BB429High2Return.j_high2_crossing_shape_raw" /tmp/agent32-429-source.log
          audit_axiom_free "BB429MidAposBoundary.shift_A01_tail_delta" /tmp/agent32-429-source.log
          audit_axiom_free "BB429MidAposBoundary.juncPos_w0_exit_delta" /tmp/agent32-429-source.log
          audit_axiom_free "BB429MidAposBoundary.midApos_to_junc_delta" /tmp/agent32-429-source.log
          audit_axiom_free "BB429MidAposBoundary.midApos_reenter_delta" /tmp/agent32-429-source.log
          audit_axiom_free "BB429MidAposBoundary.midApos_reenter_twice_delta" /tmp/agent32-429-source.log
          audit_axiom_free "BB429MidAposBoundary.midApos_w2_exit_delta" /tmp/agent32-429-source.log
