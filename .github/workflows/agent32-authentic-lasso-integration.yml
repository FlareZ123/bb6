name: Agent 32 authentic F287 plus finite-lasso integration (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/cryptids
          ref: c86f15861709b76042998c5211c7b2f83991621b
          path: cryptids
      - name: Install pinned upstream Lean 4.35.0-rc4
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify the pinned Cryptids source and A6 machine
        working-directory: cryptids
        run: |
          test "$(git rev-parse HEAD)" = "c86f15861709b76042998c5211c7b2f83991621b"
          lake update
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB0LF_1RC0RA_1LD0RB_0LE0LC_0LA0LC_0LBHHH
      - name: Compile the authentic-root and exact-score global branch
        working-directory: cryptids
        run: |
          mkdir -p BB6Agent4
          cp ../im-results/agent8-coverage-contract/Frontier.lean BB6Agent4/
          cp ../im-results/agent8-coverage-contract/RayClosed.lean BB6Agent4/
          cp ../im-results/agent8-coverage-contract/RayChecker.lean BB6Agent4/
          cp ../im-results/agent8-coverage-contract/RayEntry.lean BB6Agent4/
          cp ../im-results/agent8-coverage-contract/RayFinite.lean BB6Agent4/
          cp ../im-results/agent8-coverage-contract/FiniteHalting.lean BB6Agent4/
          cp ../im-results/agent8-coverage-contract/RayTurnExample.lean BB6Agent4/
          cp ../im-results/agent8-coverage-contract/RayFiniteOracle.lean BB6Agent4/
          cp ../im-results/agent8-coverage-contract/ZeroMaskOracle.lean BB6Agent4/
          cp ../im-results/agent8-coverage-contract/FiniteDecision.lean BB6Agent4/
          cp ../im-results/agent8-coverage-contract/IncrementalAudit.lean BB6Agent4/
          cp ../im-results/agent44-drift-closure/DirectedDrift.lean BB6Agent4/
          cp ../im-results/agent32-zero-prefix-global/ZeroPathAudit.lean BB6Agent4/
          cp ../im-results/agent32-zero-prefix-global/ControlPathAudit.lean BB6Agent4/
          cp ../im-results/agent32-zero-prefix-global/ZeroRowAudit.lean BB6Agent4/
          cp ../im-results/agent32-zero-prefix-global/PhysicalTraceAudit.lean BB6Agent4/
          cp ../im-results/agent32-zero-prefix-global/FiniteLassoOracle.lean BB6Agent4/
          cp ../im-results/agent32-zero-prefix-global/AuthenticLassoIntegration.lean BB6Agent4/
          cp ../im-results/agent32-zero-prefix-global/AuthenticLassoMassEval.lean BB6Agent4/
          for m in RelativeTape FrontierAudit FrontierMass FrontierClose CryptidsTapeAdapter SingletonFrontier CryptidsF287 CryptidsF287Global TurnBranchAudit AuthenticTurnBranchAudit; do
            cp "../im-results/agent4-coverage-smoke/$m.lean" BB6Agent4/
          done
          export LEAN_PATH="BB6Agent4"
          lake env lean -o BB6Agent4/Frontier.olean BB6Agent4/Frontier.lean
          lake env lean -o BB6Agent4/RelativeTape.olean BB6Agent4/RelativeTape.lean
          lake env lean -o BB6Agent4/FrontierAudit.olean BB6Agent4/FrontierAudit.lean
          lake env lean -o BB6Agent4/FrontierMass.olean BB6Agent4/FrontierMass.lean
          lake env lean -o BB6Agent4/FrontierClose.olean BB6Agent4/FrontierClose.lean
          lake env lean -o BB6Agent4/CryptidsTapeAdapter.olean BB6Agent4/CryptidsTapeAdapter.lean
          lake env lean -o BB6Agent4/SingletonFrontier.olean BB6Agent4/SingletonFrontier.lean
          lake env lean -o BB6Agent4/CryptidsF287.olean BB6Agent4/CryptidsF287.lean
          lake env lean -o BB6Agent4/CryptidsF287Global.olean BB6Agent4/CryptidsF287Global.lean
          for m in RayClosed RayChecker RayEntry RayFinite; do
            lake env lean -o "BB6Agent4/$m.olean" "BB6Agent4/$m.lean"
          done
          lake env lean -o BB6Agent4/FiniteHalting.olean BB6Agent4/FiniteHalting.lean
          lake env lean -o BB6Agent4/RayTurnExample.olean BB6Agent4/RayTurnExample.lean
          lake env lean -o BB6Agent4/RayFiniteOracle.olean BB6Agent4/RayFiniteOracle.lean
          lake env lean -o BB6Agent4/IncrementalAudit.olean BB6Agent4/IncrementalAudit.lean
          lake env lean -o BB6Agent4/DirectedDrift.olean BB6Agent4/DirectedDrift.lean
          lake env lean -o BB6Agent4/ZeroMaskOracle.olean BB6Agent4/ZeroMaskOracle.lean
          lake env lean -o BB6Agent4/FiniteDecision.olean BB6Agent4/FiniteDecision.lean
          lake env lean -o BB6Agent4/ZeroPathAudit.olean BB6Agent4/ZeroPathAudit.lean
          lake env lean -o BB6Agent4/ControlPathAudit.olean BB6Agent4/ControlPathAudit.lean
          lake env lean -o BB6Agent4/ZeroRowAudit.olean BB6Agent4/ZeroRowAudit.lean
          lake env lean -o BB6Agent4/PhysicalTraceAudit.olean BB6Agent4/PhysicalTraceAudit.lean
          lake env lean -o BB6Agent4/FiniteLassoOracle.olean BB6Agent4/FiniteLassoOracle.lean
          lake env lean -o BB6Agent4/TurnBranchAudit.olean BB6Agent4/TurnBranchAudit.lean
          lake env lean -o BB6Agent4/AuthenticTurnBranchAudit.olean BB6Agent4/AuthenticTurnBranchAudit.lean
          lake env lean -o BB6Agent4/AuthenticLassoIntegration.olean BB6Agent4/AuthenticLassoIntegration.lean

