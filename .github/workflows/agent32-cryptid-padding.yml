name: Agent 32 Cryptid source checks (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Run the raw TM62-to-D0 acceptance gate, or the preserved legacy padding/107-call check"
        type: choice
        options:
          - raw_d0_bridge
          - legacy_padding_107_call
          - tail_prefix_cylinders
          - short_mod3_halting
          - all_q_e_terminal
          - source_phase_bands
          - four_root_anchor_bridge
        default: raw_d0_bridge
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Restore original source with SHA verification (legacy only)
        if: inputs.target == 'legacy_padding_107_call' || inputs.target == 'all_q_e_terminal' || inputs.target == 'four_root_anchor_bridge'
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py

      - name: Install pinned Lean 4.36.0-rc2 (legacy only)
        if: inputs.target != 'raw_d0_bridge'
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Authenticate four blank roots to exact D phase-band anchors
        if: inputs.target == 'four_root_anchor_bridge'
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent25-cryptid-doublezero:im-results/agent32-cryptid-third:im-results/agent32-cryptid-padding:im-results/agent35-cryptid-code:im-results/agent35-d-regular-certificate:im-results/agent2-cryptid-continuity:im-results/agent36-cryptid-trace:im-results/agent26-d-phase-bands
        run: |
          set -euo pipefail
          python3 -m pip install --quiet filelock
          python3 im-results/agent35-d-regular-certificate/restore_sources.py
          python3 im-results/agent25-cryptid-doublezero/unpack.py
          python3 im-results/agent2-cryptid-continuity/restore_a_regular.py
          python3 im-results/agent2-cryptid-continuity/restore_e_regular.py
          B=im-results/agent31-cryptid-boundary
          A=im-results/agent25-cryptid-doublezero
          P=im-results/agent32-cryptid-padding
          S=im-results/agent32-cryptid-third
          H=im-results/agent35-d-regular-certificate
          D=im-results/agent2-cryptid-continuity
          X=im-results/agent36-cryptid-trace
          G=im-results/agent26-d-phase-bands
          lean --version
          lean -o "$B/Boundary.olean" "$B/Boundary.lean"
          lean -o "$B/BoundaryExtra.olean" "$B/BoundaryExtra.lean"
          for module in DoubleZero TripleUniversalBase TripleUniversalCore TripleUniversalWalk TripleUniversal TenPump TokenCode; do
            lean -o "$A/$module.olean" "$A/$module.lean"
          done
          C=im-results/agent35-cryptid-code
          lean -o "$C/ABridgeCode.olean" "$C/ABridgeCode.lean"
          lean -o "$H/DRegular.olean" "$H/DRegular.lean"
          lean -o "$H/DTransport.olean" "$H/DTransport.lean"
          lean -o "$H/DObservedTransport.olean" "$H/DObservedTransport.lean"
          lean -o "$P/Generic.olean" "$P/Generic.lean"
          lean -o "$P/BoundaryPadding.olean" "$P/BoundaryPadding.lean"
          lean -o "$H/DObsSourceCandidate.olean" "$H/DObsSourceCandidate.lean"
          lean -o "$D/BRegularSource.olean" "$D/BRegularSource.lean"
          lean -o "$D/AZeroSource.olean" "$D/AZeroSource.lean"
          lean -o "$D/EZeroSource.olean" "$D/EZeroSource.lean"
          lean -o "$D/AOneSource.olean" "$D/AOneSource.lean"
          lean -o "$D/AWordAlgebra.olean" "$D/AWordAlgebra.lean"
          lean -o "$D/ATwoSource.olean" "$D/ATwoSource.lean"
          lean -o "$D/ARegularFull.olean" "$D/ARegularFull.lean"
          for module in CryptidSix CryptidPairs CryptidTriplePairs; do
            lean -o "$S/$module.olean" "$S/$module.lean"
          done
          lean -o "$D/ERemaining.olean" "$D/ERemaining.lean"
          lean -o "$D/DRegularDurationShift.olean" "$D/DRegularDurationShift.lean"
          lean -o "$D/DRegularShift.olean" "$D/DRegularShift.lean"
          lean -o "$D/DRegularTimedShift.olean" "$D/DRegularTimedShift.lean"
          lean -o "$D/DRegularSourceShift.olean" "$D/DRegularSourceShift.lean"
          lean -o "$G/GrowthBands.olean" "$G/GrowthBands.lean"
          lean -o "$G/RegularBands.olean" "$G/RegularBands.lean"
          lean -o "$X/DAllBlankSource.olean" "$X/DAllBlankSource.lean"
          lean "$X/FourRootAnchorSource.lean" 2>&1 | tee /tmp/four-root-anchor.log
          if grep -Eq 'sorryAx|native_decide' /tmp/four-root-anchor.log; then
            echo "Forbidden axiom or native_decide in four-root anchor proof"
            exit 1
          fi

      - name: Verify widened D source phase-band separation
        if: inputs.target == 'source_phase_bands'
        env:
          LEAN_PATH: im-results/agent26-d-phase-bands
        run: |
          set -euo pipefail
          lean --version
          lean -o im-results/agent26-d-phase-bands/GrowthBands.olean im-results/agent26-d-phase-bands/GrowthBands.lean
          lean im-results/agent36-cryptid-trace/SectionBandSeparation.lean 2>&1 | tee /tmp/section-band-separation.log
          if grep -Eq 'sorryAx|native_decide' /tmp/section-band-separation.log; then
            echo "Forbidden axiom or native_decide in phase-band proof"
            exit 1
          fi

      - name: Compile original-source padding checks (legacy only)
        if: inputs.target == 'legacy_padding_107_call'
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-padding:im-results/agent32-cryptid-third:im-results/agent35-cryptid-code
        run: |
          lean --version
          lean -o im-results/agent31-cryptid-boundary/Boundary.olean im-results/agent31-cryptid-boundary/Boundary.lean
          lean -o im-results/agent32-cryptid-padding/Generic.olean im-results/agent32-cryptid-padding/Generic.lean
          lean -o im-results/agent32-cryptid-padding/BoundaryPadding.olean im-results/agent32-cryptid-padding/BoundaryPadding.lean
          lean -o im-results/agent32-cryptid-third/CryptidSix.olean im-results/agent32-cryptid-third/CryptidSix.lean
          lean -o im-results/agent32-cryptid-third/CryptidPairs.olean im-results/agent32-cryptid-third/CryptidPairs.lean
          lean im-results/agent32-cryptid-padding/PaddedApplications.lean
          lean -o im-results/agent32-cryptid-padding/EZeroPair.olean im-results/agent32-cryptid-padding/EZeroPair.lean
          lean im-results/agent32-cryptid-padding/EZeroHalt.lean
          lean -o im-results/agent35-cryptid-code/EDouble.olean im-results/agent35-cryptid-code/EDouble.lean
          lean im-results/agent32-cryptid-padding/EAllDouble.lean
          lean im-results/agent32-cryptid-padding/ETripleZero.lean

      - name: Compile parameterized terminal-prefix finite-window proof (tail prefix only)
        if: inputs.target == 'tail_prefix_cylinders'
        env:
          LEAN_PATH: im-results/agent32-cryptid-padding
        run: |
          set -euo pipefail
          lean --version
          lean -o im-results/agent32-cryptid-padding/TailWindowCore.olean im-results/agent32-cryptid-padding/TailWindowCore.lean
          lean im-results/agent32-cryptid-padding/TailWindowPrefix.lean

      - name: Check source-level unbounded E 1101101100 halt scanner (all q only)
        if: inputs.target == 'all_q_e_terminal'
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent2-cryptid-continuity:im-results/agent2-cryptid-terminal-prefix
        run: |
          set -euo pipefail
          lean --version
          lean -o im-results/agent31-cryptid-boundary/Boundary.olean im-results/agent31-cryptid-boundary/Boundary.lean
          lean -o im-results/agent2-cryptid-continuity/EHaltCylinder.olean im-results/agent2-cryptid-continuity/EHaltCylinder.lean
          lean -o im-results/agent2-cryptid-terminal-prefix/AllQ1101101100.olean im-results/agent2-cryptid-terminal-prefix/AllQ1101101100.lean 2>&1 | tee /tmp/agent2-all-q-halt.log
          lean -o im-results/agent2-cryptid-terminal-prefix/AllQSourceFeeder.olean im-results/agent2-cryptid-terminal-prefix/AllQSourceFeeder.lean 2>&1 | tee -a /tmp/agent2-all-q-halt.log
          lean im-results/agent2-cryptid-terminal-prefix/AllQFirstHalt.lean 2>&1 | tee -a /tmp/agent2-all-q-halt.log
          lean im-results/agent2-cryptid-terminal-prefix/AllQPrefix000.lean 2>&1 | tee -a /tmp/agent2-all-q-halt.log
          if grep -Eq 'sorryAx|native_decide' /tmp/agent2-all-q-halt.log; then
            echo "Forbidden Lean axiom in all-q terminal scanner proof"; exit 1
          fi

      - name: Compile preserved arbitrary-suffix 107-call extension (legacy only)
        if: inputs.target == 'legacy_padding_107_call'
        run: |
          git init /tmp/proofs
          cd /tmp/proofs
          git remote add origin https://github.com/int-y1/proofs.git
          git fetch --depth=1 origin b77dda5c79fb196d67ce35669e172ad632401c1b
          git checkout --detach FETCH_HEAD
          elan toolchain install leanprover/lean4:v4.36.0-rc1
          lake exe cache get
          lake build BusyLean.BB62 BusyLean.TMAcceleration
          cat "$GITHUB_WORKSPACE/im-results/agent32-cryptid-padding/SuffixParametricPrefix.append.lean" >> BusyLean/Individual/1RB0RE_1LC0RA_1LA1LD_1LC1LF_0LC0LB_1LE---.lean
          mkdir -p .lake/build/lib/lean/BusyLean/Individual
          lake env lean -o .lake/build/lib/lean/BusyLean/Individual/1RB0RE_1LC0RA_1LA1LD_1LC1LF_0LC0LB_1LE---.olean BusyLean/Individual/1RB0RE_1LC0RA_1LA1LD_1LC1LF_0LC0LB_1LE---.lean

      - name: Prepare exact pinned TM62 and Mathlib dependencies (raw bridge and short halting)
        if: inputs.target == 'raw_d0_bridge' || inputs.target == 'short_mod3_halting'
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

          git init /tmp/proofs
          cd /tmp/proofs
          git remote add origin https://github.com/int-y1/proofs.git
          git fetch --depth=1 origin b77dda5c79fb196d67ce35669e172ad632401c1b
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "b77dda5c79fb196d67ce35669e172ad632401c1b"
          python3 - <<'PY'
          import json
          manifest = json.load(open("lake-manifest.json"))
          mathlib = next(p for p in manifest["packages"] if p["name"] == "mathlib")
          expected = "dfbc15ea6605db241da9cfd0632bbaf69b67e513"
          assert mathlib["rev"] == expected, (mathlib["rev"], expected)
          print("External proof revision:", "b77dda5c79fb196d67ce35669e172ad632401c1b")
          print("Mathlib revision:", mathlib["rev"])
          PY
          lean --version
          lake exe cache get
          lake build BusyLean.BB62 BusyLean.TMAcceleration
          mkdir -p .lake/build/lib/lean/BusyLean/Individual
          lake env lean -o .lake/build/lib/lean/BusyLean/Individual/1RB0RE_1LC0RA_1LA1LD_1LC1LF_0LC0LB_1LE---.olean BusyLean/Individual/1RB0RE_1LC0RA_1LA1LD_1LC1LF_0LC0LB_1LE---.lean

      - name: Compile direct TM62 mod-three terminal-prefix feeder (short only)
        if: inputs.target == 'short_mod3_halting'
        run: |
          set -euo pipefail
          cd /tmp/proofs
          cat "$GITHUB_WORKSPACE/im-results/agent32-cryptid-padding/ShortSuffixHalting.append.lean" >> BusyLean/Individual/1RB0RE_1LC0RA_1LA1LD_1LC1LF_0LC0LB_1LE---.lean
          lake env lean -o .lake/build/lib/lean/BusyLean/Individual/1RB0RE_1LC0RA_1LA1LD_1LC1LF_0LC0LB_1LE---.olean BusyLean/Individual/1RB0RE_1LC0RA_1LA1LD_1LC1LF_0LC0LB_1LE---.lean 2>&1 | tee /tmp/d-short-mod3-halt.log
          if grep -Eq 'sorryAx|native_decide' /tmp/d-short-mod3-halt.log; then
            echo "Forbidden axiom in the short-mod3 halting proof"; exit 1
          fi

      - name: Compile exact Mathlib Tape-to-D0 adapter (raw bridge only)
        if: inputs.target == 'raw_d0_bridge'
        run: |
          cd /tmp/proofs
          lake env bash -c '
            set -euo pipefail
            ROOT="$GITHUB_WORKSPACE"
            cd "$ROOT"
            test -f /tmp/proofs/.lake/build/lib/lean/BusyLean/BB62.olean
            test -f /tmp/proofs/.lake/build/lib/lean/BusyLean/Individual/1RB0RE_1LC0RA_1LA1LD_1LC1LF_0LC0LB_1LE---.olean
            export LEAN_PATH="$ROOT/im-results/agent8-coverage-contract:$ROOT/im-results/agent4-coverage-smoke:$ROOT/im-results/agent3-portfolio-raw-conjugacy:/tmp/proofs/.lake/build/lib/lean:/tmp/proofs:$LEAN_PATH"
            lean --version
            lean -o "$ROOT/im-results/agent8-coverage-contract/Frontier.olean" "$ROOT/im-results/agent8-coverage-contract/Frontier.lean"
            lean -o "$ROOT/im-results/agent4-coverage-smoke/RelativeTape.olean" "$ROOT/im-results/agent4-coverage-smoke/RelativeTape.lean"
            lean -o "$ROOT/im-results/agent3-portfolio-raw-conjugacy/MachineConjugacy.olean" "$ROOT/im-results/agent3-portfolio-raw-conjugacy/MachineConjugacy.lean"
            lean -o "$ROOT/im-results/agent3-portfolio-raw-conjugacy/DTableWitness.olean" "$ROOT/im-results/agent3-portfolio-raw-conjugacy/DTableWitness.lean"
            lean -o "$ROOT/im-results/agent3-portfolio-raw-conjugacy/DStartFinite.olean" "$ROOT/im-results/agent3-portfolio-raw-conjugacy/DStartFinite.lean"
            lean -o "$ROOT/im-results/agent32-cryptid-padding/TM62MathlibD0Adapter.olean" "$ROOT/im-results/agent32-cryptid-padding/TM62MathlibD0Adapter.lean" 2>&1 | tee /tmp/tm62-d0-adapter.log
            if grep -q "sorryAx" /tmp/tm62-d0-adapter.log; then
              echo "Forbidden sorryAx dependency in raw TM62-to-D0 adapter"
              exit 1
            fi
          '
