name: Agent 32 cryptid E branches (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified original source
        run: |
          python -m pip install filelock
          python im-results/agent31-cryptid-boundary/unpack.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Compile authentic raw machine and E return theorems
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary
        run: |
          lean -o im-results/agent31-cryptid-boundary/Boundary.olean im-results/agent31-cryptid-boundary/Boundary.lean
          lean im-results/agent32-cryptid-third/CryptidThird.lean
          lean im-results/agent32-cryptid-third/CryptidSix.lean
