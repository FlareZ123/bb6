name: Cryptids #490 mirrored-root growth macro (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-mirrored-root-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pinned DeepMind cryptids source
        uses: actions/checkout@v4
        with:
          repository: google-deepmind/cryptids
          ref: 3647718b5df22e1a61462dec0376bd204526285a
          path: cryptids

      - name: Checkout research repository
        uses: actions/checkout@v4
        with:
          path: bb6

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version

      - name: Fetch Mathlib cache and build original target module
        working-directory: cryptids
        shell: bash
        run: |
          lake exe cache get
          lake build BusyBeaver.BB6.Accelerations.M_1RB0RE_1LC0RA_1LA1LD_1LC1LF_0LC0LB_1LEHHH

      - name: Append the mirrored-root macro theorem
        working-directory: cryptids
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("BusyBeaver/BB6/Accelerations/M_1RB0RE_1LC0RA_1LA1LD_1LC1LF_0LC0LB_1LEHHH.lean")
          ending = "end BusyBeaver.M_1RB0RE_1LC0RA_1LA1LD_1LC1LF_0LC0LB_1LEHHH"
          lines = source.read_text().rstrip().splitlines()
          assert lines[-1].strip() == ending, lines[-1]
          append = Path("../bb6/im-results/agent48-mirrored-root-growth/RootMirroredGrowthMacro.append.lean").read_text()
          source.write_text("\n".join(lines[:-1]) + "\n\n" + append + "\n" + ending + "\n")
          PY
          git diff --check

      - name: Compile exact source macro and print its axiom profile
        working-directory: cryptids
        shell: bash
        run: |
          set -o pipefail
          lake build BusyBeaver.BB6.Accelerations.M_1RB0RE_1LC0RA_1LA1LD_1LC1LF_0LC0LB_1LEHHH 2>&1 | tee /tmp/mirrored-root-growth-build.log
          for theorem in root_mirrored_token_closure root_mirrored_ordinary_prefix init_reaches_root_mirrored_seed root_mirrored_growth_76_raw root_mirrored_isNotHalt; do
            block=$(awk -v theorem="$theorem" '
              index($0, theorem) && /depends on axioms:/ {printing=1}
              printing {print}
              printing && /\]/ {exit}
            ' /tmp/mirrored-root-growth-build.log)
            echo "$block"
            if [ -z "$block" ]; then
              echo "::error::missing axiom profile for $theorem"
              exit 1
            fi
            if echo "$block" | grep -q 'sorryAx'; then
              echo "::error::$theorem depends on sorryAx"
              exit 1
            fi
          done
