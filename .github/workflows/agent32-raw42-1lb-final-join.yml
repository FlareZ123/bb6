name: Agent32 Raw42 1LB exact accepted-subpart final join
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  restore_group1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 24683e59ae88b241fbb9c7fdf907935b59010729
      - name: Restore the frozen complete generated source tree
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: "46155553883"
          name: raw42-part2-generated
          path: im-results/agent32-raw42/generated-assembly
      - name: Original accepted group1 part0
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: "46129062347"
          name: raw42-group1-1LB-part-0
          path: /tmp/parts/raw42-group1-1LB-part-0
      - name: Original accepted group1 part1
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: "46129062347"
          name: raw42-group1-1LB-part-1
          path: /tmp/parts/raw42-group1-1LB-part-1
      - name: Repaired and source-accepted group1 part2
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: "46155553883"
          name: raw42-group1-1LB-part-2
          path: /tmp/parts/raw42-group1-1LB-part-2
      - name: Original exact group partition
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: "46129062347"
          name: raw42-group1-split-plan
          path: /tmp/plan
      - name: Authenticate exact three-part original group1 union
        run: |
          set -euo pipefail
          python im-results/agent4-raw109/merge_shards.py /tmp/parts /tmp/group1 /tmp/plan/split.json
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('/tmp/group1/manifest.json')
          m=json.loads(path.read_text())
          m['artifact_name']='raw42-assembly-shard-1'
          m['label']='raw42-assembly-shard-1'
          path.write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-assembly-shard-1
          path: /tmp/group1/
          if-no-files-found: error
          retention-days: 30

  whole_child:
    needs: restore_group1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 24683e59ae88b241fbb9c7fdf907935b59010729
      - name: Reconstruct source-pinned coverage dependencies
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          printf '#!/bin/sh\nexec lean -j1 "$@"\n' >/tmp/lean-one
          chmod +x /tmp/lean-one
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: "46155553883"
          name: raw42-part2-generated
          path: im-results/agent32-raw42/generated-assembly
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: "46100532768"
          pattern: raw42-assembly-shard-*
          path: /tmp/shards
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: "46111777843"
          name: raw42-assembly-shard-0
          path: /tmp/shards/raw42-assembly-shard-0
      - uses: actions/download-artifact@v4
        with:
          name: raw42-assembly-shard-1
          path: /tmp/shards/raw42-assembly-shard-1
      - name: Verify all original eight groups and source-prove whole 1LB Cover
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42
          g="$d/generated-assembly"
          python im-results/agent4-raw109/merge_shards.py /tmp/shards /tmp/merged "$g/shards.json"
          mkdir -p /tmp/final
          python tools/lean_compile_closure.py --lean /tmp/lean-one --workdir /tmp/final --jobs 1 \
            --source-root "$g" --override FastBiDFA="$d/FastBiDFA.lean" \
            --precompiled-manifest /tmp/merged/manifest.json --precompiled-dir /tmp/merged \
            --manifest /tmp/final/manifest.json --artifact-name raw42-certified-1LB-targeted-recovery \
            --theorem BB6.Agent32Raw421LB.Closed.cover \
            --parent-table '1RB---_1RC1LB_0RD---_1LD0LB_------_------' \
            --weighted-bound 100006 "$g/Raw421LBClosedCover.lean" | tee /tmp/final/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/final/audit.log
          python im-results/agent32-raw59/check_axioms.py /tmp/final/audit.log BB6.Agent32Raw421LB.Closed.cover
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-certified-1LB-targeted-recovery
          path: /tmp/final/
          retention-days: 30
          if-no-files-found: error
