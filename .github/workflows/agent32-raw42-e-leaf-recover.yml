name: Agent32 Raw42 0LE exact heavy leaf row rescue
on:
  workflow_dispatch:
    inputs:
      part:
        type: string
        required: true
        default: g0p2
      leaf:
        type: choice
        options: ["15760", "16464", "10404", "13265"]
        default: "15760"

permissions:
  contents: read
  actions: read

jobs:
  source_rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Reconstitute original trusted source dependencies
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          printf '#!/bin/sh\nexec lean -j1 "$@"\n' >/tmp/lean-one
          chmod +x /tmp/lean-one
      - name: Download frozen 0LE original generator output and exact 32-way partition
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: "46156341083"
          name: raw42-split-generated
          path: im-results/agent32-raw42/generated-assembly
      - name: Download original trusted precompiled dependency closure
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: "46156341083"
          name: raw42-split-core
          path: /tmp/core
      - name: Reprove same original BiDFA finite relation with independent row checks
        env:
          PART: ${{ inputs.part }}
          LEAF: ${{ inputs.leaf }}
        run: |
          set -euo pipefail
          [[ "$PART" =~ ^g[0-7]p[0-3]$ ]]
          d=im-results/agent32-raw42
          g="$d/generated-assembly"
          test -f "$g/Raw420LERun${LEAF}.lean"
          python "$d/rewrite_run42_rows.py" "$g" 0LE "$LEAF"
          mapfile -t roots < <(python -c 'import json,sys;print(*json.load(open(sys.argv[1]))["groups"][sys.argv[2]],sep=chr(10))' "$g/split-plan.json" "$PART")
          test "${#roots[@]}" -gt 0
          for i in "${!roots[@]}"; do roots[i]="$g/${roots[i]}.lean"; done
          mkdir -p /tmp/repaired
          python tools/lean_compile_closure.py --lean /tmp/lean-one --workdir /tmp/repaired --jobs 1 \
            --source-root "$g" --override FastBiDFA="$d/FastBiDFA.lean" \
            --precompiled-manifest /tmp/core/manifest.json --precompiled-dir /tmp/core \
            --manifest /tmp/repaired/manifest.json \
            --artifact-name "raw42-split-0LE-$PART" "${roots[@]}" | tee /tmp/repaired/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/repaired/audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-split-0LE-${{ inputs.part }}
          path: /tmp/repaired/
          retention-days: 30
          if-no-files-found: error
