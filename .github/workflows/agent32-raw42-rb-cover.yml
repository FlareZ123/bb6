name: Agent 32 Raw42 0RB normalized cover
on:
  workflow_dispatch:
    inputs:
      variant:
        type: choice
        options: [rb, wide, nested, early, discovery, assembly, block, hard, leaf4828, recover_rb5, recover_assembly]
        default: rb
      assembly_branch:
        type: choice
        options: [0LA, 0LE, 0RA, 0RB, 0RE, 1LA, 1LB, 1LC, 1LE, 1RA, 1RB, 1RE]
        default: 0RA
      discovery_run:
        type: string
        default: ''
      source_revision:
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    if: inputs.variant == 'rb'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct canonical coverage sources
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45675872170
          name: raw59-checked-Upgrade0LE
          path: /tmp/core-old
      - name: Recreate normalized tree and all certificate modules
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42
          g++ -O3 -std=c++20 im-results/agent32-linear-side-cycle/enumerate_tnf.cpp -o /tmp/enumerate
          g++ -O3 -std=c++20 im-results/agent19-raw40-cut/farbank.cpp -o /tmp/farbank
          mkdir -p /tmp/search
          (cd /tmp/search; /tmp/enumerate '1RB---_1RC0RB_0RD---_1LD0LB_------_------' 500; awk '{gsub(/_/,"");print NR-1,$0}' open.txt | /tmp/farbank 5 >far5.txt 2>far.log)
          echo '63c9635d19dfc729af663e17cf0bd07b4a3fc18e6e9d4945603fe185b8361ac6  /tmp/search/open.txt' | sha256sum -c
          python "$d/gen_closed42rb.py" . /tmp/search "$d/generated-rb"
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('im-results/agent32-raw42/generated-rb')
          groups={str(i):[] for i in range(8)}
          sizes=[0]*8
          roots=[p for p in d.glob('Raw42RBClosedRoot_*.lean') if not any(l.startswith('import Raw42RBClosedRoot') for l in p.read_text().splitlines())]
          assert len(roots)>=8
          for p in sorted(roots,key=lambda p:(-p.stat().st_size,p.name)):
              i=min(range(8),key=lambda j:sizes[j])
              groups[str(i)].append(p.stem);sizes[i]+=p.stat().st_size
          (d/'shards.json').write_text(json.dumps({'artifact_prefix':'raw42rb-shard','groups':groups},indent=2)+'\n')
          print(sizes)
          PY
      - name: Source-check shared base and exceptional witnesses
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42/generated-rb
          mkdir -p /tmp/rb-core
          python tools/lean_compile_closure.py --workdir /tmp/rb-core --jobs 3 \
            --source-root "$d" --precompiled-manifest /tmp/core-old/manifest.json --precompiled-dir /tmp/core-old \
            --manifest /tmp/rb-core/manifest.json --artifact-name raw42rb-core \
            "$d/Raw42RBClosedBase.lean" "$d"/Raw42RBNGram*.lean "$d"/Raw42RBRun*.lean | tee /tmp/rb-core/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/rb-core/audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: raw42rb-generated
          path: im-results/agent32-raw42/generated-rb/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: raw42rb-core
          path: /tmp/rb-core/
          retention-days: 7
          if-no-files-found: error
  shard:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        group: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct canonical coverage sources
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw42rb-generated
          path: im-results/agent32-raw42/generated-rb
      - uses: actions/download-artifact@v4
        with:
          name: raw42rb-core
          path: /tmp/rb-core
      - name: Check independent subtree certificates
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42/generated-rb
          mapfile -t roots < <(python -c 'import json,sys;print("\n".join(json.load(open(sys.argv[1]))["groups"][sys.argv[2]]))' "$d/shards.json" "$GROUP")
          for i in "${!roots[@]}"; do roots[i]="$d/${roots[i]}.lean"; done
          test "${#roots[@]}" -gt 0
          mkdir -p /tmp/rb-shard
          python tools/lean_compile_closure.py --workdir /tmp/rb-shard --jobs 2 --source-root "$d" \
            --precompiled-manifest /tmp/rb-core/manifest.json --precompiled-dir /tmp/rb-core \
            --manifest /tmp/rb-shard/manifest.json --artifact-name "raw42rb-shard-$GROUP" "${roots[@]}" | tee /tmp/rb-shard/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/rb-shard/audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: raw42rb-shard-${{ matrix.group }}
          path: /tmp/rb-shard/
          retention-days: 7
          if-no-files-found: error
  compose:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct canonical coverage sources
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw42rb-generated
          path: im-results/agent32-raw42/generated-rb
      - uses: actions/download-artifact@v4
        with:
          pattern: raw42rb-shard-*
          path: /tmp/rb-shards
      - name: Merge exact source closures and prove weighted Cover
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42/generated-rb
          python im-results/agent4-raw109/merge_shards.py /tmp/rb-shards /tmp/rb-merged "$d/shards.json"
          mkdir -p /tmp/rb-final
          python tools/lean_compile_closure.py --workdir /tmp/rb-final --jobs 3 --source-root "$d" \
            --precompiled-manifest /tmp/rb-merged/manifest.json --precompiled-dir /tmp/rb-merged \
            --manifest /tmp/rb-final/manifest.json --artifact-name raw42rb-certified \
            --theorem BB6.Agent32Raw42RB.Closed.cover --parent-table '1RB---_1RC0RB_0RD---_1LD0LB_------_------' \
            --weighted-bound 1006 "$d/Raw42RBClosedCover.lean" | tee /tmp/rb-final/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/rb-final/audit.log
          python im-results/agent32-raw59/check_axioms.py /tmp/rb-final/audit.log BB6.Agent32Raw42RB.Closed.cover
      - uses: actions/upload-artifact@v4
        with:
          name: raw42rb-certified
          path: /tmp/rb-final/
          retention-days: 30
          if-no-files-found: error
  wide:
    if: inputs.variant == 'wide'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision || github.sha }}
      - name: Reconstruct canonical coverage sources
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45675872170
          name: raw59-checked-Upgrade0LE
          path: /tmp/core-old
      - name: Check eight exact wide-cylinder Covers
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42
          mkdir -p /tmp/wide
          python tools/lean_compile_closure.py --workdir /tmp/wide --jobs 2 --source-root "$d" --precompiled-manifest /tmp/core-old/manifest.json --precompiled-dir /tmp/core-old --manifest /tmp/wide/manifest.json --artifact-name raw42-wide "$d/Raw42WideCuts.lean" | tee /tmp/wide/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/wide/audit.log
          for name in ZeroLAOneRC OneLAZeroRD OneLCZeroRB OneLCZeroRD OneRBOneLC OneLBOneRC OneREOneLD OneRBZeroRC; do
            python im-results/agent32-raw59/check_axioms.py /tmp/wide/audit.log "BB6.Agent32Raw42WideCuts.cover$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-wide
          path: /tmp/wide/
          retention-days: 30
          if-no-files-found: error
  nested:
    if: inputs.variant == 'nested'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision || github.sha }}
      - name: Reconstruct canonical coverage sources
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45675872170
          name: raw59-checked-Upgrade0LE
          path: /tmp/core-old
      - name: Check three nested growth Covers
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42
          mkdir -p /tmp/nested
          python tools/lean_compile_closure.py --workdir /tmp/nested --jobs 2 --source-root "$d" --precompiled-manifest /tmp/core-old/manifest.json --precompiled-dir /tmp/core-old --manifest /tmp/nested/manifest.json --artifact-name raw42-nested "$d/Raw42NestedCuts.lean" | tee /tmp/nested/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/nested/audit.log
          for name in OneLBZeroLD OneLBZeroRD OneLCOneLC; do
            python im-results/agent32-raw59/check_axioms.py /tmp/nested/audit.log "BB6.Agent32Raw42NestedCuts.cover$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-nested
          path: /tmp/nested/
          retention-days: 30
          if-no-files-found: error
  early:
    if: inputs.variant == 'early'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision || github.sha }}
      - name: Reconstruct canonical coverage sources
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45675872170
          name: raw59-checked-Upgrade0LE
          path: /tmp/core-old
      - name: Check exact early second-hole Covers
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42
          mkdir -p /tmp/early
          python tools/lean_compile_closure.py --workdir /tmp/early --jobs 2 --source-root "$d" --precompiled-manifest /tmp/core-old/manifest.json --precompiled-dir /tmp/core-old --manifest /tmp/early/manifest.json --artifact-name raw42-early "$d/Raw42EarlyNGram.lean" | tee /tmp/early/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/early/audit.log
          for claim in BB6.Agent32Raw42Early.bankCover BB6.Agent32Raw42Early.cover_all; do
            python im-results/agent32-raw59/check_axioms.py /tmp/early/audit.log "$claim"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-early
          path: /tmp/early/
          retention-days: 30
          if-no-files-found: error
  discovery:
    if: inputs.variant == 'discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        branch: [0LA, 0LE, 0RE, 1LA, 1LB, 1LC, 1LE, 1RA, 1RB, 1RE]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision || github.sha }}
      - name: Discover residual machine witnesses, without redoing RA/RB
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          python im-results/agent32-raw42/discover42.py . "$BRANCH" /tmp/discovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw42-discovery-${{ matrix.branch }}
          path: |
            /tmp/discovery/*.txt
            /tmp/discovery/*.json
            /tmp/discovery/*.log
          retention-days: 14
          if-no-files-found: error
  assembly_prepare:
    if: inputs.variant == 'assembly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      groups: ${{ steps.generate.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision || github.sha }}
      - name: Recover previously classified 0RA/0RB tree
        if: inputs.assembly_branch == '0RA' || inputs.assembly_branch == '0RB'
        env:
          BRANCH: ${{ inputs.assembly_branch }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/search
          g++ -O3 -std=c++20 im-results/agent32-linear-side-cycle/enumerate_tnf.cpp -o /tmp/enumerate
          g++ -O3 -std=c++20 im-results/agent19-raw40-cut/farbank.cpp -o /tmp/farbank
          (cd /tmp/search; /tmp/enumerate "1RB---_1RC${BRANCH}_0RD---_1LD0LB_------_------" 500; awk '{gsub(/_/,"");print NR-1,$0}' open.txt | /tmp/farbank 5 >far5.txt 2>far.log)
          if [ "$BRANCH" = 0RA ]; then
            echo 'ab3c426dbda4916f0779b982c2206ea2fd79de1406963adbafe4c0c914e9559d  /tmp/search/open.txt' | sha256sum -c
          else
            echo '63c9635d19dfc729af663e17cf0bd07b4a3fc18e6e9d4945603fe185b8361ac6  /tmp/search/open.txt' | sha256sum -c
          fi
      - uses: actions/download-artifact@v4
        if: inputs.assembly_branch != '0RA' && inputs.assembly_branch != '0RB'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.discovery_run }}
          name: raw42-discovery-${{ inputs.assembly_branch }}
          path: /tmp/search
      - name: Generate source tree and independent shards
        id: generate
        env:
          BRANCH: ${{ inputs.assembly_branch }}
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42
          python "$d/gen_assembly42.py" . "$BRANCH" /tmp/search "$d/generated-assembly"
          echo "groups=$(cat "$d/generated-assembly/matrix.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-assembly-generated
          path: im-results/agent32-raw42/generated-assembly/
          retention-days: 14
          if-no-files-found: error
      - name: Reconstruct canonical coverage sources
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45675872170
          name: raw59-checked-Upgrade0LE
          path: /tmp/core-old
      - name: Compile common dependency closure only
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42
          mkdir -p /tmp/core
          python tools/lean_compile_closure.py --workdir /tmp/core --jobs 3 --precompiled-manifest /tmp/core-old/manifest.json --precompiled-dir /tmp/core-old --manifest /tmp/core/manifest.json --artifact-name raw42-assembly-core "$d/Raw42AssemblyCore.lean" | tee /tmp/core/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/core/audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-assembly-core
          path: /tmp/core/
          retention-days: 14
          if-no-files-found: error
  assembly_shards:
    needs: assembly_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        group: ${{ fromJSON(needs.assembly_prepare.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision || github.sha }}
      - name: Reconstruct canonical coverage sources
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw42-assembly-generated
          path: im-results/agent32-raw42/generated-assembly/
      - uses: actions/download-artifact@v4
        with:
          name: raw42-assembly-core
          path: /tmp/core/
      - name: Check independent trees and their exceptional witnesses
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42/generated-assembly
          mapfile -t roots < <(python -c 'import json,sys;print("\n".join(json.load(open(sys.argv[1]))["groups"][sys.argv[2]]))' "$d/shards.json" "$GROUP")
          for i in "${!roots[@]}"; do roots[i]="$d/${roots[i]}.lean"; done
          test "${#roots[@]}" -gt 0
          mkdir -p /tmp/shard
          python tools/lean_compile_closure.py --workdir /tmp/shard --jobs 1 --source-root "$d" --override FastBiDFA=im-results/agent32-raw42/FastBiDFA.lean --precompiled-manifest /tmp/core/manifest.json --precompiled-dir /tmp/core --manifest /tmp/shard/manifest.json --artifact-name "raw42-assembly-shard-$GROUP" "${roots[@]}" | tee /tmp/shard/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/shard/audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-assembly-shard-${{ matrix.group }}
          path: /tmp/shard/
          retention-days: 14
          if-no-files-found: error
  assembly_compose:
    needs: assembly_shards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision || github.sha }}
      - name: Reconstruct canonical coverage sources
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw42-assembly-generated
          path: im-results/agent32-raw42/generated-assembly/
      - uses: actions/download-artifact@v4
        with:
          pattern: raw42-assembly-shard-*
          path: /tmp/shards
      - name: Check full exact first-transition Cover
        env:
          BRANCH: ${{ inputs.assembly_branch }}
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42/generated-assembly
          python im-results/agent4-raw109/merge_shards.py /tmp/shards /tmp/merged "$d/shards.json"
          mkdir -p /tmp/final
          B=100006; if [ "$BRANCH" = 0RA ] || [ "$BRANCH" = 0RB ]; then B=1006; fi
          th="BB6.Agent32Raw42${BRANCH}.Closed.cover"
          python tools/lean_compile_closure.py --workdir /tmp/final --jobs 1 --source-root "$d" --override FastBiDFA=im-results/agent32-raw42/FastBiDFA.lean --precompiled-manifest /tmp/merged/manifest.json --precompiled-dir /tmp/merged --manifest /tmp/final/manifest.json --artifact-name "raw42-certified-$BRANCH" --theorem "$th" --parent-table "1RB---_1RC${BRANCH}_0RD---_1LD0LB_------_------" --weighted-bound "$B" "$d/Raw42${BRANCH}ClosedCover.lean" | tee /tmp/final/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/final/audit.log
          python im-results/agent32-raw59/check_axioms.py /tmp/final/audit.log "$th"
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-certified-${{ inputs.assembly_branch }}
          path: /tmp/final/
          retention-days: 30
          if-no-files-found: error
  block:
    if: inputs.variant == 'block'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        branch: [0LA, 0LE, 0RE, 1LA, 1LB, 1LC, 1LE, 1RA, 1RE]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_revision || github.sha }}
      - name: Reconstruct canonical coverage sources
        run: python im-results/agent13-coverage/unpack.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45675872170
          name: raw59-checked-Upgrade0LE
          path: /tmp/core-old
      - name: Generate and source-check isolated block-FAR certificates
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          set -euo pipefail
          d=im-results/agent32-raw42
          g="$d/generated-block"
          mkdir -p /tmp/block
          python "$d/emit_block42.py" . "$g" "$BRANCH" | tee /tmp/block/generate.log
          mapfile -t roots < <(sed -n 's/^ROOTS //p' /tmp/block/generate.log | tr ' ' '\n')
          for i in "${!roots[@]}"; do roots[i]="$g/${roots[i]}.lean"; done
          test "${#roots[@]}" -gt 0
          python tools/lean_compile_closure.py --workdir /tmp/block --jobs 2 --source-root "$g" --precompiled-manifest /tmp/core-old/manifest.json --precompiled-dir /tmp/core-old --manifest /tmp/block/manifest.json --artifact-name "raw42-block-$BRANCH" "${roots[@]}" | tee /tmp/block/audit.log
          ! grep -Eq 'sorryAx|native_decide' /tmp/block/audit.log
          python - "$BRANCH" /tmp/block/audit.log <<'PY'
          import json,sys
          from pathlib import Path
          b,log=sys.argv[1:]
          s=Path(log).read_text()
          rows=[x for x in json.loads(Path('im-results/agent32-raw42/block42_witnesses.json').read_text()) if x['branch']==b]
          for x in rows:
              assert f"'BB6.Agent32Raw42{b}.Block.Leaf{x['id']}.live' depends on axioms:" in s,x
          print('Accepted',len(rows),'block witnesses in',b)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw42-block-${{ matrix.branch }}
          path: /tmp/block/
          retention-days: 30
          if-no-files-found: error
