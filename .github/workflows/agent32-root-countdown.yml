name: Agent 32 Root Countdown Sweep

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct pinned #85 source module and pin Lean
        run: |
          python -m pip install filelock
          python im-results/agent2-unpack-proof.py
          printf 'leanprover/lean4:v4.36.0-rc2\n' > lean-toolchain

      - name: Install pinned Lean using elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Append root countdown sweep inside source namespace
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path("im-results/agent2-cryptid-proof.lean")
          append = Path("im-results/agent12-cryptid-root-invariant/RootCountdownSweep.append.lean")
          lines = source.read_text().splitlines()
          while lines and not lines[-1].strip():
              lines.pop()
          closings = []
          while lines and lines[-1].strip().startswith("end"):
              closings.append(lines.pop())
          lines.extend(["", "open _root_.BusyBeaver", "open _root_.BusyBeaver.BB6.Accelerations.M_1RBHHH_0RC0RE_1RD1RF_1LE0LB_1RC0LD_1RC1RA", ""] + append.read_text().splitlines() + [""])
          lines.extend(reversed(closings))
          source.write_text("\n".join(lines) + "\n")
          PY
          tail -n 12 im-results/agent2-cryptid-proof.lean
      - name: Compile and audit root countdown theorems
        shell: bash
        run: |
          set -euo pipefail
          lean im-results/agent2-cryptid-proof.lean 2>&1 | tee /tmp/root-countdown-lean.log
          tail -n 30 /tmp/root-countdown-lean.log
          if tail -n 30 /tmp/root-countdown-lean.log | grep -q 'sorryAx'; then
            echo "Root countdown theorem depends on sorryAx" >&2
            exit 1
          fi
