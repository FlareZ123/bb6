          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: raw59-checked-*
          path: /tmp/raw59-shards
      - name: Compose independently source-checked branch modules
        run: |
          set -euo pipefail
          mkdir -p /tmp/raw59-combined
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('/tmp/raw59-shards')
          out = Path('/tmp/raw59-combined')
          for f in sorted(root.rglob('*.olean')):
              dst = out / f.name
              if dst.exists():
                  assert f.read_bytes() == dst.read_bytes(), f'incompatible duplicate {f}'
              else:
                  shutil.copyfile(f, dst)
          PY
          LEAN_PATH=/tmp/raw59-combined lean im-results/agent32-raw59/Raw59CanonicalAll.lean | tee /tmp/raw59-combined.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw59-combined.log; then exit 1; fi

