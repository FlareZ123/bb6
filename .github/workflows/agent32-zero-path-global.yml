name: Agent 32 global zero-prefix frontier (manual)

on:
  workflow_dispatch:
    inputs:
      evaluate_mass:
        description: 'Run expensive interpreted exact combined-frontier mass report'
        required: false
        type: boolean
        default: false
      evaluate_lasso_mass:
        description: 'Evaluate the depth-three and depth-four physical lasso frontier reports'
        required: false
        type: boolean
        default: false
      evaluate_word_lasso_mass:
        description: 'Evaluate the depth-three and depth-four finite-word-augmented lasso frontier reports'
        required: false
        type: boolean
        default: false
      scan_holdouts:
        description: 'Screen the 663 normalized holdouts for short exact lassos and fresh-ray entry macros'
        required: false
        type: boolean
        default: false
      prove_lasso_mass:
        description: 'Use native_decide to prove the depth-three and depth-four report equalities'
        required: false
        type: boolean
        default: false
      evaluate_strong_lasso:
        description: 'Evaluate a depth-three frontier with larger lasso and entry-macro limits'
        required: false
        type: boolean
        default: false
      export_frontier:
        description: 'Export exact depth-four residual cylinders and root-preserving symmetry classes'
        required: false
        type: boolean
        default: false
      verify_leaf_graft:
        description: 'Compile and axiom-audit the two-mark finite-word graft into the existing depth-four physical frontier'
        required: false
        type: boolean
        default: false
      verify_five_slot_leaf_graft:
        description: 'Compile, axiom-audit, and kernel-check the exact five-slot grafted frontier report'
        required: false
        type: boolean
        default: false
      verify_three_slot_family:
        description: 'Compile and axiom-audit the 80-member family graft and exact combined report, then screen pinned hard roots with the accepted five-slot leaf'
        required: false
        type: boolean
        default: false
      verify_p4_frontier_graft:
        description: 'Compile and axiom-audit the P4 exact-lasso and fresh-ray child certificates and exact report deltas'
        required: false
        type: boolean
        default: false

      verify_raw59:
        description: 'Verify raw59 exact A1 child refinement'
        required: false
        type: boolean
        default: false
      raw59_child:
        description: Raw59 proof target (all, 0RB, 0LD, 0RC, 1RC, 0RF, 1LA, RCShared, RFCount, or RFTriple)
        type: choice
        options: [all, 0RB, 0LD, 0RC, 1RC, 0RF, 1LA, RCShared, RFCount, RFTriple, RFScan, 1RF, CanonicalPilot, 0RD, 1LC, 1RB, 1RD, 0LC, 0RE]
        default: all

      verify_f418_return:
        description: 'Check the complete F418 normal and recovery return-map theorem chain only'
        required: false
        type: boolean
        default: false

      verify_far:
        description: 'Compile the proof-carrying FAR extension and evaluate its depth-four report'
        required: false
        type: boolean
        default: false

      canonical_depth:
        description: 'If verify_far, use canonical audit at this depth (0 = old raw depth-four report)'
        required: false
        type: number
        default: 0

      canonical_fast:
        description: 'Use branch-first canonical audit with single-trace candidate discovery'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  source-proof:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.verify_far && !inputs.verify_f418_return && !inputs.verify_raw59 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check authentic six-state sparse semantics and zero-path frontier
        run: |
          set -eu
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider"
          lean -o im-results/agent8-coverage-contract/Frontier.olean im-results/agent8-coverage-contract/Frontier.lean
          for m in RayClosed RayChecker RayEntry RayFinite RayTurnExample RayFiniteOracle FiniteHalting; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          lean -o im-results/agent8-coverage-contract/Symmetry.olean im-results/agent8-coverage-contract/Symmetry.lean
          lean -o im-results/agent6-fresh-glider/RayMacro.olean im-results/agent6-fresh-glider/RayMacro.lean
          lean -o im-results/agent6-fresh-glider/EntryMacroOracle.olean im-results/agent6-fresh-glider/EntryMacroOracle.lean
          lean -o im-results/agent6-fresh-glider/EntryMacroLeft.olean im-results/agent6-fresh-glider/EntryMacroLeft.lean
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.verify_three_slot_family }}" != "true" && ( "${{ inputs.verify_five_slot_leaf_graft }}" != "true" || "${{ inputs.verify_leaf_graft }}" == "true" ) && "${{ inputs.verify_p4_frontier_graft }}" != "true" ]]; then
            lean -o im-results/agent6-fresh-glider/MarkerTailExample.olean im-results/agent6-fresh-glider/MarkerTailExample.lean
            lean -o im-results/agent6-fresh-glider/MarkerOracle.olean im-results/agent6-fresh-glider/MarkerOracle.lean
            lean -o im-results/agent6-fresh-glider/MarkerMirror.olean im-results/agent6-fresh-glider/MarkerMirror.lean
            lean -o im-results/agent6-fresh-glider/WordOracle.olean im-results/agent6-fresh-glider/WordOracle.lean
            lean -o im-results/agent6-fresh-glider/WordMirror.olean im-results/agent6-fresh-glider/WordMirror.lean
          fi
          lean -o im-results/agent44-drift-closure/DirectedDrift.olean im-results/agent44-drift-closure/DirectedDrift.lean
          for m in ZeroMaskOracle FiniteDecision; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          lean -o im-results/agent4-coverage-smoke/FrontierAudit.olean im-results/agent4-coverage-smoke/FrontierAudit.lean
          lean -o im-results/agent4-coverage-smoke/FrontierMass.olean im-results/agent4-coverage-smoke/FrontierMass.lean
          lean -o im-results/agent32-zero-prefix-global/ZeroPathAudit.olean im-results/agent32-zero-prefix-global/ZeroPathAudit.lean
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.export_frontier }}" != "true" && "${{ inputs.verify_leaf_graft }}" != "true" && "${{ inputs.verify_five_slot_leaf_graft }}" != "true" && "${{ inputs.verify_three_slot_family }}" != "true" && "${{ inputs.verify_p4_frontier_graft }}" != "true" ]]; then
            lean im-results/agent32-zero-prefix-global/ZeroPathMassEval.lean
          fi
          lean -o im-results/agent32-zero-prefix-global/ControlPathAudit.olean im-results/agent32-zero-prefix-global/ControlPathAudit.lean
          lean -o im-results/agent32-zero-prefix-global/ZeroRowAudit.olean im-results/agent32-zero-prefix-global/ZeroRowAudit.lean
          lean -o im-results/agent32-zero-prefix-global/PhysicalTraceAudit.olean im-results/agent32-zero-prefix-global/PhysicalTraceAudit.lean
          lean -o im-results/agent32-zero-prefix-global/FiniteLassoOracle.olean im-results/agent32-zero-prefix-global/FiniteLassoOracle.lean
          lean -o im-results/agent32-zero-prefix-global/LassoTraceAudit.olean im-results/agent32-zero-prefix-global/LassoTraceAudit.lean
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.verify_three_slot_family }}" != "true" && ( "${{ inputs.verify_five_slot_leaf_graft }}" != "true" || "${{ inputs.verify_leaf_graft }}" == "true" ) && "${{ inputs.verify_p4_frontier_graft }}" != "true" ]]; then
            lean -o im-results/agent32-zero-prefix-global/WordLassoTraceAudit.olean im-results/agent32-zero-prefix-global/WordLassoTraceAudit.lean
          fi
          lean im-results/agent32-zero-prefix-global/ReadOneLeaf.lean
      - name: Verify exact two-mark finite-word leaf graft (explicitly requested only)
        if: ${{ inputs.verify_leaf_graft }}
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider"
          lean -o im-results/agent8-coverage-contract/IncrementalAudit.olean im-results/agent8-coverage-contract/IncrementalAudit.lean
          lean im-results/agent32-zero-prefix-global/WordLassoLeafGraft.lean | tee /tmp/bb6-two-mark-leaf-graft.log
          if grep -q 'sorryAx' /tmp/bb6-two-mark-leaf-graft.log; then
            echo "ERROR: two-mark leaf graft proof graph depends on sorryAx"
            exit 1
          fi
      - name: Verify five-slot translated finite-support leaf graft (explicitly requested only)
        if: ${{ inputs.verify_five_slot_leaf_graft && !inputs.verify_leaf_graft }}
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider:im-results/agent24-translated-cycle:im-results/agent27-translated-five-slot"
          lean -o im-results/agent8-coverage-contract/RootShift.olean im-results/agent8-coverage-contract/RootShift.lean
          lean -o im-results/agent24-translated-cycle/TranslatedCycle.olean im-results/agent24-translated-cycle/TranslatedCycle.lean
          lean -o im-results/agent24-translated-cycle/TranslatedFiniteOracle.olean im-results/agent24-translated-cycle/TranslatedFiniteOracle.lean
          # FiveSlotLeafGraft defines the same physical-audit expression directly.
          # The terminal manifest and its expensive #eval export are an independent
          # reporting path, not dependencies of this isolated proof gate.
          lean -o im-results/agent8-coverage-contract/IncrementalAudit.olean im-results/agent8-coverage-contract/IncrementalAudit.lean
          lean -o im-results/agent27-translated-five-slot/TranslatedFiveSlot.olean im-results/agent27-translated-five-slot/TranslatedFiveSlot.lean
          lean -o im-results/agent32-zero-prefix-global/FiveSlotLeafGraft.olean im-results/agent32-zero-prefix-global/FiveSlotLeafGraft.lean | tee /tmp/bb6-five-slot-leaf-graft.log
          if grep -q 'sorryAx' /tmp/bb6-five-slot-leaf-graft.log; then
            echo "ERROR: five-slot leaf graft proof graph depends on sorryAx"
            exit 1
          fi
          lean -o im-results/agent32-zero-prefix-global/FiveSlotLeafGraftReport.olean im-results/agent32-zero-prefix-global/FiveSlotLeafGraftReport.lean | tee /tmp/bb6-five-slot-leaf-graft-report.log
          if grep -q 'sorryAx' /tmp/bb6-five-slot-leaf-graft-report.log; then
            echo "ERROR: five-slot graft report proof depends on sorryAx"
            exit 1
          fi
      - name: Verify the 80-member three-slot translated family graft (explicitly requested only)
        if: ${{ inputs.verify_three_slot_family }}
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider:im-results/agent24-translated-cycle:im-results/agent27-translated-five-slot:im-results/agent27-three-slot-translated"
          {
            lean -o im-results/agent8-coverage-contract/RootShift.olean im-results/agent8-coverage-contract/RootShift.lean
            lean -o im-results/agent24-translated-cycle/TranslatedCycle.olean im-results/agent24-translated-cycle/TranslatedCycle.lean
            lean -o im-results/agent24-translated-cycle/TranslatedFiniteOracle.olean im-results/agent24-translated-cycle/TranslatedFiniteOracle.lean
            lean -o im-results/agent8-coverage-contract/IncrementalAudit.olean im-results/agent8-coverage-contract/IncrementalAudit.lean
            lean -o im-results/agent27-translated-five-slot/TranslatedFiveSlot.olean im-results/agent27-translated-five-slot/TranslatedFiveSlot.lean
            lean -o im-results/agent32-zero-prefix-global/FiveSlotLeafGraft.olean im-results/agent32-zero-prefix-global/FiveSlotLeafGraft.lean
            lean -o im-results/agent27-three-slot-translated/TranslatedThreeSlotFamilies.olean im-results/agent27-three-slot-translated/TranslatedThreeSlotFamilies.lean
            lean -o im-results/agent27-three-slot-translated/ThreeSlotFamilyLeafOpen.olean im-results/agent27-three-slot-translated/ThreeSlotFamilyLeafOpen.lean
            lean -o im-results/agent27-three-slot-translated/CertificateBatch.olean im-results/agent27-three-slot-translated/CertificateBatch.lean
            lean -o im-results/agent27-three-slot-translated/ThreeSlotFamilyGraft.olean im-results/agent27-three-slot-translated/ThreeSlotFamilyGraft.lean
            lean -o im-results/agent27-three-slot-translated/ThreeSlotFamilyGraftReport.olean im-results/agent27-three-slot-translated/ThreeSlotFamilyGraftReport.lean
          } 2>&1 | tee /tmp/bb6-three-slot-family-graft.log
          if grep -q 'sorryAx' /tmp/bb6-three-slot-family-graft.log; then
            echo "ERROR: three-slot family graft proof graph depends on sorryAx"
            exit 1
          fi
      - name: Compare the 80 family members with pinned historical hard-root rosters
        if: ${{ inputs.verify_three_slot_family }}
        run: |
          set -euo pipefail
          node im-results/agent27-three-slot-translated/compare_family_hard_roots.cjs
      - name: Verify P4 exact-lasso and fresh-ray frontier grafts
        if: ${{ inputs.verify_p4_frontier_graft }}
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider:im-results/agent24-translated-cycle:im-results/agent27-translated-five-slot:im-results/agent48-p4-zeroLD"
          # Rebuild the accepted five-slot source adapter imported by P4ZeroLDCycle.
          lean -o im-results/agent8-coverage-contract/RootShift.olean im-results/agent8-coverage-contract/RootShift.lean
          lean -o im-results/agent24-translated-cycle/TranslatedCycle.olean im-results/agent24-translated-cycle/TranslatedCycle.lean
          lean -o im-results/agent24-translated-cycle/TranslatedFiniteOracle.olean im-results/agent24-translated-cycle/TranslatedFiniteOracle.lean
          lean -o im-results/agent8-coverage-contract/IncrementalAudit.olean im-results/agent8-coverage-contract/IncrementalAudit.lean
          lean -o im-results/agent27-translated-five-slot/TranslatedFiveSlot.olean im-results/agent27-translated-five-slot/TranslatedFiveSlot.lean
          lean -o im-results/agent32-zero-prefix-global/FiveSlotLeafGraft.olean im-results/agent32-zero-prefix-global/FiveSlotLeafGraft.lean
          mkdir -p /tmp/bb6-p4-frontier-graft
          : > /tmp/bb6-p4-frontier-graft/lean.log
          for m in P4ZeroLDCycle P4EightChildGraft P4DeeperFreshRay P4DeeperFreshRayReport P4ZeroRDDeeperGraft P4ZeroRDDeeperGraftReport; do
            lean -o "im-results/agent48-p4-zeroLD/$m.olean" "im-results/agent48-p4-zeroLD/$m.lean" 2>&1 | tee -a /tmp/bb6-p4-frontier-graft/lean.log
          done
          python3 - <<'PY'
          import pathlib
          log = pathlib.Path("/tmp/bb6-p4-frontier-graft/lean.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "agent48P4ZeroLD_cover",
              "agent48P4ZeroRE_cover",
              "agent48P4OneRE_cover",
              "agent48P4OneRB_cover",
              "agent48P4ZeroRA_cover",
              "agent48P4OneRA_cover",
              "agent48P4Halt_cover",
              "agent48P4ZeroLC_D0ZeroLD_cover",
              "agent48P4ZeroLC_D0ZeroLA_cover",
              "agent48P4ZeroLC_D0ZeroRA_cover",
              "agent48P4ZeroLC_D0OneRA_cover",
              "agent48P4ZeroLC_D0OneRB_cover",
              "agent48P4ZeroLC_D0ZeroRD_cover",
              "agent48P4ZeroLC_D0OneRD_cover",
              "agent48P4ZeroLC_D0OneRE_cover",
              "agent48P4ZeroLC_D0OneLD_cover",
              "agent48P4ZeroRD_D0ZeroRD_cover",
              "agent48P4ZeroRD_D0OneRD_cover",
              "agent48P4ZeroRD_D0OneRE_cover",
              "agent48P4ZeroRD_D0ZeroRA_cover",
              "agent48P4ZeroRD_D0OneRA_cover",
              "agent48P4ZeroRD_D0OneRB_cover",
              "agent48P4ZeroRD_D0ZeroLB_cover",
              "agent48P4ZeroRD_D0ZeroLE_cover",
              "agent48P4ZeroRD_D0Halt_cover",
              "agent48P4ZeroRD_D0ZeroLD_cover",
              "agent48P4ZeroRD_D0ZeroRE_cover",
              "agent48P4DeeperAudit_report",
              "agent48P4DeeperAudit_mass_conservation",
              "agent48P4ZeroRDDeeperAudit_report",
              "agent48P4ZeroRDDeeperAudit_mass_conservation",
          )
          for name in names:
              profiles = []
              for line in log.splitlines():
                  if " depends on axioms:" in line:
                      lhs, profile = line.split(" depends on axioms:", 1)
                      symbol = lhs.strip().strip("'").split(".")[-1].strip().strip("'")
                      if symbol == name:
                          profiles.append(profile.strip())
                  elif " does not depend on any axioms" in line:
                      lhs = line.split(" does not depend on any axioms", 1)[0]
                      symbol = lhs.strip().strip("'").split(".")[-1].strip().strip("'")
                      if symbol == name:
                          profiles.append("[]")
              if len(profiles) != 1:
                  raise SystemExit(f"expected exactly one axiom profile for {name}, got {len(profiles)}")
              profile = profiles[0]
              if not (profile.startswith("[") and profile.endswith("]")):
                  raise SystemExit(f"unrecognized axiom profile for {name}: {profile}")
              axioms = {x.strip() for x in profile[1:-1].split(",") if x.strip()}
              bad = axioms - allowed
              if bad:
                  raise SystemExit(f"nonstandard axioms in {name}: {sorted(bad)}")
              if "sorryAx" in axioms:
                  raise SystemExit(f"sorryAx in {name}")
              print(f"{name}: {sorted(axioms)}")
          PY
          if grep -R -n 'native_decide' im-results/agent48-p4-zeroLD --include='*.lean'; then
            echo '::error::native_decide found in the P4 source closure'
            exit 1
          fi
      - name: Upload P4 frontier-graft proof log
        if: ${{ always() && inputs.verify_p4_frontier_graft }}
        uses: actions/upload-artifact@v4
        with:
          name: bb6-p4-frontier-graft-source-audit
          path: /tmp/bb6-p4-frontier-graft/
          if-no-files-found: ignore
          retention-days: 7
      - name: Independently exhaust the six read-zero rows
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.export_frontier && !inputs.verify_leaf_graft && !inputs.verify_five_slot_leaf_graft && !inputs.verify_three_slot_family && !inputs.verify_p4_frontier_graft }}
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror im-results/agent32-zero-prefix-global/check-all.cpp -o /tmp/zero-prefix-check
          /tmp/zero-prefix-check
          g++ -O3 -std=c++17 -Wall -Wextra -Werror im-results/agent32-zero-prefix-global/check-union.cpp -o /tmp/zero-union-check
          /tmp/zero-union-check
          g++ -O3 -std=c++17 -Wall -Wextra -Werror im-results/agent32-zero-prefix-global/check-six-rows.cpp -o /tmp/zero-six-check
          /tmp/zero-six-check
      - name: Evaluate exact combined frontier mass (explicitly requested only)
        if: ${{ inputs.evaluate_mass }}
        run: |
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider"
          lean im-results/agent32-zero-prefix-global/ControlPathMassEval.lean
      - name: Evaluate depth-three and depth-four physical lasso frontier mass (explicitly requested only)
        if: ${{ inputs.evaluate_lasso_mass }}
        run: |
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider"
          lean im-results/agent32-zero-prefix-global/LassoTraceMassEval.lean
      - name: Evaluate finite-word-augmented depth-three and depth-four lasso frontier mass (explicitly requested only)
        if: ${{ inputs.evaluate_word_lasso_mass }}
        run: |
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider"
          lean im-results/agent32-zero-prefix-global/WordLassoTraceMassEval.lean
      - name: Screen the normalized 663 holdouts (explicitly requested only)
        if: ${{ inputs.scan_holdouts }}
        run: |
          node im-results/agent32-zero-prefix-global/scan-holdout-lasso.cjs --self-test
          node im-results/agent32-zero-prefix-global/scan-holdout-lasso.cjs
      - name: Prove depth-three and depth-four frontier report counts (explicitly requested only)
        if: ${{ inputs.prove_lasso_mass }}
        run: |
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider"
          lean -o im-results/agent32-zero-prefix-global/LassoTraceMassProof.olean im-results/agent32-zero-prefix-global/LassoTraceMassProof.lean
      - name: Evaluate stronger depth-three lasso and entry-macro limits (explicitly requested only)
        if: ${{ inputs.evaluate_strong_lasso }}
        run: |
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider"
          lean im-results/agent32-zero-prefix-global/LassoTraceStrongEval.lean

      - name: Export exact depth-four residual frontier and root-preserving symmetry classes (explicitly requested only)
        if: ${{ inputs.export_frontier }}
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider"
          lean -o im-results/agent4-coverage-smoke/FrontierExtract.olean im-results/agent4-coverage-smoke/FrontierExtract.lean
          lean -o im-results/agent4-coverage-smoke/FrontierUnique.olean im-results/agent4-coverage-smoke/FrontierUnique.lean
          lean -o im-results/agent4-coverage-smoke/FrontierManifestMass.olean im-results/agent4-coverage-smoke/FrontierManifestMass.lean
          lean -o im-results/agent32-zero-prefix-global/ResidualFrontierManifest.olean im-results/agent32-zero-prefix-global/ResidualFrontierManifest.lean
          lean im-results/agent32-zero-prefix-global/ResidualFrontierExport.lean | tee /tmp/bb6-residual-frontier-lean.log
          if grep -q 'sorryAx' /tmp/bb6-residual-frontier-lean.log; then
            echo "ERROR: residual-frontier proof graph depends on sorryAx"
            exit 1
          fi
          python -m py_compile im-results/agent32-zero-prefix-global/canonicalize_residual_frontier.py
          python im-results/agent32-zero-prefix-global/canonicalize_residual_frontier.py /tmp/bb6-depth4-frontier.tsv /tmp/bb6-depth4-frontier-report.txt /tmp/bb6-depth4-frontier
          gzip -9 /tmp/bb6-depth4-frontier.jsonl
          gzip -9 /tmp/bb6-depth4-frontier-summary.json
          ls -lh /tmp/bb6-depth4-frontier.jsonl.gz /tmp/bb6-depth4-frontier-summary.json.gz
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.export_frontier }}
        with:
          name: bb6-depth4-residual-frontier
          path: |
            /tmp/bb6-depth4-frontier.jsonl.gz
            /tmp/bb6-depth4-frontier-summary.json.gz
          retention-days: 30

  fresh-ray-entry-proof:
