  raw59-refinement:
    if: ${{ inputs.verify_raw59 }}
    strategy:
      fail-fast: false
      matrix:
        child: ${{ fromJSON(inputs.raw59_child == 'CanonicalAll' && '["0RB","0LD","1RC","0RC","0RF","1LA","1RF","0RD","1LC","1RB","1RD","0LC","0RE","CanonicalBase"]' || (inputs.raw59_child == 'UpgradeAll' && '["Upgrade0LA","Upgrade0LB","Upgrade0LE","Upgrade0LF","Upgrade1LB","Upgrade1LE","Upgrade1LF","ClosedBase"]' || inputs.raw59_child == 'AsymAll' && '["Asym0LB","Asym1LB","Asym1LE"]' || inputs.raw59_child == 'PartialAll' && '["Partial0LA","Partial0LB","Partial0LE","Partial0LF","Partial1LB","Partial1LE","Partial1LF"]' || format('["{0}"]', inputs.raw59_child))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate and check raw59 retained-child refinement
        env:
          RAW59_CHILD: ${{ matrix.child }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent32-raw59/unpack_rc.py
          case "$RAW59_CHILD" in
            Asym0LB|Asym1LB|Asym1LE)
              child="${RAW59_CHILD#Asym}"
              python im-results/agent32-raw59/generate_asym.py "im-results/agent32-raw59/asym_$child" "$child"
              target="im-results/agent32-raw59/asym_$child/Raw59Asym$child.lean" ;;
            Upgrade0LA|Upgrade0LB|Upgrade0LE|Upgrade0LF|Upgrade1LB|Upgrade1LE|Upgrade1LF)
              python im-results/agent32-macro-far/unpack.py
              child="${RAW59_CHILD#Upgrade}"
              python im-results/agent32-raw59/generate_partial.py --upgrade "$child"
              target="im-results/agent32-raw59/upgrade_$child/Raw59Upgrade${child}Data.lean" ;;
            Partial0LA|Partial0LB|Partial0LE|Partial0LF|Partial1LB|Partial1LE|Partial1LF)
              python im-results/agent32-macro-far/unpack.py
              child="${RAW59_CHILD#Partial}"
              python im-results/agent32-raw59/generate_partial.py "$child"
              target="im-results/agent32-raw59/partial_$child/Raw59Partial${child}Data.lean" ;;
            ReturnFamily)
              python im-results/agent32-macro-far/unpack.py
              python im-results/agent32-macro-far/unpack_return.py
              python im-results/agent32-macro-far/unpack_family.py
              target=im-results/agent32-macro-far/Raw59ReturnFamily.lean ;;
            Return1582)
              python im-results/agent32-macro-far/unpack.py
              python im-results/agent32-macro-far/unpack_return.py
              target=im-results/agent32-macro-far/Raw59Return1582.lean ;;
            MacroFARPilot)
              python im-results/agent32-macro-far/unpack.py
              python im-results/agent32-macro-far/emit_source.py im-results/agent32-macro-far/pilot.txt im-results/agent32-macro-far/MacroFARPilot.lean
              target=im-results/agent32-macro-far/MacroFARPilot.lean ;;
            ClosedBase)
              python im-results/agent32-raw59/generate.py 0RB 0LD 1RC 0RC 0RF 1LA 1RF 0RD 1LC 1RB 1RD 0LC 0RE
              target=im-results/agent32-raw59/Raw59ClosedBranches.lean ;;
            CanonicalPilot|CanonicalBase)
              python im-results/agent10-tnf-raw87/generate.py
              python im-results/agent10-tnf-raw91/generate.py
              python im-results/agent10-tnf-multipump/generate.py 66 70 80
              python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
              python im-results/agent10-tnf-multipump/generate.py 68 72 82
              if [[ "$RAW59_CHILD" == CanonicalBase ]]; then
                target=im-results/agent32-raw59/Raw59CanonicalPartition.lean
              else
                python im-results/agent32-raw59/generate.py 0RB
                target=im-results/agent32-raw59/Raw59CanonicalPilot.lean
              fi ;;
            Late190) python im-results/agent32-raw59/generate_late190.py; target=im-results/agent32-raw59/Raw590LB190Data.lean ;;
            OffsetPilot) (cd im-results/agent32-raw59 && python -c 'from generate_lb1_four import main; main("0LA", override={215:("1RB0LA_1RC1RF_0RD0RB_1LD1RE_---1LA_1RB0LE",4,2,2,5,1)})'); target=im-results/agent32-raw59/Raw590LABlock215.lean ;;
            Width2Pilot) (cd im-results/agent32-raw59 && python -c 'from generate_lb1_four import main,CASES; main("1LB", override={194:CASES[194]})'); target=im-results/agent32-raw59/Raw59LB1Block194.lean ;;
            LB1Four) python im-results/agent32-raw59/generate_lb1_four.py; target=im-results/agent32-raw59/Raw59LB1Four.lean ;;
            LB1Sweep583) target=im-results/agent32-raw59/Raw59LB1Sweep583.lean ;;
            LB1Sweep1734) target=im-results/agent32-raw59/Raw59LB1Sweep1734.lean ;;
            RFScan) target=im-results/agent32-raw59/Raw59RFScan.lean ;;
            RFTriple) target=im-results/agent32-raw59/Raw59RFTriple.lean ;;
            RFCount) target=im-results/agent32-raw59/Raw59RFCounters.lean ;;
            RCShared) target=im-results/agent32-raw59/Raw59RCBridge.lean ;;
            all) python im-results/agent32-raw59/generate.py; target=im-results/agent32-raw59/Raw59Refinement.lean ;;
            0RB|0LD|0RC|1RC|0RF|1LA|1RF|0RD|1LC|1RB|1RD|0LC|0RE) python im-results/agent32-raw59/generate.py "$RAW59_CHILD"; target="im-results/agent32-raw59/generated_$RAW59_CHILD/Raw59A${RAW59_CHILD}Data.lean" ;;
            *) exit 2 ;;
          esac
          extra=()
          case "$RAW59_CHILD" in
            Upgrade*)
              child="${RAW59_CHILD#Upgrade}"
              claim="BB6.Agent32Raw59Upgrade${child}.bound"
              extra=(--manifest /tmp/a32-raw59/manifest.json --artifact-name "raw59-checked-$RAW59_CHILD" --theorem "$claim")
              ;;
            ClosedBase)
              claim=BB6.Agent32Raw59CanonicalAll.closed_sound
              extra=(--manifest /tmp/a32-raw59/manifest.json --artifact-name "raw59-checked-$RAW59_CHILD" --theorem "$claim")
              ;;
          esac
          python tools/lean_compile_closure.py --workdir /tmp/a32-raw59 --jobs 4 "${extra[@]}" "$target" | tee /tmp/a32-raw59.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a32-raw59.log; then exit 1; fi
          if [[ "${#extra[@]}" -gt 0 ]]; then
            if [[ "$RAW59_CHILD" == Upgrade* ]]; then
              residual="im-results/agent32-raw59/upgrade_$child/residual.txt"
              test -f "$residual" && test ! -s "$residual"
            fi
            python im-results/agent32-raw59/check_axioms.py /tmp/a32-raw59.log "$claim"
            cp /tmp/a32-raw59.log /tmp/a32-raw59/audit.log
          fi

      - name: Preserve exact unresolved source tables
        if: ${{ startsWith(matrix.child, 'Partial') || startsWith(matrix.child, 'Upgrade') }}
        uses: actions/upload-artifact@v4
        with:
          name: raw59-residual-${{ matrix.child }}
          path: |
            im-results/agent32-raw59/partial_*/residual.txt
            im-results/agent32-raw59/upgrade_*/residual.txt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve checked modules for parent composition
        if: ${{ inputs.raw59_child == 'UpgradeAll' }}
        uses: actions/upload-artifact@v4
        with:
          name: raw59-checked-${{ matrix.child }}
          path: |
            /tmp/a32-raw59/*.lean
            /tmp/a32-raw59/*.olean
            /tmp/a32-raw59/manifest.json
            /tmp/a32-raw59/audit.log
          if-no-files-found: error
          retention-days: 7
      - name: Preserve checked modules for canonical composition
        if: ${{ inputs.raw59_child == 'CanonicalAll' }}
        uses: actions/upload-artifact@v4
        with:
          name: raw59-checked-${{ matrix.child }}
          path: /tmp/a32-raw59/*.olean
          if-no-files-found: error
          retention-days: 7

  raw59-canonical-composition:
