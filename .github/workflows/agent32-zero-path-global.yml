  far-proof:
    if: ${{ inputs.verify_far && !inputs.verify_f418_return && !inputs.verify_raw59 }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original-source FAR certificate and frontier
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py --workdir /tmp/a7-far --jobs 8 \
            im-results/agent7-far/FARExample.lean \
            im-results/agent7-far/FARFrontier.lean \
            im-results/agent7-far/CanonicalSearch.lean \
            im-results/agent7-far/FastCanonical.lean 2>&1 | tee /tmp/a7-far.log
          if grep -qE 'sorryAx|native_decide' /tmp/a7-far.log; then
            echo 'ERROR: unexpected axiom in FAR closure'
            exit 1
          fi
      - name: Evaluate proof-carrying frontier mass
        run: |
          set -euo pipefail
          export LEAN_PATH=/tmp/a7-far
          if [[ "${{ inputs.canonical_depth }}" != "0" && -n "${{ inputs.canonical_depth }}" ]]; then
            DEPTH="${{ inputs.canonical_depth }}"
            [[ "$DEPTH" =~ ^[1-9][0-9]*$ ]] && [[ "$DEPTH" -le 12 ]]
            if [[ "${{ inputs.canonical_fast }}" == "true" ]]; then
              printf 'import FastCanonical\nset_option maxRecDepth 100000\nset_option maxHeartbeats 0\n#eval (BB6Coverage.Canonical.fastGlobal 24 6 24 24 2 4 3 %s).report\n' "$DEPTH" > /tmp/a7-far/CanonicalReport.lean
            else
              printf 'import CanonicalSearch\nset_option maxRecDepth 100000\nset_option maxHeartbeats 0\n#eval (BB6Coverage.Canonical.global 24 6 24 24 2 4 3 %s).report\n' "$DEPTH" > /tmp/a7-far/CanonicalReport.lean
            fi
            lean /tmp/a7-far/CanonicalReport.lean | tee /tmp/a7-far-report.log
          else
            lean im-results/agent7-far/FARFrontierReport.lean | tee /tmp/a7-far-report.log
          fi
          cat /tmp/a7-far-report.log >> "$GITHUB_STEP_SUMMARY"

  f418-return-proof:
    if: ${{ inputs.verify_f418_return && !inputs.verify_raw59 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile only the exact F418 arithmetic return dependencies and audit axioms
        run: |
          set -euo pipefail
          cd im-results/agent32-f418-shift-overflow
          export LEAN_PATH=.
          for m in F418Arithmetic F418EventSystem F418Episodes F418ReturnBounds F418NormalReturn F418HighTail F418NormalPath F418SparseGate F418RecoveryCore F418FullReturn F418SignedQueue F418QueueInvariant F418QueueHistory F418FullQueue; do
            lean -o "$m.olean" "$m.lean" 2>&1 | tee -a /tmp/f418-return-proof.log
          done
          if grep -q 'sorryAx' /tmp/f418-return-proof.log; then
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('/tmp/f418-return-proof.log').read_text()
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          matches = re.findall(r"depends on axioms: \[([^\]]*)\]", s, re.S)
          assert matches
          for ax in matches:
              assert {x.strip() for x in ax.split(',') if x.strip()} <= allowed, ax
          assert "seed_none_iff_fatal_pure" in s
          assert "fullQueue_sound" in s
          assert "even_above_debtWidth" in s
          PY

  raw59-refinement:
    if: ${{ inputs.verify_raw59 }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
