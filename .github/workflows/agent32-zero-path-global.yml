name: Agent 32 global zero-prefix frontier (manual)

on:
  workflow_dispatch:
    inputs:
      evaluate_mass:
        description: 'Run expensive interpreted exact combined-frontier mass report'
        required: false
        type: boolean
        default: false
      evaluate_lasso_mass:
        description: 'Evaluate the depth-three and depth-four physical lasso frontier reports'
        required: false
        type: boolean
        default: false
      scan_holdouts:
        description: 'Screen the 663 normalized holdouts for short exact lassos and fresh-ray entry macros'
        required: false
        type: boolean
        default: false
      prove_lasso_mass:
        description: 'Use native_decide to prove the depth-three and depth-four report equalities'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check authentic six-state sparse semantics and zero-path frontier
        run: |
          set -eu
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider"
          lean -o im-results/agent8-coverage-contract/Frontier.olean im-results/agent8-coverage-contract/Frontier.lean
          for m in RayClosed RayChecker RayEntry RayFinite RayTurnExample RayFiniteOracle FiniteHalting; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          lean -o im-results/agent8-coverage-contract/Symmetry.olean im-results/agent8-coverage-contract/Symmetry.lean
          lean -o im-results/agent6-fresh-glider/RayMacro.olean im-results/agent6-fresh-glider/RayMacro.lean
          lean -o im-results/agent6-fresh-glider/EntryMacroOracle.olean im-results/agent6-fresh-glider/EntryMacroOracle.lean
          lean -o im-results/agent6-fresh-glider/EntryMacroLeft.olean im-results/agent6-fresh-glider/EntryMacroLeft.lean
          lean -o im-results/agent44-drift-closure/DirectedDrift.olean im-results/agent44-drift-closure/DirectedDrift.lean
          for m in ZeroMaskOracle FiniteDecision; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          lean -o im-results/agent4-coverage-smoke/FrontierAudit.olean im-results/agent4-coverage-smoke/FrontierAudit.lean
          lean -o im-results/agent4-coverage-smoke/FrontierMass.olean im-results/agent4-coverage-smoke/FrontierMass.lean
          lean -o im-results/agent32-zero-prefix-global/ZeroPathAudit.olean im-results/agent32-zero-prefix-global/ZeroPathAudit.lean
          lean im-results/agent32-zero-prefix-global/ZeroPathMassEval.lean
          lean -o im-results/agent32-zero-prefix-global/ControlPathAudit.olean im-results/agent32-zero-prefix-global/ControlPathAudit.lean
          lean -o im-results/agent32-zero-prefix-global/ZeroRowAudit.olean im-results/agent32-zero-prefix-global/ZeroRowAudit.lean
          lean -o im-results/agent32-zero-prefix-global/PhysicalTraceAudit.olean im-results/agent32-zero-prefix-global/PhysicalTraceAudit.lean
          lean -o im-results/agent32-zero-prefix-global/FiniteLassoOracle.olean im-results/agent32-zero-prefix-global/FiniteLassoOracle.lean
          lean -o im-results/agent32-zero-prefix-global/LassoTraceAudit.olean im-results/agent32-zero-prefix-global/LassoTraceAudit.lean
          lean im-results/agent32-zero-prefix-global/ReadOneLeaf.lean
      - name: Independently exhaust the six read-zero rows
        run: |
          g++ -O3 -std=c++17 -Wall -Wextra -Werror im-results/agent32-zero-prefix-global/check-all.cpp -o /tmp/zero-prefix-check
          /tmp/zero-prefix-check
          g++ -O3 -std=c++17 -Wall -Wextra -Werror im-results/agent32-zero-prefix-global/check-union.cpp -o /tmp/zero-union-check
          /tmp/zero-union-check
          g++ -O3 -std=c++17 -Wall -Wextra -Werror im-results/agent32-zero-prefix-global/check-six-rows.cpp -o /tmp/zero-six-check
          /tmp/zero-six-check
      - name: Evaluate exact combined frontier mass (explicitly requested only)
        if: ${{ inputs.evaluate_mass }}
        run: |
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider"
          lean im-results/agent32-zero-prefix-global/ControlPathMassEval.lean
      - name: Evaluate depth-three and depth-four physical lasso frontier mass (explicitly requested only)
        if: ${{ inputs.evaluate_lasso_mass }}
        run: |
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider"
          lean im-results/agent32-zero-prefix-global/LassoTraceMassEval.lean
      - name: Screen the normalized 663 holdouts (explicitly requested only)
        if: ${{ inputs.scan_holdouts }}
        run: |
          node im-results/agent32-zero-prefix-global/scan-holdout-lasso.cjs --self-test
          node im-results/agent32-zero-prefix-global/scan-holdout-lasso.cjs
      - name: Prove depth-three and depth-four frontier report counts (explicitly requested only)
        if: ${{ inputs.prove_lasso_mass }}
        run: |
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider"
          lean -o im-results/agent32-zero-prefix-global/LassoTraceMassProof.olean im-results/agent32-zero-prefix-global/LassoTraceMassProof.lean

  fresh-ray-entry-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Source-verify all ten turning-ray cylinders and global entry audit
        run: |
          set -eu
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider"
          lean -o im-results/agent8-coverage-contract/Frontier.olean im-results/agent8-coverage-contract/Frontier.lean
          for m in RayClosed RayChecker RayEntry RayFinite RayTurnExample RayFiniteOracle FiniteHalting; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          lean -o im-results/agent44-drift-closure/DirectedDrift.olean im-results/agent44-drift-closure/DirectedDrift.lean
          for m in ZeroMaskOracle FiniteDecision; do
            lean -o "im-results/agent8-coverage-contract/$m.olean" "im-results/agent8-coverage-contract/$m.lean"
          done
          lean -o im-results/agent4-coverage-smoke/FrontierAudit.olean im-results/agent4-coverage-smoke/FrontierAudit.lean
          lean -o im-results/agent4-coverage-smoke/FrontierMass.olean im-results/agent4-coverage-smoke/FrontierMass.lean
          lean -o im-results/agent32-zero-prefix-global/ZeroPathAudit.olean im-results/agent32-zero-prefix-global/ZeroPathAudit.lean
          lean -o im-results/agent32-zero-prefix-global/ControlPathAudit.olean im-results/agent32-zero-prefix-global/ControlPathAudit.lean
          lean -o im-results/agent32-zero-prefix-global/EntryControlAudit.olean im-results/agent32-zero-prefix-global/EntryControlAudit.lean
          lean -o im-results/agent44-drift-closure/PrefixDrift.olean im-results/agent44-drift-closure/PrefixDrift.lean
          lean im-results/agent32-zero-prefix-global/OneTurnSource.lean
          g++ -O3 -std=c++17 -Wall -Wextra -Werror im-results/agent32-zero-prefix-global/check-one-turn.cpp -o /tmp/one-turn-count
          /tmp/one-turn-count
