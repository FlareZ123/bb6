name: Agent 33 Machine B dyadic parity proofs (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the unmodified Agent 18 source and new Agent 33 dyadic certificates
        run: |
          cp im-results/agent18-b-cycle/BReduction.lean Agent18BReduction.lean
          cp im-results/agent18-b-cycle/BOneDim.lean Agent18BOneDim.lean
          lean --version
          lean -o Agent18BReduction.olean Agent18BReduction.lean
          LEAN_PATH=. lean -o Agent18BOneDim.olean Agent18BOneDim.lean
          LEAN_PATH=. lean -o BDyadicCore.olean im-results/agent33-b-dyadic/BDyadicCore.lean
          LEAN_PATH=. lean -o BDyadic.olean im-results/agent33-b-dyadic/BDyadic.lean
          LEAN_PATH=. lean -o BConstantCore.olean im-results/agent33-b-dyadic/BConstantCore.lean
          LEAN_PATH=. lean -o BConstantRuns.olean im-results/agent33-b-dyadic/BConstantRuns.lean
          LEAN_PATH=. lean -o BCodingBalance.olean im-results/agent33-b-dyadic/BCodingBalance.lean
          LEAN_PATH=. lean -o BCodingCore.olean im-results/agent33-b-dyadic/BCodingCore.lean
          LEAN_PATH=. lean im-results/agent33-b-dyadic/BCodingUnique.lean
