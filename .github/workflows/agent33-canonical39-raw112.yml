name: Agent33 Canonical40 to Raw112 successor
run-name: Canonical40 plus Raw112 -> Canonical39

on:
  workflow_dispatch:
    inputs:
      raw112_run_id:
        description: Successful Raw112 parent producer run ID
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  consume:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"

      - name: Audit Canonical40 and consume accepted Raw112 parent
        env:
          GH_TOKEN: ${{ github.token }}
          RAW112_RUN_ID: ${{ inputs.raw112_run_id }}
        run: |
          set -euo pipefail
          [[ "$RAW112_RUN_ID" =~ ^[0-9]+$ ]]
          lean --version | grep -F '4.36.0-rc2'
          python -m py_compile im-results/agent33-raw112-canonical39/assemble.py
          python im-results/agent33-raw112-canonical39/assemble.py \
            --work /tmp/a33-canonical39 \
            --raw112-run-id "$RAW112_RUN_ID" | tee /tmp/a33-canonical39.log
          test -s /tmp/a33-canonical39/canonical39-delta/delta.json
          cat /tmp/a33-canonical39/canonical39-delta/delta.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical39-raw112-thin-delta
          path: |
            /tmp/a33-canonical39/canonical39-delta/**
            /tmp/a33-canonical39.log
          if-no-files-found: error
          compression-level: 1
          retention-days: 30
