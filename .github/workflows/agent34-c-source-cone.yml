name: Agent 34 Machine C new high stopping source cone (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  machine-c-source-cone:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original unmodified source and all-depth cone
        run: |
          mkdir -p /tmp/agent34-source
          cp im-results/agent11-c-line/CLine.lean /tmp/agent34-source/
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/agent34-source/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/agent34-source/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef,FastSectionProof,FastSectionHalting,Agent46CBridge}.lean /tmp/agent34-source/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,EvenTargetForward,BounceEvenExact,BounceOddExact,BounceEvenThree,BounceEvenNoFour,BounceAllExact,SectionAllInverse}.lean /tmp/agent34-source/
          cp im-results/agent38-c-section-mod4/Agent38SectionParity.lean /tmp/agent34-source/
          cp im-results/agent3-c-odd-image/Agent3CImage.lean /tmp/agent34-source/
          cp im-results/agent34-c-degree-profile/{ConeArithmetic,ConeSource,ConeBroadArithmetic,ConeBroadSource,ThreeConeArithmetic,ThreeConeSource}.lean /tmp/agent34-source/
          cd /tmp/agent34-source
          export LEAN_PATH=.
          lean --version
          for f in CLine GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef FastSectionProof FastSectionHalting Agent46CBridge BounceInverse EvenTargetForward BounceEvenExact BounceOddExact BounceEvenThree BounceEvenNoFour Agent38SectionParity BounceAllExact SectionAllInverse Agent3CImage ConeArithmetic; do
            lean -o "$f.olean" "$f.lean"
          done
          lean -o ConeSource.olean ConeSource.lean
          lean -o ConeBroadArithmetic.olean ConeBroadArithmetic.lean
          lean ConeBroadSource.lean
          lean -o ThreeConeArithmetic.olean ThreeConeArithmetic.lean
          lean -o ThreeConeSource.olean ThreeConeSource.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent34-c-degree-profile/ThreeConeProper.lean .
          lean -o ThreeConeProper.olean ThreeConeProper.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent34-c-valuation-fanin/{ValuationArithmetic,ValuationSource,ValuationOneOrbit}.lean .
          lean -o ValuationArithmetic.olean ValuationArithmetic.lean
          lean -o ValuationSource.olean ValuationSource.lean
          python ${GITHUB_WORKSPACE}/im-results/agent34-c-valuation-fanin/reconstruct_one.py
          lean -o ValuationOne.olean ValuationOne.lean
          lean -o ValuationOneOrbit.olean ValuationOneOrbit.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent11-c-low58/{TowerArithmetic,SourceImageTower}.lean .
          lean -o TowerArithmetic.olean TowerArithmetic.lean
          lean SourceImageTower.lean
          cp ${GITHUB_WORKSPACE}/im-results/agent34-c-degree-profile/{OddThreeArithmetic,OddThreeSource}.lean .
          lean -o OddThreeArithmetic.olean OddThreeArithmetic.lean
          lean OddThreeSource.lean

