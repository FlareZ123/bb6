name: Agent 34 Machine C source-exact valuation fanin (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check original section and all-depth inverse with valuation theorems
        run: |
          mkdir -p /tmp/a34-valuation
          cp im-results/agent11-c-line/CLine.lean /tmp/a34-valuation/
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/a34-valuation/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/a34-valuation/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef}.lean /tmp/a34-valuation/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,EvenTargetForward,BounceEvenExact,BounceOddExact,BounceEvenThree,BounceEvenNoFour,BounceAllExact,SectionAllInverse}.lean /tmp/a34-valuation/
          cp im-results/agent38-c-section-mod4/Agent38SectionParity.lean /tmp/a34-valuation/
          cp im-results/agent34-c-valuation-fanin/{ValuationArithmetic,ValuationSource}.lean /tmp/a34-valuation/
          cd /tmp/a34-valuation
          export LEAN_PATH="."
          lean --version
          for f in CLine GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef BounceInverse EvenTargetForward BounceEvenExact BounceOddExact BounceEvenThree BounceEvenNoFour Agent38SectionParity BounceAllExact SectionAllInverse ValuationArithmetic; do
            lean -o "$f.olean" "$f.lean"
          done
          lean -o ValuationSource.olean ValuationSource.lean
          python "$GITHUB_WORKSPACE/im-results/agent34-c-valuation-fanin/valuation_fanin.py"
          # The valuation-one source theorem is hash-pinned separately.
