name: Agent 35 D3 I5 blank-root 1711-return certificate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent35-d-regular-certificate:im-results/agent32-cryptid-padding:im-results/agent2-cryptid-continuity:im-results/agent25-cryptid-doublezero:im-results/agent35-cryptid-code:im-results/agent32-cryptid-third:im-results/agent3-portfolio-raw-conjugacy:im-results/agent19-d-physical-bridge:im-results/agent31-d-exceptional:im-results/agent35-d3-root-1711
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact source archives
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          python3 im-results/agent35-d-regular-certificate/restore_sources.py
          python3 im-results/agent25-cryptid-doublezero/unpack.py
          python3 im-results/agent2-cryptid-continuity/restore_a_regular.py
          python3 im-results/agent2-cryptid-continuity/restore_e_regular.py
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact D source and the eleven-row contract
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          B=im-results/agent31-cryptid-boundary
          P=im-results/agent32-cryptid-padding
          H=im-results/agent35-d-regular-certificate
          D=im-results/agent2-cryptid-continuity
          A=im-results/agent25-cryptid-doublezero
          C=im-results/agent35-cryptid-code
          S=im-results/agent32-cryptid-third
          P3=im-results/agent3-portfolio-raw-conjugacy
          P19=im-results/agent19-d-physical-bridge
          R=im-results/agent35-d3-root-1711
          lean -o "$B/Boundary.olean" "$B/Boundary.lean"
          lean -o "$B/BoundaryExtra.olean" "$B/BoundaryExtra.lean"
          for module in DoubleZero TripleUniversalBase TripleUniversalCore TripleUniversalWalk TripleUniversal TenPump TokenCode; do
            lean -o "$A/$module.olean" "$A/$module.lean"
          done
          lean -o "$C/ABridgeCode.olean" "$C/ABridgeCode.lean"
          lean -o "$H/DRegular.olean" "$H/DRegular.lean"
          lean -o "$H/DTransport.olean" "$H/DTransport.lean"
          lean -o "$H/DObservedTransport.olean" "$H/DObservedTransport.lean"
          lean -o "$P/Generic.olean" "$P/Generic.lean"
          lean -o "$P/BoundaryPadding.olean" "$P/BoundaryPadding.lean"
          lean -o "$H/DObsSourceCandidate.olean" "$H/DObsSourceCandidate.lean"
          lean -o "im-results/agent31-d-exceptional/DRegularBSource.olean" "im-results/agent31-d-exceptional/DRegularBSource.lean"
          lean -o "$D/BRegularSource.olean" "$D/BRegularSource.lean"
          lean -o "$D/AZeroSource.olean" "$D/AZeroSource.lean"
          lean -o "$D/EZeroSource.olean" "$D/EZeroSource.lean"
          lean -o "$D/AOneSource.olean" "$D/AOneSource.lean"
          lean -o "$D/AWordAlgebra.olean" "$D/AWordAlgebra.lean"
          lean -o "$D/ATwoSource.olean" "$D/ATwoSource.lean"
          lean -o "$D/ARegularFull.olean" "$D/ARegularFull.lean"
          lean -o "$S/CryptidSix.olean" "$S/CryptidSix.lean"
          lean -o "$S/CryptidPairs.olean" "$S/CryptidPairs.lean"
          lean -o "$S/CryptidTriplePairs.olean" "$S/CryptidTriplePairs.lean"
          lean -o "$C/EDouble.olean" "$C/EDouble.lean"
          lean -o "$D/ERemaining.olean" "$D/ERemaining.lean"
          for module in MachineConjugacy DTableWitness DStartFinite DSectionTransfer DAllStarts DExactTimes DParseRLE DSourceCorollaries; do
            lean -o "$P3/$module.olean" "$P3/$module.lean"
          done
          lean -o "$P19/PhysicalBridge.olean" "$P19/PhysicalBridge.lean"
          lean -o "$B/Boundary.olean" "$B/Boundary.lean"
          lean -o "$P/Generic.olean" "$P/Generic.lean"
          lean -o "$P/BoundaryPadding.olean" "$P/BoundaryPadding.lean"
          lean -o "$P19/SourceIntegration.olean" "$P19/SourceIntegration.lean"
          lean -o "$P19/UnaryBridge.olean" "$P19/UnaryBridge.lean"
          lean -o "$P19/RootTransfer.olean" "$P19/RootTransfer.lean"
          lean -o "$P19/ExactTime.olean" "$P19/ExactTime.lean"
          lean -o "$R/I5Root1711.olean" "$R/I5Root1711.lean"
          lean "$R/I5Root1711.lean" 2>&1 | tee /tmp/i5-root1711.log
          if grep -q 'sorryAx' /tmp/i5-root1711.log; then
            echo 'Unexpected sorryAx in I5 root certificate' >&2
            exit 1
          fi
          lean "$R/I5ExceptionalRejoin.lean" 2>&1 | tee /tmp/i5-exceptional-rejoin.log
          if grep -q 'sorryAx' /tmp/i5-exceptional-rejoin.log; then
            echo 'Unexpected sorryAx in I5 exceptional rejoin certificate' >&2
            exit 1
          fi
