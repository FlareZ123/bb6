name: Agent 35 rooted row262 all-A section theorem (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact transition semantics and universal section proofs
        env:
          LEAN_PATH: im-results/agent35-row262-section
        run: |
          lean --version
          lean -o im-results/agent35-row262-section/Row262.olean im-results/agent35-row262-section/Row262.lean
          lean im-results/agent35-row262-section/Row262Complete.lean
      - name: Reproduce bounded raw vs macro regression
        run: python3 im-results/agent35-row262-section/test_row262.py
      - name: Verify exact dyadic scalar conjugacy on seeded and blank trajectories
        run: python3 im-results/agent35-row262-section/test_scalar.py
      - name: Verify exact universal row262 9q burst source theorem
        env:
          LEAN_PATH: im-results/agent35-row262-section:im-results/agent2-row262-burst
        run: |
          lean -o im-results/agent2-row262-burst/PairBurst.olean im-results/agent2-row262-burst/PairBurst.lean
          lean im-results/agent2-row262-burst/PairBurstSafe.lean
          lean -o im-results/agent2-row262-burst/Valuation.olean im-results/agent2-row262-burst/Valuation.lean
          lean im-results/agent2-row262-burst/BurstProduct.lean
          lean im-results/agent2-row262-burst/GateValuation.lean
          python3 im-results/agent2-row262-burst/test_pair_burst.py
      - name: Verify four-left-window first-return projection no-go theorems
        env:
          LEAN_PATH: im-results/agent35-row262-section:im-results/agent7-row262-right-projection
        run: |
          lean im-results/agent7-row262-right-projection/RightProjectionNoGo.lean
          lean im-results/agent7-row262-right-projection/PrefixWindowNoGo.lean
          python3 im-results/agent7-row262-right-projection/check_right_projection.py
          python3 im-results/agent7-row262-right-projection/check_prefix_window.py
