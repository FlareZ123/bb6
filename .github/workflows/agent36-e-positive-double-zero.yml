name: Agent 36 E positive-double-zero original-source Lean check (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct original raw six-state machine and check universal theorem
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent36-cryptid-trace
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          lean --version
          lean -o im-results/agent31-cryptid-boundary/Boundary.olean im-results/agent31-cryptid-boundary/Boundary.lean
          lean -o im-results/agent32-cryptid-third/CryptidSix.olean im-results/agent32-cryptid-third/CryptidSix.lean
          lean -o im-results/agent32-cryptid-third/CryptidPairs.olean im-results/agent32-cryptid-third/CryptidPairs.lean
          lean -o im-results/agent32-cryptid-third/CryptidTriplePairs.olean im-results/agent32-cryptid-third/CryptidTriplePairs.lean
          lean -o im-results/agent36-cryptid-trace/EDoubleTripleGeneral.olean im-results/agent36-cryptid-trace/EDoubleTripleGeneral.lean
          lean -o im-results/agent36-cryptid-trace/EZeroPairs0.olean im-results/agent36-cryptid-trace/EZeroPairs0.lean
          lean -o im-results/agent36-cryptid-trace/EPositiveCore0.olean im-results/agent36-cryptid-trace/EPositiveCore0.lean
          lean -o im-results/agent36-cryptid-trace/EPositiveCore1.olean im-results/agent36-cryptid-trace/EPositiveCore1.lean
          lean im-results/agent36-cryptid-trace/EPositiveDoubleZero.lean
