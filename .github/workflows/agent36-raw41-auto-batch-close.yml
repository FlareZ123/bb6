name: Agent 36 source-proof Raw41 target from independent affine pumps and optional manual proofs

on:
  workflow_dispatch:
    inputs:
      index:
        required: true
        default: "94"
        type: string
      shard:
        required: true
        default: "2"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46082958378
          name: raw41-batch-auto-${{ inputs.shard }}
          path: .tmp/raw41-source-auto
      - name: Generate exact canonical proof plus all symbolic invariants
        run: |
          set -euo pipefail
          extra=()
          if [ '${{ inputs.index }}' = 94 ]; then
            extra+=(--manual "66:Raw41New094Leaf66:BB6.Agent36Raw41Child094Leaf66.table:BB6.Agent36Raw41Child094Leaf66.never")
          fi
          python3 im-results/agent36-raw41/close_auto_batch.py \
            --batch .tmp/raw41-source-auto/a36-batch-auto-${{ inputs.shard }}.json \
            --index ${{ inputs.index }} \
            --out .tmp/raw41-target-${{ inputs.index }}-auto "${extra[@]}"
          ls -lh .tmp/raw41-target-${{ inputs.index }}-auto/lean/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw41-target-${{ inputs.index }}-auto
          path: .tmp/raw41-target-${{ inputs.index }}-auto/
          retention-days: 45
