name: Agent 36 Raw41 unresolved canonical-child screen (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run full canonical screen or target exact FAR discovery
        type: choice
        options: [screen, close, inspect]
        default: screen
      index:
        description: Canonical residual index (0–152) for targeted FAR run
        type: string
        default: '88'
      dfa:
        description: Maximum FAR DFA size (default 5; 6 is expensive)
        type: string
        default: '5'
      far_override:
        description: Optional source-reconstructed DFA FAR indexed witness e.g. 41:10152634177777777
        type: string
        default: ''
      late:
        description: Optional original open-index:step:slot for exact late last-hole closure
        type: string
        default: ''
      min_bound:
        description: Safe weighted bound for late first-hole certificate
        type: string
        default: '0'
      search_seconds:
        description: Seconds allowed for exact FAR search
        type: string
        default: '900'
      auto_json:
        description: Optional tracked Raw41 AutoPump fixture for this exact target
        type: string
        default: ''
      require_closed:
        description: Fail if any unresolved leaves remain after source generation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  screen:
    if: inputs.mode == 'screen'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Reuse original canonical partition and exact enumerator
        run: |
          python3 im-results/agent36-raw41/screen_canonical.py \
            --shard ${{ matrix.shard }} --shards 4 --timeout 90 \
            --output raw41-screen-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw41-screen-${{ matrix.shard }}
          path: raw41-screen-shard-${{ matrix.shard }}.json
          retention-days: 30
  close:
    if: inputs.mode == 'close'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact canonical enumeration and search FAR
        env:
          RAW41_AUTO_JSON: ${{ inputs.auto_json }}
          RAW41_REQUIRE_CLOSED: ${{ inputs.require_closed }}
        run: |
          set -euo pipefail
          auto_args=()
          if [[ -n "$RAW41_AUTO_JSON" ]]; then
            [[ "$RAW41_AUTO_JSON" =~ ^im-results/agent36-raw41/certificates/[a-zA-Z0-9_./-]+\.json$ ]]
            [[ "$RAW41_AUTO_JSON" != *..* ]]
            test -f "$RAW41_AUTO_JSON"
            auto_args+=(--auto-json "$RAW41_AUTO_JSON")
          fi
          python3 im-results/agent36-raw41/close_candidate.py \
            --index ${{ inputs.index }} --dfa ${{ inputs.dfa }} --time ${{ inputs.search_seconds }} \
            --late "${{ inputs.late }}" --far-override "${{ inputs.far_override }}" --min-bound ${{ inputs.min_bound }} \
            --out raw41-target-candidate "${auto_args[@]}"
          cat raw41-target-candidate/summary.json
          if [[ "$RAW41_REQUIRE_CLOSED" == true ]]; then
            python3 - <<'PY'
          import json
          s=json.load(open("raw41-target-candidate/summary.json"))
          remaining=s.get("remaining_after_auto", s.get("remaining_after_late", s["remaining"]))
          if remaining != 0:
              raise SystemExit(f"Raw41 child still has {remaining} open leaves; no complete source closure")
          print("Raw41 candidate has no unresolved leaves (generation condition, not Lean acceptance)")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw41-target-${{ inputs.index }}
          path: raw41-target-candidate/
          retention-days: 30
  inspect:
    if: inputs.mode == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46079605531
          name: raw41-target-81
          path: /tmp/holdout-81
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46079613167
          name: raw41-target-125
          path: /tmp/holdout-125
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46079295993
          name: raw41-target-84
          path: /tmp/holdout-84
      - name: Print exact residual tables for mathematical attacks
        run: |
          set -euo pipefail
          for n in 81 125 84; do
            echo "==== RAW41 CHILD $n ===="
            cat "/tmp/holdout-$n/summary.json"
            cat "/tmp/holdout-$n/missing.txt"
          done
