name: Agent 36 Raw41 unresolved canonical-child screen (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run full canonical screen or target exact FAR discovery
        type: choice
        options: [screen, close, inspect]
        default: screen
      index:
        description: Canonical residual index (0–152) for targeted FAR run
        type: string
        default: '88'
      dfa:
        description: Maximum FAR DFA size (default 5; 6 is expensive)
        type: string
        default: '5'
      search_seconds:
        description: Seconds allowed for exact FAR search
        type: string
        default: '900'

permissions:
  contents: read

jobs:
  screen:
    if: inputs.mode == 'screen'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Reuse original canonical partition and exact enumerator
        run: |
          python3 im-results/agent36-raw41/screen_canonical.py \
            --shard ${{ matrix.shard }} --shards 4 --timeout 90 \
            --output raw41-screen-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw41-screen-${{ matrix.shard }}
          path: raw41-screen-shard-${{ matrix.shard }}.json
          retention-days: 30
  close:
    if: inputs.mode == 'close'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact canonical enumeration and search FAR
        run: |
          python3 im-results/agent36-raw41/close_candidate.py \
            --index ${{ inputs.index }} --dfa ${{ inputs.dfa }} --time ${{ inputs.search_seconds }} \
            --out raw41-target-candidate
          cat raw41-target-candidate/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw41-target-${{ inputs.index }}
          path: raw41-target-candidate/
          retention-days: 30
  inspect:
    if: inputs.mode == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46079605531
          name: raw41-target-81
          path: /tmp/holdout-81
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46079613167
          name: raw41-target-125
          path: /tmp/holdout-125
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46079295993
          name: raw41-target-84
          path: /tmp/holdout-84
      - name: Print exact residual tables for mathematical attacks
        run: |
          set -euo pipefail
          for n in 81 125 84; do
            echo "==== RAW41 CHILD $n ===="
            cat "/tmp/holdout-$n/summary.json"
            cat "/tmp/holdout-$n/missing.txt"
          done
