name: Agent 36 first source-certified quadratic time dilation twin sweep (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46082718350
          name: raw41-target-128-auto
          path: /tmp/quad128
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46083019785
          name: raw41-target-024-auto
          path: /tmp/quad024
      - name: Check separate growth orbits and prove exact common quadratic checkpoints
        run: |
          set -euo pipefail
          SRC=.tmp/a36-twin-sweep
          mkdir -p "$SRC"
          cp /tmp/quad128/lean/Raw41New128Auto.lean "$SRC/"
          cp /tmp/quad024/lean/Raw41New024Auto.lean "$SRC/"
          export LEAN_PATH="$SRC:im-results/agent8-coverage-contract:im-results/agent50-weighted-tnf-pilot:im-results/agent31-three-hole-tnf:im-results/agent46-raw13-cut"
          lean -o "$SRC/RootShift.olean" im-results/agent8-coverage-contract/RootShift.lean 2>&1 | tee /tmp/a36-twin-root.log
          lean -o "$SRC/SparseZipper.olean" im-results/agent50-weighted-tnf-pilot/SparseZipper.lean 2>&1 | tee /tmp/a36-twin-zipper.log
          lean -o "$SRC/SweepPumping.olean" im-results/agent31-three-hole-tnf/SweepPumping.lean 2>&1 | tee /tmp/a36-twin-sweep.log
          lean -o "$SRC/Agent46AutoPump.olean" im-results/agent46-raw13-cut/Agent46AutoPump.lean 2>&1 | tee /tmp/a36-twin-pump.log
          lean -o "$SRC/Raw41New024Auto.olean" "$SRC/Raw41New024Auto.lean" 2>&1 | tee /tmp/a36-twin-024.log
          lean -o "$SRC/Raw41New128Auto.olean" "$SRC/Raw41New128Auto.lean" 2>&1 | tee /tmp/a36-twin-128.log
          lean -o "$SRC/TwinQuadraticSweep.olean" im-results/agent36-raw41/TwinQuadraticSweep.lean 2>&1 | tee /tmp/a36-twin-theorem.log
          grep -F 'twin_quadratic_synchronization' /tmp/a36-twin-theorem.log
          grep -F 'twin_quadratic_lag' /tmp/a36-twin-theorem.log
          if grep -ER 'sorryAx|native_decide' /tmp/a36-twin-*.log; then exit 1; fi
          echo "CERTIFIED: identical infinite orbit at two exact quadratic time sequences"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw41-twin-quadratic-lean
          path: /tmp/a36-twin-*.log
          retention-days: 45
