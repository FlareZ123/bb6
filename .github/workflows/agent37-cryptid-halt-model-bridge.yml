name: Agent 37 Cryptid exact halting-model bridge (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore original symbolic machine source
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          python3 im-results/agent25-cryptid-doublezero/unpack.py
      - name: Compile independent source and verify cross-model bridge
        run: |
          export LEAN_PATH="$GITHUB_WORKSPACE/im-results/agent31-cryptid-boundary:$GITHUB_WORKSPACE/im-results/agent25-cryptid-doublezero:$GITHUB_WORKSPACE/im-results/agent32-cryptid-third:$GITHUB_WORKSPACE/im-results/agent32-cryptid-padding:$GITHUB_WORKSPACE/im-results/agent37-cryptid-model-bridge:$GITHUB_WORKSPACE/im-results/agent35-cryptid-code:$GITHUB_WORKSPACE/im-results/agent2-cryptid-continuity:$GITHUB_WORKSPACE/im-results/agent37-d-timing-cocycle"
          lean -o im-results/agent31-cryptid-boundary/Boundary.olean im-results/agent31-cryptid-boundary/Boundary.lean
          lean -o im-results/agent31-cryptid-boundary/BoundaryExtra.olean im-results/agent31-cryptid-boundary/BoundaryExtra.lean
          cd "$GITHUB_WORKSPACE/im-results/agent25-cryptid-doublezero"
          for module in DoubleZero TripleUniversalBase TripleUniversalCore TripleUniversalWalk TripleUniversal TripleIteration TenPump SixOnes TokenCode; do
            lean -o "$module.olean" "$module.lean"
          done
          cd "$GITHUB_WORKSPACE"
          lean -o im-results/agent32-cryptid-third/AAlternating.olean im-results/agent32-cryptid-third/AAlternating.lean
          lean -o im-results/agent32-cryptid-third/CryptidSix.olean im-results/agent32-cryptid-third/CryptidSix.lean
          lean -o im-results/agent32-cryptid-third/CryptidThree.olean im-results/agent32-cryptid-third/CryptidThree.lean
          lean -o im-results/agent32-cryptid-padding/EZeroPair.olean im-results/agent32-cryptid-padding/EZeroPair.lean
          lean -o im-results/agent37-cryptid-model-bridge/CrossModelBridge.olean im-results/agent37-cryptid-model-bridge/CrossModelBridge.lean
          lean -o im-results/agent37-cryptid-model-bridge/CompleteAReturn.olean im-results/agent37-cryptid-model-bridge/CompleteAReturn.lean
          lean -o im-results/agent37-cryptid-model-bridge/WordReturns.olean im-results/agent37-cryptid-model-bridge/WordReturns.lean
          lean -o im-results/agent37-cryptid-model-bridge/DoubleOneBranch.olean im-results/agent37-cryptid-model-bridge/DoubleOneBranch.lean
          lean -o im-results/agent37-cryptid-model-bridge/DoubleOnePairs.olean im-results/agent37-cryptid-model-bridge/DoubleOnePairs.lean
          lean -o im-results/agent37-cryptid-model-bridge/FullWordPairs.olean im-results/agent37-cryptid-model-bridge/FullWordPairs.lean
          lean -o im-results/agent37-cryptid-model-bridge/ReturnShift.olean im-results/agent37-cryptid-model-bridge/ReturnShift.lean
          lean -o im-results/agent37-cryptid-model-bridge/ShortTripleGate.olean im-results/agent37-cryptid-model-bridge/ShortTripleGate.lean
          lean im-results/agent37-cryptid-model-bridge/A110Portal.lean
          lean -o im-results/agent35-cryptid-code/ABridgeCode.olean im-results/agent35-cryptid-code/ABridgeCode.lean
          lean -o im-results/agent2-cryptid-continuity/AHaltCylinder.olean im-results/agent2-cryptid-continuity/AHaltCylinder.lean
          lean im-results/agent37-d-timing-cocycle/CodeHalt.lean
