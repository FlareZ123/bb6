name: Agent 37 E110111 all-q original-source Lean audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore original six-state source from pinned checksum
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          python3 im-results/agent25-cryptid-doublezero/unpack.py
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Compile unmodified source dependencies and new all-q E theorem
        env:
          LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent25-cryptid-doublezero:im-results/agent35-cryptid-code:im-results/agent26-cryptid-e-gate:im-results/agent37-root-language-pilot
        run: |
          lean -o im-results/agent31-cryptid-boundary/Boundary.olean im-results/agent31-cryptid-boundary/Boundary.lean
          lean -o im-results/agent32-cryptid-third/CryptidSix.olean im-results/agent32-cryptid-third/CryptidSix.lean
          lean -o im-results/agent32-cryptid-third/CryptidPairs.olean im-results/agent32-cryptid-third/CryptidPairs.lean
          lean -o im-results/agent32-cryptid-third/CryptidTriplePairs.olean im-results/agent32-cryptid-third/CryptidTriplePairs.lean
          lean -o im-results/agent26-cryptid-e-gate/E1101010111Pairs.olean im-results/agent26-cryptid-e-gate/E1101010111Pairs.lean
          lean -o im-results/agent26-cryptid-e-gate/E1101010111ThenB.olean im-results/agent26-cryptid-e-gate/E1101010111ThenB.lean
          lean -o im-results/agent37-root-language-pilot/E110111Pairs.olean im-results/agent37-root-language-pilot/E110111Pairs.lean
          lean -o im-results/agent37-root-language-pilot/EThenE.olean im-results/agent37-root-language-pilot/EThenE.lean
          for module in DoubleZero TripleUniversalBase TripleUniversalCore TripleUniversalWalk TripleUniversal TenPump TokenCode; do
            lean -o "im-results/agent25-cryptid-doublezero/$module.olean" "im-results/agent25-cryptid-doublezero/$module.lean"
          done
          lean -o im-results/agent35-cryptid-code/ABridgeCode.olean im-results/agent35-cryptid-code/ABridgeCode.lean
          lean -o im-results/agent26-cryptid-e-gate/E1101010111ThenA.olean im-results/agent26-cryptid-e-gate/E1101010111ThenA.lean
          lean -o im-results/agent37-root-language-pilot/EThenAGuarded.olean im-results/agent37-root-language-pilot/EThenAGuarded.lean
          lean -o im-results/agent31-cryptid-boundary/A1100.olean im-results/agent31-cryptid-boundary/A1100.lean
          lean -o im-results/agent26-cryptid-e-gate/A110101Closure.olean im-results/agent26-cryptid-e-gate/A110101Closure.lean
          lean -o im-results/agent37-root-language-pilot/EThenAQ1.olean im-results/agent37-root-language-pilot/EThenAQ1.lean
