name: Agent 37 Cryptid k13 mod81 source proof (manual)
on:
  workflow_dispatch:
    inputs:
      target:
        description: Select the conditional source certificate suite
        type: choice
        required: true
        default: packet_boundary
        options:
          - packet_boundary
          - k13
          - safe_e
          - second_reentry
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    if: ${{ inputs.target != 'packet_boundary' && inputs.target != 'safe_e' && inputs.target != 'second_reentry' && !contains(github.event.head_commit.message, 'retire one-shot') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent25-cryptid-doublezero:im-results/agent35-cryptid-code:im-results/agent32-cryptid-third:im-results/agent32-cryptid-padding:im-results/agent31-d-exceptional:im-results/agent2-packet-shift:im-results/agent37-root-language-pilot:im-results/agent26-cryptid-e-gate:im-results/agent37-p2-k13:im-results/agent37-echain:im-results/agent35-d-regular-certificate:im-results/agent37-d-timing-cocycle
    steps:
      - uses: actions/checkout@v4
      - name: Restore checksum-pinned six-state machine
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          python3 im-results/agent25-cryptid-doublezero/unpack.py
          python3 im-results/agent35-d-regular-certificate/restore_sources.py
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check unchanged source and k13 continuation
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          B=im-results/agent31-cryptid-boundary
          A=im-results/agent25-cryptid-doublezero
          C=im-results/agent35-cryptid-code
          S=im-results/agent32-cryptid-third
          P=im-results/agent32-cryptid-padding
          R=im-results/agent31-d-exceptional
          D=im-results/agent2-packet-shift
          E=im-results/agent26-cryptid-e-gate
          K=im-results/agent37-p2-k13
          lean -o "$B/Boundary.olean" "$B/Boundary.lean"
          H=im-results/agent35-d-regular-certificate
          G=im-results/agent37-d-timing-cocycle
          lean -o "$H/DRegular.olean" "$H/DRegular.lean"
          lean -o "$H/DTransport.olean" "$H/DTransport.lean"
          lean -o "$H/DObservedTransport.olean" "$H/DObservedTransport.lean"
          lean -o "$B/A1100.olean" "$B/A1100.lean"
          for module in DoubleZero TripleUniversalBase TripleUniversalCore TripleUniversalWalk TripleUniversal TenPump TokenCode TripleIteration SixOnes; do
            lean -o "$A/$module.olean" "$A/$module.lean"
          done
          lean -o "$C/ABridgeCode.olean" "$C/ABridgeCode.lean"
          lean -o "$E/A1101010111.olean" "$E/A1101010111.lean"
          lean -o "$E/A1101010111Code.olean" "$E/A1101010111Code.lean"
          lean -o "$P/CodeImplicitNil.olean" "$P/CodeImplicitNil.lean"
          lean -o "$S/CryptidSix.olean" "$S/CryptidSix.lean"
          lean -o "$S/CryptidThree.olean" "$S/CryptidThree.lean"
          for module in CryptidPairs CryptidTriplePairs; do
            lean -o "$S/$module.olean" "$S/$module.lean"
          done
          lean -o im-results/agent37-root-language-pilot/E110111Pairs.olean im-results/agent37-root-language-pilot/E110111Pairs.lean
          lean -o "$R/PacketSource.olean" "$R/PacketSource.lean"
          lean -o im-results/agent37-echain/EChainSource.olean im-results/agent37-echain/EChainSource.lean | tee axioms.log
          lean -o im-results/agent37-echain/EChainResidues.olean im-results/agent37-echain/EChainResidues.lean | tee -a axioms.log
          lean -o "$D/BoundaryBZero.olean" "$D/BoundaryBZero.lean"
          lean -o "$P/Generic.olean" "$P/Generic.lean"
          lean -o "$P/BoundaryPadding.olean" "$P/BoundaryPadding.lean"
          lean -o "$H/DObsSourceCandidate.olean" "$H/DObsSourceCandidate.lean"
          lean -o "$D/PacketP2ResetSource.olean" "$D/PacketP2ResetSource.lean"
          lean -o "$C/P2K4Shapes.olean" "$C/P2K4Shapes.lean"
          lean -o "$C/P2MarkerA.olean" "$C/P2MarkerA.lean" | tee -a axioms.log
          lean -o im-results/agent37-echain/EChainAExit.olean im-results/agent37-echain/EChainAExit.lean | tee -a axioms.log
          lean -o im-results/agent37-echain/EChainBResidues.olean im-results/agent37-echain/EChainBResidues.lean | tee -a axioms.log
          lean -o im-results/agent37-echain/EChainBExit.olean im-results/agent37-echain/EChainBExit.lean | tee -a axioms.log
          lean -o im-results/agent37-echain/EChainDoubleBExit.olean im-results/agent37-echain/EChainDoubleBExit.lean | tee -a axioms.log
          lean -o im-results/agent37-echain/EChainDoubleBZero.olean im-results/agent37-echain/EChainDoubleBZero.lean | tee -a axioms.log
          lean -o im-results/agent37-echain/EChainDoubleBReentry.olean im-results/agent37-echain/EChainDoubleBReentry.lean | tee -a axioms.log
          lean -o "$C/EChainSourceReentry.olean" "$C/EChainSourceReentry.lean" | tee -a axioms.log
          lean -o im-results/agent37-echain/EChainBEEAReentry.olean im-results/agent37-echain/EChainBEEAReentry.lean | tee -a axioms.log
          lean -o "$P/EZeroPair.olean" "$P/EZeroPair.lean"
          lean -o "$C/EDouble.olean" "$C/EDouble.lean"
          lean -o "$P/EAllDouble.olean" "$P/EAllDouble.lean"
          A=im-results/agent25-cryptid-doublezero
          lean -o "$A/ExceptionalBRejoin.olean" "$A/ExceptionalBRejoin.lean"
          lean -o "$A/ExceptionalBGeneral.olean" "$A/ExceptionalBGeneral.lean"
          lean -o "$G/ExceptionalE7SecondSafe.olean" "$G/ExceptionalE7SecondSafe.lean"
          lean -o im-results/agent37-echain/EChainBEExit.olean im-results/agent37-echain/EChainBEExit.lean | tee -a axioms.log
          lean -o im-results/agent37-echain/EERootBEA.olean im-results/agent37-echain/EERootBEA.lean | tee -a axioms.log
          lean -o im-results/agent37-echain/EERootBEAFloor.olean im-results/agent37-echain/EERootBEAFloor.lean | tee -a axioms.log
          lean -o "$C/P2K4ShapeCfg.olean" "$C/P2K4ShapeCfg.lean" | tee -a axioms.log
          lean -o "$C/P2K4Source.olean" "$C/P2K4Source.lean" | tee -a axioms.log
          lean -o "$D/P2K4SourceReentry.olean" "$D/P2K4SourceReentry.lean" | tee -a axioms.log
          lean "$K/P2K13Source.lean" | tee -a axioms.log
          if grep -E 'sorryAx|_native.native_decide' axioms.log; then exit 1; fi

  packet_boundary:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'packet_boundary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent32-cryptid-third:im-results/agent31-d-exceptional:im-results/agent2-packet-shift:im-results/agent37-echain:im-results/agent32-cryptid-padding
    steps:
      - uses: actions/checkout@v4
      - name: Restore original machine and install Lean
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the guarded E-two and arbitrary E-zero source lemmas
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          B=im-results/agent31-cryptid-boundary
          S=im-results/agent32-cryptid-third
          R=im-results/agent31-d-exceptional
          D=im-results/agent2-packet-shift
          Q=im-results/agent37-echain
          lean -o "$B/Boundary.olean" "$B/Boundary.lean"
          lean -o "$S/CryptidSix.olean" "$S/CryptidSix.lean"
          lean -o "$S/CryptidPairs.olean" "$S/CryptidPairs.lean"
          lean -o "$S/CryptidTriplePairs.olean" "$S/CryptidTriplePairs.lean"
          lean -o "$R/PacketSource.olean" "$R/PacketSource.lean"
          lean -o "$D/EGenericTurn.olean" "$D/EGenericTurn.lean"
          lean "$Q/PacketEZeroAnyTail.lean" | tee axioms.log
          lean "$Q/E2ShortQ3.lean" | tee -a axioms.log
          lean -o "$Q/E2ShortPositive.olean" "$Q/E2ShortPositive.lean" | tee -a axioms.log
          P=im-results/agent32-cryptid-padding
          lean -o "$P/Generic.olean" "$P/Generic.lean"
          lean -o "$P/BoundaryPadding.olean" "$P/BoundaryPadding.lean"
          lean "$Q/E2ShortPhysical.lean" | tee -a axioms.log
          lean -o "$Q/E2ShortZero.olean" "$Q/E2ShortZero.lean" | tee -a axioms.log
          lean "$Q/E2ShortAll.lean" | tee -a axioms.log
          lean -o "$Q/E2AlternatingTurn.olean" "$Q/E2AlternatingTurn.lean" | tee -a axioms.log
          lean -o "$Q/E2AlternatingPacket.olean" "$Q/E2AlternatingPacket.lean" | tee -a axioms.log
          lean "$Q/E2AlternatingAll.lean" | tee -a axioms.log
          lean "$Q/E2DoubleZeroGuard.lean" | tee -a axioms.log
          lean -o "$Q/E2UnaryTailAll.olean" "$Q/E2UnaryTailAll.lean" | tee -a axioms.log
          lean "$Q/E2UnaryPhysical.lean" | tee -a axioms.log
          lean -o "$Q/E2DoubleZeroNoGuard.olean" "$Q/E2DoubleZeroNoGuard.lean" | tee -a axioms.log
          lean "$Q/E2DoubleZeroZero.lean" | tee -a axioms.log
          if grep -E 'sorryAx|_native.native_decide' axioms.log; then exit 1; fi

  safe_e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'safe_e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent25-cryptid-doublezero:im-results/agent35-d-regular-certificate:im-results/agent32-cryptid-padding:im-results/agent2-cryptid-continuity:im-results/agent32-cryptid-third:im-results/agent35-cryptid-code:im-results/agent31-d-exceptional:im-results/agent35-d-sixth-rejoin:im-results/agent2-packet-shift:im-results/agent36-cryptid-trace:im-results/agent37-root-language-pilot:im-results/agent26-cryptid-e-gate:im-results/agent37-d-timing-cocycle:im-results/agent37-echain
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct pinned six-state original sources
        run: |
          set -euo pipefail
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          python3 im-results/agent25-cryptid-doublezero/unpack.py
          python3 im-results/agent35-d-regular-certificate/restore_sources.py
          python3 im-results/agent2-cryptid-continuity/restore_a_regular.py
          python3 im-results/agent2-cryptid-continuity/restore_e_regular.py
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile actual import closure of canonical safe-E theorem
        run: |
          set -euo pipefail
          lean --version
          python3 -u im-results/agent37-echain/reproduce-safe-e.py ExceptionalESafeCanonical ExceptionalEReentryClassification RegularSafeEBridge Blank8394SafeE ExceptionalEResidueClassification ExceptionalEUniversalDichotomy ExceptionalEMarkerResidual EOneModNineMarker ExceptionalESharpMarkerKernel EKernel27AClosures ESharp27Kernel EAResidueCanonical ECanonicalOutsideCore


  second_reentry:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'second_reentry' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent25-cryptid-doublezero:im-results/agent35-d-regular-certificate:im-results/agent32-cryptid-padding:im-results/agent2-cryptid-continuity:im-results/agent32-cryptid-third:im-results/agent35-cryptid-code:im-results/agent31-d-exceptional:im-results/agent35-d-sixth-rejoin:im-results/agent2-packet-shift:im-results/agent36-cryptid-trace:im-results/agent37-root-language-pilot:im-results/agent26-cryptid-e-gate:im-results/agent37-d-timing-cocycle:im-results/agent37-echain:im-results/agent2-root-language-exit
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct pinned six-state original sources
        run: |
          set -euo pipefail
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          python3 im-results/agent25-cryptid-doublezero/unpack.py
          python3 im-results/agent35-d-regular-certificate/restore_sources.py
          python3 im-results/agent2-cryptid-continuity/restore_a_regular.py
          python3 im-results/agent2-cryptid-continuity/restore_e_regular.py
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check prepared P2 second-return families
        run: |
          set -euo pipefail
          lean --version
          python3 -u im-results/agent37-echain/reproduce-safe-e.py Seed24956SecondReentry Seed24956FamilySecondReentry Seed24956Depth3SecondReentry OddDepthSecondReturn OddDepthAffineAlignment D5SecondReturn
