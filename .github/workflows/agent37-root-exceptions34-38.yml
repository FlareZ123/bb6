name: D-root exceptions 34-38 source audit (artifact reuse)
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Stage-5 run containing the d-root-seed31-audit artifact
        required: true
        type: string
      certificate_run_id:
        description: Successful run containing the seed31-first-stop-certificate artifact
        required: true
        type: string
      source_ref:
        description: Exact source snapshot used by the staged root audit
        required: true
        default: "2da159d86fa86d813bdfbc54e38e3ec9c75b6e69"
        type: string
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      certificate_run_id:
        required: true
        type: string
      source_ref:
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  LEAN_PATH: im-results/agent31-cryptid-boundary:im-results/agent35-d-regular-certificate:im-results/agent32-cryptid-padding:im-results/agent2-cryptid-continuity:im-results/agent25-cryptid-doublezero:im-results/agent35-cryptid-code:im-results/agent32-cryptid-third:im-results/agent31-d-exceptional:im-results/agent35-d-sixth-rejoin:im-results/agent37-cryptid-model-bridge:im-results/agent2-packet-shift:im-results/agent37-d-timing-cocycle:im-results/agent2-root-language-exit
jobs:
  audit:
    name: Kernel-check D-root exceptions 34-38
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout pinned original source snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          path: source
      - name: Checkout current proof submissions
        uses: actions/checkout@v4
        with:
          ref: main
          path: proof
      - name: Restore pinned original D sources and DRegular proof
        working-directory: source
        run: |
          python3 -m pip install --quiet filelock
          python3 im-results/agent31-cryptid-boundary/unpack.py
          python3 im-results/agent35-d-regular-certificate/restore_sources.py
          python3 im-results/agent25-cryptid-doublezero/unpack.py
          python3 im-results/agent2-cryptid-continuity/restore_a_regular.py
          python3 im-results/agent2-cryptid-continuity/restore_e_regular.py
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download the staged D-root audit
        uses: actions/download-artifact@v4
        with:
          name: d-root-seed31-audit
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: source-artifact
      - name: Download the Seed31 certificate and exception-33 modules
        uses: actions/download-artifact@v4
        with:
          name: seed31-first-stop-certificate
          run-id: ${{ inputs.certificate_run_id }}
          github-token: ${{ github.token }}
          path: certificate-artifact
      - name: Restore audited Lean objects and proof dependencies
        run: |
          cp source-artifact/lean-audit.log source/lean-audit.log
          tar -xzf source-artifact/lean-stage.tar.gz -C source
          mkdir -p source/im-results/agent2-root-language-exit
          mkdir -p source/im-results/agent25-cryptid-doublezero
          cp certificate-artifact/im-results/agent2-root-language-exit/Seed31FirstStopCertificate.olean source/im-results/agent2-root-language-exit/
          cp certificate-artifact/im-results/agent2-root-language-exit/BlankThirtyFirstRejoin.olean source/im-results/agent2-root-language-exit/
          cp certificate-artifact/im-results/agent2-root-language-exit/BlankThirtySecondRejoin.olean source/im-results/agent2-root-language-exit/
          cp certificate-artifact/im-results/agent2-root-language-exit/BlankThirtyThirdRejoin.olean source/im-results/agent2-root-language-exit/
          cp certificate-artifact/im-results/agent25-cryptid-doublezero/E3SourceRejoin.olean source/im-results/agent25-cryptid-doublezero/
          cp certificate-artifact/im-results/agent25-cryptid-doublezero/Exception33Q5Rejoin.olean source/im-results/agent25-cryptid-doublezero/
          mkdir -p source/im-results/agent37-d-timing-cocycle
          cp proof/im-results/agent37-d-timing-cocycle/BlankThirtyFourthToThirtySixthRejoin.lean source/im-results/agent37-d-timing-cocycle/
          cp proof/im-results/agent37-d-timing-cocycle/BlankThirtySeventhToThirtyEighthRejoin.lean source/im-results/agent37-d-timing-cocycle/
      - name: Compile exact exceptions 34-38 and their source reentries
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a lean-audit.log) 2>&1
          lean --version
          T=im-results/agent37-d-timing-cocycle
          lean -DmaxRecDepth=55000 -o "$T/BlankThirtyFourthToThirtySixthRejoin.olean" "$T/BlankThirtyFourthToThirtySixthRejoin.lean"
          lean -DmaxRecDepth=55000 -o "$T/BlankThirtySeventhToThirtyEighthRejoin.olean" "$T/BlankThirtySeventhToThirtyEighthRejoin.lean"
          if grep -Eq 'sorryAx|native_decide' lean-audit.log; then
            echo "Rejected forbidden axiom dependency" >&2
            exit 1
          fi
          find im-results -type f -name '*.olean' -print0 | tar --null -czf lean-stage.tar.gz --files-from=-
      - name: Preserve exceptions 34-38 audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d-root-exceptions34-38-audit
          path: |
            source/lean-audit.log
            source/lean-stage.tar.gz
            source/im-results/agent37-d-timing-cocycle/BlankThirtyFourthToThirtySixthRejoin.olean
            source/im-results/agent37-d-timing-cocycle/BlankThirtySeventhToThirtyEighthRejoin.olean
          if-no-files-found: warn
