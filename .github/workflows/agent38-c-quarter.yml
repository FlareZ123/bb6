name: Agent 38 Machine C energy cutoff (manual source audit)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify unmodified original CLine and energy theorem
        run: |
          mkdir -p /tmp/a38-lean
          cp im-results/agent11-c-line/CLine.lean /tmp/a38-lean/CLine.lean
          cp im-results/agent38-c-quarter/CQuarter.lean /tmp/a38-lean/CQuarter.lean
          cp im-results/agent38-c-quarter/CQuarterBridge.lean /tmp/a38-lean/CQuarterBridge.lean
          cp im-results/agent38-c-quarter/CBlankImproved.lean /tmp/a38-lean/CBlankImproved.lean
          cp im-results/agent38-c-quarter/CBlankBridge.lean /tmp/a38-lean/CBlankBridge.lean
          cp im-results/agent38-c-quarter/CJumpCore.lean /tmp/a38-lean/CJumpCore.lean
          cp im-results/agent38-c-quarter/CJumpWitness.lean /tmp/a38-lean/CJumpWitness.lean
          cp im-results/agent38-c-quarter/CJumpWitnessBridge.lean /tmp/a38-lean/CJumpWitnessBridge.lean
          cp im-results/agent38-c-quarter/CJumpSafety.lean /tmp/a38-lean/CJumpSafety.lean
          cp im-results/agent38-c-quarter/CFiniteSafety.lean /tmp/a38-lean/CFiniteSafety.lean
          cp im-results/agent38-c-quarter/CFiniteSafetyBridge.lean /tmp/a38-lean/CFiniteSafetyBridge.lean
          cp im-results/agent38-c-quarter/CFiniteSafetyGeneric.lean /tmp/a38-lean/CFiniteSafetyGeneric.lean
          cp im-results/agent38-c-quarter/CFiniteGateTransfer.lean /tmp/a38-lean/CFiniteGateTransfer.lean
          cp im-results/agent38-c-quarter/CHighGateCriterion.lean /tmp/a38-lean/CHighGateCriterion.lean
          cd /tmp/a38-lean
          export LEAN_PATH="."
          lean --version
          lean -o CLine.olean CLine.lean
          lean -o CQuarter.olean CQuarter.lean
          lean -o CQuarterBridge.olean CQuarterBridge.lean
          lean -o CBlankImproved.olean CBlankImproved.lean
          lean CBlankBridge.lean
          lean -o CJumpCore.olean CJumpCore.lean
          lean -o CJumpWitness.olean CJumpWitness.lean
          lean -o CJumpWitnessBridge.olean CJumpWitnessBridge.lean
          lean -o CJumpSafety.olean CJumpSafety.lean
          lean -o CFiniteSafety.olean CFiniteSafety.lean
          lean -o CFiniteSafetyBridge.olean CFiniteSafetyBridge.lean
          lean CFiniteSafetyGeneric.lean
          lean CFiniteGateTransfer.lean
          lean CHighGateCriterion.lean
