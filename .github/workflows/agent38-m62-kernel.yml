name: Agent38 Raw43 M62 regular zipper theorem (Lean)
run-name: "Agent38 M62 source check: ${{ inputs.target }}"
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Finite exact section prelude or complete infinite invariant"
        type: choice
        options: [core, grammar, carry, right, b, full, m61, m59, m176, m413, m558, m627, m711, m905, raw45-m6, raw45-m1, raw45-m2, raw45-m5, raw45-m3, raw45-m4, raw45-b1la-a1lc-l1, raw45-b1la-a1lc-l2, raw45-b1la-a1lc-ngram, raw45-b1la-a1lc-cut, raw45-cut-kid04, raw45-sharp96, raw45-cut-assembled, raw45-exact96, raw45-eleven-cycles, raw45-d2-a, raw45-d2-b, raw45-d2-c, raw45-d2-d, raw45-d3-ngram, raw45-hard-d3-a, raw45-hard-d3-b, raw44-b1rc-c1re-twohole, raw44-b1rc-c1re-m4, raw44-b1rc-c1re-m6, raw44-b1rc-c1re-m5, raw44-cut-ng00, raw44-cut-kid00, raw44-cut-assembled]
        default: core

permissions:
  contents: read

jobs:
  m62-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct exact source and compile M62 theorem
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          TARGET="im-results/agent38-raw43-pair/M62Core.lean"
          if [[ "${{ inputs.target }}" == "grammar" ]]; then
            TARGET="im-results/agent38-raw43-pair/M62Grammar.lean"
          fi
          if [[ "${{ inputs.target }}" == "carry" ]]; then
            TARGET="im-results/agent38-raw43-pair/M62Carry.lean"
          fi
          if [[ "${{ inputs.target }}" == "right" ]]; then
            TARGET="im-results/agent38-raw43-pair/M62Right.lean"
          fi
          if [[ "${{ inputs.target }}" == "b" ]]; then
            TARGET="im-results/agent38-raw43-pair/M62B.lean"
          fi
          if [[ "${{ inputs.target }}" == "m61" ]]; then
            TARGET="im-results/agent38-raw43-pair/M61Proof.lean"
          fi
          if [[ "${{ inputs.target }}" == "m59" ]]; then
            TARGET="im-results/agent38-raw43-pair/M59Proof.lean"
          fi
          if [[ "${{ inputs.target }}" == "m176" ]]; then
            TARGET="im-results/agent38-raw43-pair/M176Proof.lean"
          fi
          if [[ "${{ inputs.target }}" == "m413" ]]; then
            TARGET="im-results/agent38-raw43-pair/M413Proof.lean"
          fi
          if [[ "${{ inputs.target }}" == "m558" ]]; then
            TARGET="im-results/agent38-raw43-pair/M558Proof.lean"
          fi
          if [[ "${{ inputs.target }}" == "m627" ]]; then
            TARGET="im-results/agent38-raw43-pair/M627Proof.lean"
          fi
          if [[ "${{ inputs.target }}" == "m711" ]]; then
            TARGET="im-results/agent38-raw43-pair/M711Proof.lean"
          fi
          if [[ "${{ inputs.target }}" == "m905" ]]; then
            TARGET="im-results/agent38-raw43-pair/M905Proof.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw44-cut-ng00" || "${{ inputs.target }}" == "raw44-cut-kid00" || "${{ inputs.target }}" == "raw44-cut-assembled" ]]; then
            node im-results/agent16-raw44/generate_cut.cjs im-results/agent16-raw44/generated 128
            TARGET="im-results/agent16-raw44/generated/Raw44CutNG00.lean"
            if [[ "${{ inputs.target }}" == "raw44-cut-kid00" ]]; then
              TARGET="im-results/agent16-raw44/generated/Raw44CutKid00.lean"
            fi
            if [[ "${{ inputs.target }}" == "raw44-cut-assembled" ]]; then
              TARGET="im-results/agent16-raw44/generated/Raw44CutAssembled.lean"
            fi
          fi
          if [[ "${{ inputs.target }}" == "raw44-b1rc-c1re-m5" ]]; then
            TARGET="im-results/agent16-raw44/Raw44B1RC_C1RE_M5Growth.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw44-b1rc-c1re-m6" ]]; then
            TARGET="im-results/agent16-raw44/Raw44B1RC_C1RE_M6Growth.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw44-b1rc-c1re-m4" ]]; then
            TARGET="im-results/agent16-raw44/Raw44B1RC_C1RE_M4Growth.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw44-b1rc-c1re-twohole" ]]; then
            TARGET="im-results/agent16-raw44/Raw44B1RC_C1RE_TwoHoleGrowth.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-m1" ]]; then
            TARGET="im-results/agent24-raw45/Raw45M1Growth.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-cut-assembled" ]]; then
            TARGET="im-results/agent24-raw45/Raw45CutAssembled.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-d3-ngram" ]]; then
            TARGET="im-results/agent24-raw45/Raw45Depth3NGram63.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-hard-d3-a" ]]; then
            TARGET="im-results/agent24-raw45/Raw45HardD3A.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-hard-d3-b" ]]; then
            TARGET="im-results/agent24-raw45/Raw45HardD3B.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-d2-a" ]]; then
            TARGET="im-results/agent24-raw45/Raw45Depth2CyclesA.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-d2-b" ]]; then
            TARGET="im-results/agent24-raw45/Raw45Depth2CyclesB.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-d2-c" ]]; then
            TARGET="im-results/agent24-raw45/Raw45Depth2CyclesC.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-d2-d" ]]; then
            TARGET="im-results/agent24-raw45/Raw45Depth2CyclesD.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-eleven-cycles" ]]; then
            TARGET="im-results/agent24-raw45/Raw45ElevenDirectCycles.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-exact96" ]]; then
            TARGET="im-results/agent24-raw45/Raw45Exact96.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-sharp96" ]]; then
            TARGET="im-results/agent24-raw45/Raw45Sharp96Witness.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-cut-kid04" ]]; then
            TARGET="im-results/agent24-raw45/Raw45CutKid04.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-b1la-a1lc-cut" ]]; then
            TARGET="im-results/agent24-raw45/Raw45B1LA_A1LC_FullCut.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-b1la-a1lc-ngram" ]]; then
            TARGET="im-results/agent24-raw45/Raw45B1LA_A1LC_NGram68.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-b1la-a1lc-l2" ]]; then
            TARGET="im-results/agent24-raw45/Raw45B1LA_A1LC_L2Growth.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-b1la-a1lc-l1" ]]; then
            TARGET="im-results/agent24-raw45/Raw45B1LA_A1LC_L1Growth.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-m3" ]]; then
            TARGET="im-results/agent24-raw45/Raw45M3Growth.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-m4" ]]; then
            TARGET="im-results/agent24-raw45/Raw45M4Growth.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-m5" ]]; then
            TARGET="im-results/agent24-raw45/Raw45M5Growth.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-m2" ]]; then
            TARGET="im-results/agent24-raw45/Raw45M2Growth.lean"
          fi
          if [[ "${{ inputs.target }}" == "raw45-m6" ]]; then
            TARGET="im-results/agent24-raw45/Raw45M6Growth.lean"
          fi
          if [[ "${{ inputs.target }}" == "full" ]]; then
            TARGET="im-results/agent38-raw43-pair/M62Proof.lean"
          fi
          python tools/lean_compile_closure.py --workdir /tmp/agent38-m62 --jobs 4 "$TARGET" 2>&1 | tee /tmp/agent38-m62.log
          python im-results/agent4-raw109/audit_axioms.py /tmp/agent38-m62.log
