name: Agent 38 mixed96 analytic inverse cores (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel check original-coordinate arithmetic core
        run: |
          cd im-results/agent38-mixed96-reverse
          lean --version
          LEAN_PATH=. lean -o CoreAnalytic.olean CoreAnalytic.lean
          cp ../agent41-mixed96/SecondMod96.lean .
          LEAN_PATH=. lean -o SecondMod96.olean SecondMod96.lean
          LEAN_PATH=. lean -o SecondWide.olean SecondWide.lean
          LEAN_PATH=. lean -o CoreCaseLemmas.olean CoreCaseLemmas.lean
