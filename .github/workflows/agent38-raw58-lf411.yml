name: Agent 38 Raw58 LF411 sweep certificate

on:
  # Keep this proof audit manual while the source theorem is still under repair.
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Reconstruct BB6 coverage module
        run: python im-results/agent13-coverage/unpack.py
      - name: Compile theorem closure
        run: |
          python tools/lean_compile_closure.py \
            --workdir /tmp/agent38-raw58-lf411 \
            --jobs 8 \
            --theorem BB6.Agent38Raw58LF411.never \
            im-results/agent38-raw58-triangular-sweep/Raw58LF411.lean
