name: Agent 38 authentic root q4Tail-to-S0 frame identity
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact import closure for the authentic root frame identity
        run: |
          set -euo pipefail
          python3 tools/lean_compile_closure.py \
            im-results/agent38-root-q4tail/P2RootS0FrameIdentity.lean \
            --jobs 8 \
            --workdir /tmp/agent38-root-s0-frame-identity \
            | tee /tmp/agent38-root-s0-frame-identity.log
          python3 - <<'PY'
          import pathlib
          log = pathlib.Path("/tmp/agent38-root-s0-frame-identity.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "q4TailS0SourceGuards",
              "q4TailS0Frame_eq_s0Config",
              "tm63_root_second_q4Tail_eq_s0Config",
          )
          for name in names:
              lines = [line for line in log.splitlines()
                       if "depends on axioms:" in line
                       and line.split(" depends on axioms:", 1)[0].split(".")[-1] == name]
              if len(lines) != 1:
                  raise SystemExit(f"expected one axiom profile for {name}, got {len(lines)}")
              profile = lines[0].split("depends on axioms:", 1)[1].strip()
              if not (profile.startswith("[") and profile.endswith("]")):
                  raise SystemExit(f"unrecognized profile for {name}: {profile}")
              axioms = {x.strip() for x in profile[1:-1].split(",") if x.strip()}
              bad = axioms - allowed
              if bad:
                  raise SystemExit(f"nonstandard axioms in {name}: {sorted(bad)}")
              print(f"{name}: {sorted(axioms)}")
          PY
          if grep -R -nE 'sorryAx|native_decide' /tmp/agent38-root-s0-frame-identity --include='*.lean'; then
            echo '::error::sorryAx or native_decide found in the authentic root frame import closure'
            exit 1
          fi
      - name: Upload Lean diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent38-root-s0-frame-identity-diagnostics
          path: /tmp/agent38-root-s0-frame-identity.log
          if-no-files-found: ignore
          retention-days: 3
