name: Agent 39 BB429 three 1021-sector native Cryptids proof (manual)

on:
  workflow_dispatch:
    inputs:
      original_source:
        description: 'Also build the original pinned Cryptids dependency'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bb429-source-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_SHA: c86f15861709b76042998c5211c7b2f83991621b
      ORIGINAL_MODULE: BusyBeaver.BB6.M_1RB0LF_1RC1RA_0RD0RB_1LEHHH_0LA1LE_1RD1LA
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned upstream Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Checkout fixed original Cryptids source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          git -C /tmp/cryptids checkout --quiet "$UPSTREAM_SHA"
          test "$(git -C /tmp/cryptids rev-parse HEAD)" = "$UPSTREAM_SHA"
      - name: Fetch original pinned Mathlib cache
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          lake exe cache get
          df -h /
      - name: Build original raw-TM accelerator
        working-directory: /tmp/cryptids
        shell: bash
        run: lake build "$ORIGINAL_MODULE"
      - name: Compile all unchanged local BB429 modules and source bridge
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/im-results/agent5-429-rank/BB429Rank.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent5-429-rank/BB429Burst.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent6-harmonic429/"*.lean .
          cp "$GITHUB_WORKSPACE/im-results/agent18-429-253/"*.lean .
          cp "$GITHUB_WORKSPACE/im-results/agent1-429-1661/SourceRawHalt86.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent1-429-forced-normalize/BB429ForcedNormalize.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent1-429-forced-normalize/SourceForcedNormalize.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent39-429-1021/"*.lean .
          base64 -d "$GITHUB_WORKSPACE/im-results/agent1-429-1661/BB429No1661mod2048.lean.gz.b64" | gzip -d > BB429No1661mod2048.lean
          echo "05576abaf58d8b62f97e2390b017bc1e5086693512339fc6abdb3f386c6a9793  BB429No1661mod2048.lean" | sha256sum -c -
          base64 -d "$GITHUB_WORKSPACE/im-results/agent1-429-893/BB429No893mod2048.lean.gz.b64" | gzip -d > BB429No893mod2048.lean
          echo "7429ab3280d28d13f5e21702523ed750c9a2e61679ff10e9e9108534b5984b32  BB429No893mod2048.lean" | sha256sum -c -
          for module in BB429Rank BB429Burst BB429LowOddMod8 BB429InverseRay BB429No125mod1024 BB429No381mod1024 BB429No509mod1024 BB429No1661mod2048 BB429No893mod2048 BB429ForcedNormalize BB429PowerBarrier BB429PowerBarrierBurst BB429NonFirstBurst BB429LastReset BB429FirstRunEq BB429TerminalReset BB429ElevenSeed ReturnLadder EscapeRay EscapeRoot ExitTransfer CorridorExceptions WholeCorridor VExitTransfer VWholeCorridor CrossRayReturn OddBoundary CrossRayOverflow OddUBounce OddCascade OddVSecondary OddVHigh OddVThirdOverflow OddVHighReturn BB429Mod8 BB429Extra11 BB429Extra19 BB429OneGate BB429Thirteen BB429Depth4 BB429Mod32Six BB429NoThree BB429HaltFeeder BB429NoTwentyFive BB429NewGate BB429Deep17 BB429TwentyOne BB429InverseParity BB429NoTwentyNine128 BB429NoNinetyThree128 BB429NoSixtyOne128 BB429No253 BB429No381 SourceLadder SourceMod16 SourceMod32 SourceMod32Six SourceRawHaltFunnel SourceRawHaltIff SourceRawHaltFive SourceRawHaltFour SourceRawHaltRefined SourceRawHaltNo253 SourceRawHalt1024 SourceRawHalt46 SourceRawHaltNo381 SourceRawHalt45 SourceRawHalt44 SourceRawHalt86 SourceForcedNormalize BB429NewResidue BB429No12285mod16384 BB429No1021More SourceRawHalt1021; do
            echo "::group::Compile $module"
            lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean"
            echo "::endgroup::"
          done

