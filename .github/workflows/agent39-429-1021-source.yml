name: Agent 39 rooted BB429 12285/16384 sector proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean compiler
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check original unchanged BB429 accelerator and quantified inverse theorem
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent6-harmonic429:im-results/agent39-429-1021
        run: |
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -o im-results/agent6-harmonic429/BB429Mod8.olean im-results/agent6-harmonic429/BB429Mod8.lean
          lean -DmaxRecDepth=30000 -DmaxHeartbeats=50000000 -o im-results/agent6-harmonic429/BB429NewResidue.olean im-results/agent6-harmonic429/BB429NewResidue.lean
          lean -DmaxRecDepth=8192 -DmaxHeartbeats=10000000 -o im-results/agent39-429-1021/BB429No12285mod16384.olean im-results/agent39-429-1021/BB429No12285mod16384.lean
          lean -DmaxRecDepth=32768 -DmaxHeartbeats=30000000 -o im-results/agent39-429-1021/BB429No1021More.olean im-results/agent39-429-1021/BB429No1021More.lean
          lean -DmaxRecDepth=16000 -DmaxHeartbeats=15000000 -o im-results/agent39-429-1021/BB429RootEven8.olean im-results/agent39-429-1021/BB429RootEven8.lean
          lean -DmaxRecDepth=16000 -DmaxHeartbeats=15000000 -o im-results/agent39-429-1021/BB429RootMod16.olean im-results/agent39-429-1021/BB429RootMod16.lean
          lean -DmaxRecDepth=32768 -DmaxHeartbeats=10000000 im-results/agent39-429-1021/BB429No1021Five.lean
