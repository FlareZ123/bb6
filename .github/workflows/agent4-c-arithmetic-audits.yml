name: Agent 4 Machine C arithmetic method reproducibility (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-arithmetic-audits:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test published executable witnesses and exact inverse enumeration
        run: |
          set -e
          python3 im-results/agent4-c-dyadic-barrier/verify_all_moduli.py
          python3 im-results/agent4-c-dyadic-barrier/verify_odd_left_all_moduli.py
          python3 im-results/agent4-c-dyadic-barrier/verify_odd_left_totient.py
          python3 im-results/agent4-c-dyadic-barrier/verify_low_gate_all_depths.py
