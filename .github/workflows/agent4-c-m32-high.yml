name: Agent 4 Machine C original-source M32 high gateway audit
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-high-32:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Recompute exact original B8/M32 forward closure
        run: python3 tools/agent43_c32_certificate.py
      - name: Retrieve the 40 independently kernel-checked M32 proof blocks
        uses: actions/download-artifact@v4
        with:
          run-id: 45190788952
          github-token: ${{ github.token }}
          pattern: a43-m32-olean-*
          merge-multiple: true
          path: tools
      - name: Independently reconstruct M16/M32 high halting-gateway comparison
        run: python3 tools/agent4_c32_high_census.py
      - name: Check full original transition semantics and new all-high certificates
        run: |
          cd tools
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-line/CLine.lean" CLine.lean
          cp "$GITHUB_WORKSPACE/im-results/agent43-c-quotient-kernel/M32HighAll.lean" M32HighAll.lean
          cp "$GITHUB_WORKSPACE/im-results/agent43-c-quotient-kernel/M32HighSmall.lean" M32HighSmall.lean
          cp "$GITHUB_WORKSPACE/im-results/agent4-c-m32-high/HighSource.lean" HighSource.lean
          export LEAN_PATH=.
          lean --version
          lean -o CCert32Pure.olean CCert32Pure.lean
          lean -o CLine.olean CLine.lean
          test "$(find . -maxdepth 1 -name 'P32Block*.olean' | wc -l)" -eq 40
          for f in CQuotientSound32 CMapIf32 CGlobal32 CFull32 CExclusions32 CSourceBridge32 M32HighAll M32HighSmall HighSource; do
            echo "Kernel-checking $f"
            lean -o "$f.olean" "$f.lean"
          done
      - name: Compile the current all-depth criterion and M32 section bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a13-m32-extra
          cp im-results/agent38-c-section-mod4/ThirdStageOddDepth.lean.xz.b64 /tmp/a13-m32-extra/
          cd /tmp/a13-m32-extra
          base64 -d ThirdStageOddDepth.lean.xz.b64 | xz -d > ThirdStageOddDepth.lean
          echo "48fb1fcbf2b3a409c7bafb07a9f1df78a087b02d8cadeac51b2b81b02f301ed0  ThirdStageOddDepth.lean" | sha256sum -c -
          cd "$GITHUB_WORKSPACE"
          python3 tools/lean_compile_closure.py \
            im-results/agent11-c-low58/CThreeSixAllCriterion.lean \
            im-results/agent15-c-halting/M32SectionEmbedding.lean \
            --workdir /tmp/a13-m32-c3six \
            --source-root /tmp/a13-m32-extra \
            --jobs 4 \
            --lean "$(command -v lean)" \
            --override BounceParity=im-results/agent46-c-jump/BounceParity.lean
      - name: Kernel-check the exact CThreeSix plus M32 high criterion
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="/tmp/a13-m32-c3six:$GITHUB_WORKSPACE/tools"
          lean --version
          lean -o /tmp/a13-m32-c3six/CThreeSixM32Integration.olean \
            im-results/agent13-residual-frontier/CThreeSixM32Integration.lean
