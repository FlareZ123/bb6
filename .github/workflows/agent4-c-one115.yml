name: Agent 4 Machine C 115-mod-128 root ancestry (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-section-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify new unconditional exclusion against existing unchanged source
        run: |
          set -e
          mkdir -p /tmp/agent4-c-one115
          cp im-results/agent11-c-line/CLine.lean /tmp/agent4-c-one115/
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/agent4-c-one115/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/agent4-c-one115/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef,FastSectionProof,FastSectionHalting,Agent46CBridge}.lean /tmp/agent4-c-one115/
          cp im-results/agent3-c-bounce-inverse/{BounceInverse,EvenTargetForward,BounceEvenThree,BounceEvenNoFour,BounceEvenExact,BounceOddExact,BounceAllExact,SectionAllInverse,EvenOddFourExact,OddSliver,OddSevenSliver,OddOddWedge,OddOddOrbit,OddOddVal3,OddOddVal3Orbit,OddOddLowVal}.lean /tmp/agent4-c-one115/
          cp im-results/agent3-c-odd-image/{Agent3CImage,Agent3COneFamily,Agent3COrbitIff}.lean /tmp/agent4-c-one115/
          cp im-results/agent38-c-section-mod4/Agent38SectionParity.lean /tmp/agent4-c-one115/
          cp im-results/agent24-c48/{EvenEvenInverse,OddEvenInverse,ExtraEvenOrbit,EvenRightSixOrbit}.lean /tmp/agent4-c-one115/
          cp im-results/agent4-c-dyadic-barrier/One115Source.lean /tmp/agent4-c-one115/
          cd /tmp/agent4-c-one115
          export LEAN_PATH="."
          lean --version
          for f in CLine GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef FastSectionProof FastSectionHalting Agent46CBridge; do
            lean -o "$f.olean" "$f.lean"
          done
          for f in BounceInverse Agent3CImage Agent3COneFamily Agent3COrbitIff Agent38SectionParity EvenTargetForward BounceEvenThree BounceEvenNoFour BounceEvenExact BounceOddExact BounceAllExact SectionAllInverse EvenOddFourExact; do
            lean -o "$f.olean" "$f.lean"
          done
          for f in OddSliver OddSevenSliver OddOddWedge OddOddOrbit OddOddVal3 OddOddVal3Orbit OddOddLowVal; do
            lean -o "$f.olean" "$f.lean"
          done
          for f in EvenEvenInverse OddEvenInverse ExtraEvenOrbit EvenRightSixOrbit; do
            lean -o "$f.olean" "$f.lean"
          done
          lean One115Source.lean
          echo "Source-checked Machine C 115-mod-128 ancestry proof complete at $(git -C $GITHUB_WORKSPACE rev-parse HEAD)"
