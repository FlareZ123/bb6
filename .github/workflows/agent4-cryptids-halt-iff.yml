name: Agent 4 generic Cryptids physical halting equivalence (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/cryptids
          ref: ced8f9f44f67a167d5ecc03e687b048c67926371
          path: cryptids
      - name: Install pinned upstream Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify complete generic halting bridge
        working-directory: cryptids
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
          lake exe cache get
          lake build Cryptids.Machines
          mkdir -p BB6Agent4
          cp ../im-results/agent8-coverage-contract/Frontier.lean BB6Agent4/
          cp ../im-results/agent4-coverage-smoke/RelativeTape.lean BB6Agent4/
          cp ../im-results/agent4-coverage-smoke/CryptidsTapeAdapter.lean BB6Agent4/
          cp ../im-results/agent4-coverage-smoke/CryptidsHaltIff.lean BB6Agent4/
          export LEAN_PATH=BB6Agent4
          for m in Frontier RelativeTape CryptidsTapeAdapter CryptidsHaltIff; do
            lake env lean -o "BB6Agent4/$m.olean" "BB6Agent4/$m.lean"
          done
