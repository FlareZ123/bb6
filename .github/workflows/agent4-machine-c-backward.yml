name: Agent 4 Machine C source modular backward proof (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Preserve source provenance
        shell: bash
        run: |
          git rev-parse HEAD
          sha256sum im-results/agent11-c-line/CLine.lean
          echo "0f216228d9400969b9354419016a3976bb9bc1e8a8a71c97f50db22e91dd0e1e  im-results/agent4-mixed96-backward/BackwardMod.lean" | sha256sum -c -
          echo "f1bb383aa4438d913951c544f5b5a4cc6afc8c31627b00a11f875838abf9f6cb  im-results/agent4-mixed96-backward/SourceBridge.lean" | sha256sum -c -
          echo "1293c40a254d6d58b9d7a090c5eee0594b6e7370b6a1796f58465ba34c47acd9  im-results/agent4-mixed96-backward/StopBridge.lean" | sha256sum -c -
          echo "ee622955535e77a4dd0b36120a21627db5b2760c36cca190fdf675c458ae5611  im-results/agent4-mixed96-backward/BackwardModB.lean" | sha256sum -c -
          echo "10599ac5c90e3ed37f8646e38491efe98432e3985d6ca2d3d31dd5826e2fce3e  im-results/agent4-mixed96-backward/SourceBridgeB.lean" | sha256sum -c -
          echo "d24adac1db47606ac7fde8b979b75577e2c5acc375b9b6c270acb3588cdaeec5  im-results/agent4-mixed96-backward/StopBridgeB.lean" | sha256sum -c -
          echo "4564211983282bb4a282c62aca8443f5c299cb936a94d1f23804a32ec832760b  im-results/agent4-mixed96-backward/StopBridgeAplus.lean" | sha256sum -c -
      - name: Exhaustive mixed192 finite reverse-core check (independent computational evidence)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra "$GITHUB_WORKSPACE/im-results/agent4-mixed192-backward/check_core.cpp" -o /tmp/agent4-mixed192-check
          /tmp/agent4-mixed192-check
      - name: Kernel compile against unchanged Agent11 CLine and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent4-source-proof
          cd /tmp/agent4-source-proof
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-line/CLine.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent41-mixed96/SecondMod96.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent4-mixed96-backward/"*.lean .
          export LEAN_PATH=.
          lean --version
          lean -o CLine.olean CLine.lean
          lean -o BackwardMod.olean BackwardMod.lean
          lean -o SourceBridge.olean SourceBridge.lean
          lean -o SecondMod96.olean SecondMod96.lean
          lean StopBridge.lean
          lean StopBridgeAplus.lean
          lean -o BackwardModB.olean BackwardModB.lean
          lean -o SourceBridgeB.olean SourceBridgeB.lean
          lean StopBridgeB.lean
      - name: Mixed192 analytic reverse-core experimental proof
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/agent4-source-proof
          cp "$GITHUB_WORKSPACE/im-results/agent4-mixed192-backward/BackwardMod192.lean" .
          export LEAN_PATH=.
          python3 "$GITHUB_WORKSPACE/tools/agent4_split_mixed192.py" BackwardMod192.lean
          for module in Back192Defs Back192Low Back192Zero Back192ZeroPos Back192High Back192Step; do
            echo "=== Mixed192 proof module: $module ==="
            timeout 100 lean -o "$module.olean" "$module.lean"
          done
