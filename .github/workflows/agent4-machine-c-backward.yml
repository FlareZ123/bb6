name: Agent 4 Machine C source modular backward proof (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Preserve source provenance
        shell: bash
        run: |
          git rev-parse HEAD
          sha256sum im-results/agent11-c-line/CLine.lean
          echo "c4f7c6a9c6cdb93c9318fd31d71e1fd3e645164b1f8d470033163401f8923e02  im-results/agent4-mixed96-backward/BackwardMod.lean" | sha256sum -c -
          echo "476c4fe1417e8820efebe78b92577e1067e577efa9bf553f018d19b46d329eb8  im-results/agent4-mixed96-backward/SourceBridge.lean" | sha256sum -c -
          echo "1293c40a254d6d58b9d7a090c5eee0594b6e7370b6a1796f58465ba34c47acd9  im-results/agent4-mixed96-backward/StopBridge.lean" | sha256sum -c -
          echo "ee622955535e77a4dd0b36120a21627db5b2760c36cca190fdf675c458ae5611  im-results/agent4-mixed96-backward/BackwardModB.lean" | sha256sum -c -
          echo "10599ac5c90e3ed37f8646e38491efe98432e3985d6ca2d3d31dd5826e2fce3e  im-results/agent4-mixed96-backward/SourceBridgeB.lean" | sha256sum -c -
          echo "d24adac1db47606ac7fde8b979b75577e2c5acc375b9b6c270acb3588cdaeec5  im-results/agent4-mixed96-backward/StopBridgeB.lean" | sha256sum -c -
      - name: Kernel compile against unchanged Agent11 CLine and audit axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent4-source-proof
          cd /tmp/agent4-source-proof
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-line/CLine.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent41-mixed96/SecondMod96.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent4-mixed96-backward/"*.lean .
          export LEAN_PATH=.
          lean --version
          lean -o CLine.olean CLine.lean
          lean -o BackwardMod.olean BackwardMod.lean
          lean -o SourceBridge.olean SourceBridge.lean
          lean -o SecondMod96.olean SecondMod96.lean
          lean StopBridge.lean
          lean -o BackwardModB.olean BackwardModB.lean
          lean -o SourceBridgeB.olean SourceBridgeB.lean
          lean StopBridgeB.lean
