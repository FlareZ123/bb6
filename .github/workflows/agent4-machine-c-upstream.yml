name: Agent 4 original Cryptids source bridge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone pinned upstream
        run: |
          git clone https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          git -C /tmp/cryptids checkout c86f15861709b76042998c5211c7b2f83991621b
          test "$(git -C /tmp/cryptids rev-parse HEAD)" = c86f15861709b76042998c5211c7b2f83991621b
      - name: Fetch upstream cache
        working-directory: /tmp/cryptids
        run: lake exe cache get
      - name: Build original Machine C accelerator
        working-directory: /tmp/cryptids
        run: lake build BusyBeaver.BB6.M_1RB1LC_1LC1RD_1LA0LB_0RB1RE_1RF0RA_HHH0RC
      - name: Verify original-source theorem transfer
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-line/CLine.lean" CLine.lean
          for n in BackwardMod SourceBridge BackwardModB SourceBridgeB SourceUpstreamBridge; do
            cp "$GITHUB_WORKSPACE/im-results/agent4-mixed96-backward/$n.lean" "$n.lean"
          done
          for n in CLine BackwardMod SourceBridge BackwardModB SourceBridgeB; do
            lake env lean -o ".lake/build/lib/lean/$n.olean" "$n.lean"
          done

          lake env lean -o ".lake/build/lib/lean/SourceUpstreamBridge.olean" SourceUpstreamBridge.lean
      - name: Verify the complete 504-cell original-upstream gate exclusion
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/im-results/agent4-mixed192-backward/BackwardMod192.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent4-mixed192-backward/BackwardMod192B.lean" .
          python3 "$GITHUB_WORKSPACE/tools/agent4_split_mixed192.py" BackwardMod192.lean
          python3 "$GITHUB_WORKSPACE/tools/agent4_split_mixed192b.py" BackwardMod192B.lean
          for n in Back192Defs Back192Low Back192Zero Back192ZeroPos Back192HighEven Back192HighOdd Back192HighPos Back192Step; do
            lake env lean -o ".lake/build/lib/lean/$n.olean" "$n.lean"
          done
          for n in SourceBridge192 Agent46TerminalLifts SourceBridge192Companion; do
            cp "$GITHUB_WORKSPACE/im-results/agent4-mixed192-backward/$n.lean" . || cp "$GITHUB_WORKSPACE/im-results/agent46-c-terminal-lifts/$n.lean" .
            lake env lean -o ".lake/build/lib/lean/$n.olean" "$n.lean"
          done
          for n in Back192BDefs Back192BLow Back192BZero Back192BZeroPos Back192BHighEven Back192BHighOdd Back192BHighPos Back192BStep; do
            lake env lean -o ".lake/build/lib/lean/$n.olean" "$n.lean"
          done
          for n in SourceBridge192B StopBridge192AB WideStop SideStop; do
            cp "$GITHUB_WORKSPACE/im-results/agent4-mixed192-backward/$n.lean" .
            lake env lean -o ".lake/build/lib/lean/$n.olean" "$n.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent4-mixed192-backward/Upstream504.lean" .
          lake env lean Upstream504.lean
