name: Agent40 Raw34 pair full endgame closure
on:
  workflow_dispatch:
    inputs:
      parent_run_id:
        description: Run ID containing the source-accepted Raw34 3,233-row parent Cover artifact
        required: true
        type: string
        default: "46175041055"
      far_run_id:
        description: Run ID containing the source-accepted four-state FAR bank artifact
        required: true
        type: string
        default: "46163747316"
permissions:
  contents: read
  actions: read
jobs:
  close-parent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download source-accepted exact parent Cover
        uses: actions/download-artifact@v4
        with:
          name: raw34-pair-final3233-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.parent_run_id }}
          path: /tmp/a40-raw34-parent
      - name: Download source-accepted four-state FAR bank
        uses: actions/download-artifact@v4
        with:
          name: raw34-far3233-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.far_run_id }}
          path: /tmp/a50-raw34-far
      - name: Compose parent, verify exact frontier, and close all 168 residuals
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          P=/tmp/a40-raw34-parent
          F=/tmp/a50-raw34-far
          W=/tmp/a40-raw34-endgame
          mkdir -p "$W/generated"
          test -f "$P/generated/Raw34PairFinal3233Cover.lean"
          test -f "$P/generated/finalRows.json"
          test -f "$P/final-manifest.json"
          test -f "$F/hard3233.txt"
          test -f "$F/far.jsonl"
          test -f "$F/generated/manifest.json"
          cp "$P"/generated/*.lean "$W/generated/"
          cp "$F"/generated/Raw34FAR3233Shard*.lean "$W/generated/"
          cp im-results/agent50-raw34-far3233/Raw34M2071Growth.lean "$W/generated/Raw34M2071Growth.lean"
          cp "$P/generated/finalRows.json" "$W/finalRows.json"
          cp "$P/final-manifest.json" "$W/parent-manifest.json"
          cp "$F/generated/manifest.json" "$W/far4-manifest.json"
          cp "$F/hard3233.txt" "$W/hard3233.txt"
          cp "$F/far.jsonl" "$W/far4.jsonl"
          python - "$W/finalRows.json" "$W/hard3233.txt" "$W/far4-manifest.json" "$W/parent-manifest.json" <<'PY'
          import hashlib,json,sys
          final=json.load(open(sys.argv[1]))
          hard=[]
          for line in open(sys.argv[2]):
              if not line.strip(): continue
              xs=[int(x) for x in line.split()]
              assert xs[0]==len(hard) and len(xs)==13
              hard.append(xs[1:])
          far=json.load(open(sys.argv[3])); parent=json.load(open(sys.argv[4]))
          digest=lambda rows: hashlib.sha256((json.dumps(rows,separators=(",",":"))+"\n").encode()).hexdigest()
          assert len(final)==len(hard)==3233
          assert len({tuple(r) for r in final})==3233
          assert len({tuple(r) for r in hard})==3233
          assert {tuple(r) for r in final}=={tuple(r) for r in hard}
          canonical=digest(sorted(final))
          assert canonical=="aa640978cd0aa16452a872d5a38ef5081b3696720aaad0474db051ab7b1b85aa",canonical
          assert parent["canonicalFinalResidualSha256"]==canonical
          assert far["canonicalFrontierSha256"]==canonical
          assert far["orderedFrontierSha256"]==digest(hard)
          assert far["farHits"]==3065 and far["misses"]==168
          assert len(far["missRows"])==168
          assert far["canonicalMissSha256"]==digest(sorted(far["missRows"]))
          print("PASS: parent and FAR4 artifacts have identical 3,233-machine frontiers")
          PY
          python im-results/agent50-raw34-far3233/generate_shrink_to_168.py \
            --hard "$W/hard3233.txt" --far "$W/far4.jsonl" \
            --far-manifest "$W/far4-manifest.json" \
            --final-rows "$W/finalRows.json" \
            --output "$W/generated" --shard-size 40 | tee "$W/far168-generation.json"
          cp im-results/agent50-raw34-plan/far.cpp "$W/far.cpp"
          python - "$W/far.cpp" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          old='int main(int argc,char**argv){int limit=argc>1?atoi(argv[1]):4;if(limit<1||limit>6)return 2;for(int d=1;d<=limit;d++){'
          new='int main(int argc,char**argv){int limit=argc>1?atoi(argv[1]):4;int minD=argc>2?atoi(argv[2]):1;if(limit<1||limit>6||minD<1||minD>limit)return 2;for(int d=minD;d<=limit;d++){'
          assert old in s
          s=s.replace(old,new)
          old2='for(int d=1;d<=limit&&!found;d++)'
          assert old2 in s
          s=s.replace(old2,'for(int d=minD;d<=limit&&!found;d++)')
          p.write_text(s)
          PY
          g++ -O3 -std=c++20 "$W/far.cpp" -o "$W/far"
          python - "$W/hard3233.txt" "$W/far4.jsonl" "$W/hard168.txt" <<'PY'
          import json,sys
          lines=open(sys.argv[1]).read().splitlines()
          records=[json.loads(x) for x in open(sys.argv[2]) if x.strip()]
          misses=[x["id"] for x in records if "d" not in x]
          assert len(lines)==3233 and len(records)==3233 and len(misses)==168
          open(sys.argv[3],"w").write("\n".join(lines[i] for i in misses)+"\n")
          print("FAR5 input rows:",len(misses))
          PY
          "$W/far" 5 5 < "$W/hard168.txt" > "$W/far5.jsonl" 2> "$W/far5.log"
          python - "$W/hard3233.txt" "$W/far5.jsonl" "$W/hard8.txt" "$W/misses5.json" <<'PY'
          import json,sys
          lines=open(sys.argv[1]).read().splitlines()
          records=[json.loads(x) for x in open(sys.argv[2]) if x.strip()]
          misses=[x["id"] for x in records if "d" not in x]
          assert len(records)==168 and len(misses)==9 and 2071 in misses,(len(records),misses)
          ids=[i for i in misses if i!=2071]
          assert len(ids)==8
          open(sys.argv[3],"w").write("\n".join(lines[i] for i in ids)+"\n")
          json.dump(misses,open(sys.argv[4],"w"))
          print("FAR5:",len(records)-len(misses),"hits; remaining IDs:",misses)
          PY
          "$W/far" 6 6 < "$W/hard8.txt" > "$W/far6hits.jsonl" 2> "$W/far6.log"
          python - "$W/misses5.json" "$W/far6hits.jsonl" "$W/far6.jsonl" <<'PY'
          import json,sys
          misses=json.load(open(sys.argv[1]))
          hits=[json.loads(x) for x in open(sys.argv[2]) if x.strip()]
          by_id={x["id"]:x for x in hits}
          expected={i for i in misses if i!=2071}
          assert set(by_id)==expected and len(by_id)==8
          rows=[({"id":i} if i==2071 else by_id[i]) for i in misses]
          open(sys.argv[3],"w").write("\n".join(json.dumps(x,separators=(",",":")) for x in rows)+"\n")
          print("FAR6:",len(by_id),"hits; growth row 2071 handled symbolically")
          PY
          python im-results/agent50-raw34-far3233/generate_close_168.py \
            --hard "$W/hard3233.txt" --far4 "$W/far4.jsonl" \
            --far5 "$W/far5.jsonl" --far6 "$W/far6.jsonl" \
            --output "$W/generated" --shard-size 12 | tee "$W/far168-closed-generation.json"
          python tools/lean_compile_closure.py --workdir "$W/build" \
            --source-root "$W/generated" --jobs 8 \
            --manifest "$W/closure-manifest.json" \
            --artifact-name raw34-pair-full-endgame-source \
            "$W/generated/Raw34FAR168Closed.lean" 2>&1 | tee "$W/closure.log"
          python im-results/agent4-raw109/audit_axioms.py "$W/closure.log"
          grep -F "'BB6.Agent40Raw34Final3233.cover'" "$W/closure.log"
          grep -F "'BB6.Agent50Raw34FAR168.cover'" "$W/closure.log"
          grep -F "'BB6.Agent50Raw34M2071.never'" "$W/closure.log"
          grep -F "'BB6.Agent50Raw34FAR168Closed.cover'" "$W/closure.log"
          grep -F 'theorem cover : Cover (DecidedBelow 128) BB6.Agent40Raw34PairD1LF_F0LDDepth6Data.parent := by' "$W/generated/Raw34FAR168Closed.lean"
          python - "$W/generated/far168-closed-manifest.json" "$W/closure.log" <<'PY'
          import json,re,sys
          m=json.load(open(sys.argv[1])); log=open(sys.argv[2]).read()
          assert m["residualRows"]==168 and m["far5Hits"]==159 and m["far6Hits"]==8
          assert m["growthId"]==2071
          assert m["orderedMissSha256"]=="e5a91a6700e3e2027c85923c8b6661ff8cee6e6167ad0903b525ed538ee792f9"
          assert m["theorem"]=="BB6.Agent50Raw34FAR168Closed.cover"
          assert "sorryAx" not in log
          allowed={"propext","Classical.choice","Quot.sound"}
          for theorem in ("BB6.Agent40Raw34Final3233.cover","BB6.Agent50Raw34FAR168.cover","BB6.Agent50Raw34M2071.never","BB6.Agent50Raw34FAR168Closed.cover"):
              mm=re.search(r"'"+re.escape(theorem)+r"' depends on axioms: \[([^\]]*)\]",log)
              if mm:
                  got=set(re.findall(r"[A-Za-z][A-Za-z0-9_.]*",mm.group(1)))
                  assert got<=allowed,(theorem,got)
              else:
                  assert f"'{theorem}' does not depend on any axioms" in log,theorem
          print("PASS: Raw34 D1=0LF,F0=0LD parent is covered by DecidedBelow 128; 3,233 -> 168 -> 0 residuals")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw34-pair-full-endgame-source
          path: /tmp/a40-raw34-endgame/
          if-no-files-found: warn
          compression-level: 1
          retention-days: 30
