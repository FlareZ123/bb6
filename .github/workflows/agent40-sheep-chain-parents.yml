name: Agent 40 Sheep chain witnesses (manual original source check)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Cryptids Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned original six-state source
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Prepare runner disk
        run: |
          for dir in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell; do
            if test -d "$dir"; then sudo rm -rf "$dir"; fi
          done
      - name: Build original Sheep machine
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB1LA_0LC0RC_1LE1RD_1RE1RC_1LF0LA_HHH1LE
      - name: Reconstruct and check original-source witness chain
        working-directory: /tmp/cryptids
        run: |
          python3 -m venv /tmp/agent40-venv
          /tmp/agent40-venv/bin/pip -q install filelock
          /tmp/agent40-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent16-sheep-even-return/reconstruct_all.py"
          cp "$GITHUB_WORKSPACE/im-results/agent16-sheep-even-return/SheepEven.lean" SheepEven.lean
          cp "$GITHUB_WORKSPACE/im-results/agent16-sheep-even-return/EvenEdge.lean" EvenEdge.lean
          cp "$GITHUB_WORKSPACE/im-results/agent14-sheep-even-inverse/SheepEvenInverseAlgebra.lean" SheepEvenInverseAlgebra.lean
          cp "$GITHUB_WORKSPACE/im-results/agent40-r138-peer-audit/SheepGenericConverse.lean" SheepGenericConverse.lean
          cp "$GITHUB_WORKSPACE/im-results/agent40-sheep-chain-witnesses/ChainWitnesses.lean" ChainWitnesses.lean
          cp "$GITHUB_WORKSPACE/im-results/agent40-sheep-chain-witnesses/ChainSourceWitnesses.lean" ChainSourceWitnesses.lean
          /tmp/agent40-venv/bin/python "$GITHUB_WORKSPACE/im-results/agent22-sheep-semantic-bridge/prepare_modules.py" \
            SheepEven.lean EvenEdge.lean SheepEvenInverseAlgebra.lean SheepGenericConverse.lean \
            ChainWitnesses.lean ChainSourceWitnesses.lean
          export LEAN_PATH=".:$LEAN_PATH"
          for name in SheepEven EvenEdge SheepEvenInverseAlgebra SheepGenericConverse ChainWitnesses; do
            lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean"
          done
          lake env lean ChainSourceWitnesses.lean
