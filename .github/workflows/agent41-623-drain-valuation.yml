name: Agent 41 #623 3-adic drain normal form

on:
  workflow_dispatch:
    inputs:
      check:
        description: 'Source proof target'
        type: choice
        options:
          - drain-valuation
          - fatal-family
        default: drain-valuation

permissions:
  contents: read

jobs:
  source-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install source-pinned Lean 4.35.0-rc4
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Clone cryptids at the pinned #623 source revision
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet c86f15861709b76042998c5211c7b2f83991621b
          test "$(git rev-parse HEAD)" = c86f15861709b76042998c5211c7b2f83991621b

      - name: Reclaim runner space for the Mathlib cache
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell

      - name: Restore Mathlib cache and compile the original machine
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB0LE_0RC1RC_0RD1LA_1LD0LA_1LF1LC_HHH0LA

      - name: Compile the unchanged-source parity interface
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/Parity623Source.lean" Agent49ParitySource.lean
          lake env lean -o .lake/build/lib/lean/Agent49ParitySource.olean Agent49ParitySource.lean

      - name: Compile the fatal-family source exclusion and audit axioms
        if: ${{ inputs.check == 'fatal-family' }}
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          compile() {
            cp "$GITHUB_WORKSPACE/$1" "$2.lean"
            lake env lean -o ".lake/build/lib/lean/$2.olean" "$2.lean" 2>&1 | tee -a fatal-family.log
          }
          p=im-results/agent49-parity623
          q=im-results/agent41-623-fatal-preimages
          compile "$p/FlatDrainSource.lean" Agent49FlatDrainSource
          compile "$p/DrainCorrectionGrowth.lean" Agent49DrainCorrectionGrowth
          compile "$p/InverseWindowSource.lean" Agent49InverseWindowSource
          for m in FatalFamilyInverseArithmetic FatalFamilyInverseActual FatalFamilyWindow FatalFamilyInfinite FatalFamilyDigitDecoder NearPowerDrain FatalFamilySource NearPowerFastStats NearPowerCertificate NearPowerTree NearPowerTreeSource NearPowerGenerate NearPowerChecks NearPowerExamples NearPowerPump NearPowerAffine NearPowerSymbolicStats NearPowerSymbolic NearPowerSymbolicTree NearPowerSymbolicSource NearPowerFamilyCore NearPowerFamilySource NearPowerAffineFatal; do
            compile "$q/$m.lean" "$m"
          done
          python3 "$GITHUB_WORKSPACE/$q/emit_corpus.py" > NearPowerFamilyCorpus.lean
          lake env lean -o .lake/build/lib/lean/NearPowerFamilyCorpus.olean NearPowerFamilyCorpus.lean 2>&1 | tee -a fatal-family.log
          if grep -q 'sorryAx' fatal-family.log; then
            echo 'sorryAx detected'
            exit 1
          fi

      - name: Compile the 3-adic evaluator normal form
        if: ${{ inputs.check != 'fatal-family' }}
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent41-623-3euclidean/DrainValuationNormalForm.lean" Agent41DrainValuationNormalForm.lean
          lake env lean -o .lake/build/lib/lean/Agent41DrainValuationNormalForm.olean Agent41DrainValuationNormalForm.lean

      - name: Compile the exact weighted B-drain cocycle
        if: ${{ inputs.check != 'fatal-family' }}
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent22-623-root-ray-20k/ExactDrainCocycleSource.lean" Agent22ExactDrainCocycleSource.lean
          lake env lean -o .lake/build/lib/lean/Agent22ExactDrainCocycleSource.olean Agent22ExactDrainCocycleSource.lean

      - name: Compile the three-state drain digit transducer
        if: ${{ inputs.check != 'fatal-family' }}
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent1-machine623-3euclidean-correction-bounds/DrainDigitTransducerCarry.lean" DrainDigitTransducerCarry.lean
          lake env lean -o .lake/build/lib/lean/DrainDigitTransducerCarry.olean DrainDigitTransducerCarry.lean

      - name: Compile signed coordinate correction normal form
        if: ${{ inputs.check != 'fatal-family' }}
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent1-machine623-3euclidean-correction-bounds/SignedCoordinateNormalForm.lean" Agent1SignedCoordinateNormalForm.lean
          lake env lean -o .lake/build/lib/lean/Agent1SignedCoordinateNormalForm.olean Agent1SignedCoordinateNormalForm.lean

      - name: Compile the source-exact drain/digit-statistics bridge
        if: ${{ inputs.check != 'fatal-family' }}
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent1-machine623-3euclidean-correction-bounds/DrainDigitStatsSource.lean" Agent1DrainDigitStatsSource.lean
          lake env lean -o .lake/build/lib/lean/Agent1DrainDigitStatsSource.olean Agent1DrainDigitStatsSource.lean

      - name: Compile the source-drain mass-index bridge
        if: ${{ inputs.check != 'fatal-family' }}
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent1-machine623-3euclidean-correction-bounds/DrainDigitSourceBridge.lean" Agent1DrainDigitSourceBridge.lean
          lake env lean -o .lake/build/lib/lean/Agent1DrainDigitSourceBridge.olean Agent1DrainDigitSourceBridge.lean

      - name: Audit source-drain mass-index theorem axioms
        if: ${{ inputs.check != 'fatal-family' }}
        working-directory: /tmp/cryptids
        run: |
          printf 'import Agent1DrainDigitSourceBridge\n#print axioms BB6.Agent1DrainDigitSourceBridge.sourceDrainLength_le_of_two_mul_lt_pow\n#print axioms BB6.Agent1DrainDigitSourceBridge.sourceDrainLength_le_of_mass_index\n' > Agent1DrainLengthAxiomAudit.lean
          lake env lean Agent1DrainLengthAxiomAudit.lean

      - name: Compile source-derived reset and affine carry bridge
        if: ${{ inputs.check != 'fatal-family' }}
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/im-results/agent24-machine623-shifted-reset-product/SourceDerivedReset.lean" SourceDerivedReset.lean
          lake env lean -o .lake/build/lib/lean/SourceDerivedReset.olean SourceDerivedReset.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-623-tight-window/SourceCarryAffineBridge.lean" Agent48SourceCarryAffineBridge.lean
          lake env lean -o .lake/build/lib/lean/Agent48SourceCarryAffineBridge.olean Agent48SourceCarryAffineBridge.lean 2>&1 | tee agent48-source-carry-affine-bridge.log
          if grep -q 'sorryAx' agent48-source-carry-affine-bridge.log; then
            echo 'sorryAx detected in affine source-carry bridge'
            exit 1
          fi

      - name: Audit the source drain/digit bridge axioms
        if: ${{ inputs.check != 'fatal-family' }}
        working-directory: /tmp/cryptids
        run: |
          printf 'import Agent1DrainDigitStatsSource\\n#print axioms BB6.Agent1DrainDigitStatsSource.drainB_digit_transducer\\n' > Agent1DrainDigitStatsAxiomAudit.lean
          lake env lean Agent1DrainDigitStatsAxiomAudit.lean

      - name: Compile integer carry transducer bounds
        if: ${{ inputs.check != 'fatal-family' }}
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent41-623-integer-carry-transducer/IntegerCarryTransducer.lean" Agent41IntegerCarryTransducer.lean
          lake env lean -o .lake/build/lib/lean/Agent41IntegerCarryTransducer.olean Agent41IntegerCarryTransducer.lean

      - name: Audit theorem axioms
        if: ${{ inputs.check != 'fatal-family' }}
        working-directory: /tmp/cryptids
        run: |
          printf 'import Agent41IntegerCarryTransducer\n#print axioms BB6.Agent41DrainValuationNormalForm.evalA_3adic_run\n#print axioms BB6.Agent41IntegerCarryTransducer.corrections_bounded\n#print axioms BB6.Agent41IntegerCarryTransducer.leftXCarry_closed\n#print axioms BB6.Agent41IntegerCarryTransducer.leftYCarry_closed\n#print axioms BB6.Agent41IntegerCarryTransducer.rightXCarry_closed\n#print axioms BB6.Agent41IntegerCarryTransducer.rightYCarry_closed\n#print axioms BB6.Agent41IntegerCarryTransducer.ternaryDigit_range\n#print axioms BB6.Agent41IntegerCarryTransducer.ternaryDigit_decomposition\n' > Agent41IntegerCarryAxiomAudit.lean
          lake env lean Agent41IntegerCarryAxiomAudit.lean
