name: Raw139 F1=0LF complete source audit (manual)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit SHA to compile
        required: true
        type: string
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct and compile complete original-source certificate
        run: bash im-results/agent41-raw139-f1-zeroLF/reproduce.sh
      - uses: actions/upload-artifact@v4
        with:
          name: raw139-f1-zeroLF-certified
          include-hidden-files: true
          path: |
            .tmp/a41-f1-zeroLF/manifest.json
            .tmp/a41-f1-zeroLF/log
            .tmp/a41-f1-zeroLF/build/*.olean
