name: Raw139 F1 sibling source audit (manual)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit SHA to compile
        required: true
        type: string
      sibling:
        description: Sibling to compile
        type: choice
        options: [zeroLF, zeroRC]
        default: zeroLF
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct and compile complete original-source certificate
        run: |
          case "${{ inputs.sibling }}" in
            zeroLF) bash im-results/agent41-raw139-f1-zeroLF/reproduce.sh ;;
            zeroRC) bash im-results/agent41-raw139-f1-zeroLF/reproduce-zeroRC.sh ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: raw139-f1-${{ inputs.sibling }}-certified
          include-hidden-files: true
          path: |
            .tmp/a41-f1-${{ inputs.sibling }}/manifest.json
            .tmp/a41-f1-${{ inputs.sibling }}/log
            .tmp/a41-f1-${{ inputs.sibling }}/build/*.olean
