name: Raw139 F1 sibling source audit (manual)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit SHA to compile
        required: true
        type: string
      sibling:
        description: Sibling to compile
        type: choice
        options: [zeroLF, zeroRC, zeroRB, oneLB, oneRD]
        default: zeroLF
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct and compile complete original-source certificate
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.sibling }}" in
            zeroLF)
              work=".tmp/a41-f1-zeroLF"
              script="im-results/agent41-raw139-f1-zeroLF/reproduce.sh"
              ;;
            zeroRC)
              work=".tmp/a41-f1-zeroRC"
              script="im-results/agent41-raw139-f1-zeroLF/reproduce-zeroRC.sh"
              ;;
            zeroRB)
              work=".tmp/a41-f1-zeroRB"
              script="im-results/agent41-raw139-f1-zeroLF/reproduce-zeroRB.sh"
              ;;
            oneLB)
              work=".tmp/a14-f1-oneLB"
              script="im-results/agent14-raw139-f1-oneLB/reproduce.sh"
              ;;
            oneRD)
              work=".tmp/a14-f1-oneRD"
              script="im-results/agent14-raw139-f1-oneRD/reproduce.sh"
              ;;
            *)
              echo "unknown sibling: ${{ inputs.sibling }}" >&2
              exit 2
              ;;
          esac
          bash "$script"
          echo "artifact_dir=$work" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: raw139-f1-${{ inputs.sibling }}-certified
          include-hidden-files: true
          path: |
            ${{ steps.reconstruct.outputs.artifact_dir }}/manifest.json
            ${{ steps.reconstruct.outputs.artifact_dir }}/log
            ${{ steps.reconstruct.outputs.artifact_dir }}/build/*.olean
