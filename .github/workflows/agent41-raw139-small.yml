name: Agent41 raw139 finite partial coverage
on:
  workflow_dispatch:
    inputs:
      task:
        description: Select the Raw139 source audit or the F421 FAR search
        required: false
        type: choice
        options:
          - certify
          - f421-far-search
          - f421-frontier-proof
        default: certify
permissions:
  contents: read
jobs:
  f421-far-search:
    if: ${{ inputs.task == 'f421-far-search' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build F421 FAR enumerator
        run: g++ -O3 -std=c++17 -Wall -Wextra -Wpedantic im-results/agent41-f421/search_far.cpp -o /tmp/f421-far-search
      - name: Search all canonical six-state DFAs
        run: |
          set -euo pipefail
          timeout 1740s /tmp/f421-far-search 2>&1 | tee /tmp/f421-far-search.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f421-far-search
          path: |
            /tmp/f421-far-search.log
            /tmp/f421-far.json
          if-no-files-found: warn
          retention-days: 14
  certify:
    if: ${{ inputs.task == 'certify' || inputs.task == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct coverage source
        run: python3 im-results/agent13-coverage/unpack.py
      - name: Compile source closure and audit theorem
        run: |
          set -euo pipefail
          python3 tools/lean_compile_closure.py \
            --workdir /tmp/a41-small \
            --jobs 8 \
            --theorem BB6.Agent41Raw139Small.parent_contract \
            --theorem BB6.Agent41Raw139Small.residual_count \
            --theorem BB6.Agent41Raw139Small.validated \
            --theorem BB6Coverage.Agent41Raw139E0OneLA.never \
            --theorem BB6.Agent41Raw139SmallPlus.e0_contract_plus \
            --theorem BB6.Agent41Raw139SmallPlus.parent_contract_plus \
            --theorem BB6.Agent41Raw139SmallPlus.e0_count_plus \
            --theorem BB6Coverage.Agent41Raw139ZeroLB.never \
            --theorem BB6.Agent41Raw139SmallPair.e0_contract_pair \
            --theorem BB6.Agent41Raw139SmallPair.parent_contract_pair \
            --theorem BB6.Agent41Raw139SmallPair.e0_count_pair \
            im-results/agent41-raw139-small/Raw139SmallPair.lean \
            2>&1 | tee /tmp/a41-small.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a41-small.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw139-small-source-audit
          path: |
            /tmp/a41-small
            /tmp/a41-small.log
          retention-days: 14
  f421-frontier-proof:
    if: ${{ inputs.task == 'f421-frontier-proof' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct coverage source
        run: python3 im-results/agent13-coverage/unpack.py
      - name: Generate the compressed blank-start certificate
        run: python3 im-results/agent41-f421/compressed_trace.py im-results/agent41-f421/F421SeedTrace.lean
      - name: Compile frontier reduction and original bridge
        run: |
          set -euo pipefail
          python3 tools/lean_compile_closure.py \
            --workdir /tmp/a41-f421-frontier \
            --jobs 8 \
            --theorem BB6Coverage.Agent41F421.frontierReturn \
            --theorem BB6Coverage.Agent41F421.completeReturn \
            --theorem BB6Coverage.Agent41F421.parseComplete \
            --theorem BB6Coverage.Agent41F421.badFrontier \
            --theorem BB6Coverage.Agent41F421.originalRun \
            --theorem BB6Coverage.Agent41F421.originalBlankEntry \
            --theorem F421TertiaryGuard.drainMod8 \
            --theorem F421TertiaryGuard.drainQ \
            --theorem F421SecondaryLifetimes.advance_mass \
            --theorem F421SecondaryLifetimes.sourcePDrain_lifetime \
            --theorem F421SecondaryLifetimes.originalDrainPProjection \
            --theorem F421SecondaryLifetimes.originalDrainLifetime \
            --theorem F421SecondaryLifetimes.secondarySourceP \
            --theorem F421SecondaryLifetimes.iterateSourceP \
            --theorem F421SecondaryLifetimes.firstSecondaryP \
            --theorem F421SecondaryLifetimes.iterateSourceFar \
            --theorem F421SecondaryLifetimes.firstSecondaryFar \
            --theorem BB6Coverage.Agent41F421.Compressed.blankFirstSecondaryFar \
            --theorem F421DrainPlan.splitPlan \
            --theorem BB6Coverage.Agent41F421.GeneralDrain.generalDrain \
            --theorem BB6Coverage.Agent41F421.MergedDrain.mergedDrain \
            --theorem F421PrimaryEvents.iterPrefix \
            --theorem F421PrimaryEvents.iterateAffine \
            --theorem BB6Coverage.Agent41F421.EpochWords.tertiaryEpoch \
            --theorem BB6Coverage.Agent41F421.EpochWords.tertiaryToSecondary \
            --theorem BB6Coverage.Agent41F421.EpochWords.secondaryEpoch \
            --theorem BB6Coverage.Agent41F421.EpochWords.firstSecondaryEpoch \
            --theorem BB6Coverage.Agent41F421.EpochWords.secondaryEpochExact \
            --theorem BB6Coverage.Agent41F421.Compressed.blankFirstSeed \
            --theorem BB6Coverage.Agent41F421.Compressed.blankFirstSecondaryZero \
            --provenance-input im-results/agent41-f421/compressed_trace.py \
            im-results/agent41-f421/F421FirstSeed.lean \
            im-results/agent41-f421/F421SecondaryExact.lean \
            im-results/agent41-f421/F421ZeroGuard.lean \
            im-results/agent41-f421/F421Epoch.lean \
            im-results/agent41-f421/F421Odd.lean \
            im-results/agent41-f421/PrimaryGuard.lean \
            im-results/agent41-f421/F421SecondaryLifetimes.lean \
            im-results/agent41-f421/F421SourceLifetimeBridge.lean \
            im-results/agent41-f421/F421SecondaryPSource.lean \
            im-results/agent41-f421/F421SecondaryLifeIter.lean \
            im-results/agent41-f421/F421SecondaryFar.lean \
            im-results/agent41-f421/F421SecondaryBlankFar.lean \
            im-results/agent41-f421/F421MergedDrain.lean \
            im-results/agent41-f421/F421PrimaryEvents.lean \
            2>&1 | tee /tmp/a41-f421-frontier.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a41-f421-frontier.log; then
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f421-frontier-proof
          path: |
            /tmp/a41-f421-frontier.log
            /tmp/a41-f421-frontier
          retention-days: 14
