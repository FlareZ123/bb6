name: Agent 42 #623 branch-selection source import

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install source-pinned Lean 4.35.0-rc4
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile exact repository drain transducer
        run: |
          set -euo pipefail
          lean -o /tmp/DrainDigitTransducerCarry.olean \
            im-results/agent1-machine623-3euclidean-correction-bounds/DrainDigitTransducerCarry.lean

      - name: Compile branch selection against imported source module
        run: |
          set -euo pipefail
          LEAN_PATH=/tmp lean -o /tmp/BranchSelection.olean \
            im-results/agent32-623-phase-automaton/BranchSelection.lean
