name: Agent 42 TM63 all-parameter terminal step certificate (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent42-champion-terminal-source.yml'
      - 'im-results/agent42-champion-terminal/TerminalEncoderBridge.lean'
      - 'im-results/agent42-champion-terminal/TerminalAfterPrefix.lean'
      - 'im-results/agent42-champion-terminal/TerminalChampion.lean'
      - 'im-results/agent42-champion-terminal/TerminalBridge.lean'
      - 'im-results/agent42-champion-terminal/TerminalProofs.tar.xz.b64'
      - 'im-results/agent42-champion-terminal/TerminalLeftExact.lean.xz.b64'
      - 'im-results/agent8-s1-encoder/S1Encoder.lean'
      - 'im-results/agent8-counted-reset/CountedReset.lean'
      - 'im-results/agent24-champion-time/ChampionModular.lean'
      - 'im-results/agent24-champion-time/CostRecurrence.lean'
      - 'im-results/agent24-champion-time/CountPattern.lean'
      - 'im-results/agent8-coverage-contract/Frontier.lean'
      - 'im-results/agent8-coverage-contract/Symmetry.lean'
      - 'im-results/agent8-coverage-contract/RootShift.lean'
      - 'im-results/agent48-champion-root/ChampionRootBridge.lean'
permissions:
  contents: read
jobs:
  terminal-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original Frontier and terminal theorem against unchanged source
        run: |
          set -eu
          mkdir -p /tmp/a42-terminal
          cp im-results/agent8-coverage-contract/{Frontier,Symmetry,RootShift}.lean /tmp/a42-terminal/
          cp im-results/agent48-champion-root/ChampionRootBridge.lean /tmp/a42-terminal/
          cp im-results/agent8-s1-encoder/S1Encoder.lean /tmp/a42-terminal/
          cp im-results/agent24-champion-time/{ChampionModular,CostRecurrence,CountPattern}.lean /tmp/a42-terminal/
          cp im-results/agent8-counted-reset/CountedReset.lean /tmp/a42-terminal/
          cp im-results/agent42-champion-terminal/TerminalChampion.lean /tmp/a42-terminal/
          cp im-results/agent42-champion-terminal/TerminalAfterPrefix.lean /tmp/a42-terminal/
          cp im-results/agent42-champion-terminal/TerminalEncoderBridge.lean /tmp/a42-terminal/
          cp im-results/agent42-champion-terminal/TerminalBridge.lean /tmp/a42-terminal/
          python3 -c "import base64,io,lzma,pathlib,tarfile; p=pathlib.Path('im-results/agent42-champion-terminal/TerminalProofs.tar.xz.b64'); d=base64.b64decode(p.read_text()); tarfile.open(fileobj=io.BytesIO(d),mode='r:xz').extractall('/tmp/a42-terminal',filter='data')"
          python3 -c "import base64,lzma,pathlib; p=pathlib.Path('im-results/agent42-champion-terminal/TerminalLeftExact.lean.xz.b64'); pathlib.Path('/tmp/a42-terminal/TerminalLeft.lean').write_bytes(lzma.decompress(base64.b64decode(p.read_text())))"
          echo "12329036c66c3846f9261167b8f9aebd1778d9b6ea6044309956c2fa0b3e49b7  /tmp/a42-terminal/TerminalFinish.lean" | sha256sum -c -
          echo "1bce2075fc4e0cd7d740fb71b3796088b190ddb6766e04640d992dadd1b650ff  /tmp/a42-terminal/TerminalLeft.lean" | sha256sum -c -
          echo "eacf239d8e7cab071f06cfe3d5a8cf00b91110de6c1880ca2eb3ee95839267e1  /tmp/a42-terminal/TerminalBridge.lean" | sha256sum -c -
          cd /tmp/a42-terminal
          export LEAN_PATH=.
          lean --version
          lean -o Frontier.olean Frontier.lean
          lean -o Symmetry.olean Symmetry.lean
          lean -o RootShift.olean RootShift.lean
          lean -o ChampionRootBridge.olean ChampionRootBridge.lean
          lean -o S1Encoder.olean S1Encoder.lean
          lean -o ChampionModular.olean ChampionModular.lean
          lean -o CostRecurrence.olean CostRecurrence.lean
          lean -o CountPattern.olean CountPattern.lean
          : > /tmp/a42-terminal/counted-reset-axioms.log
          lean -o CountedReset.olean CountedReset.lean 2>&1 | tee /tmp/a42-terminal/counted-reset-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/counted-reset-axioms.log; then
            echo '::error::sorryAx found in counted reset theorem dependencies'
            exit 1
          fi
          lean -o TerminalFinish.olean TerminalFinish.lean
          lean -o TerminalLeft.olean TerminalLeft.lean
          lean -o TerminalBridge.olean TerminalBridge.lean
          lean -o TerminalChampion.olean TerminalChampion.lean
          lean -o TerminalAfterPrefix.olean TerminalAfterPrefix.lean
          lean -o TerminalEncoderBridge.olean TerminalEncoderBridge.lean
