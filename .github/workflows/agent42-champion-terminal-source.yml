  # Independent, narrow acceptance gate for the marker-0 n=8q all-valuation
  # q4 prefix plus the q4 suffix/source composition.  It does not depend on the
  # broad terminal-source job above, so unrelated root/carry experiments cannot
  # mask its diagnostics.
  m0-even-eight-valuation-prefix:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'm0-even-eight-valuation-prefix' || inputs.target == 'm0-even-eight-valuation-q4-source' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the exact M0-even 8q valuation q4-source dependency chain
        run: |
          set -euo pipefail
          mkdir -p /tmp/m0-e8
          cp im-results/agent8-coverage-contract/{Frontier,Symmetry,RootShift}.lean /tmp/m0-e8/
          cp im-results/agent48-champion-root/ChampionRootBridge.lean /tmp/m0-e8/
          cp im-results/agent8-s1-encoder/S1Encoder.lean /tmp/m0-e8/
          cp im-results/agent24-champion-time/{ChampionModular,CostRecurrence,CountPattern,CountedOddBase,CountedSweep}.lean /tmp/m0-e8/
          cp im-results/agent8-counted-reset/CountedReset.lean /tmp/m0-e8/
          cp im-results/agent6-q4-prefix/CountedQ4Prefix.lean /tmp/m0-e8/
          cp im-results/agent48-counted-inc0/{M0EvenEightQ4Bridge,M0EvenEightQ4Prefix,M0EvenEightValuationEncoding,M0EvenEightValuationFixedPrefix,M0EvenEightValuationMacros,M0EvenEightValuationSuffix,M0EvenEightValuationSweepFacts,M0EvenEightValuationSource,M0EvenEightValuationQ4Source}.lean /tmp/m0-e8/
          cp im-results/agent48-counted-inc0/M0EvenEightA0FiniteBridges.lean /tmp/m0-e8/
          cp im-results/agent8-rst1prime/CountedRst1Prime.lean /tmp/m0-e8/
          cp im-results/agent8-counted-reset/Q4Suffix.lean /tmp/m0-e8/
          cp im-results/agent24-champion-time/Q4RightEndpoint.lean /tmp/m0-e8/
          cd /tmp/m0-e8
          export LEAN_PATH=.
          lean --version
          compile_checked() {
            local source="$1"
            local stem
            stem="$(basename "$source" .lean)"
            lean -o "$stem.olean" "$source" 2>&1 | tee "$stem-axioms.log"
            if grep -qE 'sorryAx|native_decide' "$stem-axioms.log"; then
              echo "::error::forbidden axiom or native_decide in $source"
              exit 1
            fi
          }
          lean -o Frontier.olean Frontier.lean
          lean -o Symmetry.olean Symmetry.lean
          lean -o RootShift.olean RootShift.lean
          lean -o ChampionRootBridge.olean ChampionRootBridge.lean
          lean -o S1Encoder.olean S1Encoder.lean
          lean -o ChampionModular.olean ChampionModular.lean
          lean -o CostRecurrence.olean CostRecurrence.lean
          lean -o CountPattern.olean CountPattern.lean
          compile_checked CountedReset.lean
          lean -o CountedOddBase.olean CountedOddBase.lean
          lean -o CountedSweep.olean CountedSweep.lean
          compile_checked CountedQ4Prefix.lean
          compile_checked M0EvenEightQ4Bridge.lean
          compile_checked M0EvenEightQ4Prefix.lean
          compile_checked M0EvenEightValuationMacros.lean
          compile_checked M0EvenEightValuationFixedPrefix.lean
          compile_checked M0EvenEightValuationSweepFacts.lean
          compile_checked M0EvenEightValuationSuffix.lean
          compile_checked M0EvenEightValuationEncoding.lean
          compile_checked M0EvenEightValuationSource.lean
          compile_checked CountedRst1Prime.lean
          compile_checked Q4Suffix.lean
          compile_checked Q4RightEndpoint.lean
          compile_checked M0EvenEightValuationQ4Source.lean
          compile_checked M0EvenEightA0FiniteBridges.lean
      - name: Upload focused Lean diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m0-even-eight-valuation-q4-source
          path: /tmp/m0-e8/*-axioms.log
          if-no-files-found: ignore
          retention-days: 3

  # Independent acceptance gate for the full M1 row-32 / M2 row-34
  # source increments and their authentic blank-root middle-34 composition.
  # The import-closure compiler resolves only the transitive source modules
  # of these three roots, avoiding unrelated failures in the broad job above.
  middle34-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'middle34-acceptance' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct authoritative terminal imports
        run: |
          set -euo pipefail
          mkdir -p /tmp/middle34-sources
          python3 - <<'PY'
          import base64, io, lzma, pathlib, tarfile
          root = pathlib.Path('/tmp/middle34-sources')
          archive = pathlib.Path('im-results/agent42-champion-terminal/TerminalProofs.tar.xz.b64')
          data = base64.b64decode(archive.read_text())
          tarfile.open(fileobj=io.BytesIO(data), mode='r:xz').extractall(root, filter='data')
          compressed = pathlib.Path('im-results/agent42-champion-terminal/TerminalLeftExact.lean.xz.b64')
          (root / 'TerminalLeft.lean').write_bytes(lzma.decompress(base64.b64decode(compressed.read_text())))
          PY
          cp im-results/agent42-champion-terminal/TerminalBridge.lean /tmp/middle34-sources/
          echo "12329036c66c3846f9261167b8f9aebd1778d9b6ea6044309956c2fa0b3e49b7  /tmp/middle34-sources/TerminalFinish.lean" | sha256sum -c -
          echo "1bce2075fc4e0cd7d740fb71b3796088b190ddb6766e04640d992dadd1b650ff  /tmp/middle34-sources/TerminalLeft.lean" | sha256sum -c -
          echo "eacf239d8e7cab071f06cfe3d5a8cf00b91110de6c1880ca2eb3ee95839267e1  /tmp/middle34-sources/TerminalBridge.lean" | sha256sum -c -
      - name: Compile exact M1, M2, and root-middle-34 import closure
        run: |
          set -euo pipefail
          lean --version
          python3 tools/lean_compile_closure.py \
            im-results/agent48-counted-inc0/M1EvenValuationSource.lean \
            im-results/agent44-tm63-middle/M2EvenSixGenericCounted.lean \
            im-results/agent44-tm63-middle/TM63RootMiddle34.lean \
            im-results/agent48-counted-inc0/TM63RootAfterSectionResultToOne.lean \
            im-results/agent48-counted-inc0/Q4S0FirstCycleMacros.lean \
            --jobs 8 \
            --source-root /tmp/middle34-sources \
            --override TerminalBridge=im-results/agent42-champion-terminal/TerminalBridge.lean \
            --override OuterLCIncPrelude=im-results/agent8-counted-reset/OuterLCIncPrelude.lean \
            --override M0OddResidueSeven=im-results/agent41-m0-n16r7/M0OddResidueSeven.lean \
            --override M0EvenEightValuationEncoding=im-results/agent48-counted-inc0/M0EvenEightValuationEncoding.lean \
            --override M2EvenResidueTwo=im-results/agent42-champion-terminal/M2EvenResidueTwo.lean \
            --workdir /tmp/middle34-acceptance \
            | tee /tmp/middle34-acceptance.log
          python3 - <<'PY'
          import pathlib
          log = pathlib.Path("/tmp/middle34-acceptance.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "m1EvenValuation_q4_leftFacing",
              "m1EvenValuation_q4_rightShape",
              "m1EvenValuation_reset_prefix_source",
              "m1EvenValuation_counted_increment_source_factorized",
              "m1EvenValuation_counted_increment_source",
              "m2EvenSix_generic_counted_increment_source",
              "tm63_blank_reaches_after_middle34",
              "tm63_source_increment_dispatch_complete",
              "sectionResult_run_to_index_one_complete",
              "sectionResult_run_complete",
              "tm63_root_middle_k_mod_three",
              "tm63_root_residue_six_k_mod_three",
              "tm63_middle34_sectionResult_marker_two",
              "tm63_blank_reaches_after_middle34_to_index_one",
              "resetBase_m2_prefix27",
              "resetBase_m2_suffix44",
              "tm63_blank_reaches_after_middle34_reset_frame",
              "outerLCInc_target_binary_prefix",
          )
          for name in names:
              lines = [line for line in log.splitlines()
                       if "depends on axioms:" in line
                       and line.split(" depends on axioms:", 1)[0].split(".")[-1] == name]
              if len(lines) != 1:
                  raise SystemExit(f"expected one axiom profile for {name}, got {len(lines)}")
              profile = lines[0].split("depends on axioms:", 1)[1].strip()
              if not (profile.startswith("[") and profile.endswith("]")):
                  raise SystemExit(f"unrecognized profile for {name}: {profile}")
              axioms = {x.strip() for x in profile[1:-1].split(",") if x.strip()}
              bad = axioms - allowed
              if bad:
                  raise SystemExit(f"nonstandard axioms in {name}: {sorted(bad)}")
              if "sorryAx" in axioms:
                  raise SystemExit(f"sorryAx in {name}")
              print(f"{name}: {sorted(axioms)}")
          PY
          if grep -R -n 'native_decide' /tmp/middle34-acceptance --include='*.lean'; then
            echo '::error::native_decide found in the exact source closure'
            exit 1
          fi
      - name: Record exact source revision for local preflight
        if: always()
        run: |
          mkdir -p /tmp/middle34-acceptance
          printf '%s\n' "$GITHUB_SHA" > /tmp/middle34-acceptance/SOURCE_COMMIT.txt
      - name: Export exact source closure and diagnostics for local RC2 preflight
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: middle34-acceptance-source-closure
          path: |
            /tmp/middle34-acceptance/
            /tmp/middle34-sources/
            /tmp/middle34-acceptance.log
          if-no-files-found: ignore
          retention-days: 3
