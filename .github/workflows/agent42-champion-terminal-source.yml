name: Agent 42 TM63 all-parameter terminal step certificate (manual)
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  terminal-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original Frontier and terminal theorem against unchanged source
        run: |
          set -euo pipefail
          mkdir -p /tmp/a42-terminal
          python3 -c "import base64,io,lzma,pathlib,tarfile; p=pathlib.Path('im-results/agent42-champion-terminal/TerminalProofs.tar.xz.b64'); d=base64.b64decode(p.read_text()); tarfile.open(fileobj=io.BytesIO(d),mode='r:xz').extractall('/tmp/a42-terminal',filter='data')"
          cp im-results/agent8-coverage-contract/{Frontier,Symmetry,RootShift}.lean /tmp/a42-terminal/
          cp im-results/agent48-champion-root/ChampionRootBridge.lean /tmp/a42-terminal/
          cp im-results/agent8-s1-encoder/S1Encoder.lean /tmp/a42-terminal/
          cp im-results/agent48-root-witness/{RootFiniteBits,RootSourceBridge}.lean /tmp/a42-terminal/
          cp im-results/agent8-rst1prime/CountedRst1Prime.lean /tmp/a42-terminal/
          cp im-results/agent6-q4-prefix/CountedQ4Prefix.lean /tmp/a42-terminal/
          cp im-results/agent8-counted-reset/Q4Suffix.lean /tmp/a42-terminal/
          cp im-results/agent24-champion-time/Q4RightEndpoint.lean /tmp/a42-terminal/
          cp im-results/agent48-counted-inc0/TM63RootQ4Drain.lean /tmp/a42-terminal/
          cp im-results/agent24-champion-time/ChampionRootQ4Drain.lean /tmp/a42-terminal/
          cp im-results/agent42-champion-terminal/TM63RootQ4Attainable.lean /tmp/a42-terminal/
          cp im-results/agent24-champion-time/{ChampionModular,CostRecurrence,CountPattern}.lean /tmp/a42-terminal/
          cp im-results/agent8-counted-reset/CountedReset.lean /tmp/a42-terminal/
          cp im-results/agent8-counted-reset/CountedResetBase.lean /tmp/a42-terminal/
          cp im-results/agent8-counted-reset/CountedResetOddBase.lean /tmp/a42-terminal/
          cp im-results/agent48-counted-inc0/ResetOddCanonical.lean /tmp/a42-terminal/
          cp im-results/agent24-champion-time/{CountedOddBase,CountedSweep,CountedOddUnary,CountedOneZeroUnary,CountedCarryBridges}.lean /tmp/a42-terminal/
          cp im-results/agent42-carry-boundary/CountedCarryBoundaryTraces.lean /tmp/a42-terminal/
          cp im-results/agent42-champion-terminal/TerminalChampion.lean /tmp/a42-terminal/
          cp im-results/agent42-champion-terminal/TerminalAfterPrefix.lean /tmp/a42-terminal/
          cp im-results/agent42-champion-terminal/TerminalEncoderBridge.lean /tmp/a42-terminal/
          cp im-results/agent42-champion-terminal/TerminalBridge.lean /tmp/a42-terminal/
          # Re-apply live carry modules after archive extraction so stale
          # bundled copies cannot shadow the repository sources.
          cp im-results/agent24-champion-time/CountedCarryBridges.lean /tmp/a42-terminal/
          cp im-results/agent42-carry-boundary/CountedCarryBoundaryTraces.lean /tmp/a42-terminal/
          cp im-results/agent42-carry-left-output/FrameCellLemmas.lean /tmp/a42-terminal/
          python3 -c "import base64,lzma,pathlib; p=pathlib.Path('im-results/agent42-champion-terminal/TerminalLeftExact.lean.xz.b64'); pathlib.Path('/tmp/a42-terminal/TerminalLeft.lean').write_bytes(lzma.decompress(base64.b64decode(p.read_text())))"
          echo "12329036c66c3846f9261167b8f9aebd1778d9b6ea6044309956c2fa0b3e49b7  /tmp/a42-terminal/TerminalFinish.lean" | sha256sum -c -
          echo "1bce2075fc4e0cd7d740fb71b3796088b190ddb6766e04640d992dadd1b650ff  /tmp/a42-terminal/TerminalLeft.lean" | sha256sum -c -
          echo "eacf239d8e7cab071f06cfe3d5a8cf00b91110de6c1880ca2eb3ee95839267e1  /tmp/a42-terminal/TerminalBridge.lean" | sha256sum -c -
          cd /tmp/a42-terminal
          export LEAN_PATH=.
          lean --version
          lean -o Frontier.olean Frontier.lean
          lean -o Symmetry.olean Symmetry.lean
          lean -o RootShift.olean RootShift.lean
          lean -o ChampionRootBridge.olean ChampionRootBridge.lean
          cp "$GITHUB_WORKSPACE/im-results/agent42-champion-terminal/M1OddQ4Bridge.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/m1-odd-q4-bridge-axioms.log
          lean -o M1OddQ4Bridge.olean M1OddQ4Bridge.lean 2>&1 | tee /tmp/a42-terminal/m1-odd-q4-bridge-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/m1-odd-q4-bridge-axioms.log; then
            echo '::error::sorryAx found in finite m1,n=3 odd q4 bridge'
            exit 1
          fi
          lean -o S1Encoder.olean S1Encoder.lean
          : > /tmp/a42-terminal/root-finite-axioms.log
          lean -o RootFiniteBits.olean RootFiniteBits.lean 2>&1 | tee /tmp/a42-terminal/root-finite-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/root-finite-axioms.log; then
            echo '::error::sorryAx found in bounded blank-root computation'
            exit 1
          fi
          : > /tmp/a42-terminal/root-source-axioms.log
          lean -o RootSourceBridge.olean RootSourceBridge.lean 2>&1 | tee /tmp/a42-terminal/root-source-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/root-source-axioms.log; then
            echo '::error::sorryAx found in original-source blank-root bridge'
            exit 1
          fi
          lean -o CountedOddBase.olean CountedOddBase.lean
          lean -o CountedSweep.olean CountedSweep.lean
          : > /tmp/a42-terminal/q4-prefix-axioms.log
          lean -o CountedQ4Prefix.olean CountedQ4Prefix.lean 2>&1 | tee /tmp/a42-terminal/q4-prefix-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/q4-prefix-axioms.log; then
            echo '::error::sorryAx found in source q4 prefix theorem'
            exit 1
          fi
          lean -o CountedOddUnary.olean CountedOddUnary.lean
          cp "$GITHUB_WORKSPACE/im-results/agent2-inc0-odd-canonical/S1OddCanonicalOutput.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/agent2-odd-canonical-axioms.log
          lean -o S1OddCanonicalOutput.olean S1OddCanonicalOutput.lean 2>&1 | tee /tmp/a42-terminal/agent2-odd-canonical-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/agent2-odd-canonical-axioms.log; then
            echo '::error::sorryAx found in Agent 2 odd canonical output theorem'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent2-inc0-even-left-encoding/S1EvenLeftEncoding.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/agent2-even-left-encoding-axioms.log
          lean -o S1EvenLeftEncoding.olean S1EvenLeftEncoding.lean 2>&1 | tee /tmp/a42-terminal/agent2-even-left-encoding-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/agent2-even-left-encoding-axioms.log; then
            echo '::error::sorryAx found in Agent 2 even left encoding theorem'
            exit 1
          fi
          lean -o CountedOneZeroUnary.olean CountedOneZeroUnary.lean
          lean -o CountedCarryBridges.olean CountedCarryBridges.lean
          : > /tmp/a42-terminal/carry-boundary-axioms.log
          lean -o CountedCarryBoundaryTraces.olean CountedCarryBoundaryTraces.lean 2>&1 | tee /tmp/a42-terminal/carry-boundary-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/carry-boundary-axioms.log; then
            echo '::error::sorryAx found in carry boundary trace theorem dependencies'
            exit 1
          fi
          : > /tmp/a42-terminal/frame-cell-lemmas-axioms.log
          lean -o FrameCellLemmas.olean FrameCellLemmas.lean 2>&1 | tee /tmp/a42-terminal/frame-cell-lemmas-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/frame-cell-lemmas-axioms.log; then
            echo '::error::sorryAx found in carry frame-cell lemmas'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent24-champion-time/CountedCarryPrefix.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/carry-prefix-axioms.log
          lean -o CountedCarryPrefix.olean CountedCarryPrefix.lean 2>&1 | tee /tmp/a42-terminal/carry-prefix-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/carry-prefix-axioms.log; then
            echo '::error::sorryAx found in counted carry prefix theorem dependencies'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent24-champion-time/CountedCarryPrefixGeneral.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/carry-prefix-general-axioms.log
          lean -o CountedCarryPrefixGeneral.olean CountedCarryPrefixGeneral.lean 2>&1 | tee /tmp/a42-terminal/carry-prefix-general-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/carry-prefix-general-axioms.log; then
            echo '::error::sorryAx found in counted carry residue bridge dependencies'
            exit 1
          fi
          lean -o ChampionModular.olean ChampionModular.lean
          lean -o CostRecurrence.olean CostRecurrence.lean
          lean -o CountPattern.olean CountPattern.lean
          : > /tmp/a42-terminal/counted-reset-axioms.log
          lean -o CountedReset.olean CountedReset.lean 2>&1 | tee /tmp/a42-terminal/counted-reset-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/counted-reset-axioms.log; then
            echo '::error::sorryAx found in counted reset theorem dependencies'
            exit 1
          fi
          : > /tmp/a42-terminal/rst1-prime-axioms.log
          lean -o CountedRst1Prime.olean CountedRst1Prime.lean 2>&1 | tee /tmp/a42-terminal/rst1-prime-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/rst1-prime-axioms.log; then
            echo '::error::sorryAx found in counted Rst1-prime bridge theorem dependencies'
            exit 1
          fi
          : > /tmp/a42-terminal/q4-suffix-axioms.log
          lean -o Q4Suffix.olean Q4Suffix.lean 2>&1 | tee /tmp/a42-terminal/q4-suffix-axioms.log
          : > /tmp/a42-terminal/q4-endpoint-axioms.log
          lean -o Q4RightEndpoint.olean Q4RightEndpoint.lean 2>&1 | tee /tmp/a42-terminal/q4-endpoint-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/q4-endpoint-axioms.log; then
            echo '::error::sorryAx found in q4 full endpoint theorem dependencies'
            exit 1
          fi
          # Agent 24's source-level (m,n)=(0,2) even q4 prefix.
          cp "$GITHUB_WORKSPACE/im-results/agent24-champion-time/M0EvenQ4Bridge.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/m0-even-q4-bridge-axioms.log
          lean -o M0EvenQ4Bridge.olean M0EvenQ4Bridge.lean 2>&1 | tee /tmp/a42-terminal/m0-even-q4-bridge-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/m0-even-q4-bridge-axioms.log; then
            echo '::error::sorryAx found in finite m=0,n=2 even q4 bridge'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent24-champion-time/M0EvenQ4Prefix.lean" /tmp/a42-terminal/
          python3 "$GITHUB_WORKSPACE/im-results/agent24-champion-time/m0_even_n2_replay.py"
          : > /tmp/a42-terminal/m0-even-q4-prefix-axioms.log
          lean -o M0EvenQ4Prefix.olean M0EvenQ4Prefix.lean 2>&1 | tee /tmp/a42-terminal/m0-even-q4-prefix-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/m0-even-q4-prefix-axioms.log; then
            echo '::error::sorryAx found in source m=0,n=2 even q4 prefix'
            exit 1
          fi

          cp "$GITHUB_WORKSPACE/im-results/agent24-champion-time/M0OddQ4Bridges.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/m0-odd-q4-bridges-axioms.log
          lean -o M0OddQ4Bridges.olean M0OddQ4Bridges.lean 2>&1 | tee /tmp/a42-terminal/m0-odd-q4-bridges-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/m0-odd-q4-bridges-axioms.log; then
            echo '::error::sorryAx found in source M0 odd q4 bridge dependencies'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent24-champion-time/M0OddQ4Prefix.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/m0-odd-q4-prefix-axioms.log
          lean -o M0OddQ4Prefix.olean M0OddQ4Prefix.lean 2>&1 | tee /tmp/a42-terminal/m0-odd-q4-prefix-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/m0-odd-q4-prefix-axioms.log; then
            echo '::error::sorryAx found in source M0 odd q4 prefix theorem'
            exit 1
          fi
          if grep -q 'sorryAx' /tmp/a42-terminal/q4-suffix-axioms.log; then
            echo '::error::sorryAx found in q4 suffix theorem dependencies'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent42-carry-boundary/S1CountedCarryPrefixBridge.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/s1-counted-carry-axioms.log
          lean -o S1CountedCarryPrefixBridge.olean S1CountedCarryPrefixBridge.lean 2>&1 | tee /tmp/a42-terminal/s1-counted-carry-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/s1-counted-carry-axioms.log; then
            echo '::error::sorryAx found in S1 counted carry bridge theorem dependencies'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent3-carry-left-output/CountedCarryLeftOutput.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/carry-left-output-axioms.log
          lean -o CountedCarryLeftOutput.olean CountedCarryLeftOutput.lean 2>&1 | tee /tmp/a42-terminal/carry-left-output-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/carry-left-output-axioms.log; then
            echo '::error::sorryAx found in counted carry left-output theorem dependencies'
            exit 1
          fi
          # Audit the independent Rst1' chain before the r=2/3 carry-left leaf; one branch must not mask another.
          cp "$GITHUB_WORKSPACE/im-results/agent24-champion-time/CountedSuffixOutput.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/counted-suffix-output-axioms.log
          lean -o CountedSuffixOutput.olean CountedSuffixOutput.lean 2>&1 | tee /tmp/a42-terminal/counted-suffix-output-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/counted-suffix-output-axioms.log; then
            echo '::error::sorryAx found in counted suffix output theorem dependencies'
            exit 1
          fi
          # Agent 4's source-level first two Rst1' sweeps and bridge8 composition.
          cp "$GITHUB_WORKSPACE/im-results/agent4-rst1prime/Rst1PrimeFirstSweep.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/rst1-prime-first-sweep-axioms.log
          lean -o Rst1PrimeFirstSweep.olean Rst1PrimeFirstSweep.lean 2>&1 | tee /tmp/a42-terminal/rst1-prime-first-sweep-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/rst1-prime-first-sweep-axioms.log; then
            echo '::error::sorryAx found in Rst1Prime first sweep'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent4-rst1prime/Rst1PrimeBridge8Source.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/rst1-prime-bridge8-source-axioms.log
          lean -o Rst1PrimeBridge8Source.olean Rst1PrimeBridge8Source.lean 2>&1 | tee /tmp/a42-terminal/rst1-prime-bridge8-source-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/rst1-prime-bridge8-source-axioms.log; then
            echo '::error::sorryAx found in Rst1Prime bridge8 source composition'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent4-rst1prime/Rst1PrimeSecondSweep.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/rst1-prime-second-sweep-axioms.log
          lean -o Rst1PrimeSecondSweep.olean Rst1PrimeSecondSweep.lean 2>&1 | tee /tmp/a42-terminal/rst1-prime-second-sweep-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/rst1-prime-second-sweep-axioms.log; then
            echo '::error::sorryAx found in Rst1Prime second sweep'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent4-rst1prime/Rst1PrimeBridge20Source.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/rst1-prime-bridge20-source-axioms.log
          lean -o Rst1PrimeBridge20Source.olean Rst1PrimeBridge20Source.lean 2>&1 | tee /tmp/a42-terminal/rst1-prime-bridge20-source-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/rst1-prime-bridge20-source-axioms.log; then
            echo '::error::sorryAx found in Rst1Prime bridge20 source and right-sweep continuation'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent4-rst1prime/Rst1PrimeBridge9Source.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/rst1-prime-bridge9-source-axioms.log
          lean -o Rst1PrimeBridge9Source.olean Rst1PrimeBridge9Source.lean 2>&1 | tee /tmp/a42-terminal/rst1-prime-bridge9-source-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/rst1-prime-bridge9-source-axioms.log; then
            echo '::error::sorryAx found in Rst1Prime bridge9 source and right-sweep continuation'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent8-rst1prime/Rst1PrimeBridge6Source.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/rst1-prime-bridge6-source-axioms.log
          lean -o Rst1PrimeBridge6Source.olean Rst1PrimeBridge6Source.lean 2>&1 | tee /tmp/a42-terminal/rst1-prime-bridge6-source-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/rst1-prime-bridge6-source-axioms.log; then
            echo '::error::sorryAx found in Rst1Prime bridge6 source composition'
            exit 1
          fi


          cp "$GITHUB_WORKSPACE/im-results/agent24-champion-time/CountedCarryLeftOutputR23.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/carry-left-output-r23-axioms.log
          lean -o CountedCarryLeftOutputR23.olean CountedCarryLeftOutputR23.lean 2>&1 | tee /tmp/a42-terminal/carry-left-output-r23-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/carry-left-output-r23-axioms.log; then
            echo '::error::sorryAx found in counted carry left-output residue 2/3 theorem dependencies'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent24-champion-time/S1CarryOutputBridge.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/s1-carry-output-bridge-axioms.log
          lean -o S1CarryOutputBridge.olean S1CarryOutputBridge.lean 2>&1 | tee /tmp/a42-terminal/s1-carry-output-bridge-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/s1-carry-output-bridge-axioms.log; then
            echo '::error::sorryAx found in S1 source carry output bridge dependencies'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent24-champion-time/S1CarryInc0.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/s1-carry-inc0-axioms.log
          lean -o S1CarryInc0.olean S1CarryInc0.lean 2>&1 | tee /tmp/a42-terminal/s1-carry-inc0-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/s1-carry-inc0-axioms.log; then
            echo '::error::sorryAx found in source S1 counted decrement dependencies'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent48-counted-inc0/S1CountedInc0.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/s1-counted-inc0-axioms.log
          lean -o S1CountedInc0.olean S1CountedInc0.lean 2>&1 | tee /tmp/a42-terminal/s1-counted-inc0-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/s1-counted-inc0-axioms.log; then
            echo '::error::sorryAx found in parity-complete S1 counted decrement dependencies'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent42-champion-terminal/M2OddGenericStage.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/m2-odd-generic-stage-axioms.log
          lean -o M2OddGenericStage.olean M2OddGenericStage.lean 2>&1 | tee /tmp/a42-terminal/m2-odd-generic-stage-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/m2-odd-generic-stage-axioms.log; then
            echo '::error::sorryAx found in generic odd m=2 counted reset stage'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent48-counted-inc0/S1CountedDrain.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/s1-counted-drain-axioms.log
          lean -o S1CountedDrain.olean S1CountedDrain.lean 2>&1 | tee /tmp/a42-terminal/s1-counted-drain-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/s1-counted-drain-axioms.log; then
            echo '::error::sorryAx found in source S1 all-ones counted drain dependencies'
            exit 1
          fi

          # Agent 24: lift the m=0 odd q4 prefix to every n=8*k+5.
          cp "$GITHUB_WORKSPACE/im-results/agent24-champion-time/M0OddResidueFive.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/m0-odd-residue5-axioms.log
          lean -o M0OddResidueFive.olean M0OddResidueFive.lean 2>&1 | tee /tmp/a42-terminal/m0-odd-residue5-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/m0-odd-residue5-axioms.log; then
            echo '::error::sorryAx found in generalized m=0,n=8*k+5 source increment'
            exit 1
          fi
          # The M0-even q4 suffix is independent of the M1-even prefix.
          cp "$GITHUB_WORKSPACE/im-results/agent24-champion-time/M0EvenQ4Suffix.lean" /tmp/a42-terminal/
          : > /tmp/a42-terminal/m0-even-q4-suffix-axioms.log
          lean -o M0EvenQ4Suffix.olean M0EvenQ4Suffix.lean 2>&1 | tee /tmp/a42-terminal/m0-even-q4-suffix-axioms.log
          if grep -q 'sorryAx' /tmp/a42-terminal/m0-even-q4-suffix-axioms.log; then
            echo '::error::sorryAx found in source m=0,n=2 even q4 suffix and counted increment'
            exit 1
          fi
          cp "$GITHUB_WORKSPACE/im-results/agent48-counted-inc0/M1EvenQ4Prefix.lean" /tmp/a42-terminal/
