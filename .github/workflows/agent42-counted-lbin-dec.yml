name: Agent 42 counted TM63 LBinDec and M0-even 8q source proof
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select the exact acceptance target"
        required: true
        type: choice
        options:
          - all
          - counted-lbin-dec
          - m0-valuation-prefix
          - tm63-24cycle-dispatcher
          - tm63-root-index-one
        default: all
  workflow_call:
    inputs:
      target:
        required: false
        type: string
        default: all
permissions:
  contents: read
jobs:
  counted-lbin-dec:
    if: ${{ inputs.target == 'all' || inputs.target == 'counted-lbin-dec' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact LBinDec, S1 drain, and M0-even 8q source closure
        run: |
          set -euo pipefail
          mkdir -p /tmp/a42-lbin-dec
          cp im-results/agent8-coverage-contract/{Frontier,Symmetry,RootShift}.lean /tmp/a42-lbin-dec/
          cp im-results/agent48-champion-root/ChampionRootBridge.lean /tmp/a42-lbin-dec/
          cp im-results/agent24-champion-time/{CountedSweep,CountedOddBase,CountedOddUnary,CountedOneZeroUnary,CountedCarryBridges,CountedCarryPrefix,CountedCarryPrefixGeneral,CountedCarryPrefixHRun,CountedCarryPrefixHRunAxiomAudit,CountedLBinDecHRun}.lean /tmp/a42-lbin-dec/
          cp im-results/agent42-carry-left-output/FrameCellLemmas.lean /tmp/a42-lbin-dec/
          cp im-results/agent3-carry-left-output/CountedCarryLeftOutput.lean /tmp/a42-lbin-dec/
          cp im-results/agent42-carry-boundary/CountedCarryBoundaryTraces.lean /tmp/a42-lbin-dec/
          cp im-results/agent42-champion-terminal/{CountedLBinDec,CountedLBinDecShape,CountedLBinDecAxiomAudit}.lean /tmp/a42-lbin-dec/
          cp im-results/agent8-s1-encoder/S1Encoder.lean /tmp/a42-lbin-dec/
          cp im-results/agent42-carry-boundary/S1CountedCarryPrefixBridge.lean /tmp/a42-lbin-dec/
          cp im-results/agent24-champion-time/{CountedSuffixOutput,S1CarryOutputBridge,CountedCarryLeftOutputR23,S1CarryInc0}.lean /tmp/a42-lbin-dec/
          cp im-results/agent42-carry-left-output/LongResidue1.lean /tmp/a42-lbin-dec/
          cp im-results/agent2-inc0-odd-canonical/S1OddCanonicalOutput.lean /tmp/a42-lbin-dec/
          cp im-results/agent48-counted-inc0/S1CountedInc0.lean /tmp/a42-lbin-dec/
          cp im-results/agent24-champion-time/{ChampionModular,CountPattern,CostRecurrence}.lean /tmp/a42-lbin-dec/
          cp im-results/agent8-counted-reset/{CountedReset,OuterLCIncPrelude}.lean /tmp/a42-lbin-dec/
          cp im-results/agent48-counted-inc0/S1CountedDrain.lean /tmp/a42-lbin-dec/
          cp im-results/agent6-q4-prefix/CountedQ4Prefix.lean /tmp/a42-lbin-dec/
          cp im-results/agent8-rst1prime/CountedRst1Prime.lean /tmp/a42-lbin-dec/
          cp im-results/agent8-counted-reset/Q4Suffix.lean /tmp/a42-lbin-dec/
          cp im-results/agent24-champion-time/Q4RightEndpoint.lean /tmp/a42-lbin-dec/
          cp im-results/agent48-counted-inc0/{M0EvenEightQ4Bridge,M0EvenEightQ4Prefix,M0EvenEightGenericSource}.lean /tmp/a42-lbin-dec/
          cp im-results/agent48-counted-inc0/m0_even_eight_source_sim.js /tmp/a42-lbin-dec/
          cp im-results/agent48-counted-inc0/{M0EvenEightValuationEncoding,M0EvenEightValuationSuffix,M0EvenEightValuationSweepFacts,M0EvenEightValuationFixedPrefix,M0EvenEightValuationMacros,M0EvenEightValuationSource,M0EvenEightValuationQ4Source,M0EvenEightValuationCountedSource}.lean /tmp/a42-lbin-dec/
          cp im-results/agent48-counted-inc0/m0_even_eight_valuation_probe.js /tmp/a42-lbin-dec/
          cd /tmp/a42-lbin-dec
          if grep -R -n 'native_decide' . --include='*.lean'; then
            echo '::error::native_decide found in the staged counted LBinDec/S1 source closure'
            exit 1
          fi
          node m0_even_eight_source_sim.js | tee m0-even-eight-source-sim.log
          export LEAN_PATH=.
          lean --version
          lean -o Frontier.olean Frontier.lean
          lean -o Symmetry.olean Symmetry.lean
          lean -o RootShift.olean RootShift.lean
          lean -o ChampionRootBridge.olean ChampionRootBridge.lean
          lean -o CountedSweep.olean CountedSweep.lean
          lean -o CountedLBinDecHRun.olean CountedLBinDecHRun.lean
          lean -o CountedOddBase.olean CountedOddBase.lean
          lean -o CountedOddUnary.olean CountedOddUnary.lean
          lean -o CountedOneZeroUnary.olean CountedOneZeroUnary.lean
          lean -o CountedCarryBridges.olean CountedCarryBridges.lean
          lean -o CountedCarryBoundaryTraces.olean CountedCarryBoundaryTraces.lean
          lean -o CountedCarryPrefix.olean CountedCarryPrefix.lean
          lean -o CountedCarryPrefixGeneral.olean CountedCarryPrefixGeneral.lean
          lean -o FrameCellLemmas.olean FrameCellLemmas.lean
          lean -o CountedCarryLeftOutput.olean CountedCarryLeftOutput.lean
          lean -o CountedLBinDec.olean CountedLBinDec.lean
          lean -o CountedLBinDecShape.olean CountedLBinDecShape.lean
          : > counted-lbin-dec-axioms.log
          lean CountedLBinDecAxiomAudit.lean 2>&1 | tee -a counted-lbin-dec-axioms.log
          lean -o CountedCarryPrefixHRun.olean CountedCarryPrefixHRun.lean 2>&1 | tee counted-prefix-hrun-compile.log
          lean CountedCarryPrefixHRunAxiomAudit.lean 2>&1 | tee counted-prefix-hrun-axioms.log
          lean -o S1Encoder.olean S1Encoder.lean 2>&1 | tee s1-encoder-compile.log
          lean -o S1CountedCarryPrefixBridge.olean S1CountedCarryPrefixBridge.lean 2>&1 | tee s1-prefix-bridge-compile.log
          lean -o CountedSuffixOutput.olean CountedSuffixOutput.lean 2>&1 | tee counted-suffix-output-compile.log
          lean -o S1CarryOutputBridge.olean S1CarryOutputBridge.lean 2>&1 | tee s1-carry-output-bridge-compile.log
          lean -o CountedCarryLeftOutputR23.olean CountedCarryLeftOutputR23.lean 2>&1 | tee carry-left-r23-compile.log
          lean -o LongResidue1.olean LongResidue1.lean 2>&1 | tee long-residue1-compile.log
          lean -o S1CarryInc0.olean S1CarryInc0.lean 2>&1 | tee s1-carry-inc0-compile.log
          lean -o S1OddCanonicalOutput.olean S1OddCanonicalOutput.lean 2>&1 | tee s1-odd-canonical-compile.log
          lean -o S1CountedInc0.olean S1CountedInc0.lean 2>&1 | tee s1-counted-inc0-compile.log
          lean -o ChampionModular.olean ChampionModular.lean 2>&1 | tee champion-modular-compile.log
          lean -o CountPattern.olean CountPattern.lean 2>&1 | tee count-pattern-compile.log
          lean -o CostRecurrence.olean CostRecurrence.lean 2>&1 | tee cost-recurrence-compile.log
          lean -o CountedReset.olean CountedReset.lean 2>&1 | tee counted-reset-compile.log
          lean -o OuterLCIncPrelude.olean OuterLCIncPrelude.lean 2>&1 | tee outer-lcinc-prelude-compile.log
          lean -o S1CountedDrain.olean S1CountedDrain.lean 2>&1 | tee s1-counted-drain-compile.log
          lean -o CountedQ4Prefix.olean CountedQ4Prefix.lean 2>&1 | tee counted-q4-prefix-compile.log
          lean -o CountedRst1Prime.olean CountedRst1Prime.lean 2>&1 | tee counted-rst1-prime-compile.log
          lean -o Q4Suffix.olean Q4Suffix.lean 2>&1 | tee q4-suffix-compile.log
          lean -o Q4RightEndpoint.olean Q4RightEndpoint.lean 2>&1 | tee q4-right-endpoint-compile.log
          lean -o M0EvenEightQ4Bridge.olean M0EvenEightQ4Bridge.lean 2>&1 | tee m0-even-eight-q4-bridge-compile.log
          lean -o M0EvenEightQ4Prefix.olean M0EvenEightQ4Prefix.lean 2>&1 | tee m0-even-eight-q4-prefix-compile.log
          lean -o M0EvenEightGenericSource.olean M0EvenEightGenericSource.lean 2>&1 | tee m0-even-eight-generic-source-compile.log
          # Preflight the valuation-uniform q>0 helper leaves and their exact source imports.
          node m0_even_eight_valuation_probe.js | tee m0-even-eight-valuation-probe.log
          grep -q '"tested": 288' m0-even-eight-valuation-probe.log
          grep -q '"bridgeTested": 101' m0-even-eight-valuation-probe.log
          grep -q '"failures": \[\]' m0-even-eight-valuation-probe.log
          grep -q '"bridgeFailures": \[\]' m0-even-eight-valuation-probe.log
          : > m0-even-eight-valuation-axioms.log
          lean -o M0EvenEightValuationSuffix.olean M0EvenEightValuationSuffix.lean 2>&1 | tee -a m0-even-eight-valuation-axioms.log
          lean -o M0EvenEightValuationSweepFacts.olean M0EvenEightValuationSweepFacts.lean 2>&1 | tee -a m0-even-eight-valuation-axioms.log
          lean -o M0EvenEightValuationFixedPrefix.olean M0EvenEightValuationFixedPrefix.lean 2>&1 | tee -a m0-even-eight-valuation-axioms.log
          lean -o M0EvenEightValuationMacros.olean M0EvenEightValuationMacros.lean 2>&1 | tee -a m0-even-eight-valuation-axioms.log
          lean -o M0EvenEightValuationEncoding.olean M0EvenEightValuationEncoding.lean 2>&1 | tee -a m0-even-eight-valuation-axioms.log
          lean -o M0EvenEightValuationSource.olean M0EvenEightValuationSource.lean 2>&1 | tee m0-even-eight-valuation-source-compile.log
          lean -o M0EvenEightValuationQ4Source.olean M0EvenEightValuationQ4Source.lean 2>&1 | tee m0-even-eight-valuation-q4-source-compile.log
          lean -o M0EvenEightValuationCountedSource.olean M0EvenEightValuationCountedSource.lean 2>&1 | tee m0-even-eight-valuation-counted-source-compile.log
          grep -F 'm0EvenEight_valuation_counted_increment_source' m0-even-eight-valuation-counted-source-compile.log
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path("m0-even-eight-valuation-counted-source-compile.log").read_text()
          matches = re.findall(
              r"m0EvenEight_valuation_counted_increment_source.*?depends on axioms:\s*\[([^\]]*)\]",
              log,
          )
          if len(matches) != 1:
              raise SystemExit(f"expected one final #print axioms profile, found {len(matches)}")
          axioms = {name.strip() for name in matches[0].split(",") if name.strip()}
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          unexpected = axioms - allowed
          if unexpected:
              raise SystemExit(f"nonstandard axioms in M0 counted source: {sorted(unexpected)}")
          print(f"accepted standard axiom profile: {sorted(axioms)}")
          PY
          if grep -qE 'sorryAx|native_decide' m0-even-eight-valuation-axioms.log m0-even-eight-valuation-source-compile.log m0-even-eight-valuation-q4-source-compile.log m0-even-eight-valuation-counted-source-compile.log; then
            echo '::error::sorryAx or native_decide in valuation-uniform M0-even helper closure'
            exit 1
          fi
          grep -q 'PASS: 1890 exhaustive bounded cases' m0-even-eight-source-sim.log
          if grep -q 'native_decide' counted-lbin-dec-axioms.log counted-prefix-hrun-compile.log counted-prefix-hrun-axioms.log s1-encoder-compile.log s1-prefix-bridge-compile.log counted-suffix-output-compile.log s1-carry-output-bridge-compile.log carry-left-r23-compile.log long-residue1-compile.log s1-carry-inc0-compile.log s1-odd-canonical-compile.log s1-counted-inc0-compile.log champion-modular-compile.log count-pattern-compile.log cost-recurrence-compile.log counted-reset-compile.log s1-counted-drain-compile.log counted-q4-prefix-compile.log counted-rst1-prime-compile.log q4-suffix-compile.log q4-right-endpoint-compile.log m0-even-eight-q4-bridge-compile.log m0-even-eight-q4-prefix-compile.log m0-even-eight-generic-source-compile.log m0-even-eight-valuation-source-compile.log m0-even-eight-valuation-q4-source-compile.log m0-even-eight-valuation-counted-source-compile.log outer-lcinc-prelude-compile.log; then
            echo '::error::native_decide appeared in a compiled axiom log'
            exit 1
          fi
          if grep -q 'sorryAx' counted-lbin-dec-axioms.log counted-prefix-hrun-compile.log counted-prefix-hrun-axioms.log s1-encoder-compile.log s1-prefix-bridge-compile.log counted-suffix-output-compile.log s1-carry-output-bridge-compile.log carry-left-r23-compile.log long-residue1-compile.log s1-carry-inc0-compile.log s1-odd-canonical-compile.log s1-counted-inc0-compile.log champion-modular-compile.log count-pattern-compile.log cost-recurrence-compile.log counted-reset-compile.log s1-counted-drain-compile.log counted-q4-prefix-compile.log counted-rst1-prime-compile.log q4-suffix-compile.log q4-right-endpoint-compile.log m0-even-eight-q4-bridge-compile.log m0-even-eight-q4-prefix-compile.log m0-even-eight-generic-source-compile.log m0-even-eight-valuation-source-compile.log m0-even-eight-valuation-q4-source-compile.log m0-even-eight-valuation-counted-source-compile.log outer-lcinc-prelude-compile.log; then
            echo '::error::sorryAx found in the counted LInc H-run, S1 decrement, or counted-drain dependency closure'
            exit 1
          fi
          echo 'Counted LInc H proof, uniform all-r S1 decrement, closed-form S1 drain, and both q-odd and valuation-uniform M0-even 8q counted source increments compiled; no sorryAx or native_decide dependency detected.'

  m0-valuation-prefix:
    if: ${{ inputs.target == 'all' || inputs.target == 'm0-valuation-prefix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the exact all-q M0-even 8q q4-prefix source theorem
        run: |
          set -euo pipefail
          mkdir -p /tmp/m0-valuation-prefix
          cp im-results/agent8-coverage-contract/{Frontier,Symmetry,RootShift}.lean /tmp/m0-valuation-prefix/
          cp im-results/agent48-champion-root/ChampionRootBridge.lean /tmp/m0-valuation-prefix/
          cp im-results/agent24-champion-time/{ChampionModular,CountPattern,CostRecurrence,CountedSweep,CountedOddBase}.lean /tmp/m0-valuation-prefix/
          cp im-results/agent8-s1-encoder/S1Encoder.lean /tmp/m0-valuation-prefix/
          cp im-results/agent8-counted-reset/CountedReset.lean /tmp/m0-valuation-prefix/
          cp im-results/agent6-q4-prefix/CountedQ4Prefix.lean /tmp/m0-valuation-prefix/
          cp im-results/agent48-counted-inc0/{M0EvenEightQ4Bridge,M0EvenEightQ4Prefix,M0EvenEightValuationSuffix,M0EvenEightValuationEncoding,M0EvenEightValuationFixedPrefix,M0EvenEightValuationMacros,M0EvenEightValuationSweepFacts,M0EvenEightValuationSource}.lean /tmp/m0-valuation-prefix/
          cd /tmp/m0-valuation-prefix
          export LEAN_PATH=.
          lean --version
          lean -o Frontier.olean Frontier.lean
          lean -o Symmetry.olean Symmetry.lean
          lean -o RootShift.olean RootShift.lean
          lean -o ChampionRootBridge.olean ChampionRootBridge.lean
          lean -o ChampionModular.olean ChampionModular.lean
          lean -o CountPattern.olean CountPattern.lean
          lean -o CostRecurrence.olean CostRecurrence.lean
          lean -o CountedSweep.olean CountedSweep.lean
          lean -o CountedOddBase.olean CountedOddBase.lean
          lean -o S1Encoder.olean S1Encoder.lean
          lean -o CountedReset.olean CountedReset.lean
          lean -o CountedQ4Prefix.olean CountedQ4Prefix.lean
          lean -o M0EvenEightQ4Bridge.olean M0EvenEightQ4Bridge.lean
          lean -o M0EvenEightQ4Prefix.olean M0EvenEightQ4Prefix.lean
          lean -o M0EvenEightValuationSuffix.olean M0EvenEightValuationSuffix.lean
          lean -o M0EvenEightValuationEncoding.olean M0EvenEightValuationEncoding.lean
          lean -o M0EvenEightValuationFixedPrefix.olean M0EvenEightValuationFixedPrefix.lean
          lean -o M0EvenEightValuationMacros.olean M0EvenEightValuationMacros.lean
          lean -o M0EvenEightValuationSweepFacts.olean M0EvenEightValuationSweepFacts.lean
          lean -o M0EvenEightValuationSource.olean M0EvenEightValuationSource.lean 2>&1 | tee m0-valuation-prefix-compile.log
          if grep -qE 'sorryAx|native_decide' m0-valuation-prefix-compile.log; then
            echo '::error::sorryAx or native_decide in the all-q M0-even q4-prefix source theorem'
            exit 1
          fi
          echo 'All-q M0-even 8q q4-prefix source theorem compiled; no sorryAx or native_decide detected.'

  tm63-24cycle-dispatcher:
    if: ${{ inputs.target == 'all' || inputs.target == 'tm63-24cycle-dispatcher' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the exact complete 24-class dispatcher import closure
        run: |
          set -euo pipefail
          python3 tools/lean_compile_closure.py \
            im-results/agent24-champion-time/TM63SourceIncrementDispatcherComplete.lean \
            --jobs 4 --workdir /tmp/tm63-24cycle-dispatcher | tee tm63-24cycle-dispatcher-compile.log
          if grep -R -n 'native_decide' /tmp/tm63-24cycle-dispatcher --include='*.lean'; then
            echo '::error::native_decide found in the exact dispatcher import closure'
            exit 1
          fi
          python3 - <<'PY'
          import pathlib
          log = pathlib.Path("tm63-24cycle-dispatcher-compile.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in ("tm63_source_increment_dispatch_complete", "sectionResult_run_to_index_one_complete", "sectionResult_run_complete"):
              lines = [line for line in log.splitlines() if name in line and "depends on axioms:" in line]
              if len(lines) != 1:
                  raise SystemExit(f"expected one axiom profile for {name}, found {len(lines)}")
              profile = lines[0].split("depends on axioms:", 1)[1].strip()
              if not (profile.startswith("[") and profile.endswith("]")):
                  raise SystemExit(f"unrecognized axiom profile for {name}: {profile}")
              axioms = {item.strip() for item in profile[1:-1].split(",") if item.strip()}
              unexpected = axioms - allowed
              if unexpected:
                  raise SystemExit(f"nonstandard axioms in {name}: {sorted(unexpected)}")
              if "sorryAx" in axioms:
                  raise SystemExit(f"sorryAx dependency in {name}")
              print(f"{name}: {sorted(axioms)}")
          if "sorryAx" in log:
              raise SystemExit("sorryAx appeared in the exact dispatcher compilation output")
          PY

  tm63-root-index-one:
    if: ${{ inputs.target == 'all' || inputs.target == 'tm63-root-index-one' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the exact authentic-root index-one import closure
        run: |
          set -euo pipefail
          python3 tools/lean_compile_closure.py \
            im-results/agent48-counted-inc0/TM63RootAfterSectionResultToOne.lean \
            --jobs 4 --workdir /tmp/tm63-root-index-one | tee tm63-root-index-one-compile.log
          if grep -R -n 'native_decide' /tmp/tm63-root-index-one --include='*.lean'; then
            echo '::error::native_decide found in the exact root import closure'
            exit 1
          fi
          python3 - <<'PY'
          import pathlib
          log = pathlib.Path("tm63-root-index-one-compile.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "tm63_root_middle_k_mod_three",
              "tm63_root_residue_six_k_mod_three",
              "tm63_middle34_sectionResult_marker_two",
              "tm63_blank_reaches_after_middle34_to_index_one",
          )
          for name in names:
              lines = [line for line in log.splitlines() if name in line and "depends on axioms:" in line]
              if len(lines) != 1:
                  raise SystemExit(f"expected one axiom profile for {name}, found {len(lines)}")
              profile = lines[0].split("depends on axioms:", 1)[1].strip()
              if not (profile.startswith("[") and profile.endswith("]")):
                  raise SystemExit(f"unrecognized axiom profile for {name}: {profile}")
              axioms = {item.strip() for item in profile[1:-1].split(",") if item.strip()}
              unexpected = axioms - allowed
              if unexpected:
                  raise SystemExit(f"nonstandard axioms in {name}: {sorted(unexpected)}")
              if "sorryAx" in axioms:
                  raise SystemExit(f"sorryAx dependency in {name}")
              print(f"{name}: {sorted(axioms)}")
          if "sorryAx" in log:
              raise SystemExit("sorryAx appeared in the exact root compilation output")
          PY
