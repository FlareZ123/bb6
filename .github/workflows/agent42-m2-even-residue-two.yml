name: Agent 42 m=2,n=8*k+2 q4 source prefix (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact dependencies and marker-2 residue-two source prefix
        run: |
          set -euo pipefail
          mkdir -p /tmp/a42-m2-two
          cp im-results/agent8-coverage-contract/{Frontier,Symmetry,RootShift}.lean /tmp/a42-m2-two/
          cp im-results/agent48-champion-root/ChampionRootBridge.lean /tmp/a42-m2-two/
          cp im-results/agent24-champion-time/{ChampionModular,CostRecurrence,CountPattern,CountedOddBase,CountedSweep}.lean /tmp/a42-m2-two/
          cp im-results/agent8-s1-encoder/S1Encoder.lean /tmp/a42-m2-two/
          cp im-results/agent6-q4-prefix/CountedQ4Prefix.lean /tmp/a42-m2-two/
          cp im-results/agent8-counted-reset/CountedReset.lean /tmp/a42-m2-two/
          cp im-results/agent8-rst1prime/CountedRst1Prime.lean /tmp/a42-m2-two/
          cp im-results/agent8-counted-reset/Q4Suffix.lean /tmp/a42-m2-two/
          cp im-results/agent24-champion-time/Q4RightEndpoint.lean /tmp/a42-m2-two/
          cp im-results/agent48-counted-inc0/M2EvenSixQ4Prefix.lean /tmp/a42-m2-two/
          cp im-results/agent42-champion-terminal/M2EvenResidueTwo.lean /tmp/a42-m2-two/
          cd /tmp/a42-m2-two
          export LEAN_PATH=.
          lean --version
          lean -o Frontier.olean Frontier.lean
          lean -o Symmetry.olean Symmetry.lean
          lean -o RootShift.olean RootShift.lean
          lean -o ChampionRootBridge.olean ChampionRootBridge.lean
          lean -o ChampionModular.olean ChampionModular.lean
          lean -o CostRecurrence.olean CostRecurrence.lean
          lean -o CountPattern.olean CountPattern.lean
          lean -o S1Encoder.olean S1Encoder.lean
          lean -o CountedOddBase.olean CountedOddBase.lean
          lean -o CountedSweep.olean CountedSweep.lean
          lean -o CountedQ4Prefix.olean CountedQ4Prefix.lean
          lean -o CountedReset.olean CountedReset.lean
          lean -o CountedRst1Prime.olean CountedRst1Prime.lean
          lean -o Q4Suffix.olean Q4Suffix.lean
          lean -o Q4RightEndpoint.olean Q4RightEndpoint.lean
          : > /tmp/a42-m2-two/m2-even-residue2-axioms.log
          lean -o M2EvenSixQ4Prefix.olean M2EvenSixQ4Prefix.lean 2>&1 | tee /tmp/a42-m2-two/m2-even-residue2-axioms.log
          lean -o M2EvenResidueTwo.olean M2EvenResidueTwo.lean 2>&1 | tee -a /tmp/a42-m2-two/m2-even-residue2-axioms.log
          if grep -q 'sorryAx' /tmp/a42-m2-two/m2-even-residue2-axioms.log; then
            echo '::error::sorryAx found in marker-2 residue-two q4 source-prefix theorem'
            exit 1
          fi
      - name: Upload Lean diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent42-m2-even-residue-two-diagnostics-${{ github.run_id }}
          path: /tmp/a42-m2-two/m2-even-residue2-axioms.log
          if-no-files-found: ignore
          retention-days: 3
