name: Agent 42 root119 B-phase 10n sweep (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b-shift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unchanged root119 table and exact all-n B/0 macro
        run: |
          set -e
          export LEAN_PATH="im-results/agent42-root119-guard"
          lean -o im-results/agent42-root119-guard/Root119Gate.olean im-results/agent42-root119-guard/Root119Gate.lean
          lean -o im-results/agent42-root119-guard/Root119BShift.olean im-results/agent42-root119-guard/Root119BShift.lean
                    lean -o im-results/agent42-root119-guard/Root119BGrowStages.olean im-results/agent42-root119-guard/Root119BGrowStages.lean
          lean -o im-results/agent42-root119-guard/Root119BGrowFinal.olean im-results/agent42-root119-guard/Root119BGrowFinal.lean
          lean -o im-results/agent42-root119-guard/Root119BShield.olean im-results/agent42-root119-guard/Root119BShield.lean
          lean -o im-results/agent42-root119-guard/Root119BFull.olean im-results/agent42-root119-guard/Root119BFull.lean
          lean im-results/agent42-root119-guard/Root119BFullShield.lean
          lean im-results/agent42-root119-guard/Root119DoubleShieldFalse.lean
