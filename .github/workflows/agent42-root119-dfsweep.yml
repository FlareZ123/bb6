name: Agent 42 root119 D/F rightward sweep (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  df-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check unchanged original auxiliary source and quantified right sweep
        run: |
          set -e
          export LEAN_PATH="im-results/agent42-root119-guard"
          lean -o im-results/agent42-root119-guard/Root119Gate.olean im-results/agent42-root119-guard/Root119Gate.lean
          lean -o im-results/agent42-root119-guard/Root119BShift.olean im-results/agent42-root119-guard/Root119BShift.lean
          lean -o im-results/agent42-root119-guard/Root119BShield.olean im-results/agent42-root119-guard/Root119BShield.lean
          lean -o im-results/agent42-root119-guard/Root119DFSweep.olean im-results/agent42-root119-guard/Root119DFSweep.lean
          lean -o im-results/agent42-root119-guard/Root119FBSweep.olean im-results/agent42-root119-guard/Root119FBSweep.lean
          python -c "import base64,lzma,pathlib,hashlib; p=pathlib.Path('im-results/agent42-root119-guard/Root119Wave.lean.xz.b64'); b=lzma.decompress(base64.b64decode(p.read_bytes())); h=hashlib.sha256(b).hexdigest(); print('wave-source-sha256',h); assert h=='715e5512da53986da896ea05d68d28869fc8489b6ad3e1e49e26459545299930'; p.with_name('Root119Wave.lean').write_bytes(b)"
          lean im-results/agent42-root119-guard/Root119Wave.lean
