name: Agent 42 root119 even-wave prefix returns (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  even-wave-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile authentic source dependencies and new return laws
        run: |
          set -euo pipefail
          A=im-results/agent42-root119-guard
          S=im-results/agent12-root119-shuttle
          R=im-results/agent12-root119-reach
          mkdir -p "$R"
          export LEAN_PATH="$A:$S:$R"
          python "$R/audit_window_closure.py" > "$R/audit_window_closure.json"
          grep -q '"forward_reachable_count": 342' "$R/audit_window_closure.json"
          grep -q '"reverse_preimage_closure_count": 12' "$R/audit_window_closure.json"
          grep -q '"initial_in_reverse_closure": false' "$R/audit_window_closure.json"
          lean -o "$A/Root119Gate.olean" "$A/Root119Gate.lean"
          lean -o "$A/Root119BShift.olean" "$A/Root119BShift.lean"
          lean -o "$A/Root119CGate.olean" "$A/Root119CGate.lean"
          lean -o "$A/Root119BRegular.olean" "$A/Root119BRegular.lean"
          lean -o "$A/Root119BShield.olean" "$A/Root119BShield.lean"
          lean -o "$A/Root119FBSweep.olean" "$A/Root119FBSweep.lean"
          lean -o "$A/Root119DFSweep.olean" "$A/Root119DFSweep.lean"
          lean -o "$S/Root119ShuttleSupport.olean" "$S/Root119ShuttleSupport.lean"
          lean -o "$S/Root119Shuttle.olean" "$S/Root119Shuttle.lean"
          lean -o "$S/Root119EvenSweep.olean" "$S/Root119EvenSweep.lean"
          lean -o "$S/Root119EvenExtra.olean" "$S/Root119EvenExtra.lean"
          lean -o "$S/Root119ParityDichotomy.olean" "$S/Root119ParityDichotomy.lean"
          python -c "import base64,lzma,pathlib,hashlib; p=pathlib.Path('im-results/agent42-root119-guard/Root119Wave.lean.xz.b64'); b=lzma.decompress(base64.b64decode(p.read_bytes())); h=hashlib.sha256(b).hexdigest(); print('wave-source-sha256',h); assert h=='715e5512da53986da896ea05d68d28869fc8489b6ad3e1e49e26459545299930'; p.with_name('Root119Wave.lean').write_bytes(b)"
          lean -o "$A/Root119Wave.olean" "$A/Root119Wave.lean"
          lean -o "$A/Root119WaveNormal.olean" "$A/Root119WaveNormal.lean"
          lean -o "$A/Root119OddWaveRetreat.olean" "$A/Root119OddWaveRetreat.lean"
          lean -o "$A/Root119OddEvenChain.olean" "$A/Root119OddEvenChain.lean" 2>&1 | tee "$A/Root119OddEvenChain.log"
          if grep -q 'sorryAx' "$A/Root119OddEvenChain.log"; then
            echo "::error::sorryAx found in new even-wave return theorems"
            exit 1
          fi
          lean -o "$A/Root119PrefixShield.olean" "$A/Root119PrefixShield.lean" 2>&1 | tee "$A/Root119PrefixShield.log"
          if grep -q 'sorryAx' "$A/Root119PrefixShield.log"; then
            echo "::error::sorryAx found in prefix shield transport theorems"
            exit 1
          fi
          lean -o "$R/Root119OddEvenN0Reach.olean" "$R/Root119OddEvenN0Reach.lean" 2>&1 | tee "$R/Root119OddEvenN0Reach.log"
          if grep -q 'sorryAx' "$R/Root119OddEvenN0Reach.log"; then
            echo "::error::sorryAx found in n=0 reachability exclusion"
            exit 1
          fi
          lean -o "$A/Root119CPhaseReturn.olean" "$A/Root119CPhaseReturn.lean" 2>&1 | tee "$A/Root119CPhaseReturn.log"
          if grep -q 'sorryAx' "$A/Root119CPhaseReturn.log"; then
            echo "::error::sorryAx found in C-phase D1 return theorems"
            exit 1
          fi
          lean -o "$A/Root119TwoWaveRootPrefix.olean" "$A/Root119TwoWaveRootPrefix.lean" 2>&1 | tee "$A/Root119TwoWaveRootPrefix.log"
          if grep -q 'sorryAx' "$A/Root119TwoWaveRootPrefix.log"; then
            echo "::error::sorryAx found in two-wave root prefix return theorems"
            exit 1
          fi
          node "$A/test-root119-two-wave-census.cjs"
      - name: Upload reproducible 10M census data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root119-census-10m
          path: im-results/agent42-root119-guard/root119-census-10m.json
          if-no-files-found: warn
          retention-days: 7
