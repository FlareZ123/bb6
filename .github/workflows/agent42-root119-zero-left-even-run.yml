name: Agent 42 root119 zero-left even-run B/0 return (source proof)

on:
  push:
    paths:
      - '.github/workflows/agent42-root119-zero-left-even-run.yml'
      - 'im-results/agent42-root119-guard/Root119ZeroLeftEvenRun.lean'
      - 'im-results/agent12-root119-shuttle/Root119Gate.lean'
      - 'im-results/agent12-root119-shuttle/Root119ShuttleSupport.lean'
      - 'im-results/agent12-root119-shuttle/Root119EvenSweep.lean'
      - 'im-results/agent12-root119-shuttle/Root119EvenExtra.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zero-left-even-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile source dependencies and exact return theorem
        run: |
          set -euo pipefail
          A=im-results/agent42-root119-guard
          S=im-results/agent12-root119-shuttle
          export LEAN_PATH="$A:$S"
          lean -o "$A/Root119Gate.olean" "$A/Root119Gate.lean"
          lean -o "$S/Root119ShuttleSupport.olean" "$S/Root119ShuttleSupport.lean"
          lean -o "$S/Root119EvenSweep.olean" "$S/Root119EvenSweep.lean"
          lean -o "$S/Root119EvenExtra.olean" "$S/Root119EvenExtra.lean"
          lean "$A/Root119ZeroLeftEvenRun.lean" 2>&1 | tee "$A/Root119ZeroLeftEvenRun.log"
          if grep -q 'sorryAx' "$A/Root119ZeroLeftEvenRun.log"; then
            echo "::error::sorryAx found in zero-left even-run return proof"
            exit 1
          fi
          grep -q 'zeroLeftEvenRun_exact.*depends on axioms' "$A/Root119ZeroLeftEvenRun.log"
          grep -q 'zeroLeftEvenRun_returns_Bzero.*depends on axioms' "$A/Root119ZeroLeftEvenRun.log"
