name: Agent 43 original-section low/high M32 kernel exclusions
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Recreate M32 finite BFS and source theorem files
        run: |
          python3 tools/agent43_c32_certificate.py
          mkdir -p /tmp/agent15-c-check
          cp tools/*.lean /tmp/agent15-c-check/
          cp im-results/agent11-c-line/CLine.lean /tmp/agent15-c-check/
          cp im-results/agent43-c-quotient-kernel/{M32HighAll,M32HighSmall,M32HighSourceBridge,M32ExactSectionBridge}.lean /tmp/agent15-c-check/
      - name: Download complete verified finite kernel proof artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: a43-m32-olean-*
          merge-multiple: true
          path: /tmp/agent15-c-check
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 41538277695
      - name: Compile M32 finite proof, original accelerator invariant and 24 high classes
        run: |
          cd /tmp/agent15-c-check
          export LEAN_PATH=.
          lean -o CCert32Pure.olean CCert32Pure.lean
          lean -o CLine.olean CLine.lean
          lean -o CQuotientSound32.olean CQuotientSound32.lean
          lean -o CMapIf32.olean CMapIf32.lean
          lean -o CGlobal32.olean CGlobal32.lean
          lean -o CFull32.olean CFull32.lean
          lean -o CExclusions32.olean CExclusions32.lean
          lean -o CSourceBridge32.olean CSourceBridge32.lean
          lean -o M32HighAll.olean M32HighAll.lean
          lean -o M32HighSmall.olean M32HighSmall.lean
          lean -o M32HighSourceBridge.olean M32HighSourceBridge.lean
      - name: Compile unmodified Agent 15 original-section semantics (minimum prerequisite closure)
        run: |
          mkdir -p /tmp/agent15-c-check
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal}.lean /tmp/agent15-c-check/
          cp im-results/agent21-c-source-bridge/{CReachBridge,CPhaseRank}.lean /tmp/agent15-c-check/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef,FastSectionProof,FastSectionHalting,Agent46CBridge}.lean /tmp/agent15-c-check/
          cp im-results/agent3-c-odd-image/Agent3CImage.lean /tmp/agent15-c-check/
          cp im-results/agent38-c-section-mod4/Agent38SectionParity.lean /tmp/agent15-c-check/
          cp im-results/agent15-c-halting/{BounceHalting,SectionHalting,SectionPower,BlankHalting,SectionParam,BlankParam,SectionMod8,SectionAffineInverse,SectionDyadic,ReachAffine,AffineNormalize,AffineExclusion,NormalizedGateway,M8M16Composition,AffineQuotientExclusion,AffineParityDepth,AffineHaltOneStep,AffineParityReach,FirstFamilyFilterLimit,SecondFamilyNonperiodic,SecondDeepSector,SecondPartition}.lean /tmp/agent15-c-check/
          cd /tmp/agent15-c-check
          export LEAN_PATH="."
          for f in GenericSection CReachBridge CPhaseRank CSectionTotal JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef FastSectionProof FastSectionHalting Agent46CBridge Agent38SectionParity Agent3CImage BounceHalting; do
            lean -o "$f.olean" "$f.lean"
          done
          lean -o SectionHalting.olean SectionHalting.lean
          lean -o SectionPower.olean SectionPower.lean
          lean -o BlankHalting.olean BlankHalting.lean
          lean -o SectionParam.olean SectionParam.lean
          lean -o BlankParam.olean BlankParam.lean
          lean -o SectionMod8.olean SectionMod8.lean
          lean -o SectionAffineInverse.olean SectionAffineInverse.lean
          lean -o SectionDyadic.olean SectionDyadic.lean
          lean -o ReachAffine.olean ReachAffine.lean
          lean -o AffineNormalize.olean AffineNormalize.lean
          lean -o AffineExclusion.olean AffineExclusion.lean
          lean -o NormalizedGateway.olean NormalizedGateway.lean
      - name: Verify source-level section embedding and stopping-parameter exclusions
        run: |
          cd /tmp/agent15-c-check
          export LEAN_PATH=.
          lean M32ExactSectionBridge.lean
