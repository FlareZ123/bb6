name: Agent 43 Machine C M32 kernel development
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect reusable modulus16 certificate implementation
        run: |
          mkdir -p /tmp/agent43m32
          cd /tmp/agent43m32
          base64 -d "$GITHUB_WORKSPACE/im-results/agent43-c-quotient-kernel/c-cert16.tar.xz.b64" > m16.tar.xz
          echo "1cc951976c75457e35dd6ab62888cfced14e64fbf3c067d4de14f7af2fba540e  m16.tar.xz" | sha256sum -c -
          tar -xJf m16.tar.xz
          for f in CCert16Pure.lean CGlobal16.lean CQuotientSound16.lean CMapIf16.lean CFull16.lean CExclusions16.lean CSourceBridge16.lean; do
            echo "============== BEGIN $f =============="
            cat "$f"
            echo "============== END $f =============="
          done
