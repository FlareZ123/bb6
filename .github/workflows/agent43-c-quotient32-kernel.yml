name: Agent 43 Machine C M32 kernel certificate
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reproduce source and verify full abstract BFS
        run: python3 tools/agent43_c32_certificate.py
      - name: Verify kernel semantic map, candidate exclusion and first graph block
        run: |
          cd tools
          export LEAN_PATH=.
          lean --version
          lean -o CCert32Pure.olean CCert32Pure.lean
          lean -o CQuotientSound32.olean CQuotientSound32.lean
          lean -o CMapIf32.olean CMapIf32.lean
          lean -o P32Block0.olean P32Block0.lean
