name: Agent 43 Machine C M32 kernel certificate
on:
  workflow_dispatch:
    inputs:
      u5_syntax_preflight:
        description: 'Compile the Agent 32 U5 backward-cone logic against a temporary certificate interface only'
        required: false
        type: boolean
        default: false
      thin_gateway_acceptance:
        description: 'Compile Agent 47 thin-gateway source proofs using the already verified M32 closure artifacts'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  prove-blocks:
    if: ${{ !inputs.u5_syntax_preflight && !inputs.thin_gateway_acceptance }}
    name: Kernel closure shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reproduce exact full abstract BFS and 40 proof blocks
        run: python3 tools/agent43_c32_certificate.py
      - name: Check the assigned five blocks inside Lean kernel
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          cd tools
          export LEAN_PATH=.
          lean -o CCert32Pure.olean CCert32Pure.lean
          start=$((5*SHARD))
          end=$((start+4))
          for i in $(seq "$start" "$end"); do
            echo "Kernel-checking P32Block$i"
            lean -o "P32Block$i.olean" "P32Block$i.lean"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: a43-m32-olean-${{ matrix.shard }}
          path: tools/P32Block*.olean
          retention-days: 90

  prove-global:
    if: ${{ !inputs.u5_syntax_preflight && !inputs.thin_gateway_acceptance }}
    needs: [prove-blocks]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reproduce verified BFS and certificate source
        run: python3 tools/agent43_c32_certificate.py
      - uses: actions/download-artifact@v4
        with:
          pattern: a43-m32-olean-*
          merge-multiple: true
          path: tools
      - name: Fully source-linked original accelerator theorem and axiom audit
        run: |
          cd tools
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-line/CLine.lean" CLine.lean
          export LEAN_PATH=.
          lean --version
          lean -o CCert32Pure.olean CCert32Pure.lean
          lean -o CLine.olean CLine.lean
          lean -o CQuotientSound32.olean CQuotientSound32.lean
          lean -o CMapIf32.olean CMapIf32.lean
          lean -o CGlobal32.olean CGlobal32.lean
          lean -o CFull32.olean CFull32.lean
          lean -o CExclusions32.olean CExclusions32.lean
          lean -o CSourceBridge32.olean CSourceBridge32.lean
          # Agent47: source-linked inverse-tree exclusions for two M512-admitted gateway progressions.
          cp "$GITHUB_WORKSPACE/im-results/agent47-c-root-inverse-audit/ThinGatewayM32.lean" ThinGatewayM32.lean
          lean ThinGatewayM32.lean | tee /tmp/agent47-thin-gateway-axioms.log
          if grep -q 'sorryAx' /tmp/agent47-thin-gateway-axioms.log; then
            echo "ERROR: Agent47 thin-gateway theorem unexpectedly used sorryAx"
            exit 1
          fi
          # Agent11: check eight extra absent cylinders in original M32 source
          cp "$GITHUB_WORKSPACE/im-results/agent11-c-first-family/M32EightCells.lean" M32EightCells.lean
          lean M32EightCells.lean
          # Agent32: source-level U5 mixed-64 backward-cone exclusion,
          # reusing the already kernel-checked M32 quotient and source bridge.
          cp "$GITHUB_WORKSPACE/im-results/agent32-u5-backward-cone/M32U5Cells.lean" M32U5Cells.lean
          lean -o M32U5Cells.olean M32U5Cells.lean
          cp "$GITHUB_WORKSPACE/im-results/agent32-u5-backward-cone/M32U5Backward.lean" M32U5Backward.lean
          lean M32U5Backward.lean

  thin-gateway-acceptance:
    if: ${{ inputs.thin_gateway_acceptance }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reproduce the exact M32 source and dependency files
        run: python3 tools/agent43_c32_certificate.py
      - name: Reuse the eight verified M32 kernel-shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: a43-m32-olean-*
          merge-multiple: true
          path: tools
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 44132508910
      - name: Compile the repaired original-source thin-gateway closure
        run: |
          set -euo pipefail
          cd tools
          export LEAN_PATH=.
          lean --version
          lean -o CCert32Pure.olean CCert32Pure.lean
          lean -o CLine.olean CLine.lean
          lean -o CQuotientSound32.olean CQuotientSound32.lean
          lean -o CMapIf32.olean CMapIf32.lean
          lean -o CGlobal32.olean CGlobal32.lean
          lean -o CFull32.olean CFull32.lean
          lean -o CExclusions32.olean CExclusions32.lean
          lean -o CSourceBridge32.olean CSourceBridge32.lean
          cp "$GITHUB_WORKSPACE/im-results/agent47-c-root-inverse-audit/ThinGatewayM32.lean" ThinGatewayM32.lean
          lean ThinGatewayM32.lean | tee /tmp/agent47-thin-gateway-axioms.log
          if grep -Eq 'sorryAx|native_decide' /tmp/agent47-thin-gateway-axioms.log; then
            echo "ERROR: Agent 47 thin-gateway theorem used a forbidden axiom"
            exit 1
          fi
          grep -q 'BB6.Agent47ThinGateway.thin_gateway_103_unreachable' /tmp/agent47-thin-gateway-axioms.log
          grep -q 'BB6.Agent47ThinGateway.thin_gateway_86_unreachable' /tmp/agent47-thin-gateway-axioms.log
          echo "ACCEPTED: both original-source thin-gateway theorems have no sorryAx/native_decide dependency."

  u5-backward-syntax-preflight:
    if: ${{ inputs.u5_syntax_preflight }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the backward-cone logic against an explicitly untrusted stub
        run: |
          set -euo pipefail
          mkdir -p /tmp/u5-preflight
          cp im-results/agent11-c-line/CLine.lean /tmp/u5-preflight/CLine.lean
          cat > /tmp/u5-preflight/M32U5Cells.lean <<'EOF'
          import CLine
          namespace CCert
          def u5ForbiddenCells (x y : Nat) : Prop :=
            x % 32 = 31 ∧ (y % 32 = 5 ∨ y % 32 = 21)
          axiom original_u5_forbidden_unreachable (x y : Nat)
            (h : u5ForbiddenCells x y) : ¬ BB6CLine.Reach (x,y,0)
          end CCert
          EOF
          cp im-results/agent32-u5-backward-cone/M32U5Backward.lean /tmp/u5-preflight/M32U5Backward.lean
          cd /tmp/u5-preflight
          export LEAN_PATH=.
          lean --version
          lean -o CLine.olean CLine.lean
          lean -o M32U5Cells.olean M32U5Cells.lean
          lean -o M32U5Backward.olean M32U5Backward.lean | tee /tmp/u5-backward-preflight.log
          if grep -q 'sorryAx' /tmp/u5-backward-preflight.log; then
            echo "ERROR: backward-cone syntax preflight unexpectedly used sorryAx"
            exit 1
          fi
          if ! grep -q 'CCert.original_u5_forbidden_unreachable' /tmp/u5-backward-preflight.log; then
            echo "ERROR: expected temporary stub axiom was not visible in the audit"
            exit 1
          fi
          echo "SYNTAX-ONLY PREFLIGHT: pass; the one printed CCert axiom is an untrusted temporary stub."
