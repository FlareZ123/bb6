name: Agent43 P1 counted last-reset source check (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify and extract exact Agent50 source archives
        run: |
          set -e
          target="im-results/agent50-p1-two-reset"
          base64 -d "$target/three-reset-source.tar.xz.b64" > /tmp/agent50-three-reset-source.tar.xz
          echo "be550c5b326d27c459197cf81858fd8ecad95abe657d0a9f269c65bbbb12b97f  /tmp/agent50-three-reset-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/agent50-three-reset-source.tar.xz -C "$target"
          base64 -d "$target/count-bridge.tar.xz.b64" > /tmp/agent50-count-bridge.tar.xz
          echo "5b8a74e3e101e389c09a891cd8bda6da803d3bb70abbcb75fdfab8071e804895  /tmp/agent50-count-bridge.tar.xz" | sha256sum -c -
          tar -xJf /tmp/agent50-count-bridge.tar.xz -C "$target"
      - name: Compile exact original P1 sources, Agent43 cost gates and Agent50 reset lower bound
        run: |
          set -e
          MAP=im-results/agent1-p1-map
          INV=im-results/agent47-p1-finite-inverse
          P1=im-results/agent1-p1-quarter
          AG28=im-results/agent28-p1-word-automaton
          AG43=im-results/agent43-p1-high-cost-reset-count
          AG50=im-results/agent50-p1-two-reset
          AG8=im-results/agent8-p1-fixed-reset
          AG50SUB=im-results/agent50-p1-subwall
          export LEAN_PATH="$MAP:$INV:$P1:$AG28:$AG43:$AG50:$AG8:$AG50SUB"
          for m in GParity GInverse PosEvenForm; do
            lean -o "$MAP/$m.olean" "$MAP/$m.lean"
          done
          lean -o "$INV/P1FiniteInverse.olean" "$INV/P1FiniteInverse.lean"
          lean -o "$P1/MassInverse.olean" "$P1/MassInverse.lean"
          lean -o "$P1/OddConeMass.olean" "$P1/OddConeMass.lean"
          lean -o "$INV/P1InverseLog.olean" "$INV/P1InverseLog.lean"
          lean -o "$P1/InverseIff.olean" "$P1/InverseIff.lean"
          lean -o "$P1/UpperTail.olean" "$P1/UpperTail.lean"
          for m in OddWordCost OddWordSourceBridge OneResetGrowth OneResetTwoAdic OneResetBudget OneResetSourceEq OneResetPoly OneResetSourceBudget OneResetSourceBridge OneResetZero OneResetCount DefectTransport; do
            lean -o "$AG28/$m.olean" "$AG28/$m.lean"
          done
          lean -o "$AG43/CountedLastResetDraft.olean" "$AG43/CountedLastResetDraft.lean"
          lean -o "$AG43/LastResetStrengthSource.olean" "$AG43/LastResetStrengthSource.lean"
          lean -o "$AG43/CountedWallStrongGateSource.olean" "$AG43/CountedWallStrongGateSource.lean"
          lean -o "$AG43/CountedEnergySource.olean" "$AG43/CountedEnergySource.lean"
          lean -o "$AG43/CountedEnergyCostSource.olean" "$AG43/CountedEnergyCostSource.lean"
          for m in TwoResetSharp TwoResetDefectSharp UniformDefectStep UniformResetChain ThreeResetGrowth TwoResetFirstDefect ThreeResetExactEquations ResetSkeleton CountSourceBridge CountFinal WallCountLowerBound; do
            lean -o "$AG50/$m.olean" "$AG50/$m.lean"
          done
          for m in NumericShell NumericPower148 NumericBridge148; do
            lean -o "$AG43/$m.olean" "$AG43/$m.lean"
          done
          lean "$AG43/CountedWall148Source.lean"
          lean "$AG43/ExceptionalLastResetSource.lean"
          for m in ExceptionalCost ExceptionalSource ExceptionalStrong ExceptionalStrongSource; do
            lean -o "$AG8/$m.olean" "$AG8/$m.lean"
          done
          lean -o "$AG50SUB/ExceptionalLastResetDepthSource.olean" "$AG50SUB/ExceptionalLastResetDepthSource.lean"
          lean -o "$AG50SUB/RightFiveResetFloor.olean" "$AG50SUB/RightFiveResetFloor.lean"
          lean -o "$AG50SUB/RightFiveTwoArithmetic.olean" "$AG50SUB/RightFiveTwoArithmetic.lean"
          lean -o "$AG50SUB/RightFiveThreeSource.olean" "$AG50SUB/RightFiveThreeSource.lean"
          lean -o "$AG43/DepthIndexedResetFloor.olean" "$AG43/DepthIndexedResetFloor.lean"
          lean -o "$AG43/TwoResetWallPrefix.olean" "$AG43/TwoResetWallPrefix.lean"
