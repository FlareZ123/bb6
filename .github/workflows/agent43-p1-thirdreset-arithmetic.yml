name: Agent43 P1 third-reset arithmetic (manual Lean)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Decode and verify archive
        run: |
          set -e
          DIR=im-results/agent43-p1-two-reset
          base64 -d "$DIR/three-reset-arithmetic.tar.xz.b64" > /tmp/three-reset-arithmetic.tar.xz
          echo "407d4c9a2b654546389ebf92a1ff231c3979118819ebe3263cf58c58ca4d4ef5  /tmp/three-reset-arithmetic.tar.xz" | sha256sum -c -
          mkdir -p "$DIR/third"
          tar -xJf /tmp/three-reset-arithmetic.tar.xz -C "$DIR/third"
      - name: Lean kernel exact all-natural arithmetic
        run: |
          set -e
          DIR=im-results/agent43-p1-two-reset/third
          export LEAN_PATH="$DIR"
          lean -o "$DIR/ThreeResetGrowth.olean" "$DIR/ThreeResetGrowth.lean"
          lean -o "$DIR/ThreeResetTailBudget.olean" "$DIR/ThreeResetTailBudget.lean"
          lean "$DIR/ThreeResetWall.lean"
