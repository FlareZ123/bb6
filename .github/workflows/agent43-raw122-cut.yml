name: Agent43 raw122 disjoint source audit
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source revision
        required: false
        type: string
      artifact_run_id:
        description: Reuse generated and audited artifacts from an earlier run; requires source_ref to match that run's head SHA
        required: false
        type: string
      branches:
        description: Space-separated F1 child codes
        required: false
        default: '0RB 0RC 0RD 1LD 1RB 1RD'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Generate selected disjoint candidate trees
        env:
          BRANCHES: ${{ inputs.branches }}
        run: python im-results/agent43-raw122-cut/generate.py $BRANCHES
      - name: Plan audit shards
        id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib,json
          root=pathlib.Path("im-results/agent43-raw122-cut")
          jobs=[]
          for i in range(24):
              b=f"{i:02}"
              if (root/f"Raw122Kid{b}_00.lean").exists():
                  for start in range(0,24,6):
                      jobs.append({"branch":b,"start":start,"end":start+6})
          jobs.append({"branch":"base","start":-1,"end":-1})
          print("matrix="+json.dumps({"include":jobs},separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-generated
          path: im-results/agent43-raw122-cut/*.lean
          if-no-files-found: error
  branch:
    if: inputs.artifact_run_id == ''
    needs: generate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          path: im-results/agent43-raw122-cut
      - name: Check disjoint audit shard
        env:
          BRANCH: ${{ matrix.branch }}
          FIRST: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          root=im-results/agent43-raw122-cut
          roots=()
          if [ "$FIRST" = -1 ]; then
            roots+=("$root/Raw122Base.lean")
          else
            for ((i=FIRST;i<END;i++)); do
              printf -v name 'Raw122Kid%s_%02d.lean' "$BRANCH" "$i"
              roots+=("$root/$name")
            done
          fi
          python tools/lean_compile_closure.py --workdir /tmp/a43-audit --jobs 3 "${roots[@]}" | tee /tmp/a43-audit.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a43-audit.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-audit-${{ matrix.branch }}-${{ matrix.start }}
          path: /tmp/a43-audit/*.olean
          if-no-files-found: error
  assemble:
    if: inputs.artifact_run_id == ''
    needs: [generate, branch]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          path: /tmp/a43-source
      - uses: actions/download-artifact@v4
        with:
          pattern: raw122-audit-*
          path: /tmp/a43-audit
          merge-multiple: true
      - name: Compose checked children and exact residual count
        run: |
          set -euo pipefail
          cp /tmp/a43-source/*.lean /tmp/a43-audit/
          cd /tmp/a43-audit
          export LEAN_PATH="$PWD"
          for i in $(seq -w 0 23); do
            lean -o "Raw122Branch${i}.olean" "Raw122Branch${i}.lean"
          done
          lean -o Raw122Data.olean Raw122Data.lean | tee /tmp/a43-root.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a43-root.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-certified-root
          path: /tmp/a43-audit/*.olean
          if-no-files-found: error

  # A failed matrix shard can be rerun independently. GitHub leaves the
  # dependent assemble job skipped after a failed-only rerun, so expose an
  # assembly-only path that consumes the already uploaded artifacts.

  recover:
    if: inputs.artifact_run_id != ''
    needs: generate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify source revision
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${{ inputs.source_ref }}"
          expected="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" --jq '.head_sha')"
          test "$expected" = "${{ inputs.source_ref }}"
          git diff --exit-code "${{ inputs.source_ref }}" -- \
            im-results/agent43-raw122-cut/generate.py \
            im-results/agent43-raw122-cut/symbolic.py \
            im-results/agent43-raw122-cut/long-plans.json \
            im-results/agent43-raw122-cut/extra-bank.txt \
            im-results/agent43-raw122-cut/phase27510.py \
            im-results/agent31-three-hole-tnf/generate_four_hole.py \
            im-results/agent31-three-hole-tnf/generate_sweeps.py \
            im-results/agent47-raw114-cut/multi_sweep.py \
            im-results/agent2-tnf-raw99/enumerate.cpp \
            im-results/agent8-tnf-six/bank.cpp \
            im-results/agent1-ngram/ngram.cpp \
            im-results/agent47-raw111-cut/ngram_sparse.cpp \
            im-results/agent8-tnf-raw117/bank117.txt \
            im-results/agent8-tnf-raw117/bank112.txt \
            im-results/agent8-tnf-raw117/bank112extra.txt \
            im-results/agent8-tnf-six/raw115/bank.txt \
            im-results/agent8-tnf-six/raw119/bank.txt \
            im-results/agent47-raw111-cut/far-bank.txt \
            im-results/agent47-raw112-cut/far-bank.txt \
            im-results/agent47-raw112-cut/far-extra.txt \
            im-results/agent47-raw115-cut/far-bank.txt \
            im-results/agent3-tnf-raw120/bank.txt \
            im-results/agent3-tnf-raw120/rb-bank.txt \
            im-results/agent3-tnf-raw120/la-discovery-bank.txt \
            im-results/agent47-raw111-cut/emit_sparse.py \
            im-results/agent1-ngram/emit_ngram.py \
            im-results/agent13-coverage/unpack.py \
            tools/lean_compile_closure.py
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          path: /tmp/a43-source
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/a43-source-old
      - uses: actions/download-artifact@v4
        with:
          name: raw122-audit-03-0
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/a43-core
      - name: Recover missing shard with verified shared objects
        env:
          BRANCH: ${{ matrix.branch }}
          FIRST: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: python im-results/agent43-raw122-cut/recover_shard.py
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-recovery-${{ matrix.branch }}-${{ matrix.start }}
          path: /tmp/a43-recovery/
          retention-days: 30

  assemble-existing:
    if: inputs.artifact_run_id != ''
    needs: [generate, recover]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify the artifact run and checked-out source are identical
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${{ inputs.source_ref }}" || { echo "source_ref must be the exact artifact head SHA"; exit 1; }
          expected="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" --jq '.head_sha')"
          test "$expected" = "${{ inputs.source_ref }}"
          git diff --exit-code "${{ inputs.source_ref }}" -- \
            im-results/agent43-raw122-cut/generate.py \
            im-results/agent43-raw122-cut/symbolic.py \
            im-results/agent43-raw122-cut/long-plans.json \
            im-results/agent43-raw122-cut/extra-bank.txt \
            tools/lean_compile_closure.py
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          path: /tmp/a43-source
      - uses: actions/download-artifact@v4
        with:
          pattern: raw122-recovery-*
          path: /tmp/a43-new-shards
          merge-multiple: false
      - name: Assemble exact parent partial audit from retained shards
        run: python im-results/agent43-raw122-cut/assemble_recovered.py
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-certified-root
          path: /tmp/a43-audit/
          retention-days: 30
