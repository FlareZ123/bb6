name: Agent43 raw122 disjoint source audit
on:
  workflow_dispatch:
    inputs:
      compile_complete_parent:
        description: Compile the 24-child Raw122 parent Cover against the pinned original source closure
        type: boolean
        default: false
      targeted_recovery:
        description: Run explicit targeted child-shard checks for selected Raw122 F1 branches
        type: boolean
        default: false
      assemble_branch:
        description: "0 assembles 0LA, 5 reuses 0LF, and 16/17 extract original residual rosters"
        required: false
        type: string
        default: ''
      target_run_id:
        description: Existing 0LF target-matrix workflow run to reuse in assembly-only mode
        required: false
        type: string
        default: '45800793166'
      retain_residuals:
        description: Keep original unresolved leaves and use checked prefix-cut factoring
        type: boolean
        default: false
      target_matrix:
        description: Explicit JSON matrix of nonoverlapping targeted audit groups
        required: false
        type: string
        default: '{"include":[{"branch":14,"first":0,"end":1},{"branch":14,"first":1,"end":2},{"branch":14,"first":2,"end":3},{"branch":14,"first":3,"end":4},{"branch":14,"first":4,"end":5},{"branch":14,"first":5,"end":6},{"branch":14,"first":12,"end":13},{"branch":14,"first":13,"end":14},{"branch":14,"first":14,"end":15},{"branch":14,"first":15,"end":16},{"branch":14,"first":16,"end":17},{"branch":14,"first":17,"end":18}]}'
      source_ref:
        description: Exact source revision
        required: false
        type: string
      artifact_run_id:
        description: Reuse generated and audited artifacts from an earlier run; requires source_ref to match that run's head SHA
        required: false
        type: string
      generate_only:
        description: Generate candidate coverage without compiling Lean shards
        required: false
        default: false
        type: boolean
      branches:
        description: Space-separated F1 child codes
        required: false
        default: '0RB 0RC 0RD 1LD 1RB 1RD'
        type: string
permissions:
  contents: write
  actions: read
jobs:
  generate:
    if: inputs.targeted_recovery != true && inputs.assemble_branch == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Generate selected disjoint candidate trees
        env:
          BRANCHES: ${{ inputs.branches }}
        run: python im-results/agent43-raw122-cut/generate.py $BRANCHES
      - name: Plan audit shards
        id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib,json
          root=pathlib.Path("im-results/agent43-raw122-cut")
          jobs=[]
          for i in range(24):
              b=f"{i:02}"
              if (root/f"Raw122Kid{b}_00.lean").exists():
                  for start in range(0,24,6):
                      jobs.append({"branch":b,"start":start,"end":start+6})
          jobs.append({"branch":"base","start":-1,"end":-1})
          print("matrix="+json.dumps({"include":jobs},separators=(",",":")))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-generated
          path: im-results/agent43-raw122-cut/*.lean
          if-no-files-found: error
  branch:
    if: inputs.artifact_run_id == '' && inputs.generate_only != true
    needs: generate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          path: im-results/agent43-raw122-cut
      - name: Check disjoint audit shard
        env:
          BRANCH: ${{ matrix.branch }}
          FIRST: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          root=im-results/agent43-raw122-cut
          roots=()
          if [ "$FIRST" = -1 ]; then
            roots+=("$root/Raw122Base.lean")
          else
            for ((i=FIRST;i<END;i++)); do
              printf -v name 'Raw122Kid%s_%02d.lean' "$BRANCH" "$i"
              roots+=("$root/$name")
            done
          fi
          python tools/lean_compile_closure.py --workdir /tmp/a43-audit --jobs 3 "${roots[@]}" | tee /tmp/a43-audit.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a43-audit.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-audit-${{ matrix.branch }}-${{ matrix.start }}
          path: /tmp/a43-audit/*.olean
          if-no-files-found: error
  assemble:
    if: inputs.artifact_run_id == '' && inputs.generate_only != true
    needs: [generate, branch]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          path: /tmp/a43-source
      - uses: actions/download-artifact@v4
        with:
          pattern: raw122-audit-*
          path: /tmp/a43-audit
          merge-multiple: true
      - name: Compose checked children and exact residual count
        run: |
          set -euo pipefail
          cp /tmp/a43-source/*.lean /tmp/a43-audit/
          cd /tmp/a43-audit
          export LEAN_PATH="$PWD"
          for i in $(seq -w 0 23); do
            lean -o "Raw122Branch${i}.olean" "Raw122Branch${i}.lean"
          done
          lean -o Raw122Data.olean Raw122Data.lean | tee /tmp/a43-root.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a43-root.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-certified-root
          path: /tmp/a43-audit/*.olean
          if-no-files-found: error

  # A failed matrix shard can be rerun independently. GitHub leaves the
  # dependent assemble job skipped after a failed-only rerun, so expose an
  # assembly-only path that consumes the already uploaded artifacts.

  recover:
    if: inputs.artifact_run_id != '' && inputs.generate_only != true
    needs: generate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.generate.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify source revision
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${{ inputs.source_ref }}"
          expected="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" --jq '.head_sha')"
          test "$expected" = "${{ inputs.source_ref }}"
          git fetch --no-tags --depth=1 origin "${{ inputs.source_ref }}"
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          path: /tmp/a43-source
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/a43-source-old
      - uses: actions/download-artifact@v4
        with:
          name: raw122-audit-03-0
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/a43-core
      - name: Recover missing shard with verified shared objects
        env:
          BRANCH: ${{ matrix.branch }}
          FIRST: ${{ matrix.start }}
          END: ${{ matrix.end }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: python im-results/agent43-raw122-cut/recover_shard.py
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-recovery-${{ matrix.branch }}-${{ matrix.start }}
          path: /tmp/a43-recovery/
          retention-days: 30

  assemble-existing:
    if: inputs.artifact_run_id != '' && inputs.generate_only != true
    needs: [generate, recover]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify the artifact run and checked-out source are identical
        env:
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${{ inputs.source_ref }}" || { echo "source_ref must be the exact artifact head SHA"; exit 1; }
          expected="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ARTIFACT_RUN_ID}" --jq '.head_sha')"
          test "$expected" = "${{ inputs.source_ref }}"
      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          path: /tmp/a43-source
      - uses: actions/download-artifact@v4
        with:
          pattern: raw122-recovery-*
          path: /tmp/a43-new-shards
          merge-multiple: false
      - name: Assemble exact parent partial audit from retained shards
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: python im-results/agent43-raw122-cut/assemble_recovered.py
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-certified-root
          path: /tmp/a43-audit/
          retention-days: 30

  targeted-recovery:
    if: inputs.targeted_recovery == true
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(inputs.target_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          run-id: 45655656030
          github-token: ${{ github.token }}
          path: /tmp/a43-source
      - uses: actions/download-artifact@v4
        with:
          name: raw122-audit-01-18
          run-id: 45595285735
          github-token: ${{ github.token }}
          path: /tmp/a43-core
      - name: Check missing modules against retained core
        env:
          RAW122_RETAIN_RESIDUALS: ${{ inputs.retain_residuals }}
        run: python im-results/agent43-raw122-cut/targeted_recover.py ${{ matrix.branch }} ${{ matrix.first }} ${{ matrix.end }}
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-target-${{ matrix.branch }}-${{ matrix.first }}
          path: /tmp/a43-target-out/
          retention-days: 30

  assemble-targeted-branch:
    if: inputs.targeted_recovery == true && inputs.assemble_branch == '5'
    needs: [targeted-recovery]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: raw122-target-5-*
          path: /tmp/a43-targets
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          run-id: 45655656030
          github-token: ${{ github.token }}
          path: /tmp/a43-source
      - uses: actions/download-artifact@v4
        with:
          name: raw122-audit-01-18
          run-id: 45595285735
          github-token: ${{ github.token }}
          path: /tmp/a43-core
      - name: Assemble original residual roster and prove the 0LF child Cover
        run: python im-results/agent43-raw122-cut/assemble_targeted_branch.py 5
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-branch05-cover
          path: /tmp/a43-output/
          retention-days: 90
          if-no-files-found: error
  assemble-branch00:
    if: inputs.assemble_branch == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: raw122-target-0-*
          run-id: 45773448173
          github-token: ${{ github.token }}
          path: /tmp/a43-targets/run45773448173
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          pattern: raw122-target-0-*
          run-id: 45785487569
          github-token: ${{ github.token }}
          path: /tmp/a43-targets/run45785487569
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          run-id: 45655656030
          github-token: ${{ github.token }}
          path: /tmp/a43-source
      - uses: actions/download-artifact@v4
        with:
          name: raw122-audit-01-18
          run-id: 45595285735
          github-token: ${{ github.token }}
          path: /tmp/a43-core
      - name: Assemble the 0LA residual roster and prove its child Cover if closed
        run: python im-results/agent43-raw122-cut/assemble_branch00.py
      - name: Persist 0LA assembly evidence in im-results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for delay in 0 5 10; do
            sleep "$delay"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            DEST="im-results/agent43-raw122-cut/branch00-assembly"
            rm -rf "$DEST"
            mkdir -p "$DEST"
            cp /tmp/a43-output/Raw122Roster00* "$DEST/"
            cp /tmp/a43-output/Agent29Raw122Indexed* "$DEST/"
            cp /tmp/a43-output/Raw122D15* /tmp/a43-output/Raw122Direct15* "$DEST/"
            cp /tmp/a43-output/Raw122Recovered00.lean /tmp/a43-output/Raw122Branch00.lean "$DEST/"
            cp /tmp/a43-output/proof-metadata.json /tmp/a43-output/Lean-axioms.txt /tmp/a43-output/manifest.json "$DEST/"
            git add "$DEST"
            if git diff --cached --quiet; then
              echo "No new 0LA evidence to persist."
              exit 0
            fi
            git commit -m "Agent 43: preserve Raw122 0LA child Cover"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-branch00-assembly
          path: /tmp/a43-output/
          retention-days: 90
          if-no-files-found: error
  assemble-branch05-existing:
    if: inputs.assemble_branch == '5' && inputs.targeted_recovery != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: raw122-target-5-*
          run-id: ${{ inputs.target_run_id }}
          github-token: ${{ github.token }}
          path: /tmp/a43-targets
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          run-id: 45655656030
          github-token: ${{ github.token }}
          path: /tmp/a43-source
      - uses: actions/download-artifact@v4
        with:
          name: raw122-audit-01-18
          run-id: 45595285735
          github-token: ${{ github.token }}
          path: /tmp/a43-core
      - name: Assemble the existing 0LF target matrix and prove its child Cover
        run: python im-results/agent43-raw122-cut/assemble_targeted_branch.py 5
      - name: Persist 0LF assembly evidence in im-results
        run: |
          DEST="im-results/agent43-raw122-cut/branch05-assembly"
          mkdir -p "$DEST"
          cp /tmp/a43-output/Raw122Roster05* "$DEST/"
          cp /tmp/a43-output/Raw122Recovered05.lean /tmp/a43-output/Raw122Branch05.lean "$DEST/"
          cp /tmp/a43-output/proof-metadata.json /tmp/a43-output/Lean-axioms.txt /tmp/a43-output/manifest.json "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Agent 43: preserve Raw122 0LF assembly evidence"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-branch05-cover
          path: /tmp/a43-output/
          retention-days: 90
          if-no-files-found: error
  extract-roster:
    if: inputs.targeted_recovery != true && (inputs.assemble_branch == '16' || inputs.assemble_branch == '17')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          run-id: 45655656030
          github-token: ${{ github.token }}
          path: /tmp/a43-source
      - name: Extract both original-source residual rosters
        run: |
          python im-results/agent43-raw122-cut/residual_roster.py /tmp/a43-source /tmp/a43-rosters 16
          python im-results/agent43-raw122-cut/residual_roster.py /tmp/a43-source /tmp/a43-rosters 17
          cat /tmp/a43-rosters/Raw122Roster16.tsv
          cat /tmp/a43-rosters/Raw122Roster17.tsv
      - name: Persist both residual rosters in im-results
        run: |
          for BRANCH in 16 17; do
            DEST="im-results/agent43-raw122-cut/rosters/branch${BRANCH}"
            mkdir -p "$DEST"
            cp /tmp/a43-rosters/Raw122Roster${BRANCH}* "$DEST/"
            printf '{\n  "branch_index": %s,\n  "source_artifact_run_id": 45655656030,\n  "source_artifact_id": 15043765926,\n  "generator": "im-results/agent43-raw122-cut/residual_roster.py"\n}\n' "$BRANCH" > "$DEST/metadata.json"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/agent43-raw122-cut/rosters/branch16 im-results/agent43-raw122-cut/rosters/branch17
          if ! git diff --cached --quiet; then
            git commit -m "Agent 43: preserve Raw122 1LE and 1LF residual rosters"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-rosters-16-17
          path: /tmp/a43-rosters/
          retention-days: 90
          if-no-files-found: error

  assemble-branches16-17:
    if: inputs.targeted_recovery == true && inputs.assemble_branch == '16'
    needs: [targeted-recovery]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          pattern: raw122-target-16-*
          path: /tmp/a43-targets/branch16
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          pattern: raw122-target-17-*
          path: /tmp/a43-targets/branch17
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: raw122-generated
          run-id: 45655656030
          github-token: ${{ github.token }}
          path: /tmp/a43-source
      - uses: actions/download-artifact@v4
        with:
          name: raw122-audit-01-18
          run-id: 45595285735
          github-token: ${{ github.token }}
          path: /tmp/a43-core
      - name: Assemble original-source 1LE and 1LF residual Covers
        run: python im-results/agent43-raw122-cut/assemble_branches16_17.py
      - name: Persist both child Covers in im-results
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for delay in 0 5 10; do
            sleep "$delay"
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            DEST16="im-results/agent43-raw122-cut/branch16-assembly"
            DEST17="im-results/agent43-raw122-cut/branch17-assembly"
            rm -rf "$DEST16" "$DEST17"
            mkdir -p "$DEST16" "$DEST17"
            cp /tmp/a43-output/branch16-assembly/. "$DEST16/"
            cp /tmp/a43-output/branch17-assembly/. "$DEST17/"
            git add "$DEST16" "$DEST17"
            if git diff --cached --quiet; then
              echo "No new 1LE/1LF evidence to persist."
              exit 0
            fi
            git commit -m "Agent 43: preserve Raw122 1LE and 1LF child Covers"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: raw122-branches16-17-covers
          path: /tmp/a43-output/
          retention-days: 90
          if-no-files-found: error

  persist-branch00-witnesses:
    if: inputs.assemble_branch == '0persist'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw122-branch00-assembly
          run-id: 45819084258
          github-token: ${{ github.token }}
          path: /tmp/a43-branch00-artifact
      - name: Persist source modules for the accepted 0LA Cover
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
