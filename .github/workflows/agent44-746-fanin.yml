name: Agent 44 #746 unbounded reset-parent fan-in (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            if curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh &&
               sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2; then
              echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Compile original checked-in C-first-return grammar and valuation source
        run: |
          set -eu
          a="im-results/agent7-cascade-odd-fibers"
          b="im-results/agent10-cascade"
          f="im-results/agent7-cascade-forward"
          c="im-results/agent44-746-fanin"
          export LEAN_PATH="$a:$b:$f:$c:im-results/agent44-746-rank"
          lean --version
          for m in SourceMacro CascadeOdd ReverseResidue GapCore Mass; do
            lean -o "$a/$m.olean" "$a/$m.lean"
          done
          lean -o "$b/FirstReturnCore.olean" "$b/FirstReturnCore.lean"
          lean -o "$a/LowGates.olean" "$a/LowGates.lean"
          lean -o "$a/SurvivingSmall.olean" "$a/SurvivingSmall.lean"
          lean -o "$a/WellInverseCases.olean" "$a/WellInverseCases.lean"
          lean -o "$a/PreimageCandidates.olean" "$a/PreimageCandidates.lean"
          for m in TerminalExit GapOddJoin SweepInvariant RootTerminal ResetAncestry FatalExclusion SmallFatal GateNecessary ExactGate; do
            lean -o "$b/$m.olean" "$b/$m.lean"
          done
          for m in ValuationDrain FullReturn ReturnInverseArithmetic ResetInverseWitnesses FirstOutcome FirstInverseComplete ResetChain ResetParentStrict ManyShield FastShield; do
            lean -o "$b/$m.olean" "$b/$m.lean"
          done
          for m in UniformFatalParent UniformFatalMod9 UniformRootGate UniqueEvenBand SecondEven FirstFork FirstForkExactTwo FirstForkOddT2 FirstForkModulo54 FirstForkAt81 FirstFork162 FirstForkT3 FirstForkThree FirstForkOddT45 FirstForkOddValuation FirstForkExactThree FirstForkRootThree FirstForkFatalThree FirstForkSix FirstForkSixResidues FirstForkOddValuationSix FirstForkExactFour FirstForkRootFour FirstForkFourDistinct FirstForkFourResidues FatalValuationPower FatalValuationUnbounded FatalValuationBeyond; do
            lean -o "$f/$m.olean" "$f/$m.lean"
          done
          for m in BandTriple OddGroup ExactOdd ManyParents UnboundedFatal; do
            lean -o "$c/$m.olean" "$c/$m.lean"
          done
          for m in LogBands LogStep Telescope GeomLog GeomBand ExactCountLean ParameterCountBridge TerminalCount; do
            lean -o "$c/$m.olean" "$c/$m.lean"
          done
          lean -o "$f/OddTotalCount.olean" "$f/OddTotalCount.lean"
          r="im-results/agent44-746-rank"
          lean -o "$r/ReverseRank.olean" "$r/ReverseRank.lean"
          lean -o "$r/ResetRank.olean" "$r/ResetRank.lean"
          lean -o "$r/FatalRank.olean" "$r/FatalRank.lean"
          lean -o "$r/RootDepth.olean" "$r/RootDepth.lean"
          lean -o "$r/ForwardRun.olean" "$r/ForwardRun.lean"
          for m in ScanFail StripTwos ExecutableReturn FastForward FastDecision NewFiniteGates Gates270to281 Gates282to299 GatesTo299 FullThrough299; do
            lean -o "$r/$m.olean" "$r/$m.lean"
          done
          for m in HalfRank HalfResetRank HalfDepth HalfFatal; do
            lean -o "$r/$m.olean" "$r/$m.lean"
          done
          s="im-results/agent7-746-bitsweep"
          export LEAN_PATH="$LEAN_PATH:$s"
          for m in SweepBitLength SweepBitLengthBridge SweepBitOutcome SweepEvenBlock SweepEvenOrbit SweepEvenFamily SweepMacroCheck SweepOddCross SweepEvenExit SweepEvenMaximal SweepEvenDeficit SweepAddress SweepOrbitAddress SweepSameAddress SweepLevelBound SweepGateEntry SweepExactLevel SweepAdjacentFatal SweepFullLevelBatch SweepStageAlgorithm SweepMacroOrbit SweepQuadraticRank SweepNoEvenEvenFatal SweepAlternatingExits SweepOddAfterEven SweepShortEvenEntry; do
            lean -o "$s/$m.olean" "$s/$m.lean"
          done
          # SweepAlternatingMacro has an existing unresolved source-level rewrite error.
          # Excluding that unfinished module allows the independent fatal-depth audits.
          lean -o "$b/SweepOddFatalDepth.olean" "$b/SweepOddFatalDepth.lean"
          lean -o "$b/SweepOddFatalNine.olean" "$b/SweepOddFatalNine.lean"
          lean -o "$b/SweepOddFatalResidue.olean" "$b/SweepOddFatalResidue.lean"
          lean -o "$b/SweepOddFatalExceptional.olean" "$b/SweepOddFatalExceptional.lean"
          lean -o "$b/SweepAdjacentFatalSieve.olean" "$b/SweepAdjacentFatalSieve.lean"
          v="im-results/agent7-746-fatal-depth-27"
          export LEAN_PATH="$LEAN_PATH:$v"
          lean -o "$v/SweepOddFatal27Arithmetic.olean" "$v/SweepOddFatal27Arithmetic.lean"
          lean -o "$v/SweepOddFatal27Source.olean" "$v/SweepOddFatal27Source.lean"
          lean -o "$v/SweepOddFatal27Band.olean" "$v/SweepOddFatal27Band.lean"
          lean -o "$v/SweepOddFatal27Upper.olean" "$v/SweepOddFatal27Upper.lean"
          echo "PASS: source-related triangular half-quadratic reset inverse-depth proof"
          echo "PASS: source-related quadratic reset-inverse chain depth proof"
          echo "PASS: source-certified exact nonterminal odd first-reset parameter count"
          echo "PASS: authenticated unbounded genuine first-return reset-parent fan-in in both fatal index sectors"
