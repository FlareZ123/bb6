name: Agent44 Extra132 row-split recovery on trigger

on:
  push:
    branches: [main]
    paths:
      - 'im-results/agent44-raw11-extra28/trigger-extra132-row.txt'

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 45896597080
          pattern: raw11-six-hole-*
          merge-multiple: true
          path: /tmp/six-hole

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 45906697676
          name: raw11-root52-known-consumption
          path: /tmp/base

      - name: Regenerate exact Extra132 source with singleton kernel certificates
        env:
          SIX_HOLE_DATA: /tmp/six-hole
          RAW11_EXTENDED_AUTOMATA: '1'
          RAW11_REPAIR_SPLIT: '1'
          RAW11_REPAIR_CERT_THRESHOLD: '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/parent-source /tmp/parent-out
          node im-results/agent5-weighted-tnf-queue/generate-extra-parent-shards.cjs             132 /tmp/parent-source | tee /tmp/generation.log
          test -s /tmp/parent-source/Agent5Raw11Extra132.lean
          test -s /tmp/parent-source/Agent5Raw11Extra132Sub_root_12_root_19_root_21.lean

      - name: Reuse seven immutable accepted leaf banks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for pair in             1:15167752700 2:15167528142 3:15167803036             4:15167811958 5:15168810518 6:15167956708 7:15167922399; do
            group="${pair%%:*}"
            id="${pair#*:}"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/FlareZ123/bb6/actions/artifacts/$id/zip"               -o "/tmp/leaf-$id.zip"
            unzip -o -q "/tmp/leaf-$id.zip" -d /tmp/parent-out
            test -s "/tmp/parent-out/receipt-$group.json"
          done

      - name: Row-split only the giant exact FAR leaf
        run: |
          set -euo pipefail
          python im-results/agent44-raw11-extra28/split_two_sided_leaf.py             /tmp/parent-source/Agent5Raw11Extra132Sub_root_12_root_19_root_21.lean             '1RB1RD1RC1RE0LA0LD1LA1LC0RF---0RC0RE'             | tee /tmp/row-split.log
          grep -F 'cert_bytes=' /tmp/row-split.log
          test -s /tmp/parent-source/Agent44Extra132GiantProof.lean
          test -s /tmp/parent-source/TwoSidedAutomataRows.lean

      - name: Checkpoint bounded kernel progress through row-split support
        env:
          RAW11_REPAIR_ID: '132'
          RAW11_REPAIR_TARGET: Agent44Extra132GiantProof
          RAW11_REPAIR_MAX_FRESH: '6'
          RAW11_REPAIR_MODULE_TIMEOUT: '240'
        run: |
          set -euo pipefail
          python im-results/agent47-raw11-adapter/compile-parent-repair.py             /tmp/parent-source /tmp/base/tmp/a47-raw11-root52-known             /tmp/parent-out 2>&1 | tee /tmp/checkpoint.log
          grep -E 'checkpoint|accepted 132 repaired complete parent' /tmp/checkpoint.log
          if grep -Eq 'sorryAx|native_decide' /tmp/checkpoint.log; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-132-row-checkpoint
          path: |
            /tmp/parent-out
            /tmp/parent-source
            /tmp/generation.log
            /tmp/row-split.log
            /tmp/checkpoint.log
          if-no-files-found: warn
          retention-days: 30
