name: Agent44 Extra140 fine-shard recovery on trigger

on:
  push:
    branches: [main]
    paths:
      - 'im-results/agent44-raw11-extra28/trigger-extra140-fine.txt'

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 45896597080
          pattern: raw11-six-hole-*
          merge-multiple: true
          path: /tmp/six-hole

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 45906697676
          name: raw11-root52-known-consumption
          path: /tmp/base

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 46141446137
          name: raw11-140-checkpoint
          path: /tmp/checkpoint

      - name: Regenerate exact Extra140 root6 with singleton-node modules
        env:
          SIX_HOLE_DATA: /tmp/six-hole
          RAW11_EXTENDED_AUTOMATA: '1'
          RAW11_REPAIR_SPLIT: '1'
          RAW11_REPAIR_MODULE_THRESHOLD: '1'
          RAW11_REPAIR_CERT_THRESHOLD: '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/parent-source /tmp/parent-out
          node im-results/agent5-weighted-tnf-queue/generate-extra-parent-shards.cjs             140 /tmp/parent-source | tee /tmp/generation.log
          test -s /tmp/parent-source/Agent5Raw11Extra140.lean
          python - <<'PY'
          from pathlib import Path
          rows=sorted(
            ((p.stat().st_size,p.name) for p in Path('/tmp/parent-source').glob('*.lean')),
            reverse=True,
          )
          print('source_modules',len(rows))
          for size,name in rows[:30]:
              print('SOURCE_SIZE',size,name)
          assert rows[0][0] < 600_000, rows[0]
          PY
          receipt="$(find /tmp/checkpoint -type f -name repair-receipt.json -print -quit)"
          test -n "$receipt"
          cp -a "$(dirname "$receipt")/." /tmp/parent-out/
          echo "accepted_objects_before=$(find /tmp/parent-out -name '*.olean' | wc -l)"

      - name: Checkpoint bounded kernel progress
        env:
          RAW11_REPAIR_ID: '140'
          RAW11_REPAIR_MAX_FRESH: '8'
          RAW11_REPAIR_MODULE_TIMEOUT: '240'
        run: |
          set -euo pipefail
          python im-results/agent47-raw11-adapter/compile-parent-repair.py             /tmp/parent-source /tmp/base/tmp/a47-raw11-root52-known             /tmp/parent-out 2>&1 | tee /tmp/checkpoint.log
          grep -E 'checkpoint|accepted 140 repaired complete parent' /tmp/checkpoint.log
          if grep -Eq 'sorryAx|native_decide' /tmp/checkpoint.log; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-140-fine2-checkpoint
          path: |
            /tmp/parent-out
            /tmp/parent-source
            /tmp/generation.log
            /tmp/checkpoint.log
          if-no-files-found: warn
          retention-days: 30
