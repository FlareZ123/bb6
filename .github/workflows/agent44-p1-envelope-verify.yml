name: Agent 44 P1 power envelope verification (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify both generic obstruction theorems and original source GAncestor bridge
        run: |
          lean --version
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent44-power-envelope"
          lean -o im-results/agent44-power-envelope/PowerCertificate.olean im-results/agent44-power-envelope/PowerCertificate.lean
          lean -o im-results/agent44-power-envelope/GOneCertificate.olean im-results/agent44-power-envelope/GOneCertificate.lean
          lean -o im-results/agent1-p1-map/GParity.olean im-results/agent1-p1-map/GParity.lean
          lean -o im-results/agent1-p1-map/GInverse.olean im-results/agent1-p1-map/GInverse.lean
          lean -o im-results/agent44-power-envelope/GOneSource.olean im-results/agent44-power-envelope/GOneSource.lean
          lean -o im-results/agent44-power-envelope/InverseEnumerator.olean im-results/agent44-power-envelope/InverseEnumerator.lean
          lean -o im-results/agent44-power-envelope/FiniteChildren.olean im-results/agent44-power-envelope/FiniteChildren.lean
          for m in PosEvenForm ResetGate; do
            lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean"
          done
          for m in P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do
            lean -o "im-results/agent50-p1-residue/$m.olean" "im-results/agent50-p1-residue/$m.lean"
          done
          lean -o im-results/agent4-p1-cone2398/ConeKernel.olean im-results/agent4-p1-cone2398/ConeKernel.lean
          lean -o im-results/agent44-power-envelope/ConeReflect.olean im-results/agent44-power-envelope/ConeReflect.lean
          lean -o im-results/agent44-power-envelope/NatAffineWrappers.olean im-results/agent44-power-envelope/NatAffineWrappers.lean
          python im-results/agent44-power-envelope/generate_case130.py
          lean im-results/agent44-power-envelope/P1Case130.lean
          python im-results/agent44-power-envelope/generate_case130.py 94
          lean im-results/agent44-power-envelope/P1Case94.lean
          for residue in 302 254 478 654 430 638; do
            python im-results/agent44-power-envelope/generate_case130.py "$residue"
            lean "im-results/agent44-power-envelope/P1Case${residue}.lean"
          done
      - name: Verify directed-drift cover leaf against original Frontier semantics
        run: |
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure"
          lean -o im-results/agent8-coverage-contract/Frontier.olean im-results/agent8-coverage-contract/Frontier.lean
          lean -o im-results/agent44-drift-closure/DirectedDrift.olean im-results/agent44-drift-closure/DirectedDrift.lean
          lean -o im-results/agent44-drift-closure/ZeroWriterOracle.olean im-results/agent44-drift-closure/ZeroWriterOracle.lean
          lean -o im-results/agent8-coverage-contract/RayClosed.olean im-results/agent8-coverage-contract/RayClosed.lean
          lean -o im-results/agent8-coverage-contract/RayChecker.olean im-results/agent8-coverage-contract/RayChecker.lean
          lean -o im-results/agent8-coverage-contract/RayOracle.olean im-results/agent8-coverage-contract/RayOracle.lean
          lean im-results/agent44-drift-closure/UnifiedNonhaltingOracle.lean
          lean -o im-results/agent44-drift-closure/PrefixDrift.olean im-results/agent44-drift-closure/PrefixDrift.lean
          lean im-results/agent44-drift-closure/TransientExample.lean
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure"
          lean -o im-results/agent8-coverage-contract/OneHalt.olean im-results/agent8-coverage-contract/OneHalt.lean
          lean -o im-results/agent8-coverage-contract/LeafRules.olean im-results/agent8-coverage-contract/LeafRules.lean
          lean im-results/agent44-drift-closure/BounceCycle.lean
          python im-results/agent44-drift-closure/census.py
          python im-results/agent44-drift-closure/holdout_overlap.py
      - name: Reproduce both full 5,264-cone coefficient censuses
        run: |
          python im-results/agent44-power-envelope/envelope_audit.py
          python im-results/agent44-power-envelope/shifted_audit.py
