name: Agent 44 phase-50 six-class Lean arithmetic certificate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-phase50-six-class-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out requested branch
        uses: actions/checkout@v4

      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile Lean certificate and run exact BigInt checks
        working-directory: im-results/agent44-746-rank
        run: |
          set -eu
          lean --version
          lean -o Phase50SixClassArithmetic.olean Phase50SixClassArithmetic.lean
          node phase50-six-classes-certificate.mjs
