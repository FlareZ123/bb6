name: Agent44 recover q0-148 complete parent Cover

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1,3,8,9,12,19,22,24,33,38,44,45]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a91540d12d451fc7fc3a14dfc52e8ed2df0de04d

      - name: Download immutable q0-148 source/core
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 46117423502
          name: raw11-q0-sharded-core-148
          path: /tmp/q0148-core

      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Kernel-check one missing source shard serially
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          test -s /tmp/q0148-core/coarse-generated/manifest.json
          mapfile -t MODS < "/tmp/q0148-core/coarse-generated/shard-$SHARD.txt"
          test "${#MODS[@]}" -gt 0
          mkdir -p /tmp/q0148-shard
          ROOTS=()
          for mod in "${MODS[@]}"; do
            ROOTS+=("/tmp/q0148-core/coarse-generated/$mod.lean")
          done
          python tools/lean_compile_closure.py "${ROOTS[@]}"             --source-root /tmp/q0148-core/coarse-generated             --workdir /tmp/q0148-shard             --manifest /tmp/q0148-shard/manifest.json             --jobs 1 --lean lean             --precompiled-manifest /tmp/q0148-core/coarse-core/manifest.json             --precompiled-dir /tmp/q0148-core/coarse-core             --label "q0-148 recovery shard $SHARD"             2>&1 | tee /tmp/q0148-shard/check.log
          if grep -Eq 'sorryAx|native_decide' /tmp/q0148-shard/check.log; then exit 1; fi
          python im-results/agent5-weighted-tnf-queue/shard-coarse-proof.py             thin /tmp/q0148-core/coarse-core /tmp/q0148-shard

      - uses: actions/upload-artifact@v4
        with:
          name: agent44-q0148-recovered-part-${{ matrix.shard }}
          path: /tmp/q0148-shard/
          if-no-files-found: error
          retention-days: 30

  join:
    needs: retry
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a91540d12d451fc7fc3a14dfc52e8ed2df0de04d

      - name: Download immutable q0-148 source/core
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 46117423502
          name: raw11-q0-sharded-core-148
          path: /tmp/q0148-core

      - name: Download 35 accepted original shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 46117423502
          pattern: raw11-q0-sharded-part-148-*
          path: /tmp/q0148-parts/original

      - name: Download 13 recovered shards
        uses: actions/download-artifact@v4
        with:
          pattern: agent44-q0148-recovered-part-*
          path: /tmp/q0148-parts/recovered

      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Merge 48 immutable shard object sets and check actual parent Cover
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          mapfile -t PARTS < <(find /tmp/q0148-parts -mindepth 1 -maxdepth 1 -type d -print | sort)
          # download-artifact may retain artifact subdirectories one level deeper.
          if [ "${#PARTS[@]}" -ne 48 ]; then
            mapfile -t PARTS < <(find /tmp/q0148-parts -mindepth 2 -maxdepth 2 -type d -name '*part*' -print | sort)
          fi
          echo "part_directories=${#PARTS[@]}"
          test "${#PARTS[@]}" -eq 48
          python im-results/agent5-weighted-tnf-queue/shard-coarse-proof.py             merge /tmp/q0148-core/coarse-core /tmp/q0148-union "${PARTS[@]}"

          THEOREM="$(python -c 'import json;print(json.load(open("/tmp/q0148-core/coarse-generated/manifest.json"))["theorem"])')"
          TABLE="$(python -c 'import json;print(json.load(open("/tmp/q0148-core/coarse-generated/manifest.json"))["table"])')"
          BOUND="$(python -c 'import json;print(json.load(open("/tmp/q0148-core/coarse-generated/manifest.json"))["bound"])')"
          test "$BOUND" = 6164

          python tools/lean_compile_closure.py             /tmp/q0148-core/coarse-generated/Agent5Q0Coarse148.lean             --source-root /tmp/q0148-core/coarse-generated             --workdir /tmp/q0148-certified             --manifest /tmp/q0148-certified/manifest.json             --jobs 1 --lean lean             --precompiled-manifest /tmp/q0148-union/manifest.json             --precompiled-dir /tmp/q0148-union             --label "Raw11 q0-148 recovered complete parent"             --theorem "$THEOREM" --parent-table "$TABLE" --weighted-bound "$BOUND"             --provenance-input /tmp/q0148-core/coarse-generated/manifest.json             --provenance-input im-results/agent5-weighted-tnf-queue/generate-coarse-parent-shards.cjs             --provenance-input im-results/agent5-weighted-tnf-queue/shard-coarse-proof.py             2>&1 | tee /tmp/q0148-cover.log

          if grep -Eq 'sorryAx|native_decide' /tmp/q0148-cover.log; then exit 1; fi
          grep -F "$THEOREM' depends on axioms:" /tmp/q0148-cover.log
          lean --version > /tmp/q0148-certified/toolchain.txt
          sha256sum /tmp/q0148-core/coarse-generated/Agent5Q0Coarse148.lean             > /tmp/q0148-certified/source-sha256.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent44-q0148-complete-parent-cover-B6164
          path: |
            /tmp/q0148-certified/
            /tmp/q0148-cover.log
            /tmp/q0148-core/coarse-generated/Agent5Q0Coarse148.lean
            /tmp/q0148-core/coarse-generated/manifest.json
          if-no-files-found: warn
          retention-days: 30
