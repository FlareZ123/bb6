name: Agent44 resumable Raw11 parent checkpoint

on:
  workflow_dispatch:
    inputs:
      parent_id:
        description: Raw11 extra parent id
        required: true
        type: choice
        options: ['132','140']
      source_run:
        description: Run containing parent-source-<id>-repaired (bootstrap only)
        required: false
        type: string
      prior_run:
        description: Prior checkpoint run id (leave empty for bootstrap)
        required: false
        type: string
      prior_artifact:
        description: Prior checkpoint artifact name override
        required: false
        default: ''
        type: string
      max_fresh:
        description: Maximum fresh Lean modules to compile this run
        required: true
        default: '8'
        type: string
      target_module:
        description: Optional exact module to compile with only its dependency closure
        required: false
        type: string
      row_split_extra132:
        description: Bootstrap Extra132 by replacing the frozen giant FAR leaf with row-split modules
        required: true
        default: false
        type: boolean
      split_extra140_aggregate:
        description: Split the resource-heavy Extra140 root_6_root_9_root_20 automata leaves into independent kernel modules
        required: true
        default: false
        type: boolean
      split_extra132_rows:
        description: Optional space-separated Extra132 ROW:DEPTH trie splits, for example 01:3 or 01:3 02:4
        required: false
        default: ''
        type: string
      packed_extra132:
        description: Replace the frozen Extra132 giant FAR leaf by the exact bit-packed split checker
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 45906697676
          name: raw11-root52-known-consumption
          path: /tmp/base

      - name: Download bootstrap source
        if: inputs.prior_run == ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: ${{ inputs.source_run }}
          name: parent-source-${{ inputs.parent_id }}-repaired
          path: /tmp/bootstrap-source

      - name: Download prior checkpoint
        if: inputs.prior_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: ${{ inputs.prior_run }}
          name: ${{ inputs.prior_artifact != '' && inputs.prior_artifact || format('raw11-{0}-checkpoint', inputs.parent_id) }}
          path: /tmp/checkpoint

      - name: Recover source and accepted object state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_ID: ${{ inputs.parent_id }}
          PRIOR_RUN: ${{ inputs.prior_run }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/parent-source /tmp/parent-out
          if [ -z "$PRIOR_RUN" ]; then
            cp -a /tmp/bootstrap-source/. /tmp/parent-source/
            case "$PARENT_ID" in
              132)
                pairs='1:15167752700 2:15167528142 3:15167803036 4:15167811958 5:15168810518 6:15167956708 7:15167922399'
                ;;
              140)
                pairs='1:15249375242 2:15248303641 3:15249526182 4:15249696079 5:15249002463 6:15248789926 7:15248848323'
                ;;
              *) exit 2 ;;
            esac
            for pair in $pairs; do
              group="${pair%%:*}"
              id="${pair#*:}"
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN"                 -H "Accept: application/vnd.github+json"                 "https://api.github.com/repos/FlareZ123/bb6/actions/artifacts/$id/zip"                 -o "/tmp/leaf-$id.zip"
              unzip -o -q "/tmp/leaf-$id.zip" -d /tmp/parent-out
              test -s "/tmp/parent-out/receipt-$group.json"
            done
          else
            src="$(find /tmp/checkpoint -type f -name "Agent5Raw11Extra${PARENT_ID}.lean" -print -quit)"
            receipt="$(find /tmp/checkpoint -type f -name repair-receipt.json -print -quit)"
            test -n "$src"
            test -n "$receipt"
            cp -a "$(dirname "$src")/." /tmp/parent-source/
            cp -a "$(dirname "$receipt")/." /tmp/parent-out/
          fi
          test -s "/tmp/parent-source/Agent5Raw11Extra${PARENT_ID}.lean"
          echo "source_modules=$(find /tmp/parent-source -name '*.lean' | wc -l)"
          echo "checkpoint_objects=$(find /tmp/parent-out -name '*.olean' | wc -l)"

      - name: Repair legacy Extra132 row-split data elaboration
        if: inputs.parent_id == '132'
        run: |
          set -euo pipefail
          data=/tmp/parent-source/Agent44Extra132GiantData.lean
          if [ -s "$data" ]; then
            python im-results/agent44-raw11-extra28/repair_two_sided_data.py "$data"
          fi

      - name: Chunk selected Extra132 automata rows
        if: inputs.parent_id == '132' && inputs.split_extra132_rows != ''
        env:
          ROW_SPECS: ${{ inputs.split_extra132_rows }}
        run: |
          set -euo pipefail
          for spec in $ROW_SPECS; do
            row="${spec%%:*}"
            depth="${spec#*:}"
            test "$row" != "$depth"
            test -s "/tmp/parent-source/Agent44Extra132GiantRowData${row}.lean"
            python im-results/agent44-raw11-extra28/split_trie_row.py \
              "/tmp/parent-source/Agent44Extra132GiantRowData${row}.lean" "$depth" \
              | tee "/tmp/extra132-row${row}-trie-split.log"
            rm -f \
              "/tmp/parent-out/Agent44Extra132GiantRowData${row}.olean" \
              "/tmp/parent-out/Agent44Extra132GiantRowCheck${row}.olean" \
              /tmp/parent-out/Agent44Extra132GiantData.olean \
              /tmp/parent-out/Agent44Extra132GiantProof.olean
          done

      - name: Row-split the frozen Extra132 giant FAR leaf
        if: inputs.row_split_extra132 && inputs.parent_id == '132' && inputs.prior_run == ''
        run: |
          set -euo pipefail
          python im-results/agent44-raw11-extra28/split_two_sided_leaf.py             /tmp/parent-source/Agent5Raw11Extra132Sub_root_12_root_19_root_21.lean             '1RB1RD1RC1RE0LA0LD1LA1LC0RF---0RC0RE'
          test -s /tmp/parent-source/Agent44Extra132GiantProof.lean
          test -s /tmp/parent-source/TwoSidedAutomataRows.lean
          echo "row_split_modules=$(find /tmp/parent-source -name '*.lean' | wc -l)"

      - name: Repack the exact Extra132 giant FAR leaf
        if: inputs.parent_id == '132' && inputs.packed_extra132
        run: |
          set -euo pipefail
          cp im-results/agent13-raw10-box17/BitPackedStack.lean /tmp/parent-source/BitPackedStack.lean
          cp im-results/agent44-raw11-extra28/BitPackedSplit.lean /tmp/parent-source/BitPackedSplit.lean
          python im-results/agent44-raw11-extra28/repack_extra132.py \
            /tmp/parent-source /tmp/parent-source | tee /tmp/extra132-packed.log
          grep -F 'rows [9510, 811, 1696, 11030, 1834, 13603, 11465, 12024, 9152, 0, 5153, 7161]' \
            /tmp/extra132-packed.log
          test -s /tmp/parent-source/Extra132PackedSplitProof.lean
          test -s /tmp/parent-source/BitPackedSplit.lean
          rm -f \
            /tmp/parent-out/Agent5Raw11Extra132Sub_root_12_root_19_root_21.olean \
            /tmp/parent-out/Agent5Raw11Extra132Sub_root_12_root_19.olean \
            /tmp/parent-out/Agent5Raw11Extra132Sub_root_12.olean \
            /tmp/parent-out/Agent5Raw11Extra132Kid12.olean \
            /tmp/parent-out/Agent5Raw11Extra132.olean
          echo "packed_source_modules=$(find /tmp/parent-source -name '*.lean' | wc -l)"

      - name: Split the resource-heavy Extra140 aggregate
        if: inputs.split_extra140_aggregate && inputs.parent_id == '140'
        run: |
          set -euo pipefail
          target=/tmp/parent-source/Agent5Raw11Extra140Sub_root_6_root_9_root_20.lean
          test -s "$target"
          python im-results/agent44-raw11-extra28/split_phase_automata_leaves.py "$target" | tee /tmp/extra140-aggregate-split.log
          test "$(find /tmp/parent-source -maxdepth 1 -name 'Agent44SplitAgent5Raw11Extra140Sub_root_6_root_9_root_20Leaf*.lean' | wc -l)" -eq 12
          test "$(wc -c < "$target")" -lt 25000

          # Leaf03 is itself a 409 KB TwoSidedAutomata certificate.  Give its
          # twelve exact state/symbol rows independent kernel obligations.
          leaf=/tmp/parent-source/Agent44SplitAgent5Raw11Extra140Sub_root_6_root_9_root_20Leaf03.lean
          TWOSIDED_SPLIT_MIN_CERT_BYTES=300000 \
          TWOSIDED_SPLIT_PREFIX=Agent44Extra140Root6Root9Root20Leaf03Rows \
          TWOSIDED_SPLIT_NAMESPACE=BB6.Agent44Extra140Root6Root9Root20Leaf03Rows \
            python im-results/agent44-raw11-extra28/split_two_sided_leaf.py \
              "$leaf" '1RB1RD_1RC0LE_0LA0RC_1LA1LD_0LF1LB_0LB---' \
              | tee /tmp/extra140-leaf03-row-split.log
          test -s /tmp/parent-source/Agent44Extra140Root6Root9Root20Leaf03RowsProof.lean
          test "$(wc -c < "$leaf")" -lt 25000

          # The two largest state rows still approach the local 3.6 GB kernel
          # ceiling as single decide terms. Split their exact tries at depth 3.
          for row in 05 07; do
            python im-results/agent44-raw11-extra28/split_trie_row.py \
              "/tmp/parent-source/Agent44Extra140Root6Root9Root20Leaf03RowsRowData${row}.lean" 3 \
              | tee "/tmp/extra140-leaf03-row${row}-trie-split.log"
            test -s "/tmp/parent-source/Agent44Extra140Root6Root9Root20Leaf03RowsRowCheck${row}.lean"
          done

      - name: Advance exact kernel DAG by bounded fresh modules
        id: advance
        env:
          RAW11_REPAIR_ID: ${{ inputs.parent_id }}
          RAW11_REPAIR_MAX_FRESH: ${{ inputs.max_fresh }}
          RAW11_REPAIR_MODULE_TIMEOUT: '240'
          RAW11_REPAIR_TARGET: ${{ inputs.target_module }}
        run: |
          set -euo pipefail
          python im-results/agent47-raw11-adapter/compile-parent-repair.py             /tmp/parent-source /tmp/base/tmp/a47-raw11-root52-known             /tmp/parent-out 2>&1 | tee /tmp/checkpoint.log
          if [ -f "/tmp/parent-out/Agent5Raw11Extra${RAW11_REPAIR_ID}.olean" ]; then
            grep -F "'BB6.Agent5Raw11Extra${RAW11_REPAIR_ID}.cover' depends on axioms:" /tmp/checkpoint.log
            echo complete > /tmp/parent-out/status.txt
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            grep -F 'checkpoint' /tmp/checkpoint.log
            echo partial > /tmp/parent-out/status.txt
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq 'sorryAx|native_decide' /tmp/checkpoint.log; then exit 1; fi
          {
            echo "parent_id=${RAW11_REPAIR_ID}"
            echo "source_run=${{ inputs.source_run }}"
            echo "prior_run=${{ inputs.prior_run }}"
            echo "prior_artifact=${{ inputs.prior_artifact }}"
            echo "max_fresh=${RAW11_REPAIR_MAX_FRESH}"
            echo "target_module=${RAW11_REPAIR_TARGET}"
            echo "split_extra140_aggregate=${{ inputs.split_extra140_aggregate }}"
            echo "split_extra132_rows=${{ inputs.split_extra132_rows }}"
            echo "packed_extra132=${{ inputs.packed_extra132 }}"
            echo "head_sha=${GITHUB_SHA}"
            echo "lean_version=$(lean --version)"
          } > /tmp/parent-out/checkpoint-provenance.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-${{ inputs.parent_id }}-checkpoint
          path: |
            /tmp/parent-out
            /tmp/parent-source
            /tmp/checkpoint.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish legacy complete-parent bundle for exact successor consumers
        if: steps.advance.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: parent-complete-${{ inputs.parent_id }}-repaired
          path: |
            /tmp/parent-out
            /tmp/parent-source
            /tmp/checkpoint.log
          if-no-files-found: error
          retention-days: 30
