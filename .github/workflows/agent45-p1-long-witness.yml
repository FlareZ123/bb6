name: Agent45 P1 long-block witness certificates
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit
        type: string
        required: false
      target:
        type: choice
        options: [core, numeric]
        default: core
      n:
        description: Even index for numerical certificate
        type: string
        default: "124834"
      h:
        description: Midpoint prefix length
        type: string
        default: "62417"
      stages:
        description: Maximum prefix stages
        type: string
        default: "4"
      initial:
        description: Number of packed initial reverse transitions
        type: string
        default: "512"
      chunk:
        description: Packed kernel equality size
        type: string
        default: "256"
      long:
        description: Long witness block length
        type: string
        default: "8192"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install Lean
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 5 -sSfL https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sed -i 's/curl -sSfL/curl --retry 5 --retry-all-errors --retry-delay 5 -sSfL/g' /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile source bridge and audit axioms
        run: |
          set -euo pipefail
          D="im-results/agent45-p1-delayed-carry"
          export LEAN_PATH="$D:im-results/agent23-p1-residue-period:im-results/agent9-p1-reverse-block:im-results/agent43-p1-high-cost-reset-count:im-results/agent9-p1-first-return:im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-dyadic-width:im-results/agent50-p1-residue:im-results/agent28-p1-modular-screen:im-results/agent28-p1-delayed-carry"
          lean --version
          git rev-parse HEAD
          python tools/lean_compile_deps.py "$D/PackedJump.lean" | tee /tmp/long-core.log
          python tools/lean_compile_deps.py "im-results/agent43-p1-high-cost-reset-count/LongConeSource.lean" | tee -a /tmp/long-core.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/long-core.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/long-core.log').read_text()
          profiles = {
              "BB6.Agent45ReverseBlock": ("all_weight_corr","word_value_gap","witness_word_sound","rows_cover"),
              "BB6.Agent45PackedJump": ("rotate_sound","packedNeg_sound","packedLift_sound","packedReduced_sound","live_bits_jump"),
              "BB6.Agent45LongBlock": ("digits_targetWord","rewindTarget_sound","live_bits_extend","live_bits_to_list","live_list_extend","extend_word_eq","midpoint_rows_recovered","covered_next_rows","covered_empty_rows"),
          }
          for ns, names in profiles.items():
              for name in names:
                  decl = f"'{ns}.{name}'"
                  if decl + " does not depend on any axioms" in log:
                      print(name, [])
                      continue
                  m = re.search(re.escape(decl) + r" depends on axioms:\s*\[([^\]]*)\]", log)
                  assert m, decl
                  axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
                  assert axioms <= {"propext","Classical.choice","Quot.sound"}, (decl,axioms)
                  print(name, sorted(axioms))
          PY
      - name: Generate and check numerical witness
        if: inputs.target == 'numeric'
        env:
          N: ${{ inputs.n }}
          H: ${{ inputs.h }}
          STAGES: ${{ inputs.stages }}
          INITIAL: ${{ inputs.initial }}
          CHUNK: ${{ inputs.chunk }}
          LONG: ${{ inputs.long }}
        run: |
          set -euo pipefail
          D="im-results/agent45-p1-delayed-carry"
          G="$PWD/.long-witness"
          export LEAN_PATH="$G:$D:im-results/agent23-p1-residue-period:im-results/agent9-p1-reverse-block:im-results/agent43-p1-high-cost-reset-count:im-results/agent9-p1-first-return:im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-dyadic-width:im-results/agent50-p1-residue:im-results/agent28-p1-modular-screen:im-results/agent28-p1-delayed-carry"
          python "$D/gen_long_witness.py" "$G" --n "$N" --h "$H" --stages "$STAGES" --initial "$INITIAL" --chunk "$CHUNK" --long "$LONG"
          while IFS= read -r module; do
            echo "CHECK $module"
            /usr/bin/time -f 'elapsed=%e rss_kb=%M' lean -o "$G/$module.olean" "$G/$module.lean"
          done < "$G/modules.txt" 2>&1 | tee /tmp/long-numeric.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/long-numeric.log; then exit 1; fi
          grep -F "P1_LONG_CERTIFIED" /tmp/long-numeric.log
      - uses: actions/upload-artifact@v4
        if: always() && inputs.target == 'numeric'
        with:
          name: long-witness-${{ inputs.n }}
          path: |
            .long-witness/*.lean
            .long-witness/modules.txt
            /tmp/long-core.log
            /tmp/long-numeric.log
          include-hidden-files: true
          retention-days: 7
