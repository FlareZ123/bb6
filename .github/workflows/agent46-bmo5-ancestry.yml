name: Agent 46 BMO5 shared ancestry (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Verification target
        type: choice
        options: [source, sieve, macro, counted]
        default: source
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install local proof toolchain
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reclaim disk for Mathlib cache
        if: inputs.target == 'source' || inputs.target == 'macro'
        run: sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
      - name: Checkout pinned original modules
        if: inputs.target == 'source' || inputs.target == 'macro'
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
          printf '%s\n' leanprover/lean4:v4.36.0-rc2 > lean-toolchain
          sed -i 's/v4.35.0-rc4/v4.36.0-rc2/g' lakefile.toml
          rm -f lake-manifest.json
          lake update
          lake exe cache get
      - name: Compile all three original machine modules
        if: inputs.target == 'source' || inputs.target == 'macro'
        working-directory: /tmp/cryptids
        run: |
          lake build \
            BusyBeaver.BB6.M_1RB1RE_1LC0RA_1RD0LB_1LB1RC_1LF0RD_HHH0LE \
            BusyBeaver.BB6.M_1RB0LD_1LC0RA_1RA1LB_1LA1LE_1RF0LC_HHH0RE \
            BusyBeaver.BB6.M_1RB1LC_1RC0LD_1LA0RB_1LB1LE_1RF0LA_HHH0RE
      - name: Prove shared rooted reduction with actual source
        if: inputs.target == 'source' || inputs.target == 'macro'
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          for m in Cap CapInverse CapRoot CapMulti CapSource; do
            cp "$GITHUB_WORKSPACE/im-results/agent46-bmo5-421-inverse/$m.lean" "$m.lean"
          done
          for m in Cap CapInverse CapRoot CapMulti; do
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean"
          done
          lake env lean -o ".lake/build/lib/lean/CapSource.olean" CapSource.lean 2>&1 | tee "$RUNNER_TEMP/cap-source.log"
          if grep -Eq 'sorryAx|native_decide' "$RUNNER_TEMP/cap-source.log"; then
            exit 1
          fi
      - name: Compile exact forward macro against source closure
        if: inputs.target == 'macro'
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          for m in CapSieveCore CapSieveLift CapSieveGraph CapSieveClasses CapSieveSource CapBandInverse CapBandRun CapBmo CapBmoSource CapPositiveMacroCore CapForwardMacro CapForwardMacroReach CapForwardMacroSource CapPositiveGate CapNegativeExitCore CapNegativeExit CapSignedMacro CapTerminalSpacing CapSignedRoots CapSignedMacroSource CapCanonicalEntry CapTerminalInverse CapRayParent CapResetInverse CapCanonicalParent CapCanonicalReach CapAnchorTerminal CapAnchorRoots CapAnchorSource CapTerminalBand CapModLift CapModNoGo CapTerminalBandSource; do
            cp "$GITHUB_WORKSPACE/im-results/agent46-bmo5-421-inverse/$m.lean" "$m.lean"
            lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean" 2>&1 | tee -a "$RUNNER_TEMP/cap-macro.log"
          done
          if grep -Eq 'sorryAx|native_decide' "$RUNNER_TEMP/cap-macro.log"; then
            exit 1
          fi
      - name: Compile symbolic sieve and exact root bridge
        if: inputs.target == 'sieve'
        working-directory: im-results/agent46-bmo5-421-inverse
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD"
          for m in Cap CapInverse CapRoot CapMulti CapSieveCore CapSieveLift CapSieveGraph CapSieveClasses CapSieveCount CapSieveSource CapBandInverse CapBandRun CapBandBoundary CapBmo CapBmoSource CapNegativePhase CapStrip CapStripSource CapUpRun CapNestedLift CapPhase CapPhaseSource CapPhaseCost CapPhaseCostSource CapPositiveMacroCore CapForwardMacro CapForwardMacroReach CapPositiveGate CapPhaseCostGate CapNegativeExitCore CapNegativeExit CapSignedMacro CapTerminalSpacing CapSignedRoots CapCanonicalEntry CapTerminalInverse CapRayParent CapResetInverse CapCanonicalParent CapCanonicalReach CapAnchorTerminal CapAnchorRoots CapTerminalBand CapModLift CapModNoGo; do
            lean -o "$m.olean" "$m.lean" 2>&1 | tee -a "$RUNNER_TEMP/cap-sieve.log"
          done
          if grep -Eq 'sorryAx|native_decide' "$RUNNER_TEMP/cap-sieve.log"; then
            exit 1
          fi

      - name: Compile exact counted holdout and coverage transport
        if: inputs.target == 'counted'
        working-directory: im-results/agent46-bmo5-421-inverse
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="$PWD"
          lean -o Frontier.olean "$GITHUB_WORKSPACE/im-results/agent8-coverage-contract/Frontier.lean" 2>&1 | tee "$RUNNER_TEMP/counted421.log"
          for m in Cap CapInverse CapRoot Counted421 Counted421Bridge Counted421Score Counted421ClosedCost Counted421BandBound Counted421Coverage; do
            lean -o "$m.olean" "$m.lean" 2>&1 | tee -a "$RUNNER_TEMP/counted421.log"
          done
          if grep -Eq 'sorryAx|native_decide' "$RUNNER_TEMP/counted421.log"; then
            exit 1
          fi
