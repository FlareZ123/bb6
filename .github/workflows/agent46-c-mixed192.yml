name: Agent 46 Machine C mixed192 first-family m38 and m58 theorems (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check unmodified CLine source and all-natural reverse theorems
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a46-c38-source
          cp im-results/agent11-c-line/CLine.lean /tmp/a46-c38-source/
          cp im-results/agent46-c-mixed192/{C38V2,C38Arithmetic,C58,C58Arithmetic}.lean /tmp/a46-c38-source/
          cd /tmp/a46-c38-source
          export LEAN_PATH=.
          lean --version
          sha256sum CLine.lean C38V2.lean C38Arithmetic.lean C58.lean C58Arithmetic.lean
          lean -o CLine.olean CLine.lean
          lean -o C38V2.olean C38V2.lean
          lean C38Arithmetic.lean
          lean -o C58.olean C58.lean
          lean C58Arithmetic.lean
