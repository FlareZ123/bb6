name: Agent 46 Machine C mixed384 first-stopping m3 source proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unchanged original accelerator source and proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/a46-c384
          cp im-results/agent11-c-line/CLine.lean /tmp/a46-c384/
          cp im-results/agent46-c-mixed384/{C3,C3Arithmetic}.lean /tmp/a46-c384/
          cd /tmp/a46-c384
          export LEAN_PATH=.
          lean --version
          sha256sum CLine.lean C3.lean C3Arithmetic.lean
          lean -o CLine.olean CLine.lean
          lean -o C3.olean C3.lean
          lean C3Arithmetic.lean
