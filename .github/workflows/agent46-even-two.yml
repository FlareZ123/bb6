name: Agent 46 Machine C even-right sum-two exact inverse (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify exact unmodified Machine C source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent46-even-two
          cp im-results/agent11-c-line/CLine.lean /tmp/agent46-even-two/
          cp im-results/agent8-c-total-section/GenericSection.lean /tmp/agent46-even-two/
          cp im-results/agent46-c-jump/{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef}.lean /tmp/agent46-even-two/
          cp im-results/agent3-c-odd-image/Agent3CImage.lean /tmp/agent46-even-two/
          cp im-results/agent46-c-even-two/EvenTwo.lean /tmp/agent46-even-two/
          cd /tmp/agent46-even-two
          export LEAN_PATH=.
          lean --version
          sha256sum FastSectionDef.lean Agent3CImage.lean EvenTwo.lean
          for f in CLine GenericSection JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef Agent3CImage; do
            lean -o "$f.olean" "$f.lean"
          done
          lean EvenTwo.lean
