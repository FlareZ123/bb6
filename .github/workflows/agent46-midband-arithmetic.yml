name: Agent46 cancellation midband arithmetic core (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile the arithmetic certificate and geometric bound
        run: |
          set -euo pipefail
          lean --version
          work="$RUNNER_TEMP/midband"
          mkdir -p "$work"
          cp im-results/agent20-needle-coprime/CancellationTopStrip.lean "$work/"
          cp im-results/agent46-needle-midstrip/CancellationMidBandCoarse.lean "$work/"
          cd "$work"
          export LEAN_PATH=.
          lean -o CancellationTopStrip.olean CancellationTopStrip.lean
          lean -o CancellationMidBandCoarse.olean CancellationMidBandCoarse.lean
