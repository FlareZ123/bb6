name: Agent46 Space Needle valuation-three source theorem (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch original Cryptids source
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          git -C /tmp/cryptids checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git -C /tmp/cryptids rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Build Cryptids upstream
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB1LA_1LC0RE_1LF1LD_0RB0LA_1RC1RE_HHH0LD
      - name: Verify original-source theorem and axioms
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/SpaceNeedleClosed.lean" .
          lake env lean -o .lake/build/lib/lean/SpaceNeedleClosed.olean SpaceNeedleClosed.lean
          base="$GITHUB_WORKSPACE/im-results/agent20-needle-coprime"
          for f in CancellationTopStrip CancellationTopConstructive CancellationTerminalConstructive; do
            cp "$base/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent47-needle-cancellation-parent4/NeedleCancelMod35.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleCancelMod35.olean NeedleCancelMod35.lean
          cp "$GITHUB_WORKSPACE/im-results/agent47-needle-cancellation-parent4/NeedleCancellationFour.lean" .
          lake env lean -o .lake/build/lib/lean/NeedleCancellationFour.olean NeedleCancellationFour.lean
          base="$GITHUB_WORKSPACE/im-results/agent46-needle-three"
          cp "$base/CancellationThreeArithmetic.lean" .
          lake env lean -o .lake/build/lib/lean/CancellationThreeArithmetic.olean CancellationThreeArithmetic.lean
          cp "$base/CancellationThreeSource.lean" .
          lake env lean -o .lake/build/lib/lean/CancellationThreeSource.olean CancellationThreeSource.lean
          cp "$base/CancellationFiveSubfamily.lean" .
          lake env lean -o .lake/build/lib/lean/CancellationFiveSubfamily.olean CancellationFiveSubfamily.lean
          cp "$base/CancellationFiveSource.lean" .
          lake env lean -o .lake/build/lib/lean/CancellationFiveSource.olean CancellationFiveSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent47-needle-cancellation-parent4/CancellationSixArithmetic.lean" .
          lake env lean -o .lake/build/lib/lean/CancellationSixArithmetic.olean CancellationSixArithmetic.lean
          cp "$GITHUB_WORKSPACE/im-results/agent47-needle-cancellation-parent4/CancellationSixSource.lean" .
          lake env lean CancellationSixSource.lean
