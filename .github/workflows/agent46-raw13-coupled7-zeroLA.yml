name: Agent 46 Raw13 seven-hole 0LA audit
run-name: Agent 46 Raw13 coupled7 0LA
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit
        type: string
        required: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Kernel-check seven-hole cycle closure
        run: |
          set -euo pipefail
          D=im-results/agent46-raw13-cut
          python tools/lean_compile_closure.py --workdir /tmp/a46-c7-0la --jobs 4 \
            "$D/Raw13Coupled7ZeroLA.lean" | tee /tmp/a46-c7-0la.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a46-c7-0la.log; then exit 1; fi
          grep -F "BB6.Agent46Raw13Coupled7ZeroLA.bound" /tmp/a46-c7-0la.log
      - uses: actions/upload-artifact@v4
        with:
          name: raw13-coupled7-zeroLA-certified
          path: /tmp/a46-c7-0la
          retention-days: 30
