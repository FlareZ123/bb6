      - name: Publish completed candidate siblings
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(/tmp/coupled5-candidates/coupled5-*.json)
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          git config user.name "Agent 46"
          git config user.email "agent46@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          for src in "${files[@]}"; do
            dst="im-results/agent46-raw13-cut/$(basename "$src")"
