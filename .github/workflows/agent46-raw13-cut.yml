          name: raw13-closure-certified
          path: /tmp/a46-c5-45949466160
      - name: Download accepted proof closure 45950004102
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45950004102
          name: raw13-closure-certified
          path: /tmp/a46-c5-45950004102
      - name: Compose independently accepted bounds without rerunning searches
        run: |
          set -euo pipefail
          mkdir -p /tmp/a46-c5-parent
          # The accepted closures include their exact compiled Lean source files.
          # Shared source modules must match before any compiled object is reused.
          python - <<'PY'
          from pathlib import Path
          import shutil
          out=Path('/tmp/a46-c5-parent')
          for src in sorted(Path('/tmp').glob('a46-c5-[0-9]*')):
              for f in sorted(src.rglob('*.lean')):
                  rel=f.relative_to(src)
                  if rel.name=='Raw13Coupled5SiblingBundle.lean': continue
                  dst=out/rel
                  obj=f.with_suffix('.olean')
                  assert obj.is_file(), f
                  if dst.exists():
                      assert dst.read_bytes()==f.read_bytes(), rel
                      continue
                  dst.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copy2(f,dst)
                  shutil.copy2(obj,dst.with_suffix('.olean'))
          PY
          cp im-results/agent46-raw13-cut/Raw13Coupled5.lean /tmp/a46-c5-parent/
          cd /tmp/a46-c5-parent
          LEAN_PATH="$PWD" lean -o Raw13Coupled5.olean Raw13Coupled5.lean | tee /tmp/a46-c5-parent.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a46-c5-parent.log; then exit 1; fi
      - name: Preserve composed proof closure
        uses: actions/upload-artifact@v4
        with:
          name: raw13-coupled5-composed
          path: |
            /tmp/a46-c5-parent
            /tmp/a46-c5-parent.log

