name: Agent 46 canonical raw13 source cut
run-name: Agent 46 raw13 ${{ inputs.target }} ${{ inputs.branches }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: Proof target
        type: choice
        options: [core, cut, corridor, ingest, ingest77, d3frontier, phase, pump0RE, late0RE, zeroRE, zeroRC, zeroRD, zeroLC, zeroLB, zeroRA, oneLA, oneRA, zeroRB, oneLC, oneRE, oneRC, zeroRE5, oneLE, oneRD, pump0LE5, zeroLE5, branch540, branch484, branch1420, branchBatch, coupledEntry, coupledLive, coupledParent, coupled3, coupled4Discover, coupled5Discover, coupled5Sibling, coupled5SAT, coupled5Hard, coupled5Parent, coupled6Discover, coupled6Sibling, coupled6Late, coupled6Nested, coupled6Extended, coupled6RDSweep, coupled6RBPattern, coupled6Nested0RB, coupled6Odd0RB, coupled6MirroredCounter, coupled6PhasedCounter, coupled6GrowRadix, coupled6UnaryRecursion, coupledSource, coupled4, coupledNested]
        default: core
      branches:
        description: Space-separated catalogue keys for branchBatch (max 4)
        type: string
        required: false
      source_ref:
        description: Exact source commit (optional)
        type: string
        required: false
permissions:
  actions: read
  contents: write
jobs:
  check:
    if: inputs.target != 'coupled4Discover' && inputs.target != 'coupled5Discover' && inputs.target != 'coupled5SAT' && inputs.target != 'coupledSource' && inputs.target != 'coupled5Parent' && inputs.target != 'coupled6Discover'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download accepted canonical77 artifact for raw13 graft
        if: inputs.target == 'ingest77' || inputs.target == 'd3frontier' || inputs.target == 'phase'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45554648116
          name: canonical77-certified
          path: /tmp/a47-canonical
      - name: Build checked canonical77 dependency manifest
        if: inputs.target == 'ingest77' || inputs.target == 'd3frontier' || inputs.target == 'phase'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 68 72 82
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          # HardRootLeaves depends on the generated raw114 source closure.
          cd im-results/agent47-raw114-cut
          python paired_counter.py
          python long_sweep.py
          printf '%s\n' 0LA 0LB 0LC 0LF 0RA 0RB 0RC 0RF 1LA 1LB 1LC 1LF 1RA 1RB 1RC 1RF | xargs -P 4 -I{} python generate_complete.py {}
          python generate_complete.py --combine
          cd ../..
          mkdir -p .tmp/a46
          cat > .tmp/a46/canonical-generator-arguments.txt <<'EOF'
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 68 72 82
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          EOF
          for required in CanonicalTwoParentGraft.olean CanonicalRaw114Accepted.olean Raw114CompleteData.olean; do
            test -s "/tmp/a47-canonical/$required"
          done
          test "$(git rev-parse HEAD:im-results/agent47-rooted-tnf/CanonicalRaw114Accepted.lean)" = "d198f4eb8d3c2ca4b7ed5a2c57298cb6364537f4"
          python tools/lean_compile_closure.py im-results/agent47-rooted-tnf/CanonicalTwoParentGraft.lean \
            im-results/agent47-raw114-cut/Raw114CompleteData.lean \
            --workdir /tmp/a46-canonical-manifest-work \
            --manifest /tmp/a46-canonical-manifest.json \
            --manifest-only \
            --artifact-dir /tmp/a47-canonical \
            --label canonical77-certified \
            --artifact-name canonical77-certified \
            --jobs 8 \
            --provenance-input im-results/agent47-rooted-tnf/CanonicalTwoParentGraft.lean \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            --provenance-input im-results/agent10-tnf-raw87/generate.py \
            --provenance-input im-results/agent10-tnf-raw91/generate.py \
            --provenance-input im-results/agent10-tnf-multipump/generate.py \
            --provenance-input im-results/agent47-raw114-cut/generate_complete.py \
            --provenance-input im-results/agent47-raw114-cut/paired_counter.py \
            --provenance-input im-results/agent47-raw114-cut/long_sweep.py \
            --provenance-input im-results/agent47-raw114-cut/Raw114CompleteData.lean \
            --provenance-input .tmp/a46/canonical-generator-arguments.txt
      - name: Verify actual dependency closure
        env:
          TARGET: ${{ inputs.target }}
          BRANCHES: ${{ inputs.branches }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          D=im-results/agent46-raw13-cut
          if [ "$TARGET" = coupled5Hard ]; then
            ROOT="$D/Raw13Coupled5Hard1LCrd.lean"
          elif [ "$TARGET" = coupledNested ]; then
            ROOT="$D/Raw13NestedBundle.lean"
          elif [ "$TARGET" = coupled4 ]; then
            python "$D/generate_coupled_entry.py"
            python "$D/emitauto.py" "$D/coupled3-auto.json" "$D/Raw13Coupled3Auto.lean" Raw13Coupled3Auto
            python "$D/generateCoupled4.py"
            ROOT="$D/Raw13Coupled4.lean"
          elif [ "$TARGET" = coupled6UnaryRecursion ]; then
            ROOT="$D/Raw13Coupled6UnaryRecursion.lean"
          elif [ "$TARGET" = coupled6GrowRadix ]; then
            (cd "$D" && python discoverGrowRadix.py)
            ROOT="$D/Raw13Coupled6GrowRadixBundle.lean"
            printf 'import GrowRadix%s\n' 20 38 39 40 41 140 148 > "$ROOT"
          elif [ "$TARGET" = coupled6PhasedCounter ]; then
            ROOT="$D/Raw13Coupled6PhasedCounter.lean"
          elif [ "$TARGET" = coupled6MirroredCounter ]; then
            ROOT="$D/Raw13Coupled6MirroredCounter.lean"
          elif [ "$TARGET" = coupled6Odd0RB ]; then
            ROOT="$D/Raw13Coupled6Odd0RB.lean"
          elif [ "$TARGET" = coupled6Nested0RB ]; then
            ROOT="$D/Raw13Coupled6Nested0RB.lean"
          elif [ "$TARGET" = coupled6RBPattern ]; then
            ROOT="$D/Raw13Coupled6RBPattern.lean"
          elif [ "$TARGET" = coupled6RDSweep ]; then
            ROOT="$D/Raw13Coupled6RDProofs.lean"
          elif [ "$TARGET" = coupled6Extended ]; then
            ROOT="$D/Raw13Coupled6LateCoreBound.lean"
          elif [ "$TARGET" = coupled6Nested ]; then
            ROOT="$D/Raw13Coupled6Nested1LB.lean"
          elif [ "$TARGET" = coupled6Late ]; then
            ROOT="$D/Raw13Coupled6Late1LBBound.lean"
          elif [ "$TARGET" = coupled6Sibling ]; then
            read -ra ids <<< "$BRANCHES"
            test "${#ids[@]}" -ge 1 && test "${#ids[@]}" -le 2
            for id in "${ids[@]}"; do [[ "$id" =~ ^[01][LR][A-F]$ ]]; done
            python "$D/generateCoupled6Sibling.py" "${ids[@]}"
            ROOT="$D/Raw13Coupled6SiblingBundle.lean"
          elif [ "$TARGET" = coupled5Sibling ]; then
            read -ra ids <<< "$BRANCHES"
            test "${#ids[@]}" -ge 1 && test "${#ids[@]}" -le 4
            for id in "${ids[@]}"; do [[ "$id" =~ ^[01][LR][A-F]$ ]]; done
            python "$D/generateCoupled5Sibling.py" "${ids[@]}"
            ROOT="$D/Raw13Coupled5SiblingBundle.lean"
          elif [ "$TARGET" = coupled3 ]; then
            python "$D/generate_coupled_entry.py"
            python "$D/emitauto.py" "$D/coupled3-auto.json" "$D/Raw13Coupled3Auto.lean" Raw13Coupled3Auto
            ROOT="$D/Raw13Coupled3.lean"
          elif [ "$TARGET" = coupledParent ]; then
            python "$D/generate_coupled_entry.py"
            ROOT="$D/Raw13CoupledParent.lean"
          elif [ "$TARGET" = coupledLive ]; then
            python "$D/generate_coupled_entry.py"
            ROOT="$D/Raw13CoupledBoth.lean"
          elif [ "$TARGET" = coupledEntry ]; then
            python "$D/generate_coupled_entry.py"
            ROOT="$D/Raw13CoupledEntry.lean"
          elif [ "$TARGET" = branchBatch ]; then
            read -ra ids <<< "$BRANCHES"
            test "${#ids[@]}" -ge 1 && test "${#ids[@]}" -le 4
            ROOT="$D/Agent46Raw13BranchBatch.lean"
            : > "$ROOT"
            for id in "${ids[@]}"; do
              [[ "$id" =~ ^[0-9]+$ ]]
              python "$D/generateBranch540.py" "$id"
              printf "import Agent46Raw13Branch%s\n" "$id" >> "$ROOT"
            done
          elif [ "$TARGET" = branch1420 ]; then
            python "$D/generateBranch540.py" 1420
            ROOT="$D/Agent46Raw13Branch1420.lean"
          elif [ "$TARGET" = branch540 ]; then
            python "$D/generateBranch540.py"
            ROOT="$D/Agent46Raw13Branch540.lean"
          elif [ "$TARGET" = branch484 ]; then
            python "$D/generateBranch540.py" 484
            ROOT="$D/Agent46Raw13Branch484.lean"
          elif [ "$TARGET" = pump0RE ]; then
            ROOT="$D/Agent46Raw13Pump0RE.lean"
          elif [ "$TARGET" = late0RE ]; then
            ROOT="$D/Agent46Raw13Late0RE.lean"
          elif [ "$TARGET" = zeroRE ]; then
            python "$D/generate0RE.py"
            ROOT="$D/Agent46Raw13ZeroRE.lean"
          elif [ "$TARGET" = zeroRC ]; then
            python "$D/generate0RE.py" 0RC
            ROOT="$D/Agent46Raw13ZeroRC.lean"
          elif [ "$TARGET" = zeroRD ]; then
            python "$D/generate0RE.py" 0RD
            ROOT="$D/Agent46Raw13ZeroRD.lean"
          elif [ "$TARGET" = zeroLC ]; then
            python "$D/generate0RE.py" 0LC
            ROOT="$D/Agent46Raw13ZeroLC.lean"
          elif [ "$TARGET" = oneLA ]; then
            python "$D/generate0RE.py" 1LA
            ROOT="$D/Agent46Raw13OneLA.lean"
          elif [ "$TARGET" = zeroRB ]; then
            python "$D/generate0RE.py" 0RB
            ROOT="$D/Agent46Raw13ZeroRB.lean"
          elif [ "$TARGET" = oneRE ]; then
            python "$D/generate0RE.py" 1RE
            ROOT="$D/Agent46Raw13OneRE.lean"
          elif [ "$TARGET" = oneLC ]; then
            python "$D/generate0RE.py" 1LC
            ROOT="$D/Agent46Raw13OneLC.lean"
          elif [ "$TARGET" = oneRA ]; then
            python "$D/generate0RE.py" 1RA
            ROOT="$D/Agent46Raw13OneRA.lean"
          elif [ "$TARGET" = zeroRA ]; then
            python "$D/generate0RE.py" 0RA
            ROOT="$D/Agent46Raw13ZeroRA.lean"
          elif [ "$TARGET" = zeroLB ]; then
            python "$D/generate0RE.py" 0LB
            ROOT="$D/Agent46Raw13ZeroLB.lean"
          elif [ "$TARGET" = zeroLE5 ]; then
            python "$D/emitauto.py" "$D/auto0LE5.json" "$D/Agent46Raw13Auto0LE5.lean" Raw13Auto0LE5
            python "$D/generate0RE.py" 0LE5
            ROOT="$D/Agent46Raw13ZeroLE5.lean"
          elif [ "$TARGET" = oneLE ]; then
            python "$D/emitauto.py" "$D/auto1LE.json" "$D/Agent46Raw13Auto1LE.lean" Raw13Auto1LE
            python "$D/generate0RE.py" 1LE
            ROOT="$D/Agent46Raw13OneLE.lean"
          elif [ "$TARGET" = zeroRE5 ]; then
            python "$D/emitauto.py" "$D/auto0RE5.json" "$D/Agent46Raw13Auto0RE5.lean" Raw13Auto0RE5
            python "$D/generate0RE.py" 0RE5
            ROOT="$D/Agent46Raw13ZeroRE5.lean"
          elif [ "$TARGET" = oneRC ]; then
            python "$D/emitauto.py" "$D/auto1RC.json" "$D/Agent46Raw13Auto1RC.lean" Raw13Auto1RC
            python "$D/generate0RE.py" 1RC
            ROOT="$D/Agent46Raw13OneRC.lean"
          elif [ "$TARGET" = oneRD ]; then
            python "$D/emitauto.py" "$D/auto1RD.json" "$D/Agent46Raw13Auto1RD.lean" Raw13Auto1RD
            python "$D/generate0RE.py" 1RD
            ROOT="$D/Agent46Raw13OneRD.lean"
          elif [ "$TARGET" = pump0LE5 ]; then
            ROOT="$D/Agent46Raw13Pump0LE5.lean"
          elif [ "$TARGET" = core ]; then
            ROOT="$D/Agent46Raw13Base.lean"
          else
            python "$D/generate0RE.py"
            python "$D/generate0RE.py" 0RC
            python "$D/generate0RE.py" 0RD
            python "$D/generate0RE.py" 0LC
            python "$D/generate0RE.py" 0LB
            python "$D/generate0RE.py" 0RA
            python "$D/generate0RE.py" 1LA
            python "$D/generate0RE.py" 1RA
            python "$D/generate0RE.py" 0RB
            python "$D/generate0RE.py" 1LC
            python "$D/generate0RE.py" 1RE
            python "$D/emitauto.py" "$D/auto1RC.json" "$D/Agent46Raw13Auto1RC.lean" Raw13Auto1RC
            python "$D/generate0RE.py" 1RC
            python "$D/emitauto.py" "$D/auto0RE5.json" "$D/Agent46Raw13Auto0RE5.lean" Raw13Auto0RE5
            python "$D/generate0RE.py" 0RE5
            python "$D/emitauto.py" "$D/auto1RD.json" "$D/Agent46Raw13Auto1RD.lean" Raw13Auto1RD
            python "$D/generate0RE.py" 1RD
            python "$D/emitauto.py" "$D/auto0LE5.json" "$D/Agent46Raw13Auto0LE5.lean" Raw13Auto0LE5
            python "$D/generate0RE.py" 0LE5
            python "$D/emitauto.py" "$D/auto1LE.json" "$D/Agent46Raw13Auto1LE.lean" Raw13Auto1LE
            python "$D/generate0RE.py" 1LE
            python "$D/generateBranch540.py" 484
            python "$D/generateBranch540.py" 540
            python "$D/generate.py"
            if [ -f "$D/raw13-bidfa-spec.json" ]; then
              python "$D/audit_bidfa_raw13.py"
            fi
            ROOT="$D/Agent46Raw13Data.lean"
          fi
          if [ "$TARGET" = phase ]; then
            # First try Agent25's five already-minimized, source-audited
            # phase pairs against every raw13 residual (hole-count agnostic).
            python "$D/phase_bank_raw13.py"
            # Recover the earlier seed-46 sample whose artifact was not
            # persisted, then add a disjoint deterministic sample.
            python "$D/phase_scan_raw13.py" --limit 25 --cap 5000 --seed 46 --exclude-d3
            python "$D/phase_scan_raw13.py" --limit 25 --cap 5000 --seed 47 --exclude-d3
            python "$D/audit_bidfa_raw13.py"
            python "$D/generate.py"
          fi
          if [ "$TARGET" = corridor ]; then
            ROOT="$D/Agent46Raw13Corridor.lean"
          fi
          if [ "$TARGET" = cut ] || [ "$TARGET" = corridor ] || [ "$TARGET" = ingest ] || [ "$TARGET" = ingest77 ] || [ "$TARGET" = d3frontier ] || [ "$TARGET" = phase ]; then
            python im-results/agent31-three-hole-tnf/generate_sweeps.py
            python im-results/agent31-three-hole-tnf/generate_four_hole.py
            python im-results/agent10-tnf-raw87/generate.py
            python im-results/agent10-tnf-raw91/generate.py
            python im-results/agent10-tnf-multipump/generate.py 66 70 80
            python im-results/agent10-tnf-multipump/generate.py 68 72 82
            python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
            if [ "$TARGET" = ingest ]; then
              ROOT="$D/Agent46Raw13Ingest.lean"
            elif [ "$TARGET" != corridor ]; then
              ROOT="$D/Agent46Raw13Data.lean"
            fi
          fi
          if [ "$TARGET" = ingest77 ] || [ "$TARGET" = d3frontier ] || [ "$TARGET" = phase ]; then
            python tools/lean_compile_closure.py --workdir /tmp/a46-raw13 --jobs 4 \
              --precompiled-manifest /tmp/a46-canonical-manifest.json \
              --precompiled-dir /tmp/a47-canonical "$ROOT" | tee /tmp/a46-raw13.log
          elif [ "$TARGET" = coupled6Sibling ]; then
            # The generator imports agent32-raw59/emit_rungram.py, whose Cert API is
            # incompatible with the distinct same-named raw42 module.
            python tools/lean_compile_closure.py --workdir /tmp/a46-raw13 --jobs 4 \
              --override FastBiDFA=im-results/agent32-raw59/FastBiDFA.lean "$ROOT" | tee /tmp/a46-raw13.log
          else
            python tools/lean_compile_closure.py --workdir /tmp/a46-raw13 --jobs 4 "$ROOT" | tee /tmp/a46-raw13.log
          fi
          if grep -Eq 'sorryAx|native_decide' /tmp/a46-raw13.log; then exit 1; fi
      - name: Preserve raw13 phase-BiDFA sample and proof sources
        if: always() && inputs.target == 'phase'
        uses: actions/upload-artifact@v4
        with:
          name: raw13-phase-bidfa-sample
          path: |
            im-results/agent46-raw13-cut/raw13-open-residuals.txt
            im-results/agent46-raw13-cut/raw13-bidfa-spec.json
            im-results/agent46-raw13-cut/raw13-phase-search.stdout.txt
            im-results/agent46-raw13-cut/raw13-phase-search.stderr.txt
            im-results/agent46-raw13-cut/Agent46Raw13BiDFAAudit.lean
            /tmp/a46-raw13/Agent46Raw13Data.olean
            /tmp/a46-raw13.log
            /tmp/a46-canonical-manifest.json
      - name: Preserve generated growing-radix fixtures without rediscovery
        if: always() && inputs.target == 'coupled6GrowRadix'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'im-results/agent46-raw13-cut/growradix-bank.json';
            if (!fs.existsSync(path)) return;
            const content = fs.readFileSync(path);
            if (JSON.parse(content).length !== 7) throw new Error('Incomplete bank');
            try {
              const old = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'
              });
              if (Buffer.from(old.data.content,'base64').equals(content)) return;
              throw new Error('Existing distinct bank; refusing overwrite');
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path,
              message: 'Agent 46: persist seven exact growing-radix candidate macro banks',
              content: content.toString('base64'), branch: 'main'
            });
      - name: Record exact proof targets and source audit
        if: inputs.target == 'branchBatch' || inputs.target == 'branch1420' || inputs.target == 'branch484' || inputs.target == 'branch540' || inputs.target == 'cut' || inputs.target == 'corridor' || inputs.target == 'ingest77' || inputs.target == 'd3frontier' || inputs.target == 'phase' || inputs.target == 'zeroLE5' || inputs.target == 'oneLE' || inputs.target == 'coupledEntry' || inputs.target == 'coupledLive' || inputs.target == 'coupledParent' || inputs.target == 'coupled3' || inputs.target == 'coupled4' || inputs.target == 'coupledNested' || inputs.target == 'coupled5Sibling' || inputs.target == 'coupled6Sibling' || inputs.target == 'coupled6Late' || inputs.target == 'coupled6Nested' || inputs.target == 'coupled6Extended' || inputs.target == 'coupled6RDSweep' || inputs.target == 'coupled6RBPattern' || inputs.target == 'coupled6Nested0RB' || inputs.target == 'coupled6Odd0RB' || inputs.target == 'coupled6MirroredCounter' || inputs.target == 'coupled6PhasedCounter' || inputs.target == 'coupled6GrowRadix' || inputs.target == 'coupled6UnaryRecursion'
        env:
          TARGET: ${{ inputs.target }}
          BRANCHES: ${{ inputs.branches }}
        run: |
          set -euo pipefail
          printf 'target=%s\nbranches=%s\nsource=%s\n' "$TARGET" "$BRANCHES" "$(git rev-parse HEAD)" > /tmp/a46-raw13/proof-targets.txt
          lean --version >> /tmp/a46-raw13/proof-targets.txt
          cp /tmp/a46-raw13.log /tmp/a46-raw13/proof-audit.log
      - name: Preserve compiled raw13 source closure
        if: inputs.target == 'branchBatch' || inputs.target == 'branch1420' || inputs.target == 'branch484' || inputs.target == 'branch540' || inputs.target == 'cut' || inputs.target == 'corridor' || inputs.target == 'ingest77' || inputs.target == 'd3frontier' || inputs.target == 'phase' || inputs.target == 'zeroLE5' || inputs.target == 'oneLE' || inputs.target == 'coupledEntry' || inputs.target == 'coupledLive' || inputs.target == 'coupledParent' || inputs.target == 'coupled3' || inputs.target == 'coupled4' || inputs.target == 'coupledNested' || inputs.target == 'coupled5Sibling' || inputs.target == 'coupled6Sibling' || inputs.target == 'coupled6Late' || inputs.target == 'coupled6Nested' || inputs.target == 'coupled6Extended' || inputs.target == 'coupled6RDSweep' || inputs.target == 'coupled6RBPattern' || inputs.target == 'coupled6Nested0RB' || inputs.target == 'coupled6Odd0RB' || inputs.target == 'coupled6MirroredCounter' || inputs.target == 'coupled6PhasedCounter' || inputs.target == 'coupled6GrowRadix' || inputs.target == 'coupled6UnaryRecursion'
        uses: actions/upload-artifact@v4
        with:
          name: raw13-closure-certified
          path: /tmp/a46-raw13
          if-no-files-found: error
          retention-days: 30
      - name: Compile raw13 graft against the accepted canonical77 artifact
        if: inputs.target == 'ingest77' || inputs.target == 'd3frontier' || inputs.target == 'phase'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:im-results/agent47-rooted-tnf/CanonicalRaw114Accepted.lean)" = "d198f4eb8d3c2ca4b7ed5a2c57298cb6364537f4"
          test -s /tmp/a47-canonical/CanonicalRaw114Accepted.olean
          test -s /tmp/a47-canonical/CanonicalTwoParentGraft.olean
          test -s /tmp/a47-canonical/Raw114CompleteData.olean
          export LEAN_PATH="/tmp/a46-raw13:/tmp/a47-canonical"
          lean -o /tmp/a46-raw13/Agent46Raw13Ingest77.olean \
            im-results/agent46-raw13-cut/Agent46Raw13Ingest77.lean 2>&1 | tee /tmp/a46-raw13-ingest77.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a46-raw13-ingest77.log; then exit 1; fi
          python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path("/tmp/a46-raw13-ingest77.log").read_text()
          profiles = {}
          for name, raw in re.findall(r"'([^']+)' depends on axioms: \[([^]]*)\]", log, re.S):
              profiles[name] = {x.strip() for x in raw.split(",") if x.strip()}
          expected = {
              "BB6.Agent46Raw13Canonical77.parent_count77",
              "BB6.Agent46Raw13Canonical77.refined_count77",
              "BB6.Agent46Raw13Canonical77.refined_sound77",
              "BB6.Agent46Raw13Canonical77.cover_at_target77",
              "BB6.Agent46Raw13Canonical77.exact_at_target77",
          }
          missing = expected - profiles.keys()
          if missing:
              raise SystemExit("missing axiom profiles: " + ", ".join(sorted(missing)))
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in sorted(expected):
              bad = profiles[name] - allowed
              if bad:
                  raise SystemExit(f"{name}: unexpected axioms {sorted(bad)}")
              print(f"{name}: {sorted(profiles[name])}")
          PY
      - name: Compile D3 hard-root frontier graft into canonical77
        if: inputs.target == 'd3frontier'
        run: |
          set -euo pipefail
          export LEAN_PATH="/tmp/a46-raw13:/tmp/a47-canonical:im-results/agent8-coverage-contract:im-results/agent4-coverage-smoke:im-results/agent42-coverage-normal:im-results/agent13-coverage:im-results/agent13-weighted-first-one:im-results/agent6-fresh-glider:im-results/agent7-far:im-results/agent31-three-hole-tnf:im-results/agent50-weighted-tnf-pilot:im-results/agent13-roster-convergence:im-results/agent44-source-roster:im-results/agent47-rooted-tnf:im-results/agent47-r1-sweep:im-results/agent47-r4-counter:im-results/agent48-roster-graft:im-results/agent42-frontier-count:im-results/agent46-raw13-cut:im-results/agent19-hard-root-crosswalk:im-results/agent47-weighted-halt-branch:im-results/agent8-cryptids-tnf-paths:im-results/agent47-raw114-cut"
          python tools/lean_compile_closure.py --workdir /tmp/a46-d3-frontier --jobs 4 --precompiled-manifest /tmp/a46-canonical-manifest.json --precompiled-dir /tmp/a47-canonical im-results/agent42-d3-raw13-frontier/D3Ingestion.lean | tee /tmp/a46-d3-frontier.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a46-d3-frontier.log; then
            echo "Forbidden proof placeholder or native_decide found in D3 frontier closure" >&2
            exit 1
          fi
      - name: Preserve raw13 canonical77 proof artifact
        if: inputs.target == 'ingest77' || inputs.target == 'd3frontier' || inputs.target == 'phase'
        uses: actions/upload-artifact@v4
        with:
          name: canonical77-raw13-graft-certified
          path: |
            /tmp/a46-raw13/Agent46Raw13Ingest77.olean
            /tmp/a46-raw13.log
            /tmp/a46-raw13-ingest77.log
            /tmp/a46-canonical-manifest.json
      - name: Preserve D3 raw13 frontier proof artifact
        if: success() && inputs.target == 'd3frontier'
        uses: actions/upload-artifact@v4
        with:
          name: d3-raw13-frontier-certified
          path: |
            /tmp/a46-d3-frontier
            /tmp/a46-d3-frontier.log
          retention-days: 30
      - name: Persist Lean-accepted raw13 BiDFA spec
        if: success() && inputs.target == 'phase' && inputs.source_ref == ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = 'im-results/agent46-raw13-cut/raw13-bidfa-spec.json';
            const content = fs.readFileSync(path, 'utf8');
            const spec = JSON.parse(content);
            const count = Object.keys(spec.bidfa || {}).length;
            if (count === 0) {
              core.info('No Lean-accepted BiDFA candidates; nothing to persist.');
              return;
            }
            if (context.ref !== 'refs/heads/main') {
              throw new Error('Refusing to persist candidate spec from a non-main workflow ref.');
            }
            let sha;
            for (let attempt = 0; attempt < 3; attempt++) {
              try {
                const current = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  ref: 'main'
                });
                sha = current.data.sha;
                if (Buffer.from(current.data.content, 'base64').toString('utf8') === content) {
                  core.info('The Lean-accepted raw13 BiDFA spec is already current.');
                  return;
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                sha = undefined;
              }
              try {
                const result = await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path,
                  message: 'Agent 46: persist Lean-accepted raw13 BiDFA certificates',
                  content: Buffer.from(content).toString('base64'),
                  sha,
                  branch: 'main'
                });
                core.info('Persisted raw13 BiDFA spec in commit ' + result.data.commit.sha);
                return;
              } catch (error) {
                if (error.status !== 409 || attempt === 2) throw error;
              }
            }

  discover-coupled4:
    if: inputs.target == 'coupled4Discover'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Solve the 62 remaining one-hole candidates
        run: |
          set -euo pipefail
          python im-results/agent46-raw13-cut/discoverCoupled4.py /tmp/coupled4-candidates.json
      - name: Preserve exact candidate witnesses (not a proof verdict)
        uses: actions/upload-artifact@v4
        with:
          name: coupled4-candidates
          path: /tmp/coupled4-candidates.json
      - name: Publish unique candidate file
        run: |
          set -euo pipefail
          git config user.name "Agent 46"
          git config user.email "agent46@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          dst=im-results/agent46-raw13-cut/coupled4-candidates.json
          cp /tmp/coupled4-candidates.json "$dst"
          git add "$dst"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Agent 46: preserve four-hole residual candidate witnesses"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1

  source-coupled:
    if: inputs.target == 'coupledSource'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile local exact proof closure
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          D=im-results/agent46-raw13-cut
          python "$D/generate_coupled_entry.py"
          python "$D/emitauto.py" "$D/coupled3-auto.json" "$D/Raw13Coupled3Auto.lean" Raw13Coupled3Auto
          python tools/lean_compile_closure.py --workdir /tmp/a46-source --jobs 4 "$D/Raw13Coupled3.lean" im-results/agent4-coverage-smoke/RelativeTape.lean | tee /tmp/a46-source.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a46-source.log; then exit 1; fi
      - name: Build unchanged upstream theorem at pinned revision
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          git -C /tmp/cryptids checkout --quiet 3647718b5df22e1a61462dec0376bd204526285a
          test "$(git -C /tmp/cryptids rev-parse HEAD)" = 3647718b5df22e1a61462dec0376bd204526285a
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          cd /tmp/cryptids
          printf '%s\n' leanprover/lean4:v4.36.0-rc2 > lean-toolchain
          sed -i 's/v4.35.0-rc4/v4.36.0-rc2/g' lakefile.toml
          rm -f lake-manifest.json
          lake update
          lake exe cache get
          lake build BusyBeaver.Bridge BusyBeaver.BB6.NonHalt.M_1RB1LD_1RC0RB_1LA1RE_1LF0LA_1LA0RD_1LCHHH
      - name: Prove unconditional two- and three-hole bounds
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          export LEAN_PATH=/tmp/a46-source
          cp "$GITHUB_WORKSPACE/im-results/agent10-nov26-cryptids/CryptidsTapeAdapter.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent46-raw13-cut/Raw13CoupledParentSource.lean" .
          lake env lean -o /tmp/a46-source/CryptidsTapeAdapter.olean CryptidsTapeAdapter.lean 2>&1 | tee /tmp/a46-adapter.log
          lake env lean -o /tmp/a46-source/Raw13CoupledParentSource.olean Raw13CoupledParentSource.lean 2>&1 | tee /tmp/a46-unconditional.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a46-adapter.log /tmp/a46-unconditional.log; then exit 1; fi
      - name: Preserve unconditional audit
        uses: actions/upload-artifact@v4
        with:
          name: raw13-coupled-unconditional
          path: |
            /tmp/a46-unconditional.log
            /tmp/a46-adapter.log
            /tmp/a46-source

