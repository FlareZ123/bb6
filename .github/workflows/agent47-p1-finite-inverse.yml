name: Agent 47 P1 finite inverse source verification (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact original P1 recursive G source
        run: |
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent50-p1-residue:im-results/agent47-p1-finite-inverse"
          lean -o im-results/agent1-p1-map/GParity.olean im-results/agent1-p1-map/GParity.lean
          lean -o im-results/agent1-p1-map/GInverse.olean im-results/agent1-p1-map/GInverse.lean
          lean -o im-results/agent47-p1-finite-inverse/P1FiniteInverse.olean im-results/agent47-p1-finite-inverse/P1FiniteInverse.lean
          lean -o im-results/agent1-p1-map/PosEvenForm.olean im-results/agent1-p1-map/PosEvenForm.lean
          lean -o im-results/agent1-p1-map/ResetGate.olean im-results/agent1-p1-map/ResetGate.lean
          for m in P1Triple P1ResidualArithmetic P1ResidualReach; do
            lean -o "im-results/agent50-p1-residue/$m.olean" "im-results/agent50-p1-residue/$m.lean"
          done
          lean -o im-results/agent47-p1-finite-inverse/P1InverseLog.olean im-results/agent47-p1-finite-inverse/P1InverseLog.lean
          lean -o im-results/agent47-p1-finite-inverse/P1NoRootOne.olean im-results/agent47-p1-finite-inverse/P1NoRootOne.lean
          lean -o im-results/agent47-p1-finite-inverse/P1CriticalValuation.olean im-results/agent47-p1-finite-inverse/P1CriticalValuation.lean
          lean -o im-results/agent47-p1-finite-inverse/P1ConeListBridge.olean im-results/agent47-p1-finite-inverse/P1ConeListBridge.lean
