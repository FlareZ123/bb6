name: Agent47 q0-150 short certificate recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [shard14, leaf79]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Generate only unresolved finite source certificates
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/q0short
          if [ "$TARGET" = leaf79 ]; then
            node im-results/agent5-weighted-tnf-queue/generate-q0150-short-leaves.cjs /tmp/q0short 79
            printf '%s\n' /tmp/q0short/Raw11Q0150Short79.lean > /tmp/q0short/roots.txt
          else
            node im-results/agent5-weighted-tnf-queue/generate-q0150-short-leaves.cjs /tmp/q0short
            python - <<'PY'
          import json
          a=json.load(open('/tmp/q0short/manifest.json'))
          paths=['/tmp/q0short/'+x['filename'] for x in a['leaves']
                 if x['type']=='short' and x['index'] % 16 == 14]
          assert [int(p.split('Short')[1].split('.')[0]) for p in paths] == [14,30,46,62,78,94], paths
          open('/tmp/q0short/roots.txt','w').write('\n'.join(paths)+'\n')
          PY
          fi

      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Kernel-check unresolved original-source lemmas
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          mapfile -t ROOTS < /tmp/q0short/roots.txt
          python tools/lean_compile_closure.py "${ROOTS[@]}"             --source-root /tmp/q0short --workdir /tmp/q0short-verified             --manifest /tmp/q0short-verified/manifest.json --jobs 2 --lean lean             --label "q0 150 recovery ${{ matrix.target }}"             --provenance-input im-results/agent5-weighted-tnf-queue/q0-150-complete-frontier.json             --provenance-input im-results/agent5-weighted-tnf-queue/generate-q0150-short-leaves.cjs             2>&1 | tee /tmp/q0short.log
          if grep -Eq 'sorryAx|native_decide' /tmp/q0short.log; then exit 1; fi
          test "$(grep -c 'BB6.Raw11Q0150Short[0-9]*.safe.*depends on axioms:' /tmp/q0short.log)" -ge "${#ROOTS[@]}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent47-q0150-recovery-${{ matrix.target }}
          path: |
            /tmp/q0short/manifest.json
            /tmp/q0short/roots.txt
            /tmp/q0short-verified/
            /tmp/q0short.log
          if-no-files-found: warn
          retention-days: 30
