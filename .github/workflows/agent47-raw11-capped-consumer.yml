name: Agent47 Raw11 capped-parent consumer

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [capped, q0-banks, extra-shards, q0-149-three, q0-149-eight, q0-149-ten]
        default: capped
      extra_id:
        type: choice
        options: ['132', '140']
        default: '132'

permissions:
  actions: read
  contents: read

jobs:
  consume:
    if: inputs.mode == 'capped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          "$HOME/.elan/bin/lean" --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Download accepted 46-parent and q0 consumer
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 45906697676
          name: raw11-root52-known-consumption
          path: /tmp/base

      - name: Download accepted parent artifacts by immutable IDs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          download_artifact() {
            artifact_id="$1"
            dest="$2"
            mkdir -p "$dest"
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/FlareZ123/bb6/actions/artifacts/$artifact_id/zip" \
              -o "/tmp/$artifact_id.zip"
            unzip -q "/tmp/$artifact_id.zip" -d "$dest"
          }
          download_artifact 15159257293 /tmp/p126
          download_artifact 15154832729 /tmp/p127
          download_artifact 15154568902 /tmp/p128
          download_artifact 15154569169 /tmp/p129
          download_artifact 15154663882 /tmp/p130
          download_artifact 15158958272 /tmp/p137

      - name: Compile exact six-parent consumer
        run: |
          set -euo pipefail
          find_one() {
            find "$1" -type d -name "$2" -print -quit
          }
          BASE="$(find_one /tmp/base a47-raw11-root52-known)"
          P126="$(find_one /tmp/p126 raw11-certified)"
          P127="$(find_one /tmp/p127 raw11-certified)"
          P128="$(find_one /tmp/p128 raw11-certified)"
          P129="$(find_one /tmp/p129 raw11-certified)"
          P130="$(find_one /tmp/p130 raw11-certified)"
          P137="$(find_one /tmp/p137 raw11-certified)"
          test -n "$BASE" && test -f "$BASE/Raw11Root52Q0ParentsConsume.olean"
          for pair in "126:$P126" "127:$P127" "128:$P128" "129:$P129" "130:$P130" "137:$P137"; do
            id="${pair%%:*}"
            dir="${pair#*:}"
            test -n "$dir"
            test -f "$dir/Agent5Raw11Extra${id}.olean"
          done
          export LEAN_PATH="$BASE:$P126:$P127:$P128:$P129:$P130:$P137"
          mkdir -p /tmp/capped-consumer
          lean -j1 -o /tmp/capped-consumer/Raw11Root52CappedParentsConsume.olean \
            im-results/agent47-raw11-adapter/Raw11Root52CappedParentsConsume.lean \
            | tee /tmp/capped-consumer.log
          if grep -Eq 'sorryAx|native_decide' /tmp/capped-consumer.log; then
            echo "forbidden axiom found" >&2
            exit 1
          fi
          grep -F "'BB6.Agent47Raw11Root52CappedParentsConsume.remaining_census' depends on axioms:" /tmp/capped-consumer.log
          grep -F "'BB6.Agent47Raw11Root52CappedParentsConsume.cover_from_remaining' depends on axioms:" /tmp/capped-consumer.log
          {
            echo "lean_version=$(lean --version)"
            echo "base_run=45906697676"
            echo "parent_runs=45898270704,45908444758"
            echo "parent_ids=126,127,128,129,130,137"
            sha256sum im-results/agent47-raw11-adapter/Raw11Root52CappedParentsConsume.lean
            sha256sum /tmp/capped-consumer/Raw11Root52CappedParentsConsume.olean
          } > /tmp/capped-consumer/provenance.txt

      - name: Upload accepted capped-parent consumer
        uses: actions/upload-artifact@v4
        with:
          name: raw11-root52-capped-parent-consumption
          path: |
            /tmp/capped-consumer
            im-results/agent47-raw11-adapter/Raw11Root52CappedParentsConsume.lean
          if-no-files-found: error
          retention-days: 30

  bank-consume:
    if: inputs.mode == 'q0-banks'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download immutable proof dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/bank-deps /tmp/bank-output
          for id in 15159003899 15161045625 15159257293 15154832729 15154568902 15154569169 15154663882 15158958272 15017647753 15014940132; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/FlareZ123/bb6/actions/artifacts/$id/zip" -o "/tmp/$id.zip"
            mkdir -p "/tmp/bank-deps/$id"
            if [ "$id" = 15014940132 ]; then
              unzip -q "/tmp/$id.zip" 'BlockMacro.*' 'BlockFAR.*' 'SparseBlockFAR.*' 'RangeCheck.*' 'BlockFARBridge.*' 'Frontier.olean' -d "/tmp/bank-deps/$id"
            else
              unzip -q "/tmp/$id.zip" -d "/tmp/bank-deps/$id"
            fi
          done
      - name: Compile locally established bank and held cuts
        run: |
          set -euo pipefail
          D=/tmp/bank-deps
          BASE="$D/15159003899/tmp/a47-raw11-root52-known"
          CAPPED="$D/15161045625/tmp/capped-consumer"
          cmp "$BASE/Frontier.olean" "$D/15014940132/Frontier.olean"
          export LEAN_PATH="/tmp/bank-output:$BASE:$CAPPED:$D/15017647753:$D/15014940132"
          for id in 15159257293 15154832729 15154568902 15154569169 15154663882 15158958272; do
            P="$(find "$D/$id" -type d -name raw11-certified -print -quit)"
            test -n "$P"
            LEAN_PATH="$LEAN_PATH:$P"
          done
          export LEAN_PATH
          SRC=im-results/agent47-raw11-adapter
          compile() {
            lean -j1 -o "/tmp/bank-output/$1.olean" "$SRC/$1.lean" | tee "/tmp/bank-output/$1.log"
            if grep -Eq 'sorryAx|native_decide' "/tmp/bank-output/$1.log"; then exit 1; fi
          }
          compile Raw11Q0Held156
          compile Raw11Q0FreshClosed
          compile Raw11Q0BankSmallPart0
          compile Raw11Q0BankSmallPart1
          compile Raw11Q0BankSmall
          for i in $(seq 0 8); do compile "Raw11Q0BankLargePart$i"; done
          compile Raw11Q0BankLarge
          compile Raw11Q0BankHeld28Part0
          compile Raw11Q0BankHeld28
          compile Raw11Q0Combined
          grep -F "'BB6.Agent47Raw11Q0Combined.remaining_census' depends on axioms:" /tmp/bank-output/Raw11Q0Combined.log
          grep -F "'BB6.Agent47Raw11Q0Combined.cover_from_remaining' depends on axioms:" /tmp/bank-output/Raw11Q0Combined.log
      - name: Preserve accepted bank and consumer proof objects
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw11-q0-bank-consumption
          path: /tmp/bank-output
          if-no-files-found: error
          retention-days: 30

  extra-generate:
    if: inputs.mode == 'extra-shards'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 45896597080
          pattern: raw11-six-hole-*
          merge-multiple: true
          path: /tmp/six-hole
      - name: Generate exact parent proof DAG
        env:
          SIX_HOLE_DATA: /tmp/six-hole
          RAW11_EXTENDED_AUTOMATA: '1'
        run: |
          set -euo pipefail
          node im-results/agent5-weighted-tnf-queue/generate-extra-parent-shards.cjs "${{ inputs.extra_id }}" /tmp/parent-source
          echo "$GITHUB_SHA" > /tmp/parent-source/generation-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: parent-source-${{ inputs.extra_id }}
          path: /tmp/parent-source
          if-no-files-found: error
          retention-days: 30

  extra-leaves:
    needs: extra-generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 45906697676
          name: raw11-root52-known-consumption
          path: /tmp/base
      - uses: actions/download-artifact@v4
        with:
          name: parent-source-${{ inputs.extra_id }}
          path: /tmp/parent-source
      - name: Check independent exact leaf modules
        run: |
          set -euo pipefail
          python im-results/agent47-raw11-adapter/compile-parent-shards.py leaf /tmp/parent-source /tmp/base/tmp/a47-raw11-root52-known /tmp/parent-out --group "${{ matrix.group }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parent-leaf-${{ inputs.extra_id }}-${{ matrix.group }}
          path: /tmp/parent-out
          if-no-files-found: warn
          retention-days: 30

  extra-join:
    needs: extra-leaves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 45906697676
          name: raw11-root52-known-consumption
          path: /tmp/base
      - uses: actions/download-artifact@v4
        with:
          name: parent-source-${{ inputs.extra_id }}
          path: /tmp/parent-source
      - uses: actions/download-artifact@v4
        with:
          pattern: parent-leaf-${{ inputs.extra_id }}-*
          merge-multiple: true
          path: /tmp/parent-out
      - name: Join exact proof DAG
        run: |
          set -euo pipefail
          python im-results/agent47-raw11-adapter/compile-parent-shards.py join /tmp/parent-source /tmp/base/tmp/a47-raw11-root52-known /tmp/parent-out
          test -f "/tmp/parent-out/Agent5Raw11Extra${{ inputs.extra_id }}.olean"
          grep -F 'cover' "/tmp/parent-out/Agent5Raw11Extra${{ inputs.extra_id }}.log"
      - uses: actions/upload-artifact@v4
        with:
          name: parent-complete-${{ inputs.extra_id }}
          path: |
            /tmp/parent-out
            /tmp/parent-source
          if-no-files-found: error
          retention-days: 30

  q0-149-three:
    if: inputs.mode == 'q0-149-three'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate and kernel-check three nonhalting cylinders
        run: |
          set -euo pipefail
          p=im-results/agent47-raw11-adapter
          node "$p/generate-q0-149-three-run-lean.cjs" > "$p/Raw11Q0Three149.lean"
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py "$p/Raw11Q0Three149.lean" \
            --workdir /tmp/q0149-three --manifest /tmp/q0149-three/manifest.json \
            --jobs 2 --lean lean --label q0149-three \
            --provenance-input "$p/generate-q0-149-three-run-certs.cjs" \
            --provenance-input "$p/generate-q0-149-three-run-lean.cjs" \
            2>&1 | tee /tmp/q0149-three.log
          if grep -Eq 'sorryAx|native_decide' /tmp/q0149-three.log; then exit 1; fi
          for n in 11 16 17; do
            grep -F "BB6Coverage.Agent31Pump.Q0149.Raw11.M$n.cover' depends on axioms:" /tmp/q0149-three.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-q0-149-three
          path: |
            /tmp/q0149-three/
            /tmp/q0149-three.log
            im-results/agent47-raw11-adapter/Raw11Q0Three149.lean
          if-no-files-found: warn
          retention-days: 30

  q0-149-eight:
    if: inputs.mode == 'q0-149-eight'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check the exact two-periodic growth certificate
        run: |
          set -euo pipefail
          p=im-results/agent47-raw11-adapter
          node "$p/generate-q0-149-index8-lean.cjs" > "$p/Raw11Q0Eight149.lean"
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py "$p/Raw11Q0Eight149.lean" \
            --workdir /tmp/q0149-eight --manifest /tmp/q0149-eight/manifest.json \
            --jobs 2 --lean lean --label q0149-eight \
            --provenance-input "$p/generate-q0-149-index8.cjs" \
            --provenance-input "$p/generate-q0-149-index8-lean.cjs" \
            2>&1 | tee /tmp/q0149-eight.log
          if grep -Eq 'sorryAx|native_decide' /tmp/q0149-eight.log; then exit 1; fi
          grep -F "BB6Coverage.Agent31Pump.Q0149Eight.cover' depends on axioms:" /tmp/q0149-eight.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-q0-149-eight
          path: |
            /tmp/q0149-eight/
            /tmp/q0149-eight.log
            im-results/agent47-raw11-adapter/Raw11Q0Eight149.lean
          if-no-files-found: warn
          retention-days: 30

  q0-149-ten:
    if: inputs.mode == 'q0-149-ten'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check the exact two-periodic growth certificate
        run: |
          set -euo pipefail
          p=im-results/agent47-raw11-adapter
          python "$p/generate-q0-149-index10.py"
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py "$p/Raw11Q0Ten149.lean" \
            --workdir /tmp/q0149-ten --manifest /tmp/q0149-ten/manifest.json \
            --jobs 2 --lean lean --label q0149-ten \
            --provenance-input "$p/generate-q0-149-index10.py" \
            2>&1 | tee /tmp/q0149-ten.log
          if grep -Eq 'sorryAx|native_decide' /tmp/q0149-ten.log; then exit 1; fi
          grep -F "BB6BlockFAR8.Q0149Index10.cover' depends on axioms:" /tmp/q0149-ten.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-q0-149-ten
          path: |
            /tmp/q0149-ten/
            /tmp/q0149-ten.log
            im-results/agent47-raw11-adapter/Raw11Q0Ten149.lean
          if-no-files-found: warn
          retention-days: 30
