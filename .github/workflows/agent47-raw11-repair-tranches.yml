name: Agent47 tranche-resumable Raw11 parent repair

on:
  workflow_dispatch:
    inputs:
      parent_id:
        description: Raw11 extra parent id
        required: true
        type: choice
        options: ['132','140']
      source_run:
        description: Run containing the already-generated repaired source artifact
        required: true
        type: string
      source_artifact:
        description: Exact repaired source artifact name
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:

  tranche0:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: ${{ inputs.source_run }}
          name: ${{ inputs.source_artifact }}
          path: /tmp/source
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: FlareZ123/bb6
          run-id: 45906697676
          name: raw11-root52-known-consumption
          path: /tmp/base

      - name: Seed immutable accepted leaf objects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARENT_ID: ${{ inputs.parent_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          if [ "$PARENT_ID" = 132 ]; then
            pairs="1:15167752700 2:15167528142 3:15167803036 4:15167811958 5:15168810518 6:15167956708 7:15167922399"
          else
            pairs="1:15249375242 2:15248303641 3:15249526182 4:15249696079 5:15249002463 6:15248789926 7:15248848323"
          fi
          for pair in $pairs; do
            id="${pair#*:}"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/repos/FlareZ123/bb6/actions/artifacts/$id/zip"               -o "/tmp/leaf-$id.zip"
            unzip -o -q "/tmp/leaf-$id.zip" -d /tmp/out
          done

      - name: Compile four fresh exact DAG modules
        env:
          RAW11_REPAIR_ID: ${{ inputs.parent_id }}
          RAW11_REPAIR_MAX_FRESH: '4'
        run: |
          set -euo pipefail
          python im-results/agent47-raw11-adapter/compile-parent-repair.py             /tmp/source /tmp/base/tmp/a47-raw11-root52-known /tmp/out             | tee /tmp/tranche.log
          test -s /tmp/out/repair-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: repair-${{ inputs.parent_id }}-tranche-0
          path: /tmp/out
          if-no-files-found: error
          retention-days: 30

