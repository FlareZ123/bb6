          python -u im-results/agent10-raw112-recovery/assemble_retry.py \
            --root im-results/agent47-raw112-cut \
            --shards /tmp/a47-raw112-shards \
            --union /tmp/a47-raw112-full-union \
            --branch-work /tmp/a47-raw112-branch-roots \
            --parent-work /tmp/a47-raw112-parent \
            --output /tmp/a47-raw112-assembled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw112-closed-parent-cover
          path: /tmp/a47-raw112-assembled/
          if-no-files-found: warn
          retention-days: 90

  compile_retry:
    if: inputs.mode == 'retry'
    needs: prepare_retry
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        group: ${{ inputs.retry_groups == '["r05a0"]' && fromJSON(inputs.r05a_children) || fromJSON(inputs.retry_groups) }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact Raw112 producer closure-tool provenance
        run: |
          set -euo pipefail
          source_revision=17263f8415b7ad1aa83aa08c7fb8254aa6de5507
          expected_blob_sha=c8eede107294a2dc67846f0899a46307f8f4d304
          git fetch --no-tags origin "$source_revision"
          git show "${source_revision}:tools/lean_compile_closure.py" > /tmp/raw112-lean_compile_closure.py
          actual_blob_sha=$(git hash-object /tmp/raw112-lean_compile_closure.py)
          test "$actual_blob_sha" = "$expected_blob_sha"
          cp /tmp/raw112-lean_compile_closure.py tools/lean_compile_closure.py
          test "$(git hash-object tools/lean_compile_closure.py)" = "$expected_blob_sha"
      - name: Validate pinned retry inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PRIOR_RECOVERY_RUN_ID: ${{ inputs.prior_recovery_run_id }}
          RESUME_RETRY_RUN_ID: ${{ inputs.resume_retry_run_id }}
          RESUME_RETRY_RUN_ID2: ${{ inputs.resume_retry_run_id2 }}
          RETRY_GROUPS_JSON: ${{ inputs.retry_groups }}
        run: |
          set -euo pipefail
          test "$SOURCE_RUN_ID" = 45751911115
          test "$PRIOR_RECOVERY_RUN_ID" = 45787320400
          for id in "$RESUME_RETRY_RUN_ID" "$RESUME_RETRY_RUN_ID2"; do
            if [[ -n "$id" ]]; then [[ "$id" =~ ^[0-9]+$ ]]; fi
          done
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "im-results/agent10-raw112-recovery")
          from configure_retry import RETRY_GROUPS
          selected = json.loads(os.environ["RETRY_GROUPS_JSON"])
          if not isinstance(selected, list) or not selected or len(selected) != len(set(selected)):
              raise SystemExit("retry_groups must be a nonempty JSON array without duplicates")
          if not set(selected) <= set(RETRY_GROUPS):
              raise SystemExit(f"unknown retry groups: {sorted(set(selected) - set(RETRY_GROUPS))}")
          resume_ids = [x.strip() for x in (os.environ.get("RESUME_RETRY_RUN_ID", ""), os.environ.get("RESUME_RETRY_RUN_ID2", "")) if x.strip()]
          if any(not x.isdigit() for x in resume_ids):
              raise SystemExit("resume retry run IDs must be numeric")
          if not resume_ids and set(selected) != set(RETRY_GROUPS):
              raise SystemExit("partial retry_groups selection requires at least one resume_retry_run_id")
          PY
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Reconstruct common generated source dependencies
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
      - uses: actions/download-artifact@v4
        with:
          name: raw112-generated-sources
          path: im-results/agent47-raw112-cut
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: raw112-recovery-partial-union
          path: /tmp/a47-raw112-partial-union
      - name: Add swap headroom for expensive Raw112 roots
        if: matrix.group == 'r01a-deep' || startsWith(matrix.group, 'r05a0')
        run: |
          set -euo pipefail
          if sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile; then
            sudo sysctl vm.swappiness=80 || true
            free -h
            swapon --show
            df -h /
          else
            echo "::warning::swap could not be enabled; continuing with runner RAM"
          fi
      - name: Compile one retained-cut retry
        env:
          GROUP: ${{ matrix.group }}
          PYTHONUNBUFFERED: "1"
          LEAN_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          case "$GROUP" in
            r01a-deep)
              python im-results/agent10-raw112-recovery/factor_missing.py im-results/agent47-raw112-cut/Raw112Kid01_01.lean
              python -u im-results/agent10-raw112-recovery/run_retry_shard.py --group "$GROUP" --root im-results/agent47-raw112-cut --workdir "/tmp/a47-raw112-shard-$GROUP" --precompiled-dir /tmp/a47-raw112-partial-union
              ;;
            r05a00|r05a01|r05a02|r05a03)
              child="${GROUP#r05a}"
              python im-results/agent10-raw112-recovery/factor_missing.py "im-results/agent47-raw112-cut/Raw112Kid05_${child}.lean"
              python3 - "$GROUP" "$child" <<'PY'
          import shutil, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "im-results/agent10-raw112-recovery")
          from run_retry_shard import PROVENANCE_INPUTS

          group, child = sys.argv[1], sys.argv[2]
          root = Path("im-results/agent47-raw112-cut").resolve()
          source = root / f"Raw112Kid05_{child}.lean"
          work = Path(f"/tmp/a47-raw112-shard-{group}")
          precompiled = Path("/tmp/a47-raw112-partial-union")
          if work.exists():
              shutil.rmtree(work)
          cmd = [
              sys.executable, "-u", "tools/lean_compile_closure.py", str(source),
              "--workdir", str(work), "--jobs", "1",
              "--precompiled-dir", str(precompiled),
              "--precompiled-manifest", str(precompiled / "manifest.json"),
              "--manifest", str(work / "manifest.json"),
              "--label", f"raw112-targeted-retry-{group}",
              "--artifact-name", f"raw112-shard-{group}",
          ]
          for item in PROVENANCE_INPUTS:
              cmd.extend(["--provenance-input", item])
          subprocess.run(cmd, check=True)
          PY
              ;;
            *)
              python -u im-results/agent10-raw112-recovery/run_retry_shard.py --group "$GROUP" --root im-results/agent47-raw112-cut --workdir "/tmp/a47-raw112-shard-$GROUP" --precompiled-dir /tmp/a47-raw112-partial-union
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw112-shard-${{ matrix.group }}
          path: /tmp/a47-raw112-shard-${{ matrix.group }}/
          if-no-files-found: warn

  assemble_retry:
    if: inputs.mode == 'retry'
    needs: [prepare_retry, compile_retry]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact Raw112 producer closure-tool provenance
        run: |
          set -euo pipefail
          source_revision=17263f8415b7ad1aa83aa08c7fb8254aa6de5507
          expected_blob_sha=c8eede107294a2dc67846f0899a46307f8f4d304
          git fetch --no-tags origin "$source_revision"
          git show "${source_revision}:tools/lean_compile_closure.py" > /tmp/raw112-lean_compile_closure.py
          actual_blob_sha=$(git hash-object /tmp/raw112-lean_compile_closure.py)
          test "$actual_blob_sha" = "$expected_blob_sha"
          cp /tmp/raw112-lean_compile_closure.py tools/lean_compile_closure.py
          test "$(git hash-object tools/lean_compile_closure.py)" = "$expected_blob_sha"
      - name: Validate pinned retry inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PRIOR_RECOVERY_RUN_ID: ${{ inputs.prior_recovery_run_id }}
          RESUME_RETRY_RUN_ID: ${{ inputs.resume_retry_run_id }}
          RESUME_RETRY_RUN_ID2: ${{ inputs.resume_retry_run_id2 }}
          RETRY_GROUPS_JSON: ${{ inputs.retry_groups }}
        run: |
          set -euo pipefail
          test "$SOURCE_RUN_ID" = 45751911115
          test "$PRIOR_RECOVERY_RUN_ID" = 45787320400
          for id in "$RESUME_RETRY_RUN_ID" "$RESUME_RETRY_RUN_ID2"; do
            if [[ -n "$id" ]]; then [[ "$id" =~ ^[0-9]+$ ]]; fi
          done
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "im-results/agent10-raw112-recovery")
          from configure_retry import RETRY_GROUPS
          selected = json.loads(os.environ["RETRY_GROUPS_JSON"])
          if not isinstance(selected, list) or not selected or len(selected) != len(set(selected)):
              raise SystemExit("retry_groups must be a nonempty JSON array without duplicates")
          if not set(selected) <= set(RETRY_GROUPS):
              raise SystemExit(f"unknown retry groups: {sorted(set(selected) - set(RETRY_GROUPS))}")
          resume_ids = [x.strip() for x in (os.environ.get("RESUME_RETRY_RUN_ID", ""), os.environ.get("RESUME_RETRY_RUN_ID2", "")) if x.strip()]
          if any(not x.isdigit() for x in resume_ids):
              raise SystemExit("resume retry run IDs must be numeric")
          if not resume_ids and set(selected) != set(RETRY_GROUPS):
              raise SystemExit("partial retry_groups selection requires at least one resume_retry_run_id")
          PY
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Reconstruct common generated source dependencies
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
      - uses: actions/download-artifact@v4
        with:
          name: raw112-generated-sources
          path: im-results/agent47-raw112-cut
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: raw112-shard-*
          path: /tmp/a47-raw112-shards
          merge-multiple: false
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: raw112-shard-r*
          path: /tmp/a47-raw112-shards
          merge-multiple: false
          run-id: ${{ inputs.prior_recovery_run_id }}
          github-token: ${{ github.token }}
      - name: Restore already accepted split r05a0 children
        if: ${{ inputs.r05a_split_resume_run_id != '' && inputs.retry_groups == '["r05a0"]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SPLIT_RUN: ${{ inputs.r05a_split_resume_run_id }}
          NEW_CHILDREN: ${{ inputs.r05a_children }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a47-raw112-current-retry
          python3 - <<'PY' > /tmp/a47-r05a-reuse.txt
          import json, os
          new = set(json.loads(os.environ["NEW_CHILDREN"]))
          all_children = {"r05a00", "r05a01", "r05a02", "r05a03"}
          assert new <= all_children and new
          for group in sorted(all_children - new):
              print(group)
          PY
          while read -r group; do
            [ -n "$group" ] || continue
            gh run download "$SPLIT_RUN" \
              --repo "${{ github.repository }}" \
              --name "raw112-shard-$group" \
              --dir "/tmp/a47-raw112-current-retry/raw112-shard-$group"
            test -s "/tmp/a47-raw112-current-retry/raw112-shard-$group/manifest.json"
          done < /tmp/a47-r05a-reuse.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: raw112-shard-r*
          path: /tmp/a47-raw112-current-retry
          merge-multiple: false
      - name: Reassemble the retry groups from current-run carried and new artifacts
        env:
          RETRY_GROUPS_JSON: ${{ inputs.retry_groups }}
        run: |
          set -euo pipefail
          if [ "$RETRY_GROUPS_JSON" = '["r05a0"]' ]; then
            python3 - <<'PY'
          import json, shutil
          from pathlib import Path

          current = Path("/tmp/a47-raw112-current-retry")
          root = Path("im-results/agent47-raw112-cut")
          groups = {}
          for child in ("00", "01", "02", "03"):
              group = f"r05a{child}"
              shard = current / f"raw112-shard-{group}"
              source = shard / f"Raw112Kid05_{child}.lean"
              if not (shard / "manifest.json").is_file() or not source.is_file():
                  raise SystemExit(f"missing accepted split artifact/source for {group}")
              shutil.copy2(source, root / source.name)
              groups[group] = [f"Raw112Kid05_{child}"]
          Path("/tmp/a47-r05a0-split-config.json").write_text(
              json.dumps({
                  "artifact_prefix": "raw112-shard",
                  "allow_mixed_revisions": False,
                  "groups": groups,
              }, indent=2, sort_keys=True) + "\n"
          )
          PY
            rm -rf /tmp/a47-raw112-r05a0-synth
            python im-results/agent4-raw109/merge_shards.py               /tmp/a47-raw112-current-retry               /tmp/a47-raw112-r05a0-synth               /tmp/a47-r05a0-split-config.json
            python3 - <<'PY'
          import json, shutil
          from pathlib import Path

          synth = Path("/tmp/a47-raw112-r05a0-synth")
          manifest_path = synth / "manifest.json"
          manifest = json.loads(manifest_path.read_text())
          manifest["artifact_name"] = "raw112-shard-r05a0"
          manifest["label"] = "raw112-targeted-retry-r05a0-split-union"
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          dest = Path("/tmp/a47-raw112-current-retry/raw112-shard-r05a0")
          shutil.copytree(synth, dest, dirs_exist_ok=True)
          print("Synthesized logical r05a0 shard from four independently accepted roots")
          PY
          fi
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          all_groups = {"r01a-rest0", "r01a-rest1", "r01a-deep", "r04a", "r04b", "r04c", "r05a0", "r05a1"}
          destination = Path("/tmp/a47-raw112-shards")
          current = Path("/tmp/a47-raw112-current-retry")
          for group in sorted(all_groups):
              source = current / f"raw112-shard-{group}"
              if not (source / "manifest.json").is_file():
                  raise SystemExit(f"missing carried or newly compiled shard artifact for {group}")
              shutil.copytree(source, destination / source.name, dirs_exist_ok=True)
          print(f"assembled all {len(all_groups)} retry groups from current-run artifacts")
          PY
      - name: Assemble and audit full Raw112 parent Cover
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PRIOR_RECOVERY_RUN_ID: ${{ inputs.prior_recovery_run_id }}
          RESUME_RETRY_RUN_ID: ${{ inputs.resume_retry_run_id }}
          RESUME_RETRY_RUN_ID2: ${{ inputs.resume_retry_run_id2 }}
          RETRY_GROUPS_JSON: ${{ inputs.retry_groups }}
          R05A_CHILDREN_JSON: ${{ inputs.r05a_children }}
          R05A_SPLIT_RESUME_RUN_ID: ${{ inputs.r05a_split_resume_run_id }}
        run: |
          set -euo pipefail
          if [ "$RETRY_GROUPS_JSON" = '["r05a0"]' ]; then
            python im-results/agent10-raw112-recovery/factor_missing.py im-results/agent47-raw112-cut/Raw112Kid01_01.lean
          else
            python im-results/agent10-raw112-recovery/factor_missing.py im-results/agent47-raw112-cut/Raw112Kid01_01.lean im-results/agent47-raw112-cut/Raw112Kid05_0{0,1,2,3}.lean
          fi
          python -u im-results/agent10-raw112-recovery/assemble_retry.py --root im-results/agent47-raw112-cut --shards /tmp/a47-raw112-shards --union /tmp/a47-raw112-full-union --branch-work /tmp/a47-raw112-branch-roots --parent-work /tmp/a47-raw112-parent --output /tmp/a47-raw112-assembled
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("/tmp/a47-raw112-assembled/retry-summary.json")
          if not path.is_file():
              raise SystemExit("Raw112 assembler did not produce retry-summary.json")
          summary = json.loads(path.read_text())
          selected = sorted(json.loads(os.environ["RETRY_GROUPS_JSON"]))
          all_groups = sorted({"r01a-rest0", "r01a-rest1", "r01a-deep", "r04a", "r04b", "r04c", "r05a0", "r05a1"})
          resume_ids = [int(x) for x in (os.environ.get("RESUME_RETRY_RUN_ID", "").strip(), os.environ.get("RESUME_RETRY_RUN_ID2", "").strip()) if x]
          summary["resumed_from_retry_run_id"] = resume_ids[0] if len(resume_ids) == 1 else None
          summary["resumed_from_retry_run_ids"] = resume_ids
          summary["new_retry_groups"] = selected
          summary["reused_retry_groups"] = sorted(set(all_groups) - set(selected)) if resume_ids else []
          split_resume = os.environ.get("R05A_SPLIT_RESUME_RUN_ID", "").strip()
          summary["r05a_split_resumed_from_run_id"] = int(split_resume) if split_resume else None
          summary["r05a_new_children"] = (
              sorted(json.loads(os.environ["R05A_CHILDREN_JSON"]))
              if selected == ["r05a0"] else []
          )
          path.write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw112-closed-parent-cover
          path: /tmp/a47-raw112-assembled/
          if-no-files-found: warn
