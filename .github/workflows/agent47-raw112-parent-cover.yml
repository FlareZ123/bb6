name: Agent 47 raw112 sharded parent-cover source audit
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [parent, carry, closed]
        default: closed
permissions:
  contents: read
  actions: read
jobs:
  generate_raw112:
    if: inputs.mode == 'parent' || inputs.mode == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact raw112 source partition
        run: |
          set -euo pipefail
          python im-results/agent47-raw112-cut/generate.py | tee /tmp/a47-raw112-generate.log
          test -s im-results/agent47-raw112-cut/Raw112Data.lean
          test -s im-results/agent47-raw112-cut/unresolved.txt
          test -s im-results/agent47-raw112-cut/Raw112ParentCoverComposition.lean
          test "$(find im-results/agent47-raw112-cut -maxdepth 1 -name 'Raw112Branch*.lean' | wc -l)" -eq 24
          echo "=== Exact residual leaves ==="
          cat im-results/agent47-raw112-cut/unresolved.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw112-generated-sources
          path: |
            im-results/agent47-raw112-cut/Raw112Data.lean
            im-results/agent47-raw112-cut/Raw112Branch*.lean
            im-results/agent47-raw112-cut/Raw112Kid*.lean
            im-results/agent47-raw112-cut/Raw112Symbol*.lean
            im-results/agent47-raw112-cut/Raw112Sparse*.lean
            im-results/agent47-raw112-cut/unresolved.txt
            /tmp/a47-raw112-generate.log
          if-no-files-found: error

  compile_shard:
    if: inputs.mode == 'parent' || inputs.mode == 'closed'
    needs: generate_raw112
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Reconstruct common generated source dependencies
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
      - uses: actions/download-artifact@v4
        with:
          name: raw112-generated-sources
          path: im-results/agent47-raw112-cut
      - name: Compile disjoint raw112 branch/support closure shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t branches < <(find im-results/agent47-raw112-cut -maxdepth 1 -type f -name 'Raw112Branch*.lean' | sort)
          test "${#branches[@]}" -eq 24
          roots=()
          if [ "$SHARD" -lt 8 ]; then
            for i in "${!branches[@]}"; do
              if [ $((i % 8)) -eq "$SHARD" ]; then
                roots+=("${branches[$i]}")
              fi
            done
          else
            roots+=(
              im-results/agent47-raw112-cut/Raw112SiblingNever.lean
              im-results/agent16-raw118/ResidualCover.lean
            )
          fi
          if [ "${#roots[@]}" -eq 0 ]; then
            echo "No roots assigned to shard $SHARD" >&2
            exit 1
          fi
          work="/tmp/a47-raw112-shard-$SHARD"
          python tools/lean_compile_closure.py "${roots[@]}" \
            --workdir "$work" \
            --manifest "$work/manifest.json" \
            --label "raw112-shard-$SHARD" \
            --jobs 4 \
            --artifact-name "raw112-shard-$SHARD" \
            --provenance-input im-results/agent47-raw112-cut/generate.py \
            --provenance-input im-results/agent47-raw112-cut/symbolic.py \
            --provenance-input im-results/agent47-raw112-cut/enumerate_fast.cpp \
            --provenance-input im-results/agent47-raw112-cut/far-bank.txt \
            --provenance-input im-results/agent47-raw112-cut/far-extra.txt \
            --provenance-input im-results/agent47-raw112-cut/late.txt \
            --provenance-input im-results/agent47-raw112-cut/ngram.txt \
            --provenance-input im-results/agent47-raw112-cut/inductive-generators.tar.xz \
            --provenance-input im-results/agent47-raw112-cut/Raw112Data.lean \
            --provenance-input im-results/agent47-raw112-cut/unresolved.txt \
            --provenance-input im-results/agent47-raw114-cut/seeded_far.cpp \
            --provenance-input im-results/agent47-raw114-cut/counter.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            --provenance-input im-results/agent47-raw111-cut/ngram_sparse.cpp \
            --provenance-input im-results/agent47-raw111-cut/emit_sparse.py \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent16-raw118/ResidualCover.lean \
            --provenance-input tools/lean_compile_closure.py \
            --provenance-input im-results/agent4-raw109/merge_shards.py \
            --provenance-input im-results/agent4-raw109/audit_axioms.py \
            --provenance-input im-results/agent47-raw112-cut/shard-config.json \
            | tee "/tmp/a47-raw112-shard-$SHARD.log"
          if grep -Eq 'sorryAx|native_decide' "/tmp/a47-raw112-shard-$SHARD.log"; then
            echo "Forbidden axiom/proof mechanism in raw112 shard $SHARD" >&2
            exit 1
          fi
          cp "/tmp/a47-raw112-shard-$SHARD.log" "$work/audit.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw112-shard-${{ matrix.shard }}
          path: /tmp/a47-raw112-shard-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 30

  assemble:
    if: inputs.mode == 'parent' || inputs.mode == 'closed'
    needs: [generate_raw112, compile_shard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Reconstruct common generated source dependencies
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
      - uses: actions/download-artifact@v4
        with:
          name: raw112-generated-sources
          path: im-results/agent47-raw112-cut
      - uses: actions/download-artifact@v4
        with:
          pattern: raw112-shard-*
          path: /tmp/a47-raw112-shards
      - name: Merge source-identical shard closures and compile the parent theorem
        env:
          RAW112_MODE: \${{ inputs.mode }}
        run: |
          set -euo pipefail
          root=im-results/agent47-raw112-cut
          union=/tmp/a47-raw112-union
          work=/tmp/a47-raw112-assembled
          python im-results/agent4-raw109/merge_shards.py \
            /tmp/a47-raw112-shards "$union" "$root/shard-config.json"
          if [ "$RAW112_MODE" = closed ]; then
            module=Raw112ClosedCover
            theorem=BB6.Agent47Raw112.parent_cover
            artifact=raw112-closed-parent-cover
            required_axioms=(
              BB6.Agent47Raw112.sound
              BB6.Agent47Raw112.residual_count
              BB6.Agent47Raw112.residuals_covered
              BB6.Agent47Raw112.parent_cover
            )
          else
            module=Raw112ParentCoverComposition
            theorem=BB6.Agent47Raw112.parent_cover_of_residual_covers
            artifact=raw112-parent-cover-mixed-bound-composition
            required_axioms=(
              BB6.Agent47Raw112.sound
              BB6.Agent47Raw112.residual_count
              BB6.Agent47Raw112.parent_cover_of_residual_covers
            )
          fi
          python tools/lean_compile_closure.py "$root/$module.lean" \
            --workdir "$work" \
            --jobs 4 \
            --precompiled-dir "$union" \
            --precompiled-manifest "$union/manifest.json" \
            --manifest "$work/manifest.json" \
            --label "raw112-$RAW112_MODE" \
            --theorem "$theorem" \
            --parent-table "1RB---_1RC---_0RD---_1LD1RE_---1LC_------" \
            --weighted-bound 100000 \
            --artifact-name "$artifact" \
            --provenance-input "$root/generate.py" \
            --provenance-input "$root/symbolic.py" \
            --provenance-input "$root/enumerate_fast.cpp" \
            --provenance-input "$root/far-bank.txt" \
            --provenance-input "$root/far-extra.txt" \
            --provenance-input "$root/late.txt" \
            --provenance-input "$root/ngram.txt" \
            --provenance-input "$root/inductive-generators.tar.xz" \
            --provenance-input "$root/Raw112Data.lean" \
            --provenance-input "$root/unresolved.txt" \
            --provenance-input im-results/agent47-raw114-cut/seeded_far.cpp \
            --provenance-input im-results/agent47-raw114-cut/counter.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            --provenance-input im-results/agent47-raw111-cut/ngram_sparse.cpp \
            --provenance-input im-results/agent47-raw111-cut/emit_sparse.py \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent16-raw118/ResidualCover.lean \
            --provenance-input tools/lean_compile_closure.py \
            --provenance-input im-results/agent4-raw109/merge_shards.py \
            --provenance-input im-results/agent4-raw109/audit_axioms.py \
            --provenance-input "$root/shard-config.json" \
            2>&1 | tee /tmp/a47-raw112-final.log
          python im-results/agent4-raw109/audit_axioms.py \
            /tmp/a47-raw112-final.log "\${required_axioms[@]}"
          python3 - "$work/manifest.json" "$module" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1]))
          root = sys.argv[2]
          modules = {item["module"] for item in manifest["modules"]}
          required_compiled = {root, "Raw112Data"}
          if not required_compiled <= modules:
              raise SystemExit(f"missing final modules: {sorted(required_compiled - modules)}")
          expected_reused = modules - required_compiled
          core = manifest.get("precompiled_core") or {}
          reused = set(core.get("reused_modules", []))
          if reused != expected_reused:
              raise SystemExit(
                  f"unexpected rebuilt dependencies: missing={sorted(expected_reused - reused)}, "
                  f"extra={sorted(reused - expected_reused)}"
              )
          if core.get("proof_source_revision") != manifest["proof_source_revision"]:
              raise SystemExit("precompiled shard revision differs from final source revision")
          if core.get("lean_binary_sha256") != manifest["lean_binary"]["sha256"]:
              raise SystemExit("precompiled shard compiler differs from final compiler")
          print(f"Reused all {len(expected_reused)} source-identical parent dependencies")
          PY
          cp /tmp/a47-raw112-final.log "$work/audit.log"
          cp "$union/manifest.json" "$work/shard-union.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.mode == 'closed' && 'raw112-closed-parent-cover' || 'raw112-parent-cover-mixed-bound-composition' }}
          path: |
            /tmp/a47-raw112-shards/
            /tmp/a47-raw112-union/
            /tmp/a47-raw112-assembled/
            /tmp/a47-raw112-final.log
            im-results/agent47-raw112-cut/Raw112Data.lean
            im-results/agent47-raw112-cut/Raw112ParentCoverComposition.lean
            im-results/agent47-raw112-cut/Raw112ClosedCover.lean
            im-results/agent47-raw112-cut/Raw112Branch*.lean
            im-results/agent47-raw112-cut/Raw112Kid*.lean
            im-results/agent47-raw112-cut/Raw112Symbol*.lean
            im-results/agent47-raw112-cut/Raw112Sparse*.lean
            im-results/agent47-raw112-cut/unresolved.txt
          if-no-files-found: warn

  carry:
    if: inputs.mode == 'carry'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Unpack original semantics
        run: python im-results/agent13-coverage/unpack.py
      - name: Compile recursive carry nonhalting theorem
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py im-results/agent47-raw112-cut/Raw112SiblingNever.lean im-results/agent31-three-hole-tnf/RightFrame.lean --workdir /tmp/a47-carry --jobs 4 | tee /tmp/a47-carry.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a47-carry.log; then
            exit 1
          fi
      - name: Preserve proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw112-carry-original-source
          path: |
            /tmp/a47-carry/
            /tmp/a47-carry.log
