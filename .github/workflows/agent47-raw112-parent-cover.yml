            r05a) roots=("$root/Raw112Kid05_00.lean" "$root/Raw112Kid05_01.lean" "$root/Raw112Kid05_02.lean" "$root/Raw112Kid05_03.lean" "$root/Raw112Kid05_04.lean" "$root/Raw112Kid05_05.lean" "$root/Raw112Kid05_06.lean" "$root/Raw112Kid05_07.lean");;
