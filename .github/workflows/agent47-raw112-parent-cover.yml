      - uses: actions/download-artifact@v4
        with:
          name: raw112-common-core
          path: /tmp/a47-raw112-core
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Compile one authenticated Sparse39 row
        env:
          ROW: ${{ matrix.row }}
          LEAN_NUM_THREADS: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python3 - "$ROW" <<'PY'
          import shutil, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "im-results/agent10-raw112-recovery")
          from run_retry_shard import PROVENANCE_INPUTS

          row = sys.argv[1]
          root = Path("im-results/agent47-raw112-cut")
          source = root / f"Raw112Sparse39Row{row}.lean"
          if not source.is_file():
              raise SystemExit(f"missing frozen Sparse39 row source: {source}")
          work = Path(f"/tmp/a47-raw112-row-{row}")
          if work.exists():
              shutil.rmtree(work)
          cmd = [
              sys.executable, "-u", "tools/lean_compile_closure.py", str(source),
              "--workdir", str(work), "--jobs", "1",
              "--precompiled-dir", "/tmp/a47-raw112-core",
              "--precompiled-manifest", "/tmp/a47-raw112-core/manifest.json",
              "--manifest", str(work / "manifest.json"),
              "--label", f"raw112-sparse39-row-{row}",
              "--artifact-name", f"raw112-row-{row}",
