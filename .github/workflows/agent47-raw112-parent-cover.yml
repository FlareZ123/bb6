    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate frozen Raw112 inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SPLIT_RUN_ID: ${{ inputs.r05a_split_resume_run_id }}
        run: |
          set -euo pipefail
          test "$SOURCE_RUN_ID" = 45751911115
          test "$SPLIT_RUN_ID" = 46065378088
      - uses: actions/download-artifact@v4
        with:
          name: raw112-generated-sources
          path: im-results/agent47-raw112-cut
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Discover exact Sparse39 row roots
        id: rows
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, sys
          from pathlib import Path
          root = Path("im-results/agent47-raw112-cut")
          rows = []
          for path in sorted(root.glob("Raw112Sparse39Row*.lean")):
              match = re.fullmatch(r"Raw112Sparse39Row(\d+)\.lean", path.name)
              if match:
                  rows.append(match.group(1))
          if not rows:
              raise SystemExit("no Raw112Sparse39Row roots found in frozen generated source")
          if len(rows) != len(set(rows)):
              raise SystemExit("duplicate Sparse39 row suffixes")
          print("rows=" + json.dumps(rows, separators=(",", ":")))
          print(f"Discovered {len(rows)} exact Sparse39 row roots", file=sys.stderr)
          PY

  compile_r05a00_row:
    if: inputs.mode == 'row-retry'
    needs: prepare_r05a00_rows
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        row: ${{ fromJSON(needs.prepare_r05a00_rows.outputs.rows) }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact Raw112 producer closure-tool provenance
        run: |
          set -euo pipefail
          source_revision=17263f8415b7ad1aa83aa08c7fb8254aa6de5507
          expected_blob_sha=c8eede107294a2dc67846f0899a46307f8f4d304
          git fetch --no-tags origin "$source_revision"
          git show "${source_revision}:tools/lean_compile_closure.py" > /tmp/raw112-lean_compile_closure.py
          test "$(git hash-object /tmp/raw112-lean_compile_closure.py)" = "$expected_blob_sha"
          cp /tmp/raw112-lean_compile_closure.py tools/lean_compile_closure.py
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Reconstruct source dependencies
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
      - uses: actions/download-artifact@v4
        with:
          name: raw112-generated-sources
          path: im-results/agent47-raw112-cut
          run-id: ${{ inputs.source_run_id }}
