  prepare_retry:
    if: inputs.mode == 'retry'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact Raw112 producer closure-tool provenance
        run: |
          set -euo pipefail
          source_revision=17263f8415b7ad1aa83aa08c7fb8254aa6de5507
          expected_blob_sha=c8eede107294a2dc67846f0899a46307f8f4d304
          git fetch --no-tags origin "$source_revision"
          git show "${source_revision}:tools/lean_compile_closure.py" > /tmp/raw112-lean_compile_closure.py
          actual_blob_sha=$(git hash-object /tmp/raw112-lean_compile_closure.py)
          test "$actual_blob_sha" = "$expected_blob_sha"
          cp /tmp/raw112-lean_compile_closure.py tools/lean_compile_closure.py
          test "$(git hash-object tools/lean_compile_closure.py)" = "$expected_blob_sha"
      - name: Validate pinned retry inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          PRIOR_RECOVERY_RUN_ID: ${{ inputs.prior_recovery_run_id }}
          RESUME_RETRY_RUN_ID: ${{ inputs.resume_retry_run_id }}
          RESUME_RETRY_RUN_ID2: ${{ inputs.resume_retry_run_id2 }}
          RETRY_GROUPS_JSON: ${{ inputs.retry_groups }}
        run: |
          set -euo pipefail
          test "$SOURCE_RUN_ID" = 45751911115
          test "$PRIOR_RECOVERY_RUN_ID" = 45787320400
          for id in "$RESUME_RETRY_RUN_ID" "$RESUME_RETRY_RUN_ID2"; do
            if [[ -n "$id" ]]; then [[ "$id" =~ ^[0-9]+$ ]]; fi
          done
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, "im-results/agent10-raw112-recovery")
          from configure_retry import RETRY_GROUPS
          selected = json.loads(os.environ["RETRY_GROUPS_JSON"])
          if not isinstance(selected, list) or not selected or len(selected) != len(set(selected)):
              raise SystemExit("retry_groups must be a nonempty JSON array without duplicates")
          if not set(selected) <= set(RETRY_GROUPS):
              raise SystemExit(f"unknown retry groups: {sorted(set(selected) - set(RETRY_GROUPS))}")
          resume_ids = [x.strip() for x in (os.environ.get("RESUME_RETRY_RUN_ID", ""), os.environ.get("RESUME_RETRY_RUN_ID2", "")) if x.strip()]
          if any(not x.isdigit() for x in resume_ids):
              raise SystemExit("resume retry run IDs must be numeric")
          if not resume_ids and set(selected) != set(RETRY_GROUPS):
              raise SystemExit("partial retry_groups selection requires at least one resume_retry_run_id")
          PY
      - name: Reconstruct common generated source dependencies
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
      - uses: actions/download-artifact@v4
        with:
          name: raw112-generated-sources
          path: im-results/agent47-raw112-cut
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: raw112-shard-*
          path: /tmp/a47-raw112-shards
          merge-multiple: false
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: raw112-shard-r*
          path: /tmp/a47-raw112-shards
          merge-multiple: false
          run-id: ${{ inputs.prior_recovery_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.resume_retry_run_id != ''
        with:
          pattern: raw112-shard-r*
          path: /tmp/a47-raw112-prior-retry-1
          merge-multiple: false
          run-id: ${{ inputs.resume_retry_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.resume_retry_run_id2 != ''
        with:
          pattern: raw112-shard-r*
          path: /tmp/a47-raw112-prior-retry-2
          merge-multiple: false
          run-id: ${{ inputs.resume_retry_run_id2 }}
          github-token: ${{ github.token }}
      - name: Build strict partial union from retained artifacts
        env:
          RETRY_GROUPS_JSON: ${{ inputs.retry_groups }}
          RESUME_RETRY_RUN_ID: ${{ inputs.resume_retry_run_id }}
          RESUME_RETRY_RUN_ID2: ${{ inputs.resume_retry_run_id2 }}
        run: |
          set -euo pipefail
          python3 -m py_compile im-results/agent10-raw112-recovery/configure_retry.py im-results/agent10-raw112-recovery/raise_maxrecdepth.py im-results/agent10-raw112-recovery/run_retry_shard.py im-results/agent10-raw112-recovery/assemble_retry.py
          python3 - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, "im-results/agent10-raw112-recovery")
          from configure_retry import build_config, expected_roots, RETRY_GROUPS

          selected = json.loads(os.environ["RETRY_GROUPS_JSON"])
          if not isinstance(selected, list) or not selected or len(selected) != len(set(selected)):
              raise SystemExit("retry_groups must be a nonempty JSON array without duplicates")
          if not set(selected) <= set(RETRY_GROUPS):
              raise SystemExit(f"unknown retry groups: {sorted(set(selected) - set(RETRY_GROUPS))}")
          resume1 = os.environ.get("RESUME_RETRY_RUN_ID", "").strip()
          resume2 = os.environ.get("RESUME_RETRY_RUN_ID2", "").strip()
          resume_ids = [x for x in (resume1, resume2) if x]
          if any(not x.isdigit() for x in resume_ids):
              raise SystemExit("resume retry run IDs must be numeric")
          if not resume_ids and set(selected) != set(RETRY_GROUPS):
              raise SystemExit("a partial retry_groups selection requires at least one resume_retry_run_id")

          reused = sorted(set(RETRY_GROUPS) - set(selected)) if resume_ids else []
          prior_dirs = []
          if resume1:
              prior_dirs.append(Path("/tmp/a47-raw112-prior-retry-1"))
          if resume2:
              prior_dirs.append(Path("/tmp/a47-raw112-prior-retry-2"))
          config = build_config(
              Path("im-results/agent47-raw112-cut/shard-config.json"), "partial"
          )
          if resume_ids:
              destination = Path("/tmp/a47-raw112-shards")
              for group in reused:
                  source = next(
                      (d / f"raw112-shard-{group}" for d in reversed(prior_dirs)
                       if (d / f"raw112-shard-{group}" / "manifest.json").is_file()),
                      None,
                  )
                  if source is None:
                      raise SystemExit(f"missing successful prior retry artifact for {group} in resume runs {resume_ids}")
                  shutil.copytree(source, destination / source.name, dirs_exist_ok=True)
                  config["groups"][group] = RETRY_GROUPS[group]

              # Raw112Kid01_01 is deliberately maxRecDepth-patched inside the accepted
              # r01a-deep shard. When reusing that shard, restore its exact checked
              # source before merge_shards verifies checkout/source identity.
              if "r01a-deep" in reused:
                  deep_source = next(
                      (d / "raw112-shard-r01a-deep" / "Raw112Kid01_01.lean"
                       for d in reversed(prior_dirs)
                       if (d / "raw112-shard-r01a-deep" / "Raw112Kid01_01.lean").is_file()),
                      None,
                  )
                  if deep_source is None:
                      raise SystemExit("missing patched Raw112Kid01_01.lean in resumed r01a-deep shard")
                  shutil.copy2(
                      deep_source,
                      Path("im-results/agent47-raw112-cut/Raw112Kid01_01.lean"),
                  )

          expected = expected_roots("partial")
          for group in reused:
              expected.update(RETRY_GROUPS[group])
          flat = [module for modules in config["groups"].values() for module in modules]
          if len(flat) != len(set(flat)) or set(flat) != expected:
              raise SystemExit(
                  f"partial retry root mismatch: missing={sorted(expected - set(flat))}, "
                  f"extra={sorted(set(flat) - expected)}"
              )
          Path("/tmp/a47-raw112-partial-config.json").write_text(
              json.dumps(config, indent=2, sort_keys=True) + "\n"
          )
          print(f"partial union reuses {len(reused)} prior retry groups; recompiles {selected}")
          PY
          python im-results/agent4-raw109/merge_shards.py /tmp/a47-raw112-shards /tmp/a47-raw112-partial-union /tmp/a47-raw112-partial-config.json
          cp /tmp/a47-raw112-partial-config.json /tmp/a47-raw112-partial-union/partial-config.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw112-recovery-partial-union
          path: /tmp/a47-raw112-partial-union/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: ${{ (inputs.resume_retry_run_id != '' || inputs.resume_retry_run_id2 != '') && !contains(fromJSON(inputs.retry_groups), 'r01a-rest0') }}
        with:
          name: raw112-shard-r01a-rest0
          path: /tmp/a47-raw112-shards/raw112-shard-r01a-rest0/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ (inputs.resume_retry_run_id != '' || inputs.resume_retry_run_id2 != '') && !contains(fromJSON(inputs.retry_groups), 'r01a-rest1') }}
