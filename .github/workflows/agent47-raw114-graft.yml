name: Agent47 shared-core canonical73 raw110/raw112 roster source audit
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exactness:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: d4164a4457e62ba7ec8e3fba6e38b251d04ffc83
          path: pinned
      - name: Install Lean 4.36.0-rc2 and record the actual compiler binary
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p /tmp/a31
          lean --version > /tmp/a31/lean-version.txt
          prefix="$(lean --print-prefix)"
          compiler="$prefix/bin/lean"
          test -x "$compiler"
          printf '%s\n' "$compiler" > /tmp/a31/lean-binary-path.txt
          sha256sum "$compiler" > /tmp/a31/lean-binary.sha256
          cat /tmp/a31/lean-version.txt
          cat /tmp/a31/lean-binary.sha256
      - name: Download the accepted canonical77 and raw114 base artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45554648116
          name: canonical77-certified
          path: /tmp/a47-canonical
      - name: Build a source and object manifest for the accepted canonical core
        run: |
          set -euo pipefail
          cp im-results/agent47-rooted-tnf/CanonicalTwoParentGraft.lean pinned/im-results/agent47-rooted-tnf/
          cp im-results/agent47-rooted-tnf/CanonicalRaw114Accepted.lean pinned/im-results/agent47-rooted-tnf/
          mkdir -p pinned/im-results/agent31-shared-core
          cp im-results/agent31-shared-core/CanonicalTwoParentRosterOnly.lean pinned/im-results/agent31-shared-core/
          cp im-results/agent31-shared-core/Canonical75RosterOnly.lean pinned/im-results/agent31-shared-core/
          cp im-results/agent31-shared-core/Canonical74Raw107Raw114Raw117Raw112RosterOnly.lean pinned/im-results/agent31-shared-core/
          cp im-results/agent47-rooted-tnf/CanonicalRosterRefinement.lean pinned/im-results/agent47-rooted-tnf/
          cp im-results/agent47-rooted-tnf/Canonical73Raw110Composition.lean pinned/im-results/agent47-rooted-tnf/
          rm -rf pinned/im-results/agent8-tnf-raw117
          cp -a im-results/agent8-tnf-raw117 pinned/im-results/
          rm -rf pinned/im-results/agent47-raw112-cut
          cp -a im-results/agent47-raw112-cut pinned/im-results/
          rm -rf pinned/im-results/agent7-raw110
          cp -a im-results/agent7-raw110 pinned/im-results/
          rm -rf pinned/im-results/agent11-raw107
          cp -a im-results/agent11-raw107 pinned/im-results/
          rm -rf pinned/im-results/agent1-raw107
          cp -a im-results/agent1-raw107 pinned/im-results/
          cp tools/lean_compile_closure.py pinned/tools/lean_compile_closure.py
          cd pinned
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 68 72 82
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          cd im-results/agent47-raw114-cut
          python paired_counter.py
          python long_sweep.py
          printf '%s\n' 0LA 0LB 0LC 0LF 0RA 0RB 0RC 0RF 1LA 1LB 1LC 1LF 1RA 1RB 1RC 1RF | xargs -P 4 -I{} python generate_complete.py {}
          python generate_complete.py --combine
          cd ../..
          mkdir -p .tmp/a31
          cat > .tmp/a31/raw114-generator-arguments.txt <<'EOF'
          python im-results/agent13-coverage/unpack.py
          cd im-results/agent47-raw114-cut
          python paired_counter.py
          python long_sweep.py
          printf '%s\n' 0LA 0LB 0LC 0LF 0RA 0RB 0RC 0RF 1LA 1LB 1LC 1LF 1RA 1RB 1RC 1RF | xargs -P 4 -I{} python generate_complete.py {}
          python generate_complete.py --combine
          EOF
          cat > .tmp/a31/canonical-generator-arguments.txt <<'EOF'
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 68 72 82
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          EOF
          for required in CanonicalTwoParentGraft.olean CanonicalRaw114Accepted.olean Raw114CompleteData.olean; do
            test -s "/tmp/a47-canonical/$required"
          done
          python tools/lean_compile_closure.py im-results/agent47-rooted-tnf/CanonicalTwoParentGraft.lean \
            im-results/agent47-rooted-tnf/CanonicalRaw114Accepted.lean \
            --workdir /tmp/a31-canonical-manifest-work \
            --manifest /tmp/a31-canonical-manifest.json \
            --manifest-only \
            --artifact-dir /tmp/a47-canonical \
            --label canonical77-certified \
            --artifact-name canonical77-certified \
            --jobs 8 \
            --provenance-input im-results/agent47-rooted-tnf/CanonicalTwoParentGraft.lean \
            --provenance-input im-results/agent47-rooted-tnf/CanonicalRaw114Accepted.lean \
            --provenance-input im-results/agent47-raw114-cut/generate_complete.py \
            --provenance-input im-results/agent47-raw114-cut/paired_counter.py \
            --provenance-input im-results/agent47-raw114-cut/long_sweep.py \
            --provenance-input im-results/agent47-raw114-cut/raw114-hard-manifest.txt \
            --provenance-input im-results/agent47-raw114-cut/all-far-bank.txt \
            --provenance-input im-results/agent10-tnf-multipump/multi.py \
            --provenance-input im-results/agent1-ngram/emit_ngram.py \
            --provenance-input .tmp/a31/raw114-generator-arguments.txt \
            --provenance-input .tmp/a31/canonical-generator-arguments.txt \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
            --provenance-input im-results/agent10-tnf-raw87/generate.py \
            --provenance-input im-results/agent10-tnf-raw91/generate.py \
            --provenance-input im-results/agent10-tnf-multipump/generate.py \
            --provenance-input im-results/agent47-raw114-cut/paired_counter.py \
            --provenance-input im-results/agent47-raw114-cut/long_sweep.py \
            --provenance-input im-results/agent47-raw114-cut/generate_complete.py \
            --provenance-input im-results/agent47-raw114-cut/Raw114CompleteData.lean \
            --provenance-input .tmp/a31/canonical-generator-arguments.txt \
            --provenance-input /tmp/a31/lean-version.txt \
            --provenance-input /tmp/a31/lean-binary.sha256
      - name: Generate raw107 and compile its parent closure against the accepted core
        run: |
          set -euo pipefail
          cd pinned
          root=im-results/agent11-raw107
          python "$root/generate.py"
          python "$root/generate_rc.py"
          python "$root/generate_re.py"
          python "$root/generate_more.py" 1RE 1LC 1LE 1LB 0RF 1RF 0LE
          python "$root/generate_partial.py" 0LF 1LA 1LF
          for prefix in Raw107RD Raw107RC Raw107RE Raw107B1RE Raw107B1LC Raw107B1LE Raw107B1LB Raw107B0RF Raw107B1RF Raw107B0LE Raw107B0LF Raw107B1LA Raw107B1LF; do
            python im-results/agent10-tnf-multipump/chunk_checks.py "$root" "$prefix" --limit 180
          done
          mkdir -p .tmp/a31 .tmp/a31-shared /tmp/a31-shared
          cat > .tmp/a31-shared/generator-arguments.txt <<'EOF'
          python im-results/agent11-raw107/generate.py
          python im-results/agent11-raw107/generate_rc.py
          python im-results/agent11-raw107/generate_re.py
          python im-results/agent11-raw107/generate_more.py 1RE 1LC 1LE 1LB 0RF 1RF 0LE
          python im-results/agent11-raw107/generate_partial.py 0LF 1LA 1LF
          for prefix in Raw107RD Raw107RC Raw107RE Raw107B1RE Raw107B1LC Raw107B1LE Raw107B1LB Raw107B0RF Raw107B1RF Raw107B0LE Raw107B0LF Raw107B1LA Raw107B1LF; do
            python im-results/agent10-tnf-multipump/chunk_checks.py "$root" "$prefix" --limit 180
          done
          EOF
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path("im-results/agent11-raw107")
          files = sorted(p for p in root.iterdir() if p.is_file())
          hashes = {
              p.name: hashlib.sha256(p.read_bytes()).hexdigest()
              for p in files if p.suffix in {".lean", ".py", ".txt", ".csv"}
          }
          provenance = {
              "accepted_source_audit_run_id": 45533196624,
              "accepted_source_revision": "1cea9dacc5a369bdd96a674486b642c45e7a59c4",
              "build_checkout_revision": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "copied_raw107_file_sha256": hashes,
          }
          pathlib.Path(".tmp/a31/raw107-source-provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n"
          )
          PY
          python tools/lean_compile_closure.py \
            "$root/Raw107ParentClosure.lean" \
            --workdir /tmp/a31-shared \
            --manifest /tmp/a31-shared-manifest.json \
            --label canonical77-raw107-shared-core \
            --jobs 4 \
            --precompiled-manifest /tmp/a31-canonical-manifest.json \
            --precompiled-dir /tmp/a47-canonical \
            --theorem BB6.Agent11Raw107ParentClosure.all_completions \
            --weighted-bound 815 \
            --artifact-name raw107-canonical-shared-core \
            --provenance-input im-results/agent11-raw107/Raw107ParentClosure.lean \
            --provenance-input im-results/agent11-raw107/Raw107RootCut.lean \
            --provenance-input im-results/agent1-raw107/Raw107LABridge.lean \
            --provenance-input im-results/agent1-raw107/Raw107LAUnary.lean \
            --provenance-input im-results/agent11-raw107/bank.cpp \
            --provenance-input im-results/agent11-raw107/bank.txt \
            --provenance-input im-results/agent11-raw107/specs_more.json \
            --provenance-input im-results/agent11-raw107/specs_partial.json \
            --provenance-input im-results/agent11-raw107/generate.py \
            --provenance-input im-results/agent11-raw107/generate_rc.py \
            --provenance-input im-results/agent11-raw107/generate_re.py \
            --provenance-input im-results/agent11-raw107/generate_more.py \
            --provenance-input im-results/agent11-raw107/generate_partial.py \
            --provenance-input im-results/agent10-tnf-multipump/chunk_checks.py \
            --provenance-input im-results/agent10-tnf-multipump/generate.py \
            --provenance-input .tmp/a31-shared/generator-arguments.txt \
            --provenance-input .tmp/a31/raw107-source-provenance.json \
            --provenance-input /tmp/a31-canonical-manifest.json \
            --provenance-input /tmp/a31/lean-version.txt \
            --provenance-input /tmp/a31/lean-binary.sha256 \
            --override OuterLCIncPrelude=im-results/agent8-counted-reset/OuterLCIncPrelude.lean \
            --override M0OddResidueSeven=im-results/agent41-m0-n16r7/M0OddResidueSeven.lean \
            --override M0EvenEightValuationEncoding=im-results/agent48-counted-inc0/M0EvenEightValuationEncoding.lean \
            --override M2EvenResidueTwo=im-results/agent42-champion-terminal/M2EvenResidueTwo.lean \
            2>&1 | tee /tmp/a31-shared.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a31-shared.log; then
            exit 1
          fi
      - name: Preserve reusable raw107 shared-core artifact before consumer compilation
        run: |
          set -euo pipefail
          mkdir -p /tmp/a31-shared/manifest
          cp /tmp/a31-canonical-manifest.json /tmp/a31-shared/manifest/canonical77-base-manifest.json
          cp /tmp/a31-shared-manifest.json /tmp/a31-shared/manifest/raw107-shared-manifest.json
          cp "$GITHUB_WORKSPACE/pinned/.tmp/a31/raw107-source-provenance.json" /tmp/a31-shared/manifest/
          cp "$GITHUB_WORKSPACE/pinned/.tmp/a31/raw114-generator-arguments.txt" /tmp/a31-shared/manifest/
          cp "$GITHUB_WORKSPACE/pinned/.tmp/a31/canonical-generator-arguments.txt" /tmp/a31-shared/manifest/
          cp "$GITHUB_WORKSPACE/pinned/.tmp/a31-shared/generator-arguments.txt" /tmp/a31-shared/manifest/
          cp /tmp/a31/lean-version.txt /tmp/a31-shared/manifest/
          cp /tmp/a31/lean-binary-path.txt /tmp/a31-shared/manifest/
          cp /tmp/a31/lean-binary.sha256 /tmp/a31-shared/manifest/
      - uses: actions/upload-artifact@v4
        with:
          name: raw107-canonical-shared-core
          path: /tmp/a31-shared
          if-no-files-found: error
          retention-days: 14
      - name: Compile the champion-independent two-parent roster and audit its axiom profile
        run: |
          set -euo pipefail
          cp im-results/agent47-rooted-tnf/CanonicalRaw114Accepted.lean /tmp/a31-shared/
          cp im-results/agent31-shared-core/CanonicalTwoParentRosterOnly.lean /tmp/a31-shared/
          cd /tmp/a31-shared
          export LEAN_PATH="$PWD:/tmp/a47-canonical"
          test -s /tmp/a47-canonical/CanonicalTwoParentGraft.olean
          test -s /tmp/a47-canonical/CanonicalRaw114Accepted.olean
          test -s /tmp/a47-canonical/Raw114CompleteData.olean
          test -s "$PWD/Raw107ParentClosure.olean"
          sha_before=$(sha256sum /tmp/a47-canonical/CanonicalRaw114Accepted.olean | cut -d' ' -f1)
          lean -o CanonicalRaw114Accepted.olean CanonicalRaw114Accepted.lean 2>&1 | tee /tmp/a31-raw114-adapter.log
          sha_after=$(sha256sum CanonicalRaw114Accepted.olean | cut -d' ' -f1)
          printf 'CanonicalRaw114Accepted.olean before=%s after=%s\n' "$sha_before" "$sha_after"
          lean -o CanonicalTwoParentRosterOnly.olean CanonicalTwoParentRosterOnly.lean 2>&1 | tee /tmp/a31-roster.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a31-shared.log /tmp/a31-raw114-adapter.log /tmp/a31-roster.log; then
            exit 1
          fi
          python3 - /tmp/a31-shared.log /tmp/a31-raw114-adapter.log /tmp/a31-roster.log <<'PY'
          import pathlib, re, sys
          logs = "\n".join(pathlib.Path(p).read_text() for p in sys.argv[1:])
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          required = (
              "BB6.Agent11Raw107ParentClosure.all_completions",
              "BB6.Agent47CanonicalRaw114Accepted.parent_bound",
              "BB6.Agent47CanonicalRaw114Accepted.sound",
              "BB6.Agent31CanonicalTwoParentRosterOnly.p107_matches_raw107",
              "BB6.Agent31CanonicalTwoParentRosterOnly.p107_bound",
              "BB6.Agent31CanonicalTwoParentRosterOnly.p114_bound",
              "BB6.Agent31CanonicalTwoParentRosterOnly.roster76_sound",
              "BB6.Agent31CanonicalTwoParentRosterOnly.exact_at_target",
          )
          profiles = {}
          for name, axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]", logs):
              profiles[name] = {x.strip() for x in axioms.split(",") if x.strip()}
          for name in required:
              if name not in profiles:
                  raise SystemExit("missing axiom profile: " + name)
              bad = profiles[name] - allowed
              if bad:
                  raise SystemExit(f"{name}: unexpected axioms {sorted(bad)}")
              print(f"{name}: {sorted(profiles[name])}")
          pathlib.Path("manifest").mkdir(exist_ok=True)
          pathlib.Path("manifest/axiom-profiles.json").write_text(
              __import__("json").dumps(
                  {name: sorted(profiles[name]) for name in required},
                  indent=2, sort_keys=True
              ) + "\n"
          )
          PY
          mkdir -p manifest
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(".")
          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          base = json.loads((root / "manifest/canonical77-base-manifest.json").read_text())
          shared = json.loads((root / "manifest/raw107-shared-manifest.json").read_text())
          base_modules = {entry["module"]: entry for entry in base["modules"]}
          shared_modules = {entry["module"]: entry for entry in shared["modules"]}
          required_base = ("CanonicalTwoParentGraft", "CanonicalRaw114Accepted", "Raw114CompleteData")
          missing_base = [name for name in required_base if name not in base_modules]
          if missing_base:
              raise SystemExit("missing accepted base manifest modules: " + ", ".join(missing_base))
          if "Raw107ParentClosure" not in shared_modules:
              raise SystemExit("missing Raw107ParentClosure in raw107 shared manifest")
          metadata = {
              "claim": "At any B>=7014, exactness reduces to Covers for 76 residual quotient representatives plus an attaining blank-start witness; this is not a completed BB(6) upper bound.",
              "theorem": "BB6.Agent31CanonicalTwoParentRosterOnly.exact_at_target",
              "residual_count": 76,
              "weighted_bound": 7014,
              "canonical77_artifact_run_id": 45554648116,
              "canonical77_artifact_id": 14997966221,
              "canonical77_artifact_head_sha": "1217c6166525b6297191a35f2627eeea5691f17f",
              "raw114_source_acceptance_run_id": 45553564319,
              "raw107_source_acceptance_run_id": 45533196624,
              "raw107_source_reference_revision": "1cea9dacc5a369bdd96a674486b642c45e7a59c4",
              "build_source_revision": os.environ.get("GITHUB_SHA"),
              "canonical_core_source_revision": base["proof_source_revision"],
              "lean_version": shared["lean_version"],
              "lean_binary_sha256": shared["lean_binary"]["sha256"],
              "precompiled_reused_module_count": shared["precompiled_core"]["reused_module_count"],
              "precompiled_reused_modules": shared["precompiled_core"]["reused_modules"],
              "modules": {
                  "CanonicalTwoParentGraft": {
                      "source_sha256": base_modules["CanonicalTwoParentGraft"]["source_sha256"],
                      "olean_sha256": base_modules["CanonicalTwoParentGraft"]["olean_sha256"],
                  },
                  "CanonicalRaw114Accepted": {
                      "source_sha256": base_modules["CanonicalRaw114Accepted"]["source_sha256"],
                      "accepted_artifact_olean_sha256": base_modules["CanonicalRaw114Accepted"]["olean_sha256"],
                      "shared_core_olean_sha256": digest(root / "CanonicalRaw114Accepted.olean"),
                  },
                  "Raw114CompleteData": {
                      "source_sha256": base_modules["Raw114CompleteData"]["source_sha256"],
                      "olean_sha256": base_modules["Raw114CompleteData"]["olean_sha256"],
                  },
                  "Raw107ParentClosure": {
                      "source_sha256": shared_modules["Raw107ParentClosure"]["source_sha256"],
                      "olean_sha256": shared_modules["Raw107ParentClosure"]["olean_sha256"],
                  },
                  "CanonicalTwoParentRosterOnly": {
                      "source_sha256": digest(root / "CanonicalTwoParentRosterOnly.lean"),
                      "olean_sha256": digest(root / "CanonicalTwoParentRosterOnly.olean"),
                  },
              },
          }
          (root / "manifest/canonical76-base.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n"
          )
          entries = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              if path.name == "artifact-tree.sha256":
                  continue
              entries.append(f"{digest(path)}  {path.relative_to(root).as_posix()}\n")
          tree_digest = hashlib.sha256("".join(entries).encode()).hexdigest()
          (root / "manifest/canonical76-base-tree.sha256").write_text(tree_digest + "\n")
          print(json.dumps({
              "residual_count": 76,
              "precompiled_reused_module_count": metadata["precompiled_reused_module_count"],
              "artifact_tree_sha256": tree_digest,
          }, indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: canonical73-raw110-raw112-roster-consumer-certified
          path: |
            /tmp/a31-shared
            /tmp/a31-raw117
            /tmp/a31-consumer
            /tmp/a47-raw112
            /tmp/a47-raw110
          if-no-files-found: error

  canonical72:
    name: Source-audit champion-independent 72-residual roster
    needs: exactness
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Download the source-accepted canonical two-parent base
        uses: actions/download-artifact@v4
        with:
          name: canonical73-raw110-raw112-roster-consumer-certified
          path: /tmp/a31-base
      - name: Regenerate raw117, raw113, raw115 and raw119 source data
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent8-tnf-raw117/generate.py
          python im-results/agent25-raw113/generate.py
          python im-results/agent8-tnf-six/generate.py
      - name: Compile the 72-residual roster against the accepted shared core
        run: |
          set -euo pipefail
          test -s /tmp/a31-base/manifest/raw107-shared-manifest.json
          python tools/lean_compile_closure.py \
            im-results/agent8-tnf-raw117/Canonical72RosterOnly.lean \
            --workdir /tmp/a31-canonical72 \
            --manifest /tmp/a31-canonical72-manifest.json \
            --label canonical72-roster-only \
            --theorem BB6.Agent8Canonical72RosterOnly.exact_at_target \
            --weighted-bound 7014 \
            --artifact-name canonical72-roster-only-certified \
            --jobs 8 \
            --precompiled-manifest /tmp/a31-base/manifest/raw107-shared-manifest.json \
            --precompiled-dir /tmp/a31-base \
            --override Raw115Base=im-results/agent8-tnf-six/raw115/Raw115Base.lean \
            --provenance-input im-results/agent8-tnf-raw117/Canonical72RosterOnly.lean \
            --provenance-input im-results/agent8-tnf-raw117/generate.py \
            --provenance-input im-results/agent25-raw113/generate.py \
            --provenance-input im-results/agent25-raw113/spec.json \
            --provenance-input im-results/agent8-tnf-six/generate.py \
            --provenance-input im-results/agent8-tnf-six/bank.cpp \
            --provenance-input im-results/agent31-three-hole-tnf/generate_sweeps.py \
            --provenance-input im-results/agent31-three-hole-tnf/generate_four_hole.py \
