name: Agent 47 ingest accepted raw114 into canonical frontier
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  graft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: d4164a4457e62ba7ec8e3fba6e38b251d04ffc83
          path: pinned
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45553564319
          name: raw114-certified-root
          path: /tmp/a47-raw114-certified
      - name: Build canonical frontier from the same pinned source
        run: |
          set -euo pipefail
          cp im-results/agent47-rooted-tnf/CanonicalTwoParentGraft.lean pinned/im-results/agent47-rooted-tnf/
          cd pinned
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 68 72 82
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          work="$PWD/.tmp/a47-canonical"
          mkdir -p "$work/imports"
          python3 - <<'PY'
          import base64, io, lzma, pathlib, tarfile
          root = pathlib.Path(".tmp/a47-canonical/imports")
          p = pathlib.Path("im-results/agent42-champion-terminal")
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode((p/"TerminalProofs.tar.xz.b64").read_text())), mode="r:xz") as a:
              member = next(m for m in a.getmembers() if pathlib.PurePosixPath(m.name).name == "TerminalFinish.lean")
              (root/"TerminalFinish.lean").write_bytes(a.extractfile(member).read())
          (root/"TerminalLeft.lean").write_bytes(lzma.decompress(base64.b64decode((p/"TerminalLeftExact.lean.xz.b64").read_text())))
          PY
          printf '%s  %s\n' 12329036c66c3846f9261167b8f9aebd1778d9b6ea6044309956c2fa0b3e49b7 "$work/imports/TerminalFinish.lean" | sha256sum -c -
          printf '%s  %s\n' 1bce2075fc4e0cd7d740fb71b3796088b190ddb6766e04640d992dadd1b650ff "$work/imports/TerminalLeft.lean" | sha256sum -c -
          python tools/lean_compile_closure.py --workdir /tmp/a47-canonical --source-root "$work/imports" --jobs 4 im-results/agent47-rooted-tnf/CanonicalTwoParentGraft.lean im-results/agent48-counted-inc0/TM63RawUpperInterface.lean --override TerminalBridge=im-results/agent42-champion-terminal/TerminalBridge.lean --override OuterLCIncPrelude=im-results/agent8-counted-reset/OuterLCIncPrelude.lean --override M0OddResidueSeven=im-results/agent41-m0-n16r7/M0OddResidueSeven.lean --override M0EvenEightValuationEncoding=im-results/agent48-counted-inc0/M0EvenEightValuationEncoding.lean --override M2EvenResidueTwo=im-results/agent42-champion-terminal/M2EvenResidueTwo.lean | tee /tmp/a47-canonical.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a47-canonical.log; then exit 1; fi
      - name: Link the accepted cylinder theorem, check count and composition
        run: |
          set -euo pipefail
          cp im-results/agent47-rooted-tnf/CanonicalRaw114Accepted.lean /tmp/a47-canonical/
          cp im-results/agent47-rooted-tnf/Canonical77ExactComposition.lean /tmp/a47-canonical/
          cp -n /tmp/a47-raw114-certified/*.olean /tmp/a47-canonical/
          cd /tmp/a47-canonical
          export LEAN_PATH="$PWD"
          lean -o CanonicalRaw114Accepted.olean CanonicalRaw114Accepted.lean | tee /tmp/a47-graft.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a47-graft.log; then exit 1; fi
          lean -o Canonical77ExactComposition.olean Canonical77ExactComposition.lean | tee /tmp/a47-exact77.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a47-exact77.log; then exit 1; fi
          python3 - /tmp/a47-exact77.log <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in ("champion_score_gt_7014", "champion_raw_witness",
                       "BB6.Agent47CanonicalRaw114Accepted.exact_at_target",
                       "exact_from_canonical77_at_champion_score"):
              m = re.search(r"'[^']*"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]", log)
              if not m:
                  raise SystemExit("missing axiom audit: "+name)
              used = {x.strip() for x in m.group(1).split(",") if x.strip()}
              if not used <= allowed:
                  raise SystemExit(f"nonstandard axioms in {name}: {used-allowed}")
              print(f"{name}: {sorted(used)}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: canonical77-certified
          path: /tmp/a47-canonical/*.olean
          if-no-files-found: error
