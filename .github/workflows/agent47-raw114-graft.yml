          manifest = pathlib.Path("/tmp/a31-canonical72-manifest.json")
          olean = work / "BB6/Agent8Canonical72RosterOnly.olean"
          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
