name: Agent 47 Raw114 holdouts and Raw11 q0 route audit
on:
  workflow_dispatch:
    inputs:
      raw111:
        description: Check the raw111 shallow certificate and prefix partial checker
        type: boolean
        default: false
      raw11_q0_route:
        description: Compile the exact Raw11 route with the accepted root39 Cover consumed
        type: boolean
        default: false
      raw11_q0_root52:
        description: Rebuild q0 root52's 4663 Cover from its pinned source artifact and consume it after root39
        type: boolean
        default: false
      raw11_q0_extra_covers:
        description: Compile all 33 Raw11-extra Covers plus q0 parents 33, 49 and 51 after root39 and root52
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  holdouts:
    if: ${{ !inputs.raw111 && !inputs.raw11_q0_route && !inputs.raw11_q0_root52 && !inputs.raw11_q0_extra_covers }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Source-check binary, paired-word and long-sweep residual proofs
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          cd im-results/agent47-raw114-cut
          python paired_counter.py
          python long_sweep.py
          cd ../..
          roots=(im-results/agent47-raw114-cut/Raw114Binary.lean im-results/agent47-raw114-cut/Raw114Pair{0,1,2,3,4}.lean im-results/agent47-raw114-cut/Raw114LongSweep.lean im-results/agent47-raw114-cut/Raw114Triple.lean)
          python tools/lean_compile_closure.py --workdir /tmp/a47-raw114-holdouts --jobs 4 "${roots[@]}" | tee /tmp/a47-raw114-holdouts.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a47-raw114-holdouts.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw114-holdouts
          path: /tmp/a47-raw114-holdouts/*.olean
          if-no-files-found: error

  raw111-preflight:
    if: ${{ inputs.raw111 && !inputs.raw11_q0_route && !inputs.raw11_q0_root52 && !inputs.raw11_q0_extra_covers }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check raw111 partial checker
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py --workdir /tmp/a47-raw111 --jobs 4 im-results/agent47-raw111-cut/Raw111Prefix.lean im-results/agent47-raw111-cut/Raw111Ternary.lean im-results/agent47-raw111-cut/Raw111Triplet.lean im-results/agent47-raw111-cut/Raw111QuadCounter.lean im-results/agent47-raw111-cut/Raw111TripleCounter.lean | tee /tmp/a47-raw111.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a47-raw111.log; then exit 1; fi

  raw11-q0-route:
    if: ${{ inputs.raw11_q0_route && !inputs.raw11_q0_root52 && !inputs.raw11_q0_extra_covers }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct the pinned coverage contract
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
      - name: Compile exact Raw11 route and root39 consumer
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py \
            im-results/agent47-raw11-adapter/Raw11Root39Consume.lean \
            --workdir /tmp/a47-raw11-root39 \
            --manifest /tmp/a47-raw11-root39/manifest.json \
            --jobs 2 \
            --lean lean \
            --label raw11-root39-consumption \
            --theorem BB6.Agent47Raw11Root39Consume.cover_from_remaining \
            --provenance-input tools/lean_compile_closure.py \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            2>&1 | tee /tmp/a47-raw11-root39.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a47-raw11-root39.log; then
            echo "::error::forbidden axiom/proof mechanism in Raw11 root39 consumer"
            exit 1
          fi
          grep -q "BB6.Agent47Raw11Root39Consume.cover_from_remaining" /tmp/a47-raw11-root39.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-root39-consumption
          path: /tmp/a47-raw11-root39/
          if-no-files-found: warn
          retention-days: 30

  raw11-q0-root52:
    if: ${{ inputs.raw11_q0_root52 && !inputs.raw11_q0_extra_covers }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45872082943
          name: raw11-root39-consumption
          path: /tmp/a47-root39-precompiled
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45792833561
          name: q0-root52-generated-source
          path: /tmp/q0-root52-rocq
      - name: Reconstruct the pinned coverage contract and generate root52 Lean shards
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          manifest="$(find /tmp/q0-root52-rocq -name q0-auto-candidate.json -print -quit)"
          test -n "$manifest"
          src="$(dirname "$manifest")"
          python im-results/agent5-weighted-tnf-queue/generate_q0_exhaustive_lean.py "$src" /tmp/q0-root52-lean --chunk 49
          test -s /tmp/q0-root52-lean/Q0Root52Base.lean
          test -s /tmp/q0-root52-lean/Q0Root52Long.lean
          test -s /tmp/q0-root52-lean/Q0Root52Parent.lean
          find "$src" -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/q0-root52-source.sha256
      - name: Compile root52 and consume it from the 293-entry Raw11 roster
        run: |
          set -euo pipefail
          provenance=(
            --provenance-input tools/lean_compile_closure.py
            --provenance-input im-results/agent13-coverage/unpack.py
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64
            --provenance-input im-results/agent5-weighted-tnf-queue/generate_q0_exhaustive_lean.py
            --provenance-input im-results/agent5-weighted-tnf-queue/q0_trace_emit.py
            --provenance-input im-results/agent5-weighted-tnf-queue/Q0ExhaustiveTree.lean
            --provenance-input im-results/agent5-weighted-tnf-queue/Q0Trace.lean
            --provenance-input /tmp/q0-root52-source.sha256
            --provenance-input /tmp/a47-root39-precompiled/manifest.json
          )
          python tools/lean_compile_closure.py \
            im-results/agent47-raw11-adapter/Raw11Root52Consume.lean \
            --source-root /tmp/q0-root52-lean \
            --workdir /tmp/a47-raw11-root52 \
            --manifest /tmp/a47-raw11-root52/manifest.json \
            --precompiled-manifest /tmp/a47-root39-precompiled/manifest.json \
            --precompiled-dir /tmp/a47-root39-precompiled \
            --jobs 2 \
            --lean lean \
            --label raw11-root52-consumption \
            --theorem BB6.Agent47Raw11Root52Consume.cover_from_remaining \
            "${provenance[@]}" \
            2>&1 | tee /tmp/a47-raw11-root52.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a47-raw11-root52.log; then
            echo "::error::forbidden axiom/proof mechanism in Raw11 root52 consumer"
            exit 1
          fi
          grep -q "Q0Root52.safe_root" /tmp/a47-raw11-root52.log
          grep -q "BB6.Agent47Raw11Root52Consume.cover_from_remaining" /tmp/a47-raw11-root52.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-root52-consumption
          path: |
            /tmp/a47-raw11-root52/
            /tmp/a47-raw11-root52.log
            /tmp/q0-root52-lean/
            /tmp/q0-root52-source.sha256
          if-no-files-found: warn
          retention-days: 30

  raw11-q0-extra-covers:
    if: ${{ inputs.raw11_q0_extra_covers }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45873233270
          name: raw11-root52-consumption
          path: /tmp/a47-root52-precompiled
      - name: Reconstruct coverage contract source
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
      - name: Generate Raw11 extra parent 92 and 124 Covers
        run: |
          set -euo pipefail
          node im-results/agent47-raw11-adapter/generate-raw11-extra-external.cjs
          test -s im-results/agent47-raw11-adapter/Raw11Extra92.lean
          test -s im-results/agent47-raw11-adapter/Raw11Extra124.lean
          cat im-results/agent47-raw11-adapter/raw11-extra-external-manifest.json
      - name: Compile 35 extra Covers and q0 parents 33, 49 and 51
        run: |
          set -euo pipefail
          provenance=(
            --provenance-input tools/lean_compile_closure.py
            --provenance-input im-results/agent13-coverage/unpack.py
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64
            --provenance-input im-results/agent47-raw11-adapter/raw11-extra.json
            --provenance-input im-results/agent47-raw11-adapter/raw11-route.json
            --provenance-input im-results/agent47-raw11-adapter/generate-raw11-extra.cjs
            --provenance-input im-results/agent47-raw11-adapter/generate-raw11-extra-external.cjs
            --provenance-input im-results/agent47-raw11-adapter/generate-q0-lean.cjs
            --provenance-input im-results/agent47-raw11-adapter/Raw11ExtraExternalLeaves.lean
            --provenance-input im-results/agent47-raw11-adapter/Raw11Extra92.lean
            --provenance-input im-results/agent47-raw11-adapter/Raw11Extra124.lean
            --provenance-input im-results/agent47-raw11-adapter/raw11-extra-external-manifest.json
            --provenance-input im-results/agent5-weighted-tnf-queue/Raw11ExtraFamily.lean
            --provenance-input im-results/agent5-weighted-tnf-queue/Raw11ExtraFamilySeed.lean
            --provenance-input im-results/agent5-weighted-tnf-queue/Raw11ExtraFamilyCoverage.lean
            --provenance-input im-results/agent5-weighted-tnf-queue/Raw11ExtraSweep.lean
            --provenance-input im-results/agent5-weighted-tnf-queue/Raw11ExtraSweepCoverage.lean
            --provenance-input im-results/agent5-weighted-tnf-queue/Root56.lean
            --provenance-input im-results/agent5-weighted-tnf-queue/Root56Coverage.lean
            --provenance-input im-results/agent5-weighted-tnf-queue/raw11-extra-92-witness.json
            --provenance-input im-results/agent5-weighted-tnf-queue/raw11-extra-124-witness.json
            --provenance-input im-results/agent5-weighted-tnf-queue/coarse-pair.cjs
            --provenance-input im-results/agent5-weighted-tnf-queue/q0-source-mitm-cert.cjs
            --provenance-input im-results/agent5-weighted-tnf-queue/q0-open-automata.json
            --provenance-input im-results/agent47-raw11-adapter/Raw11ExtraSmall.lean
            --provenance-input im-results/agent47-raw11-adapter/Raw11Extra91.lean
            --provenance-input im-results/agent47-raw11-adapter/Raw11Extra123.lean
            --provenance-input im-results/agent47-raw11-adapter/Raw11Root52Consume.lean
            --provenance-input im-results/agent47-raw11-adapter/Raw11Root52ExtrasConsume.lean
            --provenance-input im-results/agent47-raw11-adapter/Raw11Root52Q0ParentsConsume.lean
            --provenance-input im-results/agent47-raw11-adapter/Root33Lean.lean
            --provenance-input im-results/agent47-raw11-adapter/Root49Lean.lean
            --provenance-input im-results/agent47-raw11-adapter/Root49LeanBase.lean
            --provenance-input im-results/agent47-raw11-adapter/Root51Lean.lean
            --provenance-input im-results/agent47-raw11-adapter/Root51LeanBase.lean
            --provenance-input im-results/agent5-weighted-tnf-queue/Q0RosterConsume.lean
            --provenance-input /tmp/a47-root52-precompiled/q0-root52-source.sha256
            --provenance-input /tmp/a47-root52-precompiled/a47-raw11-root52/manifest.json
          )
          for part in 0 1 2 3 4 5 6; do
            provenance+=(--provenance-input "im-results/agent47-raw11-adapter/Root49LeanPart${part}.lean")
          done
          for part in 0 1 2 3 4 5 6 7; do
            provenance+=(--provenance-input "im-results/agent47-raw11-adapter/Root51LeanPart${part}.lean")
          done
          python tools/lean_compile_closure.py \
            im-results/agent47-raw11-adapter/Raw11Root52Q0ParentsConsume.lean \
            --source-root /tmp/a47-root52-precompiled/q0-root52-lean \
            --workdir /tmp/a47-raw11-root52-known \
            --manifest /tmp/a47-raw11-root52-known/manifest.json \
            --precompiled-manifest /tmp/a47-root52-precompiled/a47-raw11-root52/manifest.json \
            --precompiled-dir /tmp/a47-root52-precompiled/a47-raw11-root52 \
            --jobs 2 \
            --lean lean \
            --label raw11-root52-plus-33-extras-plus-q0-parents \
            --theorem BB6.Agent47Raw11Root52Q0ParentsConsume.cover_from_remaining \
            "${provenance[@]}" \
            2>&1 | tee /tmp/a47-raw11-root52-known.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a47-raw11-root52-known.log; then
            echo "::error::forbidden axiom/proof mechanism in Raw11 combined consumer"
            exit 1
          fi
          grep -q "BB6.Agent47Raw11Root52Q0ParentsConsume.cover_from_remaining" /tmp/a47-raw11-root52-known.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-root52-known-consumption
          path: |
            /tmp/a47-raw11-root52-known/
            /tmp/a47-raw11-root52-known.log
            /tmp/a47-root52-precompiled/q0-root52-lean/
            /tmp/a47-root52-precompiled/q0-root52-source.sha256
            im-results/agent47-raw11-adapter/Raw11Extra92.lean
            im-results/agent47-raw11-adapter/Raw11Extra124.lean
            im-results/agent47-raw11-adapter/raw11-extra-external-manifest.json
          if-no-files-found: warn
          retention-days: 30
