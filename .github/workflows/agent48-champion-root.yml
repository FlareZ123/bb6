name: Agent 48 original champion-root six-step equivalence (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent48-champion-root.yml'
      - 'im-results/agent8-counted-reset/CountedReset.lean'
      - 'im-results/agent8-s1-encoder/S1Encoder.lean'
      - 'im-results/agent24-champion-time/CountedCarryBridges.lean'
      - 'im-results/agent24-champion-time/ChampionModular.lean'
      - 'im-results/agent24-champion-time/CostRecurrence.lean'
      - 'im-results/agent24-champion-time/CountPattern.lean'
      - 'im-results/agent8-coverage-contract/Frontier.lean'
      - 'im-results/agent8-coverage-contract/Symmetry.lean'
      - 'im-results/agent8-coverage-contract/RootShift.lean'
      - 'im-results/agent48-champion-root/ChampionRootBridge.lean'
      - 'im-results/agent48-champion-root/S0UniformBridge.lean'
      - 'im-results/agent48-champion-root/UniformTM63HeadOffset.lean'
      - 'im-results/agent48-champion-root/UniformTM63SourceRun.lean'
      - 'im-results/agent26-tm63-uniform/UniformTM63-verified.lean.gz.b64'
permissions:
  contents: read
jobs:
  champion-root:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original source and champion root bridge with axiom audit
        run: |
          set -euo pipefail
          mkdir -p /tmp/a48-root
          cp im-results/agent8-coverage-contract/{Frontier,Symmetry,RootShift}.lean /tmp/a48-root/
          cp im-results/agent48-champion-root/ChampionRootBridge.lean /tmp/a48-root/
          cp im-results/agent48-champion-root/S0UniformBridge.lean /tmp/a48-root/
          base64 --decode im-results/agent26-tm63-uniform/UniformTM63-verified.lean.gz.b64 | gzip --decompress > /tmp/a48-root/UniformTM63.lean
          cp im-results/agent24-champion-time/CountedSweep.lean /tmp/a48-root/
          cp im-results/agent24-champion-time/CountedCarryBridges.lean /tmp/a48-root/
          cp im-results/agent24-champion-time/CountedOddBase.lean /tmp/a48-root/
          cp im-results/agent8-s1-encoder/S1Encoder.lean /tmp/a48-root/
          cp im-results/agent24-champion-time/{ChampionModular,CostRecurrence,CountPattern}.lean /tmp/a48-root/
          cp im-results/agent8-counted-reset/CountedReset.lean /tmp/a48-root/
          cp im-results/agent48-champion-root/UniformTM63HeadOffset.lean /tmp/a48-root/
          cp im-results/agent48-champion-root/UniformTM63SourceRun.lean /tmp/a48-root/
          base64 --decode im-results/agent24-champion-time/CountedOddUnary.lean.xz.b64 | xz --decompress > /tmp/a48-root/CountedOddUnary.lean
          base64 --decode im-results/agent24-champion-time/CountedOneZeroUnary.lean.xz.b64 | xz --decompress > /tmp/a48-root/CountedOneZeroUnary.lean
          cd /tmp/a48-root
          export LEAN_PATH=.
          lean --version
          lean -o Frontier.olean Frontier.lean
          lean -o Symmetry.olean Symmetry.lean
          lean -o RootShift.olean RootShift.lean
          lean -o ChampionRootBridge.olean ChampionRootBridge.lean
          printf '%s  %s\n' 'ea3a8facf99464a982d56b8e46ab5f6391cffe092da566ae9402a97c9bfa3aa5' UniformTM63.lean | sha256sum --check
          lean -o UniformTM63.olean UniformTM63.lean
          lean -o CountedSweep.olean CountedSweep.lean
          lean -o CountedOddBase.olean CountedOddBase.lean
          lean -o S1Encoder.olean S1Encoder.lean
          lean -o ChampionModular.olean ChampionModular.lean
          lean -o CostRecurrence.olean CostRecurrence.lean
          lean -o CountPattern.olean CountPattern.lean
          : > /tmp/a48-root/counted-reset-axioms.log
          lean -o CountedReset.olean CountedReset.lean 2>&1 | tee /tmp/a48-root/counted-reset-axioms.log
          if grep -q 'sorryAx' /tmp/a48-root/counted-reset-axioms.log; then
            echo "::error::sorryAx found in counted reset theorem dependencies"
            exit 1
          fi
          printf '%s  %s\n' 'a035f6248194043509d47dd1aeee02c89374b37561db13897bb6b7d44f2e2cb4' CountedOddUnary.lean | sha256sum --check
          lean -o CountedOddUnary.olean CountedOddUnary.lean
          printf '%s  %s\n' '0d1acc16c377f17e3f2c624a74f9874bafdf255f2fcdc9749c9d00c83b4f6737' CountedOneZeroUnary.lean | sha256sum --check
          lean -o CountedOneZeroUnary.olean CountedOneZeroUnary.lean
          : > /tmp/a48-root/carry-bridge-axioms.log
          lean -o CountedCarryBridges.olean CountedCarryBridges.lean 2>&1 | tee /tmp/a48-root/carry-bridge-axioms.log
          if grep -q 'sorryAx' /tmp/a48-root/carry-bridge-axioms.log; then
            echo "::error::sorryAx found in carry bridge theorem dependencies"
            exit 1
          fi
          : > /tmp/a48-root/s0-uniform-bridge-axioms.log
          lean -o S0UniformBridge.olean S0UniformBridge.lean 2>&1 | tee /tmp/a48-root/s0-uniform-bridge-axioms.log
          if grep -q 'sorryAx' /tmp/a48-root/s0-uniform-bridge-axioms.log; then
            echo "::error::sorryAx found in S0/uniform bridge theorem dependencies"
            exit 1
          fi
          lean -o UniformTM63HeadOffset.olean UniformTM63HeadOffset.lean
          : > /tmp/a48-root/source-run-axioms.log
          lean -o UniformTM63SourceRun.olean UniformTM63SourceRun.lean 2>&1 | tee /tmp/a48-root/source-run-axioms.log
          if grep -q 'sorryAx' /tmp/a48-root/source-run-axioms.log; then
            echo "::error::sorryAx found in original-source run transport"
            exit 1
          fi
