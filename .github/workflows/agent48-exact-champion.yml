name: Exact TM63 champion attainment (manual)
on:
  workflow_dispatch:
    inputs:
      audit:
        description: Source audit to run
        type: choice
        options: [champion, parent]
        default: champion
permissions:
  contents: read
jobs:
  champion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact source import closure and audit final theorems
        if: inputs.audit == 'champion'
        run: bash im-results/agent48-counted-inc0/reproduce-exact-champion.sh
      - name: Compile champion parent cover and audit sibling proofs
        if: inputs.audit == 'parent'
        run: bash im-results/agent48-champion-root/reproduce-parent.sh
