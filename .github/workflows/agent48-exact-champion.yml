name: Exact TM63 champion attainment (manual)
on:
  workflow_dispatch:
    inputs:
      audit:
        description: Source audit to run
        type: choice
        options: [champion, parent, rc-triple, ra-rd, ra-cover]
        default: champion
permissions:
  contents: read
jobs:
  champion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact source import closure and audit final theorems
        if: inputs.audit == 'champion'
        run: bash im-results/agent48-counted-inc0/reproduce-exact-champion.sh
      - name: Compile champion parent cover and audit sibling proofs
        if: inputs.audit == 'parent'
        run: bash im-results/agent48-champion-root/reproduce-parent.sh
      - name: Compile raw139 0RC triple counter and audit completion covers
        if: inputs.audit == 'rc-triple'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py im-results/agent48-champion-root/Champion0RCTriple.lean --workdir /tmp/a48-rc-triple --jobs 4 | tee /tmp/a48-rc-triple.log
          python - <<'PY'
          import re
          log = open('/tmp/a48-rc-triple.log').read()
          for name in ('aCarry','aOverflow','bCarry','bOverflow','entry','arbitrary_live_prefix','never','cover_zeroRC'):
              m = re.search(r"'BB6.Agent48CounterRC\."+name+r"' depends on axioms: \[([^\]]*)\]", log)
              if not m: raise SystemExit('missing axiom audit: '+name)
              used = {x.strip() for x in m.group(1).split(',') if x.strip()}
              assert used <= {'propext','Classical.choice','Quot.sound'}, (name,used)
          PY
      - name: Audit raw139 0RA/0RD macro invariant
        if: inputs.audit == 'ra-rd'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py im-results/agent48-champion-root/Champion0RARD.lean --workdir /tmp/a48-ra-rd --jobs 4 | tee /tmp/a48-ra-rd.log
          python - <<'PY'
          import re
          log = open('/tmp/a48-ra-rd.log').read()
          for name in ('progress','entry','unbounded','never','cover_zeroRA_zeroRD'):
              m = re.search(r"'BB6.Agent48RA_RD\."+name+r"' depends on axioms: \[([^\]]*)\]", log)
              if not m: raise SystemExit('missing axiom audit: '+name)
              used = {x.strip() for x in m.group(1).split(',') if x.strip()}
              assert used <= {'propext','Classical.choice','Quot.sound'}, (name,used)
          PY
      - name: Audit full 0RA parent cover
        if: inputs.audit == 'ra-cover'
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py im-results/agent48-champion-root/Champion0RACover.lean --workdir /tmp/a48-ra-cover --jobs 4 | tee /tmp/a48-ra-cover.log
          python - <<'PY'
          import re
          log = open('/tmp/a48-ra-cover.log').read()
          m = re.search(r"'BB6.Agent48RA\.cover_zeroRA' depends on axioms: \[([^\]]*)\]", log)
          assert m, 'missing axiom audit'
          used = {x.strip() for x in m.group(1).split(',') if x.strip()}
          assert used <= {'propext','Classical.choice','Quot.sound'}, used
          PY
