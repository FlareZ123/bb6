name: Agent 48 M1-even Q4 prefix leaf compile (one-shot)
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  leaf:
    if: contains(github.event.issue.title, '[agent48-m1even-q4-leaf]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact M1-even Q4 prefix import closure
        run: |
          set -euo pipefail
          mkdir -p /tmp/a48-m1
          cp im-results/agent8-coverage-contract/{Frontier,Symmetry,RootShift}.lean /tmp/a48-m1/
          cp im-results/agent48-champion-root/ChampionRootBridge.lean /tmp/a48-m1/
          cp im-results/agent8-s1-encoder/S1Encoder.lean /tmp/a48-m1/
          cp im-results/agent24-champion-time/{CountedSweep,CountedOddBase,ChampionModular,CostRecurrence,CountPattern}.lean /tmp/a48-m1/
          cp im-results/agent8-counted-reset/{CountedReset,Q4Suffix}.lean /tmp/a48-m1/
          cp im-results/agent6-q4-prefix/CountedQ4Prefix.lean /tmp/a48-m1/
          cp im-results/agent8-rst1prime/CountedRst1Prime.lean /tmp/a48-m1/
          cp im-results/agent48-counted-inc0/M1EvenQ4Prefix.lean /tmp/a48-m1/
          cd /tmp/a48-m1
          export LEAN_PATH=.
          lean --version
          lean -o Frontier.olean Frontier.lean
          lean -o Symmetry.olean Symmetry.lean
          lean -o RootShift.olean RootShift.lean
          lean -o ChampionRootBridge.olean ChampionRootBridge.lean
          lean -o S1Encoder.olean S1Encoder.lean
          lean -o CountedSweep.olean CountedSweep.lean
          lean -o CountedOddBase.olean CountedOddBase.lean
          lean -o ChampionModular.olean ChampionModular.lean
          lean -o CostRecurrence.olean CostRecurrence.lean
          lean -o CountPattern.olean CountPattern.lean
          lean -o CountedReset.olean CountedReset.lean
          lean -o CountedQ4Prefix.olean CountedQ4Prefix.lean
          lean -o CountedRst1Prime.olean CountedRst1Prime.lean
          lean -o Q4Suffix.olean Q4Suffix.lean
          : > m1-even-q4-prefix-axioms.log
          if ! lean -o M1EvenQ4Prefix.olean M1EvenQ4Prefix.lean > m1-even-q4-prefix-axioms.log 2>&1; then
            echo '## M1-even Q4 prefix compilation failed' >> "$GITHUB_STEP_SUMMARY"
            tail -n 180 m1-even-q4-prefix-axioms.log >> "$GITHUB_STEP_SUMMARY"
            cat m1-even-q4-prefix-axioms.log
            exit 1
          fi
          if grep -q 'sorryAx' m1-even-q4-prefix-axioms.log; then
            echo '::error::sorryAx found in M1-even Q4 prefix source theorem'
            exit 1
          fi
          echo '## M1-even Q4 prefix source verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'M1EvenQ4Prefix compiles against its exact source import closure with no sorryAx.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload M1-even Q4 prefix diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent48-m1even-q4-leaf-${{ github.run_id }}
          path: /tmp/a48-m1/m1-even-q4-prefix-axioms.log
          if-no-files-found: ignore
          retention-days: 3
