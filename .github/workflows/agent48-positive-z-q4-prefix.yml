name: Agent 48 positive-z q4 prefix and d0 counter proof audit
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Select the positive-z q4 acceptance target"
        type: choice
        options:
          - prefix
          - complete-first-cycle
          - root-q4tail
          - p2-actual-boundary
          - p2-s0-frame-identity
          - tm63-q4-terminal-composition
        default: prefix
        required: true
permissions:
  contents: read
jobs:
  compile:
    if: ${{ inputs.target == 'prefix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Stage exact source dependency closure
        run: |
          set -euo pipefail
          mkdir -p /tmp/a48-positive-z-q4
          cp im-results/agent8-coverage-contract/{Frontier,Symmetry,RootShift}.lean /tmp/a48-positive-z-q4/
          cp im-results/agent48-champion-root/ChampionRootBridge.lean /tmp/a48-positive-z-q4/
          cp im-results/agent24-champion-time/{CountedSweep,CountedOddBase,ChampionModular,CostRecurrence,CountPattern}.lean /tmp/a48-positive-z-q4/
          cp im-results/agent8-s1-encoder/S1Encoder.lean /tmp/a48-positive-z-q4/
          cp im-results/agent8-counted-reset/CountedReset.lean /tmp/a48-positive-z-q4/
          cp im-results/agent6-q4-prefix/CountedQ4Prefix.lean /tmp/a48-positive-z-q4/
          cp im-results/agent8-rst1prime/CountedRst1Prime.lean /tmp/a48-positive-z-q4/
          cp im-results/agent8-counted-reset/Q4Suffix.lean /tmp/a48-positive-z-q4/
          cp im-results/agent48-counted-inc0/{PositiveZFirstCycleBridges,PositiveZFirstCyclePrefix,PositiveZSecondCycleBridge,PositiveZSecondCyclePrefix,D0SweepLeftFacing,PositiveZTypeCBridge}.lean /tmp/a48-positive-z-q4/
          cp im-results/agent24-champion-time/TypeCToState4.lean /tmp/a48-positive-z-q4/
      - name: Compile dependencies and all positive-z q4 source drafts
        run: |
          set -euo pipefail
          cd /tmp/a48-positive-z-q4
          export LEAN_PATH=.
          lean --version
          lean -o Frontier.olean Frontier.lean
          lean -o Symmetry.olean Symmetry.lean
          lean -o RootShift.olean RootShift.lean
          lean -o ChampionRootBridge.olean ChampionRootBridge.lean
          lean -o CountedSweep.olean CountedSweep.lean
          lean -o CountedOddBase.olean CountedOddBase.lean
          lean -o S1Encoder.olean S1Encoder.lean
          lean -o ChampionModular.olean ChampionModular.lean
          lean -o CostRecurrence.olean CostRecurrence.lean
          lean -o CountPattern.olean CountPattern.lean
          lean -o CountedReset.olean CountedReset.lean
          lean -o CountedQ4Prefix.olean CountedQ4Prefix.lean
          lean -o CountedRst1Prime.olean CountedRst1Prime.lean
          lean -o Q4Suffix.olean Q4Suffix.lean
          : > positive-z-q4-axioms.log
          lean -o PositiveZFirstCycleBridges.olean PositiveZFirstCycleBridges.lean 2>&1 | tee -a positive-z-q4-axioms.log
          lean -o PositiveZFirstCyclePrefix.olean PositiveZFirstCyclePrefix.lean 2>&1 | tee -a positive-z-q4-axioms.log
          lean -o PositiveZSecondCycleBridge.olean PositiveZSecondCycleBridge.lean 2>&1 | tee -a positive-z-q4-axioms.log
          lean -o PositiveZSecondCyclePrefix.olean PositiveZSecondCyclePrefix.lean 2>&1 | tee -a positive-z-q4-axioms.log
          lean -o D0SweepLeftFacing.olean D0SweepLeftFacing.lean 2>&1 | tee -a positive-z-q4-axioms.log
          lean -o PositiveZTypeCBridge.olean PositiveZTypeCBridge.lean 2>&1 | tee -a positive-z-q4-axioms.log
          lean -o TypeCToState4.olean TypeCToState4.lean 2>&1 | tee -a positive-z-q4-axioms.log
          if grep -q 'sorryAx' positive-z-q4-axioms.log; then
            echo '::error::sorryAx found in positive-z q4 source theorem dependencies'
            exit 1
          fi
          echo 'All positive-z q4 and Type-C continuation source modules compiled without sorryAx.'

  complete-first-cycle:
    if: ${{ inputs.target == 'complete-first-cycle' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact source closure of the complete positive-z first q4 cycle
        run: |
          set -euo pipefail
          python3 tools/lean_compile_closure.py \
            im-results/agent48-counted-inc0/PositiveZFirstCycleEndpoint.lean \
            --jobs 8 \
            --workdir /tmp/positive-z-first-cycle \
            | tee /tmp/positive-z-first-cycle.log
          python3 - <<'PY'
          import pathlib
          log = pathlib.Path("/tmp/positive-z-first-cycle.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "s0Config_counted_decrement_anyValuation_hRun",
              "s0Config_counted_drain_closed",
              "firstCycleQ_from_drainedS0",
              "firstCyclePrefix_to_s0DrainInput",
              "positiveZFirstCycle_from_checkpoint",
          )
          for name in names:
              lines = [line for line in log.splitlines()
                       if "depends on axioms:" in line
                       and line.split(" depends on axioms:", 1)[0].split(".")[-1] == name]
              if len(lines) != 1:
                  raise SystemExit(f"expected one axiom profile for {name}, got {len(lines)}")
              profile = lines[0].split("depends on axioms:", 1)[1].strip()
              if not (profile.startswith("[") and profile.endswith("]")):
                  raise SystemExit(f"unrecognized axiom profile for {name}: {profile}")
              axioms = {x.strip() for x in profile[1:-1].split(",") if x.strip()}
              bad = axioms - allowed
              if bad:
                  raise SystemExit(f"nonstandard axioms in {name}: {sorted(bad)}")
              print(f"{name}: {sorted(axioms)}")
          PY
          if grep -R -n 'native_decide' /tmp/positive-z-first-cycle --include='*.lean'; then
            echo '::error::native_decide found in the positive-z first-cycle source closure'
            exit 1
          fi
          if grep -q 'sorryAx' /tmp/positive-z-first-cycle.log; then
            echo '::error::sorryAx found in the positive-z first-cycle source closure'
            exit 1
          fi
          echo 'Complete positive-z first q4 cycle compiled with standard axioms only.'

  root-q4tail:
    if: ${{ inputs.target == 'root-q4tail' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct compressed TerminalLeft dependency
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent38-root-q4tail-source
          python3 -c "import base64,io,lzma,pathlib,tarfile; p=pathlib.Path('im-results/agent42-champion-terminal/TerminalProofs.tar.xz.b64'); d=base64.b64decode(p.read_text()); tarfile.open(fileobj=io.BytesIO(d),mode='r:xz').extractall('/tmp/agent38-root-q4tail-source',filter='data')"
          python3 -c "import base64,lzma,pathlib; p=pathlib.Path('im-results/agent42-champion-terminal/TerminalLeftExact.lean.xz.b64'); pathlib.Path('/tmp/agent38-root-q4tail-source/TerminalLeft.lean').write_bytes(lzma.decompress(base64.b64decode(p.read_text())))"
          echo "12329036c66c3846f9261167b8f9aebd1778d9b6ea6044309956c2fa0b3e49b7  /tmp/agent38-root-q4tail-source/TerminalFinish.lean" | sha256sum -c -
          echo "1bce2075fc4e0cd7d740fb71b3796088b190ddb6766e04640d992dadd1b650ff  /tmp/agent38-root-q4tail-source/TerminalLeft.lean" | sha256sum -c -
      - name: Compile exact root-to-q4Tail import closure
        run: |
          set -euo pipefail
          python3 tools/lean_compile_closure.py \
            im-results/agent38-root-q4tail/TM63RootQ4Tail.lean \
            --jobs 8 \
            --workdir /tmp/agent38-root-q4tail \
            --source-root /tmp/agent38-root-q4tail-source \
            --override TerminalBridge=im-results/agent42-champion-terminal/TerminalBridge.lean \
            | tee /tmp/agent38-root-q4tail.log
          python3 - <<'PY'
          import pathlib
          log = pathlib.Path("/tmp/agent38-root-q4tail.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "rootP1Value_odd_public",
              "tm63_blank_reaches_second_q4_tail",
          )
          for name in names:
              lines = [line for line in log.splitlines()
                       if "depends on axioms:" in line
                       and line.split(" depends on axioms:", 1)[0].split(".")[-1] == name]
              if len(lines) != 1:
                  raise SystemExit(f"expected one axiom profile for {name}, got {len(lines)}")
              profile = lines[0].split("depends on axioms:", 1)[1].strip()
              if not (profile.startswith("[") and profile.endswith("]")):
                  raise SystemExit(f"unrecognized axiom profile for {name}: {profile}")
              axioms = {x.strip() for x in profile[1:-1].split(",") if x.strip()}
              bad = axioms - allowed
              if bad:
                  raise SystemExit(f"nonstandard axioms in {name}: {sorted(bad)}")
              print(f"{name}: {sorted(axioms)}")
          PY
          if grep -R -n 'native_decide' /tmp/agent38-root-q4tail --include='*.lean'; then
            echo '::error::native_decide found in the root-to-q4Tail source closure'
            exit 1
          fi
          if grep -q 'sorryAx' /tmp/agent38-root-q4tail.log; then
            echo '::error::sorryAx found in the root-to-q4Tail source closure'
            exit 1
          fi
          echo 'Authentic root-to-q4Tail composition compiled with standard axioms only.'

  p2-actual-boundary:
    if: ${{ inputs.target == 'p2-actual-boundary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile exact actual-boundary bridge dependency closure
        run: |
          set -euo pipefail
          python3 tools/lean_compile_closure.py \
            im-results/agent38-root-q4tail/P2ActualBoundaryBridge.lean \
            --jobs 8 \
            --workdir /tmp/agent38-p2-actual-boundary \
            | tee /tmp/agent38-p2-actual-boundary.log
          python3 - <<'PY'
          import pathlib
          log = pathlib.Path("/tmp/agent38-p2-actual-boundary.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "p2ActualBoundary_exact",
              "p2ActualBoundary_heads",
              "p2ActualBoundary_at",
              "p2ActualBoundary_end_right_ones",
              "state4_right_ones",
              "p2_two_zero_setup",
              "p2_final_zero",
              "p2ActualRightContinuation",
              "p2ActualPostlude_at",
          )
          for name in names:
              lines = [line for line in log.splitlines()
                       if "depends on axioms:" in line
                       and line.split(" depends on axioms:", 1)[0].split(".")[-1] == name]
              if len(lines) != 1:
                  raise SystemExit(f"expected one axiom profile for {name}, got {len(lines)}")
              profile = lines[0].split("depends on axioms:", 1)[1].strip()
              if not (profile.startswith("[") and profile.endswith("]")):
                  raise SystemExit(f"unrecognized axiom profile for {name}: {profile}")
              axioms = {x.strip() for x in profile[1:-1].split(",") if x.strip()}
              bad = axioms - allowed
              if bad:
                  raise SystemExit(f"nonstandard axioms in {name}: {sorted(bad)}")
              print(f"{name}: {sorted(axioms)}")
          PY
          if grep -R -n 'native_decide' /tmp/agent38-p2-actual-boundary --include='*.lean'; then
            echo '::error::native_decide found in the actual-boundary source closure'
            exit 1
          fi
          if grep -q 'sorryAx' /tmp/agent38-p2-actual-boundary.log; then
            echo '::error::sorryAx found in the actual-boundary source closure'
            exit 1
          fi
          echo 'Actual-boundary bridge and conditional continuation compiled with standard axioms only.'


  p2-s0-frame-identity:
    if: ${{ inputs.target == 'p2-s0-frame-identity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct compressed TerminalLeft and TerminalFinish dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent38-root-s0-frame-source
          python3 -c "import base64,io,pathlib,tarfile; p=pathlib.Path('im-results/agent42-champion-terminal/TerminalProofs.tar.xz.b64'); d=base64.b64decode(p.read_text()); tarfile.open(fileobj=io.BytesIO(d),mode='r:xz').extractall('/tmp/agent38-root-s0-frame-source',filter='data')"
          python3 -c "import base64,lzma,pathlib; p=pathlib.Path('im-results/agent42-champion-terminal/TerminalLeftExact.lean.xz.b64'); pathlib.Path('/tmp/agent38-root-s0-frame-source/TerminalLeft.lean').write_bytes(lzma.decompress(base64.b64decode(p.read_text())))"
          echo "12329036c66c3846f9261167b8f9aebd1778d9b6ea6044309956c2fa0b3e49b7  /tmp/agent38-root-s0-frame-source/TerminalFinish.lean" | sha256sum -c -
          echo "1bce2075fc4e0cd7d740fb71b3796088b190ddb6766e04640d992dadd1b650ff  /tmp/agent38-root-s0-frame-source/TerminalLeft.lean" | sha256sum -c -
      - name: Compile exact import closure for the authentic root frame identity
        run: |
          set -euo pipefail
          python3 tools/lean_compile_closure.py \
            im-results/agent38-root-q4tail/P2RootS0FrameIdentity.lean \
            --jobs 8 \
            --workdir /tmp/agent38-root-s0-frame-identity \
            --source-root /tmp/agent38-root-s0-frame-source \
            --override TerminalBridge=im-results/agent42-champion-terminal/TerminalBridge.lean \
            | tee /tmp/agent38-root-s0-frame-identity.log
          python3 - <<'PY'
          import pathlib
          log = pathlib.Path("/tmp/agent38-root-s0-frame-identity.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "q4TailS0SourceGuards",
              "q4TailS0Frame_eq_s0Config",
              "tm63_root_second_q4Tail_eq_s0Config",
          )
          for name in names:
              lines = [line for line in log.splitlines()
                       if "depends on axioms:" in line
                       and line.split(" depends on axioms:", 1)[0].split(".")[-1] == name]
              if len(lines) != 1:
                  raise SystemExit(f"expected one axiom profile for {name}, got {len(lines)}")
              profile = lines[0].split("depends on axioms:", 1)[1].strip()
              if not (profile.startswith("[") and profile.endswith("]")):
                  raise SystemExit(f"unrecognized profile for {name}: {profile}")
              axioms = {x.strip() for x in profile[1:-1].split(",") if x.strip()}
              bad = axioms - allowed
              if bad:
                  raise SystemExit(f"nonstandard axioms in {name}: {sorted(bad)}")
              print(f"{name}: {sorted(axioms)}")
          PY
          if grep -R -nE 'sorryAx|native_decide' /tmp/agent38-root-s0-frame-identity --include='*.lean'; then
            echo '::error::sorryAx or native_decide found in the authentic root frame import closure'
            exit 1
          fi
      - name: Upload Lean diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent38-root-s0-frame-identity-diagnostics
          path: /tmp/agent38-root-s0-frame-identity.log
          if-no-files-found: ignore
          retention-days: 3

  tm63-q4-terminal-composition:
    if: ${{ inputs.target == 'tm63-q4-terminal-composition' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct compressed TerminalLeft and TerminalFinish dependencies
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent42-tm63-q4-terminal-source
          python3 -c "import base64,io,pathlib,tarfile; p=pathlib.Path('im-results/agent42-champion-terminal/TerminalProofs.tar.xz.b64'); d=base64.b64decode(p.read_text()); tarfile.open(fileobj=io.BytesIO(d),mode='r:xz').extractall('/tmp/agent42-tm63-q4-terminal-source',filter='data')"
          python3 -c "import base64,lzma,pathlib; p=pathlib.Path('im-results/agent42-champion-terminal/TerminalLeftExact.lean.xz.b64'); pathlib.Path('/tmp/agent42-tm63-q4-terminal-source/TerminalLeft.lean').write_bytes(lzma.decompress(base64.b64decode(p.read_text())))"
          echo "12329036c66c3846f9261167b8f9aebd1778d9b6ea6044309956c2fa0b3e49b7  /tmp/agent42-tm63-q4-terminal-source/TerminalFinish.lean" | sha256sum -c -
          echo "1bce2075fc4e0cd7d740fb71b3796088b190ddb6766e04640d992dadd1b650ff  /tmp/agent42-tm63-q4-terminal-source/TerminalLeft.lean" | sha256sum -c -
      - name: Compile and axiom-audit the authentic blank-to-halt TM63 composition
        run: |
          set -euo pipefail
          python3 tools/lean_compile_closure.py \
            im-results/agent42-q4-s0-drain/TM63GeneralQ4TerminalComposition.lean \
            --jobs 8 \
            --workdir /tmp/agent42-tm63-q4-terminal \
            --source-root /tmp/agent42-tm63-q4-terminal-source \
            --override TerminalBridge=im-results/agent42-champion-terminal/TerminalBridge.lean \
            | tee /tmp/agent42-tm63-q4-terminal.log
          python3 - <<'PY'
          import pathlib
          log = pathlib.Path("/tmp/agent42-tm63-q4-terminal.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "rootP1Value_odd_public",
              "tm63_blank_reaches_second_q4_tail",
              "q4TailS0SourceGuards",
              "q4TailS0Frame_eq_s0Config",
              "tm63_root_second_q4Tail_eq_s0Config",
              "q4TerminalFrame_eq_s1Config",
              "q4TerminalFrame_counted_drain",
              "q4TerminalFrame_to_terminalConfig",
              "q4TerminalFrame_blank_prefix_halts",
              "q4TerminalFrame_blank_prefix_attainable",
              "tm63_blank_reaches_general_q4_terminal",
              "tm63_general_q4_terminalSectionBits",
              "tm63_blank_halts",
              "tm63_blank_attainable",
          )
          for name in names:
              found = []
              lines = log.splitlines()
              for i, line in enumerate(lines):
                  if "depends on axioms:" not in line:
                      continue
                  if line.split(" depends on axioms:", 1)[0].split(".")[-1] != name:
                      continue
                  profile = line.split("depends on axioms:", 1)[1].strip()
                  j = i + 1
                  while not profile.endswith("]") and j < len(lines):
                      profile += " " + lines[j].strip()
                      j += 1
                  found.append(profile)
              if len(found) != 1:
                  raise SystemExit(f"expected one axiom profile for {name}, got {len(found)}")
              profile = found[0]
              if not (profile.startswith("[") and profile.endswith("]")):
                  raise SystemExit(f"unrecognized axiom profile for {name}: {profile}")
              axioms = {x.strip() for x in profile[1:-1].split(",") if x.strip()}
              bad = axioms - allowed
              if bad:
                  raise SystemExit(f"nonstandard axioms in {name}: {sorted(bad)}")
              print(f"{name}: {sorted(axioms)}")
          PY
          if grep -R -nE 'sorryAx|native_decide' /tmp/agent42-tm63-q4-terminal --include='*.lean'; then
            echo '::error::sorryAx or native_decide found in the authentic blank-to-halt TM63 closure'
            exit 1
          fi
          if grep -q 'sorryAx' /tmp/agent42-tm63-q4-terminal.log; then
            echo '::error::sorryAx found in the authentic blank-to-halt TM63 axiom profiles'
            exit 1
          fi
          echo 'Authentic TM63 blank-root-to-terminal composition compiled with standard axioms only.'
      - name: Upload Lean diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent42-tm63-q4-terminal-diagnostics
          path: /tmp/agent42-tm63-q4-terminal.log
          if-no-files-found: ignore
          retention-days: 3
