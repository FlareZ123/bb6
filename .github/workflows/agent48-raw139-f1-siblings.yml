name: Raw139 F1 sibling sweep audit (manual)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit SHA to compile
        required: true
        type: string
      kind:
        description: Branch depth or source-connected A6 root (f1, c1, d0, a6)
        required: true
        type: choice
        options: [f1, c1, d0, a6]
        default: f1
      sibling:
        description: Sibling proof spec name (unused for a6)
        required: true
        type: string
        default: ZeroLD
permissions:
  contents: read
jobs:
  certify:
    if: ${{ inputs.kind != 'a6' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reproduce and certify the exact sibling
        env:
          KIND: ${{ inputs.kind }}
          SIBLING: ${{ inputs.sibling }}
        run: |
          if [[ "$KIND" == c1 ]]; then
            bash im-results/agent48-raw139-f1-oneRA/reproduce-blocks.sh c1 "$SIBLING"
          elif [[ "$KIND" == d0 ]]; then
            [[ "$SIBLING" == ZeroLF ]]
            bash im-results/agent14-raw139-d0-zeroLF/reproduce.sh
          else
            bash im-results/agent48-raw139-f1-oneLA/reproduce-sibling.sh "$SIBLING"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw139-${{ inputs.kind }}-${{ inputs.sibling }}-certified
          include-hidden-files: true
          path: |
            .tmp/a48-${{ inputs.kind }}-${{ inputs.sibling }}/manifest.json
            .tmp/a48-${{ inputs.kind }}-${{ inputs.sibling }}/log
            .tmp/a48-${{ inputs.kind }}-${{ inputs.sibling }}/imports/*.lean
            .tmp/a48-${{ inputs.kind }}-${{ inputs.sibling }}/build/*.olean

  a6-ingestion:
    if: ${{ inputs.kind == 'a6' }}
    runs-on: ubuntu-latest
    timeout-minutes: 85
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/cryptids
          ref: c86f15861709b76042998c5211c7b2f83991621b
          path: cryptids
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Align pinned Cryptids dependencies with the canonical77 kernel
        working-directory: cryptids
        run: |
          sed -i 's/v4.35.0-rc4/v4.36.0-rc2/g' lakefile.toml
          printf 'leanprover/lean4:v4.36.0-rc2\n' > lean-toolchain
          lake update
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB0LF_1RC0RA_1LD0RB_0LE0LC_0LA0LC_0LBHHH
      - name: Download exact accepted canonical77 dependency artifact
        uses: actions/download-artifact@v4
        with:
          name: canonical77-certified
          run-id: 45554648116
          github-token: ${{ github.token }}
          path: canonical77
      # The artifact label is stale; exactness job 139320746934 in run 45647053824
      # source-audited CanonicalTwoParentRosterOnly.exact_at_target with 76 residuals.
      - name: Download exact accepted canonical76 dependency artifact
        uses: actions/download-artifact@v4
        with:
          name: canonical73-raw110-raw112-roster-consumer-certified
          run-id: 45647053824
          github-token: ${{ github.token }}
          path: canonical76
      - name: Verify canonical76 theorem object is present
        run: |
          test -n "$(find canonical76 -name CanonicalTwoParentRosterOnly.olean -print -quit)"
      - name: Compile source-connected A6 refinement against canonical76
        run: |
          mkdir -p cryptids/BB6Agent48
          set -o pipefail
          bash im-results/agent48-raw139-hard-root/reproduce-a6.sh \
            "$GITHUB_WORKSPACE/canonical77" "$GITHUB_WORKSPACE/cryptids" \
            "$GITHUB_WORKSPACE/canonical76" \
            2>&1 | tee cryptids/BB6Agent48/reproduce.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw139-a6-source-connected-${{ inputs.source_sha }}
          include-hidden-files: true
          if-no-files-found: warn
          path: cryptids/BB6Agent48
