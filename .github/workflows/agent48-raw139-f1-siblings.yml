name: Raw139 F1 sibling sweep audit (manual)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit SHA to compile
        required: true
        type: string
      kind:
        description: Branch depth (f1 or c1)
        required: true
        type: choice
        options: [f1, c1]
        default: f1
      sibling:
        description: Sibling proof spec name
        required: true
        type: string
        default: ZeroLD
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reproduce and certify the exact sibling
        env:
          KIND: ${{ inputs.kind }}
          SIBLING: ${{ inputs.sibling }}
        run: |
          if [[ "$KIND" == c1 ]]; then
            bash im-results/agent48-raw139-f1-oneRA/reproduce-blocks.sh c1 "$SIBLING"
          else
            bash im-results/agent48-raw139-f1-oneLA/reproduce-sibling.sh "$SIBLING"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw139-${{ inputs.kind }}-${{ inputs.sibling }}-certified
          include-hidden-files: true
          path: |
            .tmp/a48-${{ inputs.kind }}-${{ inputs.sibling }}/manifest.json
            .tmp/a48-${{ inputs.kind }}-${{ inputs.sibling }}/log
            .tmp/a48-${{ inputs.kind }}-${{ inputs.sibling }}/imports/*.lean
            .tmp/a48-${{ inputs.kind }}-${{ inputs.sibling }}/build/*.olean
