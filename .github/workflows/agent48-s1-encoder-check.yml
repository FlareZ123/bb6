name: Agent 48 general TM63 S1 encoder (selective check)
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - im-results/agent48-champion-root/S1Encoder.lean
permissions:
  contents: read
jobs:
  s1-encoder:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile source dependencies and general S1 encoder
        run: |
          set -eu
          mkdir -p /tmp/a48-s1
          cp im-results/agent8-coverage-contract/{Frontier,Symmetry,RootShift}.lean /tmp/a48-s1/
          cp im-results/agent48-champion-root/{ChampionRootBridge,S1Encoder}.lean /tmp/a48-s1/
          cd /tmp/a48-s1
          export LEAN_PATH=.
          lean --version
          lean -o Frontier.olean Frontier.lean
          lean -o Symmetry.olean Symmetry.lean
          lean -o RootShift.olean RootShift.lean
          lean -o ChampionRootBridge.olean ChampionRootBridge.lean
          lean -o S1Encoder.olean S1Encoder.lean
