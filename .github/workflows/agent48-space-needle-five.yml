name: Agent 48 Space Needle source audit and quadratic terminal bound (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned original Lean
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned original Cryptids
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          git -C /tmp/cryptids checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git -C /tmp/cryptids rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Restore dependencies and source
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB1LA_1LC0RE_1LF1LD_0RB0LA_1RC1RE_HHH0LD
      - name: Check original-source Space Needle results and quadratic terminal bound
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          base48="$GITHUB_WORKSPACE/im-results/agent48-space-needle"
          base20="$GITHUB_WORKSPACE/im-results/agent20-needle-coprime"
          cp "$base48/NeedleTerminalDichotomy.lean" .
          lake env lean -o ".lake/build/lib/lean/NeedleTerminalDichotomy.olean" NeedleTerminalDichotomy.lean
          cp "$base48/SpaceNeedleClosed.lean" .
          lake env lean -o ".lake/build/lib/lean/SpaceNeedleClosed.olean" SpaceNeedleClosed.lean
          cp "$base48/NeedleTerminalDichotomySource.lean" .
          lake env lean NeedleTerminalDichotomySource.lean
          cp "$base48/SpaceNeedleObstructionFamilies.lean" .
          lake env lean SpaceNeedleObstructionFamilies.lean
          for f in NeedleValHalf NeedleInverseComplete NeedleGeneralInverse NeedleTerminalAffineSource; do
            cp "$base20/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
          cp "$base48/FiveTerminal.lean" .
          lake env lean -o ".lake/build/lib/lean/FiveTerminal.olean" FiveTerminal.lean
          cp "$base48/FiveTerminalSource.lean" .
          lake env lean FiveTerminalSource.lean
          cp "$base48/BoundaryExact.lean" .
          lake env lean -o ".lake/build/lib/lean/BoundaryExact.olean" BoundaryExact.lean
          cp "$base48/BoundaryExactSource.lean" .
          lake env lean BoundaryExactSource.lean
          for f in NeedleCubicBound NeedleSharper; do
            cp "$base20/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
          cp "$base48/OffsetStrip.lean" .
          lake env lean -o ".lake/build/lib/lean/OffsetStrip.olean" OffsetStrip.lean
          cp "$base48/OffsetStripSource.lean" .
          lake env lean OffsetStripSource.lean
          cp "$base48/NeedleQuarticEnumerate.lean" .
          lake env lean -o ".lake/build/lib/lean/NeedleQuarticEnumerate.olean" NeedleQuarticEnumerate.lean
          cp "$base48/NeedleQuarticEnumerateSource.lean" .
          lake env lean NeedleQuarticEnumerateSource.lean
          cp "$base48/FifthHigh.lean" .
          lake env lean -o ".lake/build/lib/lean/FifthHigh.olean" FifthHigh.lean
          cp "$base48/NeedleQuinticEnumerate.lean" .
          lake env lean -o ".lake/build/lib/lean/NeedleQuinticEnumerate.olean" NeedleQuinticEnumerate.lean
          cp "$base48/NeedleQuinticEnumerateSource.lean" .
          lake env lean -o ".lake/build/lib/lean/NeedleQuinticEnumerateSource.olean" NeedleQuinticEnumerateSource.lean
          cp "$base48/SuperlinearAll.lean" .
          lake env lean -o ".lake/build/lib/lean/SuperlinearAll.olean" SuperlinearAll.lean
          cp "$base48/SuperlinearAllSource.lean" .
          lake env lean SuperlinearAllSource.lean
          cp "$base48/SuperlinearOne.lean" .
          lake env lean -o ".lake/build/lib/lean/SuperlinearOne.olean" SuperlinearOne.lean
          cp "$base48/SuperlinearOneSource.lean" .
          lake env lean SuperlinearOneSource.lean
          cp "$base48/SuperlinearEnumerate.lean" .
          lake env lean -o ".lake/build/lib/lean/SuperlinearEnumerate.olean" SuperlinearEnumerate.lean
          cp "$base48/SuperlinearEnumerateSource.lean" .
          lake env lean SuperlinearEnumerateSource.lean
          cp "$base48/SuperlinearOptimized.lean" .
          lake env lean -o ".lake/build/lib/lean/SuperlinearOptimized.olean" SuperlinearOptimized.lean
          cp "$base48/SuperlinearOptimizedSource.lean" .
          lake env lean SuperlinearOptimizedSource.lean
          cp "$base48/SpaceNeedleRawBridge.lean" .
          lake env lean -o ".lake/build/lib/lean/SpaceNeedleRawBridge.olean" SpaceNeedleRawBridge.lean
          for f in NeedleCubicEnumerate NeedleCubicEnumerateSource NeedleRootCubic; do
            cp "$base20/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
          cp "$base48/NeedleQuadraticEnumerate.lean" .
          lake env lean -o ".lake/build/lib/lean/NeedleQuadraticEnumerate.olean" NeedleQuadraticEnumerate.lean
          cp "$base48/NeedleQuadraticEnumerateSource.lean" .
          lake env lean NeedleQuadraticEnumerateSource.lean
          cp "$base48/NeedleRootQuadratic.lean" .
          lake env lean NeedleRootQuadratic.lean
          cp "$base48/SuperlinearRoot.lean" .
          lake env lean SuperlinearRoot.lean
          for f in NeedleRootDecisionCore NeedleGeneralInverseSource NeedleRootDecisionSource NeedleSharperSource NeedleRootSharp; do
            cp "$base20/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
          cp "$base48/NeedleQuinticRegular.lean" .
          lake env lean -o ".lake/build/lib/lean/NeedleQuinticRegular.olean" NeedleQuinticRegular.lean
          cp "$base48/SixthHigh.lean" .
          lake env lean -o ".lake/build/lib/lean/SixthHigh.olean" SixthHigh.lean
          cp "$base48/SixthNear.lean" .
          lake env lean -o ".lake/build/lib/lean/SixthNear.olean" SixthNear.lean
          cp "$base48/NeedleSixthRegular.lean" .
          lake env lean -o ".lake/build/lib/lean/NeedleSixthRegular.olean" NeedleSixthRegular.lean
          cp "$base48/SpaceNeedleFifthRoot.lean" .
          lake env lean -o ".lake/build/lib/lean/SpaceNeedleFifthRoot.olean" SpaceNeedleFifthRoot.lean
          cp "$base48/NeedleSixthRoot.lean" .
          lake env lean NeedleSixthRoot.lean
