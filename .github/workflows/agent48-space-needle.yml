name: Agent 48 Space Needle exact counter normal form (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install original upstream Lean toolchain
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Checkout SHA-pinned upstream original machine
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet ced8f9f44f67a167d5ecc03e687b048c67926371
          test "$(git rev-parse HEAD)" = ced8f9f44f67a167d5ecc03e687b048c67926371
      - name: Restore upstream Mathlib cache
        working-directory: /tmp/cryptids
        run: lake exe cache get
      - name: Build original verified Space Needle module
        working-directory: /tmp/cryptids
        run: lake build BusyBeaver.BB6.M_1RB1LA_1LC0RE_1LF1LD_0RB0LA_1RC1RE_HHH0LD
      - name: Compile and audit exact source-level counter classification
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/SpaceNeedleClosed.lean" SpaceNeedleClosed.lean
          lake env lean -o .lake/build/lib/lean/SpaceNeedleClosed.olean SpaceNeedleClosed.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/SpaceNeedleRawBridge.lean" SpaceNeedleRawBridge.lean
          lake env lean SpaceNeedleRawBridge.lean
      - name: Compile pinned-source two-step odd-terminal grammar
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/NeedleTwoStepOdd.lean" NeedleTwoStepOdd.lean
          lake env lean -o .lake/build/lib/lean/NeedleTwoStepOdd.olean NeedleTwoStepOdd.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/SpaceNeedleOddBlocksSource.lean" SpaceNeedleOddBlocksSource.lean
          lake env lean -o .lake/build/lib/lean/SpaceNeedleOddBlocksSource.olean SpaceNeedleOddBlocksSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/NeedleTwoStepOddSource.lean" NeedleTwoStepOddSource.lean
          lake env lean NeedleTwoStepOddSource.lean
      - name: Certify odd-block terminal lengths and complete macro semantics
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/TerminalOddInverse.lean" TerminalOddInverse.lean
          lake env lean -o .lake/build/lib/lean/TerminalOddInverse.olean TerminalOddInverse.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/TerminalOddInverseSource.lean" TerminalOddInverseSource.lean
          lake env lean TerminalOddInverseSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/SpaceNeedleOddMacroCertifiedSource.lean" SpaceNeedleOddMacroCertifiedSource.lean
          lake env lean SpaceNeedleOddMacroCertifiedSource.lean
      - name: Prove exact five-adic order and source-valid arbitrarily long odd terminal paths
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/FiveAdicLift.lean" FiveAdicLift.lean
          lake env lean -o .lake/build/lib/lean/FiveAdicLift.olean FiveAdicLift.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/FiveAdicExtra.lean" FiveAdicExtra.lean
          lake env lean -o .lake/build/lib/lean/FiveAdicExtra.olean FiveAdicExtra.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/FiveAdicSource.lean" FiveAdicSource.lean
          lake env lean FiveAdicSource.lean
      - name: Certify full multiplicative order and exact all-length terminal criterion
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/FiveAdicOrder.lean" FiveAdicOrder.lean
          lake env lean -o .lake/build/lib/lean/FiveAdicOrder.olean FiveAdicOrder.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/FiveAdicAll.lean" FiveAdicAll.lean
          lake env lean -o .lake/build/lib/lean/FiveAdicAll.olean FiveAdicAll.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/FiveAdicOrderFull.lean" FiveAdicOrderFull.lean
          lake env lean -o .lake/build/lib/lean/FiveAdicOrderFull.olean FiveAdicOrderFull.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-space-needle/FiveAdicOrderSource.lean" FiveAdicOrderSource.lean
          lake env lean FiveAdicOrderSource.lean
