name: Agent 49 #623 total carry audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  carry-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install source-pinned Lean 4.35.0-rc4
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Clone cryptids at the pinned source revision
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet c86f15861709b76042998c5211c7b2f83991621b
          test "$(git rev-parse HEAD)" = c86f15861709b76042998c5211c7b2f83991621b

      - name: Reclaim hosted-runner space for Mathlib cache
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell

      - name: Restore authenticated Mathlib dependencies
        working-directory: /tmp/cryptids
        run: lake exe cache get

      - name: Build unmodified original #623 source
        working-directory: /tmp/cryptids
        run: lake build BusyBeaver.BB6.M_1RB0LE_0RC1RC_0RD1LA_1LD0LA_1LF1LC_HHH0LA

      - name: Compile source-linked Agent49 parity module
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/Parity623Source.lean" Agent49ParitySource.lean
          lake env lean -o .lake/build/lib/lean/Agent49ParitySource.olean Agent49ParitySource.lean

      - name: Compile Agent41 root-mass gap theorem against unchanged source
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/im-results/agent41-623-root-history/RootMassGapSource.lean" Agent41RootMassGapSource.lean
          lake env lean -o .lake/build/lib/lean/Agent41RootMassGapSource.olean Agent41RootMassGapSource.lean 2>&1 | tee Agent41RootMassGapSource.log
          if grep -q 'sorryAx' Agent41RootMassGapSource.log; then
            echo 'sorryAx detected in root-mass gap theorem'
            exit 1
          fi

      - name: Compile source-checked total-carry counterexample
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/CarryBoundAuditSource.lean" Agent49CarryBoundAuditSource.lean
          lake env lean Agent49CarryBoundAuditSource.lean
