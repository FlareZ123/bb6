name: Agent 49 #623 exact flat ternary drain (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-flat-drain:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Pin original Cryptids
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet c86f15861709b76042998c5211c7b2f83991621b
          test "$(git rev-parse HEAD)" = c86f15861709b76042998c5211c7b2f83991621b
      - name: Free disk for the pinned Mathlib cache
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
      - name: Build unmodified original machine
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB0LE_0RC1RC_0RD1LA_1LD0LA_1LF1LC_HHH0LA
      - name: Check source-imported exact ternary drain
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/Parity623Source.lean" Agent49ParitySource.lean
          lake env lean -o .lake/build/lib/lean/Agent49ParitySource.olean Agent49ParitySource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/FlatDrainSource.lean" Agent49FlatDrainSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49FlatDrainSource.olean Agent49FlatDrainSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-survival-density/DrainDigitChargeSource.lean" Agent8DigitChargeSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8DigitChargeSource.olean Agent8DigitChargeSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-survival-density/DrainMassCocycleSource.lean" Agent8DrainMassCocycleSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8DrainMassCocycleSource.olean Agent8DrainMassCocycleSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-survival-density/RootDigitChargeSource.lean" Agent8RootDigitChargeSource.lean
          lake env lean Agent8RootDigitChargeSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-survival-density/NextDigitSource.lean" Agent8NextDigitSource.lean
          lake env lean Agent8NextDigitSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-survival-density/SafeBudgetSource.lean" Agent8SafeBudgetSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8SafeBudgetSource.olean Agent8SafeBudgetSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-survival-density/BinarySafeSource.lean" Agent8BinarySafeSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8BinarySafeSource.olean Agent8BinarySafeSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/ThirdNinefoldSource.lean" Agent49ThirdNinefoldSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49ThirdNinefoldSource.olean Agent49ThirdNinefoldSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/Eleven81Source.lean" Agent49Eleven81Source.lean
          lake env lean -o .lake/build/lib/lean/Agent49Eleven81Source.olean Agent49Eleven81Source.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/Eleven81FamilySource.lean" Agent49Eleven81FamilySource.lean
          lake env lean Agent49Eleven81FamilySource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/DyckSafeSource.lean" Agent49DyckSafeSource.lean
          lake env lean Agent49DyckSafeSource.lean
