name: Agent 49 #623 complete first-counter failure spectrum (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-full-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Pin original Cryptids
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet c86f15861709b76042998c5211c7b2f83991621b
          test "$(git rev-parse HEAD)" = c86f15861709b76042998c5211c7b2f83991621b
      - name: Free disk for pinned Mathlib cache
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
      - name: Build unmodified original #623
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB0LE_0RC1RC_0RD1LA_1LD0LA_1LF1LC_HHH0LA
      - name: Prove complete original-source failure spectrum
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/Parity623Source.lean" Agent49ParitySource.lean
          lake env lean -o .lake/build/lib/lean/Agent49ParitySource.olean Agent49ParitySource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/FlatDrainSource.lean" Agent49FlatDrainSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49FlatDrainSource.olean Agent49FlatDrainSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/FullFailureSpectrumSource.lean" Agent49FullFailureSpectrumSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49FullFailureSpectrumSource.olean Agent49FullFailureSpectrumSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/FastFailureSpectrumSource.lean" Agent49FastFailureSpectrumSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49FastFailureSpectrumSource.olean Agent49FastFailureSpectrumSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/SharpSpectrumCapacitySource.lean" Agent49SharpSpectrumCapacitySource.lean
          lake env lean -o .lake/build/lib/lean/Agent49SharpSpectrumCapacitySource.olean Agent49SharpSpectrumCapacitySource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent22-623-robust-band/Agent22RobustBand.lean" Agent22RobustBand.lean
          lake env lean -o .lake/build/lib/lean/Agent22RobustBand.olean Agent22RobustBand.lean
          cp "$GITHUB_WORKSPACE/im-results/agent22-623-robust-band/Agent22RobustBandSource.lean" Agent22RobustBandSource.lean
          lake env lean Agent22RobustBandSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-inverse/TernaryBudgetSource.lean" Agent8BudgetSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8BudgetSource.olean Agent8BudgetSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent22-623-robust-band/Agent22ThreeStepSource.lean" Agent22ThreeStepSource.lean
          lake env lean Agent22ThreeStepSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/ExactLeftSectorSource.lean" Agent49ExactLeftSectorSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49ExactLeftSectorSource.olean Agent49ExactLeftSectorSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/ExactOddSectorSource.lean" Agent49ExactOddSectorSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49ExactOddSectorSource.olean Agent49ExactOddSectorSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/PowerThreeShieldSource.lean" Agent49PowerThreeShieldSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49PowerThreeShieldSource.olean Agent49PowerThreeShieldSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/PowerThreePlusCompleteSource.lean" Agent49PowerThreePlusCompleteSource.lean
          lake env lean Agent49PowerThreePlusCompleteSource.lean
