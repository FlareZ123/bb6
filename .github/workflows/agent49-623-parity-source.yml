name: Agent 49 BB6 623 original-source parity (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install source-pinned Lean 4.35.0-rc4
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile independently source-matched counter theorem
        run: |
          lean --version
          lean im-results/agent49-parity623/Parity623.lean
      - name: Clone cryptids at the pinned source revision
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet c86f15861709b76042998c5211c7b2f83991621b
          test "$(git rev-parse HEAD)" = c86f15861709b76042998c5211c7b2f83991621b
      - name: Reclaim unused hosted-runner tooling space for Mathlib cache
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          df -h
      - name: Restore authenticated mathlib dependencies
        working-directory: /tmp/cryptids
        run: lake exe cache get
      - name: Compile the unmodified original BB6 623 raw-TM acceleration
        working-directory: /tmp/cryptids
        run: lake build BusyBeaver.BB6.M_1RB0LE_0RC1RC_0RD1LA_1LD0LA_1LF1LC_HHH0LA
      - name: Compile parity theorem referring directly to original Lean definitions
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/Parity623Source.lean" Agent49ParitySource.lean
          lake env lean -o .lake/build/lib/lean/Agent49ParitySource.olean Agent49ParitySource.lean

      - name: Compile Agent8 ternary drain proof against unmodified #623 source
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-inverse/TernaryInverseSource.lean" Agent8TernarySource.lean
          lake env lean Agent8TernarySource.lean

      - name: Verify Agent8 first-counter transport on unchanged source
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-inverse/TernaryFirstSource.lean" Agent8FirstSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8FirstSource.olean Agent8FirstSource.lean

      - name: Verify Agent8 sharp B-drain budget on unchanged source
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-inverse/TernaryBudgetSource.lean" Agent8BudgetSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8BudgetSource.olean Agent8BudgetSource.lean

      - name: Verify Agent49 weighted potential on original source
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/WeightedPotentialSource.lean" Agent49WeightedSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49WeightedSource.olean Agent49WeightedSource.lean

      - name: Verify Agent49 large-mass small-output gain
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/SmallOutputGainSource.lean" Agent49SmallOutputSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49SmallOutputSource.olean Agent49SmallOutputSource.lean

      - name: Verify five exact far-left rays from source-linked transport
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/FixedRaysSource.lean" Agent49FixedRaysSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49FixedRaysSource.olean Agent49FixedRaysSource.lean

      - name: Verify universal 27-unit two-step high-sector gain on original source
        working-directory: /tmp/cryptids
        run: |
          for name in SharpMass SharpMass10 SharpMass12 RootedMass RootedMass19 SharpMass14Aux SharpMass14Even SharpMass14OddAux SharpMass14OddFive SharpMass14Odd SharpMass21Low SharpMass21Pair; do
            cp "$GITHUB_WORKSPACE/im-results/agent8-623-inverse/${name}Source.lean" "Agent8${name}Source.lean"
            lake env lean -o ".lake/build/lib/lean/Agent8${name}Source.olean" "Agent8${name}Source.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/TwoStep27HighSource.lean" Agent49TwoStep27HighSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49TwoStep27HighSource.olean Agent49TwoStep27HighSource.lean

      - name: Verify all six exact low-first-counter returns
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/LowStepSource.lean" Agent49LowStepSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49LowStepSource.olean Agent49LowStepSource.lean
