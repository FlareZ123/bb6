name: Agent 49 post-reset paired carry invariant

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Rebuild and cross-check paired-carry closure data
        run: |
          node im-results/agent49-parity623/postreset_pair_closure.js
      - name: Verify finite paired-carry invariant
        run: |
          lean --version
          lean im-results/agent49-parity623/PostResetCarryPairInvariant.lean
