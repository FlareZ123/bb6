name: Agent 49 post-reset paired carry invariant

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Rebuild and cross-check paired-carry closure data
        run: |
          node im-results/agent49-parity623/postreset_pair_closure.js
      - name: Verify ternary drain offset-statistics identities
        run: |
          mkdir -p /tmp/lean-offset
          cp im-results/agent1-machine623-3euclidean-correction-bounds/DrainDigitTransducerCarry.lean /tmp/lean-offset/DrainDigitTransducerCarry.lean
          cp im-results/agent49-parity623/DrainDigitOffsetStats.lean /tmp/lean-offset/DrainDigitOffsetStats.lean
          cd /tmp/lean-offset
          lean --version
          lean -o DrainDigitTransducerCarry.olean DrainDigitTransducerCarry.lean
          export LEAN_PATH="/tmp/lean-offset:${LEAN_PATH:-}"
          lean DrainDigitOffsetStats.lean 2>&1 | tee offset-stats.log
          if grep -q 'sorryAx' offset-stats.log; then
            echo 'sorryAx detected in drain offset-statistics identities'
            exit 1
          fi
      - name: Verify finite paired-carry invariant
        run: |
          lean --version
          lean im-results/agent49-parity623/PostResetCarryPairInvariant.lean
      - name: Verify paired state machine matches affine carry transducers
        run: |
          mkdir -p /tmp/lean-paired-output
          cp im-results/agent24-machine623-shifted-reset-product/SourceDerivedReset.lean /tmp/lean-paired-output/SourceDerivedReset.lean
          cp im-results/agent48-623-tight-window/SourceCarryAffineBridge.lean /tmp/lean-paired-output/SourceCarryAffineBridge.lean
          cp im-results/agent49-parity623/PostResetCarryPairInvariant.lean /tmp/lean-paired-output/PostResetCarryPairInvariant.lean
          cp im-results/agent49-parity623/PostResetCarryOutputMap.lean /tmp/lean-paired-output/PostResetCarryOutputMap.lean
          cd /tmp/lean-paired-output
          lean --version
          lean -o SourceDerivedReset.olean SourceDerivedReset.lean
          export LEAN_PATH="/tmp/lean-paired-output:${LEAN_PATH:-}"
          lean -o SourceCarryAffineBridge.olean SourceCarryAffineBridge.lean
          lean -o PostResetCarryPairInvariant.olean PostResetCarryPairInvariant.lean
          lean PostResetCarryOutputMap.lean 2>&1 | tee paired-output-map.log
          if grep -q 'sorryAx' paired-output-map.log; then
            echo 'sorryAx detected in paired output-map proof'
            exit 1
          fi
