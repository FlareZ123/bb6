name: Agent 49 root inverse explorer

on:
  push:
    paths:
      - im-results/agent49-parity623/root_inverse_explorer.py
      - .github/workflows/agent49-root-inverse-explorer.yml
  workflow_dispatch:

jobs:
  exploratory-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check inverse candidates against bounded brute force
        run: python im-results/agent49-parity623/root_inverse_explorer.py
