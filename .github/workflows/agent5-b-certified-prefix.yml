name: Agent 5 certified first three Machine B scalar samples (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original Agent 18 scalar model and certified finite B trace
        run: |
          set -euo pipefail
          python3 -m pip install --quiet filelock
          lean --version
          cp im-results/agent18-b-cycle/BReduction.lean Agent18BReduction.lean
          cp im-results/agent18-b-cycle/BOneDim.lean Agent18BOneDim.lean
          lean -o Agent18BReduction.olean Agent18BReduction.lean
          LEAN_PATH="$GITHUB_WORKSPACE" lean -o Agent18BOneDim.olean Agent18BOneDim.lean
          SRC_PARITY="im-results/agent5-b-parity-runs"
          base64 -d "$SRC_PARITY/BParityRuns.lean.xz.b64" | xz -dc > BParityRuns.lean
          echo "7818c8a6b29b4f21773fa9364faad7d6485adcdad0e9fa308f136a2ef2d717fc  BParityRuns.lean" | sha256sum -c -
          lean -o BParityRuns.olean BParityRuns.lean
          LEAN_PATH="$GITHUB_WORKSPACE" lean -o BParityRunsSource.olean "$SRC_PARITY/BParityRunsSource.lean"
          base64 -d "$SRC_PARITY/BParityCoding.lean.xz.b64" | xz -dc > BParityCoding.lean
          echo "5d01059206dce41bdacd8ea45f517ea4659777c0cea219ac8c6b2adb2be4a67c  BParityCoding.lean" | sha256sum -c -
          LEAN_PATH="$GITHUB_WORKSPACE" lean -o BParityCoding.olean BParityCoding.lean
          LEAN_PATH="$GITHUB_WORKSPACE" lean -o BParityCodingSource.olean "$SRC_PARITY/BParityCodingSource.lean"
          LEAN_PATH="$GITHUB_WORKSPACE" lean -o BCollatzDiagonal.olean "$SRC_PARITY/BCollatzDiagonal.lean"
          LEAN_PATH="$GITHUB_WORKSPACE" lean "$SRC_PARITY/BCollatzCriterion.lean"
          base64 -d "$SRC_PARITY/BParityWords.lean.xz.b64" | xz -dc > BParityWords.lean
          echo "d31a748aa486f7fba3e1ac62b26f4a8e1368e73a6cd45040af3a48efc4cf9625  BParityWords.lean" | sha256sum -c -
          LEAN_PATH="$GITHUB_WORKSPACE" lean BParityWords.lean
          base64 -d "$SRC_PARITY/BBlockAffine.lean.xz.b64" | xz -dc > BBlockAffine.lean
          echo "99e82c9be9ab62f8aab75b9f75bcd22ce781000e75f0d1b73dbe59dd72e3fbd7  BBlockAffine.lean" | sha256sum -c -
          LEAN_PATH="$GITHUB_WORKSPACE" lean -o BBlockAffine.olean BBlockAffine.lean
          LEAN_PATH="$GITHUB_WORKSPACE" lean "$SRC_PARITY/BBlockAffineSource.lean"
          python3 "$SRC_PARITY/fast_g.py"
          SRC="im-results/agent5-b-certified-prefix"
          GENERATED="$GITHUB_WORKSPACE/.generated-btrace"
          mkdir -p "$GENERATED"
          python3 "$SRC/make_certificate.py" --output "$GENERATED"
          export LEAN_PATH="$GITHUB_WORKSPACE:$GENERATED:$SRC"
          lean -o "$GENERATED/BTraceCore.olean" "$SRC/BTraceCore.lean"
          for index in $(seq -w 1 28); do
            lean -o "$GENERATED/BTrace$index.olean" "$GENERATED/BTrace$index.lean"
          done
          lean -o "$GENERATED/BTraceFinal.olean" "$GENERATED/BTraceFinal.lean"
          lean -o "$GENERATED/BTraceSource.olean" "$SRC/BTraceSource.lean"
          lean "$SRC/BTraceReach.lean"
          lean -o "$GENERATED/BTraceMagnitude.olean" "$SRC/BTraceMagnitude.lean"
          lean "$SRC/BTraceRuntime.lean"
