name: Agent 5 q0 held BlockFAR certificate verification

on:
  workflow_dispatch:
    inputs:
      proof_mode:
        description: "Generated BlockFAR or symbolic q3500 sweep"
        type: choice
        options: [generated, symbolic-q3500]
        default: generated
      compact:
        description: "Minimize left DFA and use sparse lookup (width 3 only)"
        type: boolean
        default: false
      table:
        description: "Six-state partial table in repository notation"
        type: string
        required: true
        default: "1RB0LD_1LC1RA_1LE1LA_---0RB_1RE0RF_1RF0LC"
      name:
        description: "Lean module basename (letters/digits/underscores)"
        type: string
        required: true
        default: "Q02700"
      width:
        description: "Block width"
        type: number
        required: true
        default: 3
      cap:
        description: "Left-run length cap"
        type: number
        required: true
        default: 2
      modulus:
        description: "Left-run residue modulus"
        type: number
        required: true
        default: 4
      runs:
        description: "Number of left runs retained"
        type: number
        required: true
        default: 5
      flip:
        description: "Reverse direction convention; transport is kernel-checked when true"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Generate finite BlockFAR certificate
        if: inputs.proof_mode == 'generated'
        env:
          COMPACT: ${{ inputs.compact }}
          TABLE: ${{ inputs.table }}
          MODULE_NAME: ${{ inputs.name }}
          WIDTH: ${{ inputs.width }}
          CAP: ${{ inputs.cap }}
          MODULUS: ${{ inputs.modulus }}
          RUNS: ${{ inputs.runs }}
          FLIP: ${{ inputs.flip }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          source = Path("im-results/agent13-block-far/generate_multi.py")
          spec = importlib.util.spec_from_file_location("generate_multi", source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          out = Path("/tmp/q0-blockfar")
          module.generate(
              os.environ["TABLE"], out,
              width=int(os.environ["WIDTH"]),
              cap=int(os.environ["CAP"]),
              mod=int(os.environ["MODULUS"]),
              runs=int(os.environ["RUNS"]),
              flip=os.environ["FLIP"].lower() == "true",
              name=os.environ["MODULE_NAME"],
              minimize_left=os.environ["COMPACT"].lower() == "true",
              sparse=os.environ["COMPACT"].lower() == "true",
          )
          (out / "manifest.txt").write_text(
              "table=" + os.environ["TABLE"] + "\n" +
              "module=" + os.environ["MODULE_NAME"] + "\n" +
              "width=" + os.environ["WIDTH"] + "\n" +
              "cap=" + os.environ["CAP"] + "\n" +
              "modulus=" + os.environ["MODULUS"] + "\n" +
              "runs=" + os.environ["RUNS"] + "\n" +
              "flip=" + os.environ["FLIP"] + "\n",
              encoding="utf-8",
          )
          PY
      - name: Compile and kernel-check generated proof
        if: inputs.proof_mode == 'generated'
        env:
          MODULE_NAME: ${{ inputs.name }}
          FLIP: ${{ inputs.flip }}
          WIDTH: ${{ inputs.width }}
          COMPACT: ${{ inputs.compact }}
        run: |
          set -euo pipefail
          cd im-results/agent13-block-far
          export LEAN_PATH=".:/tmp/q0-blockfar:../agent5-q0-held-blockfar"
          cp "/tmp/q0-blockfar/${MODULE_NAME}Packed.lean" .
          cp "/tmp/q0-blockfar/${MODULE_NAME}Proof.lean" .
          lean -o BlockMacro.olean BlockMacro.lean
          lean -o BlockFAR.olean BlockFAR.lean
          lean -o RangeCheck.olean RangeCheck.lean
          if [ "$COMPACT" = "true" ]; then
            test "$WIDTH" = 3
            lean -o SparseBlockFAR.olean SparseBlockFAR.lean
          fi
          if [ "$WIDTH" = 2 ]; then
            for m in BlockMacro2 BlockFAR2 RangeCheck2; do
              lean -o "$m.olean" "$m.lean"
            done
          fi
          lean -o "${MODULE_NAME}Packed.olean" "${MODULE_NAME}Packed.lean"
          lean -o "${MODULE_NAME}Proof.olean" "${MODULE_NAME}Proof.lean" 2>&1 | tee /tmp/q0-blockfar/compile.log
          cp "${MODULE_NAME}Packed.olean" "${MODULE_NAME}Proof.olean" /tmp/q0-blockfar/
          if [ "$MODULE_NAME" = "Q02700" ] && [ "$FLIP" = "false" ]; then
            # Lean requires source inputs to be contained in its root directory.
            cp ../agent8-coverage-contract/Frontier.lean .
            lean -o /tmp/q0-blockfar/Frontier.olean Frontier.lean 2>&1 | tee -a /tmp/q0-blockfar/compile.log
            lean -o BlockFARBridge.olean BlockFARBridge.lean 2>&1 | tee -a /tmp/q0-blockfar/compile.log
            cp ../agent5-q0-held-blockfar/Q02700Consumer.lean .
            lean -o /tmp/q0-blockfar/Q02700Consumer.olean Q02700Consumer.lean 2>&1 | tee -a /tmp/q0-blockfar/compile.log
            cp BlockFARBridge.olean /tmp/q0-blockfar/

            # Extend the accepted q2700 source cylinder into the exact raw10 encoding.
            cp ../agent49-box-complement/BoxComplement.lean .
            cp ../agent49-box-complement/Raw10Encoded.lean .
            lean -o /tmp/q0-blockfar/BoxComplement.olean BoxComplement.lean 2>&1 | tee -a /tmp/q0-blockfar/compile.log
            lean -o /tmp/q0-blockfar/Raw10Encoded.olean Raw10Encoded.lean 2>&1 | tee -a /tmp/q0-blockfar/compile.log
            lean -o /tmp/q0-blockfar/Raw10Q2700EncodedConsumer.olean Raw10Q2700EncodedConsumer.lean 2>&1 | tee -a /tmp/q0-blockfar/compile.log
          fi
          if [ "$FLIP" = "true" ]; then
            cp ../agent5-q0-held-blockfar/MirrorTransport.lean .
            lean -o MirrorTransport.olean MirrorTransport.lean
            NAMESPACE=BB6BlockFAR
            if [ "$WIDTH" = 2 ]; then NAMESPACE=BB6BlockFAR2; fi
            cat > "${MODULE_NAME}MirrorConsumer.lean" <<EOF
          import ${MODULE_NAME}Proof
          import MirrorTransport
          namespace BB6BlockFAR.${MODULE_NAME}MirrorConsumer
          open BB6BlockFAR
          def originalMachine : Table := mirrorTable ${NAMESPACE}.${MODULE_NAME}.machine
          theorem never_original : ∀ n, ∃ c, run originalMachine n primBlank = some c := by
            apply never_of_mirror originalMachine
            intro n
            simpa [originalMachine, mirrorTable_involutive] using ${NAMESPACE}.${MODULE_NAME}.never n
          #print axioms never_original
          end BB6BlockFAR.${MODULE_NAME}MirrorConsumer
          EOF
            lean -o "${MODULE_NAME}MirrorConsumer.olean" "${MODULE_NAME}MirrorConsumer.lean" | tee -a /tmp/q0-blockfar/compile.log
            cp MirrorTransport.lean MirrorTransport.olean "${MODULE_NAME}MirrorConsumer.lean" "${MODULE_NAME}MirrorConsumer.olean" /tmp/q0-blockfar/
          fi
          if grep -Eq 'sorryAx|native_decide' /tmp/q0-blockfar/compile.log; then
            echo "Forbidden proof placeholder or native_decide found" >&2
            exit 1
          fi
          if [ "$MODULE_NAME" = "Q02700" ] && [ "$FLIP" = "false" ]; then
            python3 - <<'PY'
          import pathlib, re
          log = pathlib.Path("/tmp/q0-blockfar/compile.log").read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          required = [
              "BB6BlockFAR.Q02700.never",
              "BB6.Agent5Q0HeldBlock.q2700_generated_table_exact",
              "BB6.Agent5Q0HeldBlock.q0_2700_never",
              "BB6.Agent5Q0HeldBlock.q0_2700_parent_slots",
              "BB6.Agent5Q0HeldBlock.q0_2700_D0_is_the_only_hole",
              "BB6.Agent13Raw10Q2700Encoded.q2700Row_exact",
              "BB6.Agent13Raw10Q2700Encoded.q2700Cube_within_raw10_parent",
              "BB6.Agent13Raw10Q2700Encoded.q2700_disjoint_from_66_rows",
              "BB6.Agent13Raw10Q2700Encoded.q2700_remainder_exact",
          ]
          for name in required:
              no_axioms = f"'{name}' does not depend on any axioms"
              match = re.search(rf"'{re.escape(name)}' depends on axioms: \[(.*?)\]", log)
              if match:
                  actual = {x.strip() for x in match.group(1).split(",") if x.strip()}
              elif no_axioms in log:
                  actual = set()
              else:
                  raise SystemExit(f"missing #print axioms output for {name}")
              bad = actual - allowed
              if bad:
                  raise SystemExit(f"unexpected axioms for {name}: {sorted(bad)}")
          print("Q02700 source transfer axiom profiles accepted")
          PY
          fi
      - name: Kernel-check symbolic q3500 sweep and original coverage
        if: inputs.proof_mode == 'symbolic-q3500'
        run: |
          set -euo pipefail
          mkdir -p /tmp/q0-blockfar
          cd im-results/agent13-block-far
          export LEAN_PATH=.
          cp ../agent8-coverage-contract/Frontier.lean .
          for m in BlockMacro BlockFAR Frontier BlockFARBridge Q03500Sweep Q03500Consumer; do
            lean -o "$m.olean" "$m.lean" 2>&1 | tee -a /tmp/q0-blockfar/compile.log
          done
          for theorem in solid_grows never source_never cover; do
            grep -F "'BB6Q03500.$theorem' depends on axioms:" /tmp/q0-blockfar/compile.log
          done
          if grep -Eq 'sorryAx|native_decide' /tmp/q0-blockfar/compile.log; then
            exit 1
          fi
          cp Q03500Sweep.lean Q03500Consumer.lean Q03500Sweep.olean Q03500Consumer.olean /tmp/q0-blockfar/
      - name: Upload generated certificate and kernel log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q0-held-blockfar-${{ inputs.name }}-runs-${{ inputs.runs }}
          path: /tmp/q0-blockfar/
          if-no-files-found: warn
