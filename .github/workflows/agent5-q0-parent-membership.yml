name: Agent 5 q0 parent membership audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  membership:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Unpack shared Lean sources and compute canonical parent matches
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py --out /tmp/q0-parent
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          # Canonical78Roster also imports the Agent10 raw66/raw70/raw80 source modules.
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python tools/lean_compile_closure.py --workdir /tmp/q0-parent --jobs 4 im-results/agent5-q0-held-blockfar/ParentMembership.lean | tee /tmp/q0-parent.log
          if grep -Eq 'sorryAx|native_decide' /tmp/q0-parent.log; then
            echo "Forbidden proof placeholder or native_decide found" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q0-canonical-parent-membership
          path: |
            /tmp/q0-parent.log
            /tmp/q0-parent/*.olean
          if-no-files-found: warn
