name: Agent 5 Raw11 parent source covers
on:
  workflow_dispatch:
    inputs:
      generation_run:
        description: Existing source-generation run (optional)
        type: string
        default: ''
      parents:
        description: JSON list of extra indices with complete candidate certificates
        type: string
        default: '[126,127,128,129,130,137,140]'
      extended_automata:
        description: Search unresolved open leaves with the broader FAR automata family (generic generator)
        type: boolean
        default: false
      generator:
        description: Generic extra-parent generator or retained Extra29 CachedPhaseTree candidate
        type: choice
        default: generic
        options: [generic, coarse-extra]
      chunk:
        description: Maximum ordinary proof chunk nodes for coarse-extra
        type: string
        default: '200'
      module_nodes:
        description: Maximum generated Lean module nodes for coarse-extra
        type: string
        default: '500'
permissions:
  contents: read
  actions: read
jobs:
  cover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        parent: ${{ fromJSON(inputs.parents) }}
    env:
      ID: ${{ matrix.parent }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          "$HOME/.elan/bin/lean" --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45889628989
          name: raw11-root52-known-consumption
          path: /tmp/raw11-cache
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45896597080
          pattern: raw11-six-hole-*
          merge-multiple: true
          path: /tmp/raw11-six-data
      - uses: actions/download-artifact@v4
        if: inputs.generation_run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.generation_run }}
          name: raw11-extra-parent-${{ matrix.parent }}
          path: /tmp/raw11-source
      - name: Recover generated source and repair alias types
        if: inputs.generation_run != ''
        run: |
          mv /tmp/raw11-source/raw11-generated /tmp/raw11-generated
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path("/tmp/raw11-generated")
          b=json.loads((root/"manifest.json").read_text())["bound"]
          for p in root.glob("*Kid*.lean"):
              s=p.read_text().replace("theorem safe := ",f"theorem safe : ∀ m, compatible parent m → WeightedBound {b} m := ")
              p.write_text(s)
          PY
      - name: Validate generator configuration
        env:
          ID: ${{ matrix.parent }}
          GENERATOR: ${{ inputs.generator }}
          GENERATION_RUN: ${{ inputs.generation_run }}
        run: |
          set -euo pipefail
          if [ "$GENERATOR" = coarse-extra ]; then
            test "$ID" = 29
            test -z "$GENERATION_RUN"
          fi

      - name: Reconstruct pinned coverage contract
        run: python im-results/agent13-coverage/unpack.py

      - uses: actions/setup-node@v4
        if: inputs.generator == 'coarse-extra'
        with:
          node-version: 20

      - name: Generate exact child proofs with generic extra search
        if: inputs.generation_run == '' && inputs.generator == 'generic'
        env:
          SIX_HOLE_DATA: /tmp/raw11-six-data
          RAW11_EXTENDED_AUTOMATA: ${{ inputs.extended_automata && '1' || '0' }}
        run: |
          set -euo pipefail
          node im-results/agent5-weighted-tnf-queue/generate-extra-parent-shards.cjs "$ID" /tmp/raw11-generated
      - name: Generate Extra29 CachedPhaseTree shards from retained exact candidate
        if: inputs.generation_run == '' && inputs.generator == 'coarse-extra'
        env:
          ID: ${{ matrix.parent }}
          CHUNK: ${{ inputs.chunk }}
          MODULE_NODES: ${{ inputs.module_nodes }}
        run: |
          set -euo pipefail
          node im-results/agent44-raw11-extra29/scan.cjs /tmp/extra29-scan
          RAW11_PARENT_KIND=extra node im-results/agent5-weighted-tnf-queue/generate-coarse-parent-shards.cjs \
            "$ID" /tmp/extra29-scan /tmp/raw11-generated "$CHUNK" "$MODULE_NODES"
      - name: Compile exact generated proof closure
        run: |
          set -euo pipefail
          cache=/tmp/raw11-cache/tmp/a47-raw11-root52-known
          test -f "$cache/manifest.json"
          mkdir -p /tmp/raw11-certified
          export PREFIX="Agent5Raw11Extra$ID"
          BOUND=$(python -c 'import json; print(json.load(open("/tmp/raw11-generated/manifest.json"))["bound"])')
          PARENT_TABLE=$(python -c 'import json; print(json.load(open("/tmp/raw11-generated/manifest.json"))["table"])')
          PROVENANCE_ARGS=()
          for f in /tmp/raw11-six-data/six-hole-scan-*.json; do
            [ -f "$f" ] && PROVENANCE_ARGS+=(--provenance-input "$f")
          done
          python tools/lean_compile_closure.py "/tmp/raw11-generated/$PREFIX.lean" \
            --source-root /tmp/raw11-generated \
            --source-root im-results/agent47-raw11-adapter \
            --source-root im-results/agent5-weighted-tnf-queue \
            --source-root im-results/agent13-coverage \
            --source-root im-results/agent50-weighted-tnf-pilot \
            --workdir /tmp/raw11-certified \
            --artifact-dir /tmp/raw11-certified \
            --jobs 1 \
            --lean "$(elan which lean)" \
            --precompiled-manifest "$cache/manifest.json" \
            --precompiled-dir "$cache" \
            --manifest /tmp/raw11-certified/manifest.json \
            --label "Agent5 Raw11 extra parent $ID" \
            --theorem "BB6.$PREFIX.cover" \
            --parent-table "$PARENT_TABLE" \
            --weighted-bound "$BOUND" \
            --provenance-input im-results/agent5-weighted-tnf-queue/generate-extra-parent-shards.cjs \
            --provenance-input im-results/agent5-weighted-tnf-queue/generate-coarse-parent-shards.cjs \
            --provenance-input im-results/agent44-raw11-extra29/scan.cjs \
            --provenance-input im-results/agent13-coverage/unpack.py \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            --provenance-input im-results/agent5-weighted-tnf-queue/q0-open-automata.cjs \
            --provenance-input im-results/agent47-raw11-adapter/raw11-route.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/raw11-capped-extra-automata.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/raw11-capped-extra-automata-more.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/raw11-capped-extra140-last-automata.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/raw11-six-hole-131-133.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/raw11-six-hole-131-last-automata.json \
            "${PROVENANCE_ARGS[@]}" | tee /tmp/raw11-parent.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw11-parent.log; then exit 1; fi
          grep -F "BB6.$PREFIX.cover' depends on axioms:" /tmp/raw11-parent.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-extra-parent-${{ matrix.parent }}
          path: |
            /tmp/raw11-generated
            /tmp/raw11-certified
            /tmp/raw11-kids.log
            /tmp/raw11-parent.log
          if-no-files-found: warn
          retention-days: 30
