            --provenance-input im-results/agent5-weighted-tnf-queue/generate-coarse-parent-shards.cjs \
            --provenance-input im-results/agent5-weighted-tnf-queue/shard-coarse-proof.py \
            2>&1 | tee /tmp/coarse-cover.log
          if grep -Eq 'sorryAx|native_decide' /tmp/coarse-cover.log; then exit 1; fi
