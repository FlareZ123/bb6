  sharded-check:
    if: inputs.mode == 'cover-sharded' && needs.sharded-core.outputs.remaining == '0'
    needs: sharded-core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.sharded-core.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: raw11-q0-sharded-core-${{ needs.sharded-core.outputs.id }}
