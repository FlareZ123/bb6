          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check dependency-closed source shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          mapfile -t MODS < "/tmp/coarse-generated/shard-$SHARD.txt"
          mkdir -p /tmp/coarse-shard
          if [ "${#MODS[@]}" -eq 0 ]; then
            cp /tmp/coarse-core/manifest.json /tmp/coarse-shard/manifest.json
            echo 'Empty shard' > /tmp/coarse-shard/check.log
          else
            ROOTS=()
            for mod in "${MODS[@]}"; do ROOTS+=("/tmp/coarse-generated/$mod.lean"); done
            python tools/lean_compile_closure.py "${ROOTS[@]}" \
              --source-root /tmp/coarse-generated --workdir /tmp/coarse-shard \
              --manifest /tmp/coarse-shard/manifest.json --jobs 2 --lean lean \
              --precompiled-manifest /tmp/coarse-core/manifest.json --precompiled-dir /tmp/coarse-core \
