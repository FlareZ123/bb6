name: Agent 5 Raw11 coarse q0 scan
run-name: Agent 5 Raw11 q0 ${{ inputs.mode }} ${{ inputs.indices }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Legacy shallow scan, complete normalized discovery, or six-pump source preflight
        required: true
        default: legacy
        type: choice
        options: [legacy, full, full-prefix, pumps, cover, counter, pair143, roster143, ten143, cached, cover-sharded]
      generation_run:
        description: Retained full-scan run with candidate tree artifacts
        type: string
        default: '45926582144'
      chunk:
        description: Maximum ordinary certificate chunk nodes
        type: string
        default: '400'
      revision:
        description: Exact source revision (empty uses dispatch SHA)
        type: string
        default: ''
      indices:
        description: JSON array of q0 target indices to scan
        required: true
        default: "[138,140,141,142,143,154]"
        type: string
      previous:
        description: Previous Raw11 q0 consumer module
        required: true
        default: "Raw11Q0BankSmall"
        type: string
      old_count:
        description: Previous remaining roster size
        required: true
        default: "167"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  scan:
    if: inputs.mode == 'legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate candidate q0 Covers
        env:
          INDICES: ${{ inputs.indices }}
          PREVIOUS: ${{ inputs.previous }}
          OLD_COUNT: ${{ inputs.old_count }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/raw11-q0-coarse"
          cp im-results/agent47-raw11-adapter/raw11-route.json "$RUNNER_TEMP/raw11-q0-coarse/raw11-route.json"
          cd "$RUNNER_TEMP/raw11-q0-coarse"
          IDS="$(node -e 'const xs=JSON.parse(process.env.INDICES); if(!Array.isArray(xs)||xs.some(x=>!Number.isInteger(x))) process.exit(2); process.stdout.write(xs.join(" "))')"
          node "$GITHUB_WORKSPACE/im-results/agent47-raw11-adapter/generate-q0-bank-consume.cjs" Raw11Q0Coarse "$PREVIOUS" "$OLD_COUNT" $IDS | tee scan-summary.json
          python - <<'PY'
          import json, pathlib
          rows=json.loads(pathlib.Path("scan-summary.json").read_text())
          lines=["## Raw11 coarse q0 scan","", "| q0 index | closed | nodes | bound | side | split | last | open | automata | cap |","|---:|:---:|---:|---:|---:|---:|---:|---:|---:|---:|"]
          for r in rows:
              s=r.get("stats",{})
              lines.append(f"| {r['id']} | {'yes' if r['closed'] else 'no'} | {r['nodes']} | {r['bound']} | {s.get('side',0)} | {s.get('split',0)} | {s.get('last',0)} | {s.get('open',0)} | {s.get('auto',0)} | {s.get('cap',0)} |")
          pathlib.Path("summary.md").write_text("\n".join(lines)+"\n")
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: raw11-coarse-q0-scan
          path: |
            ${{ runner.temp }}/raw11-q0-coarse/*.lean
            ${{ runner.temp }}/raw11-q0-coarse/scan-summary.json
            ${{ runner.temp }}/raw11-q0-coarse/summary.md
          if-no-files-found: error
          retention-days: 30

  full:
    if: inputs.mode == 'full' || inputs.mode == 'full-prefix'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        id: ${{ fromJSON(inputs.indices) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Complete first-hole candidate scan with retained open and capped leaves
        env:
          ID: ${{ matrix.id }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          SCANNER=scan-q0-coarse-full.cjs
          if [ "$MODE" = full-prefix ]; then SCANNER=scan-q0-prefix.cjs; fi
          node "im-results/agent5-weighted-tnf-queue/$SCANNER" "$ID" "$RUNNER_TEMP/coarse-$ID"
          cat "$RUNNER_TEMP/coarse-$ID/summary.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-coarse-full-${{ matrix.id }}
          path: ${{ runner.temp }}/coarse-${{ matrix.id }}/
          if-no-files-found: warn
          retention-days: 30

  pumps:
    if: inputs.mode == 'pumps'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact six-pump source closure
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py im-results/agent5-weighted-tnf-queue/Raw11Q0CoarsePumps.lean \
            --workdir /tmp/raw11-q0-pumps \
            --manifest /tmp/raw11-q0-pumps/manifest.json \
            --jobs 2 --lean lean \
            --label raw11-q0-six-coarse-pumps \
            --provenance-input im-results/agent5-weighted-tnf-queue/q0-coarse-pumps.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/verify-coarse-pumps.cjs \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            2>&1 | tee /tmp/raw11-q0-pumps.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw11-q0-pumps.log; then exit 1; fi
          for id in 138 140 141 142 143 154; do
            grep -F "BB6Coverage.Agent31Pump.Auto.Raw11Q0Coarse.cover$id' depends on axioms:" /tmp/raw11-q0-pumps.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-q0-six-coarse-pumps
          path: |
            /tmp/raw11-q0-pumps/
            /tmp/raw11-q0-pumps.log
          if-no-files-found: warn
          retention-days: 30

  cover:
    if: inputs.mode == 'cover'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        id: ${{ fromJSON(inputs.indices) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      ID: ${{ matrix.id }}
      CHUNK: ${{ inputs.chunk }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.generation_run }}
          name: raw11-coarse-full-${{ matrix.id }}
          path: /tmp/coarse-candidate
      - name: Generate exact sharded Lean source from the retained candidate
        run: |
          set -euo pipefail
          node im-results/agent5-weighted-tnf-queue/generate-coarse-parent-shards.cjs "$ID" /tmp/coarse-candidate /tmp/coarse-generated "$CHUNK"
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile complete original-source proof closure
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          THEOREM="$(python -c 'import json;print(json.load(open("/tmp/coarse-generated/manifest.json"))["theorem"])')"
          TABLE="$(python -c 'import json;print(json.load(open("/tmp/coarse-generated/manifest.json"))["table"])')"
          BOUND="$(python -c 'import json;print(json.load(open("/tmp/coarse-generated/manifest.json"))["bound"])')"
          python tools/lean_compile_closure.py "/tmp/coarse-generated/Agent5Q0Coarse$ID.lean" \
            --source-root /tmp/coarse-generated \
            --workdir /tmp/coarse-certified \
            --manifest /tmp/coarse-certified/manifest.json \
            --jobs 4 --lean lean \
            --label "Raw11 q0 coarse $ID" \
            --theorem "$THEOREM" --parent-table "$TABLE" --weighted-bound "$BOUND" \
            --provenance-input /tmp/coarse-candidate/summary.json \
            --provenance-input /tmp/coarse-candidate/tree.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/generate-coarse-parent-shards.cjs \
            --provenance-input im-results/agent5-weighted-tnf-queue/scan-q0-coarse-full.cjs \
            --provenance-input im-results/agent5-weighted-tnf-queue/q0-coarse-long-holes.json \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            2>&1 | tee /tmp/coarse-cover.log
          if grep -Eq 'sorryAx|native_decide' /tmp/coarse-cover.log; then exit 1; fi
          grep -F "$THEOREM' depends on axioms:" /tmp/coarse-cover.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-coarse-cover-${{ matrix.id }}
          path: |
            /tmp/coarse-generated/
            /tmp/coarse-certified/
            /tmp/coarse-cover.log
          if-no-files-found: warn
          retention-days: 30

  counter:
    if: inputs.mode == 'counter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact two-counter return region
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py im-results/agent5-weighted-tnf-queue/Raw11Q0Counter138.lean \
            --workdir /tmp/raw11-q0-counter \
            --manifest /tmp/raw11-q0-counter/manifest.json \
            --jobs 2 --lean lean \
            --label raw11-q0-138-counter \
            --provenance-input im-results/agent5-weighted-tnf-queue/q0-138-counter-fixtures.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/discover-parametric.cjs \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            2>&1 | tee /tmp/raw11-q0-counter.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw11-q0-counter.log; then exit 1; fi
          grep -F "BB6Coverage.Agent31Pump.Multi.Raw11Q0Counter138.cover' depends on axioms:" /tmp/raw11-q0-counter.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-q0-138-counter
          path: |
            /tmp/raw11-q0-counter/
            /tmp/raw11-q0-counter.log
          if-no-files-found: warn
          retention-days: 30

  pair143:
    if: inputs.mode == 'pair143'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact pair of alternating return regions
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py im-results/agent5-weighted-tnf-queue/Raw11Q0Pair143Rules.lean \
            --workdir /tmp/raw11-q0-pair143 \
            --manifest /tmp/raw11-q0-pair143/manifest.json \
            --jobs 2 --lean lean \
            --label raw11-q0-143-pair \
            --provenance-input im-results/agent5-weighted-tnf-queue/q0-143-tail-fixtures.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/discover-tail.cjs \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            2>&1 | tee /tmp/raw11-q0-pair143.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw11-q0-pair143.log; then exit 1; fi
          grep -F "BB6Coverage.Agent31Pump.Tails.Raw11Q0Pair143.M0.cover' depends on axioms:" /tmp/raw11-q0-pair143.log
          grep -F "BB6Coverage.Agent31Pump.Tails.Raw11Q0Pair143.M1.cover' depends on axioms:" /tmp/raw11-q0-pair143.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-q0-143-pair
          path: |
            /tmp/raw11-q0-pair143/
            /tmp/raw11-q0-pair143.log
          if-no-files-found: warn
          retention-days: 30

  roster143:
    if: inputs.mode == 'roster143'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.generation_run }}
          name: raw11-coarse-full-143
          path: /tmp/coarse-143
      - name: Preserve exact retained frontier from existing artifact, without a new scan
        env:
          GENERATION_RUN: ${{ inputs.generation_run }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, os
          d=pathlib.Path('im-results/agent5-weighted-tnf-queue')
          s=json.loads(pathlib.Path('/tmp/coarse-143/summary.json').read_text())
          route=json.loads(pathlib.Path('im-results/agent47-raw11-adapter/raw11-route.json').read_text())
          assert s['id']==143 and s['table']==route['targets'][143]
          assert len(s['opens'])==s['stats']['open']
          assert len(s['pending'])==s['stats']['cap']
          norm=lambda t:t.replace('_','')
          long={norm(x['table']):x for x in json.loads((d/'q0-coarse-long-holes.json').read_text()) if x['root']==143}
          pairs={x['table'] for x in json.loads((d/'q0-143-tail-fixtures.json').read_text()).values()}
          assert len(set(map(norm,s['opens'])))==len(s['opens'])
          assert long.keys() <= set(map(norm,s['opens'])) and pairs <= set(map(norm,s['opens']))
          assert not long.keys() & pairs
          out={'generation_run':os.environ['GENERATION_RUN'],'id':143,'parent':s['table'],'stats':s['stats'],
               'open':s['opens'],'pending':s['pending'],
               'finite_hole_candidates':[t for t in s['opens'] if norm(t) in long],
               'pair_proof_tables':[t for t in s['opens'] if norm(t) in pairs],
               'remaining':[t for t in s['opens'] if norm(t) not in long and norm(t) not in pairs]}
          (d/'q0-143-exact-frontier.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          git config user.name 'Agent 5 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add im-results/agent5-weighted-tnf-queue/q0-143-exact-frontier.json
          git commit -m "Agent 5: preserve exact q0-143 residual roster from run $GENERATION_RUN"
          git push origin "HEAD:refs/heads/agent5-q0-143-roster-$RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: raw11-q0-143-exact-frontier
          path: im-results/agent5-weighted-tnf-queue/q0-143-exact-frontier.json
          if-no-files-found: error
          retention-days: 30
  ten143:
    if: inputs.mode == 'ten143'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact ten remaining return regions
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py im-results/agent5-weighted-tnf-queue/Raw11Q0Ten143.lean \
            --workdir /tmp/raw11-q0-ten143 \
            --manifest /tmp/raw11-q0-ten143/manifest.json \
            --jobs 2 --lean lean \
            --label raw11-q0-143-ten \
            --provenance-input im-results/agent5-weighted-tnf-queue/q0-143-ten-fixtures.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/discover-tail.cjs \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            2>&1 | tee /tmp/raw11-q0-ten143.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw11-q0-ten143.log; then exit 1; fi
          for id in {0..9}; do
            grep -F "BB6Coverage.Agent31Pump.Tails.Raw11Q0Ten143.M$id.cover' depends on axioms:" /tmp/raw11-q0-ten143.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-q0-143-ten
          path: |
            /tmp/raw11-q0-ten143/
            /tmp/raw11-q0-ten143.log
          if-no-files-found: warn
          retention-days: 30

  cached:
    if: inputs.mode == 'cached'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact shared first-hole prefix checker
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py im-results/agent5-weighted-tnf-queue/CachedPhaseTree.lean \
            --workdir /tmp/raw11-q0-cached \
            --manifest /tmp/raw11-q0-cached/manifest.json \
            --jobs 2 --lean lean \
            --label raw11-q0-cached \
            --provenance-input im-results/agent5-weighted-tnf-queue/discover-tail.cjs \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            2>&1 | tee /tmp/raw11-q0-cached.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw11-q0-cached.log; then exit 1; fi
          grep -F "BB6.Agent5CachedPhaseTree.sound' depends on axioms:" /tmp/raw11-q0-cached.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-q0-cached
          path: |
            /tmp/raw11-q0-cached/
            /tmp/raw11-q0-cached.log
          if-no-files-found: warn
          retention-days: 30


  sharded-core:
    if: inputs.mode == 'cover-sharded'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      id: ${{ steps.prepare.outputs.id }}
      remaining: ${{ steps.frontier.outputs.remaining }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Select exactly one frozen parent
        id: prepare
        env:
          INDICES: ${{ inputs.indices }}
        run: |
          python - <<'PY'
          import json, os
          ids = json.loads(os.environ['INDICES'])
          assert isinstance(ids, list) and len(ids) == 1 and type(ids[0]) is int
          with open('im-results/agent47-raw11-adapter/raw11-route.json') as route_file:
              assert 0 <= ids[0] < len(json.load(route_file)['targets'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('id='+str(ids[0]), file=f)
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.generation_run }}
          name: raw11-coarse-full-${{ steps.prepare.outputs.id }}
          path: /tmp/coarse-candidate
      - name: Generate and partition frozen proof
        env:
          ID: ${{ steps.prepare.outputs.id }}
          CHUNK: ${{ inputs.chunk }}
        run: |
          set -euo pipefail
          node im-results/agent5-weighted-tnf-queue/generate-coarse-parent-shards.cjs "$ID" /tmp/coarse-candidate /tmp/coarse-generated "$CHUNK"
          python im-results/agent5-weighted-tnf-queue/shard-coarse-proof.py partition /tmp/coarse-generated 8
      - name: Retain generated proof and exact residual frontier before compilation
        id: frontier
        run: |
          python - <<'PY'
          import json, os
          m = json.load(open('/tmp/coarse-generated/manifest.json'))
          n = len(m['remaining'])
          tag = 'raw11-q0-prepared-%d-B%d-R%d' % (m['id'], m['bound'], n)
          for table in m['remaining'][:3]:
              tag += '-' + table.replace('_','')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              print('remaining='+str(n), file=f)
              print('tag='+tag, file=f)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.frontier.outputs.tag }}
          path: /tmp/coarse-generated/
          if-no-files-found: error
          retention-days: 30
      - name: Install Lean 4.36.0-rc2
        if: steps.frontier.outputs.remaining == '0'
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile common source dependency closure once
        if: steps.frontier.outputs.remaining == '0'
        env:
          ID: ${{ steps.prepare.outputs.id }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py "/tmp/coarse-generated/Agent5Q0Coarse${ID}Core.lean" \
            --source-root /tmp/coarse-generated --workdir /tmp/coarse-core \
            --manifest /tmp/coarse-core/manifest.json --jobs 4 --lean lean \
            --label "q0 $ID sharded core" 2>&1 | tee /tmp/coarse-core.log
          if grep -Eq 'sorryAx|native_decide' /tmp/coarse-core.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: steps.frontier.outputs.remaining == '0'
        with:
          name: raw11-q0-sharded-core-${{ steps.prepare.outputs.id }}
          path: |
            /tmp/coarse-generated/
            /tmp/coarse-core/
            /tmp/coarse-core.log
          if-no-files-found: error
          retention-days: 30

  sharded-check:
    if: inputs.mode == 'cover-sharded' && needs.sharded-core.outputs.remaining == '0'
    needs: sharded-core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: raw11-q0-sharded-core-${{ needs.sharded-core.outputs.id }}
          path: /tmp
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check dependency-closed source shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          mapfile -t MODS < "/tmp/coarse-generated/shard-$SHARD.txt"
          mkdir -p /tmp/coarse-shard
          if [ "${#MODS[@]}" -eq 0 ]; then
            cp /tmp/coarse-core/manifest.json /tmp/coarse-shard/manifest.json
            echo 'Empty shard' > /tmp/coarse-shard/check.log
          else
            ROOTS=()
            for mod in "${MODS[@]}"; do ROOTS+=("/tmp/coarse-generated/$mod.lean"); done
            python tools/lean_compile_closure.py "${ROOTS[@]}" \
              --source-root /tmp/coarse-generated --workdir /tmp/coarse-shard \
              --manifest /tmp/coarse-shard/manifest.json --jobs 2 --lean lean \
              --precompiled-manifest /tmp/coarse-core/manifest.json --precompiled-dir /tmp/coarse-core \
              --label "q0 subroot shard $SHARD" 2>&1 | tee /tmp/coarse-shard/check.log
            if grep -Eq 'sorryAx|native_decide' /tmp/coarse-shard/check.log; then exit 1; fi
            python im-results/agent5-weighted-tnf-queue/shard-coarse-proof.py thin /tmp/coarse-core /tmp/coarse-shard
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw11-q0-sharded-part-${{ needs.sharded-core.outputs.id }}-${{ matrix.shard }}
          path: /tmp/coarse-shard/
          if-no-files-found: error
          retention-days: 30

  sharded-join:
    if: inputs.mode == 'cover-sharded' && needs.sharded-core.outputs.remaining == '0'
    needs: [sharded-core, sharded-check]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: raw11-q0-sharded-core-${{ needs.sharded-core.outputs.id }}
          path: /tmp
      - uses: actions/download-artifact@v4
        with:
          pattern: raw11-q0-sharded-part-${{ needs.sharded-core.outputs.id }}-*
          path: /tmp/coarse-parts
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.generation_run }}
          name: raw11-coarse-full-${{ needs.sharded-core.outputs.id }}
          path: /tmp/coarse-candidate
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Merge exact objects and check actual parent Cover
        env:
          ID: ${{ needs.sharded-core.outputs.id }}
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          PARTS=(/tmp/coarse-parts/raw11-q0-sharded-part-"$ID"-*)
          test "${#PARTS[@]}" -eq 8
          python im-results/agent5-weighted-tnf-queue/shard-coarse-proof.py merge /tmp/coarse-core /tmp/coarse-union "${PARTS[@]}"
          THEOREM="$(python -c 'import json;print(json.load(open("/tmp/coarse-generated/manifest.json"))["theorem"])')"
          TABLE="$(python -c 'import json;print(json.load(open("/tmp/coarse-generated/manifest.json"))["table"])')"
          BOUND="$(python -c 'import json;print(json.load(open("/tmp/coarse-generated/manifest.json"))["bound"])')"
          python tools/lean_compile_closure.py "/tmp/coarse-generated/Agent5Q0Coarse$ID.lean" \
            --source-root /tmp/coarse-generated --workdir /tmp/coarse-certified \
            --manifest /tmp/coarse-certified/manifest.json --jobs 2 --lean lean \
            --precompiled-manifest /tmp/coarse-union/manifest.json --precompiled-dir /tmp/coarse-union \
            --label "Raw11 q0 coarse $ID sharded" --theorem "$THEOREM" --parent-table "$TABLE" --weighted-bound "$BOUND" \
            --provenance-input /tmp/coarse-candidate/summary.json \
            --provenance-input /tmp/coarse-candidate/tree.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/generate-coarse-parent-shards.cjs \
            --provenance-input im-results/agent5-weighted-tnf-queue/shard-coarse-proof.py \
            2>&1 | tee /tmp/coarse-cover.log
          if grep -Eq 'sorryAx|native_decide' /tmp/coarse-cover.log; then exit 1; fi
          grep -F "$THEOREM' depends on axioms:" /tmp/coarse-cover.log
      - uses: actions/upload-artifact@v4
        with:
          name: raw11-coarse-cover-${{ needs.sharded-core.outputs.id }}
          path: |
            /tmp/coarse-generated/
            /tmp/coarse-certified/
            /tmp/coarse-cover.log
          if-no-files-found: error
          retention-days: 30
