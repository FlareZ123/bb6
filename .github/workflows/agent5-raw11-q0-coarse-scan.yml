name: Agent 5 Raw11 coarse q0 scan

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Legacy shallow scan, complete normalized discovery, or six-pump source preflight
        required: true
        default: legacy
        type: choice
        options: [legacy, full, pumps, cover, counter]
      generation_run:
        description: Retained full-scan run with candidate tree artifacts
        type: string
        default: '45926582144'
      chunk:
        description: Maximum ordinary certificate chunk nodes
        type: string
        default: '400'
      revision:
        description: Exact source revision (empty uses dispatch SHA)
        type: string
        default: ''
      indices:
        description: JSON array of q0 target indices to scan
        required: true
        default: "[138,140,141,142,143,154]"
        type: string
      previous:
        description: Previous Raw11 q0 consumer module
        required: true
        default: "Raw11Q0BankSmall"
        type: string
      old_count:
        description: Previous remaining roster size
        required: true
        default: "167"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  scan:
    if: inputs.mode == 'legacy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate candidate q0 Covers
        env:
          INDICES: ${{ inputs.indices }}
          PREVIOUS: ${{ inputs.previous }}
          OLD_COUNT: ${{ inputs.old_count }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/raw11-q0-coarse"
          cp im-results/agent47-raw11-adapter/raw11-route.json "$RUNNER_TEMP/raw11-q0-coarse/raw11-route.json"
          cd "$RUNNER_TEMP/raw11-q0-coarse"
          IDS="$(node -e 'const xs=JSON.parse(process.env.INDICES); if(!Array.isArray(xs)||xs.some(x=>!Number.isInteger(x))) process.exit(2); process.stdout.write(xs.join(" "))')"
          node "$GITHUB_WORKSPACE/im-results/agent47-raw11-adapter/generate-q0-bank-consume.cjs" Raw11Q0Coarse "$PREVIOUS" "$OLD_COUNT" $IDS | tee scan-summary.json
          python - <<'PY'
          import json, pathlib
          rows=json.loads(pathlib.Path("scan-summary.json").read_text())
          lines=["## Raw11 coarse q0 scan","", "| q0 index | closed | nodes | bound | side | split | last | open | automata | cap |","|---:|:---:|---:|---:|---:|---:|---:|---:|---:|---:|"]
          for r in rows:
              s=r.get("stats",{})
              lines.append(f"| {r['id']} | {'yes' if r['closed'] else 'no'} | {r['nodes']} | {r['bound']} | {s.get('side',0)} | {s.get('split',0)} | {s.get('last',0)} | {s.get('open',0)} | {s.get('auto',0)} | {s.get('cap',0)} |")
          pathlib.Path("summary.md").write_text("\n".join(lines)+"\n")
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: raw11-coarse-q0-scan
          path: |
            ${{ runner.temp }}/raw11-q0-coarse/*.lean
            ${{ runner.temp }}/raw11-q0-coarse/scan-summary.json
            ${{ runner.temp }}/raw11-q0-coarse/summary.md
          if-no-files-found: error
          retention-days: 30

  full:
    if: inputs.mode == 'full'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        id: ${{ fromJSON(inputs.indices) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Complete first-hole candidate scan with retained open and capped leaves
        env:
          ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          node im-results/agent5-weighted-tnf-queue/scan-q0-coarse-full.cjs "$ID" "$RUNNER_TEMP/coarse-$ID"
          cat "$RUNNER_TEMP/coarse-$ID/summary.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-coarse-full-${{ matrix.id }}
          path: ${{ runner.temp }}/coarse-${{ matrix.id }}/
          if-no-files-found: warn
          retention-days: 30

  pumps:
    if: inputs.mode == 'pumps'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact six-pump source closure
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py im-results/agent5-weighted-tnf-queue/Raw11Q0CoarsePumps.lean \
            --workdir /tmp/raw11-q0-pumps \
            --manifest /tmp/raw11-q0-pumps/manifest.json \
            --jobs 2 --lean lean \
            --label raw11-q0-six-coarse-pumps \
            --provenance-input im-results/agent5-weighted-tnf-queue/q0-coarse-pumps.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/verify-coarse-pumps.cjs \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            2>&1 | tee /tmp/raw11-q0-pumps.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw11-q0-pumps.log; then exit 1; fi
          for id in 138 140 141 142 143 154; do
            grep -F "BB6Coverage.Agent31Pump.Auto.Raw11Q0Coarse.cover$id' depends on axioms:" /tmp/raw11-q0-pumps.log
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-q0-six-coarse-pumps
          path: |
            /tmp/raw11-q0-pumps/
            /tmp/raw11-q0-pumps.log
          if-no-files-found: warn
          retention-days: 30

  cover:
    if: inputs.mode == 'cover'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        id: ${{ fromJSON(inputs.indices) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      ID: ${{ matrix.id }}
      CHUNK: ${{ inputs.chunk }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.generation_run }}
          name: raw11-coarse-full-${{ matrix.id }}
          path: /tmp/coarse-candidate
      - name: Generate exact sharded Lean source from the retained candidate
        run: |
          set -euo pipefail
          node im-results/agent5-weighted-tnf-queue/generate-coarse-parent-shards.cjs "$ID" /tmp/coarse-candidate /tmp/coarse-generated "$CHUNK"
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile complete original-source proof closure
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          THEOREM="$(python -c 'import json;print(json.load(open("/tmp/coarse-generated/manifest.json"))["theorem"])')"
          TABLE="$(python -c 'import json;print(json.load(open("/tmp/coarse-generated/manifest.json"))["table"])')"
          BOUND="$(python -c 'import json;print(json.load(open("/tmp/coarse-generated/manifest.json"))["bound"])')"
          python tools/lean_compile_closure.py "/tmp/coarse-generated/Agent5Q0Coarse$ID.lean" \
            --source-root /tmp/coarse-generated \
            --workdir /tmp/coarse-certified \
            --manifest /tmp/coarse-certified/manifest.json \
            --jobs 4 --lean lean \
            --label "Raw11 q0 coarse $ID" \
            --theorem "$THEOREM" --parent-table "$TABLE" --weighted-bound "$BOUND" \
            --provenance-input /tmp/coarse-candidate/summary.json \
            --provenance-input /tmp/coarse-candidate/tree.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/generate-coarse-parent-shards.cjs \
            --provenance-input im-results/agent5-weighted-tnf-queue/scan-q0-coarse-full.cjs \
            --provenance-input im-results/agent5-weighted-tnf-queue/q0-coarse-long-holes.json \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            2>&1 | tee /tmp/coarse-cover.log
          if grep -Eq 'sorryAx|native_decide' /tmp/coarse-cover.log; then exit 1; fi
          grep -F "$THEOREM' depends on axioms:" /tmp/coarse-cover.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-coarse-cover-${{ matrix.id }}
          path: |
            /tmp/coarse-generated/
            /tmp/coarse-certified/
            /tmp/coarse-cover.log
          if-no-files-found: warn
          retention-days: 30

  counter:
    if: inputs.mode == 'counter'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact two-counter return region
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python tools/lean_compile_closure.py im-results/agent5-weighted-tnf-queue/Raw11Q0Counter138.lean \
            --workdir /tmp/raw11-q0-counter \
            --manifest /tmp/raw11-q0-counter/manifest.json \
            --jobs 2 --lean lean \
            --label raw11-q0-138-counter \
            --provenance-input im-results/agent5-weighted-tnf-queue/q0-138-counter-fixtures.json \
            --provenance-input im-results/agent5-weighted-tnf-queue/discover-parametric.cjs \
            --provenance-input im-results/agent13-coverage/BB6Coverage.lean.xz.b64 \
            2>&1 | tee /tmp/raw11-q0-counter.log
          if grep -Eq 'sorryAx|native_decide' /tmp/raw11-q0-counter.log; then exit 1; fi
          grep -F "BB6Coverage.Agent31Pump.Multi.Raw11Q0Counter138.cover' depends on axioms:" /tmp/raw11-q0-counter.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw11-q0-138-counter
          path: |
            /tmp/raw11-q0-counter/
            /tmp/raw11-q0-counter.log
          if-no-files-found: warn
          retention-days: 30
