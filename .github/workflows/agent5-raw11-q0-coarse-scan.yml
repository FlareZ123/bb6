          python tools/lean_compile_closure.py /tmp/q0149-generated/Q0149Cycles.lean --source-root /tmp/q0149-generated --workdir /tmp/q0149-certified --manifest /tmp/q0149-certified/manifest.json --jobs 2 --lean lean --label raw11-q0-149-cycles --provenance-input "$D/generate-q0149-cycle.py" 2>&1 | tee /tmp/q0149-certified.log
