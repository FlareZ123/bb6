            --manifest /tmp/coarse-core/manifest.json --jobs 4 --lean lean \
            --label "q0 $ID sharded core" 2>&1 | tee /tmp/coarse-core.log
          if grep -Eq 'sorryAx|native_decide' /tmp/coarse-core.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: steps.frontier.outputs.remaining == '0'
        with:
          name: raw11-q0-sharded-core-${{ steps.prepare.outputs.id }}
          path: |
            /tmp/coarse-generated/
            /tmp/coarse-core/
            /tmp/coarse-core.log
