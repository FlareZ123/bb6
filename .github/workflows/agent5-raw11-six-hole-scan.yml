name: Agent 5 Raw11 six-hole discovery
on:
  workflow_dispatch:
    inputs:
      cap:
        description: Retained-search node cap per parent
        default: "400000"
        type: string
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - name: Scan distinct six-hole parents
        env:
          SCAN_CAP: ${{ inputs.cap }}
          SHARD: ${{ matrix.shard }}
        run: node im-results/agent5-weighted-tnf-queue/scan-raw11-six-hole.cjs "$SHARD" 8 "$SCAN_CAP"
      - name: Preserve per-shard discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw11-six-hole-${{ matrix.shard }}
          path: im-results/agent5-weighted-tnf-queue/six-hole-scan-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 30
