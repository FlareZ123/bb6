name: Agent 5 S4 exact length and source-shaped bridge (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile Agent 3's unchanged compact S4 source and Agent 5's length theorem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/s4length
          cd /tmp/s4length
          base64 -d "$GITHUB_WORKSPACE/im-results/agent3-s4-weighted-drift/S4WeightedDrift.lean.xz.b64" | xz -dc > S4WeightedDrift.lean
          echo "ab696fc6c6c27b6518cb78ffd0e9dda5292d39dbcea5fee98ae6b75f4735bba2  S4WeightedDrift.lean" | sha256sum -c -
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-length/S4Length.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-length/S4LengthBridge.lean" .
          export LEAN_PATH=.
          lean --version
          lean -o S4WeightedDrift.olean S4WeightedDrift.lean
          lean -o S4Length.olean S4Length.lean
          lean S4LengthBridge.lean
