name: Agent 5 S4 terminal quotient 50k R-block scan (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce source-rooted finite bridge
        run: node im-results/agent5-s4-nested-depth6/s5457_root_extension.mjs | tee root-extension.json
      - name: Compile exact S4 suffix macro
        run: g++ -O3 -std=c++20 -Wall -Wextra -o /tmp/s4_nested_macro im-results/agent5-s4-prefix-causal/s4_nested_macro.cpp
      - name: Run terminal-quotient census
        run: /tmp/s4_nested_macro --scan-terminal-50000 | tee terminal-scan.txt
      - name: Preserve exact output
        uses: actions/upload-artifact@v4
        with:
          name: agent5-s4-terminal-scan
          path: |
            root-extension.json
            terminal-scan.txt
