name: Agent 5 staggered four-step glider (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Rebuild original Agent8 semantics and verify staggered gliders
        run: |
          set -euo pipefail
          lean --version
          cp im-results/agent8-coverage-contract/Frontier.lean Frontier.lean
          cp im-results/agent8-coverage-contract/Symmetry.lean Symmetry.lean
          lean -o Frontier.olean Frontier.lean
          LEAN_PATH="$GITHUB_WORKSPACE" lean -o Symmetry.olean Symmetry.lean
          SRC=im-results/agent5-stagger-glider
          base64 -d "$SRC/ShiftBounce.lean.xz.b64" | xz -dc > ShiftBounce.lean
          echo "6a9936a11a20d892441fd7c847f1e41d16c25890e58e7dc26e8841ba8bd1e7b7  ShiftBounce.lean" | sha256sum -c -
          LEAN_PATH="$GITHUB_WORKSPACE" lean -o ShiftBounce.olean ShiftBounce.lean
          base64 -d "$SRC/StaggerFast.lean.xz.b64" | xz -dc > StaggerFast.lean
          echo "1f155a1d06dd82bf47b996df4957d994e0c5d0baf5dc2be8e79436bcc093ec35  StaggerFast.lean" | sha256sum -c -
          LEAN_PATH="$GITHUB_WORKSPACE" lean StaggerFast.lean
          base64 -d "$SRC/StaggerEntry.lean.xz.b64" | xz -dc > StaggerEntry.lean
          echo "8f36e227ec7d550b8e3f8c13c4ca3473f3fa1d376f5389b164baddbe5fb52f4c  StaggerEntry.lean" | sha256sum -c -
          LEAN_PATH="$GITHUB_WORKSPACE" lean -o StaggerEntry.olean StaggerEntry.lean
          cp im-results/agent8-coverage-contract/RayClosed.lean RayClosed.lean
          cp im-results/agent8-coverage-contract/RayEntry.lean RayEntry.lean
          cp im-results/agent8-coverage-contract/RayChecker.lean RayChecker.lean
          cp im-results/agent8-coverage-contract/RayFinite.lean RayFinite.lean
          LEAN_PATH="$GITHUB_WORKSPACE" lean -o RayClosed.olean RayClosed.lean
          LEAN_PATH="$GITHUB_WORKSPACE" lean -o RayEntry.olean RayEntry.lean
          LEAN_PATH="$GITHUB_WORKSPACE" lean -o RayChecker.olean RayChecker.lean
          LEAN_PATH="$GITHUB_WORKSPACE" lean -o RayFinite.olean RayFinite.lean
          base64 -d "$SRC/StaggerFiniteRight.lean.xz.b64" | xz -dc > StaggerFiniteRight.lean
          echo "27922e209c840d25fc26cd7120eb103bb0ebdb020ea3d913a6a352ee68d95f60  StaggerFiniteRight.lean" | sha256sum -c -
          LEAN_PATH="$GITHUB_WORKSPACE" lean StaggerFiniteRight.lean
          base64 -d "$SRC/StaggerFiniteLeft.lean.xz.b64" | xz -dc > StaggerFiniteLeft.lean
          echo "c6ac9de6bb3a60f29f1a23d5a0ca360ebdaab465afa3af694570ca91137f5981  StaggerFiniteLeft.lean" | sha256sum -c -
          LEAN_PATH="$GITHUB_WORKSPACE" lean StaggerFiniteLeft.lean
          base64 -d "$SRC/census.py.xz.b64" | xz -dc > census.py
          echo "21eafab86ed664d392d5f2e95f58fa53207974300fcf0a993c5fb60c99985c3d  census.py" | sha256sum -c -
          python3 census.py
