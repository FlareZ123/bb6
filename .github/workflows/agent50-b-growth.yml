name: Agent 50 B growth proof (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check original B source and Agent 50 bounds
        run: |
          export LEAN_PATH="im-results/agent18-b-cycle:im-results/agent50-b-tower"
          lean -o im-results/agent18-b-cycle/BReduction.olean im-results/agent18-b-cycle/BReduction.lean
          lean -o im-results/agent50-b-tower/BTower.olean im-results/agent50-b-tower/BTower.lean
          lean im-results/agent50-b-tower/BEnvelope.lean
