name: Agent 50 canonical r4 ingestion

run-name: Agent 50 ${{ inputs.compile_raw10_cryptids_leaf && 'raw10 Cryptids leaf' || 'canonical r4 ingestion' }}

on:
  workflow_dispatch:
    inputs:
      canonical77_run_id:
        description: "Run containing the accepted canonical77-certified artifact"
        required: true
        default: "45554648116"
        type: string
      canonical77_manifest_run_id:
        description: "Run containing the canonical77 base dependency manifest"
        required: true
        default: "45647053824"
        type: string
      upstream_sha:
        description: "Exact Cryptids source commit used by the accepted r4 source proof"
        required: true
        default: "3647718b5df22e1a61462dec0376bd204526285a"
        type: string
      compile_raw10_cryptids_leaf:
        description: "Compile the source-pinned raw10 last-hole leaf adapter instead of the canonical r4 ingestion"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  canonical-r4-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned original Cryptids source
        uses: actions/checkout@v4
        with:
          repository: google-deepmind/cryptids
          ref: ${{ inputs.upstream_sha }}
          path: upstream
          persist-credentials: false

      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Download the accepted canonical77 object artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.canonical77_run_id }}
          name: canonical77-certified
          path: /tmp/canonical77

      - name: Download the exact canonical77 dependency manifest
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.canonical77_manifest_run_id }}
          name: raw107-canonical-shared-core
          path: /tmp/canonical77-manifest

      - name: Recreate the canonical77 source closure inputs
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent11-raw107/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 68 72 82
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
          cd im-results/agent47-raw114-cut
          python paired_counter.py
          python long_sweep.py
          printf '%s\n' 0LA 0LB 0LC 0LF 0RA 0RB 0RC 0RF 1LA 1LB 1LC 1LF 1RA 1RB 1RC 1RF | xargs -P 4 -I{} python generate_complete.py {}
          python generate_complete.py --combine

      - name: Validate the base artifacts and prepare upstream dependencies
        working-directory: upstream
        run: |
          set -euo pipefail
          test -s "/tmp/canonical77/CanonicalRaw114Accepted.olean"
          test -s "/tmp/canonical77/CanonicalTwoParentGraft.olean"
          test -s "/tmp/canonical77-manifest/manifest/canonical77-base-manifest.json"
          test "$(git rev-parse HEAD)" = "${{ inputs.upstream_sha }}"
          # Preserve the exact Cryptids source commit, but align its pinned
          # Mathlib/Verso dependency graph with the consumer's Lean 4.36.0-rc2.
          # The 4.35 manifest's Batteries and Mathlib sources do not compile
          # against 4.36 (new Lean Expr.Key cases and Doc.Parser API).
          elan override set leanprover/lean4:v4.36.0-rc2
          lean --version
          lake --version
          sed -i '/name = "verso"/,/^$/ s/rev = "v4.35.0-rc4"/rev = "71a2035b44e7f54a797ce799fd1b03cdd3a44684"/' lakefile.toml
          sed -i '/name = "mathlib"/,/^$/ s/rev = "v4.35.0-rc4"/rev = "9d581dfff2e41de989072ea63abf3daf69311520"/' lakefile.toml
          grep -Fq 'rev = "71a2035b44e7f54a797ce799fd1b03cdd3a44684"' lakefile.toml
          grep -Fq 'rev = "9d581dfff2e41de989072ea63abf3daf69311520"' lakefile.toml
          ! grep -Fq 'v4.35.0-rc4' lakefile.toml
          lake update
          python3 - <<'PY'
          import json
          p = {x["name"]: x["rev"] for x in json.load(open("lake-manifest.json"))["packages"]}
          expected = {
              "mathlib": "9d581dfff2e41de989072ea63abf3daf69311520",
              "verso": "71a2035b44e7f54a797ce799fd1b03cdd3a44684",
              "batteries": "d4c39b228d4a06f3b00748c2c445a7b9f056a6e3",
              "Cli": "c09cb1e4f1e6e1c231a1175a12b681b075054a1b",
          }
          bad = {k: (p.get(k), v) for k, v in expected.items() if p.get(k) != v}
          if bad:
              raise SystemExit(f"Unexpected 4.36 dependency lock: {bad}")
          print("Verified 4.36.0-rc2 dependency lock:", expected)
          PY
          mkdir -p "$GITHUB_WORKSPACE/.tmp/agent19-raw10-cryptids-leaf"
          cp lakefile.toml "$GITHUB_WORKSPACE/.tmp/agent19-raw10-cryptids-leaf/upstream-lakefile.toml"
          cp lake-manifest.json "$GITHUB_WORKSPACE/.tmp/agent19-raw10-cryptids-leaf/upstream-lake-manifest.json"
          sha256sum "$GITHUB_WORKSPACE/.tmp/agent19-raw10-cryptids-leaf/upstream-lakefile.toml" "$GITHUB_WORKSPACE/.tmp/agent19-raw10-cryptids-leaf/upstream-lake-manifest.json" > "$GITHUB_WORKSPACE/.tmp/agent19-raw10-cryptids-leaf/upstream-dependencies.sha256"
          lake build BusyBeaver.Bridge Cryptids.Machines

      - name: Compile the canonical77 r4 graft with its complete source closure
        if: ${{ !inputs.compile_raw10_cryptids_leaf }}
        env:
          CANONICAL77_DIR: /tmp/canonical77
          CANONICAL77_MANIFEST: /tmp/canonical77-manifest/manifest/canonical77-base-manifest.json
          UPSTREAM_ROOT: ${{ github.workspace }}/upstream
          WORKDIR: ${{ github.workspace }}/.tmp/agent50-canonical-r4
          JOBS: "4"
        run: |
          set -euo pipefail
          bash im-results/agent50-weighted-tnf-pilot/reproduce-canonical-r4.sh

      - name: Compile source-backed raw10 last-hole leaf
        if: ${{ inputs.compile_raw10_cryptids_leaf }}
        env:
          CANONICAL77_DIR: /tmp/canonical77
          CANONICAL77_MANIFEST: /tmp/canonical77-manifest/manifest/canonical77-base-manifest.json
          UPSTREAM_ROOT: ${{ github.workspace }}/upstream
          WORKDIR: ${{ github.workspace }}/.tmp/agent19-raw10-cryptids-leaf
          JOBS: "4"
        run: bash im-results/agent19-hard-root-crosswalk/reproduce-raw10-cryptids-leaf.sh

      - name: Upload source-backed raw10 last-hole leaf closure
        if: ${{ inputs.compile_raw10_cryptids_leaf }}
        uses: actions/upload-artifact@v4
        with:
          name: raw10-cryptids-leaf-certified
          path: |
            .tmp/agent19-raw10-cryptids-leaf/build/
            .tmp/agent19-raw10-cryptids-leaf/compile.log
            .tmp/agent19-raw10-cryptids-leaf/crosswalk.json
            .tmp/agent19-raw10-cryptids-leaf/crosswalk.sha256
            .tmp/agent19-raw10-cryptids-leaf/axiom-summary.json
            .tmp/agent19-raw10-cryptids-leaf/upstream-lakefile.toml
            .tmp/agent19-raw10-cryptids-leaf/upstream-lake-manifest.json
            .tmp/agent19-raw10-cryptids-leaf/upstream-dependencies.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Upload the compiled canonical r4 ingestion closure
        if: ${{ !inputs.compile_raw10_cryptids_leaf }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-r4-ingestion-certified
          path: |
            .tmp/agent50-canonical-r4/build/
            .tmp/agent50-canonical-r4/compile.log
            .tmp/agent50-canonical-r4/upstream-commit.txt
          if-no-files-found: error
          retention-days: 30
