name: Agent50 P1 reset-density original-source Lean audit (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Decode and authenticate original Agent50 sources
        run: |
          set -e
          for m in ResetBudget ResetSourceAlgebra ResetSourceBridge; do
            base64 -d "im-results/agent50-p1-reset-density/$m.lean.xz.b64" | xz -d > "im-results/agent50-p1-reset-density/$m.lean"
          done
          printf '%s\n'             'cfc5104ae546ee196995dbff7bb7e46082244f65dde07a1ffb86eb151d1bd0da  im-results/agent50-p1-reset-density/ResetBudget.lean'             'f145e33a241d46568e175266f6c238e20a6d286764eb015a4219911dbee7fe1b  im-results/agent50-p1-reset-density/ResetSourceAlgebra.lean'             '7c5afd006bacb644465390fe3d1b02805995ea0631f1ef848b5e17e95de814d2  im-results/agent50-p1-reset-density/ResetSourceBridge.lean' | sha256sum -c -
      - name: Compile original upstream inverse grammar and authentic density theorem
        run: |
          set -e
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent28-p1-word-automaton:im-results/agent50-p1-reset-density"
          for m in GParity GInverse PosEvenForm; do
            lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean"
          done
          lean -o im-results/agent47-p1-finite-inverse/P1FiniteInverse.olean im-results/agent47-p1-finite-inverse/P1FiniteInverse.lean
          lean -o im-results/agent1-p1-quarter/MassInverse.olean im-results/agent1-p1-quarter/MassInverse.lean
          lean -o im-results/agent1-p1-quarter/OddConeMass.olean im-results/agent1-p1-quarter/OddConeMass.lean
          lean -o im-results/agent47-p1-finite-inverse/P1InverseLog.olean im-results/agent47-p1-finite-inverse/P1InverseLog.lean
          lean -o im-results/agent1-p1-quarter/InverseIff.olean im-results/agent1-p1-quarter/InverseIff.lean
          lean -o im-results/agent28-p1-word-automaton/OddWordCost.olean im-results/agent28-p1-word-automaton/OddWordCost.lean
          lean -o im-results/agent28-p1-word-automaton/OddWordSourceBridge.olean im-results/agent28-p1-word-automaton/OddWordSourceBridge.lean
          lean -o im-results/agent28-p1-word-automaton/DefectTransport.olean im-results/agent28-p1-word-automaton/DefectTransport.lean
          lean -o im-results/agent28-p1-word-automaton/OneResetTwoAdic.olean im-results/agent28-p1-word-automaton/OneResetTwoAdic.lean
          lean -o im-results/agent50-p1-reset-density/ResetBudget.olean im-results/agent50-p1-reset-density/ResetBudget.lean
          lean -o im-results/agent50-p1-reset-density/ResetSourceAlgebra.olean im-results/agent50-p1-reset-density/ResetSourceAlgebra.lean
          lean im-results/agent50-p1-reset-density/ResetSourceBridge.lean
      - name: Compile strict all-count theorem and n>=70 three-reset consequence
        run: |
          set -e
          for m in ResetStrict ResetStrictBridge; do
            base64 -d "im-results/agent50-p1-reset-density/$m.lean.xz.b64" | xz -d > "im-results/agent50-p1-reset-density/$m.lean"
          done
          printf '%s\n'             '7540ccecc0e0f7e428afd5f6bc9b8a0b6ca8898d7226870c27942ea0555d3ea4  im-results/agent50-p1-reset-density/ResetStrict.lean'             'ddd3c17788560e97afc9b5d51757c6db35972585fe25b40a497ade55a6cf3dc1  im-results/agent50-p1-reset-density/ResetStrictBridge.lean' | sha256sum -c -
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent28-p1-word-automaton:im-results/agent50-p1-reset-density"
          lean -o im-results/agent50-p1-reset-density/ResetSourceBridge.olean im-results/agent50-p1-reset-density/ResetSourceBridge.lean
          lean -o im-results/agent50-p1-reset-density/ResetStrict.olean im-results/agent50-p1-reset-density/ResetStrict.lean
          lean im-results/agent50-p1-reset-density/ResetStrictBridge.lean
      - name: Source audit of low-cost exceptional c=1 exclusion
        run: |
          set -e
          base64 -d im-results/agent50-p1-reset-density/ResetExceptional.lean.xz.b64 | xz -d > im-results/agent50-p1-reset-density/ResetExceptional.lean
          echo 'f48f35b2a8b3ae45fed8d3be11ac8c66c523b8e65f48f5c7a14202364f5189d3  im-results/agent50-p1-reset-density/ResetExceptional.lean' | sha256sum -c -
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent28-p1-word-automaton:im-results/agent50-p1-reset-density"
          lean im-results/agent50-p1-reset-density/ResetExceptional.lean
      - name: Source audit of exact high-cost exceptional entry barrier
        run: |
          set -e
          base64 -d im-results/agent50-p1-reset-density/ResetExceptionalCost.lean.xz.b64 | xz -d > im-results/agent50-p1-reset-density/ResetExceptionalCost.lean
          echo 'e759ccb86b30a97a82125c6f1efaa92e3b1c57e558cf9ee0c50641f02ca2e518  im-results/agent50-p1-reset-density/ResetExceptionalCost.lean' | sha256sum -c -
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent28-p1-word-automaton:im-results/agent50-p1-reset-density"
          lean -o im-results/agent50-p1-reset-density/ResetExceptional.olean im-results/agent50-p1-reset-density/ResetExceptional.lean
          lean im-results/agent50-p1-reset-density/ResetExceptionalCost.lean
      - name: Source audit of exceptional c=1 logarithmic cost gap
        run: |
          set -e
          base64 -d im-results/agent50-p1-reset-density/ResetExceptionalGap.lean.xz.b64 | xz -d > im-results/agent50-p1-reset-density/ResetExceptionalGap.lean
          echo 'dcfbb9baafdc9c015f99ff4306f7b1369664c10f905b99c6e1c94221f6761a28  im-results/agent50-p1-reset-density/ResetExceptionalGap.lean' | sha256sum -c -
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent28-p1-word-automaton:im-results/agent50-p1-reset-density"
          lean -o im-results/agent50-p1-reset-density/ResetExceptionalCost.olean im-results/agent50-p1-reset-density/ResetExceptionalCost.lean
          lean im-results/agent50-p1-reset-density/ResetExceptionalGap.lean
      - name: Source audit of exceptional three-reset theorem
        run: |
          set -e
          base64 -d im-results/agent50-p1-reset-density/ResetExceptionalResets.lean.xz.b64 | xz -d > im-results/agent50-p1-reset-density/ResetExceptionalResets.lean
          echo '1bdb657e053db207222b53ebc15dbf585794fd4a7d01a154dcd1697f5c1f1328  im-results/agent50-p1-reset-density/ResetExceptionalResets.lean' | sha256sum -c -
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent28-p1-word-automaton:im-results/agent50-p1-reset-density"
          lean -o im-results/agent50-p1-reset-density/ResetExceptionalGap.olean im-results/agent50-p1-reset-density/ResetExceptionalGap.lean
          lean -o im-results/agent50-p1-reset-density/ResetStrictBridge.olean im-results/agent50-p1-reset-density/ResetStrictBridge.lean
          lean im-results/agent50-p1-reset-density/ResetExceptionalResets.lean
