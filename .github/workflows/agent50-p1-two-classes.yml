name: Agent 50 two P1 infinite classes (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check original P1 source modules and both all-time exclusions
        run: |
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent4-halting-funnel:im-results/agent50-p1-residue"
          for m in GParity GInverse PosEvenForm ResetGate; do
            lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean"
          done
          for m in HaltingFunnel EvenSector OddReturn Reachability BlankCriterion BlankInvariants; do
            lean -o "im-results/agent4-halting-funnel/$m.olean" "im-results/agent4-halting-funnel/$m.lean"
          done
          for m in P1Triple P1ResidualArithmetic P1ResidualReach P1Gate P1MapBridge P1SixInverse P1SixArithmetic P1SixReach P1SixSource; do
            lean -o "im-results/agent50-p1-residue/$m.olean" "im-results/agent50-p1-residue/$m.lean"
          done
