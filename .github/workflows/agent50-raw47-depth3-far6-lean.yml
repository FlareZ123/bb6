name: Agent 50 Raw47 accepted depth-3 composition

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45940910607
          name: raw47-broad-far-1
          path: /tmp/a50-far
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45939716326
          name: raw47-pump-parent-proofs
          path: /tmp/a50-pump
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45940530291
          name: raw47-pump-parent-proofs
          path: /tmp/a50-counter
      - name: Compose previously accepted exact parent covers
        run: |
          set -euo pipefail
          D=im-results/agent50-raw47-depth3
          W=.tmp/a50-raw47-accepted108
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python "$D/merge_accepted_artifacts.py" "$W" /tmp/a50-far /tmp/a50-pump /tmp/a50-counter
          python "$D/generate_accepted108.py" "$W/imports"
          python tools/lean_compile_closure.py --workdir "$W/build" --jobs 2 --source-root "$W/imports" --precompiled-manifest "$W/reusable.json" --precompiled-dir "$W/reusable" --manifest "$W/manifest.json" --theorem BB6.Agent50Raw47Accepted108.local_sound --parent-table '1RB---_1RC---_0RD---_1LD0RC_------_------' --weighted-bound 10006 --artifact-name raw47-accepted108 --provenance-input "$D/raw47-depth3.open" --provenance-input "$D/broad-far-parents.b64" --provenance-input "$D/raw47-depth3.json" --provenance-input "$D/generate_accepted108.py" "$W/imports/Raw47Accepted108.lean" 2>&1 | tee "$W/log"
          python - "$W/log" <<'PY'
          import re,sys
          log=open(sys.argv[1]).read()
          for n in ('closed_count','remaining_count','local_sound'):
              name='BB6.Agent50Raw47Accepted108.'+n
              m=re.search(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",log)
              if m: assert set(m.group(1).split(', ')) <= {'propext','Quot.sound','Classical.choice'}, (name,m.group(1))
              else: assert f"'{name}' does not depend on any axioms" in log,name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw47-accepted108
          path: |
            .tmp/a50-raw47-accepted108/imports/
            .tmp/a50-raw47-accepted108/build/
            .tmp/a50-raw47-accepted108/manifest.json
            .tmp/a50-raw47-accepted108/log
          if-no-files-found: error
