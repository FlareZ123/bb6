name: Agent 50 Raw47 accepted depth-3 composition

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [compose, far-batch]
        default: compose
      shard:
        type: number
        default: 0
      offset:
        type: number
        default: 0
      size:
        type: number
        default: 12

permissions:
  contents: read
  actions: read

jobs:
  lean:
    if: inputs.mode == 'compose'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45952099904
          name: raw47-accepted108
          path: /tmp/a50-base
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45952295374
          name: raw47-far-0-0-12
          path: /tmp/a50-batch0
      - name: Compose 120 exact parent covers using the verified packed key
        run: |
          set -euo pipefail
          D=im-results/agent50-raw47-depth3
          W=.tmp/a50-raw47-fast
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python "$D/merge_accepted_artifacts.py" "$W" /tmp/a50-base /tmp/a50-batch0
          M=$(python "$D/generate_fast_consumer.py" "$W/imports" 120)
          test "$M" = Raw47Accepted120
          python tools/lean_compile_closure.py --workdir "$W/build" --jobs 2 --source-root "$W/imports" --precompiled-manifest "$W/reusable.json" --precompiled-dir "$W/reusable" --manifest "$W/manifest.json" --theorem "BB6.Agent50Raw47Accepted120.local_sound" --parent-table '1RB---_1RC---_0RD---_1LD0RC_------_------' --weighted-bound 10006 --artifact-name raw47-accepted120 --provenance-input "$D/raw47-depth3.open" --provenance-input "$D/generate_fast_consumer.py" "$W/imports/$M.lean" 2>&1 | tee "$W/log"
          python - "$W/log" <<'PY'
          import re,sys
          log=open(sys.argv[1]).read()
          for n in ('keys_eq','closed_count','remaining_count','local_sound'):
              name='BB6.Agent50Raw47Accepted120.'+n
              m=re.search(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",log)
              if m: assert set(m.group(1).split(', ')) <= {'propext','Quot.sound','Classical.choice'}, (name,m.group(1))
              else: assert f"'{name}' does not depend on any axioms" in log,name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw47-accepted120
          path: |
            .tmp/a50-raw47-fast/imports/
            .tmp/a50-raw47-fast/build/
            .tmp/a50-raw47-fast/manifest.json
            .tmp/a50-raw47-fast/log
          if-no-files-found: error

  batch:
    if: inputs.mode == 'far-batch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45940910607
          name: raw47-broad-far-1
          path: /tmp/a50-far
      - name: Check a bounded batch of previously unaccepted FAR parents
        env:
          SHARD: ${{ inputs.shard }}
          OFFSET: ${{ inputs.offset }}
          SIZE: ${{ inputs.size }}
        run: |
          set -euo pipefail
          test "$SHARD" != 1
          D=im-results/agent50-raw47-depth3
          W=.tmp/a50-raw47-far-batch
          mkdir -p "$W/imports" "$W/build"
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python "$D/generate_broad_far.py" "$W/imports" "$SHARD" "$OFFSET" "$SIZE"
          M=$(find /tmp/a50-far -name manifest.json -print -quit)
          test -n "$M"
          python tools/lean_compile_closure.py --workdir "$W/build" --jobs 2 --precompiled-manifest "$M" --precompiled-dir "$(dirname "$M")/build" --manifest "$W/manifest.json" --label "Raw47 FAR shard $SHARD offset $OFFSET size $SIZE" --weighted-bound 10006 --provenance-input "$D/raw47-depth3.open" --provenance-input "$D/broad-far-parents.b64" --provenance-input "$D/broad-far-bank.xz.b64" "$W"/imports/Raw47D3FAR*.lean 2>&1 | tee "$W/log"
          python - "$W/log" "$W/imports/ids.txt" <<'PY'
          import re,sys
          log=open(sys.argv[1]).read()
          for i in map(int,open(sys.argv[2])):
              name=f'BB6.Agent50.Raw47D3FAR{i}.all_quotient'
              m=re.search(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",log)
              if m: assert set(m.group(1).split(', ')) <= {'propext','Quot.sound','Classical.choice'}, (name,m.group(1))
              else: assert f"'{name}' does not depend on any axioms" in log,name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw47-far-${{ inputs.shard }}-${{ inputs.offset }}-${{ inputs.size }}
          path: .tmp/a50-raw47-far-batch/
          if-no-files-found: error
