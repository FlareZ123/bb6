name: Agent 50 Raw47 depth-3 FAR6 Lean proof

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version

      - name: Generate Lean source dependencies and FAR6 cut
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent50-raw47-depth3/generate_depth3_far.py
          test -s im-results/agent50-raw47-depth3/Raw47Depth3Cut.lean

      - name: Kernel-check the depth-3 FAR6 local refinement
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py --workdir /tmp/a50-raw47-depth3 --jobs 4 im-results/agent50-raw47-depth3/Raw47Depth3Cut.lean | tee /tmp/a50-raw47-depth3.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a50-raw47-depth3.log; then
            echo "Forbidden proof placeholder or native_decide found" >&2
            exit 1
          fi
          grep -q 'BB6.Agent50Raw47Depth3Cut.canonical_local_sound_84' /tmp/a50-raw47-depth3.log

      - name: Preserve generated proof source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agent 50"
          git config user.email "agent50@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add im-results/agent50-raw47-depth3/Raw47Depth3Cut.lean
          git commit -m "Agent 50: Add kernel-checked Raw47 depth-3 FAR6 refinement"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push checked Raw47 depth-3 proof after three reconciliations" >&2
          exit 1

      - name: Upload Lean proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent50-raw47-depth3-far6-lean
          path: |
            im-results/agent50-raw47-depth3/Raw47Depth3Cut.lean
            /tmp/a50-raw47-depth3
            /tmp/a50-raw47-depth3.log
          if-no-files-found: warn
