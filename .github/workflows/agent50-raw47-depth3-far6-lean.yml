name: Agent 50 Raw47 accepted depth-3 composition
run-name: Raw47 ${{ inputs.mode }} shard ${{ inputs.shard }} offset ${{ inputs.offset }} size ${{ inputs.size }}

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [compose, far-batch, far-sweep, graph-batch, graph-partial]
        default: compose
      shard:
        type: number
        default: 0
      offset:
        type: number
        default: 0
      size:
        type: number
        default: 12
      parents:
        type: string
        default: '8 23 37 50 55'
      base_run:
        type: string
        default: '45968079265'
      base_count:
        type: number
        default: 678
      extra_runs:
        type: string
        default: '45968108909 45968115223 45968121970 45968129488'
      expected_count:
        type: number
        default: 702

permissions:
  contents: read
  actions: read

jobs:
  lean:
    if: inputs.mode == 'compose'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.base_run }}
          name: raw47-accepted${{ inputs.base_count }}
          path: /tmp/a50-base
      - name: Download newly accepted nonoverlapping batches
        env:
          GH_TOKEN: ${{ github.token }}
          EXTRA_RUNS: ${{ inputs.extra_runs }}
        run: |
          set -euo pipefail
          [[ "$EXTRA_RUNS" =~ ^[0-9]+(\ [0-9]+)*$ ]]
          mkdir -p /tmp/a50-extra
          for id in $EXTRA_RUNS; do
            test "$(gh run view "$id" --json conclusion --jq .conclusion)" = success
            mapfile -t names < <(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" --paginate --jq '.artifacts[] | select(.expired==false) | .name' | grep -E '^raw47-(far-[0-7]-[0-9]+-[0-9]+|graph-parents)$')
            test "${#names[@]}" -gt 0
            for name in "${names[@]}"; do
              gh run download "$id" --name "$name" --dir "/tmp/a50-extra/$id-$name"
            done
          done
      - name: Compose accepted parent covers using the verified packed key
        id: composition
        env:
          EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: |
          set -euo pipefail
          D=im-results/agent50-raw47-depth3
          W=.tmp/a50-raw47-fast
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python "$D/merge_accepted_artifacts.py" "$W" /tmp/a50-base /tmp/a50-extra/*
          M=$(python "$D/generate_fast_consumer.py" "$W/imports")
          N=${M#Raw47Accepted}
          test "$N" -eq "$EXPECTED_COUNT"
          echo "count=$N" >> "$GITHUB_OUTPUT"
          python tools/lean_compile_closure.py --workdir "$W/build" --jobs 2 --source-root "$W/imports" --precompiled-manifest "$W/reusable.json" --precompiled-dir "$W/reusable" --manifest "$W/manifest.json" --theorem "BB6.Agent50$M.local_sound" --parent-table '1RB---_1RC---_0RD---_1LD0RC_------_------' --weighted-bound 10006 --artifact-name "raw47-accepted$N" --provenance-input "$D/raw47-depth3.open" --provenance-input "$D/generate_fast_consumer.py" "$W/imports/$M.lean" 2>&1 | tee "$W/log"
          python - "$W/log" "$M" <<'PY'
          import re,sys
          log=open(sys.argv[1]).read()
          for n in ('keys_eq','closed_count','remaining_count','local_sound'):
              name='BB6.Agent50'+sys.argv[2]+'.'+n
              m=re.search(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",log)
              if m: assert set(m.group(1).split(', ')) <= {'propext','Quot.sound','Classical.choice'}, (name,m.group(1))
              else: assert f"'{name}' does not depend on any axioms" in log,name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw47-accepted${{ steps.composition.outputs.count }}
          path: |
            .tmp/a50-raw47-fast/imports/
            .tmp/a50-raw47-fast/build/
            .tmp/a50-raw47-fast/manifest.json
            .tmp/a50-raw47-fast/log
          if-no-files-found: error

  prepare:
    if: startsWith(inputs.mode, 'far-')
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.matrix.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - name: Select disjoint frozen-bank batches
        id: matrix
        env:
          MODE: ${{ inputs.mode }}
          SHARD: ${{ inputs.shard }}
          OFFSET: ${{ inputs.offset }}
          SIZE: ${{ inputs.size }}
        run: |
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          mask=base64.b64decode(Path('im-results/agent50-raw47-depth3/broad-far-parents.b64').read_text())
          assert len(mask)==1212 and sum(mask)==674
          ids=[i for i,b in enumerate(mask) if b]
          if os.environ['MODE']=='far-batch':
              s,o,n=(int(os.environ[k]) for k in ('SHARD','OFFSET','SIZE'))
              assert s in range(8) and s!=1 and 0<=o<len(ids[s::8]) and 1<=n<=len(ids[s::8])-o
              batches=[dict(shard=s,offset=o,size=n)]
          else:
              batches=[]
              for s in [0,2,3,4,5,6,7]:
                  # Shard 0/3 first batches accepted; shard 4 already dispatched.
                  start=12 if s in (0,3,4) else 0
                  for o in range(start,len(ids[s::8]),12):
                      batches.append(dict(shard=s,offset=o,size=min(12,len(ids[s::8])-o)))
          print(batches)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('batches='+json.dumps(batches,separators=(',',':'))+'\n')
          PY

  batch:
    if: startsWith(inputs.mode, 'far-')
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.batches) }}
    name: FAR shard ${{ matrix.shard }} offset ${{ matrix.offset }} size ${{ matrix.size }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45940910607
          name: raw47-broad-far-1
          path: /tmp/a50-far
      - name: Check a bounded batch of previously unaccepted FAR parents
        env:
          SHARD: ${{ matrix.shard }}
          OFFSET: ${{ matrix.offset }}
          SIZE: ${{ matrix.size }}
        run: |
          set -euo pipefail
          test "$SHARD" != 1
          D=im-results/agent50-raw47-depth3
          W=.tmp/a50-raw47-far-batch
          mkdir -p "$W/imports" "$W/build"
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python "$D/generate_broad_far.py" "$W/imports" "$SHARD" "$OFFSET" "$SIZE"
          M=$(find /tmp/a50-far -name manifest.json -print -quit)
          test -n "$M"
          python tools/lean_compile_closure.py --workdir "$W/build" --jobs 2 --precompiled-manifest "$M" --precompiled-dir "$(dirname "$M")/build" --manifest "$W/manifest.json" --label "Raw47 FAR shard $SHARD offset $OFFSET size $SIZE" --weighted-bound 10006 --provenance-input "$D/raw47-depth3.open" --provenance-input "$D/broad-far-parents.b64" --provenance-input "$D/broad-far-bank.xz.b64" "$W"/imports/Raw47D3FAR*.lean 2>&1 | tee "$W/log"
          python - "$W/log" "$W/imports/ids.txt" <<'PY'
          import re,sys
          log=open(sys.argv[1]).read()
          for i in map(int,open(sys.argv[2])):
              name=f'BB6.Agent50.Raw47D3FAR{i}.all_quotient'
              m=re.search(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",log)
              if m: assert set(m.group(1).split(', ')) <= {'propext','Quot.sound','Classical.choice'}, (name,m.group(1))
              else: assert f"'{name}' does not depend on any axioms" in log,name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw47-far-${{ matrix.shard }}-${{ matrix.offset }}-${{ matrix.size }}
          path: .tmp/a50-raw47-far-batch/
          if-no-files-found: error

  graph:
    if: startsWith(inputs.mode, 'graph-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45940910607
          name: raw47-broad-far-1
          path: /tmp/a50-far
      - name: Produce and check complete mixed FAR/run-graph parent bounds
        env:
          PARENTS: ${{ inputs.parents }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$PARENTS" =~ ^[0-9]+(\ [0-9]+)*$ ]]
          D=im-results/agent50-raw47-depth3
          W=.tmp/a50-raw47-graph-batch
          mkdir -p "$W/imports" "$W/build"
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          read -ra ids <<< "$PARENTS"
          if [[ "$MODE" == graph-partial ]]; then
            python "$D/generate_graph_parents.py" "$W/imports" --partial "${ids[@]}"
          else
            python "$D/generate_graph_parents.py" "$W/imports" "${ids[@]}"
          fi
          shopt -s nullglob
          roots=("$W"/imports/Raw47D3G*.lean "$W"/imports/Raw47D3U*.lean)
          test "${#roots[@]}" -gt 0
          M=$(find /tmp/a50-far -name manifest.json -print -quit)
          test -n "$M"
          python tools/lean_compile_closure.py --workdir "$W/build" --jobs 2 --precompiled-manifest "$M" --precompiled-dir "$(dirname "$M")/build" --manifest "$W/manifest.json" --label "Raw47 mixed FAR/graph parents $PARENTS" --weighted-bound 10006 --provenance-input "$D/raw47-depth3.open" --provenance-input "$W/imports/graph-hits.txt" "${roots[@]}" 2>&1 | tee "$W/log"
          python - "$W/log" "$W/imports/ids.txt" "$W/imports/partial-ids.txt" <<'PY'
          import re,sys
          log=open(sys.argv[1]).read()
          names=[f'BB6.Agent50.Raw47D3G{i}.all_quotient' for i in map(int,open(sys.argv[2]))]
          for line in open(sys.argv[3]):
              i,n=map(int,line.split())
              names.extend([f'BB6.Agent50.Raw47D3U{i}.remaining_count',f'BB6.Agent50.Raw47D3U{i}.local_sound'])
          for name in names:
              m=re.search(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",log)
              if m: assert set(m.group(1).split(', ')) <= {'propext','Quot.sound','Classical.choice'}, (name,m.group(1))
              else: assert f"'{name}' does not depend on any axioms" in log,name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw47-graph-parents
          path: .tmp/a50-raw47-graph-batch/
          if-no-files-found: error
