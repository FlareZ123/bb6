name: Agent 50 Raw47 accepted depth-3 composition

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [compose, far-batch, far-sweep]
        default: compose
      shard:
        type: number
        default: 0
      offset:
        type: number
        default: 0
      size:
        type: number
        default: 12

permissions:
  contents: read
  actions: read

jobs:
  lean:
    if: inputs.mode == 'compose'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45953219227
          name: raw47-accepted120
          path: /tmp/a50-base
      - name: Download newly accepted nonoverlapping batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/a50-extra
          gh run download 45952979794 --name raw47-far-3-0-12 --dir /tmp/a50-extra/raw47-far-3-0-12
          gh run download 45952990815 --name raw47-far-4-0-12 --dir /tmp/a50-extra/raw47-far-4-0-12
          gh api --paginate 'repos/${{ github.repository }}/actions/runs/45953448124/artifacts?per_page=100' --jq '.artifacts[] | select(.expired == false) | .name' > /tmp/a50-sweep-names
          while IFS= read -r name; do
            [[ "$name" =~ ^raw47-far-[0-7]-[0-9]+-[0-9]+$ ]]
            gh run download 45953448124 --name "$name" --dir "/tmp/a50-extra/$name"
          done < /tmp/a50-sweep-names
      - name: Compose accepted parent covers using the verified packed key
        id: composition
        run: |
          set -euo pipefail
          D=im-results/agent50-raw47-depth3
          W=.tmp/a50-raw47-fast
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python "$D/merge_accepted_artifacts.py" "$W" /tmp/a50-base /tmp/a50-extra/*
          M=$(python "$D/generate_fast_consumer.py" "$W/imports")
          N=${M#Raw47Accepted}
          test "$N" -ge 144
          echo "count=$N" >> "$GITHUB_OUTPUT"
          python tools/lean_compile_closure.py --workdir "$W/build" --jobs 2 --source-root "$W/imports" --precompiled-manifest "$W/reusable.json" --precompiled-dir "$W/reusable" --manifest "$W/manifest.json" --theorem "BB6.Agent50$M.local_sound" --parent-table '1RB---_1RC---_0RD---_1LD0RC_------_------' --weighted-bound 10006 --artifact-name "raw47-accepted$N" --provenance-input "$D/raw47-depth3.open" --provenance-input "$D/generate_fast_consumer.py" "$W/imports/$M.lean" 2>&1 | tee "$W/log"
          python - "$W/log" "$M" <<'PY'
          import re,sys
          log=open(sys.argv[1]).read()
          for n in ('keys_eq','closed_count','remaining_count','local_sound'):
              name='BB6.Agent50'+sys.argv[2]+'.'+n
              m=re.search(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",log)
              if m: assert set(m.group(1).split(', ')) <= {'propext','Quot.sound','Classical.choice'}, (name,m.group(1))
              else: assert f"'{name}' does not depend on any axioms" in log,name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw47-accepted${{ steps.composition.outputs.count }}
          path: |
            .tmp/a50-raw47-fast/imports/
            .tmp/a50-raw47-fast/build/
            .tmp/a50-raw47-fast/manifest.json
            .tmp/a50-raw47-fast/log
          if-no-files-found: error

  prepare:
    if: inputs.mode != 'compose'
    runs-on: ubuntu-latest
    outputs:
      batches: ${{ steps.matrix.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
      - name: Select disjoint frozen-bank batches
        id: matrix
        env:
          MODE: ${{ inputs.mode }}
          SHARD: ${{ inputs.shard }}
          OFFSET: ${{ inputs.offset }}
          SIZE: ${{ inputs.size }}
        run: |
          python - <<'PY'
          import base64,json,os
          from pathlib import Path
          mask=base64.b64decode(Path('im-results/agent50-raw47-depth3/broad-far-parents.b64').read_text())
          assert len(mask)==1212 and sum(mask)==674
          ids=[i for i,b in enumerate(mask) if b]
          if os.environ['MODE']=='far-batch':
              s,o,n=(int(os.environ[k]) for k in ('SHARD','OFFSET','SIZE'))
              assert s in range(8) and s!=1 and 0<=o<len(ids[s::8]) and 1<=n<=len(ids[s::8])-o
              batches=[dict(shard=s,offset=o,size=n)]
          else:
              batches=[]
              for s in [0,2,3,4,5,6,7]:
                  # Shard 0/3 first batches accepted; shard 4 already dispatched.
                  start=12 if s in (0,3,4) else 0
                  for o in range(start,len(ids[s::8]),12):
                      batches.append(dict(shard=s,offset=o,size=min(12,len(ids[s::8])-o)))
          print(batches)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('batches='+json.dumps(batches,separators=(',',':'))+'\n')
          PY

  batch:
    if: inputs.mode != 'compose'
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.batches) }}
    name: FAR shard ${{ matrix.shard }} offset ${{ matrix.offset }} size ${{ matrix.size }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45940910607
          name: raw47-broad-far-1
          path: /tmp/a50-far
      - name: Check a bounded batch of previously unaccepted FAR parents
        env:
          SHARD: ${{ matrix.shard }}
          OFFSET: ${{ matrix.offset }}
          SIZE: ${{ matrix.size }}
        run: |
          set -euo pipefail
          test "$SHARD" != 1
          D=im-results/agent50-raw47-depth3
          W=.tmp/a50-raw47-far-batch
          mkdir -p "$W/imports" "$W/build"
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python "$D/generate_broad_far.py" "$W/imports" "$SHARD" "$OFFSET" "$SIZE"
          M=$(find /tmp/a50-far -name manifest.json -print -quit)
          test -n "$M"
          python tools/lean_compile_closure.py --workdir "$W/build" --jobs 2 --precompiled-manifest "$M" --precompiled-dir "$(dirname "$M")/build" --manifest "$W/manifest.json" --label "Raw47 FAR shard $SHARD offset $OFFSET size $SIZE" --weighted-bound 10006 --provenance-input "$D/raw47-depth3.open" --provenance-input "$D/broad-far-parents.b64" --provenance-input "$D/broad-far-bank.xz.b64" "$W"/imports/Raw47D3FAR*.lean 2>&1 | tee "$W/log"
          python - "$W/log" "$W/imports/ids.txt" <<'PY'
          import re,sys
          log=open(sys.argv[1]).read()
          for i in map(int,open(sys.argv[2])):
              name=f'BB6.Agent50.Raw47D3FAR{i}.all_quotient'
              m=re.search(r"'"+re.escape(name)+r"' depends on axioms: \[([^\]]*)\]",log)
              if m: assert set(m.group(1).split(', ')) <= {'propext','Quot.sound','Classical.choice'}, (name,m.group(1))
              else: assert f"'{name}' does not depend on any axioms" in log,name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: raw47-far-${{ matrix.shard }}-${{ matrix.offset }}-${{ matrix.size }}
          path: .tmp/a50-raw47-far-batch/
          if-no-files-found: error
