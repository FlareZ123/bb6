name: Agent 50 Raw47 depth-3 cut and FAR5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  depth3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run deeper Raw47 cut and FAR5 bank
        run: bash im-results/agent50-raw47-depth3/run_depth3.sh "$RUNNER_TEMP/raw47-depth3"

      - name: Commit reproducible depth-3 outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agent 50"
          git config user.email "agent50@users.noreply.github.com"
          out="$RUNNER_TEMP/raw47-depth3"
          dest="im-results/agent50-raw47-depth3"
          cp "$out/raw47-depth3.json" "$dest/raw47-depth3.json"
          cp "$out/raw47-depth3.open" "$dest/raw47-depth3.open"
          cp "$out/raw47-depth3-cut.log" "$dest/raw47-depth3-cut.log"
          cp "$out/raw47-depth3-farbank.in" "$dest/raw47-depth3-farbank.in"
          cp "$out/raw47-depth3-far5.txt" "$dest/raw47-depth3-far5.txt"
          cp "$out/raw47-depth3-far5.log" "$dest/raw47-depth3-far5.log"
          cp "$out/summary.txt" "$dest/summary.txt"
          git fetch origin main
          git rebase origin/main
          git add "$dest/raw47-depth3.json" "$dest/raw47-depth3.open" "$dest/raw47-depth3-cut.log" "$dest/raw47-depth3-farbank.in" "$dest/raw47-depth3-far5.txt" "$dest/raw47-depth3-far5.log" "$dest/summary.txt"
          git commit -m "Agent 50: Preserve Raw47 depth-3 cut and FAR5 search"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push depth-3 outputs after three reconciliations" >&2
          exit 1

      - name: Upload depth-3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent50-raw47-depth3
          path: |
            im-results/agent50-raw47-depth3/raw47-depth3.json
            im-results/agent50-raw47-depth3/raw47-depth3.open
            im-results/agent50-raw47-depth3/raw47-depth3-cut.log
            im-results/agent50-raw47-depth3/raw47-depth3-farbank.in
            im-results/agent50-raw47-depth3/raw47-depth3-far5.txt
            im-results/agent50-raw47-depth3/raw47-depth3-far5.log
            im-results/agent50-raw47-depth3/summary.txt
          if-no-files-found: warn
