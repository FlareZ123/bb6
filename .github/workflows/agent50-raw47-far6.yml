name: Agent 50 Raw47 FAR6 search

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  far6:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run verified six-state FAR search
        run: bash im-results/agent50-raw47-far6/run_far6.sh "$RUNNER_TEMP/raw47-far6"

      - name: Commit reproducible search output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Agent 50"
          git config user.email "agent50@users.noreply.github.com"
          out="$RUNNER_TEMP/raw47-far6"
          dest="im-results/agent50-raw47-far6"
          cp "$out/raw47-far6.txt" "$dest/raw47-far6.txt"
          cp "$out/raw47-far6.log" "$dest/raw47-far6.log"
          cp "$out/raw47-farbank.in" "$dest/raw47-farbank.in"
          cp "$out/raw47-cut.log" "$dest/raw47-cut.log"
          cp "$out/summary.txt" "$dest/summary.txt"
          git add "$dest/raw47-far6.txt" "$dest/raw47-far6.log" "$dest/raw47-farbank.in" "$dest/raw47-cut.log" "$dest/summary.txt"
          if git diff --cached --quiet; then
            echo "No new FAR6 search output to commit"
            exit 0
          fi
          git commit -m "Agent 50: Preserve Raw47 FAR6 search results"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push FAR6 search output after three reconciliations" >&2
          exit 1

      - name: Upload Raw47 FAR6 search artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent50-raw47-far6
          path: |
            im-results/agent50-raw47-far6/raw47-far6.txt
            im-results/agent50-raw47-far6/raw47-far6.log
            im-results/agent50-raw47-far6/raw47-farbank.in
            im-results/agent50-raw47-far6/raw47-cut.log
            im-results/agent50-raw47-far6/summary.txt
          if-no-files-found: warn
