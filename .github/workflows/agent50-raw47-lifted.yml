          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prove Raw34 C-D closed-state invariant and 64 cylinders
        run: |
          set -euo pipefail
          W=/tmp/a50-raw34-closed
          mkdir -p "$W"
          lean --version | grep -F '4.36.0-rc2'
          python tools/lean_compile_closure.py --workdir "$W/build" --jobs 2 \
            --manifest "$W/manifest.json" \
            --theorem BB6.Agent50Raw34Closed.all_sixtyfour \
            --artifact-name raw34-closed-source \
            im-results/agent50-raw34-firsthole/Raw34ClosedComponent.lean \
            2>&1 | tee "$W/closure.log"
          python - "$W/closure.log" <<'PY'
          import re,sys
          log=open(sys.argv[1]).read()
          allowed={'propext','Classical.choice','Quot.sound'}
          for name in ('closed_table','closed_step','closed_run','first3','never',
                       'eight_moves','moves_distinct','moves_closed','all_sixtyfour'):
              full='BB6.Agent50Raw34Closed.'+name
              m=re.search(r"'"+re.escape(full)+r"' depends on axioms: \[([^\]]*)\]",log)
              if m: assert set(filter(None,m.group(1).split(', '))) <= allowed,(full,m.group(1))
              else: assert f"'{full}' does not depend on any axioms" in log,full
          print('PASS: 64 closed C-D cylinders universally nonhalting, standard axioms only')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw34-closed-source
          path: |
            /tmp/a50-raw34-closed/closure.log
            /tmp/a50-raw34-closed/manifest.json
            /tmp/a50-raw34-closed/build/*.olean
          if-no-files-found: error
          retention-days: 30

  raw34-depth3:
    if: inputs.mode == 'raw34-depth3'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Source-check 1206 third-level Raw34 side-cycle cylinders
        run: |
          set -euo pipefail
          W=/tmp/a50-raw34-depth3
          mkdir -p "$W"
          lean --version | grep -F '4.36.0-rc2'
          python tools/lean_compile_closure.py --workdir "$W/build" --jobs 4 \
            --manifest "$W/manifest.json" \
            --theorem BB6.Agent50Raw34Depth3.all_never \
            --artifact-name raw34-depth3-source \
            im-results/agent50-raw34-firsthole/Raw34Depth3All.lean \
            2>&1 | tee "$W/closure.log"
          python - "$W/closure.log" <<'PY'
          import re,sys
          log=open(sys.argv[1]).read()
          allowed={'propext','Classical.choice','Quot.sound'}
          for name in ('witness_count','all_checked','all_never'):
