            --manifest "$W/manifest.json" \
            --theorem BB6.Agent50Raw34Depth2.all_never \
            --artifact-name raw34-depth2-source \
            im-results/agent50-raw34-firsthole/Raw34Depth2SideCycles.lean \
            2>&1 | tee "$W/closure.log"
          python - "$W/closure.log" <<'PY'
          import re,sys
          log = open(sys.argv[1]).read()
          allowed = {'propext','Classical.choice','Quot.sound'}
          for name in ('witness_count','pairwise_key_distinct',
                       'separate_from_first_level','all_checked','all_never'):
              full = 'BB6.Agent50Raw34Depth2.' + name
              m = re.search(r"'"+re.escape(full)+r"' depends on axioms: \[([^\]]*)\]", log)
              if m: assert set(filter(None,m.group(1).split(', '))) <= allowed, (full,m.group(1))
              else: assert f"'{full}' does not depend on any axioms" in log, full
          print('PASS: all 74 original-source rays have standard-axiom universal nonhalting proofs')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw34-depth2-source
          path: |
            /tmp/a50-raw34-depth2/closure.log
            /tmp/a50-raw34-depth2/manifest.json
            /tmp/a50-raw34-depth2/build/*.olean
          if-no-files-found: error
          retention-days: 30

  raw34-growth:
