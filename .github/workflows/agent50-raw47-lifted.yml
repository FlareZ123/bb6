  raw34-six-plan:
    if: inputs.mode == 'raw34-six-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate an exact two-level 25-choice Raw34 frontier
        env:
          PARENT: ${{ inputs.raw34_parent }}
          NAME: ${{ inputs.raw34_name }}
          CAP: ${{ inputs.raw34_cap }}
          WINDOW: ${{ inputs.raw34_window }}
          LONG_CAP: ${{ inputs.raw34_long_cap }}
        run: |
          set -euo pipefail
          D=im-results/agent50-raw34-plan
          W=/tmp/a50-raw34-six
          mkdir -p "$W/generated"
          g++ -O3 -std=c++17 "$D/far.cpp" -o "$W/far"
          python "$D/generate_six.py" --parent "$PARENT" --name "$NAME" --far "$W/far" --output "$W/generated" --cap "$CAP" --window "$WINDOW" --long-cap "$LONG_CAP" --summary-only | tee "$W/generator.log"
          python - "$W/generated/summary.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          flat=x["parent"].replace("_","")
          holes=sum(flat[i:i+3]=="---" for i in range(0,36,3))
          assert len(x["children"])==25
          assert sum(x["mass"].values())==25**holes
          residuals=[{"child":i,"row":r} for i,c in enumerate(x["children"]) for r in c["residuals"]]
          residual_mass=sum(25**r["row"].count(0) for r in residuals)
          print("RAW34_SIX_FRONTIER",json.dumps({
              "parent":x["parent"],"holes":holes,"weighted_bound":x["weighted_bound"],
              "nodes":x["nodes"],"stats":x["stats"],"mass":x["mass"],
              "residual_rows":len(residuals),"residual_mass":residual_mass,
              "child_residual_rows":[len(c["residuals"]) for c in x["children"]]
          },sort_keys=True))
          print("RAW34_SIX_RESIDUALS",json.dumps(residuals,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw34-six-plan-frontier
          path: /tmp/a50-raw34-six/
          if-no-files-found: error
          retention-days: 30

