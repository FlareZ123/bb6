name: Agent50 P1 two-reset arithmetic (manual source audit)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unchanged Agent28 source and Agent50 sharp budget
        run: |
          set -e
          export LEAN_PATH="im-results/agent28-p1-word-automaton:im-results/agent50-p1-two-reset"
          root="im-results/agent28-p1-word-automaton"
          target="im-results/agent50-p1-two-reset"
          lean -o "$root/OneResetTwoAdic.olean" "$root/OneResetTwoAdic.lean"
          lean -o "$root/DefectTransport.olean" "$root/DefectTransport.lean"
          lean -o "$target/TwoResetSharp.olean" "$target/TwoResetSharp.lean"
          lean "$target/TwoResetDefectSharp.lean"
