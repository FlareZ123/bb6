name: Agent 6 BB429 all-counter nonhalting ray (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unchanged source accelerator, existing ray and generalization
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent6-harmonic429
        run: |
          set -euo pipefail
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -o im-results/agent6-harmonic429/EscapeRay.olean im-results/agent6-harmonic429/EscapeRay.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-harmonic429/GeneralEscape.olean im-results/agent6-harmonic429/GeneralEscape.lean
          lean -DmaxHeartbeats=10000000 im-results/agent6-harmonic429/HaltVsEscape.lean
