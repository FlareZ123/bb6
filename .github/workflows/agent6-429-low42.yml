name: Agent 6 #429 full low4k2 original-source Lean audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check complete original source graph and low4k2 physical theorem
        shell: bash
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent4-coverage-smoke:im-results/agent32-zero-prefix-global:im-results/agent6-fresh-glider:im-results/agent1-429-physical-frontier:im-results/agent32-429-raw-parent:im-results/agent32-429-primitive-cost:im-results/agent18-429-lastwriter:im-results/agent6-429-one-sided-excursion:im-results/agent32-429-high2-prefix:im-results/agent1-429-w4-boundary:im-results/agent33-429-writer-locality:im-results/agent4-429-ordinary-frontier:im-results/agent1-429-w2-census:im-results/agent6-429-low2:im-results/agent18-429-low-j:im-results/agent6-429-low42:im-results/agent1-429-root-entry:im-results/agent48-429-safe:im-results/agent30-429-positive-safe:im-results/agent6-429-low40:im-results/agent32-429-loweven-r32:im-results/agent32-429-low43"
          LOG=/tmp/agent6-low42-source.log
          : > "$LOG"
          compile() {
            echo "LEAN $1"
            lean -DmaxHeartbeats=30000000 -DmaxRecDepth=32768 -o "$1.olean" "$1.lean" >> "$LOG" 2>&1 || {
              tail -160 "$LOG"
              exit 1
            }
          }
          compile im-results/agent8-coverage-contract/Frontier
          compile im-results/agent32-429-primitive-cost/BubbleExact
          compile im-results/agent32-429-primitive-cost/BubblePrefix
          for m in RayClosed RayChecker RayEntry RayFinite RayTurnExample RayFiniteOracle FiniteHalting; do
            compile "im-results/agent8-coverage-contract/$m"
          done
          compile im-results/agent8-coverage-contract/Symmetry
          for m in RayMacro EntryMacroOracle EntryMacroLeft; do
            compile "im-results/agent6-fresh-glider/$m"
          done
          compile im-results/agent44-drift-closure/DirectedDrift
          for m in ZeroMaskOracle FiniteDecision; do
            compile "im-results/agent8-coverage-contract/$m"
          done
          for m in FrontierAudit FrontierMass; do
            compile "im-results/agent4-coverage-smoke/$m"
          done
          for m in ZeroPathAudit ControlPathAudit ZeroRowAudit PhysicalTraceAudit FiniteLassoOracle LassoTraceAudit; do
            compile "im-results/agent32-zero-prefix-global/$m"
          done
          compile im-results/agent1-429-physical-frontier/BB429PhysicalFrontier
          for m in BB429OddExcursion BB429SourceE1Return BB429SourceE1Delta BB429SourceRows BB429PhysicalBridge; do
            compile "im-results/agent6-429-one-sided-excursion/$m"
          done
          for m in BB429E1ShiftDelta BB429DeltaPhysicalBridge; do
            compile "im-results/agent32-429-raw-parent/$m"
          done
          compile im-results/agent6-429-one-sided-excursion/BB429FinishScanEDelta
          compile im-results/agent6-429-one-sided-excursion/BB429JuncHeadExcursion
          compile im-results/agent1-429-w4-boundary/W4CZeroSafe
          compile im-results/agent1-429-w4-boundary/W4CZeroCount
          compile im-results/agent1-429-w4-boundary/W4CZeroOrdinary
          compile im-results/agent30-429-positive-safe/PositiveSafe
          compile im-results/agent30-429-positive-safe/ZeroRegularSafe
          compile im-results/agent30-429-positive-safe/ZeroTwoGate
          compile im-results/agent30-429-positive-safe/PhysicalSafe
          compile im-results/agent30-429-positive-safe/PositiveZeroGate
          compile im-results/agent30-429-positive-safe/OuterSafe
          compile im-results/agent18-429-low-j/Low3Delta
          compile im-results/agent32-429-primitive-cost/JPhysicalPrefix
          compile im-results/agent6-429-low42/Low42Delta
          compile im-results/agent6-429-low42/Low42Physical
          compile im-results/agent1-429-root-entry/Low42RootNoFatal
          compile im-results/agent1-429-root-entry/RootOuterLow42NoFatal
          compile im-results/agent48-429-safe/NoFatalGuard
          compile im-results/agent48-429-safe/RootNoFatalPrefix
          compile im-results/agent48-429-safe/RootNoFatalPhysical
          compile im-results/agent48-429-safe/RootNoFatalChain
          compile im-results/agent1-429-w4-boundary/W4HeadMax
          compile im-results/agent1-429-w4-boundary/W4JuncMax
          python -c 'from pathlib import Path; import base64,hashlib,lzma; p=Path("im-results/agent6-429-low42"); b=lzma.decompress(base64.b64decode((p/"Low42Max.lean.xz.b64").read_text().strip())); assert hashlib.sha256(b).hexdigest()=="9858955ef0ad8ce9b3f2769adebd1943c6081e99bd7d77a436a6c215bea13ed5"; (p/"Low42Max.lean").write_bytes(b)'
          compile im-results/agent6-429-low42/Low42Max
          compile im-results/agent1-429-w4-boundary/W4HeadPrefix
          compile im-results/agent4-429-ordinary-frontier/ZeroRegularHeadMax
          compile im-results/agent4-429-ordinary-frontier/PositiveRegularHeadMax
          compile im-results/agent4-429-ordinary-frontier/PhysicalRegularHeadMax
          compile im-results/agent1-429-root-entry/RootJunc136To45
          compile im-results/agent32-429-loweven-r32/LowEvenR32NoFatal
          compile im-results/agent32-429-loweven-r32/LowEvenR32RootChain
          compile im-results/agent32-429-loweven-r32/LowEvenR32RootExtension
          compile im-results/agent6-429-low42/Low42PrefixPhysical
          compile im-results/agent32-429-low43/Low43Delta
          compile im-results/agent32-429-low43/Low43Continuation
          compile im-results/agent32-429-low43/Low43Physical
          compile im-results/agent32-429-low43/Low43RootPhysical
          compile im-results/agent32-429-low43/Low43RootNext
          compile im-results/agent32-429-low43/Low43BlankRootExtension
          python -c 'from pathlib import Path; import base64,hashlib,lzma,tarfile,io; p=Path("im-results/agent6-429-low40"); b=lzma.decompress(base64.b64decode((p/"Low40Source.tar.xz.b64").read_text().strip())); assert hashlib.sha256(b).hexdigest()=="1029b21dd6a396f97e75d8a7fb9e42bae81777e45b74e0084ee63049e12e8272"; tf=tarfile.open(fileobj=io.BytesIO(b),mode="r:"); [(p/m.name).write_bytes(tf.extractfile(m).read()) for m in tf.getmembers()]'
          compile im-results/agent6-429-low40/Low40Core
          compile im-results/agent6-429-low40/Low40Source
          compile im-results/agent6-429-low40/Low40Physical
          for decl in BB429Low40.low40_source_all BB429Low40Physical.low40_raw_head_all BB429Low42.low42_source_all BB429Low42.c0_even_to_c0_delta BB429Low42Physical.stage_tape_rep BB429Low42Physical.low42_raw_head_all BB429Low42Max.low42_source_max_all BB429Low42PrefixPhysical.continuation_all_prefixes_right_bound BB429Low42RootNoFatal.low42_root_czero_event_census BB429Low42RootNoFatal.low42_root_no_fatal_source BB429Low42RootNoFatal.low42_root_no_fatal_physical BB429Low42RootNoFatal.blank_root_low42_no_fatal BB429RootOuterLow42NoFatal.rootOuterTime_eq_3398 BB429RootOuterLow42NoFatal.rootOuterTime_plus_low42_eq_4475 BB429RootOuterLow42NoFatal.root_outer_safe_source BB429RootOuterLow42NoFatal.root_outer_no_czero_physical BB429RootOuterLow42NoFatal.blank_root_outer_no_czero BB429RootOuterLow42NoFatal.blank_root_outer_low42_no_fatal BB429NoFatalGuard.runNoFatal_to_run BB429NoFatalGuard.runNoFatal_prefix BB429NoFatalGuard.runNoFatal_add BB429NoFatalGuard.runNoFatal_compose BB429RootNoFatalPrefix.root_prefix_no_fatal_source BB429RootNoFatalPrefix.root_prefix_all_prefixes_nonfatal BB429RootNoFatalPrefix.root_czero_event_trace BB429RootNoFatalPhysical.root_blank_represents BB429RootNoFatalPhysical.root_prefix_no_fatal_physical BB429RootNoFatalChain.blank_root_no_fatal_to_junc136 BB429ZeroRegularHeadMax.junc0_regular_max BB429ZeroRegularHeadMax.junc0_regular_prefix_before_old_mark BB429PositiveRegularHeadMax.juncPos_ordinary_max BB429PositiveRegularHeadMax.juncPos_ordinary_prefix_before_old_mark BB429PhysicalRegularHeadMax.physical_zero_regular_all_prefixes_before_old_mark BB429PhysicalRegularHeadMax.physical_positive_regular_all_prefixes_before_old_mark BB429PhysicalRegularHeadMax.physical_zero_regular_frontier_conserved BB429PhysicalRegularHeadMax.physical_positive_regular_frontier_conserved BB429RootJunc136To45.root_regular_source_safe BB429RootJunc136To45.root_regular_physical BB429RootJunc136To45.blank_root_no_fatal_to_junc45 BB429LowEvenR32.lowEvenR32_segment1_delta BB429LowEvenR32.lowEvenR32_segment2_delta BB429LowEvenR32.lowEvenR32_segment3_delta BB429LowEvenR32.lowEvenR32_total_delta BB429LowEvenR32.lowEvenR32_segment1_no_fatal BB429LowEvenR32.lowEvenR32_segment2_no_fatal BB429LowEvenR32.lowEvenR32_segment3_no_fatal BB429LowEvenR32.lowEvenR32_no_fatal_source BB429LowEvenR32.lowEvenR32_tail_czero_event_census BB429LowEvenR32.lowEvenR32_no_fatal_physical BB429LowEvenR32.blank_root_lowEvenR32_no_fatal BB429LowEvenR32RootChain.blank_root_lowEvenR32_to_junc11_146 BB429LowEvenR32RootExtension.low42_j34k9_no_fatal_source BB429LowEvenR32RootExtension.lowOdd_v6_n42_no_fatal_source BB429LowEvenR32RootExtension.low42_j13k38_no_fatal_source BB429LowEvenR32RootExtension.low42_j34k9_no_fatal_physical BB429LowEvenR32RootExtension.lowOdd_v6_n42_no_fatal_physical BB429LowEvenR32RootExtension.low42_j13k38_no_fatal_physical BB429LowEvenR32RootExtension.blank_root_lowEvenR32_to_junc0_216 BB429Low43RootNext.root_low43_119_to_69_no_fatal BB429Low43RootNext.root_low43_119_to_69_physical BB429Low43BlankRootExtension.lowOdd_v22_n34_no_fatal_source BB429Low43BlankRootExtension.low42_j45_k14_no_fatal_source BB429Low43BlankRootExtension.lowOdd_v38_n26_no_fatal_source BB429Low43BlankRootExtension.outer_ladder_0_to_93 BB429Low43BlankRootExtension.blank_root_lowEvenR32_to_junc69_186; do
            grep -E "'$decl' (depends on axioms:|does not depend on any axioms)" "$LOG"
          done
          if grep -q sorryAx "$LOG"; then
            echo "FAIL: unexpected sorryAx in original-source proof chain"
            exit 1
          fi
          echo "PASS: original-source #429 low4k/low4k2, r=32 root chain, and 136,182-step blank-root prefix through J(69,186)"
