name: Agent 6 BB429 complete source chain (manual)

on:
  workflow_dispatch:
    inputs:
      original_source:
        description: 'Also build the original pinned Cryptids dependency'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bb429-source-chain:
    if: ${{ inputs.original_source }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_SHA: c86f15861709b76042998c5211c7b2f83991621b
      ORIGINAL_MODULE: BusyBeaver.BB6.M_1RB0LF_1RC1RA_0RD0RB_1LEHHH_0LA1LE_1RD1LA
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned upstream Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Checkout fixed original Cryptids source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          git -C /tmp/cryptids checkout --quiet "$UPSTREAM_SHA"
          test "$(git -C /tmp/cryptids rev-parse HEAD)" = "$UPSTREAM_SHA"
      - name: Fetch original pinned Mathlib cache
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          lake exe cache get
          df -h /
      - name: Build original raw-TM accelerator
        working-directory: /tmp/cryptids
        shell: bash
        run: lake build "$ORIGINAL_MODULE"
      - name: Compile all unchanged local BB429 modules and source bridge
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/im-results/agent5-429-rank/BB429Rank.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent5-429-rank/BB429Burst.lean" .
          cp "$GITHUB_WORKSPACE/im-results/agent6-harmonic429/"*.lean .
          for module in BB429Rank BB429Burst BB429PowerBarrier BB429PowerBarrierBurst BB429NonFirstBurst BB429LastReset BB429FirstRunEq BB429TerminalReset BB429ElevenSeed ReturnLadder EscapeRay EscapeRoot ExitTransfer CorridorExceptions WholeCorridor VExitTransfer VWholeCorridor CrossRayReturn OddBoundary CrossRayOverflow OddUBounce OddCascade OddVSecondary OddVHigh OddVThirdOverflow OddVHighReturn BB429Mod8 BB429Extra11 BB429Extra19 BB429OneGate BB429Thirteen BB429Depth4 BB429Mod32Six BB429NoThree BB429HaltFeeder BB429NoTwentyFive BB429NewGate SourceLadder SourceMod16 SourceMod32 SourceMod32Six SourceRawHaltFunnel SourceRawHaltIff SourceRawHaltFive SourceRawHaltFour; do
            echo "::group::Compile $module"
            lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean"
            echo "::endgroup::"
          done

  standalone-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2 for standalone kernel audit
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile complete original local module chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bb429-check
          cp im-results/agent5-429-rank/BB429Rank.lean /tmp/bb429-check/
          cp im-results/agent5-429-rank/BB429Burst.lean /tmp/bb429-check/
          cp im-results/agent6-harmonic429/*.lean /tmp/bb429-check/
          cd /tmp/bb429-check
          export LEAN_PATH=".:$(lean --print-prefix)/lib/lean"
          for module in BB429Rank BB429Burst BB429PowerBarrier BB429PowerBarrierBurst BB429NonFirstBurst BB429LastReset BB429FirstRunEq BB429TerminalReset BB429ElevenSeed ReturnLadder EscapeRay EscapeRoot ExitTransfer CorridorExceptions WholeCorridor VExitTransfer VWholeCorridor CrossRayReturn OddBoundary CrossRayOverflow OddUBounce OddCascade OddVSecondary OddVHigh OddVThirdOverflow OddVHighReturn BB429Mod8 BB429Extra11 BB429Extra19 BB429OneGate BB429Thirteen BB429Depth4 BB429Mod32Six BB429NoThree BB429HaltFeeder BB429NoTwentyFive BB429NewGate; do
            echo "::group::Kernel-check $module"
            lean -o "$module.olean" "$module.lean"
            echo "::endgroup::"
          done
