name: Agent 6 BB429 all-3-adic synthetic halting integration (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unchanged BB429 source, both synthetic families, all 3-adic lemmas and integration
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent4-bb429-dyadic-barrier:im-results/agent6-429-coprime-moduli:im-results/agent6-harmonic429:im-results/agent1-429-threeadic
        run: |
          set -euo pipefail
          lean -DmaxHeartbeats=10000000 -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent5-429-rank/BB429Burst.olean im-results/agent5-429-rank/BB429Burst.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent4-bb429-dyadic-barrier/BB429DyadicStarts.olean im-results/agent4-bb429-dyadic-barrier/BB429DyadicStarts.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-429-coprime-moduli/Agent6TwoBurstOne.olean im-results/agent6-429-coprime-moduli/Agent6TwoBurstOne.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-429-coprime-moduli/Agent6TwoBurstZero.olean im-results/agent6-429-coprime-moduli/Agent6TwoBurstZero.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent1-429-threeadic/ThreeAdicLifting.olean im-results/agent1-429-threeadic/ThreeAdicLifting.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent1-429-threeadic/ThreeAdicG2.olean im-results/agent1-429-threeadic/ThreeAdicG2.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent1-429-threeadic/ThreeAdicH0.olean im-results/agent1-429-threeadic/ThreeAdicH0.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-harmonic429/BB429Mod8.olean im-results/agent6-harmonic429/BB429Mod8.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-harmonic429/BB429NewResidue.olean im-results/agent6-harmonic429/BB429NewResidue.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-429-coprime-moduli/BB429RootOddRows.olean im-results/agent6-429-coprime-moduli/BB429RootOddRows.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-429-coprime-moduli/BB429Terminal16381Partial.olean im-results/agent6-429-coprime-moduli/BB429Terminal16381Partial.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-429-coprime-moduli/BB429AffineReturn.olean im-results/agent6-429-coprime-moduli/BB429AffineReturn.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-429-coprime-moduli/BB429RootPrefix.olean im-results/agent6-429-coprime-moduli/BB429RootPrefix.lean
          lean -DmaxHeartbeats=10000000 -o im-results/agent6-429-coprime-moduli/BB429RootBlockReach.olean im-results/agent6-429-coprime-moduli/BB429RootBlockReach.lean
          lean -DmaxHeartbeats=10000000 im-results/agent6-429-coprime-moduli/ThreeAdicSynthetic.lean
