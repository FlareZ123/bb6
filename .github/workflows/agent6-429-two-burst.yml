name: Agent 6 BB429 synthetic two-burst source proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check original source map, burst lemmas and both new two-burst proofs
        env:
          LEAN_PATH: im-results/agent5-429-rank:im-results/agent4-bb429-dyadic-barrier:im-results/agent6-429-coprime-moduli
        run: |
          set -euo pipefail
          lean -o im-results/agent5-429-rank/BB429Rank.olean im-results/agent5-429-rank/BB429Rank.lean
          lean -o im-results/agent5-429-rank/BB429Burst.olean im-results/agent5-429-rank/BB429Burst.lean
          lean -o im-results/agent4-bb429-dyadic-barrier/BB429DyadicStarts.olean im-results/agent4-bb429-dyadic-barrier/BB429DyadicStarts.lean
          lean -DmaxHeartbeats=10000000 im-results/agent6-429-coprime-moduli/Agent6TwoBurstOne.lean
          lean -DmaxHeartbeats=10000000 im-results/agent6-429-coprime-moduli/Agent6TwoBurstZero.lean
