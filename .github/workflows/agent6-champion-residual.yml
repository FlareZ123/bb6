name: Agent 6 champion-residual frontier

on:
  workflow_dispatch:
    inputs:
      f0_siblings_only:
        description: Audit isolated F0 sibling certificates
        type: boolean
        default: false
      raw121_graft_run_id:
        description: Optional successful Agent11 run ID for raw121-canonical76-graft-proof
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: ${{ !inputs.f0_siblings_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Generate exact residual and certificate dependencies
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
      - name: Reconstruct champion proof source modules
        run: |
          set -euo pipefail
          work="$PWD/.tmp/a6-champion-residual"
          mkdir -p "$work/imports"
          python3 - <<'PY'
          import base64, io, lzma, pathlib, tarfile
          root = pathlib.Path(".tmp/a6-champion-residual/imports")
          p = pathlib.Path("im-results/agent42-champion-terminal")
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode((p/"TerminalProofs.tar.xz.b64").read_text())), mode="r:xz") as a:
              member = next(m for m in a.getmembers() if pathlib.PurePosixPath(m.name).name == "TerminalFinish.lean")
              (root/"TerminalFinish.lean").write_bytes(a.extractfile(member).read())
          (root/"TerminalLeft.lean").write_bytes(lzma.decompress(base64.b64decode((p/"TerminalLeftExact.lean.xz.b64").read_text())))
          PY
          printf '%s  %s\n' 12329036c66c3846f9261167b8f9aebd1778d9b6ea6044309956c2fa0b3e49b7 "$work/imports/TerminalFinish.lean" | sha256sum -c -
          printf '%s  %s\n' 1bce2075fc4e0cd7d740fb71b3796088b190ddb6766e04640d992dadd1b650ff "$work/imports/TerminalLeft.lean" | sha256sum -c -
      - name: Generate Raw68/Raw72/Raw82 source modules
        run: python3 im-results/agent10-tnf-multipump/generate.py 68 72 82
      - name: Reconstruct source-accepted F1=0LF proof modules
        run: bash im-results/agent41-raw139-f1-zeroLF/reproduce.sh
      - name: Reconstruct source-accepted F1=1LA proof modules
        run: |
          set -euo pipefail
          base="$PWD/im-results/agent48-raw139-f1-oneLA"
          work="$PWD/.tmp/a48-f1-oneLA"
          mkdir -p "$work/imports"
          (
            cd "$work/imports"
            cp "$base/recipes.txt" .
            python3 "$base/replay.py"
            python3 "$base/package.py"
            printf '%s  %s\n' 0efe6d872460d07282eaa1cb63d878c211b426a2da8cb70a3bb1675d3e69a730 "$work/imports/ChampionF1OneLACover.lean" | sha256sum -c -
            printf '%s  %s\n' 4d4f583f5f3197d2d12bed38aeea081fc8f1f74c7f8af9856ffaded24e9e5dbf "$work/imports/ChampionF1OneLAHard.lean" | sha256sum -c -
          )
      - name: Reconstruct source-accepted F1=0RC proof modules
        run: |
          set -euo pipefail
          base="im-results/agent41-raw139-f1-zeroLF"
          work="$PWD/.tmp/a41-f1-zeroRC"
          mkdir -p "$work/imports"
          base64 -d "$base/Agent41F1ZeroLFProofs.tar.xz.b64" > "$work/prior.tar.xz"
          tar -xJf "$work/prior.tar.xz" -C "$work/imports" Agent41SymSweep.lean
          base64 -d "$base/Agent41F1ZeroRCProofs.tar.xz.b64" > "$work/proofs.tar.xz"
          printf '%s  %s\n' e714f0772d6e7df0d64e3da63153c8450e39abead67caf8fb5b61d1241e5dbd8 "$work/proofs.tar.xz" | sha256sum -c -
          tar -xJf "$work/proofs.tar.xz" -C "$work/imports"
      - name: Compile the champion frontier and depth-five F1 sibling refinement
        run: |
          set -euo pipefail
          work=/tmp/a6-champion-residual
          python tools/lean_compile_closure.py \
            im-results/agent6-champion-residual/ChampionResidualFrontier.lean \
            im-results/agent6-champion-residual/ChampionResidualParentIntegration.lean \
            im-results/agent6-champion-residual/F0SiblingIntegration.lean \
            im-results/agent6-champion-residual/F0SiblingIntegrationExtended.lean \
            im-results/agent48-champion-root/ChampionF1SiblingIntegration.lean \
            im-results/agent48-champion-root/ChampionF1RFIntegration.lean \
            im-results/agent48-champion-root/ChampionF1ZeroLFIntegration.lean \
            im-results/agent6-champion-residual/ChampionF1OneLAIntegration.lean \
            im-results/agent6-champion-residual/ChampionF1ZeroRCIntegration.lean \
            --source-root "$PWD/.tmp/a41-f1-zeroLF/imports" \
            --source-root "$PWD/.tmp/a48-f1-oneLA/imports" \
            --source-root "$PWD/.tmp/a41-f1-zeroRC/imports" \
            --precompiled-manifest "$PWD/.tmp/a41-f1-zeroLF/manifest.json" \
            --precompiled-dir "$PWD/.tmp/a41-f1-zeroLF/build" \
            --override TerminalBridge=im-results/agent42-champion-terminal/TerminalBridge.lean \
            --override OuterLCIncPrelude=im-results/agent8-counted-reset/OuterLCIncPrelude.lean \
            --override M0OddResidueSeven=im-results/agent41-m0-n16r7/M0OddResidueSeven.lean \
            --override M0EvenEightValuationEncoding=im-results/agent48-counted-inc0/M0EvenEightValuationEncoding.lean \
            --override M2EvenResidueTwo=im-results/agent42-champion-terminal/M2EvenResidueTwo.lean \
            --workdir "$work/build" --jobs 4 | tee "$work/compile.log"
          if grep -Eq 'sorryAx|native_decide' "$work/compile.log"; then
            echo "Forbidden proof placeholder or native_decide found in champion residual closure" >&2
            exit 1
          fi
          python3 - "$work/compile.log" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "championWitnessesOK",
              "championP8Certificate",
              "championResidualFrontierSound",
              "championResidualRetainedTrue",
              "BB6.Agent6ChampionResidual.championResidualResidualsCount",
              "BB6.Agent6ChampionResidual.championResidualRefinedRosterCount",
              "championResidualRefinedRosterSound",
              "exactBB6OfChampionResidualRoster",
              "parent_eq_championP7",
              "parent_certificate_on_championP7",
              "championResidualFrontierWithParentSound",
              "championResidualFrontierWithParentCount",
              "championResidual_mem_canonical78",
              "openLeaf_mem_residuals",
              "cover_of_frontier_leaves",
              "cover_of_championResidual_frontier",
              "exact_from_nonchampion_roster_covers_and_parent_frontier",
              "canonical78_other_address_count",
              "canonical78_refined_obligation_count",
              "base_eq_championP6",
              "parent_eq_championChild",
              "champion_score_ge_49394",
              "cover_closed",
              "removed_count",
              "remaining_count",
              "exact_from_remaining",
              "BB6.Agent41F0Extended.remainingExtended_count",
              "BB6.Agent41F0Extended.refined_residual_cover",
              "BB6.Agent41F0Extended.exact_from_remainingExtended",
              "BB6.Agent48F1Integration.oneLF_is_depth5_sibling",
              "BB6.Agent48F1Integration.zeroRD_is_depth5_sibling",
              "BB6.Agent48F1Integration.cover_oneLF",
              "BB6.Agent48F1Integration.cover_zeroRD",
              "BB6.Agent48F1Integration.remainingF1Extended_count",
              "BB6.Agent48F1Integration.removedF1_count",
              "BB6.Agent48F1Integration.cover_remainingExtended",
              "BB6.Agent48F1Integration.refined_residual_cover",
              "BB6.Agent48F1Integration.exact_from_remainingF1Extended",
              "BB6.Agent31Canonical78Exact.champion_score_gt_7014",
              "BB6.Agent31Canonical78Exact.champion_compatible_root",
              "BB6.Agent31Canonical78Exact.champion_not_weighted_7014",
              "BB6.Agent31Canonical78Exact.champion_in_canonical_roster",
              "BB6Coverage.Agent48DirectRoot.champion_raw_witness",
              "BB6.Agent31Canonical78Exact.cover_at_champion_score",
              "BB6.Agent31Canonical78Exact.exact_from_canonical78_at_champion_score",
              "BB6.Agent48F1RFIntegration.zeroRF_is_depth5_sibling",
              "BB6.Agent48F1RFIntegration.cover_zeroRF",
              "BB6.Agent48F1RFIntegration.remainingF1RF_count",
              "BB6.Agent48F1RFIntegration.cover_remainingF1Extended",
              "BB6.Agent48F1RFIntegration.exact_from_remainingF1RF",
              "BB6.Agent48F1ZeroLFIntegration.zeroLF_is_depth5_sibling",
              "BB6.Agent48F1ZeroLFIntegration.cover_zeroLF",
              "BB6.Agent48F1ZeroLFIntegration.zeroLF_parent_present",
              "BB6.Agent48F1ZeroLFIntegration.remainingF1ZeroLF_count",
              "BB6.Agent48F1ZeroLFIntegration.removedZeroLF_count",
              "BB6.Agent48F1ZeroLFIntegration.cover_remainingF1RF",
              "BB6.Agent48F1ZeroLFIntegration.exact_from_remainingF1ZeroLF",
              "BB6.Agent48F1OneLA.checked",
              "BB6.Agent48F1OneLA.all_completions_weighted",
              "BB6.Agent6F1OneLAIntegration.oneLA_is_depth5_sibling",
              "BB6.Agent6F1OneLAIntegration.cover_oneLA",
              "BB6.Agent6F1OneLAIntegration.oneLA_parent_present",
              "BB6.Agent6F1OneLAIntegration.remainingF1OneLA_count",
              "BB6.Agent6F1OneLAIntegration.removedOneLA_count",
              "BB6.Agent6F1OneLAIntegration.cover_remainingF1ZeroLF",
              "BB6.Agent6F1OneLAIntegration.exact_from_remainingF1OneLA",
              "BB6.Agent41SymSweep.run_sound",
              "BB6.Agent41F1ZeroRC.checked",
              "BB6.Agent41F1ZeroRC.all_completions_weighted",
              "BB6.Agent6F1ZeroRCIntegration.zeroRC_is_depth5_sibling",
              "BB6.Agent6F1ZeroRCIntegration.cover_zeroRC",
              "BB6.Agent6F1ZeroRCIntegration.zeroRC_parent_present",
              "BB6.Agent6F1ZeroRCIntegration.remainingF1ZeroRC_count",
              "BB6.Agent6F1ZeroRCIntegration.removedZeroRC_count",
              "BB6.Agent6F1ZeroRCIntegration.cover_remainingF1OneLA",
              "BB6.Agent6F1ZeroRCIntegration.exact_from_remainingF1ZeroRC",
          )
          for name in names:
              if name.startswith(("BB6.", "BB6Coverage.")):
                  pattern = r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]"
              else:
                  pattern = r"'[^']*\." + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]"
              m = re.search(pattern, log)
              if not m:
                  raise SystemExit("missing axiom audit: "+name)
              used = {x.strip() for x in m.group(1).split(",") if x.strip()}
              if not used <= allowed:
                  raise SystemExit(f"nonstandard axioms: {name}: {used-allowed}")
              print(f"{name}: {sorted(used)}")
          PY
      - name: Download source-accepted Raw121 canonical76 graft artifact
        if: ${{ inputs.raw121_graft_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.raw121_graft_run_id }}
          name: raw121-canonical76-graft-proof
          path: /tmp/a11-canonical76
      - name: Compile raw139 integration against canonical76 after Raw121 graft
        if: ${{ inputs.raw121_graft_run_id != '' }}
        run: |
          set -euo pipefail
          for required in Raw121Canonical77Graft.olean Raw121Data.olean CanonicalRaw114Accepted.olean CanonicalTwoParentGraft.olean Raw114CompleteData.olean; do
            test -s "/tmp/a11-canonical76/$required"
          done
          export LEAN_PATH="/tmp/a11-canonical76:/tmp/a6-champion-residual/build${LEAN_PATH:+:$LEAN_PATH}"
          lean -o /tmp/a6-champion-residual/build/ChampionResidualCanonical76Integration.olean \
            im-results/agent6-champion-residual/ChampionResidualCanonical76Integration.lean | tee /tmp/a6-canonical76.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a6-canonical76.log; then
            echo "Forbidden proof placeholder or native_decide found in canonical76/raw139 composition" >&2
            exit 1
          fi
          python3 - /tmp/a6-canonical76.log <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "BB6.Agent6Canonical76ChampionIntegration.raw121_parent_not_raw139",
              "BB6.Agent6Canonical76ChampionIntegration.championResidual_mem_canonical76",
              "BB6.Agent6Canonical76ChampionIntegration.championResidual_unique_canonical76",
              "BB6.Agent6Canonical76ChampionIntegration.championResidual_unique_by_table",
              "BB6.Agent6Canonical76ChampionIntegration.canonical76_other_address_count",
              "BB6.Agent6Canonical76ChampionIntegration.cover_championResidual_from_raw139_leaves",
              "BB6.Agent6Canonical76ChampionIntegration.refinedCanonical76Roster_count",
              "BB6.Agent6Canonical76ChampionIntegration.exact_from_canonical76_and_raw139_leaves",
          )
          for name in names:
              pattern = r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]"
              match = re.search(pattern, log)
              if match:
                  used = {x.strip() for x in match.group(1).split(",") if x.strip()}
              elif "'" + name + "' does not depend on any axioms" in log:
                  used = set()
              else:
                  raise SystemExit("missing axiom audit: " + name)
              if not used <= allowed:
                  raise SystemExit(f"nonstandard axioms: {name}: {used - allowed}")
              print(name, sorted(used))
          PY
      - name: Download accepted canonical77 proof artifact (fallback)
        if: ${{ inputs.raw121_graft_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45554648116
          name: canonical77-certified
          path: /tmp/a47-canonical
      - name: Compile raw139 integration against the accepted canonical77 roster
        if: ${{ inputs.raw121_graft_run_id == '' }}
        run: |
          set -euo pipefail
          for required in CanonicalTwoParentGraft.olean CanonicalRaw114Accepted.olean Raw114CompleteData.olean; do
            test -s "/tmp/a47-canonical/$required"
          done
          export LEAN_PATH="/tmp/a47-canonical:/tmp/a6-champion-residual/build${LEAN_PATH:+:$LEAN_PATH}"
          lean -o /tmp/a6-champion-residual/build/ChampionResidualCanonical77Integration.olean \
            im-results/agent6-champion-residual/ChampionResidualCanonical77Integration.lean | tee /tmp/a6-canonical77.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a6-canonical77.log; then
            echo "Forbidden proof placeholder or native_decide found in canonical77/raw139 composition" >&2
            exit 1
          fi
          python3 - /tmp/a6-canonical77.log <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "BB6.Agent6Canonical77ChampionIntegration.raw114_parent_not_raw139",
              "BB6.Agent6Canonical77ChampionIntegration.championResidual_mem_canonical77",
              "BB6.Agent6Canonical77ChampionIntegration.championResidual_unique_canonical77",
              "BB6.Agent6Canonical77ChampionIntegration.championResidual_unique_by_table",
              "BB6.Agent6Canonical77ChampionIntegration.canonical77_other_address_count",
              "BB6.Agent6Canonical77ChampionIntegration.cover_championResidual_from_raw139_leaves",
              "BB6.Agent6Canonical77ChampionIntegration.refinedCanonical77Roster_count",
              "BB6.Agent6Canonical77ChampionIntegration.exact_from_canonical77_and_raw139_leaves",
          )
          for name in names:
              pattern = r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]"
              match = re.search(pattern, log)
              if match:
                  used = {x.strip() for x in match.group(1).split(",") if x.strip()}
              elif "'" + name + "' does not depend on any axioms" in log:
                  used = set()
              else:
                  raise SystemExit("missing axiom audit: " + name)
              if not used <= allowed:
                  raise SystemExit(f"nonstandard axioms: {name}: {used - allowed}")
              print(name, sorted(used))
          PY

  f0-siblings:
    if: ${{ inputs.f0_siblings_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Unpack coverage source
        run: python im-results/agent13-coverage/unpack.py
      - name: Audit complete F0 sibling covers
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py im-results/agent6-champion-residual/F0SiblingCover.lean im-results/agent6-champion-residual/F0Counter0LC.lean im-results/agent6-champion-residual/F0SiblingLong.lean im-results/agent6-champion-residual/F0Counter0LE.lean im-results/agent6-champion-residual/F0Counter1RD.lean im-results/agent6-champion-residual/F0SiblingA.lean im-results/agent6-champion-residual/F0Sibling1RB.lean --workdir /tmp/a6-f0 --jobs 4 | tee /tmp/a6-f0.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a6-f0.log; then exit 1; fi
          python - <<'PY'
          import re
          log = open('/tmp/a6-f0.log').read()
          for name in ('cover_oneLA','cover_oneLE','cover_zeroLB','cover_oneLC','cover_zeroLC','cover_oneRC','cover_zeroLE','cover_oneRD','cover_oneLD_zeroLD','cover_oneLD','cover_oneRB_zeroRD','cover_oneRB'):
              if name.startswith(("BB6.", "BB6Coverage.")):
                  pattern = r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]"
              else:
                  pattern = r"'[^']*\." + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]"
              m = re.search(pattern, log)
              if not m: raise SystemExit('missing axiom audit: '+name)
              used = {x.strip() for x in m.group(1).split(',') if x.strip()}
              assert used <= {'propext','Classical.choice','Quot.sound'}, (name,used)
          PY
