name: Agent 6 champion-residual frontier

on:
  workflow_dispatch:
    inputs:
      f0_siblings_only:
        description: Audit isolated F0 sibling certificates
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !inputs.f0_siblings_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Generate exact residual and certificate dependencies
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent10-tnf-raw87/generate.py
          python im-results/agent10-tnf-raw91/generate.py
          python im-results/agent10-tnf-multipump/generate.py 66 70 80
          python im-results/agent10-tnf-multipump/generate.py 86 88 92 93 97 98 100 101 102 104
      - name: Reconstruct champion proof source modules
        run: |
          set -euo pipefail
          work="$PWD/.tmp/a6-champion-residual"
          mkdir -p "$work/imports"
          python3 - <<'PY'
          import base64, io, lzma, pathlib, tarfile
          root = pathlib.Path(".tmp/a6-champion-residual/imports")
          p = pathlib.Path("im-results/agent42-champion-terminal")
          with tarfile.open(fileobj=io.BytesIO(base64.b64decode((p/"TerminalProofs.tar.xz.b64").read_text())), mode="r:xz") as a:
              member = next(m for m in a.getmembers() if pathlib.PurePosixPath(m.name).name == "TerminalFinish.lean")
              (root/"TerminalFinish.lean").write_bytes(a.extractfile(member).read())
          (root/"TerminalLeft.lean").write_bytes(lzma.decompress(base64.b64decode((p/"TerminalLeftExact.lean.xz.b64").read_text())))
          PY
          printf '%s  %s\n' 12329036c66c3846f9261167b8f9aebd1778d9b6ea6044309956c2fa0b3e49b7 "$work/imports/TerminalFinish.lean" | sha256sum -c -
          printf '%s  %s\n' 1bce2075fc4e0cd7d740fb71b3796088b190ddb6766e04640d992dadd1b650ff "$work/imports/TerminalLeft.lean" | sha256sum -c -
      - name: Generate Raw68/Raw72/Raw82 source modules
        run: python3 im-results/agent10-tnf-multipump/generate.py 68 72 82
      - name: Compile the champion frontier and depth-five F1 sibling refinement
        run: |
          set -euo pipefail
          work=/tmp/a6-champion-residual
          python tools/lean_compile_closure.py \
            im-results/agent6-champion-residual/ChampionResidualFrontier.lean \
            im-results/agent6-champion-residual/ChampionResidualParentIntegration.lean \
            im-results/agent6-champion-residual/F0SiblingIntegration.lean \
            im-results/agent6-champion-residual/F0SiblingIntegrationExtended.lean \
            im-results/agent48-champion-root/ChampionF1SiblingIntegration.lean \
            im-results/agent48-champion-root/ChampionF1RFIntegration.lean \
            --override TerminalBridge=im-results/agent42-champion-terminal/TerminalBridge.lean \
            --override OuterLCIncPrelude=im-results/agent8-counted-reset/OuterLCIncPrelude.lean \
            --override M0OddResidueSeven=im-results/agent41-m0-n16r7/M0OddResidueSeven.lean \
            --override M0EvenEightValuationEncoding=im-results/agent48-counted-inc0/M0EvenEightValuationEncoding.lean \
            --override M2EvenResidueTwo=im-results/agent42-champion-terminal/M2EvenResidueTwo.lean \
            --workdir "$work/build" --jobs 4 | tee "$work/compile.log"
          if grep -Eq 'sorryAx|native_decide' "$work/compile.log"; then
            echo "Forbidden proof placeholder or native_decide found in champion residual closure" >&2
            exit 1
          fi
          python3 - "$work/compile.log" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          names = (
              "championWitnessesOK",
              "championP8Certificate",
              "championResidualFrontierSound",
              "championResidualRetainedTrue",
              "championResidualRefinedRosterSound",
              "exactBB6OfChampionResidualRoster",
              "parent_eq_championP7",
              "parent_certificate_on_championP7",
              "championResidualFrontierWithParentSound",
              "championResidualFrontierWithParentCount",
              "championResidual_mem_canonical78",
              "openLeaf_mem_residuals",
              "cover_of_frontier_leaves",
              "cover_of_championResidual_frontier",
              "exact_from_nonchampion_roster_covers_and_parent_frontier",
              "canonical78_other_address_count",
              "canonical78_refined_obligation_count",
              "base_eq_championP6",
              "parent_eq_championChild",
              "champion_score_ge_49394",
              "cover_closed",
              "removed_count",
              "remaining_count",
              "exact_from_remaining",
              "BB6.Agent41F0Extended.remainingExtended_count",
              "BB6.Agent41F0Extended.refined_residual_cover",
              "BB6.Agent41F0Extended.exact_from_remainingExtended",
              "BB6.Agent48F1Integration.oneLF_is_depth5_sibling",
              "BB6.Agent48F1Integration.zeroRD_is_depth5_sibling",
              "BB6.Agent48F1Integration.cover_oneLF",
              "BB6.Agent48F1Integration.cover_zeroRD",
              "BB6.Agent48F1Integration.remainingF1Extended_count",
              "BB6.Agent48F1Integration.removedF1_count",
              "BB6.Agent48F1Integration.cover_remainingExtended",
              "BB6.Agent48F1Integration.refined_residual_cover",
              "BB6.Agent48F1Integration.exact_from_remainingF1Extended",
              "BB6.Agent31Canonical78Exact.champion_score_gt_7014",
              "BB6.Agent31Canonical78Exact.champion_compatible_root",
              "BB6.Agent31Canonical78Exact.champion_not_weighted_7014",
              "BB6.Agent31Canonical78Exact.champion_in_canonical_roster",
              "BB6Coverage.Agent48DirectRoot.champion_raw_witness",
              "BB6.Agent31Canonical78Exact.cover_at_champion_score",
              "BB6.Agent31Canonical78Exact.exact_from_canonical78_at_champion_score",
              "BB6.Agent48F1RFIntegration.zeroRF_is_depth5_sibling",
              "BB6.Agent48F1RFIntegration.cover_zeroRF",
              "BB6.Agent48F1RFIntegration.remainingF1RF_count",
              "BB6.Agent48F1RFIntegration.cover_remainingF1Extended",
              "BB6.Agent48F1RFIntegration.refined_residual_cover",
              "BB6.Agent48F1RFIntegration.exact_from_remainingF1RF",
          )
          for name in names:
              if name.startswith(("BB6.", "BB6Coverage.")):
                  pattern = r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]"
              else:
                  pattern = r"'[^']*\." + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]"
              m = re.search(pattern, log)
              if not m:
                  raise SystemExit("missing axiom audit: "+name)
              used = {x.strip() for x in m.group(1).split(",") if x.strip()}
              if not used <= allowed:
                  raise SystemExit(f"nonstandard axioms: {name}: {used-allowed}")
              print(f"{name}: {sorted(used)}")
          PY

  f0-siblings:
    if: ${{ inputs.f0_siblings_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Unpack coverage source
        run: python im-results/agent13-coverage/unpack.py
      - name: Audit complete F0 sibling covers
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py im-results/agent6-champion-residual/F0SiblingCover.lean im-results/agent6-champion-residual/F0Counter0LC.lean im-results/agent6-champion-residual/F0SiblingLong.lean im-results/agent6-champion-residual/F0Counter0LE.lean im-results/agent6-champion-residual/F0Counter1RD.lean im-results/agent6-champion-residual/F0SiblingA.lean im-results/agent6-champion-residual/F0Sibling1RB.lean --workdir /tmp/a6-f0 --jobs 4 | tee /tmp/a6-f0.log
          if grep -Eq 'sorryAx|native_decide' /tmp/a6-f0.log; then exit 1; fi
          python - <<'PY'
          import re
          log = open('/tmp/a6-f0.log').read()
          for name in ('cover_oneLA','cover_oneLE','cover_zeroLB','cover_oneLC','cover_zeroLC','cover_oneRC','cover_zeroLE','cover_oneRD','cover_oneLD_zeroLD','cover_oneLD','cover_oneRB_zeroRD','cover_oneRB'):
              if name.startswith(("BB6.", "BB6Coverage.")):
                  pattern = r"'" + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]"
              else:
                  pattern = r"'[^']*\." + re.escape(name) + r"' depends on axioms: \[([^\]]*)\]"
              m = re.search(pattern, log)
              if not m: raise SystemExit('missing axiom audit: '+name)
              used = {x.strip() for x in m.group(1).split(',') if x.strip()}
              assert used <= {'propext','Classical.choice','Quot.sound'}, (name,used)
          PY
