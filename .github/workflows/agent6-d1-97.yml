name: Agent6 Raw139 D1=0RD 89-frontier plus full D8 parent (manual)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Pinned source commit
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: agent3-raw139-normalized-cryptids-scan
          run-id: 45767740664
          github-token: ${{ github.token }}
          path: .tmp/base
      - uses: actions/download-artifact@v4
        with:
          name: agent6-d6-d9-reductions-checked
          run-id: 46138720868
          github-token: ${{ github.token }}
          path: .tmp/map
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d8-c1-certified
          run-id: 46137845251
          github-token: ${{ github.token }}
          path: .tmp/d8c1
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d8-c3-certified
          run-id: 46137845251
          github-token: ${{ github.token }}
          path: .tmp/d8c3
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d8-c6-certified
          run-id: 46137440341
          github-token: ${{ github.token }}
          path: .tmp/d8c6
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d8-c17-certified
          run-id: 46139905624
          github-token: ${{ github.token }}
          path: .tmp/d8c17
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d8-c2-certified
          run-id: 46147044639
          github-token: ${{ github.token }}
          path: .tmp/d8c2
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d8-c16-certified
          run-id: 46147047904
          github-token: ${{ github.token }}
          path: .tmp/d8c16
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d8-c18-certified
          run-id: 46147051530
          github-token: ${{ github.token }}
          path: .tmp/d8c18
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d8-c19-certified
          run-id: 46147054693
          github-token: ${{ github.token }}
          path: .tmp/d8c19
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d9-c2-certified
          run-id: 46137436779
          github-token: ${{ github.token }}
          path: .tmp/d9c2
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d9-c6-certified
          run-id: 46137436779
          github-token: ${{ github.token }}
          path: .tmp/d9c6
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d9-c16-certified
          run-id: 46138970830
          github-token: ${{ github.token }}
          path: .tmp/d9c16
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d9-c18-certified
          run-id: 46138970830
          github-token: ${{ github.token }}
          path: .tmp/d9c18
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d9-c19-certified
          run-id: 46138970830
          github-token: ${{ github.token }}
          path: .tmp/d9c19
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d9-core
          run-id: 46137436779
          github-token: ${{ github.token }}
          path: .tmp/core
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Audit child proofs and check 97-machine composition
        run: |
          set -euo pipefail
          base="$(realpath .tmp/base/build)"
          map="$(realpath .tmp/map/a6-reductions/build)"
          core="$(realpath .tmp/core/core)"
          d8c1="$(realpath .tmp/d8c1/src)"
          d8c3="$(realpath .tmp/d8c3/src)"
          d8c6="$(realpath .tmp/d8c6/d8c6/src)"
          d8c17="$(realpath .tmp/d8c17/src)"
          d8c2="$(realpath .tmp/d8c2/src)"
          d8c16="$(realpath .tmp/d8c16/src)"
          d8c18="$(realpath .tmp/d8c18/src)"
          d8c19="$(realpath .tmp/d8c19/src)"
          d9c2="$(realpath .tmp/d9c2/src)"
          d9c6="$(realpath .tmp/d9c6/src)"
          d9c16="$(realpath .tmp/d9c16/src)"
          d9c18="$(realpath .tmp/d9c18/src)"
          d9c19="$(realpath .tmp/d9c19/src)"
          for spec in "8:1:.tmp/d8c1" "8:3:.tmp/d8c3" "8:6:.tmp/d8c6/d8c6" "8:17:.tmp/d8c17" "8:2:.tmp/d8c2" "8:16:.tmp/d8c16" "8:18:.tmp/d8c18" "8:19:.tmp/d8c19" "9:2:.tmp/d9c2" "9:6:.tmp/d9c6" "9:16:.tmp/d9c16" "9:18:.tmp/d9c18" "9:19:.tmp/d9c19"; do
            rest="${spec#*:}"; code="${rest%%:*}"; root="${rest#*:}"; d0="${spec%%:*}"
            grep -F "FINAL" "$root/compile.log"
            grep -F " 0 []" "$root/compile.log"
            grep -F "'D${d0}C$code.cover' depends on axioms: [propext, Classical.choice, Quot.sound]" "$root/src/logs/D${d0}C${code}Parent.log"
            ! grep -REq 'sorryAx|ofReduceBool' "$root/src/logs"
          done
          LEAN_PATH="$base" lean -o "$map/D1ZeroRD.olean" im-results/agent6-raw139-d1-zeroRD/D1ZeroRD.lean > .tmp/d1zero.log
          lp="$map:$base:$d8c1:$d8c3:$d8c6:$d8c17:$d8c2:$d8c16:$d8c18:$d8c19:$d9c2:$d9c6:$d9c16:$d9c18:$d9c19:$core"
          LEAN_PATH="$lp" lean -o "$map/D1EightFive.olean" im-results/agent6-raw139-d1-zeroRD/D1EightFive.lean | tee .tmp/d8five.log
          LEAN_PATH="$lp" lean -o "$map/D1NineFour.olean" im-results/agent6-raw139-d1-zeroRD/D1NineFour.lean | tee .tmp/d9four.log
          LEAN_PATH="$lp" lean -o "$map/D1SecondLevel97.olean" im-results/agent6-raw139-d1-zeroRD/D1SecondLevel97.lean | tee .tmp/d97.log
          grep -F "'BB6.Agent6D1EightFive.cover' depends on axioms: [propext, Classical.choice, Quot.sound]" .tmp/d8five.log
          grep -F "'BB6.Agent6D1NineFour.cover' depends on axioms: [propext, Classical.choice, Quot.sound]" .tmp/d9four.log
          LEAN_PATH="$lp" lean -o "$map/D1EightFour.olean" im-results/agent6-raw139-d1-zeroRD/D1EightFour.lean | tee .tmp/d8four.log
          LEAN_PATH="$lp" lean -o "$map/D1SecondLevel96.olean" im-results/agent6-raw139-d1-zeroRD/D1SecondLevel96.lean | tee .tmp/d96.log
          LEAN_PATH="$lp" lean -o "$map/D1SecondLevel96Bound.olean" im-results/agent6-raw139-d1-zeroRD/D1SecondLevel96Bound.lean | tee .tmp/d96bound.log
          LEAN_PATH="$lp" lean -o "$map/D1EightAll.olean" im-results/agent6-raw139-d1-zeroRD/D1EightAll.lean | tee .tmp/d8all.log
          LEAN_PATH="$lp" lean -o "$map/D1NineOne.olean" im-results/agent6-raw139-d1-zeroRD/D1NineOne.lean | tee .tmp/d9one.log
          LEAN_PATH="$lp" lean -o "$map/D1SecondLevel93.olean" im-results/agent6-raw139-d1-zeroRD/D1SecondLevel93.lean | tee .tmp/d93.log
          LEAN_PATH="$lp" lean -o "$map/D1SecondLevel93Bound.olean" im-results/agent6-raw139-d1-zeroRD/D1SecondLevel93Bound.lean | tee .tmp/d93bound.log
          LEAN_PATH="$lp" lean -o "$map/D1SecondLevel88OfParents.olean" im-results/agent6-raw139-d1-zeroRD/D1SecondLevel88OfParents.lean | tee .tmp/d88parents.log
          LEAN_PATH="$lp" lean -o "$map/D1SecondLevel89.olean" im-results/agent6-raw139-d1-zeroRD/D1SecondLevel89.lean | tee .tmp/d89.log
          grep -F "'BB6.Agent6D1SecondLevel97.cover_of_frontier' depends on axioms: [propext, Classical.choice, Quot.sound]" .tmp/d97.log
          grep -F "'BB6.Agent6D1EightFour.cover' depends on axioms: [propext, Classical.choice, Quot.sound]" .tmp/d8four.log
          grep -F "'BB6.Agent6D1SecondLevel96.cover_of_frontier' depends on axioms: [propext, Classical.choice, Quot.sound]" .tmp/d96.log
          grep -F "'BB6.Agent6D1SecondLevel96Bound.cover_of_frontier' depends on axioms: [propext, Classical.choice, Quot.sound]" .tmp/d96bound.log
          grep -F "'BB6.Agent6D1EightAll.cover' depends on axioms: [propext, Classical.choice, Quot.sound]" .tmp/d8all.log
          grep -F "'BB6.Agent6D1NineOne.cover' depends on axioms: [propext, Classical.choice, Quot.sound]" .tmp/d9one.log
          grep -F "'BB6.Agent6D1SecondLevel93.cover_of_frontier' depends on axioms: [propext, Classical.choice, Quot.sound]" .tmp/d93.log
          grep -F "'BB6.Agent6D1SecondLevel93Bound.cover_of_frontier' depends on axioms: [propext, Classical.choice, Quot.sound]" .tmp/d93bound.log
          grep -F "'BB6.Agent6D1SecondLevel88OfParents.cover_of_frontier' depends on axioms: [propext, Classical.choice, Quot.sound]" .tmp/d88parents.log
          grep -F "'BB6.Agent6D1SecondLevel89.cover_of_frontier' depends on axioms: [propext, Classical.choice, Quot.sound]" .tmp/d89.log
          ! grep -Eq 'sorryAx|ofReduceBool' .tmp/d8five.log
          ! grep -Eq 'sorryAx|ofReduceBool' .tmp/d9four.log
          ! grep -Eq 'sorryAx|ofReduceBool' .tmp/d97.log
          ! grep -Eq 'sorryAx|ofReduceBool' .tmp/d8four.log
          ! grep -Eq 'sorryAx|ofReduceBool' .tmp/d96.log
          ! grep -Eq 'sorryAx|ofReduceBool' .tmp/d96bound.log
          ! grep -Eq 'sorryAx|ofReduceBool' .tmp/d8all.log
          ! grep -Eq 'sorryAx|ofReduceBool' .tmp/d9one.log
          ! grep -Eq 'sorryAx|ofReduceBool' .tmp/d93.log
          ! grep -Eq 'sorryAx|ofReduceBool' .tmp/d93bound.log
          ! grep -Eq 'sorryAx|ofReduceBool' .tmp/d88parents.log
          ! grep -Eq 'sorryAx|ofReduceBool' .tmp/d89.log
      - uses: actions/upload-artifact@v4
        with:
          name: agent6-raw139-d1-89-d8-parent-checked
          path: |
            .tmp/d8five.log
            .tmp/d9four.log
            .tmp/d97.log
            .tmp/d8four.log
            .tmp/d96.log
            .tmp/d96bound.log
            .tmp/d8all.log
            .tmp/d9one.log
            .tmp/d93.log
            .tmp/d93bound.log
            .tmp/d88parents.log
            .tmp/d89.log
            .tmp/map/a6-reductions/build/D1EightFive.olean
            .tmp/map/a6-reductions/build/D1NineFour.olean
            .tmp/map/a6-reductions/build/D1SecondLevel97.olean
            .tmp/map/a6-reductions/build/D1EightFour.olean
            .tmp/map/a6-reductions/build/D1SecondLevel96.olean
            .tmp/map/a6-reductions/build/D1SecondLevel96Bound.olean
            .tmp/map/a6-reductions/build/D1EightAll.olean
            .tmp/map/a6-reductions/build/D1NineOne.olean
            .tmp/map/a6-reductions/build/D1SecondLevel93.olean
            .tmp/map/a6-reductions/build/D1SecondLevel93Bound.olean
            .tmp/map/a6-reductions/build/D1SecondLevel88OfParents.olean
            .tmp/map/a6-reductions/build/D1SecondLevel89.olean
          retention-days: 14
