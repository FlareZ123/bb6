name: Agent 6 final tree126 sweep proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source closure
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          python tools/lean_compile_closure.py --workdir /tmp/a6-final126 --jobs 4 im-results/agent6-final126/Final126.lean | tee /tmp/final126.log
          if grep -qE 'sorryAx|native_decide' /tmp/final126.log; then exit 1; fi
