name: Agent6 Raw139 D0=9 remaining exact children (manual)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Pinned source commit
        type: string
        required: true
      core_run_id:
        description: Run containing agent6-raw139-d9-core
        type: string
        required: true
      child_code:
        description: Only run the selected D0=9 action code
        type: choice
        options: ['16', '17', '18', '19']
        default: '17'
        required: true
      diagnostic_only:
        description: Inspect problematic proof modules without executing the full kernel bank
        type: boolean
        default: false
permissions:
  contents: read
  actions: read

jobs:
  branch:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      CODE: ${{ inputs.child_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d9-core
          run-id: ${{ inputs.core_run_id }}
          github-token: ${{ github.token }}
          path: .tmp/a6-d9rest
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate exact D0=9 branch
        run: |
          set -euo pipefail
          work=.tmp/a6-d9rest
          pipe="$work/pipeline"
          chmod +x "$pipe/cert_census" "$pipe/strong" "$pipe/strong_emit" "$pipe/altblock"
          root="$work/d9c$CODE"
          ns="D9C$CODE"
          python3 "$pipe/discover.py" 9 "$CODE" "$root"
          python3 "$pipe/emit_lean.py" "$root/certs.jsonl" "$root/src" 2 "$ns"
          python3 - "$root/certs.jsonl" "$root/alt.in" <<'PY'
          import json,sys
          src,dst=sys.argv[1:]
          with open(dst,'w') as out:
              for line in open(src):
                  c=json.loads(line)
                  if c.get("type")=="ng" and len(c.get("states",[]))>1000:
                      out.write(str(c["id"])+" "+",".join(map(str,c["p"]))+"\n")
          PY
          if test -s "$root/alt.in"; then
            "$pipe/altblock" "$root/alt.in" > "$root/alt.out"
            "$pipe/strong_emit" "$root/alt.out" > "$root/alt.jsonl"
            python3 "$pipe/replace_alt.py" "$root" "$ns"
          else
            : > "$root/alt.out"
            : > "$root/alt.jsonl"
          fi
          python3 "$pipe/gen_tree_general.py" "$root/tree-9-$CODE.txt" "$root/src" 384 9 "$CODE" 8 "$root/late.json"
          python3 "$pipe/group_chunks.py" "$root/src" "$ns" 4
          cp "$pipe/D1PackedTree.lean" "$pipe/D1QuickTree.lean" "$pipe/D1TreeTools.lean" "$root/src/"
      - name: Diagnose generated C17 bank pressure
        if: ${{ inputs.diagnostic_only }}
        run: |
          set -euo pipefail
          root=".tmp/a6-d9rest/d9c$CODE"
          echo "Largest Lean modules"
          find "$root/src" -maxdepth 1 -name '*.lean' -printf '%s %f\n' | sort -nr | head -n 18
          echo "Bank module sizes and declarations"
          for n in 16 17 18 29 30 31 32; do
            f="$root/src/D9C${CODE}Bank$(printf '%03d' "$n").lean"
            if test -f "$f"; then
              wc -lc "$f"
              grep -E '^(def|theorem|private theorem|namespace)' "$f" | head -n 5 || true
            fi
          done
          echo "Group generator and compiler scheduler"
          sed -n '1,130p' ".tmp/a6-d9rest/pipeline/group_chunks.py"
          sed -n '1,190p' ".tmp/a6-d9rest/pipeline/compile_groups.py"
      - name: Kernel-check complete child Cover
        if: ${{ !inputs.diagnostic_only }}
        run: |
          set -euo pipefail
          work=.tmp/a6-d9rest
          export LEAN="$HOME/.elan/bin/lean"
          export JOBS=1
          root_abs="$(realpath "$work")"
          core_abs="$(realpath "$work/core")"
          python3 "$work/pipeline/compile_groups.py" "$root_abs" "$core_abs" "D9C$CODE" | tee "$work/d9c$CODE/compile.log"
          grep -F "FINAL" "$work/d9c$CODE/compile.log"
          grep -F " 0 []" "$work/d9c$CODE/compile.log"
          grep -F "'D9C$CODE.cover' depends on axioms: [propext, Classical.choice, Quot.sound]" "$work/d9c$CODE/src/logs/D9C${CODE}Parent.log"
          ! grep -REq 'sorryAx|ofReduceBool' "$work/d9c$CODE/src/logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent6-raw139-d9-c${{ inputs.child_code }}-certified
          path: |
            .tmp/a6-d9rest/d9c${{ inputs.child_code }}/src
            .tmp/a6-d9rest/d9c${{ inputs.child_code }}/compile.log
            .tmp/a6-d9rest/d9c${{ inputs.child_code }}/census.log
            .tmp/a6-d9rest/d9c${{ inputs.child_code }}/recipes.tsv
            .tmp/a6-d9rest/d9c${{ inputs.child_code }}/alt.out
          include-hidden-files: true
          retention-days: 14
