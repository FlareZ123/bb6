name: Agent6 Raw139 D1=0RD D0=9 exact parent (manual)
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Pinned source commit
        type: string
        required: true
permissions:
  contents: read
  actions: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reconstruct pipeline and certify shared kernel core
        run: |
          set -euo pipefail
          work=.tmp/a6-d9
          pipe="$work/pipeline"
          core="$work/core"
          mkdir -p "$pipe" "$core"
          cat im-results/agent6-raw139-d1-zeroRD/d9-pipeline/source.b64.0* | base64 -d > /tmp/d9-source.tar.xz
          tar -xJf /tmp/d9-source.tar.xz -C "$pipe"
          base64 -d im-results/agent6-raw139-d1-zeroRD/strong.cpp.xz.b64 | xz -d > "$pipe/strong.cpp"
          mkdir -p "$pipe/late"
          base64 -d im-results/agent6-raw139-d1-zeroRD/late-source.tar.xz.b64 | tar -xJf - -C "$pipe/late"
          cp im-results/agent6-raw139-d1-zeroRD/d9-pipeline/altblock.cpp "$pipe/"
          cp im-results/agent6-raw139-d1-zeroRD/d9-pipeline/replace_alt.py "$pipe/"
          g++ -O3 -std=c++17 "$pipe/cert_census.cpp" -o "$pipe/cert_census"
          g++ -O3 -std=c++17 "$pipe/strong.cpp" -o "$pipe/strong"
          g++ -O3 -std=c++17 "$pipe/strong_emit.cpp" -o "$pipe/strong_emit"
          g++ -O3 -std=c++17 "$pipe/altblock.cpp" -o "$pipe/altblock"
          python3 im-results/agent13-coverage/unpack.py
          python3 im-results/agent13-block-far/specialize.py 4
          python3 "$pipe/late/certify_late.py" --roots "$pipe/late/lateRoots.tsv" --children "$pipe/late/lateChildren.tsv" --out "$pipe/D1Late.lean"
          python3 tools/lean_compile_closure.py "$pipe/D1PackedTree.lean" "$pipe/D1Late.lean"             --source-root "$pipe" --workdir /tmp/a6-d9-core --jobs 2             --manifest "$work/core.json" --label agent6-raw139-d9-core | tee "$work/core.log"
          ! grep -Eq 'sorryAx|ofReduceBool' "$work/core.log"
          find /tmp/a6-d9-core -name '*.olean' -exec cp '{}' "$core/" ';'
          test -f "$core/D1PackedTree.olean"
          test -f "$core/D1Late.olean"
      - uses: actions/upload-artifact@v4
        with:
          name: agent6-raw139-d9-core
          path: .tmp/a6-d9
          include-hidden-files: true
          retention-days: 14

  branch:
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        code: [2, 6, 16, 17, 18, 19]
    env:
      CODE: ${{ matrix.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d9-core
          path: .tmp/a6-d9
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate exact branch and replace oversized n-grams
        run: |
          set -euo pipefail
          work=.tmp/a6-d9
          pipe="$work/pipeline"
          root="$work/d9c$CODE"
          ns="D9C$CODE"
          python3 "$pipe/discover.py" 9 "$CODE" "$root"
          python3 "$pipe/emit_lean.py" "$root/certs.jsonl" "$root/src" 8 "$ns"
          python3 - "$root/certs.jsonl" "$root/alt.in" <<'PY'
          import json,sys
          src,dst=sys.argv[1:]
          with open(dst,'w') as out:
              for line in open(src):
                  c=json.loads(line)
                  if c.get("type")=="ng" and len(c.get("states",[]))>1000:
                      out.write(str(c["id"])+" "+",".join(map(str,c["p"]))+"\n")
          PY
          if test -s "$root/alt.in"; then
            "$pipe/altblock" "$root/alt.in" > "$root/alt.out"
            "$pipe/strong_emit" "$root/alt.out" > "$root/alt.jsonl"
            python3 "$pipe/replace_alt.py" "$root" "$ns"
          else
            : > "$root/alt.jsonl"
          fi
          python3 "$pipe/gen_tree_general.py" "$root/tree-9-$CODE.txt" "$root/src" 384 9 "$CODE" 8 "$root/late.json"
          python3 "$pipe/group_chunks.py" "$root/src" "$ns" 8
          cp "$pipe/D1PackedTree.lean" "$pipe/D1QuickTree.lean" "$pipe/D1TreeTools.lean" "$root/src/"
      - name: Kernel-check complete child Cover
        run: |
          set -euo pipefail
          work=.tmp/a6-d9
          export LEAN="$HOME/.elan/bin/lean"
          export JOBS=2
          python3 "$work/pipeline/compile_groups.py" "$work" "$work/core" "D9C$CODE" | tee "$work/d9c$CODE/compile.log"
          grep -F "FINAL" "$work/d9c$CODE/compile.log"
          grep -F " 0 []" "$work/d9c$CODE/compile.log"
          grep -F "'D9C$CODE.cover' depends on axioms: [propext, Classical.choice, Quot.sound]" "$work/d9c$CODE/src/logs/D9C$CODEParent.log"
          ! grep -REq 'sorryAx|ofReduceBool' "$work/d9c$CODE/src/logs"
      - uses: actions/upload-artifact@v4
        with:
          name: agent6-raw139-d9-c${{ matrix.code }}-certified
          path: |
            .tmp/a6-d9/d9c${{ matrix.code }}/src
            .tmp/a6-d9/d9c${{ matrix.code }}/compile.log
            .tmp/a6-d9/d9c${{ matrix.code }}/census.log
            .tmp/a6-d9/d9c${{ matrix.code }}/recipes.tsv
            .tmp/a6-d9/d9c${{ matrix.code }}/alt.out
          include-hidden-files: true
          retention-days: 14

  compose:
    needs: branch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: agent6-raw139-d9-core
          path: .tmp/a6-d9
      - uses: actions/download-artifact@v4
        with:
          pattern: agent6-raw139-d9-c*-certified
          path: .tmp/a6-d9/branches
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compose and source-check D0=9 parent
        run: |
          set -euo pipefail
          work=.tmp/a6-d9
          merged="$work/merged"
          mkdir -p "$merged"
          find "$work/core" -name '*.olean' -exec cp '{}' "$merged/" ';'
          find "$work/branches" -name '*.olean' -exec cp '{}' "$merged/" ';'
          cp "$work/pipeline/D1D9Parent.lean" "$merged/"
          (cd "$merged" && LEAN_PATH=. lean -o D1D9Parent.olean D1D9Parent.lean) | tee "$work/compose.log"
          grep -F "'BB6.Agent6D1D9.cover' depends on axioms: [propext, Classical.choice, Quot.sound]" "$work/compose.log"
          ! grep -Eq 'sorryAx|ofReduceBool' "$work/compose.log"
      - uses: actions/upload-artifact@v4
        with:
          name: agent6-raw139-d9-parent-certified
          path: |
            .tmp/a6-d9/compose.log
            .tmp/a6-d9/merged/D1D9Parent.lean
            .tmp/a6-d9/merged/D1D9Parent.olean
          include-hidden-files: true
          retention-days: 14
