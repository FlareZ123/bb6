          run-id: 45934672187
          github-token: ${{ github.token }}
          path: .tmp/a6-zeroRC/resume-cuts
      - name: Switch only unaccepted declarations to zipper traces
        id: plan
        run: |
          set -euo pipefail
          work=.tmp/a6-zeroRC
          git fetch --depth=1 origin "$RECOVERY_SHA"
          for script in resume.py zipresume.py; do
            git show "$RECOVERY_SHA:im-results/agent6-raw139-e0-zeroRC/$script" > "im-results/agent6-raw139-e0-zeroRC/$script"
          done
          git show "$RECOVERY_SHA:im-results/agent6-raw139-e0-oneLF/OneLFZipHybrid.lean" > "$work/imports/OneLFZipHybrid.lean"
          if [[ "${{ inputs.recovery_run_id }}" == 45934672187 ]]; then
            python3 im-results/agent6-raw139-e0-zeroRC/zipresume.py last "$work"
          else
            python3 im-results/agent6-raw139-e0-zeroRC/zipresume.py prepare "$work"
          fi
          echo "matrix=$(python3 -c 'import json;print(json.dumps({"root":json.load(open(".tmp/a6-zeroRC/zip-missing.json"))},separators=(",",":")))')" >> "$GITHUB_OUTPUT"
