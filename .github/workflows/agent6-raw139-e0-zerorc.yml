          python3 im-results/agent13-block-far/specialize.py 4
          python3 im-results/agent6-raw139-e0-zeroRC/repack.py .tmp/a6-zeroRC
      - name: Compile independent child covers
        id: compile_cut
        env:
          GROUP: ${{ matrix.group }}
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          work=.tmp/a6-zeroRC
          roots=()
          i=0
          while IFS= read -r module; do
            if [[ "$PART" == all ]] || (( i % 4 == PART )); then roots+=("$work/imports/$module.lean"); fi
            i=$((i+1))
          done < "$work/recovery-groups/$GROUP.txt"
          if (( ${#roots[@]} == 0 )); then
            echo "No roots in this subpart"
            exit 0
          fi
          echo "nonempty=true" >> "$GITHUB_OUTPUT"
