    needs: prepare-zeroRC-zipresume
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare-zeroRC-zipresume.outputs.matrix) }}
    env:
      RECOVERY_SHA: ${{ inputs.source_sha }}
      CUT_ROOT: ${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9dfb6abff540a4decf4c46f147393a3e89025034
      - name: Fetch pinned recovery source
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$RECOVERY_SHA"
          git show "$RECOVERY_SHA:im-results/agent6-raw139-e0-zeroRC/resume.py" > im-results/agent6-raw139-e0-zeroRC/resume.py
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: raw139-zeroRC-zipresume-plan
          path: .tmp/a6-zeroRC
      - name: Check one missing exact child and preserve dependency-closed partial work
        id: check
        run: |
          set -euo pipefail
          work=.tmp/a6-zeroRC
          dst="$work/resume-cut"
          build=/tmp/a6-zeroRC-resume
          mkdir -p "$dst"
          python3 im-results/agent13-coverage/unpack.py
          python3 im-results/agent13-block-far/specialize.py 4
          set +e
          timeout --kill-after=15s 180s python3 tools/lean_compile_closure.py "$work/imports/$CUT_ROOT.lean" --source-root "$work/imports" --precompiled-manifest "$work/resume-pool.json" --precompiled-dir "$work/resume-pool" --workdir "$build" --jobs 2 --manifest "$dst/manifest.json" --label "raw139-zeroRC-resume-$CUT_ROOT" | tee "$dst/log"
          rc=${PIPESTATUS[0]}
          set -e
          ! grep -Eq 'sorryAx|ofReduceBool' "$dst/log"
          if [[ "$rc" == 0 ]]; then
            complete=true
          else
            complete=false
            python3 tools/lean_compile_closure.py "$work/imports/$CUT_ROOT.lean" --source-root "$work/imports" --manifest-only --allow-missing-objects --artifact-dir "$build" --manifest "$dst/manifest.json" --label "raw139-zeroRC-resume-partial-$CUT_ROOT"
          fi
          python3 im-results/agent6-raw139-e0-zeroRC/resume.py collect "$work" "$build" "$dst" "$complete"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$RECOVERY_SHA" > "$dst/recovery-source-sha.txt"
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.complete == 'true'
        with:
          name: raw139-zeroRC-resume-${{ matrix.root }}
          path: .tmp/a6-zeroRC/resume-cut
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.complete == 'false'
        with:
          name: raw139-zeroRC-resume-partial-${{ matrix.root }}
          path: .tmp/a6-zeroRC/resume-cut
          include-hidden-files: true
          retention-days: 14
      - name: Fail closed unless the exact child completed
        if: always()
        run: test "${{ steps.check.outputs.complete }}" = true

