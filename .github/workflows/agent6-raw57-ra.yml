name: Agent 6 raw57 A1 0RA complete child audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source closure
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          python im-results/agent6-raw57-ra/generate.py
          python tools/lean_compile_closure.py --workdir /tmp/a6-raw57-ra --jobs 4 im-results/agent6-raw57-ra/Raw57RAData.lean | tee /tmp/raw57.log
          if grep -qE 'sorryAx|native_decide' /tmp/raw57.log; then exit 1; fi
