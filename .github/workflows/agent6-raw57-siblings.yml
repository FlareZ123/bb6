          python emit_symbolic.py E10RD E11LC
          python emit_multi.py
          python emit_grammar.py
          python m19569_certificate.py --write M19569.json
          python emit_run_stack.py M19569.json
          python generate_m5334.py > Raw56LCM5334.lean
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw56-pilot-generated-source
          path: /tmp/raw56-pilot
          if-no-files-found: error


