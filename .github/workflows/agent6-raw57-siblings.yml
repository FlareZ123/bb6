          echo 'bd70d009d0ca78be4eabe4efb47e4fed93a81c9dee56b999bc7ce7491d61d167  /tmp/reparent.tar.xz' | sha256sum -c -
          echo '7511d777aac6b8b98beb351584c90ee4744a79ca232b7bb4f1b6ac2f09c56523  /tmp/pilot.tar.xz' | sha256sum -c -
          tar -xJf /tmp/reparent.tar.xz -C /tmp/raw56-pilot
          tar -xJf /tmp/pilot.tar.xz -C /tmp/raw56-pilot
          cp "$P"/{RunStack.lean,emit_run_stack.py,m19569_certificate.py,Raw56LCM20376.lean,generate_m5334.py} /tmp/raw56-pilot/
          cp "$R"/{minimize_cert.py,apply_compression.py} /tmp/raw56-pilot/
