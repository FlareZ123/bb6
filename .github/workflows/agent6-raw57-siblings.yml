name: Agent 6 raw57 sibling child audits
run-name: Raw57 A1=${{ inputs.child }}
on:
  workflow_dispatch:
    inputs:
      child:
        description: A1 transition
        type: string
        default: 0RB
      source_run_id:
        description: Prior successful Raw56 E1=0RE run ID for root-consumer artifact reuse
        type: string
        default: ''
permissions:
  actions: read
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.child == 'parent-all' || inputs.child == 'raw56-e1-0re') && 360 || 60 }}
    steps:
      - uses: actions/checkout@v4
      - name: Download source-accepted Raw56 E1=0RE closure
        if: inputs.child == 'raw56-root-consumer' && inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: raw56-e1-0re-source-accepted
          path: ${{ github.workspace }}/raw56-e1-0re-source-accepted
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
      - name: Verify exact source closure
        env:
          CHILD: ${{ inputs.child }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [[ "$CHILD" == discover-1LA ]]; then
            python im-results/agent1-raw57/discover_1la.py
            exit 0
          fi
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          DIR=im-results/agent6-raw57-ra
          if [[ "$CHILD" == raw56-root-cut ]]; then
            DIR=im-results/agent1-raw56
            ROOT=Raw56RootCut
          elif [[ "$CHILD" == raw56-root-consumer ]]; then
            if [[ -z "$SOURCE_RUN_ID" ]]; then echo 'source_run_id is required' >&2; exit 1; fi
            python im-results/agent1-raw56/prepare.py
            DIR=im-results/agent1-raw56
            ROOT=Raw56RootConsumer
          elif [[ "$CHILD" == raw56-e1-0re ]]; then
            python im-results/agent1-raw56/prepare.py
            DIR=im-results/agent1-raw56/generated
            ROOT=Raw56E1REAll
          elif [[ "$CHILD" == parent-three ]]; then
            python im-results/agent6-raw57-ra/generate.py
            for C in 0RB 0RC 1RB 1RC 1RE 0RE 0RF 1LC; do
              python im-results/agent6-raw57-ra/generate_sibling.py "$C"
            done
            for C in 0LB 0LC 0LD 1RA 1RF 1LA 1LE; do
              python im-results/agent1-raw57/generate_sibling.py "$C"
            done
            DIR=im-results/agent1-raw57
            ROOT=Raw57ParentConsumerWithLALE
          elif [[ "$CHILD" == parent-all ]]; then
            python im-results/agent6-raw57-ra/generate.py
            for C in 0RB 0RC 1RB 1RC 1RE 0RE 0RF 1LC; do
              python im-results/agent6-raw57-ra/generate_sibling.py "$C"
            done
            for C in 0LB 0LC 0LD 1RA 1RF 1LA 1LE 1LB 0LF 1LF; do
              if [[ "$C" == "1LF" ]]; then python im-results/agent1-raw57/m882885_certificate.py; fi
              python im-results/agent1-raw57/generate_sibling.py "$C"
            done
            DIR=im-results/agent1-raw57
            ROOT=Raw57ParentComplete
          elif [[ "$CHILD" == m211 ]]; then
            DIR=im-results/agent1-raw57
            python "$DIR/m211_emit_lean.py"
            ROOT=Raw57LB1M211
          elif [[ "$CHILD" == m968 ]]; then
            DIR=im-results/agent1-raw57
            python "$DIR/prefix3_emit.py" Raw57LF0M968 prefix3-M968.json
            ROOT=Raw57LF0M968
          elif [[ "$CHILD" == bridge ]]; then
            DIR=im-results/agent1-raw57
            ROOT=Raw57ParentBridge
          elif [[ "$CHILD" == 1LF || "$CHILD" == 0LF || "$CHILD" == 1LE || "$CHILD" == 1LB || "$CHILD" == 1LA || "$CHILD" == 1RF || "$CHILD" == 0LB || "$CHILD" == 1RA || "$CHILD" == 0LD || "$CHILD" == 0LC ]]; then
            DIR=im-results/agent1-raw57
            if [[ "$CHILD" == "1LF" ]]; then python "$DIR/m882885_certificate.py"; fi
            python "$DIR/generate_sibling.py" "$CHILD"
            ROOT="Raw57${CHILD:1}${CHILD:0:1}Data"
          elif [[ "$CHILD" == easy ]]; then
            ROOT=Raw57Easy
          else
            python im-results/agent6-raw57-ra/generate_sibling.py "$CHILD"
            ROOT="Raw57${CHILD:1}${CHILD:0:1}Data"
          fi
          WORKDIR=/tmp/a6-raw57-sibling
          if [[ "$CHILD" == parent-three ]]; then WORKDIR=/tmp/a1-raw57-parent-three; fi
          if [[ "$CHILD" == parent-all ]]; then WORKDIR=/tmp/a1-raw57-parent-all; fi
          if [[ "$CHILD" == raw56-root-consumer ]]; then
            WORKDIR=/tmp/a1-raw56-root-consumer
            PRECOMPILED="$GITHUB_WORKSPACE/raw56-e1-0re-source-accepted"
            python tools/lean_compile_closure.py --workdir "$WORKDIR" --jobs 4 \
              --precompiled-manifest "$PRECOMPILED/manifest.json" --precompiled-dir "$PRECOMPILED" \
              --manifest "$WORKDIR/manifest.json" --label raw56-root-frontier \
              --theorem BB6.Agent1Raw56Root.sound19_closed --weighted-bound 7014 \
              --parent-table '1RB---_1RC---_0RD---_1LD1LE_------_------' \
              --artifact-name raw56-root-frontier-source-accepted \
              --provenance-input im-results/agent1-raw56/candidates.json \
              --provenance-input im-results/agent1-raw56/prepare.py \
              --provenance-input im-results/agent1-raw56/Raw56RootCut.lean \
              --provenance-input im-results/agent1-raw56/Raw56RootConsumer.lean \
              "$DIR/$ROOT.lean" | tee /tmp/raw56-root.log
            LOG=/tmp/raw56-root.log
          elif [[ "$CHILD" == raw56-e1-0re ]]; then
            WORKDIR=/tmp/a1-raw56-e1-0re
            python tools/lean_compile_closure.py --workdir "$WORKDIR" --jobs 4 \
              --manifest "$WORKDIR/manifest.json" --label raw56-e1-0re \
              --theorem BB6.Agent1Raw56.Raw56E1RE.all_quotient --weighted-bound 7014 \
              --parent-table '1RB---_1RC---_0RD---_1LD1LE_---0RE_------' \
              --artifact-name raw56-e1-0re-source-accepted \
              --provenance-input im-results/agent1-raw56/candidates.json \
              --provenance-input im-results/agent1-raw56/prepare.py \
              "$DIR/$ROOT.lean" | tee /tmp/raw57.log
            LOG=/tmp/raw57.log
          else
            python tools/lean_compile_closure.py --workdir "$WORKDIR" --jobs 4 "$DIR/$ROOT.lean" | tee /tmp/raw57.log
            LOG=/tmp/raw57.log
          fi
          if grep -qE 'sorryAx|native_decide' "$LOG"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always() && inputs.child == 'discover-1LA'
        with:
          name: raw57-1la-discovery
          path: im-results/agent1-raw57/generated-1LA/discovery.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success() && inputs.child == 'raw56-root-consumer'
        with:
          name: raw56-root-frontier-source-accepted
          path: |
            /tmp/a1-raw56-root-consumer/*.olean
            /tmp/a1-raw56-root-consumer/manifest.json
            /tmp/raw56-root.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success() && inputs.child == 'raw56-e1-0re'
        with:
          name: raw56-e1-0re-source-accepted
          path: |
            /tmp/a1-raw56-e1-0re/*.olean
            /tmp/a1-raw56-e1-0re/manifest.json
            /tmp/raw57.log
          if-no-files-found: error
