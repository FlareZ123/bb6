name: Agent 6 raw57 sibling child audits
run-name: Raw57 A1=${{ inputs.child }}
on:
  workflow_dispatch:
    inputs:
      child:
        description: A1 transition
        type: string
        default: 0RB
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.child == 'parent-all' && 120 || 60 }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source closure
        env:
          CHILD: ${{ inputs.child }}
        run: |
          set -euo pipefail
          if [[ "$CHILD" == discover-1LA ]]; then
            python im-results/agent1-raw57/discover_1la.py
            exit 0
          fi
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          DIR=im-results/agent6-raw57-ra
          if [[ "$CHILD" == parent-three ]]; then
            python im-results/agent6-raw57-ra/generate.py
            for C in 0RB 0RC 1RB 1RC 1RE 0RE 0RF 1LC; do
              python im-results/agent6-raw57-ra/generate_sibling.py "$C"
            done
            for C in 0LB 0LC 0LD 1RA 1RF 1LA 1LE; do
              python im-results/agent1-raw57/generate_sibling.py "$C"
            done
            DIR=im-results/agent1-raw57
            ROOT=Raw57ParentConsumerWithLALE
          elif [[ "$CHILD" == parent-all ]]; then
            python im-results/agent6-raw57-ra/generate.py
            for C in 0RB 0RC 1RB 1RC 1RE 0RE 0RF 1LC; do
              python im-results/agent6-raw57-ra/generate_sibling.py "$C"
            done
            for C in 0LB 0LC 0LD 1RA 1RF 1LA 1LE 1LB 0LF 1LF; do
              if [[ "$C" == "1LF" ]]; then python im-results/agent1-raw57/m882885_certificate.py; fi
              python im-results/agent1-raw57/generate_sibling.py "$C"
            done
            DIR=im-results/agent1-raw57
            ROOT=Raw57ParentComplete
          elif [[ "$CHILD" == m211 ]]; then
            DIR=im-results/agent1-raw57
            python "$DIR/m211_emit_lean.py"
            ROOT=Raw57LB1M211
          elif [[ "$CHILD" == m968 ]]; then
            DIR=im-results/agent1-raw57
            python "$DIR/prefix3_emit.py" Raw57LF0M968 prefix3-M968.json
            ROOT=Raw57LF0M968
          elif [[ "$CHILD" == bridge ]]; then
            DIR=im-results/agent1-raw57
            ROOT=Raw57ParentBridge
          elif [[ "$CHILD" == 1LF || "$CHILD" == 0LF || "$CHILD" == 1LE || "$CHILD" == 1LB || "$CHILD" == 1LA || "$CHILD" == 1RF || "$CHILD" == 0LB || "$CHILD" == 1RA || "$CHILD" == 0LD || "$CHILD" == 0LC ]]; then
            DIR=im-results/agent1-raw57
            if [[ "$CHILD" == "1LF" ]]; then python "$DIR/m882885_certificate.py"; fi
            python "$DIR/generate_sibling.py" "$CHILD"
            ROOT="Raw57${CHILD:1}${CHILD:0:1}Data"
          elif [[ "$CHILD" == easy ]]; then
            ROOT=Raw57Easy
          else
            python im-results/agent6-raw57-ra/generate_sibling.py "$CHILD"
            ROOT="Raw57${CHILD:1}${CHILD:0:1}Data"
          fi
          WORKDIR=/tmp/a6-raw57-sibling
          if [[ "$CHILD" == parent-three ]]; then WORKDIR=/tmp/a1-raw57-parent-three; fi
          if [[ "$CHILD" == parent-all ]]; then WORKDIR=/tmp/a1-raw57-parent-all; fi
          python tools/lean_compile_closure.py --workdir "$WORKDIR" --jobs 4 "$DIR/$ROOT.lean" | tee /tmp/raw57.log
          if grep -qE 'sorryAx|native_decide' /tmp/raw57.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always() && inputs.child == 'discover-1LA'
        with:
          name: raw57-1la-discovery
          path: im-results/agent1-raw57/generated-1LA/discovery.json
          if-no-files-found: ignore
