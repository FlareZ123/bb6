name: Agent 6 raw57 sibling child audits
run-name: Raw57 A1=${{ inputs.child }}
on:
  workflow_dispatch:
    inputs:
      child:
        description: A1 transition
        type: string
        default: 0RB
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source closure
        env:
          CHILD: ${{ inputs.child }}
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
          DIR=im-results/agent6-raw57-ra
          if [[ "$CHILD" == bridge ]]; then
            DIR=im-results/agent1-raw57
            ROOT=Raw57ParentBridge
          elif [[ "$CHILD" == 1RF || "$CHILD" == 0LB || "$CHILD" == 1RA || "$CHILD" == 0LD || "$CHILD" == 0LC ]]; then
            DIR=im-results/agent1-raw57
            python "$DIR/generate_sibling.py" "$CHILD"
            ROOT="Raw57${CHILD:1}${CHILD:0:1}Data"
          elif [[ "$CHILD" == easy ]]; then
            ROOT=Raw57Easy
          else
            python im-results/agent6-raw57-ra/generate_sibling.py "$CHILD"
            ROOT="Raw57${CHILD:1}${CHILD:0:1}Data"
          fi
          python tools/lean_compile_closure.py --workdir /tmp/a6-raw57-sibling --jobs 4 "$DIR/$ROOT.lean" | tee /tmp/raw57.log
          if grep -qE 'sorryAx|native_decide' /tmp/raw57.log; then exit 1; fi
