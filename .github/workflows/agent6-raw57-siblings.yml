          lean -o /tmp/raw56-le23011/Raw56LE23011F0RA.olean /tmp/raw56-le23011/Raw56LE23011F0RA.lean 2>&1 | tee /tmp/raw56-le23011/leaf.log
          lean -o /tmp/raw56-le23011/Raw56LE23011Cover.olean /tmp/raw56-le23011/Raw56LE23011Cover.lean 2>&1 | tee /tmp/raw56-le23011/cover.log
