name: Agent 7 #746 n=887 even-cone source audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  even-cone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            if curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh &&
               sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2; then
              echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Compile exact original-source reset-parent dependencies and 1,319-state cone
        run: |
          set -eu
          a="im-results/agent7-cascade-odd-fibers"
          b="im-results/agent10-cascade"
          f="im-results/agent7-cascade-forward"
          c="im-results/agent44-746-fanin"
          e="im-results/agent7-746-even-parent"
          export LEAN_PATH="$a:$b:$f:$c:im-results/agent44-746-rank:$e"
          lean --version
          for m in SourceMacro CascadeOdd ReverseResidue GapCore Mass; do
            lean -o "$a/$m.olean" "$a/$m.lean"
          done
          lean -o "$b/FirstReturnCore.olean" "$b/FirstReturnCore.lean"
          lean -o "$a/LowGates.olean" "$a/LowGates.lean"
          lean -o "$a/SurvivingSmall.olean" "$a/SurvivingSmall.lean"
          lean -o "$a/WellInverseCases.olean" "$a/WellInverseCases.lean"
          lean -o "$a/PreimageCandidates.olean" "$a/PreimageCandidates.lean"
          for m in TerminalExit GapOddJoin SweepInvariant RootTerminal ResetAncestry FatalExclusion SmallFatal GateNecessary ExactGate; do
            lean -o "$b/$m.olean" "$b/$m.lean"
          done
          for m in ValuationDrain FullReturn ReturnInverseArithmetic ResetInverseWitnesses FirstOutcome FirstInverseComplete ResetChain ResetParentStrict ManyShield FastShield ParentsFast ClosedCertFast; do
            lean -o "$b/$m.olean" "$b/$m.lean"
          done
          lean -o "$e/EvenPre887ConeOnly.olean" "$e/EvenPre887ConeOnly.lean"
          echo "PASS: exact source ResetParent closure excludes the n=887 even fatal predecessor"
