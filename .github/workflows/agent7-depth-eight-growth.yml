name: Agent 7 depth-eight sibling closure
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  growth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate and kernel-check complete sibling closure
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          python im-results/agent13-coverage/unpack.py
          python im-results/agent7-far/generate_growth17.py
          python tools/lean_compile_closure.py --workdir /tmp/a7-growth --jobs 4 im-results/agent7-far/DepthEightGrowthClosure.lean | tee /tmp/a7-growth.log
          if grep -qE 'sorryAx|native_decide' /tmp/a7-growth.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: depth-eight-closed
          path: /tmp/a7-growth/
          retention-days: 3
