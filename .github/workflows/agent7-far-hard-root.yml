name: Agent 7 hard-root FAR search
on:
  workflow_dispatch:
    inputs:
      batch_only:
        description: Verify the archived depth-eight batch without new search
        type: boolean
        default: false
      samples:
        description: Guided mutation trials per DFA size and orientation
        type: number
        default: 3000
      max_dfa:
        description: Maximum DFA size (5-10)
        type: number
        default: 8
      solver_line:
        description: Optional 1-based roster line for SMT synthesis (0 disables)
        type: number
        default: 0
      solver_max_dfa:
        description: Maximum DFA size for SMT synthesis (1-10)
        type: number
        default: 7
      solver_min_dfa:
        description: Minimum DFA size for composed SMT synthesis (1-10)
        type: number
        default: 6
      solver_timeout_ms:
        description: Z3 timeout per DFA size and orientation
        type: number
        default: 120000
      solver_encoding:
        description: SMT encoding for FAR composition constraints
        type: choice
        options: ["implications", "compose"]
        default: compose
      solver_code:
        description: Optional explicit 12-slot partial table; overrides solver_line
        type: string
        default: ""
permissions:
  contents: read
jobs:
  hard-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(inputs.batch_only && '[0]' || '[0,1,2,3,4,5,6,7]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate FAR candidates or solve one target by SMT
        if: ${{ !inputs.batch_only }}
        env:
          SOLVER_CODE: ${{ inputs.solver_code }}
        run: |
          set -euo pipefail
          g++ -O3 -std=c++17 -Wall -Wextra -Werror im-results/agent7-far/roster_far.cpp -o /tmp/roster_far
          SAMPLES="${{ inputs.samples }}"
          MAX_DFA="${{ inputs.max_dfa }}"
          SOLVER_LINE="${{ inputs.solver_line }}"
          SOLVER_MAX_DFA="${{ inputs.solver_max_dfa }}"
          SOLVER_MIN_DFA="${{ inputs.solver_min_dfa }}"
          SOLVER_TIMEOUT="${{ inputs.solver_timeout_ms }}"
          SOLVER_ENCODING="${{ inputs.solver_encoding }}"
          if [[ -n "$SOLVER_CODE" ]]; then
            printf '%s\n' "$SOLVER_CODE" > /tmp/solver-roster.txt
            SOLVER_ROSTER=/tmp/solver-roster.txt
            SOLVER_LINE=1
          else
            SOLVER_ROSTER=resources/BB6_holdouts_663_2026-10-16.txt
          fi
          [[ "$SAMPLES" =~ ^[0-9]+$ ]] && [[ "$MAX_DFA" =~ ^[0-9]+$ ]]
          [[ "$SOLVER_LINE" =~ ^[0-9]+$ ]] && [[ "$SOLVER_MAX_DFA" =~ ^[0-9]+$ ]] && [[ "$SOLVER_MIN_DFA" =~ ^[0-9]+$ ]] && [[ "$SOLVER_TIMEOUT" =~ ^[0-9]+$ ]]
          [[ "$SOLVER_MIN_DFA" -ge 1 && "$SOLVER_MIN_DFA" -le "$SOLVER_MAX_DFA" && "$SOLVER_MAX_DFA" -le 10 && "$SOLVER_TIMEOUT" -gt 0 ]]
          [[ "$SOLVER_ENCODING" == "implications" || "$SOLVER_ENCODING" == "compose" ]]
          : > /tmp/hits.txt
          if [[ "$SOLVER_LINE" -gt 0 ]]; then
            if [[ "$SOLVER_ENCODING" == "implications" ]]; then
              [[ "$SOLVER_MIN_DFA" -eq 6 && "$SOLVER_MAX_DFA" -ge 6 ]]
            fi
            TARGET_SHARD=$(( (SOLVER_LINE - 1) % 8 ))
            if [[ "${{ matrix.shard }}" -eq "$TARGET_SHARD" ]]; then
              python3 -m pip install --user --quiet z3-solver
              if [[ "$SOLVER_ENCODING" == "compose" ]]; then
                SMT_SCRIPT=im-results/agent7-far/far_smt_compose.py
              else
                SMT_SCRIPT=im-results/agent7-far/far_smt.py
              fi
              if [[ "$SOLVER_ENCODING" == "compose" ]]; then
                python3 "$SMT_SCRIPT" "$SOLVER_ROSTER" --line "$SOLVER_LINE" --min-dfa "$SOLVER_MIN_DFA" --max-dfa "$SOLVER_MAX_DFA" --timeout-ms "$SOLVER_TIMEOUT" > /tmp/far-smt.out 2> /tmp/far-smt.log
              else
                python3 "$SMT_SCRIPT" "$SOLVER_ROSTER" --line "$SOLVER_LINE" --max-dfa "$SOLVER_MAX_DFA" --timeout-ms "$SOLVER_TIMEOUT" > /tmp/far-smt.out 2> /tmp/far-smt.log
              fi
              cat /tmp/far-smt.log
              cat /tmp/far-smt.out | tee -a /tmp/hits.txt
            else
              echo "SMT target line $SOLVER_LINE belongs to shard $TARGET_SHARD; no target on this shard" >&2
            fi
          else
            /tmp/roster_far resources/BB6_holdouts_663_2026-10-16.txt ${{ matrix.shard }} 8 "$SAMPLES" "$MAX_DFA" | tee -a /tmp/hits.txt
          fi
      - name: Install Lean if there is a candidate
        if: ${{ !inputs.batch_only }}
        run: |
          if [[ -s /tmp/hits.txt ]]; then
            curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
            sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
            echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          fi
      - name: Independently check every hit against infinite-tape semantics
        if: ${{ !inputs.batch_only }}
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/hits.txt ]]; then echo 'No candidate found in this shard'; exit 0; fi
          python tools/lean_compile_closure.py --workdir /tmp/a7-hard --jobs 4 im-results/agent7-far/WeightedTNFBridge.lean
          export LEAN_PATH=/tmp/a7-hard
          node im-results/agent7-far/extract_depth_eight_residuals.js
          lean im-results/agent7-far/DepthEightFAR.lean | tee /tmp/depth-eight-far-proof.log
          if grep -qE 'sorryAx|native_decide' /tmp/depth-eight-far-proof.log; then echo 'Archived depth-eight FAR proof used a forbidden axiom'; exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          lines = ['import FastFAR', 'open BB6Coverage BB6Coverage.FAR', 'set_option maxRecDepth 100000', 'set_option maxHeartbeats 0']
          def arr(xs): return '[' + ','.join(map(str,xs)) + ']'
          for row in Path('/tmp/hits.txt').read_text().splitlines():
              words = row.split()
              assert words[0] == 'HIT'
              idx, code, d, rev = int(words[1]), words[2], int(words[3]), int(words[4])
              raw = code.replace('_','')
              p = [raw[i:i+3] for i in range(0,36,3)]
              ts = [24 if x=='---' else 4*(ord(x[2])-65)+2*int(x[0])+int(x[1]=='R') for x in p]
              dfa = list(map(int,words[6:6+2*d]))
              assert words[6+2*d]=='MASK'
              N=6*d+1
              masks=list(map(int,words[7+2*d:7+2*d+2*N]))
              assert words[7+2*d+2*N]=='Z'
              z=int(words[8+2*d+2*N])
              lines += [f'def p{idx} : PartialMachine := fromCodes {arr(ts)}',
                        f'def c{idx} : Data {d} := ⟨0,{arr(dfa)},{arr(masks[:N])},{arr(masks[N:])},{z}⟩']
              if rev:
                  lines += [f'theorem hard{idx} (m : Machine) (hm : compatible p{idx} m) : NeverHalts m :=',
                            f'  reflectNever m (c{idx}.sound (reflectPartial p{idx}) (c{idx}.fastValid_sound _ (by decide)) (reflectTable m) (reflectCompatible p{idx} m hm))']
              else:
                  lines += [f'theorem hard{idx} (m : Machine) (hm : compatible p{idx} m) : NeverHalts m :=',
                            f'  c{idx}.sound p{idx} (c{idx}.fastValid_sound _ (by decide)) m hm']
              lines += [f'#print axioms hard{idx}']
          Path('/tmp/a7-hard/Hits.lean').write_text('\n'.join(lines)+'\n')
          PY
          lean /tmp/a7-hard/Hits.lean | tee /tmp/hit-proof.log
          if grep -qE 'sorryAx|native_decide' /tmp/hit-proof.log; then exit 1; fi
          cat /tmp/hits.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Compile archived depth-eight batch
        if: ${{ inputs.batch_only }}
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          export PATH="$HOME/.elan/bin:$PATH"
          python tools/lean_compile_closure.py --workdir /tmp/a7-hard --jobs 4 im-results/agent7-far/DepthEightBatch.lean | tee /tmp/batch-proof.log
          if grep -qE 'sorryAx|native_decide' /tmp/batch-proof.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: far-hard-shard-${{ matrix.shard }}
          path: |
            /tmp/batch-proof.log
            /tmp/hits.txt
            /tmp/a7-hard/Hits.lean
            /tmp/hit-proof.log
            /tmp/far-smt.out
            /tmp/far-smt.log
          if-no-files-found: warn
