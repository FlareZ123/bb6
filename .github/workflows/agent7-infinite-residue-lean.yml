name: Agent 7 infinite P1 residue theorem (Lean)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Verify all original prerequisites and infinite-family theorem
        run: |
          export LEAN_PATH="im-results/agent4-halting-funnel:im-results/agent7-rank-bounded"
          for m in HaltingFunnel EvenSector OddReturn Reachability BlankCriterion BlankInvariants NoFirstTarget NoSecondTarget; do
            lean -o "im-results/agent4-halting-funnel/$m.olean" "im-results/agent4-halting-funnel/$m.lean"
          done
          lean -o im-results/agent7-rank-bounded/InfiniteResidue.olean im-results/agent7-rank-bounded/InfiniteResidue.lean
          lean -o im-results/agent7-rank-bounded/InfiniteResidue2.olean im-results/agent7-rank-bounded/InfiniteResidue2.lean
          lean -o im-results/agent7-rank-bounded/InfiniteResidue3.olean im-results/agent7-rank-bounded/InfiniteResidue3.lean
          lean -o im-results/agent7-rank-bounded/InfiniteResidue4.olean im-results/agent7-rank-bounded/InfiniteResidue4.lean
          lean im-results/agent7-rank-bounded/InfiniteResidue5.lean
