name: Agent7 P1 sparse eight-times gateway (manual original-source Lean audit)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Source-compile all dependencies and all-parameter gateway theorem
        run: |
          set -e
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent50-p1-residue:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent7-even3-sparsity:im-results/agent7-rank-bounded"
          for m in GParity GInverse PosEvenForm ResetGate; do
            lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean"
          done
          lean -o im-results/agent1-p1-map/Packet.olean im-results/agent1-p1-map/Packet.lean
          lean -o im-results/agent7-rank-bounded/RankBase.olean im-results/agent7-rank-bounded/RankBase.lean
          for m in P1Triple P1ResidualArithmetic P1ResidualReach; do
            lean -o "im-results/agent50-p1-residue/$m.olean" "im-results/agent50-p1-residue/$m.lean"
          done
          lean -o im-results/agent47-p1-finite-inverse/P1FiniteInverse.olean im-results/agent47-p1-finite-inverse/P1FiniteInverse.lean
          lean -o im-results/agent47-p1-finite-inverse/P1InverseLog.olean im-results/agent47-p1-finite-inverse/P1InverseLog.lean
          lean -o im-results/agent1-p1-quarter/MassInverse.olean im-results/agent1-p1-quarter/MassInverse.lean
          lean -o im-results/agent1-p1-quarter/InverseIff.olean im-results/agent1-p1-quarter/InverseIff.lean
          lean -o im-results/agent7-even3-sparsity/EightThree.olean im-results/agent7-even3-sparsity/EightThree.lean
          lean -o im-results/agent7-even3-sparsity/EvenThreeFamily.olean im-results/agent7-even3-sparsity/EvenThreeFamily.lean
          lean -o im-results/agent7-even3-sparsity/EvenThreeIff.olean im-results/agent7-even3-sparsity/EvenThreeIff.lean
          lean -o im-results/agent7-even3-sparsity/RankBridge.olean im-results/agent7-even3-sparsity/RankBridge.lean
          lean -o im-results/agent7-even3-sparsity/NoSixteen.olean im-results/agent7-even3-sparsity/NoSixteen.lean
