name: Agent7 raw110 late trace
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw110-parent-cut
          run-id: 45593652030
          github-token: ${{ github.token }}
          path: /tmp/raw110-parent
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check traces and finish the parent
        shell: bash
        run: |
          set -euxo pipefail
          lean --version
          python im-results/agent13-coverage/unpack.py
          python im-results/agent7-raw110/gen_late_trace.py /tmp/raw110-generated --compressed
          python tools/lean_compile_closure.py --workdir /tmp/raw110-late --jobs 3 --source-root /tmp/raw110-generated im-results/agent7-raw110/Raw110LateCover.lean | tee /tmp/raw110-late.log
          if grep -qE 'sorryAx|native_decide' /tmp/raw110-late.log; then exit 1; fi
          python im-results/agent7-raw110/merge_late_proofs.py /tmp/raw110-parent /tmp/raw110-late "$PWD"
          cp im-results/agent7-raw110/Raw110ParentLateCover.lean /tmp/raw110-parent/
          cd /tmp/raw110-parent
          LEAN_PATH="$PWD" lean -o Raw110ParentLateCover.olean Raw110ParentLateCover.lean | tee /tmp/raw110-complete.log
          if grep -qE 'sorryAx|native_decide' /tmp/raw110-complete.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw110-word-final
          path: /tmp/raw110-late/*.olean
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: raw110-complete-parent
          path: /tmp/raw110-parent/
          if-no-files-found: error
          retention-days: 5
