name: Agent7 Raw36 0LB/0RE exact 902-step infinite drift
run-name: Raw36 single 902-step or D100 seven-source pump audit
on:
  workflow_dispatch:
    inputs:
      chunk:
        description: 'Finite initial 14958-step source proof segment length'
        type: choice
        options: ['100','180','240','300','500']
        default: '180'
      d100_batch:
        description: Check seven exact Raw36 D1=0LA opaque-tail pumps
        type: boolean
        default: false
      d100_mod_batch:
        description: Check source-indexed D100 modular/run-length certificates
        type: boolean
        default: false
      d100_mod_set:
        description: Five modular, six extra, ten phase, or two further phase certificates
        type: choice
        options: ['five','six','ten','two']
        default: 'five'
      d100_exposure_batch:
        description: Source-prove finite first-hole exposure for one-hole D100 holdouts
        type: boolean
        default: false
      d100_exposure_target:
        description: Exact one-hole literal exposure witness
        type: choice
        options: ['F0','B1']
        default: 'F0'
permissions:
  contents: read
jobs:
  source-audit:
    if: ${{ !inputs.d100_batch && !inputs.d100_mod_batch && !inputs.d100_exposure_batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - name: Generate exact blank-tape entry and universal opaque-tail pump
        run: |
          set -euo pipefail
          python im-results/agent7-raw36-direct/derive_drift.py \
            --out /tmp/a7-drift-source/Raw36D101Hard10.lean --chunk ${{ inputs.chunk }}
      - name: Compile full Lean source closure and audit accepted axioms
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py \
            --workdir /tmp/a7-drift-proof \
            --source-root /tmp/a7-drift-source \
            --jobs 2 --manifest /tmp/a7-drift-proof/manifest.json \
            --label 'raw36-direct01-hard0re-opaque902' \
            --theorem BB6.Agent7Raw36D101Hard10.never \
            --parent-table '1RB1LF_1RC0RE_0RD1RA_0LD0LB_1LF---_0LA1LC' \
            --artifact-name raw36-direct01-hard0re-902-proof \
            --provenance-input im-results/agent7-raw36-direct/derive_drift.py \
            /tmp/a7-drift-source/Raw36D101Hard10.lean \
            2>&1 | tee /tmp/a7-drift-audit.log
          python im-results/agent4-raw109/audit_axioms.py \
            /tmp/a7-drift-audit.log BB6.Agent7Raw36D101Hard10.never
          cp /tmp/a7-drift-audit.log /tmp/a7-drift-proof/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw36-direct01-hard0re-902-proof
          path: |
            /tmp/a7-drift-source/
            /tmp/a7-drift-proof/
            /tmp/a7-drift-audit.log
          if-no-files-found: warn
          retention-days: 60

  d100-batch:
    if: ${{ inputs.d100_batch && !inputs.d100_mod_batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw36-direct-D1-0-census
          run-id: 46122807180
          github-token: ${{ github.token }}
          path: /tmp/a7-d100-census
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - name: Generate source-indexed seven proofs from immutable exact literals
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip,hashlib,json,subprocess,sys
          from pathlib import Path
          got=json.loads(gzip.decompress(Path('/tmp/a7-d100-census/direct00.json.gz').read_bytes()))
          assert got['parent']=='1RB---_1RC---_0RD---_0LD0LA_------_------'
          keys=sorted(x.replace('_','') for x in got['opens'])
          assert len(keys)==2255
          assert hashlib.sha256('\n'.join(keys).encode()).hexdigest()=='d3cff2c1257272d8af4c8087906589d4623f41dcd8cd3de98e2ae7f71d8d8ff0'
          inp=Path('im-results/agent7-opaque-tail-pump/d100-new-pumps.txt')
          assert hashlib.sha256(inp.read_bytes()).hexdigest()=='59fcc7085f4eb499b75deba0a7752ae631c461ce1b5a17affe587528ce34c706'
          rows=inp.read_text().splitlines()
          assert len(rows)==len(set(rows))==7
          assert all(x.replace('_','') in keys for x in rows)
          dest=Path('/tmp/a7-d100-source'); dest.mkdir(parents=True,exist_ok=True)
          hdr='import SweepPumping\nset_option maxRecDepth 100000\nset_option maxHeartbeats 0\n'
          merged=hdr; theorem_names=[]
          for raw in rows:
              stem='Raw36D100P'+hashlib.sha256(raw.replace('_','').encode()).hexdigest()[:12]
              ns='BB6.Agent7'+stem
              path=dest/(stem+'.lean')
              subprocess.run([sys.executable,'im-results/agent7-opaque-tail-pump/pump_emit.py',raw,str(path),ns],check=True)
              src=path.read_text()
              assert src.startswith(hdr)
              merged+='\n'+src[len(hdr):]
              theorem_names.append(ns+'.never')
          (dest/'Raw36D100NewPumps.lean').write_text(merged)
          sha=hashlib.sha256(merged.encode()).hexdigest()
          assert sha=='3ba6cb6ae32b6b094a21116ee0f0a146e76142be6e3edcdfed889c1be063cfc3',sha
          (dest/'theorems.txt').write_text('\n'.join(theorem_names)+'\n')
          print('exact seven source proofs:',sha)
          PY
      - name: Compile complete original-source Lean closure and audit axioms
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py \
            --workdir /tmp/a7-d100-proof \
            --source-root /tmp/a7-d100-source --jobs 2 \
            --manifest /tmp/a7-d100-proof/manifest.json \
            --label raw36-d100-seven-opaque-pumps \
            --artifact-name raw36-d100-seven-source-accepted \
            --provenance-input im-results/agent7-opaque-tail-pump/detect_pump.py \
            --provenance-input im-results/agent7-opaque-tail-pump/pump_emit.py \
            --provenance-input im-results/agent7-opaque-tail-pump/d100-new-pumps.txt \
            /tmp/a7-d100-source/Raw36D100NewPumps.lean \
            2>&1 | tee /tmp/a7-d100-audit.log
          while IFS= read -r theorem; do
            python im-results/agent4-raw109/audit_axioms.py /tmp/a7-d100-audit.log "$theorem"
          done < /tmp/a7-d100-source/theorems.txt
          cp /tmp/a7-d100-audit.log /tmp/a7-d100-proof/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw36-d100-seven-source-accepted
          path: |
            /tmp/a7-d100-source/
            /tmp/a7-d100-proof/
            /tmp/a7-d100-audit.log
          if-no-files-found: warn
          retention-days: 60

  d100-modular:
    if: ${{ inputs.d100_mod_batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw36-direct-D1-0-census
          run-id: 46122807180
          github-token: ${{ github.token }}
          path: /tmp/a7-d100-census
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - name: Generate strict five-key active inverse-stack certificates
        run: |
          set -euo pipefail
          python im-results/agent7-opaque-tail-pump/emit_modular.py \
            /tmp/a7-d100-census/direct00.json.gz /tmp/a7-d100-mod ${{ inputs.d100_mod_set }}
      - name: Kernel-check original TwoSidedAutomata source and five theorems
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py \
            --workdir /tmp/a7-d100-mod-proof \
            --source-root /tmp/a7-d100-mod --jobs 2 \
            --manifest /tmp/a7-d100-mod-proof/manifest.json \
            --label raw36-d100-modular-stack-quotients-${{ inputs.d100_mod_set }} \
            --artifact-name raw36-d100-modular-${{ inputs.d100_mod_set }}-source \
            --provenance-input im-results/agent7-opaque-tail-pump/emit_modular.py \
            --provenance-input im-results/agent7-opaque-tail-pump/d100-new-${{ inputs.d100_mod_set == 'two' && 'phase-two' || inputs.d100_mod_set == 'ten' && 'phase-ten' || inputs.d100_mod_set == 'six' && 'modular-extra' || 'modular' }}.json \
            /tmp/a7-d100-mod/Raw36D100${{ inputs.d100_mod_set == 'two' && 'PhaseTwo' || inputs.d100_mod_set == 'ten' && 'Phase' || inputs.d100_mod_set == 'six' && 'Extra' || 'Mod' }}Automata00.lean \
            2>&1 | tee /tmp/a7-d100-mod-audit.log
          while IFS= read -r theorem; do
            python im-results/agent4-raw109/audit_axioms.py /tmp/a7-d100-mod-audit.log "$theorem"
          done < /tmp/a7-d100-mod/theorems.txt
          cp /tmp/a7-d100-mod-audit.log /tmp/a7-d100-mod-proof/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw36-d100-modular-${{ inputs.d100_mod_set }}-source
          path: |
            /tmp/a7-d100-mod/
            /tmp/a7-d100-mod-proof/
            /tmp/a7-d100-mod-audit.log
          if-no-files-found: warn
          retention-days: 60

  d100-exposure:
    if: ${{ inputs.d100_exposure_batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          echo "ELAN_TOOLCHAIN=leanprover/lean4:v4.36.0-rc2" >> "$GITHUB_ENV"
      - name: Generate source-locked finite-blank-prefix exposure lemma
        run: |
          set -euo pipefail
          TARGET=${{ inputs.d100_exposure_target }}
          if [[ "$TARGET" == F0 ]]; then
            TABLE='1RB1RE_1RC1LF_0RD1RF_0LD0LA_1LA1LE_---0LB'
            N=23126
            CHUNK=170
            SHA='520970e8e17cd2a0bcc882d5fe872a602616316884102444c1a45d5981085935'
            NAME='BB6.Agent7D100Exposure5d5ca9965558'
          else
            test "$TARGET" = B1
            TABLE='1RB1LE_1RC---_0RD1RF_0LD0LA_0LB0LA_1LA1RB'
            N=60671
            CHUNK=512
            SHA='b7dd63eefcfab9fa14f933dcf182f97594e7e89e720c276bff1b48b1174fc456'
            NAME='BB6.Agent7D100Exposure3fc1ba85d9c6'
          fi
          ROOT=/tmp/a7-d100-exposure/Raw36D100Exposure.lean
          python im-results/agent7-opaque-tail-pump/exposure_emit.py "$TABLE" "$N" "$ROOT" --chunk "$CHUNK"
          echo "$SHA  $ROOT" | sha256sum -c -
          printf '%s\n' "$NAME" > /tmp/a7-d100-exposure/namespace.txt
          python im-results/agent7-opaque-tail-pump/emit_exposure_bound.py \
            /tmp/a7-d100-exposure/Raw36D100Exposure.json \
            /tmp/a7-d100-exposure/Raw36D100ExposureBound.lean
      - name: Compile original zipper source and audit exact exposure theorems
        run: |
          set -euo pipefail
          python tools/lean_compile_closure.py \
            --workdir /tmp/a7-d100-exposure-proof \
            --source-root /tmp/a7-d100-exposure --jobs 2 \
            --manifest /tmp/a7-d100-exposure-proof/manifest.json \
            --label raw36-d100-exposure-${{ inputs.d100_exposure_target }} \
            --artifact-name raw36-d100-exposure-${{ inputs.d100_exposure_target }} \
            --provenance-input im-results/agent7-opaque-tail-pump/exposure_emit.py \
            --provenance-input im-results/agent7-opaque-tail-pump/emit_exposure_bound.py \
            --provenance-input im-results/agent7-opaque-tail-pump/detect_pump.py \
            /tmp/a7-d100-exposure/Raw36D100ExposureBound.lean \
            2>&1 | tee /tmp/a7-d100-exposure-audit.log
          NAME="$(cat /tmp/a7-d100-exposure/namespace.txt)"
          python im-results/agent4-raw109/audit_axioms.py /tmp/a7-d100-exposure-audit.log "$NAME.reached"
          python im-results/agent4-raw109/audit_axioms.py /tmp/a7-d100-exposure-audit.log "$NAME.hole"
          python im-results/agent4-raw109/audit_axioms.py /tmp/a7-d100-exposure-audit.log "BB6.Agent7D100ExposureBound.bound"
          cp /tmp/a7-d100-exposure-audit.log /tmp/a7-d100-exposure-proof/audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw36-d100-exposure-${{ inputs.d100_exposure_target }}
          path: |
            /tmp/a7-d100-exposure/
            /tmp/a7-d100-exposure-proof/
            /tmp/a7-d100-exposure-audit.log
          if-no-files-found: warn
          retention-days: 60
