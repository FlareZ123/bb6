name: Agent 7 S4 exact binary-gate proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone pinned original S4 source
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet c86f15861709b76042998c5211c7b2f83991621b
          test "$(git rev-parse HEAD)" = c86f15861709b76042998c5211c7b2f83991621b
      - name: Build original machine acceleration and verify gate
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
          lake build BusyBeaver.BB6.Accelerations.M_1RB0LD_1LC1RD_0LE1LA_0RB1RD_HHH0LF_1RA1LF
          cp "$GITHUB_WORKSPACE/im-results/agent7-s4-gate/S4GateOriginal.lean" Agent7S4GateOriginal.lean
          cp "$GITHUB_WORKSPACE/im-results/agent7-s4-gate/S4GateExact.lean" Agent7S4GateExact.lean
          cp "$GITHUB_WORKSPACE/im-results/agent7-s4-gate/S4Control.lean" Agent7S4Control.lean
          export LEAN_PATH=.:$LEAN_PATH
          lake env lean -o Agent7S4GateOriginal.olean Agent7S4GateOriginal.lean
          lake env lean Agent7S4GateExact.lean
          lake env lean Agent7S4Control.lean
      - name: Check Agent 5 genuine S4 model source bridge
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-head/S4Phase.lean.xz.b64" | xz -dc > S4Phase.lean
          echo "6f63cee92357a425db24131de7f43547503c06e982df2abc844e1d5c30ea293f  S4Phase.lean" | sha256sum -c -
          export LEAN_PATH=.:${LEAN_PATH:-}
          lake env lean -o S4Phase.olean S4Phase.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-source-bridge/S4UpstreamBridge.lean" S4UpstreamBridge.lean
          echo "ec7e962b3f5cde2084168af3af39499cc70729bc483d348b8bd31f27c8531130  S4UpstreamBridge.lean" | sha256sum -c -
          lake env lean S4UpstreamBridge.lean
      - name: Verify Agent 34 weighted-rank source bridge
        working-directory: /tmp/cryptids
        run: |
          python3 "$GITHUB_WORKSPACE/im-results/agent34-s4-rank/unpack.py" /tmp/cryptids
          export LEAN_PATH=.:$LEAN_PATH
          lake env lean -o S4Rank.olean S4Rank.lean
          lake env lean S4RankSource.lean
