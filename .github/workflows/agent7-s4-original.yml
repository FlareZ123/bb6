name: Agent 7 S4 exact binary-gate proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone pinned original S4 source
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet c86f15861709b76042998c5211c7b2f83991621b
          test "$(git rev-parse HEAD)" = c86f15861709b76042998c5211c7b2f83991621b
      - name: Build original machine acceleration and verify gate
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
          lake build BusyBeaver.BB6.Accelerations.M_1RB0LD_1LC1RD_0LE1LA_0RB1RD_HHH0LF_1RA1LF
          cp "$GITHUB_WORKSPACE/im-results/agent7-s4-gate/S4GateOriginal.lean" Agent7S4GateOriginal.lean
          cp "$GITHUB_WORKSPACE/im-results/agent7-s4-gate/S4GateExact.lean" Agent7S4GateExact.lean
          cp "$GITHUB_WORKSPACE/im-results/agent7-s4-gate/S4Control.lean" Agent7S4Control.lean
          export LEAN_PATH=.:$LEAN_PATH
          lake env lean -o Agent7S4GateOriginal.olean Agent7S4GateOriginal.lean
          lake env lean Agent7S4GateExact.lean
          lake env lean Agent7S4Control.lean
      - name: Check Agent 5 genuine S4 model source bridge
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-head/S4Phase.lean.xz.b64" | xz -dc > S4Phase.lean
          echo "6f63cee92357a425db24131de7f43547503c06e982df2abc844e1d5c30ea293f  S4Phase.lean" | sha256sum -c -
          export LEAN_PATH=.:${LEAN_PATH:-}
          lake env lean -o S4Phase.olean S4Phase.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-source-bridge/S4UpstreamBridge.lean" S4UpstreamBridge.lean
          echo "779fcefe0e81fde9e7b6d0f725ccad144d3eccbbc1911ad6eb6e7a0254bb02ab  S4UpstreamBridge.lean" | sha256sum -c -
          lake env lean -o S4UpstreamBridge.olean S4UpstreamBridge.lean
      - name: Check complete S4 two-sector raw halting criterion
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          export LEAN_PATH=.:${LEAN_PATH:-}
          SRC="$GITHUB_WORKSPACE/im-results/agent5-s4-head"
          for pair in \
            S4Trap:1cd994153762128b702c2f2e81009710abe3473d463bc28d1fbe40b51f8cb8a0 \
            S4Return:269cbc8e8792022e2ecfae11c893c0299c51b190fcb6db2e52f9c04681a3d9ba \
            S4Head:2556caac3ad0c90308779d50f4a78485c4770cbc3a360c3ceb6201fa951ee078 \
            S4Odd:2110a4dfcbe4befe8016c3a8be6d2931b8b7df2afc9ec58260d79c83331d968c \
            S4Even:5aab323784fccfeae01129f4b1a0258fdf9f90137f7337d579a133438aa0f0b7 \
            S4Pair:0246ce3a74f844239dda8397463e8f8ea65af47c0b037f18852dd4fb61ac5d49 \
            S4Hazard:3f706cc63a6361affe95fc47880aaa150e9b739a4a95f317a0af12c1983dba25; do
            module="${pair%%:*}"
            hash="${pair#*:}"
            base64 -d "$SRC/$module.lean.xz.b64" | xz -dc > "$module.lean"
            echo "$hash  $module.lean" | sha256sum -c -
            lake env lean -o "$module.olean" "$module.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-source-bridge/S4RawTwoGates.lean" S4RawTwoGates.lean
          lake env lean -o S4RawTwoGates.olean S4RawTwoGates.lean
          SRC3="$GITHUB_WORKSPACE/im-results/agent3-s4-weighted-drift"
          for pair in \
            S4WeightedDrift:ab696fc6c6c27b6518cb78ffd0e9dda5292d39dbcea5fee98ae6b75f4735bba2 \
            S4SourceShape:befc80875686ccc7e15ab0c02e114e7bbed86821b5d7442e35bb0ae19ee24539; do
            module="${pair%%:*}"
            hash="${pair#*:}"
            base64 -d "$SRC3/$module.lean.xz.b64" | xz -dc > "$module.lean"
            echo "$hash  $module.lean" | sha256sum -c -
            lake env lean -o "$module.olean" "$module.lean"
          done
          for module in S4NativeCompact S4Length S4LengthBridge S4Suffix S4SuffixBridge \
            S4NativeValuation S4PowerGate S4PowerBridge S4PowerNative; do
            cp "$GITHUB_WORKSPACE/im-results/agent5-s4-length/$module.lean" "$module.lean"
            lake env lean -o "$module.olean" "$module.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-length/S4RawPowerGate.lean" S4RawPowerGate.lean
          lake env lean S4RawPowerGate.lean
      - name: Verify Agent 34 weighted-rank source bridge
        working-directory: /tmp/cryptids
        run: |
          python3 "$GITHUB_WORKSPACE/im-results/agent34-s4-rank/unpack.py" /tmp/cryptids
          export LEAN_PATH=.:$LEAN_PATH
          lake env lean -o S4Rank.olean S4Rank.lean
          lake env lean S4RankSource.lean
