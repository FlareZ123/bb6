name: Agent 7 S4 exact binary-gate proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone pinned original S4 source
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet c86f15861709b76042998c5211c7b2f83991621b
          test "$(git rev-parse HEAD)" = c86f15861709b76042998c5211c7b2f83991621b
      - name: Build original machine acceleration and verify gate
        working-directory: /tmp/cryptids
        run: |
          lake exe cache get
          lake build BusyBeaver.BB6.Accelerations.M_1RB0LD_1LC1RD_0LE1LA_0RB1RD_HHH0LF_1RA1LF
          cp "$GITHUB_WORKSPACE/im-results/agent7-s4-gate/S4GateOriginal.lean" Agent7S4GateOriginal.lean
          cp "$GITHUB_WORKSPACE/im-results/agent7-s4-gate/S4GateExact.lean" Agent7S4GateExact.lean
          cp "$GITHUB_WORKSPACE/im-results/agent7-s4-gate/S4Control.lean" Agent7S4Control.lean
          export LEAN_PATH=.:$LEAN_PATH
          lake env lean -o Agent7S4GateOriginal.olean Agent7S4GateOriginal.lean
          lake env lean Agent7S4GateExact.lean
          lake env lean Agent7S4Control.lean
      - name: Check Agent 5 genuine S4 model source bridge
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-head/S4Phase.lean.xz.b64" | xz -dc > S4Phase.lean
          echo "6f63cee92357a425db24131de7f43547503c06e982df2abc844e1d5c30ea293f  S4Phase.lean" | sha256sum -c -
          export LEAN_PATH=.:${LEAN_PATH:-}
          lake env lean -o S4Phase.olean S4Phase.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-source-bridge/S4UpstreamBridge.lean" S4UpstreamBridge.lean
          echo "779fcefe0e81fde9e7b6d0f725ccad144d3eccbbc1911ad6eb6e7a0254bb02ab  S4UpstreamBridge.lean" | sha256sum -c -
          lake env lean -o S4UpstreamBridge.olean S4UpstreamBridge.lean
      - name: Check complete S4 two-sector raw halting criterion
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          export LEAN_PATH=.:${LEAN_PATH:-}
          SRC="$GITHUB_WORKSPACE/im-results/agent5-s4-head"
          for pair in \
            S4Trap:1cd994153762128b702c2f2e81009710abe3473d463bc28d1fbe40b51f8cb8a0 \
            S4Return:269cbc8e8792022e2ecfae11c893c0299c51b190fcb6db2e52f9c04681a3d9ba \
            S4Head:2556caac3ad0c90308779d50f4a78485c4770cbc3a360c3ceb6201fa951ee078 \
            S4Odd:2110a4dfcbe4befe8016c3a8be6d2931b8b7df2afc9ec58260d79c83331d968c \
            S4Even:5aab323784fccfeae01129f4b1a0258fdf9f90137f7337d579a133438aa0f0b7 \
            S4Pair:0246ce3a74f844239dda8397463e8f8ea65af47c0b037f18852dd4fb61ac5d49 \
            S4Hazard:3f706cc63a6361affe95fc47880aaa150e9b739a4a95f317a0af12c1983dba25; do
            module="${pair%%:*}"
            hash="${pair#*:}"
            base64 -d "$SRC/$module.lean.xz.b64" | xz -dc > "$module.lean"
            echo "$hash  $module.lean" | sha256sum -c -
            lake env lean -o "$module.olean" "$module.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-source-bridge/S4RawTwoGates.lean" S4RawTwoGates.lean
          lake env lean -o S4RawTwoGates.olean S4RawTwoGates.lean
          SRC3="$GITHUB_WORKSPACE/im-results/agent3-s4-weighted-drift"
          for pair in \
            S4WeightedDrift:ab696fc6c6c27b6518cb78ffd0e9dda5292d39dbcea5fee98ae6b75f4735bba2 \
            S4SourceShape:befc80875686ccc7e15ab0c02e114e7bbed86821b5d7442e35bb0ae19ee24539; do
            module="${pair%%:*}"
            hash="${pair#*:}"
            base64 -d "$SRC3/$module.lean.xz.b64" | xz -dc > "$module.lean"
            echo "$hash  $module.lean" | sha256sum -c -
            lake env lean -o "$module.olean" "$module.lean"
          done
          for module in S4NativeCompact S4Length S4LengthBridge S4Suffix S4SuffixBridge \
            S4NativeValuation S4PowerGate S4PowerBridge S4PowerNative; do
            cp "$GITHUB_WORKSPACE/im-results/agent5-s4-length/$module.lean" "$module.lean"
            lake env lean -o "$module.olean" "$module.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-length/S4RawPowerGate.lean" S4RawPowerGate.lean
          lake env lean -o S4RawPowerGate.olean S4RawPowerGate.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-length/S4RawCompact.lean" S4RawCompact.lean
          lake env lean -o S4RawCompact.olean S4RawCompact.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4Octet.lean" S4Octet.lean
          lake env lean -o S4Octet.olean S4Octet.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4OctetGrowth.lean" S4OctetGrowth.lean
          echo "b585d99f14c574cc42a889ed3aea980bf3e711520fed708ae57c10e3ffb8cce6  S4OctetGrowth.lean" | sha256sum -c -
          lake env lean -o S4OctetGrowth.olean S4OctetGrowth.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4RawOctet.lean" S4RawOctet.lean
          lake env lean -o S4RawOctet.olean S4RawOctet.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-length/S4RawTailGates.lean" S4RawTailGates.lean
          lake env lean S4RawTailGates.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4Toggle.lean" S4Toggle.lean
          lake env lean -o S4Toggle.olean S4Toggle.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-drift-ray/S4DriftRay.lean" S4DriftRay.lean
          lake env lean -o S4DriftRay.olean S4DriftRay.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-drift-ray/S4DriftBad.lean" S4DriftBad.lean
          lake env lean -o S4DriftBad.olean S4DriftBad.lean
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-prefix-causal/S4PrefixCausal.lean.xz.b64" | xz -dc > S4PrefixCausal.lean
          echo "81400697e2e0dc35f9193c637eff49e0e1df8344986899a58fa121621a78ffef  S4PrefixCausal.lean" | sha256sum -c -
          lake env lean -o S4PrefixCausal.olean S4PrefixCausal.lean
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-prefix-causal/S4PrefixGate64.lean.xz.b64" | xz -dc > S4PrefixGate64.lean
          echo "5a0dba9b3dbc8a0bca50c7ae9e9aba6a9bf8ed652780c132d80bb78e32046065  S4PrefixGate64.lean" | sha256sum -c -
          lake env lean -o S4PrefixGate64.olean S4PrefixGate64.lean
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-prefix-causal/S4PrefixGeneralGate.lean.xz.b64" | xz -dc > S4PrefixGeneralGate.lean
          echo "b49dcbb0beed94ef97b739d354c5c138b8a363d257576142cbfd99084c485b5e  S4PrefixGeneralGate.lean" | sha256sum -c -
          lake env lean -o S4PrefixGeneralGate.olean S4PrefixGeneralGate.lean
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-prefix-causal/S4PrefixSeven.lean.xz.b64" | xz -dc > S4PrefixSeven.lean
          echo "c4602d569435a0aea4674752e84a1c830576263be3d2712982479e1832da13d9  S4PrefixSeven.lean" | sha256sum -c -
          lake env lean -o S4PrefixSeven.olean S4PrefixSeven.lean
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-prefix-causal/S4PrefixSevenGate.lean.xz.b64" | xz -dc > S4PrefixSevenGate.lean
          echo "2fe6a92eab557fb3e1f3cf2459efbc560d358209f7cd8dfbc3df2db27e866665  S4PrefixSevenGate.lean" | sha256sum -c -
          lake env lean -o S4PrefixSevenGate.olean S4PrefixSevenGate.lean
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-prefix-causal/S4PrefixContraction.lean.xz.b64" | xz -dc > S4PrefixContraction.lean
          echo "e1a9f4c8aeb83c1082cf51d2fd161aa9117a11242df78b0261eaf01573289287  S4PrefixContraction.lean" | sha256sum -c -
          lake env lean -o S4PrefixContraction.olean S4PrefixContraction.lean
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-prefix-causal/S4PrefixContractionTransfer.lean.xz.b64" | xz -dc > S4PrefixContractionTransfer.lean
          echo "22775dc843c85707b66800662bec8bcacdeede3a7b5301b58cc229bbb720929c  S4PrefixContractionTransfer.lean" | sha256sum -c -
          lake env lean -o S4PrefixContractionTransfer.olean S4PrefixContractionTransfer.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4ToggleHead.lean" S4ToggleHead.lean
          lake env lean -o S4ToggleHead.olean S4ToggleHead.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-drift-ray/S4FixedTriple.lean" S4FixedTriple.lean
          lake env lean -o S4FixedTriple.olean S4FixedTriple.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-drift-ray/S4HeadAttractor.lean" S4HeadAttractor.lean
          lake env lean -o S4HeadAttractor.olean S4HeadAttractor.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4TogglePhases.lean" S4TogglePhases.lean
          lake env lean -o S4TogglePhases.olean S4TogglePhases.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4ToggleGates.lean" S4ToggleGates.lean
          lake env lean -o S4ToggleGates.olean S4ToggleGates.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4TogglePair.lean" S4TogglePair.lean
          lake env lean -o S4TogglePair.olean S4TogglePair.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4ToggleSafe.lean" S4ToggleSafe.lean
          lake env lean -o S4ToggleSafe.olean S4ToggleSafe.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4ToggleRoot.lean" S4ToggleRoot.lean
          lake env lean -o S4ToggleRoot.olean S4ToggleRoot.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4RawToggle.lean" S4RawToggle.lean
          lake env lean -o S4RawToggle.olean S4RawToggle.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4RawToggleRoot.lean" S4RawToggleRoot.lean
          lake env lean S4RawToggleRoot.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4TripleHead.lean" S4TripleHead.lean
          lake env lean -o S4TripleHead.olean S4TripleHead.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4TripleResidue.lean" S4TripleResidue.lean
          lake env lean -o S4TripleResidue.olean S4TripleResidue.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4TripleSharp.lean" S4TripleSharp.lean
          lake env lean -o S4TripleSharp.olean S4TripleSharp.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4TripleRoot.lean" S4TripleRoot.lean
          lake env lean -o S4TripleRoot.olean S4TripleRoot.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-octet/S4RawTripleRoot.lean" S4RawTripleRoot.lean
          lake env lean S4RawTripleRoot.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-sharp6/S4SharpWitness.lean" S4SharpWitness.lean
          lake env lean -o S4SharpWitness.olean S4SharpWitness.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-sharp6/S4SharpCensus.lean" S4SharpCensus.lean
          lake env lean -o S4SharpCensus.olean S4SharpCensus.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-general-sharp/S4EarlyCompletion.lean" S4EarlyCompletion.lean
          lake env lean -o S4EarlyCompletion.olean S4EarlyCompletion.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-general-sharp/S4EarlyRoot.lean" S4EarlyRoot.lean
          lake env lean -o S4EarlyRoot.olean S4EarlyRoot.lean
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-all-depth-sharp/S4AllDepthSharp.lean.xz.b64" | xz -dc > S4AllDepthSharp.lean
          echo "5c055cc0fdd6bb40c7e189080c126277e32510d7d0b9ca55162264c512a5e115  S4AllDepthSharp.lean" | sha256sum -c -
          lake env lean -o S4AllDepthSharp.olean S4AllDepthSharp.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-all-depth-sharp/S4AllDepthBool.lean" S4AllDepthBool.lean
          echo "b9e9f5462cebc896fc2a3995e1ee0a009e83cead7a6a614f1f58e0001844d3ac  S4AllDepthBool.lean" | sha256sum -c -
          lake env lean -o S4AllDepthBool.olean S4AllDepthBool.lean
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-all-depth-sharp/S4AllDepthGrowth.lean.xz.b64" | xz -dc > S4AllDepthGrowth.lean
          echo "3fbb97be0a309ccad35bbd957c5efaf90e3eb95b2a5ac3c70623a92f4850f3bd  S4AllDepthGrowth.lean" | sha256sum -c -
          lake env lean -o S4AllDepthGrowth.olean S4AllDepthGrowth.lean
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-all-depth-sharp/S4AllDepthSurvival.lean" S4AllDepthSurvival.lean
          echo "7cb8aa97c74c39fbad2b1f6575519359db0e8466bed57a6ff42fc5fc64923fbd  S4AllDepthSurvival.lean" | sha256sum -c -
          lake env lean -o S4AllDepthSurvival.olean S4AllDepthSurvival.lean
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-all-depth-sharp/S4MultiSharp.lean.xz.b64" | xz -dc > S4MultiSharp.lean
          echo "587894ae875e731f86cde19d79e07db0ec84574ee61e8be1f82bc130427639b7  S4MultiSharp.lean" | sha256sum -c -
          lake env lean -o S4MultiSharp.olean S4MultiSharp.lean
          base64 -d "$GITHUB_WORKSPACE/im-results/agent5-s4-all-depth-sharp/S4MultiGrowth.lean.xz.b64" | xz -dc > S4MultiGrowth.lean
          echo "eb6a757cf2ebd0a3ece9b5e1881c7dcfc9bc7ec9b970ba6dada55ff6c90b5d0f  S4MultiGrowth.lean" | sha256sum -c -
          lake env lean -o S4MultiGrowth.olean S4MultiGrowth.lean
      - name: Verify Agent 34 weighted-rank source bridge
        working-directory: /tmp/cryptids
        run: |
          python3 "$GITHUB_WORKSPACE/im-results/agent34-s4-rank/unpack.py" /tmp/cryptids
          export LEAN_PATH=.:$LEAN_PATH
          lake env lean -o S4Rank.olean S4Rank.lean
          lake env lean S4RankSource.lean

      - name: Verify Agent 5 eighth-prefix contraction and mass drift
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/im-results/agent5-s4-prefix-causal/S4PrefixEighthMass.lean" S4PrefixEighthMass.lean
          export LEAN_PATH=.:${LEAN_PATH:-}
          lake env lean -o S4PrefixEighthMass.olean S4PrefixEighthMass.lean
