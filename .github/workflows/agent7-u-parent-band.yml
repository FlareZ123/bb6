name: Agent 7 U/Q parent-band and n=887 cone source certificate (manual)

on:
  workflow_dispatch:
  push:
    branches:
      - agent7-887-even-parent
    paths:
      - .github/workflows/agent7-u-parent-band.yml
      - im-results/agent7-746-even-parent/**
      - im-results/agent7-fatal-density/**
      - im-results/agent10-cascade/**

permissions:
  contents: read

jobs:
  u-parent-band:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            if curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh &&
               sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2; then
              echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Compile original-source reset-parent dependencies and U/Q selector cone
        run: |
          set -eu
          a="im-results/agent7-cascade-odd-fibers"
          b="im-results/agent10-cascade"
          f="im-results/agent7-cascade-forward"
          c="im-results/agent44-746-fanin"
          r="im-results/agent44-746-rank"
          d="im-results/agent7-fatal-density"
          e="im-results/agent7-746-even-parent"
          export LEAN_PATH="$a:$b:$f:$c:$r:$d:$e"
          lean --version
          for m in SourceMacro CascadeOdd ReverseResidue GapCore Mass; do
            lean -o "$a/$m.olean" "$a/$m.lean"
          done
          lean -o "$b/FirstReturnCore.olean" "$b/FirstReturnCore.lean"
          lean -o "$a/LowGates.olean" "$a/LowGates.lean"
          lean -o "$a/SurvivingSmall.olean" "$a/SurvivingSmall.lean"
          lean -o "$a/WellInverseCases.olean" "$a/WellInverseCases.lean"
          lean -o "$a/PreimageCandidates.olean" "$a/PreimageCandidates.lean"
          for m in TerminalExit GapOddJoin SweepInvariant RootTerminal ResetAncestry FatalExclusion SmallFatal GateNecessary ExactGate; do
            lean -o "$b/$m.olean" "$b/$m.lean"
          done
          for m in ValuationDrain FullReturn ReturnInverseArithmetic ResetInverseWitnesses FirstOutcome FirstInverseComplete ResetChain ResetParentStrict ManyShield FastShield ParentsFast ClosedCertFast; do
            lean -o "$b/$m.olean" "$b/$m.lean"
          done
          for m in SignedRayPeriod RayDepthHensel RayDepthResidue; do
            lean -o "$d/$m.olean" "$d/$m.lean"
          done
          lean -o "$e/UParentBandEnvelope.olean" "$e/UParentBandEnvelope.lean"
          lean -o "$e/UScaleParameter.olean" "$e/UScaleParameter.lean"
          for m in QDepthDefs QDepthLift QDepthBase QDepthSelectorBase QDepthSelector QDepth887 QDepthHensel UParentBandBase UParentOddSelector UParentResetFilter UParentBand887 UParentCone887; do
            lean -o "$e/$m.olean" "$e/$m.lean"
          done
          echo "PASS: Q divisibility selects one depth residue at every precision"
          echo "PASS: n=887 U-odd-parent exponents reduce to t=2 or t=4"
          echo "PASS: exact source ResetParent closure excludes the complete 31-state U-parent cone"
          echo "AXIOM AUDIT: see the Q selector #print axioms reports above"
