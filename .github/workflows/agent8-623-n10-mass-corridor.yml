name: Agent 8 #623 n=10 root mass-corridor source proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/cryptids
          ref: c86f15861709b76042998c5211c7b2f83991621b
          path: cryptids
      - name: Install pinned source Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build authentic BB6 source
        working-directory: cryptids
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "c86f15861709b76042998c5211c7b2f83991621b"
          lake update
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB0LE_0RC1RC_0RD1LA_1LD0LA_1LF1LC_HHH0LA
      - name: Compile exact root source and arithmetic dependencies
        working-directory: cryptids
        run: |
          set -euo pipefail
          cp "../im-results/agent49-parity623/Parity623Source.lean" Agent49ParitySource.lean
          lake env lean -o .lake/build/lib/lean/Agent49ParitySource.olean Agent49ParitySource.lean
          cp "../im-results/agent8-623-inverse/SquareGapTerminalBridge.lean" SquareGapTerminalBridge.lean
          lake env lean -o .lake/build/lib/lean/SquareGapTerminalBridge.olean SquareGapTerminalBridge.lean
          cp "../im-results/agent8-623-inverse/RootCancellationBudgetBridge.lean" Agent8RootCancellationBudgetBridge.lean
          lake env lean -o .lake/build/lib/lean/Agent8RootCancellationBudgetBridge.olean Agent8RootCancellationBudgetBridge.lean
          cp "../im-results/agent48-623-budget-composition/RootExclusion.lean" RootExclusion.lean
          lake env lean -o .lake/build/lib/lean/RootExclusion.olean RootExclusion.lean 2>&1 | tee root-exclusion.log
          cp "../im-results/agent8-623-inverse/RootMassGapAllN10.lean" Agent8RootMassGapAllN10.lean
          lake env lean Agent8RootMassGapAllN10.lean 2>&1 | tee root-mass-gap-n10.log
          if grep -q 'sorryAx' root-exclusion.log root-mass-gap-n10.log; then
            echo 'sorryAx detected in root mass-corridor proof chain'
            exit 1
          fi
      - name: Summarize source proof outputs
        if: always()
        working-directory: cryptids
        run: |
          echo "=== RootExclusion axioms ==="
          grep -E 'root_run_|run_mass_mono|sorryAx' root-exclusion.log || true
          echo "=== n=10 mass corridor axioms ==="
          grep -E 'root_run_|n10_|absDiff_comm|sorryAx' root-mass-gap-n10.log || true
