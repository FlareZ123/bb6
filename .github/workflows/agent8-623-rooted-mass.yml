name: Agent 8 BB6 623 rooted mass and n=10 corridors (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-root:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build pinned original #623 source
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          cd /tmp/cryptids
          git checkout --quiet c86f15861709b76042998c5211c7b2f83991621b
          test "$(git rev-parse HEAD)" = c86f15861709b76042998c5211c7b2f83991621b
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB0LE_0RC1RC_0RD1LA_1LD0LA_1LF1LC_HHH0LA
      - name: Prove all mass results including genuine blank-orbit two-step theorem
        working-directory: /tmp/cryptids
        run: |
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/Parity623Source.lean" Agent49ParitySource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-inverse/TernaryBudgetSource.lean" Agent8BudgetSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-inverse/SharpMassSource.lean" Agent8SharpMassSource.lean
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-inverse/SharpMass10Source.lean" Agent8SharpMass10Source.lean
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-inverse/RootedMassSource.lean" Agent8RootedMassSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49ParitySource.olean Agent49ParitySource.lean
          lake env lean -o .lake/build/lib/lean/Agent8BudgetSource.olean Agent8BudgetSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8SharpMassSource.olean Agent8SharpMassSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8SharpMass10Source.olean Agent8SharpMass10Source.lean
          lake env lean Agent8RootedMassSource.lean

      - name: Compile exact n=10 root-corridor dependencies
        working-directory: /tmp/cryptids
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-inverse/SquareGapTerminalBridge.lean" SquareGapTerminalBridge.lean
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-inverse/RootCancellationBudgetBridge.lean" Agent8RootCancellationBudgetBridge.lean
          cp "$GITHUB_WORKSPACE/im-results/agent48-623-budget-composition/RootExclusion.lean" RootExclusion.lean
          cp "$GITHUB_WORKSPACE/im-results/agent8-623-inverse/RootMassGapAllN10.lean" Agent8RootMassGapAllN10.lean
          lake env lean -o .lake/build/lib/lean/SquareGapTerminalBridge.olean SquareGapTerminalBridge.lean 2>&1 | tee square-gap-terminal-bridge.log
          lake env lean -o .lake/build/lib/lean/Agent8RootCancellationBudgetBridge.olean Agent8RootCancellationBudgetBridge.lean 2>&1 | tee root-cancellation-budget-bridge.log
          lake env lean -o .lake/build/lib/lean/RootExclusion.olean RootExclusion.lean 2>&1 | tee root-exclusion.log
          lake env lean -o .lake/build/lib/lean/Agent8RootMassGapAllN10.olean Agent8RootMassGapAllN10.lean 2>&1 | tee root-mass-gap-n10.log
          cat square-gap-terminal-bridge.log root-cancellation-budget-bridge.log root-exclusion.log root-mass-gap-n10.log > n10-root-mass-axioms.log
          if grep -q 'sorryAx' n10-root-mass-axioms.log; then
            echo 'sorryAx detected in the exact-source n=10 root-corridor closure'
            exit 1
          fi
      - name: Upload n=10 root-corridor axiom log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb6-623-n10-root-corridor-axioms
          path: /tmp/cryptids/n10-root-mass-axioms.log
          if-no-files-found: ignore
