name: Agent 8 #623 universal third-counter affine source proof (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: google-deepmind/cryptids
          ref: c86f15861709b76042998c5211c7b2f83991621b
          path: cryptids
      - name: Install pinned source Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0-rc4
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify upstream revision and compile authentic source machine
        working-directory: cryptids
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "c86f15861709b76042998c5211c7b2f83991621b"
          lake update
          lake exe cache get
          lake build BusyBeaver.BB6.M_1RB0LE_0RC1RC_0RD1LA_1LD0LA_1LF1LC_HHH0LA
      - name: Prove evaluator bounds, joint drain mass, and root-ray bridge
        working-directory: cryptids
        run: |
          set -eu
          cp "../im-results/agent49-parity623/Parity623Source.lean" Agent49ParitySource.lean
          lake env lean -o .lake/build/lib/lean/Agent49ParitySource.olean Agent49ParitySource.lean
          cp "../im-results/agent8-623-inverse/ThirdCounterAffineSource.lean" Agent8ThirdCounterAffineSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8ThirdCounterAffineSource.olean Agent8ThirdCounterAffineSource.lean
          cp "../im-results/agent8-623-inverse/DrainLogDepthSource.lean" Agent8DrainLogDepthSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8DrainLogDepthSource.olean Agent8DrainLogDepthSource.lean
          cp "../im-results/agent8-623-inverse/EvalFullFuelSource.lean" Agent8EvalFullFuelSource.lean
          lake env lean Agent8EvalFullFuelSource.lean
          cp "../im-results/agent8-623-inverse/TernaryBudgetSource.lean" Agent8BudgetSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8BudgetSource.olean Agent8BudgetSource.lean
          cp "../im-results/agent8-623-inverse/GateRepulsionSource.lean" Agent8GateRepulsionSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8GateRepulsionSource.olean Agent8GateRepulsionSource.lean
          cp "../im-results/agent8-623-inverse/GateCompleteSource.lean" Agent8GateCompleteSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8GateCompleteSource.olean Agent8GateCompleteSource.lean
          cp "../im-results/agent8-623-inverse/DrainSectorSource.lean" Agent8DrainSectorSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8DrainSectorSource.olean Agent8DrainSectorSource.lean
          cp "../im-results/agent8-623-inverse/DrainSevenSource.lean" Agent8DrainSevenSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8DrainSevenSource.olean Agent8DrainSevenSource.lean
          cp "../im-results/agent8-623-inverse/DrainFirstSharpSource.lean" Agent8DrainFirstSharpSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8DrainFirstSharpSource.olean Agent8DrainFirstSharpSource.lean
          cp "../im-results/agent8-623-inverse/FarSectorSource.lean" Agent8FarSectorSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8FarSectorSource.olean Agent8FarSectorSource.lean
          cp "../im-results/agent8-623-inverse/LogConeSource.lean" Agent8LogConeSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8LogConeSource.olean Agent8LogConeSource.lean
          cp "../im-results/agent8-623-inverse/ParentCorridorSource.lean" Agent8ParentCorridorSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8ParentCorridorSource.olean Agent8ParentCorridorSource.lean
          cp "../im-results/agent8-623-inverse/ZeroTailSource.lean" Agent8ZeroTailSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8ZeroTailSource.olean Agent8ZeroTailSource.lean
          cp "../im-results/agent8-623-inverse/RootCorridorSource.lean" Agent8RootCorridorSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8RootCorridorSource.olean Agent8RootCorridorSource.lean
          cp "../im-results/agent8-623-inverse/LogParentSource.lean" Agent8LogParentSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8LogParentSource.olean Agent8LogParentSource.lean
          cp "../im-results/agent8-623-inverse/HaltParentSource.lean" Agent8HaltParentSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8HaltParentSource.olean Agent8HaltParentSource.lean
          cp "../im-results/agent8-623-inverse/MachineHaltSource.lean" Agent8MachineHaltSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8MachineHaltSource.olean Agent8MachineHaltSource.lean
          cp "../im-results/agent8-623-inverse/LogRightSource.lean" Agent8LogRightSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8LogRightSource.olean Agent8LogRightSource.lean
          cp "../im-results/agent8-623-inverse/LogRightSectorsSource.lean" Agent8LogRightSectorsSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8LogRightSectorsSource.olean Agent8LogRightSectorsSource.lean
          cp "../im-results/agent8-623-inverse/LogRightParentSource.lean" Agent8LogRightParentSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8LogRightParentSource.olean Agent8LogRightParentSource.lean
          cp "../im-results/agent8-623-inverse/MachineLogHaltSource.lean" Agent8MachineLogHaltSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8MachineLogHaltSource.olean Agent8MachineLogHaltSource.lean
          cp "../im-results/agent8-623-inverse/DrainQuadraticLogSource.lean" Agent8DrainQuadraticLogSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8DrainQuadraticLogSource.olean Agent8DrainQuadraticLogSource.lean
          cp "../im-results/agent8-623-inverse/QuadraticLogConeSource.lean" Agent8QuadraticLogConeSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8QuadraticLogConeSource.olean Agent8QuadraticLogConeSource.lean
          cp "../im-results/agent8-623-inverse/QuadraticParentSource.lean" Agent8QuadraticParentSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8QuadraticParentSource.olean Agent8QuadraticParentSource.lean
          cp "../im-results/agent8-623-inverse/SyntheticParentsSource.lean" Agent8SyntheticParentSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8SyntheticParentSource.olean Agent8SyntheticParentSource.lean
          cp "../im-results/agent8-623-inverse/TerminalIntervalSource.lean" Agent8TerminalIntervalSource.lean
          lake env lean -o .lake/build/lib/lean/Agent8TerminalIntervalSource.olean Agent8TerminalIntervalSource.lean
          cp "../im-results/agent49-parity623/DrainLinearLogSource.lean" Agent49DrainLinearLogSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49DrainLinearLogSource.olean Agent49DrainLinearLogSource.lean
          cp "../im-results/agent49-parity623/JointMassSource.lean" Agent49JointMassSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49JointMassSource.olean Agent49JointMassSource.lean
          cp "../im-results/agent49-parity623/RootRayBridgeArithmetic.lean" Agent49RootRayBridgeArithmetic.lean
          lake env lean -o .lake/build/lib/lean/Agent49RootRayBridgeArithmetic.olean Agent49RootRayBridgeArithmetic.lean
          cp "../im-results/agent49-parity623/DrainLinearTerminalSource.lean" Agent49DrainLinearTerminalSource.lean
          lake env lean -o .lake/build/lib/lean/Agent49DrainLinearTerminalSource.olean Agent49DrainLinearTerminalSource.lean
          cp "../im-results/agent49-parity623/TerminalRatio4Arithmetic.lean" Agent49TerminalRatio4Arithmetic.lean
          lake env lean -o .lake/build/lib/lean/Agent49TerminalRatio4Arithmetic.olean Agent49TerminalRatio4Arithmetic.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/CanonicalRayCocycleArithmetic.lean" Agent49CanonicalRayCocycleArithmetic.lean
          lake env lean Agent49CanonicalRayCocycleArithmetic.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/TerminalRatio4Source.lean" Agent49TerminalRatio4Source.lean
          lake env lean -o .lake/build/lib/lean/Agent49TerminalRatio4Source.olean Agent49TerminalRatio4Source.lean
          cp "$GITHUB_WORKSPACE/im-results/agent49-parity623/CanonicalRayRootDistanceArithmetic.lean" Agent49CanonicalRayRootDistanceArithmetic.lean
          lake env lean Agent49CanonicalRayRootDistanceArithmetic.lean
          cp "../im-results/agent8-623-inverse/MachineFullGateSource.lean" Agent8MachineFullGateSource.lean
          lake env lean Agent8MachineFullGateSource.lean
          cp "../im-results/agent8-623-survival-density/RootSpectrumSource.lean" Agent8RootSpectrumSource.lean
          lake env lean Agent8RootSpectrumSource.lean
      - name: Reproduce 10,000-state canonical ray terminal-window audit
        run: python "$GITHUB_WORKSPACE/im-results/agent49-parity623/canonical_ray_terminal_scan.py" --steps 10000
