name: Agent 8 Machine C arbitrary inverse-depth theorem (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean-check full original Machine C section and depth construction
        run: |
          mkdir -p /tmp/a8-depth
          cp im-results/agent11-c-line/CLine.lean /tmp/a8-depth/CLine.lean
          cp im-results/agent21-c-source-bridge/CReachBridge.lean /tmp/a8-depth/CReachBridge.lean
          cp im-results/agent21-c-source-bridge/CSection.lean /tmp/a8-depth/CSection.lean
          cp im-results/agent8-rank-barriers/CInverseDepth.lean /tmp/a8-depth/CInverseDepth.lean
          cd /tmp/a8-depth
          export LEAN_PATH="."
          lean --version
          lean -o CLine.olean CLine.lean
          lean -o CReachBridge.olean CReachBridge.lean
          lean -o CSection.olean CSection.lean
          lean CInverseDepth.lean
