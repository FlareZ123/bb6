name: Agent 8 exact Machine C bounded two-counter return section (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-section:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile complete unmodified source and total section equivalence
        run: |
          mkdir -p /tmp/a8-total
          cp im-results/agent11-c-line/CLine.lean /tmp/a8-total/
          cp im-results/agent21-c-source-bridge/CReachBridge.lean /tmp/a8-total/
          cp im-results/agent21-c-source-bridge/CPhaseRank.lean /tmp/a8-total/
          cp im-results/agent8-c-total-section/{GenericSection,CSectionTotal,GenericScan,CSectionComputable,CSectionRank}.lean /tmp/a8-total/
          cd /tmp/a8-total
          export LEAN_PATH="."
          lean --version
          lean -o CLine.olean CLine.lean
          lean -o CReachBridge.olean CReachBridge.lean
          lean -o CPhaseRank.olean CPhaseRank.lean
          lean -o GenericSection.olean GenericSection.lean
          lean -o CSectionTotal.olean CSectionTotal.lean
          lean -o GenericScan.olean GenericScan.lean
          lean -o CSectionComputable.olean CSectionComputable.lean
          lean CSectionRank.lean
          cp "$GITHUB_WORKSPACE/im-results/agent46-c-first-reach/"{SectionReachBridge,CFirstReach}.lean .
          lean -o SectionReachBridge.olean SectionReachBridge.lean
          lean CFirstReach.lean
          # Two independently developed section maps: certify their equality
          # against the exact unmodified source, including every bounce case.
          cp "$GITHUB_WORKSPACE/im-results/agent46-c-jump/"{JumpHigh,JumpMacro,JumpSection,JumpBounce,JumpOneReturn,JumpBounceSections,BounceCalc,BounceProof,FastSectionDef,FastSectionProof,FastSectionHalting}.lean .
          for f in JumpHigh JumpMacro JumpSection JumpBounce JumpOneReturn JumpBounceSections BounceCalc BounceProof FastSectionDef FastSectionProof FastSectionHalting; do
            lean -o "$f.olean" "$f.lean"
          done
          cp "$GITHUB_WORKSPACE/im-results/agent15-c-halting/"{BounceFirstReturn,SectionFirstReturn}.lean .
          lean -o BounceFirstReturn.olean BounceFirstReturn.lean
          lean -o SectionFirstReturn.olean SectionFirstReturn.lean
          cp "$GITHUB_WORKSPACE/im-results/agent46-c-first-reach/"{SectionUnique,CSectionCoincidence}.lean .
          lean -o SectionUnique.olean SectionUnique.lean
          lean -o CSectionCoincidence.olean CSectionCoincidence.lean
          cp "$GITHUB_WORKSPACE/im-results/agent46-c-first-reach/"{SectionTimeBound,CSectionTimeEq}.lean .
          lean -o SectionTimeBound.olean SectionTimeBound.lean
          lean CSectionTimeEq.lean
          # Closed-form primitive-CLine duration of both dyadic stopping families.
          cp "$GITHUB_WORKSPACE/im-results/agent15-c-halting/BounceHalting.lean" .
          lean -o BounceHalting.olean BounceHalting.lean
          cp "$GITHUB_WORKSPACE/im-results/agent46-c-first-reach/CParamHaltTime.lean" .
          lean CParamHaltTime.lean
