name: Agent 8 sparse BB6 global coverage contract (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Verify total-machine coverage inference and axiom audit
        run: |
          set -eu
          export LEAN_PATH=im-results/agent8-coverage-contract:im-results/agent44-drift-closure:im-results/agent6-fresh-glider
          lean -o im-results/agent8-coverage-contract/Frontier.olean im-results/agent8-coverage-contract/Frontier.lean
          lean im-results/agent8-coverage-contract/TerminalBridge.lean
          lean -o im-results/agent8-coverage-contract/Symmetry.olean im-results/agent8-coverage-contract/Symmetry.lean
          lean im-results/agent8-coverage-contract/Prune.lean
          lean -o im-results/agent8-coverage-contract/OneHalt.olean im-results/agent8-coverage-contract/OneHalt.lean
          lean im-results/agent8-coverage-contract/LeafRules.lean
          lean -o im-results/agent8-coverage-contract/RayClosed.olean im-results/agent8-coverage-contract/RayClosed.lean
          lean -o im-results/agent8-coverage-contract/RayChecker.olean im-results/agent8-coverage-contract/RayChecker.lean
          lean im-results/agent8-coverage-contract/RayOracle.lean
          lean -o im-results/agent8-coverage-contract/RayEntry.olean im-results/agent8-coverage-contract/RayEntry.lean
          lean -o im-results/agent8-coverage-contract/RayTurnExample.olean im-results/agent8-coverage-contract/RayTurnExample.lean
          lean -o im-results/agent8-coverage-contract/RayFinite.olean im-results/agent8-coverage-contract/RayFinite.lean
          lean -o im-results/agent6-fresh-glider/RayMacro.olean im-results/agent6-fresh-glider/RayMacro.lean
          lean -o im-results/agent6-fresh-glider/FreshRayGlider.olean im-results/agent6-fresh-glider/FreshRayGlider.lean
          lean -o im-results/agent6-fresh-glider/MacroOracle.olean im-results/agent6-fresh-glider/MacroOracle.lean
          lean -o im-results/agent6-fresh-glider/EntryMacroOracle.olean im-results/agent6-fresh-glider/EntryMacroOracle.lean
          lean -o im-results/agent6-fresh-glider/EntryMacroLeft.olean im-results/agent6-fresh-glider/EntryMacroLeft.lean
          lean -o im-results/agent6-fresh-glider/MarkerTailExample.olean im-results/agent6-fresh-glider/MarkerTailExample.lean
          lean -o im-results/agent6-fresh-glider/MarkerOracle.olean im-results/agent6-fresh-glider/MarkerOracle.lean
          lean im-results/agent6-fresh-glider/ThreeSlotBounce.lean
          lean im-results/agent6-fresh-glider/FastMacro.lean
          lean im-results/agent6-fresh-glider/FiveFamily.lean
          python im-results/agent6-fresh-glider/five_census.py
          python im-results/agent6-fresh-glider/bootstrap_census.py
          lean -o im-results/agent8-coverage-contract/RayFiniteOracle.olean im-results/agent8-coverage-contract/RayFiniteOracle.lean
          lean -o im-results/agent8-coverage-contract/FiniteHalting.olean im-results/agent8-coverage-contract/FiniteHalting.lean
          lean -o im-results/agent44-drift-closure/DirectedDrift.olean im-results/agent44-drift-closure/DirectedDrift.lean
          lean -o im-results/agent8-coverage-contract/ZeroMaskOracle.olean im-results/agent8-coverage-contract/ZeroMaskOracle.lean
          lean -o im-results/agent8-coverage-contract/FiniteDecision.olean im-results/agent8-coverage-contract/FiniteDecision.lean
          lean -o im-results/agent8-coverage-contract/SparsePruneSearch.olean im-results/agent8-coverage-contract/SparsePruneSearch.lean
          lean -o im-results/agent6-fresh-glider/MacroSearch.olean im-results/agent6-fresh-glider/MacroSearch.lean
          lean im-results/agent6-fresh-glider/EntryMacroSearch.lean
          lean im-results/agent8-coverage-contract/SparseReachPolicy.lean
          node im-results/agent8-coverage-contract/ray_count.cjs
          python im-results/agent8-coverage-contract/orbit_census.py
          lean -o im-results/agent8-coverage-contract/LedgerCheck.olean im-results/agent8-coverage-contract/LedgerCheck.lean
          lean im-results/agent8-coverage-contract/LedgerRows.lean
      - name: Source-verify generalized halt-slot cylinder and global frontier
        run: |
          set -eu
          export LEAN_PATH="im-results/agent8-coverage-contract:im-results/agent4-coverage-smoke"
          lean -o im-results/agent8-coverage-contract/HaltSlotFreedom.olean im-results/agent8-coverage-contract/HaltSlotFreedom.lean
          lean im-results/agent8-coverage-contract/TotalHaltAudit.lean
          lean -o im-results/agent8-coverage-contract/AllHaltsFreedom.olean im-results/agent8-coverage-contract/AllHaltsFreedom.lean
          lean -o im-results/agent4-coverage-smoke/FrontierAudit.olean im-results/agent4-coverage-smoke/FrontierAudit.lean
          lean -o im-results/agent4-coverage-smoke/FrontierMass.olean im-results/agent4-coverage-smoke/FrontierMass.lean
          lean im-results/agent8-coverage-contract/IncrementalAudit.lean
          lean -o im-results/agent4-coverage-smoke/SingletonFrontier.olean im-results/agent4-coverage-smoke/SingletonFrontier.lean
          lean -o im-results/agent8-coverage-contract/CylinderFrontier.olean im-results/agent8-coverage-contract/CylinderFrontier.lean
          lean im-results/agent8-coverage-contract/AllHaltsGlobal.lean
          lean im-results/agent8-coverage-contract/RootShift.lean
