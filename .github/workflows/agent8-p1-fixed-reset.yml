name: Agent 8 P1 fixed-reset source audit
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-reset-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Reassemble version-pinned source and validate integrity
        run: |
          set -eu
          root=im-results/agent8-p1-fixed-reset
          cat "$root/lean.tar.xz.b64.part00" "$root/lean.tar.xz.b64.part01" "$root/lean.tar.xz.b64.part02" | base64 --decode > /tmp/agent8-p1-fixed-reset.tar.xz
          echo "e9d3aa0ac97f9f64daa05574158f1a7256735cec8d07a55060d14abf68ff9830  /tmp/agent8-p1-fixed-reset.tar.xz" | sha256sum --check
          tar -xJf /tmp/agent8-p1-fixed-reset.tar.xz -C "$root"
          base64 --decode "$root/uniform.tar.xz.b64" > /tmp/agent8-p1-uniform.tar.xz
          echo "7f5af919950862fa2d1e0cab12ed2d90e211c3299933cb1fb60f81843291e045  /tmp/agent8-p1-uniform.tar.xz" | sha256sum --check
          tar -xJf /tmp/agent8-p1-uniform.tar.xz -C "$root"
          base64 --decode "$root/uniform-any.tar.xz.b64" > /tmp/agent8-p1-uniform-any.tar.xz
          echo "fbfac84564260a81ba6634799bc9f1bebdad930d1647c7a2355605868fed7ac6  /tmp/agent8-p1-uniform-any.tar.xz" | sha256sum --check
          tar -xJf /tmp/agent8-p1-uniform-any.tar.xz -C "$root"
          base64 --decode "$root/growth.tar.xz.b64" > /tmp/agent8-p1-growth.tar.xz
          echo "4649bfe9ace238dee28b9d18cc3fc4f0fb02d4581b6ba30f7b1b96d15b465d60  /tmp/agent8-p1-growth.tar.xz" | sha256sum --check
          tar -xJf /tmp/agent8-p1-growth.tar.xz -C "$root"
      - name: Show inherited PathInvariant and source bridge interfaces
        run: |
          root=im-results/agent8-p1-fixed-reset
          for file in "$root/PathInvariant.lean" "$root/SourceBridge.lean" "$root/UniformAny.lean" "$root/BudgetGrowth.lean"; do
            echo "SIGNATURE FILE $file"
            grep -n -A12 -E '^theorem .*path_invariant|^theorem .*source_count_path|^theorem .*budget|^theorem .*source_count|^inductive .*Path' "$file" || true
          done
      - name: Inspect low-cost even exit source signature
        run: |
          root=im-results/agent28-p1-word-automaton
          base64 --decode "$root/P1ScalarBridge.lean.xz.b64" | xz --decompress --stdout > /tmp/P1ScalarBridge.lean
          grep -n -A35 -E '^theorem source_critical_low_cost_even_exit' /tmp/P1ScalarBridge.lean || true
      - name: Compile original P1 source and finite-source reset words
        run: |
          set -eu
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent28-p1-word-automaton:im-results/agent8-p1-fixed-reset"
          # Compile the unchanged Agent28 source-level low-cost even feeder theorem.
          scalar=im-results/agent28-p1-word-automaton
          base64 --decode "$scalar/P1Scalar.lean.xz.b64" | xz --decompress --stdout > "$scalar/P1Scalar.lean"
          base64 --decode "$scalar/P1ScalarBridge.lean.xz.b64" | xz --decompress --stdout > "$scalar/P1ScalarBridge.lean"
          echo "56fc4dbfb187bcb54302d04580cb138556fa7eb110d1f263ffd25bdc5f3b23d4  $scalar/P1Scalar.lean" | sha256sum --check
          for m in GParity GInverse PosEvenForm; do
            lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean"
          done
          lean -o im-results/agent1-p1-map/EvenSeed.olean im-results/agent1-p1-map/EvenSeed.lean
          lean -o im-results/agent47-p1-finite-inverse/P1FiniteInverse.olean im-results/agent47-p1-finite-inverse/P1FiniteInverse.lean
          for m in MassInverse OddConeMass; do
            lean -o "im-results/agent1-p1-quarter/$m.olean" "im-results/agent1-p1-quarter/$m.lean"
          done
          lean -o im-results/agent47-p1-finite-inverse/P1InverseLog.olean im-results/agent47-p1-finite-inverse/P1InverseLog.lean
          lean -o im-results/agent1-p1-quarter/InverseIff.olean im-results/agent1-p1-quarter/InverseIff.lean
          lean -o im-results/agent28-p1-word-automaton/P1Scalar.olean im-results/agent28-p1-word-automaton/P1Scalar.lean
          lean -o im-results/agent28-p1-word-automaton/P1ScalarBridge.olean im-results/agent28-p1-word-automaton/P1ScalarBridge.lean
          for m in OddWordCost OddWordSourceBridge OneResetGrowth OneResetTwoAdic OneResetBudget OneResetSourceEq OneResetPoly OneResetSourceBudget; do
            lean -o "im-results/agent28-p1-word-automaton/$m.olean" "im-results/agent28-p1-word-automaton/$m.lean"
          done
          lean -o im-results/agent1-p1-quarter/UpperTail.olean im-results/agent1-p1-quarter/UpperTail.lean
          for m in OneResetSourceBridge OneResetZero OneResetCount; do
            lean -o "im-results/agent28-p1-word-automaton/$m.olean" "im-results/agent28-p1-word-automaton/$m.lean"
          done
      - name: Kernel-check universal source-independent and original-source theorems
        run: |
          set -eu
          root=im-results/agent8-p1-fixed-reset
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent28-p1-word-automaton:$root"
          for m in ResetBudget AbstractInverse DefectAlgebra PathInvariant; do
            lean -o "$root/$m.olean" "$root/$m.lean"
          done
          # Add the missing direct dependency from the archived bridge source.
          sed -i "1iimport PathInvariant" "$root/SourceBridge.lean"
          lean -o "$root/SourceBridge.olean" "$root/SourceBridge.lean"
          lean -o "$root/CostBudgetSource.olean" "$root/CostBudgetSource.lean"
          lean -o "$root/ConcreteCorollaries.olean" "$root/ConcreteCorollaries.lean"
          lean -o "$root/UniformRatio.olean" "$root/UniformRatio.lean"
          lean -o "$root/UniformThreshold.olean" "$root/UniformThreshold.lean"
          lean "$root/UniformSourceCorollary.lean"
          lean -o "$root/UniformAny.olean" "$root/UniformAny.lean"
          lean "$root/UniformAnySource.lean"
          lean -o "$root/SourceLower.olean" "$root/SourceLower.lean"
          lean -o "$root/DegreeLogPure.olean" "$root/DegreeLogPure.lean"
          lean -o "$root/ZeroEvenCostArithmetic.olean" "$root/ZeroEvenCostArithmetic.lean"
          lean -o "$root/ZeroEvenCostSource.olean" "$root/ZeroEvenCostSource.lean"
          lean -o "$root/ZeroEvenRigidity.olean" "$root/ZeroEvenRigidity.lean"
          lean -o "$root/ZeroEvenRigiditySource.olean" "$root/ZeroEvenRigiditySource.lean"
          lean -o "$root/ZeroEvenExactCost.olean" "$root/ZeroEvenExactCost.lean"
          lean -o "$root/ZeroEvenExactSource.olean" "$root/ZeroEvenExactSource.lean"
          lean -o "$root/ZeroOnePredecessor.olean" "$root/ZeroOnePredecessor.lean"
          lean -o "$root/ZeroOneSource.olean" "$root/ZeroOneSource.lean"
          lean -o "$root/ZeroThreePredecessor.olean" "$root/ZeroThreePredecessor.lean"
          lean "$root/ZeroThreeSource.lean"
          lean -o "$root/ZeroEvenDescentSource.olean" "$root/ZeroEvenDescentSource.lean"
          lean -o "$root/EvenTerminalArithmetic.olean" "$root/EvenTerminalArithmetic.lean"
          lean -o "$root/EvenSectorLift.olean" "$root/EvenSectorLift.lean"
          lean "$root/EvenSourceCanonical.lean"
          lean "$root/AllEvenDescentSource.lean"
          lean -o "$root/BudgetGrowth.olean" "$root/BudgetGrowth.lean"
          lean "$root/SourceGrowth.lean"
          lean -o "$root/ExceptionalCost.olean" "$root/ExceptionalCost.lean"
          lean -o "$root/ExceptionalSource.olean" "$root/ExceptionalSource.lean"
          lean -o "$root/ExceptionalStrong.olean" "$root/ExceptionalStrong.lean"
          lean -o "$root/ExceptionalStrongSource.olean" "$root/ExceptionalStrongSource.lean"
          lean -o "$root/ExceptionalBudgetSource.olean" "$root/ExceptionalBudgetSource.lean"
          lean -o "$root/ZeroEvenBudgetSource.olean" "$root/ZeroEvenBudgetSource.lean"
          lean -o "$root/ExceptionalGrowthSource.olean" "$root/ExceptionalGrowthSource.lean"
          lean "$root/ExceptionalLogDegreeSource.lean"
          lean -o "$root/UnifiedFeederSource.olean" "$root/UnifiedFeederSource.lean"
          lean -o "$root/AllEvenFeederSource.olean" "$root/AllEvenFeederSource.lean"
          lean "$root/UniformAllEvenFeederSource.lean"
          lean "$root/UniformFeederSource.lean"
          lean -o "$root/ExceptionalExp.olean" "$root/ExceptionalExp.lean"
          lean "$root/ExceptionalExpSource.lean"
          lean -o "$root/ExceptionalLinear.olean" "$root/ExceptionalLinear.lean"
          lean "$root/ExceptionalLinearSource.lean"
          lean -o "$root/ExceptionalNearDouble.olean" "$root/ExceptionalNearDouble.lean"
          lean "$root/ExceptionalNearDoubleSource.lean"
