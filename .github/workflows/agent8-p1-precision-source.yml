name: Agent 8 P1 predicate precision source audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile original P1 and source shadow prerequisites
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent8-p1-precision-source"
          for m in GParity GInverse PosEvenForm ResetGate; do lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean"; done
          for m in P1FiniteInverse P1InverseLog; do lean -o "im-results/agent47-p1-finite-inverse/$m.olean" "im-results/agent47-p1-finite-inverse/$m.lean"; done
          for m in MassInverse OddConeMass; do lean -o "im-results/agent1-p1-quarter/$m.olean" "im-results/agent1-p1-quarter/$m.lean"; done
          for m in P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do lean -o "im-results/agent50-p1-residue/$m.olean" "im-results/agent50-p1-residue/$m.lean"; done
          lean -o im-results/agent4-p1-cone2398/ConeKernel.olean im-results/agent4-p1-cone2398/ConeKernel.lean
          for m in P1Deep2 P1TwoRoot P1TwoFeeder P1TwoIff P1TwoCritical P1TwoSector; do lean -o "im-results/agent45-p1-deep-two/$m.olean" "im-results/agent45-p1-deep-two/$m.lean"; done
          for m in QuarterGap ShortConeGap ShortConeBridge MediumConeGap MediumConeReach; do lean -o "im-results/agent1-p1-quarter/$m.olean" "im-results/agent1-p1-quarter/$m.lean"; done
          for m in ShadowDepthArithmetic ShadowAlgebra ShadowCast ShadowParityArithmetic ShadowDepthSource ShadowSourceTransport ShadowParitySource ShadowSourceStep ShadowConeLift ShadowFeederRoots ShadowGraphBridge ShadowGraphFeeders ShadowQ29Finite ShadowQ29No256 ShadowQ29Graph ShadowQ29DepthArithmetic ShadowQ29DepthSource ShadowFiniteInvariant ShadowNoExceptionalGeneral; do lean -o "im-results/agent9-p1-shadow/$m.olean" "im-results/agent9-p1-shadow/$m.lean"; done
          for m in ShadowDepthBudgetArithmetic ShadowDepthBudgetSource ShadowFiniteBudgetK; do lean -o "im-results/agent9-param-budget/$m.olean" "im-results/agent9-param-budget/$m.lean"; done
      - name: Verify source-connected infinite-predicate theorem
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent8-p1-precision-source"
          lean -o im-results/agent8-p1-precision-source/ShadowPredicateBudgetK.olean im-results/agent8-p1-precision-source/ShadowPredicateBudgetK.lean | tee /tmp/agent8-predicate-audit.log
          if grep -E -q 'sorryAx|error:' /tmp/agent8-predicate-audit.log; then exit 1; fi
          grep -F "source_oddcone_predicate_shadow' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/agent8-predicate-audit.log

      - name: Verify original-source uniform P1 critical-gateway lift
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33:im-results/agent8-p1-precision-source"
          lean -o im-results/agent8-p1-shadow-cylinder/CylinderPower.olean im-results/agent8-p1-shadow-cylinder/CylinderPower.lean
          lean -o im-results/agent9-param-budget/GenericBudgetBlocked.olean im-results/agent9-param-budget/GenericBudgetBlocked.lean
          lean -o im-results/agent9-p1-k10-budget12/GenericShadow41K.olean im-results/agent9-p1-k10-budget12/GenericShadow41K.lean
          lean -o im-results/agent9-p1-q33/GenericCritical41K.olean im-results/agent9-p1-q33/GenericCritical41K.lean
          lean -o im-results/agent9-p1-q33/UniformPrecisionStep.olean im-results/agent9-p1-q33/UniformPrecisionStep.lean
          for m in PredicateList PrecisionLanguage FiniteTransfer; do
            lean -o "im-results/agent8-p1-precision-source/$m.olean" "im-results/agent8-p1-precision-source/$m.lean" | tee -a /tmp/agent8-final-source.log
          done
          lean im-results/agent8-p1-precision-source/UniformP1Gate.lean | tee -a /tmp/agent8-final-source.log
          if grep -E -q 'sorryAx|error:' /tmp/agent8-final-source.log; then exit 1; fi
          grep -F "all_lifted_gateways_excluded' depends on axioms:" /tmp/agent8-final-source.log

      - name: Verify new q41 finite base and source-authentic infinite family
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33:im-results/agent8-p1-precision-source"
          lean -o im-results/agent8-p1-precision-source/UniformP1GateSmall.olean im-results/agent8-p1-precision-source/UniformP1GateSmall.lean | tee /tmp/agent8-q41.log
          lean -o im-results/agent9-p1-q33/Q33Finite.olean im-results/agent9-p1-q33/Q33Finite.lean | tee -a /tmp/agent8-q41.log
          lean im-results/agent8-p1-precision-source/Q41Finite.lean | tee -a /tmp/agent8-q41.log
          if grep -E -q 'sorryAx|error:' /tmp/agent8-q41.log; then exit 1; fi
          grep -F "BB6.Agent8Q41.blank_no_critical_658_plus_2pow39' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/agent8-q41.log
