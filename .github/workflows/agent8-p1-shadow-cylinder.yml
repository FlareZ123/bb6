name: Agent 8 P1 all-r q29 shadow cylinder source audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check unchanged original P1 shadow semantics and infinite q29 cylinder
        run: |
          set -eo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder"
          for m in GParity GInverse; do lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean"; done
          for m in P1FiniteInverse P1InverseLog; do lean -o "im-results/agent47-p1-finite-inverse/$m.olean" "im-results/agent47-p1-finite-inverse/$m.lean"; done
          for m in MassInverse OddConeMass; do lean -o "im-results/agent1-p1-quarter/$m.olean" "im-results/agent1-p1-quarter/$m.lean"; done
          for m in ShadowDepthArithmetic ShadowAlgebra ShadowCast ShadowParityArithmetic ShadowDepthSource ShadowSourceTransport ShadowParitySource ShadowSourceStep ShadowConeLift ShadowFeederRoots ShadowGraphBridge ShadowGraphFeeders ShadowQ29Finite ShadowQ29No256 ShadowQ29Graph ShadowQ29DepthArithmetic ShadowQ29DepthSource ShadowFiniteInvariant ShadowNoExceptionalGeneral ShadowNoExceptionalSource; do
            lean -o "im-results/agent9-p1-shadow/$m.olean" "im-results/agent9-p1-shadow/$m.lean"
          done
          lean im-results/agent9-p1-shadow/ShadowNoExceptionalSource.lean | tee /tmp/audit.log
          lean im-results/agent9-p1-shadow/ShadowQ29FullCone.lean | tee -a /tmp/audit.log
          lean -o im-results/agent8-p1-shadow-cylinder/CylinderArithmetic.olean im-results/agent8-p1-shadow-cylinder/CylinderArithmetic.lean | tee -a /tmp/audit.log
          lean im-results/agent8-p1-shadow-cylinder/CylinderSource.lean | tee -a /tmp/audit.log
          if grep -Fq sorryAx /tmp/audit.log; then exit 1; fi
