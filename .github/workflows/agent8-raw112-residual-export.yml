name: Agent 8 export raw112 partial-audit residual tables
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Successful source-audit run containing the raw112 unresolved.txt artifact'
        required: true
        type: string
        default: '45575393941'
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download source-audit artifact
        uses: actions/download-artifact@v4
        with:
          name: raw112-e1-1lc-partial-bound-100000
          run-id: ${{ inputs.source_run_id }}
          repository: FlareZ123/bb6
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/a47-raw112-artifact
      - name: Extract exact residual tables and preserve as research input
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          candidates = list(Path("/tmp/a47-raw112-artifact").rglob("unresolved.txt"))
          if len(candidates) != 1:
              raise SystemExit(f"expected one unresolved.txt, found {candidates}")
          rows = [x.strip() for x in candidates[0].read_text().splitlines() if x.strip()]
          if len(rows) != 2:
              raise SystemExit(f"expected exactly two residual rows, found {len(rows)}: {rows}")
          parent = "1RB---_1RC---_0RD---_1LD1RE_---1LC_------"
          lines = [
              "# Agent47 raw112 E1=1LC partial-audit residual tables",
              "",
              "These are the two exact residual tables emitted by the deterministic generator and preserved from the original-source audit artifact.",
              "",
              f"- Source workflow run: ${{ inputs.source_run_id }}",
              "- Parent: `" + parent + "`",
              "- Weighted bound in the partial theorem: 100,000",
              "- Residual count: 2",
              "",
          ]
          for i, row in enumerate(rows, 1):
              lines += [f"## Residual {i}", "", f"`{row}`", "", f"SHA-256: `{hashlib.sha256(row.encode()).hexdigest()}`", ""]
          lines += ["These tables are unresolved obligations, not proven nonhalting machines. A full parent bound requires a Cover for each residual.", ""]
          Path("im-results/agent8-tnf-raw117/Agent47Raw112Residuals.md").write_text("\n".join(lines))
          print("\n".join(lines))
          PY
      - name: Commit residual table handoff
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add im-results/agent8-tnf-raw117/Agent47Raw112Residuals.md
          if git diff --cached --quiet; then
            echo "Residual handoff already current."
            exit 0
          fi
          git commit -m "Agent 8: preserve exact raw112 residual tables"
          git pull --rebase origin main
          git push origin HEAD:main
