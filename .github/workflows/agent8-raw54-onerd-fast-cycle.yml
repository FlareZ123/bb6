name: Agent 8 Raw54 1RD fast residual cycle discovery

on:
  workflow_dispatch:

jobs:
  residual_cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: raw54-onerd-generated
          run-id: '46130918355'
          github-token: ${{ github.token }}
          path: /tmp/raw54-onerd-generated
      - name: Exact medium-period side-cycle scan
        run: |
          set -euo pipefail
          D=im-results/agent8-raw54
          g++ -std=c++17 -O3 -DRAW54_LASSO_W=131072 -DRAW54_LASSO_MAXPERIOD=4096 "$D/oneRD_residual_lasso.cpp" -o /tmp/raw54-onerd-lasso
          /tmp/raw54-onerd-lasso /tmp/raw54-onerd-generated/open.txt /tmp/raw54-onerd-lasso.tsv | tee /tmp/raw54-onerd-lasso.log
          grep -q 'total=671' /tmp/raw54-onerd-lasso.log
      - uses: actions/upload-artifact@v4
        with:
          name: raw54-onerd-fast-cycle-discovery
          path: |
            /tmp/raw54-onerd-lasso.tsv
            /tmp/raw54-onerd-lasso.log
          if-no-files-found: error
          retention-days: 90
