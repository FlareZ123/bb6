name: Agent9 source-audited P1 opposite feeder disjointness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile unchanged original P1 dependencies
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33:im-results/agent13-p1-q74-cylinder:im-results/agent13-p1-adaptive-param"
          for m in GParity GInverse PosEvenForm ResetGate; do
            lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean"
          done
          for m in P1FiniteInverse P1InverseLog; do
            lean -o "im-results/agent47-p1-finite-inverse/$m.olean" "im-results/agent47-p1-finite-inverse/$m.lean"
          done
          for m in MassInverse OddConeMass; do
            lean -o "im-results/agent1-p1-quarter/$m.olean" "im-results/agent1-p1-quarter/$m.lean"
          done
          for m in P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do
            lean -o "im-results/agent50-p1-residue/$m.olean" "im-results/agent50-p1-residue/$m.lean"
          done
          lean -o im-results/agent4-p1-cone2398/ConeKernel.olean im-results/agent4-p1-cone2398/ConeKernel.lean
          for m in P1Deep2 P1TwoRoot P1TwoFeeder P1TwoIff P1TwoCritical P1TwoSector; do
            lean -o "im-results/agent45-p1-deep-two/$m.olean" "im-results/agent45-p1-deep-two/$m.lean"
          done
          for m in QuarterGap ShortConeGap ShortConeBridge MediumConeGap MediumConeReach; do
            lean -o "im-results/agent1-p1-quarter/$m.olean" "im-results/agent1-p1-quarter/$m.lean"
          done
          for m in ShadowDepthArithmetic ShadowAlgebra ShadowCast ShadowParityArithmetic ShadowDepthSource ShadowSourceTransport ShadowParitySource ShadowSourceStep ShadowConeLift ShadowFeederRoots ShadowGraphBridge ShadowGraphFeeders ShadowQ29Finite ShadowQ29No256 ShadowQ29Graph ShadowQ29DepthArithmetic ShadowQ29DepthSource ShadowFiniteInvariant ShadowNoExceptionalGeneral; do
            lean -o "im-results/agent9-p1-shadow/$m.olean" "im-results/agent9-p1-shadow/$m.lean"
          done
          lean -o im-results/agent8-p1-shadow-cylinder/CylinderPower.olean im-results/agent8-p1-shadow-cylinder/CylinderPower.lean
          for m in GenericBudgetBlocked ShadowFiniteBudget ShadowDepthBudgetArithmetic ShadowDepthBudgetSource ShadowFiniteBudgetK; do
            lean -o "im-results/agent9-param-budget/$m.olean" "im-results/agent9-param-budget/$m.lean"
          done
          lean -o im-results/agent9-p1-k10-budget12/GenericShadow41K.olean im-results/agent9-p1-k10-budget12/GenericShadow41K.lean
          for m in GenericCritical41K AffineGeneric AffineAdaptive; do
            lean -o "im-results/agent9-p1-q33/$m.olean" "im-results/agent9-p1-q33/$m.lean"
          done
      - name: Compile original precision and arbitrary-budget P1 bridge
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33:im-results/agent13-p1-q74-cylinder:im-results/agent13-p1-adaptive-param"
          for m in UniformPrecisionStep UniformPrecisionPath UniformSourceCone GenericShadowReachParamK GenericCriticalReachParamK; do
            lean -o "im-results/agent9-p1-q33/$m.olean" "im-results/agent9-p1-q33/$m.lean"
          done
      - name: Audit Agent9 arbitrary primitive-depth word theorem against unchanged source ShadowReach
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent9-p1-q33:im-results/agent9-p1-periodic:im-results/agent9-p1-shadow"
          for m in UniformPrecisionStep UniformPrecisionPath; do
            lean -o "im-results/agent9-p1-q33/$m.olean" "im-results/agent9-p1-q33/$m.lean"
          done
          for m in PeriodCore PeriodWord PeriodWordBounds PeriodPigeonhole PeriodCycle PeriodCycleMinimal PeriodRotate PeriodMarker PeriodMarkerMinimal PeriodPrimitive PeriodFinite PeriodFiniteWord PeriodPrimitiveFinite; do
            lean -o "im-results/agent9-p1-periodic/$m.olean" "im-results/agent9-p1-periodic/$m.lean" | tee -a /tmp/agent9-periodic-source-audit.log
          done
          lean -o im-results/agent9-p1-periodic/PeriodSecondary.olean im-results/agent9-p1-periodic/PeriodSecondary.lean | tee -a /tmp/agent9-periodic-source-audit.log
          lean -o im-results/agent9-p1-periodic/PeriodFactorization.olean im-results/agent9-p1-periodic/PeriodFactorization.lean | tee -a /tmp/agent9-periodic-source-audit.log
          lean -o im-results/agent9-p1-periodic/PeriodAllPeriods.olean im-results/agent9-p1-periodic/PeriodAllPeriods.lean | tee -a /tmp/agent9-periodic-source-audit.log
          lean im-results/agent9-p1-periodic/SourcePeriodWord.lean | tee -a /tmp/agent9-periodic-source-audit.log
          lean -o im-results/agent9-p1-periodic/SourcePeriodAllPeriods.olean im-results/agent9-p1-periodic/SourcePeriodAllPeriods.lean | tee -a /tmp/agent9-periodic-source-audit.log
          lean im-results/agent9-p1-periodic/FeederDisjoint.lean | tee -a /tmp/agent9-periodic-source-audit.log
          lean -o im-results/agent9-p1-periodic/OddDifference.olean im-results/agent9-p1-periodic/OddDifference.lean | tee -a /tmp/agent9-periodic-source-audit.log
          lean -o im-results/agent9-p1-periodic/CrossFeederAll.olean im-results/agent9-p1-periodic/CrossFeederAll.lean | tee -a /tmp/agent9-periodic-source-audit.log
          lean -o im-results/agent13-p1-adaptive-param/PrefixCylinder.olean im-results/agent13-p1-adaptive-param/PrefixCylinder.lean | tee -a /tmp/agent9-periodic-source-audit.log
          lean im-results/agent9-p1-periodic/FeederCoding.lean | tee -a /tmp/agent9-periodic-source-audit.log
          grep -F 'no_eventually_periodic_positive_depth' /tmp/agent9-periodic-source-audit.log
          grep -F 'no_eventually_zero_depth' /tmp/agent9-periodic-source-audit.log
          grep -F 'no_eventually_periodic_shadow_path' /tmp/agent9-periodic-source-audit.log
          grep -F 'infinite_feeder_code_unique' /tmp/agent9-periodic-source-audit.log
          grep -F 'no_common_cross_feeder_depth_stream' /tmp/agent9-periodic-source-audit.log
          grep -F 'odd_difference_has_period' /tmp/agent9-periodic-source-audit.log
          grep -F 'same_q_feeder_marker' /tmp/agent9-periodic-source-audit.log
          grep -F 'same_q_feeder_cost_bound' /tmp/agent9-periodic-source-audit.log
          grep -F 'no_common_infinite_feeder_depths' /tmp/agent9-periodic-source-audit.log
          grep -F 'recentered_prefix_identity' /tmp/agent9-periodic-source-audit.log
          grep -F 'recentered_quotient_bounds' /tmp/agent9-periodic-source-audit.log
          grep -F 'zero_run_length_bound' /tmp/agent9-periodic-source-audit.log
          grep -F 'primitive_no_integral_slope' /tmp/agent9-periodic-source-audit.log
          grep -F 'no_infinite_primitive_ray' /tmp/agent9-periodic-source-audit.log
          grep -F 'primitive_finite_bound' /tmp/agent9-periodic-source-audit.log
          grep -F 'run_source_transport' /tmp/agent9-periodic-source-audit.log
          grep -F 'secondary_obstruction' /tmp/agent9-periodic-source-audit.log
          grep -F 'factor_word_of_rotation_period' /tmp/agent9-periodic-source-audit.log
          grep -F 'recentered_step' /tmp/agent9-periodic-source-audit.log
          grep -F 'no_infinite_positive_depth_periodic_ray' /tmp/agent9-periodic-source-audit.log
          grep -F 'no_eventually_periodic_positive_depth_ray' /tmp/agent9-periodic-source-audit.log
          grep -F 'source_periodic_tail_boundaries_reachable' /tmp/agent9-periodic-source-audit.log
          grep -F 'source_no_eventually_periodic_positive_depth_ray' /tmp/agent9-periodic-source-audit.log
          if grep -E -q 'sorryAx|error:' /tmp/agent9-periodic-source-audit.log; then exit 1; fi
