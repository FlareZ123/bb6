name: Agent 9 P1 arbitrary-budget source cone and shadow induction audit
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile completely unchanged original P1 and shadow sources
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget"
          for m in GParity GInverse PosEvenForm ResetGate; do
            echo "ORIGINAL AGENT1 $m"
            lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean"
          done
          for m in P1FiniteInverse P1InverseLog; do
            echo "ORIGINAL AGENT47 $m"
            lean -o "im-results/agent47-p1-finite-inverse/$m.olean" "im-results/agent47-p1-finite-inverse/$m.lean"
          done
          for m in MassInverse OddConeMass; do
            echo "ORIGINAL AGENT1-QUARTER $m"
            lean -o "im-results/agent1-p1-quarter/$m.olean" "im-results/agent1-p1-quarter/$m.lean"
          done
          for m in P1Triple P1ResidualArithmetic P1ResidualReach P1Gate; do
            echo "ORIGINAL AGENT50 $m"
            lean -o "im-results/agent50-p1-residue/$m.olean" "im-results/agent50-p1-residue/$m.lean"
          done
          lean -o im-results/agent4-p1-cone2398/ConeKernel.olean im-results/agent4-p1-cone2398/ConeKernel.lean
          for m in P1Deep2 P1TwoRoot P1TwoFeeder P1TwoIff P1TwoCritical P1TwoSector; do
            echo "ORIGINAL AGENT45 $m"
            lean -o "im-results/agent45-p1-deep-two/$m.olean" "im-results/agent45-p1-deep-two/$m.lean"
          done
          for m in QuarterGap ShortConeGap ShortConeBridge MediumConeGap MediumConeReach; do
            echo "ORIGINAL AGENT1-QUARTER $m"
            lean -o "im-results/agent1-p1-quarter/$m.olean" "im-results/agent1-p1-quarter/$m.lean"
          done
          for m in ShadowDepthArithmetic ShadowAlgebra ShadowCast ShadowParityArithmetic ShadowDepthSource ShadowSourceTransport ShadowParitySource ShadowSourceStep ShadowConeLift ShadowFeederRoots ShadowGraphBridge ShadowGraphFeeders ShadowQ29Finite ShadowQ29No256 ShadowQ29Graph ShadowQ29DepthArithmetic ShadowQ29DepthSource ShadowFiniteInvariant ShadowNoExceptionalGeneral; do
            echo "ORIGINAL AGENT9 $m"
            lean -o "im-results/agent9-p1-shadow/$m.olean" "im-results/agent9-p1-shadow/$m.lean"
          done
      - name: Compile arbitrary-budget genuine-source blocked cone
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget"
          lean -o im-results/agent9-param-budget/GenericBudgetBlocked.olean im-results/agent9-param-budget/GenericBudgetBlocked.lean | tee /tmp/agent9-budget-blocked.log
          if grep -E -q 'sorryAx|error:' /tmp/agent9-budget-blocked.log; then exit 1; fi
          grep -F 'blocked_of_uniform_cone_exit_budget' /tmp/agent9-budget-blocked.log
      - name: Compile arbitrary-budget genuine-source finite shadow lift
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget"
          lean -o im-results/agent9-param-budget/ShadowFiniteBudget.olean im-results/agent9-param-budget/ShadowFiniteBudget.lean | tee /tmp/agent9-budget-shadow.log
          if grep -E -q 'sorryAx|error:' /tmp/agent9-budget-shadow.log; then exit 1; fi
          grep -F 'finite_shadow_invariant_lifts_full_cone_budget' /tmp/agent9-budget-shadow.log
      - name: Compile original-source arbitrary 2-adic inverse-depth bound
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget"
          lean -o im-results/agent9-param-budget/ShadowDepthBudgetArithmetic.olean im-results/agent9-param-budget/ShadowDepthBudgetArithmetic.lean | tee /tmp/agent9-depth-k.log
          lean -o im-results/agent9-param-budget/ShadowDepthBudgetSource.olean im-results/agent9-param-budget/ShadowDepthBudgetSource.lean | tee -a /tmp/agent9-depth-k.log
          if grep -E -q 'sorryAx|error:' /tmp/agent9-depth-k.log; then exit 1; fi
          grep -F 'source_depth_le_K' /tmp/agent9-depth-k.log
      - name: Compile source-complete ten-bit budget-12 generic critical theorem
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12"
          lean -o im-results/agent8-p1-shadow-cylinder/CylinderPower.olean im-results/agent8-p1-shadow-cylinder/CylinderPower.lean | tee /tmp/agent9-k10-12.log
          lean -o im-results/agent9-param-budget/ShadowFiniteBudgetK.olean im-results/agent9-param-budget/ShadowFiniteBudgetK.lean | tee -a /tmp/agent9-k10-12.log
          lean -o im-results/agent9-p1-k10-budget12/GenericShadow12K.olean im-results/agent9-p1-k10-budget12/GenericShadow12K.lean | tee -a /tmp/agent9-k10-12.log
          lean -o im-results/agent9-p1-k10-budget12/GenericCritical12K.olean im-results/agent9-p1-k10-budget12/GenericCritical12K.lean | tee -a /tmp/agent9-k10-12.log
          if grep -E -q 'sorryAx|error:' /tmp/agent9-k10-12.log; then exit 1; fi
          grep -F "critical_unreachable_of_shadow12K' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/agent9-k10-12.log
      - name: Audit experimental high-cost 41 source shadow condition
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12"
          lean -o im-results/agent9-p1-k10-budget12/GenericShadow41K.olean im-results/agent9-p1-k10-budget12/GenericShadow41K.lean | tee /tmp/agent9-cap41.log
          if grep -E -q 'sorryAx|error:' /tmp/agent9-cap41.log; then exit 1; fi
          grep -F 'g1_blocked' /tmp/agent9-cap41.log

      - name: Certify q33 original blank-root P1 critical gateway exclusion
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33"
          lean -o im-results/agent9-p1-q33/Q33Finite.olean im-results/agent9-p1-q33/Q33Finite.lean | tee /tmp/agent9-q33.log
          lean -o im-results/agent9-p1-q33/GenericCritical41K.olean im-results/agent9-p1-q33/GenericCritical41K.lean | tee -a /tmp/agent9-q33.log
          lean im-results/agent9-p1-q33/Q33Final.lean | tee -a /tmp/agent9-q33.log
          if grep -E -q 'sorryAx|error:' /tmp/agent9-q33.log; then exit 1; fi
          grep -F 'blank_no_critical_530' /tmp/agent9-q33.log
      - name: Certify infinite q33 plus 2pow49r authentic P1 gateway exclusion
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33"
          python im-results/agent9-p1-q33/generate_affine_nodes.py
          for m in AffineGeneric Q33AffineNodes Q33Affine; do
            lean -o "im-results/agent9-p1-q33/$m.olean" "im-results/agent9-p1-q33/$m.lean" | tee -a /tmp/agent9-infinite-q33.log
          done
          lean im-results/agent9-p1-q33/Q33CylinderFinal.lean | tee -a /tmp/agent9-infinite-q33.log
          if grep -E -q 'sorryAx|error:' /tmp/agent9-infinite-q33.log; then exit 1; fi
          grep -F 'blank_no_critical_530_plus_2pow53' /tmp/agent9-infinite-q33.log
      - name: Certify source-authentic adaptive q33 plus 2pow40r P1 exclusion
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33"
          python im-results/agent9-p1-q33/generate_adaptive_nodes.py
          for m in AffineAdaptive Q33AdaptiveNodes Q33Adaptive; do
            lean -o "im-results/agent9-p1-q33/$m.olean" "im-results/agent9-p1-q33/$m.lean" | tee -a /tmp/agent9-adaptive-q33.log
          done
          lean im-results/agent9-p1-q33/Q33AdaptiveFinal.lean | tee -a /tmp/agent9-adaptive-q33.log
          if grep -E -q 'sorryAx|error:' /tmp/agent9-adaptive-q33.log; then exit 1; fi
          grep -F 'blank_no_critical_530_plus_2pow44' /tmp/agent9-adaptive-q33.log
      - name: Audit twenty previously uncertified shallow P1 q-residue cylinders
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33"
          python im-results/agent9-p1-q33/generate_shallow_12.py
          lean im-results/agent9-p1-q33/Q12Shallow.lean | tee /tmp/agent9-q12-shallow.log
          if grep -E -q 'sorryAx|error:' /tmp/agent9-q12-shallow.log; then exit 1; fi
          grep -F 'no_critical_q109' /tmp/agent9-q12-shallow.log
          grep -F 'no_critical_q225' /tmp/agent9-q12-shallow.log
      - name: Kernel-check exact 2820 over 4096 source-certified P1 q-gateway census
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent9-p1-q1024-cost11:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33"
          lean -o im-results/agent9-p1-q1024-cost11/DensityCount695.olean im-results/agent9-p1-q1024-cost11/DensityCount695.lean | tee /tmp/agent9-q2812.log
          lean -o im-results/agent9-p1-k10-budget12/DensityCount700.olean im-results/agent9-p1-k10-budget12/DensityCount700.lean | tee -a /tmp/agent9-q2812.log
          lean im-results/agent9-p1-q33/DensityCount2812.lean | tee -a /tmp/agent9-q2812.log
          lean im-results/agent9-p1-q33/DensityCount2820.lean | tee -a /tmp/agent9-q2812.log
          if grep -E -q 'sorryAx|error:' /tmp/agent9-q2812.log; then exit 1; fi
          grep -F 'certified_density_2820' /tmp/agent9-q2812.log
      - name: Check general cost-weighted dyadic precision step in Lean kernel
        run: |
          set -euo pipefail
          lean im-results/agent9-p1-q33/UniformPrecisionStep.lean | tee /tmp/agent9-general-precision.log
          if grep -E -q 'sorryAx|error:' /tmp/agent9-general-precision.log; then exit 1; fi
          grep -F "BB6.Precision.precision_step' depends on axioms: [propext, Quot.sound]" /tmp/agent9-general-precision.log
          grep -F "BB6.Precision.depth_lt_K' depends on axioms: [propext, Quot.sound]" /tmp/agent9-general-precision.log

      - name: Audit original P1 odd-cone to exact unbounded shadow-path transport
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33"
          for m in UniformPrecisionStep UniformPrecisionPath UniformSourceCone; do
            lean -o "im-results/agent9-p1-q33/$m.olean" "im-results/agent9-p1-q33/$m.lean" | tee -a /tmp/agent9-original-source-shadow-reach.log
          done
          if grep -E -q 'sorryAx|error:' /tmp/agent9-original-source-shadow-reach.log; then exit 1; fi
          grep -F 'genuine_cone_shadow_reach' /tmp/agent9-original-source-shadow-reach.log

      - name: Source-check finite-base to infinite-cylinder generic P1 proof
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33"
          for m in UniformReachBounds GenericShadowReach41K GenericCriticalReach41K Q33UniformReachFinal; do
            lean -o "im-results/agent9-p1-q33/$m.olean" "im-results/agent9-p1-q33/$m.lean" | tee -a /tmp/agent9-uniform-source-proof.log
          done
          if grep -E -q 'sorryAx|error:' /tmp/agent9-uniform-source-proof.log; then exit 1; fi
          grep -F 'blank_no_critical_uniform_2pow51' /tmp/agent9-uniform-source-proof.log

      - name: Source-audit universal finite-base to infinite P1 cylinder transfer
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33"
          for m in UniformUniversalCylinder Q33UniversalFinal; do
            lean -o "im-results/agent9-p1-q33/$m.olean" "im-results/agent9-p1-q33/$m.lean" | tee -a /tmp/agent9-universal-cylinder.log
          done
          if grep -E -q 'sorryAx|error:' /tmp/agent9-universal-cylinder.log; then exit 1; fi
          grep -F 'universal_blank_critical_cylinder' /tmp/agent9-universal-cylinder.log
          grep -F 'q33_universal_cylinder' /tmp/agent9-universal-cylinder.log

      - name: Certify new q41 original-root infinite critical gateway class
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33:im-results/agent9-p1-q41"
          lean -o im-results/agent9-p1-q41/Q41Finite.olean im-results/agent9-p1-q41/Q41Finite.lean | tee /tmp/agent9-q41.log
          lean im-results/agent9-p1-q41/Q41Final.lean | tee -a /tmp/agent9-q41.log
          if grep -E -q 'sorryAx|error:' /tmp/agent9-q41.log; then exit 1; fi
          grep -F 'blank_no_critical_658_plus_2pow55' /tmp/agent9-q41.log

      - name: Certify new q53 and q65 original-root gateway cylinders
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-residue:im-results/agent4-p1-cone2398:im-results/agent45-p1-deep-two:im-results/agent9-p1-shadow:im-results/agent8-p1-shadow-cylinder:im-results/agent9-param-budget:im-results/agent9-p1-k10-budget12:im-results/agent9-p1-q33:im-results/agent9-p1-q41"
          for m in Q53Final Q65Final; do
