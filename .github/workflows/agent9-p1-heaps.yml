name: Agent 9 P1 universal two-pile inverse-shadow grammar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check exact scalar-heap bridge and unique-root forest
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent9-p1-binary-heaps"
          lean --version
          lean -o im-results/agent9-p1-binary-heaps/HeapBridge.olean im-results/agent9-p1-binary-heaps/HeapBridge.lean | tee /tmp/heap-proof.log
          lean im-results/agent9-p1-binary-heaps/HeapForest.lean | tee -a /tmp/heap-proof.log
          if grep -E -q 'sorryAx|error:' /tmp/heap-proof.log; then exit 1; fi
          grep -F "heap_edge_predecessor_unique' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/heap-proof.log
          grep -F "diagonal_ancestor_unique' depends on axioms: [propext, Classical.choice, Quot.sound]" /tmp/heap-proof.log
          grep -F "diagonal_ancestor' depends on axioms: [propext, Quot.sound]" /tmp/heap-proof.log
