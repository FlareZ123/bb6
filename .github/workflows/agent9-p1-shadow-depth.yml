          git rev-parse HEAD
          sha256sum "$D/packed_prefix.cpp"
          g++ -O3 -march=native -std=c++17 -fopenmp "$D/packed_prefix.cpp" -o /tmp/packed_prefix
          OMP_NUM_THREADS=1 /tmp/packed_prefix 3342 14000 417 half /tmp/p1-3342-half.chk | tee /tmp/p1-3342-half.log
          grep -F "END 3342 13768" /tmp/p1-3342-half.log
