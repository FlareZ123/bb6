          python tools/lean_compile_deps.py "$D/CarryAperiodicSource.lean" | tee /tmp/carry-period.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/carry-period.log; then exit 1; fi
          python - <<'PY'
          import re
