          set -e
          if [[ "$rc" -eq 1 ]]; then
            grep -Fq "END 45352466 0" /tmp/p1-45352466-half.log
          elif [[ "$rc" -eq 0 ]]; then
            grep -Eq '^END 45352466 [1-9][0-9]*$' /tmp/p1-45352466-half.log
