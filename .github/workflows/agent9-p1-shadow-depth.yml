          log = Path('/tmp/reverse-live.log').read_text()
          for name in ("mem_backY", "mem_reverseLive", "extend_to_DWalk", "reverseLookahead_sound", "dWalk_to_extend", "reverseLive_iff_extend", "reverseLookahead_iff_extend", "covered_next_reverse"):
              m = re.search(r"'BB6\.Agent23ReverseLag\."+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if not m and re.search(r"'BB6\.Agent23ReverseLag\."+re.escape(name)+r"' does not depend on any axioms", log):
                  print(name, [])
                  continue
              if not m:
                  raise SystemExit("Missing axiom profile: "+name)
              axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not axioms <= {"propext", "Classical.choice", "Quot.sound"}:
                  raise SystemExit(f"Unexpected axioms in {name}: {axioms}")
              print(name, sorted(axioms))
          PY

      - name: Check fitted-block delayed-carry Covered integration
        if: inputs.target == 'reverse-live-block'
        run: |
          set -euo pipefail
          D="im-results/agent45-p1-delayed-carry"
          D9="im-results/agent9-p1-reverse-block"
          D23="im-results/agent23-p1-residue-period"
          export LEAN_PATH="$D23:$D9:im-results/agent9-p1-first-return:$D:im-results/agent28-p1-modular-screen:im-results/agent28-p1-delayed-carry"
          lean --version
          git rev-parse HEAD
          python tools/lean_compile_deps.py "$D/ReverseLagBlocks.lean" | tee /tmp/reverse-live-block.log
          python tools/lean_compile_deps.py "$D23/ResiduePeriod.lean" | tee -a /tmp/reverse-live-block.log
          python tools/lean_compile_deps.py "$D9/JumpResidueSource.lean" | tee -a /tmp/reverse-live-block.log
          python tools/lean_compile_deps.py "$D9/JumpResidueReduced.lean" | tee -a /tmp/reverse-live-block.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/reverse-live-block.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/reverse-live-block.log').read_text()
          for name in ("extend_to_walk", "blockLookahead_sound", "covered_next_block", "cert_next_block", "corr_add_bound", "word_near_window", "candidate_unique", "fastWindow_iff_walk"):
              m = re.search(r"'BB6\.Agent45ReverseBlock\."+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if not m and re.search(r"'BB6\.Agent45ReverseBlock\."+re.escape(name)+r"' does not depend on any axioms", log):
                  print(name, [])
                  continue
              if not m:
                  raise SystemExit("Missing axiom profile: "+name)
              axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not axioms <= {"propext", "Classical.choice", "Quot.sound"}:
                  raise SystemExit(f"Unexpected axioms in {name}: {axioms}")
              print(name, sorted(axioms))
          for name in ("mod_sub_residue", "walk_mem_jump", "jumpCandidates_cover", "walk_mem_prefix_live", "trace_prefix_live", "trace_prefix_live_candidates", "digits_lt_two_pow", "walk_of_jump", "jump_iff_walk", "mem_lift_iff_walk"):
              m = re.search(r"'BB6\.Agent9ReverseBlock\."+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if not m and re.search(r"'BB6\.Agent9ReverseBlock\."+re.escape(name)+r"' does not depend on any axioms", log):
                  print(name, [])
                  continue
              if not m:
                  raise SystemExit("Missing axiom profile: "+name)
              axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not axioms <= {"propext", "Classical.choice", "Quot.sound"}:
                  raise SystemExit(f"Unexpected axioms in {name}: {axioms}")
              print(name, sorted(axioms))
          PY

          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/reverse-live-block.log').read_text()
          for name in ("mem_residues_iff", "mem_residuesUnique_iff", "residue_range", "weight_eq_nat", "nat_sub_residue", "mem_lift_iff", "liftResidues_cover"):
              m = re.search(r"'BB6\.Agent9JumpResidue\."+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if not m and re.search(r"'BB6\.Agent9JumpResidue\."+re.escape(name)+r"' does not depend on any axioms", log):
                  print(name, [])
                  continue
              if not m:
                  raise SystemExit("Missing axiom profile: "+name)
              axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not axioms <= {"propext", "Classical.choice", "Quot.sound"}:
                  raise SystemExit(f"Unexpected axioms in {name}: {axioms}")
              print(name, sorted(axioms))
          PY

          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/reverse-live-block.log').read_text()
          for namespace, names in (
              ("BB6.Agent23ResiduePeriod", ("reduce_sound", "final24_reduced", "reduced_weight_iff")),
              ("BB6.Agent9JumpResidue", ("rep_congr", "mem_subsetSums_iff", "reducedExponent_le", "reducedResidues_range", "mem_reducedResidues_iff", "jump_member_iff_reduced", "mem_reducedLift_iff", "reducedLiftResidues_cover", "reducedExponent_final24")),
          ):
              for name in names:
                  m = re.search(r"'" + re.escape(namespace) + r"\." + re.escape(name) + r"' depends on axioms:\s*\[([^\]]*)\]", log)
                  if not m and re.search(r"'" + re.escape(namespace) + r"\." + re.escape(name) + r"' does not depend on any axioms", log):
                      print(namespace, name, [])
                      continue
                  if not m:
                      raise SystemExit("Missing axiom profile: " + namespace + "." + name)
                  axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
                  if not axioms <= {"propext", "Classical.choice", "Quot.sound"}:
                      raise SystemExit(f"Unexpected axioms in {namespace}.{name}: {axioms}")
                  print(namespace, name, sorted(axioms))
          PY

      - name: Check reverse-block digit-weight remainder identity
        if: inputs.target == 'reverse-block-digit-weight'
        run: |
          set -euo pipefail
          D="im-results/agent45-p1-delayed-carry"
          export LEAN_PATH="$D:im-results/agent9-p1-first-return:im-results/agent28-p1-modular-screen:im-results/agent28-p1-delayed-carry"
          lean --version
          git rev-parse HEAD
          python tools/lean_compile_deps.py "$D/ReverseBlockDigitWeight.lean" | tee /tmp/reverse-block-digit-weight.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/reverse-block-digit-weight.log; then exit 1; fi
