          import re
          from pathlib import Path
          log = Path('/tmp/reverse-block-digit-weight.log').read_text()
          for name in ("candidate_window", "candidate_remainder_eq"):
              m = re.search(r"'BB6\.Agent45ReverseBlock\."+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]", log)
