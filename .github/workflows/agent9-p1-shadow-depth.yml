          export LEAN_PATH="$D:im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-dyadic-width:im-results/agent50-p1-residue:im-results/agent9-p1-first-return:im-results/agent45-p1-delayed-carry:im-results/agent28-p1-modular-screen"
