name: Agent9 P1 shadow source audit
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [shadow, first-return, batch-carry, batch-chunks, pair-carry, reverse-live, reverse-live-block, reverse-live-block-30, folded-block-probe, reverse-block-digit-weight, long-cone-lag, forward-block, carry-aperiodic, packed-prefix, packed-prefix-resume, packed-prefix-resume-2, packed-prefix-resume-next, packed-prefix-compact, packed-prefix-fuse-bench, half-reverse-block, packed-midpoint, pair-chunks, pair-sparse, affine-residue, compact-state, shifted-reverse, shifted-simd, pair-path, pair-path-finite, forward-lookup, forward-probe-checkpoint, affine-half, bitmap-jump, affine-suffix, affine-suffix-compute, cyclic-order]
        default: shadow
      source_ref:
        description: Exact source commit (optional; defaults to dispatch SHA)
        type: string
        required: false
      resume_run:
        description: Prior packed-prefix continuation workflow run ID
        type: string
        default: "45917351754"
      resume_k:
        description: New exact packed-prefix cost horizon
        type: string
        default: "650000000"
      pair_lo:
        description: Lower even index for pair-chunks
        type: string
        default: "15002"
      pair_hi:
        description: Upper even index for pair-chunks
        type: string
        default: "22500"
      pair_block:
        description: Number of paired clocks per kernel equality
        type: string
        default: "256"
      pair_group:
        description: Kernel equality count per fresh Lean module
        type: string
        default: "4"
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.target == 'packed-prefix' || inputs.target == 'packed-prefix-resume' || inputs.target == 'packed-prefix-resume-2' || inputs.target == 'packed-prefix-resume-next' || inputs.target == 'packed-prefix-compact' || inputs.target == 'pair-chunks' || inputs.target == 'pair-sparse' || inputs.target == 'pair-path-finite' || inputs.target == 'affine-residue' || inputs.target == 'affine-half') && 90 || 20 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install Lean
        if: inputs.target != 'packed-prefix' && inputs.target != 'packed-prefix-resume' && inputs.target != 'packed-prefix-resume-2' && inputs.target != 'packed-prefix-resume-next' && inputs.target != 'packed-prefix-compact' && inputs.target != 'packed-prefix-fuse-bench' && inputs.target != 'shifted-simd' && inputs.target != 'forward-probe-checkpoint' && inputs.target != 'bitmap-jump' && inputs.target != 'affine-suffix-compute'
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 5 -sSfL https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sed -i 's/curl -sSfL/curl --retry 5 --retry-all-errors --retry-delay 5 -sSfL/g' /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check shifted divisor and greedy high-bit reverse blocks
        if: inputs.target == 'shifted-reverse'
        run: |
          set -euo pipefail
          D=im-results/agent9-p1-reverse-block
          export LEAN_PATH="$D:im-results/agent45-p1-delayed-carry"
          python tools/lean_compile_deps.py "$D/IntegerReciprocal.lean" | tee /tmp/shifted-reverse.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/shifted-reverse.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/shifted-reverse.log').read_text()
          for name in ('corr_shift_bound','shifted_word_near','shiftedFast_iff','corr_adjacent_gap','weight_adjacent','valid_split','greedyFast_iff','greedyFast_iff_walk'):
              decl = "'BB6.Agent9ShiftedReverse."+name+"'"
              m = re.search(re.escape(decl)+r" depends on axioms:\s*\[([^\]]*)\]",log)
              if not m:
                  assert decl+" does not depend on any axioms" in log,decl
                  continue
              assert {x.strip() for x in m.group(1).split(",") if x.strip()} <= {"propext","Classical.choice","Quot.sound"},decl
              
          for name in ('estimate_near','correct_eq'):
              decl = "'BB6.Agent9IntegerReciprocal."+name+"'"
              m = re.search(re.escape(decl)+r" depends on axioms:\s*\[([^\]]*)\]",log)
              if not m:
                  assert decl+" does not depend on any axioms" in log,decl
                  continue
              assert {x.strip() for x in m.group(1).split(",") if x.strip()} <= {"propext","Classical.choice","Quot.sound"},decl
          PY
          g++ -O3 -march=native -std=c++17 "$D/shifted_reverse_test.cpp" -o /tmp/shifted-test
          /tmp/shifted-test
          g++ -O3 -march=native -std=c++17 -fopenmp "$D/compact_prefix.cpp" -o /tmp/p1-shifted
          for mode in 0 1 2 3 4 5 6 7; do
            P1_FIT="$mode" OMP_NUM_THREADS=1 /tmp/p1-shifted 3342 14000 417 half > "/tmp/shifted-$mode.log"
            grep -Fx 'END 3342 13768' "/tmp/shifted-$mode.log"
            grep -E '^CHILD |^END ' "/tmp/shifted-$mode.log" > "/tmp/shifted-$mode.children"
            diff -u /tmp/shifted-0.children "/tmp/shifted-$mode.children"
          done
      - name: Test sixteen-lane integer reverse blocks on AVX-512
        if: inputs.target == 'shifted-simd'
        run: |
          set -euo pipefail
          grep -m1 '^flags' /proc/cpuinfo | grep -qw avx512f
          grep -m1 '^flags' /proc/cpuinfo | grep -qw avx512dq
          D=im-results/agent9-p1-reverse-block
          g++ -O3 -march=native -std=c++17 "$D/shifted_reverse_test.cpp" -o /tmp/shifted-test
          /tmp/shifted-test | tee /tmp/shifted-simd.log
          grep -E 'simd=[1-9][0-9]*' /tmp/shifted-simd.log
          g++ -O3 -march=native -std=c++17 -fopenmp "$D/compact_prefix.cpp" -o /tmp/p1-shifted
          for mode in 6 7; do
            P1_FIT="$mode" OMP_NUM_THREADS=1 /tmp/p1-shifted 3342 14000 417 half > "/tmp/shifted-$mode.log"
            grep -Fx 'END 3342 13768' "/tmp/shifted-$mode.log"
            grep -E '^CHILD |^END ' "/tmp/shifted-$mode.log" > "/tmp/shifted-$mode.children"
          done
          diff -u /tmp/shifted-6.children /tmp/shifted-7.children
      - name: Check exact fixed-width delayed-state equivalence
        if: inputs.target == 'compact-state'
        run: |
          set -euo pipefail
          D=im-results/agent9-p1-reverse-block
          export LEAN_PATH="$D:im-results/agent9-p1-first-return:im-results/agent43-p1-high-cost-reset-count:im-results/agent45-p1-delayed-carry:im-results/agent28-p1-modular-screen:im-results/agent28-p1-delayed-carry:im-results/agent28-p1-full-prefix:im-results/agent28-p1-word-automaton:im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-dyadic-width:im-results/agent50-p1-residue"
          lean --version
          git rev-parse HEAD
          python tools/lean_compile_deps.py "$D/CompactCertificate.lean" | tee /tmp/compact-state.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/compact-state.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/compact-state.log').read_text()
          for ns, names in (("Agent9CompactState", ("project","lift","future_equiv","quotient_lt","quotient_word","fixed_target","top_eq","top_resMin","top_margin")), ("Agent9CompactCover", ("qmargin_next","qcover_next_trace","qcert_next_trace","qcert_shrink","qcert_of_half","qcover_next","queue_margin_sound","qcert_next","qcert_empty")), ("Agent9CompactMidpoint", ("qextend_word","qtarget_shift","qword_shift","qextend_walk","qcode_exact","qlive_of_jump","qmidpoint_cover_of_live","qcert_from_live")), ("Agent9CompactCertificate", ("qcode_source","qtrace_midpoint_of_live","qcert_canonical_live","qcover_empty_midpoint","qcert_empty_live","qcert_first","qcert_n45_first","critical_no_reach_of_qcert","critical_n45_no_reach","qcert_n45_first_u32","critical_n45_no_reach_u32","queue_update","queue_update_split","queue_mul_carry_bound"))):
            for name in names:
              decl = f"'BB6.{ns}.{name}'"
              m = re.search(re.escape(decl) + r" depends on axioms:\s*\[([^\]]*)\]", log)
              if not m:
                  assert decl+" does not depend on any axioms" in log, decl
                  continue
              axioms = {x.strip() for x in m.group(1).split(",") if x.strip()}
              assert axioms <= {"propext","Classical.choice","Quot.sound"}, (decl, axioms)
              print(name, sorted(axioms))
          PY
      - name: Compute deep exact affine support using reusable bitmap plans
        if: inputs.target == 'affine-suffix-compute'
        run: |
          set -euo pipefail
          D=im-results/agent9-p1-first-return
          g++ -O3 -march=native -std=c++17 -fopenmp "$D/affine_suffix.cpp" -o /tmp/affine-suffix
          OMP_NUM_THREADS=2 /tmp/affine-suffix 26 36 38 40 | tee /tmp/affine-suffix-counts.txt
          grep -q 'K 26 k 13 rows 448 count 1891518 ' /tmp/affine-suffix-counts.txt
        # Exact-integer research output, not a kernel certificate.
      - name: Check exact affine prefix suffix reduction
        if: inputs.target == 'affine-suffix'
        run: |
          set -euo pipefail
          D=im-results/agent9-p1-first-return
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-dyadic-width:im-results/agent50-p1-residue:$D"
          python tools/lean_compile_deps.py "$D/AffineSuffixBits.lean" | tee /tmp/affine-suffix.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/affine-suffix.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/affine-suffix.log').read_text()
          for n in ('expr_suffix','suffix_iff','width_pos_iff_suffix','suffixBits_sound','suffixReject_sound','suffixReject_critical','suffixReject_cylinder'):
              hits = re.findall(r"'BB6\.Agent9AffineResidue\."+n+r"' depends on axioms: \[([^\]]*)\]",log,re.S)
              assert len(hits)==1,(n,hits)
              assert {a.strip() for a in hits[0].split(',')} <= {'propext','Classical.choice','Quot.sound'},(n,hits)
          PY
      - name: Check exact infinite dyadic residue support
        if: inputs.target == 'affine-residue' || inputs.target == 'affine-half'
        env:
          AFFINE_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          D=im-results/agent9-p1-first-return
          G="$PWD/.affine-residue"
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-dyadic-width:im-results/agent50-p1-residue:$D:$G"
          lean --version
          git rev-parse HEAD
          EXTRA=(); DEXT=10
          if [[ "$AFFINE_TARGET" == affine-half ]]; then EXTRA+=(--canonical-half); DEXT=12; fi
          python "$D/gen_affine_table.py" 10 "$DEXT" --group 1 --out "$G" "${EXTRA[@]}"
          python tools/lean_compile_deps.py "$G/AffineFinite10_$DEXT.lean" | tee /tmp/affine-residue.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/affine-residue.log; then exit 1; fi
          python - <<'PY'
          import re, os
          from pathlib import Path
          log = Path('/tmp/affine-residue.log').read_text()
          names = ("advance_rep", "rep_unique", "width_pos_iff_nodes", "width_pos_iff_mask", "critical_reset_requires_mask", "table_eq", "residueCount_eq", "mask_eq", "count_exact", "critical_reset_no_reach")
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for n in names:
              hits = re.findall(r"'BB6\.Agent9AffineResidue\.(?:AffineFinite10_(?:10|12)\.)?" + n + r"' depends on axioms: \[([^\]]*)\]", log, re.S)
              assert len(hits)==1, (n,hits)
              axioms = {x.strip() for x in hits[0].split(',') if x.strip()}
              assert axioms <= allowed, (n,axioms)
              print(n, sorted(axioms))
          PY
      - name: Check full original P1 shadow cones, finite q29 certificate
        if: inputs.target == 'shadow'
        run: |
          set -eo pipefail
          : > /tmp/audit.log
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent9-p1-shadow:im-results/agent50-p1-dyadic-width"
          for m in GParity GInverse; do lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean" | tee -a /tmp/audit.log; done
          for m in P1FiniteInverse P1InverseLog; do lean -o "im-results/agent47-p1-finite-inverse/$m.olean" "im-results/agent47-p1-finite-inverse/$m.lean" | tee -a /tmp/audit.log; done
          for m in MassInverse OddConeMass; do lean -o "im-results/agent1-p1-quarter/$m.olean" "im-results/agent1-p1-quarter/$m.lean" | tee -a /tmp/audit.log; done
          for m in ShadowDepthArithmetic ShadowAlgebra ShadowCast ShadowParityArithmetic ShadowDepthSource ShadowSourceTransport ShadowParitySource ShadowSourceStep ShadowConeLift ShadowFeederRoots ShadowGraphBridge ShadowGraphFeeders ShadowGraphConverse ShadowQ29Finite ShadowQ29No256 ShadowQ29Graph ShadowQ29DepthArithmetic ShadowQ29DepthSource ShadowFiniteInvariant ShadowNoExceptionalGeneral ShadowNoExceptionalSource ShadowQ29FullCone; do
            lean -o "im-results/agent9-p1-shadow/$m.olean" "im-results/agent9-p1-shadow/$m.lean" | tee -a /tmp/audit.log
          done
          lean -o "im-results/agent50-p1-dyadic-width/ShadowGraphConverseWide.olean" "im-results/agent50-p1-dyadic-width/ShadowGraphConverseWide.lean" | tee -a /tmp/audit.log
          if grep -Fq sorryAx /tmp/audit.log; then exit 1; fi
      - name: Check exact original P1 first-return equivalence
        if: inputs.target == 'first-return'
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-dyadic-width:im-results/agent50-p1-residue:im-results/agent9-p1-first-return"
          lean --version
          git rev-parse HEAD
          python tools/lean_compile_deps.py im-results/agent9-p1-first-return/PracticalSource.lean | tee /tmp/first-return.log
          if grep -E 'sorryAx|error:' /tmp/first-return.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/first-return.log').read_text()
          names = ("gap_of_oddcone", "oddcone_of_gap", "source_right_five_iff", "critical_right_five_iff", "shadow_bounds", "no_return_shadow", "no_return_before_two_n", "gap_return_at_cost", "source_right_five_shadow_escape", "source_right_five_cost_before_two_n", "source_right_five_cost_log", "source_right_five_cost_four_n", "source_right_five_cost_many", "source_right_five_cost_four_prefix", "source_right_five_n10002_cost", "source_short_margins", "critical_inverse_depth", "short_node_margin", "short_reachable_child", "reachable_critical_has_long_cone", "reachable_reset_has_long_cone", "critical_positive_inverse_depth", "practical_short_margins", "practical_reachable_child", "reachable_first_crossing", "practical_critical_crossing", "practical_reset_crossing")
          renewal = ("cycle_shift", "cycle_range", "cycle_mod", "same_wrap", "early_shadow", "late_shadow", "separate_phase", "numerator_factor", "renewal_block", "numeric_dom", "window_from_scale", "cert0", "cert1", "cert2", "certified_block", "polynomial_scale", "polynomial_block", "three_blocks", "no_return_four_n", "power_linear", "power_lift7", "grid_next", "exp_dom", "coefficient_dom", "generic_scale", "generic_block", "advance_valid", "many_blocks", "no_return_many", "D3_period", "fourth_margin", "fourth_prefix_safe", "no_return_four_prefix", "small_margin", "small_grid_prefix", "small_grid_end", "small_seed_safe", "unit_complement", "run_complement", "short_endpoint_margins", "bernoulli_ratio", "coefficient_monotone")
          names = [("Agent9FirstReturn", name) for name in names] + [("Agent9Renewal", name) for name in renewal]
          for namespace, name in names:
              m = re.search(r"'BB6\."+namespace+r"\."+name+r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if not m and re.search(r"'BB6\."+namespace+r"\."+name+r"' does not depend on any axioms", log):
                  print(name, [])
                  continue
              if not m:
                  raise SystemExit("Missing axiom profile: "+name)
              axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not axioms <= {"propext", "Classical.choice", "Quot.sound"}:
                  raise SystemExit(f"Unexpected axioms in {name}: {axioms}")
              print(name, sorted(axioms))
          PY
      - name: Check common-clock batch carry against original source
        if: inputs.target == 'batch-carry'
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-dyadic-width:im-results/agent50-p1-residue:im-results/agent9-p1-first-return:im-results/agent28-p1-modular-screen:im-results/agent28-p1-delayed-carry"
          lean --version
          git rev-parse HEAD
          python tools/lean_compile_deps.py im-results/agent9-p1-first-return/BatchCarryFinite.lean | tee /tmp/batch-carry.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/batch-carry.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/batch-carry.log').read_text()
          for name in ("walk_of_weight", "weight_of_walk", "edge_iff_parent", "mem_live", "mem_sweep", "mem_batch", "width_pos_iff_center", "critical_reset_no_reach_batch", "critical_reset_no_reach_interval", "bitBack_sound", "scan_sound", "check_absent", "checked_interval", "batch10002_15000", "critical_reset_no_reach_10002_15000"):
              m = re.search(r"'BB6\.Agent9BatchCarry\."+name+r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if not m and re.search(r"'BB6\.Agent9BatchCarry\."+name+r"' does not depend on any axioms", log):
                  print(name, [])
                  continue
              if not m:
                  raise SystemExit("Missing axiom profile: "+name)
              axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not axioms <= {"propext", "Classical.choice", "Quot.sound"}:
                  raise SystemExit(f"Unexpected axioms in {name}: {axioms}")
              print(name, sorted(axioms))
          PY
      - name: Check composable sparse interval certificate
        if: inputs.target == 'batch-chunks'
        run: |
          set -euo pipefail
          D="im-results/agent9-p1-first-return"
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-dyadic-width:im-results/agent50-p1-residue:$D:im-results/agent28-p1-modular-screen:im-results/agent28-p1-delayed-carry"
          lean --version
          git rev-parse HEAD
          python "$D/gen_chunk.py" 15002 22500 --output "$D/ChunkFinite.lean"
          python tools/lean_compile_deps.py "$D/ChunkFinite.lean" | tee /tmp/batch-chunks.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/batch-chunks.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/batch-chunks.log').read_text()
          for name in ("bitRewind_sound", "listScan_sound", "packList_sound", "packed_start", "extend_block", "verified_interval", "critical_reset_no_reach_15002_22500"):
              m = re.search(r"'BB6\.Agent9BatchCarry\."+name+r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if not m and re.search(r"'BB6\.Agent9BatchCarry\."+name+r"' does not depend on any axioms", log):
                  print(name, [])
                  continue
              if not m:
                  raise SystemExit("Missing axiom profile: "+name)
              axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not axioms <= {"propext", "Classical.choice", "Quot.sound"}:
                  raise SystemExit(f"Unexpected axioms in {name}: {axioms}")
              print(name, sorted(axioms))
          PY

      - name: Check reverse-live delayed-carry lookahead
        if: inputs.target == 'reverse-live'
        run: |
          set -euo pipefail
          D="im-results/agent23-p1-reverse-lag"
          export LEAN_PATH="$D:im-results/agent9-p1-first-return:im-results/agent45-p1-delayed-carry:im-results/agent28-p1-modular-screen:im-results/agent28-p1-delayed-carry"
          lean --version
          git rev-parse HEAD
          python tools/lean_compile_deps.py "$D/ReverseLagCore.lean" | tee /tmp/reverse-live.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/reverse-live.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/reverse-live.log').read_text()
          for name in ("mem_backY", "mem_reverseLive", "extend_to_DWalk", "reverseLookahead_sound", "dWalk_to_extend", "reverseLive_iff_extend", "reverseLookahead_iff_extend", "covered_next_reverse"):
              m = re.search(r"'BB6\.Agent23ReverseLag\."+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if not m and re.search(r"'BB6\.Agent23ReverseLag\."+re.escape(name)+r"' does not depend on any axioms", log):
                  print(name, [])
                  continue
              if not m:
                  raise SystemExit("Missing axiom profile: "+name)
              axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not axioms <= {"propext", "Classical.choice", "Quot.sound"}:
                  raise SystemExit(f"Unexpected axioms in {name}: {axioms}")
              print(name, sorted(axioms))
          PY

      - name: Check fitted-block delayed-carry Covered integration
        if: inputs.target == 'reverse-live-block'
        run: |
          set -euo pipefail
          D="im-results/agent45-p1-delayed-carry"
          D9="im-results/agent9-p1-reverse-block"
          D23="im-results/agent23-p1-residue-period"
          export LEAN_PATH="$D23:$D9:im-results/agent9-p1-first-return:$D:im-results/agent28-p1-modular-screen:im-results/agent28-p1-delayed-carry"
          lean --version
          git rev-parse HEAD
          python tools/lean_compile_deps.py "$D/ReverseLagBlocks.lean" | tee /tmp/reverse-live-block.log
          python tools/lean_compile_deps.py "$D23/ResiduePeriod.lean" | tee -a /tmp/reverse-live-block.log
          python tools/lean_compile_deps.py "$D9/JumpResidueSource.lean" | tee -a /tmp/reverse-live-block.log
          python tools/lean_compile_deps.py "$D9/JumpResidueReduced.lean" | tee -a /tmp/reverse-live-block.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/reverse-live-block.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
