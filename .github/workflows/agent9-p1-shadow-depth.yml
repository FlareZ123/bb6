name: Agent9 P1 shadow source audit
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [shadow, first-return, batch-carry, batch-chunks, pair-carry, reverse-live, reverse-live-block, reverse-live-block-30, folded-block-probe, reverse-block-digit-weight, long-cone-lag, forward-block, carry-aperiodic, packed-prefix, packed-prefix-resume, half-reverse-block]
        default: shadow
      source_ref:
        description: Exact source commit (optional; defaults to dispatch SHA)
        type: string
        required: false
permissions:
  actions: read
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.target == 'packed-prefix' || inputs.target == 'packed-prefix-resume') && 90 || 20 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install Lean
        if: inputs.target != 'packed-prefix' && inputs.target != 'packed-prefix-resume'
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 5 -sSfL https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sed -i 's/curl -sSfL/curl --retry 5 --retry-all-errors --retry-delay 5 -sSfL/g' /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check full original P1 shadow cones, finite q29 certificate
        if: inputs.target == 'shadow'
        run: |
          set -eo pipefail
          : > /tmp/audit.log
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent9-p1-shadow:im-results/agent50-p1-dyadic-width"
          for m in GParity GInverse; do lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean" | tee -a /tmp/audit.log; done
          for m in P1FiniteInverse P1InverseLog; do lean -o "im-results/agent47-p1-finite-inverse/$m.olean" "im-results/agent47-p1-finite-inverse/$m.lean" | tee -a /tmp/audit.log; done
          for m in MassInverse OddConeMass; do lean -o "im-results/agent1-p1-quarter/$m.olean" "im-results/agent1-p1-quarter/$m.lean" | tee -a /tmp/audit.log; done
          for m in ShadowDepthArithmetic ShadowAlgebra ShadowCast ShadowParityArithmetic ShadowDepthSource ShadowSourceTransport ShadowParitySource ShadowSourceStep ShadowConeLift ShadowFeederRoots ShadowGraphBridge ShadowGraphFeeders ShadowGraphConverse ShadowQ29Finite ShadowQ29No256 ShadowQ29Graph ShadowQ29DepthArithmetic ShadowQ29DepthSource ShadowFiniteInvariant ShadowNoExceptionalGeneral ShadowNoExceptionalSource ShadowQ29FullCone; do
            lean -o "im-results/agent9-p1-shadow/$m.olean" "im-results/agent9-p1-shadow/$m.lean" | tee -a /tmp/audit.log
          done
          lean -o "im-results/agent50-p1-dyadic-width/ShadowGraphConverseWide.olean" "im-results/agent50-p1-dyadic-width/ShadowGraphConverseWide.lean" | tee -a /tmp/audit.log
          if grep -Fq sorryAx /tmp/audit.log; then exit 1; fi
      - name: Check exact original P1 first-return equivalence
        if: inputs.target == 'first-return'
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-dyadic-width:im-results/agent50-p1-residue:im-results/agent9-p1-first-return"
          lean --version
          git rev-parse HEAD
          python tools/lean_compile_deps.py im-results/agent9-p1-first-return/PracticalSource.lean | tee /tmp/first-return.log
          if grep -E 'sorryAx|error:' /tmp/first-return.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/first-return.log').read_text()
          names = ("gap_of_oddcone", "oddcone_of_gap", "source_right_five_iff", "critical_right_five_iff", "shadow_bounds", "no_return_shadow", "no_return_before_two_n", "gap_return_at_cost", "source_right_five_shadow_escape", "source_right_five_cost_before_two_n", "source_right_five_cost_log", "source_right_five_cost_four_n", "source_right_five_cost_many", "source_right_five_cost_four_prefix", "source_right_five_n10002_cost", "source_short_margins", "critical_inverse_depth", "short_node_margin", "short_reachable_child", "reachable_critical_has_long_cone", "reachable_reset_has_long_cone", "critical_positive_inverse_depth", "practical_short_margins", "practical_reachable_child", "reachable_first_crossing", "practical_critical_crossing", "practical_reset_crossing")
          renewal = ("cycle_shift", "cycle_range", "cycle_mod", "same_wrap", "early_shadow", "late_shadow", "separate_phase", "numerator_factor", "renewal_block", "numeric_dom", "window_from_scale", "cert0", "cert1", "cert2", "certified_block", "polynomial_scale", "polynomial_block", "three_blocks", "no_return_four_n", "power_linear", "power_lift7", "grid_next", "exp_dom", "coefficient_dom", "generic_scale", "generic_block", "advance_valid", "many_blocks", "no_return_many", "D3_period", "fourth_margin", "fourth_prefix_safe", "no_return_four_prefix", "small_margin", "small_grid_prefix", "small_grid_end", "small_seed_safe", "unit_complement", "run_complement", "short_endpoint_margins", "bernoulli_ratio", "coefficient_monotone")
          names = [("Agent9FirstReturn", name) for name in names] + [("Agent9Renewal", name) for name in renewal]
          for namespace, name in names:
              m = re.search(r"'BB6\."+namespace+r"\."+name+r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if not m and re.search(r"'BB6\."+namespace+r"\."+name+r"' does not depend on any axioms", log):
                  print(name, [])
                  continue
              if not m:
                  raise SystemExit("Missing axiom profile: "+name)
              axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not axioms <= {"propext", "Classical.choice", "Quot.sound"}:
                  raise SystemExit(f"Unexpected axioms in {name}: {axioms}")
              print(name, sorted(axioms))
          PY
      - name: Check common-clock batch carry against original source
        if: inputs.target == 'batch-carry'
        run: |
          set -euo pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-dyadic-width:im-results/agent50-p1-residue:im-results/agent9-p1-first-return:im-results/agent28-p1-modular-screen:im-results/agent28-p1-delayed-carry"
          lean --version
          git rev-parse HEAD
          python tools/lean_compile_deps.py im-results/agent9-p1-first-return/BatchCarryFinite.lean | tee /tmp/batch-carry.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/batch-carry.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/batch-carry.log').read_text()
          for name in ("walk_of_weight", "weight_of_walk", "edge_iff_parent", "mem_live", "mem_sweep", "mem_batch", "width_pos_iff_center", "critical_reset_no_reach_batch", "critical_reset_no_reach_interval", "bitBack_sound", "scan_sound", "check_absent", "checked_interval", "batch10002_15000", "critical_reset_no_reach_10002_15000"):
              m = re.search(r"'BB6\.Agent9BatchCarry\."+name+r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if not m and re.search(r"'BB6\.Agent9BatchCarry\."+name+r"' does not depend on any axioms", log):
                  print(name, [])
                  continue
              if not m:
                  raise SystemExit("Missing axiom profile: "+name)
              axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not axioms <= {"propext", "Classical.choice", "Quot.sound"}:
                  raise SystemExit(f"Unexpected axioms in {name}: {axioms}")
              print(name, sorted(axioms))
          PY
      - name: Check composable sparse interval certificate
        if: inputs.target == 'batch-chunks'
        run: |
          set -euo pipefail
          D="im-results/agent9-p1-first-return"
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent50-p1-dyadic-width:im-results/agent50-p1-residue:$D:im-results/agent28-p1-modular-screen:im-results/agent28-p1-delayed-carry"
          lean --version
          git rev-parse HEAD
          python "$D/gen_chunk.py" 15002 22500 --output "$D/ChunkFinite.lean"
          python tools/lean_compile_deps.py "$D/ChunkFinite.lean" | tee /tmp/batch-chunks.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/batch-chunks.log; then exit 1; fi
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/batch-chunks.log').read_text()
          for name in ("bitRewind_sound", "listScan_sound", "packList_sound", "packed_start", "extend_block", "verified_interval", "critical_reset_no_reach_15002_22500"):
              m = re.search(r"'BB6\.Agent9BatchCarry\."+name+r"' depends on axioms:\s*\[([^\]]*)\]", log)
              if not m and re.search(r"'BB6\.Agent9BatchCarry\."+name+r"' does not depend on any axioms", log):
                  print(name, [])
                  continue
              if not m:
                  raise SystemExit("Missing axiom profile: "+name)
              axioms = {a.strip() for a in m.group(1).split(",") if a.strip()}
              if not axioms <= {"propext", "Classical.choice", "Quot.sound"}:
                  raise SystemExit(f"Unexpected axioms in {name}: {axioms}")
              print(name, sorted(axioms))
          PY

      - name: Check reverse-live delayed-carry lookahead
        if: inputs.target == 'reverse-live'
        run: |
          set -euo pipefail
          D="im-results/agent23-p1-reverse-lag"
          export LEAN_PATH="$D:im-results/agent9-p1-first-return:im-results/agent45-p1-delayed-carry:im-results/agent28-p1-modular-screen:im-results/agent28-p1-delayed-carry"
          lean --version
          git rev-parse HEAD
          python tools/lean_compile_deps.py "$D/ReverseLagCore.lean" | tee /tmp/reverse-live.log
          if grep -E 'sorryAx|native_decide|error:' /tmp/reverse-live.log; then exit 1; fi
          python - <<'PY'
          import re
