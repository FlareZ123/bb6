name: Agent9 P1 dyadic shadow original-source audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-odd-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile authentic P1 inverseAt and dyadic source certificate
        run: |
          set -e
          set -o pipefail
          export LEAN_PATH="im-results/agent1-p1-map:im-results/agent47-p1-finite-inverse:im-results/agent1-p1-quarter:im-results/agent9-p1-shadow"
          for m in GParity GInverse; do
            lean -o "im-results/agent1-p1-map/$m.olean" "im-results/agent1-p1-map/$m.lean"
          done
          for m in P1FiniteInverse P1InverseLog; do
            lean -o "im-results/agent47-p1-finite-inverse/$m.olean" "im-results/agent47-p1-finite-inverse/$m.lean"
          done
          lean -o im-results/agent1-p1-quarter/MassInverse.olean im-results/agent1-p1-quarter/MassInverse.lean
          lean -o im-results/agent1-p1-quarter/OddConeMass.olean im-results/agent1-p1-quarter/OddConeMass.lean
          for m in ShadowDepthArithmetic ShadowAlgebra ShadowCast ShadowParityArithmetic; do
            lean -o "im-results/agent9-p1-shadow/$m.olean" "im-results/agent9-p1-shadow/$m.lean"
          done
          for m in ShadowDepthSource ShadowSourceTransport ShadowParitySource; do
            lean -o "im-results/agent9-p1-shadow/$m.olean" "im-results/agent9-p1-shadow/$m.lean"
          done
          lean im-results/agent9-p1-shadow/ShadowSourceStep.lean | tee /tmp/agent9-axioms.log
          if grep -Fq "sorryAx" /tmp/agent9-axioms.log; then
            echo "Rejected: sorryAx in resulting theorem"
            exit 1
          fi
