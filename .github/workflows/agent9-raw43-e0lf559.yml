name: Agent 17 Raw43 E0LF559 full blank-start nonhalting proof
run-name: raw43-e0lf559-never source=${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check the complete residual-559 blank-start recurrence
        run: |
          set -euo pipefail
          root=im-results/agent9-raw43-e0lf559
          work=/tmp/a9-raw43-e0lf559-never
          python im-results/agent13-coverage/unpack.py
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python tools/lean_compile_closure.py --workdir "$work" --jobs 2 \
            --manifest "$work/manifest.json" \
            --label raw43-b1le-e0lf559-never \
            --theorem BB6.Agent17Raw43B1LEE0LFM559.never \
            --artifact-name raw43-b1le-e0lf559-never-proof \
            --source-root "$root" \
            --provenance-input "$root/Raw43B1LEE0LFM559Final.lean" \
            --provenance-input "$root/Raw43B1LEE0LFM559Never.lean" \
            "$root/Raw43B1LEE0LFM559Never.lean" 2>&1 | tee /tmp/a9-raw43-e0lf559-never.log
          python im-results/agent4-raw109/audit_axioms.py \
            /tmp/a9-raw43-e0lf559-final.log \
            BB6.Agent17Raw43B1LEE0LFM559.never
          cp /tmp/a9-raw43-e0lf559-final.log "$work/audit.log"
      - name: Retain exact source closure
        uses: actions/upload-artifact@v4
        with:
          name: raw43-b1le-e0lf559-never-proof
          path: /tmp/a9-raw43-e0lf559-never/
          if-no-files-found: error
          retention-days: 30
