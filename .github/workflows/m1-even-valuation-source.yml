name: M1-even valuation source acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1-even-source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean 4.36.0-rc2
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Compile exact M1-even valuation source import closure
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/lean_compile_closure.py \
            im-results/agent48-counted-inc0/M1EvenValuationSource.lean \
            --workdir /tmp/m1-even-valuation-source \
            --jobs 6 \
            --lean lean 2>&1 | tee /tmp/m1-even-valuation-source.log

          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path("/tmp/m1-even-valuation-source.log").read_text()
          names = [
              "m1EvenValuation_q4_leftFacing",
              "m1EvenValuation_q4_rightShape",
              "m1EvenValuation_reset_prefix_source",
              "m1EvenValuation_counted_increment_source_factorized",
              "m1EvenValuation_counted_increment_source",
          ]

          def axiom_reports(text, theorem):
              token = re.compile(
                  rf"(?<![A-Za-z0-9_]){re.escape(theorem)}(?![A-Za-z0-9_])"
              )
              lines = text.splitlines()
              reports = []
              for i, line in enumerate(lines):
                  if "depends on axioms:" not in line:
                      continue
                  prefix, profile = line.split("depends on axioms:", 1)
                  if not token.search(prefix):
                      continue
                  profile = profile.strip()
                  j = i + 1
                  while "]" not in profile and j < len(lines):
                      if "depends on axioms:" in lines[j]:
                          break
                      profile += "\n" + lines[j].strip()
                      j += 1
                  if "]" not in profile:
                      raise SystemExit(f"incomplete axiom profile for {theorem}: {profile}")
                  reports.append(profile)
              return reports

          # Regression: Lean may wrap an axiom list, so sorryAx on a later
          # line must still fail; a suffixed theorem name must not match.
          wrapped_probe = (
              "'Probe.target' depends on axioms: [propext,\n"
              " sorryAx,\n"
              " Quot.sound]"
          )
          if not any("sorryAx" in p for p in axiom_reports(wrapped_probe, "Probe.target")):
              raise SystemExit("multiline axiom-parser regression failed")
          if axiom_reports(
              "'Probe.target_factorized' depends on axioms: [propext]",
              "Probe.target",
          ):
              raise SystemExit("axiom-parser matched a suffixed theorem name")

          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in names:
              reports = axiom_reports(log, name)
              if not reports:
                  raise SystemExit(f"missing axiom report for {name}")
              for profile in reports:
                  print(f"{name} depends on axioms: {profile}")
                  match = re.search(r"\\[([^\\]]*)\\]", profile, re.S)
                  if not match:
                      raise SystemExit(f"unrecognized axiom profile for {name}: {profile}")
                  axioms = {x.strip() for x in match.group(1).replace("\\n", " ").split(",") if x.strip()}
                  bad = axioms - allowed
                  if bad:
                      raise SystemExit(f"{name} depends on nonstandard axioms: {sorted(bad)}")
                  if "sorryAx" in axioms:
                      raise SystemExit(f"{name} depends on sorryAx")
          print("M1-even valuation source closure: kernel compile and axiom checks passed")
          PY
          if grep -R -n 'native_decide' /tmp/m1-even-valuation-source --include='*.lean'; then
            echo '::error::native_decide found in the exact M1 source closure'
            exit 1
          fi
