name: S4 orbit-cover audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research repository
        uses: actions/checkout@v4
      - name: Audit all S4 images against refinement representatives
        run: |
          python3 im-results/agent44-source-roster/orbit_cover_audit.py \
            im-results/agent13-roster-convergence/canonical-124.json
