name: Shared pinned Cryptids source proof audit (manual)

on:
  workflow_dispatch:
    inputs:
      export_local_source_closure:
        description: 'Export the selected source and compiled import closure for local Lean preflight (skip downstream audits)'
        required: false
        type: boolean
        default: false
      original_module:
        description: 'Original Cryptids module to build (Lean module path)'
        required: true
        type: string
        default: 'BusyBeaver.BB6.M_1RB0LF_1RC1RA_0RD0RB_1LEHHH_0LA1LE_1RD1LA'
      extra_original_module:
        description: 'Optional second original upstream Lean module required by the dependency closure'
        required: false
        type: string
        default: ''
      expose_solution_declarations:
        description: 'Publicly re-export HaltShared and expose target_tm/isVarA_tm plus Solution declarations for exact external audits; definition bodies remain unchanged'
        required: false
        type: boolean
        default: false
      dependency_path:
        description: 'Repo-relative standalone Lean dependency to compile first'
        required: true
        type: string
        default: 'im-results/agent5-429-rank/BB429Burst.lean'
      extra_dependency_path:
        description: 'Optional second repo-relative Lean dependency (compiled after the first)'
        required: false
        type: string
        default: ''
      dependency_manifest:
        description: 'Optional repo-relative .txt manifest of additional Lean dependencies in topological order'
        required: false
        type: string
        default: ''
      upstream_sha:
        description: 'Exact google-deepmind/cryptids commit to check out'
        required: true
        type: string
        default: 'c86f15861709b76042998c5211c7b2f83991621b'
      lean_toolchain:
        description: 'Exact Lean toolchain, e.g. leanprover/lean4:v4.36.0-rc2'
        required: true
        type: string
        default: 'leanprover/lean4:v4.35.0-rc4'
      dependency_version:
        description: 'Matching Mathlib/Verso tag used by the upstream Lake project'
        required: true
        type: string
        default: 'v4.35.0-rc4'
      verify_weighted_tnf_leaves:
        description: 'Also compile six Cryptids nonhalt roots as source-checked WeightedTNFCertificate leaves'
        required: false
        type: boolean
        default: false
      verify_six_root_graft:
        description: 'Compile and axiom-audit the six pinned upstream NonHalt roots grafted into the local depth-four frontier'
        required: false
        type: boolean
        default: false
      simulate_second_f289:
        description: 'Run the deterministic BigInt RLE state/cost candidate on the second live F289 upstream Halt module (not a proof)'
        required: false
        type: boolean
        default: false
      verify_f289_rle_cost:
        description: 'Compile exact ReachesIn primitive-step pilot theorems for both F289 roots'
        required: false
        type: boolean
        default: false
      verify_f289_exact_graft:
        description: 'Extend the six-root audit with exact primitive-step certificates for both F289 halting roots'
        required: false
        type: boolean
        default: false
      bridge_path:
        description: 'Repo-relative Lean source proof importing original module and dependency'
        required: true
        type: string
        default: 'im-results/agent5-429-rank/BB429SourceBridge.lean'

permissions:
  contents: read

jobs:
  original-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORIGINAL_MODULE: ${{ inputs.original_module }}
      EXTRA_ORIGINAL_MODULE: ${{ inputs.extra_original_module }}
      EXPOSE_SOLUTION_DECLARATIONS: ${{ inputs.expose_solution_declarations }}
      DEPENDENCY_PATH: ${{ inputs.dependency_path }}
      BRIDGE_PATH: ${{ inputs.bridge_path }}
      EXTRA_DEPENDENCY_PATH: ${{ inputs.extra_dependency_path }}
      DEPENDENCY_MANIFEST: ${{ inputs.dependency_manifest }}
      UPSTREAM_SHA: ${{ inputs.upstream_sha }}
      LEAN_TOOLCHAIN: ${{ inputs.lean_toolchain }}
      DEPENDENCY_VERSION: ${{ inputs.dependency_version }}
      VERIFY_SIX_ROOT_GRAFT: ${{ inputs.verify_six_root_graft }}
      VERIFY_WEIGHTED_TNF_LEAVES: ${{ inputs.verify_weighted_tnf_leaves }}
      SIMULATE_SECOND_F289: ${{ inputs.simulate_second_f289 }}
      VERIFY_F289_RLE_COST: ${{ inputs.verify_f289_rle_cost }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate manual inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ORIGINAL_MODULE" =~ ^[A-Za-z0-9_.]+$ ]]
          if [[ -n "$EXTRA_ORIGINAL_MODULE" ]]; then
            [[ "$EXTRA_ORIGINAL_MODULE" =~ ^[A-Za-z0-9_.]+$ ]]
            test "$EXTRA_ORIGINAL_MODULE" != "$ORIGINAL_MODULE"
          fi
          [[ "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$LEAN_TOOLCHAIN" =~ ^leanprover/lean4:v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]
          [[ "$DEPENDENCY_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]
          for p in "$DEPENDENCY_PATH" "$BRIDGE_PATH"; do
            [[ "$p" =~ ^im-results/[A-Za-z0-9_./-]+\.lean$ ]]
            [[ "$p" != *..* ]]
            test -f "$p"
          done
          test "$DEPENDENCY_PATH" != "$BRIDGE_PATH"
          if [[ -n "$EXTRA_DEPENDENCY_PATH" ]]; then
            [[ "$EXTRA_DEPENDENCY_PATH" =~ ^im-results/[A-Za-z0-9_./-]+\.lean$ ]]
            [[ "$EXTRA_DEPENDENCY_PATH" != *..* ]]
            test -f "$EXTRA_DEPENDENCY_PATH"
            test "$EXTRA_DEPENDENCY_PATH" != "$DEPENDENCY_PATH"
            test "$EXTRA_DEPENDENCY_PATH" != "$BRIDGE_PATH"
          fi
          if [[ -n "$DEPENDENCY_MANIFEST" ]]; then
            [[ "$DEPENDENCY_MANIFEST" =~ ^im-results/[A-Za-z0-9_./-]+\.txt$ ]]
            [[ "$DEPENDENCY_MANIFEST" != *..* ]]
            test -f "$DEPENDENCY_MANIFEST"
            test "$VERIFY_SIX_ROOT_GRAFT" != "true"
            test "$SIMULATE_SECOND_F289" != "true"
            test "$VERIFY_F289_RLE_COST" != "true"
            declare -A seen_modules=()
            for p in "$DEPENDENCY_PATH" "$EXTRA_DEPENDENCY_PATH" "$BRIDGE_PATH"; do
              [[ -n "$p" ]] || continue
              name="$(basename "$p")"
              [[ -z "${seen_modules[$name]+x}" ]]
              seen_modules[$name]=1
            done
            count=0
            while IFS= read -r p || [[ -n "$p" ]]; do
              [[ "$p" =~ ^im-results/[A-Za-z0-9_./-]+\.lean$ ]]
              [[ "$p" != *..* ]]
              test -f "$p"
              name="$(basename "$p")"
              [[ -z "${seen_modules[$name]+x}" ]]
              seen_modules[$name]=1
              count=$((count+1))
              [[ "$count" -le 32 ]]
            done < "$DEPENDENCY_MANIFEST"
          fi
          if [[ "${{ inputs.verify_f289_exact_graft }}" == "true" ]]; then
            test "$VERIFY_SIX_ROOT_GRAFT" = "true"
          fi
          if [[ "$VERIFY_WEIGHTED_TNF_LEAVES" == "true" ]]; then
            test "$VERIFY_SIX_ROOT_GRAFT" = "true"
            test "$UPSTREAM_SHA" = "3647718b5df22e1a61462dec0376bd204526285a"
            test "$LEAN_TOOLCHAIN" = "leanprover/lean4:v4.36.0-rc2"
            test "$DEPENDENCY_VERSION" = "v4.36.0-rc2"
          fi
          if [[ "$VERIFY_SIX_ROOT_GRAFT" == "true" ]]; then
            test "$ORIGINAL_MODULE" = "BusyBeaver.Bridge"
            test "$EXTRA_ORIGINAL_MODULE" = "Cryptids.Machines"
            test "$UPSTREAM_SHA" = "3647718b5df22e1a61462dec0376bd204526285a"
            test "$LEAN_TOOLCHAIN" = "leanprover/lean4:v4.36.0-rc2"
            test "$DEPENDENCY_VERSION" = "v4.36.0-rc2"
            test "$BRIDGE_PATH" = "im-results/agent42-cryptids-current-main/Cryptids608NonHalt.lean"
          fi
          if [[ "$VERIFY_SIX_ROOT_GRAFT" == "true" && "$SIMULATE_SECOND_F289" == "true" ]] || \
             [[ "$VERIFY_SIX_ROOT_GRAFT" == "true" && "$VERIFY_F289_RLE_COST" == "true" ]] || \
             [[ "$SIMULATE_SECOND_F289" == "true" && "$VERIFY_F289_RLE_COST" == "true" ]]; then
            echo "::error::select only one targeted mode"
            exit 1
          fi
          if [[ "$SIMULATE_SECOND_F289" == "true" ]]; then
            test "$UPSTREAM_SHA" = "3647718b5df22e1a61462dec0376bd204526285a"
          fi
          if [[ "$VERIFY_F289_RLE_COST" == "true" ]]; then
            test "$ORIGINAL_MODULE" = "BusyBeaver.BB6.Halt.M_1RB0RE_1RC0RA_0LD0LB_0LA1LE_1LC1LF_0LAHHH"
            test "$EXTRA_ORIGINAL_MODULE" = "BusyBeaver.BB6.Halt.M_1RB1RF_0RC0RE_0RD1RA_1LE0LA_1LB0LD_0RDHHH"
            test "$UPSTREAM_SHA" = "3647718b5df22e1a61462dec0376bd204526285a"
            test "$LEAN_TOOLCHAIN" = "leanprover/lean4:v4.36.0-rc2"
            test "$DEPENDENCY_VERSION" = "v4.36.0-rc2"
          fi
      - name: Install original Cryptids Lean version
        if: ${{ !inputs.simulate_second_f289 }}
        shell: bash
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain "$LEAN_TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Clone exact upstream source
        shell: bash
        run: |
          git clone --quiet https://github.com/google-deepmind/cryptids.git /tmp/cryptids
          git -C /tmp/cryptids checkout --quiet "$UPSTREAM_SHA"
          test "$(git -C /tmp/cryptids rev-parse HEAD)" = "$UPSTREAM_SHA"
      - name: Simulate second F289 RLE cost candidate (computational evidence only)
        if: ${{ inputs.simulate_second_f289 }}
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node "$GITHUB_WORKSPACE/im-results/agent42-cryptids-upstream-191-overlap/simulate_f289_rle.js" \
            "$PWD/BusyBeaver/BB6/Halt/M_1RB1RF_0RC0RE_0RD1RA_1LE0LA_1LB0LD_0RDHHH.lean" \
            | tee "$RUNNER_TEMP/f289-second-rle-candidate.json"
          sha256sum "$RUNNER_TEMP/f289-second-rle-candidate.json"
      - name: Upload second F289 RLE candidate output
        if: ${{ inputs.simulate_second_f289 }}
        uses: actions/upload-artifact@v4
        with:
          name: f289-second-rle-candidate
          path: ${{ runner.temp }}/f289-second-rle-candidate.json
          if-no-files-found: error
      - name: Reclaim unused hosted-runner disk for Mathlib cache
        if: ${{ !inputs.simulate_second_f289 }}
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift /usr/local/share/powershell
          df -h
      - name: Align upstream Lake dependencies with selected Lean toolchain
        if: ${{ !inputs.simulate_second_f289 }}
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$LEAN_TOOLCHAIN" > lean-toolchain
          if [[ "$DEPENDENCY_VERSION" != "v4.35.0-rc4" ]]; then
            sed -i "s/v4.35.0-rc4/$DEPENDENCY_VERSION/g" lakefile.toml
            rm -f lake-manifest.json
            lake update
          fi
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"
      - name: Restore upstream cache
        if: ${{ !inputs.simulate_second_f289 }}
        working-directory: /tmp/cryptids
        shell: bash
        run: lake exe cache get
      - name: Expose original private target and solution declarations and imports
        if: ${{ !inputs.simulate_second_f289 && inputs.expose_solution_declarations }}
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          for module in "$ORIGINAL_MODULE" "$EXTRA_ORIGINAL_MODULE"; do
            [[ -n "$module" ]] || continue
            source_path="${module//.//}.lean"
            python3 - "$source_path" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          private_import = "import BusyBeaver.Calculi.HaltShared\n"
          public_import = "public import BusyBeaver.Calculi.HaltShared\n"
          if source.count(private_import) != 1:
              raise SystemExit(f"expected one private HaltShared import in {path}")
          source = source.replace(private_import, public_import, 1)
          target_marker = "abbrev target_tm : Machine (Fin 2) (Fin 6) := target\n"
          if source.count(target_marker) != 1:
              raise SystemExit(f"expected one target_tm abbreviation in {path}")
          target_start = source.index(target_marker)
          source = source[:target_start] + "@[expose] public section\n" + source[target_start:]
          marker = "namespace Solution\n"
          if source.count(marker) != 1:
              raise SystemExit(f"expected one Solution namespace in {path}")
          solution_start = source.index(marker, target_start)
          source = source[:solution_start] + "end\n\n" + source[solution_start:]
          start = solution_start + len("end\n\n") + len(marker)
          if source[start:].startswith("@[expose] public section\n"):
              raise SystemExit(f"already exposed: {path}")
          end_marker = "\nend Solution\n"
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit(f"missing end Solution in {path}")
          source = source[:start] + "@[expose] public section\n" + source[start:end] + "\nend" + source[end:]
          path.write_text(source)
          print(f"exposed Solution declarations in {path}; definitions unchanged")
          PY
          done
      - name: Export selected source and compiled import closure
        if: ${{ inputs.export_local_source_closure }}
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          printf 'import BusyBeaver.Basic\nimport BusyBeaver.Bridge\nimport Lean\nopen Lean Elab Command in\nrun_cmd do\n  let env ← getEnv\n  for m in env.header.moduleNames do\n    liftIO <| IO.println s!"IMPORT {m}"\n' > ExportDeps.lean
          lake build BusyBeaver.Basic BusyBeaver.Bridge
          lake env lean ExportDeps.lean | grep '^IMPORT ' > /tmp/source-imports.txt
          lake env python3 "$GITHUB_WORKSPACE/im-results/agent48-f067/export_closure.py" /tmp/source-imports.txt "$ORIGINAL_MODULE"
      - name: Split compile environment for artifact connector size limit
        if: ${{ inputs.export_local_source_closure }}
        run: |
          split -b 128M -d -a 2 /tmp/lean-local-source-closure.tar.zst /tmp/lean-closure-part-
          test ! -e /tmp/lean-closure-part-12
          sha256sum /tmp/lean-local-source-closure.tar.zst > /tmp/lean-closure.sha256
      - name: Upload selected original source
        if: ${{ inputs.export_local_source_closure }}
        uses: actions/upload-artifact@v4
        with:
          name: original-lean-source
          path: /tmp/cryptids/BusyBeaver/BB6/Halt/*.lean
          if-no-files-found: ignore
      - name: Upload local closure chunk 00
        if: ${{ inputs.export_local_source_closure }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-local-source-closure-00
          path: /tmp/lean-closure-part-00
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload local closure chunk 01
        if: ${{ inputs.export_local_source_closure }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-local-source-closure-01
          path: /tmp/lean-closure-part-01
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload local closure chunk 02
        if: ${{ inputs.export_local_source_closure }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-local-source-closure-02
          path: /tmp/lean-closure-part-02
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload local closure chunk 03
        if: ${{ inputs.export_local_source_closure }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-local-source-closure-03
          path: /tmp/lean-closure-part-03
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload local closure chunk 04
        if: ${{ inputs.export_local_source_closure }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-local-source-closure-04
          path: /tmp/lean-closure-part-04
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload local closure chunk 05
        if: ${{ inputs.export_local_source_closure }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-local-source-closure-05
          path: /tmp/lean-closure-part-05
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload local closure chunk 06
        if: ${{ inputs.export_local_source_closure }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-local-source-closure-06
          path: /tmp/lean-closure-part-06
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload local closure chunk 07
        if: ${{ inputs.export_local_source_closure }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-local-source-closure-07
          path: /tmp/lean-closure-part-07
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload local closure chunk 08
        if: ${{ inputs.export_local_source_closure }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-local-source-closure-08
          path: /tmp/lean-closure-part-08
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload local closure chunk 09
        if: ${{ inputs.export_local_source_closure }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-local-source-closure-09
          path: /tmp/lean-closure-part-09
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload local closure chunk 10
        if: ${{ inputs.export_local_source_closure }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-local-source-closure-10
          path: /tmp/lean-closure-part-10
          compression-level: 0
          if-no-files-found: ignore
      - name: Upload local closure chunk 11
        if: ${{ inputs.export_local_source_closure }}
        uses: actions/upload-artifact@v4
        with:
          name: lean-local-source-closure-11
          path: /tmp/lean-closure-part-11
          compression-level: 0
          if-no-files-found: ignore
      - name: Compile original raw-TM acceleration
        if: ${{ !inputs.export_local_source_closure && !inputs.simulate_second_f289 }}
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          lake build "$ORIGINAL_MODULE"
          if [[ -n "$EXTRA_ORIGINAL_MODULE" ]]; then
            lake build "$EXTRA_ORIGINAL_MODULE"
          fi
      - name: Compile F289 exact primitive-step pilot
        if: ${{ inputs.verify_f289_rle_cost }}
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p BB6Agent42
          cp "$GITHUB_WORKSPACE/im-results/agent42-cryptids-upstream-191-overlap/RleCostedStepPilot.lean" BB6Agent42/
          LEAN_PATH=BB6Agent42 lake env lean -o BB6Agent42/RleCostedStepPilot.olean BB6Agent42/RleCostedStepPilot.lean 2>&1 | tee "$RUNNER_TEMP/f289-cost-pilot.log"
          if grep -Eq 'sorryAx|native_decide' "$RUNNER_TEMP/f289-cost-pilot.log"; then
            echo "::error::F289 exact-step pilot contains a prohibited axiom or native_decide"
            exit 1
          fi
      - name: Compile six-root Cryptids frontier graft (explicitly requested only)
        if: ${{ inputs.verify_six_root_graft && !inputs.simulate_second_f289 }}
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          lake build \
            BusyBeaver.BB6.NonHalt.M_1RB0LC_1LC0RB_0LE0LD_1LCHHH_0RA1LF_1LA1LF \
            BusyBeaver.BB6.NonHalt.M_1RB0RA_0RC0LD_1LA1RF_1LE1LD_1LB1RE_HHH1RA \
            BusyBeaver.BB6.NonHalt.M_1RB0RA_0RC0LE_1LD1RF_1LB1RD_1LD1LE_HHH1RA \
            BusyBeaver.BB6.NonHalt.M_1RB0RA_1RC0LC_0LD1RF_1RA1LE_1LD0LB_0REHHH \
            BusyBeaver.BB6.NonHalt.M_1RB1RA_0LC0RA_1RC1LD_0LB1LE_1LF0RC_HHH0LD \
            BusyBeaver.BB6.NonHalt.M_1RB1RA_1RC1LB_0LD0RA_1RF1LE_HHH1LF_1LC0LF
          mkdir -p BB6Agent42
          cp "$GITHUB_WORKSPACE/im-results/agent8-coverage-contract/Frontier.lean" BB6Agent42/
          for m in RayClosed RayChecker RayEntry RayFinite RayTurnExample RayFiniteOracle FiniteHalting Symmetry ZeroMaskOracle FiniteDecision; do
            cp "$GITHUB_WORKSPACE/im-results/agent8-coverage-contract/$m.lean" BB6Agent42/
          done
          for m in RayMacro EntryMacroOracle EntryMacroLeft; do
            cp "$GITHUB_WORKSPACE/im-results/agent6-fresh-glider/$m.lean" BB6Agent42/
          done
          cp "$GITHUB_WORKSPACE/im-results/agent44-drift-closure/DirectedDrift.lean" BB6Agent42/
          for m in FrontierAudit FrontierMass FrontierExtract FrontierUnique FrontierManifestMass RelativeTape CryptidsTapeAdapter; do
            cp "$GITHUB_WORKSPACE/im-results/agent4-coverage-smoke/$m.lean" BB6Agent42/
          done
          for m in ZeroPathAudit ControlPathAudit ZeroRowAudit PhysicalTraceAudit FiniteLassoOracle LassoTraceAudit ResidualFrontierManifest; do
            cp "$GITHUB_WORKSPACE/im-results/agent32-zero-prefix-global/$m.lean" BB6Agent42/
          done
          cp "$GITHUB_WORKSPACE/im-results/agent8-coverage-contract/IncrementalAudit.lean" BB6Agent42/
          cp "$GITHUB_WORKSPACE/$BRIDGE_PATH" BB6Agent42/Cryptids608NonHalt.lean
          export LEAN_PATH=BB6Agent42
          for m in Frontier RayClosed RayChecker RayEntry RayFinite RayTurnExample RayFiniteOracle FiniteHalting Symmetry RayMacro EntryMacroOracle EntryMacroLeft DirectedDrift ZeroMaskOracle FiniteDecision FrontierAudit FrontierMass ZeroPathAudit ControlPathAudit ZeroRowAudit PhysicalTraceAudit FiniteLassoOracle LassoTraceAudit FrontierExtract FrontierUnique FrontierManifestMass ResidualFrontierManifest IncrementalAudit RelativeTape CryptidsTapeAdapter; do
            lake env lean -o "BB6Agent42/$m.olean" "BB6Agent42/$m.lean"
          done
          mkdir -p /tmp/cryptids-source-audit
          graft_log=/tmp/cryptids-source-audit/Cryptids608NonHalt.log
          lake env lean -o BB6Agent42/Cryptids608NonHalt.olean BB6Agent42/Cryptids608NonHalt.lean 2>&1 | tee "$graft_log"
          if grep -Eq 'sorryAx|native_decide' "$graft_log"; then
            echo "::error::six-root graft proof graph depends on sorryAx or native_decide"
            exit 1
          fi
          echo "Six-root graft compiled; no sorryAx in exported axiom profiles."
      - name: Compile six Cryptids roots as weighted-TNF nonhalt leaves
        if: ${{ inputs.verify_six_root_graft && inputs.verify_weighted_tnf_leaves }}
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python im-results/agent13-coverage/unpack.py
          cd /tmp/cryptids
          cp "$GITHUB_WORKSPACE/im-results/agent8-coverage-contract/RootShift.lean" BB6Agent42/
          cp "$GITHUB_WORKSPACE/im-results/agent8-coverage-contract/Prune.lean" BB6Agent42/
          cp "$GITHUB_WORKSPACE/im-results/agent8-coverage-contract/OneHalt.lean" BB6Agent42/
          cp "$GITHUB_WORKSPACE/im-results/agent42-coverage-normal/FirstStep.lean" BB6Agent42/
          cp "$GITHUB_WORKSPACE/im-results/agent42-coverage-normal/TwoFirst.lean" BB6Agent42/
