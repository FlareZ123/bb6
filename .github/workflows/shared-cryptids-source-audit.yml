            opts=()
            if [[ "$m" == RleCountedRoots ]]; then opts=(-j 1 -s 131072); fi
            lake env lean "${opts[@]}" -o "BB6Agent42/$m.olean" "BB6Agent42/$m.lean" 2>&1 | tee "$log"
