      - name: Prove against unchanged source definitions and audit axioms
        if: ${{ !inputs.export_local_source_closure && !inputs.verify_six_root_graft && !inputs.simulate_second_f289 && !inputs.verify_f289_rle_cost }}
        working-directory: /tmp/cryptids
        shell: bash
        run: |
          set -euo pipefail
          dependency_base="$(basename "$DEPENDENCY_PATH")"
          bridge_base="$(basename "$BRIDGE_PATH")"
          cp "$GITHUB_WORKSPACE/$DEPENDENCY_PATH" "$dependency_base"
          cp "$GITHUB_WORKSPACE/$BRIDGE_PATH" "$bridge_base"
          mkdir -p /tmp/cryptids-source-audit
          dep_log="/tmp/cryptids-source-audit/$dependency_base.log"
          lake env lean -o ".lake/build/lib/lean/${dependency_base%.lean}.olean" "$dependency_base" 2>&1 | tee "$dep_log"
          if grep -qE 'sorryAx|native_decide' "$dep_log"; then
            echo "::error::forbidden axiom or native_decide in $dependency_base"
            exit 1
          fi
          if [[ -n "$EXTRA_DEPENDENCY_PATH" ]]; then
            extra_base="$(basename "$EXTRA_DEPENDENCY_PATH")"
            cp "$GITHUB_WORKSPACE/$EXTRA_DEPENDENCY_PATH" "$extra_base"
            extra_log="/tmp/cryptids-source-audit/$extra_base.log"
            lake env lean -o ".lake/build/lib/lean/${extra_base%.lean}.olean" "$extra_base" 2>&1 | tee "$extra_log"
            if grep -qE 'sorryAx|native_decide' "$extra_log"; then
              echo "::error::forbidden axiom or native_decide in $extra_base"
              exit 1
            fi
          fi
          if [[ -n "$DEPENDENCY_MANIFEST" ]]; then
            while IFS= read -r p || [[ -n "$p" ]]; do
              additional_base="$(basename "$p")"
              cp "$GITHUB_WORKSPACE/$p" "$additional_base"
              additional_log="/tmp/cryptids-source-audit/$additional_base.log"
              lake env lean -o ".lake/build/lib/lean/${additional_base%.lean}.olean" "$additional_base" 2>&1 | tee "$additional_log"
              if grep -qE 'sorryAx|native_decide' "$additional_log"; then
                echo "::error::forbidden axiom or native_decide in $additional_base"
                exit 1
              fi
            done < "$GITHUB_WORKSPACE/$DEPENDENCY_MANIFEST"
          fi
          bridge_log="/tmp/cryptids-source-audit/$bridge_base.log"
          lake env lean -o ".lake/build/lib/lean/${bridge_base%.lean}.olean" "$bridge_base" 2>&1 | tee "$bridge_log"
          if grep -qE 'sorryAx|native_decide' "$bridge_log"; then
            echo "::error::forbidden axiom or native_decide in $bridge_base"
            exit 1
          fi
