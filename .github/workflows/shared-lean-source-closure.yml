name: Shared pinned standalone Lean source-closure audit (manual)
run-name: "Lean closure: ${{ inputs.root }}"

on:
  workflow_dispatch:
    inputs:
      root:
        description: "Existing repository Lean root under im-results (no generated imports)"
        type: string
        required: true
        default: "im-results/agent42-raw40-crossing-splice/Raw40CrossingLeaves.lean"
      theorem_suffix:
        description: "Only axiom-audit printed theorem names ending in this suffix"
        type: string
        required: true
        default: ".never"
      minimum_theorems:
        description: "Minimum distinct printed target declarations required"
        type: number
        required: true
        default: 23

      preparation_profile:
        description: "Optional deterministic source preparation for an existing family consumer"
        type: choice
        options: ["none", "coverage-generators", "raw40-a0la", "raw40-a0la-complete", "raw40-round4", "raw40-round5", "raw40-a1lc-enumerate", "raw40-a1lc-child", "q0151-macro", "raw10-i-stream"]
        default: "none"
      raw40_child:
        description: "Raw40 A1=0LA C1 source-child selection when preparation_profile=raw40-a0la"
        type: choice
        options: ["0LE", "0RB", "0RD", "0RE", "1LA", "1LB", "1LC", "1LE", "1RB", "1RC", "1RE"]
        default: "1RB"

permissions:
  contents: write

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate the exact chosen source
        env:
          PROOF_ROOT: ${{ inputs.root }}
          SUFFIX: ${{ inputs.theorem_suffix }}
          MIN_THEOREMS: ${{ inputs.minimum_theorems }}
          PREPARATION_PROFILE: ${{ inputs.preparation_profile }}
          RAW40_CHILD: ${{ inputs.raw40_child }}
        run: |
          set -euo pipefail
          [[ "$PROOF_ROOT" =~ ^im-results/[a-zA-Z0-9_./-]+\.lean$ ]]
          [[ "$PROOF_ROOT" != *..* ]]
          if [[ "$PREPARATION_PROFILE" == "none" || "$PREPARATION_PROFILE" == "coverage-generators" ]]; then
            test -f "$PROOF_ROOT"
          elif [[ "$PREPARATION_PROFILE" == "raw10-i-stream" ]]; then
            case "$PROOF_ROOT" in
              im-results/agent13-raw10-box33/Box33D17V12IEntry.lean|im-results/agent13-raw10-box33/Box33D17V12IAll.lean|im-results/agent13-raw10-box33/Box33D17V12IRegularToggle.lean|im-results/agent13-raw10-box33/Box33D17V12ICarryScan.lean|im-results/agent13-raw10-box33/Box33D17V12IStartup.lean) ;;
              *) echo "Unsupported Raw10 I root: $PROOF_ROOT"; exit 1 ;;
            esac
            test -f "$PROOF_ROOT"
            test -f im-results/agent13-raw10-box33/unpack_i_rules.py
          elif [[ "$PREPARATION_PROFILE" == "q0151-macro" ]]; then
            case "$PROOF_ROOT" in
              im-results/agent5-weighted-tnf-queue/Q0151FiniteCertificate.lean|im-results/agent5-weighted-tnf-queue/Q0151AbstractConcreteBridge.lean|im-results/agent5-weighted-tnf-queue/Q0151GoodEmptyRight.lean|im-results/agent5-weighted-tnf-queue/Q0151RegionLift.lean|im-results/agent5-weighted-tnf-queue/Q0151FullCover.lean) ;;
              *) echo "Unapproved q0151-macro root: $PROOF_ROOT"; exit 1 ;;
            esac
            test -f im-results/agent5-weighted-tnf-queue/generate_q151_finite.py
          elif [[ "$PREPARATION_PROFILE" == "raw40-round4" ]]; then
            test "$PROOF_ROOT" = "im-results/agent19-raw40-cut/Raw40Round4Exact.lean"
            test -f im-results/agent19-raw40-cut/prepare_round4.py
          elif [[ "$PREPARATION_PROFILE" == "raw40-round5" ]]; then
            test "$PROOF_ROOT" = "im-results/agent19-raw40-cut/Raw40Round5Exact.lean"
            test -f im-results/agent19-raw40-cut/prepare_round5.py
          elif [[ "$PREPARATION_PROFILE" == "raw40-a0la-complete" ]]; then
            case "$PROOF_ROOT" in
              im-results/agent42-raw40-crossing-splice/Raw40A0LAExact.lean|im-results/agent42-raw40-crossing-splice/Raw40A0LARefinement.lean) ;;
              *) exit 1 ;;
            esac
            test -f im-results/agent19-raw40-cut/prepare_round5.py
            test -f im-results/agent19-raw40-cut/prepare_a0la.py
          elif [[ "$PREPARATION_PROFILE" == "raw40-a1lc-enumerate" ]]; then
            test "$PROOF_ROOT" = "im-results/agent19-raw40-cut/Raw40A1LC1REExact.lean"
            test -f im-results/agent19-raw40-cut/enumerate_canon.cpp
          elif [[ "$PREPARATION_PROFILE" == "raw40-a1lc-child" ]]; then
            test "$PROOF_ROOT" = "im-results/agent19-raw40-cut/Raw40C1LC1RAAll.lean"
            test -f im-results/agent19-raw40-cut/prepare_a1lc_1ra_discovery.py
            test -f im-results/agent19-raw40-cut/prepare_a1lc_0lc.py
          else
            test "$PREPARATION_PROFILE" = "raw40-a0la"
            if [[ "$RAW40_CHILD" == "1LB" ]]; then
              test "$PROOF_ROOT" = "im-results/agent19-raw40-cut/a0la/1LB/shards/Raw40C0LAC1LBAll.lean"
            else
              test "$PROOF_ROOT" = "im-results/agent19-raw40-cut/a0la/${RAW40_CHILD}/shards/Raw40C0LA${RAW40_CHILD}All.lean"
            fi
          fi
          [[ "$SUFFIX" =~ ^[a-zA-Z0-9_.]+$ ]]
          [[ "$MIN_THEOREMS" =~ ^[0-9]+$ ]]
          test "$MIN_THEOREMS" -ge 1
          test "$MIN_THEOREMS" -le 10000
          git rev-parse HEAD
          if test -f "$PROOF_ROOT"; then sha256sum "$PROOF_ROOT"; fi
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Hydrate checksum-pinned reusable coverage modules
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
      - name: Hydrate checksum-pinned Raw10 I stream modules
        if: ${{ inputs.preparation_profile == 'raw10-i-stream' }}
        run: |
          set -euo pipefail
          cd im-results/agent13-raw10-box33
          python3 unpack_i_parametric.py
          python3 unpack_i_relay.py
          python3 unpack_i_carry.py
          python3 unpack_i_rules.py
          for stem in Box33D17V12IParametric Box33D17V12IRelay Box33D17V12ICarry Box33D17V12IRules; do
            test -s "${stem}.lean"
          done
      - name: Enumerate omitted Raw40 A1LC B1=1RA child
        if: ${{ inputs.preparation_profile == 'raw40-a1lc-enumerate' }}
        run: |
          set -euo pipefail
          out=/tmp/raw40-a1lc-1ra
          mkdir -p "$out"
          g++ -std=c++20 -O3 im-results/agent19-raw40-cut/enumerate_canon.cpp -o "$out/enumerate_canon"
          cd "$out"
          ./enumerate_canon '1RB1LC_1RC1RA_0RD---_1LD1LA_------_------' > enum.log
          test -s tree.json
          test -f open.txt
          echo "open_count=$(wc -l < open.txt)"
          sha256sum tree.json open.txt enum.log
          tail -n 5 enum.log
      - name: Search reusable FAR certificates for Raw40 A1LC B1=1RA residuals
        if: ${{ inputs.preparation_profile == 'raw40-a1lc-enumerate' }}
        run: |
          set -euo pipefail
          cd /tmp/raw40-a1lc-1ra
          python3 - "$GITHUB_WORKSPACE" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])/'im-results/agent19-raw40-cut'
          codes=set()
          for path in root.glob('a1lc-*.json'):
              data=json.load(open(path))
              for row in data.get('far',[]):
                  codes.add(row['code'])
              for line in data.get('farGroups','').splitlines():
                  fields=line.split()
                  if fields: codes.add(fields[0])
          pathlib.Path('far-bank.txt').write_text(''.join(c+'\\n' for c in sorted(codes)))
          print('seed_far_codes',len(codes))
          PY
          g++ -std=c++20 -O3 "$GITHUB_WORKSPACE/im-results/agent19-raw40-cut/farbank.cpp" -o farbank
          sed 's/_//g' open.txt | awk '{print NR-1, $0}' > far.in
          ./farbank 5 far-bank.txt < far.in > far5.txt 2> far5.log
          echo "far_certificates=$(wc -l < far5.txt)"
          cat far5.txt
          cat far5.log
      - name: Generate source-checked Raw40 A1LC B1=1RA child
        if: ${{ inputs.preparation_profile == 'raw40-a1lc-child' }}
        env:
          PROOF_ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          python3 im-results/agent19-raw40-cut/prepare_a1lc_1ra_discovery.py
          python3 im-results/agent19-raw40-cut/prepare_a1lc_0lc.py 1RA
          test -f "$PROOF_ROOT"
          mkdir -p /tmp/raw40-a1lc-1ra
          cp -a im-results/agent19-raw40-cut/a1lc/1RA/. /tmp/raw40-a1lc-1ra/
          cp im-results/agent19-raw40-cut/a1lc-1RA-discovery.json /tmp/raw40-a1lc-1ra/
          sha256sum "$PROOF_ROOT" im-results/agent19-raw40-cut/a1lc-1RA-discovery.json
      - name: Generate q0-151 Lean finite-control certificate
        if: ${{ inputs.preparation_profile == 'q0151-macro' }}
        env:
          PROOF_ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          CERT_ROOT=im-results/agent5-weighted-tnf-queue/Q0151FiniteCertificate.lean
          python3 im-results/agent5-weighted-tnf-queue/generate_q151_finite.py "$CERT_ROOT"
          test -f "$PROOF_ROOT"
          sha256sum "$CERT_ROOT"
      - name: Generate source-pinned three/four-hole coverage modules
        if: ${{ inputs.preparation_profile == 'coverage-generators' || inputs.preparation_profile == 'raw40-a0la' || inputs.preparation_profile == 'raw40-round4' || inputs.preparation_profile == 'raw40-round5' || inputs.preparation_profile == 'raw40-a0la-complete' || inputs.preparation_profile == 'raw40-a1lc-child' }}
        run: |
          set -euo pipefail
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
      - name: Generate authentic Raw40 A0LA source family from frozen banks
        if: ${{ inputs.preparation_profile == 'raw40-a0la' }}
        env:
          RAW40_CHILD: ${{ inputs.raw40_child }}
          PROOF_ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          python im-results/agent19-raw40-cut/prepare_a0la.py "$RAW40_CHILD"
          test -f "$PROOF_ROOT"
          sha256sum "$PROOF_ROOT"
      - name: Regenerate source-pinned Raw40 historical exact child
        if: ${{ inputs.preparation_profile == 'raw40-round4' || inputs.preparation_profile == 'raw40-round5' }}
        env:
          PREPARATION_PROFILE: ${{ inputs.preparation_profile }}
          PROOF_ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          case "$PREPARATION_PROFILE" in
            raw40-round4) python im-results/agent19-raw40-cut/prepare_round4.py ;;
            raw40-round5) python im-results/agent19-raw40-cut/prepare_round5.py ;;
            *) exit 1 ;;
          esac
          test -f "$PROOF_ROOT"
          sha256sum "$PROOF_ROOT"
      - name: Regenerate all twelve Raw40 A0LA child sources
        if: ${{ inputs.preparation_profile == 'raw40-a0la-complete' || inputs.preparation_profile == 'raw40-a1lc-child' }}
        env:
          PROOF_ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          python im-results/agent19-raw40-cut/prepare_round5.py
          for child in 0LE 0RB 0RD 0RE 1LA 1LB 1LC 1LE 1RB 1RC 1RE; do
            python im-results/agent19-raw40-cut/prepare_a0la.py "$child"
          done
          test -f "$PROOF_ROOT"
          sha256sum "$PROOF_ROOT"
      - name: Compile exact transitive Lean source, reject compiler errors
        if: ${{ inputs.preparation_profile != 'raw40-a1lc-enumerate' }}
        env:
          PROOF_ROOT: ${{ inputs.root }}
          PREPARATION_PROFILE: ${{ inputs.preparation_profile }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lean-source-closure
          overrides=()
          if [[ "$PREPARATION_PROFILE" == "raw40-a0la" || "$PREPARATION_PROFILE" == "raw40-a0la-complete" || "$PREPARATION_PROFILE" == "raw40-a1lc-child" ]]; then
            # prepare_a0la.py explicitly uses agent32-raw59's generator.
            # The raw42 FastBiDFA module has a different source identity.
            overrides+=(--override FastBiDFA=im-results/agent32-raw59/FastBiDFA.lean)
          fi
          python tools/lean_compile_closure.py \
            --workdir /tmp/lean-source-closure/compiled \
            --jobs 2 \
            --manifest /tmp/lean-source-closure/manifest.json \
            --label "standalone source closure ${PROOF_ROOT}" \
            "${overrides[@]}" "$PROOF_ROOT" 2>&1 | tee /tmp/lean-source-closure/compile.log
      - name: Audit printed theorem axiom dependencies
        if: ${{ inputs.preparation_profile != 'raw40-a1lc-enumerate' }}
        env:
          PROOF_ROOT: ${{ inputs.root }}
          SUFFIX: ${{ inputs.theorem_suffix }}
          MIN_THEOREMS: ${{ inputs.minimum_theorems }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/lean-source-closure/axioms.log
          import os, pathlib, re
          log=pathlib.Path('/tmp/lean-source-closure/compile.log').read_text()
          root=pathlib.Path(os.environ['PROOF_ROOT']).read_text()
          required=int(os.environ['MIN_THEOREMS'])
          suffix=os.environ['SUFFIX']
          listed=re.findall(r"^\s*#print axioms\s+\S+",root,re.M)
          if len(listed)<required:
              raise SystemExit(f"Root provides {len(listed)} #print axioms, minimum {required}")
          declarations=dict()
          for name,axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",log):
              if name in declarations: raise SystemExit(f"duplicate theorem {name}")
              declarations[name]=set(a.strip() for a in axioms.split(',') if a.strip())
          for name in re.findall(r"'([^']+)' does not depend on any axioms",log):
              if name in declarations: raise SystemExit(f"duplicate theorem {name}")
              declarations[name]=set()
          targets={name:deps for name,deps in declarations.items() if name.endswith(suffix)}
          if len(targets)<required:
              raise SystemExit(f"Only {len(targets)} axiom-audited {suffix} theorems; required {required}")
          allowed={'propext','Quot.sound','Classical.choice'}
          for name,deps in sorted(targets.items()):
              bad=deps-allowed
              if bad: raise SystemExit(f"{name}: unapproved axioms {sorted(bad)}")
              print(f"{name} : {sorted(deps)}")
          print(f"PASS: {len(targets)} distinct {suffix} theorems, only standard Lean axioms")
          PY
      - name: Commit generated Raw40 A1LC 1RA source after kernel and axiom audit
        if: ${{ inputs.preparation_profile == 'raw40-a1lc-child' }}
        run: |
          set -euo pipefail
          git config user.name "Agent 19"
          git config user.email "agent19@users.noreply.github.com"
          git add im-results/agent19-raw40-cut/a1lc-1RA-discovery.json
          git add -A im-results/agent19-raw40-cut/a1lc/1RA
          for f in im-results/agent19-raw40-cut/Raw40C1LC1RA*.lean im-results/agent19-raw40-cut/Raw40A1LC1RACompact*.lean; do
            if [[ -f "$f" ]]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No generated Raw40 A1LC 1RA proof files to commit"
            exit 1
          fi
          git commit -m "Agent 19: add source-checked Raw40 A1LC 1RA child"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Preserve compiled source closure, manifest and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-lean-source-closure
          path: |
            /tmp/lean-source-closure/manifest.json
            /tmp/lean-source-closure/compile.log
            /tmp/lean-source-closure/axioms.log
            /tmp/raw40-a1lc-1ra/
            im-results/agent5-weighted-tnf-queue/Q0151FiniteCertificate.lean
          if-no-files-found: ignore
          retention-days: 30
