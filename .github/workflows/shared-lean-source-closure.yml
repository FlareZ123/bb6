name: Shared pinned standalone Lean source-closure audit (manual)
run-name: "Lean closure: ${{ inputs.root }}"

on:
  workflow_dispatch:
    inputs:
      root:
        description: "Existing repository Lean root under im-results (no generated imports)"
        type: string
        required: true
        default: "im-results/agent42-raw40-crossing-splice/Raw40CrossingLeaves.lean"
      theorem_suffix:
        description: "Only axiom-audit printed theorem names ending in this suffix"
        type: string
        required: true
        default: ".never"
      minimum_theorems:
        description: "Minimum distinct printed target declarations required"
        type: number
        required: true
        default: 23

      preparation_profile:
        description: "Optional deterministic source preparation for an existing family consumer"
        type: choice
        options: ["none", "coverage-generators", "raw40-a0la", "raw40-round4", "raw40-round5", "q0151-macro"]
        default: "none"
      raw40_child:
        description: "Raw40 A1=0LA C1 source-child selection when preparation_profile=raw40-a0la"
        type: choice
        options: ["0LE", "0RB", "0RD", "0RE", "1LA", "1LC", "1LE", "1RB", "1RC", "1RE"]
        default: "1RB"

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate the exact chosen source
        env:
          PROOF_ROOT: ${{ inputs.root }}
          SUFFIX: ${{ inputs.theorem_suffix }}
          MIN_THEOREMS: ${{ inputs.minimum_theorems }}
          PREPARATION_PROFILE: ${{ inputs.preparation_profile }}
          RAW40_CHILD: ${{ inputs.raw40_child }}
        run: |
          set -euo pipefail
          [[ "$PROOF_ROOT" =~ ^im-results/[a-zA-Z0-9_./-]+\.lean$ ]]
          [[ "$PROOF_ROOT" != *..* ]]
          if [[ "$PREPARATION_PROFILE" == "none" || "$PREPARATION_PROFILE" == "coverage-generators" ]]; then
            test -f "$PROOF_ROOT"
          elif [[ "$PREPARATION_PROFILE" == "q0151-macro" ]]; then
            test "$PROOF_ROOT" = "im-results/agent5-weighted-tnf-queue/Q0151FiniteCertificate.lean"
            test -f im-results/agent5-weighted-tnf-queue/generate_q151_finite.py
          elif [[ "$PREPARATION_PROFILE" == "raw40-round4" ]]; then
            test "$PROOF_ROOT" = "im-results/agent19-raw40-cut/Raw40Round4Exact.lean"
            test -f im-results/agent19-raw40-cut/prepare_round4.py
          elif [[ "$PREPARATION_PROFILE" == "raw40-round5" ]]; then
            test "$PROOF_ROOT" = "im-results/agent19-raw40-cut/Raw40Round5Exact.lean"
            test -f im-results/agent19-raw40-cut/prepare_round5.py
          else
            test "$PREPARATION_PROFILE" = "raw40-a0la"
            test "$PROOF_ROOT" = "im-results/agent19-raw40-cut/a0la/${RAW40_CHILD}/shards/Raw40C0LA${RAW40_CHILD}All.lean"
          fi
          [[ "$SUFFIX" =~ ^[a-zA-Z0-9_.]+$ ]]
          [[ "$MIN_THEOREMS" =~ ^[0-9]+$ ]]
          test "$MIN_THEOREMS" -ge 1
          test "$MIN_THEOREMS" -le 10000
          git rev-parse HEAD
          if test -f "$PROOF_ROOT"; then sha256sum "$PROOF_ROOT"; fi
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Hydrate checksum-pinned reusable coverage modules
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
      - name: Generate q0-151 Lean finite-control certificate
        if: ${{ inputs.preparation_profile == 'q0151-macro' }}
        env:
          PROOF_ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          python3 im-results/agent5-weighted-tnf-queue/generate_q151_finite.py "$PROOF_ROOT"
          test -f "$PROOF_ROOT"
          sha256sum "$PROOF_ROOT"
      - name: Generate source-pinned three/four-hole coverage modules
        if: ${{ inputs.preparation_profile == 'coverage-generators' || inputs.preparation_profile == 'raw40-a0la' || inputs.preparation_profile == 'raw40-round4' || inputs.preparation_profile == 'raw40-round5' }}
        run: |
          set -euo pipefail
          python im-results/agent31-three-hole-tnf/generate_sweeps.py
          python im-results/agent31-three-hole-tnf/generate_four_hole.py
      - name: Generate authentic Raw40 A0LA source family from frozen banks
        if: ${{ inputs.preparation_profile == 'raw40-a0la' }}
        env:
          RAW40_CHILD: ${{ inputs.raw40_child }}
          PROOF_ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          python im-results/agent19-raw40-cut/prepare_a0la.py "$RAW40_CHILD"
          test -f "$PROOF_ROOT"
          sha256sum "$PROOF_ROOT"
      - name: Regenerate source-pinned Raw40 historical exact child
        if: ${{ inputs.preparation_profile == 'raw40-round4' || inputs.preparation_profile == 'raw40-round5' }}
        env:
          PREPARATION_PROFILE: ${{ inputs.preparation_profile }}
          PROOF_ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          case "$PREPARATION_PROFILE" in
            raw40-round4) python im-results/agent19-raw40-cut/prepare_round4.py ;;
            raw40-round5) python im-results/agent19-raw40-cut/prepare_round5.py ;;
            *) exit 1 ;;
          esac
          test -f "$PROOF_ROOT"
          sha256sum "$PROOF_ROOT"
      - name: Compile exact transitive Lean source, reject compiler errors
        env:
          PROOF_ROOT: ${{ inputs.root }}
          PREPARATION_PROFILE: ${{ inputs.preparation_profile }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lean-source-closure
          overrides=()
          if [[ "$PREPARATION_PROFILE" == "raw40-a0la" ]]; then
            # prepare_a0la.py explicitly uses agent32-raw59's generator.
            # The raw42 FastBiDFA module has a different source identity.
            overrides+=(--override FastBiDFA=im-results/agent32-raw59/FastBiDFA.lean)
          fi
          python tools/lean_compile_closure.py \
            --workdir /tmp/lean-source-closure/compiled \
            --jobs 2 \
            --manifest /tmp/lean-source-closure/manifest.json \
            --label "standalone source closure ${PROOF_ROOT}" \
            "${overrides[@]}" "$PROOF_ROOT" 2>&1 | tee /tmp/lean-source-closure/compile.log
      - name: Audit printed theorem axiom dependencies
        env:
          PROOF_ROOT: ${{ inputs.root }}
          SUFFIX: ${{ inputs.theorem_suffix }}
          MIN_THEOREMS: ${{ inputs.minimum_theorems }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/lean-source-closure/axioms.log
          import os, pathlib, re
          log=pathlib.Path('/tmp/lean-source-closure/compile.log').read_text()
          root=pathlib.Path(os.environ['PROOF_ROOT']).read_text()
          required=int(os.environ['MIN_THEOREMS'])
          suffix=os.environ['SUFFIX']
          listed=re.findall(r"^\s*#print axioms\s+\S+",root,re.M)
          if len(listed)<required:
              raise SystemExit(f"Root provides {len(listed)} #print axioms, minimum {required}")
          declarations=dict()
          for name,axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",log):
              if name in declarations: raise SystemExit(f"duplicate theorem {name}")
              declarations[name]=set(a.strip() for a in axioms.split(',') if a.strip())
          for name in re.findall(r"'([^']+)' does not depend on any axioms",log):
              if name in declarations: raise SystemExit(f"duplicate theorem {name}")
              declarations[name]=set()
          targets={name:deps for name,deps in declarations.items() if name.endswith(suffix)}
          if len(targets)<required:
              raise SystemExit(f"Only {len(targets)} axiom-audited {suffix} theorems; required {required}")
          allowed={'propext','Quot.sound','Classical.choice'}
          for name,deps in sorted(targets.items()):
              bad=deps-allowed
              if bad: raise SystemExit(f"{name}: unapproved axioms {sorted(bad)}")
              print(f"{name} : {sorted(deps)}")
          print(f"PASS: {len(targets)} distinct {suffix} theorems, only standard Lean axioms")
          PY
      - name: Preserve compiled source closure, manifest and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-lean-source-closure
          path: |
            /tmp/lean-source-closure/manifest.json
            /tmp/lean-source-closure/compile.log
            /tmp/lean-source-closure/axioms.log
            im-results/agent5-weighted-tnf-queue/Q0151FiniteCertificate.lean
          if-no-files-found: ignore
          retention-days: 30
