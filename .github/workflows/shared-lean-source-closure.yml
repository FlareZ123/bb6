name: Shared pinned standalone Lean source-closure audit (manual)
run-name: "Lean closure: ${{ inputs.root }}"

on:
  workflow_dispatch:
    inputs:
      root:
        description: "Existing repository Lean root under im-results (no generated imports)"
        type: string
        required: true
        default: "im-results/agent42-raw40-crossing-splice/Raw40CrossingLeaves.lean"
      theorem_suffix:
        description: "Only axiom-audit printed theorem names ending in this suffix"
        type: string
        required: true
        default: ".never"
      minimum_theorems:
        description: "Minimum distinct printed target declarations required"
        type: number
        required: true
        default: 23

permissions:
  contents: read

jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate the exact chosen source
        env:
          PROOF_ROOT: ${{ inputs.root }}
          SUFFIX: ${{ inputs.theorem_suffix }}
          MIN_THEOREMS: ${{ inputs.minimum_theorems }}
        run: |
          set -euo pipefail
          [[ "$PROOF_ROOT" =~ ^im-results/[a-zA-Z0-9_./-]+\.lean$ ]]
          [[ "$PROOF_ROOT" != *..* ]]
          test -f "$PROOF_ROOT"
          [[ "$SUFFIX" =~ ^[a-zA-Z0-9_.]+$ ]]
          [[ "$MIN_THEOREMS" =~ ^[0-9]+$ ]]
          test "$MIN_THEOREMS" -ge 1
          test "$MIN_THEOREMS" -le 10000
          git rev-parse HEAD
          sha256sum "$PROOF_ROOT"
      - name: Install pinned Lean 4.36.0-rc2
        run: |
          set -euo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.36.0-rc2
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Hydrate checksum-pinned reusable coverage modules
        run: |
          set -euo pipefail
          python im-results/agent13-coverage/unpack.py
      - name: Compile exact transitive Lean source, reject compiler errors
        env:
          PROOF_ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/lean-source-closure
          python tools/lean_compile_closure.py \
            --workdir /tmp/lean-source-closure/compiled \
            --jobs 2 \
            --manifest /tmp/lean-source-closure/manifest.json \
            --label "standalone source closure ${PROOF_ROOT}" \
            "$PROOF_ROOT" 2>&1 | tee /tmp/lean-source-closure/compile.log
      - name: Audit printed theorem axiom dependencies
        env:
          PROOF_ROOT: ${{ inputs.root }}
          SUFFIX: ${{ inputs.theorem_suffix }}
          MIN_THEOREMS: ${{ inputs.minimum_theorems }}
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/lean-source-closure/axioms.log
          import os, pathlib, re
          log=pathlib.Path('/tmp/lean-source-closure/compile.log').read_text()
          root=pathlib.Path(os.environ['PROOF_ROOT']).read_text()
          required=int(os.environ['MIN_THEOREMS'])
          suffix=os.environ['SUFFIX']
          listed=re.findall(r"^\s*#print axioms\s+\S+",root,re.M)
          if len(listed)<required:
              raise SystemExit(f"Root provides {len(listed)} #print axioms, minimum {required}")
          declarations=dict()
          for name,axioms in re.findall(r"'([^']+)' depends on axioms: \[([^\]]*)\]",log):
              if name in declarations: raise SystemExit(f"duplicate theorem {name}")
              declarations[name]=set(a.strip() for a in axioms.split(',') if a.strip())
          for name in re.findall(r"'([^']+)' does not depend on any axioms",log):
              if name in declarations: raise SystemExit(f"duplicate theorem {name}")
              declarations[name]=set()
          targets={name:deps for name,deps in declarations.items() if name.endswith(suffix)}
          if len(targets)<required:
              raise SystemExit(f"Only {len(targets)} axiom-audited {suffix} theorems; required {required}")
          allowed={'propext','Quot.sound','Classical.choice'}
          for name,deps in sorted(targets.items()):
              bad=deps-allowed
              if bad: raise SystemExit(f"{name}: unapproved axioms {sorted(bad)}")
              print(f"{name} : {sorted(deps)}")
          print(f"PASS: {len(targets)} distinct {suffix} theorems, only standard Lean axioms")
          PY
      - name: Preserve compiled source closure, manifest and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-lean-source-closure
          path: |
            /tmp/lean-source-closure/manifest.json
            /tmp/lean-source-closure/compile.log
            /tmp/lean-source-closure/axioms.log
          if-no-files-found: ignore
          retention-days: 30
