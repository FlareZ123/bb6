        run: |
          set -euo pipefail
          IFS=, read -r -a labels <<< "$PHASE_LABELS"
          mkdir -p phase-results
          for label in "${labels[@]}"; do
            case "$label" in 0|300|400a|400b|600|700|2700|2800|3500) ;; *) echo "Invalid phase label: $label"; exit 2;; esac
            mkdir -p "phase-results/$label"
            if timeout 180s python3 "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/block_phase_dfa.py" "$label" --output "phase-results/$label" | tee "phase-results/$label/generator.log"; then
              cp "phase-results/$label/Agent5PhaseMITM.v" "Agent5PhaseMITM_$label.v"
              if timeout 300s coqc -Q . BusyCoq -native-compiler no "Agent5PhaseMITM_$label.v" 2>&1 | tee "phase-results/$label/coq.log"; then
                cp "Agent5PhaseMITM_$label.vo" "phase-results/$label/"
                printf '%s\n' "$label ACCEPTED" | tee -a phase-results/verdicts.txt
              else
                printf '%s\n' "$label COQ_FAILED_OR_TIMED_OUT" | tee -a phase-results/verdicts.txt
              fi
            else
              printf '%s\n' "$label GENERATION_FAILED_OR_TIMED_OUT" | tee -a phase-results/verdicts.txt
            fi
          done
          grep -q ' ACCEPTED$' phase-results/verdicts.txt
      - name: Preserve phase-complete MITM source results
        if: always() && inputs.target == 'enumerate62-phase-mitm'
