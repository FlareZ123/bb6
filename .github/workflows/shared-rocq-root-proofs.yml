      - name: Consume accepted phase proofs in exact source checkpoints
        id: phase_consume
        if: inputs.target == 'enumerate62-phase-consume'
        working-directory: original/verify
        env:
          GH_TOKEN: ${{ github.token }}
          PHASE_RUNS: ${{ inputs.batch_ranges }}
        run: |
          set -euo pipefail
          [[ "$PHASE_RUNS" =~ ^[0-9]+(,[0-9]+)*$ ]]
          IFS=, read -r -a runs <<< "$PHASE_RUNS"
          mkdir -p phase-artifacts checkpoint-artifacts phase-consumption
          for run in "${runs[@]}"; do
            gh run download "$run" --repo FlareZ123/bb6 --name phase-mitm-certificates --dir "phase-artifacts/$run"
          done
          for run in 45523811152 45525092609 45525101044 45525108618 45525114781 45525121016 45525126402 45536192374; do
            gh run download "$run" --repo FlareZ123/bb6 --name source-packed-batch --dir "checkpoint-artifacts/$run"
          done
          python3 "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/prepare-phase-consumption.py" --phase-dir phase-artifacts --checkpoint-dir checkpoint-artifacts --out .
          if ! timeout 180s coqc -Q . BusyCoq -native-compiler no Agent5PhaseRoster.v > phase-consumption/roster.log 2>&1; then
            # Rebuild only if the accepted object is incompatible with this
            # exact original-source environment.
            for label in $(cat phase-accepted-labels.txt); do
              timeout 300s coqc -Q . BusyCoq -native-compiler no "Agent5PhaseMITM_$label.v" > "phase-consumption/phase-$label.log" 2>&1
            done
            timeout 180s coqc -Q . BusyCoq -native-compiler no Agent5PhaseRoster.v > phase-consumption/roster.log 2>&1
          fi
          cp Agent5PhaseRoster.v Agent5PhaseRoster.vo Agent5RosterComplement.v Agent5RosterComplement.vo phase-accepted-labels.txt phase-consumption/
          head -n 1 phase-consumption.tsv > phase-consumption/verified.tsv
          while IFS=$'\t' read -r offset size fuel active held ac hc module; do
            name="Agent5PhaseConsume_$offset"
            if ! timeout 120s coqc -Q . BusyCoq -native-compiler no "$name.v" > "phase-consumption/$name.log" 2>&1; then
              timeout 300s coqc -Q . BusyCoq -native-compiler no "$module.v" > "phase-consumption/$module.log" 2>&1
              timeout 120s coqc -Q . BusyCoq -native-compiler no "$name.v" > "phase-consumption/$name.log" 2>&1
            fi
            cp "$name.v" "$name.vo" "$module.v" "$module.vo" phase-consumption/
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$offset" "$size" "$fuel" "$active" "$held" "$ac" "$hc" "$module" >> phase-consumption/verified.tsv
          done < <(tail -n +2 phase-consumption.tsv)
          cat phase-consumption/verified.tsv
          labels=$(paste -sd- phase-accepted-labels.txt)
          counts=$(awk -F '\t' 'NR>1 {a+=$6; h+=$7; n++} END {printf "%dchunks-%dactive-%dheld",n,a,h}' phase-consumption/verified.tsv)
          echo "summary=$labels-$counts" >> "$GITHUB_OUTPUT"
      - name: Preserve original-source phase queue consumption
        if: always() && inputs.target == 'enumerate62-phase-consume'
        uses: actions/upload-artifact@v4
        with:
          name: phase-consumption-${{ steps.phase_consume.outputs.summary || 'partial' }}
