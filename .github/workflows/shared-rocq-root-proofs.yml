          cat > Agent32ChunkProbe.v <<COQ
          From BusyCoq Require Import Enumerate62.
          From Coq Require Import List NArith.
          Import TNF_Node.
          Definition probe_q := SearchQueue_upds decider (q_i $OFFSET $SIZE) MAXT.
          Definition probe_result :=
            let q := probe_q in
            (length_tail (fst q), length_tail (snd q), show_holdout q).
          Time Eval vm_compute in probe_result.
          COQ
          timeout 600s coqc -Q . BusyCoq -native-compiler no Agent32ChunkProbe.v

      - name: Evaluate bounded original-source chunk with native computation
        if: inputs.target == 'enumerate62-chunk-probe-native'
        working-directory: original/verify
        env:
          OFFSET: ${{ inputs.offset }}
          SIZE: ${{ inputs.size }}
        run: |
          set -eu
          [[ "$OFFSET" =~ ^[0-9]+$ && "$SIZE" =~ ^[0-9]+$ ]]
          (( OFFSET < 12820 && SIZE >= 1 && SIZE <= 100 ))
          cat > Agent32ChunkProbeNative.v <<COQ
          From BusyCoq Require Import Enumerate62.
          From Coq Require Import List NArith.
          Import TNF_Node.
          Definition probe_q := SearchQueue_upds decider (q_i $OFFSET $SIZE) MAXT.
          Definition probe_result :=
            let q := probe_q in
            (length_tail (fst q), length_tail (snd q), show_holdout q).
          Time Eval native_compute in probe_result.
          COQ
          # A native-enabled Coq distribution is required; Debian's VM-only
          # package silently substitutes vm_compute for native_compute.
          docker run --rm --user root -e HOME=/home/coq -e OPAMROOT=/home/coq/.opam \
            -v "$GITHUB_WORKSPACE/original:/work" -w /work/verify \
            --entrypoint bash coqorg/coq:8.20-native -lc '
              set -euo pipefail
              eval "$(opam env)"
              coqc --version
              coqc -config
              printf "Goal True. native_compute. exact I. Qed.\n" > NativeSmoke.v
              coqc -native-compiler yes NativeSmoke.v 2>&1 | tee native-smoke.log
              if grep -Eiq "falling back|native.compiler.*disabled|native.compiler.*not available" native-smoke.log; then exit 1; fi
              rm -f NativeSmoke.v
              coq_makefile -Q . BusyCoq -native-compiler yes -o Makefile.coq *.v
              make -f Makefile.coq -j 2 Enumerate62.vo
              timeout 600s coqc -Q . BusyCoq -native-compiler yes Agent32ChunkProbeNative.v
            '

      - name: Census actual classifier verdicts on the 12820-node frontier
