name: Shared original BusyCoq rooted theorem source verifier (manual)
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Original-source theorem family to compile'
        required: true
        type: choice
        default: sk1
        options:
          - sk1
          - somdc
          - both
          - enumerate62-decider-sound
          - enumerate62-q0-count
          - enumerate62-q0-partition
          - enumerate62-adaptive-checkpoint
          - enumerate62-adaptive-expansion
          - enumerate62-packed-chunk
          - enumerate62-packed-batch
          - enumerate62-weighted-source
          - enumerate62-zero-delay
          - enumerate62-source-roster
          - enumerate62-source-first-hole
          - enumerate62-source-first-hole-side
          - enumerate62-s4-gap-side-search
          - enumerate62-q32-canonical-parent
          - enumerate62-resume-chunk2
          - enumerate62-resume-last20
          - enumerate62-last20-witness
          - enumerate62-held-probe
          - enumerate62-chunk-probe
          - enumerate62-chunk-probe-native
          - enumerate62-q0-verdicts
      offset:
        description: 'Source q0 chunk start (probe only)'
        required: false
        type: number
        default: 0
      size:
        description: 'Source q0 chunk size (probe only; 1..100)'
        required: false
        type: number
        default: 1
      fuel:
        description: 'Exact finite source-update fuel (packed-chunk only)'
        required: false
        type: number
        default: 1
      batch_ranges:
        description: 'Up to eight offset:size:fuel ranges, comma-separated'
        required: false
        type: string
        default: '34:16:64,4096:16:64,8192:16:64,12000:16:64'
permissions:
  contents: read
jobs:
  verify-original:
    runs-on: ubuntu-latest
    timeout-minutes: 43
    steps:
      - name: Install original-source proof compiler
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y coq
          coqc --version
          coqc -config
      - name: Checkout exact original source revision
        uses: actions/checkout@v4
        with:
          repository: ccz181078/busycoq
          ref: 33209bc7dc282b38c8cd6be507bfc551fea56108
          path: original
          persist-credentials: false
      - name: Checkout research repository proof artifact
        if: inputs.target == 'enumerate62-decider-sound' || inputs.target == 'enumerate62-q0-partition' || inputs.target == 'enumerate62-adaptive-checkpoint' || inputs.target == 'enumerate62-adaptive-expansion' || inputs.target == 'enumerate62-packed-chunk' || inputs.target == 'enumerate62-packed-batch' || inputs.target == 'enumerate62-resume-chunk2' || inputs.target == 'enumerate62-resume-last20' || inputs.target == 'enumerate62-last20-witness' || inputs.target == 'enumerate62-weighted-source' || inputs.target == 'enumerate62-source-roster' || inputs.target == 'enumerate62-source-first-hole' || inputs.target == 'enumerate62-source-first-hole-side' || inputs.target == 'enumerate62-s4-gap-side-search' || inputs.target == 'enumerate62-q32-canonical-parent' || inputs.target == 'enumerate62-zero-delay'
        uses: actions/checkout@v4
        with:
          repository: FlareZ123/bb6
          ref: ${{ github.sha }}
          path: research
          persist-credentials: false
      - name: Add Agent 5 Enumerate62 decider soundness theorem
        if: inputs.target == 'enumerate62-decider-sound'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5Enumerate62DeciderSound.v" original/verify/
      - name: Add source q0 partition theorem
        if: inputs.target == 'enumerate62-q0-partition'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32Q0Partition.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32SourceDrain.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32SourceCoverage.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32SourceBackwards.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32SourceEncoding.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8AdaptiveSource.v" original/verify/
      - name: Add independent adaptive checkpoint proof and pilot
        if: inputs.target == 'enumerate62-adaptive-checkpoint' || inputs.target == 'enumerate62-adaptive-expansion' || inputs.target == 'enumerate62-packed-chunk' || inputs.target == 'enumerate62-packed-batch' || inputs.target == 'enumerate62-resume-chunk2' || inputs.target == 'enumerate62-resume-last20' || inputs.target == 'enumerate62-last20-witness' || inputs.target == 'enumerate62-weighted-source' || inputs.target == 'enumerate62-source-roster' || inputs.target == 'enumerate62-source-first-hole' || inputs.target == 'enumerate62-s4-gap-side-search' || inputs.target == 'enumerate62-q32-canonical-parent'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32SourceBackwards.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32SourceEncoding.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8AdaptiveSource.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8QueueCheckpoint.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8QueueCheckpointPilot.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8PackedRoot.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8QueueExpansionPilot.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8PackedChunk2_32_32.v" original/verify/
      - name: Add q32 canonical parent bridge
        if: inputs.target == 'enumerate62-q32-canonical-parent'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5Enumerate62DeciderSound.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32CanonicalParent.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32RemainderBranchProbe.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8SourceWF.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32FirstHoleCoverageProbe.v" original/verify/
      - name: Add exact final twenty-root checkpoint
        if: inputs.target == 'enumerate62-resume-last20' || inputs.target == 'enumerate62-last20-witness'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5PackedChunk12800_20_1000000.v" original/verify/
      - name: Add direct final-chunk replay witnesses
        if: inputs.target == 'enumerate62-last20-witness'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5Last20Witness.v" original/verify/
      - name: Add exact source zero-delay checker
        if: inputs.target == 'enumerate62-zero-delay' || inputs.target == 'enumerate62-weighted-source' || inputs.target == 'enumerate62-source-roster' || inputs.target == 'enumerate62-source-first-hole' || inputs.target == 'enumerate62-s4-gap-side-search'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8ZeroDelay.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8ExactLeaf.v" original/verify/
      - name: Add direct weighted source proof
        if: inputs.target == 'enumerate62-weighted-source' || inputs.target == 'enumerate62-source-roster' || inputs.target == 'enumerate62-source-first-hole' || inputs.target == 'enumerate62-s4-gap-side-search'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8SourceWF.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8WeightedSource.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8GlobalSource.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5Enumerate62DeciderSound.v" original/verify/
      - name: Add independently scheduled source chunk coverage
        if: inputs.target == 'enumerate62-weighted-source'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32Q0Partition.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5ChunkCoverage.v" original/verify/
      - name: Add S4 gap side-search source
        if: inputs.target == 'enumerate62-s4-gap-side-search'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceWitness.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44S4GapSideSearch.v" original/verify/
      - name: Add direct source residual roster witnesses
        if: inputs.target == 'enumerate62-source-roster'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent50-weighted-tnf-pilot/SourceResidualRoster.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceWitness.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceSweep.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceChunk2.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceTree.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32CanonicalParent.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32RemainderBranchProbe.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8Chunk2FirstHole.v" original/verify/
      - name: Add source first-hole frontier proof
        if: inputs.target == 'enumerate62-source-first-hole'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent50-weighted-tnf-pilot/SourceResidualRoster.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceWitness.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceSweep.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceChunk2.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceTree.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32CanonicalParent.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44ChunkSideSearch.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8Chunk2FirstHole.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent50-weighted-tnf-pilot/Agent50Q32ParentTreeSearch.v" original/verify/
      - name: Generate project dependencies with VM fallback
        working-directory: original/verify
        run: |
          coq_makefile -Q . BusyCoq -native-compiler no -o Makefile.coq *.v
      - name: Compile requested original theorem source
        working-directory: original/verify
        env:
          PROOF_TARGET: ${{ inputs.target }}
        run: |
          set -eu
          case "$PROOF_TARGET" in
            sk1) make -f Makefile.coq -j 2 Sk1Machines_v2.vo ;;
            somdc) make -f Makefile.coq -j 2 SOMDCv10.vo ;;
            both) make -f Makefile.coq -j 2 Sk1Machines_v2.vo SOMDCv10.vo ;;
            enumerate62-decider-sound) make -f Makefile.coq -j 2 Enumerate62.vo Agent5Enumerate62DeciderSound.vo ;;
            enumerate62-held-probe|enumerate62-q0-count|enumerate62-chunk-probe|enumerate62-chunk-probe-native|enumerate62-q0-verdicts) make -f Makefile.coq -j 2 Enumerate62.vo ;;
            enumerate62-q0-partition) make -f Makefile.coq -j 2 Agent32Q0Partition.vo Agent32SourceDrain.vo Agent32SourceCoverage.vo Agent32SourceEncoding.vo Agent8AdaptiveSource.vo ;;
            enumerate62-adaptive-checkpoint) make -f Makefile.coq -j 2 Agent8QueueCheckpointPilot.vo ;;
            enumerate62-adaptive-expansion) make -f Makefile.coq -j 2 Agent8QueueExpansionPilot.vo Agent8PackedChunk2_32_32.vo ;;
            enumerate62-packed-chunk|enumerate62-packed-batch) make -f Makefile.coq -j 2 Agent8PackedRoot.vo Agent8AdaptiveSource.vo ;;
            enumerate62-zero-delay) make -f Makefile.coq -j 2 Agent8ZeroDelay.vo ;;
            enumerate62-weighted-source) make -f Makefile.coq -j 2 Agent8GlobalSource.vo Agent8PackedChunk2_32_32.vo Agent8ExactLeaf.vo Agent5ChunkCoverage.vo ;;
            enumerate62-resume-chunk2) make -f Makefile.coq -j 2 Agent8PackedChunk2_32_32.vo ;;
            enumerate62-q32-canonical-parent) make -f Makefile.coq -j 2 Agent5Enumerate62DeciderSound.vo Agent8PackedChunk2_32_32.vo Agent44Q32CanonicalParent.vo Agent44Q32FirstHoleCoverageProbe.vo ;;
            enumerate62-last20-witness) make -f Makefile.coq -j 2 Agent5Last20Witness.vo ;;
            enumerate62-resume-last20) make -f Makefile.coq -j 2 Agent5PackedChunk12800_20_1000000.vo ;;
            enumerate62-source-roster) make -f Makefile.coq -j 2 Agent47SourceSweep.vo && make -f Makefile.coq -j 2 Agent47SourceChunk2.vo Agent47SourceTree.vo Agent44Q32RemainderBranchProbe.vo && make -f Makefile.coq -j 2 Agent8Chunk2FirstHole.vo ;;
            enumerate62-source-first-hole) make -f Makefile.coq -j 2 Agent47SourceSweep.vo && make -f Makefile.coq -j 2 Agent47SourceChunk2.vo Agent47SourceTree.vo Agent44Q32CanonicalParent.vo && make -f Makefile.coq -j 2 Agent8Chunk2FirstHole.vo Agent50Q32ParentTreeSearch.vo ;;
            enumerate62-source-first-hole-side) make -f Makefile.coq -j 2 Agent47SourceSweep.vo && make -f Makefile.coq -j 2 Agent47SourceChunk2.vo Agent47SourceTree.vo Agent44Q32CanonicalParent.vo && make -f Makefile.coq -j 2 Agent8Chunk2FirstHole.vo Agent44ChunkSideSearch.vo Agent44Chunk2FirstHoleSideSearch.vo ;;
            enumerate62-s4-gap-side-search) make -f Makefile.coq -j 2 Agent47SourceWitness.vo Agent44S4GapSideSearch.vo ;;
          esac
      - name: Print final original theorem assumptions
        working-directory: original/verify
        env:
          PROOF_TARGET: ${{ inputs.target }}
        run: |
          set -eu
          if [ "$PROOF_TARGET" = sk1 ] || [ "$PROOF_TARGET" = both ]; then
            printf '%s\n' 'From BusyCoq Require Import Sk1Machines_v2.' 'Print Assumptions Sk1Machines_v2.TM25.nonhalt.' 'Print Assumptions Sk1Machines_v2.TM26.nonhalt.' 'Print Assumptions Sk1Machines_v2.TM23.nonhalt.' > Agent12Sk1Audit.v
            coqc -Q . BusyCoq -native-compiler no Agent12Sk1Audit.v
          fi
          if [ "$PROOF_TARGET" = enumerate62-decider-sound ]; then
            printf '%s\n' 'From BusyCoq Require Import Agent5Enumerate62DeciderSound.' 'Print Assumptions agent5_decider_sound.' 'Print Assumptions agent32_decider_bounded_sound.' > Agent5Enumerate62Audit.v
            coqc -Q . BusyCoq -native-compiler no Agent5Enumerate62Audit.v
          fi
          if [ "$PROOF_TARGET" = somdc ] || [ "$PROOF_TARGET" = both ]; then
            printf '%s\n' 'From BusyCoq Require Import SOMDCv10.' 'Print Assumptions SOMDCv10.TM4.halt.' > Agent12SomdcAudit.v
            coqc -Q . BusyCoq -native-compiler no Agent12SomdcAudit.v
          fi

      - name: Compute exact source q0 census
        if: inputs.target == 'enumerate62-q0-count'
        working-directory: original/verify
        run: |
          set -eu
          cat > Agent32Q0Count.v <<'COQ'
          From BusyCoq Require Import Enumerate62.
          From Coq Require Import List NArith.
          Definition agent32_q0_summary :=
            let q := q_0 in
            (TNF_Node.length_tail (fst q), TNF_Node.length_tail (snd q),
             List.map (fun n => TNF_Node.length_tail (List.filter
               (fun x => Nat.eqb (TNF_Node.num_undef_trans x) n) (fst q))) (List.seq 0 13)).
          Time Eval vm_compute in agent32_q0_summary.
          COQ
          timeout 1200s coqc -Q . BusyCoq -native-compiler no Agent32Q0Count.v

      - name: Evaluate bounded original-source chunk
        if: inputs.target == 'enumerate62-chunk-probe'
        working-directory: original/verify
        env:
          OFFSET: ${{ inputs.offset }}
          SIZE: ${{ inputs.size }}
        run: |
          set -eu
          [[ "$OFFSET" =~ ^[0-9]+$ && "$SIZE" =~ ^[0-9]+$ ]]
          (( OFFSET < 12820 && SIZE >= 1 && SIZE <= 100 ))
          cat > Agent32ChunkProbe.v <<COQ
          From BusyCoq Require Import Enumerate62.
          From Coq Require Import List NArith.
          Import TNF_Node.
          Definition probe_q := SearchQueue_upds decider (q_i $OFFSET $SIZE) MAXT.
          Definition probe_result :=
            let q := probe_q in
            (length_tail (fst q), length_tail (snd q), show_holdout q).
          Time Eval vm_compute in probe_result.
          COQ
          timeout 600s coqc -Q . BusyCoq -native-compiler no Agent32ChunkProbe.v

      - name: Evaluate bounded original-source chunk with native computation
        if: inputs.target == 'enumerate62-chunk-probe-native'
        working-directory: original/verify
        env:
          OFFSET: ${{ inputs.offset }}
          SIZE: ${{ inputs.size }}
        run: |
          set -eu
          [[ "$OFFSET" =~ ^[0-9]+$ && "$SIZE" =~ ^[0-9]+$ ]]
          (( OFFSET < 12820 && SIZE >= 1 && SIZE <= 100 ))
          cat > Agent32ChunkProbeNative.v <<COQ
          From BusyCoq Require Import Enumerate62.
          From Coq Require Import List NArith.
          Import TNF_Node.
          Definition probe_q := SearchQueue_upds decider (q_i $OFFSET $SIZE) MAXT.
          Definition probe_result :=
            let q := probe_q in
            (length_tail (fst q), length_tail (snd q), show_holdout q).
          Time Eval native_compute in probe_result.
          COQ
          timeout 600s coqc -Q . BusyCoq -native-compiler yes Agent32ChunkProbeNative.v

      - name: Census actual classifier verdicts on the 12820-node frontier
        if: inputs.target == 'enumerate62-q0-verdicts'
        working-directory: original/verify
        run: |
          set -eu
          cat > Agent32Q0Verdicts.v <<'COQ'
          From BusyCoq Require Import Enumerate62 Individual62 TC62.
          From Coq Require Import List NArith Strings.String.
          Import TNF_Node.
          Definition tally (a : N * N * list string) (x : T) :=
            let '(h,nh,u) := a in
            match decider (tm x) with
            | Halt _ => (N.succ h,nh,u)
            | NonHalt => (h,N.succ nh,u)
            | Unknown => (h,nh,TM_to_str (tm x)::u)
            end.
          Definition verdicts := List.fold_left tally (fst q_0) (0%N,0%N,nil).
          Time Eval vm_compute in verdicts.
          COQ
          timeout 600s coqc -Q . BusyCoq -native-compiler no Agent32Q0Verdicts.v

      - name: Export and certify exact finite-fuel source queue
        if: inputs.target == 'enumerate62-packed-chunk'
        working-directory: original/verify
        env:
          OFFSET: ${{ inputs.offset }}
          SIZE: ${{ inputs.size }}
          FUEL: ${{ inputs.fuel }}
        run: |
          set -euo pipefail
          [[ "$OFFSET" =~ ^[0-9]+$ && "$SIZE" =~ ^[0-9]+$ && "$FUEL" =~ ^[0-9]+$ ]]
          (( OFFSET < 12820 && SIZE >= 1 && SIZE <= 12820 - OFFSET && FUEL <= 5000000 ))
          cat > Agent8PackedChunk.v <<COQ
          From BusyCoq Require Import Enumerate62 Agent8QueueCheckpoint Agent8PackedRoot.
          From Coq Require Import List NArith Strings.String.
          Import ListNotations.
          Import TNF_Node.
          Open Scope string_scope.
          Definition chunk_input := q_i $OFFSET $SIZE.
          Definition chunk_fuel : N := $FUEL%N.
          Time Definition chunk_data := Eval vm_compute in
            encode_queue (SearchQueue_upds decider chunk_input chunk_fuel).
          Theorem chunk_data_exact :
            SearchQueue_upds decider chunk_input chunk_fuel = decode_queue chunk_data.
          Proof.
            apply source_checkpoint_decode.
            - apply checkpoint_chunk_canonical.
            - vm_compute. reflexivity.
          Qed.
          Print Assumptions chunk_data_exact.
          Set Printing Depth 100000.
          Set Printing Width 120.
          Print chunk_data.
          COQ
          timeout 1200s coqc -Q . BusyCoq -native-compiler no Agent8PackedChunk.v 2>&1 | tee chunk-data.txt
      - name: Preserve full proof-bearing chunk export
        if: inputs.target == 'enumerate62-packed-chunk'
        uses: actions/upload-artifact@v4
        with:
          name: source-packed-chunk
          path: |
            original/verify/Agent8PackedChunk.v
            original/verify/Agent8PackedChunk.vo
            original/verify/chunk-data.txt
          if-no-files-found: error

      - name: Export multiple exact finite-fuel checkpoints
        if: inputs.target == 'enumerate62-packed-batch'
        working-directory: original/verify
        env:
          BATCH_RANGES: ${{ inputs.batch_ranges }}
        run: bash "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/export-source-batch.sh"
      - name: Self-test q0 checkpoint parser against final-20 proof
        if: inputs.target == 'enumerate62-packed-batch'
        run: node "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/check-q0-export.cjs" --self-test "$GITHUB_WORKSPACE/research"
      - name: Emit packed batch logs for exact roster extraction
        if: always() && inputs.target == 'enumerate62-packed-batch'
        working-directory: original/verify
        run: |
          set -euo pipefail
          for f in agent8-batch/*.log; do
            [ -e "$f" ] || continue
            printf '\n===== %s =====\n' "${f##*/}"
            cat "$f"
          done
      - name: Preserve batch proof artifacts including partial failures
        if: always() && inputs.target == 'enumerate62-packed-batch'
        uses: actions/upload-artifact@v4
        with:
          name: source-packed-batch
          path: original/verify/agent8-batch/
          if-no-files-found: error

      - name: Continue the exact 84-node source checkpoint
        if: inputs.target == 'enumerate62-resume-chunk2'
        working-directory: original/verify
        env:
          FUEL: ${{ inputs.fuel }}
        run: |
          set -euo pipefail
          [[ "$FUEL" =~ ^[0-9]+$ ]]
          (( FUEL >= 1 && FUEL <= 1000000 ))
          cat > Agent47ResumeChunk2.v <<COQ
          From BusyCoq Require Import Enumerate62 Agent8QueueCheckpoint Agent8PackedChunk2_32_32.
          From Coq Require Import List NArith Strings.String.
          Import ListNotations.
          Import TNF_Node.
          Open Scope string_scope.
          Definition resume_input := decode_queue packed_chunk_2_32_32.
          Definition resume_fuel : N := $FUEL%N.
          Time Definition resume_data := Eval vm_compute in
            encode_queue (SearchQueue_upds decider resume_input resume_fuel).
          Theorem resume_data_exact :
            SearchQueue_upds decider (SearchQueue_upds decider (q_i 2 32) 32%N)
              resume_fuel = decode_queue resume_data.
          Proof.
            rewrite packed_chunk_2_32_32_exact.
            apply source_checkpoint_decode.
            - unfold resume_input. rewrite <- packed_chunk_2_32_32_exact.
              apply checkpoint_updates_canonical, checkpoint_chunk_canonical.
            - vm_compute. reflexivity.
          Qed.
          Print Assumptions resume_data_exact.
          Set Printing Depth 100000.
          Set Printing Width 120.
          Print resume_data.
          COQ
          timeout 1800s coqc -Q . BusyCoq -native-compiler no Agent47ResumeChunk2.v 2>&1 | tee resume-data.txt
      - name: Preserve exact proof-bearing resumed queue
        if: inputs.target == 'enumerate62-resume-chunk2'
        uses: actions/upload-artifact@v4
        with:
          name: source-resumed-chunk2
          path: |
            original/verify/Agent47ResumeChunk2.v
            original/verify/Agent47ResumeChunk2.vo
            original/verify/resume-data.txt
          if-no-files-found: error

      - name: Continue exact final twenty-root checkpoint
        if: inputs.target == 'enumerate62-resume-last20'
        working-directory: original/verify
        env:
          FUEL: ${{ inputs.fuel }}
        run: |
          set -euo pipefail
          [[ "$FUEL" =~ ^[0-9]+$ ]]
          (( FUEL >= 1 && FUEL <= 5000000 ))
          cat > Agent5ResumeLast20.v <<COQ
          From BusyCoq Require Import Enumerate62 Agent8QueueCheckpoint Agent5PackedChunk12800_20_1000000.
          From Coq Require Import List NArith Strings.String.
          Import ListNotations.
          Import TNF_Node.
          Open Scope string_scope.
          Definition resume_input := decode_queue packed_chunk_12800_20_1000000.
          Definition resume_fuel : N := $FUEL%N.
          Time Definition resume_data := Eval vm_compute in
            encode_queue (SearchQueue_upds decider resume_input resume_fuel).
          Theorem resume_data_exact :
            SearchQueue_upds decider (SearchQueue_upds decider (q_i 12800 20) 1000000%N)
              resume_fuel = decode_queue resume_data.
          Proof.
            rewrite packed_chunk_12800_20_1000000_exact.
            apply source_checkpoint_decode.
            - unfold resume_input. rewrite <- packed_chunk_12800_20_1000000_exact.
              apply checkpoint_updates_canonical, checkpoint_chunk_canonical.
            - vm_compute. reflexivity.
          Qed.
          Print Assumptions resume_data_exact.
          Set Printing Depth 100000.
          Set Printing Width 120.
          Print resume_data.
          COQ
          timeout 1800s coqc -Q . BusyCoq -native-compiler no Agent5ResumeLast20.v 2>&1 | tee resume-last20-data.txt
      - name: Preserve exact resumed final twenty-root queue
        if: inputs.target == 'enumerate62-resume-last20'
        uses: actions/upload-artifact@v4
        with:
          name: source-resumed-last20
          path: |
            original/verify/Agent5ResumeLast20.v
            original/verify/Agent5ResumeLast20.vo
            original/verify/resume-last20-data.txt
          if-no-files-found: error

      - name: Probe the genuine one-hole source holdout
        if: inputs.target == 'enumerate62-held-probe'
        working-directory: original/verify
        run: |
          set -euo pipefail
          cat > Agent47HeldProbe.v <<'COQ'
          From BusyCoq Require Import CTL62 Individual62.
          From Coq Require Import NArith Strings.String.
          Open Scope string_scope.
          Definition held := TM_from_str "1RB1RD_1RC0LD_0LA0RE_1LA1LB_0RF---_0LA1RA".
          Time Eval vm_compute in (decide_nonhalt held (NG 0 1000 100000 4 0 0 0 false)).
          Time Eval vm_compute in (decide_nonhalt held (NG 0 1000 100000 5 0 0 0 false)).
          Time Eval vm_compute in (decide_nonhalt held (NG 0 1000 100000 6 0 0 0 false)).
          Time Eval vm_compute in (decide_nonhalt held (NG 0 1000 100000 8 0 0 0 false)).
          Time Eval vm_compute in (decide_nonhalt held (NG 0 1000 100000 10 0 0 0 false)).
          Time Eval vm_compute in (decide_nonhalt held (NG 0 1000 100000 4 4 4 0 true)).
          Time Eval vm_compute in (decide_nonhalt held (NG 1001 1000 100000 5 4 4 0 true)).
          Time Eval vm_compute in (decide_nonhalt held (RWL_mod 1001 1000 100000 5 320 2 2 8 0)).
          COQ
          timeout 1200s coqc -Q . BusyCoq -native-compiler no Agent47HeldProbe.v
