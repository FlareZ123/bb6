name: Shared original BusyCoq rooted theorem source verifier (manual)
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Original-source theorem family to compile'
        required: true
        type: choice
        default: sk1
        options:
          - sk1
          - somdc
          - both
          - enumerate62-decider-sound
          - enumerate62-q0-count
          - enumerate62-q0-partition
          - enumerate62-adaptive-checkpoint
          - enumerate62-adaptive-expansion
          - enumerate62-packed-chunk
          - enumerate62-packed-batch
          - enumerate62-weighted-source
          - enumerate62-zero-delay
          - enumerate62-source-roster
          - enumerate62-recovered-batch-witnesses
          - enumerate62-phase-consume
          - enumerate62-fast-resume
          - enumerate62-prefix-drain
          - enumerate62-phase-mitm
          - enumerate62-held-far-batch
          - enumerate62-held-farv3-pilot
          - enumerate62-held-checkpoint-membership
          - enumerate62-held-checkpoint-consumption
          - enumerate62-source-first-hole
          - enumerate62-q32-decider-tree
          - enumerate62-source-first-hole-side
          - enumerate62-s4-gap-side-search
          - enumerate62-q32-canonical-parent
          - enumerate62-resume-chunk2
          - enumerate62-resume-last20
          - enumerate62-last20-witness
          - enumerate62-held-probe
          - enumerate62-chunk-probe
          - enumerate62-chunk-probe-native
          - enumerate62-q0-verdicts
      offset:
        description: 'Source q0 chunk start (probe only)'
        required: false
        type: number
        default: 0
      size:
        description: 'Source q0 chunk size (probe only; 1..100)'
        required: false
        type: number
        default: 1
      fuel:
        description: 'Exact finite source-update fuel (packed-chunk only)'
        required: false
        type: number
        default: 1
      batch_ranges:
        description: 'Up to eight offset:size:fuel ranges, comma-separated'
        required: false
        type: string
        default: '34:16:64,4096:16:64,8192:16:64,12000:16:64'
permissions:
  contents: read
  actions: read
jobs:
  verify-original:
    runs-on: ubuntu-latest
    timeout-minutes: 43
    steps:
      - name: Install original-source proof compiler
        if: inputs.target != 'enumerate62-chunk-probe-native'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y coq
          coqc --version
          coqc -config
      - name: Checkout exact original source revision
        uses: actions/checkout@v4
        with:
          repository: ccz181078/busycoq
          ref: 33209bc7dc282b38c8cd6be507bfc551fea56108
          path: original
          persist-credentials: false
      - name: Checkout research repository proof artifact
        if: inputs.target == 'enumerate62-decider-sound' || inputs.target == 'enumerate62-q0-partition' || inputs.target == 'enumerate62-adaptive-checkpoint' || inputs.target == 'enumerate62-adaptive-expansion' || inputs.target == 'enumerate62-packed-chunk' || inputs.target == 'enumerate62-packed-batch' || inputs.target == 'enumerate62-resume-chunk2' || inputs.target == 'enumerate62-resume-last20' || inputs.target == 'enumerate62-last20-witness' || inputs.target == 'enumerate62-weighted-source' || inputs.target == 'enumerate62-source-roster' || inputs.target == 'enumerate62-source-first-hole' || inputs.target == 'enumerate62-source-first-hole-side' || inputs.target == 'enumerate62-q32-decider-tree' || inputs.target == 'enumerate62-s4-gap-side-search' || inputs.target == 'enumerate62-q32-canonical-parent' || inputs.target == 'enumerate62-zero-delay' || inputs.target == 'enumerate62-recovered-batch-witnesses' || inputs.target == 'enumerate62-held-farv3-pilot' || inputs.target == 'enumerate62-held-checkpoint-membership' || inputs.target == 'enumerate62-held-checkpoint-consumption' || inputs.target == 'enumerate62-held-far-batch' || inputs.target == 'enumerate62-phase-mitm' || inputs.target == 'enumerate62-phase-consume' || inputs.target == 'enumerate62-fast-resume' || inputs.target == 'enumerate62-prefix-drain'
        uses: actions/checkout@v4
        with:
          repository: FlareZ123/bb6
          ref: ${{ github.sha }}
          path: research
          persist-credentials: false
      - name: Add Agent 5 Enumerate62 decider soundness theorem
        if: inputs.target == 'enumerate62-decider-sound'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5Enumerate62DeciderSound.v" original/verify/
      - name: Add source q0 partition theorem
        if: inputs.target == 'enumerate62-q0-partition' || inputs.target == 'enumerate62-held-checkpoint-consumption' || inputs.target == 'enumerate62-held-far-batch' || inputs.target == 'enumerate62-phase-consume' || inputs.target == 'enumerate62-fast-resume' || inputs.target == 'enumerate62-prefix-drain'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32Q0Partition.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32SourceDrain.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32SourceCoverage.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32SourceBackwards.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32SourceEncoding.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8AdaptiveSource.v" original/verify/
      - name: Add independent adaptive checkpoint proof and pilot
        if: inputs.target == 'enumerate62-adaptive-checkpoint' || inputs.target == 'enumerate62-adaptive-expansion' || inputs.target == 'enumerate62-packed-chunk' || inputs.target == 'enumerate62-packed-batch' || inputs.target == 'enumerate62-resume-chunk2' || inputs.target == 'enumerate62-resume-last20' || inputs.target == 'enumerate62-last20-witness' || inputs.target == 'enumerate62-weighted-source' || inputs.target == 'enumerate62-source-roster' || inputs.target == 'enumerate62-source-first-hole' || inputs.target == 'enumerate62-source-first-hole-side' || inputs.target == 'enumerate62-q32-decider-tree' || inputs.target == 'enumerate62-s4-gap-side-search' || inputs.target == 'enumerate62-q32-canonical-parent' || inputs.target == 'enumerate62-recovered-batch-witnesses' || inputs.target == 'enumerate62-held-farv3-pilot' || inputs.target == 'enumerate62-held-checkpoint-membership' || inputs.target == 'enumerate62-held-checkpoint-consumption' || inputs.target == 'enumerate62-held-far-batch' || inputs.target == 'enumerate62-phase-consume' || inputs.target == 'enumerate62-fast-resume' || inputs.target == 'enumerate62-prefix-drain'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32SourceBackwards.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32SourceEncoding.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8AdaptiveSource.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8QueueCheckpoint.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8QueueCheckpointPilot.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8PackedRoot.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8QueueExpansionPilot.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8PackedChunk2_32_32.v" original/verify/
      - name: Add q32 canonical parent bridge
        if: inputs.target == 'enumerate62-q32-canonical-parent'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5Enumerate62DeciderSound.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32CanonicalParent.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32RemainderBranchProbe.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8SourceWF.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32FirstHoleCoverageProbe.v" original/verify/
      - name: Add exact final twenty-root checkpoint
        if: inputs.target == 'enumerate62-resume-last20' || inputs.target == 'enumerate62-last20-witness'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5PackedChunk12800_20_1000000.v" original/verify/
      - name: Add direct final-chunk replay witnesses
        if: inputs.target == 'enumerate62-last20-witness'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5Last20Witness.v" original/verify/
      - name: Add exact source zero-delay checker
        if: inputs.target == 'enumerate62-zero-delay' || inputs.target == 'enumerate62-weighted-source' || inputs.target == 'enumerate62-source-roster' || inputs.target == 'enumerate62-source-first-hole' || inputs.target == 'enumerate62-source-first-hole-side' || inputs.target == 'enumerate62-q32-decider-tree' || inputs.target == 'enumerate62-s4-gap-side-search' || inputs.target == 'enumerate62-recovered-batch-witnesses' || inputs.target == 'enumerate62-held-farv3-pilot' || inputs.target == 'enumerate62-held-checkpoint-membership' || inputs.target == 'enumerate62-held-checkpoint-consumption' || inputs.target == 'enumerate62-held-far-batch' || inputs.target == 'enumerate62-phase-consume' || inputs.target == 'enumerate62-fast-resume' || inputs.target == 'enumerate62-prefix-drain'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8ZeroDelay.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8ExactLeaf.v" original/verify/
      - name: Add direct weighted source proof
        if: inputs.target == 'enumerate62-weighted-source' || inputs.target == 'enumerate62-source-roster' || inputs.target == 'enumerate62-source-first-hole' || inputs.target == 'enumerate62-source-first-hole-side' || inputs.target == 'enumerate62-q32-decider-tree' || inputs.target == 'enumerate62-s4-gap-side-search' || inputs.target == 'enumerate62-recovered-batch-witnesses' || inputs.target == 'enumerate62-held-farv3-pilot' || inputs.target == 'enumerate62-held-checkpoint-membership' || inputs.target == 'enumerate62-held-checkpoint-consumption' || inputs.target == 'enumerate62-held-far-batch' || inputs.target == 'enumerate62-phase-consume' || inputs.target == 'enumerate62-fast-resume' || inputs.target == 'enumerate62-prefix-drain'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8SourceWF.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8WeightedSource.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8GlobalSource.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5Enumerate62DeciderSound.v" original/verify/
      - name: Generate exact q_i(2800,100) packed source checkpoint
        if: inputs.target == 'enumerate62-held-farv3-pilot' || inputs.target == 'enumerate62-held-checkpoint-membership' || inputs.target == 'enumerate62-held-checkpoint-consumption'
        working-directory: original/verify
        env:
          BATCH_RANGES: 2800:100:1000000
        run: |
          set -eu
          coq_makefile -Q . BusyCoq -native-compiler no -o Makefile.checkpoint *.v
          make -f Makefile.checkpoint -j 2 Agent8PackedRoot.vo
          bash "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/export-source-batch.sh"
          test -s Agent8Batch_2800_100_1000000.vo

      - name: Add independently scheduled source chunk coverage
        if: inputs.target == 'enumerate62-weighted-source' || inputs.target == 'enumerate62-held-checkpoint-consumption' || inputs.target == 'enumerate62-held-far-batch' || inputs.target == 'enumerate62-phase-consume' || inputs.target == 'enumerate62-fast-resume' || inputs.target == 'enumerate62-prefix-drain'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent32-source-queue/Agent32Q0Partition.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5ChunkCoverage.v" original/verify/
      - name: Add S4 gap side-search source
        if: inputs.target == 'enumerate62-s4-gap-side-search'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceWitness.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44S4GapSideSearch.v" original/verify/
      - name: Add direct source residual roster witnesses
        if: inputs.target == 'enumerate62-source-roster'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent50-weighted-tnf-pilot/SourceResidualRoster.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceWitness.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceSweep.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceChunk2.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceTree.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32CanonicalParent.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32RemainderBranchProbe.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8Chunk2FirstHole.v" original/verify/
      - name: Add source first-hole frontier proof
        if: inputs.target == 'enumerate62-source-first-hole' || inputs.target == 'enumerate62-source-first-hole-side' || inputs.target == 'enumerate62-q32-decider-tree'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent50-weighted-tnf-pilot/SourceResidualRoster.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceWitness.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceSweep.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceChunk2.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceTree.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32CanonicalParent.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44ChunkSideSearch.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent8-adaptive-source-plan/Agent8Chunk2FirstHole.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent50-weighted-tnf-pilot/Agent50Q32ParentTreeSearch.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32ParentTreeIntegration.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent44-source-roster/Agent44Q32DeciderTree.v" original/verify/
      - name: Recover and generate source-checkable batch witnesses
        if: inputs.target == 'enumerate62-recovered-batch-witnesses'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p recovered-batches
          for run in 45523811152 45525092609 45525101044 45525108618 45525114781 45525121016 45525126402; do
            gh run download "$run" --repo FlareZ123/bb6 --name source-packed-batch --dir "recovered-batches/$run"
          done
          cp "$GITHUB_WORKSPACE/research/im-results/agent50-weighted-tnf-pilot/SourceResidualRoster.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceWitness.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceTree.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5RecoveredHeld.v" original/verify/
          node "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/recover-batch-witnesses.cjs" recovered-batches original/verify/Agent5RecoveredBatchWitnesses.v
      - name: Add isolated FARv3 held-leaf cross-route proof
        if: inputs.target == 'enumerate62-held-farv3-pilot' || inputs.target == 'enumerate62-held-checkpoint-membership' || inputs.target == 'enumerate62-held-checkpoint-consumption'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent50-weighted-tnf-pilot/SourceResidualRoster.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5RecoveredHeld.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent13-cross-route-pilot/Agent13CrossRouteHeldLeaf.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceWitness.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent47-rooted-tnf/Agent47SourceTree.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent42-source-certificate-ingestion/Agent42HeldCheckpointMembership.v" original/verify/
           cp "$GITHUB_WORKSPACE/research/im-results/agent42-source-certificate-ingestion/Agent42Q2800BatchWitnesses.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent14-b0-1lc-consumer/Agent14HeldQueueConsumption.v" original/verify/

      - name: Add source FAR batch consumer
        if: inputs.target == 'enumerate62-held-far-batch'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent50-weighted-tnf-pilot/SourceResidualRoster.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5HeldFARBatch.v" original/verify/

      - name: Add sound fast source classifier
        if: inputs.target == 'enumerate62-fast-resume'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5FastSource.v" original/verify/

      - name: Add general source roster complement theorem
        if: inputs.target == 'enumerate62-phase-consume'
        run: |
          cp "$GITHUB_WORKSPACE/research/im-results/agent50-weighted-tnf-pilot/SourceResidualRoster.v" original/verify/
          cp "$GITHUB_WORKSPACE/research/im-results/agent5-weighted-tnf-queue/Agent5RosterComplement.v" original/verify/

      - name: Generate project dependencies with VM fallback
        if: inputs.target != 'enumerate62-chunk-probe-native'
        working-directory: original/verify
        run: |
          coq_makefile -Q . BusyCoq -native-compiler no -o Makefile.coq *.v
      - name: Compile requested original theorem source
        if: inputs.target != 'enumerate62-chunk-probe-native'
        working-directory: original/verify
        env:
          PROOF_TARGET: ${{ inputs.target }}
        run: |
          set -eu
          case "$PROOF_TARGET" in
            sk1) make -f Makefile.coq -j 2 Sk1Machines_v2.vo ;;
            somdc) make -f Makefile.coq -j 2 SOMDCv10.vo ;;
            both) make -f Makefile.coq -j 2 Sk1Machines_v2.vo SOMDCv10.vo ;;
            enumerate62-decider-sound) make -f Makefile.coq -j 2 Enumerate62.vo Agent5Enumerate62DeciderSound.vo ;;
            enumerate62-held-probe|enumerate62-q0-count|enumerate62-chunk-probe|enumerate62-chunk-probe-native|enumerate62-q0-verdicts) make -f Makefile.coq -j 2 Enumerate62.vo ;;
            enumerate62-q0-partition) make -f Makefile.coq -j 2 Agent32Q0Partition.vo Agent32SourceDrain.vo Agent32SourceCoverage.vo Agent32SourceEncoding.vo Agent8AdaptiveSource.vo ;;
            enumerate62-adaptive-checkpoint) make -f Makefile.coq -j 2 Agent8QueueCheckpointPilot.vo ;;
            enumerate62-adaptive-expansion) make -f Makefile.coq -j 2 Agent8QueueExpansionPilot.vo Agent8PackedChunk2_32_32.vo ;;
            enumerate62-packed-chunk|enumerate62-packed-batch) make -f Makefile.coq -j 2 Agent8PackedRoot.vo Agent8AdaptiveSource.vo ;;
            enumerate62-zero-delay) make -f Makefile.coq -j 2 Agent8ZeroDelay.vo ;;
            enumerate62-weighted-source) make -f Makefile.coq -j 2 Agent8GlobalSource.vo Agent8PackedChunk2_32_32.vo Agent8ExactLeaf.vo Agent5ChunkCoverage.vo ;;
            enumerate62-resume-chunk2) make -f Makefile.coq -j 2 Agent8PackedChunk2_32_32.vo ;;
            enumerate62-q32-canonical-parent) make -f Makefile.coq -j 2 Agent5Enumerate62DeciderSound.vo Agent8PackedChunk2_32_32.vo Agent44Q32CanonicalParent.vo Agent44Q32FirstHoleCoverageProbe.vo ;;
            enumerate62-last20-witness) make -f Makefile.coq -j 2 Agent5Last20Witness.vo ;;
            enumerate62-resume-last20) make -f Makefile.coq -j 2 Agent5PackedChunk12800_20_1000000.vo ;;
            enumerate62-recovered-batch-witnesses) make -f Makefile.coq -j 2 Agent5RecoveredBatchWitnesses.vo Agent5RecoveredHeld.vo ;;
            enumerate62-phase-consume) make -f Makefile.coq -j 2 Agent5RosterComplement.vo Agent8PackedRoot.vo ;;
            enumerate62-fast-resume) make -f Makefile.coq -j 2 Agent5FastSource.vo Agent8PackedRoot.vo ;;
            enumerate62-prefix-drain) make -f Makefile.coq -j 2 Agent8WeightedSource.vo Agent8PackedRoot.vo ;;
            enumerate62-phase-mitm) make -f Makefile.coq -j 2 CTL62.vo ;;
            enumerate62-held-far-batch) make -f Makefile.coq -j 2 Agent5HeldFARBatch.vo ;;
            enumerate62-held-farv3-pilot) make -f Makefile.coq -j 2 Agent13CrossRouteHeldLeaf.vo Agent42HeldCheckpointMembership.vo Agent42Q2800BatchWitnesses.vo ;;
            enumerate62-held-checkpoint-membership) make -f Makefile.coq -j 2 Agent42HeldCheckpointMembership.vo Agent42Q2800BatchWitnesses.vo ;;
            enumerate62-held-checkpoint-consumption) make -f Makefile.coq -j 2 Agent14HeldQueueConsumption.vo ;;
            enumerate62-source-roster) make -f Makefile.coq -j 2 Agent47SourceSweep.vo && make -f Makefile.coq -j 2 Agent47SourceChunk2.vo Agent47SourceTree.vo Agent44Q32RemainderBranchProbe.vo && make -f Makefile.coq -j 2 Agent8Chunk2FirstHole.vo ;;
            enumerate62-source-first-hole) make -f Makefile.coq -j 2 Agent47SourceSweep.vo && make -f Makefile.coq -j 2 Agent47SourceChunk2.vo Agent47SourceTree.vo Agent44Q32CanonicalParent.vo && make -f Makefile.coq -j 2 Agent8Chunk2FirstHole.vo Agent50Q32ParentTreeSearch.vo Agent44ChunkSideSearch.vo Agent44Q32ParentTreeIntegration.vo ;;
            enumerate62-source-first-hole-side) make -f Makefile.coq -j 2 Agent47SourceSweep.vo && make -f Makefile.coq -j 2 Agent47SourceChunk2.vo Agent47SourceTree.vo Agent44Q32CanonicalParent.vo && make -f Makefile.coq -j 2 Agent8Chunk2FirstHole.vo Agent44ChunkSideSearch.vo Agent44Chunk2FirstHoleSideSearch.vo ;;
            enumerate62-q32-decider-tree) make -f Makefile.coq -j 2 Agent47SourceSweep.vo && make -f Makefile.coq -j 2 Agent47SourceChunk2.vo Agent47SourceTree.vo Agent44Q32CanonicalParent.vo && make -f Makefile.coq -j 2 Agent44Q32DeciderTree.vo ;;
            enumerate62-s4-gap-side-search) make -f Makefile.coq -j 2 Agent47SourceWitness.vo Agent44S4GapSideSearch.vo ;;
          esac
      - name: Preserve recovered source witness proof
        if: inputs.target == 'enumerate62-recovered-batch-witnesses'
        uses: actions/upload-artifact@v4
        with:
          name: recovered-batch-witness-proof
          path: |
            original/verify/Agent5RecoveredBatchWitnesses.v
            original/verify/Agent5RecoveredBatchWitnesses.vo
            original/verify/Agent5RecoveredHeld.v
            original/verify/Agent5RecoveredHeld.vo
          if-no-files-found: error

      - name: Print final original theorem assumptions
        working-directory: original/verify
        env:
          PROOF_TARGET: ${{ inputs.target }}
        run: |
          set -eu
          if [ "$PROOF_TARGET" = sk1 ] || [ "$PROOF_TARGET" = both ]; then
